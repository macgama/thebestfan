<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(120% 50% at 50% -8%,rgba(60,130,232,.13),transparent 60%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
     padding:0 0 calc(var(--nav-h,62px) + 26px)}
main{width:100%;max-width:var(--colonne);padding:0 15px}
h1{font-family:var(--banner);font-weight:600;font-size:21px;letter-spacing:.16em;margin:18px 0 3px;
  text-align:center}

/* ------------------------------------------------------------ onglets

   Le rail commun de ui.css (`.tbf-onglets`), au violet des gens : les mêmes
   onglets que le classeur et le deck, qui s'enfoncent pareil à l'appui. Deux
   écrans du même jeu qui ne réagissent pas pareil se lisent comme deux
   applications.

   **Une déclaration orpheline a mangé la règle d'en dessous pendant des
   mois.** L'ancien habillage des onglets avait été retiré en laissant sa
   dernière ligne, un « box-shadow » sans sélecteur. Le navigateur l'a lue
   comme le début d'un sélecteur qui courait jusqu'à l'accolade suivante —
   celle de la pastille — et a jeté le tout : la pastille n'a jamais été
   peinte. Le compte s'affichait collé au mot, « DEMANDES1 ». Aucune erreur,
   aucun contrôle rouge : une règle absente ne se voit pas.

   La pastille de ce qui attend une réponse. Sans elle, une demande reçue
   dormirait derrière un onglet fermé jusqu'à ce qu'on pense à l'ouvrir. Elle
   est **dans la ligne** du mot, pas en surplomb du coin : l'onglet commun
   rogne ce qui déborde (il porte l'ellipse de son étiquette), et une pastille
   placée en absolu hors de lui serait allée se poser au coin de la page. */
.onglet .pastille{display:inline-block;vertical-align:1px;margin-left:6px;min-width:19px;height:19px;
  padding:0 5px;border-radius:999px;background:var(--flare);color:#fff;font-size:11px;line-height:19px;
  font-family:var(--ui);font-weight:700;letter-spacing:0;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ------------------------------------------------------------- les gens */

.gens{display:grid;gap:8px}
/* Plus de flou d'arrière-plan : `--panneau` est opaque, et le flou coûtait
   cher sur un téléphone modeste pour rendre le texte moins lisible au soleil. */
.gars{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--trait);background:var(--panneau)}
.pastille-nom{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-family:var(--banner);font-size:19px;line-height:1;color:#1A0C04;
  background:linear-gradient(150deg,var(--projo),#B8860B)}
/* Le Fanzzy du joueur remplace l'initiale dès qu'il en a un d'illustré : on
   se reconnaît à son personnage bien avant de lire un pseudo. */
.pastille-nom img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.gars .qui{flex:1;min-width:0}
.gars .qui b{display:block;font-family:var(--banner);font-size:14.5px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gars .qui .clubs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.gars .qui .clubs span{font-size:11px;padding:3px 8px;border-radius:999px;
  background:rgba(242,238,228,.08);box-shadow:inset 0 0 0 1px rgba(242,238,228,.1)}
.gars .qui small{display:block;font-size:11px;opacity:.88;margin-top:4px}
.gars .quoi{display:flex;gap:6px;flex:none}

/* Les boutons d'une demande d'ami : accepter, refuser. Ce sont des plaques,
   et il ne leur reste ici que leur format — petit, deux par ligne. Quarante-
   quatre pixels de haut et non trente-huit : c'est la pulpe d'un doigt, et
   « NON » à côté d'« ACCEPTER » est exactement l'endroit où l'on ne veut pas
   rater sa cible. L'état éteint est celui de la plaque, dans ui.css : il
   passait ici par une opacité de 0,45 qui rendait l'étiquette illisible. */
.bt{padding:9px 12px;min-height:44px;font-size:11.5px;letter-spacing:.06em;--epaisseur:3px}
.bt.plein{width:100%;margin-top:4px}

/* ------------------------------------------------------ l'invitation KOP */

/* Les deux blocs dépliés ci-dessous se posent sur la photo de tribune : leur
   teinte se pose sur le panneau commun, opaque, et non plus sur rien. */
.invit{border:1px solid rgba(245,195,59,.4);border-radius:12px;
  background:linear-gradient(rgba(245,195,59,.07),rgba(245,195,59,.07)),var(--panneau);
  padding:12px;display:grid;gap:9px}
.invit .t{font-family:var(--banner);font-size:14px;letter-spacing:.02em}
.invit .d{font-size:11.5px;opacity:.88;line-height:1.6}
.invit .quoi{display:flex;gap:7px}
.invit .quoi .bt{flex:1;text-align:center}

/* Le choix du KOP où emmener quelqu'un, déplié sous sa ligne. */
.kops{display:grid;gap:6px;padding:10px 12px 12px;border:1px solid var(--trait);border-top:0;
  border-radius:0 0 12px 12px;margin-top:-9px;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),var(--panneau)}
.kops .bt{width:100%;text-align:left}
.kops p{margin:0;font-size:11px;opacity:.88;line-height:1.6}

/* Le titre de rubrique est cousu (`.tbf-cousu`, dans ui.css) : il ne reste
   ici que sa place. */
h2{margin:22px 2px 9px}

/* ------------------------------------------------------- l’invitation

   Elle n’est pas dans la liste, elle est **au-dessus**. Les gens qu’on trouve
   ici sont ceux qui jouent déjà ; celui qu’on veut vraiment faire venir n’y
   sera jamais, et le proposer au milieu de la liste reviendrait à espérer
   qu’on descende jusqu’en bas pour y penser. */
/* Faire venir quelqu'un, c'est une affaire de gens : le bloc et sa plaque
   prennent le violet de l'écran. Ils étaient bleus, la couleur de ce qu'on
   possède. */
.convier{border:1px solid var(--trait);border-radius:var(--r);padding:14px 14px 13px;
  margin-bottom:14px;
  background:linear-gradient(rgba(130,87,218,.10),rgba(130,87,218,.10)),var(--panneau)}
.convier h3{font-family:var(--banner);font-size:12px;letter-spacing:.14em;margin:0 0 5px}
.convier p{margin:0 0 11px;font-size:11.5px;line-height:1.65;opacity:.88}
.convier button{width:100%;font-size:12px;letter-spacing:.1em}
.vide{border:1px dashed var(--trait);border-radius:var(--r);padding:20px 16px;text-align:center;
  font-size:12.5px;line-height:1.8;opacity:.9;background:var(--panneau)}
.vide a{color:var(--projo)}
.err{border:1px solid rgba(224,64,44,.4);border-radius:9px;
  background:linear-gradient(rgba(224,64,44,.12),rgba(224,64,44,.12)),var(--panneau);
  padding:10px 12px;font-size:12px;margin:10px 0;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h,62px) + 18px);transform:translateX(-50%);
  background:#171C23;border:1px solid var(--trait);border-radius:9px;padding:11px 16px;font-size:12.5px;
  z-index:60;display:none;max-width:86%;text-align:center;line-height:1.5}
.toast.on{display:block;animation:monte .3s}
@keyframes monte{from{opacity:0;transform:translate(-50%,10px)}}
/* Moins de mouvement, demandé au système ou dans le tiroir (le mode calme,
   contrat C4 — un sélecteur d'attribut n'entre pas dans une requête @media,
   d'où le double) : le message paraît à sa place, sans monter. */
@media (prefers-reduced-motion:reduce){ .toast.on{animation:none} }
html[data-calme~="animations"] .toast.on{animation:none}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
</head>
<body>
<main id="app">
  <p class="tbf-sous">Ceux qui poussent avec toi</p>

  <!-- Le rail au violet des gens, le ton de cet écran sur l'accueil. -->
  <div class="onglets tbf-onglets" data-ton="violet" id="onglets">
    <button class="onglet tbf-onglet on" data-vue="amis">AMIS</button>
    <button class="onglet tbf-onglet" data-vue="demandes">DEMANDES</button>
    <button class="onglet tbf-onglet" data-vue="trouver">TROUVER</button>
  </div>

  <div id="corps"><div class="vide">Chargement…</div></div>
</main>
<div class="toast" id="toast"></div>

<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fanzzy-fond.js"></script>
<!-- Classique et non différé : `convier()` lit `TBF_PARTAGE.possible` au
     premier rendu, qui peut arriver avant qu’un script différé s’exécute. -->
<script src="/partage.js"></script>
<script>
/* =======================================================================
   Les amis.

   Trois vues d'une même liste : ceux qu'on a, ceux qui attendent une
   réponse, ceux qu'on pourrait avoir. Elles viennent d'un seul appel — ces
   listes sont courtes, elles s'affichent ensemble, et une page qui les
   charge séparément montre ses onglets les uns après les autres.

   Rien n'est décidé ici. La page envoie un geste et **réaffiche ce que le
   serveur répond** : c'est lui qui sait si une amitié existe déjà, si un
   refus est trop récent, si quelqu'un suit le club du KOP. Une page qui
   déciderait de son côté finirait par annoncer l'inverse de la base.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* Un refus doit dire **sa cause**, pas « impossible ». Un joueur qui lit
   « erreur » ne peut rien faire ; un joueur qui lit « tu es déjà dans un KOP
   de ce club » sait exactement quoi. */
const MESSAGES = {
  'amis.error.soi_meme':      'On ne peut pas se demander soi-même en ami.',
  'amis.error.inconnu':       'Ce joueur n’existe plus.',
  'amis.error.deja_amis':     'Vous êtes déjà amis.',
  'amis.error.deja_demande':  'Ta demande est déjà partie. À lui de répondre.',
  'amis.error.pas_de_demande':'Cette demande n’existe plus.',
  'amis.error.pas_a_toi':     'C’est à l’autre de répondre, pas à toi.',
  'amis.error.pas_de_lien':   'Il n’y a rien à retirer.',
  'amis.error.pas_ton_kop':   'Tu n’es pas membre de ce KOP.',
  'amis.error.pas_son_club':  'Il ne suit pas le club de ce KOP : il ne pourrait pas entrer.',
  'amis.error.deja_membre':   'Il est déjà dans ce KOP.',
  'amis.error.pas_invite':    'Cette invitation n’existe plus.',
  'amis.error.invitation_inconnue': 'Ce lien d’invitation ne mène à personne.',
  'amis.error.invitation_tardive':  'Ce lien ne vaut que pour un compte tout neuf.',
  'amis.error.kop_indisponible':'Les KOP ne répondent pas pour l’instant.',
  'kop.error.pas_ton_club':   'Tu ne suis pas ce club. Suis-le d’abord depuis « Mes clubs ».',
  'kop.error.deja_membre':    'Tu es déjà dans un KOP de ce club. On n’en a qu’un par club.',
  'kop.error.inconnu':        'Ce KOP n’existe plus.',
};

/** Le refus « trop récent » porte un nombre de jours : il se compose à part. */
function dire(e) {
  if (e?.code === 'amis.error.refus_recent') {
    const j = e.jours ?? 0;
    return `Il a décliné. Tu pourras redemander dans ${j} jour${j > 1 ? 's' : ''}.`;
  }
  return MESSAGES[e?.code] ?? 'Le serveur a refusé ce geste.';
}

async function api(chemin, { method = 'GET', body } = {}) {
  const r = await fetch('/api/amis' + chemin, {
    method, credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  /* **Le message d'erreur existait, et n'était jamais atteint.**
   *
   * `charger` a une branche qui dit « Les amis n'ont pas pu être chargés » —
   * parfaitement écrite, et morte : une réponse qui n'est pas du JSON rendait
   * un objet vide au lieu de lever, `Object.assign(S, {})` ne changeait rien,
   * et la page affichait tranquillement **« Tu n'as encore personne »** à
   * quelqu'un qui a douze amis.
   *
   * Vu en ouvrant les écrans dans un navigateur, serveur muet : c'est le seul
   * moyen de trouver ça, puisqu'un serveur qui répond ne produit jamais ce cas.
   * Le corps du refus, lui, continue de passer tel quel — c'est lui qui porte
   * `error`, et les gestes d'invitation en dépendent. */
  const json = await r.json().catch(() => null);
  if (!json) {
    console.warn(`[amis] ${chemin} : ${r.status}, et ce n’est pas du JSON`);
    throw Object.assign(new Error('reponse illisible'), { code: 'app.error.illisible' });
  }
  if (json?.error) throw Object.assign(new Error(json.error), { code: json.error, ...json });
  return json;
}

const S = {
  vue: 'amis',
  amis: [], recues: [], envoyees: [], invitations: [],
  gens: [],            // les suggestions
  kops: [],            // mes KOP, pour pouvoir y inviter
  deplie: null,        // l'ami dont on choisit le KOP
};

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 3200);
}

/* --------------------------------------------------------- chargement */

async function charger() {
  try {
    const [tableau, suggestions, mesKops] = await Promise.all([
      api('/'),
      api('/suggestions'),
      // Les KOP ne sont pas indispensables : sans eux, on peut toujours
      // ajouter des amis. On ne fait donc pas tomber la page avec eux.
      fetch('/api/kop/miens', { credentials: 'same-origin' })
        .then((r) => r.json()).catch(() => ({ kops: [] })),
      /* Le manifeste des dessins, attendu avec le reste : sans lui, le premier
         rendu retomberait sur la carte de l’âge et perdrait la tenue et
         l’expression. Il ne lève jamais. */
      window.TBF_ETATS?.charger?.(),
    ]);
    Object.assign(S, tableau);
    S.gens = suggestions.gens ?? [];
    S.kops = mesKops.kops ?? [];
    rendre();
  } catch (e) {
    if (e.message === 'auth') return;
    /* La seconde ligne affichait le code brut. « Un code d'erreur sous les yeux
       d'un joueur est un aveu qu'on n'a pas prévu son cas » — c'est écrit dans
       la boutique, et ça vaut ici. Les codes qu'on sait nommer le sont ; les
       autres gardent leur forme brute, qui reste utile dans un signalement. */
    const dit = {
      'app.error.illisible': 'Le serveur n’a pas répondu correctement. Réessaie dans un instant.',
      'amis.error.server': 'Le serveur n’a pas pu traiter la demande.',
    }[e.code];
    $('corps').innerHTML = `<div class="err">Les amis n’ont pas pu être chargés.<br>
      <span style="opacity:.88">${esc(dit ?? e.code ?? e.message)}</span></div>`;
  }
}

/* ------------------------------------------------------------- rendu */

/**
 * L'avatar : le personnage de l'ami **tel qu'il l'a choisi** — son âge, sa
 * tenue, son expression — et l'initiale si on ne le connaît pas.
 *
 * Le serveur rend `avatar` complet, et on le dessine avec `dessinAvatar`,
 * comme l'accueil et « Mon Fanzzy ». Cette page se contentait de la carte
 * de l'âge (`g.fanzzy`) : un ami en tenue d'Halloween, dans la joie, y
 * apparaissait au repos, habillé comme tous les jours. `g.fanzzy` reste le
 * repli d'une réponse ancienne, servie par un serveur pas encore redémarré.
 */
function avatar(g) {
  const buste = (g.avatar && window.FZART?.dessinAvatar?.(g.avatar, 'buste'))
    || window.FZART?.adresse?.(g.fanzzy, 'buste');
  return buste
    ? `<span class="pastille-nom"><img src="${buste}" alt=""
         onerror="this.closest('.pastille-nom').textContent='${
           esc((g.pseudo ?? '?').charAt(0).toLowerCase())}'"></span>`
    : `<span class="pastille-nom">${esc((g.pseudo ?? '?').charAt(0).toLowerCase())}</span>`;
}

const ligne = (g, boutons, dessous = '') => `
  <div class="gars" data-id="${esc(g.id)}">
    ${avatar(g)}
    <span class="qui"><b>${esc(g.pseudo)}</b>${dessous}</span>
    <span class="quoi">${boutons}</span>
  </div>`;

/**
 * Le bloc d’invitation.
 *
 * Il ne paraît que si le navigateur sait faire quelque chose du lien — la
 * feuille de partage du téléphone, ou le presse-papiers. Un bouton qui ne fait
 * rien est pire que pas de bouton : voir `partage.js`, qui rend `possible`.
 */
function convier() {
  if (!window.TBF_PARTAGE?.possible) return '';
  return `<div class="convier">
    <h3>FAIRE VENIR QUELQU’UN</h3>
    <p>Tous ceux d’ici jouent déjà. Envoie ton lien à quelqu’un qui n’a pas
       encore de place : vous serez amis dès qu’il aura pris la sienne.</p>
    <button class="tbf-plaque" data-ton="violet" data-convier>ENVOYER MON LIEN</button>
  </div>`;
}

function vueAmis() {
  if (!S.amis.length) {
    return convier() + `<div class="vide">Tu n’as encore personne.<br>
      Ouvre <b>TROUVER</b> : les supporters de tes clubs t’y attendent.</div>`;
  }
  return `<div class="gens">${S.amis.map((g) => {
    const choix = S.deplie === g.id ? kopsPour(g) : '';
    return ligne(g,
      `${S.kops.length ? `<button class="bt tbf-plaque" data-kop="${esc(g.id)}">KOP</button>` : ''}
       <button class="bt tbf-plaque" data-ton="flare" data-retirer="${esc(g.id)}">RETIRER</button>`)
      + choix;
  }).join('')}</div>`;
}

/**
 * Les morceaux d'une ligne, sans séparateur orphelin.
 *
 * Un KOP dont le club manque s'écrivait « Les Fidèles · », une invitation
 * « Marie t’invite ·  · 3 membres » : un point qui annonce une donnée absente.
 * Ce qui manque se retire, avec son séparateur.
 */
const joindre = (...bouts) => bouts.filter(Boolean).map(esc).join(' · ');

/** Le choix du KOP où emmener quelqu'un. */
function kopsPour(g) {
  return `<div class="kops">
    <p>Dans quel KOP ?</p>
    ${S.kops.map((k) => `<button class="bt tbf-plaque" data-inviter="${esc(g.id)}"
        data-kopid="${esc(k.id)}">${joindre(k.nom, k.team_nom)}</button>`).join('')}
  </div>`;
}

function vueDemandes() {
  const rien = !S.recues.length && !S.envoyees.length && !S.invitations.length;
  if (rien) {
    return `<div class="vide">Rien n’attend de réponse.</div>`;
  }
  let html = '';
  if (S.invitations.length) {
    html += '<h2 class="tbf-cousu">ON T’INVITE DANS UN KOP</h2>' + S.invitations.map((i) => `
      <div class="invit">
        <div class="t">${esc(i.nom)}</div>
        <div class="d">${joindre(`${i.parQui ?? 'Quelqu’un'} t’invite`, i.club,
          `${i.membres} membre${i.membres > 1 ? 's' : ''}`, `${i.pot} au pot`)}</div>
        <div class="quoi">
          <button class="bt tbf-plaque" data-ton="vert" data-kopoui="${esc(i.kopId)}">REJOINDRE</button>
          <button class="bt tbf-plaque" data-ton="flare" data-kopnon="${esc(i.kopId)}">NON MERCI</button>
        </div>
      </div>`).join('');
  }
  if (S.recues.length) {
    html += '<h2 class="tbf-cousu">ON TE DEMANDE</h2><div class="gens">' + S.recues.map((g) => ligne(g,
      `<button class="bt tbf-plaque" data-ton="vert" data-oui="${esc(g.id)}">ACCEPTER</button>
       <button class="bt tbf-plaque" data-ton="flare" data-non="${esc(g.id)}">NON</button>`)).join('') + '</div>';
  }
  if (S.envoyees.length) {
    html += '<h2 class="tbf-cousu">TU AS DEMANDÉ</h2><div class="gens">' + S.envoyees.map((g) => ligne(g,
      `<button class="bt tbf-plaque" data-retirer="${esc(g.id)}">ANNULER</button>`,
      '<small>en attente de sa réponse</small>')).join('') + '</div>';
  }
  return html;
}

function vueTrouver() {
  if (!S.gens.length) {
    return convier() + `<div class="vide">Personne de neuf pour l’instant.<br>
      Suis d’autres clubs depuis <a href="/equipes">Mes clubs</a> :
      tu croiseras d’autres supporters.</div>`;
  }
  return convier() + `<div class="gens">${S.gens.map((g) => ligne(g,
    `<button class="bt tbf-plaque" data-ton="vert" data-demander="${esc(g.id)}">AJOUTER</button>`,
    `<span class="clubs">${(g.clubs ?? []).map((c) => `<span>${esc(c)}</span>`).join('')}</span>`,
  )).join('')}</div>`;
}

function rendre() {
  document.querySelectorAll('.onglet').forEach((b) =>
    b.classList.toggle('on', b.dataset.vue === S.vue));

  // La pastille compte **ce qui attend une réponse de toi**, pas ce que tu as
  // envoyé : une demande partie n'appelle aucun geste.
  const attend = S.recues.length + S.invitations.length;
  const onglet = document.querySelector('[data-vue="demandes"]');
  onglet.querySelector('.pastille')?.remove();
  if (attend) {
    onglet.insertAdjacentHTML('beforeend', `<span class="pastille">${attend}</span>`);
  }

  $('corps').innerHTML = S.vue === 'amis' ? vueAmis()
    : S.vue === 'demandes' ? vueDemandes() : vueTrouver();
}

/* ------------------------------------------------------------- gestes */

$('onglets').onclick = (e) => {
  const b = e.target.closest('[data-vue]');
  if (!b) return;
  S.vue = b.dataset.vue;
  S.deplie = null;
  rendre();
};

/**
 * Un seul écouteur pour toute la page.
 *
 * Les listes se refont entièrement à chaque geste — c'est ce qui garantit
 * qu'on affiche l'état du serveur et non celui qu'on espérait. Rebrancher
 * dix boutons après chaque rendu finirait par en oublier un.
 */
$('corps').onclick = async (e) => {
  const b = e.target.closest('button[data-oui],button[data-non],button[data-demander],'
    + 'button[data-retirer],button[data-kop],button[data-inviter],'
    + 'button[data-kopoui],button[data-kopnon],button[data-convier]');
  if (!b) return;
  const d = b.dataset;

  // Le dépliage du choix de KOP ne touche pas au serveur.
  if (d.kop) { S.deplie = S.deplie === d.kop ? null : d.kop; rendre(); return; }

  /* L’invitation ne change rien à la page : elle sort du jeu. Elle ne passe
     donc pas par le `charger()` commun, qui referait les trois listes pour
     rien — et surtout qui les referait **après** la feuille de partage, à la
     seconde où la page reprend la main.

     Le code est redemandé au serveur à chaque fois plutôt que gardé : il est
     créé au premier appel et ne change plus jamais, l’appel est donc une
     lecture de rien du tout, et le garder en mémoire ferait porter au premier
     partage la charge de tous les suivants. */
  if (d.convier !== undefined) {
    b.disabled = true;
    try {
      const { code } = await api('/invitation');
      const quoi = await window.TBF_PARTAGE.envoyer({
        titre: 'thebestfan',
        texte: 'Prends ta place dans la tribune. On y sera amis.',
        url: `/compte?ami=${encodeURIComponent(code)}`,
      });
      if (quoi === 'copie') toast('Lien copié. Colle-le où tu veux.');
      else if (quoi === null) toast('Impossible de partager ici.');
    } catch (err) {
      if (err.message !== 'auth') toast(dire(err));
    }
    b.disabled = false;
    return;
  }

  b.disabled = true;
  try {
    if (d.demander) { await api('/demande', { method:'POST', body:{ id: d.demander } });
      toast('Demande envoyée.'); }
    else if (d.oui) { await api('/reponse', { method:'POST', body:{ id: d.oui, ok:true } });
      toast('Vous êtes amis.'); }
    else if (d.non) { await api('/reponse', { method:'POST', body:{ id: d.non, ok:false } }); }
    else if (d.retirer) { await api(`/${encodeURIComponent(d.retirer)}`, { method:'DELETE' }); }
    else if (d.inviter) {
      await api('/kop/inviter', { method:'POST', body:{ id: d.inviter, kopId: d.kopid } });
      toast('Invitation envoyée.');
      S.deplie = null;
    } else if (d.kopoui) {
      await api('/kop/reponse', { method:'POST', body:{ kopId: d.kopoui, ok:true } });
      toast('Te voilà dans le KOP.');
    } else if (d.kopnon) {
      await api('/kop/reponse', { method:'POST', body:{ kopId: d.kopnon, ok:false } });
    }
    await charger();
  } catch (err) {
    if (err.message === 'auth') return;
    b.disabled = false;
    toast(dire(err));
    // On recharge quand même : le refus vient souvent de ce que la page
    // montrait un état périmé, et le garder à l'écran ferait réessayer.
    await charger();
  }
};

charger();
</script>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
