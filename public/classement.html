<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classements — thebestfan</title>
<!-- Permanent Marker dans la même ligne qu'Oswald : « TA PLACE EST LÀ », sur
     le classement vide, est l'un des six emplois du marqueur. Le fichier de
     la police ne se charge que si ce mot est à l'écran. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* **Quatre onglets, et le quatrième est long.** `ui.css` dimensionne la barre
   pour trois étiquettes de dix caractères ; « ENTRAÎNEMENT » en fait douze et
   se coupait en « ENTRAÎNE… ». Les quatre onglets prennent **la largeur de
   leur mot** (`flex:1 1 auto`) au lieu d'un quart chacun : « DUELS » cède la
   place que « ENTRAÎNEMENT » réclame, et les quatre tiennent entiers à onze
   pixels dès 360. */
.tabs .tbf-onglet{flex:1 1 auto;font-size:clamp(11px,3vw,12px);letter-spacing:.04em;
  padding-left:4px;padding-right:4px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}
/* Une colonne de lecture, même sur une tablette : à 768 px, une ligne de
   classement de sept cents pixels éloigne le nom de sa valeur au point de
   ne plus savoir laquelle va avec lequel. */
.colonne{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column}
/* Ce qui ne se lit qu'au lecteur d'écran : l'unité d'une valeur du podium.
   Rogné et non tronqué — l'audit ne relève que l'ellipse. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap}

/* « SAISON 1 — LA REPRISE », sous le sous-titre, quand la liste est celle
   de la saison et que le serveur la nomme. Oswald, à la craie pleine. */
.tbf-sous .saison{display:block;margin-top:5px;font-family:var(--banner);font-weight:600;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase}
.tbf-sous .saison:empty{display:none}

/* ------------------------------------------------------- le mur d'honneur

   Le podium d'abord (`.tbf-podium`, trois bâches or, craie et parpaing, les
   bustes posés dessus), puis les lignes calmes sur un panneau, puis **ma
   ligne épinglée** (`.tbf-epingle`) : dans le même conteneur que la liste,
   après elle, pour qu'elle reste collée au bas de l'écran tant que la liste
   défile, puis se pose à sa place. Aucun parent n'y rogne : un `overflow`
   ferait de lui le cadre du collage, et la ligne ne collerait plus à rien. */
/* Sans marge de côté : `#app` pose déjà la gouttière (ui.css). */
.mur{margin:12px 0 0;display:flex;flex-direction:column;gap:18px}
.tbf-podium{width:100%;margin-top:8px}
/* **Un pseudo ne se coupe jamais, il passe à la ligne.** La brique pose le
   nom du podium sur une ligne avec une ellipse : à 360 px, une marche laisse
   quelque quatre-vingt-dix pixels au nom, et un pseudo compte jusqu'à vingt
   lettres — « TAMBOUR_N… », « LAVOIXDUVI… ». Le nom passe donc à la ligne,
   centré et équilibré, et se brise d'abord là où il se lit en deux mots
   (voir `nomSecable`) ; en dernier recours, n'importe où plutôt que de
   cacher une lettre.

   **Et le podium reste un podium.** Une marche dont le nom prend deux lignes
   grandit de dix-sept pixels : le troisième, sur deux lignes, passait
   au-dessus du deuxième, sur une. Les trois noms prennent donc la hauteur
   du plus long (`--nom-lignes`, compté par `alignerPodium`), centrés dans
   cette hauteur, et les trois marches grandissent d'autant : 96, 80 et 68
   pixels de plus 16,8 par ligne de plus — la ligne de la brique, quatorze
   pixels à 1,2. Ces trois hauteurs recopient celles de `ui.css` en
   attendant que la brique porte elle-même ce crochet. */
.tbf-podium-nom{white-space:normal;overflow:visible;text-overflow:clip;text-align:center;
  overflow-wrap:anywhere;text-wrap:balance;
  display:flex;flex-direction:column;justify-content:center;min-height:calc(var(--nom-lignes,1) * 1.2em)}
/* **Le rang est le grand chiffre de la marche**, peint sur la bâche comme
   sur la face d'un vrai podium. La brique le posait en sticker rond au coin
   haut-gauche, juste à côté du sticker rond du niveau, collé au buste : « 2 »
   et « 19 », deux ronds chiffrés côte à côte, et l'on ne savait plus lequel
   donnait la place. Le niveau reste le petit rond du buste ; la place
   devient un chiffre en Oswald 26, à la lettre de la bâche — l'encre sur
   l'or et la craie (12 et 17:1), la craie sur le parpaing — avec une ombre
   dure décalée. Il ouvre la bâche, sous le buste, avant le nom. Sans
   ordinal : un « ᵉʳ » de treize pixels tombait sous 4,5:1 au soleil sur l'or
   et le parpaing, et le chiffre seul, en grand, sur une marche, se lit
   comme une place.

   Trois choses, recopiées ici en attendant que la brique de `ui.css` porte
   elle-même ce chiffre : la classe garde son nom (`.tbf-podium-rang`) mais
   perd la position absolue du sticker ; et les trois marches grandissent de
   la hauteur du chiffre (`--rang-h` : vingt-quatre pixels de ligne, moins
   trois de marges, plus les six de l'écart de la brique, plus deux pour
   que la marche du troisième, la plus courte, reste tenue par sa hauteur
   et non par son contenu), de sorte que leurs écarts — 96, 80, 68 —
   restent ceux d'un podium. */
.tbf-podium{--rang-h:30px}
.tbf-podium-rang{position:static;display:block;margin:-1px 0 -2px;
  font-family:var(--banner);font-weight:700;font-size:26px;line-height:24px;letter-spacing:0;
  font-variant-numeric:tabular-nums;white-space:nowrap;rotate:-3deg;
  text-shadow:2px 2px 0 rgba(7,9,12,.24)}
.tbf-podium>li[data-rang="3"] .tbf-podium-rang{text-shadow:2px 2px 0 var(--encre)}
.tbf-podium>li>.tbf-podium-bache{min-height:calc(68px + var(--rang-h) + (var(--nom-lignes,1) - 1) * 16.8px)}
.tbf-podium>li[data-rang="1"]>.tbf-podium-bache{min-height:calc(96px + var(--rang-h) + (var(--nom-lignes,1) - 1) * 16.8px)}
.tbf-podium>li[data-rang="2"]>.tbf-podium-bache{min-height:calc(80px + var(--rang-h) + (var(--nom-lignes,1) - 1) * 16.8px)}
/* Le blason d'une tribune dans le rond du buste : un écusson ne se recadre
   pas comme un visage. Provisoire, en attendant une variante du buste dans
   la feuille commune. */
.blason>img{object-fit:contain;padding:14%;border-radius:0}

/* La liste est un panneau calme : les rangs, les noms et la note du bas
   étaient posés directement sur la photo.

   **Une ligne calme tient sur cinquante-deux pixels** : le rang, le buste,
   le nom, puis une seule ligne dessous — l'insigne de la division et le
   club —, le delta et la valeur. Elle portait aussi le niveau, les matchs
   et les vécus, à onze pixels sur trois étages à 360 px, et le mot FERVEUR
   sous chaque valeur : soixante-quinze pixels par joueur, six joueurs par
   écran. Le mot de la valeur s'écrit une fois, en tête de colonne
   (`.tete-col`) ; le reste s'ouvre au toucher, dans une bulle (voir plus
   bas). */
.lignes{padding:2px 12px}
.tete-col{display:flex;justify-content:flex-end;padding:9px 2px 1px;font-family:var(--banner);
  font-weight:600;font-size:11px;line-height:1.2;letter-spacing:.12em}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:13px;min-height:52px;
  border-top:1px solid rgba(242,238,228,.07)}
.row:first-child,.tete-col+.row{border-top:0}
/* Une ligne qui a quelque chose de plus à dire est un bouton : toute la
   ligne, cinquante-deux pixels de haut, se touche. Elle n'a de bouton que le
   comportement — ni fond, ni cerne, ni police du système. */
button.row{width:100%;margin:0;background:none;border-left:0;border-right:0;border-bottom:0;
  border-radius:0;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer;
  -webkit-appearance:none;appearance:none}
button.row:active{background:rgba(242,238,228,.05)}
button.row:focus-visible{outline:2px solid var(--craie);outline-offset:-2px}
/* **Tout à la craie pleine.** Le rang, la précision, l'unité et la note
   étaient à 88 % : 3,9:1 au soleil sur le panneau, sous le seuil de 4,5. La
   hiérarchie tient au corps, à la graisse et à la police, plus à la pâleur. */
.row .rk{font-family:var(--banner);font-size:15px;min-width:24px;text-align:right;
  font-variant-numeric:tabular-nums}
.row>img{width:28px;height:28px;flex:none;object-fit:contain}
.row .n{flex:1;min-width:0}
/* Le nom d'une ligne ne se coupe pas non plus : à 360 px, la ligne lui
   laisse quelque cent soixante-dix pixels, et vingt lettres larges les
   dépassent — elles finissaient sous une ellipse. Il passe à la ligne, par
   les mêmes brèches que sur le podium. */
.row .n b{display:block;font-family:var(--banner);font-size:13.5px;line-height:1.2;letter-spacing:.02em;
  overflow-wrap:anywhere}
/* La précision tient en une ligne courte — l'insigne et le club — et passe
   à la ligne plutôt que de se couper, si un nom de club très long l'exige. */
.row .n small{display:block;margin-top:2px;font-size:11px;line-height:1.3}
.row .n small .tbf-division{margin:-1px 6px 0 1px}
/* Ma propre ligne, si elle est dans la liste : un filet de craie au bord,
   rien de plus — la ligne épinglée dit le reste. */
.row.moi{box-shadow:inset 3px 0 0 var(--craie);padding-left:9px}
/* La valeur sur laquelle on est classé, en seize pixels gras : sous le
   seuil du grand texte, donc **à la craie, quel que soit l'onglet**. L'or
   des ferveurs en est sorti par l'arbitrage du 2 octobre 2026 (3,7:1 au
   soleil) ; le bleu des tribunes et le rouge des duels tombaient de même
   (2,4 et 2,1 au soleil sur le panneau), et le rouge manquait 4,5:1 même à
   l'ombre. La graisse garde à ce chiffre l'accent que la couleur lui
   donnait ; le ton de l'écran est sur le rail des onglets. */
.row .v{font-family:var(--banner);font-size:16px;font-weight:700;color:var(--craie);
  text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------ la bulle d'une ligne

   Toucher une ligne ouvre sous elle une bulle de BD (`.tbf-bulle`, la
   brique) : la division en clair et son seuil (« FERVENT · dès 30 000 de
   ferveur »), puis le niveau, les matchs et les vécus — ce que la ligne ne
   porte plus. Une seule à la fois ; elle se referme d'un second toucher,
   d'un toucher ailleurs ou d'Échap.

   Deux écarts à la brique, locaux à cette page. **L'Oswald et non le
   marqueur** : la bulle porte des chiffres, et le marqueur n'en écrit jamais
   (amendement 6). **La queue en haut**, vers la ligne qu'on a touchée : la
   bulle est posée dans le fil de la liste, sous sa ligne, et pousse les
   suivantes plutôt que de les recouvrir — elle ne se coupe ni au bord du
   panneau ni sous le podium. La queue est la même, retournée. */
.bulle-ligne{display:block;width:fit-content;max-width:min(270px,calc(100% - 40px));
  margin:14px 0 12px 38px;padding:10px 14px;min-height:44px;border-radius:6px 16px 16px 16px;
  font-family:var(--banner);font-weight:500;font-size:13px;line-height:19px;letter-spacing:.03em}
.bulle-ligne b{font-weight:700;letter-spacing:.06em}
.bulle-ligne>span{display:block}
.bulle-ligne::before{top:-17px;bottom:auto;clip-path:polygon(0 0,100% 100%,0 100%)}
.bulle-ligne::after{top:-11px;bottom:auto;clip-path:polygon(0 0,100% 100%,0 100%)}

/* Ma ligne épinglée : la brique fait tout, et pose sa valeur au bout. */
.tbf-epingle .tbf-buste{flex:none}
/* **Ma division se lit en mots**, sous son insigne : l'écharpe à nœuds ne
   disait FERVENT ou ULTRA qu'au lecteur d'écran. Le nom en Oswald 12, au
   noir du kraft, empilé sous l'insigne pour que la ligne garde sa largeur à
   360 px — un « SYMPATHISANT » posé à côté la faisait déborder. */
.moi-div{display:inline-flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.moi-div>b{font-family:var(--banner);font-weight:600;font-size:12px;line-height:1;letter-spacing:.03em;
  white-space:nowrap}
/* Avec sa division, la ligne serre : les écarts tombent à huit pixels et,
   sur un téléphone, la valeur passe sur deux étages (le chiffre, son mot
   dessous). Un rang à quatre chiffres et « SYMPATHISANT » — le cas le plus
   courant en bas de liste — tiennent ainsi à 360 px ; au-delà, la valeur
   passe à la ligne plutôt que d'être coupée par la déchirure du ticket. */
.tbf-epingle[data-div]{flex-wrap:wrap;column-gap:8px;row-gap:2px}
@media (max-width:480px){
  .tbf-epingle[data-div] .tbf-epingle-val{flex-direction:column;align-items:flex-end;gap:2px}
}

/* ------------------------------------------------------ la place vide

   Personne au classement : une place vide en tribune, et un mot scotché au
   mur — « TA PLACE EST LÀ », au marqueur, sur un papier de craie que tient
   un ruban de scotch (le scotch tient, il ne sert jamais de fond). Puis la
   raison, sur un panneau, et le geste qui y mène, en bâche du Virage. */
.place{display:flex;flex-direction:column;gap:16px}
.place-photo{position:relative;margin:4px 0 0;height:210px;border-radius:8px;
  border:1px solid var(--trait);background:#0B0F14}
.place-photo>img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 70%;
  border-radius:8px}
.place-mot{--rot:-3deg;position:absolute;left:50%;bottom:-14px;translate:-50% 0;rotate:var(--rot);
  padding:9px 16px 7px;background:var(--craie);color:var(--encre);white-space:nowrap;
  box-shadow:0 0 0 1.5px var(--encre),3px 3px 0 1.5px rgba(7,9,12,.6)}
.place-mot .tbf-marqueur{font-size:22px;line-height:26px}
.place-dit{margin:14px 0 0;padding:14px 16px;font-size:13px;line-height:1.6;text-align:center}
/* Le « e » de « la 3e » : l'exposant du navigateur (« smaller ») tombait à
   10,8 px, sous les onze qu'on s'impose. */
.place-dit sup{font-size:11px;line-height:0}
.place .tbf-bloc{margin-top:2px}

.note{margin:6px 0 0;font-size:11px;text-align:center;padding:14px 8px;line-height:1.7}
.note:empty{display:none}
.vide{padding:28px 16px;font-size:13px;line-height:1.7;text-align:center}
.spin{width:24px;height:24px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(1turn)}}
/* Le tourniquet dit « ça charge » : sous moins de mouvement — le système, ou
   le mode calme du tiroir (contrat C4) — il ralentit sans s'arrêter, comme
   `.tbf-spin` de ui.css. */
@media (prefers-reduced-motion:reduce){ .spin{animation-duration:3s} }
html[data-calme~="animations"] .spin{animation-duration:3s}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app"><div class="colonne">
  <!-- Le nom de la saison n'a pas l'identifiant « saison » : c'est l'ancre
       de la page (/classement#saison), et le navigateur défilerait jusqu'à
       ce mot au lieu d'ouvrir la liste. -->
  <p class="tbf-sous">Qui fait le plus de bruit<span class="saison" id="saisonNom"></span></p>
  <!-- Le rail au vert du foot, le ton de cet écran sur l'accueil. -->
  <div class="tabs tbf-onglets" data-ton="vert">
    <button data-t="supporters" class="tbf-onglet on">SUPPORTERS</button>
    <button data-t="tribunes" class="tbf-onglet">TRIBUNES</button>
    <button data-t="duellistes" class="tbf-onglet">DUELS</button>
    <!-- L'entraînement ne rapporte rien, et il existe quand même : quelqu'un
         qui passe une soirée à s'entraîner n'en trouvait aucune trace ailleurs
         que dans son propre parcours. Le nom de l'onglet est celui du mot que
         le joueur cherche — il vient de jouer des « entraînements ». -->
    <button data-t="entrainements" class="tbf-onglet">ENTRAÎNEMENT</button>
  </div>
  <div class="mur" id="list"><div class="spin"></div></div>
  <p class="note" id="note"></p>
</div></main>
<!-- Les bustes des classés : `FZART.dessinAvatar` pour le visage que chacun
     a choisi, `fanzzy-etats.js` pour son âge et sa tenue exacts. -->
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"']/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;' }[c]));
/** Un nombre à la française, l'espace fine des milliers comprise. */
const nombre = (n) => Number(n).toLocaleString('fr');
/**
 * Un nom échappé, avec ses brèches : là où il se lit en deux mots sans
 * espace — après « _ » ou « . », entre « Voix » et « Du », entre lettres et
 * chiffres. « Tambour_Nord » passe à la ligne en « TAMBOUR_ / NORD » et non
 * en « TAMBOUR_NO / RD » ; la majuscule, que la capitale de l'écran efface,
 * reste lisible dans le texte. Les espaces et les tirets brisent déjà seuls.
 * Sans assertion arrière (« (?<= ») : Safari 15 ne la lit pas, et une
 * expression qu'il ne lit pas arrête tout le script de la page.
 */
const BRECHES = /([_.])(?=[^_.])|(\p{Ll})(?=\p{Lu})|(\p{L})(?=\p{N})|(\p{N})(?=\p{L})/gu;
const nomSecable = (s) => String(s ?? '').replace(BRECHES, (m) => `${m}\u0000`)
  .split('\u0000').map(esc).join('<wbr>');
let onglet = 'supporters';

const NOTES = {
  /* **Les deux sources, dites dans l'ordre où on les rencontre** : un joueur
     qui ne faisait que des duels lisait sinon une explication qui ne
     décrivait pas le classement qu'il avait sous les yeux. */
  supporters: 'La ferveur se gagne en chantant dans le Grand Virage et en gagnant des duels classés. Un joueur qui n’a jamais ouvert un booster peut être premier.',
  tribunes: 'Les clubs sont classés sur la ferveur moyenne par supporter, pas sur le total. Trente fidèles qui chantent juste passent devant mille abonnés qui regardent.',
  duellistes: 'Classé sur la cote, pas sur le nombre de victoires : battre plus fort rapporte plus, perdre contre plus faible coûte plus. Tout le monde part de 1000. Duels contre de vrais adversaires uniquement — les entraînements ne comptent pas.',
  /* **Ce tableau classe sur les parties jouées, et il faut le dire** : on
     s'entraîne aussi contre des machines, et classer sur les victoires ferait
     un tableau de qui bat le plus de bots. */
  entrainements: 'Qui s’entraîne le plus, contre des joueurs comme contre des bots. L’entraînement ne rapporte aucune ferveur et ne compte dans aucun autre classement : ce tableau dit qui joue, pas qui est le meilleur.',
};

/**
 * Une donnée facultative : `null` pour toute réponse qui n'en est pas une.
 * Ma place n'existe que pour un joueur connecté (un visiteur reçoit un
 * refus, et c'est normal) ; une route absente pendant un déploiement vaut
 * un bloc absent (R2) — ni erreur, ni ligne en console.
 */
async function lire(url) {
  try {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && typeof j === 'object' && !j.error ? j : null;
  } catch { return null; }
}

/* « Qui es-tu ? », par la promesse que `nav.js` pose sur chaque page, sous
   la même forme exacte : la question n'est jamais posée deux fois. */
const quiP = (window.TBF_MOI ??= fetch('/api/auth/me', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => j?.user ?? null)
  .catch(() => null));
const placeP = lire('/api/rank/moi');
let qui = null;       // le joueur connecté, ou null
let place = null;     // ma place, toutes échelles (`/api/rank/moi`)
let liste = null;     // la liste affichée : { onglet, periode, classement, plancher }
let jeton = 0;        // la dernière demande : une réponse plus ancienne ne réécrit rien
let premierRendu = true;
let hudRecu = null;   // la dernière annonce `tbf:hud` de la barre (voir `monBuste`)
let busteVu = null;   // le buste posé sur ma ligne, pour ne le reposer que s'il change

/* **La barre annonce ce qu'elle retient du joueur** (`tbf:hud`, nav.js), et
   c'est le seul chemin par lequel cette page apprend mon visage quand le
   stockage de l'onglet est fermé — ou quand la barre lit le portefeuille
   après que ma ligne est posée. Écouté dès le départ : la barre est un
   script différé, elle parle après celui-ci. Ma ligne se repose seulement
   si son buste change. */
window.addEventListener('tbf:hud', (e) => {
  hudRecu = e.detail && typeof e.detail === 'object' ? e.detail : null;
  if (place && liste && monBuste() !== busteVu) maPlace();
});

/* Le dessin de chacun. Le manifeste des états donne l'âge et la tenue
   exacts ; s'il tarde, le buste de l'âge suffit — on ne l'attend pas plus
   d'une seconde. */
const dessinsP = Promise.race([
  window.TBF_ETATS?.charger?.() ?? Promise.resolve(),
  new Promise((r) => setTimeout(r, 1000)),
]);

/* ----------------------------------------------------------- les bustes

   Le visage d'un autre joueur : le buste de son Fanzzy (`avatar`, servi
   par le classement), ou l'initiale de son pseudo quand il n'en a pas, ou
   que le dessin ne répond pas. Jamais un « NIV. 1 » par défaut : le niveau
   n'est posé que s'il est servi. */
const initiale = (pseudo) => esc([...String(pseudo ?? '?').trim()][0] ?? '?');
function buste(avatar, pseudo, { taille = null, niveau = null } = {}) {
  const src = avatar?.id ? window.FZART?.dessinAvatar?.(avatar, 'buste') : null;
  const style = taille ? ` style="--taille:${taille}px"` : '';
  const niv = Number(niveau) >= 1
    ? `<b class="tbf-sticker tbf-sticker--rond tbf-buste-niv">${Number(niveau)}</b>` : '';
  return `<span class="tbf-buste"${style} aria-hidden="true" data-initiale="${initiale(pseudo)}">${
    src ? `<img src="${esc(src)}" alt="">` : initiale(pseudo)}${niv}</span>`;
}
/* Un dessin qui ne répond pas : l'initiale à sa place, jamais l'image
   cassée du navigateur. Le niveau, s'il y en a un, reste. */
$('list').addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const b = img.closest('.tbf-buste');
  if (b) {
    b.classList.remove('blason');
    img.replaceWith(document.createTextNode(b.dataset.initiale || '?'));
  } else if (img.parentElement?.classList.contains('row')) {
    // Le blason d'une ligne de tribune : le nom suffit, sans image cassée.
    img.remove();
  }
}, true);
/* Les bâches du podium se collent une fois ; la classe se retire ensuite,
   sans quoi elle empêcherait toute autre animation de partir. */
$('list').addEventListener('animationend', (e) => e.target.classList?.remove('tbf-colle'));

/* --------------------------------------------- d'une visite à l'autre

   **▲ 3 depuis ta dernière visite**, pour chaque ligne. Le serveur ne sert
   l'évolution que de ma propre ligne (le contrat, § 4.2) ; celle des autres
   vit ici, dans ce navigateur. Deux photos, comme celles du serveur : la
   dernière vue, et celle de la visite d'avant, qui sert de référence. Une
   visite à moins de trois heures de la précédente fait partie de la même
   séance et garde la même référence — sinon la flèche retomberait à zéro
   dès qu'on recharge la page. */
const CLE_VUS = 'tbf-classement-vus';
const SEANCE = 3 * 3600 * 1000;
function photographier(cleListe, cles) {
  let tout = {};
  try { tout = JSON.parse(localStorage.getItem(CLE_VUS) || '{}') || {}; } catch { tout = {}; }
  const m = tout[cleListe] ?? {};
  const t = Date.now();
  let ref = m.ref ?? null;
  if (m.vu && Number.isFinite(m.vu.t) && t - m.vu.t >= SEANCE) ref = m.vu;
  const rangs = {};
  cles.forEach((c, i) => { if (c && !(c in rangs)) rangs[c] = i + 1; });
  tout[cleListe] = { ...(ref ? { ref } : {}), vu: { t, rangs } };
  try { localStorage.setItem(CLE_VUS, JSON.stringify(tout)); } catch { /* sans mémoire : sans flèches */ }
  return (cle, rang) => {
    const avant = ref?.rangs?.[cle];
    return Number.isInteger(avant) ? avant - rang : 0;
  };
}

/** Le delta : positif, on a monté. Zéro ou inconnu : rien. */
function delta(n, depuis) {
  const v = Number(n);
  if (!Number.isFinite(v) || v === 0) return '';
  const k = Math.abs(v);
  return `<span class="tbf-delta" data-sens="${v > 0 ? 'monte' : 'descend'}" aria-label="${
    v > 0 ? 'monté' : 'descendu'} de ${k} place${k > 1 ? 's' : ''} ${depuis}">${k}</span>`;
}

/* ---------------------------------------------------------- les divisions

   L'insigne d'écharpe à nœuds, sur les lignes de la liste SAISON et sur ma
   ligne (le contrat, § 5.2). Les lignes ne portent que son rang ; son nom
   vient de ma place, que le serveur sert avec les noms des divisions. */
function nomDivision(n) {
  const s = place?.saison;
  const d = [...(s?.paliers ?? []), s?.division, s?.prochaine].find((x) => Number(x?.n) === n);
  return d?.nom ?? null;
}
/** Le seuil d'une division, tel que ma place le sert (paliers, prochaine), ou null. */
function seuilDivision(n) {
  const s = place?.saison;
  const d = [...(s?.paliers ?? []), s?.prochaine].find((x) => Number(x?.n) === n);
  const v = Number(d?.seuil);
  return Number.isFinite(v) && v > 0 ? v : null;
}
function insigne(n) {
  const k = Number(n);
  if (!Number.isInteger(k) || k < 1 || k > 5) return '';
  const nom = nomDivision(k);
  return `<span class="tbf-division" data-n="${k}" role="img" aria-label="${
    nom ? `Division ${esc(nom)}` : `Division ${k} sur 5`}"></span>`;
}

/* ------------------------------------------------------------- la liste */

/** Un compte, avec son mot accordé — ou rien s'il est nul : « 0 vécus »
    s'écrivait sur toutes les lignes d'une base neuve. */
const compte = (n, un, plusieurs) => {
  const k = Number(n);
  return Number.isFinite(k) && k > 0 ? `${nombre(k)}\u00a0${k > 1 ? plusieurs : un}` : null;
};

/**
 * Ce qu'une ligne dit, par onglet : le nom, la précision (`sous`, une ligne
 * courte), la valeur et son mot — et ce qui ne s'ouvre qu'au toucher
 * (`plus`, dans la bulle de la ligne, avec le niveau et la division).
 */
const LECTURES = {
  supporters: (x) => ({ cle: x.public_id ?? `p:${x.pseudo}`, joueur: true, nom: x.pseudo,
    sous: [x.club], plus: [compte(x.matchs, 'match', 'matchs'), compte(x.vecus, 'vécu', 'vécus')],
    val: nombre(x.ferveur), unite: 'FERVEUR', mot: 'de ferveur' }),
  /* Le nombre de supporters reste sur la ligne d'une tribune : c'est ce qui
     explique sa moyenne, et la note du bas le dit. */
  tribunes: (x) => ({ cle: `t:${x.id}`, nom: x.name, logo: x.logo,
    sous: [x.country, compte(x.supporters, 'supporter', 'supporters')], plus: [],
    val: nombre(x.moyenne), unite: 'PAR TÊTE', mot: 'par tête' }),
  /* Le grand chiffre est **la cote**, sur laquelle on est classé ; les
     victoires et le taux s'ouvrent au toucher. Les écrire sous le nom
     faisait lire un classement de victoires rangé dans un ordre qui n'est
     pas le leur. */
  duellistes: (x) => ({ cle: x.public_id ?? `p:${x.pseudo}`, joueur: true, nom: x.pseudo,
    sous: [x.club], plus: [compte(x.joues, 'duel', 'duels'), compte(x.gagnes, 'gagné', 'gagnés'),
      Number(x.joues) > 0 && Number.isFinite(Number(x.taux)) ? `${Number(x.taux)}\u00a0% de victoires` : null],
    val: nombre(x.cote ?? 1000), unite: 'COTE', mot: 'de cote' }),
  entrainements: (x) => ({ cle: x.public_id ?? `p:${x.pseudo}`, joueur: true, nom: x.pseudo,
    sous: [x.club], plus: [compte(x.gagnes, 'gagné', 'gagnés')],
    val: nombre(x.joues), unite: 'PARTIES', mot: 'parties' }),
};

/* Le podium : trois bâches, le visage de chacun posé dessus, et le rang
   peint en grand sur sa marche (voir la feuille de cette page). Le niveau,
   s'il est servi, reste le petit sticker rond du buste. */
function marche(x, i, L) {
  const colle = premierRendu ? ` class="tbf-colle" style="--d:${i * 120}ms"` : '';
  const visage = L.logo
    ? `<span class="tbf-buste blason" aria-hidden="true" data-initiale="${initiale(L.nom)}"><img
        src="${esc(L.logo)}" alt=""></span>`
    : buste(x.avatar, L.nom, { niveau: x.niveau });
  return `<li data-rang="${i + 1}"${colle}>${visage}
    <div class="tbf-podium-bache">
      <b class="tbf-podium-rang">${i + 1}</b>
      <b class="tbf-podium-nom"><span>${nomSecable(L.nom)}</span></b>
      <span class="tbf-podium-val">${L.val}<span class="vh"> ${L.mot}</span></span>
    </div></li>`;
}

/* Les trois noms du podium sur la hauteur du plus long (voir la feuille de
   cette page) : le nombre de lignes du plus long, compté sur le texte
   lui-même — le `span` garde sa hauteur propre quand son nom s'étire, ce
   qui ne relance donc pas l'observateur. Il recompte quand la police
   arrive ou que l'écran tourne. `offsetHeight` et non le rectangle : la
   bâche est penchée, et son rectangle est plus haut que sa ligne. */
let podiumVu = null;
function alignerPodium() {
  podiumVu?.disconnect();
  podiumVu = null;
  const ol = $('list').querySelector('.tbf-podium');
  const noms = ol ? [...ol.querySelectorAll('.tbf-podium-nom>span')] : [];
  if (!noms.length || typeof ResizeObserver !== 'function') return;
  const compter = () => {
    const ligne = parseFloat(getComputedStyle(noms[0]).lineHeight) || 16.8;
    const n = Math.max(1, ...noms.map((s) => Math.round(s.offsetHeight / ligne)));
    if (ol.style.getPropertyValue('--nom-lignes') !== String(n)) ol.style.setProperty('--nom-lignes', String(n));
  };
  podiumVu = new ResizeObserver(compter);
  noms.forEach((s) => podiumVu.observe(s));
}

/* La division d'une ligne, seulement sur la liste de la saison (le contrat,
   § 5.2 : les autres périodes ne la portent pas). */
const divisionDe = (x) => {
  const n = Number(x?.division);
  return liste?.periode === 'saison' && Number.isInteger(n) && n >= 1 && n <= 5 ? n : null;
};

/**
 * Ce que la bulle d'une ligne dit, en deux lignes au plus : la division en
 * clair et son seuil, puis le niveau et ce que la ligne ne porte plus. Le
 * nom et le seuil d'une division viennent de ma place ; un visiteur n'en a
 * pas, et lit « DIVISION 3 SUR 5 ». Rien de nul, rien de deviné.
 */
function bulleDe(x, L) {
  const morceaux = [];
  const n = divisionDe(x);
  if (n) {
    const seuil = seuilDivision(n);
    const des = seuil === 1 ? ' · dès la première ferveur'
      : seuil > 1 ? ` · dès ${nombre(seuil)} de ferveur` : '';
    morceaux.push(`<b>${esc(nomDivision(n) ?? `DIVISION ${n} SUR 5`)}</b>${des}`);
  }
  const reste = [Number(x.niveau) >= 1 ? `Niveau ${Number(x.niveau)}` : null, ...(L.plus ?? [])]
    .filter(Boolean);
  if (reste.length) morceaux.push(esc(reste.join(' · ')));
  return morceaux;
}

/* Une ligne calme : rang, visage, nom, précision, delta, valeur. La ligne
   du dessous se passe de séparateur orphelin : ce qui manque se retire avec
   le sien. Le mot de la valeur est en tête de colonne, et dit ici au seul
   lecteur d'écran. Une ligne qui a une bulle à ouvrir est un bouton. */
function ligne(x, i, L, ecart) {
  const rang = i + 1;
  const visage = L.logo ? `<img src="${esc(L.logo)}" alt="">` : buste(x.avatar, L.nom, { taille: 28 });
  const sous = L.sous.filter(Boolean).map(esc).join(' · ');
  const n = divisionDe(x);
  const division = n ? insigne(n) : '';
  const moi = qui && x.public_id && x.public_id === qui.id ? ' moi' : '';
  const pid = x.public_id ? ` data-pid="${esc(x.public_id)}"` : '';
  const corps = `<span class="rk">${rang}</span>${visage}
    <span class="n"><b>${nomSecable(L.nom)}</b>${division || sous ? `<small>${division}${sous}</small>` : ''}</span>
    ${delta(ecart(L.cle, rang), 'depuis ta dernière visite')}
    <span class="v">${L.val}<span class="vh"> ${L.mot}</span></span>`;
  return L.joueur && bulleDe(x, L).length
    ? `<button type="button" class="row${moi}"${pid} data-i="${i}" aria-expanded="false">${corps}</button>`
    : `<div class="row${moi}"${pid}>${corps}</div>`;
}

/* ------------------------------------------------------------- la bulle */

/** Referme la bulle ouverte ; rend la ligne qui la portait, ou null. */
function fermerBulle({ rendre = false } = {}) {
  const b = $('bulleLigne');
  const r = $('list').querySelector('button.row[aria-expanded="true"]');
  b?.remove();
  if (r) {
    r.setAttribute('aria-expanded', 'false');
    r.removeAttribute('aria-controls');
    if (rendre) r.focus();
  }
  return r;
}

/** Ouvre la bulle d'une ligne sous elle, ou la referme si c'est déjà la sienne. */
function basculerBulle(r) {
  const ouverte = r.getAttribute('aria-expanded') === 'true';
  fermerBulle();
  if (ouverte || !liste) return;
  const x = liste.classement?.[Number(r.dataset.i)];
  const morceaux = x ? bulleDe(x, LECTURES[liste.onglet](x)) : [];
  if (!morceaux.length) return;
  const b = document.createElement('p');
  b.className = 'tbf-bulle bulle-ligne';
  b.id = 'bulleLigne';
  b.innerHTML = morceaux.map((m) => `<span>${m}</span>`).join('');
  r.after(b);
  r.setAttribute('aria-expanded', 'true');
  r.setAttribute('aria-controls', 'bulleLigne');
}

$('list').addEventListener('click', (e) => {
  const r = e.target.closest('button.row');
  if (r) basculerBulle(r);
});
document.addEventListener('click', (e) => {
  if (!e.target.closest?.('button.row, #bulleLigne')) fermerBulle();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('bulleLigne')) fermerBulle({ rendre: true });
});

/* Personne au classement : la place vide. **Un tableau vide a deux causes**,
   et elles n'appellent pas le même geste : personne n'a encore joué, ou des
   gens ont joué sans atteindre le plancher d'entrée — et « sois le premier »
   nierait alors des parties qui ont eu lieu. Le serveur envoie son
   plancher, et l'écran dit la condition au lieu de la deviner. */
function placeVide(d) {
  const n = Number(d.plancher) || 0;
  const dit = n
    ? `Personne n’a encore ${n} parties à son compteur. Ce tableau n’admet qu’à partir de la
       <b>${n}<sup>e</sup></b> — sans quoi tout le monde y serait dès le premier soir.`
    : 'Ce classement est encore vide. Sois le premier à y entrer.';
  const [ou, geste] = onglet === 'duellistes' || onglet === 'entrainements'
    ? ['/duel-nvn', 'JOUER UN DUEL'] : ['/virage', 'ENTRER DANS LE VIRAGE'];
  return `<div class="place">
    <div class="place-photo"><img src="/img/place-vide.webp" alt="">
      <span class="place-mot"><span class="tbf-scotch" aria-hidden="true"></span><span
        class="tbf-marqueur">TA PLACE EST LÀ</span></span></div>
    <p class="place-dit pan">${dit}</p>
    <a class="tbf-plaque tbf-bloc" data-ton="flare" href="${ou}">${geste}</a>
  </div>`;
}

async function charger() {
  const mon = ++jeton;
  $('list').innerHTML = '<div class="spin"></div>';
  $('note').textContent = '';
  $('saisonNom').textContent = '';
  /* **La liste SUPPORTERS est celle de la saison**, et ma ligne épinglée la
     suit (le contrat, § 5.3) : sous SAISON, ma place de la saison ; sans
     saison servie dans ma place — pas de saison lancée, divisions éteintes,
     ancien serveur —, la liste de toujours et ma place de toujours. Une place
     calculée sur une autre fenêtre que la liste serait fausse. Un visiteur
     n'a pas de place : la liste par défaut, la saison. **L'ancre `#saison`
     demande la saison quoi qu'il arrive** — c'est ce que promet le lien qui
     y mène —, et ma ligne n'y montre alors aucun rang plutôt que celui de
     toujours (voir `maPlace`). */
  let periode = null;
  if (onglet === 'supporters') {
    const m = await placeP;
    periode = m && !m.saison && motAncre() !== 'saison' ? 'toujours' : 'saison';
  }
  let d;
  try {
    const r = await fetch(`/api/rank/${onglet}${periode ? `?periode=${periode}` : ''}`,
      { credentials: 'same-origin' });
    d = await r.json();
    if (!r.ok || !d || d.error) throw new Error(d?.error ?? `http ${r.status}`);
  } catch {
    if (mon === jeton) $('list').innerHTML = '<div class="pan vide">Le classement n’a pas pu être lu.</div>';
    return;
  }
  await dessinsP;
  if (mon !== jeton) return;
  liste = { onglet, periode, ...d };
  rendreListe();
}

/* « SAISON 1 — LA REPRISE », sous le sous-titre : la liste SUPPORTERS de la
   saison, quand ma place la nomme. Vide sinon. */
function poserSaison() {
  const s = place?.saison;
  let t = '';
  if (liste?.onglet === 'supporters' && liste.periode === 'saison' && s?.numero) {
    /* Les jours qui restent, seulement si le serveur les compte : aucune
       page ne calcule une fin de saison avec l'horloge du téléphone (R3).
       Ma place les sert (le contrat, § 14.4), comptés comme au dex au même
       instant : cette ligne n'a pas à lire le dex, trop lourd pour elle.
       Sans date saisie, ni `fin` ni `joursRestants` : le nom seul. */
    const j = Number(s.joursRestants);
    const jours = s.finie || j === 0 ? ' · TERMINÉE'
      : j === 1 ? ' · DERNIER JOUR' : j > 1 ? ` · ${j} JOURS` : '';
    t = `SAISON ${s.numero}${s.nom ? ` — ${s.nom}` : ''}${jours}`;
  }
  $('saisonNom').textContent = t;
}

/* La note du bas, et une phrase de plus quand la liste porte des
   divisions : l'écharpe à nœuds n'était nommée nulle part à l'écran. */
function noteDe() {
  const c = liste?.classement ?? [];
  if (!c.length) return '';
  const divisions = liste.periode === 'saison'
    && (c.some((x) => divisionDe(x)) || Number(place?.saison?.division?.n) > 0);
  return NOTES[liste.onglet] + (divisions
    ? ' L’écharpe à nœuds dit la division de la saison : touche une ligne pour la lire.' : '');
}

function rendreListe() {
  const c = liste.classement ?? [];
  $('note').textContent = noteDe();
  poserSaison();
  const epingle = '<div class="tbf-ticket tbf-epingle" id="moi" role="group" hidden></div>';
  if (!c.length) {
    $('list').innerHTML = placeVide(liste) + epingle;
    alignerPodium();
    maPlace();
    return;
  }
  const L = c.map(LECTURES[liste.onglet]);
  const ecart = photographier(`${liste.onglet}:${liste.periode ?? ''}`, L.map((x) => x.cle));
  const podium = c.slice(0, 3).map((x, i) => marche(x, i, L[i])).join('');
  const lignes = c.slice(3).map((x, i) => ligne(x, i + 3, L[i + 3], ecart)).join('');
  /* Le mot de la valeur, une fois, en tête de la colonne : il se répétait
     sous chaque valeur. Les lecteurs d'écran l'entendent sur chaque ligne. */
  const tete = `<div class="tete-col" aria-hidden="true"><span>${L[3]?.unite ?? ''}</span></div>`;
  $('list').innerHTML = `<ol class="tbf-podium" aria-label="Le podium">${podium}</ol>`
    + (lignes ? `<div class="pan lignes">${tete}${lignes}</div>` : '') + epingle;
  alignerPodium();
  premierRendu = false;
  maPlace();
}

/**
 * **Ma place est arrivée — ou mon identité — après la liste.** On ne
 * réécrit pas la liste : le podium serait remplacé pendant que ses bâches se
 * collent, la seconde passe se ferait sans colle, et la mémoire des rangs
 * serait réécrite une seconde fois. On pose seulement ce que la liste ne
 * savait pas : ma ligne épinglée, le filet de ma ligne dans la liste, le nom
 * des divisions, la saison sous le sous-titre et la note du bas.
 */
function apresMaPlace() {
  if (!liste || !$('moi')) return;
  poserSaison();
  $('note').textContent = noteDe();
  for (const r of $('list').querySelectorAll('.row[data-pid]')) {
    r.classList.toggle('moi', Boolean(qui?.id) && r.dataset.pid === qui.id);
  }
  for (const d of $('list').querySelectorAll('.row .tbf-division[data-n]')) {
    const n = Number(d.dataset.n);
    const nom = nomDivision(n);
    d.setAttribute('aria-label', nom ? `Division ${nom}` : `Division ${n} sur 5`);
  }
  /* Une bulle ouverte se redit avec les noms qu'elle n'avait pas. */
  const ouverte = fermerBulle();
  if (ouverte) basculerBulle(ouverte);
  maPlace();
}

function choisir(t) {
  onglet = t;
  document.querySelectorAll('.tabs [data-t]').forEach((x) => x.classList.toggle('on', x.dataset.t === t));
}
document.querySelector('.tabs').onclick = (e) => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  choisir(b.dataset.t);
  charger();
};

/* **Une ancre par onglet**, pour qu'une autre page ouvre la bonne liste :
   `/classement#duellistes`, `#tribunes`… et `#saison`, la liste de la
   saison et ses divisions — l'onglet SUPPORTERS, qui la sert dès que ma
   place porte une saison (voir `charger`). C'est l'ancre du lien « Le
   classement de la saison » de MISSIONS. Un mot inconnu : l'onglet par
   défaut. */
const ANCRES = { saison: 'supporters', supporters: 'supporters', tribunes: 'tribunes',
  duellistes: 'duellistes', duels: 'duellistes', entrainements: 'entrainements' };
const motAncre = () => location.hash.slice(1).toLowerCase();
const ancre = () => ANCRES[motAncre()] ?? null;
if (ancre()) choisir(ancre());
window.addEventListener('hashchange', () => {
  const t = ancre();
  if (t) { choisir(t); charger(); }
});

/* ----------------------------------------------------------- ma ligne

   **Ma place, celle du tableau que je regarde**, collée au bas de l'écran.
   Elle parlait toujours de ferveur, y compris sous DUELS : on lisait « 312e
   sur 1 400 supporters » juste au-dessus des duellistes, et la conclusion
   tombait toute seule — mes duels n'ont pas été comptés. Et quand on n'y
   figure pas, elle dit **ce qui manque**, avec le compte exact : « il t'en
   faut 3 — encore 1 » n'appelle pas le même geste que « tu n'es pas
   classé ». */

/** Mon visage : servi avec ma place, sinon celui de ma ligne dans la liste,
    sinon celui que la barre a retenu, sinon l'initiale de mon pseudo. */
function monBuste() {
  let avatar = place && 'avatar' in place ? place.avatar : undefined;
  if (avatar === undefined && qui) {
    avatar = (liste?.classement ?? []).find((x) => x.public_id === qui.id)?.avatar;
  }
  if (avatar === undefined && qui) {
    /* Le repli quand ma place ne dit rien de mon avatar (`avatar` absent :
       le serveur ne sait pas, le contrat § 14.3 ; ou ma place pas servie)
       et que ma ligne n'est pas dans la liste : ce que `nav.js` retient
       pour la barre au nom du même joueur, dans l'onglet — ou, d'abord, ce
       qu'elle vient d'annoncer (`tbf:hud`), plus frais, et le seul chemin
       quand le stockage est fermé. `avatar: null` est une réponse (aucun
       Fanzzy équipé) : il ne passe pas par ici. */
    let d = null;
    try { d = JSON.parse(sessionStorage.getItem('tbf-hud') || 'null'); } catch { /* fermé */ }
    for (const x of [hudRecu, d]) {
      if (avatar === undefined && x?.qui === qui.id && x.avatar?.id) avatar = x.avatar;
    }
  }
  if (!avatar && !qui?.pseudo) return '';
  return buste(avatar, qui?.pseudo, { taille: 30 });
}

/* Ma division sur ma ligne : l'insigne, et son nom en clair dessous. */
function maDivision(d) {
  const n = Number(d?.n);
  if (!Number.isInteger(n) || n < 1 || n > 5) return '';
  const nom = d.nom ?? nomDivision(n);
  return `<span class="moi-div">${insigne(n)}${nom ? `<b aria-hidden="true">${esc(nom)}</b>` : ''}</span>`;
}

function maPlace() {
  const el = $('moi');
  const m = place;
  if (!el || !m) return;
  const toi = '<b class="tbf-epingle-qui">TOI</b>';
  const rangDe = (r) => `<b class="tbf-epingle-rang">${nombre(r)}<sup>e</sup></b>`;
  const valeur = (v, mot) => `<span class="tbf-epingle-val">${v}<small>${mot}</small></span>`;
  const quoi = (t) => `<span class="tbf-epingle-quoi">${t}</span>`;
  const jauge = (fait, sur) => `<span class="tbf-jauge tbf-jauge--fine" role="img" aria-label="${fait} sur ${sur}"><i
    style="width:${Math.round(100 * Math.max(0, Math.min(1, fait / Math.max(1, sur))))}%"></i></span>`;
  const plancher = Number(m.plancher) || 0;
  const evo = m.evolution ?? {};
  let corps;
  let dit;

  if (onglet === 'duellistes' || onglet === 'entrainements') {
    const duel = onglet === 'duellistes';
    const x = (duel ? m.duels : m.entrainements) ?? {};
    if (x.rang) {
      corps = rangDe(x.rang) + delta(evo[duel ? 'duels' : 'entrainements']?.rang, 'depuis ta dernière visite')
        + (duel ? valeur(nombre(x.cote ?? 1000), 'de cote') : valeur(nombre(x.joues), 'parties'));
      dit = `Ta place : ${x.rang}e sur ${x.sur} ${duel ? 'duellistes classés' : 'qui s’entraînent'}`;
    } else if (x.joues) {
      /* Des espaces insécables : « encore » ne se sépare pas de son chiffre. */
      corps = quoi(`Il t’en faut\u00a0${plancher} — encore\u00a0${Math.max(1, plancher - x.joues)}`)
        + jauge(x.joues, plancher);
      dit = `Pas encore classé : ${x.joues} sur ${plancher}`;
    } else {
      corps = quoi(duel ? 'Aucun duel classé encore' : 'Pas encore d’entraînement');
      dit = 'Pas encore classé';
    }
  } else if (onglet === 'tribunes') {
    /* **Ce tableau ne classe pas des joueurs** : la question qu'on se pose
       devant lui est l'autre — à quelle tribune va ma ferveur ? Un
       supporter qui pousse en neutre n'en alimente aucune. */
    const t = m.tribune;
    if (t?.nom) {
      corps = Number(t.ferveur) > 0
        ? quoi(`pour ${esc(t.nom)}`) + valeur(nombre(t.ferveur), 'donnés')
        : quoi(`pour ${esc(t.nom)} · rien encore, tu as poussé en neutre`);
      dit = `Ta ferveur va à ${t.nom}`;
    } else {
      corps = quoi('Aucun club suivi : ta ferveur ne va à aucune tribune');
      dit = 'Aucun club suivi';
    }
  } else {
    const s = liste?.periode === 'saison' ? m.saison : null;
    /* La liste de la saison sans saison dans ma place (divisions coupées,
       ouverte par l'ancre) : aucun rang, plutôt que celui de toujours sous
       une liste qui n'est pas la sienne. La ligne ne se pose pas ; la
       mienne, si elle est dans la liste, garde son filet. */
    if (liste?.periode === 'saison' && !s) return;
    const rang = s ? s.rang : m.rang;
    if (rang) {
      const nomDiv = s?.division?.n ? (s.division.nom ?? nomDivision(Number(s.division.n))) : null;
      corps = rangDe(rang) + (s?.division?.n ? maDivision(s.division) : '')
        + (s ? delta(evo.ferveur?.rang, 'depuis ta dernière visite') : '')
        + valeur(nombre(s ? s.ferveur : m.ferveur), 'de ferveur');
      dit = `Ta place : ${rang}e sur ${s ? s.sur : m.sur} supporters classés${
        nomDiv ? `, division ${nomDiv}` : ''}`;
    } else {
      corps = quoi(s ? 'Pas encore classé cette saison' : 'Pas encore classé');
      dit = 'Pas encore classé';
    }
  }
  busteVu = monBuste();
  el.innerHTML = busteVu + toi + corps;
  el.toggleAttribute('data-div', Boolean(el.querySelector('.moi-div')));
  el.setAttribute('aria-label', dit);
  el.hidden = false;
}

/* Ma place et mon identité arrivent avant la liste, ou après : chacune se
   pose à son arrivée, sans réécrire la liste (`apresMaPlace`). Les deux
   écouteurs passent avant la suite de `charger`, qui attend aussi ma place
   pour choisir la liste SUPPORTERS : la liste se dessine donc déjà avec. */
placeP.then((m) => { place = m; apresMaPlace(); });
quiP.then((q) => { qui = q; apresMaPlace(); });
charger();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
