<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classements — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* **Quatre onglets, et le quatrième est long.** `ui.css` dimensionne la barre
   pour trois étiquettes de dix caractères ; « ENTRAÎNEMENT » en fait douze et
   se coupait en « ENTRAÎNE… », qui se devine au lieu de se lire. On réduit le
   corps ici, sur cette page seule, plutôt que de toucher au composant partagé
   — les dix-huit autres pages n'ont pas ce problème, et une barre d'onglets
   plus petite partout pour une page serait le mauvais échange. */
.tabs .tbf-onglet{font-size:clamp(9px,2.7vw,12px);letter-spacing:.04em}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}
h1{font-family:var(--banner);font-size:20px;letter-spacing:.15em;margin:0;padding:16px 16px 4px}
h1 small{display:block;font-size:9px;letter-spacing:.3em;opacity:.45;margin-top:4px;font-family:var(--ui)}
.moi{margin:12px 14px 0;border:1px solid rgba(245,195,59,.4);border-radius:12px;padding:13px 15px;
  background:linear-gradient(140deg,rgba(245,195,59,.13),rgba(8,11,16,.75));display:flex;
  align-items:center;gap:12px}
.moi .r{font-family:var(--banner);font-size:30px;color:var(--projo);line-height:1}
.moi .r sup{font-size:13px}
.moi .d{flex:1;min-width:0;font-size:12px;opacity:.72;line-height:1.5}
.moi .d b{color:var(--craie);opacity:1}
.list{flex:1;padding:0 14px 20px}
.row{display:flex;align-items:center;gap:11px;padding:11px 4px;font-size:13px;
  border-top:1px solid rgba(242,238,228,.07)}
.row .rk{font-family:var(--banner);font-size:15px;min-width:26px;opacity:.5}
.row.p1 .rk{color:#F5C33B;opacity:1}.row.p2 .rk{color:#D8DCE4;opacity:1}.row.p3 .rk{color:#C08552;opacity:1}
.row img{width:22px;height:22px;object-fit:contain}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-family:var(--banner);font-size:13.5px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{font-size:10.5px;opacity:.45}
.row .v{font-family:var(--banner);font-size:16px;color:var(--c,var(--projo))}
.row .v small{display:block;font-size:8.5px;opacity:.45;letter-spacing:.1em;font-family:var(--ui);
  color:var(--craie);text-align:right}
.note{font-size:11px;opacity:.42;text-align:center;padding:16px 22px;line-height:1.7}
.empty{text-align:center;padding:46px 22px;opacity:.5;font-size:13px;line-height:1.7}
.spin{width:24px;height:24px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(1turn)}}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* **Quatre onglets, et le quatrième est long.** `ui.css` dimensionne la barre
   pour trois étiquettes de dix caractères ; « ENTRAÎNEMENT » en fait douze et
   se coupait en « ENTRAÎNE… », qui se devine au lieu de se lire. On réduit le
   corps ici, sur cette page seule, plutôt que de toucher au composant partagé
   — les dix-huit autres pages n'ont pas ce problème, et une barre d'onglets
   plus petite partout pour une page serait le mauvais échange. */
.tabs .tbf-onglet{font-size:clamp(9px,2.7vw,12px);letter-spacing:.04em}
/* Les boutons de cette barre n'ont pas de classe : ils sont les seuls enfants
   du rail, et lui seul les désigne. */
</style>
</head>
<body>
<main id="app">
  <h1 class="tbf-titre">CLASSEMENTS<small>QUI FAIT LE PLUS DE BRUIT</small></h1>
  <div class="moi" id="moi" style="display:none"></div>
  <div class="tabs tbf-onglets">
    <button data-t="supporters" class="tbf-onglet on">SUPPORTERS</button>
    <button data-t="tribunes" class="tbf-onglet">TRIBUNES</button>
    <button data-t="duellistes" class="tbf-onglet">DUELS</button>
    <!-- L'entraînement ne rapporte rien, et il existe quand même : quelqu'un
         qui passe une soirée à s'entraîner n'en trouvait aucune trace ailleurs
         que dans son propre parcours. Le nom de l'onglet est celui du mot que
         le joueur cherche — il vient de jouer des « entraînements ». -->
    <button data-t="entrainements" class="tbf-onglet">ENTRAÎNEMENT</button>
  </div>
  <div class="list" id="list"><div class="spin"></div></div>
</main>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
let onglet = 'supporters';

const NOTES = {
  /* **Les deux sources, dites dans l'ordre où on les rencontre.** Cette note
     promettait le Grand Virage seul, à une époque où c'était vrai ; le duel
     rapportait déjà de la ferveur, et elle ne comptait ici nulle part. Un
     joueur qui ne faisait que des duels lisait donc une explication qui ne
     décrivait pas le classement qu'il avait sous les yeux. */
  supporters: 'La ferveur se gagne en chantant dans le Grand Virage et en gagnant des duels class\u00e9s. Un joueur qui n\u2019a jamais ouvert un booster peut être premier.',
  tribunes: 'Les clubs sont classés sur la ferveur moyenne par supporter, pas sur le total. Trente fidèles qui chantent juste passent devant mille abonnés qui regardent.',
  duellistes: 'Classé sur la cote, pas sur le nombre de victoires : battre plus fort rapporte plus, perdre contre plus faible coûte plus. Tout le monde part de 1000. Duels contre de vrais adversaires uniquement — les entraînements ne comptent pas.',
  /* **Ce tableau classe sur les parties jouées, et il faut le dire.** On
     s'entraîne aussi contre des machines : classer sur les victoires ferait un
     tableau de qui bat le plus de bots, ce qui se gagne en y passant la nuit.
     Les parties, elles, coûtent le même prix à tout le monde. */
  entrainements: 'Qui s\u2019entraîne le plus, contre des joueurs comme contre des bots. L\u2019entraînement ne rapporte aucune ferveur et ne compte dans aucun autre classement : ce tableau dit qui joue, pas qui est le meilleur.',
};

async function charger() {
  $('list').innerHTML = '<div class="spin"></div>';
  let d;
  try {
    d = await fetch('/api/rank/' + onglet, { credentials:'same-origin' }).then((r) => r.json());
  } catch { $('list').innerHTML = '<div class="empty">Serveur injoignable.</div>'; return; }

  const c = d.classement ?? [];
  if (!c.length) {
    $('list').innerHTML = `<div class="empty">Ce classement est encore vide.<br>
      Sois le premier à y entrer.</div>`;
    return;
  }

  const rang = (i) => `<span class="rk">${i + 1}</span>`;
  const lignes = {
    supporters: (x, i) => `<div class="row ${i < 3 ? 'p' + (i + 1) : ''}">${rang(i)}
      <span class="n"><b>${esc(x.pseudo)}</b><small>${esc(x.club ?? '')} · ${x.matchs} matchs · ${x.vecus} vécus</small></span>
      <span class="v" style="--c:var(--projo)">${Number(x.ferveur).toLocaleString('fr')}<small>FERVEUR</small></span></div>`,
    tribunes: (x, i) => `<div class="row ${i < 3 ? 'p' + (i + 1) : ''}">${rang(i)}
      <img src="${esc(x.logo)}" alt="">
      <span class="n"><b>${esc(x.name)}</b><small>${esc(x.country ?? '')} · ${x.supporters} supporters</small></span>
      <span class="v" style="--c:var(--bleu)">${Number(x.moyenne).toLocaleString('fr')}<small>PAR TÊTE</small></span></div>`,
    /* Le grand chiffre est **la cote**, sur laquelle on est classé ; les
       victoires et le taux passent en dessous. L'inverse ferait lire un
       classement de victoires rangé dans un ordre qui n'est pas le leur, ce qui
       est la façon la plus sûre de faire croire à un défaut. */
    duellistes: (x, i) => `<div class="row ${i < 3 ? 'p' + (i + 1) : ''}">${rang(i)}
      <span class="n"><b>${esc(x.pseudo)}</b><small>${x.joues} duels · ${x.gagnes} gagnés · ${x.taux}%</small></span>
      <span class="v" style="--c:var(--flare)">${x.cote ?? 1000}<small>COTE</small></span></div>`,
    /* Le grand chiffre est celui sur lequel on est classé — les parties — et
       les victoires passent en dessous. L'inverse ferait lire un classement
       de victoires rangé dans un ordre qui n'est pas le leur, ce qui est la
       façon la plus sûre de faire croire à un défaut. */
    entrainements: (x, i) => `<div class="row ${i < 3 ? 'p' + (i + 1) : ''}">${rang(i)}
      <span class="n"><b>${esc(x.pseudo)}</b><small>${esc(x.club ?? '')}${x.club ? ' · ' : ''}${x.gagnes} gagné${x.gagnes > 1 ? 's' : ''}</small></span>
      <span class="v" style="--c:var(--craie)">${x.joues}<small>JOUÉS</small></span></div>`,
  }[onglet];

  $('list').innerHTML = c.map(lignes).join('') + `<div class="note">${NOTES[onglet]}</div>`;
}

document.querySelector('.tabs').onclick = (e) => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  onglet = b.dataset.t;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  charger();
};

(async () => {
  charger();
  try {
    const m = await fetch('/api/rank/moi', { credentials:'same-origin' }).then((r) => r.json());
    if (m.error) return;
    $('moi').innerHTML = m.rang
      ? `<span class="r">${m.rang}<sup>e</sup></span>
         <span class="d">sur <b>${m.sur}</b> supporters classés<br>
           <b>${Number(m.ferveur).toLocaleString('fr')}</b> de ferveur sur ${m.matchs} matchs
           ${m.duels.joues ? ` · ${m.duels.gagnes}/${m.duels.joues} duels` : ''}</span>`
      /* Les deux portes, puisque les deux mènent ici. N'en nommer qu'une
         laissait croire que l'autre ne comptait pas — et c'était vrai, ce qui
         est précisément ce qu'on vient de corriger. */
      : `<span class="r">—</span><span class="d">Tu n\u2019es pas encore classé.<br>
           Entre dans le <b>Grand Virage</b> ou gagne un <b>duel classé</b>
           pendant un match de ton club.</span>`;
    $('moi').style.display = 'flex';
  } catch { /* pas connecté */ }
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
