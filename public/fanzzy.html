     sur l'écran « Mon Fanzzy », exactement comme sur l'accueil. Le module ne
     lève jamais et ne demande rien tant qu'on ne l'appelle pas. -->
<script src="/fanzzy-etats.js"></script>
<!-- La scène : les calques de gestes et le croisement des poses, partagés
     avec le virage. -->
<script src="/fanzzy-scene.js"></script>
<link rel="stylesheet" href="/fanzzy-fiche.css">
<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en
     panneau par-dessus la grille. -->
<script src="/fanzzy-fiche.js"></script>
<script>
/* =======================================================================
   FANZZY — le vestiaire et le classeur
   Les Fanzzy ne donnent pas de points : ils changent la façon dont tes
   gestes se jouent en duel. La rareté achète du choix, pas de la force —
   c'est ce qui évite qu'acheter des boosters revienne à acheter des victoires.
   ======================================================================= */

/* Les aides communes vivent dans /cartes.js : l'état, le catalogue, le
   dessin d'une carte, la table des raretés. Le kiosque les partageait sans
   que rien ne le dise ; il a son écran à lui, et elles ont leur fichier. */
const { $, ART, BY_ID, DEX, EVO_COST, PERSOS, S, SETS, SETS_TOUTES, TYPES, artFond, artProcedural, buzz, cardHTML, clamp, esc, formeHTML, load, src } = window.TBF_CARTES;

/* La collection est rangée par **personnage** : `S.col` et `S.stades` sont
   indexés sur la racine d'une lignée, pas sur chacun de ses âges. C'est la
   règle posée par `stades.sql` — on possède « le Choriste au stade 2 », pas
   « le Meneur de chant ». */
const racineDe = (f) => f.racine ?? f.id;
const stadeDe = (f) => f.stade ?? 1;
/** L'âge atteint d'une lignée, 0 si on ne l'a pas. */
const atteint = (racine) => (S.col?.[racine] ? Math.max(1, Number(S.stades?.[racine]) || 1) : 0);
const possedeCarte = (id) => {
  const f = BY_ID.get(id);
  return Boolean(f) && atteint(racineDe(f)) >= stadeDe(f);
};
/* Une couleur de série n'entre dans un `style` que si c'est une couleur :
   elle vient du catalogue, et une valeur inattendue y deviendrait du CSS. */
const teinte = (c) => (/^#[0-9a-f]{3,8}$/i.test(String(c ?? '')) ? c : null);
const echarpeDe = (set) => {
  const a = teinte(set?.c1);
  const b = teinte(set?.c2);
  return a && b ? `--e1:${a};--e2:${b}` : '';
};
/* Le mouvement demandé ou refusé, lu **au moment du geste** : le tiroir peut
   basculer le mode calme pendant la visite. */
const calmeVoulu = () => matchMedia('(prefers-reduced-motion: reduce)').matches
  || (document.documentElement.dataset.calme ?? '').split(' ').includes('animations');
const pluriel = (n, un, plusieurs) => `${n} ${Number(n) > 1 ? plusieurs : un}`;
/** Le numéro de pochette, « N° 013 » : trois chiffres, comme un album. */
const numero = (n) => `N° ${String(n).padStart(3, '0')}`;


/* -------------------------------------------------------------- lignées */

/**
 * Le personnage à l'âge que le joueur a atteint.
 *
 * Sans stade enregistré, c'est le premier — ce qui est le cas de la très
 * grande majorité de la collection, et le repli naturel pour tout ce que le
 * serveur n'a pas eu le temps de dire.
 */
function ageDe(f) {
  const n = S.stades?.[f.racine ?? f.id] ?? 1;
  return n > 1 ? (lineOf(f)[n - 1] ?? f) : f;
}
function lineOf(f) {
  // Les âges d'un personnage, du premier au dernier, dans l'ordre annoncé par
  // le serveur. On ne remonte plus la chaîne à la main : `racine` et `stade`
  // arrivent avec le catalogue, et deux façons de calculer la même lignée
  // finissent par ne plus donner la même.
  const racine = f.racine ?? f.id;
  return DEX.filter((x) => (x.racine ?? x.id) === racine)
    .sort((a, b) => (a.stade ?? 1) - (b.stade ?? 1));
}

/**
 * La case qui porte AVATAR : **l'âge que l'avatar montre**, et non les trois.
 *
 * `S.avatar` est l'avatar tel que le serveur le résout (`wallet.avatar`) —
 * l'âge choisi sur la fiche, qui peut être plus jeune que l'âge atteint.
 * Sans lui (un serveur d'avant), l'avatar est `S.active` à l'âge atteint,
 * comme l'écrivait le classeur. « AVATAR » et non « DUEL » : c'est le
 * personnage que voient l'accueil et les amis, sans rapport avec le deck.
 */
function estAvatar(racine, stade) {
  if (S.avatar?.id) return S.avatar.id === racine && Number(S.avatar.evo ?? atteint(racine)) === stade;
  return S.active === racine && atteint(racine) === stade;
}


/* =============================================================== l'album

   Une page par série, et **seules la page ouverte et ses deux voisines sont
   montées** : les autres sont des `section` vides, qui gardent leur largeur
   pour que le balayage tombe juste. Un album de cent cinquante cartes n'en
   monte pas cent cinquante — LA TRIBUNE en a cent soixante à elle seule.

   Une page ne se refait que si **ce qu'elle montre** a changé : sa signature
   est faite des données (possédé, doublons, avatar, nouveautés, filtres),
   pas de son balisage — le décor de chaque carte porte des identifiants
   frais à chaque dessin, et deux rendus du même album ne se ressemblent
   jamais au caractère près. Sans elle, chaque relecture de l'état refaisait
   trois pages de cartes, images comprises. */

const album = { pages: [], fermees: [], structure: '', courant: -1, marque: null };
/* Les filtres valent pour tout l'album : on tourne la page, la famille
   choisie reste. */
const filtre = { famille: null, reste: false };
/**
 * Ce que rapporte une série complète, et si c'est prêt (`paliers.series`,
 * contrat § 5.1), ou `null`.
 *
 * **Lu dans l'état du joueur, jamais dans la bibliothèque.** Le classeur
 * appelait `/api/fanzzy/bibliotheque` pour ce seul sticker : le recompte du
 * compte entier — les Fanzzy, les tenues, les pièces, les actions, les
 * états, puis les paliers — pour n'en garder qu'une ligne par série, sur un
 * écran qui lit déjà `/api/fanzzy/state`. Le lot ne prend aucune requête
 * lourde de plus par écran. La donnée est demandée au serveur dans l'état
 * (`paliers.series`, la forme du § 5.1), que `load()` recopierait dans
 * `S.paliers` ; d'ici là elle est absente, et la jauge reste nue, sans
 * sticker : c'est ce que le contrat prévoit (« Absence »).
 */
const serieDe = (id) => (Array.isArray(S.paliers?.series)
  ? S.paliers.series.find((x) => x?.id === id) ?? null : null);

/**
 * Les séries du classeur, dans l'ordre du rail.
 *
 * **Le classeur ne range que ce que les saisons ont ouvert**, plus ce qu'on
 * possède déjà : une série qu'on referme cesse de distribuer, elle n'efface
 * pas les cartes de qui les a. `SETS` vide — aucune saison lancée — veut
 * dire « pas de restriction », comme côté serveur.
 *
 * L'ordre est celui du catalogue (`SETS_TOUTES`), pas celui de l'alphabet,
 * **les séries ouvertes d'abord** : en production, LA REPRISE est la seule
 * qu'on puisse remplir, et elle vient en dernier dans la table. Puis les
 * séries fermées dont on a des cartes, puis celles qu'on n'a jamais vues,
 * sous cadenas — elles se touchent pour dire pourquoi, elles ne s'ouvrent
 * pas, et n'ont pas de page : un balayage ne doit pas tomber sur un mur.
 */
function lesSeries() {
  const ouvertes = new Set(SETS.map((s) => s.id));
  const libre = !ouvertes.size;
  const presentes = new Set(DEX.map((f) => f.set));
  const connues = SETS_TOUTES.filter((s) => presentes.has(s.id));
  // Une série hors table passe en fin, plutôt que de disparaître.
  for (const id of presentes) if (!connues.some((s) => s.id === id)) connues.push({ id, nom: id });
  const aMoi = new Set(PERSOS.filter((f) => S.col?.[f.id]).map((f) => f.set));
  const ouverte = (s) => libre || ouvertes.has(s.id);
  return {
    pages: [...connues.filter(ouverte).map((set) => ({ set, ouverte: true })),
      ...connues.filter((s) => !ouverte(s) && aMoi.has(s.id)).map((set) => ({ set, ouverte: false }))],
    fermees: connues.filter((s) => !ouverte(s) && !aMoi.has(s.id)),
  };
}

/**
 * Les cartes d'une page, dans l'ordre de l'album, chacune avec son état.
 *
 * **Les trois âges, à la suite** : TR1, TR1B, TR1C, puis TR2 — une lignée par
 * rangée. **Et les légendaires ferment la série** : elles ne tiennent dans
 * aucune lignée, et chacune a sa case VITRINE.
 *
 * Le numéro de pochette est la place de la carte dans sa série, compté sur
 * la série entière — il ne change ni au filtre, ni d'une visite à l'autre.
 *
 * Les états :
 *   possede    l'âge est atteint ;
 *   achetable  l'âge suivant d'une lignée qu'on a : il s'achète, flouté, avec
 *              son prix — le flou est ce qu'on paie ;
 *   avenir     un âge plus loin : flouté, sans prix, il faudra d'abord l'autre ;
 *   manque     le premier âge d'une lignée qu'on n'a pas : une pochette, la
 *              silhouette du personnage au pochoir — il se tire en booster, le
 *              voir donne envie de l'ouvrir ;
 *   cache      un âge supérieur d'une lignée qu'on n'a pas : une pochette
 *              sans silhouette — une évolution se cache, on ne donne pas
 *              d'avance la seule chose qu'on paie.
 *
 * Une série fermée ne montre que les lignées qu'on possède : ce qu'aucun
 * booster ne donne aujourd'hui n'est pas un but, c'est un mur.
 */
function cartesDe({ set, ouverte }) {
  const num = (f) => Number(/^[A-Z]+(\d+)/.exec(racineDe(f))?.[1] ?? 0);
  const leg = (f) => (f.rar === 'legendaire' ? 1 : 0);
  return DEX.filter((f) => f.set === set.id)
    .sort((a, b) => leg(a) - leg(b) || num(a) - num(b) || stadeDe(a) - stadeDe(b))
    .map((f, i) => {
      const racine = racineDe(f);
      const stade = stadeDe(f);
      const a = atteint(racine);
      const etat = a >= stade ? 'possede'
        : a ? (stade === a + 1 ? 'achetable' : 'avenir')
          : (stade === 1 ? 'manque' : 'cache');
      return { f, racine, stade, n: i + 1, etat };
    })
    .filter((c) => ouverte || atteint(c.racine) > 0);
}

/* ------------------------------------------------------------ NOUVEAU

   **Le drapeau vient du serveur** (`CONTRATS.md`, § 2.1) : `nouveautes` de
   `/api/fanzzy/state`, écrite au moment du gain, la même sur tous les
   appareils. Le classeur montre les cartes : il lit `fanzzy` (un personnage
   arrivé, sur son premier âge) et `age` (un âge acheté, sur sa carte). Les
   états, les tenues, les pièces sont l'affaire de /collection.

   `nouveautes` absent : le serveur ne sait pas, et l'écran n'affiche aucun
   NOUVEAU — jamais une nouveauté devinée.

   **On éteint après avoir montré, jamais au chargement** (§ 2.2). Une carte
   est montrée quand elle est restée à l'écran, à plus de moitié, près d'une
   seconde — le classeur ouvert, la fiche fermée, l'onglet au premier plan.
   Les clés partent par lots (`POST /api/fanzzy/vu`, forme `cles`), et à la
   sortie de la page (`keepalive`) : on quitte souvent dans la seconde.

   Le NOUVEAU reste sur la carte pendant toute la visite, même éteint : il
   disparaîtrait sinon sous les yeux à la première relecture de l'état. */
const montrees = new Map();    // clé → carte, montrées pendant cette visite
const aEteindre = new Set();
let extinctionEnRoute = false;
let minuterieExtinction = 0;

/** La clé NOUVEAU de chaque carte qui en a une : `id de carte → clé`. */
function nouveautesCartes() {
  const m = new Map();
  for (const [cle, id] of montrees) m.set(id, cle);
  if (!Array.isArray(S.nouveautes)) return m;
  for (const x of S.nouveautes) {
    if (typeof x?.cle !== 'string') continue;
    let id = null;
    if (x.sorte === 'fanzzy') id = x.id;
    else if (x.sorte === 'age') {
      id = DEX.find((f) => racineDe(f) === x.id && stadeDe(f) === Number(x.stade))?.id ?? null;
    }
    if (id && BY_ID.has(id) && !m.has(id)) m.set(id, x.cle);
  }
  return m;
}

/* Ce qui est à l'écran depuis assez longtemps pour avoir été vu. */
const vuesEnCours = new Map();
const observateur = 'IntersectionObserver' in window ? new IntersectionObserver((entrees) => {
  for (const e of entrees) {
    const el = e.target;
    if (e.isIntersecting && e.intersectionRatio >= 0.55) {
      if (!vuesEnCours.has(el)) {
        vuesEnCours.set(el, setTimeout(() => { vuesEnCours.delete(el); montrer(el); }, 900));
      }
    } else {
      clearTimeout(vuesEnCours.get(el));
      vuesEnCours.delete(el);
    }
  }
}, { threshold: [0, 0.55] }) : null;

function montrer(el) {
  const cle = el.dataset.cle;
  if (!cle || montrees.has(cle) || !el.isConnected || document.hidden
    || !$('s-dex').classList.contains('on') || $('detail').classList.contains('on')
    || el.closest('[inert]')) return;
  montrees.set(cle, el.querySelector('.fz')?.dataset.id ?? '');
  observateur?.unobserve(el);
  aEteindre.add(cle);
  majOnglet();
  clearTimeout(minuterieExtinction);
  minuterieExtinction = setTimeout(eteindre, 1500);
}

/**
 * Éteint au serveur ce qui a été montré. Un 2xx les éteint ; un 400 (corps
 * refusé) les retire de la file — les renvoyer ne changerait rien. Le réseau
 * coupé, un 401, un 404 (ancien serveur pendant un déploiement) ou un 5xx
 * les gardent : elles repartiront au lot suivant ou à la sortie, et au pire
 * le NOUVEAU reviendra à la visite d'après, sans plus.
 */
async function eteindre() {
  clearTimeout(minuterieExtinction);
  if (extinctionEnRoute || !aEteindre.size) return;
  const cles = [...aEteindre].slice(0, 200);
  extinctionEnRoute = true;
  let reste = false;
  try {
    const r = await fetch('/api/fanzzy/vu', {
      method: 'POST', credentials: 'same-origin', keepalive: true,
      headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cles }),
    });
    if (r.ok || r.status === 400) {
      for (const k of cles) aEteindre.delete(k);
      reste = aEteindre.size > 0;
    }
  } catch { /* réseau : on retentera */ }
  finally { extinctionEnRoute = false; }
  if (reste) minuterieExtinction = setTimeout(eteindre, 300);
}

function surveiller(page) {
  if (!observateur) return;
  for (const el of page.querySelectorAll('[data-cle]')) {
    if (!montrees.has(el.dataset.cle)) observateur.observe(el);
  }
}
function oublier(page) {
  for (const el of page.querySelectorAll('[data-cle]')) {
    observateur?.unobserve(el);
    clearTimeout(vuesEnCours.get(el));
    vuesEnCours.delete(el);
  }
}
/* L'observateur ne prévient que d'un **changement** : une carte déjà à
   l'écran quand la fiche se referme, ou quand l'onglet revient au premier
   plan, ne déclencherait plus rien. On la lui redonne. */
function reobserver() {
  for (const p of album.pages) {
    if (!p.monte) continue;
    oublier(p.el);
    surveiller(p.el);
  }
}

/**
 * « +3 » sur l'onglet CLASSEUR : les cartes nouvelles qu'aucune page ne
 * nous a encore montrées (la brique `.tbf-onglet-n`). Un compte nul ne se
 * pose pas — une ligne sans donnée disparaît.
 */
function majOnglet() {
  const b = document.querySelector('.nav [data-go="dex"]');
  if (!b) return;
  let n = 0;
  for (const [id, cle] of nouveautesCartes()) if (!montrees.has(cle) && possedeCarte(id)) n++;
  let c = b.querySelector('.tbf-onglet-n');
  if (!n) { c?.remove(); return; }
  if (!c) {
    c = document.createElement('b');
    c.className = 'tbf-onglet-n';
    b.append(c);
  }
  c.textContent = `+${n}`;
}

/* ------------------------------------------------------- une page, dessinée */

/* Le sachet au trait, celui du sticker de récompense du banc des briques. */
const SACHET = '<svg viewBox="0 0 24 24" aria-hidden="true" style="color:var(--flare)"><path d="M4 8h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 8l1.5-4h13L20 8M9 4v4M15 4v4"/></svg>';

/**
 * Ce que rapporte la série complète (`paliers.series[].gain`, § 5.1), en
 * sticker au bout de la jauge, **écrit par ce qu'il ouvre** — « 35 → 1
 * BOOSTER », jamais « cran » (amendement 22). Craie tant qu'il est à venir,
 * or quand il est prêt à récupérer (récupérer se fait sur /collection).
 * Rien sans gain servi, ni une fois récupéré : le tampon COMPLET le dit.
 */
function gainHTML(serie) {
  if (!serie || serie.etat === 'reclame') return '';
  const g = serie.gain ?? {};
  const n = (k) => Math.max(0, Math.floor(Number(g[k]) || 0));
  const parts = [
    n('packs') ? `${n('packs')} ${n('packs') > 1 ? 'BOOSTERS' : 'BOOSTER'}` : '',
    n('echarpes') ? `${n('echarpes')} ${n('echarpes') > 1 ? 'ÉCHARPES' : 'ÉCHARPE'}` : '',
    n('xp') ? `${n('xp')} XP` : '',
    n('tampons') ? `${n('tampons')} ${n('tampons') > 1 ? 'TAMPONS' : 'TAMPON'}` : '',
  ].filter(Boolean);
  const total = Math.floor(Number(serie.total));
  if (!parts.length || !(total > 0)) return '';
  const icone = n('packs') ? SACHET : n('echarpes') ? '<img src="/img/gains/echarpes.webp" alt="">' : '';
  return `<span class="tbf-sticker"${serie.etat === 'pret' ? ' data-ton="or"' : ''}>${icone}${total} → ${parts.join(' + ')}</span>`;
}

/**
 * Une case : la carte possédée (ou l'âge à venir) sous son scotch, ou la
 * pochette d'une carte qu'on n'a pas. Toutes ouvrent la fiche de la lignée
 * (`data-open`) : c'est elle qui porte les trois âges.
 */
function caseHTML(c, cle) {
  const { f, racine, stade, n, etat } = c;
  if (etat === 'manque' || etat === 'cache') {
    /* La silhouette est le personnage en pied (détouré : le buste ne l'est
       pas toujours, et une image pleine éteinte au pochoir n'est qu'un carré
       gris). Sans dessin, la trame et le numéro suffisent. */
    const img = etat === 'manque' ? window.FZART?.adresse?.(f.id, 'plein') : null;
    const dit = etat === 'manque' ? `${numero(n)}, ${f.nom} — à trouver` : `${numero(n)} — âge à venir`;
    return `<button type="button" class="tbf-album-pochette" data-open="${esc(racine)}" aria-label="${esc(dit)}">${
      img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''
    }<b>${numero(n)}</b></button>`;
  }
  const opts = { mini: true };
  if (etat === 'possede') {
    /* Les doublons se comptent par personnage : sur le premier âge, sinon le
       même nombre se répéterait trois fois. */
    if (stade === 1) opts.doublons = S.col[racine];
    opts.avatar = estAvatar(racine, stade);
  } else {
    opts.secret = true;
    const prix = Number(EVO_COST?.[stade]);
    if (etat === 'achetable' && Number.isFinite(prix) && prix > 0) opts.prix = prix;
  }
  const neuf = etat === 'possede' && cle;
  return `<div class="tbf-album-case" data-open="${esc(racine)}" role="button" tabindex="0"${
    neuf ? ` data-cle="${esc(cle)}"` : ''}>${cardHTML(f, opts)}${
    neuf ? '<span class="tbf-sticker" data-ton="flare">NOUVEAU</span>' : ''}</div>`;
}

/**
 * La case VITRINE : une légendaire ferme sa série sur toute la rangée, sa
 * carte à gauche, VITRINE en sticker or (le légendaire, l'un des trois sens
 * de l'or), son nom et ce qu'elle est. **Rien n'y bouge** : l'album fige ses
 * cartes, l'holo tourne dans la fiche. Manquante, la pochette et son numéro
 * — le nom ne se donne pas d'avance.
 */
function vitrineHTML(c, cle, ouverte) {
  const a = c.etat === 'possede';
  const famille = TYPES[c.f.type]?.nom;
  const quoi = ['Légendaire', a ? famille : (ouverte ? 'se tire dans les boosters' : '')].filter(Boolean).join(' · ');
  return `<div class="tbf-album-vitrine">${caseHTML(c, cle)}<div class="tbf-album-vitrine-mot">
    <span class="tbf-sticker" data-ton="or">VITRINE</span>
    <b>${a ? esc(c.f.nom) : numero(c.n)}</b><small>${esc(quoi)}</small></div></div>`;
}

/**
 * Les données d'une page et leur signature. Le balisage ne se fabrique que
 * si la signature a changé — c'est lui qui coûte (une carte, c'est un décor
 * et une image).
 */
function donneesDePage(p, neufs) {
  const { set, ouverte } = p;
  const cartes = cartesDe(p);
  const persos = PERSOS.filter((f) => f.set === set.id);
  const eus = persos.filter((f) => S.col?.[f.id]).length;
  const total = persos.length;
  const complete = ouverte && total > 0 && eus >= total;
  const gain = gainHTML(ouverte ? serieDe(set.id) : null);
  const visibles = cartes.filter((c) => (!filtre.famille || c.f.type === filtre.famille)
    && (!filtre.reste || c.etat !== 'possede'));
  const cle = (c) => (c.etat === 'possede' ? neufs.get(c.f.id) ?? null : null);
  const sig = JSON.stringify([filtre, eus, total, complete, gain, visibles.map((c) => [c.f.id, c.etat,
    c.etat === 'possede' && c.stade === 1 ? S.col[c.racine] : 0,
    c.etat === 'possede' && estAvatar(c.racine, c.stade), cle(c)])]);
  const possedees = new Set(cartes.filter((c) => c.etat === 'possede').map((c) => c.f.id));
  return { p, eus, total, complete, gain, visibles, cle, sig, possedees };
}

function pageHTML({ p, eus, total, complete, gain, visibles, cle }) {
  const { set, ouverte } = p;
  /* **Le compte, ou le tampon.** « 12 / 40 » : des personnages, pas leurs
     âges — un âge supérieur ne se trouve pas dans un booster, il s'achète,
     et le compter promettrait ce qu'aucune ouverture ne donne. Série
     complète : le tampon COMPLET (§ 5.1), un verdict à la place du chiffre.
     Une série fermée n'a ni total ni jauge : ce qu'elle a d'autre ne se
     gagne pas aujourd'hui, et « 2 / 11 » serait une course qu'on ne peut pas
     courir. */
  const compte = complete ? '<span class="tbf-tampon" data-ton="vert">COMPLET</span>'
    : `<b class="tbf-album-compte">${eus}<small>${ouverte ? ` / ${total}` : ' à toi'}</small></b>`;
  /* **L'écharpe sans crans.** Elle en portait quatre, en dur : chaque cran
     est un palier (« les crans », ui.css), et une série ne paie qu'une fois,
     complète (§ 5.1) — trois paliers à 25, 50 et 75 % qui n'existent pas.
     Le seul palier d'une série est son bout, et c'est le sticker de ce
     qu'elle rapporte qui le dit, quand le serveur le sert. Le même balisage
     que l'album de /collection (`teteAlbum`), le même composant. */
  const part = total ? Math.round((eus / total) * 100) : 0;
  const jauge = ouverte ? `<div class="tbf-album-jauge">
      <div class="tbf-jauge" role="img" aria-label="${eus} sur ${total}"><i style="width:${part}%"></i></div>${gain}</div>` : '';
  const vide = filtre.reste && filtre.famille ? 'Rien ici avec ces filtres.'
    : filtre.reste ? 'Il ne te manque rien dans cette série.'
      : 'Aucune carte de cette famille dans cette série.';
  const cases = visibles.length
    ? visibles.map((c) => (c.f.rar === 'legendaire' ? vitrineHTML(c, cle(c), ouverte) : caseHTML(c, cle(c)))).join('')
    : `<p class="empty">${vide}</p>`;
  return `<header class="tbf-cadre tbf-album-tete" data-echarpe>
      <span class="tbf-album-embleme">${window.TBF_LOGO?.serie?.(set.id, '') ?? ''}</span>
      <div class="tbf-album-nom"><b>${esc(set.nom ?? set.id)}</b>${set.ligne ? `<small>${esc(set.ligne)}</small>` : ''}</div>
      ${compte}${jauge}
    </header>
    <div class="tbf-album-cartes">${cases}</div>`;
}

/**
 * Monte une page (ou la refait si ce qu'elle montre a changé).
 *
 * **La cascade de la colle** (`.tbf-colle`) ne joue qu'au premier rendu de
 * la page et sur une carte qui vient d'arriver — jamais au filtre, jamais
 * quand on revient sur une page déjà vue : une grille qui se recolle à
 * chaque geste devient un écran qui clignote.
 */
function monter(j, neufs = nouveautesCartes()) {
  const p = album.pages[j];
  if (!p) return;
  const d = donneesDePage(p, neufs);
  if (p.monte && p.sig === d.sig) return;
  oublier(p.el);
  p.el.innerHTML = pageHTML(d);
  if (!calmeVoulu()) {
    const arrivees = p.vue && p.possedees ? [...d.possedees].filter((id) => !p.possedees.has(id)) : null;
    let k = 0;
    for (const c of p.el.querySelectorAll('.tbf-album-case, .tbf-album-pochette')) {
      if (arrivees ? !arrivees.includes(c.querySelector('.fz')?.dataset.id) : k >= 12) continue;
      c.style.setProperty('--d', `${Math.min(k, 11) * 60}ms`);
      c.classList.add('tbf-colle');
      k += 1;
    }
  }
  p.monte = true;
  p.vue = true;
  p.sig = d.sig;
  p.possedees = d.possedees;
  surveiller(p.el);
}

function demonter(j) {
  const p = album.pages[j];
  if (!p?.monte) return;
  oublier(p.el);
  p.el.innerHTML = '';
  p.monte = false;
  p.sig = '';
}

/** La page `i` est ouverte : elle et ses voisines montées, le reste vidé. */
function placer(i) {
  album.courant = i;
  const neufs = nouveautesCartes();
  album.pages.forEach((p, j) => {
    if (Math.abs(j - i) <= 1) monter(j, neufs);
    else demonter(j);
    /* `inert` : la tabulation ne part pas dans une page hors de l'écran. */
    p.el.inert = j !== i;
  });
  marquerOnglet(i);
}

/** L'onglet de la série ouverte, et le rail qui le ramène sous les yeux. */
function marquerOnglet(i) {
  const id = album.pages[i]?.set.id;
  const rail = $('series');
  for (const b of rail.querySelectorAll('.tbf-album-onglet')) {
    if (b.dataset.serie === id) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  }
  const b = rail.querySelector('[aria-current="true"]');
  /* Seulement quand la série change : une relecture de l'état ne ramène pas
     le rail sous le doigt de qui le fait défiler pour voir la suite. */
  if (!b || !rail.clientWidth || album.marque === id) return;
  album.marque = id;
  /* À la main plutôt que `scrollIntoView` : celui-ci ferait aussi défiler
     l'écran en hauteur. */
  const ecart = b.getBoundingClientRect().left - rail.getBoundingClientRect().left;
  rail.scrollTo({ left: rail.scrollLeft + ecart - (rail.clientWidth - b.offsetWidth) / 2,
    behavior: calmeVoulu() ? 'auto' : 'smooth' });
}

const ongletHTML = (set, ferme) => (ferme
  ? `<button type="button" class="tbf-album-onglet" data-serie="${esc(set.id)}" data-verrou aria-disabled="true"><i class="tbf-ico tbf-ico-cadenas" aria-hidden="true"></i>${esc(set.nom ?? set.id)}</button>`
  : `<button type="button" class="tbf-album-onglet" data-serie="${esc(set.id)}" style="${echarpeDe(set)}">${
    window.TBF_LOGO?.serie?.(set.id, '') ?? ''}${esc(set.nom ?? set.id)}</button>`);

/**
 * Le rail et les pages vides. Ne se refait que si la liste des séries a
 * changé (une série fermée dont on vient de tirer une carte, par exemple) :
 * refaire les pages, c'est remonter l'album entier.
 */
function construireAlbum() {
  const { pages, fermees } = lesSeries();
  const structure = JSON.stringify([pages.map((p) => [p.set.id, p.ouverte]), fermees.map((s) => s.id)]);
  if (structure === album.structure) return false;
  const avant = album.pages[album.courant]?.set.id;
  for (const p of album.pages) oublier(p.el);
  album.structure = structure;
  album.fermees = fermees;
  album.marque = null;
  $('series').innerHTML = [...pages.map((p) => ongletHTML(p.set, false)),
    ...fermees.map((s) => ongletHTML(s, true))].join('');
  $('grid').innerHTML = pages.map((p) => `<section class="tbf-album-page" data-page="${esc(p.set.id)}"
    aria-label="${esc(p.set.nom ?? p.set.id)}" style="${echarpeDe(p.set)}"></section>`).join('');
  const els = [...$('grid').children];
  album.pages = pages.map((p, j) => ({ ...p, el: els[j], monte: false, vue: false, sig: '', possedees: null }));
  album.courant = album.pages.findIndex((p) => p.set.id === avant);
  return true;
}

/* Les six familles, une fois : leurs pins, et l'interrupteur au bout.
   MANQUANTS, le mot de la maquette : « ce qu'il me reste » faisait deux fois
   sa largeur, et poussait l'interrupteur sur une seconde ligne à 360 px (voir
   la règle des filtres, plus haut). Allumé, il ne laisse que ce qui manque —
   les pochettes et les âges à payer. */
function construireFiltres() {
  $('filtres').innerHTML = Object.entries(TYPES).map(([k, t]) => `<button type="button" class="tbf-filtre"
      data-famille="${esc(k)}" aria-pressed="false" aria-label="${esc(t.nom)}"><span class="tbf-pin"${
      teinte(t.c) ? ` style="--fam:${t.c}"` : ''}>${window.TBF_LOGO?.type?.(k, '') ?? ''}</span></button>`).join('')
    + '<button type="button" class="tbf-interrupteur" role="switch" aria-checked="false"><i aria-hidden="true"></i>Manquants</button>';
}

/**
 * La page où l'on arrive : celle de la carte nouvelle la plus récente, pour
 * que NOUVEAU se voie sans chercher ; sinon la première série ouverte.
 */
function pageDepart() {
  for (const [id, cle] of nouveautesCartes()) {
    if (montrees.has(cle) || !possedeCarte(id)) continue;
    const j = album.pages.findIndex((p) => p.set.id === BY_ID.get(id)?.set);
    if (j >= 0) return j;
  }
  return Math.max(0, album.pages.findIndex((p) => p.ouverte));
}

/**
 * Va à la page `i` — un onglet touché, ou l'arrivée. Les voisines sont
 * montées avant le défilement, pour que la page arrive pleine.
 *
 * **La page glisse seulement d'une voisine à l'autre.** Plus loin, elle
 * saute : un glissement de douze pages ferait défiler onze pages vides —
 * elles ne sont pas montées —, pendant plus d'une seconde sur une tablette.
 */
function aller(i, { instant = false } = {}) {
  const grid = $('grid');
  const neufs = nouveautesCartes();
  for (const j of [i - 1, i, i + 1]) monter(j, neufs);
  marquerOnglet(i);
  if ($('s-dex').scrollTop > 0) $('s-dex').scrollTo({ top: 0, behavior: 'auto' });
  const gauche = i * grid.clientWidth;
  const glisse = !instant && !calmeVoulu() && Math.abs(i - album.courant) === 1;
  if (!glisse || Math.abs(grid.scrollLeft - gauche) < 2) {
    grid.scrollTo({ left: gauche, behavior: 'auto' });
    placer(i);
    return;
  }
  grid.scrollTo({ left: gauche, behavior: 'smooth' });
}

/* La page tournée au doigt : on la lit quand le défilement s'arrête. Une
   page qu'on quitte au milieu de sa grille laisse l'écran au même endroit
   de la suivante — on remonte à son en-tête, comme on ouvre un classeur
   à la page d'une série. */
let attenteFin = 0;
function finDeDefilement() {
  clearTimeout(attenteFin);
  const grid = $('grid');
  const w = grid.clientWidth;
  if (!w || !album.pages.length || !$('s-dex').classList.contains('on')) return;
  const i = clamp(Math.round(grid.scrollLeft / w), 0, album.pages.length - 1);
  const change = i !== album.courant;
  placer(i);
  if (change && $('s-dex').scrollTop > grid.offsetTop) $('s-dex').scrollTo({ top: 0, behavior: 'auto' });
}
$('grid').addEventListener('scroll', () => {
  clearTimeout(attenteFin);
  attenteFin = setTimeout(finDeDefilement, 'onscrollend' in window ? 500 : 140);
}, { passive: true });
if ('onscrollend' in window) $('grid').addEventListener('scrollend', finDeDefilement);

/* La colle se retire à sa fin : laissée, elle rejouerait au prochain rendu
   de la case. */
$('grid').addEventListener('animationend', (e) => {
  if (e.animationName !== 'tbf-colle') return;
  e.target.classList.remove('tbf-colle');
  e.target.style.removeProperty('--d');
});

/* Toucher une case ouvre la fiche — la même pour tous, possédé ou non : elle
   sait présenter un Fanzzy absent de la collection, et c'est même là qu'elle
   sert le plus. */
$('grid').addEventListener('click', (e) => {
  const c = e.target.closest('[data-open]');
  if (!c || !BY_ID.has(c.dataset.open)) return;
  buzz(8);
  window.FX?.son?.(c.classList.contains('tbf-album-pochette') ? 'tic' : 'carte');
  ouvrirFiche(c.dataset.open);
});
/* Une case possédée est un `div` (une carte n'entre pas dans un bouton) :
   elle répond au clavier comme un bouton. */
$('grid').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.tbf-album-case[data-open]')) {
    e.preventDefault();
    e.target.click();
  }
});

/* Le rail. Une série fermée se touche pour dire pourquoi : elle secoue, et
   le message dit ce qu'on sait — la saison qui l'ouvrira, si elle est
   annoncée (§ 7.2), rien de plus sinon. */
$('series').addEventListener('click', (e) => {
  const b = e.target.closest('.tbf-album-onglet');
  if (!b) return;
  if (b.hasAttribute('data-verrou')) {
    b.classList.remove('tbf-secoue');
    void b.offsetWidth;
    b.classList.add('tbf-secoue');
    window.FX?.son?.('tic');
    const s = album.fermees.find((x) => x.id === b.dataset.serie);
    toast(`${s?.nom ?? b.textContent.trim()} : pas encore ouverte${
      Number.isInteger(s?.prochaine) ? `. Elle ouvre à la saison ${s.prochaine}.` : '.'}`);
    return;
  }
  const i = album.pages.findIndex((p) => p.set.id === b.dataset.serie);
  if (i >= 0) aller(i);
});
$('series').addEventListener('animationend', (e) => {
  if (e.animationName === 'tbf-secoue') e.target.classList.remove('tbf-secoue');
});

/* Les filtres : une famille à la fois (la retoucher la retire), et
   MANQUANTS. Les pages montées se refont, sans colle. */
$('filtres').addEventListener('click', (e) => {
  const f = e.target.closest('.tbf-filtre');
  const r = e.target.closest('.tbf-interrupteur');
  if (f) filtre.famille = filtre.famille === f.dataset.famille ? null : f.dataset.famille;
  else if (r) filtre.reste = !filtre.reste;
  else return;
  for (const b of $('filtres').querySelectorAll('.tbf-filtre')) {
    b.setAttribute('aria-pressed', String(b.dataset.famille === filtre.famille));
  }
  $('filtres').querySelector('.tbf-interrupteur').setAttribute('aria-checked', String(filtre.reste));
  if (album.courant >= 0) placer(album.courant);
});

/** Ouvre le classeur, ou le remet à jour s'il l'est déjà. */
function ouvrirClasseur() {
  if (!DEX.length) return;
  if (!$('filtres').firstChild) construireFiltres();
  construireAlbum();
  if (!album.pages.length) return;
  const i = album.courant >= 0 ? album.courant : pageDepart();
  aller(i, { instant: true });
  reobserver();
}

/* ------------------------------------------------------------- la fiche

 * Une seule fiche, montée ici **par-dessus le classeur**.
 *
 * La grille reste donc derrière, la croix referme, rien ne recharge. Et
 * l'adresse suit : `/fanzzy/TR8` s'écrit dans la barre, se partage, se met en
 * favori, et le bouton retour du téléphone referme le panneau au lieu de
 * quitter le classeur.
 */

/**
 * Le haut de la fiche : le bas de la barre du jeu (voir `#detail`).
 *
 * Mesuré et non écrit en dur : la barre a la hauteur de son contenu, plus la
 * marge de l'encoche du téléphone. Elle arrive quand nav.js a entendu le
 * serveur — parfois après la fiche, quand on arrive par l'historique — et
 * peut changer de hauteur avec l'écran : on la suit. Sans barre, la fiche
 * prend toute la colonne.
 */
function calerFiche() {
  const app = $('app');
  const haut = app.querySelector(':scope > .tbf-haut');
  const y = haut ? Math.max(0, Math.round(haut.getBoundingClientRect().bottom - app.getBoundingClientRect().top)) : 0;
  $('detail').style.setProperty('--sous-barre', `${y}px`);
}
{
  const taille = 'ResizeObserver' in window ? new ResizeObserver(() => calerFiche()) : null;
  const suivre = () => {
    const haut = $('app').querySelector(':scope > .tbf-haut');
    if (haut) taille?.observe(haut);
    calerFiche();
  };
  new MutationObserver(suivre).observe($('app'), { childList: true });
  addEventListener('resize', calerFiche);
  suivre();
}

/* Ce qui avait le focus quand la fiche s'est ouverte : le classeur se cache
   sous elle, et le clavier doit retrouver sa case en la refermant. */
let focusAvant = null;

function ouvrirFiche(id, pousser = true) {
  const n = $('detail');
  if (!n.classList.contains('on')) {
    const f = document.activeElement;
    focusAvant = f && f !== document.body && f.closest?.('.screen, .rail') ? f : null;
  }
  calerFiche();
  $('app').classList.add('fiche-ouverte');
  n.classList.add('on');
  n.innerHTML = '';
  /* L'adresse est poussée **avant** le chargement : une fiche qui met une
     seconde à venir doit déjà être refermable par le bouton retour. */
  if (pousser && history.state?.fiche !== id) {
    history.pushState({ fiche: id }, '', '/fanzzy/' + encodeURIComponent(id));
  }
  return window.TBF_FICHE.ouvrir(n, id, {
    fermer: fermerFiche,
    // La collection a pu changer — un Fanzzy équipé, un âge acheté. La grille
    // et l'écran « Mon Fanzzy » lisent la même chose : on les relit.
    change: () => { load().catch(() => {}); },
  });
}

/**
 * Refermer.
 *
 * On repasse par l'historique quand c'est nous qui l'avons poussé : sans ça,
 * la croix laisserait `/fanzzy/TR8` dans la barre d'adresse sur une grille
 * ouverte, et le bouton retour rouvrirait une fiche qu'on vient de fermer.
 */
function fermerFiche() {
  if (history.state?.fiche) { history.back(); return; }
  rangerFiche();
}
function rangerFiche() {
  $('detail').classList.remove('on');
  $('detail').innerHTML = '';
  $('app').classList.remove('fiche-ouverte');
  if (focusAvant?.isConnected && !focusAvant.closest('[inert]')) focusAvant.focus({ preventScroll: true });
  focusAvant = null;
  // Les cartes qui étaient sous la fiche se voient de nouveau.
  reobserver();
}

window.addEventListener('popstate', (e) => {
  if (e.state?.fiche) ouvrirFiche(e.state.fiche, false);
  else rangerFiche();
});

// Échap referme, comme partout ailleurs dans le jeu.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('detail').classList.contains('on')) fermerFiche();
});

/* On peut arriver sur le classeur par une adresse de fiche — un lien partagé
   suivi d'un retour arrière, par exemple. L'état de l'historique fait foi. */
if (history.state?.fiche) ouvrirFiche(history.state.fiche, false);

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2400);
}

/* ============================================================ la poche

   Le bandeau du vestiaire : les écharpes, la réserve de boosters (la brique
   `.tbf-monnaie.tbf-boosters`, forme « compte », le temps seul sans le mot)
   et l'anneau du classeur.

   **La durée vient du serveur, le décompte de la page** (R3) : on retient
   `wallet.nextPackInMs` et l'instant de sa lecture (`performance.now()`, que
   l'heure du téléphone ne déplace pas), et le reste se calcule à chaque
   seconde. À zéro, la page relit au lieu de conclure. Réserve pleine : ni
   anneau ni temps, jamais « 0:00 ». Sans `cadenceMs`, pas d'anneau — sa part
   ne se calcule pas — mais le temps servi reste. */
let lu = { ms: null, t: 0 };
const restantMs = () => (lu.ms == null ? null : Math.max(0, lu.ms - (performance.now() - lu.t)));
function noterRecharge() {
  const v = S.nextIn;
  lu = { ms: v == null || !Number.isFinite(Number(v)) ? null : Math.max(0, Number(v)), t: performance.now() };
}
/** « 9:55 », ou « 1 h 04 » au-delà d'une heure (les deux points disent
    minutes-secondes, et « 64:28 » se lit comme une horloge cassée). */
function quand(ms) {
  const s = Math.ceil(ms / 1000);
  const mm = Math.floor(s / 60);
  return mm >= 60 ? `${Math.floor(mm / 60)} h ${String(mm % 60).padStart(2, '0')}`
    : `${mm}:${String(s % 60).padStart(2, '0')}`;
}
function enMots(ms) {
  const mm = Math.ceil(ms / 60000);
  if (mm <= 1) return 'moins d’une minute';
  if (mm < 60) return `${mm} minutes`;
  return `${Math.floor(mm / 60)} h ${String(mm % 60).padStart(2, '0')}`;
}

/* La relecture de l'état, une seule à la fois et pas deux fois en dix
   secondes : un serveur qui répond « zéro » à nouveau ne doit pas se faire
   relire à chaque seconde. Elle annonce `tbf:bourse`, qui redessine. */
let relecture = null;
let derniereRelecture = -Infinity;
function relire() {
  if (relecture || performance.now() - derniereRelecture < 10_000) return;
  derniereRelecture = performance.now();
  relecture = load().catch(() => {}).finally(() => { relecture = null; });
}

const anneau = document.createElement('span');
anneau.className = 'tbf-recharge';
anneau.setAttribute('aria-hidden', 'true');
const prochain = document.createElement('span');
prochain.className = 'tbf-reserve-prochain';
prochain.setAttribute('aria-hidden', 'true');
prochain.append(document.createElement('b'));
let poche = null;    // ce que la poche montrait, pour compter jusqu'au nouveau

/** Un chiffre qui change compte jusqu'à sa nouvelle valeur, et frémit. */
function poserChiffre(a, avant, apres) {
  const b = a.querySelector('b');
  if (avant !== null && avant !== apres && window.FX?.compter) {
    window.FX.compter(b, avant, apres);
    a.classList.remove('tbf-vibre');
    void a.offsetWidth;
    a.classList.add('tbf-vibre');
  } else b.textContent = String(apres);
}

function rendreBourse() {
  /* `avatar` n'est posé que par `load()` : avant, l'état porte des valeurs
     de départ — zéro écharpe, la réserve pleine — qui ne sont pas celles du
     joueur. */
  if (!('avatar' in S)) return;
  const el = $('bourse');
  const ech = Math.max(0, Math.floor(Number(S.scarves) || 0));
  const n = Math.max(0, Math.floor(Number(S.packs) || 0));
  const miens = PERSOS.filter((f) => S.col?.[f.id]).length;
  const total = Math.max(Number(S.aCollectionner) || 0, miens);
  if (!el.firstChild) {
    /* Le sachet de la première série ouverte, s'il est dessiné ; sinon celui
       que la brique peint. */
    const set = SETS[0];
    const sachet = set && ART[set.id] ? `--sachet:url(/${src(ART[set.id])})` : '';
    el.innerHTML = `<a class="tbf-monnaie" href="/boutique" id="pEch"><img src="/img/gains/echarpes.webp" alt=""><b></b></a>
      <a class="tbf-monnaie tbf-boosters" href="/boosters" id="pPacks"${sachet ? ` style="${sachet}"` : ''}><span
        class="tbf-fente" aria-hidden="true"></span><b></b></a>
      <a class="tbf-cercle" href="/fanzzy?ecran=dex" id="pClasseur"><b></b><small></small></a>`;
    el.addEventListener('animationend', (e) => {
      if (e.animationName === 'tbf-vibre') e.target.classList.remove('tbf-vibre');
    });
    /* L'anneau du classeur ouvre l'onglet voisin, sans recharger la page ;
       son adresse reste celle d'un vrai lien. */
    $('pClasseur').addEventListener('click', (e) => { e.preventDefault(); montrerEcran('dex'); });
  }
  poserChiffre($('pEch'), poche?.ech ?? null, ech);
  poserChiffre($('pPacks'), poche?.n ?? null, n);
  $('pEch').setAttribute('aria-label', pluriel(ech, 'écharpe', 'écharpes'));
  $('pPacks').querySelector('.tbf-fente').classList.toggle('tbf-fente--vide', n <= 0);
  const c = $('pClasseur');
  c.style.setProperty('--part', total ? (miens / total).toFixed(3) : '0');
  c.querySelector('b').textContent = String(miens);
  c.querySelector('small').textContent = `/${total}`;
  c.setAttribute('aria-label', `Le classeur : ${miens} sur ${total}`);
  poche = { ech, n };
  tic();
}

/** Chaque seconde : l'anneau, le temps, et ce qu'on en dit (à la minute). */
function tic() {
  const a = $('pPacks');
  if (!a) return;
  const reste = restantMs();
  const vient = reste !== null && reste > 0;
  const cadence = Number(S.cadenceMs);
  if (vient && cadence > 0) {
    if (!anneau.isConnected) a.querySelector('b').after(anneau);
    anneau.style.setProperty('--part', clamp(1 - reste / cadence, 0, 1).toFixed(3));
  } else anneau.remove();
  if (vient) {
    if (!prochain.isConnected) a.append(prochain);
    prochain.firstChild.textContent = quand(reste);
  } else prochain.remove();
  const n = poche?.n ?? 0;
  const max = Number(S.packMax) > 0 ? Number(S.packMax) : null;
  const mots = `${n ? pluriel(n, 'booster', 'boosters') : 'Aucun booster'}${max ? ` sur ${max}` : ''}`
    + (reste === null ? ' — la réserve est pleine' : vient ? ` — le prochain dans ${enMots(reste)}` : '');
  if (a.getAttribute('aria-label') !== mots) a.setAttribute('aria-label', mots);
  if (reste === 0) relire();
}
setInterval(() => { if (!document.hidden && $('s-equipe').classList.contains('on')) tic(); }, 1000);

/* ======================================================== le vestiaire

   L'écran d'ouverture : le Fanzzy qu'on montre aux autres, **en pied** et
   non sa carte, dans la bâche de sa rareté. La carte a sa place dans le
   classeur, où l'on compare cent cinquante personnages entre eux ; ici on
   n'en regarde qu'un.

   Il hérite de deux écrans déjà faits — la respiration et le salut de
   l'accueil (`fanzzy-scene.js`). C'est le même personnage aux deux
   endroits : animé autrement, ce serait deux personnages. */

/**
 * **Le décor de l'avatar**, pas celui de la carte : la tenue portée et l'âge
 * montré, dont il tire son palier. Un joueur en tenue préhistorique ne se
 * tient pas dans le gradin de tous les jours.
 */
function decorDe(f, age) {
  const av = S.avatar?.id === f.id ? S.avatar : null;
  const vu = (av?.age && BY_ID.get(av.age)) || age;
  return { ...vu, stage: av?.evo ?? vu.stage, skin: av?.skin ?? 'base' };
}

/* Ce que l'écran montrait : il ne se refait que si le personnage, son âge ou
   son avatar ont changé. Le refaire, c'est refaire la scène — le personnage
   repartait de zéro à chaque relecture de l'état. */
let sigEquipe = '';

/**
 * La place vide (voir `#tvide`) : sans carte, le premier booster ; avec des
 * cartes et sans avatar, le classeur où le choisir.
 *
 * **La réserve en sticker**, seulement s'il y a quelque chose dedans : une
 * ligne sans donnée disparaît, et « 0 » sur la bâche dirait qu'elle ne mène
 * à rien — le kiosque dit, lui, quand vient le prochain. Le compte est dans
 * le nom du lien : le sticker est peint par la feuille.
 */
function placeVideHTML(aDesCartes, n) {
  const geste = aDesCartes
    ? '<a class="tbf-plaque tbf-bloc" data-ton="bleu" href="/fanzzy?ecran=dex" data-go="dex">CHOISIR DANS LE CLASSEUR</a>'
    : `<a class="tbf-plaque tbf-bloc" data-ton="or" href="/boosters"${n > 0
      ? ` data-pastille="${n}" aria-label="Ouvrir mon premier booster — ${pluriel(n, 'booster', 'boosters')} en réserve"`
      : ''}>OUVRIR MON PREMIER BOOSTER</a>`;
  return `<div class="tbf-vestiaire" id="tvide" style="${echarpeDe(SETS[0])}">
      <div class="tbf-vestiaire-fond"><img src="/img/place-vide.webp" alt="" decoding="async"></div>
      <p class="tvide-mot"><span class="tbf-scotch" aria-hidden="true"></span><span
        class="tbf-marqueur">TA PLACE EST VIDE</span></p>
    </div>
    <div class="tbtns">${geste}</div>`;
}

/* CHOISIR DANS LE CLASSEUR ouvre l'onglet voisin sans recharger la page,
   comme l'anneau de la poche ; son adresse reste celle d'un vrai lien. */
$('teamBody').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-go]');
  if (!a) return;
  e.preventDefault();
  montrerEcran(a.dataset.go);
});

function renderTeam() {
  rendreBourse();
  const f = S.active ? BY_ID.get(S.active) : null;
  if (!f || !S.col?.[f.id]) {
    const aDesCartes = PERSOS.some((x) => S.col?.[x.id]);
    const n = aDesCartes ? 0 : Math.max(0, Math.floor(Number(S.packs) || 0));
    const sig = JSON.stringify(['vide', aDesCartes, n]);
    if (sigEquipe !== sig) {
      sceneEquipe?.arreter?.();
      sceneEquipe = null;
      $('teamBody').innerHTML = placeVideHTML(aDesCartes, n);
      sigEquipe = sig;
    }
    return;
  }
  const stade = atteint(f.id);
  /* **L'âge montré**, celui de l'avatar : quelqu'un peut préférer se montrer
     jeune, et l'écran qui s'appelle « TON AVATAR » doit montrer exactement
     ce que voient l'accueil et les amis — son nom, sa rareté, son cri. */
  const montre = (S.avatar?.id === f.id && BY_ID.get(S.avatar.age)) || ageDe(f);
  const sig = JSON.stringify([f.id, stade, montre.id, S.avatar ?? null]);
  if (sig === sigEquipe) return;
  sigEquipe = sig;

  const t = TYPES[montre.type] ?? null;
  const set = SETS_TOUTES.find((s) => s.id === montre.set);
  const echarpe = echarpeDe(set);
  const ages = lineOf(f).length;
  const puissance = Number(montre.cri?.power);
  /* **Les stickers de stats : une ligne sans donnée disparaît, jamais un
     tiret.** La poussée du cri sur son écharpe fine (sur cent : le cri le plus
     fort du catalogue fait quatre-vingt-dix-neuf), la famille et son pin,
     l'étage atteint en nœuds — sans étage pour une légendaire, qui n'en a
     qu'un. */
  const stats = [
    Number.isFinite(puissance) && puissance > 0
      ? `<span class="tbf-sticker">POUSSÉE ${puissance}<span class="tbf-jauge tbf-jauge--fine" aria-hidden="true"><i
          style="width:${Math.min(100, puissance)}%"></i></span></span>` : '',
    t?.nom ? `<span class="tbf-sticker"><span class="tbf-pin"${teinte(t.c) ? ` style="--fam:${t.c}"` : ''}
        aria-hidden="true">${window.TBF_LOGO?.type?.(montre.type, '') ?? ''}</span>${esc(t.nom)}</span>` : '',
    ages > 1 ? `<span class="tbf-sticker">ÉTAGE<span class="tbf-etage" data-n="${stade}" role="img"
        aria-label="${stade} sur ${ages}">${'<i></i>'.repeat(ages)}</span></span>` : '',
  ].join('');

  $('teamBody').innerHTML = `
    <a class="tbf-vestiaire" id="tscene" data-rar="${esc(montre.rar ?? 'commune')}" style="${echarpe}"
       href="/fanzzy/${esc(f.id)}" aria-label="Ouvrir la fiche de ${esc(montre.nom)}">
      <div class="tbf-vestiaire-fond">
        <div class="fond">${artFond(decorDe(f, montre))}</div>
        <div class="tpile" id="tpile"></div>
      </div>
      ${formeHTML(montre.rar)}
      <span class="tbf-sticker">TON AVATAR</span>
      <div class="tbf-vestiaire-pied">
        <h2 class="tbf-banderole">${esc(montre.nom)}</h2>
        ${stats ? `<div class="tbf-vestiaire-stats">${stats}</div>` : ''}
      </div>
    </a>
    ${montre.cri?.label ? `<button type="button" class="tbf-cri" id="cri" style="${echarpe}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
      <small>CRI</small><b>${esc(montre.cri.label)}</b></button>` : ''}
    <!-- Jouer est rouge, partout dans le jeu : l'entrée en duel porte le ton
         « flare ». La fiche est une consultation, elle reste en béton. -->
    <div class="tbtns">
      <button type="button" class="tbf-plaque tbf-bloc" data-ton="flare" id="goDuel">ENTRER EN DUEL</button>
      <a class="tbf-plaque tbf-bloc" href="/fanzzy/${esc(f.id)}">SA FICHE</a>
    </div>`;

  /* Le Fanzzy équipé est déjà connu du serveur : le duel le lira lui-même.
     Le duel se joue sur `/duel-nvn` (`/duel` n'existe pas). */
  $('goDuel').onclick = () => { location.href = '/duel-nvn'; };
  /* Toucher la bande lance le cri, à la couleur de la famille, et le
     personnage saute. */
  const cri = $('cri');
  if (cri) {
    cri.onclick = () => {
      window.FX?.cri?.(montre.cri.label, teinte(t?.c) ? { couleur: t.c } : {});
      sceneEquipe?.saute?.();
    };
  }
  poserMinis();
  void chargerDeck();
  habiller(f, montre, stade);
}

/* ------------------------------------------------- les bustes du deck

   Collés sur ENTRER EN DUEL : les trois premiers Fanzzy du deck, le
   titulaire cerclé de vert (`.tbf-minis`). Lu une fois par visite sur la
   route la plus légère qui le dise (`/api/deck/loadout` : le deck et les
   âges) ; sans deck, ou en panne, pas de bustes — le mot suffit. */
let deckIds = null;
async function chargerDeck() {
  if (deckIds !== null) return;
  deckIds = [];
  try {
    const r = await fetch('/api/deck/loadout', { credentials: 'same-origin' });
    const j = r.ok ? await r.json().catch(() => null) : null;
    deckIds = Array.isArray(j?.fanzzy)
      ? j.fanzzy.map((x) => x?.id).filter((id) => typeof id === 'string' && BY_ID.has(id)).slice(0, 3) : [];
  } catch { deckIds = []; }
  poserMinis();
}
function poserMinis() {
  const b = $('goDuel');
  if (!b) return;
  b.querySelector('.tbf-minis')?.remove();
  if (!deckIds?.length) return;
  /* L'initiale sous l'image : si le buste ne répond pas, il reste quelqu'un
     dans le rond (sans l'article : « L » ne désigne personne). */
  const initiale = (nom) => String(nom ?? '').replace(/^(l[ea]s?\s+|l[’']\s*)/i, '').charAt(0);
  const bustes = deckIds.map((id, i) => {
    const img = window.FZART?.adresse?.(id, 'buste');
    return `<span class="tbf-buste"${i === 0 ? ' data-titulaire' : ''}>${esc(initiale(BY_ID.get(id)?.nom))}${
      img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  }).join('');
  b.insertAdjacentHTML('beforeend', `<span class="tbf-minis" aria-hidden="true">${bustes}</span>`);
}

/* Le rendu peut repartir pendant qu'une image charge — on choisit un autre
   Fanzzy, on le fait évoluer. La scène est refaite avec le reste de l'écran :
   c'est elle, et non un jeton, qui garantit qu'une image en retard n'atterrit
   pas dans un écran qui ne l'attend plus. L'ancienne est arrêtée : sa
   minuterie de gestes tournerait sinon pour un personnage parti. */
let sceneEquipe = null;

/**
 * Pose le personnage dans sa boîte.
 *
 * Le repli descend d'un cran à la fois : les douze états, puis le plein-pied,
 * puis le dessin procédural — qui vaut toujours mieux qu'un cadre vide. Les
 * deux premiers viennent de `fanzzy-scene.js`, partagé avec le virage ; le
 * troisième reste ici, parce que le dessin procédural a besoin de la fiche
 * complète du catalogue et que le virage, lui, ne l'a pas.
 *
 * `perso` est **la lignée**, `age` la carte du catalogue à l'âge montré. Les
 * états sont rangés sous la première, l'illustration en pied sous la seconde :
 * confondre les deux montre le Choriste à qui a payé pour le Meneur de chant.
 */
async function habiller(perso, age, stade) {
  sceneEquipe?.arreter?.();
  /* C'est l'écran du personnage : il répond au toucher. Ailleurs la zone
     sert à autre chose, et un saut non demandé s'y lirait comme un défaut. */
  sceneEquipe = window.TBF_SCENE?.creer?.($('tpile'), { fond: 'neutre', reagitAuToucher: true }) ?? null;
  /* L'avatar tel que le serveur le résout — âge, tenue **et expression**. */
  const vu = await sceneEquipe?.definir(S.avatar?.id === perso.id ? S.avatar
    : { id: perso.id, age: age.id, evo: stade, skin: 'base' });
  if (vu) return;
  // Ni états ni illustration : le dessin géométrique, comme dans la grille.
  const pile = $('tpile');
  if (pile) pile.innerHTML = `<div class="tdessin">${artProcedural(age)}</div>`;
}

/* ----------------------------------------------------------------- nav */

let pret = false;
function montrerEcran(nom) {
  document.querySelectorAll('.screen').forEach((x) => x.classList.toggle('on', x.id === 's-' + nom));
  document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x.dataset.go === nom));
  if (!pret) return;
  if (nom === 'dex') ouvrirClasseur();
  else { renderTeam(); tic(); }
}

/* Le classeur est atteignable par son adresse : la barre du deck y renvoie,
   et quelqu un qui met le classeur en favori doit y revenir, pas atterrir sur
   son personnage. */
{
  const veut = new URLSearchParams(location.search).get('ecran');
  if (veut === 'dex' || veut === 'equipe') montrerEcran(veut);
}

document.querySelectorAll('.nav button').forEach((b) => {
  b.onclick = () => montrerEcran(b.dataset.go);
});

/* ------------------------------------------------------ les cartes vues

   Le « +N » de la tuile FANZZY, sur l'accueil, a un repli quand le serveur
   ne sert pas `nouveautes` : les cartes arrivées depuis la dernière fois
   qu'on a regardé sa collection, retenues sur l'appareil. Être sur cette
   page, c'est les avoir vues.

   **La même clé et la même forme que l'accueil** (`tbf.vus` :
   `{ qui, ids }`, voir `nouveautes` dans index.html) : `qui` est l'id de
   `/api/auth/me`, `ids` les clés de `collection` de `/api/fanzzy/state` —
   la route que `load()` vient de lire. Deux formes différentes feraient
   repartir l'accueil de zéro à chaque passage.

   « Qui es-tu ? » passe par `window.TBF_MOI`, la promesse que `nav.js` pose
   sous ce nom : une seule question au serveur pour toute la page. Sans id,
   on n'écrit rien : l'accueil prendrait une clé sans propriétaire pour celle
   d'un autre joueur, et repartirait de zéro. */
function marquerVues() {
  const ids = Object.keys(S.col ?? {});
  (window.TBF_MOI ??= fetch('/api/auth/me', { credentials: 'same-origin' })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => j?.user ?? null)
    .catch(() => null))
    .then((u) => {
      if (u?.id === undefined || u?.id === null) return;
      try { localStorage.setItem('tbf.vus', JSON.stringify({ qui: u.id, ids })); }
      catch { /* stockage refusé : l'accueil gardera son « +N », sans plus */ }
    })
    .catch(() => {});
}

/* Revenu d'un onglet caché plus d'une minute : la réserve a pu se remplir
   côté serveur (R3). Le décompte, lui, reprend juste. Et ce qui a été montré
   part s'éteindre avant qu'on quitte (`keepalive`). */
let cacheDepuis = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cacheDepuis = performance.now(); void eteindre(); return; }
  if (cacheDepuis && performance.now() - cacheDepuis > 60_000 && pret) relire();
  if ($('s-dex').classList.contains('on')) reobserver();
  tic();
});
addEventListener('pagehide', () => { void eteindre(); });

/* ---------------------------------------------------------------- init */

/* Le décor est posé par nav.js, comme sur toutes les autres pages : même
   photo, même voile. */

(async () => {
  try {
    /* **Le manifeste des etats d’abord.** Il porte les dessins des ages
       superieurs — voir `adresse` dans fanzzy-art.js. Sans lui, le premier
       rendu prend le repli, c’est-a-dire le visage du premier age, et rien ne
       vient le corriger ensuite. Il ne leve jamais : absent, la page
       s’affiche exactement comme avant. */
    await Promise.resolve(window.TBF_ETATS?.charger?.()).catch(() => null);
    await load();
  } catch (e) {
    if (e.message === 'auth') return;
    // Le catalogue vient du réseau depuis qu'il n'est plus recopié ici : une
    // page qui échoue à le charger n'a rien à afficher, et un « serveur
    // injoignable » générique ferait chercher au mauvais endroit. On nomme la
    // cause, et on l'écrit sur les deux écrans plutôt que dans un toast qui
    // s'efface au bout de trois secondes.
    const cause = e.code ?? e.message ?? 'cause inconnue';
    const panne = `<div class="empty" style="padding:40px 20px;line-height:1.8">
        Le classeur n’a pas pu charger le catalogue.<br>
        <span>${esc(cause)}</span><br>
        <a href="" style="color:var(--craie);font-weight:700">réessayer</a></div>`;
    $('grid').innerHTML = panne;
    $('teamBody').innerHTML = panne;
    toast(`Catalogue indisponible : ${cause}`);
    return;
  }
  /* Le carrousel et le kiosque ont leur écran à eux — voir /boosters. Cette
     page dessine le vestiaire et le classeur, et rien d autre. */
  pret = true;
  noterRecharge();
  renderTeam();
  if ($('s-dex').classList.contains('on')) ouvrirClasseur();
  majOnglet();
  marquerVues();

  /* ================== et elle se redessine quand l'état change

     `load()` relit la collection et les étages, puis émet `tbf:bourse` en
     laissant chaque écran redessiner ce qu'il a. On payait une évolution
     depuis la fiche, le serveur l'enregistrait, les données étaient à jour
     dans la page — et la grille, qui n'écoutait pas, laissait l'âge acheté
     sous cadenas jusqu'au prochain rafraîchissement. Le joueur conclut que
     l'achat a échoué.

     On redessine les surfaces de cette page, et seulement ce qui a changé :
     la poche, le personnage équipé, les pages montées du classeur (chacune
     par sa signature), et le compte de l'onglet. */
  addEventListener('tbf:bourse', () => {
    try {
      noterRecharge();
      renderTeam();
      if ($('s-dex').classList.contains('on')) {
        if (construireAlbum()) ouvrirClasseur();
        else if (album.courant >= 0) placer(album.courant);
      }
      majOnglet();
    } catch (e) { console.error('[classeur] redessin', e); }
    /* Une carte arrivée pendant qu'on est ici est vue, elle aussi. */
    marquerVues();
  });
})();
</script>
