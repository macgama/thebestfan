<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fanzzy — collection</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/cartes.css">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;overflow:hidden}
/* Le fond opaque a disparu : il recouvrait le décor de tribune commun, et la
   page se retrouvait seule sur un aplat noir pendant que toutes les autres
   étaient posées sur le stade. Il ne reste que la lueur chaude du haut, qui
   éclaire le kiosque sans rien cacher.

   `padding-bottom` : la page fait exactement une hauteur d'écran et ne défile
   pas, donc rien ne la décale au-dessus de la barre du bas — le bouton
   « ouvrir le booster » passait dessous. */
#app{position:relative;width:100%;max-width:440px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom));
  background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%)}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 6px;flex:none;z-index:4}
.mark{font-family:var(--banner);font-weight:700;font-size:20px;letter-spacing:.16em;line-height:1}
.mark small{display:block;font-size:8.5px;letter-spacing:.3em;opacity:.5;font-weight:400;margin-top:3px}

.screen{flex:1;display:none;flex-direction:column;min-height:0;z-index:2}
.screen.on{display:flex}


/* ------------------------------------------------------------------ dex */
/* ------------------------------------------------------- l'en-tête

   Une jauge de cinq pixels et « 14/152 » en gris : c'était exact et ça ne
   disait rien. Dans ce genre de jeu, la progression est la récompense — elle
   se met en gros, elle a de la matière, et elle annonce ce qui reste plutôt
   que ce qui est fait. « 138 à trouver » se lit comme un programme ; « 9 % »
   se lit comme une note. */
.head{padding:4px 16px 0;flex:none}
.head .l{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.head h2{font-family:var(--banner);font-size:19px;letter-spacing:.12em;margin:0;flex:1}
.head .n{font-family:var(--banner);font-size:25px;line-height:.9;color:var(--projo);
  font-variant-numeric:tabular-nums}
.head .reste{font-size:10.5px;letter-spacing:.1em;opacity:.5;text-align:right;
  line-height:1.1;margin:6px 0 10px}
.progress{margin:0}
.progress .bar{position:relative;height:13px;border-radius:8px;overflow:hidden;
  background:#0A0E14;box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 1px 0 rgba(242,238,228,.08)}
.progress .bar i{display:block;height:100%;width:0;border-radius:8px;
  background:linear-gradient(180deg,#FFDC7A,var(--projo) 45%,#D9932A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 12px rgba(245,195,59,.45);
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
/* L'éclat qui balaie la barre : c'est ce qui la fait vivre entre deux
   ouvertures de booster, quand rien ne bouge. */
.progress .bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);
  background-size:260% 100%;animation:jauge 3.4s ease-in-out infinite}
@keyframes jauge{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* Des onglets qu'on enfonce, pas des étiquettes. Le biseau du bas disparaît à
   l'appui et le bouton descend : c'est le seul retour tactile dont dispose
   une page web, et c'est celui que ces jeux emploient partout. */
.filt{white-space:nowrap;font-family:var(--banner);font-size:11.5px;letter-spacing:.08em;
  padding:8px 13px 7px;border-radius:10px;cursor:pointer;border:0;color:inherit;
  background:rgba(16,22,31,.9);box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(242,238,228,.09);
  opacity:.62;transition:transform .1s,box-shadow .1s,opacity .1s}
.filt:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.55)}
.filt.on{opacity:1;color:#0B0E13;background:var(--fc,var(--craie));
  box-shadow:0 3px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 9px;padding:2px 14px 22px;
  overflow-y:auto;flex:1}
/* Le socle dur déborde sous la carte : la case lui garde sa place, sinon la
   rangée suivante mange le biseau et les cartes paraissent rognées. */
.slot{position:relative;aspect-ratio:63/88;border-radius:6px;cursor:pointer;
  transition:transform .11s cubic-bezier(.3,1.5,.5,1)}
.slot:active{transform:translateY(3px) scale(.975)}

/* Les cases vides.

   Elles étaient des rectangles pointillés avec un nom en gris. Neuf cases sur
   douze à l'écran, et la grille ressemblait à un formulaire à remplir plutôt
   qu'à une collection. Surtout, elles ne donnaient **aucune envie** : on ne
   désire pas un rectangle.

   Le personnage est donc là, en ombre, dans son cadre éteint. On voit ce qu'on
   n'a pas — c'est tout le ressort du genre, et ça ne coûte rien de plus : le
   dessin existe déjà, `loading="lazy"` ne charge que ce qui est à l'écran. */
.slot.locked .fz{cursor:pointer;
  box-shadow:inset 0 0 0 calc(1.1 * var(--u)) rgba(242,238,228,.13),
             inset 0 0 calc(7 * var(--u)) rgba(0,0,0,.5),
             0 calc(1.2 * var(--u)) 0 rgba(242,238,228,.07),
             0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.45)}
/* Assez sombre pour dire « pas à toi », assez clair pour qu'on reconnaisse le
   personnage. À trois dixièmes de luminosité le visage disparaissait, et une
   silhouette qu'on ne distingue pas ne vaut pas mieux qu'une case vide. */
.slot.locked .art{filter:grayscale(1) brightness(.46) contrast(1.15)}
.slot.locked .top::before,.slot.locked .foot,.slot.locked .pip{display:none}
.slot.locked .nm{opacity:.72}
.slot.locked .cadenas{position:absolute;left:50%;top:40%;z-index:4;width:calc(13 * var(--u));height:calc(13 * var(--u));
  transform:translate(-50%,-50%);opacity:.75;stroke:#F2EEE4;fill:none;stroke-width:2;
  filter:drop-shadow(0 .calc(5 * var(--u)) calc(1.5 * var(--u)) rgba(0,0,0,.9))}
.dupe{position:absolute;right:3px;bottom:3px;background:rgba(8,10,13,.9);border:1px solid rgba(242,238,228,.28);
  border-radius:3px;font-family:var(--banner);font-size:9.5px;padding:0 4px;z-index:4}
/* Le stade atteint : une étoile pour rare, deux pour épique. En haut à droite,
   là où rien d'autre ne s'affiche — le compteur de doublons tient le bas et le
   marqueur de duel le coin gauche. */
.stade{position:absolute;right:3px;top:3px;color:var(--projo);font-size:10px;line-height:1;
  letter-spacing:-1px;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:4}
.active-tag{position:absolute;left:3px;top:3px;background:var(--projo);color:#0B0E13;border-radius:3px;
  font-family:var(--banner);font-size:8.5px;padding:1px 5px;z-index:4;letter-spacing:.06em}
.empty{grid-column:1/-1;text-align:center;padding:44px 22px;opacity:.5;font-size:12.5px;line-height:1.7}

/* ---------------------------------------------------------- ouverture */
#opener{position:absolute;inset:0;z-index:22;display:none;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 20%,#1D242D,#05070A 70%)}
#opener.on{display:flex}
.ohead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-size:11.5px;opacity:.6}
.ohead button{background:none;border:0;color:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.ostage{flex:1;display:grid;place-items:center;position:relative;padding:0 34px}
.reveal{width:min(70%,250px);position:absolute;transition:transform .42s cubic-bezier(.2,.8,.25,1),opacity .3s;cursor:pointer}
.reveal .flip{position:relative;width:100%;aspect-ratio:63/88;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.reveal.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4%}
.face.back{background:linear-gradient(160deg,#20262F,#0D1116);border:2px solid #39414E;display:grid;
  place-items:center;box-shadow:0 18px 36px rgba(0,0,0,.6)}
.face.front{transform:rotateY(180deg)}
.burst{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:30}
.newtag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:var(--banner);
  font-size:11px;letter-spacing:.2em;color:var(--projo)}
.ofoot{padding:14px 18px 26px;display:flex;flex-direction:column;gap:9px;align-items:center}
.hint{font-size:11.5px;opacity:.5}
.ghost{border:1px solid rgba(242,238,228,.28);border-radius:6px;padding:9px 18px;font-size:12.5px;
  background:none;color:inherit;cursor:pointer;font-family:inherit}
.summary{display:none;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 12px;width:100%}
.summary.on{display:grid}

/* ------------------------------------------------------------- détail */
/* La boîte de la fiche. Elle ne porte plus de marge intérieure : la fiche
   arrange la sienne, et elle est la même à l'adresse /fanzzy/<id>. */
#detail{position:absolute;inset:0;z-index:26;display:none;flex-direction:column;
  background:rgba(5,7,10,.96);backdrop-filter:blur(6px)}
#detail.on{display:flex}
/* Le même bouton que « ouvrir le booster » du kiosque : un socle dur, qui
   s'enfonce à l'appui. Ils étaient plats ici — la fiche paraissait venir
   d'une autre application que la grille qui l'ouvre. */
.dbtn{flex:1;border:0;border-radius:10px;color:inherit;
  padding:13px 10px 12px;font-family:var(--banner);font-size:13px;letter-spacing:.07em;
  cursor:pointer;background:rgba(16,22,31,.95);
  box-shadow:0 4px 0 rgba(0,0,0,.62),inset 0 1px 0 rgba(242,238,228,.13);
  transition:transform .1s,box-shadow .1s}
.dbtn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.62)}
.dbtn.primary{color:#fff;background:linear-gradient(180deg,#F0704F,var(--flare) 55%,#B32A1D);
  box-shadow:0 4px 0 #7A1A11,inset 0 1px 0 rgba(255,255,255,.3)}
.dbtn.primary:active{box-shadow:0 0 0 #7A1A11}
.dbtn:disabled{opacity:.35;pointer-events:none;transform:none}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#171C23;z-index:40;
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;
  display:none;max-width:88%;text-align:center}
.toast.on{display:block;animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}

/* ======================================================== Mon Fanzzy

   L'écran qui ouvre la section : le personnage qu'on emmène en duel, en pied,
   dans le cadre de sa rareté. Il montrait sa carte en vignette au milieu d'une
   colonne de texte — c'est la façon de présenter cent cinquante personnages,
   pas celle d'en présenter un.

   Il hérite de deux écrans déjà faits, et n'invente rien de troisième : le
   cadre de rareté vient de la fiche, la respiration et le coucou viennent de
   l'accueil. Le joueur voit ici le même personnage qu'il verra en arrivant
   sur le jeu ; s'il s'animait autrement, ce serait deux personnages.        */

#teamBody{flex:1;min-height:0;display:flex;flex-direction:column}

.tscene{position:relative;flex:1;min-height:0;margin:2px 14px 0;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,#141A21,#0A0D11);
  box-shadow:inset 0 0 0 2px var(--rc,#C2CAD6),0 5px 0 var(--rc2,#4E5865),
             0 10px 24px rgba(0,0,0,.55)}
.tscene.r-legendaire{box-shadow:inset 0 0 0 2.5px var(--rc),0 5px 0 var(--rc2),
  0 0 34px rgba(245,195,59,.3),0 10px 24px rgba(0,0,0,.55)}
.tscene .fond{position:absolute;inset:0;opacity:.5}
.tscene .fond svg{width:100%;height:100%;display:block}
.tscene .halo{position:absolute;inset:0;opacity:.3;
  background:radial-gradient(70% 54% at 50% 80%,var(--tc,#F5C33B),transparent 70%)}
.tscene .ombre{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(4,6,10,.10) 38%,rgba(4,6,10,.92))}

/* La boîte du personnage. Ce qui vit dedans — les calques de gestes, la
   respiration, le croisement des poses — est monté par `fanzzy-scene.js` et
   habillé par `ui.css` : c'est la même mécanique que dans le virage, et le
   jour où elle change, elle change pour les deux. La page ne décide ici que
   de la place. */
.tpile{position:absolute;left:6%;right:6%;top:5%;bottom:0;z-index:1}
/* Le repli dessiné, pour les personnages qui n'ont ni états ni illustration :
   il tient la même place, pour que l'écran ne change pas de forme selon le
   Fanzzy qu'on a choisi. */
.tdessin{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  width:min(74%,232px);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tdessin svg{width:100%;display:block}

.ttxt{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 14px}
.ttxt h2{font-family:var(--banner);font-size:clamp(21px,6.4vw,28px);margin:0;
  letter-spacing:.03em;line-height:1;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.tpast{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tpast span{border-radius:999px;padding:5px 10px;font-size:11px;background:rgba(4,6,10,.72);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.16)}
.tpast b{color:var(--tc,var(--projo))}
.trar{position:absolute;top:11px;left:11px;z-index:3;display:flex;gap:4px;align-items:center;
  background:rgba(4,6,10,.65);border-radius:99px;padding:6px 10px;line-height:1;
  color:var(--rc,#C2CAD6);box-shadow:inset 0 0 0 1.5px var(--rc,#C2CAD6)}
.trar .d{width:8px;height:8px;background:currentColor;border-radius:1px;
  transform:rotate(45deg);display:block}
.trar .s{font-size:14px;line-height:1}
.ttag{position:absolute;top:11px;right:11px;z-index:3;font-family:var(--banner);font-size:9.5px;
  letter-spacing:.14em;border-radius:6px;padding:5px 9px;background:var(--projo);color:#0B0E13}

/* Ce qu'il change, en une bande de hauteur **fixe**. Sans elle, un Fanzzy à
   cinq effets pousserait le bouton hors de l'écran — et cette page ne défile
   pas, il disparaîtrait pour de bon. */
.teff{flex:none;height:76px;margin:9px 14px 0;padding:9px 10px;
  overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;
  border-radius:12px;background:var(--panneau);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.11)}
.teff span{font-size:11px;line-height:1.25;padding:6px 9px;border-radius:8px;
  background:rgba(242,238,228,.07);box-shadow:inset 0 0 0 1px rgba(242,238,228,.09)}
.teff .rien{opacity:.5;background:none;box-shadow:none}

.tbtns{display:flex;gap:9px;padding:10px 14px 2px;flex:none}
.tbtns .dbtn{display:grid;place-items:center;text-decoration:none}

/* ---------------------------------------------------------------- nav */
/* Onglets en haut plutôt qu'en bas : la barre de navigation commune occupe
   déjà le bas de l'écran, et deux barres superposées se recouvraient — les
   onglets devenaient inatteignables. */
.nav{display:flex;gap:6px;padding:4px 16px 10px;flex:none;z-index:5}
/* `button` **et** `a` : le troisième onglet mène à une autre page, donc c'est
   un lien — et un lien doit l'être, pour qu'on puisse l'ouvrir dans un nouvel
   onglet ou le copier. Ne styler que les boutons laissait le deck en texte nu
   au milieu de deux onglets. */
.nav button,.nav a{flex:1;background:var(--panneau);backdrop-filter:blur(10px);
  border:1px solid rgba(242,238,228,.14);text-decoration:none;
  border-radius:8px;color:inherit;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 4px;font-size:11px;letter-spacing:.08em;font-family:var(--banner);opacity:.55;
  cursor:pointer}
.nav button.on,.nav a.on{background:var(--craie);color:#0B0E13;border-color:var(--craie);opacity:1}
.nav svg{width:15px;height:15px}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app">
  <div class="topbar">
    <div class="mark">FANZZY<small>collection</small></div>
  </div>

  <nav class="nav">
    <!-- L'ordre dit le chemin : mon personnage, puis ma collection, puis le
         kiosque où l'agrandir. Le kiosque venait en premier et « DUEL » en
         dernier — l'écran d'accueil de la section était donc la boutique, et
         le personnage qu'on a choisi, le dernier onglet. On entre chez soi
         avant d'entrer au magasin. -->
    <button data-go="equipe" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>MON FANZZY</button>
    <button data-go="dex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M4 8h4M4 13h4"/></svg>CLASSEUR</button>
    <!-- Le troisième onglet **change de page**, et c est assumé : le deck a
         mille lignes à lui, et les fondre ici ferait un fichier que personne
         ne relit. Les deux écrans portent la même barre, de sorte que le
         passage de l un à l autre ne se voit pas comme un départ. -->
    <a class="go" href="/deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h10v13H4zM8 4h10v13"/></svg>DECK</a>
  </nav>


  <section class="screen" id="s-dex">
    <div class="head">
      <div class="l">
        <h2>LE CLASSEUR</h2>
        <div class="n"><span id="progTxt">0/0</span></div>
      </div>
      <div class="progress"><div class="bar"><i id="progBar"></i></div></div>
      <div class="reste" id="progReste"></div>
    </div>
    <div class="chips" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="screen on" id="s-equipe">
    <div id="teamBody"></div>
  </section>




  <!-- La fiche d un Fanzzy, montée par fanzzy-fiche.js par-dessus la grille.
       Elle était partie avec le bloc de la déchirure : les deux voisinaient
       dans le balisage sans avoir rien à voir. -->
  <div id="detail"></div>
  <div class="toast" id="toast"></div>
</main>

<!-- Sans « defer » : le script en ligne ci-dessous lit FZART dès sa première
     ligne, il doit donc déjà exister. -->
<script src="/fanzzy-art.js"></script>
<!-- Ce que le classeur et les boosters partagent : l état, le catalogue, le
     dessin d une carte. **Après** fanzzy-art.js, dont il lit FZART dès sa
     première ligne — l ordre n est pas un détail de mise en page. -->
<script src="/cartes.js"></script>
<!-- Les dessins de l’équipement : sans eux, une pièce tirée d’un booster
     s’affichait en silhouette procédurale, comme un Fanzzy sans visage. -->
<script src="/stuff-art.js"></script>
<!-- Les douze états du Fanzzy équipé : c'est ce qui fait saluer le personnage
     sur l'écran « Mon Fanzzy », exactement comme sur l'accueil. Le module ne
     lève jamais et ne demande rien tant qu'on ne l'appelle pas. -->
<script src="/fanzzy-etats.js"></script>
<!-- La scène : les calques de gestes et le croisement des poses, partagés
     avec le virage. -->
<script src="/fanzzy-scene.js"></script>
<link rel="stylesheet" href="/fanzzy-fiche.css">
<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en
     panneau par-dessus la grille. -->
<script src="/fanzzy-fiche.js"></script>
<script>
/* =======================================================================
   FANZZY — collection, boosters, évolutions
   Les Fanzzy ne donnent pas de points : ils changent la façon dont tes
   gestes se jouent en duel. La rareté achète du choix, pas de la force —
   c'est ce qui évite qu'acheter des boosters revienne à acheter des victoires.
   ======================================================================= */

/**
 * Visuels générés avec Artlist (Nano Banana Pro).
 *
 * Ils sont ici en lien direct vers le CDN d'Artlist. Avant la mise en ligne,
 * télécharge-les et sers-les depuis /public/img : un CDN tiers ajoute une
 * résolution DNS, une poignée de main TLS et une dépendance que tu ne
 * contrôles pas — trois choses qui coûtent cher au score de performance.
 * Si une image ne charge pas, la page retombe sur l'illustration dessinée en
 * SVG : rien ne casse.
 */
/* Les aides communes vivent dans /cartes.js : l'état, le catalogue, le
   dessin d'une carte, la table des raretés. Le kiosque les partageait sans
   que rien ne le dise ; il a son écran à lui, et elles ont leur fichier. */
const { $, AC, ACTES, ART, BY_ID, DEX, EVO_COST, ILLUSTRES, IMG_EXT, MAXP, PERSOS, RAR, S, SCARVES, SETS, STUFFS, TENUES, TYPES, api, art, artFond, artProcedural, audio, buzz, cardHTML, chargerCatalogue, clamp, esc, illustration, load, modsText, objetHTML, packArt, rarMark, save, seeded, src, uid } = window.TBF_CARTES;


/* ------------------------------------------------------------ classeur */

function renderDex() {
  // L'onglet actif prend la couleur de son type : c'est la même couleur que la
  // pastille des cartes qu'il montre, donc le lien se fait sans légende.
  const chips = [['all','Tout', null],
    ...Object.entries(TYPES).map(([k, t]) => [k, t.nom, t.c]),
    ['miss','Manquants', null]];
  $('filters').innerHTML = chips.map(([k, l, c]) =>
    `<button class="filt ${S.filter === k ? 'on' : ''}" data-f="${k}"
      ${c ? `style="--fc:${c}"` : ''}>${l}</button>`).join('');

  const list = PERSOS.filter((f) => S.filter === 'all' ? true
    : S.filter === 'miss' ? !S.col[f.id] : f.type === S.filter);
  // La progression se compte sur les séries ouvertes, pas sur tout le
  // catalogue : afficher « 31/166 » à quelqu'un qui possède déjà tout ce qu'il
  // peut posséder est le pire message qu'on puisse envoyer à un
  // collectionneur. Les cartes d'une série refermée qu'il possède déjà comptent
  // au numérateur — elles sont à lui — d'où le plafond sur le dénominateur.
  const owned = PERSOS.filter((f) => S.col[f.id]).length;
  const total = Math.max(S.aCollectionner, owned);
  $('progBar').style.width = `${(owned / total) * 100}%`;
  $('progTxt').textContent = `${owned}/${total}`;
  // Ce qui reste, plutôt que le pourcentage fait. « 138 à trouver » se lit
  // comme un programme ; « 9 % » se lit comme une note.
  const reste = Math.max(0, total - owned);
  $('progReste').textContent = reste
    ? `${reste} à trouver` : 'collection complète';

  if (!Object.keys(S.col).length && S.filter !== 'miss') {
    $('grid').insertAdjacentHTML('afterbegin', '');
  }
  $('grid').innerHTML = list.length ? list.map((f, i) => {
    const n = S.col[f.id] ?? 0;
    // Le retard d'entrée est plafonné : sans ce plafond, la cent-cinquantième
    // carte se poserait quatre secondes après la première.
    const retard = ` style="animation-delay:${Math.min(i, 11) * 28}ms"`;
    if (!n) {
      /* Le personnage qu'on n'a pas est là quand même, en ombre. Voir la
         grille : une case vide ne donne envie de rien, une silhouette si. Le
         nom reste dans le texte de la case — c'est ce que le test lit. */
      return `<div class="slot locked" data-open="${f.id}"${retard}>${
        cardHTML(f, { mini: true, verrou: true })}</div>`;
    }
    // La case montre le personnage **tel qu'il est aujourd'hui** : celui qui a
    // payé quatre-vingt-dix écharpes doit voir son Capo, pas le gamin de
    // départ. Le stade se lit alors d'un coup d'œil sur la grille — le seul
    // endroit où le joueur compare ses cartes entre elles.
    const age = ageDe(f);
    const stade = S.stades?.[f.id] ?? 1;
    return `<div class="slot" data-open="${f.id}"${retard}>${cardHTML(age, { mini:true })}
      ${n > 1 ? `<div class="dupe">×${n}</div>` : ''}
      ${stade > 1 ? `<div class="stade">${'★'.repeat(stade - 1)}</div>` : ''}
      ${S.active === f.id ? '<div class="active-tag">DUEL</div>' : ''}</div>`;
  }).join('') : `<div class="empty">${S.filter === 'miss' ? 'Collection complète.' : 'Rien ici pour l\u2019instant.'}</div>`;
}
$('filters').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { S.filter = b.dataset.f; renderDex(); } };
$('grid').onclick = (e) => {
  const s = e.target.closest('[data-open]');
  if (!s) return;
  const f = BY_ID.get(s.dataset.open);
  /* La même fiche pour tous, possédé ou non : elle sait présenter un Fanzzy
     absent de la collection, et c'est même là qu'elle sert le plus — elle dit
     ce qu'il faudrait pour l'avoir. Avant, une carte possédée ouvrait un
     aperçu et une carte manquante changeait de page. */
  ouvrirFiche(f.id);
};

/* -------------------------------------------------------------- lignées */

/**
 * Le personnage à l'âge que le joueur a atteint.
 *
 * Sans stade enregistré, c'est le premier — ce qui est le cas de la très
 * grande majorité de la collection, et le repli naturel pour tout ce que le
 * serveur n'a pas eu le temps de dire.
 */
function ageDe(f) {
  const n = S.stades?.[f.racine ?? f.id] ?? 1;
  return n > 1 ? (lineOf(f)[n - 1] ?? f) : f;
}
function lineOf(f) {
  // Les âges d'un personnage, du premier au dernier, dans l'ordre annoncé par
  // le serveur. On ne remonte plus la chaîne à la main : `racine` et `stade`
  // arrivent avec le catalogue, et deux façons de calculer la même lignée
  // finissent par ne plus donner la même.
  const racine = f.racine ?? f.id;
  return DEX.filter((x) => (x.racine ?? x.id) === racine)
    .sort((a, b) => (a.stade ?? 1) - (b.stade ?? 1));
}

/* ------------------------------------------------------------- la fiche

 * Une seule fiche, montée ici **par-dessus la grille**.
 *
 * Il y en avait deux : cet aperçu, qui ne montrait ni les tenues ni
 * l'équipement, et la page `/fanzzy/<id>` qui montrait tout. Toucher une carte
 * ouvrait le premier, un lien au bas du premier menait au second, et le
 * classeur disparaissait en chemin. Deux rendus de la même carte finissent
 * toujours par ne plus dire la même chose — ils y étaient déjà.
 *
 * La grille reste donc derrière, la croix referme, rien ne recharge. Et
 * l'adresse suit : `/fanzzy/TR8` s'écrit dans la barre, se partage, se met en
 * favori, et le bouton retour du téléphone referme le panneau au lieu de
 * quitter le classeur.
 */

function ouvrirFiche(id, pousser = true) {
  const n = $('detail');
  n.classList.add('on');
  n.innerHTML = '';
  /* L'adresse est poussée **avant** le chargement : une fiche qui met une
     seconde à venir doit déjà être refermable par le bouton retour. */
  if (pousser && history.state?.fiche !== id) {
    history.pushState({ fiche: id }, '', '/fanzzy/' + encodeURIComponent(id));
  }
  return window.TBF_FICHE.ouvrir(n, id, {
    fermer: fermerFiche,
    // La collection a pu changer — un Fanzzy équipé, un âge acheté. La grille
    // et l'écran « Mon Fanzzy » lisent la même chose : on les relit.
    change: () => { load().catch(() => {}); },
  });
}

/**
 * Refermer.
 *
 * On repasse par l'historique quand c'est nous qui l'avons poussé : sans ça,
 * la croix laisserait `/fanzzy/TR8` dans la barre d'adresse sur une grille
 * ouverte, et le bouton retour rouvrirait une fiche qu'on vient de fermer.
 */
function fermerFiche() {
  if (history.state?.fiche) { history.back(); return; }
  rangerFiche();
}
function rangerFiche() {
  $('detail').classList.remove('on');
  $('detail').innerHTML = '';
}

window.addEventListener('popstate', (e) => {
  if (e.state?.fiche) ouvrirFiche(e.state.fiche, false);
  else rangerFiche();
});

// Échap referme, comme partout ailleurs dans le jeu.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('detail').classList.contains('on')) fermerFiche();
});

/* On peut arriver sur le classeur par une adresse de fiche — un lien partagé
   suivi d'un retour arrière, par exemple. L'état de l'historique fait foi. */
if (history.state?.fiche) ouvrirFiche(history.state.fiche, false);

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2400);
}

/* ----------------------------------------------------------- Mon Fanzzy */

/**
 * L'écran d'ouverture : le Fanzzy qu'on emmène en duel.
 *
 * Le personnage **en pied** et non sa carte. La carte a sa place dans la
 * grille, où l'on compare cent cinquante personnages entre eux ; ici on n'en
 * regarde qu'un, et la vignette ne faisait que le rétrécir au milieu d'une
 * colonne de texte. On montre donc l'âge atteint, dans le cadre de sa rareté,
 * et on ne garde autour que ce qu'on veut savoir avant d'entrer : ce qu'il
 * change, et son cri.
 *
 * Il hérite de deux écrans déjà faits — le cadre de la fiche, la respiration
 * et le salut de l'accueil. C'est le même personnage aux deux endroits :
 * animé autrement, ce serait deux personnages.
 */
function renderTeam() {
  const f = S.active ? BY_ID.get(S.active) : null;
  if (!f || !S.col[f.id]) {
    $('teamBody').innerHTML = `<div class="empty" style="padding:44px 22px">
      Aucun Fanzzy choisi.<br>Ouvre un booster, puis choisis-le depuis le classeur.</div>`;
    return;
  }
  // Le personnage **tel qu'il est aujourd'hui** : celui qui a payé ses
  // écharpes doit voir son Capo, pas le gamin de départ. Comme dans la grille.
  const age = ageDe(f);
  const t = TYPES[age.type] ?? { nom: '—', c: 'var(--projo)' };
  const stade = S.stades?.[f.id] ?? 1;
  const effets = modsText(age);
  const possede = S.col[f.id] ?? 1;

  $('teamBody').innerHTML = `
    <div class="tscene r-${age.rar ?? 'commune'}" id="tscene" style="--tc:${t.c}">
      <div class="fond">${artFond(age)}</div>
      <div class="halo"></div>
      <!-- La scène du personnage est montée par fanzzy-scene.js :
           mêmes calques, même respiration que dans le virage. -->
      <div class="tpile" id="tpile"></div>
      <div class="ombre"></div>
      <div class="trar">${rarMark(age.rar)}</div>
      <div class="ttag">EN DUEL</div>
      <div class="ttxt">
        <div class="tpast">
          <span><b>${esc(t.nom)}</b></span>
          <span>Cri : <b>${esc(age.cri?.label ?? '—')}</b> · ${age.cri?.power ?? 0} de poussée</span>
          <span>${possede} exemplaire${possede > 1 ? 's' : ''} · étage ${stade}</span>
        </div>
        <h2>${esc(age.nom)}</h2>
      </div>
    </div>

    <div class="teff">${effets.length
      ? effets.map((e) => `<span>${esc(e)}</span>`).join('')
      : '<span class="rien">Aucun effet particulier : il pousse comme les autres.</span>'}</div>

    <div class="tbtns">
      <button class="dbtn primary" id="goDuel">ENTRER EN DUEL</button>
      <a class="dbtn" href="/fanzzy/${f.id}">SA FICHE</a>
    </div>`;

  // Le Fanzzy équipé est déjà connu du serveur : le duel le lira lui-même.
  $('goDuel').onclick = () => { location.href = '/duel'; };
  habiller(f, age, stade);
}

/* Le rendu peut repartir pendant qu'une image charge — on choisit un autre
   Fanzzy, on le fait évoluer. La scène est refaite avec le reste de l'écran :
   c'est elle, et non un jeton, qui garantit qu'une image en retard n'atterrit
   pas dans un écran qui ne l'attend plus. */
let sceneEquipe = null;

/**
 * Pose le personnage dans sa boîte.
 *
 * Le repli descend d'un cran à la fois : les douze états, puis le plein-pied,
 * puis le dessin procédural — qui vaut toujours mieux qu'un cadre vide. Les
 * deux premiers viennent de `fanzzy-scene.js`, partagé avec le virage ; le
 * troisième reste ici, parce que le dessin procédural a besoin de la fiche
 * complète du catalogue et que le virage, lui, ne l'a pas.
 *
 * `perso` est **la lignée**, `age` la carte du catalogue à l'âge atteint. Les
 * états sont rangés sous la première, l'illustration en pied sous la seconde :
 * confondre les deux montre le Choriste à qui a payé pour le Meneur de chant.
 */
async function habiller(perso, age, stade) {
  sceneEquipe = window.TBF_SCENE?.creer?.($('tpile'), { fond: 'neutre' }) ?? null;
  const vu = await sceneEquipe?.definir({ id: perso.id, age: age.id, evo: stade });
  if (vu) { $('tscene')?.classList.add('entre'); return; }

  // Ni états ni illustration : le dessin géométrique, comme dans la grille.
  $('tpile').innerHTML = `<div class="tdessin">${artProcedural(age)}</div>`;
  $('tscene')?.classList.add('entre');
}
/* ----------------------------------------------------------------- nav */

/* Le classeur est atteignable par son adresse : la barre du deck y renvoie,
   et quelqu un qui met le classeur en favori doit y revenir, pas atterrir sur
   son personnage. */
{
  const veut = new URLSearchParams(location.search).get('ecran');
  if (veut === 'dex' || veut === 'equipe') {
    document.querySelectorAll('.screen').forEach((x) => x.classList.toggle('on', x.id === 's-' + veut));
    document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x.dataset.go === veut));
  }
}

document.querySelectorAll('.nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
    $('s-' + b.dataset.go).classList.add('on');
    if (b.dataset.go === 'dex') renderDex();
    if (b.dataset.go === 'equipe') renderTeam();
  };
});

/* ---------------------------------------------------------------- init */

/* Le décor est posé par nav.js, comme sur toutes les autres pages : même
   photo, même voile. Le fond propre au kiosque et son suivi de l'inclinaison
   sont partis avec lui — deux décors superposés se battaient, et celui du
   dessous ne se voyait pas. */

(async () => {
  try {
    await load();
  } catch (e) {
    if (e.message === 'auth') return;
    // Le catalogue vient du réseau depuis qu'il n'est plus recopié ici : une
    // page qui échoue à le charger n'a rien à afficher, et un « serveur
    // injoignable » générique ferait chercher au mauvais endroit. On nomme la
    // cause, et on l'écrit dans la grille plutôt que dans un toast qui
    // s'efface au bout de trois secondes.
    const cause = e.code ?? e.message ?? 'cause inconnue';
    const zone = $('grid');
    if (zone) {
      zone.innerHTML = `<div class="empty" style="padding:40px 20px;line-height:1.8">
        Le classeur n\u2019a pas pu charger le catalogue.<br>
        <span style="opacity:.6">${esc(cause)}</span><br>
        <a href="" style="color:var(--projo)">réessayer</a></div>`;
    }
    toast(`Catalogue indisponible : ${cause}`);
    return;
  }
  /* Le carrousel et le kiosque ont leur écran à eux — voir /boosters. Cette
     page dessine le classeur et le personnage équipé, et rien d autre. */
  renderDex(); renderTeam();
})();
</script>
<script src="/fx.js" defer></script>
<script src="/nav.js" defer></script>
</body>
