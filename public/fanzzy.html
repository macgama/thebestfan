<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Fanzzy — collection</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="stylesheet" href="/cartes.css">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;overflow-x:hidden}
/* Le fond opaque a disparu : il recouvrait le décor de tribune commun, et la
   page se retrouvait seule sur un aplat noir pendant que toutes les autres
   étaient posées sur le stade. Il ne reste que la lueur du haut, qui éclaire
   la colonne sans rien cacher.

   **Une lueur de craie, et non plus d'or** (arbitrage du 2 octobre 2026) :
   l'or ne dit plus que trois choses — acheter, une récompense prête, le
   légendaire — et le classeur n'est pas le kiosque. C'est aussi la lueur du
   deck, au caractère près : `verif-pages` compare les deux, parce que deux
   écrans voisins qui changent de fond se lisent comme deux applications.

   `padding-bottom` : la page fait exactement une hauteur d'écran et ne défile
   pas, donc rien ne la décale au-dessus de la barre du bas — le bouton
   « ouvrir le booster » passait dessous. */
#app{position:relative;width:100%;max-width:var(--colonne);height:max(100dvh,var(--ecran-min));overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom));
  background:radial-gradient(120% 55% at 50% -8%,rgba(242,238,228,.08),transparent 62%)}

.screen{flex:1;display:none;flex-direction:column;min-height:0;z-index:2}
.screen.on{display:flex}

/* **Le message d'une page vide a son panneau** — une page d'album que les
   filtres vident, le catalogue qui n'a pas pu se charger. Il était écrit à
   même la photo, à moitié d'opacité, et se perdait entre deux projecteurs.
   Même fond que le reste de l'interface, et l'encre entière. La place vide
   du vestiaire n'en est pas un : c'est une scène (« la place vide »). */
.empty{grid-column:1/-1;margin:0;text-align:center;padding:44px 22px;font-size:12.5px;line-height:1.7;
  border-radius:var(--r);background:var(--panneau);box-shadow:inset 0 0 0 1px var(--trait)}
#teamBody>.empty{margin-top:10px}


/* ============================================================ le classeur

   **L'ALBUM** (lot 4) : une page par série, qu'on tourne du doigt, le rail
   des séries au-dessus, les six familles et MANQUANTS entre les deux.
   Tout le dessin est la brique `.tbf-album` de ui.css — la même que
   l'album Fanzzy de /collection : la page ne lui écrit que sa place.

   **L'écran défile en hauteur, l'album en largeur.** Les pages se tournent
   dans `.tbf-album-pages` (`scroll-snap`), et c'est l'écran entier qui
   défile vers le bas : le rail et l'en-tête de série partent avec la grille,
   comme les pages d'un vrai classeur, au lieu de figer un tiers de l'écran
   au-dessus d'elle.

   **D'un bord à l'autre.** L'album porte `.tbf-pleine-largeur` pour que sa
   page glisse jusqu'au bord de l'écran. Mais il est dans un conteneur qui
   défile, et un conteneur qui défile rogne ce qui dépasse de sa boîte : les
   quatorze pixels de chaque côté que la pleine largeur reprend sur la
   gouttière le faisaient défiler de côté. L'écran prend donc lui-même toute
   la largeur de la colonne et rend la gouttière en rembourrage — l'album la
   reprend dedans, sans rien dépasser. */
#s-dex{margin-inline:calc(-1 * var(--gouttiere,14px));padding-inline:var(--gouttiere,14px);
  overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
#s-dex.on{display:block}
/* **Trois colonnes, puis six — une lignée par rangée, puis deux.**

   La brique compte ses colonnes à la largeur (trois à 360 px, cinq au plus).
   Le classeur range ses cartes par lignée — TR1, TR1B, TR1C — et c'est ce qui
   rend la progression lisible d'un coup d'œil : trois âges, une rangée. À
   cinq colonnes, les lignées se coupaient en travers des rangées, et l'on ne
   savait plus où commençait le personnage suivant. Six colonnes de cent
   onze pixels à 768 px gardent deux lignées par rangée ; sous 640 px, six
   colonnes tomberaient sous les quatre-vingt-huit pixels d'une carte lisible,
   et la page garde les trois. C'est la grille, donc la place : la case et sa
   carte restent celles de la brique. */
#s-dex .tbf-album-cartes{grid-template-columns:repeat(3,minmax(0,1fr))}
/* **Les vitrines, deux par rangée sur une tablette.** Une série ferme sur
   ses cinq légendaires, chacune en case VITRINE : à 768 px, cinq vitrines
   pleine largeur (560 au plus, au milieu) faisaient six cents pixels de
   rangées à moitié vides. Sur six colonnes, chacune en prend trois — sa
   carte garde la largeur d'une case, son mot tient à côté —, et la première
   repart d'une rangée propre, pour ne pas se coller au bout de la dernière
   lignée. À trois colonnes, elle prend toute la rangée, comme la brique. */
@media (min-width:640px){
  #s-dex .tbf-album-cartes{grid-template-columns:repeat(6,minmax(0,1fr))}
  #s-dex .tbf-album-vitrine{grid-column:span 3}
  #s-dex .tbf-album-cartes>:not(.tbf-album-vitrine)+.tbf-album-vitrine{grid-column:1 / span 3}
}
/* Une case possédée ouvre la fiche, comme la pochette : la main du doigt, et
   le contour du clavier. Le reste de la case est la brique. */
#s-dex .tbf-album-case[data-open]{cursor:pointer}
#s-dex .tbf-album-case[data-open]:focus-visible{outline:3px solid var(--projo);outline-offset:4px}
/* NOUVEAU pend sous la bande du nom, à cheval sur le coin bas-gauche de la
   carte — jamais sur le visage : c'est la brique qui le place
   (`.tbf-album-case>.tbf-sticker`, ui.css), la page n'y ajoute rien. */

/* **Et sans les six pixels entre le rail, les filtres et la page.** La
   rangée des filtres a déjà son air : quarante-quatre pixels pour des pins
   de vingt-six, neuf de vide au-dessus et au-dessous. Les six de l'album
   s'y ajoutaient deux fois, et l'en-tête de la page descendait d'autant ;
   sans eux, il reste quatorze pixels entre l'ombre de l'onglet ouvert et
   les pins, dix-sept entre les pins et l'écharpe de l'en-tête. */
#s-dex .tbf-album{gap:0}

/* **Les six familles et MANQUANTS sur une seule rangée.**

   À 360 px, les six filtres prenaient la ligne et l'interrupteur passait
   dessous : quarante-six pixels de plus avant l'en-tête de la page, et la
   première carte tombait à quatre cents pixels — une seule rangée à
   l'écran, quand c'est la page qui se remplit qu'on vient regarder. Avec
   la règle d'au-dessus, elle tombe à 348 (364 quand l'accroche de la série
   passe sur deux lignes, comme celle de LA REPRISE), et la deuxième rangée
   entre à l'écran.

   Six filtres de quarante-quatre pixels (le doigt) en font 264 ; « Ce qu'il
   me reste » à côté de son rail en demandait cent soixante. Le mot devient
   MANQUANTS, celui de la maquette, et **de 350 à 440 px il passe sous le
   rail**, en légende : soixante-dix pixels de large au lieu de cent vingt
   (au-delà, il tient à côté, comme la brique le pose). La rangée rend
   aussi huit pixels de la gouttière (six à gauche, dix à droite) : le
   premier pin tombe sur le bord gauche de l'en-tête, le mot finit sur son
   bord droit. Il faut 350 px pour que les six et la légende tiennent
   (264 + 70 + 16) : en dessous, rien ne se serre sous le doigt,
   l'interrupteur repasse à la ligne, à côté de son mot comme ailleurs.
   L'album de /collection a le même mot et la même règle (collection.html,
   sous sa grille) : l'une ne change pas sans l'autre. */
@media (min-width:350px) and (max-width:439.98px){
  #s-dex .tbf-album-filtres{padding-inline:6px 10px}
  #s-dex .tbf-album-filtres>.tbf-interrupteur{flex-direction:column;justify-content:center;gap:4px;
    padding:0 2px;text-align:center}
}


/* ------------------------------------------------------------- détail */
/* La boîte de la fiche. Elle ne porte plus de marge intérieure : la fiche
   arrange la sienne, et elle est la même à l'adresse /fanzzy/<id>.

   **Sous la barre du jeu, pas par-dessus** (lot 4). Elle couvrait tout
   `#app`, la barre comprise, à z 26 : le HUD de la barre (z 30, ui.css)
   passait donc devant l'en-tête de la fiche — à 360 px, l'avatar mordait le
   compteur d'écharpes ; à 768 px, la bande des compteurs se posait à sa
   droite —, pendant que la flèche et le menu, eux, étaient couverts.
   Monter au-dessus du HUD aurait caché la barre entière ; la fiche commence
   donc là où la barre finit (`--sous-barre`, posé par le script), comme à
   son adresse : même hauteur, même budget, et la barre reste à elle. Sa
   flèche referme la fiche (nav.js revient dans l'historique quand la page
   a empilé une adresse) ; la croix de la fiche reste.

   **Transparente, et ce qu'elle couvre se cache.** Le fond était plein, pour
   que la grille ne se lise pas en fantôme dessous ; sous une barre posée
   sur le décor, un aplat noir aurait fait une marche au ras de la barre.
   Le rail et l'écran se cachent donc (`visibility`, pas `display` : le
   classeur garde son défilement et sa page tournée, et ne se refait pas),
   et la fiche se pose sur le décor du jeu, comme à son adresse. Caché, il
   sort aussi de la tabulation et du lecteur d'écran : les cases, le rail et
   les filtres restaient atteignables sous un panneau qui les couvrait. */
#detail{position:absolute;inset:var(--sous-barre,0px) 0 0;z-index:26;display:none;flex-direction:column}
#detail.on{display:flex}
#app.fiche-ouverte>:is(.rail,.screen){visibility:hidden}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#171C23;z-index:40;
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;
  display:none;max-width:88%;text-align:center}
.toast.on{display:block;animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}
/* Le message arrive sans glisser quand on a demandé moins de mouvement :
   l'information reste, le mouvement part. */
@media (prefers-reduced-motion:reduce){ .toast.on{animation:none} }
html[data-calme~="animations"] .toast.on{animation:none}

/* ======================================================== Mon Fanzzy

   **LE VESTIAIRE** (lot 4) : le personnage qu'on montre aux autres, en
   grand, sur sa scène — une bâche du cadre de sa rareté, l'écharpe de sa
   série en tête (`.tbf-vestiaire`, ui.css). Au-dessus, le bandeau de ce
   qu'on a en poche ; dessous, la bande de son cri, puis ENTRER EN DUEL avec
   les bustes du deck et SA FICHE.

   La scène prend toute la hauteur qui reste : elle seule est souple. Le
   bandeau, le cri et les boutons ont leur hauteur, et cette page ne défile
   pas — un bouton poussé hors de l'écran y disparaîtrait pour de bon. */

/* **Le bandeau de la poche** (`.tbf-reserve`, la planche du kiosque) : les
   écharpes, la réserve de boosters et l'anneau du classeur, d'un bord à
   l'autre. Vide tant que l'état n'est pas lu : une planche sans rien dessus
   se lirait comme un solde à zéro.

   Les deux jetons à gauche, l'anneau du classeur à droite. La brique range
   le premier compteur à droite (`margin-left:auto`), ce qui convient à une
   planche qui n'a que des soldes ; ici l'anneau ferme la rangée, et les
   deux soldes se lisent ensemble, à gauche. C'est la place, pas le dessin. */
#bourse{flex:none}
#bourse:empty{display:none}
#bourse>.tbf-monnaie:first-child{margin-left:0}
#bourse>.tbf-cercle{margin-left:auto}
#s-equipe>.tbf-sous{flex:none}

#teamBody{flex:1;min-height:0;display:flex;flex-direction:column}

/* **La scène est un lien vers la fiche.**

   Ce qu'on touche sur cet écran, c'est le personnage — il occupe les deux
   tiers de la hauteur, et toucher une image qui ne répond pas se lit comme
   un écran figé. Un vrai `<a>` et non un gestionnaire de clic : il se
   tabule, s'ouvre dans un onglet, se partage, et marche avant que le script
   de la page n'arrive. Le bouton SA FICHE reste — il nomme ce que le portrait
   ne dit pas, et deux chemins vers le même endroit ne se gênent jamais.

   Quatorze pixels au-dessus : les deux scotchs de la bâche montent de sept,
   et la planche du dessus n'a pas à les recouvrir. */
#tscene{display:block;flex:1;min-height:0;margin-top:14px;color:inherit;text-decoration:none;cursor:pointer}
#tscene:active{translate:0 1px}
#tscene:focus-visible{outline:3px solid var(--projo);outline-offset:4px}
/* Le décor de la tenue portée, éteint de moitié : c'est le lieu, pas le
   sujet. Le personnage se découpe devant lui. */
#tscene .fond{position:absolute;inset:0;opacity:.5}
#tscene .fond svg{width:100%;height:100%;display:block}
/* La boîte du personnage. Ce qui vit dedans — les calques de gestes, la
   respiration, le croisement des poses — est monté par `fanzzy-scene.js` et
   habillé par `ui.css` : c'est la même mécanique que dans le virage, et le
   jour où elle change, elle change pour les deux. La page ne décide ici que
   de la place. */
.tpile{position:absolute;left:6%;right:6%;top:6%;bottom:0;z-index:1}
/* Le repli dessiné, pour les personnages qui n'ont ni états ni illustration :
   il tient la même place, pour que l'écran ne change pas de forme selon le
   Fanzzy qu'on a choisi. */
.tdessin{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  width:min(74%,232px);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tdessin svg{width:100%;display:block}
/* Le nom est le titre de l'écran : un `h2`, qui ne garde de lui que sa
   sémantique — la banderole est celle de la brique, qui le passe à la ligne
   en lignes équilibrées (`.tbf-vestiaire-pied>.tbf-banderole`, ui.css). */
.tbf-vestiaire-pied>h2.tbf-banderole{margin:0}

/* **La place vide.** Le premier écran d'un joueur neuf était une impasse :
   « Aucun Fanzzy choisi » dans un panneau calme, pas un bouton, et quatre
   cent soixante-dix pixels de vide dessous. C'est maintenant la scène du
   vestiaire sans personnage : la bâche au cadre gris (`--rar` absent : la
   commune, la rareté de personne), l'écharpe de la série qu'on ouvrira en
   tête, et dedans la photo d'une place vide en tribune. Un mot scotché au
   mur, « TA PLACE EST VIDE », au marqueur sur un papier de craie que tient
   un ruban — le scotch tient, il ne sert jamais de fond, comme la place du
   classement. Dessous, le geste qui la remplit, pleine largeur : OUVRIR MON
   PREMIER BOOSTER en or, la réserve en sticker sur son coin ; ou, à qui a
   des cartes sans en avoir choisi une, CHOISIR DANS LE CLASSEUR en bleu, le
   ton de ce qu'on possède.

   La même place que la scène d'un personnage (souple, quatorze pixels
   au-dessus pour les scotchs de la bâche) : l'écran ne change pas de forme
   le jour où la place se remplit. La photo est cadrée sur la chaise et
   l'écharpe posée dessus, au-dessus du mot. */
#tvide{flex:1;min-height:0;margin-top:14px}
#tvide .tbf-vestiaire-fond>img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.tvide-mot{--rot:-3deg;position:absolute;z-index:3;left:50%;bottom:22px;margin:0;translate:-50% 0;
  rotate:var(--rot);padding:9px 16px 7px;background:var(--craie);color:var(--encre);white-space:nowrap;
  box-shadow:0 0 0 1.5px var(--encre),3px 3px 0 1.5px rgba(7,9,12,.6)}
.tvide-mot>.tbf-marqueur{font-size:16px;line-height:20px}
/* Sur une tablette, la scène fait sept cents pixels de côté et un mot de
   seize s'y perd : celui de la place du classement, vingt-deux. */
@media (min-width:600px){ .tvide-mot>.tbf-marqueur{font-size:22px;line-height:26px} }
/* La réserve en sticker sur le coin de la bâche — « 4 », les boosters qui
   attendent —, en craie comme le compte des fentes du kiosque. Pas le rouge
   de la pastille : ce n'est pas un direct, c'est un compte. */
#teamBody .tbf-plaque[data-pastille]::after{--pf:var(--craie);--pl:var(--encre)}
/* **Le geste de la place vide est un grand texte** : dix-neuf pixels gras,
   et non les seize demi-gras de la bâche pleine largeur. L'encre sur l'or
   tient 11,66:1 à travers la toile, mais 3,84 sous le voile blanc du plein
   jour — le prix de l'or comme face (ui.css, la minuterie prête) —, sous les
   4,5 d'un texte ordinaire : c'était le seul relevé au soleil de cet écran
   que le départ du lot n'avait pas. À partir de 18,66 px gras, c'est un grand
   texte, dont le seuil est 3 : le mot passe dehors, et la bâche garde ce que
   la direction lui donne — la face de la destination (l'or des boosters,
   comme la tuile du hub) et son libellé. C'est la règle de la case VITRINE
   du classeur. CHOISIR DANS LE CLASSEUR, l'autre geste de la même place,
   prend le même corps : la place ne change pas de forme d'un état à l'autre,
   et le bleu (2,4 au soleil, une face décidée) se lit mieux en grand.

   Le corps grandit, l'espacement se resserre (0,06 em au lieu de 0,12) :
   OUVRIR MON PREMIER BOOSTER fait 282 px, dans les 296 que la bâche lui
   laisse à 360. Plus étroit, le libellé passe sur deux lignes équilibrées
   plutôt que de mordre le bord — entre deux mots, jamais dans un mot. Sur
   une ligne, la bâche garde ses cinquante-quatre pixels.

   La pastille de la réserve reste le `::after` de la brique : l'audit ne la
   mesure pas (il la range « hors contraste »), elle se mesure à la main —
   l'encre sur la craie, treize pixels gras, 17:1 à l'intérieur et 4,9 au
   soleil. */
#tvide+.tbtns>.tbf-bloc{font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1.2;
  white-space:normal;text-wrap:balance;text-align:center}

#cri{flex:none;margin-top:16px}
/* **Les deux boutons sur une rangée.** Empilés pleine largeur, ils prenaient
   soixante-six pixels de plus à la scène, qui n'en gardait que cent
   quatre-vingt-dix à 360 × 640. ENTRER EN DUEL prend la place que réclame
   son mot, SA FICHE celle du sien, et le reste va au duel. Un mot ne se
   coupe pas : sous 330 px de colonne, SA FICHE passe dessous.

   **Les bustes du deck sont collés sur le coin de la bâche**, pas posés à
   côté du mot : à côté, ils réclamaient soixante-dix pixels que la rangée
   n'a pas à 360, et le mot passait sur deux lignes. Le coin haut-droit les
   tient à cheval sur le bord, comme des stickers — d'où les seize pixels
   d'air au-dessus de la rangée. */
.tbtns{display:flex;flex-wrap:wrap;gap:10px;flex:none;padding:16px 0 4px}
.tbtns>.tbf-bloc{width:auto;flex:1 1 auto;min-width:0;white-space:nowrap}
.tbtns>#goDuel{flex-grow:2}
.tbtns>#goDuel>.tbf-minis{position:absolute;z-index:2;right:10px;top:-13px;margin:0}

/* ---------------------------------------------------------------- nav */
/* Onglets en haut plutôt qu'en bas : la barre de navigation commune occupe
   déjà le bas de l'écran, et deux barres superposées se recouvraient — les
   onglets devenaient inatteignables.

   **Le rail et la porte.** MON FANZZY et CLASSEUR changent d'écran sans
   changer de page : ce sont des onglets, dans leur rail. DECK, lui, **quitte
   la page** — c'est `/deck`. Il était un troisième onglet, et un onglet qui
   emmène ailleurs ment sur ce qu'il fait : on croit feuilleter, on part. Il
   devient donc une plaque posée à côté du rail, avec la flèche ↗ des liens
   qui sortent (`.tbf-ico-lien`, ui.css).

   En béton et non en bleu : l'onglet allumé du rail est déjà une plaque
   bleue, et deux objets bleus côte à côte laisseraient croire que les deux
   sont « ici ».

   La plaque est calée sur le rail : sa face fait la hauteur du rail moins sa
   propre tranche, de sorte que les deux s'arrêtent sur la même ligne. */
.rail{display:flex;align-items:flex-start;gap:8px;flex:none}
.rail .nav{flex:1;min-width:0}
.rail .vers-deck{flex:none;min-height:49px;padding:0 14px}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body class="tbf-large">
<main id="app">
  <!-- Plus de bandeau « FANZZY / collection » : la barre du haut dit
       maintenant où l'on est, et le répéter trente pixels plus bas ne faisait
       qu'occuper la place au-dessus des onglets. L'écran commence donc par ses
       onglets, comme le deck. -->
  <!-- Le rail porte le ton de l'écran sur le hub — le bleu de ce qu'on
       possède (contrat C5) : c'est l'onglet allumé qui le montre. -->
  <div class="rail">
  <nav class="nav tbf-onglets" data-ton="bleu">
    <!-- L'ordre dit le chemin : mon personnage, puis ma collection, puis le
         deck où les emmener. Le kiosque venait en premier et « DUEL » en
         dernier — l'écran d'accueil de la section était donc la boutique, et
         le personnage qu'on a choisi, le dernier onglet. On entre chez soi
         avant d'entrer au magasin. -->
    <button data-go="equipe" class="tbf-onglet on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>MON FANZZY</button>

<!-- Ce que le classeur et les boosters partagent : l état, le catalogue, le

<!-- Et ceux des cartes d’action, qui n’étaient chargés nulle part ici : une
