<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fanzzy — collection</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;overflow:hidden}
/* Le fond opaque a disparu : il recouvrait le décor de tribune commun, et la
   page se retrouvait seule sur un aplat noir pendant que toutes les autres
   étaient posées sur le stade. Il ne reste que la lueur chaude du haut, qui
   éclaire le kiosque sans rien cacher.

   `padding-bottom` : la page fait exactement une hauteur d'écran et ne défile
   pas, donc rien ne la décale au-dessus de la barre du bas — le bouton
   « ouvrir le booster » passait dessous. */
#app{position:relative;width:100%;max-width:440px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom));
  background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%)}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 6px;flex:none;z-index:4}
.mark{font-family:var(--banner);font-weight:700;font-size:20px;letter-spacing:.16em;line-height:1}
.mark small{display:block;font-size:8.5px;letter-spacing:.3em;opacity:.5;font-weight:400;margin-top:3px}

.screen{flex:1;display:none;flex-direction:column;min-height:0;z-index:2}
.screen.on{display:flex}

/* -------------------------------------------------------------- kiosque */

.carousel{position:relative;width:100%;height:320px;perspective:1100px;touch-action:pan-y}
.slide{position:absolute;left:50%;top:50%;width:186px;aspect-ratio:.62;margin:0;cursor:grab;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,.9,.28,1),opacity .45s,filter .45s;
  border-radius:11px;overflow:hidden;border:1px solid rgba(0,0,0,.6);
  box-shadow:0 26px 46px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.2)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide svg{width:100%;height:100%;display:block}
.slide .foil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.42) 46%,
    rgba(180,225,255,.28) 52%,transparent 66%);
  background-size:260% 260%;background-position:120% 0;mix-blend-mode:screen}
.slide.center .foil{animation:foil 4.5s ease-in-out infinite}
@keyframes foil{0%{background-position:130% 0}55%{background-position:-40% 0}100%{background-position:-40% 0}}
.slide.center{animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-9px}}
.slide.side{filter:brightness(.42) saturate(.65)}
.slide.hidden{opacity:0;pointer-events:none}
.shadow{position:absolute;left:50%;bottom:6px;width:150px;height:16px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%);filter:blur(5px)}

.tearhint{font-size:10.5px;letter-spacing:.2em;opacity:.45;margin-top:6px;text-align:center}

/* Une série verrouillée se regarde sans se toucher : le paquet s'éteint, mais
   il reste visible. C'est ce qui donne envie d'y arriver. */
.carousel.verrou .slide.center{filter:grayscale(.85) brightness(.5)}
.carousel.verrou .slide.center .foil{display:none}
/* Le cadenas est dans la ligne, pas sur le paquet : `.carousel` porte une
   `perspective`, donc ses enfants se rangent par leur profondeur en 3D et non
   par `z-index`. Un cadenas posé là passait derrière les paquets — avec la
   bonne taille, le bon calque et la bonne image, mais invisible. */
.setline .verrou{display:inline-flex;align-items:center;gap:5px}
.setline .verrou svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;flex:none}

/* --------------------------------------------------- geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Une seule intention, un seul mouvement, et l'endroit
   où saisir se voit — la ligne dentelée est dessinée sur le paquet avant même
   qu'on y touche.

   `--p` porte l'avancée de la déchirure, de 0 à 1. Tout en découle : la bande
   qui s'en va, l'ouverture qui se creuse, la lueur qui monte. Déclarée en
   `@property` pour qu'elle s'anime — c'est ce qui fait le retour élastique
   quand on lâche trop tôt. Là où `@property` manque, la bande revient d'un
   coup au lieu de glisser : moins joli, tout aussi juste. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

.tearzone{position:absolute;inset:0;z-index:24;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(5,7,10,.94)}
.tearzone.on{display:flex}

.tearquit{position:absolute;top:14px;right:14px;background:none;border:0;color:inherit;
  font-size:11.5px;letter-spacing:.14em;opacity:.45;cursor:pointer;padding:8px 10px}
.tearquit:hover,.tearquit:focus-visible{opacity:.85}

/* `--bande` : où passe la déchirure, en hauteur de vignette. Elle ne vaut pas
   zéro parce que le dessin d’un booster laisse une marge sombre au-dessus du
   sachet : réglée trop haut, la bande s’arrachait dans le vide, au-dessus du
   paquet représenté. */
.tearpack{--p:0;--bande:20%;width:210px;aspect-ratio:.62;position:relative;border-radius:12px;
  overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.7);touch-action:none;cursor:grab;
  border:0;padding:0;background:none;display:block;transition:--p .32s cubic-bezier(.3,1.4,.5,1)}
.tearpack.tire{transition:none;cursor:grabbing}
.tearpack:focus-visible{outline:2px solid var(--projo);outline-offset:4px}
.tearpack .art{position:absolute;inset:0}
.tearpack img,.tearpack svg{width:100%;height:100%;object-fit:cover;display:block}

/* L'intérieur du sachet : ce qu'on découvre à mesure que la bande s'en va. */
.tearpack .maw{position:absolute;left:0;right:0;top:0;height:var(--bande);
  background:radial-gradient(120% 160% at 50% 0,rgba(255,238,190,calc(.55 * var(--p))),
    rgba(5,7,10,.96) 62%);
  -webkit-mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%;
          mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%}

/* La bande elle-même. Une copie du paquet, rognée à sa hauteur : elle montre
   donc exactement le haut du dessin, quel qu'il soit — photo ou SVG de repli. */
.tearpack .lip{position:absolute;left:0;right:0;top:0;height:var(--bande);overflow:hidden;
  clip-path:inset(0 0 0 calc(var(--p) * 100%));
  transform:rotate(calc(var(--p) * 5deg)) translateY(calc(var(--p) * -6px));
  transform-origin:100% 100%}
.tearpack .lip > *{position:absolute;top:0;left:0;width:100%;height:666.7%}

/* La ligne dentelée : l'affordance. Elle dit où saisir avant qu'on ait lu la
   consigne, et elle s'efface à mesure que la déchirure la mange. */
.tearpack .seam{position:absolute;left:0;right:0;top:var(--bande);height:2px;
  background:repeating-linear-gradient(90deg,rgba(245,195,59,.9) 0 5px,transparent 5px 10px);
  opacity:calc(1 - var(--p));filter:drop-shadow(0 0 3px rgba(245,195,59,.5))}

/* La languette qu'on saisit, à droite de la ligne : c'est là que part le geste. */
.tearpack .grip{position:absolute;right:6px;top:calc(var(--bande) - 15px);width:26px;height:26px;
  border-radius:50%;background:rgba(245,195,59,.92);box-shadow:0 2px 10px rgba(0,0,0,.6);
  opacity:calc(1 - var(--p));animation:tirette 1.9s ease-in-out infinite;pointer-events:none}
.tearpack .grip::after{content:"";position:absolute;inset:7px;border-left:2px solid #05070A;
  border-bottom:2px solid #05070A;transform:rotate(45deg) translate(1px,-1px)}
@keyframes tirette{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}

.tearlbl{margin-top:20px;font-family:var(--banner);font-size:14px;letter-spacing:.2em;opacity:.7;
  text-align:center;line-height:1.6;max-width:280px}
.tearlbl b{color:var(--projo)}
.tearlbl small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.08em;
  opacity:.55;margin-top:8px}

#burst{position:absolute;inset:0;z-index:23;pointer-events:none;object-fit:cover;width:100%;height:100%;
  mix-blend-mode:screen;opacity:0;transition:opacity .4s}
#burst.on{opacity:1}
.flash{position:absolute;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
#app.quake{animation:quake .6s}
@keyframes quake{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-6px,3px)}35%{transform:translate(5px,-4px)}
  55%{transform:translate(-4px,-2px)}75%{transform:translate(3px,3px)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.setname{font-family:var(--banner);font-size:12px;letter-spacing:.28em;opacity:.7}
.setline{font-size:10.5px;opacity:.42;margin:4px 0 18px}
.packwrap{position:relative}
.packglow{position:absolute;width:230px;height:230px;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,195,59,.26),transparent 65%);
  filter:blur(14px);animation:breathe 5s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.pack{width:178px;aspect-ratio:.62;border-radius:9px;overflow:hidden;position:relative;cursor:pointer;
  border:1px solid rgba(0,0,0,.6);box-shadow:0 24px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22);
  transform:rotate(-2deg);transition:transform .2s;display:block;background:none;padding:0}
.pack:active{transform:rotate(-2deg) scale(.97)}
.packnav{display:flex;align-items:center;gap:16px;margin-top:18px}
.packnav button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(242,238,228,.18);
  background:rgba(0,0,0,.3);color:inherit;cursor:pointer}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(242,238,228,.22);display:block}
.dots i.on{background:var(--projo)}
.cta{margin:16px auto 6px;display:block;width:min(300px,82%);
  background:linear-gradient(180deg,var(--flare),#B32A1D);color:#fff;font-family:var(--banner);
  font-size:16px;letter-spacing:.09em;padding:13px;border-radius:6px;border:1px solid rgba(255,255,255,.18);
  box-shadow:0 6px 0 #7A1A11;cursor:pointer}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #7A1A11}
.cta[disabled]{filter:grayscale(.8);opacity:.5;pointer-events:none}
.regen{text-align:center;font-size:10.5px;opacity:.45;min-height:15px;padding-bottom:4px}

/* ------------------------------------------------------------------ dex */
/* ------------------------------------------------------- l'en-tête

   Une jauge de cinq pixels et « 14/152 » en gris : c'était exact et ça ne
   disait rien. Dans ce genre de jeu, la progression est la récompense — elle
   se met en gros, elle a de la matière, et elle annonce ce qui reste plutôt
   que ce qui est fait. « 138 à trouver » se lit comme un programme ; « 9 % »
   se lit comme une note. */
.head{padding:4px 16px 0;flex:none}
.head .l{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.head h2{font-family:var(--banner);font-size:19px;letter-spacing:.12em;margin:0;flex:1}
.head .n{font-family:var(--banner);font-size:25px;line-height:.9;color:var(--projo);
  font-variant-numeric:tabular-nums}
.head .reste{font-size:10.5px;letter-spacing:.1em;opacity:.5;text-align:right;
  line-height:1.1;margin:6px 0 10px}
.progress{margin:0}
.progress .bar{position:relative;height:13px;border-radius:8px;overflow:hidden;
  background:#0A0E14;box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 1px 0 rgba(242,238,228,.08)}
.progress .bar i{display:block;height:100%;width:0;border-radius:8px;
  background:linear-gradient(180deg,#FFDC7A,var(--projo) 45%,#D9932A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 12px rgba(245,195,59,.45);
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
/* L'éclat qui balaie la barre : c'est ce qui la fait vivre entre deux
   ouvertures de booster, quand rien ne bouge. */
.progress .bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);
  background-size:260% 100%;animation:jauge 3.4s ease-in-out infinite}
@keyframes jauge{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* Des onglets qu'on enfonce, pas des étiquettes. Le biseau du bas disparaît à
   l'appui et le bouton descend : c'est le seul retour tactile dont dispose
   une page web, et c'est celui que ces jeux emploient partout. */
.filt{white-space:nowrap;font-family:var(--banner);font-size:11.5px;letter-spacing:.08em;
  padding:8px 13px 7px;border-radius:10px;cursor:pointer;border:0;color:inherit;
  background:rgba(16,22,31,.9);box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(242,238,228,.09);
  opacity:.62;transition:transform .1s,box-shadow .1s,opacity .1s}
.filt:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.55)}
.filt.on{opacity:1;color:#0B0E13;background:var(--fc,var(--craie));
  box-shadow:0 3px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 9px;padding:2px 14px 22px;
  overflow-y:auto;flex:1}
/* Le socle dur déborde sous la carte : la case lui garde sa place, sinon la
   rangée suivante mange le biseau et les cartes paraissent rognées. */
.slot{position:relative;aspect-ratio:63/88;border-radius:6px;cursor:pointer;
  transition:transform .11s cubic-bezier(.3,1.5,.5,1)}
.slot:active{transform:translateY(3px) scale(.975)}

/* Les cases vides.

   Elles étaient des rectangles pointillés avec un nom en gris. Neuf cases sur
   douze à l'écran, et la grille ressemblait à un formulaire à remplir plutôt
   qu'à une collection. Surtout, elles ne donnaient **aucune envie** : on ne
   désire pas un rectangle.

   Le personnage est donc là, en ombre, dans son cadre éteint. On voit ce qu'on
   n'a pas — c'est tout le ressort du genre, et ça ne coûte rien de plus : le
   dessin existe déjà, `loading="lazy"` ne charge que ce qui est à l'écran. */
.slot.locked .fz{cursor:pointer;
  box-shadow:inset 0 0 0 calc(1.1 * var(--u)) rgba(242,238,228,.13),
             inset 0 0 calc(7 * var(--u)) rgba(0,0,0,.5),
             0 calc(1.2 * var(--u)) 0 rgba(242,238,228,.07),
             0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.45)}
/* Assez sombre pour dire « pas à toi », assez clair pour qu'on reconnaisse le
   personnage. À trois dixièmes de luminosité le visage disparaissait, et une
   silhouette qu'on ne distingue pas ne vaut pas mieux qu'une case vide. */
.slot.locked .art{filter:grayscale(1) brightness(.46) contrast(1.15)}
.slot.locked .top::before,.slot.locked .foot,.slot.locked .pip{display:none}
.slot.locked .nm{opacity:.72}
.slot.locked .cadenas{position:absolute;left:50%;top:40%;z-index:4;width:calc(13 * var(--u));height:calc(13 * var(--u));
  transform:translate(-50%,-50%);opacity:.75;stroke:#F2EEE4;fill:none;stroke-width:2;
  filter:drop-shadow(0 .calc(5 * var(--u)) calc(1.5 * var(--u)) rgba(0,0,0,.9))}
.dupe{position:absolute;right:3px;bottom:3px;background:rgba(8,10,13,.9);border:1px solid rgba(242,238,228,.28);
  border-radius:3px;font-family:var(--banner);font-size:9.5px;padding:0 4px;z-index:4}
/* Le stade atteint : une étoile pour rare, deux pour épique. En haut à droite,
   là où rien d'autre ne s'affiche — le compteur de doublons tient le bas et le
   marqueur de duel le coin gauche. */
.stade{position:absolute;right:3px;top:3px;color:var(--projo);font-size:10px;line-height:1;
  letter-spacing:-1px;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:4}
.active-tag{position:absolute;left:3px;top:3px;background:var(--projo);color:#0B0E13;border-radius:3px;
  font-family:var(--banner);font-size:8.5px;padding:1px 5px;z-index:4;letter-spacing:.06em}
.empty{grid-column:1/-1;text-align:center;padding:44px 22px;opacity:.5;font-size:12.5px;line-height:1.7}

/* ----------------------------------------------------------- la carte

   L'image d'abord. Le cadre portait la couleur du type sur toute sa
   surface, avec un corps crème et une fenêtre d’illustration au centre :
   en vignette on ne voyait plus que la couleur, et le personnage était un
   timbre-poste.

   L'illustration remplit maintenant la carte. La couleur du type ne reste
   qu'en filet et dans la pastille, le nom se pose sur un voile en bas, la
   rareté tient dans un coin. Ce qui était écrit sur la carte se lit déjà
   dans le panneau de détail : le répéter volait la place de l'image.    */
/* ------------------------------------------------------------ la rareté

   Dans un jeu de collection, la rareté est ce qu'on montre aux autres. Elle
   doit se lire à un mètre, sur une vignette de cent pixels de haut.

   Elle portait ici un filet de sept millièmes de largeur, **de la couleur du
   type** — c'est-à-dire la même information que la pastille juste à côté, et
   rien du tout sur la rareté. Deux cartes que tout sépare, une commune et une
   légendaire, se ressemblaient trait pour trait dans la grille.

   Le cadre dit maintenant la rareté, la pastille garde le type. C'est la
   répartition de tous les jeux du genre, et elle tient parce que les deux
   informations n'ont pas le même usage : le type se consulte quand on
   construit un deck, la rareté se voit sans qu'on la cherche.

   `--rc2` est la couleur du socle — le biseau dur sous la carte. C'est lui
   qui donne la matière : une carte qu'on peut appuyer, pas une image collée
   sur un fond. */
/* ------------------------------------------------- l'unité de la carte

   Tout ce que dessine une carte — son rayon, son cadre, son nom, ses marges —
   se mesure en centièmes de sa propre largeur, pour qu'elle soit juste en
   vignette comme en grand. C'est ce que font les unités de conteneur, `cqw`.

   Elles étaient employées directement, et **c'était une bombe à retardement** :
   quand `container-type` ne prend pas — un navigateur d'avant 2023, un moteur
   qui connaît l'unité sans connaître le confinement — `cqw` ne disparaît pas,
   elle se rabat sur la **fenêtre**. Sur un écran de 470 px, `4cqw` passe de
   5 px à 19 px de rayon, le nom de 8 px à 28 px, la marge de 14 px à 52 px :
   la carte devient un galet, et le nom, coupé des deux côtés par l'arrondi,
   n'est plus lisible. Rien ne le signale, et ça ne se voit pas sur la machine
   qui l'a écrit.

   `--u` vaut donc un centième de la largeur attendue, en pixels, et la règle
   `@container` ne la remplace par `1cqw` que là où le confinement fonctionne
   vraiment. Un moteur qui n'en veut pas garde le repli et affiche une carte
   juste ; les autres gagnent la mise à l'échelle exacte. Chaque endroit qui
   pose une carte d'une autre taille redéclare `--u`, juste en dessous. */
.fz{--u:1.3px}
.summary .fz{--u:.7px}
/* Les sélecteurs sont repris un à un : sans eux, `.summary .fz` — plus
   spécifique — garderait son repli en pixels et la vignette cesserait de
   suivre sa largeur. Une règle de repli qui bat le raffinement, c'est le
   raffinement qui n'existe pas. */
@container (min-width: 0px){
  .fz,.summary .fz{--u:1cqw}
}

.fz{container-type:inline-size;position:relative;width:100%;aspect-ratio:63/88;border-radius:calc(4 * var(--u));
  overflow:hidden;cursor:pointer;background:#0B1017;
  box-shadow:inset 0 0 0 calc(1.3 * var(--u)) var(--rc),
             inset 0 0 calc(7 * var(--u)) rgba(0,0,0,.45),
             0 calc(1.4 * var(--u)) 0 var(--rc2),
             0 calc(2.4 * var(--u)) calc(3.4 * var(--u)) rgba(0,0,0,.5)}
.fz .body{position:absolute;inset:0;display:block;color:#F2EEE4}
.fz .art{position:absolute;inset:0;overflow:hidden;background:#0B1017}
.fz .art svg{width:100%;height:100%;display:block}

/* Le nom se pose sur l'image au lieu d'occuper une barre qui la rogne. */
.fz .top{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;
  gap:calc(2 * var(--u));padding:calc(11 * var(--u)) calc(3 * var(--u)) calc(3 * var(--u));
  background:linear-gradient(180deg,transparent,rgba(4,6,10,.55) 42%,rgba(4,6,10,.93))}
/* Le socle prend la teinte de la rareté. C'est ce qui la fait lire même quand
   le cadre est mangé par une illustration claire — et c'est la même couleur
   partout, donc elle s'apprend en une carte. */
.fz .top::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,transparent,var(--rc));opacity:.2;pointer-events:none}
.fz .nm{position:relative;font-family:var(--banner);font-size:calc(6 * var(--u));line-height:1.05;
  text-transform:uppercase;flex:1;letter-spacing:.01em;
  text-shadow:0 .calc(4 * var(--u)) calc(1.6 * var(--u)) rgba(0,0,0,.95)}
.fz .pip{width:calc(6 * var(--u));height:calc(6 * var(--u));border-radius:50%;background:var(--tc);flex:none;display:grid;
  place-items:center;box-shadow:0 .calc(3 * var(--u)) calc(1.2 * var(--u)) rgba(0,0,0,.6)}
.fz .pip svg{width:calc(3.8 * var(--u));height:calc(3.8 * var(--u))}

/* Deux pièges se cumulent ici.

   Le centrage ne peut pas passer par `transform` : fx.js pose `fz-vivant` sur
   toute image `.illu` pour la faire respirer, et ses keyframes réécrivent
   `transform` en entier. Un `translateX(-50%)` y était effacé dès la première
   image de l'animation, et l'illustration se retrouvait décalée d'une
   demi-largeur — seul son tiers gauche restait visible dans la carte.

   Il ne peut pas passer non plus par des marges automatiques : quand l'image
   est plus large que sa fenêtre, la marge gauche est ramenée à zéro et tout
   le débord part à droite. L'image se retrouve alors collée à gauche.

   On laisse donc la boîte remplir la fenêtre et c'est `object-fit` qui
   recadre le contenu, centré horizontalement et posé sur la base. Ni
   l'animation ni le débordement ne peuvent le déplacer. */
.illuwrap .illu{position:absolute;left:0;bottom:0;width:100%;height:104%;
  object-fit:cover;object-position:50% 100%;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
/* Un objet n'est pas un personnage : il est détouré et n'a ni pieds ni sol.
   Il flotte au milieu de la tribune au lieu de s'y planter en bas. */
.illuwrap .illu.objet{inset:10% 8%;left:auto;bottom:auto;width:84%;height:80%;
  object-fit:contain;object-position:50% 50%}
/* Les modificateurs vivent dans le panneau de détail. Sur la carte ils
   masquaient l'illustration pour redire la même chose. */
.fz .mods{display:none}

/* La rareté, en pastille sombre : lisible quelle que soit l’image dessous. */
/* La rareté chiffrée, dans le coin : un à trois losanges, une couronne pour
   la légendaire. Elle redit ce que le cadre annonce — et c'est voulu, un
   collectionneur veut pouvoir compter. */
.fz .foot{position:absolute;top:calc(2.6 * var(--u));right:calc(2.6 * var(--u));z-index:3;display:flex;align-items:center;
  gap:calc(1 * var(--u));padding:calc(1.1 * var(--u)) calc(2.2 * var(--u));border-radius:calc(99 * var(--u));background:rgba(4,6,10,.7);
  box-shadow:inset 0 0 0 .calc(4 * var(--u)) var(--rc);font-size:calc(2.6 * var(--u));color:#E4DFD2}
.fz .rar{display:flex;gap:.calc(7 * var(--u));align-items:center}
.fz .rar .d{width:calc(2.4 * var(--u));height:calc(2.4 * var(--u));background:var(--rc);transform:rotate(45deg);
  border-radius:.calc(3 * var(--u));box-shadow:0 0 calc(1.4 * var(--u)) var(--rc)}
.fz .rar .s{font-size:calc(3.6 * var(--u));color:var(--rc);line-height:1;
  text-shadow:0 0 calc(1.6 * var(--u)) var(--rc)}
/* Le type est déjà dit par la pastille de couleur : inutile de le réécrire. */
.fz .sep,.fz .foot span:last-child{display:none}
/* En dessous d'une certaine largeur, la pastille de rareté n'est plus lisible :
   elle devient une tache claire dans le coin, qu'on lit comme un défaut
   d'affichage. La carte la retire donc d'elle-même — c'est à ça que sert le
   `container-type` posé plus haut, et ça marche partout où la carte s'affiche
   sans que l'appelant ait à le savoir. Le cadre porte la rareté à lui seul
   dans la grille. */
@container (max-width: 150px){ .fz .foot{display:none} }

/* La légendaire est la seule à rayonner hors de son cadre. Si toutes les
   raretés brillaient, aucune ne brillerait. */
.fz.r-legendaire{box-shadow:inset 0 0 0 calc(1.5 * var(--u)) var(--rc),
  inset 0 0 calc(7 * var(--u)) rgba(0,0,0,.4),
  0 calc(1.4 * var(--u)) 0 var(--rc2),
  0 0 calc(5 * var(--u)) rgba(245,195,59,.4),
  0 calc(2.4 * var(--u)) calc(3.4 * var(--u)) rgba(0,0,0,.5)}
.fz.r-legendaire .nm{color:#FFE08A}
.fz.holo::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:calc(4 * var(--u));
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 45%,rgba(160,220,255,.32) 52%,transparent 68%);
  background-size:250% 250%;animation:sheen 3.6s linear infinite;mix-blend-mode:screen;opacity:.6}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-40% 0}}

/* L'entrée en cascade. La grille apparaissait d'un bloc ; elle se dépose
   maintenant carte par carte. Le retard est plafonné à douze rangs : au-delà,
   quelqu'un qui arrive en bas de la grille attendrait quatre secondes pour
   voir sa collection. */
.grid .slot{animation:poser .34s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes poser{from{opacity:0;transform:translateY(12px) scale(.88)}}
@media (prefers-reduced-motion:reduce){
  .grid .slot{animation:none}
  .progress .bar::after{animation:none}
  .fz.holo::after{animation:none}
}

/* ======================================================== Mon Fanzzy

   cadre de rareté vient de la fiche, la respiration et le coucou viennent de

/* La boîte du personnage. Ce qui vit dedans — les calques de gestes, la

/* Ce qu'il change, en une bande de hauteur **fixe**. Sans elle, un Fanzzy à

     lève jamais et ne demande rien tant qu'on ne l'appelle pas. -->

<link rel="stylesheet" href="/fanzzy-fiche.css">
<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en
     panneau par-dessus la grille. -->
<script src="/fanzzy-fiche.js"></script>
<script>
/* =======================================================================
   FANZZY — collection, boosters, évolutions
   Les Fanzzy ne donnent pas de points : ils changent la façon dont tes
   gestes se jouent en duel. La rareté achète du choix, pas de la force —
   c'est ce qui évite qu'acheter des boosters revienne à acheter des victoires.
   ======================================================================= */

/**
 * Visuels générés avec Artlist (Nano Banana Pro).
 *
 * Ils sont ici en lien direct vers le CDN d'Artlist. Avant la mise en ligne,
 * télécharge-les et sers-les depuis /public/img : un CDN tiers ajoute une
 * résolution DNS, une poignée de main TLS et une dépendance que tu ne
 * contrôles pas — trois choses qui coûtent cher au score de performance.
 * Si une image ne charge pas, la page retombe sur l'illustration dessinée en
 * SVG : rien ne casse.
 */
const ART = {
  VN: 'img/pack-virage-nord',
  NE: 'img/pack-nuits-europeennes',
  burst: 'video/gerbe.mp4',
};

// Choix du format d'image et dessin des Fanzzy : voir /fanzzy-art.js. L'accueil
// dessine les mêmes personnages, et deux copies d'un même dessin divergent
// toujours — c'est déjà arrivé au catalogue.
const { IMG_EXT, src } = FZART;

const $ = (id) => document.getElementById(id);

// `esc` était utilisé dans le rendu de la grille sans avoir jamais été défini :
// la branche des Fanzzy non possédés levait une ReferenceError, `list.map`
// s'interrompait, et la grille restait vide pour tout joueur dont la
// collection n'était pas complète — donc pour tout le monde.
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
// Déclarée en fonction, donc utilisable avant sa ligne : le fond parallaxe
// s'installe tout en haut du script.
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/**
 * Vibration. Enveloppée dans un try : tous les navigateurs n'exposent pas
 * l'API, et Safari iOS l'ignore silencieusement. Une animation ne doit jamais
 * tomber parce que le retour haptique n'est pas disponible.
 */
function buzz(pattern) {
  try { navigator.vibrate?.(pattern); } catch { /* sans importance */ }
}

/* ------------------------------------------------------------------ son
   Aucun fichier audio : tout est synthétisé au moment du geste. Zéro octet
   téléchargé, et le son colle exactement à l'action. Le contexte n'est créé
   qu'au premier toucher, comme l'exigent les navigateurs. */

let AC = null;
const audio = {
  ready() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (AC?.state === 'suspended') AC.resume();
    return AC;
  },
  /** Bruit filtré : le papier alu qu'on déchire. */
  rip(intensity = 1) {
    const ac = this.ready(); if (!ac) return;
    const dur = 0.28 * intensity;
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 1.6;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(1400, ac.currentTime);
    f.frequency.exponentialRampToValueAtTime(4200, ac.currentTime + dur);
    f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.value = 0.22 * intensity;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  },
  /** Claquement sec : la carte qui se retourne. */
  flip() {
    const ac = this.ready(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(620, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, ac.currentTime + 0.09);
    g.gain.setValueAtTime(0.14, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.11);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.12);
  },
  /** Accord montant : plus la carte est rare, plus l'accord est riche. */
  chime(rar) {
    const ac = this.ready(); if (!ac) return;
    const notes = { epique:[523,659], legendaire:[523,659,784,1047,1319] }[rar];
    if (!notes) return;
    notes.forEach((hz, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = hz;
      const t = ac.currentTime + i * 0.07;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.2);
    });
  },
  /** Grondement de tribune pour une couronne. */
  roar() {
    const ac = this.ready(); if (!ac) return;
    const dur = 1.8;
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / d.length;
      d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * t) * 0.9;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const g = ac.createGain(); g.gain.value = 0.3;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  },
};

/* ------------------------------------------------------------ stockage */

/**
 * Tout l'état vit sur le serveur.
 *
 * Boosters, écharpes, collection et Fanzzy équipé étaient dans le navigateur
 * tant qu'ils ne servaient à rien. Depuis qu'une écharpe achète une vignette,
 * un solde côté client se modifierait avec la console du navigateur : c'est le
 * serveur qui tire les boosters et tient les comptes.
 */
const api = async (path, body, method) => {   // eslint-disable-line no-unused-vars
  const res = await fetch('/api/fanzzy' + path, {
    method: method ?? (body === undefined ? 'GET' : 'POST'),
    headers: { 'content-type': 'application/json' },
    credentials: 'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  const json = await res.json().catch(() => ({}));
  if (json.error) {
    throw Object.assign(new Error(json.error), { code: json.error, detail: json.detail });
  }
  return json;
};

/* ------------------------------------------------------------ catalogue */

/**
 * Le catalogue vient du serveur, il n'est plus recopié ici.
 *
 * Cette page en gardait sa propre copie : vingt-sept entrées écrites à la
 * main, plus les types, les paliers de rareté, les sets et les taux de
 * tirage. Elles avaient divergé sans que rien ne le signale — la lignée du
 * Gamin de Devant manquait dans la page alors que le serveur la tirait des
 * boosters, et un G1 sorti d'un paquet arrivait ici comme `undefined` et
 * cassait l'ouverture.
 *
 * Une copie qu'il faut penser à mettre à jour finit toujours par ne plus
 * l'être. `/api/fanzzy/dex` porte désormais tout, y compris les constantes
 * qui restaient locales faute d'être servies : sans elles, la copie
 * repartait par la petite porte.
 *
 * La réponse est mise en cache une heure par le navigateur, donc ce
 * chargement ne coûte rien à la navigation.
 */
let DEX = [];
let BY_ID = new Map();
/** Les personnages : une entrée par lignée, jamais ses âges supérieurs. */
let PERSOS = [];
let TYPES = {};
let SETS = [];
// Ce qu'un joueur peut encore obtenir : le catalogue publié restreint aux
// séries ouvertes. Le serveur le calcule et l'envoie — la page le recalculerait
// mal le jour où la règle se nuance, et c'est le genre de copie que ce projet a
// déjà payé une fois avec le catalogue recopié.
let A_COLLECTIONNER = 0;
let RAR = {};
let SCARVES = {};
let EVO_COST = {};
// Ce qu’un booster tire en dehors des supporters. Trois tables, parce
// qu’une carte doit s’afficher avec son nom et sa rareté : sans elles la
// page ne savait dire d’une tenue que son identifiant.
let TENUES = new Map();
let STUFFS = new Map();
let ACTES = new Map();

async function chargerCatalogue() {
  const d = await api('/dex');

  // On refuse un catalogue incomplet plutôt que d'afficher une grille à
  // moitié vide : le message doit nommer la cause, pas laisser deviner.
  const manque = ['dex', 'types', 'sets', 'rar', 'scarves', 'evoCost', 'rates',
                  'stuff', 'actions', 'tenues']
    .filter((k) => !d?.[k] || (Array.isArray(d[k]) && !d[k].length));
  if (manque.length) {
    throw Object.assign(new Error('catalogue'),
      { code: `catalogue incomplet, champs manquants : ${manque.join(', ')}` });
  }

  DEX = d.dex;
  BY_ID = new Map(DEX.map((f) => [f.id, f]));
  // Le classeur range des **personnages**, pas des âges. Le Choriste, le Meneur
  // de chant et le Capo di Curva sont trois entrées du catalogue et une seule
  // case : c'est le même individu, et le joueur n'en possède qu'un exemplaire,
  // arrivé à un certain stade.
  //
  // `racine` vient du serveur, on ne le devine pas ici. Une page qui déduit
  // elle-même qu'une carte est le deuxième âge d'une autre finit par le déduire
  // de travers, et sans rien dire — c'est la faute du catalogue recopié sous
  // une autre forme.
  PERSOS = DEX.filter((f) => (f.racine ?? f.id) === f.id);
  TYPES = d.types;
  // Seules les séries ouvertes sont proposées au kiosque. Les autres restent
  // dans le catalogue — un joueur qui possède déjà une de leurs cartes doit
  // continuer à la voir — mais on ne peut plus en acheter le booster.
  SETS = d.sets.filter((x) => x.ouverte !== false);
  A_COLLECTIONNER = d.aCollectionner ?? d.dex.length;
  RAR = d.rar;
  SCARVES = d.scarves;
  EVO_COST = d.evoCost;
  TENUES = new Map((d.tenues ?? []).map((t) => [t.id, t]));
  STUFFS = new Map((d.stuff ?? []).map((o) => [o.id, o]));
  ACTES = new Map((d.actions ?? []).map((a) => [a.id, a]));
}

/* ------------------------------------------------------------- état */

const MAXP = 12, REGEN = 10 * 60 * 1000;
let S = { col:{}, scarves:0, packs:MAXP, last:Date.now(), active:null, set:0, filter:'all' };

/** L'état complet vient du serveur : bourse, collection, Fanzzy équipé. */
async function load() {
  // Le catalogue d'abord : tout le rendu en dépend, et il n'existe plus en
  // dur dans la page.
  if (!DEX.length) await chargerCatalogue();
  const st = await api('/state');
  S.col = st.collection;
  S.stades = st.stades ?? {};
  S.scarves = st.wallet.scarves;
  S.packs = st.wallet.packs;
  S.active = st.wallet.active;
  S.nextIn = st.wallet.nextPackInMs;
  S.packPrice = st.packPrice;
  /* Les séries que ce joueur a débloquées. `null` quand la progression n'est
     pas montée : tout est alors ouvert, comme avant. */
  S.series = st.series ? new Set(st.series) : null;
  renderKiosque();
  tickRegen();
}

// Plus rien à sauvegarder ici : chaque action passe par une route qui écrit
// en base et renvoie le nouvel état.
const save = () => {};

function tickRegen() {
  if (S.nextIn != null) S.nextIn = Math.max(0, S.nextIn - 1000);
  // La bourse vit dans la barre du haut (nav.js) depuis que toutes les pages
  // partagent le même bandeau. Le kiosque est l'écran qui la fait le plus
  // bouger : sans cette poussée, un joueur qui vient de dépenser quarante-cinq
  // écharpes les verrait encore affichées.
  window.TBF_BARRE?.bourse(S.scarves, S.packs);
  // Deux raisons de fermer le bouton, et elles ne se disent pas pareil : plus
  // de booster, ou série pas encore débloquée. Le libellé est posé par
  // `renderKiosque`, qui seul connaît la série affichée.
  $('openBtn').disabled = S.packs <= 0 || !serieDebloquee(SETS[S.set] ?? {});
  const el = $('regenTxt');
  if (S.packs >= MAXP || S.nextIn == null) el.textContent = 'Réserve pleine';
  else if (S.nextIn <= 0) { el.textContent = 'Booster prêt'; load().catch(() => {}); }
  else {
    el.textContent = `Booster suivant dans ${Math.floor(S.nextIn / 60000)}:` +
      `${String(Math.floor(S.nextIn % 60000 / 1000)).padStart(2, '0')}` +
      (S.scarves >= (S.packPrice ?? 45) ? ` · ou ${S.packPrice ?? 45} écharpes` : '');
  }
}
setInterval(tickRegen, 1000);

/* ----------------------------------------------------- illustrations */

// Le dessin des Fanzzy vit dans /fanzzy-art.js, partagé avec l’accueil : une
// seule définition, comme pour le catalogue.
//
// `uid` reste ici parce que packArt, propre à cette page, s’en sert encore.
// Son préfixe « p » ne peut pas entrer en collision avec le « g » du module.
let uid = 0;
const { seeded, ILLUSTRES, illustration, art, artFond, artProcedural } = FZART;

function packArt(set) {
  const r = seeded(set.id), u = 'p' + uid++;
  let s = `<svg viewBox="0 0 100 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
   <defs><linearGradient id="pg${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${set.c2}"/>
     <stop offset=".55" stop-color="${set.c1}" stop-opacity=".5"/><stop offset="1" stop-color="${set.c2}"/></linearGradient>
   <filter id="pb${u}"><feGaussianBlur stdDeviation="6"/></filter></defs>
   <rect width="100" height="160" fill="url(#pg${u})"/>
   <polygon points="10,0 24,0 46,96 -6,96" fill="#F5C33B" opacity=".11"/>
   <polygon points="76,0 90,0 106,96 54,96" fill="#F5C33B" opacity=".11"/>`;
  for (let i = 0; i < 5; i++) s += `<ellipse cx="${(14 + r() * 72).toFixed(1)}" cy="${(90 + r() * 50).toFixed(1)}" rx="${(18 + r() * 22).toFixed(1)}" ry="${(14 + r() * 16).toFixed(1)}" fill="${set.c1}" opacity=".28" filter="url(#pb${u})"/>`;
  let st = 'M0 160'; for (let i = 0; i < 7; i++) st += `L${i * 15} ${160 - i * 7}L${(i + 1) * 15} ${160 - i * 7}`;
  s += `<path d="${st}L100 160Z" fill="#05080C" opacity=".9"/>
   <text x="50" y="34" text-anchor="middle" font-family="Oswald,Impact,sans-serif" font-size="13" fill="#F2EEE4" letter-spacing="3">FANZZY</text>
   <line x1="26" y1="40" x2="74" y2="40" stroke="#F2EEE4" stroke-width=".8" opacity=".5"/>
   <text x="50" y="55" text-anchor="middle" font-family="Oswald,Impact,sans-serif" font-size="7.5" fill="${set.c1}" letter-spacing="1.4">${set.nom}</text></svg>`;
  return s;
}

/* --------------------------------------------------------- rendu carte */

function modsText(f) {
  // `?? {}` et non `f.mods` : seuls un supporter et une pièce
  // d’équipement portent des effets. Une tenue n’en a jamais eu, une
  // carte d’action porte un `effet` et non des `mods` — et c’est en
  // butant ici que l’ouverture d’un booster s’interrompait sans un mot,
  // le paquet débité et l’écran vide.
  const m = f.mods ?? {}, out = [];
  if (m.tempoWindow) out.push(`Tempo plus tolérant (×${m.tempoWindow})`);
  if (m.tempoInterval) out.push(`Cadence ralentie de ${m.tempoInterval} ms`);
  if (m.mashTime) out.push(`Martelage ${Math.abs(m.mashTime) / 1000} s plus court`);
  if (m.mashBonus) out.push(`Martelage +${Math.round((m.mashBonus - 1) * 100)} %`);
  if (m.holdBonus) out.push(`Endurance +${Math.round((m.holdBonus - 1) * 100)} %`);
  if (m.holdForgive) out.push(`Peut lâcher ${m.holdForgive} fois`);
  if (m.perfectBonus) out.push(`Geste parfait ×${m.perfectBonus}`);
  if (m.backfire) out.push('Geste raté : retour de flamme');
  if (m.parryBonus) out.push(`Contre ×${m.parryBonus}`);
  if (m.breathBonus) out.push(`Souffle +${Math.round((m.breathBonus - 1) * 100)} %`);
  if (m.refundBonus) out.push(`Reprise ×${m.refundBonus}`);
  return out;
}

/**
 * La rareté chiffrée : un à trois losanges, une couronne pour la légendaire.
 *
 * La seconde ligne testait `legendaire` une deuxième fois — elle était donc
 * morte, et l'épique retombait sur les losanges. Une faute muette : trois
 * losanges restent une réponse plausible, personne ne cherche l'étoile qui
 * manque.
 */
function rarMark(rar) {
  if (rar === 'legendaire') return `<span class="s">♛</span>`;
  if (rar === 'epique') return `<span class="s">★</span>`;
  return '<span class="d"></span>'.repeat(RAR[rar] ?? 1);
}

/**
 * Une carte.
 *
 * `--tc` porte le type, `r-<rareté>` porte la rareté. Les deux étaient
 * confondus : le cadre prenait la couleur du type, si bien qu'une commune et
 * une légendaire du même type se ressemblaient trait pour trait dans la
 * grille. La rareté est pourtant la seule chose qu'on montre aux autres.
 *
 * `opts.verrou` : le personnage qu'on n'a pas encore. Il s'affiche quand
 * même, en ombre — voir la grille.
 */
/**
 * Une pièce d'équipement sur une carte de booster.
 *
 * `art()` dessine des Fanzzy : pour un identifiant qu'il ne connaît pas — et
 * `echarpe` n'est pas un Fanzzy — il retombait sur une silhouette procédurale.
 * On ouvrait donc un booster épique pour y trouver un bonhomme gris nommé
 * « Thermos ».
 *
 * Le fond de tribune reste celui du type, comme pour un personnage : c'est lui
 * qui porte la couleur. L'objet, lui, est détouré, donc il se pose dedans
 * plutôt que de le remplir.
 */
function objetHTML(f) {
  return `<div class="illuwrap">${artFond(f)}
    ${window.TBF_STUFF.illustration(f.id, 'illu objet')}</div>`;
}

function cardHTML(f, opts = {}) {
  const t = TYPES[f.type];
  const holo = !opts.verrou && ['epique','legendaire'].includes(f.rar) ? ' holo' : '';
  const rc = ` r-${f.rar ?? 'commune'}`;
  return `<div class="fz${rc}${holo}" style="--tc:${t.c}" data-id="${f.id}">
    <div class="body">
      <div class="top">
        <div class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="2"
          stroke-linecap="round"><path d="${t.ico}"/></svg></div>
        <div class="nm">${f.nom}</div>
      </div>
      <div class="art">${f.stuff ? objetHTML(f) : art(f)}</div>
      ${opts.verrou ? `<svg class="cadenas" viewBox="0 0 24 24" stroke-linecap="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>` : ''}
      ${opts.mini ? '' : `<div class="mods">${modsText(f).slice(0, 2).join('<br>')}</div>`}
      <div class="foot"><span class="rar">${rarMark(f.rar)}</span><span class="sep"></span>
        <span>${t.nom} · ét. ${f.stage}</span></div>
    </div>
  </div>`;
}

/* -------------------------------------------------------------- tirage

   Il n'est pas ici. Le serveur tire, débite le booster et écrit la collection
   dans une seule transaction ; la page reçoit les cinq cartes déjà décidées.

   Une copie du tirage a vécu à cet endroit, avec ses propres taux et son
   propre repli. Elle n'était appelée nulle part — et c'est le pire des cas :
   personne ne la corrigeait quand le serveur changeait, et personne ne la
   voyait diverger. Le jour où le serveur a appris à ne plus tirer de carte
   « undefined » sur une série sans commune, cette copie-là ne l'a pas appris.
   Elle est partie. */

/* ------------------------------------------------------------ kiosque */

/**
 * Carrousel en perspective.
 *
 * Les paquets existent en permanence dans le DOM et ne font que se replacer :
 * on peut donc les faire glisser au doigt, avec la position qui suit le geste
 * en temps réel plutôt que de sauter d'une série à l'autre.
 */
function buildCarousel() {
  const c = $('carousel');
  c.querySelectorAll('.slide').forEach((n) => n.remove());
  SETS.forEach((set, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.i = String(i);
    el.innerHTML = `<img alt="" loading="lazy" decoding="async" src="${src(ART[set.id])}">
      <div class="foil"></div>`;
    const img = el.querySelector('img');
    // Repli sur l'illustration dessinée si le visuel ne charge pas.
    img.onerror = () => { img.remove(); el.insertAdjacentHTML('afterbegin', packArt(set)); };
    c.appendChild(el);
  });
  placeCarousel(0);
}

function placeCarousel(drag = 0) {
  const w = 210;
  SETS.forEach((_, i) => {
    const el = $('carousel').querySelector(`.slide[data-i="${i}"]`);
    if (!el) return;
    const off = i - S.set - drag;
    const abs = Math.abs(off);
    el.style.transform =
      `translate(-50%,-50%) translateX(${off * w}px) translateZ(${-abs * 190}px) ` +
      `rotateY(${off * -26}deg) scale(${1 - abs * 0.06})`;
    el.style.zIndex = String(10 - Math.round(abs * 10));
    el.classList.toggle('center', abs < 0.5);
    el.classList.toggle('side', abs >= 0.5);
    el.classList.toggle('hidden', abs > 1.8);
  });
}

/** Ce joueur peut-il ouvrir cette série ? `null` = progression non montée. */
const serieDebloquee = (s) => !S.series || S.series.has(s.id);

function renderKiosque() {
  const s = SETS[S.set];
  const ouvrable = serieDebloquee(s);
  $('setName').textContent = s.nom;
  /* Une série hors de portée annonce **ce qu'elle demande**, et le bouton le
     répète. Le kiosque proposait les neuf séries sans distinction : le joueur
     en choisissait une, appuyait, et découvrait le refus après coup — sous la
     forme d'un code, « Ouverture impossible (fanzzy.error.set_locked) ».
     Un jeu ne cache pas ce qui vient, il le montre verrouillé. */
  $('setLine').innerHTML = ouvrable
    ? esc(`${DEX.filter((f) => f.set === s.id).length} Fanzzy · ${s.ligne}`)
    : `<span class="verrou"><svg viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2.5"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Se débloque au niveau ${
        Number(s.niveau) || '?'}</span>`;
  $('carousel').classList.toggle('verrou', !ouvrable);
  $('openBtn').textContent = ouvrable
    ? 'OUVRIR LE BOOSTER' : `NIVEAU ${s.niveau ?? '?'} REQUIS`;
  $('tearhint').textContent = ouvrable
    ? 'GLISSE POUR CHANGER · TOUCHE POUR OUVRIR' : 'GLISSE POUR VOIR LES AUTRES SÉRIES';
  $('setDots').innerHTML = SETS.map((_, i) => `<i class="${i === S.set ? 'on' : ''}"></i>`).join('');
  placeCarousel(0);
  tickRegen();
}

function goSet(delta) {
  S.set = (S.set + delta + SETS.length) % SETS.length;
  audio.flip();
  renderKiosque();
}
$('prevSet').onclick = () => goSet(-1);
$('nextSet').onclick = () => goSet(1);

/* Glissement au doigt : la position suit le geste, puis s'aimante. */
(() => {
  const c = $('carousel');
  let x0 = null, dragging = false;
  c.addEventListener('pointerdown', (e) => { x0 = e.clientX; dragging = false; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / 190;
    if (Math.abs(d) > 0.04) dragging = true;
    placeCarousel(-d);
  });
  const end = (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / 190;
    x0 = null;
    if (d < -0.28) goSet(1);
    else if (d > 0.28) goSet(-1);
    else { placeCarousel(0); if (!dragging) startTear(); }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', () => { x0 = null; placeCarousel(0); });
})();

$('openBtn').onclick = () => startTear();

/* ------------------------------------------------- le geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Un seul mouvement.

   **Ce qui précédait ne s'ouvrait pas.** Il fallait maintenir le doigt
   immobile pour « chauffer », puis tirer vers le bas sans avoir lâché — et la
   chauffe se comptait en *images*, pas en secondes : `charge += 0.02` à chaque
   `requestAnimationFrame`. Sur cette page, entre le carrousel, les lueurs qui
   respirent et le paquet qui tremble, le navigateur rend une douzaine
   d'images par seconde : la chauffe demandait quatre secondes de parfaite
   immobilité au lieu des huit dixièmes prévus, et le moindre relâchement
   remettait tout à zéro. Sur une machine rapide c'était instantané, sur une
   machine lente c'était impossible — et rien ne le disait.

   D'où les trois règles d'ici :

   - **Rien ne se compte en images.** L'avancée ne dépend que de la distance
     parcourue par le doigt. Une page à cinq images par seconde déchire
     exactement comme une page à cent vingt.
   - **Rien ne se perd sans se voir.** Lâcher trop tôt ne remet pas un compteur
     invisible à zéro : la bande revient élastiquement à sa place, et on voit
     ce qu'on a perdu.
   - **On peut toujours sortir.** « Plus tard » et Échap referment, Entrée
     ouvre sans le geste. Un plein écran dont on ne peut s'échapper qu'en
     réussissant un geste est un piège, et c'en était un : la seule issue était
     de recharger la page.                                                    */

const SEUIL_DECHIRURE = 0.72;   // au-delà, le sachet est ouvert, on ne revient pas
let tear = null;

function startTear() {
  if (S.packs <= 0) return;
  const set = SETS[S.set];
  const el = $('tearpack');

  // Le dessin du paquet, et sa copie pour la bande. `cloneNode` plutôt qu'un
  // second chargement : le repli SVG n'a pas d'URL à recharger, et une image
  // déjà décodée ne clignote pas.
  const art = document.createElement('img');
  art.src = src(ART[set.id]);
  art.alt = '';
  // Le repli est dessiné deux fois plutôt que cloné : `packArt` numérote ses
  // dégradés, et deux copies du même nœud porteraient les mêmes identifiants —
  // la seconde volerait les couleurs de la première.
  art.onerror = () => {
    $('tearart').innerHTML = packArt(set);
    $('tearlip').innerHTML = packArt(set);
  };
  art.onload = () => $('tearlip').replaceChildren(art.cloneNode(true));
  $('tearart').replaceChildren(art);
  $('tearlip').replaceChildren();

  el.style.setProperty('--p', '0');
  el.classList.remove('tire');
  $('tearlbl').innerHTML = 'TIRE LA BANDE <b>EN TRAVERS DU HAUT</b>';
  $('tearzone').classList.add('on');
  el.focus({ preventScroll: true });
  tear = { p: 0, base: 0, x0: 0, pointeur: null, tic: -1, ratees: 0, fini: false };
  audio.ready();
}

function fermerTear() {
  $('tearzone').classList.remove('on');
  $('tearpack').classList.remove('tire');
  tear = null;
}

/** Pose l'avancée, et fait le bruit et la vibration qui vont avec. */
function poser(v) {
  tear.p = v;
  $('tearpack').style.setProperty('--p', String(v));
  // Un cran de bruit tous les neuf pour cent : le son suit la main plutôt que
  // l'horloge, donc déchirer lentement fait un long crissement.
  const tic = Math.floor(v / 0.09);
  if (tic > tear.tic) {
    tear.tic = tic;
    audio.rip(0.22 + v * 0.5);
    buzz(7);
  }
  if (v > 0.12 && !tear.encourage) {
    tear.encourage = true;
    $('tearlbl').innerHTML = 'ENCORE — <b>NE LÂCHE PAS</b>';
  }
}

(() => {
  const el = $('tearpack');

  el.addEventListener('pointerdown', (e) => {
    if (!tear || tear.fini) return;
    tear.pointeur = e.pointerId;
    tear.x0 = e.clientX;
    tear.base = tear.p;
    el.classList.add('tire');
    el.setPointerCapture(e.pointerId);
    audio.ready();
  });

  el.addEventListener('pointermove', (e) => {
    if (!tear || tear.fini || tear.pointeur !== e.pointerId) return;
    // `abs` : on déchire de droite à gauche comme de gauche à droite. La
    // languette est à droite, mais un gaucher tire dans l'autre sens et rien
    // ne justifie de le lui refuser.
    const large = el.getBoundingClientRect().width || 210;
    const v = clamp(tear.base + Math.abs(e.clientX - tear.x0) / (large * 0.8), 0, 1);
    poser(v);
    if (v >= SEUIL_DECHIRURE) doOpen();
  });

  const lacher = () => {
    if (!tear || tear.fini || tear.pointeur === null) return;
    tear.pointeur = null;
    tear.tic = -1;
    tear.encourage = false;
    el.classList.remove('tire');     // rend la transition : la bande revient
    poser(0);
    tear.ratees++;
    // Au deuxième essai manqué, on cesse de laisser deviner. Quelqu'un qui n'y
    // arrive pas deux fois n'y arrivera pas à la troisième par insistance : ou
    // le geste ne passe pas sur son appareil, ou il ne peut pas le faire.
    $('tearlbl').innerHTML = 'LA BANDE EST REVENUE. <b>REPRENDS PAR LA LANGUETTE</b>'
      + (tear.ratees >= 2
        ? '<small>Ou appuie sur Entrée pour ouvrir sans le geste.</small>' : '');
  };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);

  /* Le paquet est un vrai `<button>` : Entrée et Espace l'ouvrent. C'est
     l'accès au clavier, et c'est du même coup la sortie de secours de qui ne
     peut pas faire le geste — une seule mécanique, deux services.

     `detail === 0` distingue le clic du clavier de celui de la souris : un
     glissement se termine aussi par un `click`, et sans ce filtre le sachet
     s'ouvrirait deux fois. */
  el.addEventListener('click', (e) => {
    if (!tear || tear.fini || e.detail !== 0) return;
    poser(1);
    doOpen();
  });
})();

$('tearquit').onclick = () => fermerTear();
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && tear && !tear.fini) { e.preventDefault(); fermerTear(); }
});

function doOpen() {
  if (!tear || tear.fini) return;
  tear.fini = true;
  const el = $('tearpack');
  el.classList.remove('tire');
  el.style.setProperty('--p', '1');
  audio.rip(1.4);
  buzz([40, 30, 90]);
  $('flash').classList.add('go');
  setTimeout(() => $('flash').classList.remove('go'), 520);
  setTimeout(() => {
    fermerTear();
    openPack();
  }, 320);
}

let pull = [], idx = 0, fresh = new Set();

async function openPack() {
  const setId = SETS[S.set].id;
  let res;
  try {
    // `buy` autorise le serveur à prélever des écharpes s'il ne reste aucun
    // booster gratuit. Il refuse proprement si le solde ne suffit pas.
    res = await api('/open', { set: setId, buy: S.packs <= 0 });
  } catch (e) {
    // Un message vague fait perdre des heures. Quand le serveur sait pourquoi,
    // on le dit.
    toast(({
      'fanzzy.error.no_packs': 'Plus de booster',
      'fanzzy.error.not_enough_scarves': 'Pas assez d\u2019écharpes',
      'fanzzy.error.unknown_set': 'Série inconnue',
      // Le filet de sécurité : le kiosque n'est plus censé proposer une série
      // hors de portée, mais un onglet resté ouvert depuis avant une fermeture
      // peut encore la demander. Le refus doit alors nommer sa cause — c'est ce
      // code brut, affiché tel quel, qui a fait remonter la panne.
      'fanzzy.error.set_locked': 'Cette série n’est pas encore débloquée',
      'fanzzy.error.set_closed': 'Cette série ne distribue plus de booster',
      'fanzzy.error.schema': 'Base de données incomplète — voir la console',
    })[e.code] ?? `Ouverture impossible (${e.code ?? 'sans code'})`);
    if (e.code === 'fanzzy.error.schema') console.error('[fanzzy]', e.detail ?? e.message);
    return;
  }

  /* Un booster tire quatre sortes de cartes, et chacune a besoin d'un nom.

     La page n'en connaissait qu'une. Les tenues arrivaient sous leur
     identifiant — « prehistorique » là où il fallait lire « Préhistorique » —
     et l'équipement comme les cartes d'action n'étaient connus de personne :
     ils tombaient dans la branche « carte inconnue », se faisaient jeter, et
     le joueur lisait qu'il devait recharger sa page. Depuis que les places 4
     et 5 s'ouvrent à tout l'inventaire, c'était le cas de la plupart des
     boosters.

     `type` sert ici à choisir une couleur et un pictogramme, faute d'en avoir
     de propres : une tenue prend ceux du tifo, l'équipement ceux du
     déplacement, une carte d'action ceux de la pyro. */
  const carteDe = (c) => {
    if (c.type === 'skin') {
      const t = TENUES.get(c.id);
      return { id: c.id, nom: t?.nom ?? c.id, texte: t?.texte, type: 'tifo',
        rar: t?.rar ?? 'rare', stage: 1, skin: true, pour: c.pour };
    }
    if (c.type === 'stuff') {
      const o = STUFFS.get(c.id);
      return { id: c.id, nom: o?.nom ?? c.id, texte: o?.texte, type: 'depl',
        rar: o?.rar ?? 'rare', stage: 1, stuff: true, mods: o?.mods };
    }
    if (c.type === 'action') {
      const a = ACTES.get(c.id);
      return { id: c.id, nom: a?.nom ?? c.id, texte: a?.texte, type: 'pyro',
        rar: a?.rar ?? 'rare', stage: 1, action: true };
    }
    return BY_ID.get(c.id);
  };
  pull = res.cards.map(carteDe);

  // Une carte que le serveur tire mais que cette page ne connaît pas arrivait
  // ici comme `undefined`, et cassait l'ouverture sans rien dire — c'est ce
  // qui s'est produit quand la lignée du Gamin de Devant manquait au
  // catalogue recopié plus haut. On la retire et on nomme la cause : mieux
  // vaut un booster amputé et un message clair qu'un écran figé.
  //
  // `=== 'fanzzy'` et non `!== 'skin'` : les trois autres types ont désormais
  // leur catalogue et se replient sur leur identifiant. Les compter comme
  // inconnues faisait jeter des cartes parfaitement valides.
  const inconnues = res.cards
    .filter((c, i) => c.type === 'fanzzy' && !pull[i])
    .map((c) => c.id);
  if (inconnues.length) {
    pull = pull.filter(Boolean);
    console.error('[fanzzy] catalogue de la page en retard sur le serveur :', inconnues);
    toast(`Carte inconnue de cette version : ${inconnues.join(', ')}. Recharge la page.`);
  }
  idx = 0; fresh.clear();
  for (const c of res.cards) {
    if (c.new) fresh.add(c.id);
    // La collection ne compte que des supporters. Une pièce d'équipement rangée
    // ici gonflait la progression du classeur d'une case qui n'existe pas.
    if (c.type === 'fanzzy') S.col[c.id] = (S.col[c.id] ?? 0) + 1;
  }
  S.scarves = res.wallet.scarves;
  S.packs = res.wallet.packs;
  S.nextIn = res.wallet.nextPackInMs;
  S.lastGain = res.scarvesGained;
  tickRegen();

  const st = $('ostage'); st.innerHTML = '';
  pull.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'reveal'; el.style.zIndex = 20 - i;
    el.style.transform = `translateY(${i * 7}px) scale(${1 - i * .03})`;
    el.innerHTML = `<div class="flip">
      <div class="face back"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#39414E" stroke-width="1.4"><path d="M3 20l9-16 9 16z"/><path d="M7 20l5-9 5 9"/></svg></div>
      <div class="face front">${cardHTML(f)}</div></div>`;
    st.appendChild(el);
  });
  $('summary').classList.remove('on');
  $('oAction').style.display = 'none';
  $('oHint').textContent = 'Touche la carte pour la retourner';
  $('oProg').textContent = `1 / ${pull.length}`;
  $('opener').classList.add('on');
}

$('ostage').onclick = () => {
  const cards = [...$('ostage').children];
  const cur = cards[idx];
  if (!cur) return;
  if (!cur.classList.contains('flipped')) {
    cur.classList.add('flipped');
    const f = pull[idx];
    if (fresh.has(f.id)) {
      const tag = document.createElement('div');
      tag.className = 'newtag'; tag.textContent = 'NOUVEAU';
      cur.appendChild(tag);
    }
    audio.flip();
    buzz(12);
    if (['epique','legendaire'].includes(f.rar)) {
      window.FX?.rare(f.rar, cur);
      burst(TYPES[f.type].c, f.rar === 'legendaire' ? 34 : 22);
      audio.chime(f.rar);
      // La vidéo n'est chargée qu'ici, à la première carte rare de la session :
      // une gerbe d'étincelles ne doit pas peser sur le premier affichage.
      if (f.rar === 'legendaire') playBurstVideo(true);
      if (f.rar === 'legendaire') { audio.roar(); document.getElementById('app').classList.add('quake'); 
        setTimeout(() => document.getElementById('app').classList.remove('quake'), 700); }
    }
    $('oHint').textContent = idx < 4 ? 'Touche encore pour la suivante' : 'Touche pour le récapitulatif';
    $('oAction').style.display = idx < 4 ? 'block' : 'none';
    $('oAction').textContent = 'Tout révéler';
  } else {
    cur.style.transform = 'translateX(-130%) rotate(-14deg)';
    cur.style.opacity = '0';
    if (++idx >= 5) return finishPack();
    $('oProg').textContent = `${idx + 1} / ${pull.length}`;
    cards.forEach((el, i) => { if (i >= idx) el.style.transform = `translateY(${(i - idx) * 7}px) scale(${1 - (i - idx) * .03})`; });
    $('oHint').textContent = 'Touche la carte pour la retourner';
  }
};
$('oAction').onclick = () => finishPack();
$('oClose').onclick = () => { $('opener').classList.remove('on'); renderDex(); };

function finishPack() {
  $('ostage').innerHTML = '';
  $('oProg').textContent = `${pull.length} / ${pull.length}`;
  const gained = S.lastGain ?? 0;
  $('oHint').textContent = gained
    ? `Rangées dans le classeur · +${gained} écharpes en doublons`
    : 'Rangées dans le classeur';
  $('burst').classList.remove('on');
  const sum = $('summary');
  sum.innerHTML = pull.map((f, i) => `<div data-i="${i}">${cardHTML(f, { mini:true })}</div>`).join('');
  sum.classList.add('on');
  sum.onclick = (e) => {
    const d = e.target.closest('[data-i]');
    // On ferme l'écran d'ouverture d'abord : la fiche se pose par-dessus la
    // grille, pas par-dessus un booster à moitié déchiré.
    if (!d) return;
    $('opener').classList.remove('on');
    renderDex(); renderTeam();
    ouvrirFiche(pull[+d.dataset.i].id);
  };
  const a = $('oAction');
  a.style.display = 'block'; a.textContent = 'Terminer';
  a.onclick = () => { $('opener').classList.remove('on'); a.onclick = () => finishPack(); renderDex(); renderTeam(); };
  renderDex(); tickRegen();
}

/** Superpose la gerbe d'étincelles en mode « screen » : seul ce qui brille apparaît. */
function playBurstVideo(long) {
  const v = $('burst');
  if (!ART.burst) return;
  if (!v.src) { v.src = ART.burst; v.load(); }
  v.currentTime = 0;
  v.classList.add('on');
  v.play?.().catch(() => {});
  clearTimeout(v._t);
  v._t = setTimeout(() => { v.classList.remove('on'); v.pause?.(); }, long ? 3200 : 2000);
}

function burst(color, n) {
  const st = $('ostage'), r = st.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'burst';
    p.style.background = i % 3 ? color : '#FFF3D0';
    p.style.left = r.width / 2 + 'px'; p.style.top = r.height / 2 + 'px';
    st.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 130;
    p.animate([{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
               { transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`, opacity:0 }],
      { duration:700 + Math.random() * 500, easing:'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => p.remove();
  }
}

/* ------------------------------------------------------------ classeur */

function renderDex() {
  // L'onglet actif prend la couleur de son type : c'est la même couleur que la
  // pastille des cartes qu'il montre, donc le lien se fait sans légende.
  const chips = [['all','Tout', null],
    ...Object.entries(TYPES).map(([k, t]) => [k, t.nom, t.c]),
    ['miss','Manquants', null]];
  $('filters').innerHTML = chips.map(([k, l, c]) =>
    `<button class="filt ${S.filter === k ? 'on' : ''}" data-f="${k}"
      ${c ? `style="--fc:${c}"` : ''}>${l}</button>`).join('');

  const list = PERSOS.filter((f) => S.filter === 'all' ? true
    : S.filter === 'miss' ? !S.col[f.id] : f.type === S.filter);
  // La progression se compte sur les séries ouvertes, pas sur tout le
  // catalogue : afficher « 31/166 » à quelqu'un qui possède déjà tout ce qu'il
  // peut posséder est le pire message qu'on puisse envoyer à un
  // collectionneur. Les cartes d'une série refermée qu'il possède déjà comptent
  // au numérateur — elles sont à lui — d'où le plafond sur le dénominateur.
  const owned = PERSOS.filter((f) => S.col[f.id]).length;
  const total = Math.max(A_COLLECTIONNER, owned);
  $('progBar').style.width = `${(owned / total) * 100}%`;
  $('progTxt').textContent = `${owned}/${total}`;
  // Ce qui reste, plutôt que le pourcentage fait. « 138 à trouver » se lit
  // comme un programme ; « 9 % » se lit comme une note.
  const reste = Math.max(0, total - owned);
  $('progReste').textContent = reste
    ? `${reste} à trouver` : 'collection complète';

  if (!Object.keys(S.col).length && S.filter !== 'miss') {
    $('grid').insertAdjacentHTML('afterbegin', '');
  }
  $('grid').innerHTML = list.length ? list.map((f, i) => {
    const n = S.col[f.id] ?? 0;
    // Le retard d'entrée est plafonné : sans ce plafond, la cent-cinquantième
    // carte se poserait quatre secondes après la première.
    const retard = ` style="animation-delay:${Math.min(i, 11) * 28}ms"`;
    if (!n) {
      /* Le personnage qu'on n'a pas est là quand même, en ombre. Voir la
         grille : une case vide ne donne envie de rien, une silhouette si. Le
         nom reste dans le texte de la case — c'est ce que le test lit. */
      return `<div class="slot locked" data-open="${f.id}"${retard}>${
        cardHTML(f, { mini: true, verrou: true })}</div>`;
    }
    // La case montre le personnage **tel qu'il est aujourd'hui** : celui qui a
    // payé quatre-vingt-dix écharpes doit voir son Capo, pas le gamin de
    // départ. Le stade se lit alors d'un coup d'œil sur la grille — le seul
    // endroit où le joueur compare ses cartes entre elles.
    const age = ageDe(f);
    const stade = S.stades?.[f.id] ?? 1;
    return `<div class="slot" data-open="${f.id}"${retard}>${cardHTML(age, { mini:true })}
      ${n > 1 ? `<div class="dupe">×${n}</div>` : ''}
      ${stade > 1 ? `<div class="stade">${'★'.repeat(stade - 1)}</div>` : ''}
      ${S.active === f.id ? '<div class="active-tag">DUEL</div>' : ''}</div>`;
  }).join('') : `<div class="empty">${S.filter === 'miss' ? 'Collection complète.' : 'Rien ici pour l\u2019instant.'}</div>`;
}
$('filters').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { S.filter = b.dataset.f; renderDex(); } };
$('grid').onclick = (e) => {
  const s = e.target.closest('[data-open]');
  if (!s) return;
  const f = BY_ID.get(s.dataset.open);
  /* La même fiche pour tous, possédé ou non : elle sait présenter un Fanzzy
     absent de la collection, et c'est même là qu'elle sert le plus — elle dit
     ce qu'il faudrait pour l'avoir. Avant, une carte possédée ouvrait un
     aperçu et une carte manquante changeait de page. */
  ouvrirFiche(f.id);
};

/* -------------------------------------------------------------- lignées */

/**
 * Le personnage à l'âge que le joueur a atteint.
 *
 * Sans stade enregistré, c'est le premier — ce qui est le cas de la très
 * grande majorité de la collection, et le repli naturel pour tout ce que le
 * serveur n'a pas eu le temps de dire.
 */
function ageDe(f) {
  const n = S.stades?.[f.racine ?? f.id] ?? 1;
  return n > 1 ? (lineOf(f)[n - 1] ?? f) : f;
}
function lineOf(f) {
  // Les âges d'un personnage, du premier au dernier, dans l'ordre annoncé par
  // le serveur. On ne remonte plus la chaîne à la main : `racine` et `stade`
  // arrivent avec le catalogue, et deux façons de calculer la même lignée
  // finissent par ne plus donner la même.
  const racine = f.racine ?? f.id;
  return DEX.filter((x) => (x.racine ?? x.id) === racine)
    .sort((a, b) => (a.stade ?? 1) - (b.stade ?? 1));
}

/* ------------------------------------------------------------- la fiche

 * Une seule fiche, montée ici **par-dessus la grille**.
 *
 * Il y en avait deux : cet aperçu, qui ne montrait ni les tenues ni
 * l'équipement, et la page `/fanzzy/<id>` qui montrait tout. Toucher une carte
 * ouvrait le premier, un lien au bas du premier menait au second, et le
 * classeur disparaissait en chemin. Deux rendus de la même carte finissent
 * toujours par ne plus dire la même chose — ils y étaient déjà.
 *
 * La grille reste donc derrière, la croix referme, rien ne recharge. Et
 * l'adresse suit : `/fanzzy/TR8` s'écrit dans la barre, se partage, se met en
 * favori, et le bouton retour du téléphone referme le panneau au lieu de
 * quitter le classeur.
 */

function ouvrirFiche(id, pousser = true) {
  const n = $('detail');
  n.classList.add('on');
  n.innerHTML = '';
  /* L'adresse est poussée **avant** le chargement : une fiche qui met une
     seconde à venir doit déjà être refermable par le bouton retour. */
  if (pousser && history.state?.fiche !== id) {
    history.pushState({ fiche: id }, '', '/fanzzy/' + encodeURIComponent(id));
  }
  return window.TBF_FICHE.ouvrir(n, id, {
    fermer: fermerFiche,
    // La collection a pu changer — un Fanzzy équipé, un âge acheté. La grille
    // et l'écran « Mon Fanzzy » lisent la même chose : on les relit.
    change: () => { load().catch(() => {}); },
  });
}

/**
 * Refermer.
 *
 * On repasse par l'historique quand c'est nous qui l'avons poussé : sans ça,
 * la croix laisserait `/fanzzy/TR8` dans la barre d'adresse sur une grille
 * ouverte, et le bouton retour rouvrirait une fiche qu'on vient de fermer.
 */
function fermerFiche() {
  if (history.state?.fiche) { history.back(); return; }
  rangerFiche();
}
function rangerFiche() {
  $('detail').classList.remove('on');
  $('detail').innerHTML = '';
}

window.addEventListener('popstate', (e) => {
  if (e.state?.fiche) ouvrirFiche(e.state.fiche, false);
  else rangerFiche();
});

// Échap referme, comme partout ailleurs dans le jeu.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('detail').classList.contains('on')) fermerFiche();
});

/* On peut arriver sur le classeur par une adresse de fiche — un lien partagé
   suivi d'un retour arrière, par exemple. L'état de l'historique fait foi. */
if (history.state?.fiche) ouvrirFiche(history.state.fiche, false);

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2400);
}

/* ----------------------------------------------------------- Mon Fanzzy */

/**
 * L'écran d'ouverture : le Fanzzy qu'on emmène en duel.
 *
 * Le personnage **en pied** et non sa carte. La carte a sa place dans la
 * grille, où l'on compare cent cinquante personnages entre eux ; ici on n'en
 * regarde qu'un, et la vignette ne faisait que le rétrécir au milieu d'une
 * colonne de texte. On montre donc l'âge atteint, dans le cadre de sa rareté,
 * et on ne garde autour que ce qu'on veut savoir avant d'entrer : ce qu'il
 * change, et son cri.
 *
 * Il hérite de deux écrans déjà faits — le cadre de la fiche, la respiration
 * et le salut de l'accueil. C'est le même personnage aux deux endroits :
 * animé autrement, ce serait deux personnages.
 */
function renderTeam() {
  const f = S.active ? BY_ID.get(S.active) : null;
  if (!f || !S.col[f.id]) {
    $('teamBody').innerHTML = `<div class="empty" style="padding:44px 22px">
      Aucun Fanzzy choisi.<br>Ouvre un booster, puis choisis-le depuis le classeur.</div>`;
    return;
  }
  // Le personnage **tel qu'il est aujourd'hui** : celui qui a payé ses
  // écharpes doit voir son Capo, pas le gamin de départ. Comme dans la grille.
  const age = ageDe(f);
  const t = TYPES[age.type] ?? { nom: '—', c: 'var(--projo)' };
  const stade = S.stades?.[f.id] ?? 1;
  const effets = modsText(age);
  const possede = S.col[f.id] ?? 1;

  $('teamBody').innerHTML = `
    <div class="tscene r-${age.rar ?? 'commune'}" id="tscene" style="--tc:${t.c}">
      <div class="fond">${artFond(age)}</div>
      <div class="halo"></div>
      <!-- La scène du personnage est montée par fanzzy-scene.js :
           mêmes calques, même respiration que dans le virage. -->
      <div class="tpile" id="tpile"></div>
      <div class="ombre"></div>
      <div class="trar">${rarMark(age.rar)}</div>
      <div class="ttag">EN DUEL</div>
      <div class="ttxt">
        <div class="tpast">
          <span><b>${esc(t.nom)}</b></span>
          <span>Cri : <b>${esc(age.cri?.label ?? '—')}</b> · ${age.cri?.power ?? 0} de poussée</span>
          <span>${possede} exemplaire${possede > 1 ? 's' : ''} · étage ${stade}</span>
        </div>
        <h2>${esc(age.nom)}</h2>
      </div>
    </div>

    <div class="teff">${effets.length
      ? effets.map((e) => `<span>${esc(e)}</span>`).join('')
      : '<span class="rien">Aucun effet particulier : il pousse comme les autres.</span>'}</div>

    <div class="tbtns">
      <button class="dbtn primary" id="goDuel">ENTRER EN DUEL</button>
      <a class="dbtn" href="/fanzzy/${f.id}">SA FICHE</a>
    </div>`;

  // Le Fanzzy équipé est déjà connu du serveur : le duel le lira lui-même.
  $('goDuel').onclick = () => { location.href = '/duel'; };
  habiller(f, age, stade);
}

/* Le rendu peut repartir pendant qu'une image charge — on choisit un autre
   Fanzzy, on le fait évoluer. La scène est refaite avec le reste de l'écran :
   c'est elle, et non un jeton, qui garantit qu'une image en retard n'atterrit
   pas dans un écran qui ne l'attend plus. */
let sceneEquipe = null;

/**
 * Pose le personnage dans sa boîte.
 *
 * Le repli descend d'un cran à la fois : les douze états, puis le plein-pied,
 * puis le dessin procédural — qui vaut toujours mieux qu'un cadre vide. Les
 * deux premiers viennent de `fanzzy-scene.js`, partagé avec le virage ; le
 * troisième reste ici, parce que le dessin procédural a besoin de la fiche
 * complète du catalogue et que le virage, lui, ne l'a pas.
 *
 * `perso` est **la lignée**, `age` la carte du catalogue à l'âge atteint. Les
 * états sont rangés sous la première, l'illustration en pied sous la seconde :
 * confondre les deux montre le Choriste à qui a payé pour le Meneur de chant.
 */
async function habiller(perso, age, stade) {
  sceneEquipe = window.TBF_SCENE?.creer?.($('tpile'), { fond: 'neutre' }) ?? null;
  const vu = await sceneEquipe?.definir({ id: perso.id, age: age.id, evo: stade });
  if (vu) { $('tscene')?.classList.add('entre'); return; }

  // Ni états ni illustration : le dessin géométrique, comme dans la grille.
  $('tpile').innerHTML = `<div class="tdessin">${artProcedural(age)}</div>`;
  $('tscene')?.classList.add('entre');
}
/* ----------------------------------------------------------------- nav */

document.querySelectorAll('.nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
    $('s-' + b.dataset.go).classList.add('on');
    if (b.dataset.go === 'dex') renderDex();
    if (b.dataset.go === 'equipe') renderTeam();
  };
});

/* ---------------------------------------------------------------- init */

/* Le décor est posé par nav.js, comme sur toutes les autres pages : même
   photo, même voile. Le fond propre au kiosque et son suivi de l'inclinaison
   sont partis avec lui — deux décors superposés se battaient, et celui du
   dessous ne se voyait pas. */

(async () => {
  try {
    await load();
  } catch (e) {
    if (e.message === 'auth') return;
    // Le catalogue vient du réseau depuis qu'il n'est plus recopié ici : une
    // page qui échoue à le charger n'a rien à afficher, et un « serveur
    // injoignable » générique ferait chercher au mauvais endroit. On nomme la
    // cause, et on l'écrit dans la grille plutôt que dans un toast qui
    // s'efface au bout de trois secondes.
    const cause = e.code ?? e.message ?? 'cause inconnue';
    const zone = $('grid');
    if (zone) {
      zone.innerHTML = `<div class="empty" style="padding:40px 20px;line-height:1.8">
        Le classeur n\u2019a pas pu charger le catalogue.<br>
        <span style="opacity:.6">${esc(cause)}</span><br>
        <a href="" style="color:var(--projo)">réessayer</a></div>`;
    }
    toast(`Catalogue indisponible : ${cause}`);
    return;
  }
  buildCarousel(); renderKiosque(); renderDex(); renderTeam();
})();
</script>
<script src="/fx.js" defer></script>
<script src="/nav.js" defer></script>
</body>
</html>
