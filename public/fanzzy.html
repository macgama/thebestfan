<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fanzzy — collection</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="stylesheet" href="/cartes.css">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;overflow:hidden}
/* Le fond opaque a disparu : il recouvrait le décor de tribune commun, et la
   page se retrouvait seule sur un aplat noir pendant que toutes les autres
   étaient posées sur le stade. Il ne reste que la lueur chaude du haut, qui
   éclaire le kiosque sans rien cacher.

   `padding-bottom` : la page fait exactement une hauteur d'écran et ne défile
   pas, donc rien ne la décale au-dessus de la barre du bas — le bouton
   « ouvrir le booster » passait dessous. */
#app{position:relative;width:100%;max-width:var(--colonne);height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom));
  background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%)}

.screen{flex:1;display:none;flex-direction:column;min-height:0;z-index:2}
.screen.on{display:flex}


/* ------------------------------------------------------------------ dex */
/* ------------------------------------------------------- l'en-tête

   Une jauge de cinq pixels et « 14/152 » en gris : c'était exact et ça ne
   disait rien. Dans ce genre de jeu, la progression est la récompense — elle
   se met en gros, elle a de la matière, et elle annonce ce qui reste plutôt
   que ce qui est fait. « 138 à trouver » se lit comme un programme ; « 9 % »
   se lit comme une note. */
.head{padding:4px 16px 0;flex:none}
/* **Sur un panneau, et plus à même la photo.** Le compte et « 138 à trouver »
   étaient posés directement sur la tribune : un projecteur derrière le
   chiffre, et on ne lisait plus où l'on en était. Le panneau est celui de
   toute l'interface — `--panneau`, opaque depuis le lot 0.

   `#s-dex` et non `.head` seul : la fiche montée dans `#detail` a sa propre
   `.head`, et ce fond lui tomberait dessus. */
#s-dex .head{margin:2px 14px 10px;padding:12px 14px 12px;border-radius:var(--r);
  background:var(--panneau);box-shadow:inset 0 0 0 1px var(--trait)}
.head .l{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.head h2{font-family:var(--banner);font-size:19px;letter-spacing:.12em;margin:0;flex:1}
.head .n{font-family:var(--banner);font-size:25px;line-height:.9;color:var(--projo);
  font-variant-numeric:tabular-nums}
/* À pleine encre : c'est la phrase qui dit ce qu'il reste à faire, pas une
   légende. À moitié d'opacité et en dix pixels et demi, elle disparaissait
   au premier rayon de soleil. */
.head .reste{font-size:12px;letter-spacing:.1em;text-align:right;
  line-height:1.2;margin:8px 0 0}
/* **La jauge est l'écharpe du jeu** (`.tbf-jauge`, ui.css) : un rail de
   parpaing, le tricot or et rouge, et le nœud de craie qui dit « j'en suis
   là ». Le classeur peignait la sienne — une barre d'or bombée, un reflet
   blanc qui la balayait en boucle —, si bien que l'écharpe nouée, la seule
   jauge du jeu, ne se voyait pas sur l'écran même que la maquette dessine
   autour d'elle. Le reflet est parti avec la barre : la toile est mate, et
   c'est le nœud qui glisse, au remplissage, qui fait vivre la jauge. L'écran
   y gagne aussi une animation infinie de moins.

   Il ne reste ici que la place : les franges du nœud pendent de dix pixels
   sous le rail, sans rien pousser, et tomberaient sur « 138 à trouver », calé
   à droite, dès que la collection avance. Quatre pixels de plus dessous les
   en écartent ; le rail, lui, perd un pixel (douze au lieu de treize). Un
   rembourrage et non une marge : une marge basse se fondrait dans les huit
   pixels du haut de `.reste`, et la place ne grandirait pas d'un pixel. */
.progress{margin:0;padding-bottom:4px}

/* La rangée défile en largeur : `overflow-x:auto` rogne aussi en hauteur, donc
   on garde sous les plaques la place de leur tranche et de leur cerne. */
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 16px 12px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* **Des plaques, comme tout ce qui s'enfonce dans le jeu.** Les filtres
   avaient leur propre biseau, leur propre enfoncement et leur propre opacité
   d'onglet éteint (0,62 : illisible dehors). Ils prennent `.tbf-plaque` : la
   peinture et l'enfoncement viennent de ui.css, il ne reste ici que ce qui
   tient la rangée — une ligne qui ne se coupe pas, un corps un peu plus petit
   que celui d'une action, et quarante-quatre pixels sous le doigt.

   L'actif prend le ton de l'écran — le bleu de ce qu'on possède — et plus la
   couleur de son type : un filtre allumé en or se lisait comme un bouton
   d'achat, en rouge comme un bouton de jeu. La famille garde sa couleur, dans
   son pin ou dans sa pastille, et c'est elle qui fait le lien avec la carte. */
.filt{white-space:nowrap;font-size:12px;padding:0 13px;min-height:44px;gap:6px}
/* Le pin du type, dans son bouton. */
.filt .pinFiltre{width:16px;height:16px;object-fit:contain;flex:none}
/* **La pastille de la famille**, à la place du pin sur un petit écran : la
   rangée y défile déjà, et huit images de plus la feraient défiler deux fois
   plus longtemps pour la même information. Un point de la couleur du type —
   celle du rond en haut de chaque carte — cerné pour rester visible même sur
   la plaque bleue de l'actif. */
.filt .teinte{display:none;width:9px;height:9px;flex:none;border-radius:50%;
  background:var(--fc);box-shadow:0 0 0 2px var(--cerne)}
@media (max-width:400px){
  .filt .pinFiltre{display:none}
  .filt .teinte{display:block}
}
/* L'en-tête d'une série : l'emblème, le nom, et toute la largeur. Il sépare,
   il n'annonce pas — mais il se lit : c'est un titre cousu (C2, ui.css) posé
   sur une bande de panneau, parce que la grille défile **sur la photo** et qu'un
   nom de série écrit à même la tribune disparaissait sous le premier
   projecteur. Ici, seule la mise en page : la lettre et le fil viennent de
   `.tbf-cousu`. Le premier n'a pas de marge haute : une ligne de titre décollée
   du haut de la grille se lit comme un oubli. */
.serieTete{grid-column:1/-1;display:flex;align-items:center;gap:8px;
  margin:14px 0 2px;padding:6px 10px;border-radius:10px;
  background:var(--panneau);box-shadow:inset 0 0 0 1px var(--trait)}
.serieTete:first-child{margin-top:4px}
.serieTete .ecusson{width:22px;height:22px;flex:none;object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
/* Le nom prend la graisse du titre cousu, pas le gras du navigateur. */
.serieTete b{font-weight:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 9px;padding:2px 14px 22px;
  overflow-y:auto;flex:1}
/* Le socle dur déborde sous la carte : la case lui garde sa place, sinon la
   rangée suivante mange le biseau et les cartes paraissent rognées. */
.slot{position:relative;aspect-ratio:63/88;border-radius:6px;cursor:pointer;
  transition:transform .11s cubic-bezier(.3,1.5,.5,1)}
.slot:active{transform:translateY(3px) scale(.975)}

/* Les cases vides.

   Elles étaient des rectangles pointillés avec un nom en gris. Neuf cases sur
   douze à l'écran, et la grille ressemblait à un formulaire à remplir plutôt
   qu'à une collection. Surtout, elles ne donnaient **aucune envie** : on ne
   désire pas un rectangle.

   Le personnage est donc là, en ombre, dans son cadre éteint. On voit ce qu'on
   n'a pas — c'est tout le ressort du genre, et ça ne coûte rien de plus : le
   dessin existe déjà, `loading="lazy"` ne charge que ce qui est à l'écran. */
.slot.locked .fz{cursor:pointer;
  box-shadow:inset 0 0 0 calc(1.1 * var(--u)) rgba(242,238,228,.13),
             inset 0 0 calc(7 * var(--u)) rgba(0,0,0,.5),
             0 calc(1.2 * var(--u)) 0 rgba(242,238,228,.07),
             0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.45)}
/* Assez sombre pour dire « pas à toi », assez clair pour qu'on reconnaisse le
   personnage. À trois dixièmes de luminosité le visage disparaissait, et une
   silhouette qu'on ne distingue pas ne vaut pas mieux qu'une case vide. */
.slot.locked .art{filter:grayscale(1) brightness(.46) contrast(1.15)}

/* **Un premier âge se montre, une évolution se cache**, et la nuance décide de
   deux envies différentes.

   Un personnage qu'on n'a pas encore se tire dans un booster : le voir en ombre
   donne envie de l'ouvrir, et c'est tout le ressort du genre. Ses âges
   supérieurs, eux, ne se tirent pas — ils s'achètent en écharpes, sur un
   personnage qu'on possède déjà. Les montrer revient à donner d'avance la seule
   chose qu'on paie, et l'évolution n'a plus rien à révéler.

   Le flou, donc, et pas la case vide : on garde la carrure, la couleur et la
   lumière — tout ce qui dit « il y a quelqu'un là-dessous ». C'est la même
   règle que la fiche, voir `fanzzy-fiche.css`.

   Trois pixels et non dix-sept : la vignette fait cent pixels de large là où la
   vitrine en fait six cents. Un flou dimensionné pour l'une efface l'autre. */
.slot.locked.secret .art{filter:blur(3px) grayscale(.75) brightness(.55) contrast(1.1)}
/* Le nom d'un âge secret est **flouté**, pas pâli : c'est le flou qui le
   cache, et il le cache entièrement. La demi-opacité qu'il portait en plus
   n'ajoutait rien au secret. */
.slot.locked.secret .nm{filter:blur(2.2px)}
/* **Une lignée qu'on n'a pas du tout prend un seul ton.**

   Le flou ci-dessus est fait pour une évolution qu'on peut acheter : on a le
   personnage, il reste à payer. Il éclaircissait la case — trois quarts de gris
   au lieu d'un gris plein, et plus de lumière — si bien que les trois âges
   d'une lignée absente s'affichaient en deux tons, et que les âges supérieurs
   paraissaient **moins** verrouillés que le premier. C'est l'inverse de ce qui
   est vrai : sans le premier, les autres ne s'achètent même pas.

   Le gris du premier âge, donc, et le flou par-dessus : toujours secrètes, mais
   pas plus proches. */
.slot.locked.secret.orphelin .art{filter:blur(3px) grayscale(1) brightness(.46) contrast(1.15)}
.slot.locked .top::before,.slot.locked .foot,.slot.locked .pip{display:none}
/* Le nom d'une carte qu'on n'a pas reste à pleine encre : c'est lui qui dit
   ce qu'on cherche. L'ombre et le cadenas disent déjà « pas à toi ». */
/* **« calc(.5 × u) », et non « .calc(5 × u) ».** Le point était tombé devant
   la fonction au lieu de rester devant le cinq — une conversion de « .5px »
   en unités de carte — et la valeur invalide faisait jeter l'ombre entière,
   sans un mot : le cadenas flottait sans relief sur la silhouette. */
.slot.locked .cadenas{position:absolute;left:50%;top:40%;z-index:4;width:calc(13 * var(--u));height:calc(13 * var(--u));
  transform:translate(-50%,-50%);opacity:.75;stroke:#F2EEE4;fill:none;stroke-width:2;
  filter:drop-shadow(0 calc(.5 * var(--u)) calc(1.5 * var(--u)) rgba(0,0,0,.9))}
/* Onze pixels au moins pour tout ce qui se lit sur une case : le nombre de
   doublons, les étoiles d'âge, la marque de l'avatar. À neuf, huit et demi,
   ils étaient là pour qui savait déjà ce qu'ils disaient. */
.dupe{position:absolute;right:3px;bottom:3px;background:rgba(8,10,13,.9);border:1px solid rgba(242,238,228,.28);
  border-radius:3px;font-family:var(--banner);font-size:11px;line-height:1.3;padding:0 4px;z-index:4}
/* Le stade atteint : une étoile pour rare, deux pour épique. En haut à droite,
   là où rien d'autre ne s'affiche — le compteur de doublons tient le bas et le
   marqueur de duel le coin gauche. */
.stade{position:absolute;right:3px;top:3px;color:var(--projo);font-size:11px;line-height:1;
  letter-spacing:-1px;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:4}
.active-tag{position:absolute;left:3px;top:3px;background:var(--projo);color:#0B0E13;border-radius:3px;
  font-family:var(--banner);font-size:11px;line-height:1.3;padding:0 5px;z-index:4;letter-spacing:.04em}
/* **Le message d'une grille vide a son panneau.** Il était écrit à même la
   photo, à moitié d'opacité : « Aucun Fanzzy choisi » se perdait entre deux
   projecteurs. Même fond que le reste de l'interface, et l'encre entière. */
.empty{grid-column:1/-1;text-align:center;padding:44px 22px;font-size:12.5px;line-height:1.7;
  border-radius:var(--r);background:var(--panneau);box-shadow:inset 0 0 0 1px var(--trait)}
#teamBody .empty{margin:10px 14px 0}

/* ------------------------------------------------------------- détail */
/* La boîte de la fiche. Elle ne porte plus de marge intérieure : la fiche
   arrange la sienne, et elle est la même à l'adresse /fanzzy/<id>.

   **Plein, et sans flou.** Le fond était à 96 %, flouté : le flou
   d'arrière-plan recalculait la grille entière à chaque image, et il était la
   seule chose qui rendait ces quatre pour cent supportables. Sans lui, ce qui
   passe dessous reste **net** — vu au navigateur, « FANZZY » et le bouton du
   menu se lisaient en fantôme à côté de la croix de la fiche. Même défaut, et
   même remède, que le voile de la collection. */
#detail{position:absolute;inset:0;z-index:26;display:none;flex-direction:column;
  background:#05070A}
#detail.on{display:flex}
/* Les deux boutons du personnage sont des plaques (`.tbf-plaque`, ui.css) :
   le socle, l'enfoncement et l'état éteint sont ceux de tout le jeu. Ils
   avaient les leurs, copiés du kiosque, et la fiche paraissait venir d'une
   autre application que la grille qui l'ouvre. Il ne reste ici que la place
   qu'ils prennent. */
.dbtn{flex:1}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#171C23;z-index:40;
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;
  display:none;max-width:88%;text-align:center}
.toast.on{display:block;animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}

/* ======================================================== Mon Fanzzy

   L'écran qui ouvre la section : le personnage qu'on emmène en duel, en pied,
   dans le cadre de sa rareté. Il montrait sa carte en vignette au milieu d'une
   colonne de texte — c'est la façon de présenter cent cinquante personnages,
   pas celle d'en présenter un.

   Il hérite de deux écrans déjà faits, et n'invente rien de troisième : le
   cadre de rareté vient de la fiche, la respiration et le coucou viennent de
   l'accueil. Le joueur voit ici le même personnage qu'il verra en arrivant
   sur le jeu ; s'il s'animait autrement, ce serait deux personnages.        */

#teamBody{flex:1;min-height:0;display:flex;flex-direction:column}

/* **Le personnage est un lien vers sa fiche.**

   Il ne l'était pas : « SA FICHE » attendait tout en bas, sous les effets, à
   côté d'« ENTRER EN DUEL ». Or ce qu'on touche sur cet écran, c'est le
   portrait — c'est lui qui occupe les deux tiers de la hauteur, et toucher une
   image qui ne répond pas se lit comme un écran figé.

   Un vrai `<a>` et non un gestionnaire de clic : il se tabule, s'ouvre dans un
   onglet, se partage, et marche avant que le script de la page n'arrive. Le
   bouton du bas reste — il nomme ce que le portrait ne dit pas, et deux chemins
   vers le même endroit ne se gênent jamais. */
.tscene{position:relative;flex:1;min-height:0;margin:2px 14px 0;border-radius:16px;overflow:hidden;
  display:block;color:inherit;text-decoration:none;cursor:pointer;
  background:linear-gradient(160deg,#141A21,#0A0D11);
  box-shadow:inset 0 0 0 2px var(--rc,#C2CAD6),0 5px 0 var(--rc2,#4E5865),
             0 10px 24px rgba(0,0,0,.55)}
/* Le retour visuel du toucher : sans lui, un lien qui occupe tout l'écran ne
   se distingue pas d'un décor, et l'on ne sait pas qu'on a appuyé. */
.tscene:active{transform:translateY(1px)}
.tscene:focus-visible{outline:2px solid var(--projo);outline-offset:3px}
.tscene.r-legendaire{box-shadow:inset 0 0 0 2.5px var(--rc),0 5px 0 var(--rc2),
  0 0 34px rgba(245,195,59,.3),0 10px 24px rgba(0,0,0,.55)}
.tscene .fond{position:absolute;inset:0;opacity:.5}
.tscene .fond svg{width:100%;height:100%;display:block}
.tscene .halo{position:absolute;inset:0;opacity:.3;
  background:radial-gradient(70% 54% at 50% 80%,var(--tc,#F5C33B),transparent 70%)}
.tscene .ombre{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(4,6,10,.10) 38%,rgba(4,6,10,.92))}

/* La boîte du personnage. Ce qui vit dedans — les calques de gestes, la
   respiration, le croisement des poses — est monté par `fanzzy-scene.js` et
   habillé par `ui.css` : c'est la même mécanique que dans le virage, et le
   jour où elle change, elle change pour les deux. La page ne décide ici que
   de la place. */
.tpile{position:absolute;left:6%;right:6%;top:5%;bottom:0;z-index:1}
/* Le repli dessiné, pour les personnages qui n'ont ni états ni illustration :
   il tient la même place, pour que l'écran ne change pas de forme selon le
   Fanzzy qu'on a choisi. */
.tdessin{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  width:min(74%,232px);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tdessin svg{width:100%;display:block}

.ttxt{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 14px}
.ttxt h2{font-family:var(--banner);font-size:clamp(21px,6.4vw,28px);margin:0;
  letter-spacing:.03em;line-height:1;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.tpast{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tpast span{border-radius:999px;padding:5px 10px;font-size:11px;background:rgba(4,6,10,.72);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.16)}
.tpast b{color:var(--tc,var(--projo))}
.trar{position:absolute;top:11px;left:11px;z-index:3;display:flex;gap:4px;align-items:center;
  background:rgba(4,6,10,.65);border-radius:99px;padding:6px 10px;line-height:1;
  color:var(--rc,#C2CAD6);box-shadow:inset 0 0 0 1.5px var(--rc,#C2CAD6)}
.trar .d{width:8px;height:8px;background:currentColor;border-radius:1px;
  transform:rotate(45deg);display:block}
.trar .s{font-size:14px;line-height:1}
.ttag{position:absolute;top:11px;right:11px;z-index:3;font-family:var(--banner);font-size:11px;
  letter-spacing:.12em;border-radius:6px;padding:5px 9px;background:var(--projo);color:#0B0E13}

/* Ce qu'il change, en une bande de hauteur **fixe**. Sans elle, un Fanzzy à
   cinq effets pousserait le bouton hors de l'écran — et cette page ne défile
   pas, il disparaîtrait pour de bon.

   Le panneau commun, sans flou : `--panneau` est opaque depuis le lot 0, et
   le flou d'arrière-plan se recalculait à chaque respiration du personnage
   juste au-dessus. */
.teff{flex:none;height:76px;margin:9px 14px 0;padding:9px 10px;
  overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;
  border-radius:12px;background:var(--panneau);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.11)}
.teff span{font-size:11px;line-height:1.25;padding:6px 9px;border-radius:8px;
  background:rgba(242,238,228,.07);box-shadow:inset 0 0 0 1px rgba(242,238,228,.09)}
/* « Aucun effet particulier » est une information, pas une excuse : elle se
   lit comme le reste de la bande. */
.teff .rien{background:none;box-shadow:none}

.tbtns{display:flex;gap:9px;padding:10px 14px 2px;flex:none}

/* ---------------------------------------------------------------- nav */
/* Onglets en haut plutôt qu'en bas : la barre de navigation commune occupe
   déjà le bas de l'écran, et deux barres superposées se recouvraient — les
   onglets devenaient inatteignables.

   **Le rail et la porte.** MON FANZZY et CLASSEUR changent d'écran sans
   changer de page : ce sont des onglets, dans leur rail. DECK, lui, **quitte
   la page** — c'est `/deck`. Il était un troisième onglet, et un onglet qui
   emmène ailleurs ment sur ce qu'il fait : on croit feuilleter, on part. Il
   devient donc une plaque posée à côté du rail, avec la flèche ↗ des liens
   qui sortent (`.tbf-ico-lien`, ui.css).

   En béton et non en bleu : l'onglet allumé du rail est déjà une plaque
   bleue, et deux objets bleus côte à côte laisseraient croire que les deux
   sont « ici ».

   La plaque est calée sur le rail : sa face fait la hauteur du rail moins sa
   propre tranche, de sorte que les deux s'arrêtent sur la même ligne. */
.rail{display:flex;align-items:flex-start;gap:8px;flex:none}
.rail .nav{flex:1;min-width:0}
.rail .vers-deck{flex:none;min-height:49px;padding:0 14px}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<main id="app">
  <!-- Plus de bandeau « FANZZY / collection » : la barre du haut dit
       maintenant où l'on est, et le répéter trente pixels plus bas ne faisait
       qu'occuper la place au-dessus des onglets. L'écran commence donc par ses
       onglets, comme le deck. -->
  <!-- Le rail porte le ton de l'écran sur le hub — le bleu de ce qu'on
       possède (contrat C5) : c'est l'onglet allumé qui le montre. -->
  <div class="rail">
  <nav class="nav tbf-onglets" data-ton="bleu">
    <!-- L'ordre dit le chemin : mon personnage, puis ma collection, puis le
         deck où les emmener. Le kiosque venait en premier et « DUEL » en

    <button data-go="equipe" class="tbf-onglet on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>MON FANZZY</button>
    <button class="tbf-onglet" data-go="dex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M4 8h4M4 13h4"/></svg>CLASSEUR</button>
  </nav>
  <!-- Le deck **change de page**, et c'est assumé : il a mille lignes à lui,
       et les fondre ici ferait un fichier que personne ne relit. Il n'est donc

  <a class="tbf-plaque vers-deck" href="/deck">DECK<i class="tbf-ico tbf-ico-lien" aria-hidden="true"></i></a>
  </div>


  <section class="screen" id="s-dex">
    <div class="head">
      <div class="l">
        <!-- Le même titre que sur le deck : barre d'accent dorée, lettrage du
             jeu. Deux écrans voisins qui titrent différemment se lisent comme
             deux applications. -->

      </div>

      <div class="reste" id="progReste"></div>

  </section>

  <section class="screen on" id="s-equipe">
    <!-- Un titre, comme les deux autres écrans. Sans lui, « Mon Fanzzy »
         commençait directement par une carte : on ne savait pas si l'onglet
         avait répondu, ou si la page chargeait encore. -->

    </div>
    <div id="teamBody"></div>
  </section>




  <!-- La fiche d un Fanzzy, montée par fanzzy-fiche.js par-dessus la grille.
       Elle était partie avec le bloc de la déchirure : les deux voisinaient
       dans le balisage sans avoir rien à voir. -->
  <div id="detail"></div>
  <div class="toast" id="toast"></div>
</main>

<!-- Sans « defer » : le script en ligne ci-dessous lit FZART dès sa première
     ligne, il doit donc déjà exister. -->
<!-- Le dictionnaire des effets, avant tout ce qui en affiche. Il ne depend
     de rien et ne charge rien : voir son en-tete. -->
<script src="/mods.js"></script>
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fond.js"></script>
<!-- Ce que le classeur et les boosters partagent : l état, le catalogue, le
     dessin d une carte. **Après** fanzzy-art.js, dont il lit FZART dès sa
     première ligne — l ordre n est pas un détail de mise en page. -->
<script src="/cartes.js"></script>
<!-- Les dessins de l’équipement : sans eux, une pièce tirée d’un booster
     s’affichait en silhouette procédurale, comme un Fanzzy sans visage.
     Il sert aussi aux écharpes, dont le dessin est rangé avec les gains. -->
<script src="/stuff-art.js"></script>
<script src="/logo-art.js"></script>
<!-- Et ceux des cartes d’action, qui n’étaient chargés nulle part ici : une
     carte d’action tirée d’un booster tombait donc sur la même silhouette
     grise que les écharpes, et deux cartes très différentes se ressemblaient
     trait pour trait au moment précis où on les découvre. -->
<script src="/action-art.js"></script>
<!-- Les douze états du Fanzzy équipé : c'est ce qui fait saluer le personnage
     sur l'écran « Mon Fanzzy », exactement comme sur l'accueil. Le module ne
     lève jamais et ne demande rien tant qu'on ne l'appelle pas. -->
<script src="/fanzzy-etats.js"></script>
<!-- La scène : les calques de gestes et le croisement des poses, partagés
     avec le virage. -->
<script src="/fanzzy-scene.js"></script>
<link rel="stylesheet" href="/fanzzy-fiche.css">
<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en
     panneau par-dessus la grille. -->
<script src="/fanzzy-fiche.js"></script>
<script>
/* =======================================================================
   FANZZY — collection, boosters, évolutions
   Les Fanzzy ne donnent pas de points : ils changent la façon dont tes
   gestes se jouent en duel. La rareté achète du choix, pas de la force —
   c'est ce qui évite qu'acheter des boosters revienne à acheter des victoires.
   ======================================================================= */

/**
 * Visuels générés avec Artlist (Nano Banana Pro).
 *
 * Ils sont ici en lien direct vers le CDN d'Artlist. Avant la mise en ligne,
 * télécharge-les et sers-les depuis /public/img : un CDN tiers ajoute une
 * résolution DNS, une poignée de main TLS et une dépendance que tu ne
 * contrôles pas — trois choses qui coûtent cher au score de performance.
 * Si une image ne charge pas, la page retombe sur l'illustration dessinée en
 * SVG : rien ne casse.
 */
/* Les aides communes vivent dans /cartes.js : l'état, le catalogue, le
   dessin d'une carte, la table des raretés. Le kiosque les partageait sans
   que rien ne le dise ; il a son écran à lui, et elles ont leur fichier. */
const { $, AC, ACTES, ART, BY_ID, DEX, EVO_COST, ILLUSTRES, IMG_EXT, MAXP, PERSOS, RAR, S, SCARVES, SETS, SETS_TOUTES, STUFFS, TENUES, TYPES, api, art, artFond, artProcedural, audio, buzz, cardHTML, chargerCatalogue, clamp, esc, illustration, load, modsText, objetHTML, packArt, rarMark, save, seeded, src, uid } = window.TBF_CARTES;


/* ------------------------------------------------------------ classeur */

function renderDex() {
  // Chaque filtre de famille porte la couleur de son type — dans son pin, ou
  // dans sa pastille sur un petit écran : c'est la même couleur que le rond
  // des cartes qu'il montre, donc le lien se fait sans légende. L'actif, lui,
  // s'allume au ton de l'écran (voir la règle « .filt »).
  const chips = [['all','Tout', null],
    ...Object.entries(TYPES).map(([k, t]) => [k, t.nom, t.c]),
    ['miss','Manquants', null]];
  /* **L'emblème du type dans son bouton.**

     Le bouton ne portait que sa couleur, et la couleur seule demande d'avoir
     appris que le violet est le tifo. Le pin le montre. « Tout » et
     « Manquants » n'en ont pas : ce ne sont pas des types, et leur en donner
     un ferait croire qu'ils en sont.

     Il disparaît sous quatre cents pixels — voir la règle plus bas : sur un
     petit écran la rangée de huit boutons défile déjà, et huit images de
     plus la feraient défiler deux fois plus longtemps pour la même
     information.

     Des plaques (`.tbf-plaque`) : `filt` et `on` restent, le premier parce
     que `fanzzy-ui-smoke` mesure les filtres par lui, le second parce qu'il
     dit lequel est allumé. `data-ton` n'est posé que sur l'actif — une plaque
     sans ton est en béton, c'est le repos. */
  $('filters').innerHTML = chips.map(([k, l, c]) =>
    `<button class="filt tbf-plaque ${S.filter === k ? 'on' : ''}" data-f="${k}"
      ${S.filter === k ? 'data-ton="bleu" aria-pressed="true"' : 'aria-pressed="false"'}
      ${c ? `style="--fc:${c}"` : ''}>${c
      ? `${window.TBF_LOGO?.type?.(k, 'pinFiltre') ?? ''}<i class="teinte" aria-hidden="true"></i>`
      : ''}${l}</button>`).join('');

  /**
   * Le classeur ne range que ce que les saisons ont ouvert.
   *
   * Il montrait **tout le catalogue publié**, séries à venir comprises : deux
   * cent quarante-sept silhouettes grises dont une bonne part n'existe encore
   * pour personne. Un classeur est une promesse — « voilà ce qu'il y a à
   * trouver » — et une promesse qu'on ne peut pas tenir aujourd'hui n'est pas
   * un but, c'est un mur. La surprise d'une saison neuve disparaissait aussi :
   * tout avait déjà été vu en gris.
   *
   * Les saisons sont additives — l'union de toutes celles qui sont lancées —
   * donc « la saison en cours et toutes celles d'avant » est exactement
   * `SETS`, que le serveur calcule. On ne refait pas ce calcul ici.
   *
   * **Sauf ce qu'on possède déjà.** Une série qu'on referme cesse de
   * distribuer ; elle n'efface pas les cartes de qui les a. Les faire
   * disparaître du classeur transformerait une collection en trou, et c'est
   * la seule chose qu'un collectionneur ne pardonne pas.
   *
   * `SETS` vide — aucune saison lancée, ou aucune qui nomme une série — veut
   * dire « pas de restriction », comme côté serveur. Le jour où le kiosque
   * n'aurait rien à ouvrir, un classeur vide serait un contresens.
   */
  const ouvertes = new Set(SETS.map((s) => s.id));

  /* La collection est rangee par **personnage** : `S.col` et `S.stades` sont
     indexes sur la racine d'une lignee, pas sur chacun de ses ages. C'est la
     regle posee par `stades.sql` — on possede « le Choriste au stade 2 », pas
     « le Meneur de chant ». */
  const racineDe = (f) => f.racine ?? f.id;
  const stadeDe = (f) => f.stade ?? 1;
  const possede = (f) => Boolean(S.col[racineDe(f)])
    && (S.stades?.[racineDe(f)] ?? 1) >= stadeDe(f);

  const visible = (f) => !ouvertes.size || ouvertes.has(f.set) || Boolean(S.col[racineDe(f)]);

  /* **Les trois ages, et non le seul personnage.**

     Le classeur ne montrait qu'une case par lignee — celle du personnage, au
     stade atteint. Les deux autres ages existaient, avaient leur nom, leur
     dessin, leur cri et leur prix, et n'apparaissaient nulle part : on ne
     pouvait ni les regarder avant de payer, ni les revoir apres. Un classeur
     est une promesse, et il en cachait les deux tiers.

     Chacun a maintenant sa case, a la suite, dans l'ordre : TR1, TR1B, TR1C,
     puis TR2. Trois par rangee, donc une lignee par rangee — ce n'est pas un
     hasard de mise en page, c'est ce qui rend la progression lisible d'un coup
     d'oeil. */
  /* **L'ordre des séries est celui du catalogue, pas celui de l'alphabet.**

     Il se lisait sur les deux lettres de l'identifiant, comparées par
     `localeCompare`. Le classeur s'ouvrait donc sur LE BESTIAIRE et rangeait
     LA REPRISE en dixième position — alors que LA REPRISE est la seule série
     en production, et donc la seule que le joueur puisse remplir. Personne
     n'a choisi cet ordre : il est tombé de BG < EP < GC.

     `SETS_TOUTES` porte l'ordre voulu, et il porte aussi les séries
     refermées — c'est ce qu'il faut, puisqu'un joueur continue de voir les
     cartes d'une série qu'on a fermée. Une série hors table passe en fin,
     plutôt que de se glisser au hasard au milieu.

     **Et les légendaires ferment chaque série.**

     Les trois âges d'une lignée sont ses trois raretés — commune, rare,
     épique — et une rangée de trois cases les montre déjà dans cet ordre.
     Trier sur la rareté carte par carte casserait donc ce qui vient d'être
     construit juste au-dessus : toutes les communes du catalogue d'abord,
     puis toutes les rares, et une lignée cesserait d'être lisible.

     Il reste exactement une rareté qui ne tient dans aucune lignée : la
     légendaire. Les soixante-seize du catalogue sont toutes sans lignée et
     au premier âge — mesuré, pas supposé. Les sortir en fin de série donne
     au classeur l'ordre qu'on lit de haut en bas : les lignées, puis ce qui
     ne s'obtient qu'au tirage. */
  const ordreSet = new Map(SETS_TOUTES.map((x, i) => [x.id, i]));
  const rang = (f) => {
    const m = /^([A-Z]+)(\d+)/.exec(racineDe(f));
    return [ordreSet.get(f.set) ?? 99, f.rar === 'legendaire' ? 1 : 0,
      Number(m?.[2] ?? 0), stadeDe(f)];
  };
  const list = DEX.filter(visible)
    .filter((f) => (S.filter === 'all' ? true
      : S.filter === 'miss' ? !possede(f) : f.type === S.filter))
    .sort((a, b) => {
      const ra = rang(a);
      const rb = rang(b);
      return (ra[0] - rb[0]) || (ra[1] - rb[1]) || (ra[2] - rb[2]) || (ra[3] - rb[3]);
    });

  /* La progression se compte toujours sur les **personnages**, et pas sur les
     ages maintenant affiches. Un age superieur ne se trouve pas dans un
     booster, il s'achete en echarpes : le compter parmi « ce qu'il reste a
     trouver » donnerait un objectif qu'aucune ouverture ne fait avancer.

     Elle se compte aussi sur les series ouvertes : afficher « 31/166 » a
     quelqu'un qui possede deja tout ce qu'il peut posseder est le pire message
     qu'on puisse envoyer a un collectionneur. Les cartes d'une serie refermee
     qu'il possede comptent au numerateur — elles sont a lui — d'ou le plafond
     sur le denominateur. */
  const owned = PERSOS.filter((f) => S.col[f.id]).length;
  const total = Math.max(S.aCollectionner, owned);
  $('progBar').style.width = `${(owned / total) * 100}%`;
  $('progTxt').textContent = `${owned}/${total}`;
  // Ce qui reste, plutôt que le pourcentage fait. « 138 à trouver » se lit
  // comme un programme ; « 9 % » se lit comme une note.
  const reste = Math.max(0, total - owned);
  $('progReste').textContent = reste
    ? `${reste} à trouver` : 'collection complète';

  if (!Object.keys(S.col).length && S.filter !== 'miss') {
    $('grid').insertAdjacentHTML('afterbegin', '');
  }
  const cases = list.map((f, i) => {
    // Le retard d'entree est plafonne : sans ce plafond, la cent-cinquantieme
    // carte se poserait quatre secondes apres la premiere.
    const retard = ` style="animation-delay:${Math.min(i, 11) * 28}ms"`;
    const racine = racineDe(f);
    const etage = stadeDe(f);
    /* La case ouvre la fiche du **personnage** : c'est elle qui porte les trois
       ages, et on y choisit celui qu'on regarde. Ouvrir par l'age enverrait sur
       la meme fiche par un chemin de plus. */
    if (!possede(f)) {
      /* Ce qu'on n'a pas est là quand même, en ombre. Une case vide ne donne
         envie de rien, une silhouette si.

         **Mais pas de la même façon selon l'âge.** Un premier âge se tire dans
         un booster : le voir donne envie de l'ouvrir. Un âge supérieur
         s'achète, sur un personnage qu'on a déjà — le montrer donnerait
         d'avance la seule chose qu'on paie, et l'évolution n'aurait plus rien à
         révéler. Il est donc flouté, comme sur la fiche. */
      /* **Et pas de la même façon selon qu'on a la lignée ou pas.**

         Le flou du dessus vaut pour une évolution qu'on peut **acheter** : on a
         le personnage, on voit qu'il devient quelqu'un, on paie pour savoir
         qui. Il ne vaut rien pour une lignée qu'on ne possède pas du tout —
         là, l'évolution n'est pas un achat à venir, c'est une carte qu'on n'a
         simplement pas.

         Or le flou l'éclaircissait : trois quarts de gris contre un gris plein,
         et plus de lumière. Les trois cases d'une même lignée absente
         s'affichaient donc en deux tons, et les âges supérieurs paraissaient
         **moins** verrouillés que le premier — l'inverse exact de ce qui est
         vrai, puisqu'il faut d'abord avoir celui-ci. Elles prennent donc le gris
         du premier âge, et gardent leur flou : elles restent secrètes sans
         prétendre être plus proches. */
      const orphelin = etage > 1 && !S.col[racine] ? ' orphelin' : '';
      const secret = etage > 1 ? ' secret' : '';
      return `<div class="slot locked${secret}${orphelin}" data-open="${racine}"${retard}>${
        cardHTML(f, { mini: true, verrou: true })}
        ${etage > 1 ? `<div class="stade">${'★'.repeat(etage - 1)}</div>` : ''}</div>`;
    }
    /* Les doublons se comptent par personnage : le badge n'a de sens que sur le
       premier age, sinon il repeterait trois fois le meme nombre. */
    const n = etage === 1 ? (S.col[racine] ?? 0) : 0;
    return `<div class="slot" data-open="${racine}"${retard}>${cardHTML(f, { mini:true })}
      ${n > 1 ? `<div class="dupe">×${n}</div>` : ''}
      ${etage > 1 ? `<div class="stade">${'★'.repeat(etage - 1)}</div>` : ''}
      ${/* « AVATAR » et non « DUEL ». `S.active` est `user_wallet.active_fanzzy` :
            le personnage que voient l'accueil et les amis. Il n'a jamais eu le
            moindre rapport avec le deck de duel, et le dire faisait chercher
            longtemps pourquoi ce Fanzzy-la n'entrait pas sur la corde.

            Sur l'age reellement joue, et non sur les trois : l'avatar est un
            age precis. */
        S.active === racine && (S.stades?.[racine] ?? 1) === etage
          ? '<div class="active-tag">AVATAR</div>' : ''}</div>`;
  });

  /* **Une ligne par série, avec son emblème.**

     Le classeur trie par série depuis septembre 2026, et ne le montrait
     nulle part : les cartes changeaient de monde au milieu d'une rangée,
     sans qu'une ligne le dise. Un tri qu'on ne voit pas n'est pas un tri,
     c'est un ordre mystérieux.

     L'en-tête prend toute la largeur — `grid-column:1/-1` — donc la série
     suivante repart d'une rangée propre. C'est aussi ce qui rend les
     légendaires lisibles : elles ferment leur série au lieu de se perdre
     dans le flux.

     L'emblème peut manquer sans rien casser : `TBF_LOGO` pose un `onerror`
     qui retire l'image, et il reste le nom — ce qui suffisait hier. */
  const nomDeSerie = (id) => (SETS_TOUTES.find((x) => x.id === id)?.nom ?? id);
  const enTete = (id) => `<div class="serieTete tbf-cousu">
    ${window.TBF_LOGO?.serie?.(id, 'ecusson') ?? ''}
    <b>${esc(nomDeSerie(id))}</b></div>`;

  $('grid').innerHTML = list.length
    ? cases.map((html, i) => (i === 0 || list[i - 1].set !== list[i].set
      ? enTete(list[i].set) : '') + html).join('')
    : `<div class="empty">${S.filter === 'miss' ? 'Collection complète.' : 'Rien ici pour l\u2019instant.'}</div>`;
}
$('filters').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { S.filter = b.dataset.f; renderDex(); } };
$('grid').onclick = (e) => {
  const s = e.target.closest('[data-open]');
  if (!s) return;
  const f = BY_ID.get(s.dataset.open);
  /* La même fiche pour tous, possédé ou non : elle sait présenter un Fanzzy
     absent de la collection, et c'est même là qu'elle sert le plus — elle dit
     ce qu'il faudrait pour l'avoir. Avant, une carte possédée ouvrait un
     aperçu et une carte manquante changeait de page. */
  ouvrirFiche(f.id);
};

/* -------------------------------------------------------------- lignées */

/**
 * Le personnage à l'âge que le joueur a atteint.
 *
 * Sans stade enregistré, c'est le premier — ce qui est le cas de la très
 * grande majorité de la collection, et le repli naturel pour tout ce que le
 * serveur n'a pas eu le temps de dire.
 */
function ageDe(f) {
  const n = S.stades?.[f.racine ?? f.id] ?? 1;
  return n > 1 ? (lineOf(f)[n - 1] ?? f) : f;
}
function lineOf(f) {
  // Les âges d'un personnage, du premier au dernier, dans l'ordre annoncé par
  // le serveur. On ne remonte plus la chaîne à la main : `racine` et `stade`
  // arrivent avec le catalogue, et deux façons de calculer la même lignée
  // finissent par ne plus donner la même.
  const racine = f.racine ?? f.id;
  return DEX.filter((x) => (x.racine ?? x.id) === racine)
    .sort((a, b) => (a.stade ?? 1) - (b.stade ?? 1));
}

/* ------------------------------------------------------------- la fiche

 * Une seule fiche, montée ici **par-dessus la grille**.
 *
 * Il y en avait deux : cet aperçu, qui ne montrait ni les tenues ni
 * l'équipement, et la page `/fanzzy/<id>` qui montrait tout. Toucher une carte
 * ouvrait le premier, un lien au bas du premier menait au second, et le
 * classeur disparaissait en chemin. Deux rendus de la même carte finissent
 * toujours par ne plus dire la même chose — ils y étaient déjà.
 *
 * La grille reste donc derrière, la croix referme, rien ne recharge. Et
 * l'adresse suit : `/fanzzy/TR8` s'écrit dans la barre, se partage, se met en
 * favori, et le bouton retour du téléphone referme le panneau au lieu de
 * quitter le classeur.
 */

function ouvrirFiche(id, pousser = true) {
  const n = $('detail');
  n.classList.add('on');
  n.innerHTML = '';
  /* L'adresse est poussée **avant** le chargement : une fiche qui met une
     seconde à venir doit déjà être refermable par le bouton retour. */
  if (pousser && history.state?.fiche !== id) {
    history.pushState({ fiche: id }, '', '/fanzzy/' + encodeURIComponent(id));
  }
  return window.TBF_FICHE.ouvrir(n, id, {
    fermer: fermerFiche,
    // La collection a pu changer — un Fanzzy équipé, un âge acheté. La grille
    // et l'écran « Mon Fanzzy » lisent la même chose : on les relit.
    change: () => { load().catch(() => {}); },
  });
}

/**
 * Refermer.
 *
 * On repasse par l'historique quand c'est nous qui l'avons poussé : sans ça,
 * la croix laisserait `/fanzzy/TR8` dans la barre d'adresse sur une grille
 * ouverte, et le bouton retour rouvrirait une fiche qu'on vient de fermer.
 */
function fermerFiche() {
  if (history.state?.fiche) { history.back(); return; }
  rangerFiche();
}
function rangerFiche() {
  $('detail').classList.remove('on');
  $('detail').innerHTML = '';
}

window.addEventListener('popstate', (e) => {
  if (e.state?.fiche) ouvrirFiche(e.state.fiche, false);
  else rangerFiche();
});

// Échap referme, comme partout ailleurs dans le jeu.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('detail').classList.contains('on')) fermerFiche();
});

/* On peut arriver sur le classeur par une adresse de fiche — un lien partagé
   suivi d'un retour arrière, par exemple. L'état de l'historique fait foi. */
if (history.state?.fiche) ouvrirFiche(history.state.fiche, false);

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2400);
}

/* ----------------------------------------------------------- Mon Fanzzy */

/**
 * L'écran d'ouverture : le Fanzzy qu'on emmène en duel.
 *
 * Le personnage **en pied** et non sa carte. La carte a sa place dans la
 * grille, où l'on compare cent cinquante personnages entre eux ; ici on n'en
 * regarde qu'un, et la vignette ne faisait que le rétrécir au milieu d'une
 * colonne de texte. On montre donc l'âge atteint, dans le cadre de sa rareté,
 * et on ne garde autour que ce qu'on veut savoir avant d'entrer : ce qu'il
 * change, et son cri.
 *
 * Il hérite de deux écrans déjà faits — le cadre de la fiche, la respiration
 * et le salut de l'accueil. C'est le même personnage aux deux endroits :
 * animé autrement, ce serait deux personnages.
 */
/**
 * **Le décor de l'avatar**, pas celui de la carte.
 *
 * La vitrine montre l'avatar — l'âge, la tenue et l'expression choisis sur
 * la fiche — mais son décor était celui de la carte à l'âge atteint, en
 * tenue de base. Un joueur en tenue préhistorique se tenait donc dans le
 * gradin de tous les jours. Le décor suit maintenant ce qu'on voit : la
 * tenue portée et l'âge montré, dont il tire son palier.
 */
function decorDe(f, age) {
  const av = S.avatar?.id === f.id ? S.avatar : null;
  const vu = (av?.age && BY_ID.get(av.age)) || age;
  return { ...vu, stage: av?.evo ?? vu.stage, skin: av?.skin ?? 'base' };
}

function renderTeam() {
  const f = S.active ? BY_ID.get(S.active) : null;
  if (!f || !S.col[f.id]) {
    $('teamBody').innerHTML = `<div class="empty">
      Aucun Fanzzy choisi.<br>Ouvre un booster, puis choisis-le depuis le classeur.</div>`;
    return;
  }
  // Le personnage **tel qu'il est aujourd'hui** : celui qui a payé ses
  // écharpes doit voir son Capo, pas le gamin de départ. Comme dans la grille.
  const age = ageDe(f);
  const t = TYPES[age.type] ?? null;
  const stade = S.stades?.[f.id] ?? 1;
  const effets = modsText(age);
  const possede = S.col[f.id] ?? 1;

  /* **Une pastille sans donnée disparaît, jamais un tiret.** La famille
     inconnue s'écrivait « — », le cri absent « Cri : — · 0 de poussée » : trois
     signes pour dire qu'on ne savait rien, dans la bande qui présente le
     personnage. On n'écrit que ce qu'on sait. */
  const cri = age.cri?.label
    ? `Cri : <b>${esc(age.cri.label)}</b>${age.cri.power ? ` · ${age.cri.power} de poussée` : ''}`
    : (age.cri?.power ? `${age.cri.power} de poussée` : '');
  const pastilles = [
    t?.nom ? `<b>${esc(t.nom)}</b>` : '',
    cri,
    `${possede} exemplaire${possede > 1 ? 's' : ''} · étage ${stade}`,
  ].filter(Boolean).map((x) => `<span>${x}</span>`).join('');

  $('teamBody').innerHTML = `
    <a class="tscene r-${age.rar ?? 'commune'}" id="tscene" style="--tc:${t?.c ?? 'var(--projo)'}"
       href="/fanzzy/${f.id}" aria-label="Ouvrir la fiche de ${esc(age.nom)}">
      <div class="fond">${artFond(decorDe(f, age))}</div>
      <div class="halo"></div>
      <!-- La scène du personnage est montée par fanzzy-scene.js :
           mêmes calques, même respiration que dans le virage. -->
      <div class="tpile" id="tpile"></div>
      <div class="ombre"></div>
      <div class="trar">${rarMark(age.rar)}</div>
      <!-- Cet onglet montre l'**avatar** : celui que voient l'accueil et les
           amis. Il disait « EN DUEL », ce qui était faux — la tribune du duel
           se règle dans le deck, ou depuis la fiche d'un Fanzzy. -->
      <div class="ttag">TON AVATAR</div>
      <div class="ttxt">
        <div class="tpast">${pastilles}</div>
        <h2>${esc(age.nom)}</h2>
      </div>
    </a>

    <div class="teff">${effets.length
      ? effets.map((e) => `<span>${esc(e)}</span>`).join('')
      : '<span class="rien">Aucun effet particulier : il pousse comme les autres.</span>'}</div>

    <!-- Jouer est rouge, partout dans le jeu : l'entrée en duel porte le ton
         « flare ». La fiche est une consultation, elle reste en béton. -->
    <div class="tbtns">
      <button class="dbtn primary tbf-plaque" data-ton="flare" id="goDuel">ENTRER EN DUEL</button>
      <a class="dbtn tbf-plaque" href="/fanzzy/${f.id}">SA FICHE</a>
    </div>`;

  /* Le Fanzzy équipé est déjà connu du serveur : le duel le lira lui-même.

     **L'adresse était `/duel`**, qui n'existe pas : le duel se joue sur
     `/duel-nvn`. Le bouton menait donc à une page d'erreur, depuis l'écran qui
     dit « entrer en duel » — et rien ne regardait jamais où il mène. */
  $('goDuel').onclick = () => { location.href = '/duel-nvn'; };
  habiller(f, age, stade);
}

/* Le rendu peut repartir pendant qu'une image charge — on choisit un autre
   Fanzzy, on le fait évoluer. La scène est refaite avec le reste de l'écran :
   c'est elle, et non un jeton, qui garantit qu'une image en retard n'atterrit
   pas dans un écran qui ne l'attend plus. */
let sceneEquipe = null;

/**
 * Pose le personnage dans sa boîte.
 *
 * Le repli descend d'un cran à la fois : les douze états, puis le plein-pied,
 * puis le dessin procédural — qui vaut toujours mieux qu'un cadre vide. Les
 * deux premiers viennent de `fanzzy-scene.js`, partagé avec le virage ; le
 * troisième reste ici, parce que le dessin procédural a besoin de la fiche
 * complète du catalogue et que le virage, lui, ne l'a pas.
 *
 * `perso` est **la lignée**, `age` la carte du catalogue à l'âge atteint. Les
 * états sont rangés sous la première, l'illustration en pied sous la seconde :
 * confondre les deux montre le Choriste à qui a payé pour le Meneur de chant.
 */
async function habiller(perso, age, stade) {
  /* C'est l'écran du personnage : il répond au toucher. Ailleurs la zone
     sert à autre chose, et un saut non demandé s'y lirait comme un défaut. */
  sceneEquipe = window.TBF_SCENE?.creer?.($('tpile'), { fond: 'neutre', reagitAuToucher: true }) ?? null;
  /* **L'âge montré et la tenue portée**, tous deux venus du portefeuille.

     `stade` est l'âge **atteint** : cet écran ignorait donc le choix de
     celui qui préfère se montrer jeune, et il n'habillait personne. C'est
     l'onglet qui s'appelle « TON AVATAR » — il doit montrer exactement ce
     que voient l'accueil et les amis. */
  /* L'avatar tel que le serveur le résout — âge, tenue **et expression**.
     Cet écran recevait l'âge et la tenue, pas l'expression : un joueur qui
     avait choisi la joie se voyait au repos sur l'onglet même qui s'appelle
     « TON AVATAR ». Il ne recompose plus rien : il passe l'objet. */
  const vu = await sceneEquipe?.definir(S.avatar?.id === perso.id ? S.avatar
    : { id: perso.id, age: age.id, evo: stade, skin: 'base' });
  if (vu) { $('tscene')?.classList.add('entre'); return; }

  // Ni états ni illustration : le dessin géométrique, comme dans la grille.
  $('tpile').innerHTML = `<div class="tdessin">${artProcedural(age)}</div>`;
  $('tscene')?.classList.add('entre');
}
/* ----------------------------------------------------------------- nav */

/* Le classeur est atteignable par son adresse : la barre du deck y renvoie,
   et quelqu un qui met le classeur en favori doit y revenir, pas atterrir sur
   son personnage. */
{
  const veut = new URLSearchParams(location.search).get('ecran');
  if (veut === 'dex' || veut === 'equipe') {
    document.querySelectorAll('.screen').forEach((x) => x.classList.toggle('on', x.id === 's-' + veut));
    document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x.dataset.go === veut));
  }
}

document.querySelectorAll('.nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
    $('s-' + b.dataset.go).classList.add('on');
    if (b.dataset.go === 'dex') renderDex();
    if (b.dataset.go === 'equipe') renderTeam();
  };
});

/* ---------------------------------------------------------------- init */

/* Le décor est posé par nav.js, comme sur toutes les autres pages : même
   photo, même voile. Le fond propre au kiosque et son suivi de l'inclinaison
   sont partis avec lui — deux décors superposés se battaient, et celui du
   dessous ne se voyait pas. */

(async () => {
  try {
    /* **Le manifeste des etats d’abord.** Il porte les dessins des ages
       superieurs — voir `adresse` dans fanzzy-art.js. Sans lui, le premier
       rendu prend le repli, c’est-a-dire le visage du premier age, et rien ne
       vient le corriger ensuite. Il ne leve jamais : absent, la page
       s’affiche exactement comme avant. */
    await Promise.resolve(window.TBF_ETATS?.charger?.()).catch(() => null);
    await load();
  } catch (e) {
    if (e.message === 'auth') return;
    // Le catalogue vient du réseau depuis qu'il n'est plus recopié ici : une
    // page qui échoue à le charger n'a rien à afficher, et un « serveur
    // injoignable » générique ferait chercher au mauvais endroit. On nomme la
    // cause, et on l'écrit dans la grille plutôt que dans un toast qui
    // s'efface au bout de trois secondes.
    const cause = e.code ?? e.message ?? 'cause inconnue';
    const zone = $('grid');
    if (zone) {
      zone.innerHTML = `<div class="empty" style="padding:40px 20px;line-height:1.8">
        Le classeur n\u2019a pas pu charger le catalogue.<br>
        <span>${esc(cause)}</span><br>
        <a href="" style="color:var(--projo)">réessayer</a></div>`;
    }
    toast(`Catalogue indisponible : ${cause}`);
    return;
  }
  /* Le carrousel et le kiosque ont leur écran à eux — voir /boosters. Cette
     page dessine le classeur et le personnage équipé, et rien d autre. */
  renderDex(); renderTeam();

  /* ================== et elle se redessine quand l'état change

     **Elle ne le faisait pas.** `load()` relit la collection et les étages,
     puis émet `tbf:bourse` en laissant chaque écran redessiner ce qu'il a —
     c'est écrit en toutes lettres dans `cartes.js`. Le kiosque écoute. Le
     classeur, lui, n'a jamais implémenté sa moitié du contrat.

     Conséquence exacte : on payait une évolution depuis la fiche, le serveur
     l'enregistrait, `recharger()` appelait bien `change` qui appelait bien
     `load()` — les données étaient à jour dans la page — et la grille
     continuait d'afficher l'ancien état. L'âge qu'on venait d'acheter restait
     sous cadenas jusqu'au prochain rafraîchissement du navigateur.

     Le pire des défauts d'affichage : le joueur a payé, le serveur est
     d'accord, et l'écran dit non. Il n'a aucune raison de soupçonner un
     rendu — il conclut que l'achat a échoué.

     On redessine les deux surfaces de cette page, et rien d'autre : la grille,
     et le personnage équipé. Les deux lisent `S.col` et `S.stades`, que
     `load()` vient de remettre à jour. */
  addEventListener('tbf:bourse', () => {
    try { renderDex(); renderTeam(); }
    catch (e) { console.error('[classeur] redessin', e); }
  });
})();
</script>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
