<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Administration — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<script src="/menu.js"></script>
<style>

*{box-sizing:border-box}
/* `display:block`, et ce n est pas cosmétique : `ui.css` pose
   `body{display:flex}` pour centrer la colonne du jeu. L administration n a pas
   cette colonne — son en-tete, son menu et son contenu se retrouvaient donc
   **cote a cote** sur une meme ligne, et la page debordait de cent vingt pixels
   a gauche comme a droite. Sur un ecran large personne ne le voyait ; sur un
   telephone l ecran etait inutilisable. */
body{margin:0;display:block;background:#0A0D11;color:var(--craie);
  font-family:var(--ui);font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(242,238,228,.12)}
header h1{font-family:var(--banner);font-size:17px;letter-spacing:.16em;margin:0;flex:1}
header .who{font-size:12px;opacity:.5}
/* #nav et non nav : le tiroir du menu commun est lui aussi un <nav>, et un
   sélecteur d élément lui imposait display:flex — ses onze lignes partaient
   alors en colonne unique écrasée. Le même piège que les classes sans
   préfixe, sur un nom de balise. */
.h3{font-family:var(--banner);font-size:12px;letter-spacing:.15em;opacity:.5}
#nav{display:flex;gap:18px;padding:12px 18px;flex-wrap:wrap;align-items:flex-end}
/* Une famille d'onglets : son titre au-dessus, ses boutons dessous. Le titre
   n'est pas cliquable — c'est une étiquette de rayon, pas une destination. */
.fam{display:flex;flex-direction:column;gap:5px}
.fam i{font-style:normal;font-size:8.5px;letter-spacing:.18em;opacity:.38;
  font-family:var(--banner);padding-left:2px}
.fam{position:relative}
.fam::after{content:'';position:absolute;right:-9px;top:14px;bottom:2px;width:1px;
  background:rgba(242,238,228,.1)}
.fam:last-child::after{display:none}
.fam>span{display:flex;gap:6px;flex-wrap:wrap}
#nav button{background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.14);border-radius:7px;
  color:inherit;padding:8px 14px;font-family:var(--banner);font-size:12px;letter-spacing:.06em;
  cursor:pointer;opacity:.55}
#nav button.on{background:var(--craie);color:#0B0E13;opacity:1}
main{padding:0 18px 40px;max-width:1100px}
/* Les tableaux de l'administration ont huit colonnes : ils ne rentreront jamais
   dans un téléphone, et il n'y a aucune raison de les y forcer. Ils défilent
   donc **dans leur propre boîte**, sans entraîner la page — sans quoi tout
   l'écran glisse latéralement et l'on perd le menu en cherchant une colonne. */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{min-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:18px}
.card{border:1px solid rgba(242,238,228,.12);border-radius:10px;padding:12px;background:rgba(0,0,0,.3)}
.card b{display:block;font-family:var(--banner);font-size:22px;color:var(--projo)}
.card span{font-size:10.5px;opacity:.5;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--banner);font-size:10px;letter-spacing:.12em;opacity:.45;
  padding:8px 6px;font-weight:500;border-bottom:1px solid rgba(242,238,228,.12)}
td{padding:9px 6px;border-bottom:1px solid rgba(242,238,228,.07);vertical-align:middle}
td.act{white-space:nowrap}
button.mini{background:rgba(0,0,0,.4);border:1px solid rgba(242,238,228,.2);border-radius:5px;
  color:inherit;font-size:11px;padding:4px 8px;cursor:pointer;margin-right:4px}
button.mini.rouge{border-color:rgba(224,64,44,.5);color:var(--flare)}
button.mini.vert{border-color:rgba(30,158,106,.5);color:var(--vert)}
input,select{background:rgba(0,0,0,.4);border:1px solid rgba(242,238,228,.18);border-radius:6px;
  color:inherit;padding:8px 10px;font-family:inherit;font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{font-size:10px;border-radius:4px;padding:2px 7px;border:1px solid currentColor}
.pill.admin{color:var(--projo)}.pill.locked{color:var(--flare)}.pill.off{color:var(--flare)}
/* L abonnement : la meme pastille que les autres etats du compte, en vert —
   c est une porte ouverte, pas un avertissement. */
.pill.vert{color:var(--vert,#5FDFA6)}
.log{font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.7;opacity:.75}
.log b{color:var(--projo);font-family:var(--banner)}
.vide{opacity:.45;padding:36px;text-align:center}

/* ------------------------------------------------------------ réglages
   Une ligne par réglage : ce qu'il gouverne à gauche, sa valeur à droite.
   Le tableau serait plus compact, mais un tableau ne porte pas d'aide, et
   c'est l'aide qui fait la différence entre régler et deviner. */
.sect{margin:0 0 26px}
.sect > h3{font-family:var(--banner);font-size:12px;letter-spacing:.15em;
  margin:0 0 3px;color:var(--projo)}
.sect > p.sh{margin:0 0 12px;font-size:11.5px;opacity:.45;max-width:640px}
.rg{display:flex;align-items:flex-start;gap:14px;padding:11px 0;
  border-bottom:1px solid rgba(242,238,228,.07)}
.rg .lib{flex:1;min-width:0}
.rg .lib b{display:block;font-size:13px;font-weight:600}
.rg .lib small{display:block;margin-top:3px;font-size:11px;opacity:.45;line-height:1.55}
.rg .val{flex:none;display:flex;align-items:center;gap:7px}
.rg input[type=number]{width:92px;text-align:right}
.rg input[type=text]{width:min(320px,42vw)}
.rg .u{font-size:10.5px;opacity:.4;letter-spacing:.06em;min-width:64px}
/* La marque du modifié. Sans elle, un réglage laissé au défaut et un réglage
   fixé sur cette même valeur sont indiscernables — et on ne sait plus ce
   qu'on a touché. */
.rg.change .lib b::after{content:"modifié";margin-left:8px;font-family:var(--banner);
  font-size:9px;letter-spacing:.1em;color:var(--projo);border:1px solid currentColor;
  border-radius:20px;padding:1px 6px;vertical-align:2px}
.rg .def{font-size:10px;opacity:.4;white-space:nowrap}
/* Le recalage des divisions : ce que la règle tire de la saison en cours,
   au-dessus des quatre seuils qu'il propose de remplacer. */
.recal{margin:0 0 12px;padding:12px 14px;border:1px solid rgba(242,238,228,.12);
  border-radius:8px;background:rgba(242,238,228,.03)}
.recal > b{font-family:var(--banner);font-size:11px;letter-spacing:.12em;color:var(--projo)}
.recal p{margin:6px 0;font-size:12px;line-height:1.55}
.recal p.alerte{color:#f0b35a}
.recal table{border-collapse:collapse;font-size:12px;margin:8px 0}
.recal th,.recal td{padding:3px 12px 3px 0;text-align:right}
.recal th:first-child,.recal td:first-child{text-align:left}
.recal th{font-weight:400;opacity:.5;font-size:10.5px;letter-spacing:.06em}
.rg button.rendre{visibility:hidden}
.rg.change button.rendre{visibility:visible}
/* La bascule : un bouton, pas une case — on la vise au doigt. */
.bascule{width:46px;height:26px;border-radius:20px;border:1px solid rgba(242,238,228,.2);
  background:rgba(0,0,0,.4);position:relative;cursor:pointer;padding:0}
.bascule i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(242,238,228,.5);transition:left .16s ease,background .16s ease}
.bascule[aria-pressed=true]{border-color:var(--vert);background:rgba(30,158,106,.2)}
.bascule[aria-pressed=true] i{left:23px;background:var(--vert)}
/* ------------------------------------------------------------- le reçu
   Un écrit part vers le serveur et revient : tant que rien ne le dit, on ne
   sait pas si c'est fait. Le bandeau au pied des réglages le disait déjà — au
   pied, c'est-à-dire sous vingt-six lignes, hors de l'écran au moment précis
   où l'on vient de toucher un champ du haut.

   Le reçu se pose donc par-dessus, en haut à droite, et s'efface seul. Il ne
   remplace pas le bouton « Enregistrer » des formulaires : il répond à la
   question que ce bouton laisse en suspens — est-ce que c'est passé ? */
/* Sous l'en-tête, et non dans son coin : à `top:14px` le reçu recouvrait le
   bouton du menu, qui vit exactement là. Un message qui cache une commande
   est un message qui gêne. */
.recu{position:fixed;z-index:60;top:68px;right:14px;max-width:min(360px,84vw);
  padding:10px 14px;border-radius:9px;font-size:12.5px;line-height:1.5;
  background:rgba(12,17,24,.97);border:1px solid var(--vert);color:var(--craie);
  box-shadow:0 14px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease;
  pointer-events:none}
.recu.on{opacity:1;transform:none}
.recu.rate{border-color:var(--flare);color:#FFD9D2}
.recu b{font-family:var(--banner);letter-spacing:.08em;display:block;font-size:10px;
  opacity:.6;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.recu{transition:none}}

.enreg{position:sticky;bottom:0;background:linear-gradient(transparent,#0B0E13 28%);
  padding:18px 0 8px;display:flex;gap:10px;align-items:center}
.enreg .quoi{font-size:11.5px;opacity:.55}

/* ------------------------------------------------------ catalogue Fanzzy
   Cet écran sert à tenir cent cartes. Il est donc dense exprès : une ligne
   par Fanzzy, la vignette à gauche pour reconnaître d'un coup d'œil, et
   l'édition qui s'ouvre sous la ligne sans quitter la liste. */
.fzrow img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#0B1017;display:block}
.fzrow .sil{width:34px;height:34px;border-radius:6px;background:rgba(242,238,228,.07);
  display:grid;place-items:center;font-size:9px;opacity:.5}
.fzrow.depublie{opacity:.45}
.fzedit{background:rgba(0,0,0,.35)}
/* Le formulaire, partagé par la fiche d'un Fanzzy et par celle d'une saison.
   `.sai-edit` est dans chaque sélecteur et non recopié en dessous : le premier
   jet n'avait que `.fzedit`, et le formulaire des saisons sortait sans grille —
   le champ d'annonce se réduisait à cent soixante pixels avec son texte qui
   débordait par-dessus l'étiquette. Une mise en page qui n'existe que pour un
   écran sur deux est une mise en page qu'on refera de travers. */
.fzedit .grille,.sai-edit .grille{display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;padding:12px 6px}
.fzedit label,.sai-edit label{display:block;font-size:10px;letter-spacing:.1em;opacity:.5;
  margin-bottom:4px;font-family:var(--banner)}
.fzedit input,.fzedit select,.fzedit textarea,
.sai-edit .grille input,.sai-edit .grille textarea{width:100%}
.fzedit textarea,.sai-edit textarea{background:rgba(0,0,0,.4);
  border:1px solid rgba(242,238,228,.18);border-radius:6px;
  color:inherit;padding:8px 10px;font-family:inherit;font-size:13px;min-height:66px;resize:vertical}
.fzedit .large,.sai-edit .large{grid-column:1/-1}
/* L'étiquette d'une case à cocher n'est pas une étiquette de champ : elle est
   à côté de sa case, pas au-dessus, et elle se lit. */
.sai-edit .sai-k{display:inline-flex;font-size:11.5px;letter-spacing:0;opacity:1;
  margin-bottom:0;font-family:var(--ui);text-transform:none}
.fzedit .actions{padding:0 6px 14px;display:flex;gap:8px;align-items:center}
.fzedit .err{color:var(--flare);font-size:12px}
.series{border:1px solid rgba(242,238,228,.14);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.series-t{margin:0 0 9px;font-family:var(--banner);font-size:11px;letter-spacing:.18em}
.series-t span{display:block;font-family:var(--ui);font-size:12px;letter-spacing:0;
  opacity:.55;margin-top:3px;text-transform:none}
.series-l{display:flex;flex-wrap:wrap;gap:6px}
/* Les séries ne sont plus des boutons : elles se lisent, elles ne se règlent
   plus ici. Ce sont les saisons qui les ouvrent. */
.series .serie{background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.14);
  border-radius:8px;padding:7px 11px;text-align:left;opacity:.4}
.series .serie b{display:block;font-family:var(--banner);font-size:11.5px;letter-spacing:.06em}
.series .serie > span{display:block;font-size:10px;opacity:.55}
.series .serie.on{border-color:#1E9E6A;background:rgba(30,158,106,.14);opacity:1}
.series .serie.on b{color:#4FB98A}
.series-n{margin:10px 0 0;font-size:11px;opacity:.42;line-height:1.6}

/* ------------------------------------------------------------- les saisons */
.sai{border:1px solid rgba(242,238,228,.13);border-radius:11px;padding:13px 15px;
  margin:0 0 10px;background:rgba(0,0,0,.22)}
/* Une saison lancée porte un liseré vert à gauche : c'est ce qui est en jeu,
   et ça doit se voir sans lire. */
.sai.on{border-left:4px solid #1E9E6A}
.sai-t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sai-t b{font-family:var(--banner);font-size:14px;letter-spacing:.05em}
.sai-e{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.45}
.sai.on .sai-e{color:#4FB98A;opacity:.85}
.sai-x{margin:7px 0 0;font-size:12.5px;line-height:1.6;opacity:.72}
.sai-c{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:11px 0 0;
  font-size:11.5px}
.sai-c dt{font-family:var(--banner);font-size:10px;letter-spacing:.12em;opacity:.45;
  text-transform:uppercase}
.sai-c dd{margin:0;opacity:.8;overflow-wrap:anywhere}
.sai-a{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.sai-edit{border-color:rgba(245,195,59,.4);background:rgba(245,195,59,.05)}
.sai-l{margin-top:13px}
.sai-lt{margin:0 0 6px;font-family:var(--banner);font-size:10px;letter-spacing:.13em;
  opacity:.5;text-transform:uppercase}
.sai-ks{display:flex;flex-wrap:wrap;gap:5px}
.sai-k{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;cursor:pointer;
  border:1px solid rgba(242,238,228,.13);border-radius:7px;padding:5px 9px;
  background:rgba(0,0,0,.25)}
.sai-k:has(input:checked){border-color:#1E9E6A;background:rgba(30,158,106,.14)}
.sai-k input{margin:0;accent-color:#1E9E6A}
/* La saison datée. Le carnet se lit palier par palier : une ligne de JSON par
   palier, en chasse fixe, pour que les seuils s'alignent et que l'on voie d'un
   coup d'œil qu'ils montent. */
.sai-edit textarea.sai-carnet{width:100%;font-family:ui-monospace,monospace;font-size:12px;
  line-height:1.55;min-height:150px;white-space:pre;overflow-x:auto}
.sai-edit textarea.sai-carnet[readonly]{opacity:.6}
.sai-note{margin:5px 0 0;font-size:11px;line-height:1.55;opacity:.55}
.sai-note b{opacity:1;color:var(--projo)}
.sai-c dd.fige{color:var(--projo)}
.depot{background:rgba(30,158,106,.12);border:1px solid rgba(30,158,106,.4);border-radius:8px;padding:11px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.depot code{background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px}
.compte{font-size:11.5px;opacity:.5;margin-bottom:10px}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Voir aide.html pour l'explication : le dernier element d'une page qui defile
   est colle au bas du document, et la barre du navigateur passe par-dessus.
   Cette page-ci n'a aucune declaration de hauteur — elle defile de bout en
   bout — donc le probleme la concerne autant que les autres. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<!-- Le menu du jeu, ici aussi. Cette page n'avait qu'un lien « retour au jeu » :
     un administrateur qui veut le classeur ou le kiosque devait repasser par
     l'accueil. Le menu est le même qu'ailleurs — c'est tout l'intérêt. -->
<!-- **La flèche de retour, la même que partout.**

     Cet en-tête n'avait qu'un lien « retour au jeu » écrit en petit à droite,
     entre le pseudo et le bouton de menu. Il ramenait bien à l'accueil, mais il
     ne ressemblait à rien de ce que le joueur connaît : sur les vingt-trois
     autres écrans, on sort par une flèche en haut à gauche.

     Elle est écrite ici, dans le balisage de la page, et non posée par
     `nav.js` : la barre commune s'ajoute **dans** la colonne, et la première
     vue de l'administration réécrit cette colonne en entier — la barre
     apparaissait puis disparaissait, flèche comprise. Voir `SANS_HAUT` dans
     `nav.js`, qui ne la monte plus ici pour cette raison.

     Le comportement, lui, reste celui de `nav.js` : sa poignée est posée sur le
     document et reconnaît toute flèche portant cette classe. Revenir d'où l'on
     vient quand il y a un « avant » à nous, et retomber sur l'adresse du lien
     sinon. -->
<header><a class="pan tbf-retour" id="retour" href="/" aria-label="Revenir"></a>
  <h1>ADMINISTRATION</h1><span class="who" id="who"></span>
  <button class="pan tbf-burger" id="burger" aria-label="Menu"
    ><span></span><span></span><span></span></button></header>
<nav id="nav"></nav>
<main id="main"><div class="vide">Chargement…</div></main>

<!-- Sans « defer » : la vue du catalogue lit FZART.ILLUSTRES pour savoir quels
     Fanzzy sont dessinés, et elle le lit dès sa première exécution. -->
<script src="/fanzzy-art.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
const api = async (p, body, method) => {
  const r = await fetch('/api/admin' + p, {
    method: method ?? (body === undefined ? 'GET' : 'POST'),
    headers: { 'content-type':'application/json' }, credentials:'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  // `raison` est le détail en français que le serveur joint aux refus qui en
  // ont un. Sans ça, l'écran n'a que le code, et le code ne se lit pas.
  if (!r.ok) throw Object.assign(new Error(j.raison ?? j.error ?? 'erreur'),
    { code:j.error, raison:j.raison, status:r.status });
  return j;
};
/**
 * Le reçu : ce qui vient d'être écrit, ou refusé.
 *
 * Chaque écran de cette page enregistrait en silence. Le formulaire se
 * refermait, la liste se redessinait, et c'était tout : rien ne distinguait un
 * enregistrement réussi d'un formulaire simplement fermé. Sur les réglages,
 * c'était pire — ils s'enregistrent champ par champ, sans bouton, et la seule
 * trace était un bandeau collé en pied de page qu'on ne voit pas depuis le
 * haut de la liste.
 *
 * Un reçu par-dessus la page, qui s'efface seul. Il n'y a **qu'un** reçu à la
 * fois : deux messages empilés se lisent comme une erreur, et le second
 * annulerait la lecture du premier.
 *
 * @param {string} texte ce qui s'est passé, en clair.
 * @param {boolean} [rate] vrai pour un refus : le reçu passe au rouge et reste
 *   deux fois plus longtemps, parce qu'il y a quelque chose à faire.
 */
let minuteurRecu = null;
function recu(texte, rate = false) {
  let el = document.querySelector('.recu');
  if (!el) { el = document.createElement('div'); el.className = 'recu'; document.body.append(el); }
  el.className = 'recu' + (rate ? ' rate' : '');
  el.setAttribute('role', 'status');
  /* Une balise pour l'étiquette, `textContent` pour le message : il contient
     des noms de saison et des refus du serveur, c'est-à-dire de la saisie. */
  el.innerHTML = '<b></b><span></span>';
  el.querySelector('b').textContent = rate ? 'REFUSÉ' : 'ENREGISTRÉ';
  el.querySelector('span').textContent = texte;
  requestAnimationFrame(() => el.classList.add('on'));
  clearTimeout(minuteurRecu);
  minuteurRecu = setTimeout(() => el.classList.remove('on'), rate ? 7000 : 3200);
}

/** Le refus du serveur, dit en français, dans le reçu. */
const recuRate = (e) => recu(MSG_FANZZY[e.code] ?? e.raison ?? e.code
  ?? 'le serveur n’a pas dit pourquoi.', true);

/**
 * Redessine une vue sans faire perdre la main au champ qui l'a déclenchée.
 *
 * Chaque vue de cette page se refait en réécrivant `#main` en entier — y
 * compris le champ de recherche qui vient d'en demander le redessin. Le champ
 * détruit, le focus retombe sur le corps du document et le curseur revient à
 * zéro : il fallait retoucher le champ après chaque recherche de joueur ou de
 * compétition, et dans le catalogue, où la recherche est retardée de 250 ms,
 * après chaque bout de mot. Sur un portable, le clavier se refermait à chaque
 * fois.
 *
 * On note donc qui tenait la main et où en était son curseur, on laisse la vue
 * se refaire, puis on rend la main au champ qui porte le même identifiant.
 * C'est le même parce que c'est le même gabarit : l'élément est neuf, sa place
 * ne l'est pas.
 *
 * @param {() => (void | Promise<void>)} redessiner ce qui refait la vue.
 */
async function sansPerdreLaMain(redessiner) {
  const a = document.activeElement;
  const garde = a?.id && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)
    ? { id: a.id, debut: a.selectionStart, fin: a.selectionEnd } : null;
  await redessiner();
  const n = garde && $(garde.id);
  if (!n) return;
  n.focus();
  /* `setSelectionRange` n'existe pas sur une liste déroulante, et lève sur un
     `input type=number` — d'où le garde-fou plutôt qu'un test de type, qui
     serait à rallonger au premier champ d'un autre genre. */
  if (garde.debut != null) {
    try { n.setSelectionRange(garde.debut, garde.fin); } catch { /* sans curseur */ }
  }
}

const VUES = {
  /**

   * Il ne montrait que des compteurs de population — joueurs, souvenirs,

   * Cette question-là traverse quatre onglets — SAISONS ouvre les séries,
   * FANZZY publie carte par carte, CONTENUS publie le reste, RÉGLAGES fixe les
   * nombres — et rien ne les reliait. Le bandeau ci-dessous les relie, et
   * chaque ligne **nomme l'onglet** où elle se change.

      return `<h3 class="h3">CE QUI EST EN JEU EN CE MOMENT</h3>
      <div class="tbl"><table><tbody>
        ${l('Séries ouvertes', ouvertes === null

    };

    const c = (v, l) => `<div class="card"><b>${v ?? 0}</b><span>${l}</span></div>`;
    $('main').innerHTML = enJeu() + `
      <div class="cards">

        ${c(d.joueurs.verifies,'ADRESSES VÉRIFIÉES')}${c(d.joueurs.admins,'ADMINS')}

    /* **Le reçu, pas `alert`.**

       Ces deux outils étaient les derniers à passer par `alert` : une boîte

  /**
   * Le catalogue Fanzzy.
   *
   * C'est l'écran qui doit permettre d'atteindre cent cartes sans toucher au
   * code. Il est dense exprès : une ligne par Fanzzy, la vignette pour
   * reconnaître d'un coup d'œil, et l'édition qui s'ouvre sous la ligne sans
   * quitter la liste — sur cent cartes, une page par carte serait pénible.
   *
   * Il n'y a **pas de bouton supprimer**, et ce n'est pas un oubli : un
   * identifiant effacé orphelinerait les collections, les decks et le Fanzzy
   * équipé de tous ceux qui le possèdent. On dépublie.
   */
  /**
   * Les saisons.
   *
   * ## Ce que cet écran décide
   *
   * **Tout ce qui s'ouvre dans le jeu.** Les séries s'ouvraient au niveau du
   * joueur : chacun découvrait le jeu seul, à son rythme, et le jour où une
   * série arrivait n'existait pour personne d'autre. Une saison ouvre pour tout
   * le monde le même jour — c'est ce qui permet d'annoncer quelque chose.
   *
   * ## Le brouillon, et le lancement
   *
   * Une saison se prépare sans que rien ne change pour personne : on la compose,
   * on la relit, on la garde. **Lancer** est un geste distinct, et c'est le plus
   * visible de toute l'administration — il change le jeu de tous les joueurs
   * connectés, à la seconde. D'où la confirmation, qui énumère ce qui s'ouvre.
   *
   * Remettre en brouillon referme les séries de cette saison-là, et seulement
   * celles-là. Les tenues publiées ne se dépublient pas : quelqu'un les a
   * peut-être déjà gagnées.
   */
  async saisons() {
    const d = await api('/saisons');
    const fmt = (v) => (v ? new Date(v).toLocaleDateString('fr-CH',
      { day: 'numeric', month: 'long', year: 'numeric' }) : '');

    /* Un jour de jeu (AAAA-MM-JJ) dit en français, découpé à la main. Passé à
       « new Date », un jour sans heure devient minuit UTC, et s'affiche la
       veille à l'ouest de Greenwich : l'étiquette et la date ne sortiraient
       plus du même repère. */
    const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
      'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    const jourFr = (j) => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(j ?? '');
      return m ? `${Number(m[3])} ${MOIS[Number(m[2]) - 1]} ${m[1]}` : '';
    };
    const figes = new Set(d.carnetsFiges ?? []);
    const DEFAUT = d.carnetDefaut ?? [];
    const L = d.limitesCarnet ?? {};
    /* Le carnet dans la zone de texte : une ligne par palier, que l'on relit
       et que l'on corrige sans compter les accolades. */
    const carnetTexte = (c) => '[\n' + c.map((p) => '  ' + JSON.stringify(p)).join(',\n') + '\n]';

    /* Ce que la fin d'une saison dit, à l'instant où l'on regarde. */
    const finTexte = (s) => {
      if (!s.fin) return 'pas encore saisie';
      if (s.finie) return `finie — dernier jour le ${jourFr(s.fin)}`;
      return `dernier jour le ${jourFr(s.fin)} — ${s.joursRestants} jour${
        s.joursRestants > 1 ? 's' : ''} de jeu restant${s.joursRestants > 1 ? 's' : ''}`;
    };
    const carnetResume = (s) => {
      const propre = Array.isArray(s.carnet);
      const n = propre ? s.carnet.length : DEFAUT.length;
      return `${propre ? 'propre à la saison' : 'par défaut'} — ${n} paliers`
        + (figes.has(s.id) ? ' · figé : un palier a déjà été versé' : '');
    };

    /* Les noms plutôt que les identifiants. Un administrateur qui relit une
       saison avant de la lancer doit lire « LES VIP », pas « VP ». */
    const noms = (ids, source) => ids
      .map((id) => d.choix[source].find((x) => x.id === id)?.nom ?? id).join(' · ');

    const carte = (s) => `
      <div class="sai ${s.lancee ? 'on' : ''}">
        <div class="sai-t">
          <b>Saison ${s.numero} — ${esc(s.nom)}</b>
          <span class="sai-e">${s.lancee ? `lancée le ${esc(fmt(s.lanceeA))}` : 'brouillon'}</span>
        </div>
        ${s.texte ? `<p class="sai-x">${esc(s.texte)}</p>` : ''}
        <dl class="sai-c">
          <dt>Séries</dt><dd>${esc(noms(s.series, 'series')) || '—'}</dd>
          <dt>Tenues</dt><dd>${esc(noms(s.tenues, 'tenues')) || '—'}</dd>
          <dt>Équipement</dt><dd>${esc(noms(s.stuff, 'stuff')) || '—'}</dd>
          <dt>Cartes</dt><dd>${esc(noms(s.actions, 'actions')) || '—'}</dd>
          <dt>Stades</dt><dd>${esc(noms(s.stades ?? [], 'stades')) || '—'}</dd>
          <dt>Fin</dt><dd>${esc(finTexte(s))}</dd>
          ${s.lancee ? '' : `<dt>Ouverture</dt><dd>${s.ouvre
            ? `annoncée aux joueurs pour le ${esc(jourFr(s.ouvre))}` : 'pas annoncée'}</dd>`}
          <dt>Carnet</dt><dd class="${figes.has(s.id) ? 'fige' : ''}">${esc(carnetResume(s))}</dd>
        </dl>
        <div class="sai-a">
          <button class="mini" data-editer-saison="${s.id}">Modifier</button>
          <button class="mini ${s.lancee ? 'rouge' : 'vert'}" data-lancer="${s.id}">
            ${s.lancee ? 'Remettre en brouillon' : 'Lancer la saison'}</button>
          ${s.lancee ? ''
            : `<button class="mini rouge" data-suppr-saison="${s.id}">Supprimer</button>`}
        </div>
      </div>`;

    const enCours = d.enCours;
    $('main').innerHTML = `
      <div class="series">
        <p class="series-t">SAISON EN COURS
          <span>${enCours ? `Saison ${enCours.numero} — ${esc(enCours.nom)} · fin : ${
            esc(finTexte(enCours))}`
            : 'aucune saison lancée — toutes les séries restent ouvertes'}</span></p>
        <!-- L'annonce, telle que les joueurs la voient au kiosque. Poser un jour
             d'ouverture sur un brouillon, c'est l'annoncer : l'écran le montre
             ici pour qu'on ne le découvre pas chez les joueurs. -->
        <p class="series-t">ANNONCÉE AUX JOUEURS
          <span>${d.prochaine ? `Saison ${d.prochaine.numero} — ${esc(d.prochaine.nom)}, `
            + `ouverture le ${esc(jourFr(d.prochaine.ouvre))}${d.prochaine.joursAvant
              ? ` (dans ${d.prochaine.joursAvant} jour${d.prochaine.joursAvant > 1 ? 's' : ''})`
              : ' (aujourd’hui)'}`
            : 'rien — aucun brouillon ne porte de jour d’ouverture'}</span></p>
        <!-- Ce que le jeu applique **en ce moment**, et non ce que les cartes
             annoncent. Une saison lancée qui n'ouvre aucune série laisse le jeu
             toutes séries ouvertes — c'était le cas de la saison 1 reprise, et
             la carte affichait « Séries — » sans dire ce que ce tiret produit.
             Un tableau qui montre une liste vide sans montrer son effet donne
             exactement la mauvaise impression : qu'il n'y a plus rien. -->
        <p class="series-t">SÉRIES OUVERTES EN CE MOMENT
          <span>${d.ouvertes
            ? esc(noms(d.ouvertes, 'series'))
            : 'toutes — aucune saison lancée n’en nomme'}</span></p>
        <p class="series-n">Une saison ouvre ses séries et publie <b>tout le reste</b> —
          tenues, équipement, cartes d'action, stades — pour tout le monde, à
          l'instant du lancement. Remettre en brouillon referme les séries et
          <b>elles seules</b> : ce qui a été publié reste publié, parce que
          quelqu'un l'a peut-être déjà gagné. Pour retirer une pièce
          d'équipement, une carte ou un stade, va dans <b>CONTENUS</b>.</p>
      </div>
      <div class="bar"><button class="mini" id="nouvelle-saison">Nouvelle saison</button></div>
      <div id="sai-form"></div>
      ${d.saisons.length
        ? [...d.saisons].reverse().map(carte).join('')
        : '<div class="vide">Aucune saison. Le jeu tourne toutes séries ouvertes.</div>'}`;

    /** Le formulaire. Les quatre listes sont des cases à cocher : une saison se
        relit d'un coup d'œil, et un champ de texte à identifiants séparés par des
        virgules est exactement ce qu'on remplit de travers un soir de lancement. */
    const cases = (source, choisis) => d.choix[source].map((x) => `
      <label class="sai-k"><input type="checkbox" value="${esc(x.id)}"
        ${choisis.includes(x.id) ? 'checked' : ''}>${esc(x.nom)}</label>`).join('');

    function formulaire(s) {
      const v = s ?? { numero: '', nom: '', texte: '',
        series: [], tenues: [], stuff: [], actions: [], stades: [] };
      /* Un carnet figé se montre sans se modifier, et ne repart pas au serveur :
         il n'y a rien à y décider, et un champ qu'on peut taper mais qui sera
         refusé est un piège. */
      const fige = Boolean(s && figes.has(s.id));
      const carnet = Array.isArray(v.carnet) ? v.carnet : DEFAUT;
      $('sai-form').innerHTML = `
        <div class="sai sai-edit">
          <div class="grille">
            <div><label>NUMÉRO</label>
              <input id="s-num" type="number" min="0" value="${esc(v.numero)}"
                placeholder="suivant"></div>
            <div class="large"><label>NOM</label>
              <input id="s-nom" maxlength="64" value="${esc(v.nom)}"
                placeholder="Le virage s’agrandit"></div>
            <div class="large"><label>L’ANNONCE FAITE AUX JOUEURS</label>
              <textarea id="s-txt" maxlength="500"
                placeholder="Cinq séries neuves, des tenues, et de quoi refaire le tour du stade.">${esc(v.texte ?? '')}</textarea></div>
            <div><label for="s-fin">DERNIER JOUR DE JEU</label>
              <input id="s-fin" type="date" value="${esc(v.fin ?? '')}">
              <p class="sai-note">La saison se clôt à la fin de ce jour de jeu : son
                carnet, ses divisions et son classement s’arrêtent. Rien ne se
                referme. Vide : elle court jusqu’au lancement de la suivante.</p></div>
            <div><label for="s-ouvre">OUVERTURE ANNONCÉE</label>
              <input id="s-ouvre" type="date" value="${esc(v.ouvre ?? '')}">
              <p class="sai-note">Pour un brouillon. <b>La poser, c’est l’annoncer</b> :
                « SAISON ${esc(v.numero || 'N')} » apparaît au kiosque avec ce jour,
                jusqu’à la fin de ce jour-là. Vide : rien n’est annoncé.</p></div>
          </div>
          <div class="sai-l"><p class="sai-lt">CARNET DE TAMPONS — ${fige
            ? 'figé, un palier en a déjà été versé' : 'un palier par ligne'}</p>
            <textarea id="s-carnet" class="sai-carnet" spellcheck="false"
              aria-label="Carnet de tampons de la saison"${fige ? ' readonly' : ''}
              >${esc(carnetTexte(carnet))}</textarea>
            <p class="sai-note">${fige
              ? 'Un seuil relevé ou un gain baissé reprendrait une promesse déjà tenue : '
                + 'le carnet se recale avant le premier palier versé, jamais après.'
              : `De ${esc(L.paliersMin ?? 1)} à ${esc(L.paliersMax ?? 8)} paliers. « tampons » : `
                + 'le seuil, strictement croissant ; « nom » : '
                + `${esc(L.nomMax ?? 40)} caractères au plus ; « echarpes » : `
                + `${esc(L.echarpesMax ?? 2000)} au plus ; « packs » : les boosters, `
                + `${esc(L.packsMax ?? 10)} au plus ; au besoin « insigne » (lisere ou `
                + 'tampon) et « titre » (true : le nom devient un titre). Laissé tel '
                + 'quel ou vidé : le carnet par défaut. Il se fige au premier palier versé.'}</p></div>
          <div class="sai-l"><p class="sai-lt">SÉRIES — elles s’ouvrent</p>
            <div class="sai-ks" id="s-series">${cases('series', v.series)}</div></div>
          <div class="sai-l"><p class="sai-lt">TENUES — elles se publient</p>
            <div class="sai-ks" id="s-tenues">${cases('tenues', v.tenues)}</div></div>
          <div class="sai-l"><p class="sai-lt">ÉQUIPEMENT — il se publie</p>
            <div class="sai-ks" id="s-stuff">${cases('stuff', v.stuff)}</div></div>
          <div class="sai-l"><p class="sai-lt">CARTES D’ACTION — elles se publient</p>
            <div class="sai-ks" id="s-actions">${cases('actions', v.actions)}</div></div>
          <div class="sai-l"><p class="sai-lt">STADES — ils se publient</p>
            <div class="sai-ks" id="s-stades">${cases('stades', v.stades)}</div></div>
          <div class="sai-a">
            <button class="mini" id="s-annuler">Annuler</button>
            <button class="mini vert" id="s-ok">${s ? 'Enregistrer' : 'Créer le brouillon'}</button>
          </div>
        </div>`;
      $('sai-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      const coches = (id) => [...document.querySelectorAll(`#${id} input:checked`)]
        .map((i) => i.value);
      $('s-annuler').onclick = () => { $('sai-form').innerHTML = ''; };
      $('s-ok').onclick = async () => {
        const corps = {
          numero: $('s-num').value === '' ? undefined : Number($('s-num').value),
          nom: $('s-nom').value, texte: $('s-txt').value,
          series: coches('s-series'), tenues: coches('s-tenues'),
          stuff: coches('s-stuff'), actions: coches('s-actions'),
          stades: coches('s-stades'),
          /* Vides, les deux jours partent vides : le serveur les efface. Le
             carnet part tel qu'il est tapé, et c'est le serveur qui le juge —
             son refus nomme le palier fautif. */
          fin_le: $('s-fin').value, ouvre_le: $('s-ouvre').value,
          ...(fige ? {} : { carnet: $('s-carnet').value }),
        };
        try {
          /* api(chemin, corps, methode) — trois arguments, et le deuxième est
             le corps. Ces quatre appels-ci passaient un objet { method, body } en
             deuxième place : le serveur recevait donc un POST dont le corps était
             { method: 'PATCH', body: {...} }, refusait sans code, et l'écran
             affichait « Impossible. » — le seul message qui ne dit rien. Aucune
             saison n'a jamais pu être modifiée, lancée ni supprimée depuis cet
             écran. Les seize autres appels de la page avaient la bonne forme :
             c'est ce qui rend cette faute-là invisible à la relecture. */
          if (s) await api(`/saison/${s.id}`, corps, 'PATCH');
          else await api('/saisons', corps);
          recu(s ? `saison ${v.numero || ''} « ${$('s-nom').value} » modifiée.`
            : `brouillon « ${$('s-nom').value} » créé. Il n'ouvre rien tant qu'il n'est pas lancé.`);
          VUES.saisons();
        } catch (e) { recuRate(e); }
      };
    }

    $('nouvelle-saison').onclick = () => formulaire(null);
    for (const b of document.querySelectorAll('[data-editer-saison]')) {
      b.onclick = () => formulaire(d.saisons.find((s) => s.id === Number(b.dataset.editerSaison)));
    }

    for (const b of document.querySelectorAll('[data-lancer]')) {
      b.onclick = async () => {
        const s = d.saisons.find((x) => x.id === Number(b.dataset.lancer));
        /* La confirmation **énumère ce qui s'ouvre**. Un « es-tu sûr ? » auquel
           on ne peut répondre qu'au hasard ne protège de rien, et ce geste-ci
           change le jeu de tous les joueurs connectés. */
        const ouvre = [
          s.series.length ? `${s.series.length} série(s) : ${noms(s.series, 'series')}` : null,
          s.tenues.length ? `${s.tenues.length} tenue(s) : ${noms(s.tenues, 'tenues')}` : null,
        ].filter(Boolean).join('\n');
        const finDite = s.fin ? `\n\nDernier jour de jeu : ${jourFr(s.fin)}.` : '';
        const ok = await window.TBF_DIALOGUE?.confirmer(s.lancee ? {
          titre: `REMETTRE LA SAISON ${s.numero} EN BROUILLON ?`,
          texte: 'Ses séries se referment pour tout le monde. Personne ne perd ce '
            + 'qu’il possède déjà, mais les boosters de ces séries cessent d’être '
            + 'proposés. Les tenues publiées restent publiées.',
          oui: 'REFERMER', ton: 'flare',
        } : {
          titre: `LANCER LA SAISON ${s.numero} ?`,
          texte: `« ${s.nom} » s’ouvre pour tous les joueurs, maintenant.\n\n`
            + (ouvre || 'Elle n’ouvre aucun contenu — elle ne fera qu’annoncer.') + finDite,
          oui: 'LANCER', ton: 'vert',
        });
        if (!ok) return;
        try {
          await api(`/saison/${s.id}/lancer`, { lancer: !s.lancee });
          recu(s.lancee ? `saison ${s.numero} remise en brouillon.`
            : `saison ${s.numero} lancée. Ce qu'elle ouvre est ouvert pour tout le monde.`);
          VUES.saisons();
        } catch (e) { recuRate(e); }
      };
    }

    for (const b of document.querySelectorAll('[data-suppr-saison]')) {
      b.onclick = async () => {
        const s = d.saisons.find((x) => x.id === Number(b.dataset.supprSaison));
        if (!(await window.TBF_DIALOGUE?.confirmer({
          titre: `SUPPRIMER LE BROUILLON ?`,
          texte: `« ${s.nom} » sera effacée. Elle n’a jamais été lancée, donc rien `
            + 'ne change pour les joueurs.',
          oui: 'SUPPRIMER', ton: 'flare',
        }))) return;
        try {
          await api(`/saison/${s.id}`, undefined, 'DELETE');
          recu(`brouillon « ${s.nom} » supprimé.`);
          VUES.saisons();
        } catch (e) { recuRate(e); }
      };
    }
  },

  /**
   * Le catalogue, **trié plutôt que cherché**.
   *
   * Il n'avait qu'un champ libre. Un champ libre répond bien à « où est le
   * Choriste » et très mal aux questions qu'on se pose vraiment devant sept
   * cent onze cartes : *qu'est-ce qui n'est pas dessiné dans LA REPRISE ?*,
   * *quelles légendaires sont retirées ?*, *qu'est-ce qui reste à faire sur les
   * percussions ?* Aucune de ces trois-là ne se tape dans une boîte de texte.
   *
   * Le champ reste — il sert — et quatre listes s'ajoutent à côté. L'état des
   * filtres voyage dans un objet plutôt que dans une chaîne, sans quoi
   * rafraîchir la vue après une modification en perdrait trois sur quatre.
   */
  async fanzzy(f = {}) {
    const d = await api('/fanzzy');
    /* Rétrocompatible : deux endroits rappellent encore `VUES.fanzzy('')`. */
    const flt = typeof f === 'string' ? { q: f } : (f ?? {});
    const filtre = flt.q ?? '';
    const typesOpt = Object.entries(d.types)
      .map(([k, t]) => `<option value="${k}">${esc(t.nom)}</option>`).join('');
    const setsOpt = d.sets.map((s) => `<option value="${s.id}">${esc(s.nom)}</option>`).join('');
    const rarOpt = Object.keys(d.rar).map((r) => `<option value="${r}">${r}</option>`).join('');

    const mot = filtre.trim().toLowerCase();
    /* Chaque filtre est indépendant : « série RP » et « pas dessiné » se
       cumulent, parce que c'est exactement comme ça qu'on cherche du travail à
       faire. Un filtre qui remplacerait le précédent obligerait à tout retaper. */
    const liste = d.fanzzy
      .filter((x) => !flt.set || x.set_id === flt.set)
      .filter((x) => !flt.type || x.type === flt.type)
      .filter((x) => !flt.rar || x.rar === flt.rar)
      .filter((x) => {
        if (!flt.etat) return true;
        if (flt.etat === 'publie') return Boolean(x.publie);
        if (flt.etat === 'retire') return !x.publie;
        /* « dessiné » se lit comme le jeu le lit : un âge sans dessin retombe
           sur celui de son premier âge, et l'écran doit dire la même chose que
           la vitrine, sinon on redessine ce qui est déjà visible. */
        const dessine = Boolean(window.FZART?.racineIllustree?.(x.id));
        return flt.etat === 'dessine' ? dessine : !dessine;
      })
      .filter((x) => !mot || `${x.id} ${x.nom} ${x.set_id} ${x.rar} ${x.type}`
        .toLowerCase().includes(mot));

    const publies = d.fanzzy.filter((x) => x.publie).length;

    const ligne = (x) => {
      /* La même résolution que le jeu : un âge sans dessin montre celui de son
         premier âge. Sans cette ligne, l administration listait deux cent
         soixante-deux tirets là où le joueur, lui, voit un personnage. */
      const dessin = window.FZART?.racineIllustree?.(x.id);
      const vign = dessin
        /* Par `adresse`, pour l'empreinte : une adresse nue montrerait à
           l'administration l'ancien dessin d'une carte qu'on vient de refaire. */
        ? `<img src="${window.FZART.adresse(dessin, 'buste')}" alt="" loading="lazy">`
        : '<div class="sil">—</div>';
      return `<tr class="fzrow ${x.publie ? '' : 'depublie'}" data-id="${x.id}">
        <td>${vign}</td>
        <td><b>${esc(x.nom)}</b>
          ${x.publie ? '' : '<span class="pill off">RETIRÉ</span>'}
          <br><span style="opacity:.45;font-size:11px">${x.id}${x.evo ? ' → ' + x.evo : ''}</span></td>
        <td>${esc(d.types[x.type]?.nom ?? x.type)}<br>
          <span style="opacity:.45;font-size:11px">étage ${x.stage}</span></td>
        <td>${esc(d.sets.find((s) => s.id === x.set_id)?.nom ?? x.set_id)}</td>
        <td>${x.rar}</td>
        <td class="act">
          <button class="mini" data-editer="${x.id}">Modifier</button>
          <button class="mini ${x.publie ? 'rouge' : 'vert'}" data-publier="${x.id}">
            ${x.publie ? 'Retirer' : 'Publier'}</button></td></tr>`;
    };

    /* Le bandeau des séries est devenu **une lecture seule**. Il montre ce qui
       est ouvert et par quelle saison ; il ne l'ouvre plus. Les séries ouvertes
       sont l'union des saisons lancées, et un second interrupteur ici aurait été
       une seconde vérité — le jour où les deux divergent, personne ne sait
       laquelle le jeu applique. L'onglet SAISONS est le seul levier. */
    const serie = (x) => `<span class="serie ${x.ouverte ? 'on' : ''}"
        title="${x.tirables} carte(s) tirable(s) sur ${x.publiees} publiée(s)">
        <b>${esc(x.nom)}</b><span>${x.tirables} tirables</span></span>`;
    const toutesOuvertes = d.series.every((x) => x.ouverte);

    $('main').innerHTML = `
      <div class="series">
        <p class="series-t">SÉRIES OUVERTES
          <span>${toutesOuvertes ? 'toutes — les joueurs voient tout le catalogue'
            : d.series.filter((x) => x.ouverte).map((x) => x.nom).join(' · ') || 'aucune'}</span></p>
        <div class="series-l">${d.series.map(serie).join('')}</div>
        <p class="series-n">Une série grisée n'a aucune carte de stade 1 publiée : elle ne
          pourrait pas distribuer de booster. <b>Pour en ouvrir une, lance une
          saison</b> — onglet SAISONS.</p>
      </div>
      <div class="bar">
        <!-- **« f-serie » et non « f-set ».**

             Ce filtre s'appelait « f-set », comme le champ SÉRIE du formulaire
             d'édition plus bas. Les deux vivent en même temps — le formulaire
             s'insère dans le tableau, sous la barre de filtres — et
             getElementById rend le premier du document, c'est-à-dire toujours
             celui-ci.

             Conséquences, toutes silencieuses : ouvrir une carte à modifier
             déplaçait ce filtre sur la série de la carte ; changer la SÉRIE
             dans le formulaire n'avait aucun effet, puisque l'enregistrement
             relisait ce filtre ; et toute carte créée recevait la première
             série du catalogue, quel que soit le choix fait à l'écran.

             Les voisins échappaient au piège par leurs noms : le filtre des
             familles est « f-fam » quand le formulaire dit « f-type », celui
             des raretés « f-rr » quand le formulaire dit « f-rar ». Seule la
             série avait gardé le même nom des deux côtés.

             Pas d'accent grave ici : ce balisage vit dans un gabarit de chaîne
             JavaScript, et le premier accent grave referme la chaîne. -->
        <select id="f-serie">${optSel('', 'toutes les séries', flt.set)}${
          d.sets.map((x) => optSel(x.id, x.nom, flt.set)).join('')}</select>
        <select id="f-fam">${optSel('', 'toutes les familles', flt.type)}${
          Object.entries(d.types).map(([k, t]) => optSel(k, t.nom, flt.type)).join('')}</select>
        <select id="f-rr">${optSel('', 'toutes les raretés', flt.rar)}${
          Object.keys(d.rar).map((r) => optSel(r, r, flt.rar)).join('')}</select>
        <select id="f-et">${optSel('', 'tous les états', flt.etat)}${
          optSel('publie', 'publiés', flt.etat)}${optSel('retire', 'retirés', flt.etat)}${
          optSel('dessine', 'dessinés', flt.etat)}${
          optSel('nu', 'pas dessinés', flt.etat)}</select>
        <input id="q" placeholder="nom ou identifiant" value="${esc(filtre)}" style="flex:1;min-width:140px">
        <button class="mini" id="nouveau">Nouveau Fanzzy</button>
      </div>`.concat(`
      <div class="compte">${liste.length} affichée(s) sur ${d.fanzzy.length} ·
        ${publies} publiées · ${d.fanzzy.length - publies} retirées ·
        ${ILLUSTRES.size} dessinées</div>
      <div class="tbl"><table><thead><tr><th></th><th>NOM</th><th>TYPE</th><th>SÉRIE</th><th>RARETÉ</th><th></th></tr></thead>
      <tbody id="corps">${liste.map(ligne).join('') || '<tr><td colspan="6" class="vide">Rien ne correspond.</td></tr>'}</tbody></table></div>`);

    const relireFz = () => sansPerdreLaMain(() => VUES.fanzzy({
      set: $('f-serie').value, type: $('f-fam').value, rar: $('f-rr').value,
      etat: $('f-et').value, q: $('q').value }));
    for (const id of ['f-serie', 'f-fam', 'f-rr', 'f-et']) $(id).onchange = relireFz;
    $('q').oninput = () => { clearTimeout($('q')._t);
      $('q')._t = setTimeout(relireFz, 250); };

    /** Le formulaire, ouvert sous la ligne qu'il modifie. */
    const formulaire = (x) => `
      <tr class="fzedit"><td colspan="6">
        <div class="grille">
          <div><label>IDENTIFIANT</label>
            <input id="f-id" value="${esc(x?.id ?? '')}" ${x ? 'disabled' : ''}
              placeholder="X52" maxlength="12"></div>
          <div><label>NOM</label><input id="f-nom" value="${esc(x?.nom ?? '')}"></div>
          <div><label>TYPE</label><select id="f-type">${typesOpt}</select></div>
          <div><label>SÉRIE</label><select id="f-set">${setsOpt}</select></div>
          <div><label>RARETÉ</label><select id="f-rar">${rarOpt}</select></div>
          <div><label>ÉTAGE</label><select id="f-stage">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          </select></div>
          <div><label>ÉVOLUE EN</label>
            <input id="f-evo" value="${esc(x?.evo ?? '')}" placeholder="vide si aucune"></div>
          <div><label>CRI — LIBELLÉ</label>
            <input id="f-cri" value="${esc(cri(x).label ?? '')}"></div>
          <div><label>CRI — GESTE</label><select id="f-gest">
            <option value="tempo">tempo</option><option value="mash">martelage</option>
            <option value="hold">endurance</option></select></div>
          <div><label>CRI — PUISSANCE</label>
            <input id="f-power" type="number" value="${cri(x).power ?? 55}"></div>
          <div class="large"><label>HISTOIRE</label>
            <textarea id="f-histoire">${esc(x?.histoire ?? '')}</textarea></div>
          <div class="large"><label>EFFETS (JSON)</label>
            <input id="f-mods" value='${esc(JSON.stringify(mods(x)))}'></div>
        </div>
        <div class="actions">
          <button class="mini vert" id="f-ok">${x ? 'Enregistrer' : 'Créer'}</button>
          <button class="mini" id="f-non">Annuler</button>
          <span class="err" id="f-err"></span>
        </div>
      </td></tr>`;

    const remplir = (x) => {
      $('f-type').value = x?.type ?? 'voix';
      $('f-set').value = x?.set_id ?? d.sets[0].id;
      $('f-rar').value = x?.rar ?? 'commune';
      $('f-stage').value = String(x?.stage ?? 1);
      $('f-gest').value = cri(x).gest ?? 'tempo';
    };

    const lire = () => ({
      id: $('f-id').value.trim().toUpperCase(),
      nom: $('f-nom').value.trim(),
      type: $('f-type').value, set: $('f-set').value, rar: $('f-rar').value,
      stage: Number($('f-stage').value),
      evo: $('f-evo').value.trim().toUpperCase(),
      histoire: $('f-histoire').value.trim(),
      cri: { label: $('f-cri').value.trim(), gest: $('f-gest').value,
             power: Number($('f-power').value) },
      mods: JSON.parse($('f-mods').value || '{}'),
    });

    let ouvert = null;
    const fermer = () => { document.querySelector('.fzedit')?.remove(); ouvert = null; };

    const brancher = (x, apres) => {
      remplir(x);
      $('f-non').onclick = fermer;
      $('f-ok').onclick = async () => {
        let corps;
        // Le JSON des effets est saisi à la main : une virgule de trop ne doit
        // pas partir au serveur pour revenir en « erreur » sans plus de détail.
        try { corps = lire(); }
        catch { $('f-err').textContent = 'Les effets ne sont pas un JSON valide.'; return; }
        $('f-err').textContent = '';
        try {
          if (x) await api('/fanzzy/' + encodeURIComponent(x.id), corps, 'PATCH');
          else await api('/fanzzy', corps);
          recu((x ? 'Fanzzy ' : 'Fanzzy créé : ') + (corps.nom ?? x.id) + '.');
          VUES.fanzzy(filtre);
        } catch (e) { $('f-err').textContent = MSG_FANZZY[e.code] ?? (e.code ?? 'échec'); }
      };
      apres?.();
    };

    $('nouveau').onclick = () => {
      fermer();
      $('corps').insertAdjacentHTML('afterbegin', formulaire(null));
      brancher(null);
    };

    $('corps').onclick = async (e) => {
      const mod = e.target.closest('[data-editer]');
      const pub = e.target.closest('[data-publier]');

      if (pub) {
        const x = d.fanzzy.find((y) => y.id === pub.dataset.publier);
        /* `api` lève sur tout refus, et ce bouton n'attrapait rien : publier
           une carte pendant une panne ne produisait **aucun** signe — ni reçu,
           ni rafraîchissement, ni message. L'exploitant ne peut pas distinguer
           ça d'un clic qui n'a pas pris, alors il reclique. */
        try {
          await api('/fanzzy/' + encodeURIComponent(x.id), { publie: !x.publie }, 'PATCH');
        } catch (err) { return recuRate(err); }
        recu(x.nom + (x.publie ? ' dépublié.' : ' publié.'));
        return VUES.fanzzy(filtre);
      }
      if (!mod) return;
      const id = mod.dataset.editer;
      if (ouvert === id) return fermer();
      fermer();
      const x = d.fanzzy.find((y) => y.id === id);
      mod.closest('tr').insertAdjacentHTML('afterend', formulaire(x));
      ouvert = id;
      brancher(x);
    };
  },

   /**
   * Les thèmes de tenue.
   *
   * Un thème est un **nom de dossier** avant d'être une carte : `carnaval`
   * devient `public/img/fanzzy/TR1/e1/carnaval/`. C'est pour ça que
   * l'identifiant est bridé aux minuscules sans accent, et pour ça qu'il ne se
   * renomme jamais — le renommer laisserait les dessins derrière lui.
   *
   * **Rien ne se supprime ici non plus.** Un thème effacé orphelinerait les
   * `user_skins` de tous ceux qui l'ont gagné : leur Fanzzy réapparaîtrait nu,
   * sans explication. On dépublie — il cesse de tomber, il reste porté.
   *
   * Un thème existe en base dès qu'il est créé, bien avant d'être dessiné.
   * Tant qu'il n'a pas d'image il s'affiche comme la tenue de base, ce qui ne
   * ressemble pas à une erreur et n'en est pas une : c'est à l'écran de le
   * dire, pas au joueur de le deviner.
   */
  /**
   * Les contenus : cartes d'action, équipement, stades.
   *
   * Vingt-neuf, dix-sept et dix. Ils n'avaient **aucun écran** : on ne pouvait
   * les ouvrir qu'en les cochant dans une saison, et jamais les refermer. Les
   * Fanzzy et les tenues ont chacun le leur ; ces trois familles-là étaient les
   * seules à n'exister que dans le code.
   *
   * Le filtre est **structuré et non plein texte** : on cherche ici « toutes
   * les cartes d'action retirées » ou « les stades publiés », pas un mot. Un
   * champ libre répond bien à « où est machin » et très mal à « qu'est-ce qui
   * est ouvert », qui est la question qu'on se pose devant cet écran.
   */
  async contenus(f = {}) {
    const d = await api('/contenus');
    if (!d.disponible) {
      $('main').innerHTML = `<div class="vide">Les contenus ne sont pas branchés :
        applique <b>sql/contenus.sql</b>, puis redémarre. En attendant, tout est
        jouable et rien ne peut être retiré.</div>`;
      return;
    }

    const familles = Object.entries(d.familles);
    const f2 = { famille: f.famille ?? '', etat: f.etat ?? '', q: f.q ?? '' };
    const mot = f2.q.trim().toLowerCase();

    const lignes = familles
      .filter(([k]) => !f2.famille || k === f2.famille)
      .flatMap(([k, { liste }]) => liste.map((x) => ({ ...x, famille: k })))
      .filter((x) => (f2.etat === '' ? true
        : f2.etat === 'publie' ? x.publie !== false : x.publie === false))
      .filter((x) => !mot || `${x.id} ${x.nom ?? ''} ${x.rar ?? ''}`.toLowerCase().includes(mot));

    const total = familles.reduce((n, [, x]) => n + x.liste.length, 0);
    const publies = familles.reduce((n, [, x]) =>
      n + x.liste.filter((y) => y.publie !== false).length, 0);

    const ligne = (x) => `<tr class="${x.publie === false ? 'depublie' : ''}">
      <td><b>${esc(x.nom ?? x.id)}</b>
        ${x.publie === false ? '<span class="pill off">RETIRÉ</span>' : ''}
        <br><span style="opacity:.45;font-size:11px">${esc(x.id)}</span></td>
      <td>${esc(d.familles[x.famille].nom)}</td>
      <td>${esc(x.rar ?? '—')}</td>
      <td style="text-align:right">
        <button class="mini ${x.publie === false ? 'vert' : 'rouge'}"
          data-basculer="${esc(x.id)}" data-famille="${esc(x.famille)}"
          data-publie="${x.publie === false ? '1' : '0'}">
          ${x.publie === false ? 'Publier' : 'Retirer'}</button></td></tr>`;

    const opt = (v, t, sel) => `<option value="${v}"${v === sel ? ' selected' : ''}>${t}</option>`;
    $('main').innerHTML = `
      <div class="series">
        <p class="series-t">CE QUI EST EN JEU
          <span>${publies} publié(s) sur ${total}</span></p>
        <p class="series-n">Retirer une carte d'action, une pièce d'équipement ou un
          stade le sort des tirages et des parties <b>immédiatement</b>, sans
          l'effacer. C'est le seul endroit d'où l'on referme ce qu'une saison a
          ouvert — <b>SAISONS</b> ouvre, il ne referme que les séries.</p>
      </div>
      <div class="bar">
        <select id="c-famille">${opt('', 'toutes les familles', f2.famille)}${
          familles.map(([k, v]) => opt(k, v.nom, f2.famille)).join('')}</select>
        <select id="c-etat">${opt('', 'publiés et retirés', f2.etat)}${
          opt('publie', 'publiés seulement', f2.etat)}${
          opt('retire', 'retirés seulement', f2.etat)}</select>
        <input id="c-q" placeholder="nom ou identifiant" value="${esc(f2.q)}" style="flex:1">
      </div>
      <div class="compte">${lignes.length} ligne(s)</div>
      <div class="tbl"><table><thead><tr><th>NOM</th><th>FAMILLE</th><th>RARETÉ</th><th></th></tr></thead>
      <tbody id="c-corps">${lignes.map(ligne).join('')
        || '<tr><td colspan="4" class="vide">Rien ne correspond.</td></tr>'}</tbody></table></div>`;

    const relire = () => VUES.contenus({
      famille: $('c-famille').value, etat: $('c-etat').value, q: $('c-q').value });
    $('c-famille').onchange = relire;
    $('c-etat').onchange = relire;
    $('c-q').oninput = () => { clearTimeout($('c-q')._t);
      $('c-q')._t = setTimeout(relire, 250); };

    /* L'écouteur va sur le corps du tableau, pas sur `#main` : un `onclick`
       posé sur `#main` survit au changement d'onglet — `innerHTML` remplace les
       enfants, jamais les gestionnaires du parent — et resterait branché sous
       toutes les vues suivantes. */
    $('c-corps').onclick = async (e) => {
      const b = e.target.closest('[data-basculer]');
      if (!b) return;
      b.disabled = true;
      try {
        const r = await api('/contenus/publier', { famille: b.dataset.famille,
          ids: [b.dataset.basculer], publie: b.dataset.publie === '1' });
        /* `recu(texte, rate)` — le second argument dit **l'échec**, pas la
           réussite. Y passer `r.change > 0` aurait peint en rouge tout ce qui
           marche. */
        recu(b.dataset.publie === '1' ? 'Publié.' : 'Retiré du jeu.');
        await relire();
      } catch (err) { b.disabled = false; recuRate(err); }
    };
  },

  async tenues() {
    const d = await api('/tenues');
    const rarOpt = Object.keys(d.rar)
      .map((r) => `<option value="${r}">${r}</option>`).join('');
    const publies = d.tenues.filter((x) => x.publie).length;

    const ligne = (x) => `<tr class="fzrow ${x.publie ? '' : 'depublie'}">
        <td><b>${esc(x.nom)}</b>
          ${x.publie ? '' : '<span class="pill off">RETIRÉ</span>'}
          <br><span style="opacity:.45;font-size:11px">${x.id}</span></td>
        <td>${x.rar}</td>
        <td style="opacity:.6">${esc(x.texte ?? '')}</td>
        <td style="opacity:.45;font-size:11px">e1..e3/${x.id}/neutre</td>
        <td class="act">
          <button class="mini" data-editer="${x.id}">Modifier</button>
          <button class="mini ${x.publie ? 'rouge' : 'vert'}" data-publier="${x.id}">
            ${x.publie ? 'Retirer' : 'Publier'}</button></td></tr>`;

    $('main').innerHTML = `
      <div class="series">
        <p class="series-t">DÉPOSER LES DESSINS</p>
        <p class="series-n">Un thème se dessine en trois images par personnage —
          un âge chacune — et dans le seul état <b>neutre</b> : un thème habille,
          il ne rejoue pas les douze réactions. Les fichiers vont dans
          <code>art/&lt;ID&gt;/_src/</code>, nommés
          <code>&lt;numéro&gt;-e&lt;1|2|3&gt;-&lt;thème&gt;-neutre.png</code> —
          par exemple <code>001-e2-carnaval-neutre.png</code>. Un objet porté
          ajoute un cinquième champ :
          <code>001-e2-carnaval-neutre-drapeau.png</code>.
          <code>npm run veille</code> les convertit dès qu'ils sont posés.</p>
      </div>
      <div class="bar"><button class="mini" id="nouveau">Nouveau thème</button></div>
      <div class="compte">${d.tenues.length} thèmes · ${publies} distribués ·
        ${d.tenues.length - publies} retirés</div>
      <div class="tbl"><table><thead><tr><th>NOM</th><th>RARETÉ</th><th>DESCRIPTION</th>
        <th>DOSSIERS</th><th></th></tr></thead>
      <tbody id="corps">${d.tenues.map(ligne).join('')}</tbody></table></div>`;

    const formulaire = (x) => `
      <tr class="fzedit"><td colspan="5">
        <div class="grille">
          <div><label>IDENTIFIANT</label>
            <input id="t-id" value="${esc(x?.id ?? '')}" ${x ? 'disabled' : ''}
              placeholder="carnaval" maxlength="24"></div>
          <div><label>NOM</label><input id="t-nom" value="${esc(x?.nom ?? '')}"
            placeholder="Carnaval" maxlength="48"></div>
          <div><label>RARETÉ</label><select id="t-rar">${rarOpt}</select></div>
          <div class="large"><label>DESCRIPTION</label>
            <input id="t-texte" value="${esc(x?.texte ?? '')}" maxlength="160"
              placeholder="Ce que le joueur lit sous la tenue."></div>
        </div>
        <div class="actions">
          <button class="mini vert" id="t-ok">${x ? 'Enregistrer' : 'Créer'}</button>
          <button class="mini" id="t-non">Annuler</button>
          <span class="err" id="t-err"></span>
        </div>
      </td></tr>`;

    let ouvert = null;
    const fermer = () => { document.querySelector('.fzedit')?.remove(); ouvert = null; };

    const brancher = (x) => {
      $('t-rar').value = x?.rar ?? 'rare';
      $('t-non').onclick = fermer;
      $('t-ok').onclick = async () => {
        const corps = { id: $('t-id').value.trim().toLowerCase(),
          nom: $('t-nom').value.trim(), rar: $('t-rar').value,
          texte: $('t-texte').value.trim() };
        $('t-err').textContent = '';
        try {
          if (x) { await api('/tenues/' + encodeURIComponent(x.id), corps, 'PATCH');
            recu('thème ' + corps.nom + ' modifié.'); }
          else {
            /* Le serveur répond avec le nom de fichier attendu. On le montre au
               lieu de refermer en silence : sans dessin, le thème s'affiche
               comme la tenue de base, et rien à l'écran ne dirait pourquoi. */
            const fait = await api('/tenues', corps);
            $('main').insertAdjacentHTML('afterbegin', `<div class="depot">
              <b>Thème « ${esc(fait.nom)} » créé.</b> Dépose maintenant ses dessins :
              <code>${esc(fait.source)}</code> — un par âge, <code>-e1-</code>,
              <code>-e2-</code>, <code>-e3-</code>. Tant qu'ils manquent, il
              s'affiche comme la tenue de base.</div>`);
            return;
          }
          VUES.tenues();
        } catch (e) { $('t-err').textContent = MSG_FANZZY[e.code] ?? (e.code ?? 'échec'); }
      };
    };

    $('nouveau').onclick = () => {
      fermer();
      $('corps').insertAdjacentHTML('afterbegin', formulaire(null));
      brancher(null);
    };

    $('corps').onclick = async (e) => {
      const mod = e.target.closest('[data-editer]');
      const pub = e.target.closest('[data-publier]');
      if (pub) {
        const x = d.tenues.find((y) => y.id === pub.dataset.publier);
        // Même silence que sur le bouton jumeau du catalogue, même correction.
        try {
          await api('/tenues/' + encodeURIComponent(x.id), { publie: !x.publie }, 'PATCH');
        } catch (err) { return recuRate(err); }
        recu(x.nom + (x.publie ? ' dépublié.' : ' publié.'));
        return VUES.tenues();
      }
      if (!mod) return;
      const id = mod.dataset.editer;
      if (ouvert === id) return fermer();
      fermer();
      const x = d.tenues.find((y) => y.id === id);
      mod.closest('tr').insertAdjacentHTML('afterend', formulaire(x));
      ouvert = id;
      brancher(x);
    };
  },

  async reglages() {
    const [d, recal] = await Promise.all([api('/registre'),
      api('/divisions/recalage').catch((e) => ({ refus: e }))]);
    const parSection = (id) => d.reglages.filter((r) => r.section === id);
    // Une clé posée en base est une clé modifiée, même si sa valeur égale le
    // défaut : c'est ce que `brutes` dit et que `valeurs` ne peut pas dire.
    const touche = (cle) => Object.prototype.hasOwnProperty.call(d.brutes, cle);

    const champ = (r) => {
      const v = d.valeurs[r.cle];
      if (r.type === 'booleen') {
        return `<button class="bascule" data-bascule="${r.cle}" aria-pressed="${v ? 'true' : 'false'}"
          aria-label="${esc(r.titre)}"><i></i></button>`;
      }
      if (r.type === 'choix') {
        return `<select data-champ="${r.cle}">${r.choix.map(([val, lib]) =>
          `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(lib)}</option>`).join('')}</select>`;
      }
      if (r.type === 'texte') {
        return `<input type="text" data-champ="${r.cle}" maxlength="${r.max ?? 240}"
          value="${esc(v)}">`;
      }
      return `<input type="number" data-champ="${r.cle}" value="${v}"
        min="${r.min}" max="${r.max}" step="${r.pas ?? 1}">`;
    };

    const ligne = (r) => `<div class="rg${touche(r.cle) ? ' change' : ''}" data-rg="${r.cle}">
      <div class="lib"><b>${esc(r.titre)}</b>
        ${r.aide ? `<small>${esc(r.aide)}</small>` : ''}
        <small class="def">Par défaut : ${esc(String(d.defauts[r.cle]))}${
          r.unite ? ' ' + esc(r.unite) : ''}</small></div>
      <div class="val">${champ(r)}
        <span class="u">${esc(r.unite ?? '')}</span>
        <button class="mini rendre" data-rendre="${r.cle}"
          title="Revenir à la valeur par défaut">↺</button></div>
    </div>`;

    /* Le recalage des seuils de division (`ECONOMIE.md`, annexe A), posé
       au-dessus des quatre seuils de la section de la saison. Le serveur
       calcule ; l'écran montre ce qu'il a lu et ce qu'il propose. */
    const ent = (n) => Number(n).toLocaleString('fr-CH', { maximumFractionDigits: 0 });
    const AVERTIS = {
      sans_fin: 'Le dernier jour de jeu de la saison n’est pas saisi (onglet SAISONS) : '
        + 'sans lui, rien ne se projette sur la saison entière.',
      aucun_joueur: 'Aucun joueur sans abonnement n’a encore de ferveur classée cette saison.',
      peu_de_joueurs: 'Moins de 30 joueurs : les rangs lus tiennent à quelques personnes. '
        + 'La proposition est fragile, à refaire plus tard.',
      trop_tot: 'Moins de deux semaines de jeu : la projection sur la saison est fragile, '
        + 'à refaire plus tard.',
      capo_borne: 'Capo est ramené à ce qu’un joueur gratuit assidu fait dans la saison.',
      seuils_egaux: 'Deux seuils proposés sont égaux : ces divisions se franchiront ensemble.',
    };
    const NOMS = { 'rang.habitue': ['HABITUÉ', 'habitue', '70 %'],
      'rang.fervent': ['FERVENT', 'fervent', '40 %'], 'rang.ultra': ['ULTRA', 'ultra', '15 %'],
      'rang.capo': ['CAPO', 'capo', '4 %'] };
    /* Le cadre, écrit une fois : son identifiant ne doit apparaître qu'une
       fois dans la page (`npm run pages`), refus ou proposition. */
    const cadreRecalage = (corps) =>
      `<div class="recal" id="recalage"><b>RECALER LES DIVISIONS</b>${corps}</div>`;
    function recalage(r) {
      if (r?.refus) {
        return cadreRecalage(`
          <p class="alerte">${esc(MSG_FANZZY[r.refus.code] ?? r.refus.raison ?? r.refus.code
            ?? 'le serveur n’a pas répondu.')}</p>`);
      }
      const s = r.saison;
      const tete = s
        ? `Saison ${esc(String(s.numero ?? ''))} « ${esc(s.nom ?? '')} » : ${ent(r.joursEcoules)} jour${
            r.joursEcoules >= 2 ? 's' : ''} joué${r.joursEcoules >= 2 ? 's' : ''}${
            r.joursTotaux ? ` sur ${ent(r.joursTotaux)}` : ''}${r.joueurs == null ? '.' : `, ${
            r.joueurs} joueur${r.joueurs > 1 ? 's' : ''} sans abonnement avec de la ferveur classée.`}`
        : 'Aucune saison lancée.';
      const lignes = Object.entries(NOMS).map(([cle, [nom, id, part]]) => `<tr>
          <td>${nom}</td><td>${part}</td><td>${ent(r.actuels?.[cle] ?? 0)}</td>
          <td>${r.lus ? ent(r.lus[id]) : '—'}</td>
          <td><b>${r.seuils ? ent(r.seuils[cle]) : '—'}</b></td></tr>`).join('');
      return cadreRecalage(`
        <p>${tete} La règle lit la ferveur classée des seuls joueurs <b>sans abonnement</b>
        (l’abonné n’a pas de plafond), puis la projette sur la saison entière${
          r.facteur ? ` (× ${r.facteur.toLocaleString('fr-CH', { maximumFractionDigits: 2 })})` : ''}.</p>
        <table><thead><tr><th>DIVISION</th><th>VISÉE</th><th>SEUIL ACTUEL</th>
          <th>LU AUJOURD’HUI</th><th>PROPOSÉ</th></tr></thead><tbody>${lignes}</tbody></table>
        ${r.plafond ? `<p>Un joueur gratuit assidu fait environ ${ent(r.plafond)} de ferveur
          classée dans la saison : Capo ne le dépasse pas.</p>` : ''}
        ${(r.avertissements ?? []).filter((a) => AVERTIS[a])
          .map((a) => `<p class="alerte">${esc(AVERTIS[a])}</p>`).join('')}
        <p>Relever un seuil ne retire rien à qui a déjà récupéré sa division.</p>
        <button class="mini" id="poser-recalage"${r.seuils ? '' : ' disabled'}>
          Poser ces quatre seuils</button>`);
    }

    $('main').innerHTML = `
      <p style="opacity:.5;font-size:12px;max-width:660px">Ces réglages agissent
      <b>immédiatement</b>, sans redéploiement : le serveur relit ses valeurs après chaque
      enregistrement. Ce qui n'est pas ici ne se règle pas ici — les prix en euros vivent
      dans le catalogue de la boutique, et les taux de tirage d'un booster payant sont une
      donnée réglementée qui ne bouge pas depuis un champ de saisie.</p>
      ${d.sections.map((sec) => `<section class="sect">
        <h3>${esc(sec.titre)}</h3><p class="sh">${esc(sec.aide)}</p>
        ${sec.id === 'saison' ? recalage(recal) : ''}
        ${parSection(sec.id).map(ligne).join('')}
      </section>`).join('')}
      <div class="enreg"><span class="quoi" id="quoi"></span></div>`;

    /* Chaque champ s'enregistre seul, à la sortie. Un bouton « Enregistrer »
       unique obligerait à deviner lequel des vingt-six champs a été refusé
       quand le serveur en refuse un.

       Ce qui manquait n'était donc pas le bouton, mais **la réponse** : le seul
       accusé de réception vivait dans un bandeau collé en pied de liste, sous
       vingt-six lignes. On touchait un champ en haut de l'écran et rien ne
       bougeait à l'endroit où l'on regardait. Le reçu se pose désormais
       par-dessus la page ; le bandeau reste, il porte la dernière ligne. */
    const poser = async (cle, valeur, el) => {
      try {
        await api('/reglage/' + encodeURIComponent(cle), { valeur }, 'PUT');
        $('quoi').textContent = `${cle} enregistré.`;
        recu(`${cle} = ${valeur}`);
        el?.closest('.rg')?.classList.add('change');
      } catch (e) {
        /* Le redessin **d'abord**, le message ensuite. Dans l'autre ordre, le
           redessin remplaçait le bandeau qui venait d'annoncer le refus : deux
           lignes correctes chacune, et ensemble elles ne montraient rien. */
        await VUES.reglages();
        $('quoi').textContent = 'Refusé — ' + (e.raison || e.message || e.code);
        recuRate(e);
      }
    };

    $('main').onchange = (e) => {
      const el = e.target.closest('[data-champ]');
      if (!el) return;
      const r = d.reglages.find((x) => x.cle === el.dataset.champ);
      const v = (r.type === 'entier' || r.type === 'decimal') ? Number(el.value) : el.value;
      poser(r.cle, v, el);
    };

    $('main').onclick = async (e) => {
      if (e.target.closest('#poser-recalage')) {
        try {
          const r = await api('/divisions/recalage', {}, 'POST');
          await VUES.reglages();
          recu('seuils de division posés : ' + Object.entries(r.seuils)
            .map(([cle, v]) => `${NOMS[cle][0]} ${ent(v)}`).join(', ') + '.');
        } catch (err) { recuRate(err); }
        return;
      }
      const b = e.target.closest('[data-bascule]');
      if (b) {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        return poser(b.dataset.bascule, on, b);
      }
      const rd = e.target.closest('[data-rendre]');
      if (rd) {
        /* Sans ce rattrapage, un refus laissait la page annoncer « rendu au
           défaut » pour un réglage qui n'avait pas bougé — pire que le silence
           des deux autres boutons, puisque celui-ci affirmait. */
        try {
          await api('/reglage/' + encodeURIComponent(rd.dataset.rendre), undefined, 'DELETE');
        } catch (err) { return recuRate(err); }
        $('quoi').textContent = `${rd.dataset.rendre} rendu au défaut.`;
        recu(`${rd.dataset.rendre} rendu à sa valeur par défaut.`);
        return VUES.reglages();
      }
    };
  },

  async journal() {
    const d = await api('/journal?limite=150');
    $('main').innerHTML = `<div class="tbl"><table><thead><tr><th>QUAND</th><th>QUI</th><th>ACTION</th><th>CIBLE</th><th>DÉTAIL</th></tr></thead>
      <tbody>${d.journal.map((l)=>`<tr>
        <td style="white-space:nowrap">${jour(l.au)}</td>
        <td>${esc(l.acteur ?? 'système')}</td>
        <td><b style="font-family:var(--banner)">${esc(l.action)}</b></td>
        <td style="font-size:11px;opacity:.6">${esc(l.cible ?? '')}</td>
        <td class="log">${esc(JSON.stringify(l.detail ?? {}))}</td></tr>`).join('')
        || '<tr><td colspan="5" class="vide">Journal vide.</td></tr>'}</tbody></table></div>`;
  },
};

/* Le dessin de la flèche vient de `menu.js`, qui tient les icônes du jeu : le
   recopier ici en donnerait une seconde à corriger le jour où elle change.
   `menu.js` est chargé sans `defer`, donc `TBF_MENU` est là avant cette ligne. */
$('retour').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + `<path d="${window.TBF_MENU.ICONES.retour}"/></svg>`;

window.TBF_MENU.monter($('burger'));

/* **Trois issues, et pas deux.**

   Tout ce qui ratait menait à `/compte`. « Pas connecté » y mène à bon droit —
   c'est là qu'on prend sa place. Mais « la passerelle répond 502 » y menait
   aussi, et « le téléphone n'a plus de réseau » également : l'exploitant se
   retrouvait sur l'écran de connexion au milieu d'une panne, à se demander
   pourquoi sa session avait sauté. C'est précisément l'écran depuis lequel on
   diagnostique une panne, et il accusait l'utilisateur de la panne.

   On sépare donc les deux. Seul un refus d'authentification renvoie au compte ;
   tout le reste s'affiche ici, avec de quoi réessayer. Le contrôle d'accès ne
   change pas : il n'a jamais été ici. Chaque route `/api/admin` vérifie le
   droit côté serveur, et cette page ne fait que choisir quoi montrer. */
(async () => {
  const dehors = (msg) => {
    // `mini` : c'est la seule classe de bouton que cette feuille habille
    // (`button.mini`). Un `btn` emprunté ailleurs sortirait nu.
    $('main').innerHTML = `<div class="vide">${esc(msg)}<br><br>
      <button class="mini" id="reessayer">RÉESSAYER</button></div>`;
    $('nav').style.display = 'none';
    $('reessayer').onclick = () => location.reload();
  };
  try {
    // `r.ok` avant `r.json()` : une page d'erreur de la passerelle n'est pas du
    // JSON, et sans ce test la lecture lève sur un corps qu'on n'a pas demandé.
    const r = await fetch('/api/auth/me', { credentials:'same-origin' });
    const me = r.ok ? await r.json().catch(() => ({})) : {};
    $('who').textContent = me.user?.pseudo ?? '';
    const s = await api('/suis-je');
    if (!s.admin) {
      $('main').innerHTML = '<div class="vide">Cette page est réservée aux administrateurs.</div>';
      $('nav').style.display = 'none';
      return;
    }
    rendre();
  } catch (e) {
    /* 401 seulement. `/suis-je` n'exige que d'être connecté — un compte sans
       droits reçoit 200 et `{ admin: false }`, traité juste au-dessus. Un 403
       ici voudrait donc dire quelque chose d'inattendu, et mieux vaut l'écrire
       à l'écran que le déguiser en « reconnecte-toi ». */
    if (e.status === 401) { location.href = '/compte'; return; }
    console.error('[admin] la porte a levé :', e);
    dehors(e.status
      ? `Le serveur a répondu ${e.status}. L’administration est momentanément illisible.`
      : 'Serveur injoignable. Rien n’a été lu, rien n’a été écrit.');
  }
})();
</script>
<script src="/fx.js" defer></script>
<!-- L'administration chargeait le tiroir sans la barre qui le porte : pas de
     bouton pour l'ouvrir, pas de titre, pas de flèche. Sortir d'ici demandait
     de retaper une adresse. Même correction que sur `/compte`, même cause. -->
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
</html>
