<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>

*{box-sizing:border-box}
body{margin:0;background:#0A0D11;color:var(--craie);font-family:var(--ui);font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(242,238,228,.12)}
header h1{font-family:var(--banner);font-size:17px;letter-spacing:.16em;margin:0;flex:1}
header .who{font-size:12px;opacity:.5}
nav{display:flex;gap:6px;padding:12px 18px;flex-wrap:wrap}
nav button{background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.14);border-radius:7px;
  color:inherit;padding:8px 14px;font-family:var(--banner);font-size:12px;letter-spacing:.06em;
  cursor:pointer;opacity:.55}
nav button.on{background:var(--craie);color:#0B0E13;opacity:1}
main{padding:0 18px 40px;max-width:1100px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:18px}
.card{border:1px solid rgba(242,238,228,.12);border-radius:10px;padding:12px;background:rgba(0,0,0,.3)}
.card b{display:block;font-family:var(--banner);font-size:22px;color:var(--projo)}
.card span{font-size:10.5px;opacity:.5;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--banner);font-size:10px;letter-spacing:.12em;opacity:.45;
  padding:8px 6px;font-weight:500;border-bottom:1px solid rgba(242,238,228,.12)}
td{padding:9px 6px;border-bottom:1px solid rgba(242,238,228,.07);vertical-align:middle}
td.act{white-space:nowrap}
button.mini{background:rgba(0,0,0,.4);border:1px solid rgba(242,238,228,.2);border-radius:5px;
  color:inherit;font-size:11px;padding:4px 8px;cursor:pointer;margin-right:4px}
button.mini.rouge{border-color:rgba(224,64,44,.5);color:var(--flare)}
button.mini.vert{border-color:rgba(30,158,106,.5);color:var(--vert)}
input,select{background:rgba(0,0,0,.4);border:1px solid rgba(242,238,228,.18);border-radius:6px;
  color:inherit;padding:8px 10px;font-family:inherit;font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{font-size:10px;border-radius:4px;padding:2px 7px;border:1px solid currentColor}
.pill.admin{color:var(--projo)}.pill.locked{color:var(--flare)}.pill.off{color:var(--flare)}
.log{font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.7;opacity:.75}
.log b{color:var(--projo);font-family:var(--banner)}
.vide{opacity:.45;padding:36px;text-align:center}

/* ------------------------------------------------------ catalogue Fanzzy
   Cet écran sert à tenir cent cartes. Il est donc dense exprès : une ligne
   par Fanzzy, la vignette à gauche pour reconnaître d'un coup d'œil, et
   l'édition qui s'ouvre sous la ligne sans quitter la liste. */
.fzrow img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#0B1017;display:block}
.fzrow .sil{width:34px;height:34px;border-radius:6px;background:rgba(242,238,228,.07);
  display:grid;place-items:center;font-size:9px;opacity:.5}
.fzrow.depublie{opacity:.45}
.fzedit{background:rgba(0,0,0,.35)}
.fzedit .grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;
  padding:12px 6px}
.fzedit label{display:block;font-size:10px;letter-spacing:.1em;opacity:.5;margin-bottom:4px;
  font-family:var(--banner)}
.fzedit input,.fzedit select,.fzedit textarea{width:100%}
.fzedit textarea{background:rgba(0,0,0,.4);border:1px solid rgba(242,238,228,.18);border-radius:6px;
  color:inherit;padding:8px 10px;font-family:inherit;font-size:13px;min-height:66px;resize:vertical}
.fzedit .large{grid-column:1/-1}
.fzedit .actions{padding:0 6px 14px;display:flex;gap:8px;align-items:center}
.fzedit .err{color:var(--flare);font-size:12px}
.series{border:1px solid rgba(242,238,228,.14);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.series-t{margin:0 0 9px;font-family:var(--banner);font-size:11px;letter-spacing:.18em}
.series-t span{display:block;font-family:var(--ui);font-size:12px;letter-spacing:0;
  opacity:.55;margin-top:3px;text-transform:none}
.series-l{display:flex;flex-wrap:wrap;gap:6px}
.series button{background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.14);
  border-radius:8px;color:inherit;font:inherit;padding:7px 11px;cursor:pointer;text-align:left}
.series button b{display:block;font-family:var(--banner);font-size:11.5px;letter-spacing:.06em}
.series button span{font-size:10px;opacity:.45}
.series button.on{border-color:#1E9E6A;background:rgba(30,158,106,.14)}
.series button.on b{color:#4FB98A}
.series button:disabled{opacity:.35;cursor:not-allowed}
.series-n{margin:10px 0 0;font-size:11px;opacity:.42;line-height:1.6}
.compte{font-size:11.5px;opacity:.5;margin-bottom:10px}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header><h1>ADMINISTRATION</h1><span class="who" id="who"></span>
  <a href="/" style="color:var(--projo);font-size:12px">retour au jeu</a></header>
<nav id="nav"></nav>
<main id="main"><div class="vide">Chargement…</div></main>

<!-- Sans « defer » : la vue du catalogue lit FZART.ILLUSTRES pour savoir quels
     Fanzzy sont dessinés, et elle le lit dès sa première exécution. -->
<script src="/fanzzy-art.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
const api = async (p, body, method) => {
  const r = await fetch('/api/admin' + p, {
    method: method ?? (body === undefined ? 'GET' : 'POST'),
    headers: { 'content-type':'application/json' }, credentials:'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error ?? 'erreur'), { code:j.error, status:r.status });
  return j;
};
const jour = (d) => new Date(d).toLocaleString('fr', { day:'2-digit', month:'2-digit',
  hour:'2-digit', minute:'2-digit' });

/* ------------------------------------------------------ catalogue Fanzzy */

/** Quels Fanzzy sont dessinés. La liste vient de /fanzzy-art.js, source unique. */
const ILLUSTRES = window.FZART?.ILLUSTRES ?? new Set();

/**
 * Selon la version du pilote MySQL, une colonne JSON revient décodée ou en
 * chaîne. Les deux cas doivent marcher, sinon l'écran tombe sur la première
 * carte au lieu d'afficher la liste.
 */
const jsonCol = (v, defaut) => {
  if (v == null) return defaut;
  if (typeof v !== 'string') return v;
  try { return JSON.parse(v); } catch { return defaut; }
};
const cri = (x) => jsonCol(x?.cri, {});
const mods = (x) => jsonCol(x?.mods, {});

/**
 * Les refus du serveur, en clair. Un code brut affiché tel quel oblige à
 * ouvrir le source pour comprendre ce qu'on a mal rempli.
 */
const MSG_FANZZY = {
  'admin.error.serie_inconnue': 'Cette série n’existe pas.',
  'admin.error.serie_sans_carte': 'Cette série n’a aucune carte de stade 1 publiée : '
    + 'elle ne pourrait pas distribuer de booster.',
  'admin.error.fanzzy_id': 'Identifiant invalide : une lettre puis des lettres ou chiffres, ex. X52.',
  'admin.error.fanzzy_existe': 'Cet identifiant est déjà pris.',
  'admin.error.fanzzy_inconnu': 'Ce Fanzzy n’existe pas.',
  'admin.error.fanzzy_nom': 'Le nom est trop court.',
  'admin.error.fanzzy_type': 'Type inconnu.',
  'admin.error.fanzzy_set': 'Série inconnue.',
  'admin.error.fanzzy_rarete': 'Rareté inconnue.',
  'admin.error.fanzzy_stage': 'L’étage vaut 1, 2 ou 3.',
  'admin.error.fanzzy_geste': 'Le geste vaut tempo, martelage ou endurance.',
  'admin.error.fanzzy_mods': 'Les effets doivent être un objet JSON.',
  'admin.error.fanzzy_evo_soi': 'Un Fanzzy ne peut pas évoluer en lui-même.',
  'admin.error.fanzzy_evo_inconnue': 'L’évolution pointe sur un identifiant qui n’existe pas.',
  'admin.error.fanzzy_incomplet': 'Nom, type, série, rareté et cri sont obligatoires.',
  'admin.error.nothing_to_do': 'Rien n’a changé.',
};

const ONGLETS = [
  ['apercu','APERÇU'], ['fanzzy','FANZZY'], ['joueurs','JOUEURS'],
  ['competitions','COMPÉTITIONS'], ['reglages','RÉGLAGES'], ['journal','JOURNAL'],
];
let onglet = 'apercu';

$('nav').innerHTML = ONGLETS.map(([k,t]) =>
  `<button data-o="${k}" class="${k===onglet?'on':''}">${t}</button>`).join('');
$('nav').onclick = (e) => {
  const b = e.target.closest('[data-o]'); if (!b) return;
  onglet = b.dataset.o;
  document.querySelectorAll('nav button').forEach((x)=>x.classList.toggle('on',x===b));
  rendre();
};

/* ------------------------------------------------------------ vues */

async function rendre() {
  $('main').innerHTML = '<div class="vide">Chargement…</div>';
  try { await VUES[onglet](); }
  catch (e) {
    $('main').innerHTML = `<div class="vide">${e.status === 403
      ? 'Accès réservé aux administrateurs.' : 'Erreur : ' + esc(e.code ?? e.message)}</div>`;
  }
}

const VUES = {
  async apercu() {
    const d = await api('/apercu');
    const c = (v, l) => `<div class="card"><b>${v ?? 0}</b><span>${l}</span></div>`;
    $('main').innerHTML = `
      <div class="cards">
        ${c(d.joueurs.total,'JOUEURS')}${c(d.joueurs.nouveaux,'CETTE SEMAINE')}
        ${c(d.joueurs.verifies,'ADRESSES VÉRIFIÉES')}${c(d.joueurs.admins,'ADMINS')}
        ${c(d.jeu.souvenirs,'SOUVENIRS')}${c(d.jeu.vecus,'DONT VÉCUS')}
        ${c(d.jeu.supporters,'DANS LE VIRAGE')}${c(d.competitions.activees,'COMPÉTITIONS ACTIVES')}
      </div>
      <h3 style="font-family:var(--banner);font-size:12px;letter-spacing:.15em;opacity:.5">EXPLOITATION</h3>
      <table><tbody>
        <tr><td>Quota API du jour</td><td>${d.quota
          ? `${d.quota.usedToday} utilisés · ${d.quota.budgetLeft} restants` : 'suivi inactif'}</td></tr>
        <tr><td>Messagerie</td><td>${d.mail
          ? `${esc(d.mail.etat)}${d.mail.erreur ? ' — ' + esc(d.mail.erreur) : ''}` : 'inconnue'}</td></tr>
        <tr><td>Salles du Grand Virage</td><td>${d.virage.length
          ? d.virage.map((r)=>`match ${r.fixtureId} · ${r.foule[0]}v${r.foule[1]}`).join('<br>')
          : 'aucune'}</td></tr>
        <tr><td>Outils</td><td class="act">
          <button class="mini" id="purge">Purger le cache</button>
          <button class="mini" id="mail">Envoi de contrôle</button></td></tr>
      </tbody></table>`;
    $('purge').onclick = async () => {
      const r = await api('/cache/purge', {});
      alert(`${r.purge} entrées purgées`); rendre();
    };
    $('mail').onclick = async () => {
      const r = await api('/mail-test', {});
      alert(r.delivered ? 'Mail envoyé.' : 'Non envoyé : ' + (r.erreur ?? 'voir la console'));
    };
  },

  /**
   * Le catalogue Fanzzy.
   *
   * C'est l'écran qui doit permettre d'atteindre cent cartes sans toucher au
   * code. Il est dense exprès : une ligne par Fanzzy, la vignette pour
   * reconnaître d'un coup d'œil, et l'édition qui s'ouvre sous la ligne sans
   * quitter la liste — sur cent cartes, une page par carte serait pénible.
   *
   * Il n'y a **pas de bouton supprimer**, et ce n'est pas un oubli : un
   * identifiant effacé orphelinerait les collections, les decks et le Fanzzy
   * équipé de tous ceux qui le possèdent. On dépublie.
   */
  async fanzzy(filtre = '') {
    const d = await api('/fanzzy');
    const typesOpt = Object.entries(d.types)
      .map(([k, t]) => `<option value="${k}">${esc(t.nom)}</option>`).join('');
    const setsOpt = d.sets.map((s) => `<option value="${s.id}">${esc(s.nom)}</option>`).join('');
    const rarOpt = Object.keys(d.rar).map((r) => `<option value="${r}">${r}</option>`).join('');

    const f = filtre.trim().toLowerCase();
    const liste = f
      ? d.fanzzy.filter((x) => `${x.id} ${x.nom} ${x.set_id} ${x.rar} ${x.type}`
          .toLowerCase().includes(f))
      : d.fanzzy;

    const publies = d.fanzzy.filter((x) => x.publie).length;

    const ligne = (x) => {
      const vign = ILLUSTRES.has(x.id)
        ? `<img src="/img/fanzzy/${x.id}-buste.png" alt="" loading="lazy">`
        : '<div class="sil">—</div>';
      return `<tr class="fzrow ${x.publie ? '' : 'depublie'}" data-id="${x.id}">
        <td>${vign}</td>
        <td><b>${esc(x.nom)}</b>
          ${x.publie ? '' : '<span class="pill off">RETIRÉ</span>'}
          <br><span style="opacity:.45;font-size:11px">${x.id}${x.evo ? ' → ' + x.evo : ''}</span></td>
        <td>${esc(d.types[x.type]?.nom ?? x.type)}<br>
          <span style="opacity:.45;font-size:11px">étage ${x.stage}</span></td>
        <td>${esc(d.sets.find((s) => s.id === x.set_id)?.nom ?? x.set_id)}</td>
        <td>${x.rar}</td>
        <td class="act">
          <button class="mini" data-editer="${x.id}">Modifier</button>
          <button class="mini ${x.publie ? 'rouge' : 'vert'}" data-publier="${x.id}">
            ${x.publie ? 'Retirer' : 'Publier'}</button></td></tr>`;
    };

    // Le bandeau des séries. C'est l'interrupteur qui décide de ce qu'un
    // joueur peut obtenir : une série fermée ne se propose plus au kiosque et
    // ne se tire plus. Ce qu'il possède déjà lui reste — fermer, c'est cesser
    // de distribuer, pas confisquer.
    const serie = (x) => `<button class="serie ${x.ouverte ? 'on' : ''}" data-serie="${x.id}"
        title="${x.tirables} carte(s) tirable(s) sur ${x.publiees} publiée(s)"
        ${x.tirables ? '' : 'disabled'}>
        <b>${esc(x.nom)}</b><span>${x.tirables} tirables</span></button>`;
    const toutesOuvertes = d.series.every((x) => x.ouverte);

    $('main').innerHTML = `
      <div class="series">
        <p class="series-t">SÉRIES OUVERTES
          <span>${toutesOuvertes ? 'toutes — les joueurs voient tout le catalogue'
            : d.series.filter((x) => x.ouverte).map((x) => x.nom).join(' · ') || 'aucune'}</span></p>
        <div class="series-l">${d.series.map(serie).join('')}</div>
        <p class="series-n">Une série grisée n'a aucune carte de stade 1 publiée : elle ne
          pourrait pas distribuer de booster. Tout fermer revient à tout ouvrir.</p>
      </div>
      <div class="bar">
        <input id="q" placeholder="nom, identifiant, série, rareté" value="${esc(filtre)}" style="flex:1">
        <button class="mini" id="nouveau">Nouveau Fanzzy</button>
      </div>`.concat(`
      <div class="compte">${d.fanzzy.length} cartes · ${publies} publiées ·
        ${d.fanzzy.length - publies} retirées · ${ILLUSTRES.size} dessinées</div>
      <table><thead><tr><th></th><th>NOM</th><th>TYPE</th><th>SÉRIE</th><th>RARETÉ</th><th></th></tr></thead>
      <tbody id="corps">${liste.map(ligne).join('') || '<tr><td colspan="6" class="vide">Rien ne correspond.</td></tr>'}</tbody></table>`);

    // Un clic bascule la série. On envoie la liste complète des ouvertes et non
    // un différentiel : deux onglets d'administration ouverts en même temps
    // s'écraseraient proprement au lieu de composer un état que personne n'a voulu.
    for (const b of document.querySelectorAll('[data-serie]')) {
      b.onclick = async () => {
        const ouvertes = d.series.filter((x) => x.ouverte).map((x) => x.id);
        const id = b.dataset.serie;
        const suite = ouvertes.includes(id)
          ? ouvertes.filter((x) => x !== id) : [...ouvertes, id];
        try {
          await api('/series', { method: 'PUT', body: { series: suite } });
          VUES.fanzzy(filtre);
        } catch (e) { alert(MSG_FANZZY[e.code] ?? e.code ?? 'Impossible.'); }
      };
    }

    $('q').oninput = (e) => { clearTimeout($('q')._t);
      $('q')._t = setTimeout(() => VUES.fanzzy(e.target.value), 250); };

    /** Le formulaire, ouvert sous la ligne qu'il modifie. */
    const formulaire = (x) => `
      <tr class="fzedit"><td colspan="6">
        <div class="grille">
          <div><label>IDENTIFIANT</label>
            <input id="f-id" value="${esc(x?.id ?? '')}" ${x ? 'disabled' : ''}
              placeholder="X52" maxlength="12"></div>
          <div><label>NOM</label><input id="f-nom" value="${esc(x?.nom ?? '')}"></div>
          <div><label>TYPE</label><select id="f-type">${typesOpt}</select></div>
          <div><label>SÉRIE</label><select id="f-set">${setsOpt}</select></div>
          <div><label>RARETÉ</label><select id="f-rar">${rarOpt}</select></div>
          <div><label>ÉTAGE</label><select id="f-stage">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          </select></div>
          <div><label>ÉVOLUE EN</label>
            <input id="f-evo" value="${esc(x?.evo ?? '')}" placeholder="vide si aucune"></div>
          <div><label>CRI — LIBELLÉ</label>
            <input id="f-cri" value="${esc(cri(x).label ?? '')}"></div>
          <div><label>CRI — GESTE</label><select id="f-gest">
            <option value="tempo">tempo</option><option value="mash">martelage</option>
            <option value="hold">endurance</option></select></div>
          <div><label>CRI — PUISSANCE</label>
            <input id="f-power" type="number" value="${cri(x).power ?? 55}"></div>
          <div class="large"><label>HISTOIRE</label>
            <textarea id="f-histoire">${esc(x?.histoire ?? '')}</textarea></div>
          <div class="large"><label>EFFETS (JSON)</label>
            <input id="f-mods" value='${esc(JSON.stringify(mods(x)))}'></div>
        </div>
        <div class="actions">
          <button class="mini vert" id="f-ok">${x ? 'Enregistrer' : 'Créer'}</button>
          <button class="mini" id="f-non">Annuler</button>
          <span class="err" id="f-err"></span>
        </div>
      </td></tr>`;

    const remplir = (x) => {
      $('f-type').value = x?.type ?? 'voix';
      $('f-set').value = x?.set_id ?? d.sets[0].id;
      $('f-rar').value = x?.rar ?? 'commune';
      $('f-stage').value = String(x?.stage ?? 1);
      $('f-gest').value = cri(x).gest ?? 'tempo';
    };

    const lire = () => ({
      id: $('f-id').value.trim().toUpperCase(),
      nom: $('f-nom').value.trim(),
      type: $('f-type').value, set: $('f-set').value, rar: $('f-rar').value,
      stage: Number($('f-stage').value),
      evo: $('f-evo').value.trim().toUpperCase(),
      histoire: $('f-histoire').value.trim(),
      cri: { label: $('f-cri').value.trim(), gest: $('f-gest').value,
             power: Number($('f-power').value) },
      mods: JSON.parse($('f-mods').value || '{}'),
    });

    let ouvert = null;
    const fermer = () => { document.querySelector('.fzedit')?.remove(); ouvert = null; };

    const brancher = (x, apres) => {
      remplir(x);
      $('f-non').onclick = fermer;
      $('f-ok').onclick = async () => {
        let corps;
        // Le JSON des effets est saisi à la main : une virgule de trop ne doit
        // pas partir au serveur pour revenir en « erreur » sans plus de détail.
        try { corps = lire(); }
        catch { $('f-err').textContent = 'Les effets ne sont pas un JSON valide.'; return; }
        $('f-err').textContent = '';
        try {
          if (x) await api('/fanzzy/' + encodeURIComponent(x.id), corps, 'PATCH');
          else await api('/fanzzy', corps);
          VUES.fanzzy(filtre);
        } catch (e) { $('f-err').textContent = MSG_FANZZY[e.code] ?? (e.code ?? 'échec'); }
      };
      apres?.();
    };

    $('nouveau').onclick = () => {
      fermer();
      $('corps').insertAdjacentHTML('afterbegin', formulaire(null));
      brancher(null);
    };

    $('corps').onclick = async (e) => {
      const mod = e.target.closest('[data-editer]');
      const pub = e.target.closest('[data-publier]');

      if (pub) {
        const x = d.fanzzy.find((y) => y.id === pub.dataset.publier);
        await api('/fanzzy/' + encodeURIComponent(x.id), { publie: !x.publie }, 'PATCH');
        return VUES.fanzzy(filtre);
      }
      if (!mod) return;
      const id = mod.dataset.editer;
      if (ouvert === id) return fermer();
      fermer();
      const x = d.fanzzy.find((y) => y.id === id);
      mod.closest('tr').insertAdjacentHTML('afterend', formulaire(x));
      ouvert = id;
      brancher(x);
    };
  },

  async joueurs(terme = '') {
    const d = await api('/joueurs?q=' + encodeURIComponent(terme));
    $('main').innerHTML = `
      <div class="bar"><input id="q" placeholder="pseudo ou adresse" value="${esc(terme)}">
        <button class="mini" id="go">Chercher</button></div>
      <table><thead><tr><th>JOUEUR</th><th>ÉTAT</th><th>BOURSE</th><th>JEU</th><th>ACTIONS</th></tr></thead>
      <tbody>${d.joueurs.map((u) => `
        <tr><td><b>${esc(u.pseudo)}</b>
          ${u.role==='admin'?'<span class="pill admin">ADMIN</span>':''}
          ${u.status==='locked'?'<span class="pill locked">BLOQUÉ</span>':''}
          <br><span style="opacity:.45;font-size:11px">${esc(u.email)}</span></td>
        <td>${u.email_verified_at ? 'vérifié' : 'non vérifié'}<br>
          <span style="opacity:.45;font-size:11px">inscrit le ${jour(u.created_at)}</span></td>
        <td>${u.scarves ?? 0} éch.<br><span style="opacity:.45;font-size:11px">${u.packs ?? 0} boosters · ${u.follow_slots ?? 2} slots</span></td>
        <td>${u.fanzzy ?? 0} fanzzy<br><span style="opacity:.45;font-size:11px">${u.ferveur ?? 0} ferveur</span></td>
        <td class="act" data-id="${u.public_id}">
          <button class="mini" data-a="scarves">+100 éch.</button>
          <button class="mini" data-a="packs">+5 pk</button>
          ${u.email_verified_at ? '' : '<button class="mini vert" data-a="verifier">Vérifier</button>'}
          <button class="mini ${u.status==='locked'?'vert':'rouge'}" data-a="toggle"
            data-status="${u.status}">${u.status==='locked'?'Débloquer':'Bloquer'}</button>
          <button class="mini" data-a="role" data-role="${u.role}">${u.role==='admin'?'Rétrograder':'Promouvoir'}</button>
        </td></tr>`).join('')}</tbody></table>`;

    $('go').onclick = () => VUES.joueurs($('q').value.trim());
    $('q').onkeydown = (e) => { if (e.key === 'Enter') VUES.joueurs($('q').value.trim()); };
    $('main').onclick = async (e) => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const id = b.closest('[data-id]').dataset.id;
      const corps = {
        scarves: { scarves: 100 }, packs: { packs: 5 }, verifier: { verifier: true },
        toggle: { status: b.dataset.status === 'locked' ? 'active' : 'locked' },
        role: { role: b.dataset.role === 'admin' ? 'joueur' : 'admin' },
      }[b.dataset.a];
      try { await api('/joueur/' + id, corps, 'PATCH'); VUES.joueurs($('q')?.value ?? ''); }
      catch (err) { alert(err.code === 'admin.error.not_yourself'
        ? 'Impossible sur son propre compte.' : 'Refusé : ' + err.code); }
    };
  },

  async competitions(terme = '') {
    const d = await api('/competitions?q=' + encodeURIComponent(terme));
    $('main').innerHTML = `
      <div class="bar"><input id="q" placeholder="nom ou pays" value="${esc(terme)}">
        <button class="mini" id="go">Chercher</button></div>
      <table><thead><tr><th>COMPÉTITION</th><th>SAISON</th><th>COUVERTURE</th><th>PALIER</th><th>ÉTAT</th></tr></thead>
      <tbody>${d.competitions.map((c) => `
        <tr data-id="${c.league_id}" data-s="${c.season}">
          <td><b>${esc(c.name)}</b><br><span style="opacity:.45;font-size:11px">${esc(c.country ?? '')} · ${esc(c.family)}</span></td>
          <td>${c.season}<br><span style="opacity:.45;font-size:11px">${c.starts_on ?? '?'} → ${c.ends_on ?? '?'}</span></td>
          <td style="font-size:11px;opacity:.6">${[c.has_events&&'buts',c.has_standings&&'classement',
             c.has_top_scorers&&'buteurs'].filter(Boolean).join(' · ') || 'aucune'}</td>
          <td><select data-a="tier">${[1,2,3].map((t)=>
            `<option value="${t}" ${c.tier===t?'selected':''}>palier ${t}</option>`).join('')}</select></td>
          <td class="act"><button class="mini ${c.enabled?'rouge':'vert'}" data-a="toggle"
            data-on="${c.enabled}">${c.enabled?'Désactiver':'Activer'}</button></td>
        </tr>`).join('')}</tbody></table>`;
    $('go').onclick = () => VUES.competitions($('q').value.trim());
    const maj = async (tr, corps) => {
      await api(`/competition/${tr.dataset.id}/${tr.dataset.s}`, corps, 'PATCH');
      VUES.competitions($('q')?.value ?? '');
    };
    $('main').onclick = async (e) => {
      const b = e.target.closest('button[data-a="toggle"]'); if (!b) return;
      await maj(b.closest('tr'), { enabled: b.dataset.on !== '1' });
    };
    $('main').onchange = async (e) => {
      const s = e.target.closest('select[data-a="tier"]'); if (!s) return;
      await maj(s.closest('tr'), { tier: Number(s.value) });
    };
  },

  async reglages() {
    const d = await api('/reglages');
    $('main').innerHTML = `
      <p style="opacity:.5;font-size:12px;max-width:600px">Réglages modifiables sans redéploiement.
      La clé <b>annonce</b> affiche un bandeau pour tous les joueurs.</p>
      <div class="bar"><input id="cle" placeholder="clé" style="width:180px">
        <input id="val" placeholder='valeur JSON, ex : {"texte":"…","actif":true}' style="flex:1;min-width:260px">
        <button class="mini" id="set">Enregistrer</button></div>
      <table><thead><tr><th>CLÉ</th><th>VALEUR</th></tr></thead><tbody>
        ${Object.entries(d).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td>
          <td class="log">${esc(JSON.stringify(v))}</td></tr>`).join('')
          || '<tr><td colspan="2" class="vide">Aucun réglage.</td></tr>'}
      </tbody></table>`;
    $('set').onclick = async () => {
      let valeur;
      try { valeur = JSON.parse($('val').value); }
      catch { return alert('La valeur doit être du JSON valide.'); }
      try { await api('/reglage/' + encodeURIComponent($('cle').value.trim()), { valeur }, 'PUT');
        VUES.reglages(); }
      catch (e) { alert('Refusé : ' + e.code); }
    };
  },

  async journal() {
    const d = await api('/journal?limite=150');
    $('main').innerHTML = `<table><thead><tr><th>QUAND</th><th>QUI</th><th>ACTION</th><th>CIBLE</th><th>DÉTAIL</th></tr></thead>
      <tbody>${d.journal.map((l)=>`<tr>
        <td style="white-space:nowrap">${jour(l.au)}</td>
        <td>${esc(l.acteur ?? 'système')}</td>
        <td><b style="font-family:var(--banner)">${esc(l.action)}</b></td>
        <td style="font-size:11px;opacity:.6">${esc(l.cible ?? '')}</td>
        <td class="log">${esc(JSON.stringify(l.detail ?? {}))}</td></tr>`).join('')
        || '<tr><td colspan="5" class="vide">Journal vide.</td></tr>'}</tbody></table>`;
  },
};

(async () => {
  try {
    const me = await fetch('/api/auth/me', { credentials:'same-origin' }).then((r)=>r.json());
    $('who').textContent = me.user?.pseudo ?? '';
    const s = await api('/suis-je');
    if (!s.admin) {
      $('main').innerHTML = '<div class="vide">Cette page est réservée aux administrateurs.</div>';
      $('nav').style.display = 'none';
      return;
    }
    rendre();
  } catch {
    location.href = '/compte';
  }
})();
</script>
<script src="/fx.js" defer></script>
</body>
</html>
