  const src = f.qui ? (imageFz(f.qui, etat) ?? imageFz(f.qui, 'neutre')) : null;
  if (!el || !src || src === f.voulu) return;
  f.voulu = src;
  const jeton = ++f.jeton;
  if (src === f.src) return;               // déjà devant : on n'annule que ce qui chargeait
  const calques = el.querySelectorAll('.duel-fz-corps>img');
  const derriere = calques[1 - f.devant];
  derriere.src = src;
  try { await derriere.decode(); }
  catch {
    // Le dessin qui ne se charge pas retombe sur son PNG (`secours`).
    if (jeton !== f.jeton) return;
    const repli = window.TBF_ETATS?.secours?.(src);
    if (!repli) return;
    try { derriere.src = repli; await derriere.decode(); } catch { return; }
  }
  if (jeton !== f.jeton) return;
  derriere.classList.add('on');
  calques[f.devant].classList.remove('on');
  f.devant = 1 - f.devant;
  f.src = src;
}

/** Un geste d'un instant (`saut`, `hisse`, `affaisse`, `rage`, `entre`, et
    ceux des familles), rejoué du début. Le calme l'éteint dans la feuille. */
function gesteFz(f, geste) {
  const el = $(f.id);
  if (!el || el.hidden) return;
  clearTimeout(f.gesteT);
  el.removeAttribute('data-geste');
  void el.offsetWidth;
  el.dataset.geste = geste;
  f.gesteT = setTimeout(() => el.removeAttribute('data-geste'), 1000);
}

/**
 * Fait vivre un moment au Fanzzy d'un camp, `tenir` millisecondes, puis le
 * rend au repos. Un moment de rang plus bas ne coupe pas celui qui tient.
 */
function vivreFz(cote, etat, tenir, geste) {
  const f = fzArene[cote];
  const el = $(f?.id);
  if (!f?.qui || !el) return;
  const t = performance.now();
  if (t < f.jusqua && (RANG_FZ[etat] ?? 0) < (RANG_FZ[f.pose] ?? 0)) return;
  // La poussée qui suit son geste ne le coupe pas pour se pencher.
  if (geste === 'hisse' && t < f.sienJusqua) geste = null;
  f.pose = etat;
  f.jusqua = t + tenir;
  el.dataset.pose = etat;
  poserImageFz(f, etat);
  if (geste) gesteFz(f, geste);
  clearTimeout(f.retour);
  f.retour = setTimeout(() => {
    f.pose = 'neutre';
    f.jusqua = 0;
    el.dataset.pose = 'neutre';
    poserImageFz(f, 'neutre');
  }, tenir);
}

/**
 * **Le geste de sa famille.** Quand un joueur réussit le chant de la
 * spécialité de son Fanzzy, celui-ci le chante à sa manière : la Voix crie
 * (il se gonfle, la tête en arrière), la Percussion frappe (trois coups secs),
 * la Fidélité tient (elle se dresse et ne bouge plus), le Tifo déploie (il
 * s'élargit), le Pyro allume (il bondit dans un éclat), le Déplacement fait
 * tourner l'écharpe (il balance d'un côté à l'autre).
 *
 * **Aucun dessin de plus** : la pose « pousse » quand elle existe, le
 * plein-pied sinon, et le mouvement fait le reste — comme pour le saut d'un
 * but chez qui n'a pas de joie dessinée.
 */
const GESTE_DE_FAMILLE = { voix: 'crie', perc: 'frappe', fide: 'tient', tifo: 'deploie',
  pyro: 'allume', depl: 'tourne' };

function sonGesteFz(cote, famille) {
  const f = fzArene[cote];
  const geste = GESTE_DE_FAMILLE[famille];
  if (!f?.qui || !geste) return;
  vivreFz(cote, 'pousse', TENIR_FZ.sien, geste);
  f.sienJusqua = performance.now() + TENIR_FZ.sien;
}

/** Les coups d'en face posés sur la tribune d'un camp, par type. */
function coupsRecus(v, cote) {
  const mon = v.moi?.side ?? 0;
  const listes = (v.equipes?.[cote === 'moi' ? mon : mon ^ 1] ?? []).map((j) => j?.effets ?? []);
  if (cote === 'moi') listes.push(v.moi?.effets ?? []);
  const vus = new Set();
  for (const l of listes) for (const e of l) if (COUPS_RECUS.has(e?.type)) vus.add(e.type);
  return vus;
}

/**
 * Qui se tient dans l'arène, à chaque vue : on ne change la figure que si le
 * personnage a changé (une Relève, un changement de Fanzzy, un joueur
 * d'en face parti), et la colère part au coup d'en face **qui arrive**, pas
 * à celui qui dure.
 */
function rendreFzArene(v) {
  if (!fzManifesteLu || !v) return;
  for (const f of Object.values(fzArene)) {
    const el = $(f.id);
    if (!el) continue;
    const qui = quiEnTribune(v, f.cote);
    /* L'âge dans la clé : l'identifiant est la lignée, et ne change pas
       quand la Relève fait grandir le personnage. */
    const cle = qui ? `${qui.id}|${qui.evo}|${qui.skin}` : '';
    if (cle !== f.cle) {
      /* Un autre Fanzzy entre en glissant depuis sa ligne ; le même qui
         grandit (la Relève) saute sur place ; la tenue arrivée en retard
         (le portefeuille répond après la première vue) ne fait rien. */
      const [avant, evoAvant] = f.cle.split('|');
      const geste = !avant || !qui ? null
        : avant !== qui.id ? (racineFz(avant) === qui.racine ? 'saut' : 'entre')
          : evoAvant !== String(qui.evo) ? 'saut' : null;
      f.cle = cle;
      f.qui = qui ? { ...qui, supporter: !dessinFzArene(qui, 'neutre') } : null;
      if (el.hidden === Boolean(qui)) el.hidden = !qui;
      if (f.qui) {
        poserImageFz(f, f.pose);
        // Les moments qu'il vivra : chargés d'avance, ils arrivent au pire moment pour attendre.
        for (const etat of ['pousse', 'but', 'encaisse', 'decision']) {
          const src = imageFz(f.qui, etat);
          if (src) new Image().src = src;
        }
        if (geste && S.entree) gesteFz(f, geste);
      }
    }
    /* Ce qu'il porte : ses deux pièces, accrochées côté tribune, hors du
       corps — elles ne se retournent pas avec celui d'en face et ne sautent
       pas avec lui. Redessinées seulement quand le sac change. */
    const cleSac = window.TBF_STUFF?.cleSac?.(qui?.sac) ?? '';
    if (cleSac !== f.cleSac) {
      f.cleSac = cleSac;
      el.querySelector('.tbf-porte')?.remove();
      if (qui && cleSac) el.insertAdjacentHTML('beforeend', window.TBF_STUFF.porte(qui.sac));
    }
    if (el.hasAttribute('data-parti') !== Boolean(qui?.parti)) el.toggleAttribute('data-parti', Boolean(qui?.parti));
    const coups = coupsRecus(v, f.cote);
    if (f.coups && [...coups].some((c) => !f.coups.has(c))) {
      vivreFz(f.cote, 'decision', TENIR_FZ.decision, 'rage');
    }
    f.coups = coups;
  }
}

/** Les deux entrent en scène quand l'affiche se retire. */
function entrerFz() {
  for (const f of Object.values(fzArene)) gesteFz(f, 'entre');
}

/* ------------------------------------------------- ce qui se voit

   Il n'y a plus de fil de texte. Un journal qui défile pendant qu'on joue
   n'est jamais lu : on regarde la corde, pas la colonne de phrases. Chaque
   événement devient donc un signal — un chiffre qui monte du nœud, un
   supporter qui pousse, une onde, un son.

   Le texte qui reste est transitoire et tient en deux mots : le nom d'une
   carte jouée, qu'on ne peut pas deviner autrement.                        */

const mien = (side) => side === S.vue?.moi?.side;

/** Mon identifiant de joueur, **tel que la vue le sert** (`moi.userId`,
    § 17) ; d'un serveur d'avant, celui que le vestiaire a dit (`nvn:file`,
    `moi`), sinon, seul de ma tribune, c'est moi. `null` quand on ne peut
    pas le savoir (une reprise à plusieurs par tribune, sans `userId`). */
function monId() {
  if (S.vue?.moi?.userId != null) return S.vue.moi.userId;
  if (S.moiId != null) return S.moiId;
  const tribune = S.vue?.equipes?.[S.vue?.moi?.side];
  return tribune?.length === 1 ? (tribune[0].userId ?? null) : null;
}

/* ------------------------------------------------- la case de BD des buts

   **Un but se lit dans la case de BD** (`.tbf-moment`, la pièce unifiée du
   lot 2, comme au Grand Virage et au hub) : « LA CORDE CÈDE ! » quand sa
   tribune fait céder la corde, « GOAL ! » au but du vrai match, avec le
   buteur et la minute. `FX.but` n'y ajoute que la secousse et la vibration
   (`vignette: true`) : sa forme pleine écrivait « BUT ! » au milieu de
   l'écran, et `FX.butReel` un second titre une seconde plus tard — deux
   lettrages nus pour un seul but.

   **Plus courte qu'au Virage**, où elle tient quinze secondes : un duel
   dure cinq minutes, et la case couvre le milieu de l'écran — l'équipe et
   la main restent jouables dessous (elle ne prend jamais le doigt), mais on
   doit les revoir vite. */
const MOMENT_CORDE_MS = 3500;
const MOMENT_REEL_MS = 5000;
let momentT = 0;

function poserMoment(texte, ton, { sous = '', ms = MOMENT_CORDE_MS } = {}) {
  const b = $('moment');
  if (!b) return;
  ecrire($('momentTitre'), texte);
  ecrire($('momentSous'), sous);
  b.dataset.ton = ton;
  placerCase(b);
  // Le scotch sous la case se décolle sur la durée du moment.
  b.style.setProperty('--mt', `${ms}ms`);
  b.classList.remove('on');
  void b.offsetWidth;
  b.classList.add('on');
  clearTimeout(momentT);
  momentT = setTimeout(() => b.classList.remove('on'), ms);
  reglerCase();
}

/**
 * **Au-dessus de la corde, quand les deux Fanzzy sont dans l'arène.**
 *
 * Centrée sur l'écran, la case couvrait la moitié basse de l'arène — et
 * c'est là, au même instant, que l'un saute de joie et que l'autre
 * s'affaisse. Le but se lisait, mais on ne le voyait plus vivre. La case
 * descend donc **jusqu'à la corde et pas plus bas** : sa boîte (le voile, la
 * bouffée, les confettis, centrés sur elle) va du haut de l'arène à la
 * corde, et remonte sur le HUD quand l'arène est trop basse pour la tenir.
 * Sans Fanzzy à l'écran — une arène trop basse, un écran trop court —, elle
 * reprend le centre, comme partout ailleurs.
 */
function placerCase(b) {
  b.style.top = '';
  b.style.bottom = '';
  const arene = $('arene')?.getBoundingClientRect();
  // `offsetParent` est nul sous `display:none` : l'arène les a cachés.
  const visibles = ['fzMoi', 'fzEux'].some((id) => $(id) && !$(id).hidden && $(id).offsetParent);
  const vignette = b.querySelector('.tbf-vignette');
  if (!arene?.height || !visibles || !vignette) return;
  const corde = arene.top + arene.height / 2;
  const pad = parseFloat(getComputedStyle(b).paddingTop) || 0;
  const haut = Math.min(arene.top, corde - vignette.offsetHeight - 2 * pad - 8);
  if (haut < 0) return;
  b.style.top = `${Math.round(haut)}px`;
  b.style.bottom = `${Math.round(innerHeight - corde)}px`;
}

function couperMoment() {
  clearTimeout(momentT);
  momentT = 0;
  $('moment')?.classList.remove('on');
}

/* **Sous le tiroir et sous la fenêtre du geste.** La case est au calque 95 :
   ouverte pendant un but, elle couvrirait le tiroir (49) qu'on vient
   d'ouvrir, et le pavé (80) qu'on est en train de frapper — l'épreuve prend
   l'écran, rien ne doit passer devant (`TBF_ACTION.suspendre`). La page la
   redescend le temps que l'un ou l'autre est ouvert, puis la rend. */
function reglerCase() {
  const b = $('moment');
  if (!b) return;
  const z = document.querySelector('.tbf-tiroir.on') ? '47'
    : $('mini').classList.contains('on') ? '79' : '';
  if (b.style.zIndex !== z) b.style.zIndex = z;
}
new MutationObserver(() => reglerCase()).observe($('mini'), { attributes: true, attributeFilter: ['class'] });
addEventListener('load', () => {
  // Le tiroir est monté par `menu.js`, en différé, après « qui es-tu ? ».
  let essais = 0;
  const guetter = () => {
    const tiroir = document.querySelector('.tbf-tiroir');
    if (tiroir) {
      new MutationObserver(() => reglerCase()).observe(tiroir, { attributes: true, attributeFilter: ['class'] });
      reglerCase();
    } else if (++essais < 40) setTimeout(guetter, 250);
  };
  guetter();
});

/** Le point d'où partent les chiffres : le foulard de la corde. */
function pointCorde() {
  const n = $('noeud')?.getBoundingClientRect();
  if (!n?.width) return { x: innerWidth / 2, y: innerHeight * 0.3 };
  return { x: n.left + n.width / 2, y: n.top };
}

const OR = 'var(--projo)', BLEU = 'var(--bleu)', GRIS = 'var(--gris)';

function raconter(e) {
  const FX = window.FX;
  const pour = mien(e.side);

  switch (e.t) {
    /**
     * Un chant. **Le mot vient du serveur** (`verdict`, § 17) : il décide du
     * son, de l'onde et de la poussée de sa tribune — jamais une note lue par
     * la page. Sans mot (un serveur d'avant le lot 6), le son ordinaire du
     * chant, et ni onde ni tampon.
     */
    case 'chant': {
      teteSaute(e.userId);
      /* Le sien : la fenêtre du geste attend ce verdict pour le claquer. Il
         se reconnaît à **son identifiant**, que l'évènement porte — un
         partenaire de tribune peut chanter la même carte au même instant, et
         son mot n'est pas le nôtre. Sans identifiant connu, la tribune et la
         carte, comme avant. */
      const id = monId();
      const deMoi = id != null ? e.userId === id : pour;
      if (deMoi && S.verdictCarte === e.cardId) S.verdictAttendu?.(e);
      if (e.backfire) { FX?.son?.('contre'); break; }
      const v = e.verdict;
      FX?.son?.(v === 'parfait' ? 'parfait' : 'chant');
      // Un bon chant de son camp fait pousser sa tribune, quatre secondes.
      if (pour && (v === 'parfait' || v === 'bon')) window.TBF_SON?.ambiance?.(2, { pendant: 4000 });
      // Un geste parfait mérite d'être vu de loin, même chez l'adversaire.
      if (v === 'parfait') {
        const p = pointCorde();
        FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 220 });
      }
      /* **Son geste** : réussi, le chant de sa spécialité le fait chanter à
         la manière de sa famille (voir `GESTE_DE_FAMILLE`). */
      if (e.sien && (v === 'parfait' || v === 'bon')) sonGesteFz(pour ? 'moi' : 'eux', e.famille);
      break;
    }

    /**
     * Une poussée arrive au foulard.
     *
     * **La sienne est grosse, celle d'en face reste petite** — et ce n'est pas
     * du favoritisme, c'est ce qui les distingue. Un joueur qui vient de
     * réussir une visée doit voir ce que ça lui a rapporté ; ce que l'autre
     * encaisse, il lui suffit de le remarquer. Sous six, une poussée est du
     * bruit de fond que personne n'a décidé.
     */
    case 'push': {
      if ((e.valeur ?? 0) < 6) break;
      // Son Fanzzy se penche vers la corde avec elle (voir `vivreFz`).
      vivreFz(pour ? 'moi' : 'eux', 'pousse', TENIR_FZ.pousse, 'hisse');
      const p = pointCorde();
      if (pour) {
        FX?.points?.(e.valeur, p, { couleur: OR, quoi: 'POUSSÉE' });
        // Sa tribune pousse avec la corde (voir « chant », juste au-dessus).
        window.TBF_SON?.ambiance?.(2, { pendant: 4000 });
      } else {
        FX?.nombre?.(`+${e.valeur}`, { x: p.x - 26, y: p.y, couleur: BLEU, signe: false });
      }
      FX?.son?.(pour ? 'pousse' : 'contre');
      break;
    }

    /**
     * Une carte part : elle se montre en grand, avec son dessin, et se replie
     * vers la corde où son effet va se lire. L'onde reste au foulard : elle dit
     * « quelque chose arrive ici », la carte dit « et c'est ça ». Le camp qui
     * l'a jouée est retenu : ses effets « adverses » suivent dans le même
     * envoi.
     */
    case 'action': {
      S.dernierActeur = e.side;
      const a = carteDef(e.cardId);
      const p = pointCorde();
      FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 200 });
      // La carte qu'on vient de toucher, quand c'est la nôtre : elle part de
      // sa place dans la main, ce qui rattache le geste à ce qu'il déclenche.
      const depuis = pour
        ? document.querySelector(`#mainCartes [data-jouer="${CSS.escape(String(e.cardId))}"]`)
          ?? document.querySelector('#mainCartes [data-etat="jouee"]') : null;
      window.TBF_ACTION.jouee(a, { pour, vers: p, depuis });
      break;
    }

    /* Un effet posé : **la vue le porte désormais** (`equipes[][].effets`,
       voir `rendreObjets`), et l'évènement ne sert plus que de repli à un
       serveur d'avant. Son `side` est le camp qui le porte (Renvoi compris) —
       et donc `pour` veut dire ici « posé chez moi » ; sans lui, le camp
       d'en face de la dernière carte jouée. Seul le brouillard y arrive avec
       sa durée. */
    case 'effect': {
      const t = performance.now();
      const chezEux = e.side === 0 || e.side === 1 ? !pour
        : e.cible === 'adverse' && S.dernierActeur !== null && mien(S.dernierActeur);
      if (chezEux && OBJET_DE[e.type] && Number(e.duree) > 0) {
        S.chezEux.set(e.type, { fin: t + Number(e.duree), duree: Number(e.duree) });
      }
      break;
    }

    case 'shield': {
      const p = pointCorde();
      FX?.nombre?.(`−${e.absorbe}`, { x: p.x, y: p.y + 18, couleur: GRIS, signe: false });
      FX?.son?.('bache');
      break;
    }

    /* **La Relève** (lot 6) : `FX.evolution` sur la carte active — la
       charge, le flash, le nouveau portrait —, puis le tampon « A GRANDI »
       claque sur elle. C'est le seul moment du duel où un personnage change
       durablement, et il a coûté des écharpes puis un emplacement de deck.
       Celle d'un autre joueur s'annonce comme avant, par son nom. */
    case 'evolve': {
      const actif = (S.vue?.moi?.fanzzy ?? []).find((f) => f.actif);
      /* La sienne se reconnaît à son identifiant (un partenaire de tribune
         peut aligner le même Fanzzy) ; sans identifiant connu, au camp et
         au personnage. */
      const id = monId();
      const sienne = id != null && e.userId != null ? e.userId === id : pour;
      const carte = sienne && actif && e.fanzzy === actif.id ? $('equipe').querySelector('.fz.actif') : null;
      const portrait = carte?.querySelector('.vig img, .vig svg') ?? null;
      if (carte && FX?.evolution) {
        const rar = window.TBF_FOND?.palierDecor?.({ rar: actif.rar, stage: e.stade }) ?? 'commune';
        FX.evolution(portrait, { nom: String(e.nom ?? '').toUpperCase(), rar }).then((r) => {
          // Le rendu a reposé le portrait d'après pendant la charge.
          const neuf = $('equipe').querySelector('.fz.actif');
          r?.arrivee?.(neuf?.querySelector('.vig img, .vig svg') ?? null);
          if (neuf) {
            neuf.querySelector(':scope > .tbf-tampon')?.remove();
            const t = fabriquer('<span class="tbf-tampon tbf-tampon--plein tbf-clac" data-ton="vert">A GRANDI</span>');
            neuf.appendChild(t);
            setTimeout(() => { try { FX?.son?.('bache'); } catch { /* rien */ } }, 160);
            setTimeout(() => t.remove(), 2600);
          }
        });
        break;
      }
      const p = pointCorde();
      FX?.titre?.(pour ? String(e.nom ?? '').toUpperCase() : 'RELÈVE ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 260 });
      FX?.son?.(pour ? 'parfait' : 'carte');
      break;
    }

    case 'reflected':
      FX?.titre?.('RENVOI', null, 'var(--vert)', 30);
      FX?.son?.('carte');
      break;

    case 'rally':
      FX?.titre?.(pour ? 'CHANTE MAINTENANT' : 'APPEL ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.son?.(pour ? 'parfait' : 'tic');
      break;

    case 'sync':
      FX?.titre?.(pour ? 'TOUS ENSEMBLE' : 'CHŒUR ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.son?.(pour ? 'parfait' : 'tic');
      break;

    /**
     * Le but du vrai match : le moment que tout le jeu attend. Trois cas —
     * pour toi, contre toi, ou pour les deux, ce qui arrive quand les deux
     * tribunes suivent le même club. **La case de BD le dit** (`poserMoment`),
     * avec le buteur et la minute ; `FX.but` n'y ajoute que la secousse et la
     * vibration. La corne du vrai match, puis **l'ovation de sa tribune**
     * (`son.js`, « but ») quand le but est le sien, ou celui des deux camps ;
     * un but encaissé ne la fait pas lever.
     */
    case 'but_reel': {
      const mon = S.vue?.moi?.side ?? 0;
      /* **Le serveur dit la tribune du club buteur** (`side`), et compte dans
         `souffles` les joueurs qui ont repris leur souffle — un nombre. La
         page le lisait comme une paire, `[a, b]` (la forme que `nvn:ui` lui
         racontait), et la déstructuration levait : pas de case, pas de corne,
         et le reste de l'envoi perdu avec — dont la corde qui cède, quand le
         but la fait céder. Une paire reste lue si elle vient. */
      const [a, b] = Array.isArray(e.souffles) ? e.souffles
        : [Number(e.side === 0), Number(e.side === 1)];
      const nous = mon === 0 ? a : b;
      const eux = mon === 0 ? b : a;
      if (!nous && !eux) break;
      // Les deux Fanzzy le vivent, chacun de son côté (voir `vivreFz`).
      vivreFz('moi', nous ? 'but' : 'encaisse', TENIR_FZ.butReel, nous ? 'saut' : 'affaisse');
      vivreFz('eux', eux ? 'but' : 'encaisse', TENIR_FZ.butReel, eux ? 'saut' : 'affaisse');
      FX?.but?.({ pour: Boolean(nous), vignette: true });
      FX?.son?.(nous ? 'butReel' : 'encaisse');
      if (nous) window.TBF_SON?.rumeur?.('but');
      const qui = [e.joueur, e.minute != null ? `${e.minute}′` : ''].filter(Boolean).join(' · ');
      poserMoment(nous && eux ? 'LES DEUX TRIBUNES' : nous ? 'GOAL !' : 'ON ENCAISSE',
        nous ? 'or' : 'flare', { sous: qui, ms: MOMENT_REEL_MS });
      break;
    }

    /* La corde cède : la case de BD, à l'or pour sa tribune, flare pour
       celle d'en face — les mots du Virage. Le compte des buts de corde est
       déjà dans le HUD : la case ne l'écrit pas une seconde fois. */
    case 'goal':
      vivreFz(pour ? 'moi' : 'eux', 'but', TENIR_FZ.but, 'saut');
      vivreFz(pour ? 'eux' : 'moi', 'encaisse', TENIR_FZ.but, 'affaisse');
      FX?.but?.({ pour, vignette: true });
      FX?.son?.(pour ? 'but' : 'encaisse');
      // L'ovation, pour la corde que sa tribune fait céder : voir « but_reel ».
      if (pour) window.TBF_SON?.rumeur?.('but');
      poserMoment(pour ? 'LA CORDE CÈDE !' : 'ILS ONT FAIT CÉDER LA CORDE', pour ? 'or' : 'flare');
      break;

    case 'swap':
      FX?.son?.('tic');
      break;

    /* La légende de son deck s'éveille : le Fanzzy légendaire peut entrer,
       ou la pièce légendaire se met à compter. */
    case 'legende':
      if (!e.eveillee || e.userId !== monId()) break;
      FX?.son?.('but');
      poserMoment('LA LÉGENDE S’ÉVEILLE', 'or',
        { sous: e.fanzzy ? 'Ton légendaire peut entrer' : 'Ta pièce légendaire compte' });
      break;

    case 'disconnected':
    case 'back':
      // Le supporter change d'état tout seul au prochain rendu (assis, debout).
      FX?.son?.('tic');
      break;

    default:
      break;
  }
}

/**
 * La fin d'un duel.
 *
 * Le bilan complet arrive du serveur sur `nvn:fin`, et c'est lui qui fait
 * l'écran. Ce repli reste pour les cas où le bilan n'arrive pas — une
 * connexion coupée au dernier instant, un serveur d'une version antérieure.
 * Il vaut mieux un résultat sec qu'un écran de jeu figé dont on ne sort pas.
 */
function finir(v) {
  // Le coup de sifflet vide la tribune en fondu, bilan ou pas.
  window.TBF_SON?.rumeur?.('fin');
  if (S.bilanVu) return;
  S.bilanVu = true;
  /* Le repli est un écran de fin comme l'autre : il propose « Revenir », donc
     il doit rendre la porte au joueur. Un repli qui enferme est pire que pas
     de repli — voir montrerBilan. Et il revient **sans recharger** : la
     préparation est encore là, sous la partie. */
  window.TBF_BARRE?.enPartie?.(false);
  const gagne = v.vainqueur === v.moi?.side;
  const nul = v.vainqueur === null || v.vainqueur === undefined;
  voile(nul ? 'Match nul' : gagne ? 'Victoire' : 'Défaite',
    `${v.goals?.[v.moi?.side] ?? 0} – ${v.goals?.[(v.moi?.side ?? 0) ^ 1] ?? 0}<br>`
    + (v.mode === 'classe' ? 'Ce duel compte au classement.'
                           : 'Entraînement : sans effet sur le classement.'),
    { texte:'Revenir', action: revenir });
}

/* ================================================ l'affiche et le bilan

   Les deux écrans qui encadrent le duel. Ils sont écrits ensemble parce qu'ils
   montrent les mêmes choses — les personnages, les camps, les couleurs — à deux
   moments : avant, quand tout est possible ; après, quand tout est joué.      */

/** L'adresse du dessin d'un Fanzzy, ou rien s'il n'en a pas. */
/**
 * **Sa tenue à soi, et celle de personne d'autre.**
 *
 * On ne connaît la tenue portée que du Fanzzy équipé du joueur : le serveur
 * ne dit pas celle des autres, et il n'y a aucune raison qu'il le fasse — le
 * duel se joue à armes égales, une tenue ne pousse pas plus fort. Le camp
 * d'en face garde donc son dessin de base, ce qui est aussi ce qu'il voit de
 * nous.
 *
 * `maTenue` est nul tant que le portefeuille n'a pas répondu : `adresse`
 * retombe alors sur `base`, c'est-à-dire sur l'image d'avant. Une vignette
 * qui arrive une seconde trop tôt vaut mieux qu'une vignette qui attend.
 */
/* **L'avatar en jeu**, tel que le serveur le résout : premier âge, repos,
   tenue du premier âge. C'est la règle des effets — « un deck entre
   toujours au premier âge » — et le Virage la suit déjà. */
let monAvatar = null;
window.TBF_ETATS?.charger?.().catch?.(() => {});
fetch('/api/fanzzy/state', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => { monAvatar = j?.wallet?.avatarEnJeu ?? null; })
  .catch(() => {});

const dessinFz = (id, variante, tenue) =>
  window.FZART?.adresse?.(id, variante, tenue ? { skin: tenue } : undefined) ?? null;

/** La vignette d'un Fanzzy sur l'affiche, avec son repli. `rang` règle la
    cascade : les trois d'un camp entrent l'un après l'autre. */
function vignetteFz(f, entre, couleur, rang = 0) {
  /* La racine, parce que `monFanzzy` est la lignée et `f.id` l'âge : « TR32 »
     d'un côté, « TR32B » de l'autre pour le même personnage. */
  const racine = (s) => /^([A-Z]+\d+)/.exec(String(s ?? ''))?.[1] ?? s;
  const mien = monAvatar && racine(f.id) === monAvatar.id;
  /* Le sien passe par la fonction unique ; ceux d'en face aussi, dans la
     tenue que l'affiche dit (`skin`) — un serveur d'avant ne la donnait pas,
     et ils gardent alors leur dessin de base. L'âge suit la partie : la carte
     Relève fait grandir en cours de match, et la vignette doit le montrer. */
  const src = mien
    ? window.FZART?.dessinAvatar?.({ ...monAvatar, age: f.id, evo: f.stade ?? 1,
      ...(f.skin ? { skin: f.skin } : {}) }, 'plein')
    : f.skin && f.skin !== 'base'
      ? window.FZART?.dessinAvatar?.({ id: racine(f.id), age: f.id, evo: f.stade ?? 1, skin: f.skin }, 'plein')
      : dessinFz(f.id, 'plein');
  return `<div class="fz-aff tbf-glisse ${entre ? 'entre' : ''}" style="--ac:${couleur};--d:${rang * 160}ms">
    ${src ? `<img alt="" loading="lazy" src="${src}">` : ''}
    ${entre ? `<span class="tag tbf-sticker" ${couleur === 'var(--bleu)' ? 'data-ton="bleu"' : 'data-ton="or"'}>ENTRE</span>` : ''}
    <div class="voile-bas"><b>${esc(f.nom ?? f.id)}</b>
      <small>ÂGE ${f.stade ?? 1}${f.geste ? ` · ${esc(LABEL_GESTE[f.geste] ?? f.geste)}` : ''}</small>
    </div></div>`;
}

/** **La forme : cinq stickers ronds** (lot 6), la plus récente à gauche — V
    vert, D flare, N craie. Un joueur sans passé le dit. */
function formeHTML(liste) {
  if (!liste?.length) return '<span class="forme"><small>PREMIER DUEL</small></span>';
  const lettre = { win: 'V', loss: 'D', draw: 'N' };
  const ton = { win: ' data-ton="vert"', loss: ' data-ton="flare"', draw: '' };
  const v = liste.filter((x) => x.issue === 'win').length;
  const d = liste.filter((x) => x.issue === 'loss').length;
  const n = liste.length - v - d;
  const compte = [v && `${v} V`, d && `${d} D`, n && `${n} N`].filter(Boolean).join(' · ');
  return `<span class="forme">${
    liste.map((x) => `<i class="${esc(x.issue)} tbf-sticker tbf-sticker--rond"${ton[x.issue] ?? ''}
      title="${esc(x.pour)}–${esc(x.contre)}">${lettre[x.issue] ?? '?'}</i>`).join('')}<small>${compte}</small></span>`;
}

/**
 * L'affiche, avant le coup d'envoi.
 *
 * Un duel commençait sans qu'on sache contre qui on jouait ni avec quoi : la
 * corde apparaissait, et il fallait chanter. Tout ce qui est montré ici était
 * déjà connu du serveur à cet instant — il ne le disait à personne.
 *
 * **« VS » en banderole entre deux écharpes croisées, la forme en stickers,
 * les trois Fanzzy qui entrent en cascade** (lot 6). À plusieurs par camp,
 * une ligne par supporter : trois grandes vignettes par joueur faisaient d'un
 * 3 contre 3 une affiche de deux mille pixels, à lire en six secondes. La
 * cote de chacun n'est pas servie : elle n'est pas écrite.
 *
 * Elle se retire d'elle-même : c'est une affiche, pas une salle d'attente, et
 * un joueur qui doit toucher un bouton pour entrer dans un duel déjà commencé
 * perd les secondes qu'il regarde. À son départ, la tribune s'emplit
 * (`entrerEnTribune`).
 */
function montrerAffiche(a) {
  const mien = S.vue?.moi?.side ?? 0;
  $('afficheLieu').innerHTML = a.stade
    ? `<b>${esc(a.stade.nom)}</b>${a.stade.effet ? ` · ${esc(a.stade.effet)}` : ''}`
    : '';
  /* Le stade du duel en fond, en dessin réduit : celui du match, que la
     préparation annonçait sur son affiche, et c'est là que la partie se
     jouera. Sans lui, le fond nu. */
  const affiche = $('affiche');
  const fond = a.stade?.id && window.TBF_STADE?.adresse
    ? window.TBF_STADE.adresse(String(a.stade.id).replace(/[^a-z0-9-]/gi, ''), true) : null;
  if (fond) { affiche.dataset.fond = ''; affiche.style.setProperty('--fond', `url("${fond}")`); }
  else { delete affiche.dataset.fond; affiche.style.removeProperty('--fond'); }
  // Les écharpes croisées du VS, aux couleurs des deux clubs.
  poserCouleursDuDuel(S.vue);

  const parCote = [0, 1].map((c) => (a.joueurs ?? []).filter((j) => j.side === c));
  /* Le sien d'abord, toujours. « En haut » veut dire « moi » sur les deux
     écrans du jeu, et changer cet ordre selon le camp tiré ferait chercher. */
  const ordre = mien === 0 ? [0, 1] : [1, 0];
  const serre = Math.max(parCote[0].length, parCote[1].length) > 1;

  $('afficheCamps').innerHTML = ordre.map((cote, rang) => {
    const moi = cote === mien;
    const couleur = moi ? 'var(--projo)' : 'var(--bleu)';
    const tag = `<span class="camp-tag tbf-sticker" data-ton="${moi ? 'or' : 'bleu'}">${
      moi ? (serre ? 'TA TRIBUNE' : 'TOI') : 'EN FACE'}</span>`;
    const decal = rang * 3;
    const bloc = serre
      ? `<div class="qui">${tag}</div>` + parCote[cote].map((j) => `<div class="joueur">
          <div class="qui"><b>${esc(j.nom)}${j.bot ? ' · BOT' : ''}</b>${j.bot ? '' : formeHTML(j.forme)}</div>
          <div class="trois">${(j.fanzzy ?? []).slice(0, 3)
            .map((f, i) => vignetteFz(f, i === 0, couleur, decal + i)).join('')}</div></div>`).join('')
      : parCote[cote].map((j) => `<div class="qui">${tag}
          <b>${esc(j.nom)}${j.bot ? ' · BOT' : ''}</b>
          ${j.bot ? '' : formeHTML(j.forme)}
        </div>
        <div class="trois">${(j.fanzzy ?? []).slice(0, 3)
          .map((f, i) => vignetteFz(f, i === 0, couleur, decal + i)).join('')}</div>`).join('');
    return `<div class="camp-bloc ${moi ? 'moi' : 'eux'}${serre ? ' serre' : ''}">${bloc}</div>`
      + (rang === 0 ? `<div class="versus" aria-label="contre"><span class="tbf-echarpe"></span>
        <span class="tbf-echarpe"></span><b class="tbf-banderole">VS</b></div>` : '');
  }).join('');

  $('affiche').hidden = false;
  window.FX?.son?.('gong');
  /* Six secondes : le temps de lire deux noms et de reconnaître trois têtes.
     Au-delà, on attend ; en deçà, on n'a rien vu. */
  clearTimeout(S.entreeT);
  clearTimeout(S.afficheT);
  S.afficheT = setTimeout(() => { $('affiche').hidden = true; entrerEnTribune(true); }, 6000);
}

/* ------------------------------------------------------------- le bilan */

/** Un nombre écrit comme on le lit : « 1 240 », l'espace insécable posée
    ici — le format du téléphone ne la met pas partout. */
const nombre = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');

/**
 * Le bilan, après le coup de sifflet : **la page kraft** (lot 6).
 *
 * Cinq minutes de jeu se terminaient sur un voile gris avec un mot dessus —
 * moins qu'un message d'erreur. Tout ce qui est montré ici était compté
 * pendant la partie, et l'est par le serveur : la page ne fait que le nommer.
 *
 *   — **la case de BD** VICTOIRE, DÉFAITE ou NUL (vert, flare, gris) et sa
 *     bouffée ; le Fanzzy en pose victoire ou défaite ;
 *   — **les lignes qui comptent l'une après l'autre** (sept cents
 *     millisecondes d'écart, `FX.compter`) : les écharpes qui tombent dans le
 *     compteur puis volent vers le menu, la cote « 1 240 → 1 262 »
 *     (`gains.cote`, § 4.1), le meilleur geste en tampon (« PARFAIT sur LA
 *     MONTÉE », § 17), les PARFAITS et la meilleure série, la carte
 *     préférée en carte ;
 *   — **l'XP** dans l'écharpe nouée, qui se remplit depuis
 *     `gains.niveau.depart` et **fusionne la fête de niveau** : au bout du
 *     tour, la fête se pose, puis l'écharpe repart de zéro ;
 *   — **toi contre lui** en doubles barres miroir — « LUI » au 1 contre 1,
 *     la tribune entière au-delà.
 * **Toute ligne sans donnée disparaît** : pas de cote sans `gains.cote`, pas
 * de meilleur geste sans `meilleur`, jamais un tiret. Un serveur d'avant le
 * lot 6 garde ce qu'il disait : les gains, les chiffres du match.
 *
 * `.gain small` et `.stat .quoi` restent : la suite du duel lit les écharpes
 * et les trois chiffres du match sous ces noms.
 */
function montrerBilan(b) {
  S.bilanVu = true;
  clearTimeout(S.entreeT);
  clearTimeout(S.afficheT);
  // Le bilan se lit dans une tribune qui se vide, en fondu.
  window.TBF_SON?.rumeur?.('fin');
  fermerVoile();
  /* Les messages du jeu s'effacent. Une infobulle de refus posée sur l'écran
     de résultat parle d'un coup qu'on ne peut plus jouer. */
  $('toast')?.classList.remove('on');
  $('apportsP').hidden = true;
  couperMoment();

  const joueurs = b.joueurs ?? [];
  /* **Qui est « toi ».** Le serveur le marque : sa propre ligne porte
     `moi: true` dans son envoi (§ 17), et son camp est le mien. D'un
     serveur d'avant, l'identifiant connu (`monId`), sinon dans sa tribune
     celui qui a sa ferveur, sinon le premier — un 1 contre 1 n'a qu'un
     joueur de chaque côté. */
  const marque = joueurs.find((j) => j.moi === true) ?? null;
  const mien = marque?.side ?? S.vue?.moi?.side ?? 0;
  const miens = joueurs.filter((j) => j.side === mien);
  const leurs = joueurs.filter((j) => j.side !== mien);
  const id = monId();
  const moi = marque
    ?? miens.find((j) => id != null && j.userId === id)
    ?? miens.find((j) => S.vue?.moi && j.ferveur === S.vue.moi.ferveur)
    ?? miens[0] ?? joueurs[0];
  const unContreUn = miens.length <= 1 && leurs.length <= 1;
  const lui = leurs[0];
  const nul = b.vainqueur === null || b.vainqueur === undefined;
  const gagne = !nul && b.vainqueur === mien;

  /* --- la case de BD, sa bouffée, et le Fanzzy en pose --- */
  const ton = nul ? 'gris' : gagne ? 'vert' : 'flare';
  $('bilanCase').dataset.ton = ton;
  $('bilanTitre').textContent = nul ? 'MATCH NUL' : gagne ? 'VICTOIRE' : 'DÉFAITE';
  $('bilanScore').textContent = `${b.goals?.[mien] ?? 0} – ${b.goals?.[mien ^ 1] ?? 0}`
    + (miens.length && leurs.length ? ` · ${miens.length} CONTRE ${leurs.length}` : '');
  const boite = $('bilanCaseBoite');
  boite.querySelector('.tbf-bouffee')?.remove();
  boite.insertAdjacentHTML('afterbegin', `<span class="tbf-bouffee" aria-hidden="true"
    style="--c1:var(--${ton === 'gris' ? 'gris' : ton === 'vert' ? 'vert' : 'flare'})"></span>`);
  const fz = $('bilanFz');
  const src = poseDuBilan(moi?.dernier, nul ? 'neutre' : gagne ? 'victoire' : 'defaite');
  fz.hidden = !src;
  if (src) fz.src = src; else fz.removeAttribute('src');

  /* --- la tête de la feuille : le lieu, la sorte de duel, le tampon --- */
  ecrire($('bilanLieu'), [b.stade?.nom, b.mode === 'classe' ? 'CLASSÉ' : b.mode ? 'ENTRAÎNEMENT' : '']
    .filter(Boolean).join(' · '));
  const tampon = $('bilanTampon');
  tampon.dataset.ton = ton;
  tampon.textContent = nul ? 'NUL' : gagne ? 'GAGNÉ' : 'PERDU';

  /* --- les lignes, une par chiffre --- */
  const g = b.gains;
  const lignes = [];
  if (g && Number(g.echarpes) > 0) {
    lignes.push(`<li class="tbf-bilan-l gain"><span>TU REPARS AVEC${g.pourSonClub
      ? ' <span class="tbf-tampon" data-ton="vert">×2 TON CLUB</span>' : ''}</span>
      <b data-compte="${Number(g.echarpes)}" data-signe="+" data-vole>+${Number(g.echarpes)}</b><small>ÉCHARPES</small></li>`);
  }
  if (Number(g?.kop?.verse) > 0) {
    lignes.push(`<li class="tbf-bilan-l gain kop"><span>VERSÉES AU KOP</span>
      <b data-compte="${Number(g.kop.verse)}" data-signe="+">+${Number(g.kop.verse)}</b><small>ÉCHARPES</small></li>`);
  }
  if (g?.cote && Number.isFinite(Number(g.cote.avant)) && Number.isFinite(Number(g.cote.apres))) {
    lignes.push(`<li class="tbf-bilan-l"><span>COTE</span>
      <b>${nombre(g.cote.avant)} → <span data-compte="${Number(g.cote.apres)}" data-de="${Number(g.cote.avant)}">${
        nombre(g.cote.apres)}</span></b></li>`);
  }
  const motMeilleur = moi?.meilleur ? window.TBF_GESTE?.mot?.(moi.meilleur.verdict) : null;
  if (motMeilleur) {
    const nomChant = moi.meilleur.nom
      ?? (S.vue?.chants ?? []).find((c) => c.id === moi.meilleur.chant)?.nom ?? null;
    lignes.push(`<li class="tbf-bilan-l"><span>MEILLEUR GESTE</span>
      <span class="tbf-tampon tbf-clac" data-verdict="${esc(moi.meilleur.verdict)}">${motMeilleur}</span>${
        nomChant ? `<small>sur ${esc(String(nomChant).toUpperCase())}</small>` : ''}</li>`);
  }
  if (Number(moi?.parfaits) > 0) {
    lignes.push(`<li class="tbf-bilan-l"><span>PARFAITS</span><b data-compte="${Number(moi.parfaits)}">${Number(moi.parfaits)}</b></li>`);
  }
  if (Number(moi?.serie) >= 2) {
    lignes.push(`<li class="tbf-bilan-l"><span>MEILLEURE SÉRIE</span><b data-compte="${Number(moi.serie)}">${Number(moi.serie)}</b></li>`);
  }
  if (moi?.preferee?.id) {
    const carte = carteDef(moi.preferee.id);
    const rar = carte?.rar ?? 'commune';
    lignes.push(`<li class="tbf-bilan-l"><span>TA CARTE DU MATCH</span>
      <div class="pref tbf-carte tbf-carte--action" data-rar="${esc(rar)}">
        ${window.TBF_ACTION?.illustration?.(moi.preferee.id) ?? ''}
        <b class="tbf-carte-nom">${esc(carte?.nom ?? moi.preferee.id)}</b></div>
      ${Number(moi.preferee.fois) > 0 ? `<small>jouée ${Number(moi.preferee.fois)} fois</small>` : ''}</li>`);
  }

  /* --- l'XP, l'écharpe nouée --- */
  const niv = g?.niveau && Number.isFinite(Number(g.niveau.part)) ? g.niveau : null;
  const xp = Number(g?.xp) > 0
    ? `<div class="tbf-bilan-xp"><b>+${Number(g.xp)} XP</b>${niv
      ? `<div class="tbf-jauge"><i class="sans" style="width:${Math.round((Number(niv.depart?.part) || 0) * 100)}%"></i></div>
         <span class="tbf-sticker" id="bilanNiv">NIV. ${Number(niv.depart?.niveau ?? niv.avant ?? niv.niveau)}</span>` : ''}</div>`
    : '';

  /* --- toi contre lui, en barres miroir --- */
  const somme = (liste, cle) => liste.reduce((n, j) => n + (Number(j?.[cle]) || 0), 0);
  const val = (cote, cle) => (unContreUn
    ? Number((cote === 'a' ? moi : lui)?.[cle]) || 0
    : somme(cote === 'a' ? miens : leurs, cle));
  const RANGEES = [['chants', 'CHANTS'], ['cartes', 'CARTES JOUÉES'], ['changements', 'CHANGEMENTS'],
    ['releves', 'RELÈVES'], ['parfaits', 'PARFAITS'], ['ferveur', 'FERVEUR']];
  const facultatives = new Set(['releves', 'parfaits']);
  const vs = (lui || leurs.length) ? `<div class="tbf-vs" aria-label="${unContreUn ? 'Toi contre lui' : 'Ta tribune contre la leur'}">
    <div class="tbf-vs-tete"><b>${unContreUn ? 'TOI' : 'TA TRIBUNE'}</b><b>${unContreUn ? 'LUI' : 'EUX'}</b></div>
    ${RANGEES.filter(([cle]) => !facultatives.has(cle) || val('a', cle) + val('b', cle) > 0)
      .filter(([cle]) => cle !== 'parfaits' || joueurs.some((j) => j.parfaits !== undefined))
      .map(([cle, mot]) => {
        const a = val('a', cle), c = val('b', cle);
        const haut = Math.max(a, c, 1);
        return `<div class="tbf-vs-l stat" style="--a:0;--b:0" data-a="${(a / haut).toFixed(3)}" data-b="${(c / haut).toFixed(3)}">
          <b>${nombre(a)}</b><span class="tbf-vs-nom quoi">${mot}</span>
          <span class="tbf-vs-barres" aria-hidden="true"><i></i><i></i></span><b>${nombre(c)}</b></div>`;
      }).join('')}
  </div>` : '';

  const notes = g?.kop?.sansKop && Number(g.kop.perdu) > 0
    ? `<p class="tbf-bilan-note">${Number(g.kop.perdu)} écharpes perdues — pas de KOP pour les recevoir</p>` : '';

  /* Tout glisse l'un après l'autre, à sept cents millisecondes d'écart. */
  const blocs = [
    lignes.length ? `<ul class="tbf-bilan-lignes">${lignes.join('')}</ul>` : '',
    xp, vs, notes].filter(Boolean);
  $('bilanCorps').innerHTML = blocs.join('');
  const pas = 700;
  const etapes = [...$('bilanCorps').querySelectorAll('.tbf-bilan-l, .tbf-bilan-xp, .tbf-vs, .tbf-bilan-note')];
  etapes.forEach((el, i) => { el.classList.add('tbf-glisse'); el.style.setProperty('--d', `${i * pas}ms`); });
  const quand = (el) => (etapes.indexOf(el.closest('.tbf-bilan-l, .tbf-bilan-xp, .tbf-vs, .tbf-bilan-note')) * pas);

  /* **Et on le baisse** — le drapeau « en partie ».

     Le défaut que ceci répare tenait en une phrase de joueur : « une fois le
     duel terminé, il ne se passe plus rien ». Le bilan s'affichait, et le
     navigateur — voyant le corps de la page se dire encore en partie —
     demandait confirmation avant de quitter. C'est l'ordre qui compte : on
     range le drapeau **avant** de poser les boutons, pour qu'aucun clic ne
     puisse arriver entre les deux. Ni l'un ni l'autre ne recharge plus la
     page : REVENIR rend la préparation, REJOUER rentre en file sur le même
     match, dans le même format. */
  window.TBF_BARRE?.enPartie?.(false);
  $('bilanSortir').onclick = revenir;
  $('bilanRejouer').onclick = rejouer;
  $('affiche').hidden = true;
  $('bilan').hidden = false;
  $('bilan').scrollTop = 0;
  window.FX?.son?.(gagne ? 'but' : nul ? 'tic' : 'encaisse');
  /* **La barre l'apprend** (R6) : le duel vient de verser des écharpes ou de
     l'XP, et c'est à la page de le dire — sans quoi le HUD garde l'ancien
     solde, et l'écran suivant avec lui. Le portefeuille et la jauge tels que
     le serveur les rend, quand il les rend ; `nvn:fin` ne sert pas encore
     `gains.wallet` (§ 4.1) : l'annonce dit alors seulement « ça a changé »,
     et le HUD relit l'état d'un coup. */
  if (Number(g?.echarpes) > 0 || Number(g?.xp) > 0) {
    const w = g.wallet && typeof g.wallet === 'object' ? g.wallet : null;
    window.dispatchEvent(new CustomEvent('tbf:bourse',
      { detail: { ...(w ? { wallet: w } : {}), ...(niv ? { niveau: niv } : {}) } }));
  }

  /* Les chiffres comptent quand leur ligne arrive ; les écharpes, comptées,
     volent vers le menu, où le joueur les retrouvera. */
  for (const el of $('bilanCorps').querySelectorAll('[data-compte]')) {
    const fin = Number(el.dataset.compte);
    const de = Number(el.dataset.de ?? 0);
    const signe = el.dataset.signe ?? '';
    const format = (n) => `${signe}${nombre(Math.round(n))}`;
    el.textContent = format(de);
    setTimeout(() => {
      window.FX?.compter?.(el, de, fin, { ms: 600, format })?.then?.(() => {
        if (!('vole' in el.dataset)) return;
        window.FX?.son?.('ok');
        const r = el.getBoundingClientRect();
        window.FX?.particules?.({ x: r.left + r.width / 2, y: r.top + r.height / 2, n: 14,
          couleurs: ['var(--projo)', '#FFE08A'], distance: 70, taille: 5, duree: 700 });
        const menu = document.querySelector('.tbf-burger');
        if (menu) window.FX?.voler?.(el, menu, { image: '/img/gains/echarpes.webp' });
      });
      if (!window.FX?.compter) el.textContent = format(fin);
    }, quand(el) + 120);
  }
  // Les barres miroir poussent quand leur bloc est posé.
  for (const l of $('bilanCorps').querySelectorAll('.tbf-vs-l')) {
    setTimeout(() => { l.style.setProperty('--a', l.dataset.a); l.style.setProperty('--b', l.dataset.b); },
      quand(l) + 80);
  }
  remplirXp(niv, quand, g);
}

/**
 * **L'XP qui se remplit, et la fête fusionnée** (lot 6).
 *
 * L'écharpe part de `gains.niveau.depart.part` (§ 1) et va à `part`. **S'il
 * y a montée**, elle fait le tour jusqu'au bout, et c'est là — au bout du
 * tour, pas 1,4 s après le bilan — que la fête de niveau se pose
 * (`TBF_NIVEAU.feter`) ; quand le joueur la rend, l'écharpe repart de zéro
 * vers sa nouvelle part et le sticker passe au nouveau niveau. Un serveur
 * d'avant le § 1 (`montee` seule) garde la fête d'avant, posée par-dessus.
 */
function remplirXp(niv, quand, g) {
  const jauge = $('bilanCorps').querySelector('.tbf-bilan-xp .tbf-jauge i');
  const sticker = $('bilanNiv');
  if (!niv || !jauge) {
    if (g?.montee) setTimeout(() => { window.TBF_NIVEAU?.feter?.(g.montee, { avatar: monAvatar }); }, 1400);
    return;
  }
  const vers = (part, glisse) => new Promise((tenir) => {
    jauge.classList.toggle('sans', !glisse);
    void jauge.offsetWidth;
    jauge.style.width = `${Math.round(Math.max(0, Math.min(1, part)) * 100)}%`;
    // La transition peut ne pas avoir lieu (mouvement réduit, onglet caché) :
    // le filet tient la promesse quand même.
    setTimeout(tenir, glisse ? 950 : 0);
  });
  setTimeout(async () => {
    if (niv.monte) {
      await vers(1, true);
      await window.TBF_NIVEAU?.feter?.(niv, { avatar: monAvatar });
      await vers(0, false);
      ecrire(sticker, `NIV. ${Number(niv.niveau)}`);
      await vers(Number(niv.part) || 0, true);
    } else {
      await vers(Number(niv.part) || 0, true);
      ecrire(sticker, `NIV. ${Number(niv.niveau)}`);
    }
  }, quand(jauge) + 200);
}

/**
 * Le Fanzzy du bilan, en pose de victoire ou de défaite : celui qui était en
 * tribune au coup de sifflet (`dernier`), à son âge, dans la tenue du joueur
 * si c'est son avatar. Sans dessin de cette pose, le repli de `FZART` (le
 * personnage au repos) ; sans personnage, rien.
 */
function poseDuBilan(id, etat) {
  const racine = /^([A-Z]+\d+)/.exec(String(id ?? ''))?.[1];
  if (!racine || !window.FZART?.dessinAvatar) return null;
  const actif = (S.vue?.moi?.fanzzy ?? []).find((f) => f.id === id);
  const lettre = /^[A-Z]+\d+([A-Z])$/.exec(String(id))?.[1];
  const evo = Number(actif?.stade) || (lettre ? lettre.charCodeAt(0) - 64 : 1);
  const skin = tenueEnJeu(actif, evo, racine);
  try {
    return window.FZART.dessinAvatar({ id: racine, age: id, evo, skin }, 'plein', { etat }) ?? null;
  } catch { return null; }
}

/**
 * **Quitter la partie finie, sans recharger** (lot 6) : on retire la corde,
 * on remet à zéro tout ce qu'un duel a posé — la vue, le stade, les rangées
 * rendues à clé, les effets, la foule —, et la préparation, restée dessous,
 * revient. Le duel suivant repart d'une page propre.
 */
function quitterLaPartie() {
  clearTimeout(S.entreeT);
  clearTimeout(S.afficheT);
  S.vue = null;
  S.bilanVu = false;
  S.dernierSeq = 0;
  S.occupe = false;
  S.entree = true;
  S.chezEux.clear();
  S.dernierActeur = null;
  durees.clear();
  stade = null;
  $('stade').replaceChildren();
  poserCouleursDuDuel(null);
  ecrire($('lieu'), '');
  apportsVus = null;
  repereMinute = null;
  souffleAvant = null;
  $('apportsP').hidden = true;
  for (const id of ['effets', 'equipe', 'mainCartes', 'chants', 'effetsArene', 'cransMoi', 'cransEux']) {
    $(id).replaceChildren();
  }
  for (const id of ['fouleMoi', 'fouleEux']) { $(id).replaceChildren(); delete $(id).dataset.cle; }
  $('arene').style.setProperty('--corde', '0');
  $('parcage').hidden = true;
  $('bilan').hidden = true;
  $('affiche').hidden = true;
  couperMoment();
  $('jeu').classList.remove('on');
  $('prepa').style.display = '';
  placerAnnonce();
  fermerVoile();
  $('toast').classList.remove('on');
  window.TBF_BARRE?.enPartie?.(false);
}

/** REVENIR : la liste des matchs, à jour de ce qui attend. Rien ne joue en
    préparation : la tribune se tait. */
function revenir() {
  quitterLaPartie();
  window.TBF_SON?.ambiance?.(0);
  preparerRendu();
  lireAttentes().then(() => { if (!S.vue) preparerRendu(); });
}

/** REJOUER : le même match, le même format, la même tribune — droit au
    vestiaire. */
function rejouer() {
  quitterLaPartie();
  preparerRendu();
  entrerEnFile();
}

/* ----------------------------------------------------- les gestes */

/**
 * Le mini-jeu. Toutes les durées viennent de `moi.gestes`, calculé par le
 * serveur avec les modificateurs du Fanzzy, de son équipement et des effets
 * en cours. Rien n'est écrit en dur ici, sinon l'affichage mentirait au
 * joueur dès qu'il s'équipe.
 */
function ouvrirGeste(kind, cfg) {
  return new Promise((resolve) => {
    const m = $('mini');
    m.style.setProperty('--c', COULEUR_GESTE[kind] ?? '#F5C33B');
    $('miniTitre').textContent = LABEL_GESTE[kind] ?? kind;
    $('miniAide').textContent = AIDE_GESTE[kind] ?? '';
    $('miniZone').innerHTML = '';
    // L’épreuve prend l’écran : rien ne doit passer devant. Voir `fermerGeste`.
    window.TBF_ACTION?.suspendre?.();
    m.classList.add('on');

    let k = 3;
    const tic = () => {
      if (k === 0) return lancer(kind, cfg, resolve);
      const c = document.createElement('div');
      c.className = 'compte';
      c.textContent = k--;
      m.appendChild(c);
      setTimeout(() => c.remove(), 550);
      setTimeout(tic, 560);
    };
    tic();
  });
}

/* **Le chant de la tribune, calé sur le geste** (`son.js`, lot 6) : ouvert
   au même instant que le geste, sur les durées que le serveur a servies
   (`moi.gestes`), et arrêté à la fermeture de la fenêtre, quoi qu'il arrive
   — geste fini, abandonné, page quittée. Il ne fait qu'accompagner : le
   pavé dessine la même pulsation, et sous le calme le pavé reste le même. */
let chantEnCours = null;

function fermerGeste(taps) {
  chantEnCours?.arreter?.();
  chantEnCours = null;
  $('mini').classList.remove('on');
  $('miniZone').innerHTML = '';
  /* Les cartes que l’adversaire a jouées pendant l’épreuve reviennent
     maintenant. Voir `suspendre` dans action-art.js : elles passaient
     par-dessus la grille, et on ne voyait plus ce qu’on était en train de
     faire — avec un chronomètre qui courait. */
  window.TBF_ACTION?.reprendre?.();
  return taps;
}
addEventListener('pagehide', () => { chantEnCours?.arreter?.(); chantEnCours = null; });

/**
 * Le déroulé d'un geste vit dans `/geste.js`, partagé avec le Grand Virage.
 *
 * Il était écrit ici **et** là-bas : trois gestes, deux implémentations, deux
 * décomptes, deux façons de fermer la fenêtre. Passer à dix gestes aurait
 * voulu dire en écrire vingt, et corriger chaque défaut deux fois.
 *
 * Ce qui reste à cette page, c'est son balisage : elle dit où poser le titre
 * et la zone de jeu, le fichier partagé dit ce qui s'y passe. **La fenêtre
 * ne se ferme plus ici** (lot 6) : le geste rendu, elle attend le verdict du
 * serveur (`TBF_GESTE.attendre`, voir le gestionnaire des chants), et c'est
 * lui qui la ferme.
 */
/*
 * ## Et il rend la main, quoi qu'il arrive
 *
 * `jouer` ne rejette jamais de lui-même — son `switch` a une branche par
 * défaut — mais son exécuteur peut **lever**, et il n'y avait aucun
 * rattrapage : la promesse partait en erreur, `ouvrirGeste` ne se dénouait
 * jamais, et le `await` du gestionnaire de chants attendait pour toujours.
 *
 * Ce qu'un joueur voyait : **le panneau de l'épreuve figé sur l'écran**, la
 * corde cachée dessous, `S.occupe` resté vrai — donc plus un seul chant pour
 * le reste du duel. Et un duel a un adversaire et un chronomètre : rester
 * bloqué, c'est perdre. Même défaut au Grand Virage, corrigé de la même façon.
 */
function lancer(kind, cfg, resolve) {
  const rate = (e) => {
    console.error('[duel] le geste a levé :', e);
    resolve(fermerGeste(null));
  };
  try {
    /* Le chant part **dans la même tâche** que le geste, avec le même
       instant d'origine — prêté au geste (`origine`) : la pulsation que le
       pavé dessine, le chant qu'on entend et les frappes qu'on compte
       partent du même instant, et non de deux lectures de l'horloge. Rien
       pour les gestes qui ne se chantent pas. */
    chantEnCours?.arreter?.();
    const origine = performance.now();
    chantEnCours = window.TBF_SON?.chantDuGeste?.(kind, cfg, { origine }) ?? null;
    window.TBF_GESTE.jouer(kind, cfg, { zone: $('miniZone'), origine })
      .then((taps) => resolve(taps))
      .catch(rate);
  } catch (e) {
    /* Une levée **synchrone**, avant que la promesse existe : le `catch`
       ci-dessus ne la verrait pas, elle remonterait dans le `setTimeout` du
       compte à rebours, hors de toute reprise. */
    rate(e);
  }
}

/**
 * Le verdict de son propre chant : l'évènement `chant` que le serveur
 * diffuse à la salle porte le mot (`verdict`, § 17). La promesse se tient
 * sur lui — pris dans sa tribune, sur la carte qu'on vient de chanter —, ou
 * sur `null` si le chant est refusé (`nvn:error`) ou si rien ne vient.
 */
function attendreMonChant(cardId) {
  return new Promise((tenir) => {
    let fini = false;
    let filet = 0;
    const finir = (r) => {
      if (fini) return;
      fini = true;
      clearTimeout(filet);
      if (S.verdictAttendu === finir) { S.verdictAttendu = null; S.verdictCarte = null; }
      tenir(r);
    };
    filet = setTimeout(() => finir(null), 8000);
    S.verdictCarte = cardId;
    S.verdictAttendu = finir;
  });
}

/* ------------------------------------------------------------ gestes UI */

/**
 * Les cinq chants offerts : **les cartes de chant de la brique** (2:3, lot
 * 6), en éventail au bas de l'écran. Le dessin plein, le geste et la poussée
 * dans sa couleur, le nom sur sa bande d'encre, le coût en sticker rond.
 * Trop cher, réduit au silence ou partie finie : un scotch en croix sur le
 * dessin et ce qui manque (« −8 »), jamais sur le nom — une main qui
 * rétrécit quand on manque de souffle cache exactement ce qu'on vise.
 *
 * **Chaque carte est posée une fois, et seul son état change** (`accorder`) :
 * un appui commencé sur une carte ne finit pas sur sa remplaçante. `.chant`,
 * `data-chant`, `b`, `.c`, `.g`, `.p` et `.dim` restent : la page et
 * `nvn:ui` les lisent.
 */
function rendreChants(v) {
  const moi = v.moi;
  const chants = v.chants ?? [];
  const souffle = Math.floor(moi?.breath ?? 0);
  const muet = (moi?.effets ?? []).some((e) => e.type === 'silence');

  accorder($('chants'), clesDe(chants.map((c) => c.id)),
    (_cle, i) => {
      const c = chants[i];
      return fabriquer(`<button type="button" class="chant tbf-carte tbf-carte--chant" data-chant="${esc(c.id)}"
        style="--c:${COULEUR_GESTE[c.gest] ?? '#F5C33B'}">
        ${window.TBF_CHANT ? window.TBF_CHANT.illustration(c.id) : ''}
        <span class="g tbf-carte-geste"></span><span class="p tbf-carte-pousse"></span>
        <b class="tbf-carte-nom"></b>
        <span class="c tbf-sticker tbf-sticker--rond tbf-carte-cout"></span>
        <span class="tbf-sticker tbf-sticker--rond carte-sien" aria-hidden="true"><svg viewBox="0 0 24 24"><path d=""/></svg></span>
        <span class="tbf-sticker tbf-carte-manque" data-ton="flare"></span></button>`);
    },
    (el, _cle, i) => {
      const c = chants[i];
      /* **Son geste** : le chant de la spécialité du Fanzzy en tribune porte le
         sceau de sa famille, au coin que le coût laisse libre. Le serveur le
         place au milieu de l'éventail, la seule carte entière. */
      const sien = Boolean(c.sien);
      if (el.hasAttribute('data-sien') !== sien) el.toggleAttribute('data-sien', sien);
      if (sien) {
        const chemin = el.querySelector('.carte-sien path');
        if (chemin && chemin.getAttribute('d') !== (c.sien.ico ?? '')) chemin.setAttribute('d', c.sien.ico ?? '');
        el.style.setProperty('--fam', c.sien.c ?? 'var(--projo)');
        el.setAttribute('aria-label', `${c.nom ?? c.id}, le geste de ton Fanzzy`);
      } else if (el.hasAttribute('aria-label')) el.removeAttribute('aria-label');
      const manque = souffle < c.cost ? c.cost - souffle : 0;
      const hors = Boolean(muet || v.termine || manque);
      el.classList.toggle('dim', hors);
      const etat = S.chantOuvert === c.id ? 'touchee' : hors ? 'injouable' : '';
      if ((el.dataset.etat ?? '') !== etat) {
        if (etat) el.dataset.etat = etat; else el.removeAttribute('data-etat');
      }
      ecrire(el.querySelector('.tbf-carte-manque'), manque && !muet && !v.termine ? `−${manque}` : '');
      ecrire(el.querySelector('.c'), c.cost);
      ecrire(el.querySelector('b'), c.nom ?? c.id);
      ecrire(el.querySelector('.g'), LABEL_GESTE[c.gest] ?? c.gest);
      ecrire(el.querySelector('.p'), c.power);
    });
}

$('chants').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-chant]');
  if (!el || S.occupe) return;
  const moi = S.vue?.moi;
  const carte = (S.vue?.chants ?? []).find((c) => c.id === el.dataset.chant);
  if (!moi || !carte || S.vue?.termine) return;
  if ((moi.effets ?? []).some((x) => x.type === 'silence')) return dire('ferveur.error.silenced');
  if (moi.breath < carte.cost) return toast('Pas assez de souffle pour ce chant.');

  const cfg = moi.gestes;
  if (!cfg) return toast('Le serveur n’a pas envoyé le barème du geste.');

  S.occupe = true;
  // La carte touchée se lève, le temps de son geste.
  S.chantOuvert = carte.id;
  el.dataset.etat = 'touchee';
  try {
    /* Le geste vient de **la carte**, comme au Virage. C'est ce que le serveur
       notera : lui envoyer autre chose ne changerait rien, il relit la carte. */
    const taps = await ouvrirGeste(carte.gest, cfg);
    if (!taps) { toast('Ce geste n’a pas été enregistré — recommence.'); return; }
    /* **Le verdict claque dans la fenêtre** (lot 6) : elle attend la réponse
       au plus six cents millisecondes après la dernière frappe et y claque
       le tampon ; trop tard, elle se ferme, et le tampon claquera sur la
       carte jouée à l'arrivée (`TBF_GESTE.attendre`). Sans mot servi, rien. */
    const reponse = attendreMonChant(carte.id);
    socket.emit('nvn:chant', { cardId: carte.id, taps });
    await window.TBF_GESTE.attendre?.(reponse, { zone: $('miniZone'),
      carte: () => document.querySelector(`#chants [data-chant="${CSS.escape(carte.id)}"]`) });
  } finally {
    /* **Dans un `finally`.** Il était après l'envoi, donc sauté dès que quoi
       que ce soit levait au-dessus — et `S.occupe` resté vrai éteint les chants
       pour le reste du duel, pendant que l'adversaire continue. La fenêtre se
       ferme ici, et son chant avec elle. */
    if ($('mini').classList.contains('on')) fermerGeste(null);
    S.chantOuvert = null;
    S.occupe = false;
  }
});

$('mainCartes').addEventListener('click', (e) => {
  const c = e.target.closest('[data-jouer]');
  if (!c || !socket?.connected) return;
  /* Elle se décolle (six degrés, ×1,15, cent millisecondes) avant de voler :
     voir « action » dans `raconter`. */
  c._joueeA = performance.now();
  c.dataset.etat = 'jouee';
  socket.emit('nvn:play', { cardId: c.dataset.jouer });
});

$('equipe').addEventListener('click', (e) => {
  const f = e.target.closest('[data-entrer]');
  if (!f || !socket?.connected) return;
  socket.emit('nvn:swap', { index: Number(f.dataset.entrer) });
});

/* --------------------------------------------------------- démarrage */

/* **Le bouton de son a quitté l'arène** (lot 6) : le son se coupe au tiroir,
   dans le mode calme, comme sur tous les écrans. Il y était posé dans le
   coin de l'arène, faute d'une place dans l'en-tête — le HUD de match n'en
   a pas davantage, et deux réglages du même son se contrediraient. */

(async () => {
  /* **La socket ne doit jamais empêcher la page de s’afficher.**
  
     `io` vient de /socket.io/socket.io.js, servi par le serveur lui-même. Ce
     fichier peut manquer — un mandataire qui ne relaie pas ce chemin, une
     extension qui le bloque, une coupure au mauvais moment — et `io` est alors
     **indéfini**. L’appel levait, la fonction de démarrage rejetait, et rien
     de ce qui suit ne se jouait : aucun appel au serveur, aucun rendu.
  
     Vu du joueur, les deux seuls écrans qui chargent cette bibliothèque
     tombaient ensemble et en silence — le duel restait sur son « Chargement… »
     et le Virage restait blanc. Rien ne pouvait le lui expliquer, puisque le
     code qui aurait pu parler était après la ligne qui levait.
  
     Or la liste des matchs n’a aucun besoin de socket : elle arrive par des
     appels ordinaires. Seul **jouer** en a besoin. On sépare donc les deux : la
     page se dessine toujours, et l’absence de direct se dit à l’endroit où elle
     change quelque chose.
  
     Le rattrapage est volontairement large — `io` absent lève une
     ReferenceError, le constructeur peut lever autre chose. Ce qu’on veut ici
     n’est pas distinguer les causes, c’est ne pas perdre la page. */
  try { connecter(); }
  catch (e) { S.sansDirect = true; console.error('[duel] socket', e.message); }
  try {
    const [cat, matchs] = await Promise.all([
      api('/api/deck/catalogue'),
      api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`),
    ]);
    S.catalogue = cat.actions ?? [];
    // Ce que chaque format paie en plus. Voir `primeDeFormat` côté serveur.
    S.primes = cat.primes ?? {};
    S.matchs = matchs.matchs ?? [];
    formatsMemo = cat.formats ?? formatsMemo;

    // Le catalogue Fanzzy ne sert qu'aux couleurs de type des vignettes. Son
    // absence ne doit pas empêcher de jouer : le dessin retombe sur la craie.
    const dex = await api('/api/fanzzy/dex').catch(() => null);
    FZART.setTypes(dex?.types ?? {});

    let loadout = null;
    try { loadout = await api('/api/deck/loadout'); } catch { loadout = null; }
    sansDeckMemo = !loadout?.fanzzy?.length;

    // Un match du jour d'abord : c'est celui qu'on vient jouer.
    S.fixtureId = S.matchs.find((m) => m.mode === 'classe')?.id ?? S.matchs[0]?.id ?? null;

    /* **Arriver par un lien d'invitation.** Format, match et camp sont déjà
       décidés par celui qui a invité : on les pose, et il ne reste qu'à
       appuyer. Un lien qui ouvrirait la page au début du parcours ne serait
       pas une invitation, ce serait une adresse.

       Chaque valeur est vérifiée contre ce que la page connaît : un lien peut
       être vieux d'une heure, et le match plus être là. */
    {
      const q = new URLSearchParams(location.search);
      const f = q.get('format');
      if (f && (formatsMemo ?? []).includes(f)) S.format = f;
      const id = Number(q.get('match'));
      /* **La portée s’élargit si le match n’est pas dedans.**

         La liste s'ouvre sur « MES CLUBS ». Un lien qui nomme le match de
         quelqu'un d'autre — c'est-à-dire la plupart des liens, puisqu'ils
         viennent de la fiche d’un match quelconque — désignait donc une
         rencontre absente de `S.matchs`, et la ligne d’en dessous le laissait
         tomber en silence. Vu du joueur : « DUEL » ouvre un menu et oublie le
         match sur lequel il venait d’appuyer.

         On reprend donc la liste large, une fois, avant de renoncer. */
      if (Number.isInteger(id) && id > 0 && !S.matchs.some((m) => m.id === id)) {
        const large = await api('/api/deck/matchs?tous=1').catch(() => null);
        if (large?.matchs?.some((m) => m.id === id)) {
          S.matchs = large.matchs;
          S.tousLesMatchs = true;
        }
      }
      if (S.matchs.some((m) => m.id === id)) S.fixtureId = id;
      const c = Number(q.get('camp'));
      if (c === 0 || c === 1) S.camp = c;
    }

    // Ce qui attend déjà : la diffusion ne dira rien tant que personne ne bouge.
    await lireAttentes();
    rendrePrepa(sansDeckMemo, formatsMemo);
    amenerLeMatch();

    // Un duel peut être en cours si on revient sur la page.
    const etat = await api('/api/nvn/etat').catch(() => null);
    if (etat?.duelEnCours) socket.emit('nvn:resume');
  } catch (e) {
    if (e.message === 'auth') return;
    $('prepaCorps').innerHTML = `<div class="vide">Impossible de préparer le duel.<br>
      ${esc(MESSAGES[e.code] ?? e.code ?? 'Serveur injoignable')}</div>`;
  }
})();
