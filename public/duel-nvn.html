    try { deck = await api('/api/deck/loadout'); } catch { deck = null; }
    const sansDeck = !deck || deck.error === 'deck.error.none' || !deck.fanzzy;

    rendrePrepa(sansDeck, cat.formats ?? ['1v1','2v2','3v3','4v4','5v5']);
  } catch (e) {
    if (e.message === 'auth') return;
    $('prepaCorps').innerHTML = `<div class="vide">Impossible de préparer le duel.<br>
      ${esc(MESSAGES[e.code] ?? e.code ?? 'Serveur injoignable')}</div>`;
  }
}

/* ============================================== qui attend, et où

   On entrait en file seul et aveugle : deux joueurs pouvaient attendre au même
   moment sur deux matchs différents sans jamais se croiser. La liste dit
   maintenant ce qui attend, match par match — **combien, et de quel côté.
   Jamais qui.**

   La donnée arrive par deux chemins : demandée au chargement, puis diffusée à
   chaque mouvement. Entre « 2 t'attendent » et « 2 t'attendaient il y a trente
   secondes », il y a toute la différence entre une invitation et une
   déception. */

/** L'attente sur ce match, dans le format choisi, ou `null`. */
const attenteDe = (m) => S.attentes.find(
  (a) => a.fixtureId === m.id && a.format === S.format) ?? null;

/** Le camp qui manque de monde, et combien il en manque. */
function manqueDe(a) {
  if (!a) return null;
  const camp = a.camps[0] <= a.camps[1] ? 0 : 1;
  return { camp, combien: Math.max(0, a.attendus - a.camps[camp]) };
}

async function lireAttentes() {
  try {
    const r = await api('/api/nvn/attentes');
    S.attentes = r.attentes ?? [];
    /* Le derby automatique (voir `derbyPour`, serveur) : un supporter de
       l'autre club d'un match du jour est en ligne. Lu à l'arrivée
       seulement — l'annonce diffusée des files ne le porte pas, elle est la
       même pour tout le monde. */
    S.derby = r.derby?.fixtureId ? r.derby : null;
  } catch { /* le panneau d'affichage n'est pas la page : on s'en passe */ }
}

function rendrePrepa(sansDeck, formats) {
  const out = [];

  /* **Sans direct, on le dit tout de suite.** L'écran reste utile — la liste
     des matchs, les formats, tout se lit — mais entrer en file demande une
     connexion permanente, et mieux vaut l'apprendre avant d'appuyer. Le lien
     mène au diagnostic, qui teste cette connexion et nomme ce qui l'arrête. */
  if (S.sansDirect) {
    out.push(`<div class="avert"><b>PAS DE CONNEXION EN DIRECT</b>
      Les duels ont besoin d’une connexion permanente, et elle n’a pas pu
      s’établir. Tu peux regarder les matchs, mais pas entrer en file.
      <a href="/diagnostic">Voir ce qui la bloque</a></div>`);
  }

  /* **Sans deck : une invitation, pas un avertissement** (lot 6). Trois
     places vides — les sièges qui attendent l'équipe — sous la bâche bleue
     qui mène à l'atelier du deck. La file refuserait l'entrée après trois
     minutes d'attente : autant le montrer avant. */
  if (sansDeck) {
    const place = '<img src="/img/place-vide.webp" alt="" decoding="async">';
    out.push(`<div class="sansdeck">
      <div class="places" aria-hidden="true">${place}${place}${place}</div>
      <p>Trois Fanzzy et dix cartes, à composer une fois pour toutes.</p>
      <a class="tbf-plaque tbf-bloc" data-ton="bleu" href="/deck">CONSTRUIRE MON DECK</a>
    </div>`);
  }

  /* **Le geste se répète avant, jamais pendant.**

     Un duel dure cinq minutes et chaque carte y coûte du souffle : c'est le
     plus mauvais endroit du jeu pour découvrir ce que « la jauge tient puis
     elle saute » veut dire. La salle de répétition les joue tous les vingt,
     sans mise et sans Fanzzy — et c'est ici qu'on y pense, sur l'écran où l'on
     attend, pas dans un menu qu'on n'ouvre pas quand on cherche un adversaire.

     Une ligne, pas une plaque : ce n'est pas une étape à franchir pour entrer
     en duel, et rien ne doit le laisser croire. */
  out.push(`<p class="repet"><a href="/repetition">Un geste te résiste ?
    <b>Va le répéter</b></a> — rien n'y compte, et rien n'y aide non plus.</p>`);

  out.push(`<h2 class="tbf-cousu">LE FORMAT <i>· la file est par format et par match</i></h2>`);
  /* **Les formats : cinq bâches-tuiles** (lot 6), chacune avec ses
     silhouettes au pochoir — à combien on tient sa tribune — et **la prime du
     format** en sticker craie au coin, au moment du choix : un 2v2 demande de
     réunir quatre personnes au lieu de deux, il paie donc un peu plus. Le taux
     vient du serveur (`primes`) — il se règle depuis /admin, et la page n’en
     porte pas de copie. Le libellé vient en premier : c'est lui que la page
     et `nvn:ui` lisent. */
  out.push(`<div class="formats">${formats.map((f) => {
    const p = S.primes?.[f] ?? 1;
    const n = Math.max(1, Math.min(5, Number(String(f).match(/^\d+/)?.[0]) || 1));
    const on = f === S.format;
    const prime = p > 1
      ? `<span class="prime tbf-sticker">+${Math.round((p - 1) * 100)} %</span>` : '';
    return `<button class="fmt tbf-plaque ${on ? 'on' : ''}" ${on ? 'data-ton="flare"' : ''}
      data-fmt="${esc(f)}" aria-pressed="${on}">${esc(f)}<span class="tbf-foule tbf-foule--frise"
      aria-hidden="true">${'<i class="on"></i>'.repeat(n)}</span>${prime}</button>`;
  }).join('')}</div>`);
  /* **« Peu importe le format ».**

     La file est indexée par format : deux personnes qui attendent sur le
     même match, l’une en 3v3 et l’autre en 1v1, ne se rencontrent jamais.
     Cocher ceci, c’est accepter de jouer avec tous les autres, quel que
     soit le format qu’ils ont choisi. `aria-pressed` dit l'état à qui ne voit
     pas la case — la coche seule ne s'entend pas. */
  out.push(`<button class="souple tbf-plaque ${S.souple ? 'on' : ''}"
    ${S.souple ? 'data-ton="flare"' : ''} aria-pressed="${Boolean(S.souple)}" data-souple>
    <span class="case">${S.souple ? '<i class="tbf-ico tbf-ico-coche" aria-hidden="true"></i>' : ''}</span>
    <span class="t">Peu importe le format<small>joue avec tous ceux qui attendent sur ce match</small></span>
  </button>`);

  out.push(`<h2 class="tbf-cousu">LE MATCH SUPPORT</h2>`);
  /* La portée de la liste. Jouer pour un match qui n'est pas celui de son
     club est permis — sans quoi il n'y aurait personne en file un mardi de
     trêve — mais ça rapporte moitié moins. Le rail flare des arènes. */
  out.push(`<div class="portee tbf-onglets" data-ton="flare">
    <button class="pt tbf-onglet ${S.tousLesMatchs ? '' : 'on'}" data-portee="miens"
      aria-pressed="${!S.tousLesMatchs}">MES CLUBS</button>
    <button class="pt tbf-onglet ${S.tousLesMatchs ? 'on' : ''}" data-portee="tous"
      aria-pressed="${S.tousLesMatchs}">TOUS LES MATCHS</button>
  </div>`);

  if (!S.matchs.length) {
    out.push(S.tousLesMatchs
      ? `<div class="vide">Aucun match dans les huit prochains jours.</div>`
      : `<div class="vide">Aucun match à venir pour tes clubs.<br>
         <a href="/equipes">Suivre d’autres clubs</a>, ou passe à
         <b>tous les matchs</b> ci-dessus.</div>`);
  } else {
    out.push('<div class="matchs">');
    for (const m of S.matchs) {
      const on = S.fixtureId === m.id;
      /* Le match choisi devient **l'affiche** (lot 6) ; les autres restent
         des tickets. **Le choix se déplie sous lui**, et non au bas de la
         page : la liste fait soixante lignes, et le geste suivant doit être
         là où le doigt vient de se poser. L'affiche et ce qui se déplie
         sous elle font un bloc, celui auquel ENTRER EN FILE reste collé. */
      out.push(on ? `<div class="match-choisi">${afficheMatch(m)}${souLeMatch(m, sansDeck)}</div>`
        : ticketMatch(m));
    }
    out.push('</div>');
  }

  $('prepaCorps').innerHTML = out.join('');
}

/** L'heure d'un coup d'envoi, à l'heure du téléphone : un instant qu'on
    écrit, jamais un jour qu'on calcule (R4). `null` sans instant lisible. */
function heureDe(m) {
  const t = Date.parse(m.kickoff_at ?? '');
  if (!Number.isFinite(t)) return null;
  return new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

/**
 * **Le sticker d'état d'un match** : un seul, au bout du ticket (lot 6).
 *
 * Le score se lit dans l'affiche ; le ticket ne dit que **où en est le
 * match**, ce qui décide d'entrer ou non : « 71′ LIVE » en flare pendant le
 * jeu, la pause en clair, « TERMINÉ » en craie, et à venir l'heure du coup
 * d'envoi — « AUJ. » quand le serveur dit que c'est le jour du match (le
 * duel y est classé : c'est sa règle, `raisonDuMatch`), le jour de la
 * semaine sinon. Rien sans donnée.
 */
function etatDuMatch(m) {
  const PAUSES = { HT: 'MI-TEMPS', BT: 'PAUSE', P: 'TIRS AU BUT', SUSP: 'SUSPENDU', INT: 'INTERROMPU' };
  if (m.enCours) {
    if (PAUSES[m.status_short]) return `<span class="tbf-sticker">${PAUSES[m.status_short]}</span>`;
    return `<span class="tbf-sticker tbf-sticker--live" data-ton="flare">${
      m.elapsed ? `${Number(m.elapsed)}′ LIVE` : 'LIVE'}</span>`;
  }
  if (m.termine) return '<span class="tbf-sticker">TERMINÉ</span>';
  const h = heureDe(m);
  if (!h) return '';
  if (m.mode === 'classe') return `<span class="tbf-sticker">AUJ. ${h}</span>`;
  const t = Date.parse(m.kickoff_at);
  const jour = new Date(t).toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '');
  return `<span class="tbf-sticker">${esc(jour)} ${h}</span>`;
}

/** Ceux qui attendent sur ce match, dans ce format : des silhouettes et
    leur nombre. Jamais qui. Rien sans personne. */
function fileDe(m) {
  const att = attenteDe(m);
  const n = att ? att.camps[0] + att.camps[1] : 0;
  if (!n) return '';
  return `<span class="tbf-foule tbf-foule--frise" aria-hidden="true">${
    '<i class="on"></i>'.repeat(Math.min(8, n))}</span><span class="q attente">${n} EN FILE</span>`;
}

/** Les blasons d'un match, quand l'API en sert. */
function blasonsDe(m) {
  const b = [m.home_logo, m.away_logo].filter(Boolean)
    .map((src) => `<img src="${esc(src)}" alt="" decoding="async">`).join('');
  return b ? `<span class="bls">${b}</span>` : '<span class="bls"></span>';
}

/** Un match de la liste : un ticket kraft de soixante pixels. */
function ticketMatch(m) {
  return `<div class="mt tbf-ticket" data-fixture="${m.id}">
    ${blasonsDe(m)}
    <div class="n">${esc(m.home_name)} – ${esc(m.away_name)}
      <small>${m.mode === 'classe' ? 'CLASSÉ' : 'ENTRAÎNEMENT'}${fileDe(m)}${
        S.derby?.fixtureId === m.id ? '<span class="q attente derby">DERBY</span>' : ''}</small></div>
    <div class="bout">${etatDuMatch(m)}${m.mien
      ? '<span class="q mien tbf-tampon" data-ton="vert">×2</span>' : ''}</div>
  </div>`;
}

/**
 * **Le match choisi, en affiche** (`.tbf-affiche`, la brique du lot 6).
 *
 * Les blasons et les deux clubs, le score en banderole avec sa minute — ou
 * « VS » et l'heure avant le coup d'envoi —, « CLASSÉ » en sticker d'or (la
 * seule face d'or hors achat : c'est l'enjeu), « ×2 » en tampon vert sous le
 * score, la file en frise au pied, et l'écharpe aux couleurs des deux
 * clubs (`homeColors`, `awayColors`).
 *
 * **Le stade du match, en fond et au pied** (décision de Gaël, 6 octobre
 * 2026 : tous les duels d'un match se jouent dans son stade — celui de son
 * Grand Virage —, et la préparation le montre avant l'entrée en file). Il
 * vient du serveur, avec le match (`stade`, § 17), tiré par la fonction
 * même qui donne le leur au Virage et au duel qui va se jouer
 * (`stadeDuMatch`) : la page ne le calcule pas, elle ne connaît ni la règle
 * ni les stades qu'une saison a ouverts. Le dessin réduit sous le voile de
 * la brique, le nom au pied, à côté de la file ; ce qu'il change est dans
 * les règles du « i ». Jusqu'ici, le lieu d'un duel se tirait sur son propre
 * identifiant, au coup d'envoi : aucun match n'en servait, et l'affiche
 * restait nue plutôt que de montrer un stade dont les effets ne
 * s'appliqueraient pas. **Un match servi sans stade la laisse nue**
 * aujourd'hui encore (une liste d'avant la décision, gardée par une page
 * restée ouverte) : rien ne s'invente.
 *
 * **Le camp pour qui l'on pousse** porte le sticker « TA TRIBUNE » sous le
 * nom de son club : imposé chez soi (`monCamp`), choisi ailleurs (`S.camp`,
 * rien tant qu'on n'a pas choisi).
 */
function afficheMatch(m) {
  const commence = m.enCours || m.termine;
  const score = commence
    ? `${Number(m.home_goals) || 0} – ${Number(m.away_goals) || 0}` : 'VS';
  const sous = m.enCours
    ? (m.elapsed ? `${Number(m.elapsed)}′` : 'EN DIRECT')
    : m.termine ? 'TERMINÉ' : (heureDe(m) ?? '');
  const camp = m.monCamp ?? S.camp;
  const club = (nom, logo, i) => `<span class="tbf-affiche-club">${logo
    ? `<img src="${esc(logo)}" alt="" decoding="async">` : ''}<b>${esc(nom)}</b>${camp === i
    ? '<span class="tbf-sticker tribune-mienne">TA TRIBUNE</span>' : ''}</span>`;
  const att = attenteDe(m);
  const n = att ? att.camps[0] + att.camps[1] : 0;
  /* Le stade : son dessin réduit en `--fond`, à l'adresse que `stade-art.js`
     donne au coup d'envoi — l'identifiant réduit aux lettres, aux chiffres
     et au tiret avant d'entrer dans une adresse, comme là-bas. */
  const lieu = m.stade?.id ? m.stade : null;
  const fond = lieu && window.TBF_STADE?.adresse
    ? window.TBF_STADE.adresse(String(lieu.id).replace(/[^a-z0-9-]/gi, ''), true) : null;
  const style = [echarpeDe('a', couleursDe(m, 0)), echarpeDe('b', couleursDe(m, 1)),
    fond ? `--fond:url('${fond}')` : ''].filter(Boolean).join(';');
  const pied = [
    lieu?.nom ? `<span class="lieu-match"><small>STADE</small><b>${esc(lieu.nom)}</b></span>` : '',
    n ? `<span class="tbf-foule tbf-foule--frise" data-tribune="moi"
      aria-hidden="true">${'<i class="on"></i>'.repeat(Math.min(12, n))}</span>
      <small>${n} EN FILE</small>` : ''].join('');
  return `<div class="mt on tbf-cadre tbf-affiche${camp === 0 || camp === 1 ? ' camp-marque' : ''}" data-fixture="${m.id}"${
    fond ? ' data-fond' : ''}${style ? ` style="${style}"` : ''}>
    ${club(m.home_name, m.home_logo, 0)}
    <span class="tbf-affiche-score"><b class="tbf-banderole">${score}</b>${sous ? `<small>${sous}</small>` : ''}${
      m.mien ? '<span class="q mien tbf-tampon" data-ton="vert">×2</span>' : ''}</span>
    ${club(m.away_name, m.away_logo, 1)}
    ${m.mode === 'classe' ? '<span class="tbf-sticker" data-ton="or">CLASSÉ</span>'
      : '<span class="tbf-sticker">ENTRAÎNEMENT</span>'}
    ${m.enCours && !['HT', 'BT', 'P', 'SUSP', 'INT'].includes(m.status_short)
      ? '<span class="tbf-sticker tbf-sticker--live" data-ton="flare">LIVE</span>' : ''}
    ${pied ? `<span class="tbf-affiche-pied">${pied}</span>` : ''}
  </div>`;
}

/**
 * Ce qui se déplie sous le match choisi : la tribune quand elle se choisit,
 * le bouton d'entrée, et les règles derrière leur « i ».
 *
 * **Entre l'affiche et ENTRER EN FILE, seulement ce qui reste à décider**
 * (lot 6). L'affiche dit déjà l'enjeu — CLASSÉ ou ENTRAÎNEMENT, LIVE ou
 * l'heure, « ×2 » quand un de ses clubs joue —, ce qui attend (« 1 EN
 * FILE ») et, chez soi, le camp (« TA TRIBUNE » sur son club). Les deux
 * phrases qui le redisaient et la rubrique d'un camp qui ne se choisit pas
 * repoussaient le bouton à 150 px sous le bord à 360 × 640 ; elles passent
 * dans les règles, où l'on va chercher le pourquoi.
 */
function souLeMatch(choisi, sansDeck) {
  const out = [];
  const clubs = [choisi.home_name, choisi.away_name];
  const chezMoi = choisi.monCamp !== null && choisi.monCamp !== undefined;
  const att = attenteDe(choisi);

  /* ------------------------------------------------------- le camp

     Les deux tribunes du duel sont les deux clubs du match. **Chez soi, il
     n'y a rien à choisir** : on ne pousse pas contre son propre club, et
     l'affiche le dit par le sticker « TA TRIBUNE » sur le sien (le pourquoi
     est dans les règles). **Ailleurs, il faut choisir**, et le bouton reste
     fermé tant que ce n'est pas fait. */
  if (!chezMoi) {
    out.push(`<div class="souscarte">`);
    /* Ce qui attend sur **ce** match : c'est l'information qui décide du
       camp, et elle doit donc être là où le camp se choisit. */
    const manque = manqueDe(att);
    if (att && manque) {
      out.push(`<div class="raison attend"><b>${att.camps[0] + att.camps[1]}</b>
        ${att.camps[0] + att.camps[1] > 1 ? 'supporters attendent' : 'supporter attend'}
        sur ce match.${manque.combien > 0
          ? ` Il en manque <b>${manque.combien}</b> côté <b>${esc(clubs[manque.camp])}</b>.`
          : ''}</div>`);
    }
    out.push(`<h3 class="tbf-cousu">TA TRIBUNE <i>· pour qui viens-tu chanter ?</i></h3>`);
    /* **Les deux bâches des clubs** (`.tbf-plaque--club`, la brique) : de
       même poids, l'écharpe du club en bord bas — on choisit son camp à ses
       couleurs —, et le compte de la file sur chacune. La choisie prend le
       ton flare, et garde son écharpe. `.on` et `data-camp` restent la
       marque du choix pour la page et ses contrôles. */
    out.push(`<div class="tribunes">${clubs
      .map((nom, i) => `<button class="trib tbf-plaque tbf-plaque--club ${S.camp === i ? 'on' : ''}"
        ${S.camp === i ? 'data-ton="flare"' : ''} aria-pressed="${S.camp === i}"
        ${couleursDe(choisi, i).length ? `style="${echarpeDe('e', couleursDe(choisi, i))}"` : ''}
        data-camp="${i}">${esc(nom)}${att
          ? `<small>${att.camps[i]} en file</small>` : ''}</button>`).join('')}</div>`);
    out.push(`</div>`);
  }

  /* **ENTRER EN FILE**, et ce qui est en jeu dessous — « +60 écharpes en
     jeu » — **seulement si le serveur le sert** (`enJeu`, § 17 : le barème
     du mode, la prime du format et le double du club, comptés par lui). Sous
     « peu importe le format », le format peut changer : le montant d'un
     seul serait une promesse fausse, il ne s'écrit pas. Fermé tant qu'on n'a
     pas dit pour qui l'on chante : un neutre envoyé sans choix irait par
     défaut du côté du domicile, et le camp visiteur ne se remplirait jamais.
     **Ouvert, il se colle au bas de la préparation** (`data-colle`, voir
     `.entree`) ; fermé, il reste à sa place. */
  /* **Le derby du jour** : quelqu'un qui suit l'autre club est en ligne.
     Le dire là où l'on décide d'entrer, sans dire qui. */
  if (S.derby?.fixtureId === choisi.id && S.format === (S.derby.format ?? '1v1') && chezMoi) {
    const eux = S.derby.clubs?.[choisi.monCamp ^ 1]?.name ?? clubs[choisi.monCamp ^ 1];
    out.push(`<div class="raison attend derby"><b>DERBY</b> · un supporter de l’autre
      tribune, <b>${esc(eux)}</b>, est en ligne. Entre en file : il le verra.</div>`);
  }

  const sansCamp = !chezMoi && S.camp === null;
  const ferme = sansDeck || sansCamp;
  const enJeu = !S.souple ? Number(choisi.enJeu?.[S.format]) : NaN;
  out.push(`<div class="entree"${ferme ? '' : ' data-colle'}>
    <button class="gros tbf-plaque tbf-bloc" data-ton="flare" id="entrer"
      ${ferme ? 'disabled' : ''}>ENTRER EN FILE${Number.isFinite(enJeu) && enJeu > 0
        ? `<small>+${enJeu} écharpes en jeu</small>` : ''}</button>
    <button class="tbf-plaque tbf-plaque--rond regles-i" type="button" data-regles
      aria-expanded="${Boolean(S.regles)}" aria-controls="regles" aria-label="Les règles du duel"><b aria-hidden="true">i</b></button>
  </div>`);
  /* Les règles, derrière leur « i » : elles se lisent une fois, pas à chaque
     duel. Écrites quand même dans la page — repliées, elles restent à qui
     les cherche, et à `nvn:ui` qui les lit.

     **Elles commencent par ce que vaut ce duel**, ce que les stickers de
     l'affiche disent en un mot : la phrase du serveur, qui est le seul à
     connaître la règle — ce qui décide du classement est **la journée**
     (`raisonDuMatch`, dans `src/server/deck/index.js`) ; le repli couvre une
     page restée ouverte pendant un déploiement, et ne promet rien sur le
     classement. Puis le double d'écharpes quand un de ses clubs joue, et le
     camp : imposé chez soi, à choisir ailleurs. Puis **le stade**, dont
     l'affiche ne dit que le nom : ce qu'il change, dans la phrase même que
     la partie redira dans « ce que tu portes » (`effet`, servi avec lui), et
     qu'il est celui de tous les duels du match comme de son Grand Virage. */
  const lieu = choisi.stade?.nom ? choisi.stade : null;
  out.push(`<div class="regles" id="regles" ${S.regles ? '' : 'hidden'}>
    <p>${esc(choisi.raison ?? (choisi.enCours ? 'Le match est en cours.' : 'Match à venir.'))}</p>
    ${choisi.mien ? '<p><b>Un de tes clubs joue : ce duel rapporte le double d’écharpes.</b></p>' : ''}
    ${chezMoi ? `<p>Tu es chez toi : <b>${esc(clubs[choisi.monCamp])}</b>. Le camp ne se
      choisit pas — on ne pousse pas contre son club.</p>`
    : `<p>Aucun de tes clubs ne joue : tu viens tenir une tribune qui
      n’est pas la tienne. <b>Prends celle qui manque de monde</b> — ta ferveur y vaut
      jusqu’au double.</p>`}
    ${lieu ? `<p>Le stade : <b>${esc(lieu.nom)}</b>.${lieu.effet ? ` ${esc(lieu.effet)}` : ''}
      Tous les duels de ce match s’y jouent, et son Grand Virage aussi.</p>` : ''}
    <p>Si personne ne se présente, des bots complètent les places et le duel
      devient un entraînement.</p>
    <p>Partir en plein duel est un forfait : on perd, et la tribune d’en face
      touche ce qui était prévu.</p>
  </div>`);

  return out.join('');
}

/**
 * **Les règles qu'on vient d'ouvrir viennent sous les yeux.** Elles se
 * déplient sous le « i » ; à 360 × 640, ce « i » est dans la rangée collée au
 * bas de l'écran, et le panneau s'ouvrait sous le bord : on touchait, et rien
 * ne changeait. On fait défiler juste ce qu'il faut pour le voir en entier,
 * jamais au point de passer son haut sous la flèche et le menu flottants.
 * `scrollTop` et non `scrollIntoView` (voir `amenerLeMatch`).
 */
function montrerRegles() {
  const prepa = $('prepa');
  const regles = $('regles');
  if (!prepa || !regles || regles.hidden) return;
  const p = prepa.getBoundingClientRect();
  const r = regles.getBoundingClientRect();
  const manque = r.bottom + 12 - p.bottom;
  if (manque <= 0) return;
  const marge = parseFloat(getComputedStyle(document.querySelector('#prepa .mt.on') ?? prepa).scrollMarginTop) || 0;
  prepa.scrollTop += Math.min(manque, Math.max(0, r.top - p.top - marge));
}

$('prepaCorps').addEventListener('click', (e) => {
  const f = e.target.closest('[data-fmt]');
  if (f) { S.format = f.dataset.fmt; return preparerRendu(); }
  if (e.target.closest('[data-souple]')) { S.souple = !S.souple; return preparerRendu(); }
  if (e.target.closest('[data-regles]')) {
    S.regles = !S.regles;
    preparerRendu();
    if (S.regles) montrerRegles();
    return undefined;
  }
  const m = e.target.closest('[data-fixture]');
  // Changer de match remet la tribune à zéro : ce ne sont plus les mêmes clubs.
  if (m) {
    if (Number(m.dataset.fixture) === S.fixtureId) return undefined;
    S.fixtureId = Number(m.dataset.fixture); S.camp = null; return preparerRendu();
  }
  const t = e.target.closest('[data-camp]');
  if (t) { S.camp = Number(t.dataset.camp); return preparerRendu(); }
  /* Changer de portée relit la liste : elle vient du serveur, qui seul sait
     quels matchs existent et lesquels mettent un club suivi en jeu. Le match
     choisi est remis à zéro — il peut très bien ne plus être dans la liste. */
  const p = e.target.closest('[data-portee]');
  if (p) {
    const tous = p.dataset.portee === 'tous';
    if (tous === S.tousLesMatchs) return undefined;
    S.tousLesMatchs = tous;
    S.fixtureId = null;
    return rechargerMatchs();
  }
  if (e.target.closest('#entrer')) entrerEnFile();
  return undefined;
});

/**
 * Relit la liste des matchs pour la portée courante.
 *
 * Le premier match classé est choisi d'office, comme au chargement : c'est
 * celui qu'on vient jouer, et laisser la sélection vide obligerait à deux
 * gestes là où un seul suffit.
 */
async function rechargerMatchs() {
  try {
    const r = await api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`);
    S.matchs = r.matchs ?? [];
  } catch {
    S.matchs = [];               // hors ligne : la liste vide dit déjà tout
  }
  S.fixtureId = S.matchs.find((m) => m.mode === 'classe')?.id ?? S.matchs[0]?.id ?? null;
  preparerRendu();
}

// On ne recharge pas les catalogues à chaque clic : seul l'affichage change.
let sansDeckMemo = false, formatsMemo = ['1v1','2v2','3v3','4v4','5v5'];
const preparerRendu = () => rendrePrepa(sansDeckMemo, formatsMemo);

/**
 * **On amène le match choisi sous les yeux — seulement s'il n'y est pas.**
 *
 * La liste fait soixante lignes depuis qu'elle montre tout ce qui se joue :
 * le match choisi par un lien d'invitation, avec sa tribune et son bouton
 * d'entrée dépliés dessous, pouvait se trouver très bas, et la page
 * s'ouvrait alors sur le haut d'un menu. Mais centré d'office, il faisait
 * défiler la préparation alors qu'il était déjà à l'écran — de 163 px à
 * 360 × 640 : le titre sortait, et les tuiles des formats, le premier choix,
 * passaient sous la flèche et le menu flottants. On ne défile donc que pour
 * un match qu'on ne voit pas (moins de cent vingt pixels de lui à l'écran),
 * et on le pose sous les deux boutons (`scroll-margin-top`). `scrollTop` et
 * non `scrollIntoView` : celui-ci fait aussi défiler les ancêtres, la
 * colonne comprise, qui ne doit jamais bouger. **Sans deck, jamais** : la
 * file est fermée, et ce qui compte est l'invitation du haut, « CONSTRUIRE
 * MON DECK » — défiler jusqu'au match la sortait de l'écran.
 */
function amenerLeMatch() {
  const prepa = $('prepa');
  const choisi = prepa?.querySelector('.mt.on');
  if (!choisi || sansDeckMemo) return;
  const haut = choisi.getBoundingClientRect().top - prepa.getBoundingClientRect().top;
  if (haut <= prepa.clientHeight - 120) return;
  const marge = parseFloat(getComputedStyle(choisi).scrollMarginTop) || 0;
  prepa.scrollTop += haut - marge;
}

/* ---------------------------------------------------------- réseau */

let socket = null;

function connecter() {
  /* **Polling d'abord, websocket ensuite — et surtout pas l'inverse.**
  
     Un joueur l'a décrit exactement : « pas de connexion sur mobile, alors que
     ça marche sur l'ordinateur avec le même compte ». Le compte et le serveur
     étaient donc hors de cause, et le transport seul restait.
  
     La page demandait `['websocket', 'polling']`. Cet ordre n'est pas un
     classement de préférence : engine.io essaie le premier, et **si celui-là
     échoue il abandonne**. C'est écrit dans la documentation de la
     bibliothèque, à `tryAllTransports` : « if the connection with the first
     transport fails, then the client will not test the other transports and
     will abort the connection ». Par défaut, à false.
  
     Sur un ordinateur en wifi domestique, le websocket passe : personne ne voit
     rien. Sur un réseau mobile, un proxy d'entreprise ou derrière un portail
     captif, il est souvent bloqué — et le jeu se déclarait hors ligne sur un
     réseau parfaitement fonctionnel.
  
     L'ordre par défaut de socket.io est le bon, et il l'est pour cette
     raison-là : le long-polling passe partout où de l'HTTP passe, la connexion
     s'établit toujours, puis elle **monte** en websocket dès que le réseau le
     permet. On ne perd donc pas la latence du websocket là où il existe : on
     la gagne une centaine de millisecondes plus tard, sans jamais rien casser
     là où il n'existe pas.
  
     `tryAllTransports` en plus : si même le polling échoue au premier essai, on
     veut que les autres soient tentés plutôt qu'un abandon sec. */
  socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });

  /* **On ne crie pas au loup.**

     Un joueur l'a dit en une phrase : « j'ai le message de connexion
     impossible alors que la connexion fonctionne ». Il avait raison, et le
     défaut était grossier : `connect_error` posait le voile **sur-le-champ**,
     sur tout l’écran, et il tombait aussi quand on ne faisait que regarder la
     liste des matchs.

     Or socket.io émet `connect_error` à la moindre hésitation — un
     WebSocket refusé avant le repli en polling, un changement de réseau, un
     écran de téléphone qui s’éteint une seconde. Il se rebranche tout seul
     dans la foulée, et c’est le comportement normal, pas une panne. Poser un
     voile noir dessus, c’est apprendre au joueur que le jeu ment.

     On laisse donc cinq secondes à la reconnexion avant de dire quoi que ce
     soit. Si elle revient — le cas ordinaire — personne n’a rien vu. Si elle
     ne revient pas, le voile arrive, et cette fois il dit vrai.

     La règle vaut pour `disconnect` comme pour `connect_error` : les deux
     décrivent le même état vu de deux endroits. */
  const GRACE_RESEAU = 5000;
  let alarme = null;
  const plusTard = (titre, texte) => {
    if (alarme) return;                       // une alarme suffit
    alarme = setTimeout(() => { alarme = null; voile(titre, texte); }, GRACE_RESEAU);
  };
  const rassurer = () => { clearTimeout(alarme); alarme = null; };

  socket.on('connect', () => {
    rassurer();
    fermerVoile();
    // Reprise : si un duel nous attendait, le serveur nous y remet — sans
    // affiche ni entrée : on revient dans une tribune déjà pleine.
    if (S.vue && !S.vue.termine) { S.entree = true; socket.emit('nvn:resume'); }
    window.TBF_BARRE?.enPartie?.(Boolean(S.vue && !S.vue.termine));
  });

  socket.on('connect_error', () => {
    plusTard('Hors ligne', 'La connexion au serveur a été perdue. On réessaie.');
  });

  socket.on('disconnect', () => {
    if (S.vue && !S.vue.termine) {
      plusTard('Connexion perdue', 'Ta place t\u2019attend une minute trente. '
        + 'Tu cesses simplement de pousser, ta tribune ne s\u2019effondre pas.');
    }
  });

  /* L affiche, une fois, au coup d envoi. Elle arrive juste apres nvn:start
     et se retire toute seule : voir montrerAffiche. */
  socket.on('nvn:affiche', (a) => { try { montrerAffiche(a); } catch (e) {
    console.error('affiche', e); } });

  /* Le bilan, une fois, au coup de sifflet. Il remplace le voile gris que
     finir() posait ; celui-ci reste en repli si le bilan n arrive pas. */
  socket.on('nvn:fin', (b) => { try { montrerBilan(b); } catch (e) {
    console.error('bilan', e); } });

  /**
   * La file, et ce qu'elle annonce.
   *
   * Deux choses qui n'y étaient pas, et qui décident de tout :
   *
   *   — **ce qu'il manque en face.** Un duel est tribune contre tribune : si
   *     personne ne tient le camp visiteur, rien ne part. Le dire, c'est la
   *     seule chance qu'un joueur aille le tenir.
   *   — **le délai avant les bots**, qui n'était annoncé qu'en entraînement
   *     alors que le serveur basculait aussi pour un duel classé. Quelqu'un
   *     qui attend a le droit de savoir combien de temps.
   */
  socket.on('nvn:file', (p) => {
    S.enFile = true;
    // Qui je suis, dit par le serveur : le bilan y retrouve « toi » parmi
    // les joueurs de sa tribune.
    if (p?.moi != null) S.moiId = p.moi;
    /* Trois phrases sont devenues une salle : voir `rendreSalle`. Le serveur
       envoie la composition des deux tribunes à chaque mouvement, et ce
       message arrive désormais à **tous** ceux qui attendent, pas seulement
       au dernier entré. */
    rendreSalle(p);
  });

  /* Le panneau d'affichage : ce qui attend, partout, à chaque mouvement.
     On ne repeint que si l'on est encore devant la préparation — pendant un
     duel, la liste des matchs n'est pas à l'écran et la refaire ne servirait
     qu'à travailler pour rien. */
  socket.on('nvn:attentes', (d) => {
    S.attentes = d?.attentes ?? [];
    if (!S.vue) preparerRendu();
  });

  socket.on('nvn:start', (vue) => {
    /* **Un coup d'envoi, ou une reprise.** Venu de la file, c'est un duel
       qui commence : l'affiche va se poser, et la rumeur monte quand elle se
       retire (`entrerEnTribune`). Sans file — la page rouverte sur un duel
       en cours —, la tribune est déjà pleine : pas d'entrée. Si l'affiche ne
       vient pas (un serveur qui ne l'enverrait pas), la rumeur de l'entrée
       monte quand même, un peu plus tard, sur des bâches déjà posées. */
    const commence = S.enFile;
    S.enFile = false;
    // Le rebours du vestiaire n'a plus rien à compter.
    clearInterval(reboursTimer);
    reboursTimer = null;
    S.vue = vue;
    S.dernierSeq = vue.seq ?? 0;
    S.entree = !commence;
    clearTimeout(S.entreeT);
    if (commence) S.entreeT = setTimeout(() => entrerEnTribune(), 1500);
    /* **Le duel commence : on le dit à la barre.**

       Ce drapeau n'était levé qu'à la reconnexion — voir le gestionnaire
       « connect » plus haut. Un joueur qui jouait son duel d'une traite ne le
       levait donc jamais, et le garde-fou qui prévient avant un rechargement
       en pleine partie ne servait à personne. Il se lève ici, au seul endroit
       où le duel commence pour de bon. */
    window.TBF_BARRE?.enPartie?.(true);
    fermerVoile();
    $('prepa').style.display = 'none';
    $('jeu').classList.add('on');
    // Les bâches se posent avec l'arène : voir `entrerEnTribune`.
    if (commence) poserBaches();
    placerAnnonce();
    rendreDuel();
  });

  socket.on('nvn:state', (vue) => { S.vue = vue; rendreDuel(); });

  socket.on('nvn:events', (evs) => {
    for (const e of evs ?? []) {
      if (e.seq && e.seq <= S.dernierSeq) continue;
      if (e.seq) S.dernierSeq = e.seq;
      raconter(e);
    }
  });

  socket.on('nvn:error', (e) => {
    S.occupe = false;
    // Un chant refusé ne rendra pas de verdict : la fenêtre n'attend pas.
    S.verdictAttendu?.(null);
    /* **Un refus d'entrer en file** : hors d'un duel, c'est la seule erreur
       que le serveur renvoie (`nvn:queue`), et le joueur n'est dans aucune
       file. Le voile « Dans la file » restait posé par-dessus la
       préparation, et le message qui dit quoi faire (« choisis-en un
       autre ») se lisait sur un écran où l'on ne pouvait rien choisir.
       `quitterFile` dit aussi au serveur de nous oublier : sans effet si
       la file ne nous a jamais pris, et prudent si elle l'a fait. */
    if (S.enFile && !S.vue) {
      quitterFile();
      /* Reporté ou annulé depuis le chargement : la liste du serveur ne le
         porte plus, on la relit plutôt que de le laisser choisi. */
      if (e?.code === 'duel.error.fixture_annule') rechargerMatchs();
    }
    dire(e?.code ?? 'nvn.error.server');
    if (e?.code === 'nvn.error.slot_lost') {
      S.vue = null;
      $('jeu').classList.remove('on');
      $('prepa').style.display = '';
      placerAnnonce();
    }
  });
}

/**
 * La hauteur de la rangée de chants, mesurée plutôt que devinée.
 *
 * Le message d'erreur se pose juste au-dessus d'elle. Elle n'a pas de hauteur
 * fixe : le nom d'un chant passe parfois à deux lignes, et le répertoire change
 * d'une partie à l'autre. Une valeur écrite en dur dans le CSS était juste pour
 * le duel où on l'avait mesurée, et fausse pour les autres.
 *
 * `ResizeObserver` plutôt qu'une mesure au rendu : la rangée change aussi quand
 * l'écran tourne ou qu'une carte devient trop chère, et ces moments-là
 * n'appellent aucune de nos fonctions.
 */
{
  const rangee = $('chants');
  if (rangee && window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty(
        '--chants-h', `${Math.round(rangee.getBoundingClientRect().height)}px`);
    }).observe(rangee);
  }
}

/* ---------------------------------------------- le bandeau d'annonce

   `nav.js` pose le bandeau de l'administration (`.tbf-annonce`) en tête de
   la colonne, ou sous les rangées du HUD quand celles-ci en sont des
   enfants directs. Le duel porte son HUD dans `#jeu` (l'audit le mesure sous
   `#jeu > .score`) : en tête de `#app`, le bandeau passait sous la flèche et
   le menu flottants, qui en couvraient les deux bouts, et en partie il
   repoussait la rangée du HUD de quarante-neuf pixels hors de leurs cases.
   **La page le range donc elle-même** : sous le titre en préparation, sous
   le HUD en partie — où c'est l'arène qui cède la place, jamais la main ni
   les chants. Il arrive en différé (une lecture des réglages) : on le
   guette à son arrivée dans la colonne, puis à chaque changement d'écran.

   **Sous les deux rangées du HUD, et non entre elles**, comme au Virage
   (`nav.js`) : la seconde (`#filLigne`, le ticket terrain) est la suite de
   la première, et le score du vrai match se lisait sous un message de
   l'administration au lieu de sous celui de la corde. Avant le coup d'envoi
   la rangée est cachée : le bandeau la suit quand même, et l'ordre reste
   juste quand elle paraît. */
function placerAnnonce() {
  const b = $('app').querySelector('.tbf-annonce');
  if (!b) return;
  const jeu = $('jeu');
  let apres = jeu.classList.contains('on')
    ? jeu.querySelector(':scope > .tbf-hudm')
    : $('prepa').querySelector(':scope > .top');
  if (apres?.matches('.tbf-hudm') && apres.nextElementSibling?.id === 'filLigne') {
    apres = apres.nextElementSibling;
  }
  if (apres && apres.nextElementSibling !== b) apres.after(b);
  // L'arène lui cède sa place sous son plancher ordinaire : voir la feuille.
  const enJeu = b.parentElement === jeu;
  if (jeu.hasAttribute('data-annonce') !== enJeu) jeu.toggleAttribute('data-annonce', enJeu);
}
new MutationObserver(() => placerAnnonce()).observe($('app'), { childList: true });

function entrerEnFile() {
  if (!S.fixtureId) return toast('Choisis d\u2019abord un match support.');
  if (!socket?.connected) return toast('Pas de connexion au serveur.');
  presentsAvant = 0;
  socket.emit('nvn:queue',
    { format:S.format, fixtureId:S.fixtureId, camp:S.camp ?? 0, souple:S.souple });
  S.enFile = true;
  voile('Dans la file', 'Recherche d\u2019adversaires…',
    { texte:'Quitter la file', action: quitterFile });
}

function quitterFile() {
  socket?.emit('nvn:leave_queue');
  S.enFile = false;
  clearInterval(reboursTimer);
  reboursTimer = null;
  // Rien ne joue en préparation : la rumeur du vestiaire se tait.
  window.TBF_SON?.ambiance?.(0);
  fermerVoile();
}

/**
 * **L'entrée en tribune** (lot 6) : l'affiche se retire, les bâches du HUD se
 * posent et la rumeur monte du vestiaire à la tribune pleine (`son.js`,
 * « entree »). Une fois, au coup d'envoi ; ensuite, le rendu tient la phase
 * « jeu ». Le son ne dit rien que l'écran ne montre déjà.
 *
 * **Les bâches se posent quand on les découvre, une fois.** Elles se posent
 * avec l'arène, au coup d'envoi (`nvn:start`) ; l'affiche les couvre alors,
 * et elles se reposent quand elle se retire (`reposer`). Sans affiche — un
 * serveur qui ne l'enverrait pas —, l'entrée de repli ne joue que la rumeur :
 * reposées une seconde et demie après, sous les yeux du joueur, elles
 * s'éteignaient et revenaient d'une opacité nulle, un clignement que rien
 * n'expliquait (relevé pâle à 0,45 au banc, à 360 comme à 320).
 */
const ENTREE_MS = 1500;
function poserBaches() {
  for (const b of document.querySelectorAll('#jeu .tbf-hudm-club')) {
    b.classList.remove('tbf-colle');
    void b.offsetWidth;
    b.classList.add('tbf-colle');
  }
}
function entrerEnTribune(reposer = false) {
  clearTimeout(S.entreeT);
  if (S.entree || !S.vue || S.vue.termine) { S.entree = true; return; }
  S.entree = true;
  window.TBF_SON?.rumeur?.('entree', { ms: ENTREE_MS });
  if (reposer) poserBaches();
  entrerFz();
}

/* ------------------------------------------------------- affichage */

/**
 * Le stade du duel, monté une seule fois.
 *
 * Le duel se jouait sur un fond noir uni, pendant que le Grand Virage montrait
 * le lieu de la rencontre. Même mécanique, même corde, deux décors — et rien ne
 * disait au joueur que c'était le même jeu.
 *
 * Le lieu vient du serveur et ne change pas de tout le duel : on le monte au
 * premier état reçu, et le garde-fou du haut empêche de le remonter à chacune
 * des dix vues par seconde — ce qui rechargerait le dessin en boucle.
 *
 * Les deux couleurs sont celles des camps de l'arène, pas celles des clubs : un
 * duel n'oppose pas deux clubs, il oppose deux tribunes, et le joueur a déjà
 * appris que l'or est chez lui et le bleu en face.
 */
let stade = null;

function monterStade() {
  if (stade || !S.vue?.stade || !window.TBF_STADE) return;
  /* Le camp 0 est le domicile : sa tribune est la mienne quand j'y suis,
     celle d'en face sinon. */
  const chezMoi = (S.vue.moi?.side ?? 0) === 0;
  stade = window.TBF_STADE.monter($('stade'), {
    id: S.vue.stade.id,
    couleurs: chezMoi ? ['var(--projo)', 'var(--bleu)'] : ['var(--bleu)', 'var(--projo)'],
  });
  /* Le nom du lieu, au pied de l'arène. **Ce qu'il change** — depuis que les
     `mods` du stade sont réellement appliqués, un joueur qui ne le lit nulle
     part croit que le jeu lui a retiré du souffle sans raison — est dit en
     entier dans « ce que tu portes » (le « i »), qui nomme le lieu et sa
     phrase : posée sur le terrain, elle prenait la place des supporters. */
  ecrire($('lieu'), S.vue.stade.nom ?? '');
}

/* Les statuts que l'API donne à un match en train de se jouer, et ceux
   d'une pause. Une horloge qui tourne à la mi-temps ment aussi sûrement
   qu'une horloge arrêtée pendant le jeu. */
const EN_JEU = ['1H', '2H', 'ET', 'LIVE'];
const EN_PAUSE = ['HT', 'BT', 'P', 'SUSP', 'INT'];

/**
 * Le ticket terrain (`.tbf-ticket--terrain`, la brique du lot 6).
 *
 * Il ne paraît qu'une fois le match commencé : avant le coup d'envoi, un
 * « 0 – 0 · TERRAIN » n'apprend rien et prend la place de l'arène. Sa rangée
 * entière se retire alors, et l'arène reprend ses trente pixels.
 *
 * Le score est orienté comme partout ailleurs dans le jeu — le sien à
 * gauche — parce qu'un joueur qui lit « 1 – 0 » doit savoir sans réfléchir
 * si c'est lui qui mène. Le camp 0 étant la maison des deux côtés
 * (`coteDe`), l'orientation se fait avec le même index que la corde. La
 * minute est à l'encre, sur sa pastille ; en pause, elle se tait et le mot
 * de la phase (« MI-TEMPS ») le dit.
 */
function rendreFilMatch(v, mon) {
  const ligne = $('filLigne');
  if (!ligne) return;
  const sc = v.scoreReel;
  const statut = v.statutReel;
  const commence = Array.isArray(sc)
    && (EN_JEU.includes(statut) || EN_PAUSE.includes(statut)
      || ['FT', 'AET', 'PEN'].includes(statut));
  if (ligne.hidden === Boolean(commence)) ligne.hidden = !commence;
  if (!commence) return;

  ecrire($('filMatchScore'), `${sc[mon] ?? 0} – ${sc[mon ^ 1] ?? 0}`);

  const enJeu = EN_JEU.includes(statut);
  ecrire($('filMatchMin'), enJeu ? minuteTerrain(v.minuteReelle, true) : '');

  ecrire($('filMatchQui'), PHASE_REELLE[statut] ?? '');
}

/**
 * La minute du terrain, avancée localement entre deux relevés.
 *
 * On retient l'instant où le serveur a donné cette minute-là, et on y
 * ajoute les minutes écoulées depuis. Le repère se réarme dès que le
 * serveur en donne une autre — un but réel — donc la dérive ne s'accumule
 * jamais au-delà d'un duel.
 */
let repereMinute = null;

function minuteTerrain(minute, enJeu) {
  if (minute == null) { repereMinute = null; return ''; }
  if (!repereMinute || repereMinute.minute !== minute) {
    repereMinute = { minute, depuis: Date.now() };
  }
  const ecoulees = enJeu
    ? Math.floor((Date.now() - repereMinute.depuis) / 60000)
    : 0;
  return `${minute + ecoulees}′`;
}

/* Les mêmes mots qu'au Virage : deux écrans qui décrivent la même
   rencontre ne doivent pas la nommer autrement. */
const PHASE_REELLE = {
  '1H': 'COUP D’ENVOI', HT: 'MI-TEMPS', '2H': 'REPRISE',
  BT: 'FIN DU TEMPS RÉGLEMENTAIRE', ET: 'PROLONGATION', P: 'TIRS AU BUT',
  FT: 'FIN DU MATCH', AET: 'FIN APRÈS PROLONGATION', PEN: 'FIN AUX TIRS AU BUT',
  SUSP: 'MATCH SUSPENDU', INT: 'MATCH INTERROMPU',
};

/* ------------------------------------------------------- ce que je porte

   Le jumeau de celui du Grand Virage, à ceci près que le duel a un état par
   vue plutôt qu'un état fusionné. Le contenu vient de `mods.js` : la ligne dit
   combien, le panneau dit quoi.

   **Le panneau ouvert ne se redessine pas à chaque vue.** Le serveur en envoie
   plusieurs par seconde, et réécrire son `innerHTML` à ce rythme remplacerait
   les nœuds sous le doigt qui défile. On ne le remonte donc que quand ce qu'on
   porte change vraiment — à l'entrée, à une Relève qui change de personnage
   actif, et à la pose ou l'expiration d'un effet de carte. L'empreinte est la
   comparaison la plus simple qui soit juste : les deux objets viennent du
   serveur, ils sont petits, et leur ordre de clés est stable. */
let apportsVus = null;

function rendreApports(moi) {
  const M = window.TBF_MODS;
  const ligne = $('apportsL'), panneau = $('apportsP');
  /* Sans `mods.js`, on ne montre rien plutôt que des clés brutes : c'est un
     supplément d'information, et son absence ne doit pas se voir — et surtout
     pas lever au milieu d'un duel. */
  if (!M || !ligne || !panneau) return;

  const apports = moi?.apports ?? [];
  const { plus, moins, texte } = M.resume(apports);
  if (!texte) { ligne.hidden = true; panneau.hidden = true; return; }
  ligne.hidden = false;

  const empreinte = JSON.stringify([apports, moi?.mods ?? null]);
  if (empreinte === apportsVus) return;
  apportsVus = empreinte;
  /* **Une plaque ronde « i »** (lot 6) : le compte des bonus et des malus
     passe dans ce que la plaque dit au lecteur d'écran — l'œil, lui, ouvre
     le panneau, qui nomme chacun. */
  ligne.setAttribute('aria-label', ['Ce que tu portes',
    plus ? `${plus} bonus` : '', moins ? `${moins} malus` : ''].filter(Boolean).join(' — '));
  if (!panneau.hidden) panneau.innerHTML = M.panneauHTML(apports, moi?.mods);
}

$('apportsL').onclick = () => {
  const panneau = $('apportsP'), ligne = $('apportsL');
  const moi = S.vue?.moi;
  const ouvre = panneau.hidden;
  if (ouvre) panneau.innerHTML = window.TBF_MODS.panneauHTML(moi?.apports ?? [], moi?.mods);
  panneau.hidden = !ouvre;
  ligne.setAttribute('aria-expanded', String(ouvre));
};
/* Le panneau se referme d'un toucher ailleurs : posé hors de la colonne,
   au-dessus de la main, il ne doit pas rester sur les cartes qu'on vise. */
document.addEventListener('pointerdown', (e) => {
  const panneau = $('apportsP');
  if (panneau.hidden || e.target.closest('#apportsP, #apportsL')) return;
  panneau.hidden = true;
  $('apportsL').setAttribute('aria-expanded', 'false');
});

/* ----------------------------------------------- des nœuds qui durent

   **Un conteneur réécrit dix fois par seconde ne garde rien de vivant.**

   `rendreDuel` passe à chaque vue du serveur, c'est-à-dire dix fois par
   seconde, et réécrivait en `innerHTML` les effets, l'équipe et la main.
   Chaque vue jetait donc les cinq cartes et les trois portraits pour en
   poser des neufs, identiques à l'œil. Trois choses en mouraient sans bruit :

     — **les animations.** fx.js fait respirer chaque portrait ; un portrait
       remplacé tous les dixièmes de seconde repartait de zéro à chaque vue,
       c'est-à-dire ne respirait jamais ;
     — **le focus et l'appui.** Un doigt posé sur une carte la voyait
       remplacée entre l'appui et le relâchement, et le clic tombait sur un
       nœud qui n'était plus dans la page ;
     — **le réseau.** Un dessin absent se retire de lui-même (`onerror`) : il
       revenait à la vue suivante, et se redemandait dix fois par seconde.

   Chaque élément est donc **créé une fois, retrouvé par sa clé, modifié en
   place**, et retiré seulement quand sa clé disparaît. Le rendu est le même
   à l'écran — mêmes classes, mêmes attributs, même ordre — mais les nœuds
   restent. Le Grand Virage a le même besoin pour sa rangée d'actions : voir
   `accorder` dans virage.html, écrite de la même façon.

   La clé est une propriété du nœud (`_cle`) et non un attribut : elle ne se
   voit pas dans la page, et un nœud retiré par ailleurs emporte la sienne,
   si bien que le rendu suivant ne peut pas se tromper sur ce qui est là. */

/**
 * Accorde les enfants de `boite` à une liste de clés, dans cet ordre.
 *
 * `creer(cle, i)` fabrique le nœud d'une clé neuve ; `maj(el, cle, i)` le met
 * à jour en place, à chaque passage — il ne doit écrire que ce qui change.
 * Un nœud n'est déplacé que s'il n'est pas à sa place : déplacer un élément
 * lui fait perdre le focus, et c'est justement ce qu'on protège.
 */
function accorder(boite, cles, creer, maj) {
  const gardes = new Map();
  for (const el of [...boite.children]) {
    if (el._cle != null && cles.includes(el._cle) && !gardes.has(el._cle)) gardes.set(el._cle, el);
    else el.remove();
  }
  cles.forEach((cle, i) => {
    let el = gardes.get(cle);
    if (!el) { el = creer(cle, i); el._cle = cle; }
    maj(el, cle, i);
    if (boite.children[i] !== el) boite.insertBefore(el, boite.children[i] ?? null);
  });
}

/** Un nœud depuis son balisage : les gabarits de la page restent lisibles.
    « fabriquer » et non « noeud » : la page a un élément #noeud, et une
    fonction globale du même nom masquerait son accès par window. */
function fabriquer(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/**
 * Des clés uniques pour une liste qui peut se répéter.
 *
 * Un deck peut porter deux fois la même carte — le deck de test porte deux
 * Arbitres — et une main peut donc les avoir ensemble. « a-arbitre#0 » et
 * « a-arbitre#1 » restent deux cartes, chacune avec son nœud.
 */
function clesDe(ids) {
  const vus = new Map();
  return ids.map((id) => {
    const n = vus.get(id) ?? 0;
    vus.set(id, n + 1);
    return `${id}#${n}`;
  });
}

/** N'écrit un texte que s'il a changé : réécrire le même texte recrée le nœud. */
function ecrire(el, texte) {
  const t = String(texte);
  if (el && el.textContent !== t) el.textContent = t;
}

function rendreDuel() {
  const v = S.vue;
  if (!v) return;
  /* **La rumeur de la tribune** (le moteur commun, `son.js`) : la phase
     « jeu » tant que le duel se joue, « fin » quand il est fini — la tribune
     se vide alors en fondu au lieu de se couper. La commande se répète sans
     rien déranger, dix fois par seconde, ce qui couvre la reprise après une
     coupure et un moteur arrivé après la première vue (`fx.js` le charge en
     différé). Une poussée ou un but courent par-dessus sans être effacés.
     **Pas avant l'entrée** (voir `S.entree`) : posée d'abord, la phase ferait
     monter la rumeur au pas ordinaire, et l'entrée ne s'entendrait plus. Le
     son se coupe au tiroir (mode calme) : le bouton de l'arène est parti. */
  if (S.entree) window.TBF_SON?.rumeur?.(v.termine ? 'fin' : 'jeu');
  const moi = v.moi;
  const mon = moi?.side ?? 0;
  const eux = mon ^ 1;

  /* Chaque vue arrive dix fois par seconde : on n'écrit que ce qui a changé.
     Voir « des nœuds qui durent », juste au-dessus. */
  ecrire($('butsMoi'), v.goals?.[mon] ?? 0);
  ecrire($('butsEux'), v.goals?.[eux] ?? 0);
  /* Le club de chaque tribune, en petit sous « TA TRIBUNE » et « EN FACE » —
     le nom court : la bâche n'a que soixante-sept pixels de texte. Sans club
     connu, la ligne ne se pose pas. */
  const clubs = [v.fixture?.home?.name, v.fixture?.away?.name];
  for (const [id, nom] of [['clubMoi', clubs[mon]], ['clubEux', clubs[eux]]]) {
    const el = $(id);
    const court = nom ? nomCourt(nom) : '';
    ecrire(el, court);
    if (el.hidden === Boolean(court)) el.hidden = !court;
  }
  rendreFilMatch(v, mon);
  const s = Math.max(0, Math.round((v.resteMs ?? 0) / 1000));
  ecrire($('horloge'), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
  /* CLASSÉ en face d'or — la seule hors achat : c'est l'enjeu ; à
     l'entraînement, le sticker est de craie. Sans mode servi, rien. */
  const tag = $('modeTag');
  if (tag.dataset.mode !== (v.mode ?? '')) {
    tag.dataset.mode = v.mode ?? '';
    tag.hidden = !v.mode;
    /* Deux formes, comme les libellés du HUD : sous 390 px, « ENTRAÎNEMENT »
       entier écrasait les deux bâches de part et d'autre de la plaque. */
    if (v.mode === 'classe') { tag.textContent = 'CLASSÉ'; tag.dataset.ton = 'or'; }
    else {
      tag.innerHTML = v.mode ? '<span class="long">ENTRAÎNEMENT</span>'
        + '<span class="court" aria-hidden="true">ENTRAÎN.</span>' : '';
      tag.removeAttribute('data-ton');
    }
  }

  monterStade();
  poserCouleursDuDuel(v);
  rendreApports(moi);

  /* **La corde** (`.tbf-corde`, `.tbf-maree`, les briques). Le moteur compte
     positif vers le camp 1 ; on l'oriente pour que « vers la droite » veuille
     toujours dire « ta tribune avance ». Une seule variable, `--corde`, de −1
     à 1, posée sur l'arène : la marée, la progression et le foulard la lisent
     tous trois. Elle ne s'écrit que quand elle change. */
  const sens = mon === 0 ? -1 : 1;
  const part = Math.max(-1, Math.min(1, (v.rope ?? 0) / 300)) * sens;
  const arene = $('arene');
  const corde = part.toFixed(3);
  if (arene.style.getPropertyValue('--corde') !== corde) arene.style.setProperty('--corde', corde);
  /* Les buts de corde, en crans près de la ligne du camp qui les a marqués :
     un nœud par but, ajouté ou retiré. */
  poserCrans($('cransMoi'), v.goals?.[mon] ?? 0);
  poserCrans($('cransEux'), v.goals?.[eux] ?? 0);

  // L'écart en clair, en banderole. Le chiffre se lit plus vite que la position.
  const avance = Math.round(Math.abs(v.rope ?? 0));
  const ec = $('ecart');
  ecrire(ec.firstChild, avance === 0 ? '0' : `${part > 0 ? '+' : '−'}${avance}`);
  ecrire(ec.querySelector('small'), avance === 0 ? 'ÉGALITÉ'
    : part > 0 ? 'TU MÈNES LA CORDE' : 'ILS TIRENT PLUS FORT');

  dessinerFoule('fouleMoi', v.equipes?.[mon] ?? []);
  dessinerFoule('fouleEux', v.equipes?.[eux] ?? []);
  rendreFzArene(v);
  rendreObjets(v);

  if (!moi) return;

  /* Le souffle : l'écharpe fine bleue, et un cran à chaque coût des cartes
     en main — chants et actions —, pour que l'œil voie quelle carte le
     souffle paie déjà. Un cran que le souffle vient de franchir claque. */
  const souffle = Math.max(0, Math.min(100, moi.breath ?? 0));
  $('souffleBar').style.width = `${souffle}%`;
  ecrire($('souffleVal'), moi.breath ?? 0);
  const couts = new Set([
    ...(v.chants ?? []).map((c) => Number(c.cost)),
    ...(moi.main ?? []).map((id) => Number(carteDef(id)?.cost)),
  ].filter((c) => Number.isFinite(c) && c > 0 && c <= 100));
  poserCoutsSouffle($('souffleJauge'), [...couts].sort((a, b) => a - b), souffle);

  // Les effets en cours, nommés : sans ça, un joueur silencié croit à un bug.
  const NOMS = {
    silence:['Silence radio','var(--flare)'], blind:['Brouillard','var(--violet)'],
    lock_actions:['Parcage fermé','var(--flare)'], shield:['Bâche','var(--gris)'],
    reflect:['Renvoi armé','var(--vert)'], mod_self:['Modificateur','var(--craie)'],
    mod_foe:['Vent de face','var(--violet)'], breath_mult:['Souffle ralenti','var(--flare)'],
    floor_quality:['Second souffle','var(--craie)'], peut_changer:['Changement possible','var(--vert)'],
  };
  /* Les rangées qui suivent passent par `accorder` : voir « des nœuds qui
     durent », juste au-dessus. Posées une fois et retouchées en place. */
  const effets = moi.effets ?? [];
  accorder($('effets'), clesDe(effets.map((e) => e.type)),
    () => fabriquer('<span class="tbf-lisere"></span>'),
    (el, _cle, i) => {
      const e = effets[i];
      const [nom, c] = NOMS[e.type] ?? [e.type, 'var(--gris)'];
      const reste = e.reste ? ` ${Math.ceil(e.reste / 1000)}s` : '';
      if (el._c !== c) { el._c = c; el.style.setProperty('--c', c); }
      ecrire(el, `${nom}${reste}`);
    });

  rendreEquipe(moi, effets);
  rendreMain(moi, effets);
  rendreChants(v);

  if (v.termine) finir(v);
}

/** Un cran par but, près de la ligne du camp : les nœuds ajoutés ou retirés
    un à un, jamais réécrits. */
function poserCrans(boite, n) {
  if (!boite) return;
  const voulu = Math.max(0, Math.min(9, Number(n) || 0));
  while (boite.children.length > voulu) boite.lastElementChild.remove();
  while (boite.children.length < voulu) boite.appendChild(document.createElement('i'));
}

/** Les crans du souffle, un par coût distinct (`.tbf-jauge-cout`), sans
    toucher au remplissage (`#souffleBar`), premier enfant de la jauge. */
let souffleAvant = null;
function poserCoutsSouffle(jauge, couts, souffle) {
  if (!jauge) return;
  const presents = new Map([...jauge.querySelectorAll('.tbf-jauge-cout')].map((c) => [Number(c.dataset.cout), c]));
  for (const [cout, el] of presents) if (!couts.includes(cout)) el.remove();
  for (const cout of couts) {
    let el = presents.get(cout);
    if (!el) {
      el = document.createElement('span');
      el.className = 'tbf-jauge-cout';
      el.dataset.cout = String(cout);
      el.style.setProperty('--cran', `${cout}%`);
      el.addEventListener('animationend', () => el.classList.remove('claque'));
      jauge.appendChild(el);
    }
    if (souffleAvant !== null && souffleAvant < cout && souffle >= cout) {
      el.classList.remove('claque');
      void el.offsetWidth;
      el.classList.add('claque');
    }
  }
  souffleAvant = souffle;
}

/* ------------------------------------------------------ l'équipe

   **Trois cartes 2:3 sur leur plaque de rareté** (lot 6) : l'active levée,
   en couleur, avec le halo de son camp ; le banc plus bas et grisé ;
   « Changement possible » décolle les cartes du banc, qui pulsent vert.
   **Par place et non par personnage** : une Relève change l'âge — donc
   l'identifiant — du Fanzzy en jeu, pas sa place dans l'équipe.

   **Seul celui qui est en tribune respire.** `fx.js` fait respirer tout
   portrait ; trois portraits, dix cartes et le reste de l'écran faisaient
   bien plus que les trois animations sans fin qu'un écran tolère. Le banc
   porte `data-fige` (le crochet de `fx.js`), posé et retiré à chaque
   changement. */
function rendreEquipe(moi, effets) {
  const peutChanger = effets.some((e) => e.type === 'peut_changer');
  const silence = effets.find((e) => e.type === 'silence');
  const fanzzy = moi.fanzzy ?? [];
  accorder($('equipe'), fanzzy.map((_, i) => `place#${i}`),
    () => fabriquer(`<div class="fz tbf-carte tbf-carte--fanzzy"><span class="vig"></span>
      <span class="tbf-vh nom"></span><b class="tbf-carte-nom etat"></b></div>`),
    (el, _cle, i) => {
      const f = fanzzy[i];
      /* Un légendaire dort sur le banc jusqu'à ses chants réussis
         (`shared/legende.js`) : il n'entre qu'éveillé. */
      const lg = moi.legende;
      const dort = Boolean(f.legende && lg && !lg.eveillee);
      const entre = !f.actif && peutChanger && !dort;
      el.classList.toggle('actif', Boolean(f.actif));
      el.classList.toggle('dispo', entre);
      // L'état de la pièce : un seul à la fois, posé seulement s'il change.
      const etat = f.actif ? 'active' : entre ? 'dispo' : 'banc';
      if (el.dataset.etat !== etat) el.dataset.etat = etat;
      if (entre) { if (el.dataset.entrer !== String(i)) el.dataset.entrer = i; }
      else if (el.hasAttribute('data-entrer')) el.removeAttribute('data-entrer');
      /* La plaque de sa rareté (`TBF_FOND`, lot 4), et le liseré de même :
         la rareté, sinon l'âge, comme toute carte du jeu. */
      const decor = { rar: f.rar, stage: f.stade ?? f.stage };
      const rar = window.TBF_FOND?.palierDecor?.(decor) ?? 'commune';
      if (el.dataset.rar !== rar) {
        // `data-rar` pose le liseré (`--rar`) : la feuille le tire seule.
        el.dataset.rar = rar;
        const plaque = window.TBF_FOND?.plaqueCarte?.(decor);
        if (plaque) el.style.setProperty('--plaque', `url("${plaque}")`);
        else el.style.removeProperty('--plaque');
      }
      /* Le portrait n'est reposé que si son dessin change — une Relève. */
      const dessin = vignette(f);
      const vig = el.querySelector('.vig');
      if (el._dessin !== dessin) { el._dessin = dessin; vig.innerHTML = dessin; }
      if (f.actif) { if (vig.hasAttribute('data-fige')) vig.removeAttribute('data-fige'); }
      else if (!vig.hasAttribute('data-fige')) vig.setAttribute('data-fige', '');
      ecrire(el.querySelector('.nom'), f.nom ?? f.id);
      if (el.title !== (f.nom ?? f.id)) el.title = f.nom ?? f.id;
      ecrire(el.querySelector('.etat'), f.actif ? 'EN JEU' : entre ? 'ENTRER'
        : dort ? `ÉVEIL ${lg.reussis}/${lg.seuil}` : 'BANC');
      /* « Silence radio » : la bouche barrée au marqueur, sur le visage de
         celui qui chante — l'active. Son chrono en anneau. */
      let bouche = el.querySelector(':scope > .tbf-effet[data-effet=silence]');
      if (f.actif && silence) {
        if (!bouche) {
          bouche = fabriquer(`<span class="tbf-effet" data-effet="silence" aria-hidden="true">
            <span class="tbf-recharge"></span></span>`);
          el.appendChild(bouche);
        }
        poserAnneau(bouche.querySelector('.tbf-recharge'), partDe('moi:silence', silence));
      } else if (bouche) bouche.remove();
    });
  /* Le nom de celui qui est en tribune, et sa spécialité : la carte n'a pas
     la place de l'écrire, et c'est lui qui chante. */
  const actif = fanzzy.find((f) => f.actif);
  const nom = $('fzNom');
  if (!actif) { ecrire(nom, ''); return; }
  if (!nom.firstChild || nom.firstChild.nodeType !== 3) {
    nom.replaceChildren(document.createTextNode(''), document.createElement('small'));
  }
  ecrire(nom.firstChild, actif.nom ?? actif.id);
  ecrire(nom.lastChild, moi.sienGeste ? (LABEL_GESTE[moi.sienGeste] ?? moi.sienGeste) : '');
}

/* ------------------------------------------------------ la main

   **La main d'actions, en éventail** (`.tbf-carte--action`,
   `.tbf-eventail`, les briques du lot 6). Le dessin plein, le coût en
   sticker rond, le nom sur sa bande d'encre ; **injouable**, un scotch en
   croix sur le dessin et le sticker de ce qui manque (« −8 ») — jamais sur
   le libellé ; **en recharge**, le scotch translucide qui se retire de haut
   en bas et le chiffre restant ; **aveugle** (Brouillard), le dos de la
   carte ; **Parcage fermé**, la croix posée sur toute la main.

   `.ct`, `.illu`, `.sceau` et `data-jouer` restent : la page et `nvn:ui` les
   lisent. Le dessin d'une carte d'action est figé d'office
   (`TBF_ACTION.illustration`) : cinq dessins qui respirent feraient cinq
   animations sans fin. */
function rendreMain(moi, effets) {
  const main = moi.main ?? [];
  const cd = moi.cooldowns ?? {};
  const enJeu = (moi.fanzzy ?? []).find((f) => f.actif);
  const verrou = effets.some((e) => e.type === 'lock_actions');
  const places = Array.from({ length: 5 }, (_, i) => main[i] ?? null);
  const cartesCles = clesDe(places.map((id, i) => id ?? `vide@${i}`));
  accorder($('mainCartes'),
    moi.aveugle ? places.map((_, i) => `aveugle#${i}`) : cartesCles,
    (cle, i) => {
      if (moi.aveugle) {
        return fabriquer(`<div class="ct tbf-carte tbf-carte--action" data-etat="aveugle">
          <span class="tbf-vh">carte cachée</span></div>`);
      }
      if (!places[i]) return fabriquer('<div class="ct tbf-carte tbf-carte--action" data-etat="vide"></div>');
      // Glyphe de famille en fond, dessin par-dessus : une carte dont le fichier
      // manque garde son repère au lieu d'un carré vide.
      return fabriquer(`<div class="ct tbf-carte tbf-carte--action">
        <svg class="sceau" viewBox="0 0 24 24"><path d=""/></svg>
        <b class="nm tbf-carte-nom"></b>
        <span class="co tbf-sticker tbf-sticker--rond tbf-carte-cout"></span>
        <span class="tbf-carte-recharge"><b></b></span>
        <span class="tbf-sticker tbf-carte-manque" data-ton="flare"></span>
      </div>`);
    },
    (el, _cle, i) => {
      const id = places[i];
      if (moi.aveugle || !id) return;
      const a = carteDef(id);
      const fam = famDe(a);
      const reste = Number(cd[id]) || 0;
      // La Relève ne sert à rien si le Fanzzy en tribune est déjà à son dernier
      // âge débloqué. On la grise plutôt que de la laisser jouer pour rien : le
      // serveur la refuserait, mais après le geste — donc après l'espoir.
      const sansReleve = a?.condition?.evolution
        && !(enJeu?.ages ?? [])[enJeu?.stade ?? 1];
      const manque = a && moi.breath < a.cost ? a.cost - Math.floor(moi.breath) : 0;
      const jouable = Boolean(a && !manque && !reste && !sansReleve && !verrou);
      if (!jouable) { if (el.hasAttribute('data-jouer')) el.removeAttribute('data-jouer'); }
      else if (el.dataset.jouer !== id) el.dataset.jouer = id;
      /* Un état à la fois : injouable faute de souffle ou d'âge ; la carte
         qu'on vient de jouer garde son décollement le temps qu'elle parte. */
      const etat = el._joueeA && performance.now() - el._joueeA < 400 ? 'jouee'
        : (manque || sansReleve) ? 'injouable' : '';
      if ((el.dataset.etat ?? '') !== etat) {
        if (etat) el.dataset.etat = etat; else el.removeAttribute('data-etat');
      }
      ecrire(el.querySelector('.tbf-carte-manque'), manque ? `−${manque}` : '');
      if (el._fc !== fam.c) { el._fc = fam.c; el.style.setProperty('--fc', fam.c); }
      // Le cadre de sa rareté : `data-rar` suffit, la feuille en tire `--rar`.
      const rar = a?.rar ?? 'commune';
      if (el.dataset.rar !== rar) el.dataset.rar = rar;
      const trace = el.querySelector('.sceau path');
      if (trace.getAttribute('d') !== fam.ico) trace.setAttribute('d', fam.ico);
      /* Le dessin est posé une seule fois, dès que la carte est connue. S'il
         manque, il se retire lui-même et ne revient pas : la carte garde son
         glyphe, et le fichier absent n'est plus redemandé à chaque vue. */
      if (a && !el._dessin) {
        el._dessin = true;
        el.querySelector('.sceau').insertAdjacentHTML('afterend', window.TBF_ACTION.illustration(a.id));
      }
      ecrire(el.querySelector('.co'), a?.cost ?? '?');
      ecrire(el.querySelector('.nm'), a?.nom ?? id);
      /* La recharge : la part du délai qui reste, sur le délai de la carte
         (`cd`, en secondes, au catalogue), et le chiffre restant. */
      const rech = el.querySelector('.tbf-carte-recharge');
      const h = reste && a?.cd ? `${Math.min(100, Math.round((reste / a.cd) * 100))}%` : reste ? '100%' : '0%';
      if (rech.style.getPropertyValue('--h') !== h) rech.style.setProperty('--h', h);
      ecrire(rech.firstChild, reste ? Math.ceil(reste) : '');
    });
}

/* ------------------------------------------------- les effets sur l'arène

   **Ce qui pèse sur un camp devient un objet** (`.tbf-effet`, la brique du
   lot 6) : la bâche devant la tribune qu'elle protège, le brouillard sur la
   moitié qui ne voit plus, les flèches de vent vers le camp qui le subit,
   la croix du parcage sur la main. Chacun porte son chrono en anneau : ce
   qui reste sur la durée (`reste / duree`, servis tous deux, § 17).

   **Les deux camps se lisent dans la vue** : `equipes[][].effets` dit ce
   que porte chaque joueur, des deux côtés — la bâche d'un coéquipier devant
   ma tribune, le brouillard qu'on vient de jouer sur leur moitié, le vent
   qui souffle vers eux. Plusieurs joueurs d'un camp qui portent le même
   effet font un seul objet, celui qui dure le plus.

   **Le repli d'un serveur d'avant** : sans `duree`, la durée est la plus
   longue qu'on ait vue depuis la pose (un effet renouvelé repart plein) ;
   sans les effets de chaque joueur, mon camp se lit dans `moi.effets` et
   celui d'en face dans les évènements (`S.chezEux`) — seul le brouillard
   y arrive avec sa durée. */
const OBJET_DE = { shield: 'bache', blind: 'brouillard', mod_foe: 'vent' };
const durees = new Map();
/** La part qui reste d'un effet, de 1 à 0, ou `null` sans échéance. */
function partDe(cle, e) {
  const reste = Number(e?.reste);
  if (!(reste > 0)) { durees.delete(cle); return null; }
  const servie = Number(e?.duree);
  if (servie > 0) { durees.delete(cle); return Math.max(0, Math.min(1, reste / servie)); }
  const d = Math.max(durees.get(cle) ?? 0, reste);
  durees.set(cle, d);
  return Math.max(0, Math.min(1, reste / d));
}
/** L'anneau d'un chrono : `--part`, ce qui reste ; caché sans durée. */
function poserAnneau(anneau, part) {
  if (!anneau) return;
  /* `display` et non `hidden` : la pièce pose son propre `display`, qui
     l'emporte sur l'attribut. */
  const cache = part === null ? 'none' : '';
  if (anneau.style.display !== cache) anneau.style.display = cache;
  if (part === null) return;
  const p = part.toFixed(3);
  if (anneau.style.getPropertyValue('--part') !== p) anneau.style.setProperty('--part', p);
}

/** Ce que porte un camp, un effet par type : celui qui dure le plus
    (sans échéance, il l'emporte — une bâche tient jusqu'à ce qu'elle cède). */
function effetsDuCamp(listes) {
  const parType = new Map();
  for (const e of listes.flat()) {
    if (!e?.type) continue;
    const avant = parType.get(e.type);
    const dure = (x) => (Number(x?.reste) > 0 ? Number(x.reste) : Infinity);
    if (!avant || dure(e) > dure(avant)) parType.set(e.type, e);
  }
  return [...parType.values()];
}

function rendreObjets(v) {
  const moi = v?.moi;
  const mon = moi?.side ?? 0;
  const equipes = v?.equipes ?? [];
  /* La vue porte-t-elle les effets de chaque joueur ? Un serveur d'avant ne
     les sert pas : la page retombe alors sur ce qu'elle sait. */
  const servis = equipes.some((eq) => (eq ?? []).some((j) => Array.isArray(j?.effets)));
  const liste = [];
  const poser = (cote, effets, cle) => {
    for (const e of effets) {
      const effet = OBJET_DE[e.type];
      if (!effet) continue;
      liste.push({ cle: `${effet}@${cote}`, effet, cote, part: partDe(`${cle}:${e.type}`, e) });
    }
  };
  if (servis) {
    poser('moi', effetsDuCamp([moi?.effets ?? [], ...(equipes[mon] ?? []).map((j) => j?.effets ?? [])]), 'moi');
    poser('eux', effetsDuCamp((equipes[mon ^ 1] ?? []).map((j) => j?.effets ?? [])), 'eux');
  } else {
    poser('moi', moi?.effets ?? [], 'moi');
    const t = performance.now();
    for (const [type, x] of S.chezEux) {
      const reste = x.fin - t;
      const effet = OBJET_DE[type];
      if (reste <= 0 || !effet) { S.chezEux.delete(type); continue; }
      liste.push({ cle: `${effet}@eux`, effet, cote: 'eux', part: Math.max(0, Math.min(1, reste / x.duree)) });
    }
  }
  const deuxVents = liste.filter((o) => o.effet === 'vent').length > 1;
  accorder($('effetsArene'), liste.map((o) => o.cle),
    () => fabriquer('<div class="tbf-effet" aria-hidden="true"><span class="tbf-recharge"></span></div>'),
    (el, _cle, i) => {
      const o = liste[i];
      if (el.dataset.effet !== o.effet) el.dataset.effet = o.effet;
      /* Le vent souffle **vers** le camp qui le subit ; les autres se posent
         chez lui. Son chrono se pose d'où il part, à la queue des flèches :
         au coin droit quand il souffle vers moi, au gauche vers eux — deux
         anneaux au même coin ne se rattachaient plus à rien. Deux vents à la
         fois : celui qui souffle vers eux passe sous la corde, sans quoi les
         flèches se croiseraient. */
      if (o.effet === 'vent') {
        const sens = o.cote === 'moi' ? 'gauche' : 'droite';
        if (el.dataset.sens !== sens) el.dataset.sens = sens;
        const haut = deuxVents && o.cote === 'eux' ? '58%' : '';
        if (el.style.top !== haut) el.style.top = haut;
        const anneau = el.querySelector('.tbf-recharge');
        const gauche = sens === 'droite' ? '0px' : '';
        if (anneau && anneau.style.left !== gauche) {
          anneau.style.left = gauche;
          anneau.style.right = gauche ? 'auto' : '';
        }
      }
      if (el.dataset.tribune !== o.cote) el.dataset.tribune = o.cote;
      poserAnneau(el.querySelector('.tbf-recharge'), o.part);
    });
  const lock = (moi?.effets ?? []).find((e) => e.type === 'lock_actions');
  const parcage = $('parcage');
  if (parcage.hidden === Boolean(lock)) parcage.hidden = !lock;
  if (lock) poserAnneau(parcage.querySelector('.tbf-recharge'), partDe('moi:lock_actions', lock));
}

/**
 * **La foule au pochoir : un supporter par joueur** (`.tbf-foule`, la
 * brique), teint au camp — l'or chez soi, le bleu en face.
 *
 * C'est ce qui remplace le fil de texte. On ne lit plus « michel chante
 * 74 % » : on le voit lever les bras. Le nom reste en infobulle pour qui veut
 * savoir, mais l'information principale — qui pousse, qui est parti, assis
 * — se lit sans un mot. `.tete` reste sur chacun : `nvn:ui` les compte.
 */
function dessinerFoule(id, joueurs) {
  const el = $(id);
  const voulu = joueurs.map((j) => j.userId ?? j.nom).join('|');
  // On ne reconstruit que si l'équipe a changé : sinon on effacerait les
  // supporters en train de sauter à chaque état reçu, dix fois par seconde.
  if (el.dataset.cle !== voulu) {
    el.dataset.cle = voulu;
    el.innerHTML = joueurs.map((j) => `<i class="tete" data-u="${esc(j.userId ?? '')}"
      title="${esc(j.nom ?? '')}"></i>`).join('');
  }
  [...el.children].forEach((t, i) => {
    const j = joueurs[i];
    t.classList.toggle('parti', j?.connecte === false);
    t.classList.toggle('on', j?.connecte !== false);
  });
}

/** Le supporter qui vient de chanter pousse : il lève les bras et saute une
    fois. Pour rejouer le saut, la classe est retirée puis reposée. */
function teteSaute(userId) {
  const t = document.querySelector(`.tete[data-u="${CSS.escape(String(userId))}"]`);
  if (!t) return;
  clearTimeout(t._pousse);
  t.classList.remove('pousse');
  void t.offsetWidth;
  t.classList.add('pousse');
  t._pousse = setTimeout(() => t.classList.remove('pousse'), 1100);
}

/* ------------------------------------------- les deux Fanzzy de l'arène

   **Le duel vivant** (lot 7). Le Fanzzy en tribune de chaque camp se tient
   dans l'arène, et il vit ce que vit la corde : la joie et un saut pour la
   tribune qui marque — un but de corde ou un but du vrai match —, le dépit
   pour celle qui encaisse, la poussée quand sa tribune pousse, la colère
   quand un coup d'en face tombe sur la sienne (silence, brouillard,
   parcage, vent de face).

   **L'expression quand elle est dessinée, le geste toujours.** Les Fanzzy de
   LA REPRISE ont leur joie, leur dépit, leur poussée et leur colère ; TR1 et
   TR2 leurs douze moments ; les autres n'ont que leur plein-pied, et c'est
   là que le geste compte : ils sautent, s'affaissent, se penchent et
   trépignent sur le même dessin. On demande donc **le moment** et non la
   famille — `but`, `encaisse`, `decision` — : `resoudre` sert à TR1 son
   dessin du but, et à LA REPRISE la joie de sa famille. Un personnage sans
   aucun dessin laisse sa place au supporter générique, comme à l'accueil :
   quelqu'un d'autre, mais quelqu'un.

   Celui d'en face est **le premier joueur connecté de sa tribune**, à son
   âge et dans la tenue que son joueur lui a mise à cet âge : la vue les
   donne (`equipes[].stade`, `equipes[].skin`). Le mien suit la Relève et le
   changement de Fanzzy : c'est l'actif de la vue, à son âge, dans sa tenue. */

/** Les quatre poses du supporter générique, par moment (celles de
    l'accueil). Il n'a pas de colère : il garde son visage, et trépigne. */
const SUPPORTER_DUEL = { neutre: 'idle', pousse: 'push', but: 'goal', encaisse: 'sad' };
/** Qui l'emporte quand deux moments se croisent : une poussée ne coupe pas
    une célébration, un but coupe tout. */
const RANG_FZ = { neutre: 0, pousse: 1, decision: 2, but: 3, encaisse: 3 };
/** Combien de temps chaque moment tient, en millisecondes. Le but du vrai
    match dure plus que celui de la corde, comme sa case de BD. */
const TENIR_FZ = { but: 2600, butReel: 3600, pousse: 1100, decision: 1800, sien: 1000 };
/** Les coups d'en face : les effets qu'une carte pose chez l'adversaire
    (`appliquer`, côté serveur). Le Renvoi compris — c'est la vue qui dit
    où l'effet est tombé, pas la carte. */
const COUPS_RECUS = new Set(['silence', 'blind', 'lock_actions', 'mod_foe']);

const fzArene = {};
for (const cote of ['moi', 'eux']) {
  fzArene[cote] = { cote, id: cote === 'moi' ? 'fzMoi' : 'fzEux', qui: null, cle: '', cleSac: '',
    pose: 'neutre', jusqua: 0, retour: 0, gesteT: 0, jeton: 0, devant: 0, src: '', voulu: '', coups: null,
    sienJusqua: 0 };
}

/* **Le manifeste des expressions d'abord.** Sans lui, un Fanzzy de LA
   REPRISE se poserait sur son dessin plat, puis sauterait sur celui de ses
   expressions à son arrivée : un autre cadrage, un personnage qui change de
   taille sous les yeux. Un manifeste qui ne vient pas libère tout de même
   la place — le dessin plat vaut mieux que personne. */
let fzManifesteLu = false;
Promise.resolve(window.TBF_ETATS?.charger?.()).catch(() => null).then(() => {
  fzManifesteLu = true;
  if (S.vue) rendreFzArene(S.vue);
});

/** La tenue d'un de mes Fanzzy à cet âge : celle que la vue porte
    (`tenues`, par âge), sinon celle de mon avatar s'il s'agit de lui — un
    serveur d'avant ne la donnait pas. */
function tenueEnJeu(f, evo, racine) {
  if (f?.tenues) return f.tenues[evo] || 'base';
  return monAvatar?.id === racine ? (monAvatar.skin || 'base') : 'base';
}

const racineFz = (id) => /^([A-Z]+\d+)/.exec(String(id ?? ''))?.[1] ?? null;
/** L'âge qu'un identifiant porte : `RP1` vaut un, `RP1B` deux. */
const ageFz = (id) => {
  const l = /^[A-Z]+\d+([A-Z])$/.exec(String(id ?? ''))?.[1];
  return l ? l.charCodeAt(0) - 64 : 1;
};

/** Qui se tient dans l'arène pour ce camp, ou `null`. */
function quiEnTribune(v, cote) {
  const mon = v.moi?.side ?? 0;
  if (cote === 'moi' && v.moi) {
    const f = (v.moi.fanzzy ?? []).find((x) => x.actif);
    const racine = racineFz(f?.id);
    if (!racine) return null;
    const evo = Number(f.stade) || ageFz(f.id);
    /* Mon sac, tel que l'équipe le sert (`equipes[].sac`, avec la rareté) :
       `moi.fanzzy[].stuff` n'a que les identifiants. */
    const sac = (v.equipes?.[mon] ?? []).find((x) => x?.userId != null && x.userId === monId())?.sac ?? [];
    return { id: f.id, racine, evo, skin: tenueEnJeu(f, evo, racine), sac };
  }
  const tribune = v.equipes?.[cote === 'moi' ? mon : mon ^ 1] ?? [];
  const j = tribune.find((x) => x?.fanzzy && x.connecte !== false) ?? tribune.find((x) => x?.fanzzy);
  const racine = racineFz(j?.fanzzy);
  /* `parti` : toute sa tribune a quitté le duel. Il reste, terni, comme ses
     supporters assis (`dessinerFoule`) : on voit qu'il n'y a plus personne. */
  return racine ? { id: j.fanzzy, racine, evo: Number(j.stade) || ageFz(j.fanzzy), skin: j.skin || 'base',
    sac: j.sac ?? [], parti: tribune.every((x) => x?.connecte === false) } : null;
}

/** Le plein-pied de ce personnage à ce moment, par la fonction unique. */
function dessinFzArene(qui, etat) {
  try {
    return window.FZART?.dessinAvatar?.({ id: qui.racine, age: qui.id, evo: qui.evo, skin: qui.skin },
      'plein', { etat }) ?? null;
  } catch { return null; }
}

/**
 * L'image d'un moment, ou `null` s'il n'a pas de dessin à lui.
 *
 * Même règle que l'accueil (`dessine`) : `resoudre` retombe toujours sur le
 * repos, et un visage qui ne change pas ne raconte rien ; un autre âge est
 * un autre personnage.
 */
function imageFz(qui, etat) {
  if (qui.supporter) {
    return SUPPORTER_DUEL[etat] ? `/img/supporter/${SUPPORTER_DUEL[etat]}${window.TBF_ETATS?.EXT_ALPHA ?? '.webp'}` : null;
  }
  if (etat === 'neutre') return dessinFzArene(qui, 'neutre');
  const r = window.TBF_ETATS?.pret?.() ? window.TBF_ETATS.resoudre(qui.racine, { evo: qui.evo, skin: qui.skin, etat }) : null;
  return r?.evo === qui.evo && r.etat !== 'neutre' ? dessinFzArene(qui, etat) : null;
}

/**
 * Pose l'image d'un moment sur la figure : chargée sur le calque de derrière,
 * décodée, puis croisée. Un moment sans dessin montre le repos.
 *
 * **Le dernier demandé gagne.** Une poussée puis un but, en deux dixièmes de
 * seconde : la poussée finit de charger après, et ne doit pas reprendre la
 * place. `voulu` retient la dernière demande, `jeton` l'ordre des charges.
 */
async function poserImageFz(f, etat) {
  const el = $(f.id);
