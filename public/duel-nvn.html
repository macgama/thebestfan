  out.push(`<h2 class="tbf-cousu">LE FORMAT <i>· la file est par format et par match</i></h2>`);
  /* **La prime du format, annoncée au moment du choix.** Un 2v2 demande de
     réunir quatre personnes au lieu de deux : il paie donc un peu plus, et
     le dire ici est la seule façon que ça pèse dans la décision. Le taux
     vient du serveur — il se règle depuis /admin, et la page n’en porte pas
     de copie.

     Le rail est celui de ui.css, au ton flare des arènes : voir `.formats`.
     `.fmt` et `.on` restent, c'est par eux que la page et ses contrôles
     savent quel format est coché. */
  out.push(`<div class="formats tbf-onglets" data-ton="flare">${formats.map((f) => {
    const p = S.primes?.[f] ?? 1;
    const prime = p > 1 ? `<small>+${Math.round((p - 1) * 100)} %</small>` : '';
    return `<button class="fmt tbf-onglet ${f === S.format ? 'on' : ''}" data-fmt="${f}"
      aria-pressed="${f === S.format}">${f}${prime}</button>`;
  }).join('')}</div>`);
  /* **« Peu importe le format ».**

     La file est indexée par format : deux personnes qui attendent sur le
     même match, l’une en 3v3 et l’autre en 1v1, ne se rencontrent jamais —
     pas même au bout de deux minutes. C’est le cas le plus fréquent d’un
     soir creux : trois joueurs en ligne, trois formats, trois duels contre
     des bots.

     Cocher ceci, c’est accepter de jouer avec tous les autres, quel que
     soit le format qu’ils ont choisi.

     Une plaque : béton levée, flare cochée. La coche est l'icône commune, et
     `aria-pressed` dit l'état à qui ne voit pas la case — la coche seule ne
     s'entend pas. */
  out.push(`<button class="souple tbf-plaque ${S.souple ? 'on' : ''}"
    ${S.souple ? 'data-ton="flare"' : ''} aria-pressed="${Boolean(S.souple)}" data-souple>
    <span class="case">${S.souple ? '<i class="tbf-ico tbf-ico-coche" aria-hidden="true"></i>' : ''}</span>
    <span class="t">Peu importe le format<small>joue avec tous ceux qui attendent sur ce match</small></span>
  </button>`);

  out.push(`<h2 class="tbf-cousu">LE MATCH SUPPORT</h2>`);
  /* La portée de la liste.

     Jouer pour un match qui n'est pas celui de son club est permis — sans quoi
     il n'y aurait personne en file un mardi de trêve — mais ça rapporte moitié
     moins. Le badge ×2 le rappelle carte par carte ; ce bouton, lui, existait
     côté serveur depuis longtemps et aucune page ne l'appelait.

     Le même rail flare que le format, juste au-dessus : même geste, même
     objet. */
  out.push(`<div class="portee tbf-onglets" data-ton="flare">
    <button class="pt tbf-onglet ${S.tousLesMatchs ? '' : 'on'}" data-portee="miens"
      aria-pressed="${!S.tousLesMatchs}">MES CLUBS</button>
    <button class="pt tbf-onglet ${S.tousLesMatchs ? 'on' : ''}" data-portee="tous"
      aria-pressed="${S.tousLesMatchs}">TOUS LES MATCHS</button>
  </div>`);

  if (!S.matchs.length) {
    out.push(S.tousLesMatchs
      ? `<div class="vide">Aucun match dans les huit prochains jours.</div>`
      : `<div class="vide">Aucun match à venir pour tes clubs.<br>
         <a href="/equipes">Suivre d’autres clubs</a>, ou passe à
         <b>tous les matchs</b> ci-dessus.</div>`);
  } else {
    out.push('<div class="matchs">');
    for (const m of S.matchs) {
      const on = S.fixtureId === m.id;
      const att = attenteDe(m);
      const enFile = att ? att.camps[0] + att.camps[1] : 0;
      out.push(`<div class="mt ${on ? 'on' : ''}" data-fixture="${m.id}">
        ${m.home_logo ? `<img src="${esc(m.home_logo)}" alt="">` : ''}
        <div class="n">${esc(m.home_name)} – ${esc(m.away_name)}</div>
        ${pastilleScore(m)}
        ${enFile ? `<div class="q attente">${enFile} EN FILE</div>` : ''}
        ${m.mien ? '<div class="q mien">×2</div>' : ''}
        <div class="q ${m.mode}">${m.mode === 'classe' ? 'CLASSÉ' : 'ENTRAÎNEMENT'}</div>
      </div>`);
      /* **Le choix se déplie sous le match choisi**, et non au bas de la page.
         La liste fait soixante lignes depuis qu'elle montre tout ce qui se
         joue : on cliquait un match en haut, et ce qu'il fallait faire ensuite
         se trouvait à mille pixels plus bas, hors de l'écran. Le geste suivant
         doit être là où le doigt vient de se poser. */
      if (on) out.push(souLeMatch(m, sansDeck));
    }
    out.push('</div>');
  }

  $('prepaCorps').innerHTML = out.join('');
}

/**
 * Ce qui se déplie sous le match choisi : ce que vaut le duel, la tribune, et
 * le bouton d'entrée.
 */
/**
 * Le score, sur la ligne d'un match qui en a un.
 *
 * La liste ne disait que deux noms de clubs, et rien d'autre : un joueur qui
 * choisissait « Lyon – Lille » le soir ne pouvait pas savoir si la rencontre
 * était à venir, en cours ou jouée. C'est pourtant la seule chose qui décide
 * de ce qu'il va vivre — un duel sur un match en cours suit le vrai terrain.
 *
 * Le score est en craie et non en or : l'or dit déjà « classé » deux pastilles
 * plus loin, et un chiffre doré à côté d'un libellé doré se lit comme une
 * seule information.
 */
function pastilleScore(m) {
  if (!m.enCours && !m.termine) return '';
  const but = `${Number(m.home_goals) || 0} – ${Number(m.away_goals) || 0}`;
  // La minute plutôt que le mot « en cours » : elle dit la même chose et
  // elle dit en plus **où on en est**, ce qui décide d'entrer ou non.
  const quand = m.enCours ? (m.elapsed ? `${m.elapsed}′` : 'EN DIRECT') : 'FINI';
  return `<div class="q sc${m.enCours ? ' live' : ''}">${but} <i>${quand}</i></div>`;
}

function souLeMatch(choisi, sansDeck) {
  const out = [];
  out.push(`<div class="souscarte">`);

  /* Ce qui attend sur **ce** match : c'est l'information qui décide du camp,
     et elle doit donc être là où le camp se choisit. */
  const att = attenteDe(choisi);
  const manque = manqueDe(att);
  if (att && manque) {
    const clubs = [choisi.home_name, choisi.away_name];
    out.push(`<div class="raison attend"><b>${att.camps[0] + att.camps[1]}</b>
      ${att.camps[0] + att.camps[1] > 1 ? 'supporters attendent' : 'supporter attend'}
      sur ce match.${manque.combien > 0
        ? ` Il en manque <b>${manque.combien}</b> côté <b>${esc(clubs[manque.camp])}</b>.`
        : ''}</div>`);
  }

  /* **La phrase vient du serveur**, qui est le seul à connaître la règle.

     Elle était écrite ici, en deux branches, et sur le mauvais critère : le
     ballon roule ou non. Or ce qui décide du classement est **la journée**.
     Un match terminé aujourd'hui compte encore — c'est même le moment où
     l'on a le plus envie de le rejouer — et cette ligne lui répondait
     « entraînement, sans effet sur le classement ». Un joueur qui lit ça
     n'entre pas.

     `raisonDuMatch`, dans `src/server/deck/index.js`, en donne les quatre
     états à tous ses appelants. Le repli couvre une page restée ouverte
     pendant un déploiement : elle dit ce qu'elle sait, sans rien promettre
     sur le classement. */
  out.push(`<div class="raison">${esc(choisi.raison
    ?? (choisi.enCours ? 'Le match est en cours.' : 'Match à venir.'))}
    ${choisi.mien ? '<br><b>Un de tes clubs joue : ce duel rapporte le double d’écharpes.</b>' : ''}
    </div>`);

  /* ------------------------------------------------------- le camp

     Les deux tribunes du duel sont les deux clubs du match.

     **Chez soi, il n'y a rien à choisir** : on ne pousse pas contre son
     propre club. On le dit quand même, plutôt que de ne rien afficher — un
     joueur qui ne voit pas de choix doit savoir que c'en est un qui a été
     fait pour lui, sinon il le cherche.

     **Ailleurs, il faut choisir**, et le bouton reste fermé tant que ce
     n'est pas fait. Entrer en file sans avoir dit pour qui l'on chante
     enverrait tout le monde du côté du domicile par défaut, et le camp
     visiteur ne se remplirait jamais. */
  if (choisi.monCamp !== null && choisi.monCamp !== undefined) {
    const clubs = [choisi.home_name, choisi.away_name];
    out.push(`<h3 class="tbf-cousu">TA TRIBUNE</h3>`);
    out.push(`<div class="raison chezmoi">Tu es chez toi :
      <b>${esc(clubs[choisi.monCamp])}</b>. Le camp ne se choisit pas —
      on ne pousse pas contre son club.</div>`);
  } else {
    out.push(`<h3 class="tbf-cousu">TA TRIBUNE <i>· pour qui viens-tu chanter ?</i></h3>`);
    /* Le compte sur chaque bouton : le joueur voit d'un coup d'œil quelle
       tribune manque de monde, et c'est celle-là qui paie le double.

       Deux plaques : la tribune choisie prend le ton flare, l'autre reste en
       béton. `.on` reste la marque du choix pour la page et ses contrôles. */
    out.push(`<div class="tribunes">${[choisi.home_name, choisi.away_name]
      .map((nom, i) => `<button class="trib tbf-plaque ${S.camp === i ? 'on' : ''}"
        ${S.camp === i ? 'data-ton="flare"' : ''} aria-pressed="${S.camp === i}"
        data-camp="${i}">${esc(nom)}${att
          ? `<small>${att.camps[i]} en file</small>` : ''}</button>`).join('')}</div>`);
    out.push(`<div class="raison">Aucun de tes clubs ne joue : tu viens tenir
      une tribune qui n’est pas la tienne. <b>Prends celle qui manque de
      monde</b> — ta ferveur y vaut jusqu’au double.</div>`);
  }

  /* Fermé tant qu'on n'a pas dit pour qui l'on chante : un neutre envoyé
     sans choix irait par défaut du côté du domicile, et le camp visiteur ne se
     remplirait jamais. */
  const sansCamp = choisi.monCamp == null && S.camp === null;
  out.push(`<button class="gros tbf-plaque tbf-bloc" data-ton="flare" id="entrer"
    ${sansDeck || sansCamp ? 'disabled' : ''}>ENTRER EN FILE</button>`);
  out.push(`<div class="raison">Si personne ne se présente, des bots complètent
    les places et le duel devient un entraînement.</div>`);

  out.push(`</div>`);
  return out.join('');
}

$('prepaCorps').addEventListener('click', (e) => {
  const f = e.target.closest('[data-fmt]');
  if (f) { S.format = f.dataset.fmt; return preparerRendu(); }
  if (e.target.closest('[data-souple]')) { S.souple = !S.souple; return preparerRendu(); }
  const m = e.target.closest('[data-fixture]');
  // Changer de match remet la tribune à zéro : ce ne sont plus les mêmes clubs.
  if (m) { S.fixtureId = Number(m.dataset.fixture); S.camp = null; return preparerRendu(); }
  const t = e.target.closest('[data-camp]');
  if (t) { S.camp = Number(t.dataset.camp); return preparerRendu(); }
  /* Changer de portée relit la liste : elle vient du serveur, qui seul sait
     quels matchs existent et lesquels mettent un club suivi en jeu. Le match
     choisi est remis à zéro — il peut très bien ne plus être dans la liste. */
  const p = e.target.closest('[data-portee]');
  if (p) {
    const tous = p.dataset.portee === 'tous';
    if (tous === S.tousLesMatchs) return undefined;
    S.tousLesMatchs = tous;
    S.fixtureId = null;
    return rechargerMatchs();
  }
  if (e.target.closest('#entrer')) entrerEnFile();
  return undefined;
});

/**
 * Relit la liste des matchs pour la portée courante.
 *
 * Le premier match classé est choisi d'office, comme au chargement : c'est
 * celui qu'on vient jouer, et laisser la sélection vide obligerait à deux
 * gestes là où un seul suffit.
 */
async function rechargerMatchs() {
  try {
    const r = await api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`);
    S.matchs = r.matchs ?? [];
  } catch {
    S.matchs = [];               // hors ligne : la liste vide dit déjà tout
  }
  S.fixtureId = S.matchs.find((m) => m.mode === 'classe')?.id ?? S.matchs[0]?.id ?? null;
  preparerRendu();
}

// On ne recharge pas les catalogues à chaque clic : seul l'affichage change.
let sansDeckMemo = false, formatsMemo = ['1v1','2v2','3v3','4v4','5v5'];
const preparerRendu = () => rendrePrepa(sansDeckMemo, formatsMemo);

/* ---------------------------------------------------------- réseau */

let socket = null;

function connecter() {
  /* **Polling d'abord, websocket ensuite — et surtout pas l'inverse.**
  
     Un joueur l'a décrit exactement : « pas de connexion sur mobile, alors que
     ça marche sur l'ordinateur avec le même compte ». Le compte et le serveur
     étaient donc hors de cause, et le transport seul restait.
  
     La page demandait `['websocket', 'polling']`. Cet ordre n'est pas un
     classement de préférence : engine.io essaie le premier, et **si celui-là
     échoue il abandonne**. C'est écrit dans la documentation de la
     bibliothèque, à `tryAllTransports` : « if the connection with the first
     transport fails, then the client will not test the other transports and
     will abort the connection ». Par défaut, à false.
  
     Sur un ordinateur en wifi domestique, le websocket passe : personne ne voit
     rien. Sur un réseau mobile, un proxy d'entreprise ou derrière un portail
     captif, il est souvent bloqué — et le jeu se déclarait hors ligne sur un
     réseau parfaitement fonctionnel.
  
     L'ordre par défaut de socket.io est le bon, et il l'est pour cette
     raison-là : le long-polling passe partout où de l'HTTP passe, la connexion
     s'établit toujours, puis elle **monte** en websocket dès que le réseau le
     permet. On ne perd donc pas la latence du websocket là où il existe : on
     la gagne une centaine de millisecondes plus tard, sans jamais rien casser
     là où il n'existe pas.
  
     `tryAllTransports` en plus : si même le polling échoue au premier essai, on
     veut que les autres soient tentés plutôt qu'un abandon sec. */
  socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });

  /* **On ne crie pas au loup.**

     Un joueur l'a dit en une phrase : « j'ai le message de connexion
     impossible alors que la connexion fonctionne ». Il avait raison, et le
     défaut était grossier : `connect_error` posait le voile **sur-le-champ**,
     sur tout l’écran, et il tombait aussi quand on ne faisait que regarder la
     liste des matchs.

     Or socket.io émet `connect_error` à la moindre hésitation — un
     WebSocket refusé avant le repli en polling, un changement de réseau, un
     écran de téléphone qui s’éteint une seconde. Il se rebranche tout seul
     dans la foulée, et c’est le comportement normal, pas une panne. Poser un
     voile noir dessus, c’est apprendre au joueur que le jeu ment.

     On laisse donc cinq secondes à la reconnexion avant de dire quoi que ce
     soit. Si elle revient — le cas ordinaire — personne n’a rien vu. Si elle
     ne revient pas, le voile arrive, et cette fois il dit vrai.

     La règle vaut pour `disconnect` comme pour `connect_error` : les deux
     décrivent le même état vu de deux endroits. */
  const GRACE_RESEAU = 5000;
  let alarme = null;
  const plusTard = (titre, texte) => {
    if (alarme) return;                       // une alarme suffit
    alarme = setTimeout(() => { alarme = null; voile(titre, texte); }, GRACE_RESEAU);
  };
  const rassurer = () => { clearTimeout(alarme); alarme = null; };

  socket.on('connect', () => {
    rassurer();
    fermerVoile();
    // Reprise : si un duel nous attendait, le serveur nous y remet.
    if (S.vue && !S.vue.termine) socket.emit('nvn:resume');
    window.TBF_BARRE?.enPartie?.(Boolean(S.vue && !S.vue.termine));
  });

  socket.on('connect_error', () => {
    plusTard('Hors ligne', 'La connexion au serveur a été perdue. On réessaie.');
  });

  socket.on('disconnect', () => {
    if (S.vue && !S.vue.termine) {
      plusTard('Connexion perdue', 'Ta place t\u2019attend une minute trente. '
        + 'Tu cesses simplement de pousser, ta tribune ne s\u2019effondre pas.');
    }
  });

  /* L affiche, une fois, au coup d envoi. Elle arrive juste apres nvn:start
     et se retire toute seule : voir montrerAffiche. */
  socket.on('nvn:affiche', (a) => { try { montrerAffiche(a); } catch (e) {
    console.error('affiche', e); } });

  /* Le bilan, une fois, au coup de sifflet. Il remplace le voile gris que
     finir() posait ; celui-ci reste en repli si le bilan n arrive pas. */
  socket.on('nvn:fin', (b) => { try { montrerBilan(b); } catch (e) {
    console.error('bilan', e); } });

  /**
   * La file, et ce qu'elle annonce.
   *
   * Deux choses qui n'y étaient pas, et qui décident de tout :
   *
   *   — **ce qu'il manque en face.** Un duel est tribune contre tribune : si
   *     personne ne tient le camp visiteur, rien ne part. Le dire, c'est la
   *     seule chance qu'un joueur aille le tenir.
   *   — **le délai avant les bots**, qui n'était annoncé qu'en entraînement
   *     alors que le serveur basculait aussi pour un duel classé. Quelqu'un
   *     qui attend a le droit de savoir combien de temps.
   */
  socket.on('nvn:file', (p) => {
    S.enFile = true;
    /* Trois phrases sont devenues une salle : voir `rendreSalle`. Le serveur
       envoie la composition des deux tribunes à chaque mouvement, et ce
       message arrive désormais à **tous** ceux qui attendent, pas seulement
       au dernier entré. */
    rendreSalle(p);
  });

  /* Le panneau d'affichage : ce qui attend, partout, à chaque mouvement.
     On ne repeint que si l'on est encore devant la préparation — pendant un
     duel, la liste des matchs n'est pas à l'écran et la refaire ne servirait
     qu'à travailler pour rien. */
  socket.on('nvn:attentes', (d) => {
    S.attentes = d?.attentes ?? [];
    if (!S.vue) preparerRendu();
  });

  socket.on('nvn:start', (vue) => {
    S.enFile = false;
    S.vue = vue;
    S.dernierSeq = vue.seq ?? 0;
    /* **Le duel commence : on le dit à la barre.**

       Ce drapeau n'était levé qu'à la reconnexion — voir le gestionnaire
       « connect » plus haut. Un joueur qui jouait son duel d'une traite ne le
       levait donc jamais, et le garde-fou qui prévient avant un rechargement
       en pleine partie ne servait à personne. Il se lève ici, au seul endroit
       où le duel commence pour de bon. */
    window.TBF_BARRE?.enPartie?.(true);
    fermerVoile();
    $('prepa').style.display = 'none';
    $('jeu').classList.add('on');
    rendreDuel();
  });

  socket.on('nvn:state', (vue) => { S.vue = vue; rendreDuel(); });

  socket.on('nvn:events', (evs) => {
    for (const e of evs ?? []) {
      if (e.seq && e.seq <= S.dernierSeq) continue;
      if (e.seq) S.dernierSeq = e.seq;
      raconter(e);
    }
  });

  socket.on('nvn:error', (e) => {
    S.occupe = false;
    dire(e?.code ?? 'nvn.error.server');
    if (e?.code === 'nvn.error.slot_lost') {
      S.vue = null;
      $('jeu').classList.remove('on');
      $('prepa').style.display = '';
    }
  });
}

/**
 * La hauteur de la rangée de chants, mesurée plutôt que devinée.
 *
 * Le message d'erreur se pose juste au-dessus d'elle. Elle n'a pas de hauteur
 * fixe : le nom d'un chant passe parfois à deux lignes, et le répertoire change
 * d'une partie à l'autre. Une valeur écrite en dur dans le CSS était juste pour
 * le duel où on l'avait mesurée, et fausse pour les autres.
 *
 * `ResizeObserver` plutôt qu'une mesure au rendu : la rangée change aussi quand
 * l'écran tourne ou qu'une carte devient trop chère, et ces moments-là
 * n'appellent aucune de nos fonctions.
 */
{
  const rangee = $('chants');
  if (rangee && window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty(
        '--chants-h', `${Math.round(rangee.getBoundingClientRect().height)}px`);
    }).observe(rangee);
  }
}

function entrerEnFile() {
  if (!S.fixtureId) return toast('Choisis d\u2019abord un match support.');
  if (!socket?.connected) return toast('Pas de connexion au serveur.');
  socket.emit('nvn:queue',
    { format:S.format, fixtureId:S.fixtureId, camp:S.camp ?? 0, souple:S.souple });
  voile('Dans la file', 'Recherche d\u2019adversaires…',
    { texte:'Quitter la file', action: quitterFile });
}

function quitterFile() {
  socket?.emit('nvn:leave_queue');
  S.enFile = false;
  fermerVoile();
}

/* ------------------------------------------------------- affichage */

/**
 * Le stade du duel, monté une seule fois.
 *
 * Le duel se jouait sur un fond noir uni, pendant que le Grand Virage montrait
 * le lieu de la rencontre. Même mécanique, même corde, deux décors — et rien ne
 * disait au joueur que c'était le même jeu.
 *
 * Le lieu vient du serveur et ne change pas de tout le duel : on le monte au
 * premier état reçu, et le garde-fou du haut empêche de le remonter à chacune
 * des dix vues par seconde — ce qui rechargerait le dessin en boucle.
 *
 * Les deux couleurs sont celles des camps de l'arène, pas celles des clubs : un
 * duel n'oppose pas deux clubs, il oppose deux tribunes, et le joueur a déjà
 * appris que l'or est chez lui et le bleu en face.
 */
let stade = null;

function monterStade() {
  if (stade || !S.vue?.stade || !window.TBF_STADE) return;
  stade = window.TBF_STADE.monter($('stade'), {
    id: S.vue.stade.id,
    couleurs: ['var(--projo)', 'var(--bleu)'],
  });
  /* Le nom du lieu et ce qu'il change. Depuis que les `mods` du stade sont
     réellement appliqués, un joueur qui ne les lit nulle part croit que le jeu
     lui a retiré du souffle sans raison. */
  const l = $('lieu');
  if (l) {
    l.innerHTML = `<b>${esc(S.vue.stade.nom ?? '')}</b>`
      + (S.vue.stade.effet ? ` · ${esc(S.vue.stade.effet)}` : '');
  }
}

/* Les statuts que l'API donne à un match en train de se jouer, et ceux
   d'une pause. Une horloge qui tourne à la mi-temps ment aussi sûrement
   qu'une horloge arrêtée pendant le jeu. */
const EN_JEU = ['1H', '2H', 'ET', 'LIVE'];
const EN_PAUSE = ['HT', 'BT', 'P', 'SUSP', 'INT'];

/**
 * La bande du terrain.
 *
 * Elle ne paraît qu'une fois le match commencé : avant le coup d'envoi, un
 * « 0 – 0 · TERRAIN » n'apprend rien et prend la place de l'arène.
 *
 * Le score est orienté comme partout ailleurs dans le jeu — le sien à
 * gauche — parce qu'un joueur qui lit « 1 – 0 » doit savoir sans réfléchir
 * si c'est lui qui mène. Le camp 0 étant la maison des deux côtés
 * (`coteDe`), l'orientation se fait avec le même index que la corde.
 */
function rendreFilMatch(v, mon) {
  const bande = $('filMatch');
  if (!bande) return;
  const sc = v.scoreReel;
  const statut = v.statutReel;
  const commence = Array.isArray(sc)
    && (EN_JEU.includes(statut) || EN_PAUSE.includes(statut)
      || ['FT', 'AET', 'PEN'].includes(statut));
  bande.classList.toggle('on', Boolean(commence));
  if (!commence) return;

  ecrire($('filMatchScore'), `${sc[mon] ?? 0} – ${sc[mon ^ 1] ?? 0}`);

  const enJeu = EN_JEU.includes(statut);
  const min = $('filMatchMin');
  ecrire(min, minuteTerrain(v.minuteReelle, enJeu));
  min.classList.toggle('arret', !enJeu);

  ecrire($('filMatchQui'), PHASE_REELLE[statut] ?? '');
}

/**
 * La minute du terrain, avancée localement entre deux relevés.
 *
 * On retient l'instant où le serveur a donné cette minute-là, et on y
 * ajoute les minutes écoulées depuis. Le repère se réarme dès que le
 * serveur en donne une autre — un but réel — donc la dérive ne s'accumule
 * jamais au-delà d'un duel.
 */
let repereMinute = null;

function minuteTerrain(minute, enJeu) {
  if (minute == null) { repereMinute = null; return ''; }
  if (!repereMinute || repereMinute.minute !== minute) {
    repereMinute = { minute, depuis: Date.now() };
  }
  const ecoulees = enJeu
    ? Math.floor((Date.now() - repereMinute.depuis) / 60000)
    : 0;
  return `${minute + ecoulees}'`;
}

/* Les mêmes mots qu'au Virage : deux écrans qui décrivent la même
   rencontre ne doivent pas la nommer autrement. */
const PHASE_REELLE = {
  '1H': 'COUP D’ENVOI', HT: 'MI-TEMPS', '2H': 'REPRISE',
  BT: 'FIN DU TEMPS RÉGLEMENTAIRE', ET: 'PROLONGATION', P: 'TIRS AU BUT',
  FT: 'FIN DU MATCH', AET: 'FIN APRÈS PROLONGATION', PEN: 'FIN AUX TIRS AU BUT',
  SUSP: 'MATCH SUSPENDU', INT: 'MATCH INTERROMPU',
};

/* ------------------------------------------------------- ce que je porte

   Le jumeau de celui du Grand Virage, à ceci près que le duel a un état par
   vue plutôt qu'un état fusionné. Le contenu vient de `mods.js` : la ligne dit
   combien, le panneau dit quoi.

   **Le panneau ouvert ne se redessine pas à chaque vue.** Le serveur en envoie
   plusieurs par seconde, et réécrire son `innerHTML` à ce rythme remplacerait
   les nœuds sous le doigt qui défile. On ne le remonte donc que quand ce qu'on
   porte change vraiment — à l'entrée, à une Relève qui change de personnage
   actif, et à la pose ou l'expiration d'un effet de carte. L'empreinte est la
   comparaison la plus simple qui soit juste : les deux objets viennent du
   serveur, ils sont petits, et leur ordre de clés est stable. */
let apportsVus = null;

function rendreApports(moi) {
  const M = window.TBF_MODS;
  const ligne = $('apportsL'), panneau = $('apportsP');
  /* Sans `mods.js`, on ne montre rien plutôt que des clés brutes : c'est un
     supplément d'information, et son absence ne doit pas se voir — et surtout
     pas lever au milieu d'un duel. */
  if (!M || !ligne || !panneau) return;

  const apports = moi?.apports ?? [];
  const { plus, moins, texte } = M.resume(apports);
  if (!texte) { ligne.hidden = true; panneau.hidden = true; return; }
  ligne.hidden = false;

  const empreinte = JSON.stringify([apports, moi?.mods ?? null]);
  if (empreinte === apportsVus) return;
  apportsVus = empreinte;
  ligne.innerHTML = '<span class="tbf-ap-n">Ce que tu portes</span>'
    + (plus ? `<span class="plus">${plus} bonus</span>` : '')
    + (moins ? `<span class="moins">${moins} malus</span>` : '')
    + '<span class="tbf-ap-fl" aria-hidden="true">⌄</span>';
  if (!panneau.hidden) panneau.innerHTML = M.panneauHTML(apports, moi?.mods);
}

$('apportsL').onclick = () => {
  const panneau = $('apportsP'), ligne = $('apportsL');
  const moi = S.vue?.moi;
  const ouvre = panneau.hidden;
  if (ouvre) panneau.innerHTML = window.TBF_MODS.panneauHTML(moi?.apports ?? [], moi?.mods);
  panneau.hidden = !ouvre;
  ligne.setAttribute('aria-expanded', String(ouvre));
};

/* ----------------------------------------------- des nœuds qui durent

   **Un conteneur réécrit dix fois par seconde ne garde rien de vivant.**

   `rendreDuel` passe à chaque vue du serveur, c'est-à-dire dix fois par
   seconde, et réécrivait en `innerHTML` les effets, l'équipe et la main.
   Chaque vue jetait donc les cinq cartes et les trois portraits pour en
   poser des neufs, identiques à l'œil. Trois choses en mouraient sans bruit :

     — **les animations.** fx.js fait respirer chaque portrait ; un portrait
       remplacé tous les dixièmes de seconde repartait de zéro à chaque vue,
       c'est-à-dire ne respirait jamais ;
     — **le focus et l'appui.** Un doigt posé sur une carte la voyait
       remplacée entre l'appui et le relâchement, et le clic tombait sur un
       nœud qui n'était plus dans la page ;
     — **le réseau.** Un dessin absent se retire de lui-même (`onerror`) : il
       revenait à la vue suivante, et se redemandait dix fois par seconde.

   Chaque élément est donc **créé une fois, retrouvé par sa clé, modifié en
   place**, et retiré seulement quand sa clé disparaît. Le rendu est le même
   à l'écran — mêmes classes, mêmes attributs, même ordre — mais les nœuds
   restent. Le Grand Virage a le même besoin pour sa rangée d'actions : voir
   `accorder` dans virage.html, écrite de la même façon.

   La clé est une propriété du nœud (`_cle`) et non un attribut : elle ne se
   voit pas dans la page, et un nœud retiré par ailleurs emporte la sienne,
   si bien que le rendu suivant ne peut pas se tromper sur ce qui est là. */

/**
 * Accorde les enfants de `boite` à une liste de clés, dans cet ordre.
 *
 * `creer(cle, i)` fabrique le nœud d'une clé neuve ; `maj(el, cle, i)` le met
 * à jour en place, à chaque passage — il ne doit écrire que ce qui change.
 * Un nœud n'est déplacé que s'il n'est pas à sa place : déplacer un élément
 * lui fait perdre le focus, et c'est justement ce qu'on protège.
 */
function accorder(boite, cles, creer, maj) {
  const gardes = new Map();
  for (const el of [...boite.children]) {
    if (el._cle != null && cles.includes(el._cle) && !gardes.has(el._cle)) gardes.set(el._cle, el);
    else el.remove();
  }
  cles.forEach((cle, i) => {
    let el = gardes.get(cle);
    if (!el) { el = creer(cle, i); el._cle = cle; }
    maj(el, cle, i);
    if (boite.children[i] !== el) boite.insertBefore(el, boite.children[i] ?? null);
  });
}

/** Un nœud depuis son balisage : les gabarits de la page restent lisibles.
    « fabriquer » et non « noeud » : la page a un élément #noeud, et une
    fonction globale du même nom masquerait son accès par window. */
function fabriquer(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/**
 * Des clés uniques pour une liste qui peut se répéter.
 *
 * Un deck peut porter deux fois la même carte — le deck de test porte deux
 * Arbitres — et une main peut donc les avoir ensemble. « a-arbitre#0 » et
 * « a-arbitre#1 » restent deux cartes, chacune avec son nœud.
 */
function clesDe(ids) {
  const vus = new Map();
  return ids.map((id) => {
    const n = vus.get(id) ?? 0;
    vus.set(id, n + 1);
    return `${id}#${n}`;
  });
}

/** N'écrit un texte que s'il a changé : réécrire le même texte recrée le nœud. */
function ecrire(el, texte) {
  const t = String(texte);
  if (el && el.textContent !== t) el.textContent = t;
}

function rendreDuel() {
  const v = S.vue;
  if (!v) return;
  const moi = v.moi;
  const mon = moi?.side ?? 0;
  const eux = mon ^ 1;

  /* Chaque vue arrive dix fois par seconde : on n'écrit que ce qui a changé.
     Voir « des nœuds qui durent », juste au-dessus. */
  ecrire($('butsMoi'), v.goals?.[mon] ?? 0);
  ecrire($('butsEux'), v.goals?.[eux] ?? 0);
  rendreFilMatch(v, mon);
  const s = Math.max(0, Math.round((v.resteMs ?? 0) / 1000));
  ecrire($('horloge'), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
  ecrire($('modeTag'), v.mode === 'classe' ? 'CLASSÉ' : 'ENTRAÎNEMENT');

  monterStade();
  rendreApports(moi);

  /* L'arène. Le moteur compte positif vers le camp 1 ; on l'oriente pour que
     « vers la droite » veuille toujours dire « ta tribune avance ».

     La position ne se lit pas à un curseur mais au territoire : ton camp
     occupe une part de la largeur, et le nœud est la frontière. */
  const sens = mon === 0 ? -1 : 1;
  const part = Math.max(-1, Math.min(1, (v.rope ?? 0) / 300)) * sens;
  const pct = 50 + part * 42;                    // 8 % de marge : un camp n'est jamais nul
  $('coteMoi').style.width = `${pct.toFixed(1)}%`;
  $('coteEux').style.width = `${(100 - pct).toFixed(1)}%`;
  $('noeud').style.left = `${pct.toFixed(1)}%`;

  // L'écart en clair. Le chiffre se lit plus vite que la position.
  const avance = Math.round(Math.abs(v.rope ?? 0));
  const ec = $('ecart');
  ecrire(ec.firstChild, avance === 0 ? '0' : `${part > 0 ? '+' : '−'}${avance}`);
  ecrire(ec.querySelector('small'), avance === 0 ? 'ÉGALITÉ'
    : part > 0 ? 'TU MÈNES LA CORDE' : 'ILS TIRENT PLUS FORT');
  ec.style.color = avance === 0 ? 'var(--craie)' : part > 0 ? 'var(--projo)' : 'var(--bleu)';

  dessinerFoule('fouleMoi', v.equipes?.[mon] ?? []);
  dessinerFoule('fouleEux', v.equipes?.[eux] ?? []);

  if (!moi) return;

  $('souffleBar').style.width = `${Math.max(0, Math.min(100, moi.breath))}%`;
  ecrire($('souffleVal'), moi.breath);

  // Les effets en cours, nommés : sans ça, un joueur silencié croit à un bug.
  const NOMS = {
    silence:['Silence radio','var(--flare)'], blind:['Brouillard','var(--violet)'],
    lock_actions:['Parcage fermé','var(--flare)'], shield:['Bâche','var(--gris)'],
    reflect:['Renvoi armé','var(--vert)'], mod_self:['Modificateur','var(--projo)'],
    mod_foe:['Vent de face','var(--violet)'], breath_mult:['Souffle ralenti','var(--flare)'],
    floor_quality:['Second souffle','var(--projo)'], peut_changer:['Changement possible','var(--vert)'],
  };
  /* Les trois rangées qui suivent passent par `accorder` : voir « des nœuds
     qui durent », juste au-dessus. Même balisage qu'avant, mais posé une fois
     et retouché en place. */
  const effets = moi.effets ?? [];
  accorder($('effets'), clesDe(effets.map((e) => e.type)),
    () => fabriquer('<span class="eff"></span>'),
    (el, _cle, i) => {
      const e = effets[i];
      const [nom, c] = NOMS[e.type] ?? [e.type, 'var(--gris)'];
      const reste = e.reste ? ` ${Math.ceil(e.reste / 1000)}s` : '';
      if (el._c !== c) { el._c = c; el.style.color = c; }
      ecrire(el, `${nom}${reste}`);
    });

  const peutChanger = effets.some((e) => e.type === 'peut_changer');
  const fanzzy = moi.fanzzy ?? [];
  // Par place et non par personnage : une Relève change l'âge — donc
  // l'identifiant — du Fanzzy en jeu, pas sa place dans l'équipe.
  accorder($('equipe'), fanzzy.map((_, i) => `place#${i}`),
    () => fabriquer(`<div class="fz"><div class="vig"></div>
      <div class="txt"><b></b><span></span></div></div>`),
    (el, _cle, i) => {
      const f = fanzzy[i];
      const entre = !f.actif && peutChanger;
      el.classList.toggle('actif', Boolean(f.actif));
      el.classList.toggle('dispo', entre);
      if (entre) { if (el.dataset.entrer !== String(i)) el.dataset.entrer = i; }
      else if (el.hasAttribute('data-entrer')) el.removeAttribute('data-entrer');
      /* Le portrait n'est reposé que si son dessin change — une Relève. C'est
         ce qui le laisse respirer : fx.js l'anime une fois pour toutes. */
      const dessin = vignette(f);
      if (el._dessin !== dessin) { el._dessin = dessin; el.querySelector('.vig').innerHTML = dessin; }
      ecrire(el.querySelector('b'), f.nom ?? f.id);
      ecrire(el.querySelector('span'), f.actif ? 'EN JEU' : peutChanger ? 'ENTRER' : 'BANC');
    });

  /* Sous le Brouillard, la main est cachée : cinq cases vides marquées d'un
     « ? », qui prennent la place des cartes le temps de l'effet. Leurs clés
     sont à part, pour qu'aucune carte ne se retrouve déguisée en case vide.

     Le « ? » est en craie pleine. Il était à 40 % pour rester discret, mais
     c'est tout ce que dit la rangée — la main est cachée — et un texte qui
     informe ne descend pas sous 85 %. La discrétion tient au cadre en
     pointillé de `.ct.vide`, pas à l'effacement. */
  const main = moi.main ?? [];
  const cd = moi.cooldowns ?? {};
  const enJeu = fanzzy.find((f) => f.actif);
  const verrou = effets.some((e) => e.type === 'lock_actions');
  const places = Array.from({ length: 5 }, (_, i) => main[i] ?? null);
  const cartesCles = clesDe(places.map((id, i) => id ?? `vide@${i}`));
  accorder($('mainCartes'),
    moi.aveugle ? places.map((_, i) => `aveugle#${i}`) : cartesCles,
    (cle, i) => {
      if (moi.aveugle) {
        return fabriquer('<div class="ct vide"><div class="nm">?</div></div>');
      }
      if (!places[i]) return fabriquer('<div class="ct vide"></div>');
      // Glyphe de famille en fond, dessin par-dessus : une carte dont le fichier
      // manque garde son repère au lieu d'un carré vide.
      return fabriquer(`<div class="ct">
        <svg class="sceau" viewBox="0 0 24 24"><path d=""/></svg>
        <div class="co"></div>
        <div class="nm"></div>
      </div>`);
    },
    (el, _cle, i) => {
      const id = places[i];
      if (moi.aveugle || !id) return;
      const a = carteDef(id);
      const fam = famDe(a);
      const reste = cd[id];
      // La Relève ne sert à rien si le Fanzzy en tribune est déjà à son dernier
      // âge débloqué. On la grise plutôt que de la laisser jouer pour rien : le
      // serveur la refuserait, mais après le geste — donc après l'espoir.
      const sansRelève = a?.condition?.evolution
        && !(enJeu?.ages ?? [])[enJeu?.stade ?? 1];
      const injouable = Boolean(!a || moi.breath < a.cost || reste || sansRelève || verrou);
      el.classList.toggle('hs', injouable);
      if (injouable) { if (el.hasAttribute('data-jouer')) el.removeAttribute('data-jouer'); }
      else if (el.dataset.jouer !== id) el.dataset.jouer = id;
      if (el._fc !== fam.c) { el._fc = fam.c; el.style.setProperty('--fc', fam.c); }
      const trace = el.querySelector('.sceau path');
      if (trace.getAttribute('d') !== fam.ico) trace.setAttribute('d', fam.ico);
      /* Le dessin est posé une seule fois, dès que la carte est connue. S'il
         manque, il se retire lui-même et ne revient pas : la carte garde son
         glyphe, et le fichier absent n'est plus redemandé à chaque vue. */
      if (a && !el._dessin) {
        el._dessin = true;
        el.querySelector('.sceau').insertAdjacentHTML('afterend', window.TBF_ACTION.illustration(a.id));
      }
      ecrire(el.querySelector('.co'), a?.cost ?? '?');
      ecrire(el.querySelector('.nm'), a?.nom ?? id);
      let rebours = el.querySelector('.cd');
      if (reste) {
        if (!rebours) {
          rebours = fabriquer('<div class="cd"></div>');
          el.appendChild(rebours);
        }
        ecrire(rebours, Math.ceil(reste));
      } else if (rebours) rebours.remove();
    });

  rendreChants(v);

  if (v.termine) finir(v);
}

/**
 * La foule : un point par joueur, au pied de son camp.
 *
 * C'est ce qui remplace le fil de texte. On ne lit plus « michel chante
 * 74 % » : on voit sa tête sauter. Le nom reste en infobulle pour qui veut
 * savoir, mais l'information principale — qui pousse, qui est parti — se lit
 * sans un mot.
 */
function dessinerFoule(id, joueurs) {
  const el = $(id);
  const voulu = joueurs.map((j) => j.userId ?? j.nom).join('|');
  // On ne reconstruit que si l'équipe a changé : sinon on effacerait les
  // têtes en train de sauter à chaque état reçu, dix fois par seconde.
  if (el.dataset.cle !== voulu) {
    el.dataset.cle = voulu;
    el.innerHTML = joueurs.map((j) => `<span class="tete" data-u="${esc(j.userId ?? '')}"
      title="${esc(j.nom ?? '')}"></span>`).join('');
  }
  [...el.children].forEach((t, i) => {
    const j = joueurs[i];
    t.classList.toggle('parti', j?.connecte === false);
    t.classList.toggle('on', Boolean(j?.connecte));
  });
}

/** Fait sauter la tête d'un joueur : il vient de chanter. */
function teteSaute(userId) {
  const t = document.querySelector(`.tete[data-u="${CSS.escape(String(userId))}"]`);
  if (!t) return;
  t.classList.add('chante');
  setTimeout(() => t.classList.remove('chante'), 320);
}

/* ------------------------------------------------- ce qui se voit

   Il n'y a plus de fil de texte. Un journal qui défile pendant qu'on joue
   n'est jamais lu : on regarde la corde, pas la colonne de phrases. Chaque
   événement devient donc un signal — un chiffre qui monte du nœud, une tête
   qui saute, une onde, un son.

   Le texte qui reste est transitoire et tient en deux mots : le nom d'une
   carte jouée, qu'on ne peut pas deviner autrement.                        */

const nomDe = (userId) => {
  for (const eq of S.vue?.equipes ?? []) {
    const j = eq.find((x) => x.userId === userId);
    if (j) return j.nom;
  }
  return 'Quelqu\u2019un';
};
const mien = (side) => side === S.vue?.moi?.side;

/** Le bouton de son. L'état vient de fx.js, qui le retient d'une page à l'autre.
 *  Un haut-parleur au trait : avec ses ondes quand le son joue, barré quand il
 *  est coupé. Voir `.son` pour la raison du dessin. */
const HAUT_PARLEUR = '<path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/>';
const DESSIN_SON = {
  joue: `<svg viewBox="0 0 24 24" aria-hidden="true">${HAUT_PARLEUR}<path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg>`,
  coupe: `<svg viewBox="0 0 24 24" aria-hidden="true">${HAUT_PARLEUR}<path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>`,
};
function reglerBoutonSon() {
  const b = $('son');
  if (!b) return;
  const coupe = window.FX?.sonEstCoupe?.() ?? true;
  const etat = coupe ? 'coupe' : 'joue';
  if (b.dataset.etat !== etat) { b.dataset.etat = etat; b.innerHTML = DESSIN_SON[etat]; }
  b.setAttribute('aria-label', coupe ? 'Rétablir le son' : 'Couper le son');
}

/** Le point d'où partent les chiffres : le nœud de la corde. */
function pointCorde() {
  const n = $('noeud')?.getBoundingClientRect();
  if (!n?.width) return { x: innerWidth / 2, y: innerHeight * 0.3 };
  return { x: n.left + n.width / 2, y: n.top };
}

const OR = 'var(--projo)', BLEU = 'var(--bleu)', GRIS = 'var(--gris)';

function raconter(e) {
  const FX = window.FX;
  const pour = mien(e.side);

  switch (e.t) {
    case 'chant': {
      const q = Math.round((e.quality ?? 0) * 100);
      teteSaute(e.userId);
      if (e.backfire) { FX?.son?.('contre'); break; }
      FX?.son?.(q > 90 ? 'parfait' : 'chant');
      // Un geste parfait mérite d'être vu de loin, même chez l'adversaire.
      if (q > 90) {
        const p = pointCorde();
        FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 220 });
      }
      break;
    }

    /**
     * Une poussée arrive au nœud.
     *
     * **La sienne est grosse, celle d'en face reste petite** — et ce n'est pas
     * du favoritisme, c'est ce qui les distingue. Les deux montaient du même
     * nœud, à vingt-deux pixels, à vingt-six pixels d'écart et dans deux
     * couleurs : au milieu d'un duel, on ne lisait ni laquelle était la sienne,
     * ni combien elle valait. Un joueur qui vient de réussir une visée doit
     * voir ce que ça lui a rapporté ; ce que l'autre encaisse, il lui suffit de
     * le remarquer.
     *
     * Le seuil de six reste : sous six, une poussée est du bruit de fond que
     * personne n'a décidé, et l'annoncer en quarante-six pixels serait mentir
     * sur son importance.
     */
    case 'push': {
      if ((e.valeur ?? 0) < 6) break;
      const p = pointCorde();
      if (pour) {
        FX?.points?.(e.valeur, p, { couleur: OR, quoi: 'POUSSÉE' });
      } else {
        FX?.nombre?.(`+${e.valeur}`, { x: p.x - 26, y: p.y, couleur: BLEU, signe: false });
      }
      FX?.son?.(pour ? 'pousse' : 'contre');
      break;
    }

    /**
     * Une carte part.
     *
     * C'était un nom de carte qui montait du nœud, en sept pixels, pendant une
     * seconde. Deux cartes de la même famille se ressemblaient donc totalement
     * au moment exact où elles comptent le plus, et l'adversaire — qui n'a pas
     * la carte en main — n'avait aucun moyen de savoir ce qui lui tombait
     * dessus sans avoir lu ce mot au vol.
     *
     * La carte se montre maintenant en grand, avec son dessin, et se replie
     * vers la corde où son effet va se lire. L'onde reste au nœud : elle dit
     * « quelque chose arrive ici », la carte dit « et c'est ça ».
     */
    case 'action': {
      const a = carteDef(e.cardId);
      const p = pointCorde();
      FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 200 });
      // La carte qu'on vient de toucher, quand c'est la nôtre : elle part de
      // sa place dans la main, ce qui rattache le geste à ce qu'il déclenche.
      const depuis = pour
        ? document.querySelector(`#mainCartes [data-jouer="${e.cardId}"]`) : null;
      window.TBF_ACTION.jouee(a, { pour, vers: p, depuis });
      break;
    }

    case 'shield': {
      const p = pointCorde();
      FX?.nombre?.(`−${e.absorbe}`, { x: p.x, y: p.y + 18, couleur: GRIS, signe: false });
      FX?.son?.('bache');
      break;
    }

    /* La Relève. C'est le seul moment du duel où un personnage change
       durablement, et il a coûté des écharpes puis un emplacement de deck :
       il mérite d'être vu. On annonce le nouveau nom, parce que c'est ce qui
       rend le changement lisible — les modificateurs, eux, ne se voient qu'au
       geste suivant. */
    case 'evolve': {
      const p = pointCorde();
      FX?.titre?.(pour ? e.nom.toUpperCase() : 'RELÈVE ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.onde?.({ ...p, couleur: pour ? OR : BLEU, taille: 260 });
      FX?.son?.(pour ? 'parfait' : 'carte');
      break;
    }

    case 'reflected':
      FX?.titre?.('RENVOI', null, 'var(--vert)', 30);
      FX?.son?.('carte');
      break;

    case 'rally':
      FX?.titre?.(pour ? 'CHANTE MAINTENANT' : 'APPEL ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.son?.(pour ? 'parfait' : 'tic');
      break;

    case 'sync':
      FX?.titre?.(pour ? 'TOUS ENSEMBLE' : 'CHŒUR ADVERSE', null,
        pour ? OR : BLEU, pour ? 30 : 22);
      FX?.son?.(pour ? 'parfait' : 'tic');
      break;

    /**
     * Le but du vrai match : le moment que tout le jeu attend. Trois cas —
     * pour toi, contre toi, ou pour les deux, ce qui arrive quand les deux
     * tribunes suivent le même club.
     */
    case 'but_reel': {
      const mon = S.vue?.moi?.side ?? 0;
      const [a, b] = e.souffles ?? [0, 0];
      const nous = mon === 0 ? a : b;
      const eux = mon === 0 ? b : a;
      if (!nous && !eux) break;
      if (nous && eux) {
        FX?.titre?.('LES DEUX TRIBUNES', e.joueur ?? null, 'var(--craie)', 34);
        FX?.son?.('but');
      } else {
        FX?.butReel?.({ pour: Boolean(nous), buteur: e.joueur, minute: e.minute });
      }
      break;
    }

    case 'goal':
      FX?.but?.({ pour, score: e.goals });
      break;

    case 'swap':
      FX?.son?.('tic');
      break;

    case 'disconnected':
    case 'back':
      // La tête du joueur change d'état toute seule au prochain rendu.
      FX?.son?.('tic');
      break;

    default:
      break;
  }
}

/**
 * La fin d'un duel.
 *
 * Elle tenait en un voile gris et un mot. Le bilan complet arrive maintenant du
 * serveur sur `nvn:fin`, et c'est lui qui fait l'écran.
 *
 * Ce repli reste pour les cas où le bilan n'arrive pas — une connexion coupée
 * au dernier instant, un serveur d'une version antérieure. Il vaut mieux un
 * résultat sec qu'un écran de jeu figé dont on ne sort pas.
 */
function finir(v) {
  if (S.bilanVu) return;
  S.bilanVu = true;
  /* Le repli est un écran de fin comme l'autre : il propose « Revenir », donc
     il doit rendre la porte au joueur. Un repli qui enferme est pire que pas
     de repli — voir montrerBilan. */
  window.TBF_BARRE?.enPartie?.(false);
  const gagne = v.vainqueur === v.moi?.side;
  const nul = v.vainqueur === null || v.vainqueur === undefined;
  voile(nul ? 'Match nul' : gagne ? 'Victoire' : 'Défaite',
    `${v.goals?.[v.moi?.side] ?? 0} – ${v.goals?.[(v.moi?.side ?? 0) ^ 1] ?? 0}<br>`
    + (v.mode === 'classe' ? 'Ce duel compte au classement.'
                           : 'Entraînement : sans effet sur le classement.'),
    { texte:'Revenir', action: () => { location.reload(); } });
}

/* ================================================ l'affiche et le bilan

   Les deux écrans qui encadrent le duel. Ils sont écrits ensemble parce qu'ils
   montrent les mêmes choses — les personnages, les camps, les couleurs — à deux
   moments : avant, quand tout est possible ; après, quand tout est joué.      */

/** L'adresse du dessin d'un Fanzzy, ou rien s'il n'en a pas. */
/**
 * **Sa tenue à soi, et celle de personne d'autre.**
 *
 * On ne connaît la tenue portée que du Fanzzy équipé du joueur : le serveur
 * ne dit pas celle des autres, et il n'y a aucune raison qu'il le fasse — le
 * duel se joue à armes égales, une tenue ne pousse pas plus fort. Le camp
 * d'en face garde donc son dessin de base, ce qui est aussi ce qu'il voit de
 * nous.
 *
 * `maTenue` est nul tant que le portefeuille n'a pas répondu : `adresse`
 * retombe alors sur `base`, c'est-à-dire sur l'image d'avant. Une vignette
 * qui arrive une seconde trop tôt vaut mieux qu'une vignette qui attend.
 */
/* **L'avatar en jeu**, tel que le serveur le résout : premier âge, repos,
   tenue du premier âge. C'est la règle des effets — « un deck entre
   toujours au premier âge » — et le Virage la suit déjà. */
let monAvatar = null;
window.TBF_ETATS?.charger?.().catch?.(() => {});
fetch('/api/fanzzy/state', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => { monAvatar = j?.wallet?.avatarEnJeu ?? null; })
  .catch(() => {});

const dessinFz = (id, variante, tenue) =>
  window.FZART?.adresse?.(id, variante, tenue ? { skin: tenue } : undefined) ?? null;

/** La vignette d'un Fanzzy sur l'affiche, avec son repli. */
function vignetteFz(f, entre, couleur) {
  /* La racine, parce que `monFanzzy` est la lignée et `f.id` l'âge : « TR32 »
     d'un côté, « TR32B » de l'autre pour le même personnage. */
  const racine = (s) => /^([A-Z]+\d+)/.exec(String(s ?? ''))?.[1] ?? s;
  const mien = monAvatar && racine(f.id) === monAvatar.id;
  /* Le sien passe par la fonction unique ; ceux d'en face gardent leur
     dessin de base — le serveur ne dit pas leur tenue, et n'a aucune raison
     de le faire. L'âge suit la partie : la carte Relève fait grandir en
     cours de match, et la vignette doit le montrer. */
  const src = mien
    ? window.FZART?.dessinAvatar?.({ ...monAvatar, age: f.id, evo: f.stade ?? 1 }, 'plein')
    : dessinFz(f.id, 'plein');
  return `<div class="fz-aff ${entre ? 'entre' : ''}" style="--ac:${couleur}">
    ${src ? `<img alt="" loading="lazy" src="${src}">` : ''}
    ${entre ? '<span class="tag">ENTRE</span>' : ''}
    <div class="voile-bas"><b>${esc(f.nom ?? f.id)}</b>
      <small>ÂGE ${f.stade ?? 1}${f.geste ? ` · ${esc(LABEL_GESTE[f.geste] ?? f.geste)}` : ''}</small>
    </div></div>`;
}

/** Cinq pastilles de forme, la plus récente à gauche. */
function formeHTML(liste) {
  if (!liste?.length) return '<span class="forme"><small>PREMIER DUEL</small></span>';
  const lettre = { win: 'V', loss: 'D', draw: 'N' };
  const v = liste.filter((x) => x.issue === 'win').length;
  const d = liste.filter((x) => x.issue === 'loss').length;
  const n = liste.length - v - d;
  const compte = [v && `${v} V`, d && `${d} D`, n && `${n} N`].filter(Boolean).join(' · ');
  return `<span class="forme">${
    liste.map((x) => `<i class="${x.issue}" title="${x.pour}–${x.contre}">${
      lettre[x.issue] ?? '?'}</i>`).join('')}<small>&nbsp;${compte}</small></span>`;
}

/**
 * L'affiche, avant le coup d'envoi.
 *
 * Un duel commençait sans qu'on sache contre qui on jouait ni avec quoi : la
 * corde apparaissait, et il fallait chanter. Tout ce qui est montré ici était
 * déjà connu du serveur à cet instant — il ne le disait à personne.
 *
 * Elle se retire d'elle-même : c'est une affiche, pas une salle d'attente, et
 * un joueur qui doit toucher un bouton pour entrer dans un duel déjà commencé
 * perd les secondes qu'il regarde.
 */
function montrerAffiche(a) {
  const mien = S.vue?.moi?.side ?? 0;
  $('afficheLieu').innerHTML = a.stade
    ? `<b>${esc(a.stade.nom)}</b>${a.stade.effet ? ` · ${esc(a.stade.effet)}` : ''}`
    : '';

  const parCote = [0, 1].map((c) => a.joueurs.filter((j) => j.side === c));
  /* Le sien d'abord, toujours. « En haut » veut dire « moi » sur les deux
     écrans du jeu, et changer cet ordre selon le camp tiré ferait chercher. */
  const ordre = mien === 0 ? [0, 1] : [1, 0];

  $('afficheCamps').innerHTML = ordre.map((cote, rang) => {
    const moi = cote === mien;
    const couleur = moi ? 'var(--projo)' : 'var(--bleu)';
    const bloc = parCote[cote].map((j) => `<div class="qui">
        <span class="camp-tag">${moi ? 'TOI' : 'EN FACE'}</span>
        <b>${esc(j.nom)}${j.bot ? ' · BOT' : ''}</b>
        ${j.bot ? '' : formeHTML(j.forme)}
      </div>
      <div class="trois">${j.fanzzy.slice(0, 3)
        .map((f, i) => vignetteFz(f, i === 0, couleur)).join('')}</div>`).join('');
    return `<div class="camp-bloc ${moi ? 'moi' : 'eux'}">${bloc}</div>`
      + (rang === 0 ? '<div class="versus">CONTRE</div>' : '');
  }).join('');

  $('affiche').hidden = false;
  FX?.son?.('gong');
  /* Six secondes : le temps de lire deux noms et de reconnaître trois têtes.
     Au-delà, on attend ; en deçà, on n'a rien vu. */
  setTimeout(() => { $('affiche').hidden = true; }, 6000);
}

/**
 * Le bilan, après le coup de sifflet.
 *
 * Cinq minutes de jeu se terminaient sur un voile gris avec un mot dessus —
 * moins qu'un message d'erreur. Tout ce qui est montré ici était compté pendant
 * la partie et n'était raconté à personne.
 */
function montrerBilan(b) {
  S.bilanVu = true;
  fermerVoile();
  /* Les messages du jeu s'effacent. Une infobulle de refus — « il te faut
     l'Arbitre pour changer de Fanzzy » — posée sur l'écran de résultat parle
     d'un coup qu'on ne peut plus jouer, et elle est au-dessus de tout puisque
     c'est son rôle pendant la partie. */
  $('toast')?.classList.remove('on');
  const mien = S.vue?.moi?.side ?? 0;
  const moi = b.joueurs.find((j) => j.side === mien) ?? b.joueurs[0];
  const lui = b.joueurs.find((j) => j.side !== mien) ?? b.joueurs[1];
  const nul = b.vainqueur === null || b.vainqueur === undefined;
  const gagne = !nul && b.vainqueur === mien;

  $('bilanTitre').textContent = nul ? 'MATCH NUL' : gagne ? 'VICTOIRE' : 'DÉFAITE';
  /* `--mc` sur la vignette et non une couleur sur le titre : le cadre, les
     rayons et le lettrage s'y accordent d'un seul réglage. Peindre le titre
     seul laissait la case en jaune sur une défaite. */
  /* **Vert pour la victoire, et non or.**

     Le Virage et la fiche de match peignent déjà la victoire en vert et la
     défaite en rouge ; ce seul écran la peignait en or. Le même événement
     avait deux couleurs selon l'endroit, et celle-ci était en plus celle
     des écharpes — sur un écran dont la première ligne annonce un gain
     d'écharpes. Trois écrans disent maintenant la même chose. */
  $('bilanCase').style.setProperty('--mc', nul ? 'var(--gris)'
    : gagne ? 'var(--vert)' : 'var(--flare)');
  /* L'écharpe du bandeau prend les couleurs du résultat : c'est la première
     chose que l'œil attrape, avant même d'avoir lu le mot. */
  const e = $('bilanEcharpe');
  e.style.setProperty('--e1', nul ? 'var(--gris)' : gagne ? 'var(--vert)' : 'var(--flare)');
  e.style.setProperty('--e2', nul ? '#4E5865' : gagne ? '#12613F' : '#8E1D12');
  e.style.width = '96px';

  $('bilanScore').innerHTML = `${b.goals?.[mien] ?? 0}<em>–</em>${b.goals?.[mien ^ 1] ?? 0}`;
  $('bilanLieu').textContent = b.stade ? b.stade.nom : '';

  /* --- les gains, en premier : c'est ce qu'on vient chercher --- */
  const g = b.gains;
  const gains = g ? `<div class="gains">
      <div class="gain"><b>+${g.echarpes ?? 0}</b><small>ÉCHARPES</small></div>
      ${g.xp ? `<div class="gain xp"><b>+${g.xp}</b><small>XP</small></div>` : ''}
      ${g.kop?.verse ? `<div class="gain kop"><b>+${g.kop.verse}</b><small>AU KOP</small></div>` : ''}
    </div>
    ${g.pourSonClub ? '<div class="attente">Doublé : tu poussais pour ton club.</div>' : ''}
    ${g.kop?.sansKop ? `<div class="attente">${g.kop.perdu} écharpes perdues — `
      + 'tu n’as pas de KOP pour les recevoir.</div>' : ''}`
    : '';

  /* --- la carte préférée --- */
  const pref = (j) => {
    if (!j?.preferee) return '';
    const carte = (S.catalogue ?? []).find((c) => c.id === j.preferee.id);
    const src = window.TBF_ACTION?.adresse?.(j.preferee.id) ?? null;
    return `<div class="pref">
      ${src ? `<img alt="" src="${src}">` : ''}
      <span class="t"><b>${esc(carte?.nom ?? j.preferee.id)}</b>
        <small>jouée ${j.preferee.fois} fois — ta carte du match</small></span></div>`;
  };

  /* --- les chiffres, les deux camps côte à côte --- */
  const ligne = (quoi, a, c) => `<div class="stat">
    <span class="g"><b>${a}</b></span><span class="quoi">${quoi}</span>
    <span class="d"><b>${c}</b></span></div>`;

  /* Les Fanzzy de chaque camp. Un camp qui n'en a pas laisse sa case vide, et
     la rubrique entière se retire quand aucun des deux n'en a : une donnée
     absente retire sa ligne, elle ne s'écrit pas « — ». Même règle pour le
     nom de l'adversaire dans le titre. */
  const fzListe = (j) => (j?.fanzzy ?? []).map((f) => esc(f.nom)).join(', ');
  const fzMoi = fzListe(moi), fzLui = fzListe(lui);
  const contre = lui?.nom ? ` · TOI CONTRE ${esc(String(lui.nom).toUpperCase())}` : '';

  $('bilanCorps').innerHTML = gains
    + pref(moi)
    + `<div class="bilan-titre tbf-cousu">LE MATCH${contre}</div>`
    + ligne('CHANTS', moi?.chants ?? 0, lui?.chants ?? 0)
    + ligne('CARTES JOUÉES', moi?.cartes ?? 0, lui?.cartes ?? 0)
    + ligne('CHANGEMENTS', moi?.changements ?? 0, lui?.changements ?? 0)
    + ligne('RELÈVES', moi?.releves ?? 0, lui?.releves ?? 0)
    + ligne('FERVEUR', moi?.ferveur ?? 0, lui?.ferveur ?? 0)
    + (fzMoi || fzLui ? `<div class="bilan-titre tbf-cousu">QUI A POUSSÉ</div>`
      + `<div class="stat"><span class="g" style="font-size:11px">${fzMoi}</span>
        <span class="quoi">TRIBUNE</span>
        <span class="d" style="font-size:11px">${fzLui}</span></div>` : '');

  /* **Et on le baisse.**

     Le défaut que ceci répare tenait en une phrase de joueur : « une fois le
     duel terminé, il ne se passe plus rien ». Personne ne baissait ce drapeau.
     Le bilan s'affichait, « REVENIR » appelait location.reload(), et le
     navigateur — voyant le corps de la page se dire encore en partie —
     demandait d'abord confirmation. Sur un téléphone cette demande se solde
     le plus souvent par un refus, et le bouton ne faisait rien du tout.

     Le joueur restait enfermé sur son propre écran de victoire.

     C'est l'ordre qui compte : on range le drapeau **avant** de poser le
     bouton, pour qu'aucun clic ne puisse arriver entre les deux. */
  window.TBF_BARRE?.enPartie?.(false);
  $('bilanSortir').onclick = () => { location.reload(); };
  $('affiche').hidden = true;
  $('bilan').hidden = false;
  FX?.son?.(gagne ? 'but' : 'tic');

  /* **Et la montée de niveau par-dessus, si elle a eu lieu.**

     Après le bilan et non à sa place : le joueur vient de finir un duel, et
     la première chose qu’il cherche est le score. La fête se pose ensuite,
     le temps qu’il ait lu — puis elle rend le bilan, qui est resté dessous.

     Le serveur ne met `montee` que s’il y a eu palier ; `feter` résout tout
     de suite sinon, donc rien ici n’a besoin de le vérifier deux fois. */
  setTimeout(() => { window.TBF_NIVEAU?.feter?.(b.gains?.montee); }, 1400);
}

/* ----------------------------------------------------- les gestes */

/**
 * Le mini-jeu. Toutes les durées viennent de `moi.gestes`, calculé par le
 * serveur avec les modificateurs du Fanzzy, de son équipement et des effets
 * en cours. Rien n'est écrit en dur ici, sinon l'affichage mentirait au
 * joueur dès qu'il s'équipe.
 */
function ouvrirGeste(kind, cfg) {
  return new Promise((resolve) => {
    const m = $('mini');
    m.style.setProperty('--c', COULEUR_GESTE[kind] ?? '#F5C33B');
    $('miniTitre').textContent = LABEL_GESTE[kind] ?? kind;
    $('miniAide').textContent = AIDE_GESTE[kind] ?? '';
    $('miniZone').innerHTML = '';
    // L’épreuve prend l’écran : rien ne doit passer devant. Voir `fermerGeste`.
    window.TBF_ACTION?.suspendre?.();
    m.classList.add('on');

    let k = 3;
    const tic = () => {
      if (k === 0) return lancer(kind, cfg, resolve);
      const c = document.createElement('div');
      c.className = 'compte';
      c.textContent = k--;
      m.appendChild(c);
      setTimeout(() => c.remove(), 550);
      setTimeout(tic, 560);
    };
    tic();
  });
}

function fermerGeste(taps) {
  $('mini').classList.remove('on');
  $('miniZone').innerHTML = '';
  /* Les cartes que l’adversaire a jouées pendant l’épreuve reviennent
     maintenant. Voir `suspendre` dans action-art.js : elles passaient
     par-dessus la grille, et on ne voyait plus ce qu’on était en train de
     faire — avec un chronomètre qui courait. */
  window.TBF_ACTION?.reprendre?.();
  return taps;
}

/**
 * Le déroulé d'un geste vit dans `/geste.js`, partagé avec le Grand Virage.
 *
 * Il était écrit ici **et** là-bas : trois gestes, deux implémentations, deux
 * décomptes, deux façons de fermer la fenêtre. Passer à dix gestes aurait
 * voulu dire en écrire vingt, et corriger chaque défaut deux fois.
 *
 * Ce qui reste à cette page, c'est son balisage : elle dit où poser le titre
 * et la zone de jeu, le fichier partagé dit ce qui s'y passe.
 */
/*
 * ## Et il rend la main, quoi qu'il arrive
 *
 * `jouer` ne rejette jamais de lui-même — son `switch` a une branche par
 * défaut — mais son exécuteur peut **lever**, et il n'y avait aucun
 * rattrapage : la promesse partait en erreur, `ouvrirGeste` ne se dénouait
 * jamais, et le `await` du gestionnaire de chants attendait pour toujours.
 *
 * Ce qu'un joueur voyait : **le panneau de l'épreuve figé sur l'écran**, la
 * corde cachée dessous, `S.occupe` resté vrai — donc plus un seul chant pour
 * le reste du duel. Et un duel a un adversaire et un chronomètre : rester
 * bloqué, c'est perdre. Même défaut au Grand Virage, corrigé de la même façon.
 */
function lancer(kind, cfg, resolve) {
  const rate = (e) => {
    console.error('[duel] le geste a levé :', e);
    resolve(fermerGeste(null));
  };
  try {
    window.TBF_GESTE.jouer(kind, cfg, { zone: $('miniZone') })
      .then((taps) => resolve(fermerGeste(taps)))
      .catch(rate);
  } catch (e) {
    /* Une levée **synchrone**, avant que la promesse existe : le `catch`
       ci-dessus ne la verrait pas, elle remonterait dans le `setTimeout` du
       compte à rebours, hors de toute reprise. */
    rate(e);
  }
}

/* ------------------------------------------------------------ gestes UI */

/**
 * Les cinq chants offerts.
 *
 * Le duel avait un bouton unique et le serveur imposait le geste. Il offre
 * maintenant le même répertoire que le Virage : le dessin porte la carte, le
 * coût est en haut à droite, la poussée en gros en bas — et choisir devient une
 * décision de souffle, ce qui était toute la différence entre les deux modes.
 *
 * **Chaque carte est posée une fois, et seul son état change.** La rangée se
 * reconstruisait dès que le souffle gagnait un point — plusieurs fois par
 * seconde pendant qu'il remonte — et un appui commencé sur une carte finissait
 * sur sa remplaçante. Elle passe maintenant par `accorder` : une carte par
 * chant du répertoire, retrouvée par son identifiant, et grisée ou rallumée
 * en place. Seul un changement de répertoire pose des cartes neuves.
 */
function rendreChants(v) {
  const moi = v.moi;
  const chants = v.chants ?? [];
  const souffle = Math.floor(moi?.breath ?? 0);
  const muet = (moi?.effets ?? []).some((e) => e.type === 'silence');

  accorder($('chants'), clesDe(chants.map((c) => c.id)),
    (_cle, i) => {
      const c = chants[i];
      return fabriquer(`<div class="chant" data-chant="${esc(c.id)}"
        style="--c:${COULEUR_GESTE[c.gest] ?? '#F5C33B'}">
        ${window.TBF_CHANT ? window.TBF_CHANT.illustration(c.id) : ''}
        <span class="c"></span><b></b><span class="g"></span><span class="p"></span></div>`);
    },
    (el, _cle, i) => {
      const c = chants[i];
      /* Trop cher, réduit au silence, ou partie finie : la carte se grise au
         lieu de disparaître. Une main qui rétrécit quand on manque de souffle
         cache exactement ce qu'on est en train de viser. */
      el.classList.toggle('dim', Boolean(muet || v.termine || souffle < c.cost));
      ecrire(el.querySelector('.c'), c.cost);
      ecrire(el.querySelector('b'), c.nom ?? c.id);
      ecrire(el.querySelector('.g'), LABEL_GESTE[c.gest] ?? c.gest);
      ecrire(el.querySelector('.p'), c.power);
    });
}

$('chants').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-chant]');
  if (!el || S.occupe) return;
  const moi = S.vue?.moi;
  const carte = (S.vue?.chants ?? []).find((c) => c.id === el.dataset.chant);
  if (!moi || !carte) return;
  if (moi.breath < carte.cost) return toast('Pas assez de souffle pour ce chant.');

  const cfg = moi.gestes;
  if (!cfg) return toast('Le serveur n\u2019a pas envoyé le barème du geste.');

  S.occupe = true;
  try {
    /* Le geste vient de **la carte**, comme au Virage. C'est ce que le serveur
       notera : lui envoyer autre chose ne changerait rien, il relit la carte. */
    const taps = await ouvrirGeste(carte.gest, cfg);
    if (taps) socket.emit('nvn:chant', { cardId: carte.id, taps });
    else toast('Ce geste n’a pas été enregistré — recommence.');
  } finally {
    /* **Dans un `finally`.** Il était après l'envoi, donc sauté dès que quoi
       que ce soit levait au-dessus — et `S.occupe` resté vrai éteint les chants
       pour le reste du duel, pendant que l'adversaire continue. */
    S.occupe = false;
  }
});

$('mainCartes').addEventListener('click', (e) => {
  const c = e.target.closest('[data-jouer]');
  if (!c || !socket?.connected) return;
  socket.emit('nvn:play', { cardId: c.dataset.jouer });
});

$('equipe').addEventListener('click', (e) => {
  const f = e.target.closest('[data-entrer]');
  if (!f || !socket?.connected) return;
  socket.emit('nvn:swap', { index: Number(f.dataset.entrer) });
});

/* --------------------------------------------------------- démarrage */

// fx.js est chargé en différé : on attend qu'il soit là pour lire l'état du son.
addEventListener('load', () => {
  reglerBoutonSon();
  $('son')?.addEventListener('click', () => {
    const coupe = window.FX?.sonCoupe?.(!window.FX.sonEstCoupe());
    reglerBoutonSon();
    if (!coupe) window.FX?.son?.('tic');   // on entend tout de suite que c'est revenu
  });
  /* Le son se coupe aussi depuis le mode calme du tiroir, ou depuis un autre
     onglet : le bouton suit, sans quoi il afficherait l'ancien état jusqu'au
     prochain clic. Posés ici, après fx.js, pour que son propre écouteur de
     `storage` ait déjà recopié la clé sur la racine quand on la relit. */
  addEventListener('tbf-calme', reglerBoutonSon);
  addEventListener('storage', (e) => {
    if (e.key === 'tbf-calme' || e.key === null) reglerBoutonSon();
  });
});

(async () => {
  /* **La socket ne doit jamais empêcher la page de s’afficher.**
  
     `io` vient de /socket.io/socket.io.js, servi par le serveur lui-même. Ce
     fichier peut manquer — un mandataire qui ne relaie pas ce chemin, une
     extension qui le bloque, une coupure au mauvais moment — et `io` est alors
     **indéfini**. L’appel levait, la fonction de démarrage rejetait, et rien
     de ce qui suit ne se jouait : aucun appel au serveur, aucun rendu.
  
     Vu du joueur, les deux seuls écrans qui chargent cette bibliothèque
     tombaient ensemble et en silence — le duel restait sur son « Chargement… »
     et le Virage restait blanc. Rien ne pouvait le lui expliquer, puisque le
     code qui aurait pu parler était après la ligne qui levait.
  
     Or la liste des matchs n’a aucun besoin de socket : elle arrive par des
     appels ordinaires. Seul **jouer** en a besoin. On sépare donc les deux : la
     page se dessine toujours, et l’absence de direct se dit à l’endroit où elle
     change quelque chose.
  
     Le rattrapage est volontairement large — `io` absent lève une
     ReferenceError, le constructeur peut lever autre chose. Ce qu’on veut ici
     n’est pas distinguer les causes, c’est ne pas perdre la page. */
  try { connecter(); }
  catch (e) { S.sansDirect = true; console.error('[duel] socket', e.message); }
  try {
    const [cat, matchs] = await Promise.all([
      api('/api/deck/catalogue'),
      api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`),
    ]);
    S.catalogue = cat.actions ?? [];
    // Ce que chaque format paie en plus. Voir `primeDeFormat` côté serveur.
    S.primes = cat.primes ?? {};
    S.matchs = matchs.matchs ?? [];
    formatsMemo = cat.formats ?? formatsMemo;

    // Le catalogue Fanzzy ne sert qu'aux couleurs de type des vignettes. Son
    // absence ne doit pas empêcher de jouer : le dessin retombe sur la craie.
    const dex = await api('/api/fanzzy/dex').catch(() => null);
    FZART.setTypes(dex?.types ?? {});

    let loadout = null;
    try { loadout = await api('/api/deck/loadout'); } catch { loadout = null; }
    sansDeckMemo = !loadout?.fanzzy?.length;

    // Un match du jour d'abord : c'est celui qu'on vient jouer.
    S.fixtureId = S.matchs.find((m) => m.mode === 'classe')?.id ?? S.matchs[0]?.id ?? null;

    /* **Arriver par un lien d'invitation.** Format, match et camp sont déjà
       décidés par celui qui a invité : on les pose, et il ne reste qu'à
       appuyer. Un lien qui ouvrirait la page au début du parcours ne serait
       pas une invitation, ce serait une adresse.

       Chaque valeur est vérifiée contre ce que la page connaît : un lien peut
       être vieux d'une heure, et le match plus être là. */
    {
      const q = new URLSearchParams(location.search);
      const f = q.get('format');
      if (f && (formatsMemo ?? []).includes(f)) S.format = f;
      const id = Number(q.get('match'));
      /* **La portée s’élargit si le match n’est pas dedans.**

         La liste s'ouvre sur « MES CLUBS ». Un lien qui nomme le match de
         quelqu'un d'autre — c'est-à-dire la plupart des liens, puisqu'ils
         viennent de la fiche d’un match quelconque — désignait donc une
         rencontre absente de `S.matchs`, et la ligne d’en dessous le laissait
         tomber en silence. Vu du joueur : « DUEL » ouvre un menu et oublie le
         match sur lequel il venait d’appuyer.

         On reprend donc la liste large, une fois, avant de renoncer. */
      if (Number.isInteger(id) && id > 0 && !S.matchs.some((m) => m.id === id)) {
        const large = await api('/api/deck/matchs?tous=1').catch(() => null);
        if (large?.matchs?.some((m) => m.id === id)) {
          S.matchs = large.matchs;
          S.tousLesMatchs = true;
        }
      }
      if (S.matchs.some((m) => m.id === id)) S.fixtureId = id;
      const c = Number(q.get('camp'));
      if (c === 0 || c === 1) S.camp = c;
    }

    // Ce qui attend déjà : la diffusion ne dira rien tant que personne ne bouge.
    await lireAttentes();
    rendrePrepa(sansDeckMemo, formatsMemo);
    /* **On amène le match sous les yeux.** La liste fait soixante lignes
       depuis qu’elle montre tout ce qui se joue : le match choisi, avec sa
       tribune et son bouton d’entrée dépliés dessous, pouvait se trouver très
       bas — et la page s’ouvrait alors sur le haut d’un menu. */
    document.querySelector('.mt.on')?.scrollIntoView({ block: 'center' });

    // Un duel peut être en cours si on revient sur la page.
    const etat = await api('/api/nvn/etat').catch(() => null);
    if (etat?.duelEnCours) socket.emit('nvn:resume');
  } catch (e) {
    if (e.message === 'auth') return;
    $('prepaCorps').innerHTML = `<div class="vide">Impossible de préparer le duel.<br>
      ${esc(MESSAGES[e.code] ?? e.code ?? 'Serveur injoignable')}</div>`;
  }
})();
</script>

<script src="/nav.js" defer></script>
