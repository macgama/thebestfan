<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Duel de tribunes — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<!-- Partager le lien de sa file : une file vit deux minutes, c'est le moment
     où l'on veut dire « viens, je t'attends ». -->
<script src="/partage.js" defer></script>
<style>
:root{--ambre:#E08A2C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
  overscroll-behavior:none}
/* `height` et non `min-height` : un écran de jeu ne se fait pas défiler. Tout
   doit tenir, et c'est l'arène qui absorbe ce qui reste — sinon le bouton de
   chant finit sous le pli et le joueur ne le trouve plus. */
#app{position:relative;width:100%;max-width:var(--colonne);height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 40% at 50% -4%,rgba(224,64,44,.14),transparent 60%),
             linear-gradient(180deg,#141A21,#0A0D11 45%,#0A0D11)}
/* La préparation, elle, peut défiler : la liste des matchs est longue. */
#prepa{overflow-y:auto;flex:1;min-height:0}

/* ------------------------------------------------------- préparation */

/* Réserve à droite pour le bouton de menu, qui flotte au-dessus de l'écran
   de jeu : sans elle il se pose sur ce que porte le coin. */
/* Le dégagement vient de `nav.js` : voir la note dans `virage.html`. */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--tbf-haut-d,62px) 6px var(--tbf-haut-g,62px)}
.top h1{font-family:var(--banner);font-size:20px;letter-spacing:.15em;margin:0}
/* **Onze pixels et 88 %, au-dessus du plancher de tout texte qui informe.**
   Le sous-titre était à 8,5 px et à moitié éteint : une devise, peut-être,
   mais écrite pour ne pas être lue. L'interlettrage recule pour que la ligne
   tienne entre les deux boutons flottants. */
.top h1 small{display:block;font-size:11px;letter-spacing:.16em;opacity:.88;margin-top:3px;font-family:var(--ui)}
/* Les titres de rubrique sont des titres cousus (`.tbf-cousu`, dans ui.css) :
   la page ne garde que leur place. Ils étaient à 42 % d'opacité — un intertitre
   qu'on devine au lieu de le lire. La précision entre parenthèses reste plus
   petite que le titre, jamais sous le plancher. */
h2{margin:20px 16px 9px}
h2 i,.souscarte h3 i{font-style:normal;font-size:11px;letter-spacing:.04em;
  text-transform:none;opacity:.88}

/* **Deux rails, au ton de l'écran.** Le format et la portée sont des choix
   exclusifs — un seul vaut à la fois — et c'est exactement ce que dit le rail
   `.tbf-onglets` partout ailleurs. Ils avaient chacun leurs boutons à eux, un
   jaune, un blanc, deux façons d'écrire « choisi » sur le même écran. Le rail
   porte le ton flare, celui des arènes sur l'accueil. La page ne garde que la
   place des rails ; la matière est celle de ui.css. */
.formats{margin:0 14px}
/* Les deux tribunes. Deux boutons larges et de même poids : aucun des deux
   n'est le choix par défaut, et c'est le propos — on vient tenir l'une ou
   l'autre. */
/* Ce sont des plaques (`.tbf-plaque`) : la tribune choisie prend le ton flare,
   l'autre reste en béton. La page ne garde que la mise en page — deux colonnes
   de même poids, le nom au-dessus du compte. Le nom passe à la ligne plutôt
   que de s'abréger : « Borussia Mön… » ne dit plus pour qui l'on chante. */
.tribunes{display:flex;gap:8px;padding:0 14px}
.trib{flex:1;min-width:0;padding:11px 8px;flex-direction:column;gap:3px;
  overflow-wrap:anywhere}
.raison.chezmoi b{color:var(--projo)}
/* L'onglet de format porte sa prime sur une seconde ligne : sur la même, à
   trois cent soixante pixels, « 2V2 +15 % » ne tenait pas dans un cinquième
   de rail et s'abrégeait. La colonne centre les deux lignes, et l'onglet sans
   prime avec elles. */
.fmt{display:flex;flex-direction:column;align-items:center;justify-content:center}
.fmt small{display:block;font-size:11px;line-height:14px;letter-spacing:.02em}

/* La portée de la liste des matchs. Elle imite les onglets de format juste
   au-dessus : même geste, même endroit, donc rien de neuf à comprendre. */

/* « Peu importe le format » : une case, sous les formats. Elle n’est pas un
   format de plus — cocher « tous » à côté de cinq choix exclusifs se lirait
   comme un sixième. D’où la forme d’un interrupteur, et sa place en dessous. */
/* Une plaque, comme tout ce qui se touche : en béton tant qu'elle est levée,
   au ton flare une fois cochée. La page garde la mise en page — la case à
   gauche, le texte aligné à gauche sur deux lignes — et la matière vient de
   ui.css. La coche est l'icône commune (`tbf-ico-coche`) : l'émoji se
   dessinait autrement d'un téléphone à l'autre, et `aria-pressed` dit l'état
   à qui ne voit pas la case. */
.souple{gap:10px;width:calc(100% - 28px);margin:8px 14px 0;
  padding:9px 11px;min-height:44px;text-align:left;justify-content:flex-start}
.souple .t{flex:1;min-width:0}
.souple .case{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;
  border:1px solid currentColor;font-size:13px;line-height:1}
.souple small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.02em;
  text-transform:none;margin-top:3px}
.portee{margin:0 14px 8px}

.matchs{padding:0 14px 8px;display:flex;flex-direction:column;gap:7px}
/* **Un fond, et plus de flou.** La ligne se posait sur un panneau dépoli :
   le flou se recalculait à chaque image pendant qu'on fait défiler soixante
   matchs, et au soleil le dépoli se lit comme du gris sale. `--panneau` est
   opaque désormais ; la ligne choisie pose sa teinte d'or **par-dessus** au
   lieu de le remplacer, sinon elle redevenait transparente.

   **Et le nom ne s'abrège plus.** Quatre pastilles à onze pixels ne laissent
   plus de place au nom sur un téléphone : elles passent à la ligne sous lui
   plutôt que de réduire « FC Sion – FC Bâle » à « FC Sion –… ». */
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;padding:11px 12px;border-radius:10px;
  border:1px solid rgba(242,238,228,.11);background:var(--panneau);cursor:pointer}
.mt.on{border-color:var(--projo);
  background:linear-gradient(rgba(245,195,59,.09),rgba(245,195,59,.09)),var(--panneau)}
.mt img{width:22px;height:22px;object-fit:contain;flex:none}
.mt .n{flex:1 1 130px;min-width:0;font-family:var(--banner);font-size:13px;letter-spacing:.02em;
  overflow-wrap:anywhere}
.mt .q{font-size:11px;letter-spacing:.08em;font-family:var(--banner);border-radius:4px;padding:2px 6px;
  border:1px solid currentColor;flex:none}
.mt .q.classe{color:var(--projo)}
.mt .q.entrainement{color:var(--gris)}
/* Le doublement pour son club. En vert, la couleur du gain — et non celle du
   mode de duel, pour qu’on ne confonde pas les deux informations. */
.mt .q.mien{color:var(--vert)}
/* Quelqu'un attend sur ce match. En bleu : ni le mode de duel, ni le gain —
   c'est une troisième information, et la confondre avec l'une des deux ferait
   lire « classé » là où il y a « du monde ». */
.mt .q.attente{color:var(--bleu, #7FB2FF);border-color:currentColor}
/* Le score : craie, et sa minute en second niveau. Le `i` n'est pas un
   italique — il ne l'est nulle part dans ce jeu — c'est la balise la plus
   courte pour un second niveau dans une pastille. Second niveau par le poids,
   plus par la taille ni par l'effacement : à huit pixels et à moitié
   transparente, la minute ne se lisait pas. */
.mt .q.sc{color:var(--craie);border-color:rgba(242,238,228,.22);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mt .q.sc i{font-style:normal;opacity:.88;margin-left:4px;font-weight:500}
.mt .q.sc.live{color:var(--flare);border-color:currentColor}
.raison.attend{opacity:.9}
.raison.attend b{color:var(--projo);font-family:var(--banner);font-size:13px}
/* Inviter, depuis la file. Une plaque au ton violet — celui des gens — posée
   au centre de la salle, à sa largeur. */
.inviter{margin-top:12px;align-self:center}
.trib small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  text-transform:none;font-weight:400}
/* Ce qui se déplie sous le match choisi. Rattaché à lui par la bordure et le
   décalage : sans ça, on lirait une section de page posée au milieu d'une
   liste, et non la suite du geste qu'on vient de faire. */
.souscarte{margin:-2px 0 4px 10px;padding:10px 0 4px 12px;
  border-left:2px solid var(--projo);display:flex;flex-direction:column;gap:2px}
/* « TA TRIBUNE » est un titre cousu, comme les rubriques du dessus. */
.souscarte h3{margin:8px 4px 6px}
.souscarte .raison{margin:0 4px 6px}
.souscarte .tribunes{padding:0}
.souscarte .gros{margin:8px 0 2px}
.raison{margin:0 16px 10px;font-size:11px;opacity:.88;line-height:1.6}

/* « ENTRER EN FILE » est une plaque pleine largeur au ton flare — jouer. La
   page garde sa place ; la matière, l'enfoncement et l'état fermé (gris,
   intouchable) viennent de ui.css. */
.gros{margin:12px 14px;width:calc(100% - 28px)}
.avert{margin:0 14px 10px;border:1px solid rgba(245,195,59,.35);border-radius:10px;padding:12px 14px;
  background:rgba(245,195,59,.07);font-size:12px;line-height:1.65}
.avert b{display:block;font-family:var(--banner);font-size:12.5px;letter-spacing:.06em;margin-bottom:5px;
  color:var(--projo)}
.avert a{color:var(--projo)}
/* Le renvoi vers la répétition. Discret exprès — il ne se met pas sur le
   chemin de quelqu'un qui vient chercher un duel. */
.repet{margin:0 14px 12px;font-size:11.5px;line-height:1.5;opacity:.88}
.repet a{color:var(--projo);text-decoration:none}
.repet a b{font-weight:600}

/* --------------------------------------------------------- le duel */

.jeu{flex:1;display:none;flex-direction:column;min-height:0}
.jeu.on{display:flex}

/* Même dégagement : en duel aussi les deux boutons flottent sur cet en-tête. */
.score{display:flex;align-items:center;gap:10px;flex:none;
  padding:12px var(--tbf-haut-d,62px) 8px var(--tbf-haut-g,62px)}
.score .camp{flex:1;min-width:0;text-align:center}
/* **Les mentions du bandeau : onze pixels et 88 %.** « TA TRIBUNE » et
   « CLASSÉ » étaient à huit et neuf pixels, à moitié éteints — le genre de
   mention qu'on ne lit qu'à l'arrêt, c'est-à-dire jamais pendant un duel.
   L'interlettrage recule pour que « TA TRIBUNE » tienne entre l'horloge et le
   bouton de retour à trois cent soixante pixels ; la hiérarchie tient par la
   taille des chiffres, pas par l'effacement des mots. */
.score .camp .nom{font-size:11px;letter-spacing:.1em;opacity:.88;font-family:var(--banner)}
.score .camp .b{font-family:var(--banner);font-size:27px;line-height:1.05}
.score .camp.moi .b{color:var(--projo)}
.score .horloge{font-family:var(--banner);font-size:16px;letter-spacing:.06em;opacity:.9;flex:none}
.score .horloge small{display:block;font-size:11px;letter-spacing:.08em;text-align:center;
  font-family:var(--ui);margin-top:2px}
/* Le son se coupe d'un toucher, et le choix survit d'une page à l'autre.
   Un jeu qui sonne sans qu'on puisse l'arrêter se joue en silence, onglet
   fermé. Fond opaque et sans flou : voir `.mt`.

   **Dans le coin de l'arène, et non plus dans celui de l'écran.** Il était
   posé à dix pixels du bord droit, en haut — exactement sous le bouton de
   menu, qui le recouvrait tout entier : sur un téléphone, le bouton n'existait
   pas. L'en-tête n'a pas de place à lui donner (« TA TRIBUNE » y tient déjà
   tout juste) ; le coin haut de l'arène est le seul endroit libre, loin de
   l'écart au centre et des tribunes en bas.

   **Quarante-quatre pixels sous le doigt, trente à l'œil.** La zone de touche
   est le bouton entier, transparent ; le disque visible est son `::before`.

   **L'état se dit par le dessin, plus par l'effacement.** Le glyphe était à
   55 %, et à 30 % une fois coupé : l'état n'était lisible qu'en comparant
   deux gris. Le haut-parleur est maintenant en craie pleine, avec ses ondes
   ou barré, et l'`aria-label` dit l'action. Au trait, en SVG : la note barrée
   par un caractère combinant se rendait différemment d'un téléphone à
   l'autre, comme les émojis que le socle a retirés. */
.son{position:absolute;top:2px;right:2px;z-index:6;width:44px;height:44px;padding:0;border:0;
  background:none;color:var(--craie);cursor:pointer;display:grid;place-items:center;isolation:isolate}
.son::before{content:'';position:absolute;inset:7px;border-radius:50%;z-index:-1;
  background:var(--panneau);border:1px solid rgba(242,238,228,.24)}
.son svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------------------------------------- l'arène

   La corde était une barre de trente-quatre pixels tout en haut de l'écran :
   le cœur du jeu réduit à une jauge de chargement. Elle occupe maintenant la
   place principale, et la position ne se lit plus à un curseur mais au
   **territoire** — ta couleur mange la leur, ou l'inverse. C'est lisible d'un
   coup d'œil, de loin, en jouant.

   Tout le reste de l'écran a maigri pour lui laisser la place. */
.arene{position:relative;flex:1 1 auto;min-height:132px;margin:6px 12px 0;border-radius:14px;
  overflow:hidden;border:1px solid rgba(242,238,228,.1);background:#070A0E}
.cote{position:absolute;top:0;bottom:0;width:50%;transition:width .2s cubic-bezier(.3,.9,.4,1)}
/* Le dégradé s’éteint **avant** le milieu, et non en arrivant dessus. Le
   territoire se lit à son bord — c’est lui qui avance ou recule — tandis que
   le centre est l’endroit où se trouvent la corde, l’écart et le stade. Il y
   avait là trois couches superposées, et on ne voyait plus le terrain. */
.cote.moi{left:0;background:
  linear-gradient(90deg,rgba(245,195,59,.44),rgba(245,195,59,.12) 62%,transparent)}
.cote.eux{right:0;background:
  linear-gradient(270deg,rgba(60,130,232,.44),rgba(60,130,232,.12) 62%,transparent)}

/* **Le terrain est couché d'un quart de tour, et seulement ici.**

   Les dessins de stade sont des vues aériennes : le terrain y court de haut
   en bas, les buts en haut et en bas, les deux tribunes sur les côtés.
   C'est la bonne orientation au Grand Virage, dont la corde est un rail
   **vertical** — voir `.track` dans `virage.html`.

   Le duel, lui, tend sa corde de gauche à droite. Le terrain la croisait
   donc en travers, et pousser vers la droite ne menait vers rien : on
   poussait vers une ligne de touche. Couché, l'axe du terrain devient celui
   de la corde, et pousser mène **vers le but d'en face**. C'est la même
   image qui raconte enfin la même chose que la mécanique.

   On tourne **le calque entier**, pas l'image seule. Les deux nappes de
   lumière des tribunes sont posées par `stade-art.js` en coordonnées du
   dessin : tourner l'image seule les aurait laissées sur la pelouse. En
   tournant le calque, elles suivent sans qu'une seule coordonnée change.

   `100cqh` / `100cqw` : la largeur du calque vaut la hauteur du cadre et
   inversement, donc une fois tourné il le remplit exactement. C'est la
   seule façon d'échanger deux dimensions qu'on ne connaît pas en CSS. Le
   `@supports` laisse les navigateurs sans unités de conteneur avec le
   décor debout : mal orienté vaut mieux que de travers.

   Conséquence assumée : les deux tribunes éclairées passent des côtés au
   long du terrain, l'or en bas — celle du joueur, du côté de ses cartes —
   et le bleu en haut. */
.stadewrap{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0;container-type:size}
/* **Dans un `@container` et non dans un `@supports`**, et la nuance a déjà
   coûté un écran : `@supports (width:1cqh)` demande au moteur s'il connaît
   l'unité, pas s'il sait confiner. Un moteur qui répond oui à la première
   question et non à la seconde rabat la mesure sur **la fenêtre** — le
   décor ferait alors plusieurs fois la taille de l'arène. Un bloc
   `@container`, lui, ne s'applique que là où le confinement fonctionne
   vraiment. `verif-pages` refuse la première forme, et il a raison.

   Sans confinement, on garde simplement le décor debout : mal orienté vaut
   mieux que de travers. */
/* **Préfixées par `.stadewrap`**, pour peser plus lourd que les règles du
   décor debout, écrites plus bas. Elles avaient la même spécificité, et
   un bloc `@container` n'a aucune priorité à lui : c'est l'ordre qui
   tranchait, et l'ordre donnait raison à celles d'en dessous. `inset: 0`
   annulait le centrage, `height: auto` et `translateY` celui de l'image —
   et le stade, couché d'un quart de tour autour d'une boîte restée dans
   le coin, ne se voyait plus que dans une bande à gauche du terrain. Le
   poids plutôt que l'ordre : on ne déplace pas un bloc que la prochaine
   retouche remettrait à sa place. */
@container (min-width:0px){
  /* `inset: auto` **d’abord** : c’est un raccourci des quatre bords, et écrit
     après `left`/`top` il les remettait à `auto` — la boîte partait du coin,
     et `translate(-50%,-50%)` la décalait encore d’une demi-taille. */
  .stadewrap .stade{position:absolute;inset:auto;left:50%;top:50%;
    width:100cqh;height:100cqw;border-radius:0;
    transform:translate(-50%,-50%) rotate(-90deg)}
  .stadewrap .stade .tbf-stade-fond{position:absolute;inset:0;left:0;top:0;
    width:100%;height:100%;object-fit:cover;object-position:50% 50%;
    transform:none}
}

/* Le stade en fond d'arène, quand il reste debout. Les mêmes règles qu'au
   Virage, et pour la même raison : `object-fit: cover` recadrerait sur la
   hauteur dès que la zone est plus étroite que le dessin, et c'est justement
   les deux tribunes, sur les côtés, qu'on perdrait. On impose la largeur, la
   hauteur déborde.

   Il était **plus sombre qu'au Virage** — 0,34 contre 0,5 — pour laisser
   passer les deux territoires colorés. Avec trois couches empilées, le stade
   ne se voyait plus du tout : on jouait sur un fond noir teinté, et le décor
   dont chaque lieu change les règles n'existait qu'en titre. Il passe donc
   au-dessus du Virage — 0,58 — et ce sont les territoires qui s'effacent avant
   le milieu, là où l’information se trouve. Voir `.cote`. */
.stade{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0}
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.58}
/* Le nom du lieu et ce qu'il change. Un stade qui modifie les règles sans le
   dire donne l'impression que le jeu triche : la phrase est courte, en bas de
   l'arène, et elle ne bouge plus. */
/* Onze pixels et 90 %, et une ombre dure en plus de la floue : la phrase est
   posée sur le dessin du stade, et c'est elle qui dit pourquoi le souffle
   revient plus vite ici. À neuf pixels et demi et à moitié éteinte, on
   devinait un nom de stade et rien de ce qu'il change. */
.lieu{position:absolute;left:10px;right:10px;bottom:7px;z-index:4;text-align:center;
  font-size:11px;letter-spacing:.04em;line-height:1.3;opacity:.9;pointer-events:none;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 1px 6px rgba(0,0,0,.9)}
.lieu b{font-family:var(--banner);letter-spacing:.1em;color:var(--projo)}
.lieu:empty{display:none}

/* La corde elle-même, tendue en travers de l'arène. */
.fil-corde{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
  background:linear-gradient(90deg,rgba(242,238,228,.15),rgba(242,238,228,.5),rgba(242,238,228,.15))}
.noeud{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:var(--craie);box-shadow:0 0 22px 5px rgba(242,238,228,.55);
  transition:left .2s cubic-bezier(.3,.9,.4,1);z-index:3}
.noeud::after{content:"";position:absolute;top:-46px;bottom:-46px;left:50%;width:1px;
  margin-left:-.5px;background:linear-gradient(180deg,transparent,rgba(242,238,228,.35),transparent)}

/* L'écart, en gros chiffres. Un nombre se lit plus vite qu'une position. */
.ecart{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:var(--banner);
  font-size:34px;line-height:1;letter-spacing:.02em;pointer-events:none;
  text-shadow:0 3px 20px rgba(0,0,0,.85);transition:color .25s}
.ecart small{display:block;font-size:11px;letter-spacing:.14em;opacity:.88;margin-top:5px}

/* La foule : un point par joueur, qui s'allume quand il chante. Ça remplace
   le fil de texte — on voit qui pousse, on ne le lit plus. */
.foule{position:absolute;bottom:9px;display:flex;gap:5px;align-items:flex-end;z-index:2}
.foule.moi{left:11px}
.foule.eux{right:11px;flex-direction:row-reverse}
.tete{width:9px;height:9px;border-radius:50% 50% 40% 40%;background:rgba(242,238,228,.18);
  transition:background .25s,transform .25s}
.foule.moi .tete.on{background:var(--projo)}
.foule.eux .tete.on{background:var(--bleu)}
.tete.chante{transform:translateY(-7px) scale(1.35)}
.foule .tete.parti{opacity:.25}

/* Les effets en cours. Onze pixels : un joueur réduit au silence doit lire
   « Silence radio » d'un coup d'œil, pas le déchiffrer à huit pixels et demi
   pendant que le chronomètre tourne. */
.effets{display:flex;gap:5px;flex-wrap:wrap;padding:6px 14px 0;flex:none;min-height:0}
.eff{font-family:var(--banner);font-size:11px;letter-spacing:.04em;border-radius:4px;padding:2px 7px;
  border:1px solid currentColor}

/* **`.jeu > .moi`, et non `.moi`.** La classe sert aussi à dire « mon camp »
   ailleurs dans la page — le chiffre du bandeau, la foule, le territoire,
   l'affiche — et la règle du bloc du joueur s'y appliquait en entier : huit
   pixels de haut et quatorze de côté sur le chiffre de sa tribune, qui
   tombait donc plus bas que celui d'en face, et sur son bloc de l'affiche, qui
   se décalait vers la droite. Le bandeau y gagne ses huit pixels, et l'arène
   avec lui. */
.jeu > .moi{padding:8px 14px 0;flex:none}
/* Les marges du bloc ont maigri de deux pixels chacune : c'est le prix des
   mentions à onze pixels, payé ici plutôt que par l'arène. */
.souffle{display:flex;align-items:center;gap:9px;margin-bottom:6px}
/* La jauge fait dix pixels : le plancher d'une barre qu'on lit pendant qu'on
   joue. */
.souffle .bar{flex:1;height:10px;border-radius:5px;background:rgba(242,238,228,.12);overflow:hidden}
.souffle .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),#7FB4FF);
  transition:width .2s linear}
.souffle b{font-family:var(--banner);font-size:12px;min-width:34px;text-align:right}
.souffle span{font-size:11px;letter-spacing:.1em;opacity:.88;font-family:var(--banner)}

/* Compact : trois portraits en ligne, le nom dessous. Ils prenaient un quart
   de l'écran en carré ; c'est l'arène qui a besoin de cette place.

   Fond opaque, sans flou : voir `.mt`. La tuile active pose son or par-dessus
   le panneau au lieu de le remplacer. */
.equipe{display:flex;gap:6px;margin-bottom:6px}
.fz{flex:1;border:1px solid rgba(242,238,228,.13);border-radius:8px;padding:5px;text-align:center;
  background:var(--panneau);cursor:default;min-width:0;display:flex;align-items:center;gap:6px}
.fz.actif{border-color:var(--projo);
  background:linear-gradient(rgba(245,195,59,.1),rgba(245,195,59,.1)),var(--panneau)}
.fz.dispo{cursor:pointer;border-style:dashed;border-color:var(--vert)}
.fz .txt{flex:1;min-width:0;text-align:left}
/* Le nom à onze pixels, en graisse moyenne et sans interlettrage : c'est ce
   qui fait tenir « La Reprise » entier dans un tiers de téléphone. Les noms
   longs — « Le Porteur de Banderole » — restent abrégés comme ils l'étaient
   déjà : sur deux ou trois lignes, ils prendraient à l'arène la hauteur
   qu'elle n'a pas, et le portrait dit déjà qui c'est. */
.fz b{display:block;font-family:var(--banner);font-size:11px;font-weight:500;letter-spacing:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz span{font-size:11px;opacity:.88;letter-spacing:.06em}
/* La vignette du Fanzzy. Un nom seul ne dit pas qui est en jeu ; le visage,
   oui. fx.js la fait respirer toute seule — même en duel, un personnage figé
   a l'air d'un autocollant. */
.fz .vig{position:relative;width:34px;height:34px;flex:none;border-radius:6px;overflow:hidden;
  background:#0A0E13}
.fz .vig svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Jamais centrée par `transform` : fz-vivant réécrit transform en entier. */
.fz .vig .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:top center}
.fz:not(.actif) .vig{filter:grayscale(.55);opacity:.7}

.main{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}
/* Coût et nom en bas, pas au centre : depuis que la carte porte un dessin, un
   texte centré se pose en plein milieu du sujet — sur le visage du capo, sur
   la flamme du fumigène. En bas, il tombe sur la partie déjà sombre. */
.ct{position:relative;aspect-ratio:.66;border-radius:7px;border:1px solid var(--fc,#8257DA);
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(0,0,0,.4));display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:2px;padding:3px 2px 5px;cursor:pointer;overflow:hidden}
/* L'emplacement vide n'a rien à cadrer : son « ? » reste au milieu. */
.ct.vide{justify-content:center}
/* Le glyphe de famille en fond, et le dessin par-dessus. Les deux sont en
   `position:absolute` sous le coût et le nom, qui restent au-dessus. */
.ct .sceau{position:absolute;left:50%;top:46%;width:66%;height:auto;
  transform:translate(-50%,-50%);opacity:.24;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ct .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%;filter:brightness(.62)}
/* Le voile qui rend le nom lisible sur le dessin : de la craie sur une
   tribune éclairée ne se lit pas sans lui. */
.ct::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,10,.45),transparent 42%,rgba(4,6,10,.9))}
.ct .co{position:relative;z-index:2;font-family:var(--banner);font-size:11px;
  color:var(--craie);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* **Le nom à onze pixels, en lettrage de banderole.** Il était à sept : « le
   dessin porte la carte », et c'est vrai tant qu'on connaît le dessin. Un
   joueur qui hésite entre deux cartes de la même famille lit le nom, et sept
   pixels ne se lisent pas. L'Oswald étroit le fait tenir sur deux lignes dans
   une carte de soixante pixels, sur la partie déjà sombre du dessin. */
.ct .nm{position:relative;z-index:2;font-family:var(--banner);font-size:11px;line-height:1.05;
  letter-spacing:.01em;text-align:center;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.9)}
/* **Hors service, elle s'éteint au lieu de pâlir.** Un tiers d'opacité
   emportait le coût, le nom et le compte à rebours avec le dessin : tout ce
   qu'il faut lire pour savoir quand la carte reviendra. La plaque de ui.css a
   déjà la bonne réponse — elle garde sa forme et perd sa couleur — et la carte
   la prend.

   **Sauf le compte à rebours.** Posée sur la carte, l'extinction valait pour
   tout ce qu'elle contient, et le chiffre qui dit quand elle reviendra
   tombait à 60 % de sa lumière. Elle est donc posée sur chaque enfant sauf
   lui ; le cadre perd sa couleur à part, et le dessin garde l'assombrissement
   qu'il recevait deux fois (le sien, puis celui de la carte). */
.ct.hs{border-color:rgba(242,238,228,.22);cursor:default}
.ct.hs>:not(.cd){filter:grayscale(.85) brightness(.6)}
.ct.hs>.illu{filter:grayscale(.85) brightness(.37)}
/* Le compte à rebours passe devant le voile : sans `z-index`, le pseudo-élément
   le peignait par-dessus et le chiffre s'assombrissait en haut de la carte. */
.ct .cd{position:absolute;inset:0;z-index:3;background:rgba(4,6,10,.72);
  display:flex;align-items:center;
  justify-content:center;font-family:var(--banner);font-size:13px;color:var(--craie)}
.ct.vide{border-style:dashed;border-color:rgba(242,238,228,.15);cursor:default}
/* Rien à assombrir dans un emplacement vide. */
.ct.vide::after{display:none}

/* La marge basse doit dégager toute la hauteur de la barre commune.

   nav.js ne réserve que 55 % de cette hauteur sur les écrans de jeu, parce
   qu'il s'y efface dès qu'on joue et qu'une réserve pleine mangerait la place
   utile. Le calcul tient pour du contenu qu'on lit ; il ne tient pas pour la
   seule action du jeu. Mesuré : le bouton passait 16 px sous la barre, et un
   joueur visant « CHANTER » pendant une pause touchait « PROFIL » — il
   quittait le duel en cours. On complète donc les 45 % manquants ici, sur la
   page qui en a besoin, plutôt que d'alourdir la réserve du Virage et du
   duel un contre un. */
/* ------------------------------------------------- les chants offerts

   Cinq cartes, exactement celles du Virage — c'est la dernière différence entre
   les deux modes qui tombe. Les règles sont reprises telles quelles : le dessin
   porte la carte, le coût en haut à droite, la poussée en gros en bas.

   Le coût est posé en absolu dans le coin, et « À perdre haleine » passait
   dessous. La place lui est gardée **sur la première ligne du nom
   seulement** — voir `.chant b` — et non plus par un `padding-right` qui
   rognait toutes les lignes. Interlignes et marges intérieures serrés comme
   au Virage : chaque pixel de la rangée est pris à l'arène. */
.chants{display:flex;gap:5px;
  margin-bottom:calc(10px + var(--nav-h,62px) * .45 + env(safe-area-inset-bottom))}
.chant{flex:1;min-width:0;border-radius:9px;padding:6px 5px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.34);cursor:pointer;
  border:1px solid rgba(242,238,228,.14);border-top:3px solid var(--c);
  display:flex;flex-direction:column;gap:2px}
.chant:active{transform:translateY(3px) scale(.98)}
/* Trop cher : on le montre éteint plutôt que de le retirer. Une main qui
   rétrécit quand on manque de souffle cache justement ce qu'on vise — et une
   carte à un tiers d'opacité cache son prix, qui est justement ce qu'on
   regarde. Elle s'éteint donc comme une plaque hors service : la forme et
   les chiffres restent, la couleur part. */
.chant.dim{filter:grayscale(.85) brightness(.55);pointer-events:none}
/* **Le dessin en fond, et non en tête.** `chant-art.js` le pose avec la
   classe `fond`, et cette page stylait `.illu` : l'image entrait donc dans le
   flux, en bandeau de trente pixels au-dessus du nom, et poussait chaque carte
   d'autant vers le bas — trente pixels pris à l'arène sur un téléphone, pour
   un dessin qu'on ne voyait qu'à moitié. Le Virage, lui, stylait bien
   `.fond`. `.illu` n'est pas le bon nom de toute façon : fx.js fait respirer
   tout ce qui le porte, et un chant n'est pas un personnage. */
.chant .fond{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
/* **Le retrait du coût ne vaut que pour la première ligne.** Pris sur toutes
   par un `padding-right`, il ôtait un quart de la largeur à chaque ligne
   d'une carte de soixante pixels : « Le compte à rebours » s'écrivait sur
   quatre, et « Le roulement » sortait de la carte, coupé net. Un flottant
   d'une ligne de haut garde la place du coût sur la première seulement ; un
   mot trop long pour une ligne entière se coupe à la syllabe, comme le geste
   en dessous. Même réglage qu'au Virage. */
.chant b{position:relative;font-family:var(--banner);font-size:11.5px;line-height:1.05;
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.chant b::before{content:'';float:right;width:14px;height:1em}
/* Le geste, à onze pixels et en lettrage étroit : c'est lui qui dit quelle
   épreuve va s'ouvrir, et il était à huit pixels et à moitié éteint. Une carte
   de soixante pixels ne loge pas « CONTRETEMPS » sur une ligne à cette
   taille : le mot se coupe à la syllabe là où le téléphone sait le faire, et
   n'importe où plutôt que de sortir de la carte. */
.chant .g{position:relative;font-family:var(--banner);font-size:11px;line-height:1.05;
  letter-spacing:.02em;opacity:.88;text-transform:uppercase;
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.chant .p{position:relative;font-family:var(--banner);font-size:20px;color:var(--c);
  margin-top:auto;line-height:1}
/* `line-height:1` : le coût tient dans la hauteur de la première ligne du nom,
   et le flottant qui lui garde la place n'a pas à mordre sur la seconde. */
.chant .c{position:absolute;top:6px;right:5px;font-size:11px;line-height:1;opacity:.88;font-family:var(--banner)}
/* Sous 350 px, il ne reste que quarante pixels de texte par carte : on prend
   l'écart entre les cartes plutôt que d'ajouter une ligne au nom. */
@media (max-width:350px){
  .chants{gap:4px}
  .chant{padding-left:4px;padding-right:4px}
  .chant .c{right:4px}
}

/* ------------------------------------------------------ mini-jeu */

/* Idem pour la fenêtre des épreuves : une grille de mosaïque large de mille
   huit cents pixels ne se refait pas au pouce. */
.mini>*{max-width:var(--colonne)}
#miniZone{width:min(100%,var(--colonne))}
.mini{position:fixed;inset:0;z-index:80;background:rgba(4,6,10,.93);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mini.on{display:flex}
.mini h3{font-family:var(--banner);font-size:19px;letter-spacing:.16em;margin:0;color:var(--c,var(--projo))}
/* La consigne du geste : la seule chose à lire avant de jouer, donc à 88 %. */
.mini p{margin:0;font-size:12.5px;opacity:.88}
/* Le pavé rond, son anneau et ses deux lignes de texte vivent dans ui.css :
   c’est le même composant que le Virage et la salle de répétition dessinent.
   Cette page en avait la bonne version ; elle est désormais la seule. */
.compte{position:absolute;font-family:var(--banner);font-size:74px;opacity:.88;
  animation:fade .55s ease-out forwards}
@keyframes fade{to{opacity:0;transform:scale(1.5)}}

/* ---------------------------------------------------------- voiles */

/* ============================================ l'affiche et le bilan

   Deux écrans pleins qui encadrent le duel. Ils partagent une ossature — un
   bandeau en haut, le corps qui défile, une barre en bas qui ne défile pas —
   parce que ce sont les deux moitiés d'un même moment et qu'ils doivent se
   ressembler.

   `position:fixed` et non un voile posé dans `.jeu` : un duel qui se termine ne
   doit pas laisser voir sa corde figée derrière son résultat. */
/* **Le voile couvre l’écran, le contenu tient dans la colonne.**

   `inset: 0` est juste pour le fond — un duel qui se termine ne doit pas
   laisser voir sa corde derrière son résultat. Mais les enfants héritaient de
   cette largeur : sur un écran de bureau, l’affiche s’étalait sur mille neuf
   cents pixels pendant que le reste du jeu tenait dans neuf cents. Les trois
   vignettes de Fanzzy y faisaient six cents pixels de large chacune, la
   troisième sortait du champ, et il fallait faire défiler une affiche qui ne
   reste que six secondes.

   Les enfants sont donc ramenés à `--colonne`, comme `#app`. C’est la même
   règle que partout ailleurs dans le jeu : le fond est à l’écran, le jeu est
   dans la colonne. */
.grand>*{width:100%;max-width:var(--colonne);margin-inline:auto}
.grand{position:fixed;inset:0;height:100vh;height:100dvh;
  z-index:72;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -10%,rgba(224,64,44,.2),transparent 60%),
    linear-gradient(180deg,#11161D,#05070A 55%,#05070A);
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 12px)}
.grand[hidden]{display:none}
.grand-haut{flex:none;display:grid;justify-items:center;gap:7px;padding:0 16px 12px}
.grand-haut h2{margin:0;font-family:var(--banner);font-size:clamp(24px,7.4vw,34px);
  letter-spacing:.16em;line-height:1}
.lieu-nom{font-size:11px;letter-spacing:.12em;opacity:.88;font-family:var(--banner);
  text-align:center;line-height:1.5}
.lieu-nom:empty{display:none}
/* Le corps défile, la barre du bas jamais : le bouton de sortie doit rester
   sous le pouce quel que soit le nombre de lignes de statistiques. */
.bilan-corps,.camps{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 10px}
.grand-bas{flex:none;padding:10px 16px 0}
/* Les petites lignes de l'affiche et du bilan passent toutes à onze pixels et
   88 % : « Doublé : tu poussais pour ton club » est une information, et elle
   était écrite comme une note de bas de page. */
.attente{text-align:center;font-size:11.5px;letter-spacing:.1em;opacity:.88;
  font-family:var(--banner)}

/* ------------------------------------------------------------ l'affiche */

.camp-bloc{margin-bottom:10px}
.camp-bloc .qui{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.camp-bloc .qui b{font-family:var(--banner);font-size:16px;letter-spacing:.06em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp-bloc .qui .camp-tag{font-size:11px;letter-spacing:.08em;font-family:var(--banner);
  padding:2px 7px;border-radius:5px;flex:none}
.camp-bloc.moi .qui .camp-tag{background:var(--projo);color:#1B1305}
.camp-bloc.eux .qui .camp-tag{background:var(--bleu);color:#F4F8FF}
/* La forme récente : cinq pastilles, la plus récente à gauche. Elles se lisent
   d'un coup d'œil, sans lire un chiffre — c'est tout leur intérêt. */
.forme{display:flex;gap:3px;margin-left:auto;flex:none}
.forme i{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;
  font-style:normal;font-family:var(--banner);font-size:11px;line-height:1;
  box-shadow:0 0 0 1px rgba(4,7,11,.8)}
.forme i.win{background:var(--vert);color:#032116}
.forme i.loss{background:var(--flare);color:#2A0904}
.forme i.draw{background:var(--gris);color:#23211B}
.forme small{font-size:11px;opacity:.88;letter-spacing:.06em;align-self:center;
  font-family:var(--banner)}
/* Les trois Fanzzy d'un camp, côte à côte. Le premier est celui qui entre.

   **Bornés en hauteur autant qu'en largeur.** Chaque carte prenait un tiers
   de la colonne, et rien d'autre ne la retenait : sur un écran de bureau,
   deux rangées de cartes de trois cents pixels de large ne tenaient plus
   dans la fenêtre, et il fallait faire défiler une affiche qui ne reste
   que six secondes. La colonne est donc le plus petit de deux :
   un tiers de la largeur, ou ce que la hauteur laisse aux deux rangées une
   fois retirés le titre, les noms et le pied — trois cent trente pixels
   en tout, au ratio 63/80 de la carte. */
.trois{display:grid;gap:7px;justify-content:center;
  grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100vh - 330px) * .39))))}
@supports (height:100dvh){
  .trois{grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100dvh - 330px) * .39))))}
}
.fz-aff{position:relative;border-radius:11px;overflow:hidden;background:#0A0E13;
  box-shadow:0 0 0 2px #04070B,inset 0 0 0 1px rgba(242,238,228,.12);
  aspect-ratio:63/80;display:flex;flex-direction:column;justify-content:flex-end}
/* **En pied, et entier.** C'était le buste, carré, recadré en `cover` dans
   une carte en hauteur : on n'en voyait qu'un visage géant, coupé aux
   joues, et l'objet d'en face n'était plus qu'un gros plan de métal. Le
   plein-pied tient dans la carte sans rien perdre, posé sur son bord bas
   comme sur une scène. */
.fz-aff{background:radial-gradient(90% 60% at 50% 72%,rgba(242,238,228,.1),transparent 70%),#0A0E13}
.fz-aff img{position:absolute;inset:4px 4px 0;width:calc(100% - 8px);height:calc(100% - 4px);
  object-fit:contain;object-position:50% 100%}
.fz-aff .voile-bas{position:relative;padding:5px 6px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.92) 55%)}
.fz-aff b{display:block;font-family:var(--banner);font-size:11px;line-height:1.15;
  letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-aff small{display:block;font-size:11px;opacity:.88;letter-spacing:.04em}
/* Celui qui entre au coup d'envoi porte la couleur de son camp. */
.fz-aff.entre{box-shadow:0 0 0 2px var(--ac,var(--projo)),0 0 18px rgba(245,195,59,.3)}
.fz-aff .tag{position:absolute;top:5px;left:5px;font-size:11px;letter-spacing:.06em;
  font-family:var(--banner);background:var(--ac,var(--projo));color:#1B1305;
  padding:1px 5px;border-radius:4px}
.versus{text-align:center;font-family:var(--banner);font-size:13px;letter-spacing:.3em;
  opacity:.88;margin:4px 0 10px}

/* -------------------------------------------------------------- le bilan */

/* Le score est dans la vignette, sous le mot. Il garde la craie plutôt que la
   couleur du résultat : deux nombres en rouge vif se lisent comme une alerte,
   et c'est le mot qui doit porter le verdict. */
.bilan-score{font-family:var(--banner);font-size:clamp(30px,10vw,44px);line-height:1;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--craie);
  margin-top:7px}
.bilan-score em{font-style:normal;opacity:.3;margin:0 6px}
/* La vignette du résultat ne doit pas déborder la colonne, et ses rayons ne
   doivent pas fabriquer de défilement latéral — `inset:-42%` sort du cadre par
   construction. */
#bilanCase{max-width:min(360px,100%)}
.grand-haut{overflow:clip}
/* Les gains, en premier : c'est ce qu'on vient chercher. */
.gains{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;
  margin:0 0 12px}
.gain{padding:10px 8px;border-radius:11px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.3));
  box-shadow:0 0 0 2px #04070B,inset 0 1px 0 rgba(255,255,255,.1)}
.gain b{display:block;font-family:var(--banner);font-size:19px;line-height:1;
  color:var(--projo);font-variant-numeric:tabular-nums}
.gain small{display:block;font-size:11px;letter-spacing:.08em;opacity:.88;margin-top:4px}
.gain.kop b{color:var(--vert)}
.gain.xp b{color:var(--bleu)}
/* Les deux intertitres du bilan sont des titres cousus : la page ne garde que
   leur place. */
.bilan-titre{margin:14px 0 7px}
/* Une ligne de statistique par camp, les deux côte à côte : c'est la
   comparaison qui intéresse, pas le chiffre isolé. */
.stat{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:8px 10px;border-radius:9px;font-size:12px;
  border-top:1px solid rgba(242,238,228,.07)}
.stat:first-of-type{border-top:0}
.stat b{font-family:var(--banner);font-size:14px;font-variant-numeric:tabular-nums}
/* **L'or et le bleu appartiennent aux monnaies, pas aux camps.**

   Ces deux lignes peignaient « toi » en or et « lui » en bleu. Dix pixels
   plus haut, dans le même écran, l'or est la couleur des écharpes et le
   bleu celle de l'XP — voir `.gain b` juste au-dessus. Les deux mêmes
   couleurs disaient donc deux choses différentes sur la même image, et
   c'est exactement ce qu'un joueur a signalé.

   Ce sont les camps qui cèdent, et pas les monnaies : une écharpe est or
   partout dans le jeu — dans la barre, au kiosque, à la boutique — alors
   que « toi contre lui » n'a besoin d'aucune teinte. La colonne de gauche
   est la tienne, et elle est simplement **plus claire** que celle d'en
   face. C'est la hiérarchie qu'on veut sur son propre écran de résultat,
   et elle se lit sans avoir appris de code couleur.

   Plus claire par la teinte, et non plus par la transparence : le gris
   d'en face était encore effacé à 72 %, sous le plancher de lecture. La
   craie contre le gris suffit à la hiérarchie. */
.stat .g{text-align:right;color:var(--craie)}
.stat .d{text-align:left;color:var(--gris)}
.stat .quoi{font-size:11px;letter-spacing:.08em;opacity:.88;font-family:var(--banner);
  text-align:center;white-space:nowrap}
.pref{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
  background:rgba(255,255,255,.04);margin-bottom:6px}
.pref img{width:34px;height:46px;object-fit:cover;border-radius:6px;flex:none;
  box-shadow:0 0 0 1px rgba(4,7,11,.8)}
.pref .t{flex:1;min-width:0}
.pref .t b{display:block;font-family:var(--banner);font-size:13px}
.pref .t small{display:block;font-size:11px;opacity:.88;margin-top:2px}


/* ------------------------------------------------ la salle d'attente

   Elle était **trois phrases** : « 1 sur 3 », « il manque 2 supporters de
   Vissel Kobe », « des bots complètent après 120 secondes ». C'est exact, et
   ça ne donne envie de rien — on attend deux minutes devant un compteur, sans
   savoir qui est là ni voir arriver personne.

   Elle montre maintenant les deux tribunes, place par place : qui est entré,
   avec le Fanzzy qu'il aligne, et les places encore vides. Attendre devient
   regarder se remplir. */
.salle{width:100%;max-width:var(--colonne);display:flex;flex-direction:column;gap:12px;
  text-align:left}
/* Tout ce qui s'écrit dans la salle est à onze pixels au moins et en craie
   pleine : on y attend deux minutes, c'est l'écran qu'on lit le plus longtemps
   de tout le duel, et le voile est d'un noir sur lequel une craie à 88 %
   décroche au plein jour. Le compte « 1/3 » garde sa couleur de camp. */
.tribune-att h4{margin:0 0 7px;font-family:var(--banner);font-size:11px;letter-spacing:.12em;
  display:flex;align-items:center;gap:8px}
.tribune-att h4 em{font-style:normal;margin-left:auto;color:var(--c,var(--projo))}
.places-att{display:flex;gap:7px}
.place-att{flex:1;min-width:0;max-width:112px;aspect-ratio:63/84;border-radius:10px;position:relative;
  overflow:hidden;background:rgba(255,255,255,.03);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.12);display:flex;flex-direction:column;
  justify-content:flex-end}
.place-att.pris{box-shadow:inset 0 0 0 2px var(--c,var(--projo))}
.place-att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 20%}
.place-att .qui{position:relative;padding:5px 6px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.94) 58%)}
.place-att .qui b{display:block;font-family:var(--banner);font-size:11px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place-att .qui small{display:block;font-size:11px;opacity:.88;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Une place vide n'est pas un trou : elle dit ce qu'elle attend. C'est elle
   qui donne envie d'appuyer sur « inviter ». */
.place-att.libre{border:1px dashed rgba(242,238,228,.16);box-shadow:none;
  align-items:center;justify-content:center}
.place-att.libre span{font-family:var(--banner);font-size:11px;letter-spacing:.08em;
  text-align:center;padding:0 6px;line-height:1.3}
.place-att.libre::after{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 50% at 50% 50%,rgba(242,238,228,.07),transparent 70%);
  animation:respire 2.4s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.35}50%{opacity:1}}
/* Le rebours avant les bots. Un chiffre qui descend dit « ça avance » ; une
   phrase figée disait « c'est bloqué ». */
.rebours{font-family:var(--banner);font-size:11px;letter-spacing:.1em;
  text-align:center}
.rebours b{color:var(--projo);font-variant-numeric:tabular-nums}

/* Même règle que `.grand` : le voile couvre l’écran, son contenu tient dans
   la colonne. */
.voile>*{max-width:var(--colonne)}
/* Opaque, comme le voile du Virage : à 90 %, la préparation transparaissait
   sous la salle d'attente — « TOUS LES MATCHS » et les pastilles des matchs
   se lisaient entre les places, et l'écran paraissait sale. */
.voile{position:fixed;inset:0;z-index:70;background:#04060A;display:none;
  flex-direction:column;align-items:center;justify-content:safe center;gap:12px;
  overflow-y:auto;text-align:center;height:100vh;height:100dvh;
  padding:calc(env(safe-area-inset-top) + 28px) 28px calc(env(safe-area-inset-bottom) + 28px)}
.voile.on{display:flex}
.voile h2{font-family:var(--banner);font-size:23px;letter-spacing:.1em;margin:0;opacity:1}
/* **À pleine intensité, et c'est une question d'arithmétique.** Le texte du
   voile porte aussi la salle d'attente entière (voir `rendreSalle`), et
   l'opacité se multiplie en descendant : à 65 % ici, les places, les noms et
   le rebours ne pouvaient pas dépasser 65 % quoi qu'ils déclarent. La
   hiérarchie avec le titre tient par la taille. */
.voile p{margin:0;font-size:13px;line-height:1.7;max-width:300px}
.spin{width:26px;height:26px;border:2px solid rgba(242,238,228,.2);border-top-color:var(--projo);
  border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
/* La seule commande du voile — « Quitter la file », « Revenir » — est une
   plaque en béton (`#voileBtn`) : c'était un lien souligné, la seule action
   d'un écran plein dessinée comme une note en marge. */
/* Le message se pose au-dessus de toute la zone d'action, jamais dessus.

   Il était ancré à 96 px du bas, une valeur qui tombait en plein sur le
   bouton de chant — mesuré : 45 px de recouvrement. Or un refus s'affiche
   exactement au moment où le joueur regarde ce bouton. La position se calcule
   donc depuis les mêmes grandeurs que la marge du bouton, pour qu'elle suive
   si l'une d'elles change. */
/* ------------------------------------------------ le message d'erreur

   Il se posait **au-dessus d'une hauteur devinée** : `bottom: 124px`, la
   hauteur qu'avait la rangée de chants le jour où on l'a mesurée. Or cette
   rangée n'a pas de hauteur fixe — le nom d'un chant passe parfois à deux
   lignes, et le répertoire est tiré de l'identifiant du duel. Selon la partie,
   le message recouvrait le bouton de dix à quarante-six pixels, c'est-à-dire
   exactement le bouton que le joueur regarde au moment où on lui dit non.

   La hauteur est donc **mesurée** et non supposée : `--chants-h` suit la
   rangée, quoi qu'elle contienne. Le repli de 124 px reste pour le premier
   rendu, avant que la mesure ait eu lieu. */
.toast{position:fixed;left:50%;z-index:90;transform:translateX(-50%);background:#171C23;
  bottom:calc(var(--chants-h, 124px) + 12px + var(--nav-h,62px) * .45
              + env(safe-area-inset-bottom));
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;display:none;
  max-width:88vw;text-align:center}
.toast.on{display:block}
/* ------------------------------------------------- le fil du terrain

   Même bande qu'au Virage, même raison : le score du **vrai match**, que le
   duel ne montrait nulle part. Il est opaque et large parce que le score des
   tribunes est juste au-dessus en quarante pixels — deux nombres à l'écran,
   et c'est le mot « TERRAIN » qui dit lequel est la rencontre. */
.fil-match{flex:none;display:none;align-items:center;gap:10px;margin:0 13px 6px;
  padding:7px 11px;border-radius:9px;background:rgba(6,10,16,.78);
  border:1px solid rgba(242,238,228,.24);min-height:46px;text-align:left}
.fil-match.on{display:flex}
.fil-match .sc{flex:none;padding-right:10px;line-height:1;
  border-right:1px solid rgba(242,238,228,.14)}
.fil-match .sc b{display:block;font-family:var(--banner);font-size:17px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.fil-match .sc small{display:block;font-size:11px;letter-spacing:.1em;opacity:.9;
  margin-top:2px;color:var(--projo)}
.fil-match .min{flex:none;font-family:var(--banner);font-size:14px;color:var(--flare);
  letter-spacing:.04em;display:flex;align-items:center;gap:5px;
  font-variant-numeric:tabular-nums}
.fil-match .min::before{content:"";width:6px;height:6px;border-radius:50%;
  background:currentColor;animation:ping 1.8s ease-out infinite}
.fil-match .min.arret::before{animation:none;opacity:.5}
.fil-match .min.arret{color:var(--gris)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,64,44,.6)}
  70%{box-shadow:0 0 0 7px rgba(224,64,44,0)}100%{box-shadow:0 0 0 0 rgba(224,64,44,0)}}
.fil-match .qui{flex:1;min-width:0;font-size:11.5px;opacity:.88;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.vide{padding:30px 20px;text-align:center;opacity:.88;font-size:12.5px;line-height:1.8}
.vide a{color:var(--projo)}

/* **Le mouvement part, l'information reste.** Sous `prefers-reduced-motion`
   comme sous le mode calme « animations » (voir ui.css), les deux battements
   décoratifs de l'écran s'arrêtent : le point du direct sur la bande du
   terrain, et la lueur des places libres de la salle d'attente. Le point
   rouge et la place pointillée, eux, restent. En fin de feuille : ces règles
   ont le poids de celles qui posent les animations, et seul l'ordre les
   départage. */
@media (prefers-reduced-motion:reduce){
  .fil-match .min::before,.place-att.libre::after{animation:none}
}
html[data-calme~="animations"] .fil-match .min::before,
html[data-calme~="animations"] .place-att.libre::after{animation:none}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app">

  <div id="prepa">
    <div class="top"><h1>DUEL DE TRIBUNES<small>tirez la corde ensemble</small></h1></div>
    <div id="prepaCorps"><div class="vide">Chargement…</div></div>
  </div>

  <div class="jeu" id="jeu">
    <div class="score">
      <div class="camp moi"><div class="nom" id="nomMoi">TA TRIBUNE</div><div class="b" id="butsMoi">0</div></div>
      <div class="horloge"><span id="horloge">5:00</span><small id="modeTag">—</small></div>
      <div class="camp"><div class="nom" id="nomEux">EN FACE</div><div class="b" id="butsEux">0</div></div>
    </div>

    <!-- Le score du vrai match. Voir `.fil-match` : le duel affichait le
         score des tribunes et taisait celui de la rencontre. -->
    <div class="fil-match" id="filMatch">
      <span class="sc"><b id="filMatchScore">0 – 0</b><small>TERRAIN</small></span>
      <span class="min" id="filMatchMin"></span>
      <span class="qui" id="filMatchQui"></span>
    </div>

    <div class="arene" id="arene">
      <!-- Le stade, sous tout le reste. Le duel se jouait sur un fond noir uni
           pendant que le Virage montrait son lieu : même mécanique, deux
           décors, et le joueur ne pouvait pas savoir que les deux écrans
           parlaient du même jeu. -->
      <!-- Le décor est couché d’un quart de tour : voir `.stadewrap`.
           L’enveloppe existe pour porter la rotation sans la faire subir
           aux coins arrondis ni au découpage. -->
      <div class="stadewrap"><div class="stade" id="stade"></div></div>
      <div class="cote moi" id="coteMoi"></div>
      <div class="cote eux" id="coteEux"></div>
      <div class="fil-corde"></div>
      <div class="noeud" id="noeud"></div>
      <div class="ecart" id="ecart">0<small>ÉGALITÉ</small></div>
      <div class="foule moi" id="fouleMoi"></div>
      <div class="foule eux" id="fouleEux"></div>
      <div class="lieu" id="lieu"></div>
      <!-- Le son, dans le coin de l'arène : voir `.son`. Le dessin est posé
           par `reglerBoutonSon`, selon l'état retenu par fx.js. -->
      <button class="son" id="son" type="button" aria-label="Couper le son"></button>
    </div>

    <div class="effets" id="effets"></div>

    <div class="moi">
      <div class="souffle">
        <span>SOUFFLE</span>
        <div class="bar"><i id="souffleBar" style="width:40%"></i></div>
        <b id="souffleVal">40</b>
      </div>
      <!-- **Ce que tu portes.** Une ligne, et le détail au toucher.

           C'est l'arène où le joueur a *choisi* ce qu'il porte — un deck, trois
           Fanzzy, deux pièces chacun — et c'était celle où rien ne le lui
           montrait : les effets étaient composés par le serveur depuis toujours,
           sans qu'aucun écran ne les nomme. Le duel n'envoyait même pas la
           ventilation, là où le Virage l'envoyait déjà.

           Le contenu vient de `mods.js`, partagé avec le Virage : deux panneaux
           écrits séparément nommeraient les mêmes effets autrement, et le joueur
           apprendrait deux fois. -->
      <button class="tbf-apports-l" id="apportsL" hidden
        aria-expanded="false" aria-controls="apportsP"></button>
      <div class="tbf-apports-p" id="apportsP" hidden></div>
      <div class="equipe" id="equipe"></div>
      <div class="main" id="mainCartes"></div>
      <!-- Les cinq chants offerts. Le duel avait un bouton unique et le serveur
           imposait le geste ; il offre maintenant le même répertoire que le
           Virage, et choisir y est une décision de souffle. -->
      <div class="chants" id="chants"></div>
    </div>
  </div>
</main>

<div class="mini" id="mini">
  <h3 id="miniTitre">TEMPO</h3>
  <p id="miniAide"></p>
  <div id="miniZone"></div>
</div>

<!-- ====================================================== l'affiche et le bilan

     Deux écrans pleins, et non deux voiles avec un mot dessus. Ils encadrent le
     duel : l'un dit avec qui on entre, l'autre ce qu'on en ressort.

     Ils vivent hors de `.jeu` parce qu'ils le couvrent entièrement — un duel qui
     se termine ne doit pas laisser voir la corde figée derrière son résultat. -->
<div class="grand" id="affiche" hidden>
  <div class="grand-haut">
    <div class="tbf-echarpe" style="width:64px"></div>
    <h2>L’AFFICHE</h2>
    <div class="lieu-nom" id="afficheLieu"></div>
  </div>
  <div class="camps" id="afficheCamps"></div>
  <div class="grand-bas">
    <div class="attente" id="afficheAttente">Ça commence…</div>
  </div>
</div>

<div class="grand" id="bilan" hidden>
  <div class="grand-haut">
    <div class="tbf-echarpe" id="bilanEcharpe" style="width:64px"></div>
    <!-- Le résultat dans la même vignette que « GOAL ! ». Ce sont les deux mots
         que le jeu dit le plus fort ; qu'ils se ressemblent est ce qui les fait
         reconnaître avant d'être lus. -->
    <div class="tbf-vignette" id="bilanCase">
      <h2 class="tbf-vignette-mot" id="bilanTitre">—</h2>
      <div class="bilan-score" id="bilanScore"></div>
    </div>
    <div class="lieu-nom" id="bilanLieu"></div>
  </div>
  <div class="bilan-corps" id="bilanCorps"></div>
  <div class="grand-bas">
    <button class="tbf-plaque tbf-bloc tbf-grande" data-ton="flare" id="bilanSortir">
      REVENIR AU JEU</button>
  </div>
</div>

<div class="voile" id="voile">
  <div class="spin" id="voileSpin"></div>
  <h2 id="voileTitre"></h2>
  <p id="voileTexte"></p>
  <button class="tbf-plaque" id="voileBtn" style="display:none"></button>
</div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<!-- Sans « defer » : le script en ligne ci-dessous lit FZART et TBF_ACTION. -->
<!-- Le manifeste des états : sans lui, aucune tenue ne se dessine — elles
     n'existent que dans l'arborescence par âge, jamais dans l'art plat. Le
     duel ne le chargeait pas, et montrait donc chacun en tenue de base. -->
<script src="/fanzzy-etats.js"></script>
<!-- Le dictionnaire des effets, avant tout ce qui en affiche. Il ne depend
     de rien et ne charge rien : voir son en-tete. -->
<script src="/mods.js"></script>
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fond.js"></script>
<script src="/action-art.js"></script>
<!-- Le déroulé des dix gestes, partagé avec le Grand Virage. -->
<!-- Le stade et la lumiere de ses tribunes, comme au Virage. -->
<!-- Le dessin des dix-neuf chants, posé derrière leur nom. -->
<script src="/chant-art.js"></script>
<script src="/stade-art.js"></script>
<script src="/geste.js"></script>
<script>
/* =======================================================================
   Duel N contre N.

   Deux tribunes tirent sur la même corde pendant un vrai match. On chante —
   un geste noté par le serveur — et on joue des cartes qui changent les
   règles quelques secondes.

   Trois principes gouvernent cet écran :

   **Le serveur est la seule source.** `nvn:state` porte la vue complète du
   joueur après chaque action ; `nvn:events` sert aux animations et au fil,
   jamais à recalculer un état. Un client qui déduit son propre score finit
   toujours par diverger.

   **Les durées du geste viennent de `moi.gestes`.** Elles ne sont écrites
   nulle part ici. Le Grand Virage les avait en dur et affichait une
   pulsation de 560 ms là où le serveur notait à 630 : le porteur
   d'équipement tapait juste sur ce qu'il voyait et récoltait un tiers de la
   note. Le Métronome et le Vent de face changent cette fenêtre en cours de
   partie, donc on la relit à chaque vue.

   **Une erreur nomme sa cause.** Chaque code du serveur a sa phrase. Un
   « impossible » coûte toujours plus cher qu'il n'économise.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/* Les familles viennent de `action-art.js`, avec les dessins. Le duel en
   gardait sa propre table — la couleur seule — et c'est la façon habituelle
   dont deux écrans du même jeu finissent par ne plus dire pareil. */
const famDe = (a) => window.TBF_ACTION.famDe(a);

/* Les libellés des dix gestes viennent de `/geste.js`, avec leur déroulé :
   un nom écrit ici et un autre là-bas finiraient par ne plus se ressembler. */
const LABEL_GESTE = window.TBF_GESTE.LABEL;
const AIDE_GESTE = window.TBF_GESTE.AIDE;
const COULEUR_GESTE = window.TBF_GESTE.COULEUR;

/** Chaque code du serveur a sa phrase : le joueur doit savoir quoi corriger.
 *
 * **Deux préfixes, et on s'est trompé de l'un pour l'autre.** Les refus du
 * duel lui-même arrivent en `nvn.error.*` ; ceux de l'entrée en file passent
 * par `Cheat`, qui préfixe `ferveur.error.*` — c'est la classe du Virage,
 * réutilisée ici. Trois phrases étaient donc écrites sous le mauvais préfixe
 * et ne servaient à personne : un joueur sans deck lisait « Refusé par le
 * serveur : ferveur.error.no_deck », sur le geste le plus courant du jeu.
 *
 * Rien ne le signalait. Une entrée de ce tableau qui ne correspond à aucun
 * code ne rougit nulle part — elle a l'air d'un travail fait. `nvn:smoke`
 * compare maintenant les deux listes.
 */
const MESSAGES = {
  'nvn.error.not_in_duel':        'Tu n\u2019es dans aucun duel.',
  'nvn.error.rate_limited':       'Trop d\u2019actions d\u2019un coup. Respire.',
  'nvn.error.slot_lost':          'Ta place a été reprise : le duel a continué sans toi.',
  'nvn.error.server':             'Le serveur n\u2019a pas pu traiter cette action.',
  /* Hors du pr\u00e9fixe `nvn.error.`, et c'est voulu : le serveur n'envoie jamais
     ce code, c'est `api` qui le l\u00e8ve quand la r\u00e9ponse n'est pas du JSON. Le
     contr\u00f4le de `appels:test` v\u00e9rifie qu'aucune phrase en `nvn.error.` n'attend
     un code que personne n'envoie \u2014 celle-ci n'a donc rien \u00e0 faire dans ce
     pr\u00e9fixe-l\u00e0. */
  'app.error.illisible':          'Le serveur n\u2019a pas r\u00e9pondu correctement. R\u00e9essaie dans un instant.',

  /* Les six refus de l'entrée en file. Chacun dit **ce qui reste ouvert** :
     un refus qu'on annonce sans dire par où passer se lit comme une porte
     close, et aucun de ceux-là n'en est une. */
  'ferveur.error.unknown_format': 'Ce format de duel n\u2019existe pas.',
  'ferveur.error.no_deck':        'Tu n\u2019as pas encore de deck. Passe par DECK, il t\u2019en monte un.',
  'ferveur.error.fixture_unknown':'Ce match n\u2019existe plus. Reviens à la liste.',

/**
 * Le portrait d'un Fanzzy en jeu.
 *
 * Le dessin vient de /fanzzy-art.js, partagé avec le classeur et l'accueil :
 * un personnage se dessine au même endroit pour tout le jeu. Les trois Fanzzy
 * illustrés montrent leur portrait, les autres leur silhouette — et fx.js les
 * fait respirer dans les deux cas, sans qu'on ait rien à déclencher.
 */
function vignette(f) {
  const dessin = FZART.illustration(f, 'buste');
  if (dessin) return dessin;
  const svg = FZART.artProcedural(f);
  // La silhouette n'est pas un `.illu` : sans cet attribut elle resterait figée.
  return svg.replace('<svg ', `<svg data-vivant="${f.id}" `);
}

const api = async (p) => {
  const r = await fetch(p, { credentials:'same-origin' });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  /* **Le corps du refus se lit quel que soit le code** : le serveur répond
     `{ error: … }` et ce sont ces phrases-là que `MESSAGES` traduit.

     Mais une réponse qui n'est **pas du JSON** — une page d'erreur de
     l'hébergeur, un proxy qui répond à sa place — rendait un objet vide. Le
     chargement enchaînait alors sur `cat.actions ?? []` et `matchs.matchs ?? []`
     sans rien remarquer : l'écran annonçait **« aucun match à jouer »** là où le
     serveur était en panne. Le joueur repart en concluant qu'il n'y a personne
     ce soir, ce qui est la pire lecture possible d'une panne.

     On échoue donc, et le `catch` du chargement affiche « Impossible de
     préparer le duel » — qui est vrai, lui. Les appels secondaires gardent
     leur propre `catch` et dégradent comme avant. */
  const j = await r.json().catch(() => null);
  if (!j) {
    console.warn(`[duel] ${p} : ${r.status}, et ce n’est pas du JSON`);
    throw Object.assign(new Error('reponse illisible'), { code: 'app.error.illisible' });
  }
  if (j.error) throw Object.assign(new Error(j.error), { code:j.error });
  return j;
};

let toastT = null;
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 3400);
}
const dire = (code) => toast(MESSAGES[code] ?? `Refusé par le serveur : ${code}`);


/* ------------------------------------------------- faire venir quelqu'un

   Une file de duel ne vit que deux minutes. C'est exactement le moment où l'on
   voudrait dire « viens, je t'attends » — et le jeu n'avait aucun moyen de le
   faire. Le seul canal qui marche est celui que les gens emploient déjà :
   WhatsApp, un message.

   **Le lien envoie dans le camp d'en face.** C'est tout l'intérêt : deux
   joueurs du même côté ne se rencontrent jamais, ils attendent ensemble. Si
   celui qui reçoit suit un des deux clubs, le serveur décide pour lui de toute
   façon — on ne peut pas pousser contre son propre club, et le lien ne le fera
   pas changer d'avis. */
function lienDeMaFile(p) {
  const params = new URLSearchParams({
    match: String(p?.fixtureId ?? S.fixtureId ?? ''),
    format: String(p?.format ?? S.format),
  });
  // Le camp d'en face, pour que le duel parte au lieu de s'allonger.
  if (p?.camp === 0 || p?.camp === 1) params.set('camp', String(p.camp ^ 1));
  return `/duel-nvn?${params}`;
}

async function inviterAuDuel(p) {
  const chez = p?.enFaceClub?.name;
  const quoi = await window.TBF_PARTAGE.envoyer({
    titre: 'Duel de tribunes',
    texte: chez
      ? `Je t’attends en face, avec ${chez}. Tribune contre tribune.`
      : 'Je t’attends pour un duel de tribunes.',
    url: lienDeMaFile(p),
  });
  if (quoi === 'copie') toast('Lien copié.');
  else if (quoi === null) toast('Impossible de partager ici.');
}

function voile(titre, texte, bouton) {
  $('voileTitre').textContent = titre;
  $('voileTexte').innerHTML = texte ?? '';
  const b = $('voileBtn');
  if (bouton) { b.style.display = ''; b.textContent = bouton.texte; b.onclick = bouton.action; }
  else b.style.display = 'none';
  $('voileSpin').style.display = bouton ? 'none' : '';
  $('voile').classList.add('on');
}
const fermerVoile = () => $('voile').classList.remove('on');

/* ------------------------------------------------- quitter un duel en cours

   On pouvait partir sans rien : la salle attendait quatre-vingt-dix secondes,
   retirait le joueur « sans le punir », et le duel continuait à un contre zéro
   jusqu'au temps réglementaire. Celui qui restait gagnait en regardant une
   corde immobile ; celui qui partait ne perdait rien. Partir quand ça tourne
   mal était donc la façon la moins coûteuse de perdre.

   Le départ est maintenant un **forfait**, et il se dit avant : on perd le
   duel, on ne touche rien, et l'autre touche ce qui était prévu. Une sanction
   qu'on découvre après coup n'est pas une règle, c'est un piège.

   On intercepte la flèche de retour et le menu, qui sont les deux sorties —
   pas la fermeture de l'onglet, qu'aucune page ne peut retenir honnêtement et
   que la grâce de quatre-vingt-dix secondes couvre déjà. */
/* Un duel est **en cours** quand la corde est à l’écran et que le bilan ne
   l’est pas encore. Partir après le coup de sifflet n’est pas un forfait :
   il n’y a plus rien à abandonner. */
function enDuel() {
  return $('jeu').classList.contains('on')
    && $('bilan')?.hidden !== false;
}

async function confirmerForfait() {
  const prime = S.vue?.mode === 'classe' ? 'classé' : 'd’entraînement';
  return window.TBF_DIALOGUE?.confirmer({
    titre: 'QUITTER LE DUEL ?',
    texte: `Tu perds ce duel ${prime} par forfait et tu ne gagnes `
      + 'ni écharpe ni expérience. En face, la tribune gagne le duel et '
      + 'touche ce qui était prévu.',
    oui: 'ABANDONNER',
    non: 'RESTER',
    ton: 'flare',
  }) ?? true;
}

document.addEventListener('click', async (e) => {
  /* Voir `virage.html`, même correction et même cause : `.tbf-menu` n'existe
     nulle part — le tiroir de `menu.js` s'appelle `.tbf-tiroir`. Quitter un duel
     par le menu échappait donc au forfait et à sa confirmation, alors que c'est
     la sortie la plus naturelle une fois qu'on a décidé de partir.

     `a[href^="/"]` écarte la déconnexion, qui porte `href="#"` et demande déjà
     la sienne. */
  const sortie = e.target.closest('.tbf-retour, .tbf-tiroir a[href^="/"], [data-quitter-duel]');
  if (!sortie || !enDuel()) return;
  e.preventDefault();
  e.stopPropagation();
  const ou = sortie.getAttribute('href') || '/';
  if (!(await confirmerForfait())) return;
  /* On annonce le forfait **avant** de partir, et on laisse au serveur le temps
     de l'entendre : une navigation immédiate couperait la socket, et le duel
     retomberait dans la grâce de quatre-vingt-dix secondes — c'est-à-dire dans
     le comportement qu'on vient de retirer. */
  socket.emit('nvn:forfait');
  /* On vient de demander confirmation nous-mêmes, et le joueur a dit oui : le
     navigateur n'a pas à reposer la question par-dessus. Une seconde boîte,
     posée par-dessus la nôtre et dans d'autres mots, se lit comme un refus. */
  window.TBF_BARRE?.enPartie?.(false);
  setTimeout(() => { location.href = ou; }, 180);
}, true);

/* ------------------------------------------------ la salle d'attente

   Le serveur envoie désormais la composition des deux tribunes à chaque
   mouvement — voir `diffuserFile`. La page en fait des places : occupées, avec
   le portrait du Fanzzy que ce supporter aligne, ou libres et clignotantes.

   Ce qu'on gagne n'est pas décoratif. Dans un 3v3 entré seul, il manque deux
   supporters **de son côté** et trois en face : le message d'avant ne disait
   que le second nombre, et on ne pouvait pas inviter ce qu'on ne savait pas
   qu'il manquait. */

let reboursTimer = null;

function placeAttente(joueur, club) {
  if (!joueur) {
    return `<div class="place-att libre"><span>PLACE<br>LIBRE</span></div>`;
  }
  const img = joueur.fanzzy?.id ? FZART.illustration({ id: joueur.fanzzy.id }, 'buste') : '';
  // Sans nom connu, la ligne du nom se retire : la place reste prise, et le
  // Fanzzy ou le club en dessous dit qui l'occupe. Jamais un « — ».
  return `<div class="place-att pris">
    ${img}
    <span class="qui">${joueur.nom ? `<b>${esc(joueur.nom)}</b>` : ''}
      <small>${esc(joueur.fanzzy?.nom ?? club ?? '')}</small></span>
  </div>`;
}

function tribuneAttente(titre, joueurs, attendus, club, couleur) {
  const places = Array.from({ length: attendus },
    (_, i) => placeAttente(joueurs[i], club)).join('');
  return `<div class="tribune-att" style="--c:${couleur}">
    <h4>${esc(titre)}<em>${joueurs.length}/${attendus}</em></h4>
    <div class="places-att">${places}</div>
  </div>`;
}

function rendreSalle(p) {
  const t = p.tribunes ?? { moi: [], eux: [] };
  const corps = [];

  /* La mienne en haut : « en haut, c'est moi » est la convention de tous les
     écrans du jeu, et le serveur construit déjà le payload de ce point de vue. */
  // Le club après le point médian, seulement s'il est connu : sans lui, le
  // titre s'arrêtait sur un séparateur qui n'annonçait rien.
  const avecClub = (titre, club) => (club ? `${titre} · ${club}` : titre);
  corps.push(tribuneAttente(avecClub('MA TRIBUNE', p.club?.name),
    t.moi, p.attendus, p.club?.name, 'var(--projo)'));
  corps.push(tribuneAttente(avecClub('EN FACE', p.enFaceClub?.name),
    t.eux, p.attendus, p.enFaceClub?.name, 'var(--bleu)'));

  if (p.renfort > 1) {
    corps.push(`<div class="rebours">Renfort · ta ferveur compte
      <b>×${String(p.renfort).replace('.', ',')}</b></div>`);
  }
  /* Le rebours avant les bots, en clair. Le serveur envoie l'**instant** et non
     la durée : une durée envoyée une fois est fausse une seconde plus tard. */
  corps.push('<div class="rebours" id="rebours"></div>');
  if (window.TBF_PARTAGE?.possible) {
    /* Une plaque au ton violet : celui des gens, comme partout ailleurs. */
    corps.push('<button class="inviter tbf-plaque" data-ton="violet" id="inviter">'
      + 'Inviter quelqu’un</button>');
  }

  voile('LA SALLE D’ATTENTE', `<div class="salle">${corps.join('')}</div>`,
    { texte: 'Quitter la file', action: quitterFile });

  if ($('inviter')) $('inviter').onclick = () => inviterAuDuel(p);

  clearInterval(reboursTimer);
  const fin = Number(p.botA) || 0;
  const tic = () => {
    const n = $('rebours');
    if (!n) { clearInterval(reboursTimer); return; }
    const reste = Math.max(0, Math.round((fin - Date.now()) / 1000));
    n.innerHTML = reste
      ? `Des supporters d’appoint complètent dans <b>${reste}</b> s`
      : 'Des supporters d’appoint entrent…';
    if (!reste) clearInterval(reboursTimer);
  };
  if (fin) { tic(); reboursTimer = setInterval(tic, 1000); }
}

/* ------------------------------------------------------------ état */

const S = {
  /* **On ouvre sur le 1v1**, et non sur le 3v3.

     Le format choisi d'avance décide de tout ce qui suit : c'est lui qui
     indexe la file. Ouvrir sur un 3v3 posait donc le joueur qui n'y touche
     pas — la plupart — dans le format le plus dur à remplir du jeu : six
     supporters, trois de chaque côté, sur un même match.

     Un soir creux, cela veut dire attendre le repli — qui descend à 2v2 au
     tiers de l'attente, à 1v1 aux deux tiers — puis finir contre des bots.
     Une première partie passée à attendre, pour jouer contre personne.

     Le 1v1 est le seul format qui part à deux. C'est donc celui qui doit
     être proposé en premier : les quatre autres restent à un doigt, et
     celui qui les veut sait déjà ce qu’il vient chercher. */
  format: '1v1', fixtureId: null, camp: null, matchs: [], catalogue: [],
  // Ce qui attend, par match et par format. Voir `lireAttentes`.
  attentes: [],
  vue: null, enFile: false, dernierSeq: 0, occupe: false,
  /* Vrai quand la bibliothèque du direct n'a pas pu se charger. La page
     fonctionne quand même — on regarde les matchs — mais on ne peut pas
     entrer en file. Voir le démarrage, tout en bas. */
  sansDirect: false,
  // La portée de la liste des matchs : ses clubs, ou tout le championnat. On
  // peut jouer pour n’importe quel match — c’est ce qui permet de trouver un
  // adversaire un mardi de trêve — mais on démarre sur ses clubs, parce que
  // c’est là que le duel rapporte le double.
  tousLesMatchs: false,
};
const carteDef = (id) => S.catalogue.find((a) => a.id === id);

/* ---------------------------------------------------- préparation */

async function preparer() {
  try {
    const [cat, matchs] = await Promise.all([
      api('/api/deck/catalogue'),
      api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`),
    ]);
    S.catalogue = cat.actions ?? [];
    // Ce que chaque format paie en plus. Voir `primeDeFormat` côté serveur.
    S.primes = cat.primes ?? {};
    S.matchs = matchs.matchs ?? [];

    // Sans deck, la file refuserait l'entrée après trois minutes d'attente :
    // autant le dire tout de suite et pointer l'écran de construction.
    let deck = null;
    try { deck = await api('/api/deck/loadout'); } catch { deck = null; }
    const sansDeck = !deck || deck.error === 'deck.error.none' || !deck.fanzzy;

    rendrePrepa(sansDeck, cat.formats ?? ['1v1','2v2','3v3','4v4','5v5']);
  } catch (e) {
    if (e.message === 'auth') return;
    $('prepaCorps').innerHTML = `<div class="vide">Impossible de préparer le duel.<br>
      ${esc(MESSAGES[e.code] ?? e.code ?? 'Serveur injoignable')}</div>`;
  }
}

/* ============================================== qui attend, et où

   On entrait en file seul et aveugle : deux joueurs pouvaient attendre au même
   moment sur deux matchs différents sans jamais se croiser. La liste dit
   maintenant ce qui attend, match par match — **combien, et de quel côté.
   Jamais qui.**

   La donnée arrive par deux chemins : demandée au chargement, puis diffusée à
   chaque mouvement. Entre « 2 t'attendent » et « 2 t'attendaient il y a trente
   secondes », il y a toute la différence entre une invitation et une
   déception. */

/** L'attente sur ce match, dans le format choisi, ou `null`. */
const attenteDe = (m) => S.attentes.find(
  (a) => a.fixtureId === m.id && a.format === S.format) ?? null;

/** Le camp qui manque de monde, et combien il en manque. */
function manqueDe(a) {
  if (!a) return null;
  const camp = a.camps[0] <= a.camps[1] ? 0 : 1;
  return { camp, combien: Math.max(0, a.attendus - a.camps[camp]) };
}

async function lireAttentes() {
  try {
    const r = await api('/api/nvn/attentes');
    S.attentes = r.attentes ?? [];
  } catch { /* le panneau d'affichage n'est pas la page : on s'en passe */ }
}

function rendrePrepa(sansDeck, formats) {
  const out = [];

  /* **Sans direct, on le dit tout de suite.** L'écran reste utile — la liste
     des matchs, les formats, tout se lit — mais entrer en file demande une
     connexion permanente, et mieux vaut l'apprendre avant d'appuyer. Le lien
     mène au diagnostic, qui teste cette connexion et nomme ce qui l'arrête. */
  if (S.sansDirect) {
    out.push(`<div class="avert"><b>PAS DE CONNEXION EN DIRECT</b>
      Les duels ont besoin d’une connexion permanente, et elle n’a pas pu
      s’établir. Tu peux regarder les matchs, mais pas entrer en file.
      <a href="/diagnostic">Voir ce qui la bloque</a></div>`);
  }

  if (sansDeck) {
    out.push(`<div class="avert"><b>IL TE FAUT UN DECK</b>
      Trois Fanzzy et dix cartes, à composer une fois pour toutes.
      <a href="/deck">Construire mon deck</a></div>`);
  }

  /* **Le geste se répète avant, jamais pendant.**

     Un duel dure cinq minutes et chaque carte y coûte du souffle : c'est le
     plus mauvais endroit du jeu pour découvrir ce que « la jauge tient puis
     elle saute » veut dire. La salle de répétition les joue tous les vingt,
     sans mise et sans Fanzzy — et c'est ici qu'on y pense, sur l'écran où l'on
     attend, pas dans un menu qu'on n'ouvre pas quand on cherche un adversaire.

     Une ligne, pas une plaque : ce n'est pas une étape à franchir pour entrer
     en duel, et rien ne doit le laisser croire. */
  out.push(`<p class="repet"><a href="/repetition">Un geste te résiste ?
    <b>Va le répéter</b></a> — rien n'y compte, et rien n'y aide non plus.</p>`);
