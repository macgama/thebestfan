<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Duel de tribunes — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<!-- Partager le lien de sa file : une file vit deux minutes, c'est le moment
     où l'on veut dire « viens, je t'attends ». -->
<script src="/partage.js" defer></script>
<style>
:root{--ambre:#E08A2C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
  overscroll-behavior:none}
/* `height` et non `min-height` : un écran de jeu ne se fait pas défiler. Tout
   doit tenir, et c'est l'arène qui absorbe ce qui reste — sinon le bouton de
   chant finit sous le pli et le joueur ne le trouve plus. */
#app{position:relative;width:100%;max-width:var(--colonne);height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 40% at 50% -4%,rgba(224,64,44,.14),transparent 60%),
             linear-gradient(180deg,#141A21,#0A0D11 45%,#0A0D11)}
/* La préparation, elle, peut défiler : la liste des matchs est longue. */
#prepa{overflow-y:auto;flex:1;min-height:0}

/* ------------------------------------------------------- préparation */

/* Réserve à droite pour le bouton de menu, qui flotte au-dessus de l'écran
   de jeu : sans elle il se pose sur ce que porte le coin. */
/* Le dégagement vient de `nav.js` : voir la note dans `virage.html`. */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--tbf-haut-d,62px) 6px var(--tbf-haut-g,62px)}
.top h1{font-family:var(--banner);font-size:20px;letter-spacing:.15em;margin:0}
.top h1 small{display:block;font-size:8.5px;letter-spacing:.3em;opacity:.5;margin-top:3px;font-family:var(--ui)}
h2{font-family:var(--banner);font-size:10.5px;letter-spacing:.2em;opacity:.42;margin:20px 16px 9px}
h2 i{font-style:normal;opacity:.7}

.formats{display:flex;gap:6px;padding:0 14px}
/* Les deux tribunes. Deux boutons larges et de même poids : aucun des deux
   n'est le choix par défaut, et c'est le propos — on vient tenir l'une ou
   l'autre. */
.tribunes{display:flex;gap:8px;padding:0 14px}
.trib{flex:1;min-width:0;padding:11px 8px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(242,238,228,.18);background:rgba(0,0,0,.28);color:inherit;
  font-family:var(--banner);font-size:12.5px;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trib.on{background:var(--craie);color:#0B0E13;border-color:var(--craie)}
.raison.chezmoi b{color:var(--projo)}
.fmt{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.14);border-radius:9px;
  color:inherit;padding:12px 4px;font-family:var(--banner);font-size:13px;letter-spacing:.05em;cursor:pointer;
  opacity:.5}
.fmt.on{opacity:1;border-color:var(--projo);background:rgba(245,195,59,.12);color:var(--projo)}

/* La portée de la liste des matchs. Elle imite les onglets de format juste
   au-dessus : même geste, même endroit, donc rien de neuf à comprendre. */

/* « Peu importe le format » : une case, sous les formats. Elle n’est pas un
   format de plus — cocher « tous » à côté de cinq choix exclusifs se lirait
   comme un sixième. D’où la forme d’un interrupteur, et sa place en dessous. */
.souple{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:8px 14px 0;
  background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.13);border-radius:9px;
  padding:9px 11px;min-height:44px;color:inherit;cursor:pointer;text-align:left;
  font-family:var(--banner);font-size:11px;letter-spacing:.06em;opacity:.65}
.souple.on{opacity:1;border-color:var(--projo);background:rgba(245,195,59,.1);color:var(--projo)}
.souple .case{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;
  border:1px solid currentColor;font-size:11px;line-height:1}
.souple small{display:block;font-family:var(--ui);font-size:9.5px;letter-spacing:.02em;
  opacity:.6;margin-top:3px;color:var(--craie)}
.portee{display:flex;gap:6px;padding:0 14px 8px}
/* Quarante-quatre pixels : la pulpe d'un doigt, et le minimum des deux
   plateformes. L'audit d'interface les a tous comptés d'un coup — ce n'est
   jamais une faute de conception, c'est une hauteur qu'on ne mesure pas en
   regardant. */
.pt{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.13);border-radius:999px;
  color:inherit;padding:8px;min-height:44px;font-size:10px;letter-spacing:.1em;cursor:pointer;opacity:.5;
  font-family:var(--banner)}
.pt.on{opacity:1;border-color:var(--craie)}

.matchs{padding:0 14px 8px;display:flex;flex-direction:column;gap:7px}
.mt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  border:1px solid rgba(242,238,228,.11);background:var(--panneau);backdrop-filter:blur(10px);cursor:pointer}
.mt.on{border-color:var(--projo);background:rgba(245,195,59,.09)}
.mt img{width:22px;height:22px;object-fit:contain;flex:none}
.mt .n{flex:1;min-width:0;font-family:var(--banner);font-size:13px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .q{font-size:9px;letter-spacing:.11em;font-family:var(--banner);border-radius:4px;padding:3px 6px;
  border:1px solid currentColor;flex:none}
.mt .q.classe{color:var(--projo)}
.mt .q.entrainement{color:var(--gris);opacity:.7}
/* Le doublement pour son club. En vert, la couleur du gain — et non celle du
   mode de duel, pour qu’on ne confonde pas les deux informations. */
.mt .q.mien{color:var(--vert)}
/* Quelqu'un attend sur ce match. En bleu : ni le mode de duel, ni le gain —
   c'est une troisième information, et la confondre avec l'une des deux ferait
   lire « classé » là où il y a « du monde ». */
.mt .q.attente{color:var(--bleu, #7FB2FF);border-color:currentColor}
/* Le score : craie, et sa minute en plus petit. Le `i` n'est pas un
   italique — il ne l'est nulle part dans ce jeu — c'est la balise la plus
   courte pour un second niveau dans une pastille de neuf pixels. */
.mt .q.sc{color:var(--craie);border-color:rgba(242,238,228,.22);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mt .q.sc i{font-style:normal;opacity:.5;margin-left:4px;font-size:8px}
.mt .q.sc.live{color:var(--flare);border-color:currentColor}
.raison.attend{opacity:.9}
.raison.attend b{color:var(--projo);font-family:var(--banner);font-size:13px}
/* Inviter, depuis la file. Posé dans le texte du voile, donc en ligne. */
.inviter{display:inline-block;margin-top:12px;background:none;color:var(--projo);
  border:1px solid var(--projo);border-radius:8px;font:inherit;font-size:13px;
  padding:9px 16px;cursor:pointer}
.inviter:hover{background:rgba(245,195,59,.12)}
.trib small{display:block;font-family:var(--ui);font-size:9.5px;letter-spacing:.06em;
  opacity:.55;margin-top:3px;font-weight:400}
/* Ce qui se déplie sous le match choisi. Rattaché à lui par la bordure et le
   décalage : sans ça, on lirait une section de page posée au milieu d'une
   liste, et non la suite du geste qu'on vient de faire. */
.souscarte{margin:-2px 0 4px 10px;padding:10px 0 4px 12px;
  border-left:2px solid var(--projo);display:flex;flex-direction:column;gap:2px}
.souscarte h3{font-family:var(--banner);font-size:10px;letter-spacing:.18em;
  opacity:.45;margin:8px 4px 6px;font-weight:500}
.souscarte h3 i{font-style:normal;opacity:.7}
.souscarte .raison{margin:0 4px 6px}
.souscarte .tribunes{padding:0}
.souscarte .gros{margin:8px 0 2px}
.raison{margin:0 16px 10px;font-size:11px;opacity:.6;line-height:1.6}

.gros{margin:12px 14px;background:linear-gradient(180deg,var(--flare),#B32A1D);border:0;color:#fff;
  border-radius:10px;padding:15px;font-family:var(--banner);font-size:15px;letter-spacing:.1em;cursor:pointer;
  width:calc(100% - 28px)}
.gros:disabled{filter:grayscale(.85);opacity:.45;cursor:default}
.gros.calme{background:none;border:1px solid rgba(242,238,228,.2);color:inherit}
.avert{margin:0 14px 10px;border:1px solid rgba(245,195,59,.35);border-radius:10px;padding:12px 14px;
  background:rgba(245,195,59,.07);font-size:12px;line-height:1.65}
.avert b{display:block;font-family:var(--banner);font-size:12.5px;letter-spacing:.06em;margin-bottom:5px;
  color:var(--projo)}
.avert a{color:var(--projo)}
/* Le renvoi vers la répétition. Discret exprès — il ne se met pas sur le
   chemin de quelqu'un qui vient chercher un duel. */
.repet{margin:0 14px 12px;font-size:11.5px;line-height:1.5;opacity:.62}
.repet a{color:var(--projo);text-decoration:none}
.repet a b{font-weight:600}

/* --------------------------------------------------------- le duel */

.jeu{flex:1;display:none;flex-direction:column;min-height:0}
.jeu.on{display:flex}

/* Même dégagement : en duel aussi les deux boutons flottent sur cet en-tête. */
.score{display:flex;align-items:center;gap:10px;flex:none;
  padding:12px var(--tbf-haut-d,62px) 8px var(--tbf-haut-g,62px)}
.score .camp{flex:1;min-width:0;text-align:center}
.score .camp .nom{font-size:9px;letter-spacing:.16em;opacity:.5;font-family:var(--banner)}
.score .camp .b{font-family:var(--banner);font-size:27px;line-height:1.05}
.score .camp.moi .b{color:var(--projo)}
.score .horloge{font-family:var(--banner);font-size:16px;letter-spacing:.06em;opacity:.75;flex:none}
.score .horloge small{display:block;font-size:8px;letter-spacing:.14em;opacity:.5;text-align:center;
  font-family:var(--ui);margin-top:2px}
/* Le son se coupe d'un toucher, et le choix survit d'une page à l'autre.
   Un jeu qui sonne sans qu'on puisse l'arrêter se joue en silence, onglet
   fermé. */
.son{position:absolute;top:10px;right:10px;z-index:6;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(242,238,228,.16);background:var(--panneau);backdrop-filter:blur(10px);color:var(--craie);
  cursor:pointer;opacity:.55;font-size:13px;line-height:1;padding:0}
.son.coupe{opacity:.3}

/* ------------------------------------------------------------- l'arène

   La corde était une barre de trente-quatre pixels tout en haut de l'écran :
   le cœur du jeu réduit à une jauge de chargement. Elle occupe maintenant la
   place principale, et la position ne se lit plus à un curseur mais au
   **territoire** — ta couleur mange la leur, ou l'inverse. C'est lisible d'un
   coup d'œil, de loin, en jouant.

   Tout le reste de l'écran a maigri pour lui laisser la place. */
.arene{position:relative;flex:1 1 auto;min-height:132px;margin:6px 12px 0;border-radius:14px;
  overflow:hidden;border:1px solid rgba(242,238,228,.1);background:#070A0E}
.cote{position:absolute;top:0;bottom:0;width:50%;transition:width .2s cubic-bezier(.3,.9,.4,1)}
/* Le dégradé s’éteint **avant** le milieu, et non en arrivant dessus. Le
   territoire se lit à son bord — c’est lui qui avance ou recule — tandis que
   le centre est l’endroit où se trouvent la corde, l’écart et le stade. Il y
   avait là trois couches superposées, et on ne voyait plus le terrain. */
.cote.moi{left:0;background:
  linear-gradient(90deg,rgba(245,195,59,.44),rgba(245,195,59,.12) 62%,transparent)}
.cote.eux{right:0;background:
  linear-gradient(270deg,rgba(60,130,232,.44),rgba(60,130,232,.12) 62%,transparent)}

/* **Le terrain est couché d'un quart de tour, et seulement ici.**

   Les dessins de stade sont des vues aériennes : le terrain y court de haut
   en bas, les buts en haut et en bas, les deux tribunes sur les côtés.
   C'est la bonne orientation au Grand Virage, dont la corde est un rail
   **vertical** — voir `.track` dans `virage.html`.

   Le duel, lui, tend sa corde de gauche à droite. Le terrain la croisait
   donc en travers, et pousser vers la droite ne menait vers rien : on
   poussait vers une ligne de touche. Couché, l'axe du terrain devient celui
   de la corde, et pousser mène **vers le but d'en face**. C'est la même
   image qui raconte enfin la même chose que la mécanique.

   On tourne **le calque entier**, pas l'image seule. Les deux nappes de
   lumière des tribunes sont posées par `stade-art.js` en coordonnées du
   dessin : tourner l'image seule les aurait laissées sur la pelouse. En
   tournant le calque, elles suivent sans qu'une seule coordonnée change.

   `100cqh` / `100cqw` : la largeur du calque vaut la hauteur du cadre et
   inversement, donc une fois tourné il le remplit exactement. C'est la
   seule façon d'échanger deux dimensions qu'on ne connaît pas en CSS. Le
   `@supports` laisse les navigateurs sans unités de conteneur avec le
   décor debout : mal orienté vaut mieux que de travers.

   Conséquence assumée : les deux tribunes éclairées passent des côtés au
   long du terrain, l'or en bas — celle du joueur, du côté de ses cartes —
   et le bleu en haut. */
.stadewrap{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0;container-type:size}
/* **Dans un `@container` et non dans un `@supports`**, et la nuance a déjà
   coûté un écran : `@supports (width:1cqh)` demande au moteur s'il connaît
   l'unité, pas s'il sait confiner. Un moteur qui répond oui à la première
   question et non à la seconde rabat la mesure sur **la fenêtre** — le
   décor ferait alors plusieurs fois la taille de l'arène. Un bloc
   `@container`, lui, ne s'applique que là où le confinement fonctionne
   vraiment. `verif-pages` refuse la première forme, et il a raison.

   Sans confinement, on garde simplement le décor debout : mal orienté vaut
   mieux que de travers. */
/* **Préfixées par `.stadewrap`**, pour peser plus lourd que les règles du
   décor debout, écrites plus bas. Elles avaient la même spécificité, et
   un bloc `@container` n'a aucune priorité à lui : c'est l'ordre qui
   tranchait, et l'ordre donnait raison à celles d'en dessous. `inset: 0`
   annulait le centrage, `height: auto` et `translateY` celui de l'image —
   et le stade, couché d'un quart de tour autour d'une boîte restée dans
   le coin, ne se voyait plus que dans une bande à gauche du terrain. Le
   poids plutôt que l'ordre : on ne déplace pas un bloc que la prochaine
   retouche remettrait à sa place. */
@container (min-width:0px){
  /* `inset: auto` **d’abord** : c’est un raccourci des quatre bords, et écrit
     après `left`/`top` il les remettait à `auto` — la boîte partait du coin,
     et `translate(-50%,-50%)` la décalait encore d’une demi-taille. */
  .stadewrap .stade{position:absolute;inset:auto;left:50%;top:50%;
    width:100cqh;height:100cqw;border-radius:0;
    transform:translate(-50%,-50%) rotate(-90deg)}
  .stadewrap .stade .tbf-stade-fond{position:absolute;inset:0;left:0;top:0;
    width:100%;height:100%;object-fit:cover;object-position:50% 50%;
    transform:none}
}

/* Le stade en fond d'arène, quand il reste debout. Les mêmes règles qu'au
   Virage, et pour la même raison : `object-fit: cover` recadrerait sur la
   hauteur dès que la zone est plus étroite que le dessin, et c'est justement
   les deux tribunes, sur les côtés, qu'on perdrait. On impose la largeur, la
   hauteur déborde.

   Il était **plus sombre qu'au Virage** — 0,34 contre 0,5 — pour laisser
   passer les deux territoires colorés. Avec trois couches empilées, le stade
   ne se voyait plus du tout : on jouait sur un fond noir teinté, et le décor
   dont chaque lieu change les règles n'existait qu'en titre. Il passe donc
   au-dessus du Virage — 0,58 — et ce sont les territoires qui s'effacent avant
   le milieu, là où l’information se trouve. Voir `.cote`. */
.stade{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0}
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.58}
/* Le nom du lieu et ce qu'il change. Un stade qui modifie les règles sans le
   dire donne l'impression que le jeu triche : la phrase est courte, en bas de
   l'arène, et elle ne bouge plus. */
.lieu{position:absolute;left:10px;right:10px;bottom:7px;z-index:4;text-align:center;
  font-size:9.5px;letter-spacing:.08em;line-height:1.35;opacity:.55;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.9)}
.lieu b{font-family:var(--banner);letter-spacing:.14em;color:var(--projo);opacity:.9}
.lieu:empty{display:none}

/* La corde elle-même, tendue en travers de l'arène. */
.fil-corde{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
  background:linear-gradient(90deg,rgba(242,238,228,.15),rgba(242,238,228,.5),rgba(242,238,228,.15))}
.noeud{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:var(--craie);box-shadow:0 0 22px 5px rgba(242,238,228,.55);
  transition:left .2s cubic-bezier(.3,.9,.4,1);z-index:3}
.noeud::after{content:"";position:absolute;top:-46px;bottom:-46px;left:50%;width:1px;
  margin-left:-.5px;background:linear-gradient(180deg,transparent,rgba(242,238,228,.35),transparent)}

/* L'écart, en gros chiffres. Un nombre se lit plus vite qu'une position. */
.ecart{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:var(--banner);
  font-size:34px;line-height:1;letter-spacing:.02em;pointer-events:none;
  text-shadow:0 3px 20px rgba(0,0,0,.85);transition:color .25s}
.ecart small{display:block;font-size:8.5px;letter-spacing:.22em;opacity:.5;margin-top:5px}

/* La foule : un point par joueur, qui s'allume quand il chante. Ça remplace
   le fil de texte — on voit qui pousse, on ne le lit plus. */
.foule{position:absolute;bottom:9px;display:flex;gap:5px;align-items:flex-end;z-index:2}
.foule.moi{left:11px}
.foule.eux{right:11px;flex-direction:row-reverse}
.tete{width:9px;height:9px;border-radius:50% 50% 40% 40%;background:rgba(242,238,228,.18);
  transition:background .25s,transform .25s}
.foule.moi .tete.on{background:var(--projo)}
.foule.eux .tete.on{background:var(--bleu)}
.tete.chante{transform:translateY(-7px) scale(1.35)}
.foule .tete.parti{opacity:.25}

.effets{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px 0;flex:none;min-height:0}
.eff{font-family:var(--banner);font-size:8.5px;letter-spacing:.1em;border-radius:4px;padding:3px 7px;
  border:1px solid currentColor}

.moi{padding:8px 14px 0;flex:none}
.souffle{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.souffle .bar{flex:1;height:9px;border-radius:5px;background:rgba(242,238,228,.12);overflow:hidden}
.souffle .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),#7FB4FF);
  transition:width .2s linear}
.souffle b{font-family:var(--banner);font-size:12px;min-width:34px;text-align:right}
.souffle span{font-size:8.5px;letter-spacing:.12em;opacity:.45;font-family:var(--banner)}

/* Compact : trois portraits en ligne, le nom dessous. Ils prenaient un quart
   de l'écran en carré ; c'est l'arène qui a besoin de cette place. */
.equipe{display:flex;gap:6px;margin-bottom:8px}
.fz{flex:1;border:1px solid rgba(242,238,228,.13);border-radius:8px;padding:5px;text-align:center;
  background:var(--panneau);backdrop-filter:blur(10px);cursor:default;min-width:0;display:flex;align-items:center;gap:6px}
.fz.actif{border-color:var(--projo);background:rgba(245,195,59,.1)}
.fz.dispo{cursor:pointer;border-style:dashed;border-color:var(--vert)}
.fz .txt{flex:1;min-width:0;text-align:left}
.fz b{display:block;font-family:var(--banner);font-size:9.5px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz span{font-size:7.5px;opacity:.5;letter-spacing:.08em}
/* La vignette du Fanzzy. Un nom seul ne dit pas qui est en jeu ; le visage,
   oui. fx.js la fait respirer toute seule — même en duel, un personnage figé
   a l'air d'un autocollant. */
.fz .vig{position:relative;width:34px;height:34px;flex:none;border-radius:6px;overflow:hidden;
  background:#0A0E13}
.fz .vig svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Jamais centrée par `transform` : fz-vivant réécrit transform en entier. */
.fz .vig .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:top center}
.fz:not(.actif) .vig{filter:grayscale(.55);opacity:.7}

.main{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}
/* Coût et nom en bas, pas au centre : depuis que la carte porte un dessin, un
   texte centré se pose en plein milieu du sujet — sur le visage du capo, sur
   la flamme du fumigène. En bas, il tombe sur la partie déjà sombre. */
.ct{position:relative;aspect-ratio:.66;border-radius:7px;border:1px solid var(--fc,#8257DA);
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(0,0,0,.4));display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:2px;padding:3px 2px 5px;cursor:pointer;overflow:hidden}
/* L'emplacement vide n'a rien à cadrer : son « ? » reste au milieu. */
.ct.vide{justify-content:center}
/* Le glyphe de famille en fond, et le dessin par-dessus. Les deux sont en
   `position:absolute` sous le coût et le nom, qui restent au-dessus. */
.ct .sceau{position:absolute;left:50%;top:46%;width:66%;height:auto;
  transform:translate(-50%,-50%);opacity:.24;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ct .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%;filter:brightness(.62)}
/* Le voile qui rend le nom lisible sur le dessin : sept pixels de craie sur
   une tribune éclairée ne se lisent pas sans lui. */
.ct::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,10,.45),transparent 42%,rgba(4,6,10,.9))}
.ct .co{position:relative;z-index:2;font-family:var(--banner);font-size:11px;
  color:var(--craie);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.ct .nm{position:relative;z-index:2;font-size:7px;line-height:1.1;text-align:center;
  opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.ct.hs{opacity:.35;cursor:default}
/* Le compte à rebours passe devant le voile : sans `z-index`, le pseudo-élément
   le peignait par-dessus et le chiffre s'assombrissait en haut de la carte. */
.ct .cd{position:absolute;inset:0;z-index:3;background:rgba(4,6,10,.72);
  display:flex;align-items:center;
  justify-content:center;font-family:var(--banner);font-size:13px;color:var(--craie)}
.ct.vide{border-style:dashed;border-color:rgba(242,238,228,.15);cursor:default}
/* Rien à assombrir dans un emplacement vide. */
.ct.vide::after{display:none}

/* La marge basse doit dégager toute la hauteur de la barre commune.

   nav.js ne réserve que 55 % de cette hauteur sur les écrans de jeu, parce
   qu'il s'y efface dès qu'on joue et qu'une réserve pleine mangerait la place
   utile. Le calcul tient pour du contenu qu'on lit ; il ne tient pas pour la
   seule action du jeu. Mesuré : le bouton passait 16 px sous la barre, et un
   joueur visant « CHANTER » pendant une pause touchait « PROFIL » — il
   quittait le duel en cours. On complète donc les 45 % manquants ici, sur la
   page qui en a besoin, plutôt que d'alourdir la réserve du Virage et du
   duel un contre un. */
/* ------------------------------------------------- les chants offerts

   Cinq cartes, exactement celles du Virage — c'est la dernière différence entre
   les deux modes qui tombe. Les règles sont reprises telles quelles : le dessin
   porte la carte, le coût en haut à droite, la poussée en gros en bas.

   `padding-right` sur le nom : le coût est posé en absolu dans le coin, et
   « À perdre haleine » passait dessous. */
.chants{display:flex;gap:5px;
  margin-bottom:calc(12px + var(--nav-h,62px) * .45 + env(safe-area-inset-bottom))}
.chant{flex:1;min-width:0;border-radius:9px;padding:8px 7px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.34);cursor:pointer;
  border:1px solid rgba(242,238,228,.14);border-top:3px solid var(--c);
  display:flex;flex-direction:column;gap:3px}
.chant:active{transform:translateY(3px) scale(.98)}
/* Trop cher : on le montre grisé plutôt que de le retirer. Une main qui
   rétrécit quand on manque de souffle cache justement ce qu'on vise. */
.chant.dim{opacity:.32;pointer-events:none}
.chant .illu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.chant b{position:relative;font-family:var(--banner);font-size:11.5px;line-height:1.1;
  padding-right:15px}
.chant .g{position:relative;font-size:8px;letter-spacing:.12em;opacity:.55;text-transform:uppercase}
.chant .p{position:relative;font-family:var(--banner);font-size:20px;color:var(--c);
  margin-top:auto;line-height:1}
.chant .c{position:absolute;top:6px;right:7px;font-size:10px;opacity:.7;font-family:var(--banner)}

/* ------------------------------------------------------ mini-jeu */

/* Idem pour la fenêtre des épreuves : une grille de mosaïque large de mille
   huit cents pixels ne se refait pas au pouce. */
.mini>*{max-width:var(--colonne)}
#miniZone{width:min(100%,var(--colonne))}
.mini{position:fixed;inset:0;z-index:80;background:rgba(4,6,10,.93);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mini.on{display:flex}
.mini h3{font-family:var(--banner);font-size:19px;letter-spacing:.16em;margin:0;color:var(--c,var(--projo))}
.mini p{margin:0;font-size:12.5px;opacity:.6}
/* Le pavé rond, son anneau et ses deux lignes de texte vivent dans ui.css :
   c’est le même composant que le Virage et la salle de répétition dessinent.
   Cette page en avait la bonne version ; elle est désormais la seule. */
.compte{position:absolute;font-family:var(--banner);font-size:74px;opacity:.85;
  animation:fade .55s ease-out forwards}
@keyframes fade{to{opacity:0;transform:scale(1.5)}}

/* ---------------------------------------------------------- voiles */

/* ============================================ l'affiche et le bilan

   Deux écrans pleins qui encadrent le duel. Ils partagent une ossature — un
   bandeau en haut, le corps qui défile, une barre en bas qui ne défile pas —
   parce que ce sont les deux moitiés d'un même moment et qu'ils doivent se
   ressembler.

   `position:fixed` et non un voile posé dans `.jeu` : un duel qui se termine ne
   doit pas laisser voir sa corde figée derrière son résultat. */
/* **Le voile couvre l’écran, le contenu tient dans la colonne.**

   `inset: 0` est juste pour le fond — un duel qui se termine ne doit pas
   laisser voir sa corde derrière son résultat. Mais les enfants héritaient de
   cette largeur : sur un écran de bureau, l’affiche s’étalait sur mille neuf
   cents pixels pendant que le reste du jeu tenait dans neuf cents. Les trois
   vignettes de Fanzzy y faisaient six cents pixels de large chacune, la
   troisième sortait du champ, et il fallait faire défiler une affiche qui ne
   reste que six secondes.

   Les enfants sont donc ramenés à `--colonne`, comme `#app`. C’est la même
   règle que partout ailleurs dans le jeu : le fond est à l’écran, le jeu est
   dans la colonne. */
.grand>*{width:100%;max-width:var(--colonne);margin-inline:auto}
.grand{position:fixed;inset:0;height:100vh;height:100dvh;
  z-index:72;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -10%,rgba(224,64,44,.2),transparent 60%),
    linear-gradient(180deg,#11161D,#05070A 55%,#05070A);
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 12px)}
.grand[hidden]{display:none}
.grand-haut{flex:none;display:grid;justify-items:center;gap:7px;padding:0 16px 12px}
.grand-haut h2{margin:0;font-family:var(--banner);font-size:clamp(24px,7.4vw,34px);
  letter-spacing:.16em;line-height:1}
.lieu-nom{font-size:10.5px;letter-spacing:.14em;opacity:.5;font-family:var(--banner);
  text-align:center;line-height:1.5}
.lieu-nom:empty{display:none}
/* Le corps défile, la barre du bas jamais : le bouton de sortie doit rester
   sous le pouce quel que soit le nombre de lignes de statistiques. */
.bilan-corps,.camps{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 10px}
.grand-bas{flex:none;padding:10px 16px 0}
.attente{text-align:center;font-size:11.5px;letter-spacing:.1em;opacity:.5;
  font-family:var(--banner)}

/* ------------------------------------------------------------ l'affiche */

.camp-bloc{margin-bottom:10px}
.camp-bloc .qui{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.camp-bloc .qui b{font-family:var(--banner);font-size:16px;letter-spacing:.06em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp-bloc .qui .camp-tag{font-size:9px;letter-spacing:.13em;font-family:var(--banner);
  padding:3px 7px;border-radius:5px;flex:none}
.camp-bloc.moi .qui .camp-tag{background:var(--projo);color:#1B1305}
.camp-bloc.eux .qui .camp-tag{background:var(--bleu);color:#F4F8FF}
/* La forme récente : cinq pastilles, la plus récente à gauche. Elles se lisent
   d'un coup d'œil, sans lire un chiffre — c'est tout leur intérêt. */
.forme{display:flex;gap:3px;margin-left:auto;flex:none}
.forme i{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;
  font-style:normal;font-family:var(--banner);font-size:9px;line-height:1;
  box-shadow:0 0 0 1px rgba(4,7,11,.8)}
.forme i.win{background:var(--vert);color:#032116}
.forme i.loss{background:var(--flare);color:#2A0904}
.forme i.draw{background:var(--gris);color:#23211B}
.forme small{font-size:9.5px;opacity:.45;letter-spacing:.1em;align-self:center;
  font-family:var(--banner)}
/* Les trois Fanzzy d'un camp, côte à côte. Le premier est celui qui entre.

   **Bornés en hauteur autant qu'en largeur.** Chaque carte prenait un tiers
   de la colonne, et rien d'autre ne la retenait : sur un écran de bureau,
   deux rangées de cartes de trois cents pixels de large ne tenaient plus
   dans la fenêtre, et il fallait faire défiler une affiche qui ne reste
   que six secondes. La colonne est donc le plus petit de deux :
   un tiers de la largeur, ou ce que la hauteur laisse aux deux rangées une
   fois retirés le titre, les noms et le pied — trois cent trente pixels
   en tout, au ratio 63/80 de la carte. */
.trois{display:grid;gap:7px;justify-content:center;
  grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100vh - 330px) * .39))))}
@supports (height:100dvh){
  .trois{grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100dvh - 330px) * .39))))}
}
.fz-aff{position:relative;border-radius:11px;overflow:hidden;background:#0A0E13;
  box-shadow:0 0 0 2px #04070B,inset 0 0 0 1px rgba(242,238,228,.12);
  aspect-ratio:63/80;display:flex;flex-direction:column;justify-content:flex-end}
/* **En pied, et entier.** C'était le buste, carré, recadré en `cover` dans
   une carte en hauteur : on n'en voyait qu'un visage géant, coupé aux
   joues, et l'objet d'en face n'était plus qu'un gros plan de métal. Le
   plein-pied tient dans la carte sans rien perdre, posé sur son bord bas
   comme sur une scène. */
.fz-aff{background:radial-gradient(90% 60% at 50% 72%,rgba(242,238,228,.1),transparent 70%),#0A0E13}
.fz-aff img{position:absolute;inset:4px 4px 0;width:calc(100% - 8px);height:calc(100% - 4px);
  object-fit:contain;object-position:50% 100%}
.fz-aff .voile-bas{position:relative;padding:5px 6px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.92) 55%)}
.fz-aff b{display:block;font-family:var(--banner);font-size:9.5px;line-height:1.15;
  letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-aff small{display:block;font-size:8px;opacity:.55;letter-spacing:.08em}
/* Celui qui entre au coup d'envoi porte la couleur de son camp. */
.fz-aff.entre{box-shadow:0 0 0 2px var(--ac,var(--projo)),0 0 18px rgba(245,195,59,.3)}
.fz-aff .tag{position:absolute;top:5px;left:5px;font-size:7.5px;letter-spacing:.11em;
  font-family:var(--banner);background:var(--ac,var(--projo));color:#1B1305;
  padding:2px 5px;border-radius:4px}
.versus{text-align:center;font-family:var(--banner);font-size:13px;letter-spacing:.3em;
  opacity:.35;margin:4px 0 10px}

/* -------------------------------------------------------------- le bilan */

/* Le score est dans la vignette, sous le mot. Il garde la craie plutôt que la
   couleur du résultat : deux nombres en rouge vif se lisent comme une alerte,
   et c'est le mot qui doit porter le verdict. */
.bilan-score{font-family:var(--banner);font-size:clamp(30px,10vw,44px);line-height:1;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--craie);
  margin-top:7px}
.bilan-score em{font-style:normal;opacity:.3;margin:0 6px}
/* La vignette du résultat ne doit pas déborder la colonne, et ses rayons ne
   doivent pas fabriquer de défilement latéral — `inset:-42%` sort du cadre par
   construction. */
#bilanCase{max-width:min(360px,100%)}
.grand-haut{overflow:clip}
/* Les gains, en premier : c'est ce qu'on vient chercher. */
.gains{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;
  margin:0 0 12px}
.gain{padding:10px 8px;border-radius:11px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.3));
  box-shadow:0 0 0 2px #04070B,inset 0 1px 0 rgba(255,255,255,.1)}
.gain b{display:block;font-family:var(--banner);font-size:19px;line-height:1;
  color:var(--projo);font-variant-numeric:tabular-nums}
.gain small{display:block;font-size:8.5px;letter-spacing:.12em;opacity:.5;margin-top:4px}
.gain.kop b{color:var(--vert)}
.gain.xp b{color:var(--bleu)}
.bilan-titre{font-family:var(--banner);font-size:10.5px;letter-spacing:.2em;
  opacity:.42;margin:14px 0 7px}
/* Une ligne de statistique par camp, les deux côte à côte : c'est la
   comparaison qui intéresse, pas le chiffre isolé. */
.stat{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:8px 10px;border-radius:9px;font-size:12px;
  border-top:1px solid rgba(242,238,228,.07)}
.stat:first-of-type{border-top:0}
.stat b{font-family:var(--banner);font-size:14px;font-variant-numeric:tabular-nums}
/* **L'or et le bleu appartiennent aux monnaies, pas aux camps.**

   Ces deux lignes peignaient « toi » en or et « lui » en bleu. Dix pixels
   plus haut, dans le même écran, l'or est la couleur des écharpes et le
   bleu celle de l'XP — voir `.gain b` juste au-dessus. Les deux mêmes
   couleurs disaient donc deux choses différentes sur la même image, et
   c'est exactement ce qu'un joueur a signalé.

   Ce sont les camps qui cèdent, et pas les monnaies : une écharpe est or
   partout dans le jeu — dans la barre, au kiosque, à la boutique — alors
   que « toi contre lui » n'a besoin d'aucune teinte. La colonne de gauche
   est la tienne, et elle est simplement **plus claire** que celle d'en
   face. C'est la hiérarchie qu'on veut sur son propre écran de résultat,
   et elle se lit sans avoir appris de code couleur. */
.stat .g{text-align:right;color:var(--craie)}
.stat .d{text-align:left;color:var(--gris);opacity:.72}
.stat .quoi{font-size:9px;letter-spacing:.11em;opacity:.45;font-family:var(--banner);
  text-align:center;white-space:nowrap}
.pref{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
  background:rgba(255,255,255,.04);margin-bottom:6px}
.pref img{width:34px;height:46px;object-fit:cover;border-radius:6px;flex:none;
  box-shadow:0 0 0 1px rgba(4,7,11,.8)}
.pref .t{flex:1;min-width:0}
.pref .t b{display:block;font-family:var(--banner);font-size:13px}
.pref .t small{display:block;font-size:10px;opacity:.5;margin-top:2px}


/* ------------------------------------------------ la salle d'attente

   Elle était **trois phrases** : « 1 sur 3 », « il manque 2 supporters de
   Vissel Kobe », « des bots complètent après 120 secondes ». C'est exact, et
   ça ne donne envie de rien — on attend deux minutes devant un compteur, sans
   savoir qui est là ni voir arriver personne.

   Elle montre maintenant les deux tribunes, place par place : qui est entré,
   avec le Fanzzy qu'il aligne, et les places encore vides. Attendre devient
   regarder se remplir. */
.salle{width:100%;max-width:var(--colonne);display:flex;flex-direction:column;gap:12px;
  text-align:left}
.tribune-att h4{margin:0 0 7px;font-family:var(--banner);font-size:10px;letter-spacing:.16em;
  opacity:.55;display:flex;align-items:center;gap:8px}
.tribune-att h4 em{font-style:normal;margin-left:auto;opacity:.75;color:var(--c,var(--projo))}
.places-att{display:flex;gap:7px}
.place-att{flex:1;min-width:0;max-width:112px;aspect-ratio:63/84;border-radius:10px;position:relative;
  overflow:hidden;background:rgba(255,255,255,.03);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.12);display:flex;flex-direction:column;
  justify-content:flex-end}
.place-att.pris{box-shadow:inset 0 0 0 2px var(--c,var(--projo))}
.place-att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 20%}
.place-att .qui{position:relative;padding:5px 6px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.94) 58%)}
.place-att .qui b{display:block;font-family:var(--banner);font-size:9.5px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place-att .qui small{display:block;font-size:7.5px;opacity:.5;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Une place vide n'est pas un trou : elle dit ce qu'elle attend. C'est elle
   qui donne envie d'appuyer sur « inviter ». */
.place-att.libre{border:1px dashed rgba(242,238,228,.16);box-shadow:none;
  align-items:center;justify-content:center}
.place-att.libre span{font-family:var(--banner);font-size:8.5px;letter-spacing:.11em;
  opacity:.4;text-align:center;padding:0 6px;line-height:1.4}
.place-att.libre::after{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 50% at 50% 50%,rgba(242,238,228,.07),transparent 70%);
  animation:respire 2.4s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.35}50%{opacity:1}}
/* Le rebours avant les bots. Un chiffre qui descend dit « ça avance » ; une
   phrase figée disait « c'est bloqué ». */
.rebours{font-family:var(--banner);font-size:11px;letter-spacing:.1em;opacity:.55;
  text-align:center}
.rebours b{color:var(--projo);font-variant-numeric:tabular-nums}

/* Même règle que `.grand` : le voile couvre l’écran, son contenu tient dans
   la colonne. */
.voile>*{max-width:var(--colonne)}
.voile{position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.9);display:none;
  flex-direction:column;align-items:center;justify-content:safe center;gap:12px;
  overflow-y:auto;text-align:center;height:100vh;height:100dvh;
  padding:calc(env(safe-area-inset-top) + 28px) 28px calc(env(safe-area-inset-bottom) + 28px)}
.voile.on{display:flex}
.voile h2{font-family:var(--banner);font-size:23px;letter-spacing:.1em;margin:0;opacity:1}
.voile p{margin:0;font-size:13px;opacity:.65;line-height:1.7;max-width:300px}
.spin{width:26px;height:26px;border:2px solid rgba(242,238,228,.2);border-top-color:var(--projo);
  border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.lien{background:none;border:0;color:var(--projo);font-size:13px;cursor:pointer;text-decoration:underline;
  font-family:inherit}
/* Le message se pose au-dessus de toute la zone d'action, jamais dessus.

   Il était ancré à 96 px du bas, une valeur qui tombait en plein sur le
   bouton de chant — mesuré : 45 px de recouvrement. Or un refus s'affiche
   exactement au moment où le joueur regarde ce bouton. La position se calcule
   donc depuis les mêmes grandeurs que la marge du bouton, pour qu'elle suive
   si l'une d'elles change. */
/* ------------------------------------------------ le message d'erreur

   Il se posait **au-dessus d'une hauteur devinée** : `bottom: 124px`, la
   hauteur qu'avait la rangée de chants le jour où on l'a mesurée. Or cette
   rangée n'a pas de hauteur fixe — le nom d'un chant passe parfois à deux
   lignes, et le répertoire est tiré de l'identifiant du duel. Selon la partie,
   le message recouvrait le bouton de dix à quarante-six pixels, c'est-à-dire
   exactement le bouton que le joueur regarde au moment où on lui dit non.

   La hauteur est donc **mesurée** et non supposée : `--chants-h` suit la
   rangée, quoi qu'elle contienne. Le repli de 124 px reste pour le premier
   rendu, avant que la mesure ait eu lieu. */
.toast{position:fixed;left:50%;z-index:90;transform:translateX(-50%);background:#171C23;
  bottom:calc(var(--chants-h, 124px) + 12px + var(--nav-h,62px) * .45
              + env(safe-area-inset-bottom));
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;display:none;
  max-width:88vw;text-align:center}
.toast.on{display:block}
/* ------------------------------------------------- le fil du terrain

   Même bande qu'au Virage, même raison : le score du **vrai match**, que le
   duel ne montrait nulle part. Il est opaque et large parce que le score des
   tribunes est juste au-dessus en quarante pixels — deux nombres à l'écran,
   et c'est le mot « TERRAIN » qui dit lequel est la rencontre. */
.fil-match{flex:none;display:none;align-items:center;gap:10px;margin:0 13px 6px;
  padding:7px 11px;border-radius:9px;background:rgba(6,10,16,.78);
  border:1px solid rgba(242,238,228,.24);min-height:46px;text-align:left}
.fil-match.on{display:flex}
.fil-match .sc{flex:none;padding-right:10px;line-height:1;
  border-right:1px solid rgba(242,238,228,.14)}
