<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="/langue.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Duel de tribunes — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<!-- Partager le lien de sa file : une file vit deux minutes, c'est le moment
     où l'on veut dire « viens, je t'attends ». -->
<script src="/partage.js" defer></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
  overscroll-behavior:none}
/* `height` et non `min-height` : un écran de jeu ne se fait pas défiler. Tout
   doit tenir, et c'est l'arène qui absorbe ce qui reste — sinon les chants
   finissent sous le pli et le joueur ne les trouve plus. La gouttière de la
   colonne (quatorze pixels, `ui.css`) reste : le HUD de match la rend de
   lui-même pour aller d'un bord à l'autre. */
#app{position:relative;width:100%;max-width:var(--colonne);height:max(100dvh,var(--ecran-min));overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 40% at 50% -4%,rgba(224,64,44,.14),transparent 60%),
             linear-gradient(180deg,#141A21,#0A0D11 45%,#0A0D11)}
/* La préparation, elle, peut défiler : la liste des matchs est longue. L'air
   du bas est sur son corps et non sur elle : le rembourrage d'un conteneur
   qui défile rétrécit la place d'une rangée collée (`.entree`), qui flottait
   alors à dix-huit pixels du bord, la liste passant dessous. Ce que le
   navigateur amène sous les yeux au clavier (une bâche du camp atteinte à la
   tabulation) s'arrête au-dessus de cette rangée, pas dessous. */
#prepa{overflow-y:auto;flex:1;min-height:0;scroll-padding-bottom:84px}
#prepaCorps{padding-bottom:18px}

/* ------------------------------------------------------- préparation */

/* Le dégagement vient de `nav.js` : voir la note dans `virage.html`. */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--tbf-haut-d,62px) 6px var(--tbf-haut-g,62px)}
.top h1{font-family:var(--banner);font-size:20px;letter-spacing:.15em;margin:0}
/* **Onze pixels et 88 %, au-dessus du plancher de tout texte qui informe.**
   Le sous-titre était à 8,5 px et à moitié éteint : une devise, peut-être,
   mais écrite pour ne pas être lue. */
.top h1 small{display:block;font-size:11px;letter-spacing:.16em;opacity:.88;margin-top:3px;font-family:var(--ui)}
/* Les titres de rubrique sont des titres cousus (`.tbf-cousu`, dans ui.css) :
   la page ne garde que leur place. La précision entre parenthèses reste plus
   petite que le titre, jamais sous le plancher. */
#prepa h2{margin:20px 2px 10px}
h2 i,.souscarte h3 i{font-style:normal;font-size:11px;letter-spacing:.04em;
  text-transform:none;opacity:.88}

/* **Sans deck : une invitation, pas un avertissement** (lot 6). Trois places
   vides — les sièges qui attendent l'équipe — sous la bâche bleue qui mène à
   l'atelier du deck. Le bleu est le ton de ce qu'on possède (amendement 18). */
.sansdeck{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:8px 0 6px}
.sansdeck .places{display:flex;justify-content:center;gap:10px}
.sansdeck .places img{width:min(30%,96px);aspect-ratio:3/4;object-fit:cover;border-radius:8px;
  box-shadow:0 0 0 2px var(--encre),0 0 0 3.5px rgba(242,238,228,.3)}
.sansdeck p{margin:0;text-align:center;font-size:12px;line-height:1.5;opacity:.88}

/* **Les formats : cinq bâches-tuiles** (lot 6). Chacune montre à combien on
   tient sa tribune — une à cinq silhouettes au pochoir — et ce que le format
   paie en plus, en sticker craie au coin (« +30 % », lu dans `primes`). La
   tuile choisie prend le ton flare. `.fmt`, `.on` et `data-fmt` restent :
   c'est par eux que la page et ses contrôles savent quel format est coché.
   Le libellé est le premier texte de la tuile, et le seul pour le 1v1 :
   `nvn:ui` le lit en entier. */
/* Six pixels d'air à droite : le sticker de la dernière tuile déborde de son
   coin, et la préparation, qui défile, le rognait au bord. */
.formats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px 7px;padding:10px 6px 0 0}
.fmt{flex-direction:column;gap:4px;min-height:62px;padding:7px 2px 6px;font-size:14px;letter-spacing:.06em}
/* La frise prend la couleur du lettrage de la tuile : des silhouettes d'or
   sur la face flare se seraient fondues dans le liseré. */
.fmt .tbf-foule{--fh:17px;min-height:18px;justify-content:center;gap:1px;color:var(--lettre)}
.fmt .prime{position:absolute;z-index:2;top:-11px;right:-6px;height:20px;padding:0 4px;font-size:11px;--rot:5deg}

/* « Peu importe le format » : une case, sous les formats. Elle n’est pas un
   format de plus — cocher « tous » à côté de cinq choix exclusifs se lirait
   comme un sixième. D’où la forme d’un interrupteur, et sa place en dessous.
   Une plaque : béton levée, flare cochée ; la coche est l'icône commune. */
.souple{gap:10px;width:100%;margin:6px 0 0;
  padding:9px 11px;min-height:44px;text-align:left;justify-content:flex-start}
.souple .t{flex:1;min-width:0}
.souple .case{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;
  border:1px solid currentColor;font-size:13px;line-height:1}
.souple small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.02em;
  text-transform:none;margin-top:3px}
.portee{margin:0 0 10px}

/* **Les matchs, en tickets kraft de soixante pixels** (lot 6). Les blasons,
   les deux clubs, la sorte de duel et la file en dessous, **un seul sticker
   d'état** au bout (« 71′ LIVE », « AUJ. 21:00 », « TERMINÉ ») et le « ×2 »
   en tampon quand un de ses clubs joue. Le nom ne s'abrège jamais : il passe
   à la ligne. Le match choisi devient l'affiche (`.tbf-affiche`, plus bas).
   `.mt`, `data-fixture` et `.q.mien` restent : la page, l'audit et `nvn:ui`
   les lisent. */
.matchs{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.mt.tbf-ticket{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;
  min-height:60px;padding:9px 12px 8px;cursor:pointer}
.mt .bls{display:flex;flex:none}
.mt .bls img{width:32px;height:32px;object-fit:contain}
.mt .bls img+img{margin-left:-9px}
.mt .n{min-width:0;font-size:13px;font-weight:700;line-height:1.15;letter-spacing:.02em;
  overflow-wrap:anywhere}
.mt .n small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:3px;
  font-size:11px;font-weight:600;letter-spacing:.08em}
/* La file en silhouettes : le pochoir à l'encre, sur le papier. */
.mt .n .tbf-foule{--fh:15px;min-height:15px;color:var(--encre-kraft)}
.mt .bout{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.mt .bout .tbf-sticker{height:22px;padding:0 6px;font-size:12px}
.mt .q.mien{--rot:-8deg}

/* Le match choisi : l'affiche (`.tbf-affiche`, la brique). La page ne
   garde que sa place dans la liste. */
.mt.tbf-affiche{cursor:default;margin-top:4px}
.mt.tbf-affiche .tbf-affiche-pied{justify-content:center;flex-wrap:wrap;row-gap:4px}
.mt.tbf-affiche .tbf-affiche-pied>.tbf-foule{flex:0 1 auto}
/* **Le camp pour qui l'on pousse, marqué sur l'affiche** : un sticker craie
   « TA TRIBUNE » sous le nom de son club. Chez soi, il remplace la rubrique
   TA TRIBUNE et sa phrase, qui prenaient soixante pixels entre l'affiche et
   ENTRER EN FILE pour dire ce que rien ne laisse choisir ; posé dans la
   colonne du club, plus courte que celle du score, il ne coûte aucune
   hauteur. La craie et l'encre : l'or est à CLASSÉ, l'enjeu. **Sa place
   est gardée dans les deux colonnes** (`.camp-marque`) et il s'y pose au pied :
   compté dans une seule, il la rallongeait, et les deux clubs, centrés
   chacun sur sa hauteur, ne se faisaient plus face. */
.mt.tbf-affiche.camp-marque .tbf-affiche-club{position:relative;padding-bottom:28px}
.tbf-affiche-club>.tribune-mienne{position:absolute;left:50%;bottom:0;translate:-50% 0;
  --rot:-3deg;height:20px;padding:0 5px;font-size:11px}
/* **Le stade du match, sur son affiche** (décision de Gaël, 6 octobre
   2026 : tous les duels d'un match se jouent dans son stade, et la
   préparation le montre avant l'entrée en file). Son dessin réduit passe en
   fond, sous le voile de la brique (`data-fond`, `--fond`) ; son nom se lit
   **au pied de l'affiche**, comme celui du lieu au pied de l'arène
   (`.lieu`), à la craie du compte de la file. « STADE » en petit devant :
   seul, « LE CHAUDRON » se lirait comme un troisième club. Ce qu'il change
   est dit dans les règles du « i », comme en partie dans « ce que tu
   portes » : la phrase entière, jusqu'à quatre-vingt-cinq signes, prendrait
   deux lignes de plus à l'affiche, juste au-dessus d'ENTRER EN FILE. Le nom
   partage le pied avec la file quand quelqu'un attend, et passe dessus
   quand les deux ne tiennent pas sur une ligne ; il ne s'abrège jamais. */
.lieu-match{display:flex;align-items:baseline;gap:6px;min-width:0;max-width:100%;
  color:var(--craie);font-family:var(--banner);font-size:12px;font-weight:600;line-height:1.2;
  letter-spacing:.06em;text-transform:uppercase}
.lieu-match>small{flex:none;font-size:11px;letter-spacing:.1em;opacity:.88}
.lieu-match>b{min-width:0;font-weight:700;overflow-wrap:anywhere}

/* **Le match choisi et ce qui se déplie sous lui**, dans un même bloc : c'est
   le bloc auquel la rangée d'entrée reste collée (voir `.entree`). */
.match-choisi{display:flex;flex-direction:column}
/* Quand la page amène le match choisi sous les yeux (`amenerLeMatch`), elle
   le pose sous la flèche et le menu flottants, jamais dessous : quatorze
   pixels sous l'encoche, quarante-quatre de bouton, douze d'air. */
#prepa .mt.on{scroll-margin-top:calc(var(--hudm-haut, 14px) + 56px)}

/* **Le bandeau d'annonce** (`.tbf-annonce`, posé par `nav.js`) : la page le
   range elle-même — sous le titre en préparation, sous les deux rangées du
   HUD en partie, ticket terrain compris (voir `placerAnnonce`). En partie
   il ne fléchit pas : c'est l'arène qui cède la place. */
#jeu>.tbf-annonce{flex:none;margin:6px 0 0}

/* Ce qui se déplie sous le match choisi quand le camp est à choisir.
   Rattaché à lui par la bordure et le décalage : sans ça, on lirait une
   section de page posée au milieu d'une liste, et non la suite du geste
   qu'on vient de faire. Chez soi, il n'y a rien à choisir : pas de
   rubrique, l'affiche porte le camp et ENTRER EN FILE vient juste dessous. */
.souscarte{margin:10px 0 0 8px;padding:8px 0 4px 12px;
  border-left:2px solid var(--projo);display:flex;flex-direction:column;gap:2px}
.souscarte h3{margin:10px 2px 8px}
.raison{margin:0 2px 8px;font-size:11.5px;opacity:.88;line-height:1.6}
.raison.attend{opacity:.9}
.raison.attend b{color:var(--craie);font-weight:700;font-family:var(--banner);font-size:13px}
/* Les deux tribunes. Deux bâches de même poids : aucune n'est le choix par
   défaut, et c'est le propos — on vient tenir l'une ou l'autre. La choisie
   prend le ton flare. Le nom passe à la ligne plutôt que de s'abréger. */
.tribunes{display:flex;gap:10px}
.trib{flex:1;min-width:0;padding:11px 8px;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.trib small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  text-transform:none;font-weight:400}
/* « ENTRER EN FILE » : la bâche flare de soixante pixels, et ce qui est en
   jeu dessous, en Oswald 12 (amendement 6) — seulement quand le serveur le
   sert (`enJeu`, § 17). À côté, le « i » des règles.

   **Collée au bas de la préparation** (`data-colle`, lot 6) dès que le
   bouton est ouvert : à 360 × 640, l'affiche du match choisi finit à
   564 px, et la rangée en demande 77 — elle restait sous le bord (à 793 px
   avant que les phrases du dessus ne passent dans les règles), et rien à
   l'écran ne disait qu'il y avait encore un geste à faire. Mesuré au banc :
   collée, elle tient de 563 à 640 sans rien couvrir de l'affiche ; à
   320 × 568, où l'affiche elle-même passe sous le bord, elle en couvre le
   bas, qui revient au doigt. Elle se colle
   **dans le bloc du match choisi** (`.match-choisi`), pas dans la page :
   elle monte au plus jusqu'au haut de l'affiche, et part avec elle quand
   on fait défiler la liste vers d'autres matchs — un ENTRER EN FILE posé
   sous un autre match que le sien se lirait comme le sien. Fermée (sans
   deck, ou le camp pas encore choisi), elle reste à sa place : collée,
   elle cacherait les bâches du camp sans rien offrir. Le fondu du haut et
   la bande sombre détachent la rangée de ce qui défile dessous ; le
   rembourrage du bas garde l'ombre dure de la bâche et l'encoche. */
.entree{display:flex;align-items:center;gap:12px;margin:0 0 2px;padding-top:10px}
.entree[data-colle]{position:sticky;z-index:5;bottom:0;
  padding-bottom:calc(env(safe-area-inset-bottom) + 2px);
  background:linear-gradient(180deg,rgba(10,13,17,0),rgba(10,13,17,.94) 8px)}
/* **Soixante pixels, sous-libellé compris** (la direction) : le rembourrage
   de `.tbf-bloc` en faisait soixante-quatorze, quatorze de plus à loger au
   bas de l'écran. */
.gros{flex:1;min-width:0;min-height:60px;margin:0 0 5px;flex-direction:column;gap:3px;
  padding-top:8px;padding-bottom:8px}
.gros small{display:block;font-size:12px;letter-spacing:.06em;text-transform:none;opacity:.88;
  text-shadow:0 1px 0 var(--encre)}
.regles-i>b,.apports-i>b{font-family:var(--banner);font-size:19px;font-weight:700;line-height:1;
  text-transform:none}
.regles{margin:4px 2px 6px;padding:10px 12px;border-radius:8px;background:var(--panneau);
  box-shadow:inset 0 0 0 1px rgba(242,238,228,.12)}
.regles p{margin:0 0 6px;font-size:11.5px;line-height:1.55}
.regles p:last-child{margin-bottom:0}
.regles b{font-weight:700}

/* L'avertissement du direct absent, en panneau d'or : le titre et le lien en
   craie grasse — en or et sous treize pixels, ils ne tenaient pas au soleil
   (arbitrage du 2 octobre 2026). */
.avert{margin:8px 0 10px;border:1px solid rgba(245,195,59,.35);border-radius:10px;padding:12px 14px;
  background:rgba(245,195,59,.07);font-size:12px;line-height:1.65}
.avert b{display:block;font-family:var(--banner);font-size:12.5px;letter-spacing:.06em;margin-bottom:5px;
  color:var(--craie);font-weight:700}
.avert a{color:var(--craie);font-weight:700}
/* Le renvoi vers la répétition. Discret exprès — il ne se met pas sur le
   chemin de quelqu'un qui vient chercher un duel. */
.repet{margin:10px 2px 4px;font-size:11.5px;line-height:1.5;opacity:.88}
.repet a{color:var(--craie);text-decoration:underline;text-underline-offset:3px}
.repet a b{font-weight:600}
.vide{padding:30px 20px;text-align:center;opacity:.88;font-size:12.5px;line-height:1.8}
.vide a{color:var(--craie);font-weight:700}

/* ===================================================== le duel

   **Le budget de hauteur, écrit pour 360 × 640** (lot 6). La colonne fait
   332 px de large une fois la gouttière ôtée.

     HUD de match           14 + 44 + 4 =  62   (`.tbf-hudm`, la brique)
     ticket terrain              6 + 24 =  30   (seulement le match commencé)
     l'arène                    8 + reste       (≥ 90, 45 % visés)
     effets en cours        7 + 20 par ligne    (seulement s'il y en a)
     l'équipe et le souffle      4 + 74 =  78   (trois cartes 2:3 de 44 px,
                                                  l'active levée de 6 ; le
                                                  nom de celui qui chante et
                                                  le souffle à côté d'elles)
     la main                    22 + 64 =  86   (cinq actions 3:4 de 48 px)
     les chants                 22 + 96 = 118   (cinq chants 2:3 de 64 px)
     le bas                     16 + encoche    (le coin des cartes du bout)

   **L'arène monte à 45 % là où tout tient** (la direction) : le souffle a
   quitté sa rangée pour la colonne libre à côté de l'équipe, et l'arène a
   repris les vingt-huit pixels de cette rangée, plus deux d'air en trop
   au-dessus de l'équipe. Mesuré au banc (`lot6/duel-tribunes/partB/`) : à 360 × 640,
   272 px avant le coup d'envoi (42 %), 242 en jeu (38 %), 215 avec une
   ligne d'effets, 190 avec deux ; à 320 × 568, 200, 170, 143 et 118 ; à
   412 × 915, 547 avant le coup d'envoi et 490 en jeu avec une ligne
   d'effets (60 et 54 %). **En dessous, l'arène cède avant la main et les chants,
   jamais l'inverse** : elle est la seule rangée qui fléchit (`flex:1`,
   `min-height:90px`) ; tout le reste a sa hauteur, et rien ne défile. Le
   bandeau d'annonce de l'administration, quand il y en a un, se pose sous
   les deux rangées du HUD et prend sa hauteur à l'arène, qui descend alors
   jusqu'à trente-deux pixels. */

.jeu{flex:1;display:none;flex-direction:column;min-height:0}
.jeu.on{display:flex}

/* La seconde rangée du HUD : le ticket terrain seul (le duel n'ouvre pas de
   feuille du fil). Elle n'existe qu'une fois le match commencé : avant le
   coup d'envoi, un « 0 – 0 · TERRAIN » n'apprend rien et prend la place de
   l'arène (`hidden`, que la règle commune de ui.css retire). */

/* ------------------------------------------------------------- l'arène

   La corde occupe la place principale, et la position se lit au
   **territoire** — la marée de ta couleur mange la leur, ou l'inverse, avec
   un front net au foulard (`.tbf-maree`, `.tbf-corde`, les briques). Une
   seule variable, `--corde`, posée ici à chaque vue.

   `isolation` : les pièces rangent leurs calques entre elles (le stade, la
   marée, les foules, les effets, la corde, le foulard, l'écart) sans que
   rien de l'arène ne passe au-dessus de la feuille du toast ou de la main. */
.arene{position:relative;isolation:isolate;flex:1 1 auto;min-height:90px;margin:8px 0 0;border-radius:14px;
  overflow:hidden;border:1px solid rgba(242,238,228,.1);background:#070A0E;
  container:arene / size}

/* **Le terrain est couché d'un quart de tour, et seulement ici.**

   Les dessins de stade sont des vues aériennes : le terrain y court de haut
   en bas. C'est la bonne orientation au Grand Virage, dont la corde est
   verticale. Le duel tend sa corde de gauche à droite : couché, l'axe du
   terrain devient celui de la corde, et pousser mène **vers le but d'en
   face**. On tourne **le calque entier**, pas l'image seule : les deux
   nappes de lumière posées par `stade-art.js` suivent sans qu'une
   coordonnée change. `100cqh` / `100cqw` échangent les deux dimensions du
   cadre une fois tourné. */
.stadewrap{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0;container-type:size}
/* **Dans un `@container` et non dans un `@supports`** : `@supports (width:1cqh)`
   demande au moteur s'il connaît l'unité, pas s'il sait confiner, et un
   moteur qui répond oui à la première et non à la seconde rabat la mesure
   sur la fenêtre. `verif-pages` refuse la première forme. Sans confinement,
   le décor reste debout : mal orienté vaut mieux que de travers.
   **Préfixées par `.stadewrap`** pour peser plus lourd que les règles du
   décor debout, écrites plus bas — un bloc `@container` n'a aucune priorité
   à lui. `inset:auto` **d'abord** : écrit après `left`/`top`, ce raccourci
   des quatre bords les remettait à `auto`. */
@container (min-width:0px){
  .stadewrap .stade{position:absolute;inset:auto;left:50%;top:50%;
    width:100cqh;height:100cqw;border-radius:0;
    transform:translate(-50%,-50%) rotate(-90deg)}
  .stadewrap .stade .tbf-stade-fond{position:absolute;inset:0;left:0;top:0;
    width:100%;height:100%;object-fit:cover;object-position:50% 50%;
    transform:none}
}
/* Le stade en fond d'arène, quand il reste debout : on impose la largeur, la
   hauteur déborde (en `cover`, on perdrait les deux tribunes des côtés). Il
   est à 58 % : la marée s'éteint vers le milieu, et c'est là, sur le
   terrain, que le lieu se lit. */
.stade{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0}
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.58}

/* **L'écart, en banderole** (lot 6), en haut au centre : un nombre se lit
   plus vite qu'une position. La phrase dessous reste en craie, quelle que
   soit la couleur du camp — l'or ne s'écrit plus qu'en grand (arbitrage du
   2 octobre 2026). Le chiffre du foulard, lui, reste vide : un même nombre
   écrit deux fois se lirait comme deux. */
.ecart{position:absolute;z-index:8;left:50%;top:10px;translate:-50% 0;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.ecart>.tbf-banderole{font-size:22px;line-height:26px;padding:2px 10px 1px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.ecart small{display:block;font-family:var(--banner);font-size:11px;font-weight:600;letter-spacing:.14em;
  white-space:nowrap;color:var(--craie);
  text-shadow:0 1px 0 rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.95)}
/* **Une arène basse** (un petit téléphone, des effets en cours) : la phrase
   descendrait sur le foulard. Le chiffre reste, et son signe dit qui mène ;
   la phrase se tait le temps que l'arène reprenne de la hauteur. */
@container arene (max-height:170px){
  .ecart{top:6px}
  .ecart>.tbf-banderole{font-size:18px;line-height:21px}
  .ecart small{display:none}
}
/* **Un bandeau d'annonce en partie** (`data-annonce`, voir `placerAnnonce`)
   prend sa hauteur à l'arène, qui descend alors sous son plancher ordinaire
   plutôt que de pousser les chants hors de l'écran : à 320 × 568, il lui
   restait cinquante-huit pixels, et la rangée des chants sortait de trente-
   deux. Une arène aussi basse ne garde que la corde et l'écart : les foules
   et le nom du lieu s'y empilaient sur le foulard. */
#jeu[data-annonce]>.arene{min-height:32px}
@container arene (max-height:80px){
  .arene .tbf-foule,.lieu{display:none}
}

/* **La foule au pochoir : un supporter par joueur** (`.tbf-foule`, la
   brique), le sien en bas à gauche, ceux d'en face en bas à droite. La page
   ne pose que leur place et leur taille ; `nvn:ui` lit `.tete` sur chacun. */
.arene .tbf-foule{position:absolute;z-index:2;bottom:8px;--fh:30px;max-width:42%;
  min-height:0;padding:0;gap:6px;background:none}
.arene .tbf-foule[data-tribune=moi]{left:12px}
.arene .tbf-foule[data-tribune=eux]{right:12px}

/* **Les deux Fanzzy en tribune** (lot 7, le duel vivant) : le mien en bas à
   gauche, juste devant ma ligne de but, celui d'en face en bas à droite,
   **retourné** pour me faire face — sa poussée part vers moi, la mienne vers
   lui. Ils restent sous la corde (calque 2, celui des foules, qui passent
   devant leurs pieds) et ne prennent jamais le doigt. Voir `rendreFzArene`.

   **Deux calques par figure**, comme le personnage de l'accueil : la
   nouvelle expression se charge derrière, puis les opacités se croisent —
   jamais de cadre vide. Le corps porte la pose qu'on tient (`data-pose` :
   penché pour pousser, grandi pour la joie, affaissé et terni pour le
   dépit) et le geste d'un instant (`data-geste`). **Aucun n'est sans fin** :
   la carte en tribune respire déjà, et l'écran n'en tolère que trois.

   Leur taille se prend **en pour cent de l'arène**, leur bloc de
   positionnement, et non en unités de conteneur : même mesure ici (l'arène
   n'a pas de marge intérieure), sans rabat sur la fenêtre là où le
   confinement ne prend pas (voir `verif-pages`). */
.duel-fz{--vers:1;position:absolute;z-index:2;bottom:calc(2px + 1%);height:min(45%,232px);
  aspect-ratio:7/12;pointer-events:none}
.duel-fz[data-tribune=moi]{left:calc(8% + 4px)}
.duel-fz[data-tribune=eux]{--vers:-1;right:calc(8% + 4px)}
/* Ce qu'il porte (`TBF_STUFF.porte`), accroché à hauteur de hanche, du côté
   du milieu de l'arène : c'est là qu'il y a de la place. Côté tribune, la
   jauge de crans et le bord de l'arène le recouvraient. */
.duel-fz .tbf-porte{--piece:32px;bottom:30%;gap:5px}
.duel-fz[data-tribune=moi] .tbf-porte{left:calc(100% - 22px)}
.duel-fz[data-tribune=eux] .tbf-porte{right:calc(100% - 22px)}
/* L'ombre au sol : sans elle, le personnage flotte sur le terrain. */
.duel-fz::before{content:"";position:absolute;left:16%;right:16%;bottom:1%;height:6%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.62),transparent)}
.duel-fz-corps{position:absolute;inset:0;transform-origin:50% 96%;
  transition:rotate .22s ease,scale .3s ease,filter .35s ease}
.duel-fz-corps>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  opacity:0;transition:opacity .22s ease;-webkit-user-drag:none}
.duel-fz-corps>img.on{opacity:1}
.duel-fz[data-tribune=eux] .duel-fz-corps>img{scale:-1 1}
/* Toute sa tribune est partie : il reste, terni, comme ses supporters
   assis. */
.duel-fz[data-parti]{opacity:.5;filter:grayscale(.85)}
/* Les poses tenues, du côté du camp : on se penche vers la corde pour
   pousser, on recule d'un pas quand on encaisse. */
.duel-fz[data-pose=pousse] .duel-fz-corps{rotate:calc(var(--vers) * 4deg)}
.duel-fz[data-pose=but] .duel-fz-corps{scale:1.05}
.duel-fz[data-pose=encaisse] .duel-fz-corps{rotate:calc(var(--vers) * -3deg);scale:.96;
  filter:brightness(.74) saturate(.7)}
/* Les gestes d'un instant. `translate` et non `transform` : il s'ajoute à la
   pose tenue au lieu de la remplacer le temps du geste. */
.duel-fz[data-geste=saut] .duel-fz-corps{animation:fzDuelSaut .9s cubic-bezier(.3,.7,.4,1)}
.duel-fz[data-geste=hisse] .duel-fz-corps{animation:fzDuelHisse .45s ease-out}
.duel-fz[data-geste=affaisse] .duel-fz-corps{animation:fzDuelAffaisse .6s ease-out}
.duel-fz[data-geste=rage] .duel-fz-corps{animation:fzDuelRage .55s linear}
.duel-fz[data-geste=entre] .duel-fz-corps{animation:fzDuelEntre .5s cubic-bezier(.2,.8,.3,1)}
@keyframes fzDuelSaut{0%,44%,80%,100%{translate:0 0}22%{translate:0 -15%}62%{translate:0 -7%}}
@keyframes fzDuelHisse{40%{translate:calc(var(--vers) * 7%) 0}}
@keyframes fzDuelAffaisse{35%{translate:0 5%}}
@keyframes fzDuelRage{0%,100%{translate:0 0}15%,45%{translate:-4% 0}30%,60%{translate:4% 0}75%{translate:-2% 0}}
@keyframes fzDuelEntre{from{translate:calc(var(--vers) * -60%) 0;opacity:0}}
/* **Le chant de son geste** porte le sceau de sa famille, au coin haut-droit
   que le coût laisse libre sur la carte du milieu. Le sceau de la carte
   d'action, en sticker rond. */
.chants .carte-sien{display:none;position:absolute;z-index:4;top:-10px;right:-6px;--taille:22px;--rot:0deg;
  padding:0;background:var(--fam,var(--projo))}
.chants .carte-sien>svg{width:14px;height:14px;fill:none;stroke:var(--encre);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.chants [data-sien]>.carte-sien{display:grid;place-items:center}

/* **Son geste**, celui de sa famille (`GESTE_DE_FAMILLE`) : quand on réussit
   le chant de sa spécialité, il le chante à sa manière. `scale` et `rotate`
   reprennent la main le temps du geste, puis la pose tenue revient. */
.duel-fz[data-geste=crie] .duel-fz-corps{animation:fzDuelCrie .9s ease-out}
.duel-fz[data-geste=frappe] .duel-fz-corps{animation:fzDuelFrappe .9s linear}
.duel-fz[data-geste=tient] .duel-fz-corps{animation:fzDuelTient 1s ease-out}
.duel-fz[data-geste=deploie] .duel-fz-corps{animation:fzDuelDeploie .9s cubic-bezier(.3,.7,.4,1)}
.duel-fz[data-geste=allume] .duel-fz-corps{animation:fzDuelAllume .9s ease-out}
.duel-fz[data-geste=tourne] .duel-fz-corps{animation:fzDuelTourne .95s ease-in-out}
@keyframes fzDuelCrie{25%{scale:1.1;rotate:calc(var(--vers) * -6deg)}60%{scale:1.08;rotate:calc(var(--vers) * -5deg)}}
@keyframes fzDuelFrappe{0%,22%,44%,66%,100%{translate:0 0}11%,33%,55%{translate:0 4%}}
@keyframes fzDuelTient{20%,75%{scale:1.04;translate:0 -3%}}
@keyframes fzDuelDeploie{35%,65%{scale:1.14 1.02}}
@keyframes fzDuelAllume{30%{translate:0 -10%;filter:brightness(1.45)}60%{filter:brightness(1.2)}}
@keyframes fzDuelTourne{0%,100%{rotate:0deg}20%{rotate:-7deg}45%{rotate:7deg}70%{rotate:-4deg}}
/* Une arène trop basse pour eux (un petit téléphone, des effets en cours,
   un bandeau d'annonce) : ils monteraient sur la corde. La foule au
   pochoir garde seule la tribune. */
@container arene (max-height:210px){
  .duel-fz{display:none}
}

/* Les effets posés sur l'arène (`.tbf-effet`, la brique) : leur calque a la
   boîte de l'arène, sous la corde. */
.effets-arene{position:absolute;inset:0;z-index:3;pointer-events:none}

/* Le nom du lieu, au pied de l'arène entre les deux foules. Ce qu'il change
   est dit dans « ce que tu portes » (le « i ») : la phrase entière, posée sur
   le terrain, mangeait la place des supporters. */
.lieu{position:absolute;z-index:5;left:50%;bottom:9px;translate:-50% 0;max-width:30%;
  text-align:center;pointer-events:none;
  font-family:var(--banner);font-size:11px;font-weight:700;letter-spacing:.08em;line-height:1.2;
  text-transform:uppercase;color:var(--craie);
  text-shadow:0 1px 0 rgba(0,0,0,.95),0 1px 6px rgba(0,0,0,.95)}
.lieu:empty{display:none}

/* ------------------------------------------------------ ce qui est à moi */

.jeu > .moi{flex:none}
/* La rangée de l'équipe : les trois cartes, et à côté d'elles le nom de
   celui qui est en tribune et **le souffle** ; au bout, le « i » de ce
   qu'on porte. Le souffle avait sa rangée à lui, toute la largeur pour une
   écharpe de huit pixels : posé dans la colonne que l'équipe laisse libre,
   il rend vingt-huit pixels à l'arène. Quatre pixels au-dessus suffisent :
   le rembourrage de l'équipe garde déjà l'air de la carte levée. */
.rang-equipe{display:flex;align-items:flex-end;gap:12px;margin-top:4px;min-height:74px}
.equipe{--carte-l:44px;display:flex;align-items:flex-end;gap:7px;flex:none;padding-top:8px}
.equipe-info{flex:1;min-width:0;align-self:center;display:flex;flex-direction:column;gap:7px}
.fz-nom{font-family:var(--banner);font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1.15;
  text-transform:uppercase;overflow-wrap:anywhere}
.fz-nom small{display:block;margin-top:2px;font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.88}
.fz-nom:empty{display:none}
/* Le souffle : l'écharpe fine bleue de la brique sous son nom et sa valeur,
   et un cran à chaque coût des cartes en main (`.tbf-jauge-cout`). */
.souffle{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:5px 8px}
.souffle .nom{font-family:var(--banner);font-size:11px;font-weight:600;letter-spacing:.1em;line-height:1}
.souffle b{font-family:var(--banner);font-size:16px;font-weight:700;line-height:1;text-align:right;
  font-variant-numeric:tabular-nums}
.souffle .tbf-jauge{grid-column:1 / -1}
.apports-i{align-self:center}

/* **La carte d'un Fanzzy de l'équipe** : la pièce `.tbf-carte--fanzzy`
   (ui.css, lot 6), sur sa plaque de rareté (`TBF_FOND.plaqueCarte`, le
   `palierDecor` du lot 4). La page ne pose que la largeur, sur la rangée
   (`--carte-l`, ci-dessus), et l'état par `data-etat` — `active` levée, en
   couleur, avec le halo de son camp ; `banc` plus bas et grisé ; `dispo`
   décollée et pulsant vert trois fois (« Changement possible »). Les
   classes `.actif` et `.dispo` restent à côté : la page et `nvn:ui` les
   lisent. La bouche barrée et le tampon « A GRANDI » sont dans la pièce. */

/* Les effets en cours, nommés en clair : l'objet posé sur l'arène ne dit
   pas seul ce qu'il coûte. Des étiquettes à liseré (`.tbf-lisere`, la
   brique) : la couleur de l'effet au bord, la craie pleine sur l'encre. */
.effets{display:flex;gap:5px;flex-wrap:wrap;flex:none;margin-top:7px}
.effets:empty{display:none}

/* La main d'actions et les chants : les cartes de la brique, en éventail.
   La largeur d'une carte est posée sur la rangée (`--carte-l`), une fois. */
/* La boîte de la main prend la largeur de l'éventail : « Parcage fermé »
   couvre la main, pas toute la largeur d'une tablette. */
.main-boite{position:relative;width:fit-content;max-width:100%;margin-inline:auto}
.main.tbf-eventail{--carte-l:48px}
/* Seize pixels sous la main : les cartes du bout de l'éventail descendent
   de huit et tournent de six degrés, et leur coin passait sous le bord.

   **Soixante-quatre pixels dès 360, et ce qui tient en dessous** (tranché
   au lot 6). Cinq chants de 64 px demandent 305 px d'éventail ; à 320 de
   large la colonne en a 292, et la carte descend à 57. Une carte de chant
   sous 64 px ne tient plus un geste de deux lignes, sa poussée et un nom de
   deux ou trois (BRIQUES § 6) : douze chants sur vingt-neuf y montent sous
   le coût (le début de « MARTELAGE » sur LE ROULEMENT, la fin de « LA
   BASCULE » sur LE RENVERSEMENT ; 4 à 23 % de la boîte du geste, mesuré au
   banc), aucun à 360 ni à 412. Garder
   64 px à 320 sortirait de l'écran : déborder la gouttière n'en donne que
   59 (au-delà, le coût de la première carte, que la pente de l'éventail
   pousse au bord, passe hors champ) et le défaut reste ; montrer quatre
   chants retirerait au joueur un chant que le serveur lui offre. **À 320,
   le haut du geste cède sous le coût** : le nom, la poussée et le coût se
   lisent entiers, et le geste se nomme en grand à l'ouverture de sa
   fenêtre. */
.chants.tbf-eventail{--carte-l:min(64px,calc(100% / 4.8));
  margin-bottom:calc(16px + env(safe-area-inset-bottom))}
/* Les cartes de chant gardent leur dessin plein et lisible : un chant n'est
   pas un personnage, il ne respire pas (`.fond`, et non `.illu`). Son
   cadrage, dessin par dessin, est à la feuille : la page n'en écrit pas. */

/* ------------------------------------------------------ mini-jeu */

/* Idem pour la fenêtre des épreuves : une grille de mosaïque large de mille
   huit cents pixels ne se refait pas au pouce. */
.mini>*{max-width:var(--colonne)}
/* Le pavé et les épreuves se centrent dans la fenêtre, comme dans la salle
   de répétition : posé en bloc, le pavé partait au bord gauche. */
#miniZone{width:min(100%,var(--colonne));display:flex;flex-direction:column;align-items:center}
.mini{position:fixed;inset:0;z-index:80;background:rgba(4,6,10,.93);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mini.on{display:flex}
.mini h3{font-family:var(--banner);font-size:19px;letter-spacing:.16em;margin:0;color:var(--craie)}
/* La consigne du geste : la seule chose à lire avant de jouer, donc pleine.
   C'est la craie sur le noir, le meilleur couple qui soit : à 88 % elle
   tombait à 4,3:1 au soleil (règle des pièces : aucun texte sous 100 %). */
.mini p{margin:0;font-size:12.5px}
/* Le pavé rond, son anneau et ses deux lignes de texte vivent dans ui.css :
   c’est le même composant que le Virage et la salle de répétition dessinent. */
.compte{position:absolute;font-family:var(--banner);font-size:74px;opacity:.88;
  animation:fade .55s ease-out forwards}
@keyframes fade{to{opacity:0;transform:scale(1.5)}}

/* ============================================ l'affiche

   Un écran plein qui ouvre le duel. `position:fixed` et non un voile posé
   dans `.jeu` ; **le voile couvre l’écran, le contenu tient dans la
   colonne** : sur un écran de bureau, l’affiche s’étalait sur mille neuf
   cents pixels pendant que le reste du jeu tenait dans neuf cents. */
.grand>*{width:100%;max-width:var(--colonne);margin-inline:auto}
.grand{position:fixed;inset:0;height:100vh;height:100dvh;
  z-index:72;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -10%,rgba(224,64,44,.2),transparent 60%),
    linear-gradient(180deg,#11161D,#05070A 55%,#05070A);
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 12px)}
.grand-haut{flex:none;display:grid;justify-items:center;gap:7px;padding:0 16px 10px;overflow:clip}
.grand-haut h2{margin:0;font-family:var(--banner);font-size:clamp(24px,7.4vw,34px);
  letter-spacing:.16em;line-height:1}
.lieu-nom{font-size:11px;letter-spacing:.12em;opacity:.88;font-family:var(--banner);
  text-align:center;line-height:1.5}
.lieu-nom:empty{display:none}
.camps{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 10px}
.grand-bas{flex:none;padding:10px 16px 0}
.attente{text-align:center;font-size:11.5px;letter-spacing:.1em;opacity:.88;font-family:var(--banner)}

.camp-bloc{margin-bottom:10px}
/* **La ligne du joueur passe à la ligne plutôt que d'écraser son nom.** La
   forme ne rétrécit pas (`flex:none`) : en 1 contre 1 sur un téléphone,
   elle prenait au nom tout ce qui restait, et à 320 px
   « LeGrandDéplacement » se lisait « LeGra / ndDép / lacem / ent ». Elle
   descend maintenant sous le nom quand les deux ne tiennent pas côte à
   côte. C'est aussi le conteneur que la forme interroge pour savoir si son
   résumé a la place (plus bas). */
.camp-bloc .qui{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;margin-bottom:7px;
  container:ligne-joueur / inline-size}
.camp-bloc .qui b{font-family:var(--banner);font-size:16px;letter-spacing:.06em;min-width:0;
  overflow-wrap:anywhere;line-height:1.15}
.camp-bloc .qui .camp-tag{flex:none;height:20px;padding:0 6px;font-size:11px}
/* **La forme : cinq stickers ronds** (lot 6), la plus récente à gauche — V
   vert, D flare, N craie. Ils se lisent d'un coup d'œil, sans lire un
   chiffre.

   **Elle tient dans sa propre largeur, jamais sous un portrait.** Cinq
   pastilles et leur résumé font 198 px en Oswald ; à 320 × 568 et à
   340 px, la colonne d'un supporter à plusieurs par camp n'en a que 160 et
   180, et le résumé, qui ne passait pas à la ligne, glissait sous le
   premier Fanzzy : « 3 V · 1 » coupé net par son cadre. La forme ne
   dépasse plus sa ligne (`max-width`), et ce qui n'y tient plus passe
   dessous (`flex-wrap`) — le résumé d'abord, d'un bloc (`nowrap`). */
.forme{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;margin-left:auto;flex:none;
  max-width:100%}
.forme i.tbf-sticker{--taille:21px;font-style:normal;font-size:11px}
.forme small{font-size:11px;opacity:.88;letter-spacing:.06em;font-family:var(--banner);margin-left:3px;
  white-space:nowrap}
/* **Sous 198 px, le résumé se tait** : passé sous les pastilles, il
   allongerait chaque rangée d'une ligne qui redit ce que les pastilles
   montrent, sur une affiche qui défile déjà à 320 × 568 et ne reste que six
   secondes. Les pastilles restent, et elles portent tout. Le résumé qui
   suit des pastilles (`i ~ small`) seulement : « PREMIER DUEL », seul dans
   sa forme, est tout ce qu'elle dit, et il reste. Une police de repli plus
   large qu'Oswald (Roboto : 80 px au lieu de 65) fait passer le résumé
   sous les pastilles au lieu de le taire — sous elles, jamais sous un
   portrait. */
@container ligne-joueur (width < 198px){
  .forme i~small{display:none}
}
/* Les trois Fanzzy d'un camp, côte à côte. Le premier est celui qui entre.
   **Bornés en hauteur autant qu'en largeur** : un tiers de la colonne, ou
   ce que la hauteur laisse aux deux rangées une fois retirés le titre, les
   noms et le pied — trois cent trente pixels en tout, au ratio 63/80. */
.trois{display:grid;gap:7px;justify-content:center;
  grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100vh - 330px) * .39))))}
@supports (height:100dvh){
  .trois{grid-template-columns:repeat(3,minmax(0,min(calc((100% - 14px) / 3),
    calc((100dvh - 330px) * .39))))}
}
/* **À plusieurs par camp, une ligne par supporter** : son nom, sa forme et
   ses trois Fanzzy en vignettes. Trois blocs pleins par joueur faisaient
   d'un 3 contre 3 une affiche de deux mille pixels, à lire en six secondes. */
.camp-bloc.serre .joueur{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:4px 10px;padding:6px 0;border-top:1px dashed rgba(242,238,228,.18)}
.camp-bloc.serre .joueur:first-of-type{border-top:0}
.camp-bloc.serre .qui{margin:0;gap:4px 8px}
.camp-bloc.serre .qui b{font-size:14px}
.camp-bloc.serre .forme{margin-left:0}
.camp-bloc.serre .trois{grid-template-columns:repeat(3,38px);gap:4px}
.camp-bloc.serre .fz-aff :is(.voile-bas,.tag){display:none}
.fz-aff{position:relative;border-radius:11px;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 72%,rgba(242,238,228,.1),transparent 70%),#0A0E13;
  box-shadow:0 0 0 2px #04070B,inset 0 0 0 1px rgba(242,238,228,.12);
  aspect-ratio:63/80;display:flex;flex-direction:column;justify-content:flex-end}
/* **En pied, et entier**, posé sur son bord bas comme sur une scène. */
.fz-aff img{position:absolute;inset:4px 4px 0;width:calc(100% - 8px);height:calc(100% - 4px);
  object-fit:contain;object-position:50% 100%}
.fz-aff .voile-bas{position:relative;padding:5px 6px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.92) 55%)}
.fz-aff b{display:block;font-family:var(--banner);font-size:11px;line-height:1.15;
  letter-spacing:.02em;overflow-wrap:anywhere}
.fz-aff small{display:block;font-size:11px;opacity:.88;letter-spacing:.04em}
/* Celui qui entre au coup d'envoi porte la couleur de son camp. */
.fz-aff.entre{box-shadow:0 0 0 2px var(--ac,var(--projo)),0 0 18px rgba(245,195,59,.3)}
.fz-aff .tag{position:absolute;z-index:2;top:5px;left:5px;height:19px;padding:0 5px;font-size:11px}
/* **« VS » en banderole entre deux écharpes croisées** (lot 6) : la
   mienne aux couleurs de mon club (`--e1`/`--e2`, posées sur l'affiche),
   l'autre aux siennes, ou au bleu d'en face sans elles. */
.versus{position:relative;display:grid;place-items:center;height:46px;margin:2px 0 10px}
.versus .tbf-echarpe{position:absolute;left:50%;top:50%;width:150px;margin-left:-75px;margin-top:-3px}
.versus .tbf-echarpe:first-child{rotate:16deg}
.versus .tbf-echarpe:nth-child(2){rotate:-16deg;--e1:var(--eux1,var(--bleu));--e2:var(--eux2,var(--bleu-clair))}
.versus .tbf-banderole{position:relative;z-index:1;font-size:20px;line-height:24px;padding:2px 12px 1px;
  letter-spacing:.2em}
/* **Le stade du duel en fond de l'affiche** : celui du match, que l'affiche
   de la préparation montrait déjà (`stadeDuMatch`, côté serveur) — le
   dessin réduit, sous un voile qui part des deux tiers et s'épaissit vers
   le bas : il se devine derrière le titre et le VS, et la craie des noms y
   garde son contraste. */
.grand[data-fond]{
  background:radial-gradient(120% 55% at 50% -10%,rgba(224,64,44,.2),transparent 60%),
    linear-gradient(180deg,rgba(17,22,29,.62),rgba(5,7,10,.8) 45%,rgba(5,7,10,.94) 80%),
    var(--fond) 50% 0/cover no-repeat,#05070A}

/* ------------------------------------------------------------- le bilan

   La page kraft (`.tbf-bilan`, la brique) : la case de BD du résultat, le
   Fanzzy en pose, la feuille, et les deux bâches de sortie. La page ne garde
   que ce que la brique laisse ouvert. Caché, il porte `hidden` : la règle
   commune de ui.css le retire. */
/* La bouffée de la case : derrière elle, à sa couleur. */
.bilan-case{position:relative;display:grid;place-items:center;isolation:isolate}
.bilan-case>.tbf-bouffee{--taille:300px;--c1:var(--mc,var(--projo));--c2:var(--mc,var(--projo))}
.bilan-case>.tbf-vignette{position:relative;z-index:1}
.bilan-case .tbf-vignette small{display:block;margin-top:7px;font-family:var(--banner);font-size:14px;
  font-weight:600;letter-spacing:.12em;color:var(--craie);font-variant-numeric:tabular-nums}
/* La carte préférée, en carte : à la largeur que la page lui donne. */
.tbf-bilan-l>.pref{--carte-l:40px;justify-self:end;margin:4px 6px 4px 0;cursor:default}
.tbf-bilan-l .tbf-tampon{font-size:12px}
/* L'XP : l'écharpe se remplit en neuf cents millisecondes ; au tour complet
   (une montée), elle repart de zéro sans glisser. */
.tbf-bilan-xp .tbf-jauge i.sans{transition:none}

/* ------------------------------------------------ la salle d'attente

   **Le vestiaire** (lot 6) : les deux tribunes, place par place, sur les
   gradins de la brique (`.tbf-gradins`, lot 5) — un buste assis sur son
   siège pour qui est entré, une place en pointillé pour qui manque ; le
   chrono avant les bots en grand sur une bâche de parpaing ; « INVITER
   QUELQU'UN » en bâche violette. Attendre devient regarder se remplir. */
.salle{width:100%;max-width:var(--colonne);display:flex;flex-direction:column;gap:14px;
  text-align:left}
.tribune-att h4{margin:0 0 4px}
.tribune-att h4 em{font-style:normal;margin-left:6px;font-weight:700;color:var(--craie)}
/* Autant de colonnes que de places (une à cinq) : le gradin ne passe pas
   à la ligne, la cinquième place d'un 5 contre 5 reste sur sa rangée. */
.places-att.tbf-gradins{grid-template-columns:repeat(var(--places,3),minmax(0,96px));justify-content:center}
/* À cinq places par gradin, un siège n'a que soixante pixels : le pseudo
   passe à la ligne au lieu de s'abréger — jamais de points de suspension
   sur le nom de quelqu'un. C'est la pièce qui le fait
   (`.tbf-gradins--entiers`, posée dans `tribuneAttente`), sans couper la
   boîte : un accent ou une cédille n'y est plus rogné. */
/* Le chrono avant les bots : la bâche qu'on lit et qu'on ne touche pas
   (`.tbf-plaque--lue`, la brique). La page ne pose que sa place. */
.chrono-bots{align-self:center;min-width:200px;padding:10px 18px 9px;margin-top:4px}
.renfort{text-align:center;font-family:var(--banner);font-size:12px;letter-spacing:.1em}
.renfort b{font-weight:700}
.inviter{align-self:center}

/* Même règle que `.grand` : le voile couvre l’écran, son contenu tient dans
   la colonne. Opaque, comme le voile du Virage. */
.voile>*{max-width:var(--colonne)}
.voile{position:fixed;inset:0;z-index:70;background:#04060A;display:none;
  flex-direction:column;align-items:center;justify-content:safe center;gap:12px;
  overflow-y:auto;text-align:center;height:100vh;height:100dvh;
  padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.voile.on{display:flex}
.voile h2{font-family:var(--banner);font-size:23px;letter-spacing:.1em;margin:0;opacity:1}
/* **À pleine intensité** : le texte du voile porte aussi la salle d'attente
   entière, et l'opacité se multiplie en descendant. */
.voile .texte{margin:0;font-size:13px;line-height:1.7;max-width:320px}
.voile .texte:has(.salle){max-width:var(--colonne);width:100%}
.spin{width:26px;height:26px;border:2px solid rgba(242,238,228,.2);border-top-color:var(--projo);
  border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}

/* ------------------------------------------------ le message, en ticket

   Il se pose **au-dessus de la rangée des chants**, jamais dessus : un refus
   s'affiche exactement au moment où le joueur regarde ce qu'il visait. La
   hauteur de la rangée est **mesurée** (`--chants-h`) ; le repli de 124 px
   sert au premier rendu. Un ticket (lot 6) : on le lit, on ne le touche
   pas. */
.toast{position:fixed;left:50%;z-index:90;transform:translateX(-50%);
  bottom:calc(var(--chants-h, 124px) + 16px + 12px + env(safe-area-inset-bottom));
  display:none;max-width:min(88vw,380px);text-align:center;font-size:13px;line-height:1.4;pointer-events:none}
.toast.on{display:block}

/* Le panneau de ce qu'on porte : hors de la colonne, posé au-dessus de la
   main, et il défile seul. Sa matière est celle du panneau qui flotte
   (`.tbf-apports-p--flottant`, ui.css) : la page ne pose que sa place. */
.tbf-apports-p.duel-apports{position:fixed;z-index:60;left:50%;translate:-50% 0;
  bottom:calc(var(--chants-h, 124px) + 96px + env(safe-area-inset-bottom));
  width:min(calc(100% - 28px),420px)}

/* **Le mouvement part, l'information reste.** Sous `prefers-reduced-motion`
   comme sous le mode calme « animations » : le décompte du geste ne grossit
   plus, le rond d'attente ne tourne plus (les cartes du banc qui pulsent
   ont leurs doubles dans la pièce, `ui.css`). En fin de feuille : ces
   règles ont le poids de celles qui posent les animations, et seul l'ordre
   les départage. */
@media (prefers-reduced-motion:reduce){
  .compte,.spin{animation:none}
  .duel-fz[data-tribune] .duel-fz-corps{animation:none;rotate:none;scale:none}
}
html[data-calme~="animations"] .compte,
html[data-calme~="animations"] .spin{animation:none}
/* Les Fanzzy de l'arène ne bougent plus ; ils changent encore d'expression
   (un fondu, pas un mouvement), et le dépit les ternit toujours. */
html[data-calme~="animations"] .duel-fz[data-tribune] .duel-fz-corps{animation:none;rotate:none;scale:none}
</style>

<body>
<main id="app">

  <div id="prepa">
    <div class="top"><h1>DUEL DE TRIBUNES<small>tirez la corde ensemble</small></h1></div>

  </div>

  <div class="jeu" id="jeu">
    <!-- **Le HUD de match** (`.tbf-hudm`, la brique du lot 6) : la même
         rangée qu'au Grand Virage. Ma bâche d'or, celle d'en face en bleu,
         les buts de chaque tribune en grand ; au milieu, l'horloge du duel
         sur sa plaque et le sticker CLASSÉ — la seule face d'or hors achat :
         c'est l'enjeu. `.score` reste : l'audit mesure la rangée sous ce
         nom. Les deux boutons de la barre (`nav.js`) ne sont pas dedans :
         la rangée leur garde leur place. -->
    <header class="score tbf-hudm">
      <div class="camp moi tbf-hudm-club" data-tribune="moi" data-ton="or">
        <div class="tbf-hudm-nom"><b id="nomMoi"><span class="long">TA TRIBUNE</span><span class="court" aria-hidden="true">TOI</span></b>
          <small id="clubMoi" hidden></small></div>
        <strong id="butsMoi">0</strong>
      </div>
      <div class="horloge tbf-hudm-score"><b id="horloge">5:00</b><span class="tbf-sticker" id="modeTag" hidden></span></div>
      <div class="camp eux tbf-hudm-club" data-tribune="eux" data-ton="bleu">
        <div class="tbf-hudm-nom"><b id="nomEux"><span class="long">EN FACE</span><span class="court" aria-hidden="true">EUX</span></b>
          <small id="clubEux" hidden></small></div>
        <strong id="butsEux">0</strong>
      </div>
    </header>

    <!-- Le score du vrai match, en ticket terrain : le duel affichait le
         score des tribunes et taisait celui de la rencontre. Il se lit, il
         ne se touche pas — le duel n'a pas de feuille du fil. -->
    <div class="tbf-hudm-ligne" id="filLigne" hidden>
      <div class="fil-match tbf-ticket tbf-ticket--terrain" id="filMatch">
        <span class="sc"><b id="filMatchScore">0 – 0</b><small>TERRAIN</small></span>
        <span class="tbf-terrain-min" id="filMatchMin"></span>
        <span class="tbf-terrain-der" id="filMatchQui"></span>
      </div>
    </div>

    <div class="arene" id="arene" style="--corde:0">

           `.stadewrap`. L’enveloppe porte la rotation sans la faire subir
           aux coins arrondis ni au découpage. -->
      <div class="stadewrap"><div class="stade" id="stade"></div></div>
      <div class="tbf-maree" aria-hidden="true"></div>
      <!-- Les deux Fanzzy en tribune, le mien et celui d'en face : voir
           `rendreFzArene`. Deux calques chacun, pour croiser les
           expressions sans cadre vide. -->
      <div class="duel-fz" data-tribune="moi" data-pose="neutre" id="fzMoi" aria-hidden="true" hidden>
        <div class="duel-fz-corps"><img alt="" decoding="async" draggable="false"><img alt="" decoding="async" draggable="false"></div></div>
      <div class="duel-fz" data-tribune="eux" data-pose="neutre" id="fzEux" aria-hidden="true" hidden>
        <div class="duel-fz-corps"><img alt="" decoding="async" draggable="false"><img alt="" decoding="async" draggable="false"></div></div>
      <div class="tbf-foule" data-tribune="moi" id="fouleMoi"></div>
      <div class="tbf-foule" data-tribune="eux" id="fouleEux"></div>
      <div class="effets-arene" id="effetsArene"></div>
      <div class="tbf-corde" data-sens="h" aria-hidden="true">
        <span class="tbf-corde-but" data-tribune="moi"></span>
        <span class="tbf-corde-but" data-tribune="eux"></span>
        <span class="tbf-corde-crans" data-tribune="moi" id="cransMoi"></span>
        <span class="tbf-corde-crans" data-tribune="eux" id="cransEux"></span>
        <span class="tbf-foulard" id="noeud"><b></b></span>
      </div>
      <div class="ecart" id="ecart"><b class="tbf-banderole">0</b><small>ÉGALITÉ</small></div>
      <div class="lieu" id="lieu"></div>
    </div>

    <!-- Les effets en cours, nommés en clair : l'objet posé sur l'arène ne
         dit pas seul ce qu'il coûte. La rangée n'existe que s'il y en a. -->
    <div class="effets" id="effets"></div>

    <div class="moi">
      <div class="rang-equipe">
        <div class="equipe" id="equipe"></div>
        <!-- Celui qui chante, et le souffle qu'il a : à côté de l'équipe,
             dans la colonne qu'elle laisse libre (voir le budget). -->
        <div class="equipe-info">
          <div class="fz-nom" id="fzNom"></div>
          <div class="souffle">
            <span class="nom">SOUFFLE</span>
            <b id="souffleVal">40</b>
            <div class="tbf-jauge tbf-jauge--fine tbf-jauge--souffle" id="souffleJauge"><i id="souffleBar" style="width:40%"></i></div>
          </div>
        </div>
        <!-- **Ce que tu portes**, derrière un « i » (lot 6) : le détail au
             toucher, dans un panneau posé hors de la colonne. Le contenu
             vient de `mods.js`, partagé avec le Virage. -->
        <button class="tbf-plaque tbf-plaque--rond apports-i" id="apportsL" type="button" hidden
          aria-expanded="false" aria-controls="apportsP" aria-label="Ce que tu portes"><b aria-hidden="true">i</b></button>
      </div>
      <div class="main-boite">
        <div class="main tbf-eventail" id="mainCartes"></div>
        <!-- « Parcage fermé », posé sur la main qu'il verrouille. -->
        <div class="tbf-effet" data-effet="parcage" id="parcage" hidden>
          <span class="tbf-scotch tbf-scotch--croix" aria-hidden="true"></span>
          <span class="tbf-sticker" data-ton="flare">PARCAGE FERMÉ</span>
          <span class="tbf-recharge" aria-hidden="true"></span></div>
      </div>
      <!-- Les cinq chants offerts : le même répertoire que le Virage, et
           choisir y est une décision de souffle. -->
      <div class="chants tbf-eventail" id="chants"></div>
    </div>
  </div>
</main>

<div class="tbf-apports-p tbf-apports-p--flottant duel-apports" id="apportsP" hidden></div>

<div class="mini" id="mini">

<!-- ====================================================== l'affiche et le bilan

     Deux écrans pleins. Ils encadrent le duel : l'un dit avec qui on entre,

<div class="grand" id="affiche" hidden>

  <div class="grand-bas">

  </div>
</div>

<!-- **Le bilan : la page kraft** (`.tbf-bilan`, la brique du lot 6). La
     case de BD du résultat, le Fanzzy en pose, la feuille, et deux bâches
     qui ne rechargent rien. `.gain small` et `.stat .quoi` restent : la
     suite du duel les lit. -->
<section class="tbf-bilan" id="bilan" data-bilan role="dialog" aria-modal="true" aria-labelledby="bilanTitre" hidden>
  <div class="bilan-case" id="bilanCaseBoite">

  <div class="tbf-ticket tbf-bilan-page">

      <h2 class="tbf-bilan-titre">DUEL DE TRIBUNES</h2>

<div class="voile" id="voile">
  <div class="spin" id="voileSpin"></div>

  <div class="texte" id="voileTexte"></div>
  <button class="tbf-plaque" id="voileBtn" style="display:none"></button>
</div>
<div class="toast tbf-ticket" id="toast" role="status"></div>
<!-- **La case de BD des buts** (`.tbf-moment`, la pièce unifiée du lot 2,
     comme au Grand Virage et au hub) : « LA CORDE CÈDE ! », « GOAL ! ». Posée
     sur le document, hors de la colonne ; invisible sans `.on`, elle ne prend
     jamais le doigt. Voir `poserMoment()`. -->
<div class="tbf-moment" id="moment" data-ton="or" aria-live="polite"><div class="tbf-vignette"
  ><b class="tbf-vignette-mot" id="momentTitre"></b><small id="momentSous"></small></div></div>

<script src="/socket.io/socket.io.js"></script>
<!-- Sans « defer » : le script en ligne ci-dessous lit FZART et TBF_ACTION. -->
<!-- Le manifeste des états : sans lui, aucune tenue ne se dessine — elles
     n'existent que dans l'arborescence par âge, jamais dans l'art plat. Le
     duel ne le chargeait pas, et montrait donc chacun en tenue de base. -->
<script src="/fanzzy-etats.js"></script>
<!-- Le dictionnaire des effets, avant tout ce qui en affiche. Il ne depend
     de rien et ne charge rien : voir son en-tete. -->
<script src="/mods.js"></script>
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fond.js"></script>
<!-- Ce que chaque Fanzzy porte, accroché à côté de lui dans l'arène. -->
<script src="/stuff-art.js"></script>
<script src="/action-art.js"></script>
<!-- Le déroulé des dix gestes, partagé avec le Grand Virage. -->
<!-- Le stade et la lumiere de ses tribunes, comme au Virage. -->
<!-- Le dessin des dix-neuf chants, posé derrière leur nom. -->
<script src="/chant-art.js"></script>
<script src="/stade-art.js"></script>
<script src="/geste.js"></script>
<script>
/* =======================================================================
   Duel N contre N.

   Deux tribunes tirent sur la même corde pendant un vrai match. On chante —
   un geste noté par le serveur — et on joue des cartes qui changent les
   règles quelques secondes.

   Trois principes gouvernent cet écran :

   **Le serveur est la seule source.** `nvn:state` porte la vue complète du
   joueur après chaque action ; `nvn:events` sert aux animations et au fil,
   jamais à recalculer un état. Un client qui déduit son propre score finit
   toujours par diverger.

   **Les durées du geste viennent de `moi.gestes`.** Elles ne sont écrites
   nulle part ici. Le Grand Virage les avait en dur et affichait une
   pulsation de 560 ms là où le serveur notait à 630 : le porteur
   d'équipement tapait juste sur ce qu'il voyait et récoltait un tiers de la
   note. Le Métronome et le Vent de face changent cette fenêtre en cours de
   partie, donc on la relit à chaque vue.

   **Une erreur nomme sa cause.** Chaque code du serveur a sa phrase. Un
   « impossible » coûte toujours plus cher qu'il n'économise.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/* Les familles viennent de `action-art.js`, avec les dessins. Le duel en
   gardait sa propre table — la couleur seule — et c'est la façon habituelle
   dont deux écrans du même jeu finissent par ne plus dire pareil. */
const famDe = (a) => window.TBF_ACTION.famDe(a);

/* Les libellés des dix gestes viennent de `/geste.js`, avec leur déroulé :
   un nom écrit ici et un autre là-bas finiraient par ne plus se ressembler. */
const LABEL_GESTE = window.TBF_GESTE.LABEL;
const AIDE_GESTE = window.TBF_GESTE.AIDE;
const COULEUR_GESTE = window.TBF_GESTE.COULEUR;

/** Chaque code du serveur a sa phrase : le joueur doit savoir quoi corriger.
 *
 * **Deux préfixes, et on s'est trompé de l'un pour l'autre.** Les refus du
 * duel lui-même arrivent en `nvn.error.*` ; ceux de l'entrée en file passent
 * par `Cheat`, qui préfixe `ferveur.error.*` — c'est la classe du Virage,
 * réutilisée ici. Trois phrases étaient donc écrites sous le mauvais préfixe
 * et ne servaient à personne : un joueur sans deck lisait « Refusé par le
 * serveur : ferveur.error.no_deck », sur le geste le plus courant du jeu.
 *
 * Rien ne le signalait. Une entrée de ce tableau qui ne correspond à aucun
 * code ne rougit nulle part — elle a l'air d'un travail fait. `nvn:smoke`
 * compare maintenant les deux listes.
 */
const MESSAGES = {
  'nvn.error.not_in_duel':        'Tu n\u2019es dans aucun duel.',
  'nvn.error.rate_limited':       'Trop d\u2019actions d\u2019un coup. Respire.',

/**
 * Le portrait d'un Fanzzy en jeu.
 *
 * Le dessin vient de /fanzzy-art.js, partagé avec le classeur et l'accueil :
 * un personnage se dessine au même endroit pour tout le jeu. Les trois Fanzzy
 * illustrés montrent leur portrait, les autres leur silhouette — et fx.js les
 * fait respirer dans les deux cas, sans qu'on ait rien à déclencher.
 */
function vignette(f) {
  const dessin = FZART.illustration(f, 'buste');
  if (dessin) return dessin;
  const svg = FZART.artProcedural(f);
  // La silhouette n'est pas un `.illu` : sans cet attribut elle resterait figée.
  return svg.replace('<svg ', `<svg data-vivant="${f.id}" `);
}

const api = async (p) => {
  const r = await fetch(p, { credentials:'same-origin' });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  /* **Le corps du refus se lit quel que soit le code** : le serveur répond
     `{ error: … }` et ce sont ces phrases-là que `MESSAGES` traduit.

     Mais une réponse qui n'est **pas du JSON** — une page d'erreur de
     l'hébergeur, un proxy qui répond à sa place — rendait un objet vide. Le
     chargement enchaînait alors sur `cat.actions ?? []` et `matchs.matchs ?? []`
     sans rien remarquer : l'écran annonçait **« aucun match à jouer »** là où le
     serveur était en panne. Le joueur repart en concluant qu'il n'y a personne
     ce soir, ce qui est la pire lecture possible d'une panne.

     On échoue donc, et le `catch` du chargement affiche « Impossible de
     préparer le duel » — qui est vrai, lui. Les appels secondaires gardent
     leur propre `catch` et dégradent comme avant. */
  const j = await r.json().catch(() => null);
  if (!j) {
    console.warn(`[duel] ${p} : ${r.status}, et ce n’est pas du JSON`);
    throw Object.assign(new Error('reponse illisible'), { code: 'app.error.illisible' });
  }
  if (j.error) throw Object.assign(new Error(j.error), { code:j.error });
  return j;
};

let toastT = null;
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 3400);
}
const dire = (code) => toast(MESSAGES[code] ?? `Refusé par le serveur : ${code}`);


/* ------------------------------------------------- faire venir quelqu'un

   Une file de duel ne vit que deux minutes. C'est exactement le moment où l'on
   voudrait dire « viens, je t'attends » — et le jeu n'avait aucun moyen de le
   faire. Le seul canal qui marche est celui que les gens emploient déjà :
   WhatsApp, un message.

   **Le lien envoie dans le camp d'en face.** C'est tout l'intérêt : deux
   joueurs du même côté ne se rencontrent jamais, ils attendent ensemble. Si
   celui qui reçoit suit un des deux clubs, le serveur décide pour lui de toute
   façon — on ne peut pas pousser contre son propre club, et le lien ne le fera
   pas changer d'avis. */
function lienDeMaFile(p) {
  const params = new URLSearchParams({
    match: String(p?.fixtureId ?? S.fixtureId ?? ''),
    format: String(p?.format ?? S.format),
  });
  // Le camp d'en face, pour que le duel parte au lieu de s'allonger.
  if (p?.camp === 0 || p?.camp === 1) params.set('camp', String(p.camp ^ 1));
  return `/duel-nvn?${params}`;
}

async function inviterAuDuel(p) {
  const chez = p?.enFaceClub?.name;
  const quoi = await window.TBF_PARTAGE.envoyer({
    titre: 'Duel de tribunes',
    texte: chez
      ? `Je t’attends en face, avec ${chez}. Tribune contre tribune.`
      : 'Je t’attends pour un duel de tribunes.',
    url: lienDeMaFile(p),
  });
  if (quoi === 'copie') toast('Lien copié.');
  else if (quoi === null) toast('Impossible de partager ici.');
}

function voile(titre, texte, bouton) {
  $('voileTitre').textContent = titre;
  $('voileTexte').innerHTML = texte ?? '';
  const b = $('voileBtn');
  if (bouton) { b.style.display = ''; b.textContent = bouton.texte; b.onclick = bouton.action; }
  else b.style.display = 'none';
  $('voileSpin').style.display = bouton ? 'none' : '';
  $('voile').classList.add('on');
}
const fermerVoile = () => $('voile').classList.remove('on');

/* ------------------------------------------------- quitter un duel en cours

   On pouvait partir sans rien : la salle attendait quatre-vingt-dix secondes,
   retirait le joueur « sans le punir », et le duel continuait à un contre zéro
   jusqu'au temps réglementaire. Celui qui restait gagnait en regardant une
   corde immobile ; celui qui partait ne perdait rien. Partir quand ça tourne
   mal était donc la façon la moins coûteuse de perdre.

   Le départ est maintenant un **forfait**, et il se dit avant : on perd le
   duel, on ne touche rien, et l'autre touche ce qui était prévu. Une sanction
   qu'on découvre après coup n'est pas une règle, c'est un piège.

   On intercepte la flèche de retour et le menu, qui sont les deux sorties —
   pas la fermeture de l'onglet, qu'aucune page ne peut retenir honnêtement et
   que la grâce de quatre-vingt-dix secondes couvre déjà. */
/* Un duel est **en cours** quand la corde est à l’écran et que le bilan ne
   l’est pas encore. Partir après le coup de sifflet n’est pas un forfait :
   il n’y a plus rien à abandonner. */
function enDuel() {
  return $('jeu').classList.contains('on')
    && $('bilan')?.hidden !== false;
}

async function confirmerForfait() {
  const prime = S.vue?.mode === 'classe' ? 'classé' : 'd’entraînement';
  return window.TBF_DIALOGUE?.confirmer({
    titre: 'QUITTER LE DUEL ?',
    texte: `Tu perds ce duel ${prime} par forfait et tu ne gagnes `
      + 'ni écharpe ni expérience. En face, la tribune gagne le duel et '
      + 'touche ce qui était prévu.',
    oui: 'ABANDONNER',
    non: 'RESTER',
    ton: 'flare',
  }) ?? true;
}

document.addEventListener('click', async (e) => {
  /* Voir `virage.html`, même correction et même cause : `.tbf-menu` n'existe
     nulle part — le tiroir de `menu.js` s'appelle `.tbf-tiroir`. Quitter un duel
     par le menu échappait donc au forfait et à sa confirmation, alors que c'est
     la sortie la plus naturelle une fois qu'on a décidé de partir.

     `a[href^="/"]` écarte la déconnexion, qui porte `href="#"` et demande déjà
     la sienne. */
  const sortie = e.target.closest('.tbf-retour, .tbf-tiroir a[href^="/"], [data-quitter-duel]');
  if (!sortie || !enDuel()) return;
  e.preventDefault();
  e.stopPropagation();
  const ou = sortie.getAttribute('href') || '/';
  if (!(await confirmerForfait())) return;
  /* On annonce le forfait **avant** de partir, et on laisse au serveur le temps
     de l'entendre : une navigation immédiate couperait la socket, et le duel
     retomberait dans la grâce de quatre-vingt-dix secondes — c'est-à-dire dans
     le comportement qu'on vient de retirer. */
  socket.emit('nvn:forfait');
  /* On vient de demander confirmation nous-mêmes, et le joueur a dit oui : le
     navigateur n'a pas à reposer la question par-dessus. Une seconde boîte,
     posée par-dessus la nôtre et dans d'autres mots, se lit comme un refus. */
  window.TBF_BARRE?.enPartie?.(false);
  setTimeout(() => { location.href = ou; }, 180);
}, true);

/* ------------------------------------------------ la salle d'attente

   Le serveur envoie la composition des deux tribunes à chaque mouvement —
   voir `diffuserFile`. La page en fait **un vestiaire** (lot 6) : les places
   sont des sièges (`.tbf-gradins`, la brique du lot 5), occupés par le buste
   du Fanzzy que ce supporter aligne, ou libres, en pointillé.

   Ce qu'on gagne n'est pas décoratif. Dans un 3v3 entré seul, il manque deux
   supporters **de son côté** et trois en face : le message d'avant ne disait
   que le second nombre, et on ne pouvait pas inviter ce qu'on ne savait pas
   qu'il manquait.

   Les classes `.tribune-att`, `.place-att.pris` / `.libre` et le portrait
   dans chaque place prise restent : `nvn:ui` les compte. Le buste est une
   image simple et non une `.illu` : six portraits qui respirent feraient six
   animations sans fin sur un écran qui n'en tolère que trois. */

let reboursTimer = null;
/* Combien étaient là au message précédent : une arrivée fait enfler la
   rumeur, un départ la laisse retomber à sa mesure. Remis à zéro à chaque
   entrée en file. */
let presentsAvant = 0;

/** Une place du vestiaire. `court` : à quatre ou cinq places par gradin,
    « LIBRE » seul tient sous le siège. */
function placeAttente(joueur, club, court = false) {
  if (!joueur) {
    return `<li class="tbf-siege tbf-siege--libre place-att libre">
      <span class="tbf-siege-place" aria-hidden="true">+</span>
      <span class="tbf-siege-nom">${court ? 'LIBRE' : 'PLACE LIBRE'}</span></li>`;
  }
  const src = joueur.fanzzy?.id ? window.FZART?.adresse?.(joueur.fanzzy.id, 'buste') : null;
  /* Sans nom connu, le nom du Fanzzy ou le club dit qui occupe la place.
     Jamais un « — ». */
  const nom = joueur.nom ?? joueur.fanzzy?.nom ?? club ?? '';
  return `<li class="tbf-siege place-att pris">
    <span class="tbf-buste" aria-hidden="true">${src ? `<img src="${esc(src)}" alt="" decoding="async">` : ''}</span>
    ${nom ? `<span class="tbf-siege-nom">${esc(nom)}</span>` : ''}</li>`;
}

function tribuneAttente(titre, joueurs, attendus, club, cote) {
  const places = Array.from({ length: attendus },
    (_, i) => placeAttente(joueurs[i], club, attendus > 3)).join('');
  return `<div class="tribune-att" data-tribune="${cote}">
    <h4 class="tbf-cousu">${esc(titre)}<em>${joueurs.length}/${attendus}</em></h4>
    <ul class="tbf-gradins tbf-gradins--entiers places-att" style="--places:${Math.max(1, attendus)}">${places}</ul>
  </div>`;
}

function rendreSalle(p) {
  const t = p.tribunes ?? { moi: [], eux: [] };
  const corps = [];

  /* La mienne en haut : « en haut, c'est moi » est la convention de tous les
     écrans du jeu, et le serveur construit déjà le payload de ce point de vue. */
  // Le club après le point médian, seulement s'il est connu : sans lui, le
  // titre s'arrêtait sur un séparateur qui n'annonçait rien.
  const avecClub = (titre, club) => (club ? `${titre} · ${club}` : titre);
  corps.push(tribuneAttente(avecClub('MA TRIBUNE', p.club?.name),
    t.moi, p.attendus, p.club?.name, 'moi'));
  corps.push(tribuneAttente(avecClub('EN FACE', p.enFaceClub?.name),
    t.eux, p.attendus, p.enFaceClub?.name, 'eux'));

  /* Le rebours avant les bots, en grand sur une bâche de parpaing. Le
     serveur sert la durée qui reste (`botDansMs`), comptée à l'envoi : on la
     décompte depuis la réception (R3), jamais contre l'horloge du téléphone.
     Un serveur qui ne servirait que l'instant (`botA`) garde l'ancien calcul. */
  corps.push('<div class="chrono-bots tbf-plaque tbf-plaque--lue" id="rebours" role="timer"></div>');
  if (p.renfort > 1) {
    corps.push(`<div class="renfort">Renfort · ta ferveur compte
      <b>×${String(p.renfort).replace('.', ',')}</b></div>`);
  }
  if (window.TBF_PARTAGE?.possible) {
    /* Une bâche au ton violet : celui des gens, comme partout ailleurs. */
    corps.push('<button class="inviter tbf-plaque" data-ton="violet" id="inviter">'
      + 'INVITER QUELQU’UN</button>');
  }

  voile('LE VESTIAIRE', `<div class="salle">${corps.join('')}</div>`,
    { texte: 'Quitter la file', action: quitterFile });

  if ($('inviter')) $('inviter').onclick = () => inviterAuDuel(p);

  /* **La rumeur qui monte à chaque arrivée** (`son.js`, lot 6) : la mesure
     est la part des places prises, des deux côtés ; une arrivée la fait
     enfler, sinon elle se tient à sa mesure. Le vestiaire le dit aussi à
     l'écran — le son ne porte jamais seul une information. */
  const presents = (t.moi?.length ?? 0) + (t.eux?.length ?? 0);
  const places = Math.max(1, 2 * (Number(p.attendus) || 1));
  const part = Math.max(0, Math.min(1, presents / places));
  window.TBF_SON?.rumeur?.(presents > presentsAvant ? 'arrivee' : 'vestiaire', { part });
  presentsAvant = presents;

  clearInterval(reboursTimer);
  reboursTimer = null;
  const recu = performance.now();
  const dansMs = Number(p.botDansMs);
  const finA = Number(p.botA) || 0;
  const resteS = () => (Number.isFinite(dansMs) && dansMs >= 0
    ? Math.max(0, Math.round((dansMs - (performance.now() - recu)) / 1000))
    : Math.max(0, Math.round((finA - Date.now()) / 1000)));
  const tic = () => {
    const n = $('rebours');
    if (!n) { clearInterval(reboursTimer); reboursTimer = null; return; }
    const reste = resteS();
    n.innerHTML = reste
      ? `<b>${Math.floor(reste / 60)}:${String(reste % 60).padStart(2, '0')}</b>`
        + '<small>avant les supporters d’appoint</small>'
      : '<small>Des supporters d’appoint entrent…</small>';
    if (!reste) { clearInterval(reboursTimer); reboursTimer = null; }
  };
  if (Number.isFinite(dansMs) || finA) { tic(); reboursTimer = setInterval(tic, 1000); }
  else $('rebours')?.remove();
}

/* ------------------------------------------------------------ état */

const S = {
  /* **On ouvre sur le 1v1**, et non sur le 3v3.

     Le format choisi d'avance décide de tout ce qui suit : c'est lui qui
     indexe la file. Ouvrir sur un 3v3 posait donc le joueur qui n'y touche
     pas — la plupart — dans le format le plus dur à remplir du jeu : six
     supporters, trois de chaque côté, sur un même match.

     Un soir creux, cela veut dire attendre le repli — qui descend à 2v2 au
     tiers de l'attente, à 1v1 aux deux tiers — puis finir contre des bots.
     Une première partie passée à attendre, pour jouer contre personne.

     Le 1v1 est le seul format qui part à deux. C'est donc celui qui doit
     être proposé en premier : les quatre autres restent à un doigt, et
     celui qui les veut sait déjà ce qu’il vient chercher. */
  format: '1v1', fixtureId: null, camp: null, matchs: [], catalogue: [],
  // Ce qui attend, par match et par format. Voir `lireAttentes`.
  attentes: [],
  derby: null,
  vue: null, enFile: false, dernierSeq: 0, occupe: false,
  /* Vrai quand la bibliothèque du direct n'a pas pu se charger. La page
     fonctionne quand même — on regarde les matchs — mais on ne peut pas
     entrer en file. Voir le démarrage, tout en bas. */
  sansDirect: false,
  // La portée de la liste des matchs : ses clubs, ou tout le championnat. On
  // peut jouer pour n’importe quel match — c’est ce qui permet de trouver un
  // adversaire un mardi de trêve — mais on démarre sur ses clubs, parce que
  // c’est là que le duel rapporte le double.
  tousLesMatchs: false,
  /* **L'entrée en tribune s'entend une fois** (`son.js`, lot 6) : la rumeur
     monte du vestiaire à la tribune pleine quand l'affiche se retire. Tant
     qu'elle n'a pas eu lieu, le rendu ne pose pas la phase « jeu » — posée
     d'abord, la rumeur serait déjà montée au pas ordinaire et l'entrée ne
     s'entendrait plus. Une reprise (le duel retrouvé après une coupure)
     n'a pas d'entrée : elle est tenue pour faite. */
  entree: true,
  /* **Le repli d'un serveur d'avant** (§ 17) : ce qui pèse sur la tribune
     d'en face, appris par les évènements quand la vue ne porte pas les
     effets de chaque joueur (`equipes[][].effets`). `type → { fin, duree }`,
     en `performance.now()`. Voir `rendreObjets`. */
  chezEux: new Map(),
  // Le camp qui vient de jouer une carte, pour un évènement `effect` sans `side`.
  dernierActeur: null,
};
const carteDef = (id) => S.catalogue.find((a) => a.id === id);

/** Le nom d'un club tel que la bâche du HUD peut le porter : sans l'année ni
    les sigles de forme juridique (« FC », « BSC »…), en capitales. Le nom
    entier reste ailleurs (l'affiche, la liste) : ici, il doit tenir dans
    soixante-sept pixels. Un nom qui ne serait fait que de sigles reste
    entier. */
function nomCourt(nom) {
  const mots = String(nom ?? '').trim().split(/\s+/).filter(Boolean);
  const SIGLE = /^(?:FC|AC|AS|SC|CF|SV|BSC|AFC|CD|UD|RC|OGC|SSC|US|SL|FK|NK|1\.|\d{4})$/i;
  const gardes = mots.filter((m) => !SIGLE.test(m));
  return (gardes.length ? gardes : mots).join(' ').toUpperCase();
}

/* ------------------------------------------------ les couleurs des clubs

   La liste des matchs sert les couleurs des deux clubs de chaque match
   (`homeColors`, `awayColors` : zéro à deux couleurs « #RRGGBB », un tableau
   vide quand on ne les connaît pas — comme au Virage). Elles vont aux
   écharpes, jamais à une lettre : l'affiche du match choisi, les bâches du
   choix du camp, la corde et le foulard (`--e1`/`--e2` mon club,
   `--eux1`/`--eux2` celui d'en face), les bâches du HUD, les écharpes
   croisées du VS et mes barres du bilan. Éclaircies par `FX.lisible` pour
   le noir de l'écran (chargé en différé : sans lui, telles que servies).
   Sans couleur, les pièces retombent sur l'or et le rouge chez moi, le bleu
   en face. Une valeur qui n'est pas une couleur ne s'écrit pas : elle irait
   dans un attribut `style`. */
const HEX = /^#[0-9a-f]{6}$/i;
function couleursDe(m, cote) {
  const brutes = m?.[cote === 0 ? 'homeColors' : 'awayColors'];
  return (Array.isArray(brutes) ? brutes : []).filter((c) => HEX.test(String(c ?? '')))
    .slice(0, 2).map((c) => window.FX?.lisible?.(c) ?? c);
}
/** Une écharpe en déclarations (`--a1:#…;--a2:#…`), ce qui est connu seulement. */
const echarpeDe = (nom, couleurs) => couleurs.map((c, i) => `--${nom}${i + 1}:${c}`).join(';');
/** Pose ou retire une variable, seulement quand elle change. */
function poserVar(el, nom, val) {
  if (!el) return;
  const v = val ?? '';
  if (el.style.getPropertyValue(nom) === v) return;
  if (v) el.style.setProperty(nom, v); else el.style.removeProperty(nom);
}

/**
 * Les couleurs du match du duel, sur l'arène et autour : posées quand elles
 * changent, pas à chacune des dix vues par seconde. La vue les porte
 * (`fixture.homeColors`, `fixture.awayColors`, la forme de la liste) ; d'un
 * serveur qui ne les y met pas, le match se retrouve dans la liste chargée
 * par la préparation (`S.matchs`) ; absent des deux (un duel repris depuis
 * une autre liste), on garde l'or et le bleu des camps. La bâche d'en face
 * du HUD reçoit les siennes, ou le bleu : sans valeur, elle hériterait de
 * mon écharpe.
 */
let couleursPosees = null;
function poserCouleursDuDuel(v) {
  const f = v?.fixture;
  const servies = Array.isArray(f?.homeColors) || Array.isArray(f?.awayColors);
  const m = !v ? null : servies ? f : S.matchs.find((x) => x.id === f?.id) ?? null;
  const mon = v?.moi?.side ?? 0;
  const moi = v ? couleursDe(m, mon) : [];
  const eux = v ? couleursDe(m, mon ^ 1) : [];
  const cle = JSON.stringify([moi, eux, Boolean(v)]);
  if (cle === couleursPosees) return;
  couleursPosees = cle;
  for (const el of [$('app'), $('bilan'), $('affiche')]) {
    poserVar(el, '--e1', moi[0]); poserVar(el, '--e2', moi[1]);
    poserVar(el, '--eux1', eux[0]); poserVar(el, '--eux2', eux[1]);
  }
  const bacheEux = document.querySelector('#jeu .tbf-hudm-club[data-tribune=eux]');
  poserVar(bacheEux, '--e1', v ? eux[0] ?? 'var(--bleu)' : null);
  poserVar(bacheEux, '--e2', v ? eux[1] ?? 'var(--bleu-clair)' : null);
}
/* `FX.lisible` arrive en différé : une fois là, les couleurs se reposent
   éclaircies (la clé change avec elles). */
addEventListener('load', () => { couleursPosees = null; if (S.vue) poserCouleursDuDuel(S.vue); });

/* ---------------------------------------------------- préparation */

async function preparer() {
  try {
    const [cat, matchs] = await Promise.all([
      api('/api/deck/catalogue'),
      api(`/api/deck/matchs${S.tousLesMatchs ? '?tous=1' : ''}`),
    ]);
    S.catalogue = cat.actions ?? [];
    // Ce que chaque format paie en plus. Voir `primeDeFormat` côté serveur.
    S.primes = cat.primes ?? {};
    S.matchs = matchs.matchs ?? [];

    // Sans deck, la file refuserait l'entrée après trois minutes d'attente :
    // autant le dire tout de suite et pointer l'écran de construction.
    let deck = null;
