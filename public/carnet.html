<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="/langue.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : dans un onglet Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas ; depuis l'icône, la page passe sous les boutons et s'en garde par env(safe-area-inset-bottom) (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)&&matchMedia('(display-mode: browser)').matches){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Mon carnet — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
/* **La colonne n'a plus de fond : le décor revient.**

   Elle portait un dégradé opaque, du gris ardoise au noir, qui recouvrait
   toute la largeur de la photo de tribune que `nav.js` pose sous chaque
   écran. Le carnet était ainsi le seul écran de la famille à se jouer dans
   une pièce sans fenêtre. Ce qui se lit y porte désormais son propre
   panneau — les souvenirs l'avaient déjà, les compteurs et le carnet vide
   le reçoivent. */
#app{position:relative;width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;flex:none}
.top h1{font-family:var(--banner);font-size:20px;letter-spacing:.15em;margin:0}
.top h1 small{display:block;font-size:8.5px;letter-spacing:.3em;opacity:.5;margin-top:3px;font-family:var(--ui)}


/* Les trois compteurs, chacun sur un panneau. Leur légende était à 60 %
   d'opacité, posée sur la photo : elle passe à la couleur de la craie
   légèrement retenue, et c'est le chiffre — plus grand, gras, à pleine
   craie — qui fait la hiérarchie. Il était doré : en dix-sept pixels, l'or
   ne tient pas au soleil, et il ne s'écrit plus qu'en grand (arbitrage du
   2 octobre 2026). */
.stats{display:flex;gap:9px;padding:0 16px 12px;font-size:11px;color:rgba(242,238,228,.88)}
.stats div{flex:1;text-align:center;border:1px solid rgba(242,238,228,.1);border-radius:7px;padding:8px 4px;
  background:var(--panneau)}
.stats b{display:block;font-family:var(--banner);font-size:17px;font-weight:700;color:var(--craie)}

/* **La carte-souvenir, une vraie carte** (11 octobre 2026, Gaël : « une
   carte dont le joueur serait fier dans sa collection »).

   C'était une ligne de résultat dans un cadre d'or, et le Fanzzy y tenait en
   un code (« avec RP19 »). C'est maintenant une carte en portrait, deux par
   rangée comme dans un classeur : le personnage qui chantait, debout devant
   la plaque des cartes du jeu, la minute du but en grand, le buteur sur le
   bandeau, puis le match. Une vignette, achetée, n'a pas de Fanzzy : c'est
   l'écusson du club qui a marqué qui se tient devant la plaque.

   Tout est mesuré en largeur de carte (`cqw`) : la même carte s'agrandit
   telle quelle quand on la touche. */
.list{flex:1;padding:0 14px 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.list>.empty{grid-column:1/-1}
.sv{--cadre:rgba(242,238,228,.42);--cadre2:rgba(242,238,228,.14);position:relative;container-type:inline-size;
  border-radius:10px;padding:6px;background:linear-gradient(155deg,var(--cadre),var(--cadre2) 45%,var(--cadre) 100%);
  box-shadow:0 6px 18px rgba(0,0,0,.55);cursor:pointer;color:var(--craie);font-family:var(--ui)}
.sv.presence{--cadre:#F5C33B;--cadre2:#7A5A12}
.sv .in{position:relative;border-radius:6px;overflow:hidden;background:#0B0E13;display:flex;flex-direction:column;height:100%}
.sv .lg{display:flex;justify-content:space-between;gap:4px;padding:5.2px 6.8px 4px;font-size:8.8px;letter-spacing:.08em;
  text-transform:uppercase;background:#11161D;border-bottom:1px solid rgba(242,238,228,.1)}
.sv .lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv .lg .d{flex:none;opacity:.8}
.sv .art{position:relative;aspect-ratio:1/1.08;overflow:hidden;container-type:size}
.sv .art>svg{position:absolute;inset:0;width:100%;height:100%}
.sv .art .fz{position:absolute;left:0;bottom:0;width:100%;height:92%;object-fit:contain;object-position:50% 100%;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
/* La lueur de l'âge, celle des cartes du classeur : aucune, bleue, violette. */
.sv .art .fz[data-age="2"]{filter:drop-shadow(0 0 4px rgba(95,168,255,.75)) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.sv .art .fz[data-age="3"]{filter:drop-shadow(0 0 5px rgba(185,140,255,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.sv .art .ecu{position:absolute;left:50%;top:50%;width:52%;height:52%;translate:-50% -50%;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.sv .art .club{position:absolute;left:6px;top:6px;width:26px;height:26px;object-fit:contain;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
/* La minute, en grand, en bas à gauche du dessin : c'est le moment qu'on a
   vécu, et le premier chiffre qu'on cherche. */
.sv .art .mn{position:absolute;left:6px;bottom:4px;font-family:var(--banner);font-weight:700;font-size:30px;line-height:1;
  color:var(--craie);text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8)}
.sv .bd{padding:4.8px 6.8px 0;background:linear-gradient(180deg,#151B23,#0B0E13)}
.sv .bt{font-family:var(--banner);font-weight:700;font-size:14.8px;letter-spacing:.02em;line-height:1.15;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv .mt{display:flex;align-items:center;gap:4.8px;margin:4px 0 2px}
.sv .mt img{width:17px;height:17px;object-fit:contain;flex:none}
.sv .mt .sc{flex:1;text-align:center;font-family:var(--banner);font-weight:700;font-size:17px;letter-spacing:.04em}
.sv .eq{display:flex;justify-content:space-between;gap:4px;font-size:8.4px;opacity:.85}
.sv .eq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.sv .eq span:last-child{text-align:right}
.sv .eq .but{opacity:1;font-weight:700}
.sv .foot{display:flex;align-items:center;gap:4px;padding:4.8px 6.8px 6px;font-size:8.4px;margin-top:auto;
  border-top:1px solid rgba(242,238,228,.08);background:#0B0E13}
.sv .foot .qui{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
.sv .foot .qui b{font-weight:700}
.sv .foot .qui>span{display:inline-block}
.sv .foot .qui>span::first-letter{text-transform:uppercase}
.sv .foot .fv{flex:none;font-family:var(--banner);font-weight:700;font-size:10px}
.sv .foot .fv small{font-family:var(--ui);font-weight:400;font-size:6.4px;letter-spacing:.06em;opacity:.8;margin-left:2px}
/* « TU Y ÉTAIS » est un sticker craie (`.tbf-sticker`, ui.css), collé de
   travers dans le coin du dessin : c'est le seul objet collé de la carte, et
   le cadre d'or dit le reste. « VIGNETTE », elle, reste une mention au trait. */
.stamp{position:absolute;top:26px;right:6px;font-family:var(--banner);z-index:2}
.stamp.tbf-sticker{font-size:8.4px;letter-spacing:.04em;--rot:5deg}
.stamp.v{font-size:8px;letter-spacing:.1em;border:1px solid rgba(242,238,228,.45);background:rgba(7,9,12,.7);
  color:var(--craie);border-radius:2.8px;padding:1.6px 4px}
/* Au marché, la plaque d'achat et le temps qui reste, sous la carte. */
.achat{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4.8px 6.8px 6px;background:#0B0E13}
.achat .left{font-size:8.4px;text-align:center}
.buy{padding:7px 8px;font-size:12px;min-height:40px}
.left.urgent{color:var(--flare)}

/* La carte touchée s'ouvre en grand, au-dessus de tout. */
.zoom{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,6,9,.92)}
.zoom.on{display:flex}
.zoom .sv{width:min(84vw,340px);cursor:default;box-shadow:0 12px 40px rgba(0,0,0,.8)}
.sv.presence.brille .in::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,229,150,.22) 45%,transparent 60%);
  background-size:250% 100%;animation:reflet 3.2s ease-in-out infinite}
@keyframes reflet{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.sv.presence.brille .in::after{animation:none}}
html[data-calme~="animations"] .sv.presence.brille .in::after{animation:none}
/* Les mesures en largeur de carte : celles en pixels, au-dessus, sont le
   repli d'un navigateur sans confinement (une carte d'environ 200 px). */
@container (min-width:1px){
  .sv .in{border-radius:3cqw}
  .sv .lg{gap:2cqw;padding:2.6cqw 3.4cqw 2cqw;font-size:4.4cqw}
  .sv .art .club{left:3cqw;top:3cqw;width:13cqw;height:13cqw}
  .sv .art .mn{left:3cqw;bottom:2cqw;font-size:15cqw}
  .sv .bd{padding:2.4cqw 3.4cqw 0}
  .sv .bt{font-size:7.4cqw}
  .sv .mt{gap:2.4cqw;margin:2cqw 0 1cqw}
  .sv .mt img{width:8.5cqw;height:8.5cqw}
  .sv .mt .sc{font-size:8.5cqw}
  .sv .eq{gap:2cqw;font-size:4.2cqw}
  .sv .foot{gap:2cqw;padding:2.4cqw 3.4cqw 3cqw;font-size:4.2cqw}
  .sv .foot .fv{font-size:5cqw}
  .sv .foot .fv small{font-size:3.2cqw;margin-left:1cqw}
  .stamp{top:13cqw;right:3cqw}
  .stamp.tbf-sticker{font-size:4.2cqw}
  .stamp.v{font-size:4cqw;border-radius:1.4cqw;padding:.8cqw 2cqw}
  .achat{gap:2cqw;padding:2.4cqw 3.4cqw 3cqw}
  .achat .left{font-size:4.2cqw}
}

.empty{text-align:center;padding:52px 24px;opacity:.9;font-size:13px;line-height:1.8;
  background:var(--panneau);border:1px solid var(--trait);border-radius:var(--r)}
.empty a{color:var(--craie);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#171C23;z-index:20;
  border:1px solid rgba(242,238,228,.2);border-radius:7px;padding:11px 16px;font-size:12.5px;display:none}
.toast.on{display:block}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app">
  <div class="top">
    <p class="tbf-sous">Ce que tu as vécu</p>
  </div>

  <!-- Le rail au bleu de ce qu'on possède, le ton de cet écran sur l'accueil. -->
  <div class="tabs tbf-onglets" data-ton="bleu">
    <button class="tab tbf-onglet on" data-tab="mine">MES SOUVENIRS</button>
    <button class="tab tbf-onglet" data-tab="market">À RÉCUPÉRER</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true"></div>

<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fanzzy-fond.js"></script>
<script>
/* =======================================================================
   Le carnet.
   Deux objets pour un même but : le souvenir, gagné en étant là, et la
   vignette, achetée dans les quinze jours. Même image, statut différent —
   et le carnet le dit franchement, sinon la distinction ne vaut rien.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
let onglet = 'mine';
let scarves = 0;

const api = async (path, body) => {
  const r = await fetch('/api/souvenirs' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json' },
    credentials: 'same-origin',
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (j.error) throw Object.assign(new Error(j.error), { code: j.error });
  return j;
};

const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/** Date lisible : « 13 septembre », sans l'année quand c'est cette saison. */
function jour(v) {
  const d = new Date(String(v).includes('T') ? v : String(v).replace(' ', 'T') + 'Z');
  if (Number.isNaN(d.getTime())) return '';
  const opts = { day: 'numeric', month: 'long' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('fr', opts);
}

function restant(expires) {
  const ms = new Date(String(expires).includes('T') ? expires
    : String(expires).replace(' ', 'T') + 'Z') - Date.now();
  if (ms <= 0) return null;
  const j = Math.floor(ms / 864e5);
  return j >= 1 ? `${j} jour${j > 1 ? 's' : ''}` : `${Math.max(1, Math.floor(ms / 36e5))} h`;
}

/**
 * Le Fanzzy qui chantait, en pied, à l'âge qu'il montrait au moment du but
 * et dans la tenue de cet âge (le premier âge pour une carte frappée avant
 * qu'on les garde). Le serveur rend sa forme (`fanzzy`) ;
 * sans elle (une vignette, ou un serveur d'avant), la carte montre l'écusson
 * du club qui a marqué.
 *
 * Même chemin que les cartes du classeur : la pose au repos du manifeste
 * d'images (`TBF_ETATS.resoudre`), sinon le plein-pied du catalogue — un
 * Fanzzy pas encore redessiné reste lui-même, dans l'ancien dessin.
 */
/* Le personnage grandit d'un âge à l'autre, comme sur les cartes du classeur
   (`PART_CARTE`, cartes.js). */
const PART_AGE = { 1: 0.9, 2: 0.97, 3: 1.04 };
function dessinFanzzy(f) {
  const E = window.TBF_ETATS;
  const evo = Math.min(3, Math.max(1, Number(f.evo) || 1));
  const r = E?.pret?.() ? E.resoudre(f.id, { evo, skin: f.skin || 'base', etat: 'neutre' }) : null;
  /* Un âge pas encore redessiné : `resoudre` rendrait un autre âge ; c'est
     alors la carte de l'âge, dans l'ancien dessin (comme `dessinAvatar`). */
  const exact = r?.src && r.evo === evo ? r : null;
  const src = exact?.src ?? window.FZART?.adresse?.(f.age ?? f.id, 'plein', { skin: f.skin || 'base' });
  if (!src) return '';
  /* La pose d'un âge vit dans un cadre plus grand que le personnage :
     `taille` le ramène à la hauteur voulue, pieds au même endroit. */
  const t = exact ? E?.taille?.(f.id, evo, PART_AGE[evo]) : null;
  const style = t ? ` style="height:${t.hauteur};bottom:${t.bas};translate:${t.decale} 0"` : '';
  return `<img class="fz" data-age="${evo}" src="${esc(src)}" alt=""${style} loading="lazy" decoding="async"
    onerror="this.onerror=null;this.src=window.TBF_ETATS?.secours?.(this.src,true)||''">`;
}

function fondDe(s) {
  const f = s.fanzzy
    ? { ...s.fanzzy, stage: s.fanzzy.evo ?? 1 }
    : { id: `souvenir-${s.id}`, skin: 'base', rar: s.kind === 'presence' ? 'legendaire' : 'commune', stage: 1 };
  return window.TBF_FOND?.fond?.(f, { carte: true }) ?? '';
}

function carte(s, mode) {
  const marque = s.kind === 'presence'
    ? '<div class="stamp tbf-sticker">TU Y ÉTAIS</div>'
    : s.kind === 'vignette' ? '<div class="stamp v">VIGNETTE</div>' : '';
  const reste = restant(s.expires_at);
  const marqueur = s.scorer_team === s.away_id ? 'away' : 'home';
  const logoBut = marqueur === 'away' ? s.away_logo : s.home_logo;
  const nomBut = marqueur === 'away' ? s.away_name : s.home_name;

  /* Ce qui manque se retire : une compétition sans nom ne laisse pas un
     bandeau vide, une minute inconnue pas un « ?' » sur le dessin. */
  const art = s.fanzzy
    ? `${dessinFanzzy(s.fanzzy)}${logoBut ? `<img class="club" src="${esc(logoBut)}" alt="">` : ''}`
    : (logoBut ? `<img class="ecu" src="${esc(logoBut)}" alt="">` : '');

  const pied = mode === 'market'
    ? `<div class="achat">
        <span class="left ${reste && reste.includes('h') ? 'urgent' : ''}">${reste ? 'encore ' + reste : 'expirée'}</span>
        <button class="buy tbf-plaque" data-ton="or" data-buy="${s.id}" ${scarves < s.price ? 'disabled' : ''}>${s.price} ÉCHARPES</button>
      </div>`
    : `<div class="foot">
        <span class="qui">${s.fanzzy?.nom ? `<b>${esc(s.fanzzy.nom)}</b>`
          : `<span>${s.kind === 'presence' ? 'acquise sur le terrain' : 'récupérée au marché'}</span>`}</span>
        ${s.ferveur ? `<span class="fv">${s.ferveur}<small>FERVEUR</small></span>` : ''}
      </div>`;

  return `<div class="sv ${s.kind === 'presence' ? 'presence' : ''}" data-carte="${s.id}">
    <div class="in">
      <div class="lg"><span>${esc(s.league_name ?? '')}</span><span class="d">${esc(jour(s.kickoff_at))}</span></div>
      <div class="art">
        ${fondDe(s)}
        ${art}
        ${s.minute == null ? '' : `<span class="mn">${s.minute}'</span>`}
      </div>
      ${marque}
      <div class="bd">
        <div class="bt">${esc(s.player ?? 'But')}</div>
        <div class="mt">
          <img src="${esc(s.home_logo)}" alt="">
          <span class="sc">${s.score_home} – ${s.score_away}</span>
          <img src="${esc(s.away_logo)}" alt="">
        </div>
        <div class="eq">
          <span class="${marqueur === 'home' ? 'but' : ''}">${esc(s.home_name)}</span>
          <span class="${marqueur === 'away' ? 'but' : ''}">${esc(s.away_name)}</span>
        </div>
      </div>
      ${pied}
    </div>
  </div>`;
}

/** La carte touchée, en grand. Un second toucher, n'importe où, la referme. */
function ouvrir(el) {
  const z = $('zoom');
  const copie = el.cloneNode(true);
  copie.querySelector('.achat')?.remove();
  copie.classList.add('brille');
  z.replaceChildren(copie);
  z.classList.add('on');
}

function toast(txt) {
  const t = $('toast'); t.textContent = txt; t.className = 'toast on';
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2600);
}

/* ------------------------------------------------------------ chargement */

async function load() {
  try {
    const [mine, market, fz] = await Promise.all([
      api('/mine'),
      api('/market'),
      fetch('/api/fanzzy/state', { credentials: 'same-origin' })
        .then((r) => r.json()).catch(() => ({ wallet: { scarves: 0 } })),
      /* Le manifeste des dessins, attendu avec le reste : sans lui, le
         Fanzzy retomberait sur l'ancien plein-pied et perdrait sa tenue. Il
         ne lève jamais. */
      window.TBF_ETATS?.charger?.(),
    ]);
    scarves = fz.wallet?.scarves ?? 0;
    /* La barre ne porte plus la bourse — le carnet affiche la sienne. */

    const vecus = mine.souvenirs.filter((s) => s.kind === 'presence').length;
    const recup = mine.souvenirs.length - vecus;
    $('stats').innerHTML = `
      <div><b>${vecus}</b>vécus</div>
      <div><b>${recup}</b>récupérés</div>
      <div><b>${market.souvenirs.length}</b>disponibles</div>`;

    const liste = onglet === 'mine' ? mine.souvenirs : market.souvenirs;
    if (!liste.length) {
      $('list').innerHTML = onglet === 'mine'
        ? `<div class="empty">Ton carnet est vide.<br><br>
             Entre dans le <a href="/virage">Grand Virage</a> pendant un match de ton club :
             chaque but marqué pendant que tu chantes te laisse une carte que personne
             ne pourra t'acheter.</div>`
        : `<div class="empty">Rien à récupérer pour l'instant.<br><br>
             Les vignettes des buts récents apparaissent ici pendant quinze jours.</div>`;
      return;
    }
    $('list').innerHTML = liste.map((s) => carte(s, onglet)).join('');
  } catch (e) {
    if (e.message !== 'auth') $('list').innerHTML = `<div class="empty">Serveur injoignable.</div>`;
  }
}

$('zoom').addEventListener('click', () => $('zoom').classList.remove('on'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('zoom').classList.remove('on'); });

$('list').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-buy]');
  if (!b) {
    const c = e.target.closest('[data-carte]');
    if (c) ouvrir(c);
    return;
  }
  b.disabled = true;
  try {
    const r = await api('/buy', { souvenirId: Number(b.dataset.buy) });
    toast(`Vignette récupérée · −${r.spent} écharpes`);
    await load();
  } catch (err) {
    toast(({
      'souvenir.error.not_enough_scarves': 'Pas assez d\u2019écharpes',
      'souvenir.error.expired': 'Cette vignette a expiré',
      'souvenir.error.already_owned': 'Tu l\u2019as déjà',
    })[err.code] ?? 'Impossible pour le moment');
    b.disabled = false;
  }
});

document.querySelector('.tabs').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  onglet = t.dataset.tab;
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  load();
});

load();
</script>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
</html>
