<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="/langue.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Mon deck — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="stylesheet" href="/cartes.css">
<style>
:root{--ambre:#E08A2C;--barre:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
/* Le même fond que le classeur, et pour une raison qui n’est pas de goût.

   `nav.js` pose sur chaque page un décor de stade derrière la colonne. Le
   classeur le laisse passer — son `#app` ne porte qu’un halo translucide —
   tandis que le deck posait par-dessus un **aplat opaque**
   (`linear-gradient(180deg,#141A21,#0A0D11…)`) qui le masquait entièrement.
   Deux écrans voisins, une touche pour passer de l’un à l’autre, et le
   fond changeait : on ne lisait pas « une autre section », on lisait « une
   autre application ».

   Reste le halo, le même que sur le classeur : c’est la même collection
   qu’on regarde. **Il est neutre** — une lueur de craie, comme un projecteur
   blanc au-dessus du mur — depuis l’arbitrage du 2 octobre 2026 : il était
   doré, et l’or ne dit plus que trois choses (acheter, une récompense prête,
   le légendaire). Rien ne s’achète sur cet écran, et un fond d’or y faisait
   lire un kiosque. `verif-pages` compare les deux déclarations : elles
   changent ensemble ou pas du tout. */
#app{position:relative;width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -8%,rgba(242,238,228,.08),transparent 62%)}

/* La barre d'enregistrement est fixe : le contenu doit donc réserver sa place
   lui-même, en plus de celle que nav.js réserve déjà pour la navigation. */
.corps{flex:1;padding-bottom:calc(var(--barre) + 12px)}

/* **Le rail de la section, le même que sur /fanzzy.** Les deux portes
   MON FANZZY et CLASSEUR, en béton pleine largeur, et l'état PRÊT seul sur la
   ligne d'en dessous, faisaient du deck le seul écran de la section avec un
   autre haut : on y lisait une autre application. Le rail reprend donc ici
   exactement celui de /fanzzy — même creux, mêmes icônes, même plaque DECK à
   droite —, et seul ce qui est allumé change : la plaque DECK, au bleu de ce
   qu'on possède. Ses deux onglets sont des liens, éteints, comme l'est là-bas
   l'onglet de l'écran qu'on ne regarde pas.

   La plaque est calée sur le rail, comme sa sœur de /fanzzy : sa face fait la
   hauteur du rail moins sa tranche. Elle n'est pas un bouton (`span`,
   `aria-current`) : on y est. */
.rail{display:flex;align-items:flex-start;gap:8px;flex:none}
.rail .nav{flex:1;min-width:0}
.rail .ici{flex:none;min-height:49px;padding:0 16px;display:flex;align-items:center;cursor:default}
.rail .tbf-onglet svg{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:6px}

/* L'état du deck, en sticker dans la barre du bas, à côté d'ENREGISTRER :
   c'est là que se décide l'envoi, et c'est là qu'on regarde s'il manque
   quelque chose. Le ton dit l'état — vert prêt, rouge incomplet —, posé par
   `rendre`, qui seul sait lequel. */
.etat{flex:none;--rot:-2deg;letter-spacing:.1em}


/* Onglets, filtres, boutons : le même matériau que le classeur. Un socle dur
   qui disparaît à l'appui pendant que le bouton descend. C'est le seul retour
   tactile dont dispose une page web, et il fait toute la différence entre une
   liste de réglages et un écran de jeu. */

/* **Les titres de rubrique sont cousus** (`.tbf-cousu`, dans ui.css) : craie
   pleine, capitales espacées, et le fil pointillé qui court jusqu'au bord. Ils
   étaient à 42 % d'opacité et en dix pixels et demi — les titres les plus
   pâles de l'écran, sur l'écran où l'on compose. Il ne reste ici que leur
   place. */
h2{margin:20px 16px 9px}
/* **Ce que le titre précisait passe dessous**, sur un panneau : « le premier
   entre au coup d'envoi », « cinq visibles à la fois », le souffle moyen. Un
   fil qui remplit la ligne ne laisse plus de place à côté du titre, et un
   texte posé à même la photo de tribune ne se lit pas au soleil. */
.chapo{display:flex;align-items:center;gap:10px;margin:0 14px 12px;padding:8px 11px;
  font-size:12px;line-height:1.45}
.chapo span{flex:1;min-width:0;opacity:.88}
/* Le souffle moyen : la seule mesure de la page, donc la seule chose qui se
   détache sous un titre de section. **Par la graisse, plus par l'or** :
   l'or ne s'écrit plus qu'en grand texte (arbitrage du 2 octobre 2026), et
   en douze pixels il tombait sous 4,5:1 au plein jour. */
.chapo b{flex:none;font-family:var(--banner);font-weight:700;font-size:12px;
  letter-spacing:.08em;white-space:nowrap;--rot:2deg}

/* ------------------------------------------------------------- tribune */

/* **Un rang est une bâche du jeu** (`.pan`, posé dans le balisage) : le
   béton grainé et son filet, comme les panneaux du profil et de la boutique.
   Il avait sa propre matière — un dégradé lisse cerné d'un liseré clair —,
   la seule de la section, et c'est elle qui faisait lire « un autre écran ».

   Le titulaire se marque **au vert de son sticker**, plus à l'or : l'or ne
   dit que trois choses (acheter, une récompense prête, le légendaire —
   arbitrage du 2 octobre 2026), et un cadre doré autour d'un Fanzzy commun
   le faisait lire légendaire. Le cadre et le sticker TITULAIRE disent
   maintenant la même chose, de la même couleur. */
.rang{margin:0 14px 14px;overflow:hidden;border-radius:10px;
  box-shadow:0 4px 0 rgba(0,0,0,.55),0 7px 14px rgba(0,0,0,.4)}
.rang.titulaire{border-color:var(--vert-clair);
  box-shadow:inset 0 0 0 1px var(--vert-clair),0 4px 0 var(--vert-fonce),0 7px 14px rgba(0,0,0,.4)}
/* Le rang libre est un creux en pointillé, comme la case vide du classeur
   et de l'album : une place qui attend, pas un panneau éteint. */
.rang.vide{background:rgba(4,7,11,.72);border:2px dashed rgba(242,238,228,.3);box-shadow:none}
.rang .tete{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;position:relative}
.rang .tete::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:radial-gradient(70% 120% at 12% 50%,var(--tc,#8257DA),transparent 62%)}
.pip{width:44px;height:44px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--tc,#8257DA);position:relative}
.pip svg{width:24px;height:24px}

/* ------------------------------------------------- le Fanzzy, en entier

   La tribune montrait un carré de couleur avec le pictogramme du type. Le
   classeur, lui, affiche les personnages dessinés — et c'est le même joueur qui
   passe de l'un à l'autre pour composer son deck. Il choisissait des noms ici
   et des visages là.

   ## Puis un visage, mais dans une boîte

   Le portrait est arrivé, **recadré dans une plaque sombre** de cinquante-quatre
   pixels, avec un cadre de rareté autour. Or les dessins sont détourés : ils
   n'ont pas de fond, et c'est ainsi que « Mon FANZZY » les montre — le
   personnage se tient là, sans cadre. Deux écrans voisins donnaient donc deux
   traitements au même dessin, et celui du deck le rognait au menton.

   ## Ce qu'il est maintenant

   Le personnage **entier**, posé sur rien. `contain` et non `cover` : un
   recadrage coupe toujours quelque chose, et ce qu'il coupait ici était le
   geste — le Capo qui porte la main à la bouche, le Tambour bras levés.

   La rareté ne disparaît pas pour autant : elle passe du cadre à une **lueur**
   sous les pieds. C'est la même information, et elle ne remet pas de boîte
   autour d'un dessin qui a été détouré exprès. Les 262 Fanzzy pas encore
   dessinés gardent la pastille de type : le repli est le même que partout. */
/* Plus haut que large : un personnage debout, et non un cadre carré. Assez
   grand pour qu’on lise le geste — le Capo porte la main à la bouche, le
   Tambour lève les bras — qui est ce qui les distingue de loin. */
.tete .face{width:56px;height:74px;flex:none;position:relative;
  display:flex;align-items:flex-end;justify-content:center}
/* La lueur de rareté, sous les pieds. `--rc` vient de `ui.css` — gris commun,
   bleu rare, violet épique, or légendaire — comme partout ailleurs. */
.tete .face::before{content:"";position:absolute;left:50%;bottom:1px;width:86%;height:26%;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,var(--rc,#C2CAD6),transparent 70%);opacity:.5}
.tete .face img{position:relative;width:100%;height:100%;object-fit:contain;
  object-position:50% 100%;display:block;
  /* L'ombre portée remplace le relief que donnait la plaque : sans elle, un
     personnage clair sur un panneau clair perd ses contours. */
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
/* La pastille de type se pose **à côté** du personnage, pas dessus : le
   dessin est centré dans sa boîte et occupe les deux tiers de la largeur,
   donc le coin est libre. */
.tete .face .type{position:absolute;right:-2px;bottom:2px;width:19px;height:19px;border-radius:50%;
  background:var(--tc,#8257DA);display:grid;place-items:center;
  box-shadow:0 0 0 2px #10151C}
.tete .face .type svg{width:11px;height:11px}
/* Le cadre de rareté — gris commun, bleu rare, violet épique, or légendaire —
   vient de `ui.css`. Une couleur apprise une fois vaut pour tout le jeu, et
   elle était recopiée dans trois pages. */
.rang .id{flex:1;min-width:0;position:relative}
/* Le nom et sa forme de rareté sur une ligne : c'est le nom qui cède (ses
   points de suspension), jamais la forme. Quand l'ellipse portait sur la
   ligne entière, la marque de rareté était posée au bout et partait la
   première — « La Clé du Loca… » perdait sa couronne, donc ce qui la
   distingue. Le nom seul rogne ; la forme garde son bord craie et son cerne,
   qui débordent de sa boîte. */
.rang .id b{display:flex;align-items:center;gap:8px;min-width:0;
  font-family:var(--banner);font-size:15px;letter-spacing:.03em}
.rang .id b .nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Onze pixels au moins, et 88 % : tout ce qui renseigne se lit en plein jour.
   La hiérarchie tient par la taille et la police, plus par la transparence —
   une précision à 55 % sur un panneau sombre disparaît au soleil. */
.rang .id .sous{font-size:11px;opacity:.88;margin-top:3px;letter-spacing:.03em}
/* Le cri, en craie. Il prenait la couleur de la famille (`--tc`), et celle
   de la voix est l'or du jeu (#F5C33B, `shared/fanzzy/dex.js`) : de l'or en
   onze pixels, qu'une recherche de couleurs écrites en dur ne voit pas, et
   qui ne tient pas au soleil — l'or ne s'écrit plus qu'en grand (arbitrage
   du 2 octobre 2026). Le violet du tifo, en onze pixels sur le panneau,
   n'atteignait pas 4,5:1 même à l'ombre. La famille se dit déjà par la
   pastille du rang (`.pip`) et celle du personnage (`.type`), qui gardent
   sa couleur sans porter de lettres : le cri n'a pas besoin de graisse pour
   la dire, et gras il pèserait plus que le nom au-dessus de lui — les plus
   longs (« C'EST « JAMAIS », PAS « TOUJOURS » ») passeraient aussi plus
   souvent à la ligne. */
.rang .id .cri{font-size:11px;letter-spacing:.1em;color:var(--craie);margin-top:5px;
  font-family:var(--banner)}
/* TITULAIRE est un sticker vert (`.tbf-sticker`, ui.css) : la direction le
   veut ainsi (amendement 3), et le petit texte en or — onze pixels cernés
   d'or — ne tenait pas au soleil. Il ne reste ici que l'air que sa boîte ne
   compte pas : le bord et l'ombre du sticker débordent de six pixels à
   droite, et le chevron les toucherait. */
.rang .marque{margin-right:4px}
.rang .chevron{position:relative;opacity:.3;font-size:18px;flex:none}

.rang .pieces{display:flex;gap:7px;padding:0 12px 12px}
/* **Les deux emplacements sont des creux**, comme ceux du rail : on y pose
   quelque chose. Ils étaient violets — la couleur des gens dans le jeu, et
   celle de l'épique —, sans rien qui le justifie ici. Plein, l'emplacement
   garde le creux et montre la pièce sur son sticker de craie, comme à la
   boutique (voir `.piece .tbf-piece`) ; vide, il est en pointillé. */
.piece{flex:1;border:0;border-radius:9px;padding:9px 9px;min-height:64px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer;text-align:center;
  background:rgba(4,7,11,.62);color:inherit;font-family:inherit;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 1px rgba(242,238,228,.08);
  transition:transform .1s}
.piece:active{transform:translateY(2px)}
.piece:not(.plein){box-shadow:none;outline:1.5px dashed rgba(242,238,228,.28);outline-offset:-1.5px}
/* L'emplacement passe en ligne : l'objet à gauche, le texte à droite. En
   colonne, la pastille poussait le nom et l'effet hors du bouton. */
.piece{flex-direction:row;align-items:center;text-align:left;gap:9px}
.piece .tbf-piece{width:42px;height:42px;border-radius:6px}
/* **La pièce sur son sticker de craie**, la forme FAIT MAIN de l'objet
   (`.tbf-objet`, ui.css) que la boutique et le sac montrent déjà : la craie
   éclaircie, la lueur de la rareté au centre, le bord craie et le cerne
   d'encre. La pastille sombre cerclée d'or n'existait que sur cet écran et
   dans les arènes ; ui.css le note, « le lot qui reprendra le deck les
   fondra en une ». On garde la classe (les arènes la lisent) et l'on peint
   la face ici, dans les deux endroits du deck qui la montrent. */
:is(.piece,.choix) .tbf-piece{
  background:linear-gradient(rgba(242,238,228,.45),rgba(242,238,228,.45)),
    radial-gradient(closest-side,var(--rc,#C2CAD6),transparent),var(--craie);
  box-shadow:0 0 0 2px var(--craie),0 0 0 3.5px var(--encre),2px 3px 0 3.5px rgba(7,9,12,.6)}
:is(.piece,.choix) .tbf-piece .illu{filter:drop-shadow(1px 2px 0 rgba(7,9,12,.55))}
.piece .txt{min-width:0}
.piece b{font-family:var(--banner);font-size:12.5px;letter-spacing:.03em;display:block}
/* `.txt span` et non `span` : la règle prenait aussi la boîte du texte et la
   pastille de l'objet, qui sont des `span` elles aussi — la phrase tombait à
   la moitié de la moitié, et le dessin de la pièce à 50 %. */
.piece .txt span{font-size:11px;opacity:.88;line-height:1.35;display:block}
/* L'emplacement vide garde le même gabarit que l'emplacement plein : sans ce
   creux, les deux boutons d'un même Fanzzy n'avaient pas la même hauteur. */
.piece .creux{width:42px;height:42px;flex:none;border-radius:6px;font-size:20px;
  display:flex;align-items:center;justify-content:center;font-family:var(--banner);
  color:rgba(242,238,228,.6);box-shadow:inset 0 0 0 1.5px rgba(242,238,228,.22)}
.rang .effet{padding:0 13px 12px;font-size:11px;opacity:.88;line-height:1.65}
/* « Effet » se détache par la graisse : en onze pixels, l'or ne tenait pas
   au soleil (arbitrage du 2 octobre 2026). */
.rang .effet em{font-style:normal;font-weight:700;color:var(--craie)}
.rang .actions{display:flex;justify-content:flex-end;gap:8px;padding:0 12px 14px}
/* TITULARISER et RETIRER sont des plaques (`.tbf-plaque`) : la même matière
   et le même enfoncement que tous les boutons du jeu. Il ne reste ici que leur
   mise en page — deux plaques qui se partagent la largeur du rang, plus
   basses qu'une action d'écran. RETIRER est au rouge, comme aux amis. */
/* **À droite, à leur taille**, et non plus à pleine largeur : RETIRER
   barrait chaque rang d'une bande rouge de toute la colonne, la chose la plus
   visible de l'écran pour l'action qu'on fait le moins. Une plaque rouge à sa
   taille dit la même chose sans crier. */
.mini{flex:none;padding:9px 16px;min-height:44px;font-size:12px;letter-spacing:.1em}

/* --------------------------------------------------------------- cartes */

/* ------------------------------------------------------- les dix cartes

   C'étaient dix cases avec un chiffre et un nom en sept pixels et demi. La
   main du joueur — ce qu'il regarde le plus longtemps sur cet écran — était
   la partie la moins lisible de la page.

   Ce sont maintenant des cartes : le coût dans sa goutte en haut, la famille
   en cadre et en couleur, le nom sur un bandeau en bas, et le glyphe de la
   famille en grand derrière. Le coût est ce qu'on compare d'un coup d'œil
   quand on monte une main — il passe donc devant tout le reste. */
/* **La carte grandit plutôt que de se recouvrir.** Sur un téléphone de
   320 px, une carte fait quarante-sept pixels de large, donc soixante-cinq de
   haut au format d'une carte à jouer — et il lui en faut près de quatre-vingts
   pour empiler la goutte, la mention DUEL et un nom sur deux lignes. Ils se
   recouvraient : la mention cachait les chiffres du coût.

   Le format devient donc un **minimum** et non plus une hauteur. La carte est
   une grille d'une case où se superposent deux choses : une cale vide, haute
   de sa largeur divisée par 0,72 (un rembourrage en pourcentage se mesure sur
   la largeur), et la pile de ce qu'elle affiche (`.pile`). La case prend la
   plus haute des deux. `aspect-ratio` ne savait pas le dire : une carte qui
   déborde garde sa hauteur de format, et le surplus passait par-dessus la
   goutte. Pas d'unité de conteneur non plus : là où le confinement ne prend
   pas, elle se rabat sur la fenêtre (voir scripts/verif-pages.mjs).

   `1fr` sur les rangées garde les dix cartes à la même taille : une rangée de
   cartes DUEL plus haute que sa voisine se lirait comme deux sortes de
   cartes. Dès que la carte a la place — vers 370 px —, la cale l'emporte et
   rien ne change. */
.grille{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;
  gap:12px 7px;padding:0 14px 4px}
.emp{display:grid;grid-template-columns:minmax(0,1fr);border-radius:9px;
  padding:0;cursor:pointer;position:relative;
  overflow:hidden;background:#0B1017;border:0;
  box-shadow:inset 0 0 0 2px rgba(242,238,228,.13),0 4px 0 rgba(242,238,228,.06),
             0 6px 10px rgba(0,0,0,.5);
  transition:transform .1s,box-shadow .1s}
.emp::before{content:"";grid-area:1/1;padding-top:calc(100% / .72)}
.emp .pile{grid-area:1/1;position:relative;z-index:2;min-width:0;
  display:flex;flex-direction:column;align-items:center}
.emp:active{transform:translateY(4px);box-shadow:inset 0 0 0 2px rgba(242,238,228,.13)}
.emp.plein{background:linear-gradient(180deg,#161D27,#080C11);
  box-shadow:inset 0 0 0 2px var(--fc,#8257DA),0 4px 0 var(--fc2,#3E2870),
             0 6px 10px rgba(0,0,0,.55)}
.emp.plein:active{box-shadow:inset 0 0 0 2px var(--fc,#8257DA)}
/* Le glyphe de famille, en grand et en fond : il donne une matière à la carte
   et se reconnaît avant qu'on ait lu le nom. */
.emp .sceau{position:absolute;left:50%;top:44%;width:78%;height:auto;
  transform:translate(-50%,-50%);opacity:.22;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* La goutte de souffle. Le coût se lit avant le nom : c'est lui qu'on compare
   quand on monte une main.

   **Dans la colonne, et non plus posée par-dessus.** En position absolue, elle
   ne comptait pour rien dans la hauteur de la carte, et ce qui montait du bas
   — la mention DUEL, le nom — passait dessus sans que rien ne l'empêche. Sa
   marge basse `auto` la tient en haut et pousse le reste en bas. */
.emp .cout{position:relative;flex:none;margin:6px 0 auto;z-index:2;
  min-width:23px;padding:2px 5px 3px;border-radius:11px 11px 10px 10px;
  background:linear-gradient(180deg,#F4F1E8,#B9B4A6);color:#12161C;
  font-family:var(--banner);font-size:13px;line-height:1.1;text-align:center;
  box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
/* Le nom, en onze pixels et sur deux lignes au plus. Il était en huit et
   demi sur une seule, coupé d'une ellipse : c'est la main du joueur, ce qu'il
   regarde le plus longtemps sur cet écran, et il la devinait.

   **Un mot trop long se coupe à la française**, et non au milieu d'une
   syllabe. `overflow-wrap` seul coupait où la place manquait — « Brouillar /
   d », « Fumigèn / e » — et la dernière lettre tombait seule à la ligne.
   `hyphens: auto` coupe selon la langue du document (`lang="fr"`), avec son
   trait d'union : « Brouil- / lard ». `overflow-wrap` reste en dernier
   recours, pour un navigateur sans dictionnaire, plutôt qu'un mot qui sort
   de la carte. L'espacement tombe à zéro et le retrait à deux pixels : c'est
   ce qui fait tenir « Fumigène » et « Craquage » entiers sur une carte de
   quarante-sept pixels.

   Le retrait du bas est une **bordure transparente**, pas un rembourrage :
   `overflow: hidden` rogne au bord du rembourrage, et le haut de la troisième
   ligne — celle que `line-clamp` écarte — se montrait dans ces cinq pixels.
   Le dégradé part de la bordure (`background-origin`) pour la couvrir aussi. */
.emp .nm{position:relative;z-index:2;flex:none;width:100%;padding:4px 2px 0;
  border-bottom:5px solid transparent;
  font-family:var(--banner);font-size:11px;line-height:1.1;text-align:center;
  letter-spacing:0;background:linear-gradient(180deg,transparent,rgba(4,6,10,.95) 30%)
    border-box;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.emp .plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:22px;opacity:.3;font-family:var(--banner)}
/* Le dessin recouvre le glyphe. Cadré un peu haut : ces illustrations ont leur
   sujet dans le tiers supérieur, et le bas de la carte est mangé par le nom.
   Assombri, parce que le coût est de la craie claire sur une goutte claire et
   qu'un ciel de projecteurs le ferait disparaître. */
.emp .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%;filter:brightness(.84)}

/* **La mention « duel seulement ».**

   Treize cartes sur trente-neuf ne se jouent pas au Grand Virage : celles
   qui vont chercher quelqu'un en face, plus l'Arbitre et la Relève, qui
   n'ont pas d'objet là où l'on ne met qu'un personnage en tribune. Le
   serveur les écartait de la main en silence, et le joueur pouvait garnir
   ses dix emplacements sans qu'aucune n'entre au Virage.

   Rouge et non grise : ce n'est pas une carte affaiblie, c'est une carte
   qui se joue ailleurs. Une mention grise se lit comme « indisponible »,
   et neuf joueurs sur dix la comprendraient comme un défaut. */
/* Onze pixels, comme tout ce qui renseigne : en sept, la mention se voyait
   comme une tache rouge et ne se lisait pas. */
.duelseul{font-family:var(--banner);font-size:11px;letter-spacing:.08em;
  color:var(--flare);border:1px solid currentColor;border-radius:4px;
  padding:2px 4px;line-height:1;white-space:nowrap}
/* Sur la carte posée, la mention se range **au-dessus du nom**, dans la
   colonne, et non plus dans le coin haut, où elle recouvrait la goutte du
   coût — qui est ce qu'on compare d'un coup d'œil. Dans la colonne, elle ne
   peut plus la toucher : la goutte y est aussi, et la carte grandit s'il
   manque de la place (voir `.grille`). */
.emp .duelseul{position:relative;z-index:3;flex:none;margin:3px 0 2px;
  background:rgba(4,7,11,.9);letter-spacing:.06em;padding:2px 3px}
.carte .txt b .duelseul{margin-left:6px;display:inline-block;vertical-align:1px}

/* Le compte des deux terrains, sous les dix emplacements. Il répond à la
   seule question que l'écran ne savait pas poser : « et au Virage, il me
   reste quoi ? » */
/* Sur un panneau, et non plus sur un voile à 4 % : c'était du texte posé à
   même la photo de tribune. */
.ouJoue{margin:4px 14px 10px;padding:9px 11px;font-size:12px;line-height:1.45}
.ouJoue b{font-family:var(--banner);font-size:14px;color:var(--craie);
  font-variant-numeric:tabular-nums}
.ouJoue .maigre{display:block;margin-top:5px;color:var(--flare)}
/* Les filtres sont des plaques (`.tbf-plaque`) : béton au repos, bleu — le ton
   du deck — pour celui qui est choisi. Leur peinture locale est partie ; il
   reste leur taille, plus petite qu'une action. */
.filtres{display:flex;gap:6px;padding:0 14px 4px}
.filtre{padding:8px 13px;min-height:44px;font-size:12px;letter-spacing:.08em}

/* Le jalon : quand le prochain emplacement s'ouvre. C'est une promesse et pas
   un refus.

   **Un sticker craie cerné d'or** (arbitrage du 2 octobre 2026). Il était
   écrit en or sur un voile d'or — douze pixels et demi, sous 4,5:1 au plein
   jour —, et l'or ne s'écrit plus qu'en grand. Le sticker garde l'or là où
   il ne porte pas de lettres : son bord, à la place du bord de craie. Le mot
   est à l'encre sur la craie, 17:1. C'est la brique du jalon
   (`.tbf-sticker--jalon`, ui.css), celle du pot du KOP : une promesse se
   reconnaît d'un écran à l'autre. Ce dessin s'écrivait ici, pour ce seul
   écran, avant que la brique ne le reprenne au pixel ; la page ne garde plus
   que la place et la pente.

   « 2 emplacements », qui le précédait, est parti : l'onglet juste au-dessus
   dit déjà « TRIBUNE 1/2 ». Le sticker tient en une ligne à 320 px.

   Posé à même la colonne, sans panneau : le sticker est opaque, il est sa
   propre surface. Le rembourrage est l'air que sa boîte ne compte pas — le
   bord, le cerne et l'ombre débordent de cinq pixels et demi. La pente
   descend à un degré et demi : à quatre, un sticker de deux cents pixels
   monte de quinze d'un bout à l'autre. */
.jalon{margin:0 14px 10px;padding:6px 6px 8px}
.jalon .tbf-sticker{--rot:-1.5deg}
/* La note de règle : discrète, mais toujours là. Elle répond à une question
   qui revient, et une réponse qu'il faut aller chercher n'est pas une
   réponse. Discrète par sa place, plus par sa transparence : à 60 % sur la
   photo, elle ne se lisait qu'à l'ombre. */
.note{margin:0 14px 10px;padding:9px 11px;font-size:12px;line-height:1.6}

/* L'intitulé de famille du catalogue. Il était écrit **dans la couleur de la
   famille, à même la photo de tribune** : sur les lumières floues du stade, le
   violet d'ENTRAVE disparaissait, et même sur le noir du voile il n'atteint
   pas 4,5:1 en onze pixels. Le nom passe donc en craie, sur son panneau, et la
   couleur reste là où elle ne porte pas de lettres : le liseré à gauche — le
   même que celui des cartes juste en dessous — et le fil qui court jusqu'au
   bord. */
.fam{margin:14px 14px 7px;display:flex;align-items:center;gap:8px}
.fam .nom{flex:none;padding:5px 10px 5px 11px;border-radius:8px;
  background:var(--panneau);box-shadow:inset 3px 0 0 var(--fc,#8257DA);
  font-family:var(--banner);font-size:11px;letter-spacing:.18em;line-height:1.2;
  color:var(--craie)}
.fam .trait{flex:1;height:2px;border-radius:1px;background:var(--fc,#8257DA);opacity:.5}
.cat{margin:0 14px}
/* Une rangée du catalogue est une bâche (`.pan`), avec le liseré de sa
   famille à gauche : la même matière que les rangs de la tribune. */
.carte{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:7px;
  cursor:pointer;border-left:3px solid var(--fc,#8257DA)}
/* **Une carte qu'on n'a pas s'éteint par son dessin, pas par son texte.**
   Toute la rangée tombait à 40 % : on voyait qu'elle n'était pas à soi, et on
   ne pouvait plus lire ce qu'elle fait — c'est pourtant la question qu'on se
   pose en la regardant. La vignette passe en gris, le cadenas dit pourquoi
   dans la case du compte, et le texte reste entier. */
.carte.absente .vig{opacity:.45;filter:grayscale(1)}
/* La vignette du catalogue. Elle porte le glyphe de famille en fond et le
   dessin par-dessus : une carte sans fichier garde donc son repère. */
.carte .vig{position:relative;width:38px;height:52px;flex:none;border-radius:7px;
  overflow:hidden;background:#0A0E13;box-shadow:inset 0 0 0 1px var(--fc,#8257DA)}
.carte .vig svg{position:absolute;left:50%;top:50%;width:22px;height:22px;
  transform:translate(-50%,-50%);opacity:.5;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.carte .vig .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%}
.carte .txt{flex:1;min-width:0}
.carte .txt b{display:block;font-family:var(--banner);font-size:13.5px;letter-spacing:.03em}
.carte .txt p{margin:4px 0 0;font-size:11px;opacity:.88;line-height:1.5}
.carte .cout{font-family:var(--banner);font-size:15px;color:var(--fc,#8257DA);text-align:center;flex:none;
  min-width:34px}
.carte .cout small{display:block;font-size:11px;opacity:.88;letter-spacing:.03em;color:var(--craie);
  font-family:var(--ui);margin-top:2px}
.compte{flex:none;font-family:var(--banner);font-size:11px;border:1px solid rgba(242,238,228,.18);
  border-radius:6px;padding:5px 8px;min-width:34px;text-align:center;opacity:.88}
/* Une carte déjà dans le deck : le cadre et le chiffre passent à la craie
   pleine, et le chiffre en gras. Ils étaient en or, en onze pixels — l'or
   ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). */
.compte.on{opacity:1;border-color:var(--craie);color:var(--craie);font-weight:700}
/* Le cadenas d'une carte qu'on n'a pas (icône commune, voir ui.css). Il
   remplace un tiret : un tiret dit « rien », le cadenas dit « pas encore à
   toi », et c'est la seconde phrase qui est vraie. */
.compte .tbf-ico,.gcChiffres .tbf-ico{vertical-align:-.12em}
/* **La rareté d'une ligne : la forme, plus les pastilles ni ★/♛** (lot 4).
   Le rectangle de la commune, le rond de la rare, l'étoile de l'épique,
   l'éclat de la légendaire (`.tbf-forme`, ui.css) — les mêmes que sur la
   carte, au coin de laquelle ils ont pris la place des losanges. Les points
   ne se distinguaient pas à quatre pixels, et l'étoile et la couronne
   étaient deux caractères que la police du téléphone dessinait à sa façon,
   ou pas du tout (un carré vide).

   Seize pixels et sans son mot, comme dans l'étal de la boutique : à côté
   d'un nom, le mot doublerait la ligne, et une forme trop petite pour lui le
   garde pour le lecteur d'écran (`aria-label`). Une carte d'action qu'on
   ouvre l'écrit en entier (`.gcRar`). Il ne reste ici que sa place. */
.rarete{margin-left:6px}
.rang .id b .rarete{margin-left:0}

/* --------------------------------------------------------- barre du bas */

.barre{position:fixed;left:0;right:0;z-index:50;display:flex;justify-content:center;
  bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom));pointer-events:none}
.barre .in{width:100%;max-width:var(--colonne);display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(4,6,10,.4),rgba(4,6,10,.94) 45%);pointer-events:auto;
  border-top:1px solid rgba(242,238,228,.08)}
.barre .info{flex:1;min-width:0;font-size:11.5px;opacity:.88;line-height:1.45}
.barre .info b{color:var(--craie);font-weight:700}
.barre .info.pb{color:var(--flare);opacity:1}
/* Enregistrer le deck, l'action qui valide tout l'écran. Une plaque
   **bleue** : une plaque d'action prend le ton de ce qu'elle fait, et
   composer son deck, c'est posséder. Elle était dorée, or FAIT MAIN réserve
   l'or à trois sens — acheter, une récompense prête, le légendaire — et rien
   ne se paie sur cet écran : l'or y faisait lire un achat. AJOUTER AU DECK,
   au pied du panneau d'une carte, suit la même règle.

   Il ne reste ici que sa mise en page : `flex:none`, qui l'empêche de
   s'étirer dans la barre du bas, et sa taille.

   Fermée, elle s'éteint comme toute plaque hors service (ui.css) : elle perd
   sa couleur et garde son texte. Une seconde règle ici la passait en plus à
   45 % d'opacité, et ENREGISTRER ne se lisait plus du tout — on ne savait pas
   quel bouton attendait. */
.btn{flex:none;padding:13px 18px;font-size:13px;letter-spacing:.1em}

/* ------------------------------------------------------------- panneaux */

.voile{position:fixed;inset:0;background:rgba(3,5,8,.72);z-index:70;display:none;
  align-items:flex-end;justify-content:center}
.voile.on{display:flex}
/* Une **colonne** et non un bloc qui défile : l'en-tête reste en haut, le
   corps prend ce qui reste, et le bouton d'action reste sous les yeux. Avant,
   le panneau défilait en entier et l'on devait descendre pour trouver le prix
   et le bouton — sur l'écran même où l'on vient pour décider. */
/* **La matière du menu** (`.tbf-tiroir`, ui.css) : le parpaing grainé, le
   cadre tracé au marqueur, et la bande d'écharpe en tête que porte toute
   boîte du jeu (`.tbf-dial`). Le panneau était un aplat bleu nuit à coins
   ronds, en police de titre à quinze pixels : la feuille d'un système
   d'exploitation, posée sur un écran de jeu. */
.panneau{width:100%;max-width:var(--colonne);max-height:86dvh;
  display:flex;flex-direction:column;
  background:var(--grain-beton) 0 0/256px 256px repeat,var(--parpaing);
  border-image:var(--trace-c) 9 / 9px stretch;border-bottom:0;
  box-shadow:0 -10px 40px rgba(0,0,0,.6);
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.panneau::before{content:"";display:block;flex:none;height:4px;margin:12px 16px 0;border-radius:2px;
  background:repeating-linear-gradient(115deg,var(--projo) 0 9px,transparent 9px 18px)}
/* `min-height:0` : sans lui, un enfant de flex refuse de descendre sous la
   taille minimale de son contenu, et le corps repousserait le bouton hors de
   l'écran. C'est le même piège que `1fr` en grille, rencontré deux fois déjà
   dans ce dépôt — il vaut la peine de le reconnaître du premier coup d'œil. */
.panneau .pc{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.panneau .ph{flex:none;padding:12px 16px 10px;z-index:2;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--trait)}
.panneau .ph h3{flex:1;margin:0;font-family:var(--banner);font-size:19px;letter-spacing:.05em;
  line-height:1.18;text-transform:uppercase}
/* La croix : quarante-quatre pixels, la pulpe d'un doigt, comme toute cible
   du jeu. Elle en faisait trente sur vingt-deux. */
.panneau .ph button{background:none;border:0;color:inherit;opacity:.85;font-size:22px;cursor:pointer;
  line-height:1;padding:0;min-width:44px;min-height:44px;margin:-10px -8px -10px 0}
.panneau .pc{padding:12px 14px 4px}
/* Le pied du panneau : ce qui décide, tenu hors du corps qui défile.
   `flex:none` pour qu'il ne se comprime jamais, et un filet au-dessus pour
   qu'on voie qu'il reste du texte à faire défiler derrière lui. */
.panneau .pp{flex:none;padding:10px 14px 0;border-top:1px solid var(--trait)}
.choix{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.choix:active{transform:translateY(2px)}
.choix .tbf-piece{width:46px;height:46px;border-radius:7px;margin:4px}
/* Le Fanzzy qu'on choisit, **dessiné**, comme dans sa tribune et au
   classeur : on choisissait un rang sur une pastille de type et un nom,
   alors que l'écran juste derrière montre le personnage. */
.choix .face{width:46px;height:60px;flex:none;position:relative;display:flex;align-items:flex-end;justify-content:center}
.choix .face img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.choix.pris .face{opacity:.4;filter:grayscale(1)}
.choix .tag{white-space:nowrap}
/* Ce qui est déjà pris s'éteint par son dessin, et l'étiquette dit pourquoi
   — « DÉJÀ PRIS », « TOUS PORTÉS ». La ligne entière à 35 % rendait
   illisible justement la raison du refus. */
.choix.pris{cursor:default}
.choix.pris .pip,.choix.pris .tbf-piece{opacity:.4;filter:grayscale(1)}
.choix .txt{flex:1;min-width:0}
.choix .txt b{display:block;font-family:var(--banner);font-size:13.5px;letter-spacing:.03em}
.choix .txt p{margin:4px 0 0;font-size:11px;opacity:.88;line-height:1.5}
.choix .tag{font-size:11px;letter-spacing:.08em;opacity:.88;font-family:var(--banner);flex:none}

/* Les voiles de couleur sont posés **sur** le panneau : seuls, à 9 %, ils
   laissaient la photo de tribune derrière l'avertissement. */
.avert{margin:0 14px 10px;border:1px solid rgba(224,64,44,.4);border-radius:10px;padding:12px 14px;
  background:linear-gradient(rgba(224,64,44,.09),rgba(224,64,44,.09)),var(--panneau);
  font-size:12px;line-height:1.65}
.avert b{display:block;font-family:var(--banner);font-size:12.5px;letter-spacing:.06em;margin-bottom:5px;
  color:var(--flare)}
/* Les liens et le titre de l'avertissement doux s'écrivaient en or, en
   douze pixels : l'or ne s'écrit plus qu'en grand (arbitrage du 2 octobre
   2026). Le lien garde son soulignement et prend la graisse ; le titre est
   déjà en capitales grasses. Le voile et le cadre d'or de l'avertissement
   doux, qui ne portent pas de lettres, restent. */
.avert a{color:var(--craie);font-weight:700}
.avert ul{margin:6px 0 0;padding-left:17px}
.avert li{margin-top:3px}
.avert.doux{border-color:rgba(245,195,59,.35);
  background:linear-gradient(rgba(245,195,59,.07),rgba(245,195,59,.07)),var(--panneau)}
.avert.doux b{color:var(--craie)}

/* **`:not(.rang)`, parce que deux choses s'appellent « vide » ici.** Le
   message d'un panneau sans rien à proposer, et le rang de tribune encore
   libre (`.rang.vide`). Cette règle-ci les prenait tous les deux : le rang
   libre héritait de trente-quatre pixels de marge intérieure et de la moitié
   de son opacité, et « Emplacement libre » tombait à 28 % — deux atténuations
   écrites séparément, qui se multipliaient sans que personne l'ait décidé. */
.vide:not(.rang){padding:34px 24px;text-align:center;opacity:.88;font-size:12.5px;line-height:1.8}
.vide a{color:var(--craie);font-weight:700}
/* Le message qui remplace tout l'écran (un deck qui ne charge pas) est posé
   sur la photo : il lui faut son panneau. */
#corps > .vide{margin:14px;border-radius:12px;background:var(--panneau)}
.spin{width:22px;height:22px;border:2px solid rgba(242,238,228,.2);border-top-color:var(--projo);
  border-radius:50%;margin:60px auto;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h,62px) + 84px);transform:translateX(-50%);
  background:#171C23;z-index:80;border:1px solid rgba(242,238,228,.2);border-radius:7px;
  padding:11px 16px;font-size:12.5px;display:none;max-width:88vw;text-align:center}
.toast.on{display:block}

/* La barre des trois écrans de cartes. Elle est identique à celle de la page
   des Fanzzy : c est la même section, et deux barres différentes feraient
   croire à deux endroits. */

/* ------------------------------------------------- la carte en grand

   Ce qu'on ne voyait pas dans une rangée de trente-huit pixels : le dessin,
   la recharge, la rareté écrite, et ce que la carte demande pour être jouable.

   Le dessin passe en premier et prend toute la largeur. C'est le point de
   l'écran : on vient ici pour regarder la carte, le reste est légende. */
.grandeCarte{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1 1 auto}

/* Le dessin prend **ce qui reste**, au lieu d'imposer la proportion d'une
   carte. À 63/80 il faisait près de six cents pixels de haut : le texte, les
   chiffres et le bouton partaient sous le bord de l'écran.

   Il garde une hauteur minimale — en dessous, on ne voit plus ce qu'on est venu
   voir — et l'image est en `contain`, donc elle ne se déforme jamais quelle que
   soit la place qu'on lui laisse. */
/* La proportion d'une carte, **plafonnée**. C'est bien elle qu'on vient
   regarder — mais à 63/80 pleine largeur, le dessin faisait près de six cents
   pixels de haut et poussait le texte, les chiffres et le bouton sous le bord.

   Le plafond en `dvh` le fait respirer sur un grand écran et se replier sur un
   petit, sans qu'aucune valeur soit à reprendre. Une hauteur minimale garantit
   qu'on voit toujours quelque chose ; `contain` garantit qu'il ne se déforme
   jamais, quelle que soit la place qu'on lui laisse. */
/* **La carte, à la taille d'une carte.** Sa largeur se déduit du plafond de
   hauteur, au lieu de prendre toute la colonne : à pleine largeur, le dessin
   en `contain` laissait deux bandes vides de chaque côté, et sur un écran
   large la carte flottait au milieu d'un grand cadre vide. Elle a le bord de
   craie et le cerne d'encre des stickers du jeu, et penche d'un degré, comme
   une carte posée sur la table. */
.gcArt{position:relative;flex:none;align-self:center;
  width:min(100%,calc(46dvh * 63 / 80),340px);min-width:150px;aspect-ratio:63/80;max-height:46dvh;
  border-radius:9px;overflow:hidden;rotate:-1deg;margin:6px 0 4px;
  background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(0,0,0,.45)),#0B1017;
  box-shadow:inset 0 0 0 3px var(--fc,#8257DA),0 0 0 2px var(--craie),0 0 0 4px var(--encre),
    3px 5px 0 4px rgba(7,9,12,.6)}
/* Le glyphe de famille, dessous : il reste si l'illustration ne charge pas —
   `action-art.js` retire alors son image, et la carte garde un visage. */
.gcArt>svg{position:absolute;left:50%;top:50%;width:38%;height:38%;
  transform:translate(-50%,-50%);fill:none;stroke:var(--fc,#8257DA);stroke-width:1.4;
  opacity:.5}
.gcArt .gcIllu{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);
  object-fit:contain;object-position:50% 42%;border-radius:6px}

.gcRang{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase}
.gcFam{color:var(--fc,#8257DA);font-weight:700}
/* **La rareté de la carte ouverte : la forme et son mot** (`.tbf-forme`,
   ui.css), à la place de la pastille de couleur — la carte du jeu la porte
   ainsi à son coin depuis le lot 4, et une rareté se dit d'une seule façon :
   sa couleur, sa forme et son mot. Le mot est écrit en minuscules dans le
   balisage (« Épique ») et la forme le met en capitales.

   Rangée à droite, en variante de coin : l'étiquette de l'étoile et de
   l'éclat court vers l'intérieur au lieu de sortir du panneau, et elle pend
   sous la forme de neuf pixels (plus son ombre) — la ligne lui garde cet air
   avant le texte de la carte. */
.gcRar{margin-left:auto}
.gcRang:has(>.gcRar:is([data-rar=epique],[data-rar=legendaire])){margin-bottom:8px}

<!-- Les dessins de l’équipement, détourés : l’emplacement d’une pièce n’était
