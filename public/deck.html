<script>
/* =======================================================================
   Construction du deck.

   Trois Fanzzy, deux pièces d'équipement au plus pour chacun, dix cartes
   d'action. Le premier Fanzzy entre au coup d'envoi : c'est le seul rang
   qui compte vraiment, les deux autres n'arrivent que par « Arbitre —
   changement ». L'écran le dit au lieu de le laisser deviner.

   **Le serveur reste seul juge.** Les contrôles faits ici n'existent que
   pour éviter d'envoyer un deck manifestement incomplet et pour griser le
   bouton ; c'est PUT /api/deck/mien qui valide réellement, et ce sont ses
   codes d'erreur qui sont affichés, traduits, jamais résumés en
   « impossible ». Un message vague coûte toujours plus cher qu'il
   n'économise.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/* Les sept familles de cartes : couleur, socle, glyphe. Elles vivent dans
   `action-art.js` avec les dessins, parce que le duel a besoin exactement de
   la même table — il en gardait une version réduite de son côté, et une
   huitième famille n'aurait été ajoutée qu'ici. */
const FAM = window.TBF_ACTION.FAM;

const RANG = { commune:1, rare:2, epique:3, legendaire:4 };

/* **Une carte qu'on n'a pas se dit par un cadenas, pas par un tiret.** La
   case du compte et le chiffre « dans ton deck » écrivaient « — » : un tiret
   dit qu'il n'y a rien à dire, alors qu'il y a quelque chose — la carte n'est
   pas encore à toi. L'icône est celle de ui.css (au trait, à la couleur du
   texte), et elle garde son texte pour qui ne la voit pas. */
const CADENAS = '<i class="tbf-ico tbf-ico-cadenas" role="img" aria-label="pas encore à toi"></i>';

const CHIFFRES = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq'];
const ORDINAUX = ['', 'premier', 'deuxième', 'troisième', 'quatrième', 'cinquième'];

/**
 * Le message d'un refus, avec les nombres que le serveur y a joints.
 *
 * `validerDeck` accompagne `fanzzy_count` du `min` et du `max` qu'il vient
 * d'appliquer — un plafond qui dépend du niveau. La page les ignorait et
 * affichait un texte figé : « Il faut entre un et trois Fanzzy » à quelqu'un
 * qui n'avait droit qu'à deux. Le refus répétait donc au joueur qu'il était
 * dans son droit, ce qui est la pire forme de message d'erreur.
 */
function precise(p) {
  const base = MESSAGES[p.code] ?? p.code;
  if (p.code !== 'deck.error.fanzzy_count' || p.max == null) return base;
  const mot = (n) => CHIFFRES[n] ?? String(n);
  return p.max <= (p.min ?? 1)
    ? `Il faut ${mot(p.max)} Fanzzy — c'est ce que ton niveau permet.`
    : `Il faut entre ${mot(p.min ?? 1)} et ${mot(p.max)} Fanzzy `
      + '— au-delà, c’est ton niveau qui décide.';
}

/**
 * Traduction des codes du serveur. Chaque code nomme sa cause : le joueur
 * doit savoir quoi corriger sans relire les règles.
 */
const MESSAGES = {
  // Le libellé ne dit plus « trois » : la limite dépend du niveau, et
  // `precise()` la remplace par celle que le serveur a réellement appliquée.
  // Écrite en dur, elle annonçait trois emplacements à qui n'en avait que deux
  // — le joueur en posait trois, se faisait refuser, et le refus lui répétait
  // que trois étaient permis.
  'deck.error.fanzzy_count':      'Il faut entre un et trois Fanzzy.',
  'deck.error.fanzzy_duplicate':  'Le même Fanzzy apparaît deux fois.',
  'deck.error.fanzzy_not_owned':  'Tu ne possèdes pas ce Fanzzy.',
  'deck.error.too_much_stuff':    'Au plus deux pièces d\u2019équipement par Fanzzy.',
  'deck.error.stuff_not_owned':   'Tu ne possèdes pas cette pièce d\u2019équipement.',
  'deck.error.stuff_shared':      'Tu n’as pas assez d’exemplaires de cette pièce.',
  'deck.error.actions_count':     'Il faut exactement dix cartes d\u2019action.',
  'deck.error.action_unknown':    'Cette carte n\u2019existe pas.',
  'deck.error.action_not_owned':  'Tu ne possèdes pas cette carte.',
  'deck.error.too_many_copies':   'Trop d’exemplaires d’une même carte.',
  'deck.error.legende_une_seule': 'Un seul légendaire par deck, Fanzzy ou pièce d\u2019équipement.',
  'deck.error.legende_titulaire': 'Un Fanzzy légendaire ne peut pas être titulaire : il entre en cours de partie.',
  'deck.error.invalid':           'Le deck a été refusé :',
  'deck.error.none':              'Aucun deck enregistré pour l\u2019instant.',
  'deck.error.server':            'Le serveur n\u2019a pas pu enregistrer le deck.',
  'deck.warn.no_substitution':    'Sans « Arbitre — changement », tu resteras sur ton premier Fanzzy '
                                + 'toute la partie : les deux autres n\u2019entreront jamais.',
  'deck.warn.no_evolution_card':  'Tes Fanzzy entrent toujours à leur premier âge. Sans '
                                + '« Relève », ce que tu as payé pour les faire grandir '
                                + 'ne servira pas en duel.',
  'deck.warn.useless_evolution_card': '« Relève » ne sert à rien tant qu’aucun de tes '
                                + 'Fanzzy n’a d’âge débloqué. Elle occupe un emplacement pour rien.',
  /* Le serveur n'envoie jamais ce code : c'est la page qui le lève quand la
     réponse n'est pas du JSON. Il a sa phrase ici pour la même raison que les
     autres — « Serveur injoignable » est vrai mais n'aide personne, alors que
     « réessaie dans un instant » dit quoi faire. */
  'deck.error.illisible': 'Le serveur n’a pas répondu correctement. Réessaie dans un instant.',
};

const api = async (path, { method = 'GET', body } = {}) => {
  const r = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    credentials: 'same-origin',
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  /* **Le corps du refus compte**, et c'est pourquoi on le lit quel que soit le
     code : le serveur répond `{ error: … }` sur un deck invalide, et ce sont ces
     phrases-là que `MESSAGES` traduit.

     Mais une réponse qui n'est **pas du JSON** — une page d'erreur de
     l'hébergeur, un proxy qui répond à la place du serveur — donnait un objet
     vide. `charger` enchaînait alors sur `mien.possede.stades` et levait une
     `TypeError` : le joueur lisait bien « Impossible de charger ton deck », mais
     par accident, et la console ne disait rien de la vraie cause. On échoue
     donc en le nommant. */
  const j = await r.json().catch(() => null);
  if (!j) {
    console.warn(`[deck] ${path} : ${r.status}, et ce n’est pas du JSON`);
    throw Object.assign(new Error('reponse illisible'), { code: 'deck.error.illisible' });
  }
  if (j.error) throw Object.assign(new Error(j.error), { code: j.error, detail: j.detail });
  return j;
};

let toastT = null;
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 3400);
}

/* ------------------------------------------------------------------ état */

const S = {
  deck: { nom: 'Mon deck', fanzzy: [], actions: [] },
  possede: { fanzzy: [], stuff: [], stuffCopies: {}, actions: [] },
  regles: { fanzzy: 3, fanzzyMin: 1, stuffParFanzzy: 2, actions: 10, copiesMax: null },
  dex: new Map(), types: {}, catalogue: [], stuff: new Map(),
  onglet: 'tribune', filtre: 'miennes', sale: false,
};

const aFanzzy = (id) => S.dex.get(id);
const aStuff = (id) => S.stuff.get(id);
const aCarte = (id) => S.catalogue.find((a) => a.id === id);

/** Les pièces déjà portées, tous rangs confondus : une pièce est un objet. */
const piecesPortees = (saufIndex = -1) => new Set(
  S.deck.fanzzy.flatMap((f, i) => (i === saufIndex ? [] : (f.stuff ?? []))));

/**
 * Combine les modificateurs pour l'affichage seulement.
 * Le serveur refait ce calcul avant chaque duel : ce qui est montré ici est
 * une aide à la décision, pas une source de vérité.
 */
function combiner(base = {}, pieces = []) {
  const out = { ...base };
  const facteurs = ['tempoWindow','mashBonus','holdBonus','perfectBonus','parryBonus',
    'parryResist','breathBonus','refundBonus','costPenalty'];
  const decalages = ['tempoInterval','mashTime','holdForgive'];
  for (const id of pieces.slice(0, S.regles.stuffParFanzzy)) {
    const s = aStuff(id);
    if (!s) continue;
    for (const [k, v] of Object.entries(s.mods ?? {})) {
      if (facteurs.includes(k)) out[k] = (out[k] ?? 1) * v;
      else if (decalages.includes(k)) out[k] = (out[k] ?? 0) + v;
      else out[k] = v;
    }
  }
  return out;
}

/**
 * Les effets, en français.
 *
 * **Cette fonction était une seconde table**, sous un commentaire qui disait
 * « vocabulaire commun avec la fiche Fanzzy : les mêmes mots partout ». Ce
 * n'était pas vrai : le même effet s'écrivait ici « Tempo +20 % » et là-bas
 * « Tempo plus tolérant (×1.2) », ici « Coût des cartes » et là-bas « Chants
 * plus chers ». Deux écrans, deux descriptions du même effet.
 *
 * Celle d'ici était la bonne des deux — elle portait le signe et elle regardait
 * le sens des décalages. C'est donc elle qui a servi de base à la table unique,
 * partie dans `/mods.js` avec les seize clés du jeu, y compris les trois que ni
 * l'une ni l'autre ne nommait : `pushMult`, `ferveurBonus` et `scarvesBonus`,
 * portées par les stades et les KOP. Cet écran ne les reçoit pas, les deux
 * écrans de jeu si.
 */
const modsTexte = (m) => window.TBF_MODS?.lignes(m) ?? [];

/**
 * La rareté d'une ligne : **la forme de rareté** (`.tbf-forme`, ui.css),
 * seize pixels, son mot gardé pour le lecteur d'écran — voir `.rarete` dans
 * la feuille de cette page.
 *
 * Elle remplace les pastilles, l'étoile ★ et la couronne ♛ (lot 4), qui
 * avaient déjà trompé une fois : une seconde ligne testait `legendaire` à la
 * place d'`epique`, et l'épique retombait sur trois pastilles sans que rien
 * ne le signale. Le même balisage pour les quatre raretés, que la feuille
 * commune dessine : il n'y a plus de branche à rater.
 *
 * Le balisage est écrit ici et non pris à `formeHTML` (cartes.js) : cette
 * page ne charge pas cartes.js, et le charger pour quatre lignes ferait une
 * requête de plus. Une rareté absente ou inconnue n'écrit rien — une ligne
 * sans donnée disparaît.
 */
function rangHTML(rar) {
  const mot = motRarete(rar);
  return mot ? `<span class="tbf-forme rarete" data-rar="${rar}" style="--taille:16px" role="img"
    aria-label="${mot}"><i></i></span>` : '';
}

/** Le mot d'une des quatre raretés, ou `null` : la clé vient du serveur, et
    `RARETE[cle]` seul répondrait aussi pour « constructor ». Pas
    `Object.hasOwn`, qui manque aux Safari d'iOS 15.0 à 15.3 (voir son.js). */
const motRarete = (rar) => (Object.prototype.hasOwnProperty.call(RARETE, rar ?? '') ? RARETE[rar] : null);

/* --------------------------------------------------------- chargement */

async function charger() {
  /* **Le manifeste des etats d'abord.** Il porte les dessins des ages
     superieurs — voir `adresse` dans fanzzy-art.js. Sans lui, le premier rendu
     prend le repli, c'est-a-dire le visage du premier age, et rien ne vient le
     corriger ensuite. Il ne leve jamais : absent, la page s'affiche exactement
     comme avant. */
  await Promise.resolve(window.TBF_ETATS?.charger?.()).catch(() => null);
  // Trois catalogues immuables et l'état du joueur. Les catalogues portent
  // un cache d'une heure côté serveur : les redemander ne coûte rien.
  const [mien, cat, dex, stuff] = await Promise.all([
    api('/api/deck/mien'),
    api('/api/deck/catalogue'),
    api('/api/fanzzy/dex'),
    api('/api/fanzzy/stuff'),
  ]);

  S.possede = mien.possede;
  S.stades = mien.possede.stades ?? {};
  S.regles = mien.regles ?? cat.regles ?? S.regles;
  S.catalogue = cat.actions ?? [];
  S.dex = new Map((dex.dex ?? []).map((f) => [f.id, f]));
  S.types = dex.types ?? {};
  S.stuff = new Map((stuff.stuff ?? []).map((s) => [s.id, s]));

  if (mien.deck) {
    S.deck = {
      nom: mien.deck.nom ?? 'Mon deck',
      // On ne garde que ce que le joueur possède encore : un Fanzzy évolué
      // change d'identifiant, et un deck qui pointe dans le vide est pire
      // qu'un deck incomplet.
      fanzzy: (mien.deck.fanzzy ?? []).filter((f) => S.possede.fanzzy.includes(f.id))
        .map((f) => ({ id: f.id, stuff: (f.stuff ?? []).filter((s) => S.possede.stuff.includes(s)) })),
      actions: (mien.deck.actions ?? []).filter((a) => S.possede.actions.includes(a)),
    };
  }
  rendre();
}

/**
 * Le nombre d'emplacements de tribune **de ce joueur-ci**.
 *
 * Deux au départ, trois à partir du cinquième niveau. Le serveur envoie ce
 * plafond dans `possede.fanzzyMax` précisément pour que la page affiche
 * autant de rangs, ni plus ni moins — et la page ne le lisait pas : elle
 * ouvrait les trois rangs de la règle absolue. Le joueur en remplissait
 * trois, appuyait sur enregistrer, et le serveur refusait un deck que
 * l'écran venait de lui laisser composer.
 *
 * Une seule fonction pour les six endroits qui comptaient ces places : c'est
 * la divergence entre elles qui a produit la panne.
 */
/* Les chants réussis qui éveillent un légendaire (`shared/legende.js`). */
const legendeChants = () => {
  const n = Number(S.regles?.legende);
  return Number.isFinite(n) ? n : 5;
};

const placesFanzzy = () =>
  Math.min(S.regles.fanzzy, S.possede?.fanzzyMax ?? S.regles.fanzzy);

/* ------------------------------------------------------------- contrôles */

/**
 * Les mêmes règles que le serveur, mais dans le seul but d'expliquer ce qui
 * manque. La liste est ordonnée : on cite d'abord ce qui bloque.
 */
function problemes() {
  const pb = [];
  const n = S.deck.fanzzy.length;
  if (n < placesFanzzy()) pb.push(`${placesFanzzy() - n} Fanzzy à choisir`);
  const c = S.deck.actions.length;
  if (c < S.regles.actions) pb.push(`${S.regles.actions - c} carte${S.regles.actions - c > 1 ? 's' : ''} à ajouter`);
  if (c > S.regles.actions) pb.push(`${c - S.regles.actions} carte de trop`);
  return pb;
}

const complet = () => problemes().length === 0;

/* ------------------------------------------------------------- rendu */

function rendre() {
  const assezDeFanzzy = S.possede.fanzzy.length >= placesFanzzy();
  const pb = problemes();

  $('etat').textContent = complet() ? 'PRÊT' : 'INCOMPLET';
  $('etat').classList.toggle('ok', complet());
  $('etat').dataset.ton = complet() ? 'vert' : 'flare';
  $('etat').hidden = false;

  const corps = [];

  /* **Plus de champ « NOM ».** Un joueur n'a qu'un deck : un nom ne le
     distingue de rien, et le cadre prenait une ligne entière au-dessus de
     ce qu'on vient composer. Le nom existant reste en base et part tel quel
     à l'enregistrement — « Mon deck » pour presque tout le monde. */

  corps.push(`<div class="tabs tbf-onglets" data-ton="bleu">
    <button class="tab tbf-onglet ${S.onglet === 'tribune' ? 'on' : ''}" data-onglet="tribune">TRIBUNE
      <b>${S.deck.fanzzy.length}/${placesFanzzy()}</b></button>
    <button class="tab tbf-onglet ${S.onglet === 'cartes' ? 'on' : ''}" data-onglet="cartes">CARTES
      <b>${S.deck.actions.length}/${S.regles.actions}</b></button>
  </div>`);

  // Le paquet de bienvenue ne donne que deux Fanzzy, alors que le deck en
  // demande trois : pour un compte neuf ce n'est pas une erreur mais l'état
  // normal, et il faut dire où aller plutôt que laisser un formulaire
  // impossible à remplir.
  if (!assezDeFanzzy) {
    corps.push(`<div class="avert"><b>IL TE MANQUE DES FANZZY</b>
      Un deck demande ${placesFanzzy()} Fanzzy et tu en as ${S.possede.fanzzy.length}.
      Les boosters se rechargent tout seuls au <a href="/fanzzy">kiosque</a>.</div>`);
  }

  corps.push(S.onglet === 'tribune' ? tribuneHTML() : cartesHTML());
  $('corps').innerHTML = corps.join('');

  $('barre').style.display = '';
  $('info').className = 'info' + (pb.length ? ' pb' : '');
  $('info').innerHTML = pb.length
    ? esc(pb.join(' · '))
    : (S.sale ? 'Modifications non enregistrées.'
              : 'Deck complet.');
  $('save').disabled = !complet() || !S.sale;
}

function tribuneHTML() {
  /* Le titre seul : « le premier entre au coup d'envoi », qui le suivait sur
     son panneau, est dit par le sticker TITULAIRE du premier rang, et
     rappelé avec la règle des âges sous les rangs. Deux panneaux de texte
     avant le premier Fanzzy le poussaient sous la ligne de flottaison. */
  const out = ['<h2 class="tbf-cousu">LA TRIBUNE</h2>'];

  /* Pourquoi il n'y a que deux rangs.
   *
   * L'écran ouvrait le bon nombre d'emplacements sans jamais dire d'où venait
   * ce nombre. Quelqu'un qui a lu « jusqu'à trois Fanzzy » quelque part n'en
   * voit que deux, ne trouve aucune explication, et en conclut — à juste
   * titre — que l'écran est cassé. Une limite qu'on subit sans la comprendre
   * passe pour un bug ; datée, elle devient un objectif.
   *
   * Le palier vient du serveur, qui le tire de la table des niveaux : la page
   * n'a pas sa propre idée de quand le troisième rang s'ouvre. */
  const prochain = S.possede?.fanzzyProchain;
  if (prochain && placesFanzzy() < S.regles.fanzzy) {
    /* L'ordinal en toutes lettres. Il s'écrivait « trois » suivi d'un « e »
       en exposant de sept pixels et demi : au soleil on lisait « Le trois
       s'ouvre », qui ne veut rien dire. */
    const rang = ORDINAUX[prochain.places] ?? `${prochain.places}ᵉ`;
    out.push(`<p class="jalon"><span class="tbf-sticker tbf-sticker--jalon">${
      rang[0].toUpperCase() + rang.slice(1)} emplacement au niveau ${prochain.niveau}</span></p>`);
  }

  /* Et ce qu'un âge n'est pas.
   *
   * La question revient : « j'ai un évo 1 et un évo 2, je dois prendre les
   * deux ? » Non — c'est le même personnage, donc une seule carte et un seul
   * rang. L'écran ne le disait nulle part, et le panneau de choix n'en montre
   * qu'une ligne, ce qui ressemble à une carte perdue plutôt qu'à une règle. */
  for (let i = 0; i < placesFanzzy(); i++) {
    const slot = S.deck.fanzzy[i];
    if (!slot) {
      out.push(`<div class="rang vide pan"><div class="tete" data-choisir-fanzzy="${i}">
        <div class="pip" style="--tc:#2A323C"><span style="opacity:.5;font-size:20px">+</span></div>
        <div class="id"><b>Emplacement libre</b>
          <div class="sous">${i === 0 ? 'Titulaire : il entre au coup d\u2019envoi' : 'Remplaçant'}</div></div>
        <div class="chevron">›</div></div></div>`);
      continue;
    }

    const f = aFanzzy(slot.id);
    if (!f) continue;
    const t = S.types[f.type] ?? { nom: f.type, c: '#8257DA', ico: '' };
    const mods = modsTexte(combiner(f.mods ?? {}, slot.stuff ?? []));

    const pieces = [];
    for (let p = 0; p < S.regles.stuffParFanzzy; p++) {
      const s = aStuff((slot.stuff ?? [])[p]);
      // L'objet d'abord, le nom ensuite : une pièce se reconnaît à sa forme
      // bien avant qu'on ait lu son libellé, et c'est ce qu'on cherche quand
      // on hésite entre deux.
      pieces.push(`<button class="piece ${s ? 'plein' : ''}" data-piece="${i}:${p}">
        ${s ? `${window.TBF_STUFF.pastille(s)}
               <span class="txt"><b>${esc(s.nom)}</b></span>`
            : `<span class="creux">+</span>
               <span class="txt"><b>Vide</b>
               <span>Ajouter une pièce</span></span>`}</button>`);
    }

    /* **Le personnage en pied**, et non son buste : c’est ainsi que
       « Mon FANZZY » le montre, et c’est le même dessin détouré. Le buste
       était un carré, qu’il fallait recadrer dans une plaque sombre — donc
       couper le geste, qui est précisément ce qui distingue un Capo d’un
       Tambour.

       `illustration` rend `null` pour les Fanzzy pas encore illustrés : on
       retombe alors sur la pastille de type, exactement comme avant. */
    const buste = window.FZART?.illustration?.(f, 'plein') ?? null;
    const tete = buste
      ? `<div class="face r-${f.rar ?? 'commune'}">${buste}
          <span class="type"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0E13"
            stroke-width="2.4" stroke-linecap="round"><path d="${t.ico}"/></svg></span></div>`
      : `<div class="pip" style="--tc:${t.c}"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0E13"
          stroke-width="2" stroke-linecap="round"><path d="${t.ico}"/></svg></div>`;

    out.push(`<div class="rang pan ${i === 0 ? 'titulaire' : ''}" style="--tc:${t.c}">
      <div class="tete" data-choisir-fanzzy="${i}">
        ${tete}
        <div class="id">
          <b><span class="nom">${esc(f.nom)}</span>${rangHTML(f.rar)}</b>
          <div class="sous">${esc(t.nom)} · étage ${f.stage}</div>
          <div class="cri">${esc(f.cri?.label ?? '')}</div>
        </div>
        ${i === 0 ? '<div class="marque tbf-sticker" data-ton="vert">TITULAIRE</div>' : ''}
        <div class="chevron">›</div>
      </div>
      <div class="pieces">${pieces.join('')}</div>
      ${mods.length ? `<div class="effet"><em>Effet</em> · ${esc(mods.join(' · '))}</div>` : ''}
      <div class="actions">
        ${i > 0 ? `<button class="mini tbf-plaque" data-titulariser="${i}">TITULARISER</button>` : ''}
        <button class="mini danger tbf-plaque" data-ton="flare" data-retirer-fanzzy="${i}">RETIRER</button>
      </div>
    </div>`);
  }

  // Un deck sans « Arbitre — changement » enferme le joueur sur son premier
  // Fanzzy. Ce n'est pas interdit, mais c'est presque toujours involontaire.
  out.push(`<p class="note pan">Le titulaire entre au coup d\u2019envoi, les remplaçants sur la carte
    <b>Arbitre</b>. Un personnage et ses âges sont
    <b>une seule carte</b> : un évolué n\u2019occupe pas un second rang.
    Tout le monde entre au premier âge, et c\u2019est la carte
    <b>Relève</b> qui le fait grandir en cours de partie.
    <b>Un seul légendaire</b> par deck, Fanzzy ou pièce : il dort jusqu\u2019à
    ${legendeChants()} chants réussis de ta part, et un Fanzzy légendaire ne
    peut pas être titulaire.</p>`);

  if (S.deck.fanzzy.length === placesFanzzy() && !S.deck.actions.includes('a-arbitre')) {
    out.push(`<div class="avert doux"><b>TES REMPLAÇANTS NE JOUERONT PAS</b>
      ${MESSAGES['deck.warn.no_substitution']}</div>`);
  }

  // Le piège silencieux du modèle à trois âges : on paie pour faire grandir
  // un Fanzzy, on l’aligne, il entre en gamin, et on en conclut que l’achat
  // n’a servi à rien. La carte Relève est le seul moyen d’en profiter en
  // duel — on le dit à celui qui a quelque chose à relever.
  const relevables = S.deck.fanzzy.filter((f) => (S.stades?.[f.id] ?? 1) > 1);
  if (relevables.length && !S.deck.actions.includes('a-releve')) {
    out.push(`<div class="avert doux"><b>TES ÉVOLUTIONS NE SERVIRONT PAS</b>
      ${MESSAGES['deck.warn.no_evolution_card']}</div>`);
  }

  // Et l'inverse, plus fréquent : « Relève » est offerte à tout le monde, et
  // elle est morte dans la main de qui n'a rien fait grandir.
  if (S.deck.actions.includes('a-releve') && !relevables.length) {
    out.push(`<div class="avert doux"><b>UNE CARTE POUR RIEN</b>
      ${MESSAGES['deck.warn.useless_evolution_card']}</div>`);
  }
  return out.join('');
}

function cartesHTML() {
  /* Le souffle moyen de la main.
     C'est la statistique que tout jeu de deck met en avant, et pour une bonne
     raison : elle répond seule à « pourquoi je n'arrive jamais à jouer ». Une
     main à vingt-huit de moyenne s'étrangle, une main à seize ne fait rien.
     Elle ne se calculait nulle part, et le joueur n'avait aucun moyen de la
     connaître sans additionner dix nombres à la main. */
  const posees = S.deck.actions.map(aCarte).filter(Boolean);
  const moyen = posees.length
    ? (posees.reduce((s, a) => s + (a.cost ?? 0), 0) / posees.length) : 0;

  const out = [`<h2 class="tbf-cousu">LES DIX CARTES</h2>
    <p class="chapo pan"><span>Cinq visibles à la fois.</span>${
    posees.length ? `<b class="tbf-sticker" data-ton="craie">souffle moyen ${moyen.toFixed(1)}</b>` : ''}</p>`];

  const emp = [];
  for (let i = 0; i < S.regles.actions; i++) {
    const a = aCarte(S.deck.actions[i]);
    if (!a) { emp.push(`<div class="emp" data-aller-catalogue="1"><span class="plus">+</span></div>`); continue; }
    const fam = FAM[a.fam] ?? { c: '#8257DA', c2: '#3E2870', ico: '' };
    // Le dessin se pose après le glyphe, pas à sa place : un fichier manquant
    // se retire lui-même et la carte retrouve son sceau.
    emp.push(`<div class="emp plein" style="--fc:${fam.c};--fc2:${fam.c2}" data-retirer-carte="${i}">
      <svg class="sceau" viewBox="0 0 24 24"><path d="${fam.ico}"/></svg>
      ${window.TBF_ACTION.illustration(a.id)}
      <div class="pile"><div class="cout">${a.cost}</div>
        ${a.virage ? '' : '<div class="duelseul">DUEL</div>'}
        <div class="nm">${esc(a.nom)}</div></div></div>`);
  }
  out.push(`<div class="grille">${emp.join('')}</div>`);

  /* **Ce que ce deck vaut sur chacun des deux terrains.**

     Un deck sert aux deux, et il ne s'y comporte pas pareil : le Virage
     écarte les cartes qui visent l'adversaire, puisqu'en face il n'y a pas
     un adversaire mais une foule. Cette ligne est le seul endroit du jeu qui
     le dise avant d'entrer sur le terrain.

     Le seuil est quatre, et il se lit sur la mécanique et non au jugé : la
     main montre cinq cartes à la fois. En dessous de quatre cartes de
     Virage sur dix, la rangée est incomplète dès le premier remplissage, et
     c'est exactement l'écran que le joueur a signalé — une carte et quatre
     cases vides. */
  const auVirage = posees.filter((a) => a.virage).length;
  out.push(`<div class="ouJoue pan">
    <b>${posees.length}</b> carte(s) au duel de tribunes ·
    <b>${auVirage}</b> au Grand Virage
    ${auVirage < 4 && posees.length ? `<span class="maigre">
      Au Virage tu n\u2019auras que ${auVirage} carte(s) en main sur cinq.
      Les cartes marquées <b class="duelseul">DUEL</b> visent quelqu\u2019un en face :
      dans une tribune de trois cents, il n\u2019y a personne à viser.</span>` : ''}
    </div>`);

  out.push(`<h2 class="tbf-cousu" id="catalogue">CATALOGUE</h2>`);
  /* Des plaques : béton au repos, et le bleu du deck sur celle qui est
     choisie. `on` reste posé — c'est lui que la page et ses tests lisent —
     et le ton en découle. */
  const filtre = (id, mot) => `<button class="filtre tbf-plaque${S.filtre === id ? ' on' : ''}"${
    S.filtre === id ? ' data-ton="bleu" aria-pressed="true"' : ' aria-pressed="false"'}
    data-filtre="${id}">${mot}</button>`;
  out.push(`<div class="filtres">${filtre('miennes', 'Les miennes')}${
    filtre('virage', 'Au Virage')}${filtre('toutes', 'Toutes')}</div>`);

  const compte = {};
  for (const id of S.deck.actions) compte[id] = (compte[id] ?? 0) + 1;

  for (const [famId, fam] of Object.entries(FAM)) {
    /* « Au Virage » est un sous-ensemble des miennes, et non un troisième
       catalogue : on ne construit pas un deck avec des cartes qu'on n'a pas. */
    const cartes = S.catalogue.filter((a) => a.fam === famId)
      .filter((a) => (S.filtre === 'toutes' ? true
        : S.filtre === 'virage' ? (a.virage && S.possede.actions.includes(a.id))
          : S.possede.actions.includes(a.id)));
    if (!cartes.length) continue;

    out.push(`<div class="fam" style="--fc:${fam.c}"><span class="nom">${fam.nom}</span><span class="trait"></span></div>`);
    out.push('<div class="cat">');
    for (const a of cartes) {
      const possede = S.possede.actions.includes(a.id);
      const n = compte[a.id] ?? 0;
      out.push(`<div class="carte pan ${possede ? '' : 'absente'}" style="--fc:${fam.c}"
        data-detail="${a.id}">
        <div class="vig"><svg viewBox="0 0 24 24"><path d="${fam.ico}"/></svg>
          ${window.TBF_ACTION.illustration(a.id)}</div>
        <div class="cout">${a.cost}<small>SOUFFLE</small></div>
        <div class="txt"><b>${esc(a.nom)}${rangHTML(a.rar)}
          ${a.virage ? '' : '<span class="duelseul">DUEL SEULEMENT</span>'}</b>
          <p>${esc(a.texte)}</p></div>
        <div class="compte ${n ? 'on' : ''}">${possede ? (S.regles.copiesMax == null ? (n ? `×${n}` : '0') : `${n}/${S.regles.copiesMax}`) : CADENAS}</div>
      </div>`);
    }
    out.push('</div>');
  }
  return out.join('');
}

/* ------------------------------------------------------------- panneaux */

/**
 * Ouvre le panneau.
 *
 * `pied` est ce qui **décide** — le bouton, ou le refus qui le remplace — et il
 * se pose **hors du corps qui défile**.
 *
 * La feuille de style le promettait depuis le début : « l'en-tête reste en
 * haut, le corps prend ce qui reste, et le bouton d'action reste sous les
 * yeux ». Le panneau n'en savait rien : tout ce qu'on lui donnait partait dans
 * `.pc`, qui est en `overflow:auto`. Sur un écran de six cents pixels — un
 * iPhone SE barre comprise — le dessin de la carte en prend deux cent
 * soixante-seize, et « AJOUTER AU DECK » finissait neuf pixels **sous** le
 * panneau. Il fallait faire défiler à l'intérieur pour le trouver, sur l'écran
 * même où l'on vient pour décider, et rien ne disait qu'il existait.
 *
 * Le paramètre est facultatif : les cinq autres panneaux sont des listes de
 * choix où chaque ligne décide, et ils n'ont pas de pied.
 */
function ouvrir(titre, contenu, pied = '') {
  $('panneau').innerHTML = `<div class="ph"><h3>${esc(titre)}</h3>
    <button data-fermer="1" aria-label="Fermer">×</button></div><div class="pc">${contenu}</div>`
    + (pied ? `<div class="pp">${pied}</div>` : '');
  $('voile').classList.add('on');
}
const fermer = () => $('voile').classList.remove('on');

/* ------------------------------------------------------ la carte en grand

   Une rangée de deck dit le nom, le coût et deux lignes de texte, sur une
   vignette de trente-huit pixels. On y choisit donc ses cartes sans jamais
   avoir vu ce qu'elles sont : le dessin, ce qu'elles coûtent à rejouer, ce
   qu'elles demandent pour être jouables.

   Le panneau existait — il ouvrait un tableau de trois lignes. Il ouvre
   maintenant la carte elle-même, au format d'une carte, dessin compris. */

/** Les raretés, en toutes lettres. Le catalogue les écrit en clé. */
const RARETE = {
  commune: 'Commune', rare: 'Rare', epique: 'Épique', legendaire: 'Légendaire',
};

/**
 * Ce qu'une carte demande pour être jouable.
 *
 * Les conditions sont écrites en mécanique — `mene: 1`, `minuteReelle: 75` —
 * et personne n'a à lire ça. On les rend en français, et on nomme celles qu'on
 * ne connaît pas plutôt que de les taire : une carte qui a une condition
 * invisible est une carte qui refuse de se jouer sans dire pourquoi.
 */
function conditionTexte(c) {
  if (!c) return null;
  const dits = [];
  if (c.mene) {
    dits.push(c.mene === 1
      ? 'Ton club doit être mené au vrai match.'
      : `Ton club doit être mené d’au moins ${c.mene} buts au vrai match.`);
  }
  if (c.minuteReelle) dits.push(`À partir de la ${c.minuteReelle}ᵉ minute du vrai match.`);
  if (c.evolution) dits.push('Ton Fanzzy doit avoir un âge suivant à atteindre.');
  for (const k of Object.keys(c)) {
    if (!['mene', 'minuteReelle', 'evolution'].includes(k)) {
      dits.push(`Condition « ${k} » : ${JSON.stringify(c[k])}`);
    }
  }
  return dits.length ? dits : null;
}




function panneauFanzzy(index) {
  const dedans = new Set(S.deck.fanzzy.map((f) => f.id));
  const dispo = S.possede.fanzzy.map(aFanzzy).filter(Boolean)
    .sort((a, b) => (RANG[b.rar] - RANG[a.rar]) || a.nom.localeCompare(b.nom));

  if (!dispo.length) {
    return ouvrir('Choisir un Fanzzy',
      `<div class="vide">Tu n\u2019as encore aucun Fanzzy.<br><a href="/fanzzy">Ouvrir un booster</a></div>`);
  }

  const lignes = dispo.map((f) => {
    const t = S.types[f.type] ?? { nom: f.type, c: '#8257DA', ico: '' };
    const pris = dedans.has(f.id) && S.deck.fanzzy[index]?.id !== f.id;
    const dessin = window.FZART?.illustration?.(f, 'plein') ?? null;
    return `<div class="choix pan ${pris ? 'pris' : ''}" ${pris ? '' : `data-prendre-fanzzy="${index}:${f.id}"`}>
      ${dessin ? `<div class="face r-${f.rar ?? 'commune'}">${dessin}</div>`
        : `<div class="pip" style="--tc:${t.c};width:46px;height:46px;border-radius:9px">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="2" stroke-linecap="round"
          style="width:22px;height:22px"><path d="${t.ico}"/></svg></div>`}
      <div class="txt"><b>${esc(f.nom)}${rangHTML(f.rar)}</b>
        <p>${esc(t.nom)} · ${esc(modsTexte(f.mods ?? {}).join(' · ') || 'aucun modificateur')}</p></div>
      <div class="tag">${pris ? 'DÉJÀ PRIS' : ''}</div>
    </div>`;
  });

  ouvrir(index === 0 ? 'Titulaire' : `Remplaçant ${index}`, lignes.join(''));
}

function panneauPiece(index, place) {
  const portees = piecesPortees(index);
  const surCeFanzzy = S.deck.fanzzy[index]?.stuff ?? [];
  const dispo = S.possede.stuff.map(aStuff).filter(Boolean)
    .sort((a, b) => (RANG[b.rar] - RANG[a.rar]) || a.nom.localeCompare(b.nom));

  if (!dispo.length) {
    return ouvrir('Équipement',
      `<div class="vide">Tu n\u2019as aucune pièce d\u2019équipement.<br>
       Elles sortent des boosters, au <a href="/fanzzy">kiosque</a>.</div>`);
  }

  /* **Combien de fois cette pièce est déjà posée dans le deck**, tous rangs
     confondus, et combien on en possède. Une pièce d'équipement est un objet
     et pas une licence : possédée deux fois, elle se porte deux fois. Ce qui
     reste interdit est de poser deux fois le **même exemplaire**.

     L'emplacement qu'on est en train de changer ne compte pas dans les
     porteurs : on le remplace, on ne le double pas. */
  const combien = (id) => S.deck.fanzzy
    .flatMap((f, i) => (f?.stuff ?? []).filter((x, p) => x === id
      && !(i === index && p === place))).length;

  const lignes = dispo.map((s) => {
    const possedes = Number(S.possede.stuffCopies?.[s.id] ?? 1);
    const poses = combien(s.id);
    const ici = surCeFanzzy[place] === s.id;
    const bloque = !ici && poses >= possedes;
    const ailleurs = portees.has(s.id) && !ici;
    return `<div class="choix pan ${bloque ? 'pris' : ''}"
      ${bloque ? '' : `data-prendre-piece="${index}:${place}:${s.id}"`}>
      ${window.TBF_STUFF.pastille(s)}
      <div class="txt"><b>${esc(s.nom)}${rangHTML(s.rar)}</b>
        <p>${esc(s.texte)}<br>${esc(modsTexte(s.mods ?? {}).join(' · '))}</p></div>
      <div class="tag">${ici ? 'PORTÉE'
        : bloque ? 'TOUS PORTÉS'
        : possedes > 1 ? `${possedes - poses} SUR ${possedes}`
        : ailleurs ? 'AUTRE RANG' : ''}</div>
    </div>`;
  });

  const vider = surCeFanzzy[place]
    ? `<div class="choix pan" data-vider-piece="${index}:${place}">
        <div class="txt"><b>Laisser vide</b>
        <p>Retirer la pièce de cet emplacement.</p></div></div>` : '';

  ouvrir('Équipement', vider + lignes.join(''));
}

function panneauCarte(id) {
  const a = aCarte(id);
  if (!a) return;
  const fam = FAM[a.fam] ?? { nom: a.fam, c: '#8257DA' };
  const possede = S.possede.actions.includes(a.id);
  const n = S.deck.actions.filter((x) => x === a.id).length;
  const plein = S.deck.actions.length >= S.regles.actions;

  const cond = conditionTexte(a.condition);

  /* Le dessin d'abord, et en grand. Le glyphe de famille reste dessous : une
     carte dont le fichier manque garde un visage au lieu d'un trou. */
  const info = `<div class="grandeCarte" style="--fc:${fam.c ?? '#8257DA'}">
    <div class="gcArt">
      <svg viewBox="0 0 24 24"><path d="${fam.ico ?? ''}"/></svg>
      ${window.TBF_ACTION.illustration(a.id, 'gcIllu')}
    </div>

    <div class="gcRang">
      <span class="gcFam">${esc(fam.nom ?? a.fam)}</span>
      ${motRarete(a.rar) ? `<span class="tbf-forme tbf-forme--coin gcRar" data-rar="${a.rar}"><i></i><b>${
        motRarete(a.rar)}</b></span>` : ''}
    </div>

    <p class="gcTexte">${esc(a.texte)}</p>

    <div class="gcChiffres">
      <div class="tbf-stat"><b>${a.cost}</b><small>SOUFFLE</small></div>
      <div class="tbf-stat"><b>${a.cd}s</b><small>RECHARGE</small></div>
      <div class="tbf-stat"><b>${possede ? (S.regles.copiesMax == null ? `×${n}` : `${n}/${S.regles.copiesMax}`) : CADENAS}</b><small>DANS TON DECK</small></div>
    </div>

    ${cond ? `<div class="gcCond"><b>Pour la jouer</b>${
      cond.map((t) => `<p>${esc(t)}</p>`).join('')}</div>` : ''}

    ${a.revers ? `<div class="gcCond"><b>Elle se retourne</b><p>Cette carte a un
      revers : elle rend quelque chose en plus de coûter son souffle. Le texte
      ci-dessus dit quoi.</p></div>` : ''}
  </div>`;

  let bas;
  if (!possede) {
    bas = `<div class="vide" style="padding:18px 10px">Tu ne possèdes pas encore cette carte.<br>
      Elle sort des boosters, au <a href="/fanzzy">kiosque</a>.</div>`;
  } else if (S.regles.copiesMax != null && n >= S.regles.copiesMax) {
    bas = `<div class="vide" style="padding:18px 10px">Tu en as déjà
      ${S.regles.copiesMax} exemplaires : c\u2019est le maximum.</div>`;
  } else if (plein) {
    bas = `<div class="vide" style="padding:18px 10px">Tes ${S.regles.actions} emplacements sont pris.<br>
      Retire une carte pour faire de la place.</div>`;
  } else {
    bas = `<div style="padding:6px 0 10px"><button class="btn tbf-plaque" data-ton="bleu" style="width:100%"
      data-ajouter="${a.id}">AJOUTER AU DECK${n ? ` (${S.regles.copiesMax == null ? `déjà ×${n}` : `${n}/${S.regles.copiesMax}`})` : ''}</button></div>`;
  }

  /* Le dessin, les chiffres et le texte défilent ; ce qui décide ne défile
     jamais. C'est le seul panneau du jeu assez haut pour que la différence se
     voie — et c'est celui où l'on vient pour décider. */
  ouvrir(a.nom, info, bas);
}

/* ------------------------------------------------------- enregistrement */

async function enregistrer() {
  const bouton = $('save');
  bouton.disabled = true;
  try {
    const r = await api('/api/deck/mien', { method: 'PUT', body: {
      nom: S.deck.nom,
      fanzzy: S.deck.fanzzy.map((f) => ({ id: f.id, stuff: f.stuff ?? [] })),
      actions: S.deck.actions,
    } });
    S.sale = false;
    rendre();
    const av = (r.avertissements ?? []).map((a) => MESSAGES[a.code]).filter(Boolean);
    toast(av.length ? av[0] : 'Deck enregistré.');
  } catch (e) {
    if (e.message === 'auth') return;
    // Le détail vient de validerDeck : chaque problème a son code. On les
    // affiche tous, nommés — c'est exactement ce qu'un « impossible » cache.
    const liste = (e.detail ?? []).map((p) => {
      const base = precise(p);
      if (!p.id) return base;
      const nom = aFanzzy(p.id)?.nom ?? aStuff(p.id)?.nom ?? aCarte(p.id)?.nom ?? p.id;
      return `${base} (${nom})`;
    });
    if (liste.length) {
      ouvrir('Deck refusé', `<div class="avert"><b>LE SERVEUR A REFUSÉ CE DECK</b>
        <ul>${liste.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`);
    } else {
      toast(MESSAGES[e.code] ?? `Refusé par le serveur : ${e.code}`);
    }
    bouton.disabled = false;
  }
}

/* ------------------------------------------------------------- gestes */


$('corps').addEventListener('click', (e) => {
  const el = (a) => e.target.closest(`[data-${a}]`);
  let n;

  if ((n = el('onglet'))) { S.onglet = n.dataset.onglet; return rendre(); }
  if ((n = el('filtre'))) { S.filtre = n.dataset.filtre; return rendre(); }
  if ((n = el('aller-catalogue'))) {
    return document.getElementById('catalogue')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if ((n = el('choisir-fanzzy'))) return panneauFanzzy(Number(n.dataset.choisirFanzzy));
  if ((n = el('detail'))) return panneauCarte(n.dataset.detail);

  if ((n = el('piece'))) {
    const [i, p] = n.dataset.piece.split(':').map(Number);
    return panneauPiece(i, p);
  }
  if ((n = el('titulariser'))) {
    const i = Number(n.dataset.titulariser);
    const [f] = S.deck.fanzzy.splice(i, 1);
    S.deck.fanzzy.unshift(f);
    S.sale = true;
    return rendre();
  }
  if ((n = el('retirer-fanzzy'))) {
    S.deck.fanzzy.splice(Number(n.dataset.retirerFanzzy), 1);
    S.sale = true;
    return rendre();
  }
  if ((n = el('retirer-carte'))) {
    S.deck.actions.splice(Number(n.dataset.retirerCarte), 1);
    S.sale = true;
    return rendre();
  }
});

$('voile').addEventListener('click', (e) => {
  if (e.target === $('voile')) return fermer();
  const el = (a) => e.target.closest(`[data-${a}]`);
  let n;

  if (el('fermer')) return fermer();

  if ((n = el('prendre-fanzzy'))) {
    const [i, id] = n.dataset.prendreFanzzy.split(':');
    const index = Number(i);
    const ancien = S.deck.fanzzy[index];
    // On garde l'équipement en place : changer de Fanzzy ne doit pas faire
    // perdre le travail d'équipement, sauf si une pièce part ailleurs.
    S.deck.fanzzy[index] = { id, stuff: ancien?.stuff ?? [] };
    // Les emplacements sont contigus : un trou au milieu n'a pas de sens.
    S.deck.fanzzy = S.deck.fanzzy.filter(Boolean);
    S.sale = true;
    fermer();
    return rendre();
  }

  if ((n = el('prendre-piece'))) {
    const [i, p, id] = n.dataset.prendrePiece.split(':');
    const f = S.deck.fanzzy[Number(i)];
    if (!f) return fermer();
    f.stuff = f.stuff ?? [];
    f.stuff[Number(p)] = id;
    // Un emplacement 2 rempli alors que le 1 est vide donnerait un trou :
    // on compacte, la validation du serveur compte les pièces, pas les cases.
    f.stuff = f.stuff.filter(Boolean).slice(0, S.regles.stuffParFanzzy);
    S.sale = true;
    fermer();
    return rendre();
  }

  if ((n = el('vider-piece'))) {
    const [i, p] = n.dataset.viderPiece.split(':').map(Number);
    const f = S.deck.fanzzy[i];
    if (f) { f.stuff.splice(p, 1); S.sale = true; }
    fermer();
    return rendre();
  }

  if ((n = el('ajouter'))) {
    if (S.deck.actions.length >= S.regles.actions) return fermer();
    S.deck.actions.push(n.dataset.ajouter);
    S.sale = true;
    fermer();
    return rendre();
  }
});

$('save').addEventListener('click', enregistrer);

// Quitter avec des modifications non enregistrées est presque toujours une
// erreur : le navigateur demande confirmation, à nous de l'y autoriser.
addEventListener('beforeunload', (e) => {
  if (!S.sale) return;
  e.preventDefault();
  e.returnValue = '';
});

charger().catch((e) => {
  if (e.message === 'auth') return;
  $('corps').innerHTML = `<div class="vide">Impossible de charger ton deck.<br>
    ${esc(MESSAGES[e.code] ?? e.code ?? 'Serveur injoignable')}</div>`;
});
