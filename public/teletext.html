<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toutes les compétitions — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<script src="/dialogue.js" defer></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#141A21,#0A0D11 40%,#0A0D11)}

.top{display:flex;align-items:center;gap:10px;padding:13px 15px 8px;flex:none}
.back{background:none;border:1px solid rgba(242,238,228,.2);border-radius:6px;color:inherit;
  width:32px;height:32px;cursor:pointer;font-size:16px;display:none}
.back.on{display:block}
.top h1{font-family:var(--banner);font-size:19px;letter-spacing:.14em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1 small{display:block;font-size:9px;letter-spacing:.24em;opacity:.5;margin-top:3px;font-family:var(--ui)}
/* **Un lien de quinze pixels de haut se rate.** Celui-ci ouvre les matchs du
   jour depuis le kiosque : c'est la sortie la plus empruntée de la page, et
   c'était la plus petite. On lui donne les quarante-quatre pixels
   réglementaires sans monter la barre — la marge négative les reprend, et la
   zone déborde sur le rembourrage qui l'entoure déjà. */
.top .jour{color:var(--projo);font-size:11.5px;text-decoration:none;white-space:nowrap;
  display:flex;align-items:center;min-height:44px;margin:-12px 0}

/* Le nom de la page était écrit deux fois : une fois par la barre du haut,
   une fois ici, l'un sous l'autre et dans la même police. Il ne paraît donc
   plus que lorsque la barre ne le dit pas — elle ne se monte que pour un
   joueur connecté, et un visiteur sans compte n'a que ce titre-ci.

   D'où `:has` plutôt qu'une classe posée en JavaScript : la règle suit la
   barre qu'elle arrive avant ou après, et si le navigateur ne connaît pas
   `:has`, on retombe sur l'ancien affichage — jamais sur une page sans titre.
   Le sous-titre, lui, reste : il dit ce que la liste montre, ce qu'aucune
   barre ne dira. */
body:has(.tbf-haut) .top h1.page>span{display:none}
body:has(.tbf-haut) .top h1.page>small{margin-top:0;font-size:10px}

.search{padding:0 15px 10px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.16);border-radius:7px;
  color:var(--craie);padding:11px 13px;font-size:14.5px;font-family:inherit}
input:focus{outline:none;border-color:var(--projo)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 15px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* Quarante-quatre pixels : la pulpe d'un doigt, et le minimum des deux
   plateformes. L'audit d'interface les a tous comptés d'un coup — ce n'est
   jamais une faute de conception, c'est une hauteur qu'on ne mesure pas en
   regardant. */
.chip{white-space:nowrap;font-size:11px;padding:6px 14px;min-height:44px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(242,238,228,.16);background:rgba(0,0,0,.25);color:inherit;opacity:.6;font-family:inherit}
.chip.on{background:var(--craie);color:#0B0E13;border-color:var(--craie);opacity:1;font-weight:600}
.chip.mien{border-color:var(--projo);color:var(--projo);opacity:1}
.chip.mien.on{background:var(--projo);color:#0B0E13}

.list{flex:1;padding:0 12px 26px}
.lg{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(242,238,228,.09);background:rgba(0,0,0,.22);margin-bottom:6px}
.lg .n{flex:1;min-width:0}
.lg b{font-family:var(--banner);font-size:13.5px;display:block;letter-spacing:.02em}
.lg small{font-size:10.5px;opacity:.45}
.lg .t{font-family:var(--banner);font-size:9px;letter-spacing:.1em;border-radius:3px;padding:2px 6px;
  border:1px solid rgba(242,238,228,.2);opacity:.55}
.lg .t.t1{border-color:var(--projo);color:var(--projo);opacity:1}
/* « En cours » se lit d'un coup d'œil et ne se confond pas avec le palier :
   l'un dit ce qui se joue, l'autre ce qui compte. */
.lg .enc{font-family:var(--banner);font-size:8.5px;letter-spacing:.1em;color:var(--vert);
  border:1px solid rgba(74,222,128,.4);border-radius:3px;padding:2px 5px;flex:none}
.lg .fav{background:none;border:0;padding:0;margin:-4px 0 -4px -2px;cursor:pointer;font-size:18px;
  line-height:1;color:rgba(242,238,228,.22);flex:none;transition:color .15s,transform .12s}
.lg .fav.on{color:var(--projo)}
.lg .fav:active{transform:scale(1.3)}

/* ------------------------------------------------------- les journées */
.journees{display:flex;align-items:center;gap:7px;padding:10px 4px 4px}
.journees select{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.16);
  border-radius:7px;color:var(--craie);padding:9px 11px;font-size:13px;font-family:inherit;
  font-family:var(--banner);letter-spacing:.06em}
.journees select:focus{outline:none;border-color:var(--projo)}
.journees option{background:#10151B;color:var(--craie)}
.journees button{background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.16);border-radius:7px;
  color:inherit;width:34px;height:36px;cursor:pointer;font-size:15px;flex:none;font-family:inherit}
.journees button:disabled{opacity:.25;cursor:default}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--banner);font-size:9.5px;letter-spacing:.13em;opacity:.42;text-align:right;
  padding:6px 4px;font-weight:500}
th:nth-child(2){text-align:left}
td{padding:8px 4px;text-align:right;border-top:1px solid rgba(242,238,228,.07)}
td:nth-child(2){text-align:left}
td.club{display:flex;align-items:center;gap:7px;min-width:0}
td.club img{width:17px;height:17px;object-fit:contain;flex:none}
td.club span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.top3 td:first-child{color:var(--vert);font-weight:700}
tr.bottom td:first-child{color:var(--flare)}
td.pts{font-family:var(--banner);font-size:15px}
.form{display:flex;gap:2px;justify-content:flex-end}
.form i{width:6px;height:6px;border-radius:1px;display:block}
.form i.W{background:var(--vert)}.form i.D{background:rgba(242,238,228,.35)}.form i.L{background:var(--flare)}

.m{display:flex;align-items:center;gap:9px;padding:9px 6px;border-top:1px solid rgba(242,238,228,.07);
  font-size:12.5px;cursor:pointer}
.m:hover{background:rgba(242,238,228,.035)}
.m .s{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.m .s.a{justify-content:flex-end;text-align:right}
.m .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m img{width:17px;height:17px;object-fit:contain;flex:none}
.m .sc{font-family:var(--banner);font-size:15px;min-width:46px;text-align:center}
.m .when{font-size:10.5px;opacity:.45;min-width:46px;text-align:center;line-height:1.3}
.m .live{color:var(--flare);font-weight:600;font-size:10.5px}
.round{font-family:var(--banner);font-size:9.5px;letter-spacing:.14em;opacity:.4;padding:14px 6px 2px}

/* ------------------------------------------------------- la ferveur

   Six onglets ne tiennent pas côte à côte sur trois cent soixante pixels :
   à `flex:1 1 0`, « CLASSEMENT » devenait « CLASSE… » et une destination
   tronquée se devine au lieu de se lire.

   `flex:1 0 auto` garde les deux comportements : sur un écran large les six
   se partagent le rail, sur un écran étroit ils gardent leur texte et le rail
   défile. L'onglet choisi est ramené dans la vue par le clic. */
.tabs.tbf-onglets{overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs.tbf-onglets::-webkit-scrollbar{display:none}
.tabs .tbf-onglet{flex:1 0 auto;padding-left:13px;padding-right:13px}

.chips.ech{padding:12px 3px 10px}
.maplace{font-size:12px;padding:2px 6px 12px;opacity:.75;line-height:1.6}
.maplace b{font-family:var(--banner);font-size:14px;color:var(--projo)}
.maplace.vide{opacity:.45}

.note{font-size:11px;opacity:.45;text-align:center;padding:14px 20px;line-height:1.6}
.note.stale{color:var(--projo);opacity:.75}
.empty{text-align:center;padding:44px 20px;opacity:.5;font-size:13px;line-height:1.7}
.spin{width:26px;height:26px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:44px auto}
@keyframes sp{to{transform:rotate(1turn)}}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Les boutons de cette barre n'ont pas de classe : ils sont les seuls enfants
   du rail, et lui seul les désigne. */
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <button class="back" id="back">‹</button>
    <h1 id="titre" class="page"><span id="tnom">TOUTES LES COMPÉTITIONS</span
      ><small id="tsous">ce qui se joue en ce moment</small></h1>
    <a class="jour" href="/matchs">matchs du jour ›</a>
  </div>
  <div id="head"></div>
  <div class="list" id="list"><div class="spin"></div></div>
</main>

<!-- La minute d'un match en direct, la même que dans le Grand Virage et la
     page des matchs : elle court entre deux relevés, sans un appel de plus. -->
<script src="/horloge.js"></script>
<!-- Le nom des pays dans la langue du lecteur, partagé avec la page des
     matchs. Classique et sans « defer » : le rendu s'en sert tout de suite. -->
<script src="/pays.js"></script>
<script>
/* =======================================================================
   Toutes les compétitions.

   Tout vient du serveur, qui met en cache : ouvrir une compétition mille
   fois ne coûte qu'un appel à l'API.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

const LANGUE = window.TBF_PAYS.locale;
/** Le pays d'une compétition, dans la langue du lecteur. */
const nomPays = (l) => window.TBF_PAYS.nom(l.country, l.country_code);

/**
 * Qui regarde — ou personne.
 *
 * Une seule promesse pour tout le document, partagée avec `nav.js` sous ce
 * nom : sans ce partage, la page poserait deux fois la même question au même
 * serveur, et c'est le genre de doublon qui finit par donner deux réponses
 * différentes.
 */
const moi = () => (window.TBF_MOI ??= fetch('/api/auth/me', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => j?.user ?? null)
  .catch(() => null));

/**
 * Toute requête a une limite de temps et un message d'erreur.
 * Un écran qui tourne indéfiniment est le pire des retours : l'utilisateur ne
 * sait pas s'il doit attendre, recharger, ou si c'est cassé.
 */
async function appel(url, options = {}) {
  const r = await fetch(url,
    { signal: AbortSignal.timeout(12000), credentials: 'same-origin', ...options });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error ?? 'erreur'), { code: j.error, detail: j.detail });
  return j;
}

/** Le télétexte : ce que l'API de football sait du championnat. */
const api = (p, options) => appel('/api/tt' + p, options);
/* Les classements de ferveur : ce que **nos joueurs** ont fait. Deux services
   bien distincts — l'un se met en cache pour économiser un quota, l'autre
   agrège nos propres tables — et deux préfixes pour qu'on ne les confonde
   jamais en lisant le code. */
const rang = (p) => appel('/api/rank' + p);

function panne(e) {
  const msg = e.name === 'TimeoutError' ? 'Le serveur met trop de temps à répondre.'
    : e.code === 'teletext.error.schema'
      ? 'Base de données incomplète.' : 'Service indisponible.';
  $('list').innerHTML = `<div class="empty">${msg}<br>
    ${e.detail ? `<small style="opacity:.6">${esc(e.detail)}</small><br>` : ''}<br>
    <button class="chip on" id="retry">RÉESSAYER</button></div>`;
  $('retry').onclick = () => (vue === 'sommaire' ? sommaire() : charger());
}

let vue = 'sommaire', ligue = null, onglet = 'classement';
let paysFiltre = '', terme = '', filtreFavoris = false;
/** La journée demandée, ou `null` pour celle que le serveur juge courante. */
let journee = null;
/** La dernière réponse des résultats : la minute court dessus entre deux relevés. */
let RES = null;

/* ------------------------------------------------- les compétitions suivies

   On suit une compétition comme on suit un club, et pour la même raison : on
   ne veut pas la retrouver chaque fois parmi neuf cent cinquante. Mais elles
   ne se ressemblent que là — un club suivi fait travailler le guetteur,
   une compétition suivie n'ordonne qu'une liste. D'où une table à elle, et
   aucun plafond.

   Deux choses en découlent, et ce sont les deux raisons de suivre :
   une compétition suivie passe **devant** les autres, et elle ne quitte
   **jamais** le sommaire, même entre deux saisons.                          */

let favoris = null;                    // null : on ne sait pas encore. Set : on sait.
let connu = null;

async function chargerFavoris() {
  const u = await moi();
  connu = u ?? false;
  if (!u) { favoris = new Set(); return; }
  try { favoris = new Set((await api('/favoris')).leagues); }
  catch { favoris = new Set(); }       // hors ligne : pas d'étoile, pas de panne
}

async function basculer(id, bouton) {
  if (!connu || !favoris) return;
  const suivi = favoris.has(id);
  /* On peint d'abord, on demande ensuite. Une étoile qui attend le serveur
     pour s'allumer donne l'impression que le clic n'a pas pris — et le geste
     se répète, ce qui est exactement ce qu'on ne veut pas. */
  bouton.classList.toggle('on', !suivi);
  try {
    const r = await api(`/favoris/${id}`, { method: suivi ? 'DELETE' : 'POST' });
    favoris = new Set(r.leagues);
  } catch {
    bouton.classList.toggle('on', suivi);   // refus du serveur : on rend la main
  }
}

/* ------------------------------------------------------------ sommaire */

async function sommaire() {
  vue = 'sommaire';
  veiller(null);
  $('back').classList.remove('on');
  $('titre').className = 'page';
  $('tnom').textContent = 'TOUTES LES COMPÉTITIONS';
  $('tsous').textContent = (terme || paysFiltre || filtreFavoris)
    ? 'résultat de la recherche' : 'ce qui se joue en ce moment';
  $('head').innerHTML = `
    <div class="search"><input id="q" placeholder="Chercher une compétition ou un pays…" value="${esc(terme)}"></div>
    <div class="chips" id="pays"></div>`;
  $('list').innerHTML = '<div class="spin"></div>';

  if (favoris === null) await chargerFavoris();

  /* Le terme peut désigner un pays : « espagne » comme « spain ». On le
     retraduit ici, et on envoie au serveur le code ISO **et** le nom anglais
     — il range les deux, et aucun des deux n'est complet à lui seul. */
  const designes = window.TBF_PAYS.designes(terme);
  const q = new URLSearchParams({ q: terme, country: paysFiltre });
  if (designes.length) {
    q.set('pays', designes.map((p) => p.nom).join(','));
    q.set('codes', designes.map((p) => p.code).join(','));
  }
  if (filtreFavoris) q.set('favoris', '1');

  let leagues, countries;
  try {
    ([{ leagues }, { countries }] = await Promise.all([
      api(`/leagues?${q}`),
      api('/countries'),
    ]));
  } catch (e) { return panne(e); }

  const mien = connu
    ? `<button class="chip mien ${filtreFavoris ? 'on' : ''}" data-mien="1">★ MES COMPÉTITIONS</button>`
    : '';
  $('pays').innerHTML = mien
    + `<button class="chip ${paysFiltre ? '' : 'on'}" data-p="">TOUT</button>`
    + countries.slice(0, 24).map((c) =>
      `<button class="chip ${paysFiltre === c.country ? 'on' : ''}" data-p="${esc(c.country)}"
        >${esc(window.TBF_PAYS.nom(c.country, c.code))}</button>`).join('');

  $('list').innerHTML = leagues.length ? leagues.map((l) => `
    <div class="lg" data-l="${l.league_id}">
      ${connu ? `<button class="fav ${favoris.has(l.league_id) ? 'on' : ''}" data-fav="${l.league_id}"
        aria-label="Suivre cette compétition">★</button>` : ''}
      <div class="n"><b>${esc(l.name)}</b><small>${esc(nomPays(l))} · saison ${l.season}</small></div>
      ${l.en_cours ? '<span class="enc">EN COURS</span>' : ''}
      <span class="t ${l.tier === 1 ? 't1' : ''}">${
        l.tier === 1 ? 'MAJEURE' : l.tier === 2 ? 'SUIVIE' : ''}</span>
    </div>`).join('')
    : '<div class="empty">Aucune compétition trouvée.</div>';

  $('q').oninput = debounce(() => { terme = $('q').value.trim(); sommaire(); }, 320);
  $('pays').onclick = (e) => {
    const m = e.target.closest('[data-mien]');
    if (m) { filtreFavoris = !filtreFavoris; paysFiltre = ''; return sommaire(); }
    const b = e.target.closest('[data-p]');
    if (b) { paysFiltre = b.dataset.p; filtreFavoris = false; sommaire(); }
  };
}

let t = null;
function debounce(fn, ms) { return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------------------------------------------------------- une ligue */

async function ouvrir(id) {
  vue = 'ligue'; ligue = id; onglet = 'classement'; journee = null;
  /* La saison et les classements appartiennent à la compétition qu'on
     quitte : les garder ferait afficher les siens sous le nom de l'autre,
     le temps d'un aller-retour au serveur. */
  SAISON = null; FERVEUR = null; echelle = 'joueurs';
  $('back').classList.add('on');
  $('titre').className = '';
  $('head').innerHTML = `<div class="tabs tbf-onglets" id="tabs">
    <button data-t="classement" class="tbf-onglet on">CLASSEMENT</button>
    <button data-t="resultats" class="tbf-onglet">RÉSULTATS</button>
    <button data-t="scorers" class="tbf-onglet">BUTEURS</button>
    <button data-t="assists" class="tbf-onglet">PASSEURS</button>
    <button data-t="cards" class="tbf-onglet">CARTONS</button>
    <!-- Le seul onglet qui parle du jeu et non du football : ce que les
         supporters ont donné dans cette compétition. -->
    <button data-t="ferveur" class="tbf-onglet">FERVEUR</button>
  </div>`;
  $('tabs').onclick = (e) => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    onglet = b.dataset.t;
    // Le rail défile quand les six onglets ne tiennent pas : on ramène dans la
    // vue celui qu'on vient de choisir, sinon il reste à moitié caché.
    b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    journee = null;                    // on revient toujours sur la journée du jour
    [...$('tabs').children].forEach((x) => x.classList.toggle('on', x === b));
    charger();
  };
  charger();
}

async function charger() {
  veiller(null);
  $('list').innerHTML = '<div class="spin"></div>';
  /* La ferveur ne passe pas par le télétexte : elle n'a ni cache d'API ni
     quota à ménager, et son adresse n'est pas la même. */
  if (onglet === 'ferveur') return chargerFerveur();
  const route = { classement:'', resultats:'/results', scorers:'/scorers',
                  assists:'/assists', cards:'/cards' }[onglet];
  const suite = onglet === 'resultats' && journee
    ? `?journee=${encodeURIComponent(journee)}` : '';
  const quelle = ligue;
  let d;
  try { d = await api(`/league/${ligue}${route}${suite}`); }
  catch (e) { return panne(e); }
  if (quelle !== ligue || vue !== 'ligue') return;   // on a changé d'avis pendant l'attente

  $('tnom').textContent = d.league.name;
  $('tsous').textContent = `${nomPays(d.league)} · saison ${d.league.season}`;
  /* La saison que le télétexte a retenue sur les dates de la compétition. Le
     classement la reprend telle quelle plutôt que de la recalculer : une
     seule règle, un seul endroit. */
  SAISON = d.league.season ?? null;

  if (d.unsupported) {
    $('list').innerHTML = `<div class="empty">Cette donnée n'existe pas pour cette compétition.<br>
      Toutes les compétitions ne sont pas couvertes de la même façon.</div>`;
    return;
  }

  if (onglet === 'classement') rendreClassement(d);
  else if (onglet === 'resultats') rendreResultats(d);
  else rendreJoueurs(d);

  if (d.stale) {
    $('list').insertAdjacentHTML('beforeend',
      '<div class="note stale">Données un peu anciennes : le service de résultats n’a pas répondu.</div>');
  }
}

function rendreClassement(d) {
  if (!d.groups.length) return $('list').innerHTML = '<div class="empty">Classement indisponible.</div>';
  $('list').innerHTML = d.groups.map((g) => `
    ${g[0]?.group && d.groups.length > 1 ? `<div class="round">${esc(g[0].group)}</div>` : ''}
    <table>
      <thead><tr><th>#</th><th>ÉQUIPE</th><th>J</th><th>G</th><th>N</th><th>P</th><th>DIFF</th><th>PTS</th></tr></thead>
      <tbody>${g.map((r, i) => `
        <tr class="${i < 3 ? 'top3' : i >= g.length - 2 ? 'bottom' : ''}">
          <td>${r.rank}</td>
          <td class="club"><img src="${esc(r.logo)}" alt=""><span>${esc(r.name)}</span></td>
          <td>${r.played}</td><td>${r.win}</td><td>${r.draw}</td><td>${r.lose}</td>
          <td>${r.gf - r.ga > 0 ? '+' : ''}${r.gf - r.ga}</td>
          <td class="pts">${r.points}</td>
        </tr>`).join('')}</tbody>
    </table>`).join('');
}

/* ------------------------------------------------------- les résultats */

/**
 * Le nom d'une journée, dans la langue du lecteur.
 *
 * L'API n'écrit qu'en anglais et toujours de la même façon : « Regular Season
 * - 12 ». Le reste — phases de groupes, huitièmes, barrages — porte des noms
 * trop variés pour qu'une table tienne, et on les laisse tels quels plutôt que
 * d'en traduire un sur trois : une liste à moitié traduite se lit plus mal
 * qu'une liste qui ne l'est pas.
 */
const MOT_JOURNEE = { fr: 'Journée', en: 'Matchday', de: 'Spieltag', es: 'Jornada' };
function titreJournee(round) {
  const m = /^Regular Season\s*-\s*(\d+)$/i.exec(round ?? '');
  return m ? `${MOT_JOURNEE[LANGUE] ?? MOT_JOURNEE.fr} ${m[1]}` : (round || '—');
}

/**
 * La minute affichée. Le calcul vit dans `/horloge.js`, partagé avec le Grand
 * Virage et la page des matchs. Ce qui reste ici est le vocabulaire de cette
 * page — « MT », « PROL. » — et lui seul.
 */
function minuteDe(m, luA) {
  if (!m.live) return null;
  return window.TBF_HORLOGE?.texte(
    { statut: m.status, minute: m.elapsed, extra: m.extra, vuA: luA },
    { HT: 'MT', BT: 'PROL.' }) || null;
}

function ligneMatch(m, luA) {
  const joue = m.home.goals !== null && m.home.goals !== undefined;
  const d2 = new Date(m.date);
  const quand = m.live
    ? `<span class="live" data-live="${m.id}">${esc(minuteDe(m, luA) ?? '—')}</span>`
    : d2.toLocaleDateString(LANGUE, { day:'numeric', month:'short' }) + '<br>' +
      d2.toLocaleTimeString(LANGUE, { hour:'2-digit', minute:'2-digit' });
  return `<div class="m" data-m="${m.id}">
    <div class="s"><img src="${esc(m.home.logo)}" alt=""><span>${esc(m.home.name)}</span></div>
    ${joue ? `<div class="sc">${m.home.goals} – ${m.away.goals}</div>`
           : `<div class="when">${quand}</div>`}
    ${joue && m.live ? `<div class="when">${quand}</div>` : ''}
    <div class="s a"><span>${esc(m.away.name)}</span><img src="${esc(m.away.logo)}" alt=""></div>
  </div>`;
}

/**
 * Les résultats, journée par journée.
 *
 * La page ne montrait qu'une fenêtre de vingt jours autour d'aujourd'hui : ni
 * la troisième journée, ni la fin du calendrier. Le serveur rend maintenant
 * la saison entière et désigne la journée en cours ; il ne reste ici qu'à
 * offrir le menu qui permet d'en changer.
 *
 * Les flèches encadrent le menu déroulant plutôt que de le remplacer : d'une
 * journée à la voisine, c'est un geste au lieu de trois, et c'est le
 * déplacement qu'on fait vingt fois pour un qu'on fait au hasard.
 */
function rendreResultats(d) {
  RES = d;
  journee = d.journee;
  const js = d.journees ?? [];
  const rang = js.findIndex((j) => j.round === d.journee);

  const menu = js.length > 1 ? `
    <div class="journees">
      <button id="jprec" ${rang <= 0 ? 'disabled' : ''} aria-label="Journée précédente">‹</button>
      <select id="jsel" aria-label="Choisir une journée">${js.map((j) =>
        `<option value="${esc(j.round)}"${j.round === d.journee ? ' selected' : ''}
          >${esc(titreJournee(j.round))}</option>`).join('')}</select>
      <button id="jsuiv" ${rang < 0 || rang >= js.length - 1 ? 'disabled' : ''}
        aria-label="Journée suivante">›</button>
    </div>` : '';

  const corps = d.matchs.length
    ? (js.length > 1 ? '' : `<div class="round">${esc(titreJournee(d.journee))}</div>`)
      + d.matchs.map((m) => ligneMatch(m, d.luA)).join('')
    : '<div class="empty">Aucun match sur cette journée.</div>';

  $('list').innerHTML = menu + corps;

  if (js.length > 1) {
    const aller = (n) => {
      if (n < 0 || n >= js.length) return;
      journee = js[n].round;
      charger();
    };
    $('jsel').onchange = (e) => { journee = e.target.value; charger(); };
    $('jprec').onclick = () => aller(rang - 1);
    $('jsuiv').onclick = () => aller(rang + 1);
  }

  veiller(d.matchs.some((m) => m.live));
}

/* ------------------------------------------------------------ le direct

   Deux rythmes, et ce n'est pas un raffinement : la minute doit avancer
   chaque dizaine de secondes, alors qu'un score ne change qu'à un but. Faire
   courir les deux ensemble reviendrait à redemander la journée six fois par
   minute pour afficher un chiffre que le navigateur sait déjà calculer.      */

let minuterie = null;

function veiller(live) {
  clearTimeout(minuterie);
  if (!live) return;
  minuterie = setTimeout(() => {
    // Onglet caché : on ne redemande rien, on se rendort. Personne ne regarde.
    if (document.hidden) return veiller(true);
    if (vue === 'ligue' && onglet === 'resultats') charger();
  }, 30_000);
}

/** La minute, recalculée sur place à partir du relevé déjà reçu. */
setInterval(() => {
  if (!RES || vue !== 'ligue' || onglet !== 'resultats') return;
  for (const m of RES.matchs) {
    if (!m.live) continue;
    const n = document.querySelector(`[data-live="${m.id}"]`);
    if (n) n.textContent = minuteDe(m, RES.luA) ?? '—';
  }
}, 10_000);

function rendreJoueurs(d) {
  if (!d.players.length) return $('list').innerHTML = '<div class="empty">Classement indisponible.</div>';
  const col = onglet === 'scorers' ? ['BUTS', (p) => p.goals]
    : onglet === 'assists' ? ['PASSES', (p) => p.assists]
    : ['JAUNES', (p) => p.yellow];
  $('list').innerHTML = `<table>
    <thead><tr><th>#</th><th>JOUEUR</th><th>MJ</th><th>${col[0]}</th></tr></thead>
    <tbody>${d.players.map((p, i) => `
      <tr class="${i < 3 ? 'top3' : ''}">
        <td>${i + 1}</td>
        <td class="club"><img src="${esc(p.teamLogo)}" alt="">
          <span>${esc(p.name)}<br><small style="opacity:.45">${esc(p.team ?? '')}</small></span></td>
        <td>${p.played}</td>
        <td class="pts">${col[1](p)}</td>
      </tr>`).join('')}</tbody></table>`;
}

/* ======================================================= la ferveur

   Ce que les joueurs ont donné dans cette compétition — au Grand Virage et au
   Duel, qui comptent la même chose. Trois échelles, et elles ne récompensent
   pas la même vertu :

     — les **supporters**, sur ce que chacun a donné ;
     — les **tribunes**, c'est-à-dire les clubs, ramenés au nombre de leurs
       supporters : sans cette division, le plus gros gagne toujours et
       personne ne défend le sien ;
     — les **KOP**, ramenés au nombre de leurs membres, pour la même raison.

   Ces listes ne viennent pas du télétexte : elles sont calculées chez nous,
   sur ce que les joueurs ont fait. C'est la seule partie de cette page qui
   parle du jeu et non du football.                                          */

const ECHELLES = [['joueurs', 'SUPPORTERS'], ['tribunes', 'TRIBUNES'], ['kops', 'KOP']];
let echelle = 'joueurs';
/** La dernière réponse : changer d'échelle ne doit rien redemander. */
let FERVEUR = null;
/** La saison que le télétexte a retenue, transmise telle quelle au classement. */
let SAISON = null;

const rangTexte = (n) => (n === 1 ? '1er' : `${n}e`);

async function chargerFerveur() {
  const quelle = ligue;
  let d;
  try { d = await rang(`/competition/${ligue}${SAISON ? `?saison=${SAISON}` : ''}`); }
  catch (e) { return panne(e); }
  if (quelle !== ligue || vue !== 'ligue' || onglet !== 'ferveur') return;
  FERVEUR = d;
  rendreFerveur();
}

function rendreFerveur() {
  const d = FERVEUR;
  if (!d) return;

  const chips = `<div class="chips ech">${ECHELLES.map(([cle, titre]) =>
    `<button class="chip ${echelle === cle ? 'on' : ''}" data-e="${cle}">${titre}</button>`
  ).join('')}</div>`;

  /* La ligne du lecteur, au-dessus de la liste. Un classement de cinquante n'a
     d'intérêt que si on y figure ; pour tous les autres, « 312e sur 1 400 »
     vaut mieux que rien — et « personne n'a encore poussé » vaut mieux qu'un
     vide qu'on prend pour une panne. */
  const moi = d.moi && d.moi.rang
    ? `<div class="maplace">Tu es <b>${rangTexte(d.moi.rang)}</b> sur ${d.moi.sur}
         · ${d.moi.ferveur} de ferveur</div>`
    : d.moi
      ? '<div class="maplace vide">Tu n’as encore rien donné dans cette compétition.</div>'
      : '';

  const liste = d[echelle] ?? [];
  /* **Trois échelles, trois façons d'être vide — et une seule phrase pour les
     dire toutes, ce qui la rendait fausse deux fois sur trois.**
   *
   * Un supporter qui pousse **en neutre** n'appartient à aucune tribune : sa
   * ferveur compte pour lui et pour la compétition, jamais pour un club. Un
   * joueur sans KOP, pareil. Les deux tableaux sont alors vides **à juste
   * titre** — et ils annonçaient « personne n'a encore poussé » juste à côté
   * d'un onglet SUPPORTERS qui affichait trois cent soixante-quatre.
   *
   * Dire « personne n'a joué » quand quelqu'un vient de jouer, c'est envoyer
   * chercher une panne qui n'existe pas. Chaque échelle explique donc sa propre
   * absence, et l'explication est la règle du jeu, pas une excuse. */
  const aDeLaFerveur = (d.joueurs ?? []).length > 0;
  const RIEN = {
    joueurs: 'Personne n’a encore poussé dans cette compétition.<br>'
      + 'Le premier match en direct ouvre le Grand Virage.',
    /* **Ce tableau liste désormais tout le plateau**, poussé ou non : il n'est
       vide que si la compétition n'a aucun match pour la saison affichée. Le
       message d'avant — « personne n'a poussé pour un club d'ici » — décrivait
       une liste filtrée sur la ferveur, qui n'existe plus. Le garder ferait
       chercher une panne de jeu là où il manque des matchs. */
    tribunes: 'Aucune équipe pour cette saison.<br>'
      + 'Le plateau se remplit avec les matchs de la compétition.',
    kops: aDeLaFerveur
      ? 'De la ferveur a été donnée ici, mais par personne qui appartienne à un '
        + 'KOP de cette compétition.<br>Un KOP ne marque que ce que ses membres '
        + 'donnent <i>pour son club</i>.'
      : 'Aucun KOP n’a encore de ferveur dans cette compétition.',
  };
  $('list').innerHTML = chips + moi + (liste.length ? tableFerveur(liste)
    : `<div class="empty">${RIEN[echelle] ?? RIEN.joueurs}</div>`);

  $('list').querySelector('.ech').onclick = (e) => {
    const b = e.target.closest('[data-e]');
    if (!b || b.dataset.e === echelle) return;
    echelle = b.dataset.e;
    rendreFerveur();
  };
}

/**
 * Les trois tableaux.
 *
 * La colonne de droite n'est pas la même selon l'échelle, et c'est le point :
 * un supporter est classé sur ce qu'il a donné, un club et un KOP sur leur
 * **moyenne**. Afficher partout un total ferait croire que les trois listes
 * répondent à la même question.
 */
function tableFerveur(liste) {
  if (echelle === 'joueurs') {
    return `<table>
      <thead><tr><th>#</th><th>SUPPORTER</th><th>SÉANCES</th><th>FERVEUR</th></tr></thead>
      <tbody>${liste.map((p, i) => `
        <tr class="${i < 3 ? 'top3' : ''}">
          <td>${i + 1}</td>
          <td class="club"><span>${esc(p.pseudo)}<br>
            <small style="opacity:.45">${esc(p.club ?? '')}</small></span></td>
          <td>${p.seances}</td>
          <td class="pts">${p.ferveur}</td>
        </tr>`).join('')}</tbody></table>`;
  }
  if (echelle === 'tribunes') {
    /* **Le plateau entier, et non les seuls clubs déjà poussés.**

       La liste se tirait des lignes de ferveur : un club n'existait que si
       quelqu'un avait chanté pour lui, et une compétition de vingt équipes en
       montrait deux. On y cherchait le sien, on ne l'y trouvait pas, et rien ne
       disait s'il était mal classé ou absent du jeu.

       Les clubs à zéro sont donc là, en retrait — c'est une tribune à prendre,
       pas une ligne vide. Et les duels sont comptés à part de la ferveur : ils
       ne demandent ni le même temps ni le même geste que le virage. */
    return `<table>
      <thead><tr><th>#</th><th>CLUB</th><th>SUPP.</th><th>DUELS</th><th>MOYENNE</th></tr></thead>
      <tbody>${liste.map((t, i) => `
        <tr class="${i < 3 && t.moyenne > 0 ? 'top3' : ''}"${
            t.ferveur > 0 ? '' : ' style="opacity:.42"'}>
          <td>${t.ferveur > 0 ? i + 1 : '–'}</td>
          <td class="club"><img src="${esc(t.logo)}" alt=""><span>${esc(t.name)}</span></td>
          <td>${t.supporters}</td>
          <td>${t.duels ?? 0}</td>
          <td class="pts">${t.moyenne}</td>
        </tr>`).join('')}</tbody></table>`;
  }
  return `<table>
    <thead><tr><th>#</th><th>KOP</th><th>MEMBRES</th><th>MOYENNE</th></tr></thead>
    <tbody>${liste.map((k, i) => `
      <tr class="${i < 3 ? 'top3' : ''}">
        <td>${i + 1}</td>
        <td class="club"><img src="${esc(k.logo)}" alt=""><span>${esc(k.nom)}<br>
          <small style="opacity:.45">${esc(k.club ?? '')}</small></span></td>
        <td>${k.membres}</td>
        <td class="pts">${k.moyenne}</td>
      </tr>`).join('')}</tbody></table>`;
}

/* ------------------------------------------------------------ routage */

$('list').addEventListener('click', (e) => {
  /* L'étoile d'abord : elle est **dans** la ligne de la compétition, et sans
     ce retour anticipé un clic dessus ouvrirait aussi la compétition. */
  const f = e.target.closest('[data-fav]');
  if (f) { e.stopPropagation(); return basculer(Number(f.dataset.fav), f); }

  const l = e.target.closest('[data-l]');
  if (l) return ouvrir(Number(l.dataset.l));

  /* Un match mène à sa fiche, qui vit sur la page des matchs. On y envoie
     plutôt que de la recopier ici : c'est le même écran, avec le fil, les
     statistiques et les compositions — et un match de la quatrième journée
     n'est dans la journée de personne. */
  const m = e.target.closest('[data-m]');
  if (m) location.href = `/matchs?match=${m.dataset.m}`;
});

$('back').onclick = () => {
  // On nettoie l'adresse : revenir au sommaire puis rafraîchir ne doit pas
  // rouvrir la compétition qu'on vient de quitter.
  if (location.search) history.replaceState({}, '', '/teletext');
  sommaire();
};

/**
 * Ouverture directe d'une compétition via /teletext?ligue=207.
 * Sans cela, un lien depuis une fiche de match ramenait au sommaire, et il
 * fallait retrouver la compétition à la main parmi neuf cent cinquante.
 */
const demandee = Number(new URLSearchParams(location.search).get('ligue'));
if (Number.isInteger(demandee) && demandee > 0) {
  // Les favoris se chargent en parallèle : ils ne servent qu'au sommaire, et
  // faire attendre la compétition pour une étoile qu'on ne voit pas encore
  // serait un aller-retour de trop devant un écran vide.
  chargerFavoris();
  ouvrir(demandee);
} else {
  sommaire();
}
</script>
