<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes équipes — thebestfan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(120% 50% at 50% -8%,rgba(245,195,59,.13),transparent 60%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;padding:26px 16px 70px}
/* **Sous la barre, l'air d'une page, pas celui d'un bord d'écran.** La
   barre du haut (nav.js) remonte au bord de l'écran et laisse sous elle
   l'écart que la page avait au-dessus : vingt-six pixels, plus les huit
   dont le panneau du sous-titre (`.tbf-sous`) rentre dans sa boîte —
   trente-quatre de vide. Quand elle est là, six suffisent : quatorze
   pixels à l'œil entre la barre et le panneau. */
body:has(.tbf-haut){padding-top:6px}
main{width:100%;max-width:var(--colonne)}
h1{font-family:var(--banner);font-weight:600;font-size:21px;letter-spacing:.16em;margin:0 0 4px;text-align:center}
.search{position:relative;margin-bottom:14px}
/* Le champ se pose sur la photo de tribune : il prend le panneau opaque
   commun, sans quoi la foule passait sous ce qu'on tape. */
input{width:100%;background:var(--panneau);border:1px solid rgba(242,238,228,.16);border-radius:8px;
  color:var(--craie);padding:13px 14px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--projo)}
.results{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#171C23;z-index:5;
  border:1px solid rgba(242,238,228,.16);border-radius:8px;overflow:hidden;display:none}
.results.on{display:block}
.results button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:inherit;
  padding:11px 13px;cursor:pointer;font-family:inherit;font-size:14px;text-align:left;
  border-top:1px solid rgba(242,238,228,.07)}
.results button:first-child{border-top:0}
.results button:hover{background:rgba(242,238,228,.06)}
.results img,.club img{width:22px;height:22px;object-fit:contain;flex:none}
.results small{opacity:.88;font-size:11.5px}
/* La carte d'un club est un panneau opaque : les résultats et le calendrier
   étaient posés sur un voile noir à 25 %, c'est-à-dire sur la foule. */
.team{border:1px solid rgba(242,238,228,.13);border-radius:10px;background:var(--panneau);
  margin-bottom:12px;overflow:hidden}
.club{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid rgba(242,238,228,.09)}
.club img{width:28px;height:28px}
.club b{font-family:var(--banner);font-size:16px;letter-spacing:.03em;flex:1}
/* PRINCIPAL est un sticker craie (`.tbf-sticker`, ui.css), comme AVATAR et
   CAPO : il était écrit en or, en onze pixels, cerné d'or, et l'or ne
   s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). Il ne garde ici
   que l'air que sa boîte ne compte pas — six pixels à droite pour le bord et
   l'ombre, avant la croix. */
.club .main{margin-right:6px}
/* La croix qui retire un club : un bouton-icône, et il fait quarante-quatre
   pixels comme tout ce qui se touche. Il en faisait vingt-deux, à côté du nom
   du club qu'on vient voir — la marge négative rend la hauteur prise à la
   ligne, qui ne grandit pas. */
.club button{background:none;border:0;color:inherit;opacity:.7;cursor:pointer;font-size:18px;padding:0;
  min-width:44px;min-height:44px;margin:-10px -8px -10px 0;
  display:inline-flex;align-items:center;justify-content:center}
.match{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13.5px;
  border-top:1px solid rgba(242,238,228,.07)}
.match .side{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.match .side.away{justify-content:flex-end;text-align:right}
.match .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match img{width:18px;height:18px;object-fit:contain;flex:none}
.score{font-family:var(--banner);font-size:17px;letter-spacing:.06em;min-width:52px;text-align:center}
.when{font-size:11px;opacity:.88;min-width:52px;text-align:center;line-height:1.3}
.live{color:var(--flare);font-weight:600;font-size:11px;letter-spacing:.06em}
/* La minute, sous le score, pour qu’un match en cours ne ressemble pas à un
   match terminé. */
.score .live{display:block;font-size:11px;margin-top:3px;font-family:var(--ui)}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--flare);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.section{font-size:11px;letter-spacing:.14em;opacity:.88;padding:10px 14px 2px;text-transform:uppercase}
/* Le message d'une liste vide — ou d'un serveur muet — se posait à même la
   photo. Il a son panneau, comme le reste de la page. */
.empty{text-align:center;padding:44px 20px;opacity:.9;font-size:13.5px;line-height:1.7;
  background:var(--panneau);border:1px solid var(--trait);border-radius:var(--r)}
/* Les liens et le mot en gras du bandeau, en craie grasse : en or, sous
   quatorze pixels, ils ne tenaient pas au soleil (arbitrage du 2 octobre
   2026). */
.empty a{color:var(--craie);font-weight:700}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#171C23;
  border:1px solid var(--flare);border-radius:8px;padding:13px 18px;font-size:13.5px;z-index:20;
  box-shadow:0 12px 30px rgba(0,0,0,.6);max-width:90vw;display:none}
.flash.on{display:block;animation:rise .35s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.flash b{color:var(--craie);font-weight:700}
/* Le mot du serveur : un refus d'emplacement, et ce qu'il faut faire pour en
   sortir. Dans le flux de la page et non en bandeau flottant — il répond à un
   geste qu'on vient de faire juste au-dessus, et il doit rester lisible le
   temps de choisir quel club retirer. */
.mot{display:none;border:1px solid rgba(245,195,59,.45);
  background:linear-gradient(rgba(245,195,59,.09),rgba(245,195,59,.09)),var(--panneau);
  border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
/* Sa propre montée, pas celle du bandeau : `rise` porte le `translate(-50%)`
   qui centre un bandeau fixe, et le mot, qui est dans le flux, glissait d'une
   demi-largeur vers la gauche avant de sauter à sa place. */
.mot.on{display:block;animation:riseMot .3s cubic-bezier(.2,.8,.3,1)}
@keyframes riseMot{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Moins de mouvement, demandé au système ou dans le tiroir (le mode calme,
   contrat C4 — un sélecteur d'attribut n'entre pas dans une requête @media,
   d'où le double, règle pour règle). Le point du direct cesse de battre et
   reste allumé : c'est lui qui dit « en cours », pas son battement. Le
   bandeau d'un but et le mot du serveur paraissent à leur place, sans
   monter. */
@media (prefers-reduced-motion:reduce){
  .live::before,.flash.on,.mot.on{animation:none}
}
html[data-calme~="animations"] .live::before,
html[data-calme~="animations"] .flash.on,
html[data-calme~="animations"] .mot.on{animation:none}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app">
  <p class="tbf-sous" data-t="subtitle"></p>

  <div class="search">
    <input id="q" autocomplete="off" spellcheck="false">
    <div class="results" id="results"></div>
  </div>

  <!-- Ce que le serveur a refusé, et pourquoi. Sans cet endroit, un clic sur
       un club de trop ne produisait rien du tout — ce qui se lit comme une
       panne et fait recommencer. -->
  <div class="mot" id="mot"></div>

  <div id="feed"></div>
</main>
<div class="flash" id="flash"></div>

<!-- L'horloge du match : la même que sur la page des matchs et dans le
     Grand Virage. -->
<script src="/horloge.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const I18N = {
  fr:{title:'MES ÉQUIPES',subtitle:'résultats, calendrier, direct',search:'Chercher un club…',
    next:'à venir',last:'derniers résultats',live:'EN DIRECT',today:"aujourd'hui",tomorrow:'demain',
    empty:'Tu ne suis aucun club. Cherche-le ci-dessus pour voir ses résultats et recevoir ses buts en direct.',
    login:'Connecte-toi pour suivre tes clubs.',goal:'BUT DE {team}',goalSeul:'BUT !',
    nothing:'Aucun club trouvé.',main:'PRINCIPAL',plein:'Tu suis déjà {n} clubs sur {t}. Retire-en un, ou achète un emplacement depuis ton profil.',
    pleinSans:'Tu n’as plus d’emplacement libre. Retire un club, ou achète un emplacement depuis ton profil.',
    panne:'Le serveur ne répond pas. Tes clubs sont toujours là — la page se remet à jour toute seule.'},
  en:{title:'MY TEAMS',subtitle:'results, fixtures, live',search:'Search for a club…',
    next:'upcoming',last:'latest results',live:'LIVE',today:'today',tomorrow:'tomorrow',
    empty:'You follow no club yet. Search above to see its results and get its goals live.',
    login:'Sign in to follow your clubs.',goal:'{team} SCORES',goalSeul:'GOAL!',
    nothing:'No club found.',main:'MAIN',plein:'You already follow {n} clubs out of {t}. Remove one, or buy a slot from your profile.',
    pleinSans:'You have no free slot left. Remove a club, or buy a slot from your profile.',
    panne:'The server is not responding. Your clubs are still there — this page refreshes itself.'},
  de:{title:'MEINE TEAMS',subtitle:'Ergebnisse, Spielplan, live',search:'Verein suchen…',
    next:'kommende Spiele',last:'letzte Ergebnisse',live:'LIVE',today:'heute',tomorrow:'morgen',
    empty:'Du folgst noch keinem Verein. Suche oben, um Ergebnisse und Tore live zu bekommen.',
    login:'Melde dich an, um Vereinen zu folgen.',goal:'TOR FÜR {team}',goalSeul:'TOR!',
    nothing:'Kein Verein gefunden.',main:'HAUPT',plein:'Du folgst bereits {n} von {t} Vereinen. Entferne einen oder kaufe einen Platz im Profil.',
    pleinSans:'Du hast keinen freien Platz mehr. Entferne einen Verein oder kaufe einen Platz im Profil.',
    panne:'Der Server antwortet nicht. Deine Vereine sind noch da — die Seite aktualisiert sich von selbst.'},
  es:{title:'MIS EQUIPOS',subtitle:'resultados, calendario, directo',search:'Buscar un club…',
    next:'próximos',last:'últimos resultados',live:'EN DIRECTO',today:'hoy',tomorrow:'mañana',
    empty:'No sigues ningún club. Búscalo arriba para ver resultados y recibir sus goles en directo.',
    login:'Entra para seguir a tus clubes.',goal:'GOL DE {team}',goalSeul:'¡GOL!',
    nothing:'No se encontró ningún club.',main:'PRINCIPAL',plein:'Ya sigues {n} clubes de {t}. Quita uno o compra una plaza desde tu perfil.',
    pleinSans:'Ya no te queda ninguna plaza libre. Quita un club o compra una plaza desde tu perfil.',
    panne:'El servidor no responde. Tus clubes siguen ahí — la página se actualiza sola.'},
};
const LOCALES = ['fr','en','de','es'];
let locale = LOCALES.find(l => navigator.language.toLowerCase().startsWith(l)) || 'fr';
try { const s = localStorage.getItem('tbf_locale'); if (LOCALES.includes(s)) locale = s; } catch {}

let feed = [];
/* Le nombre d'emplacements. `null` tant qu'on ne l'a pas : on n'empêche alors
   rien, et c'est le serveur qui tranche — mieux vaut proposer un club de trop
   que d'en interdire un par excès de prudence. */
let slots = null;
let authed = true;
/** Le serveur a-t-il refusé de répondre ? Distinct de « la liste est vide ». */
let panne = false;
let watched = [];
let socket = null;

const $ = (id) => document.getElementById(id);
const t = (k, p = {}) => Object.entries(p).reduce((a,[x,v]) => a.replaceAll(`{${x}}`, v),
  (I18N[locale] ?? I18N.fr)[k] ?? k);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function applyLocale(){
  document.documentElement.lang = locale;
  try { localStorage.setItem('tbf_locale', locale); } catch {}
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('q').placeholder = t('search');
    /* Le choix de la langue **ne s’affiche plus ici**.

     Il promettait une application en quatre langues : deux pages sur dix-huit
     le sont. Un joueur qui choisissait « EN » voyait cette page basculer et
     tout le reste du jeu rester en français — ce qui se lit comme une
     traduction cassée, pas comme une traduction absente.

     La langue suit donc celle du navigateur, et les traductions restent
     dans le fichier : elles ne coûtent rien, et le jour où le jeu parlera
     vraiment quatre langues, cette page sera déjà prête. */
}


/**
 * Un appel qui rend toujours un état, et ne lève jamais.
 *
 * La forme `{ status, json }` est celle de `compte.html`, mais la protection
 * manquait : `fetch` lui-même rejette quand il n'y a pas de réseau — tunnel,
 * avion, coupure de wifi — et là aucun des trois gestionnaires de cette page
 * n'attrapait quoi que ce soit. Suivre un club hors ligne ne produisait rien du
 * tout : pas de club ajouté, pas de message, pas même une erreur visible.
 *
 * `status: 0` n'est pas un code HTTP, et c'est voulu : tout le code de cette
 * page juge sur « est-ce entre 200 et 299 », donc zéro se range du côté des
 * pannes sans qu'aucun appelant n'ait à connaître ce cas de plus. La phrase
 * « panne » existe déjà dans les quatre langues, et elle dit exactement ce
 * qu'il faut — les clubs sont toujours là, c'est la page qui n'a pas pu lire.
 */
const api = async (path, opts = {}) => {
  try {
    const res = await fetch('/api/football' + path, {
      method: opts.method ?? 'GET', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
    });
    return { status: res.status, json: await res.json().catch(() => ({})) };
  } catch {
    return { status: 0, json: {} };
  }
};

/* ------------------------------------------------------------ rendu */

/**
 * La date arrive soit en ISO ("2026-09-13T17:00:00.000Z") quand MySQL a
 * renvoyé un objet Date, soit en "2026-09-13 17:00:00" en chaîne brute.
 * Les deux formes doivent être lues comme de l'UTC.
 */
function toDate(v){
  if (v instanceof Date) return v;
  const s = String(v ?? '');
  if (!s) return null;
  const d = s.includes('T') ? new Date(s) : new Date(s.replace(' ', 'T') + 'Z');
  return Number.isNaN(d.getTime()) ? null : d;
}

/**
 * Quand se joue ce match — l'heure, la date, ou la minute s'il est en cours.
 *
 * La minute passait par `f.elapsed` tel quel : celle du dernier passage du
 * relevé, figée entre deux. Elle court maintenant depuis l’instant de ce
 * relevé, comme sur la page des matchs et dans le Grand Virage — même
 * horloge, même règle, un seul endroit où la corriger.
 */
/**
 * La minute d'un match en cours, ou '' s'il n'y a rien à dire.
 *
 * Le calcul vit dans `/horloge.js`, partagé avec la page des matchs et le
 * Grand Virage : il était écrit quatre fois, et celui d’ici était le seul
 * faux — il affichait `elapsed` tel quel, c'est-à-dire la minute du dernier
 * passage du relevé, figée entre deux.
 */
function enCours(f){
  if (!['1H','2H','HT','ET','P','BT','LIVE','INT'].includes(f.status_short)) return '';
  return window.TBF_HORLOGE.texte({
    statut: f.status_short, minute: f.elapsed, extra: f.elapsed_extra,
    // `luA` vient du serveur en millisecondes, calculé en SQL : voir la note
    // dans `football/store.js`. Le convertir ici a déjà figé la minute.
    vuA: f.luA == null ? null : Number(f.luA),
  }, { HT: `${t('live')} · MT` });
}

function when(f){
  const min = enCours(f);
  if (min) return `<span class="live">${min}</span>`;
  const d = toDate(f.kickoff_at);
  // Sans date, rien : un tiret entre deux équipes se lit comme un score.
  if (!d) return '';
  const days = Math.round((d - new Date().setHours(0,0,0,0)) / 864e5);
  const hm = d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
  if (days === 0) return `${t('today')}<br>${hm}`;
  if (days === 1) return `${t('tomorrow')}<br>${hm}`;
  return d.toLocaleDateString(locale, { day: 'numeric', month: 'short' }) + `<br>${hm}`;
}

/**
 * Une ligne de match : les deux clubs, et au milieu ce qu'il faut savoir.
 *
 * **Le score et la minute ensemble, s'il est en cours.** La ligne montrait
 * le score dès que les buts étaient connus — donc dès le coup d’envoi, un
 * 0–0 étant un score. Un match en cours ressemblait alors trait pour trait à
 * un match terminé : mêmes chiffres, rien pour les distinguer, et aucune
 * minute nulle part. On regardait « 1 – 0 » sans savoir si c'était fini.
 */
function matchRow(f){
  const played = f.home_goals !== null && f.away_goals !== null;
  const min = enCours(f);
  return `<div class="match" data-fixture="${f.id}">
    <div class="side"><img src="${esc(f.home_logo)}" alt=""><span>${esc(f.home_name)}</span></div>
    ${played ? `<div class="score">${f.home_goals} – ${f.away_goals}
                  ${min ? `<small class="live">${min}</small>` : ''}</div>`
             : `<div class="when">${when(f)}</div>`}
    <div class="side away"><span>${esc(f.away_name)}</span><img src="${esc(f.away_logo)}" alt=""></div>
  </div>`;
}

function render(){
  applyLocale();
  if (!authed) {
    $('feed').innerHTML = `<div class="empty">${t('login')}<br><br><a href="/compte">/compte</a></div>`;
    return;
  }
  /* **« Tu ne suis aucun club » était ce qu'on affichait quand le serveur ne
     répondait plus.** La liste retombait sur un tableau vide, et rien ne
     distinguait une panne d'une collection vide : quelqu'un qui suit trois
     clubs lisait qu'il n'en suit aucun, et était invité à les rechercher.

     C'est la faute la plus répandue de ce dépôt, et la plus cruelle ici :
     l'écran ne se contente pas de cacher ce qu'on a, il propose de le refaire.

     Le compte à rebours du rafraîchissement continue — toutes les
     quarante-cinq secondes — donc la page se répare toute seule dès que le
     serveur revient, sans que personne ait à recharger. */
  if (panne) {
    $('feed').innerHTML = `<div class="empty">${t('panne')}</div>`;
    return;
  }
  if (!feed.length) { $('feed').innerHTML = `<div class="empty">${t('empty')}</div>`; return; }

  $('feed').innerHTML = feed.map(row => `
    <div class="team" data-team="${row.team.id}">
      <div class="club">
        <img src="${esc(row.team.logo)}" alt="">
        <b>${esc(row.team.name)}</b>
        ${row.team.is_main ? `<span class="main tbf-sticker">${t('main')}</span>` : ''}
        <button data-unfollow="${row.team.id}" title="✕">✕</button>
      </div>
      ${row.live.length ? row.live.map(matchRow).join('') : ''}
      ${row.next.length ? `<div class="section">${t('next')}</div>` + row.next.map(matchRow).join('') : ''}
      ${row.last.length ? `<div class="section">${t('last')}</div>` + row.last.map(matchRow).join('') : ''}
    </div>`).join('');
}

$('feed').onclick = async e => {
  const b = e.target.closest('[data-unfollow]');
  if (!b) return;
  const r = await api('/follows/' + b.dataset.unfollow, { method: 'DELETE' });
  /* **Le retrait aussi doit dire quand il rate.**
     La réponse était jetée. Un refus — session expirée, serveur muet — laissait
     donc le club en place après le rechargement, sans un mot : on clique, le
     club reste, on reclique. C'est mot pour mot le défaut que le commentaire du
     bouton « suivre », plus bas, dit avoir corrigé ; il n'avait été corrigé que
     d'un côté. */
  if (r.status === 401) { authed = false; render(); return; }
  if (!(r.status >= 200 && r.status < 300)) { dire(t('panne')); return; }
  await load();
};

/* --------------------------------------------------------- recherche */

let timer = null;
$('q').oninput = () => {
  clearTimeout(timer);
  const term = $('q').value.trim();
  if (term.length < 3) { $('results').classList.remove('on'); return; }
  timer = setTimeout(async () => {
    const r = await api('/search?q=' + encodeURIComponent(term));
    /* Une recherche qui n'aboutit pas n'est pas une recherche sans résultat :
       afficher « Aucun club trouvé » alors que le serveur n'a pas répondu
       apprend au joueur que son club n'existe pas. */
    if (!(r.status >= 200 && r.status < 300)) {
      $('results').classList.remove('on');
      dire(t('panne'));
      return;
    }
    const list = r.json.teams ?? [];
    // Plus de place : on le dit **avant** le clic, et les résultats restent
    // visibles — on peut vouloir regarder sans suivre.
    const plein = slots !== null && feed.length >= slots
      && !list.some((x) => feed.some((row) => row.team.id === x.id));
    if (plein) dire(t('plein', { n: feed.length, t: slots }));
    $('results').innerHTML = list.length
      ? list.map(x => `<button data-follow="${x.id}"
          ${plein && !feed.some((row) => row.team.id === x.id) ? 'disabled' : ''}>
          <img src="${esc(x.logo)}" alt="">
          <span>${esc(x.name)}</span> <small>${esc(x.country ?? '')}</small></button>`).join('')
      : `<button disabled style="opacity:.88">${t('nothing')}</button>`;
    $('results').classList.add('on');
  }, 320);
};

$('results').onclick = async e => {
  const b = e.target.closest('[data-follow]');
  if (!b) return;
  $('results').classList.remove('on');
  $('q').value = '';
  const r = await api('/follows', { method: 'POST', body: { teamId: Number(b.dataset.follow) } });
  if (r.status === 401) { authed = false; render(); return; }
  /* Le refus d'emplacement doit se voir. La page ignorait la réponse : on
     cliquait, rien ne se passait, et le club n'apparaissait pas — ce qui se
     lit comme une panne et fait recommencer. Le serveur envoie le compte et
     le plafond ; on les écrit. */
  /* Sans le compte ou le plafond, la phrase se dit sans chiffres : « Tu suis
     déjà ? clubs sur ? » affichait deux points d'interrogation à la place de
     deux nombres, ce qui se lit comme une panne et non comme une règle. */
  if (r.json?.error === 'onboarding.error.no_slot') {
    const n = r.json.suivis ?? feed.length;
    const plafond = r.json.slots ?? slots;
    dire(plafond ? t('plein', { n, t: plafond }) : t('pleinSans'));
    return;
  }
  /* Une panne réseau n'a pas de code à montrer : `dire(r.json.error)` plus bas
     écrirait « undefined » à l'écran, et le joueur croirait avoir cassé quelque
     chose. On la nomme avant d'arriver là. */
  if (r.status === 0) { dire(t('panne')); return; }
  if (r.json?.error) { dire(r.json.error); return; }
  await load();
};

/** Un mot au joueur, trois secondes. */
function dire(texte) {
  const n = $('mot');
  n.textContent = texte;
  n.classList.add('on');
  clearTimeout(n._t);
  n._t = setTimeout(() => n.classList.remove('on'), 4500);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search')) $('results').classList.remove('on');
});

/* ------------------------------------------------------------ direct */

// Le direct est un bonus : si socket.io n'est pas joignable, la page doit
// continuer à afficher calendrier et résultats, en se rafraîchissant seule.
function watch(){
  if (!socket?.connected) return;
  const ids = feed.map(r => r.team.id);
  if (JSON.stringify(ids) === JSON.stringify(watched)) return;
  if (watched.length) socket.emit('football:unwatch', watched);
  watched = ids;
  if (ids.length) socket.emit('football:watch', ids);
}

function connectLive(){
  if (typeof io === 'undefined') {
    console.warn('temps réel indisponible : la page se rafraîchira toute seule');
    return;
  }
  try {
    // Voir duel-nvn.html : l’ordre inverse abandonne au lieu de replier.
    socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });
  } catch (e) {
    console.warn('temps réel indisponible :', e.message);
    return;
  }
  socket.on('connect', watch);
  socket.on('connect_error', (e) => console.warn('socket:', e.message));
  socket.on('football:fixture', () => load());
  socket.on('football:goal', onGoal);
}

function onGoal(g){
  const mine = feed.some(r => r.team.id === g.teamId);
  const team = g.teamId === g.home?.id ? g.home?.name : g.away?.name;
  const el = $('flash');
  /* Le buteur et la minute ne s'écrivent que s'ils sont connus. Ils étaient
     dans la phrase traduite : sans eux, le bandeau finissait par « — ′ », un
     tiret et un signe de minute autour de rien, ce qui se lit comme une
     donnée perdue. Sans équipe, il dit le but, et c'est tout. */
  const qui = [
    g.player ? esc(g.player) : '',
    g.minute != null && g.minute !== '' ? `${esc(g.minute)}′` : '',
  ].filter(Boolean).join(' ');
  const tete = team ? t('goal', { team: esc(team) }) : t('goalSeul');
  el.innerHTML = (mine ? '<b>' : '') + tete + (qui ? ` — ${qui}` : '') + (mine ? '</b>' : '');
  el.className = 'flash on';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'flash'; }, 6000);
  load();
}

/* -------------------------------------------------------- chargement */

async function load(){
  const r = await api('/feed').catch(() => ({ status: 0, json: {} }));
  if (r.status === 401) { authed = false; render(); return; }
  authed = true;
  /* Tout ce qui n'est pas un succès est une panne, et se dit comme telle. Le
     statut voyage à côté du corps — c'est tout l'intérêt de la forme que rend
     `api` — donc on n'a pas à deviner en regardant un objet vide. */
  panne = !(r.status >= 200 && r.status < 300);
  if (panne) { render(); return; }
  feed = r.json.feed ?? [];
  /* Combien de clubs on a le droit de suivre. C'est le **même écran** qui
     propose d'en ajouter et qui connaît la limite : ne pas la lire ici, c'est
     laisser le joueur choisir un club puis se faire refuser après coup. Cette
     faute-là s'est déjà répétée trois fois dans ce jeu — le kiosque, le deck,
     et ici. En arrière-plan et sans faire échouer la page : un plafond inconnu
     vaut mieux qu'une liste de clubs qui ne s'affiche pas. */
  try {
    const etat = await (await fetch('/api/me/state', { credentials: 'same-origin' })).json();
    slots = Number(etat?.slots?.total) || null;
  } catch { /* on s'en passera : le serveur refusera, avec ses mots */ }
  render();
  watch();
}

applyLocale();
connectLive();
load();
// Filet de sécurité : même sans temps réel, la page reste à jour.
setInterval(load, 45_000);
</script>
