<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}

.carte{position:relative;margin:14px 14px 0;border-radius:16px;overflow:hidden;
  border:1px solid rgba(242,238,228,.14);min-height:150px;display:flex;flex-direction:column;
  justify-content:flex-end;padding:16px;background:#0B0F14}
.carte .fond{position:absolute;inset:0;background-size:cover;background-position:center 28%;opacity:.55}
.carte .ombre{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,6,10,.15),rgba(4,6,10,.9))}
.carte .txt{position:relative;z-index:2}
.carte h1{font-family:var(--banner);font-size:27px;letter-spacing:.05em;margin:0;line-height:1}
.carte .club{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;opacity:.78}
.carte .club img{width:22px;height:22px;object-fit:contain}
.carte .depuis{font-size:10.5px;opacity:.5;margin-top:6px;letter-spacing:.04em}
.badge{position:absolute;top:14px;right:14px;z-index:2;font-family:var(--banner);font-size:9.5px;
  letter-spacing:.14em;border-radius:5px;padding:4px 9px;border:1px solid var(--projo);color:var(--projo)}
.badge.warn{border-color:var(--flare);color:var(--flare)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 14px 0}
.stat{border:1px solid rgba(242,238,228,.11);border-radius:10px;padding:10px 5px;text-align:center;
  background:var(--panneau);backdrop-filter:blur(10px)}
.stat b{display:block;font-family:var(--banner);font-size:19px;color:var(--c,var(--projo));line-height:1}
.stat span{font-size:9px;opacity:.5;letter-spacing:.08em;display:block;margin-top:5px}

h2{font-family:var(--banner);font-size:11px;letter-spacing:.2em;opacity:.42;margin:22px 16px 9px}
.bloc{margin:0 14px;border:1px solid rgba(242,238,228,.11);border-radius:12px;overflow:hidden;
  background:var(--panneau);backdrop-filter:blur(10px)}
.ligne{display:flex;align-items:center;gap:11px;padding:13px 14px;
  border-top:1px solid rgba(242,238,228,.07);font-size:13.5px}
.ligne:first-child{border-top:0}
.ligne img{width:24px;height:24px;object-fit:contain}
.ligne .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .v{opacity:.55;font-size:12.5px}
.ligne .main{font-family:var(--banner);font-size:9px;letter-spacing:.12em;color:var(--projo);
  border:1px solid rgba(245,195,59,.45);border-radius:4px;padding:2px 6px}
.ligne button{background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:17px;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.vide{padding:18px 14px;font-size:12.5px;opacity:.45;text-align:center;line-height:1.6}
.vide a{color:var(--projo)}


/* --------------------------------------------------- le chemin du niveau

   Un joueur ne voyait de son niveau qu'une pastille sur l'accueil : un chiffre,
   sans jauge, sans suite, sans rien qui dise à quoi il sert. Monter d'un niveau
   n'était donc jamais attendu, et le palier qui ouvre un troisième Fanzzy au
   deck arrivait comme une surprise chez ceux qui le remarquaient.

   Le chemin montre **où l'on est et ce qui vient** : la marche en cours, sa
   jauge, puis les suivantes avec ce que chacune ouvre. */
.niv-tete{display:flex;align-items:center;gap:12px;padding:13px 14px 10px}
.niv-rond{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--banner);font-size:22px;line-height:1;color:var(--projo);
  background:radial-gradient(circle,rgba(245,195,59,.18),transparent 70%);
  box-shadow:inset 0 0 0 2px var(--projo),0 0 22px -6px rgba(245,195,59,.7)}
.niv-rond small{display:block;font-size:7px;letter-spacing:.16em;opacity:.55;
  color:var(--craie);margin-top:2px}
.niv-txt{flex:1;min-width:0}
.niv-txt b{display:block;font-family:var(--banner);font-size:14px;letter-spacing:.04em}
.niv-txt span{display:block;font-size:10.5px;opacity:.5;margin-top:3px}
.niv-jauge{height:8px;border-radius:5px;background:rgba(242,238,228,.1);overflow:hidden;
  margin:7px 14px 0;position:relative}
.niv-jauge i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#B98A14,var(--projo));
  /* La jauge **pousse** au chargement : c'est le seul moment où l'on voit
     l'avancée bouger, et un trait déjà posé ne se lit pas comme un progrès. */
  transition:width .9s cubic-bezier(.2,.9,.25,1)}
.niv-jauge::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);
  background-size:260% 100%;animation:jauge 3.4s ease-in-out infinite}
@keyframes jauge{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}

/* Les marches. Elles défilent horizontalement : le chemin continue au-delà de
   l'écran, et c'est exactement ce qu'on veut faire sentir. */
.marches{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 14px;scrollbar-width:none}
.marches::-webkit-scrollbar{display:none}
.marche{flex:none;width:118px;border-radius:11px;padding:10px;position:relative;
  border:1px solid rgba(242,238,228,.1);background:rgba(0,0,0,.24)}
.marche.faite{opacity:.42}
.marche.ici{border-color:var(--projo);background:rgba(245,195,59,.08)}
.marche .r{font-family:var(--banner);font-size:9px;letter-spacing:.14em;opacity:.5}
.marche.ici .r{color:var(--projo);opacity:1}
.marche .n{font-family:var(--banner);font-size:17px;line-height:1.1;margin-top:3px}
.marche ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.marche li{font-size:10px;opacity:.72;line-height:1.35;padding-left:11px;position:relative}
.marche li::before{content:"";position:absolute;left:0;top:5px;width:5px;height:5px;
  border-radius:50%;background:var(--projo);opacity:.7}
/* Un palier qui ouvre vraiment quelque chose se distingue d'une marche
   ordinaire : sinon le chemin n'est qu'une suite de chiffres. */
.marche.cle{box-shadow:0 0 0 1px rgba(245,195,59,.4),0 0 22px -8px rgba(245,195,59,.8)}

/* ------------------------------------------------------- le parcours

   Ce qu'un joueur a joué, et ce que ça lui a rapporté. Le profil listait ce
   qu'il **possède** — des clubs, un Fanzzy, de l'équipement — et rien de ce
   qu'il a **fait** : une carte de membre sans carnet de bord.

   Deux blocs : le compte par sorte de partie, puis la liste. Le compte est une
   grille de deux colonnes plutôt qu'un tableau — il faut qu'elle tienne sur un
   téléphone, et un tableau à six colonnes n'y tient pas. */
.sortes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:12px}
.sorte{border:1px solid rgba(242,238,228,.1);border-radius:10px;padding:10px 11px;
  background:rgba(0,0,0,.22)}
.sorte .q{font-family:var(--banner);font-size:9.5px;letter-spacing:.12em;
  color:var(--c,var(--projo))}
.sorte .n{font-family:var(--banner);font-size:20px;line-height:1.1;margin-top:5px}
.sorte .n small{font-family:var(--ui);font-size:10px;opacity:.45;letter-spacing:.06em}
.sorte .d{font-size:10.5px;opacity:.55;margin-top:5px;line-height:1.45}
/* La ferveur : c'est le nombre que le joueur vient chercher, il est donc à part
   et il ne se confond pas avec un compte de parties. */
.sorte .f{font-family:var(--banner);font-size:11.5px;color:var(--projo);margin-top:6px}

.parcours{display:flex;flex-direction:column}
.part{display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-top:1px solid rgba(242,238,228,.07)}
.part:first-child{border-top:0}
/* La pastille dit d'un coup lequel des deux jeux c'était : or pour le virage,
   violet pour le duel — les couleurs que ces deux écrans portent déjà. */
.part .jeu{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--banner);font-size:8px;letter-spacing:.06em;
  border:1px solid var(--c,var(--projo));color:var(--c,var(--projo))}
.part .qui{flex:1;min-width:0}
.part .qui b{display:block;font-size:12.5px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .qui span{display:block;font-size:10px;opacity:.5;margin-top:3px;letter-spacing:.03em}
.part .gain{flex:none;text-align:right}
.part .gain b{display:block;font-family:var(--banner);font-size:14px;color:var(--projo);line-height:1}
.part .gain span{display:block;font-size:9px;opacity:.45;letter-spacing:.1em;margin-top:3px}
/* L'issue d'un duel se lit à la couleur avant de se lire au mot. */
.part .issue{font-family:var(--banner);font-size:9px;letter-spacing:.1em;
  border-radius:4px;padding:2px 6px;border:1px solid currentColor}
.part .issue.win{color:var(--vert)}
.part .issue.loss{color:var(--flare)}
.part .issue.draw{color:var(--gris,#C2CAD6)}
.encore{width:100%;background:none;border:0;border-top:1px solid rgba(242,238,228,.07);
  color:var(--projo);padding:13px;font-family:var(--banner);font-size:10.5px;
  letter-spacing:.14em;cursor:pointer}
.encore:disabled{opacity:.35;cursor:default}

/* **Les deux emplacements ont disparu, et le sac reste.**

   Il y avait ici deux emplacements d'équipement, avec de quoi y poser une
   pièce. Ils ne décidaient de rien. L'équipement qui compte est attaché
   **à chaque Fanzzy du deck** — deux pièces chacun — et c'est celui-là que
   le Virage et le duel lisent, tous deux par `decks.loadout`. Les deux
   emplacements de cette page vivaient dans `user_stuff.slot`, que personne
   d'autre que cette page ne relisait.

   Un écran qui laisse équiper sans que ça change quoi que ce soit est pire
   qu'un écran vide : le joueur croit son choix fait, et il ne l'est pas. Le
   sac, lui, reste — dire ce qu’on possède est le travail de cette page.
   Équiper est le travail du deck, et la ligne du dessous y mène. */
.sac{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.obj{border:1px solid rgba(242,238,228,.14);border-radius:8px;padding:7px 10px;font-size:11px;
  background:rgba(0,0,0,.3)}
/* La vignette du sac : petite, juste de quoi reconnaître la forme avant
   d'avoir lu le nom. */
.obj{display:inline-flex;align-items:center;gap:6px}
.obj .vignette{width:20px;height:20px;object-fit:contain;flex:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

.langues{display:flex;gap:6px;padding:12px}
/* Quarante-quatre pixels de haut : ce sont quatre cibles côte à côte sur un
   téléphone, et elles faisaient vingt-sept. Changer de langue par erreur remet
   l'écran dans une langue qu'on ne lit pas — la faute la plus pénible à
   défaire, puisque le bouton pour revenir est lui aussi traduit. */
.langues button{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.16);border-radius:8px;
  color:inherit;padding:9px;min-height:44px;font-family:var(--banner);font-size:12px;cursor:pointer;opacity:.55}
.langues button.on{background:var(--craie);color:#0B0E13;border-color:var(--craie);opacity:1}

.actions{padding:22px 14px 30px;display:flex;flex-direction:column;gap:9px}
.btn{padding:14px;font-size:14px;letter-spacing:.08em;width:100%}
/* **Discret ne veut pas dire illisible.** Ce lien doit se trouver quand on le
   cherche et jamais se cliquer par accident : il est donc petit, souligné, et
   tout en bas. Il était aussi à 60 % d'opacité, ce qui le posait à 2,3:1 sur le
   fond — sous le seuil, et sur le seul écran où se tromper est irréversible.

   La retenue vient maintenant de la taille et de la place, pas de l'effacement.
   Le rouge est éclairci pour tenir les 4,5:1 (il est à 7:1) sans devenir un
   bouton qui appelle. */
.btn.danger{border:0;background:none;color:#E8756A;font-size:11.5px;letter-spacing:.04em;
  font-family:var(--ui);text-decoration:underline;padding:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#171C23;z-index:80;
  border:1px solid rgba(242,238,228,.2);border-radius:8px;padding:11px 16px;font-size:12.5px;display:none}
.toast.on{display:block}
.spin{width:24px;height:24px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(1turn)}}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>

  <div class="bloc">

<script>
/* =======================================================================
   Profil.
   Tout ce qui concerne le joueur au même endroit : son identité, ses clubs,
   son Fanzzy, son équipement, sa langue — et la sortie.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

async function api(base, path, body, method) {
  const r = await fetch(base + path, {
    method: method ?? (body === undefined ? 'GET' : 'POST'),
    headers: { 'content-type': 'application/json' },
    credentials: 'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (j.error) throw Object.assign(new Error(j.error), { code: j.error });
  return j;
}
const me = (p, b, m) => api('/api/me', p, b, m);
const auth = (p, b, m) => api('/api/auth', p, b, m);

function toast(t) {
  const el = $('toast'); el.textContent = t; el.className = 'toast on';
  clearTimeout(el._t); el._t = setTimeout(() => { el.className = 'toast'; }, 2600);
}

let user = null, etat = null, catalogue = null, loadout = null, souvenirs = [];



/* --------------------------------------------------- le chemin du niveau

   Le joueur ne voyait de son niveau qu'une pastille sur l'accueil : un chiffre,
   sans jauge, sans suite, sans rien qui dise à quoi il sert. Monter d'un niveau
   n'était jamais attendu, et le palier qui ouvre un troisième Fanzzy au deck
   arrivait comme une surprise chez ceux qui le remarquaient.

   Le serveur envoie la **donnée** — le rang et ce qu'il ouvre — et cette page
   la met en mots. C'est le partage habituel : le serveur compte, l'écran nomme.
   Une page qui porterait sa propre copie de la table finirait par promettre un
   déblocage que le serveur refuse. */

/** Combien de marches on montre devant soi. Au-delà, ce n'est plus un but. */
const MARCHES = 6;

/** Ce qu'une marche ouvre, en toutes lettres. */
function ouvre(palier, echarpes) {
  const l = [];
  if (echarpes) l.push(`${echarpes} écharpes`);
  /* Les deux seuls déblocages du jeu, et ils s'écrivent en clair : « slots: 4 »
     ne veut rien dire pour personne. Le niveau **ouvre**, il ne rend jamais
     plus fort — c'est la règle du jeu, et la formulation doit la porter. */
  if (palier?.slots) l.push(`${palier.slots}ᵉ club à suivre`);
  if (palier?.deckFanzzy) l.push(`${palier.deckFanzzy}ᵉ Fanzzy au deck`);
  return l;
}

function rendreNiveau(n) {
  const hote = $('niveau');
  const parNiveau = new Map((n.paliers ?? []).map((p) => [p.niveau, p]));

  /* La marche en cours, puis les suivantes. On s'arrête au dernier niveau :
     au-delà l'XP continue de compter mais n'ouvre plus rien, et proposer des
     marches qui n'existent pas serait une promesse en l'air. */
  const marches = [];
  for (let k = n.niveau; k < n.niveau + MARCHES && k <= (n.niveauMax ?? 30); k++) {
    const p = parNiveau.get(k);
    marches.push({ niveau: k, palier: p,
      echarpes: p?.echarpes ?? 10 * k, ici: k === n.niveau, cle: Boolean(p) });
  }

  const part = n.max ? 1 : Math.max(0, Math.min(1, n.part ?? 0));
  hote.innerHTML = `
    <div class="niv-tete">
      <div class="niv-rond">${n.niveau}<small>NIVEAU</small></div>
      <div class="niv-txt">
        <b>${n.max ? 'Dernier niveau atteint' : `Vers le niveau ${n.niveau + 1}`}</b>
        <span>${n.max ? `${n.xp} XP au total`
          : `${n.dans} / ${n.pour} XP · encore ${Math.max(0, n.pour - n.dans)}`}</span>
      </div>
    </div>
    <div class="niv-jauge"><i style="width:0"></i></div>
    <div class="marches">${marches.map((m) => `
      <div class="marche ${m.ici ? 'ici' : ''} ${m.cle ? 'cle' : ''}">
        <div class="r">${m.ici ? 'TU Y ES' : 'NIVEAU'}</div>
        <div class="n">${m.niveau}</div>
        <ul>${ouvre(m.palier, m.echarpes).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>`).join('')}</div>`;

  /* La jauge **pousse** après le rendu : c'est le seul moment où le joueur voit
     son avancée bouger. Posée à sa largeur finale d'emblée, elle se lirait comme
     un trait, pas comme un progrès. Deux images successives, sinon le navigateur
     regroupe les deux styles et l'animation n'a pas lieu. */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const i = hote.querySelector('.niv-jauge i');
    if (i) i.style.width = `${Math.round(part * 100)}%`;
  }));
}

async function chargerNiveau() {
  try {
    rendreNiveau(await api('/api/niveau', ''));
  } catch {
    /* La progression est un module facultatif : sans lui, le profil doit
       s'afficher quand même, et le dire plutôt que laisser un bloc vide. */
    $('niveau').innerHTML =
      '<div class="vide">Ta progression n’est pas lisible pour le moment.</div>';
  }
}

/* ------------------------------------------------------ le parcours

   Ce que le joueur a joué, et ce que ça lui a rapporté. Le profil disait ce
   qu'il **possède** — des clubs, un Fanzzy, de l'équipement — et rien de ce
   qu'il a **fait** : une carte de membre sans carnet de bord. Tout était en
   base depuis le premier jour ; rien ne le lisait.

   Les libellés sont écrits ici et les nombres viennent du serveur. Ce partage
   n'est pas cosmétique : le jour où l'entraînement cessera de compter au
   classement, c'est une règle du serveur qui changera, et cette page ne doit
   pas en porter une copie. Elle ne fait que nommer. */

const NOM_SORTE = { entrainement: 'ENTRAÎNEMENT', classe: 'CLASSÉ' };

/** Le titre d'une sorte de partie : « CLASSÉ · 2v2 », « GRAND VIRAGE ». */
function titreSorte(s) {
  if (s.jeu === 'virage') return 'GRAND VIRAGE';
  const mode = NOM_SORTE[s.mode] ?? String(s.mode ?? '').toUpperCase();
  /* Le format manque sur les parties d'avant qu'on l'écrive. On dit « DUEL »
     plutôt que d'inventer un format : une case vide est une vérité, un « 1v1 »
     supposé est un mensonge qui a l'air d'une donnée. */
  return s.format ? `${mode} · ${s.format}` : `${mode} · DUEL`;
}

function rendreParcours(p, { ajouter = false } = {}) {
  const hote = $('parcours');

  const sortes = (p.sortes ?? []).map((s) => {
    const couleur = s.jeu === 'virage' ? 'var(--projo)'
      : s.mode === 'classe' ? 'var(--violet)' : 'var(--gris,#C2CAD6)';
    /* Un virage ne se gagne ni ne se perd : on y pousse. Lui coller un bilan
       de victoires y mettrait une notion qui n'existe pas dans ce jeu-là. */
    const bilan = s.jeu === 'virage'
      ? `${s.joues} match${s.joues > 1 ? 's' : ''} poussé${s.joues > 1 ? 's' : ''}`
      : `${s.gagnes} gagné${s.gagnes > 1 ? 's' : ''} · ${s.nuls} nul${s.nuls > 1 ? 's' : ''}`
        + ` · ${s.perdus} perdu${s.perdus > 1 ? 's' : ''}`;
    return `<div class="sorte" style="--c:${couleur}">
      <div class="q">${esc(titreSorte(s))}</div>
      <div class="n">${s.joues}<small> partie${s.joues > 1 ? 's' : ''}</small></div>
      <div class="d">${esc(bilan)}</div>
      <div class="f">${s.ferveur} ferveur</div>
    </div>`;
  }).join('');

  /* Sous le gros chiffre : le score d'un duel, sinon le mot « ferveur ». L'XP
     s'y ajoute quand on la connaît — elle est nulle pour les parties d'avant la
     colonne, et écrire « +0 XP » serait un mensonge là où la vérité est « on ne
     sait pas ». C'est ce qu'on regarde en premier après une partie, et le
     parcours n'en montrait rien. */
  const gain = (l, score) => {
    const bouts = [score || 'FERVEUR'];
    if (l.xp) bouts.push(`+${l.xp} XP`);
    return bouts.join(' · ');
  };

  const lignes = (p.lignes ?? []).map((l) => {
    const virage = l.jeu === 'virage';
    /* **La couleur dit si ça a compté**, comme les tuiles du haut : l'or du
       virage, le violet du duel classé, le gris de l'entraînement. Toutes les
       lignes de duel étaient violettes, classées ou non — la page disait donc
       le contraire de son propre résumé, deux centimètres plus haut. */
    const couleur = virage ? 'var(--projo)'
      : l.mode === 'classe' ? 'var(--violet)' : 'var(--gris,#C2CAD6)';
    const quand = new Date(l.quand).toLocaleString(document.documentElement.lang || 'fr',
      { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    /* **Le titre dit le sujet de la partie.** Pour un virage, c'est le match :
       on y est venu pour lui. Pour un duel, c'est l'adversaire — « perdu contre
       Marie » se raconte, « perdu sur Sion – Bâle » ne dit rien de ce qui s'est
       passé. Le match redescend alors d'une ligne, où il reste lisible. */
    /* **« Match inconnu » accusait le jeu d'avoir perdu une partie.**

       Il n'en avait perdu aucune : `fixtures` est un cache des compétitions
       suivies, et un duel joué sur un match qui n'y figure pas gardait son
       identifiant sans qu'on sache le nommer. La partie, elle, était entière —
       l'issue, le score, la ferveur, l'adversaire et le club soutenu, tout
       était là. Seul le nom des deux équipes manquait, et la phrase en faisait
       une panne.

       Trois états, donc, et non deux : un match nommé, un match qu'on ne sait
       plus nommer, et pas de match du tout. */
    const rencontre = l.match
      ? `${l.match.domicile} – ${l.match.exterieur}`
      : l.oublie ? 'match non répertorié' : 'hors match';
    const contre = virage ? rencontre
      : l.adversaire ? `contre ${l.adversaire}`
      : l.contreBot ? 'contre un bot' : rencontre;
    /* Ce qu'on lit dessous : la sorte de partie, la compétition, le club poussé,
       et la date. « Neutre » est dit, parce que c'est ce qui divise la ferveur
       par deux — une règle qu'on ne découvre sinon qu'en comparant deux
       soirées. Et « entraînement », parce que c'est ce qui décide si la partie
       pèse quelque part : la ligne ne le disait nulle part. */
    const sorte = virage ? null
      : l.mode === 'classe' ? 'classé' : 'entraînement';

    /* **Qui était là.** `opponent_id` ne nommait qu'un adversaire, pris au
       hasard : sur un 3v3 il en taisait cinq. On dit maintenant les deux camps
       — les coéquipiers d'abord, parce qu'on cherche d'abord avec qui on a
       joué — et les machines sont comptées plutôt que passées sous silence.
       « contre Marie et 2 bots » est une phrase vraie ; « contre Marie » sur un
       3v3 en est une fausse. */
    const gens = (liste, bots) => {
      const noms = [...(liste ?? [])];
      if (bots > 0) noms.push(`${bots} bot${bots > 1 ? 's' : ''}`);
      if (!noms.length) return null;
      if (noms.length === 1) return noms[0];
      return `${noms.slice(0, -1).join(', ')} et ${noms[noms.length - 1]}`;
    };
    const coequipiers = virage ? null : gens(l.avec, l.botsAvec);
    const adversaires = virage ? null : gens(l.contre, l.botsContre);

    /* La durée, dite comme on la dit à voix haute. Les secondes seules sous la
       minute : un abandon à la trentième seconde doit se lire comme tel, et
       « 0 min » le cacherait. */
    const duree = l.duree == null ? null
      : l.duree < 60 ? `${l.duree} s`
      : `${Math.round(l.duree / 60)} min`;

    /* **La tribune tenue, même en neutre.** `pour` vaut nul pour un neutre : on
       ne savait donc pas de quel côté il s'était rangé, alors que c'est la
       seule chose qui situe un duel. Le camp le dit, et « neutre » reste dit à
       côté parce que c'est ce qui divise la ferveur par deux. */
    const tribune = l.pour ?? l.camp;

    const sous = [sorte,
                  coequipiers ? `avec ${coequipiers}` : null,
                  adversaires ? `contre ${adversaires}` : null,
                  virage ? null : (l.adversaire || l.contreBot
                    || coequipiers || adversaires ? rencontre : null),
                  l.match?.competition,
                  tribune ? `pour ${tribune}` : null,
                  l.neutre ? 'neutre' : null,
                  l.fanzzy ? `en ${l.fanzzy.nom ?? l.fanzzy.id}` : null,
                  duree, quand].filter(Boolean).join(' · ');
    const issue = l.issue
      ? `<span class="issue ${esc(l.issue)}">${
        { win: 'GAGNÉ', loss: 'PERDU', draw: 'NUL' }[l.issue] ?? ''}</span>` : '';
    const score = l.score ? `${l.score.pour}–${l.score.contre}` : '';
    return `<div class="part">
      <span class="jeu" style="--c:${couleur}">${virage ? 'VIR' : (esc(l.format ?? 'DUEL'))}</span>
      <span class="qui"><b>${esc(contre)}</b><span>${esc(sous)}</span></span>
      ${issue}
      <span class="gain"><b>+${l.ferveur}</b><span>${esc(gain(l, score))}</span></span>
    </div>`;
  }).join('');

  if (ajouter) {
    $('parcoursListe').insertAdjacentHTML('beforeend', lignes);
  } else if (!(p.lignes ?? []).length) {
    hote.innerHTML = `<div class="vide">Tu n’as encore rien joué.<br>
      <a href="/virage">Entre dans un virage</a> ou <a href="/duel-nvn">lance un duel</a>.</div>`;
    return;
  } else {
    hote.innerHTML = `
      <div class="sortes">${sortes}</div>
      <div class="parcours" id="parcoursListe">${lignes}</div>
      <button class="encore" id="encore">VOIR PLUS</button>`;
  }

  /* Le bouton porte le curseur de la page suivante, et disparaît quand il n'y
     en a plus. C'est la réponse qui le dit — voir `suite` côté serveur — et non
     la page qui le devine en comparant des longueurs. */
  const bt = $('encore');
  if (!bt) return;
  if (!p.suite) { bt.remove(); return; }
  bt.dataset.suite = p.suite;
  bt.disabled = false;
  bt.textContent = 'VOIR PLUS';
}

async function chargerParcours(avant = null) {
  try {
    const p = await api('/api/rank', `/parcours${avant ? `?avant=${encodeURIComponent(avant)}` : ''}`);
    rendreParcours(p, { ajouter: Boolean(avant) });
  } catch {
    /* Le parcours est un ajout, pas le cœur de la page : s'il ne vient pas, on
       le dit à sa place et le reste du profil s'affiche normalement. */
    if (!avant) $('parcours').innerHTML =
      '<div class="vide">Ton parcours n’est pas lisible pour le moment.</div>';
  }
}

document.addEventListener('click', (e) => {
  const bt = e.target.closest('#encore');
  if (!bt) return;
  bt.disabled = true;
  bt.textContent = 'UN INSTANT…';
  chargerParcours(bt.dataset.suite);
});

/* ------------------------------------------------------------- rendu */

function rendre() {
  $('pseudo').textContent = user.pseudo;
  $('email').textContent = user.email;
  $('verif').textContent = user.verified ? 'oui' : 'pas encore';
  $('resend').style.display = user.verified ? 'none' : 'block';
  if (!user.verified) {
    $('badge').className = 'badge warn';
    $('badge').textContent = 'À VÉRIFIER';
    $('badge').style.display = 'block';
  }

  const principal = etat.follows?.find((f) => f.is_main) ?? etat.follows?.[0];
  $('clubline').innerHTML = principal
    ? `<img src="${esc(principal.logo)}" alt=""><span>${esc(principal.name)}</span>`
    : '<span style="opacity:.6">aucun club principal</span>';

  const vecus = souvenirs.filter((s) => s.kind === 'presence').length;
  $('stats').innerHTML = `
    <div class="stat" style="--c:var(--projo)"><b>${etat.scarves}</b><span>ÉCHARPES</span></div>
    <div class="stat" style="--c:var(--flare)"><b>${etat.packs}</b><span>BOOSTERS</span></div>
    <div class="stat" style="--c:var(--vert)"><b>${vecus}</b><span>VÉCUS</span></div>
    <div class="stat" style="--c:var(--violet)"><b>${souvenirs.length}</b><span>SOUVENIRS</span></div>`;

  // Clubs suivis, avec les emplacements libres montrés en creux.
  const libres = Math.max(0, etat.slots.total - etat.slots.used);
  $('clubs').innerHTML =
    (etat.follows ?? []).map((f) => `
      <div class="ligne">
        <img src="${esc(f.logo)}" alt="">
        <span class="n">${esc(f.name ?? 'club ' + f.team_id)}</span>
        ${f.is_main ? '<span class="main">PRINCIPAL</span>' : ''}
        <button data-unfollow="${f.team_id}" title="Ne plus suivre">✕</button>
      </div>`).join('')
    + Array.from({ length: libres }, () => `
      <div class="ligne" style="opacity:.4"><span class="n">emplacement libre</span>
        <a class="v" href="/equipes" style="color:var(--projo)">choisir un club</a></div>`).join('')
    + (etat.slots.total < etat.slots.max ? `
      <div class="ligne"><span class="n">Emplacement supplémentaire</span>
        <button class="v" id="buyslot" style="color:var(--projo);opacity:1;font-size:12.5px">
          ${etat.prixSlot ?? '?'} écharpes</button></div>` : '');

  // Fanzzy équipé.
  $('fanzzy').innerHTML = loadout?.fanzzy
    ? `<div class="ligne"><span class="n"><b style="font-family:var(--banner)">${esc(loadout.fanzzy.nom)}</b>
         <br><span style="font-size:11px;opacity:.5">Cri : ${esc(loadout.fanzzy.cri?.label ?? '')}</span></span>
         <a class="v" href="/fanzzy" style="color:var(--projo)">changer</a></div>`
    : `<div class="vide">Aucun Fanzzy équipé.<br><a href="/fanzzy">Ouvre un booster</a></div>`;

  /* Le sac : ce qu'on possède, sans rien à y faire. Équiper se passe dans le
     deck, pièce par Fanzzy — la ligne sous le sac y mène. */
  const sac = (etat.stuff ?? []);
  $('sac').innerHTML = sac.length
    ? sac.map((s) => {
        const def = catalogue.stuff.find((x) => x.id === s.stuff_id);
        return `<span class="obj">
          ${def ? window.TBF_STUFF.illustration(def.id, 'vignette') : ''}
          ${esc(def?.nom ?? s.stuff_id)}${s.copies > 1 ? ` ×${s.copies}` : ''}</span>`;
      }).join('')
    : '<span style="font-size:11.5px;opacity:.45;padding:4px">Ton sac est vide.</span>';

  $('langues').innerHTML = ['fr','en','de','es'].map((l) =>
    `<button data-lang="${l}" class="${user.locale === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('');
}

/* ---------------------------------------------------------- actions */

$('clubs').addEventListener('click', async (e) => {
  const u = e.target.closest('[data-unfollow]');
  if (u) {
    try { etat = await me('/follow/' + u.dataset.unfollow, undefined, 'DELETE'); rendre(); }
    catch { toast('Impossible pour le moment'); }
    return;
  }
  if (e.target.id === 'buyslot') {
    try {
      await me('/slot', {});
      etat = await me('/state');
      toast('Emplacement débloqué');
      rendre();
    } catch (err) {
      // « Impossible pour le moment » laissait le joueur deviner. Le plafond
      // d'emplacements est un état normal, atteint en jouant : il doit se
      // lire. Et si le serveur renvoie un code qu'on n'a pas prévu, on le
      // montre plutôt que de le taire.
      toast(({
        'onboarding.error.not_enough_scarves': 'Pas assez d\u2019écharpes',
        'onboarding.error.max_slots': 'Tu as déjà le maximum d\u2019emplacements',
        'onboarding.error.server': 'Le serveur n\u2019a pas pu répondre',
      })[err.code] ?? `Emplacement impossible (${err.code ?? 'sans code'})`);
    }
  }
});


$('langues').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-lang]');
  if (!b) return;
  try {
    const r = await auth('/me', { locale: b.dataset.lang }, 'PATCH');
    user = r.user;
    try { localStorage.setItem('tbf_locale', user.locale); } catch {}
    toast('Langue enregistrée');
    rendre();
  } catch { toast('Impossible pour le moment'); }
});

$('resend').onclick = async () => {
  try { await auth('/resend-verification', {}); toast('Mail renvoyé'); }
  catch { toast('Impossible pour le moment'); }
};

$('logout').onclick = async () => {
  /* La déconnexion se demande. Sur téléphone, ce bouton est au bas d'une page
     qu'on fait défiler, et un appui s'y donne en rangeant l'appareil — on
     rouvre alors le jeu sur un écran de connexion sans comprendre. */
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: 'SE DÉCONNECTER ?',
    texte: 'Ta collection et tes duels restent. Il faudra te reconnecter pour y revenir.',
    oui: 'SE DÉCONNECTER', ton: 'flare',
  }))) return;
  try { await auth('/logout', {}); } catch {}
  location.href = '/';
};

/* La suppression du compte : le seul geste du jeu qu'on ne peut pas défaire.
   Le mot de passe reste demandé — c'est ce qui protège d'un téléphone laissé
   déverrouillé — mais plus par `prompt()`, la boîte système qui ne dit rien de
   ce qu'on perd et qu'on valide d'un Entrée. */
$('supprimer').onclick = async () => {
  let mdp = '';
  await window.TBF_DIALOGUE?.confirmer({
    titre: 'SUPPRIMER TON COMPTE ?',
    texte: 'Définitif. Tes cartes, tes tenues, tes souvenirs, tes duels et ta place '
      + 'au KOP disparaissent. Rien de tout cela ne peut être rendu.',
    corps: '<label class="tbf-dial-champ">Ton mot de passe'
      + '<input type="password" autocomplete="current-password" id="supMdp"></label>',
    oui: 'TOUT SUPPRIMER', ton: 'flare', non: 'GARDER MON COMPTE',
    apres: (boite) => {
      const champ = boite.querySelector('#supMdp');
      const oui = boite.querySelector('[data-oui]');
      const peindre = () => { mdp = champ.value; oui.disabled = !mdp; };
      champ.addEventListener('input', peindre);
      peindre();
    },
    surOui: async () => {
      if (!mdp) return false;
      try {
        await auth('/me', { password: mdp }, 'DELETE');
      } catch (e) {
        toast(e.code === 'auth.error.bad_credentials'
          ? 'Mot de passe incorrect' : 'Suppression impossible');
        return false;
      }
      location.href = '/';
      return true;
    },
  });
};

/* -------------------------------------------------------- démarrage */

(async () => {
  // Le portrait sert de fond à la carte de profil.
  const img = new Image();
  img.onload = () => { $('fond').style.backgroundImage = `url("${img.src}")`; };
  img.onerror = () => { $('fond').style.background =
    'radial-gradient(70% 60% at 50% 25%,rgba(245,195,59,.25),transparent 65%),#0B0F14'; };
  img.src = 'img/hero-portrait.avif';

  try {
    const r = await fetch('/api/auth/me', { credentials:'same-origin' });
    if (!r.ok) { location.href = '/compte'; return; }
    user = (await r.json()).user;

    [etat, catalogue] = await Promise.all([me('/state'), me('/catalogue')]);
    if (!etat.onboarded) { location.href = '/bienvenue'; return; }

    // Le reste est facultatif : le profil doit s'afficher même si un module manque.
    loadout = await me('/loadout').catch(() => null);
    souvenirs = await api('/api/souvenirs', '/mine').then((d) => d.souvenirs).catch(() => []);
    /* Sans `await` : le parcours peut demander deux requêtes en base, et le
       reste du profil n’a aucune raison de l’attendre. Il se pose quand il
       arrive, à sa place, qui est déjà dessinée. */
    chargerParcours();
    chargerNiveau();

    const prix = [0, 0, 120, 220, 380, 600, 900, 1300];
    etat.prixSlot = prix[etat.slots.total] ?? 1300;

    const d = new Date(user.createdAt ?? Date.now());
    $('depuis').textContent = 'dans la tribune depuis le ' +
      d.toLocaleDateString('fr', { day:'numeric', month:'long', year:'numeric' });

    rendre();
    $('spin').style.display = 'none';
    $('page').style.display = 'block';
  } catch (e) {
    if (e.message === 'auth') return;
    $('spin').style.display = 'none';
    $('page').style.display = 'block';
    $('clubs').innerHTML = '<div class="vide">Serveur injoignable.</div>';
  }
})();
</script>
<script src="/pwa.js" defer></script>
