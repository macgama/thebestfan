<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duel — thebestfan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--beton:#0F1216;--craie:#F2EEE4;--projo:#F5C33B;--flare:#E0402C;--vert:#1E9E6A;
      --banner:"Oswald","Arial Narrow",Impact,sans-serif;
      --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}

#app{position:relative;width:100%;max-width:440px;height:100dvh;overflow:hidden;
  background:
    radial-gradient(120% 40% at 50% 0%,rgba(60,130,232,.12),transparent 60%),
    radial-gradient(120% 40% at 50% 100%,rgba(245,195,59,.13),transparent 60%),
    linear-gradient(180deg,#12171E,#0B0E13 50%,#12171E);
  display:flex;flex-direction:column}
#app::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(242,238,228,.22),transparent)}

/* -------------------------------------------------------- bandeau haut */
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;z-index:4}
.hud .side{display:flex;align-items:center;gap:7px;font-size:11.5px;opacity:.75;flex:1;min-width:0}
.hud .side b{font-family:var(--banner);font-size:13px;opacity:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.goals{display:flex;gap:4px}
.goals i{width:9px;height:9px;border-radius:50%;background:rgba(242,238,228,.18);display:block}
.goals i.on{background:var(--flare);box-shadow:0 0 8px rgba(224,64,44,.7)}
.clock{font-family:var(--banner);font-size:20px;letter-spacing:.04em;text-align:center;flex:none;
  min-width:64px;line-height:1.05}
.clock small{display:block;font-size:9px;letter-spacing:.16em;opacity:.5;font-family:var(--ui)}
.turnbar{height:3px;background:rgba(242,238,228,.1);flex:none}
.turnbar i{display:block;height:100%;background:var(--projo);width:100%;transition:width 1s linear}
.turnbar.foe i{background:#3C82E8}

/* --------------------------------------------------------- le plateau */
.board{flex:1;display:flex;flex-direction:column;justify-content:space-between;
  padding:6px 12px;min-height:0;z-index:2}
.zone{display:flex;justify-content:center;gap:7px;flex:none}
.zone.bench{min-height:56px;align-items:center}
.zone.active{padding:6px 0}

.slot{width:52px;aspect-ratio:63/88;border-radius:5px;border:1px dashed rgba(242,238,228,.14);
  display:grid;place-items:center;flex:none}

.g{position:relative;border-radius:6px;overflow:hidden;flex:none;cursor:pointer;
  border:1.5px solid rgba(0,0,0,.6);background:#0B0E13;
  box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .16s,box-shadow .16s}
.g.small{width:52px;aspect-ratio:63/88}
.g.big{width:118px;aspect-ratio:63/88}
.g:active{transform:scale(.96)}
.g.sel{border-color:var(--projo);box-shadow:0 0 0 2px rgba(245,195,59,.35),0 6px 18px rgba(0,0,0,.6)}
.g.target{border-color:var(--vert);animation:blink 1.1s infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 2px rgba(30,158,106,.5)}50%{box-shadow:0 0 0 5px rgba(30,158,106,.15)}}
.g svg{width:100%;height:100%;display:block}
.g .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 4px 2px;font-family:var(--banner);
  font-size:8px;line-height:1.1;text-transform:uppercase;text-align:center;
  background:linear-gradient(180deg,transparent,rgba(5,7,10,.92) 45%);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g.big .nm{font-size:10.5px;padding:6px 5px 4px}
.g .hp{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(0,0,0,.55)}
.g .hp i{display:block;height:100%;background:var(--vert);transition:width .45s}
.g .hp i.low{background:var(--flare)}
.g .frv{position:absolute;top:4px;right:4px;font-family:var(--banner);font-size:9px;
  background:rgba(5,7,10,.8);border-radius:3px;padding:0 3px}
.g.big .frv{font-size:11px;padding:1px 5px}
.g .souffle{position:absolute;top:4px;left:4px;display:flex;flex-direction:column;gap:2px}
.g .souffle i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.g.big .souffle i{width:10px;height:10px}
.g .shield{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:9px;
  background:rgba(60,130,232,.85);border-radius:3px;padding:1px 5px;font-weight:600}

/* ------------------------------------------------------------- la main */
.hand{flex:none;height:104px;display:flex;gap:6px;padding:6px 12px 8px;overflow-x:auto;
  scrollbar-width:none;align-items:flex-end;z-index:3}
.hand::-webkit-scrollbar{display:none}
.hand .g{width:60px}
.hand .g.playable{border-color:rgba(245,195,59,.55)}

/* ------------------------------------------------------- barre d'action */
.actions{flex:none;padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;
  gap:8px;align-items:center;z-index:4}
.souffle-chip{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.4);
  border:1px solid rgba(242,238,228,.16);border-radius:999px;padding:7px 13px;font-size:11px;
  letter-spacing:.06em;flex:none;cursor:pointer}
.souffle-chip.armed{border-color:var(--projo);background:rgba(245,195,59,.14)}
.souffle-chip i{width:13px;height:13px;border-radius:50%;display:block}
.souffle-chip.spent{opacity:.32;pointer-events:none}
.btn{flex:1;background:rgba(242,238,228,.1);border:1px solid rgba(242,238,228,.2);border-radius:7px;
  color:inherit;padding:12px;font-family:var(--banner);font-size:14px;letter-spacing:.09em;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--flare),#B32A1D);border-color:rgba(255,255,255,.18);
  box-shadow:0 4px 0 #7A1A11}
.btn:disabled{opacity:.35;pointer-events:none}

/* ------------------------------------------------------------ panneaux */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#151A21;z-index:12;
  border-top:1px solid rgba(242,238,228,.16);border-radius:14px 14px 0 0;padding:16px 16px 24px;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.25,1)}
.sheet.on{transform:translateY(0)}
.sheet h3{font-family:var(--banner);font-size:15px;letter-spacing:.1em;margin:0 0 12px;opacity:.75}
.chant{display:flex;align-items:center;gap:11px;width:100%;background:rgba(0,0,0,.3);border:0;
  border-left:3px solid transparent;color:inherit;padding:12px;border-radius:6px;margin-bottom:8px;
  cursor:pointer;text-align:left;font-family:inherit}
.chant.ok{border-left-color:var(--vert)}
.chant:disabled{opacity:.4}
.chant .cost{display:flex;gap:3px;flex:none}
.chant .cost i{width:11px;height:11px;border-radius:50%;display:block}
.chant .txt{flex:1;min-width:0}
.chant .txt b{display:block;font-family:var(--banner);font-size:13.5px;letter-spacing:.03em}
.chant .txt span{font-size:11px;opacity:.55;line-height:1.35}
.chant .pow{font-family:var(--banner);font-size:19px;flex:none}

/* --------------------------------------------------------- superposés */
.veil{position:absolute;inset:0;background:rgba(5,7,10,.9);backdrop-filter:blur(7px);z-index:20;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;
  text-align:center}
.veil.on{display:flex}
.veil h2{font-family:var(--banner);font-size:30px;letter-spacing:.09em;margin:0}
.veil p{font-size:13.5px;opacity:.65;margin:0;line-height:1.6;max-width:300px}
.spinner{width:34px;height:34px;border:3px solid rgba(242,238,228,.2);border-top-color:var(--projo);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:18;
  font-family:var(--banner);font-size:26px;letter-spacing:.06em;text-align:center;pointer-events:none;
  opacity:0;text-shadow:0 4px 24px rgba(0,0,0,.9)}
.toast.on{animation:pop 1.5s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
.toast.goal{color:var(--flare)}

.log{position:absolute;left:12px;right:12px;top:calc(50% - 13px);z-index:5;text-align:center;
  font-size:11.5px;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.02em}
.log.on{opacity:.75}
.err{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:16;
  background:rgba(224,64,44,.92);border-radius:6px;padding:9px 15px;font-size:12.5px;
  display:none;max-width:88%;text-align:center}
.err.on{display:block;animation:pop2 .25s}
@keyframes pop2{from{opacity:0;transform:translate(-50%,6px)}}
.link{background:none;border:1px solid rgba(242,238,228,.28);border-radius:6px;color:inherit;
  padding:11px 20px;font-family:var(--banner);letter-spacing:.08em;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<main id="app">
  <div class="hud">
    <div class="side"><b id="foeName">—</b><span class="goals" id="foeGoals"></span></div>
    <div class="clock"><span id="minute">0'</span><small id="phase"></small></div>
    <div class="side" style="justify-content:flex-end"><span class="goals" id="myGoals"></span><b id="myName">—</b></div>
  </div>
  <div class="turnbar" id="turnbar"><i id="turnfill"></i></div>

  <div class="board">
    <div class="zone bench" id="foeBench"></div>
    <div class="zone active" id="foeActive"></div>
    <div class="log" id="log"></div>
    <div class="zone active" id="myActive"></div>
    <div class="zone bench" id="myBench"></div>
  </div>

  <div class="hand" id="hand"></div>
  <div class="actions">
    <button class="souffle-chip spent" id="souffle"><i></i><span id="souffleLabel"></span></button>
    <button class="btn primary" id="mainAction"></button>
  </div>

  <div class="sheet" id="sheet"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
  <div class="err" id="err"></div>

  <div class="veil on" id="veil">
    <div class="spinner" id="spin"></div>
    <h2 id="veilTitle"></h2>
    <p id="veilText"></p>
    <button class="link" id="veilBtn" style="display:none"></button>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/duel.bundle.js"></script>
<script>
const UI = {
  fr:{queue:'RECHERCHE D\u2019UN ADVERSAIRE',queueTxt:'On te cherche une tribune en face. Reste sur cette page.',
    find:'CHERCHER UN DUEL',ready:'PRÊT À JOUER',readyTxt:'Un match dure 90 minutes de jeu. Le premier à trois buts gagne.',
    endTurn:'FIN DU TOUR',chant:'CHANTER',promote:'AU PREMIER RANG',promoteTxt:'Choisis le groupe qui monte',
    souffle:'SOUFFLE',spent:'SOUFFLE PLACÉ',waiting:'AU TOUR DE L\u2019ADVERSAIRE',yourTurn:'À TOI',
    win:'VICTOIRE',loss:'DÉFAITE',draw:'MATCH NUL',again:'REJOUER',back:'RETOUR',
    goal:'BUT !',ko:'TRIBUNE VIDÉE',halftime:'MI-TEMPS',fulltime:'COUP DE SIFFLET FINAL',
    offline:'ADVERSAIRE DÉCONNECTÉ',offlineTxt:'Il a une minute pour revenir.',
    chants:'CHANTS',retreat:'RECULER',needLogin:'CONNEXION REQUISE',needLoginTxt:'Crée un compte pour entrer en duel.',
    login:'ALLER AU COMPTE',kickoff:'COUP D\u2019ENVOI',queueFailed:'MISE EN FILE REFUSÉE',noOpponent:'PERSONNE EN FACE',noOpponentTxt:'Aucun adversaire pour l\u2019instant. Réessaie, ou reviens quand un autre supporter sera en ligne.'},
  en:{queue:'LOOKING FOR AN OPPONENT',queueTxt:'Finding you a stand to face. Stay on this page.',
    find:'FIND A DUEL',ready:'READY TO PLAY',readyTxt:'A match lasts 90 minutes of play. First to three goals wins.',
    endTurn:'END TURN',chant:'CHANT',promote:'TO THE FRONT ROW',promoteTxt:'Pick the group moving up',
    souffle:'BREATH',spent:'BREATH PLACED',waiting:'OPPONENT\u2019S TURN',yourTurn:'YOUR MOVE',
    win:'WIN',loss:'LOSS',draw:'DRAW',again:'PLAY AGAIN',back:'BACK',
    goal:'GOAL!',ko:'STAND EMPTIED',halftime:'HALF TIME',fulltime:'FULL TIME',
    offline:'OPPONENT DISCONNECTED',offlineTxt:'They have a minute to come back.',
    chants:'CHANTS',retreat:'STEP BACK',needLogin:'SIGN IN REQUIRED',needLoginTxt:'Create an account to enter a duel.',
    login:'GO TO ACCOUNT',kickoff:'KICK-OFF',queueFailed:'COULD NOT JOIN THE QUEUE',noOpponent:'NOBODY OPPOSITE',noOpponentTxt:'No opponent right now. Try again, or come back when another supporter is online.'},
  de:{queue:'GEGNER WIRD GESUCHT',queueTxt:'Wir suchen dir einen Block gegenüber. Bleib auf dieser Seite.',
    find:'DUELL SUCHEN',ready:'BEREIT',readyTxt:'Ein Spiel dauert 90 Spielminuten. Wer zuerst drei Tore hat, gewinnt.',
    endTurn:'ZUG BEENDEN',chant:'ANSTIMMEN',promote:'IN DIE ERSTE REIHE',promoteTxt:'Wähle die Gruppe',
    souffle:'ATEM',spent:'ATEM GESETZT',waiting:'GEGNER IST AM ZUG',yourTurn:'DU BIST DRAN',
    win:'SIEG',loss:'NIEDERLAGE',draw:'UNENTSCHIEDEN',again:'NOCHMAL',back:'ZURÜCK',
    goal:'TOR!',ko:'BLOCK GELEERT',halftime:'HALBZEIT',fulltime:'ABPFIFF',
    offline:'GEGNER GETRENNT',offlineTxt:'Er hat eine Minute, um zurückzukommen.',
    chants:'GESÄNGE',retreat:'ZURÜCKTRETEN',needLogin:'ANMELDUNG NÖTIG',needLoginTxt:'Erstelle ein Konto für Duelle.',
    login:'ZUM KONTO',kickoff:'ANPFIFF',queueFailed:'WARTESCHLANGE ABGELEHNT',noOpponent:'NIEMAND GEGENÜBER',noOpponentTxt:'Gerade kein Gegner. Versuch es erneut oder komm wieder, wenn jemand online ist.'},
  es:{queue:'BUSCANDO RIVAL',queueTxt:'Te buscamos una grada enfrente. Quédate en esta página.',
    find:'BUSCAR DUELO',ready:'LISTO',readyTxt:'Un partido dura 90 minutos de juego. Gana quien marque tres goles.',
    endTurn:'FIN DE TURNO',chant:'CANTAR',promote:'A PRIMERA FILA',promoteTxt:'Elige el grupo que sube',
    souffle:'ALIENTO',spent:'ALIENTO COLOCADO',waiting:'TURNO DEL RIVAL',yourTurn:'TE TOCA',
    win:'VICTORIA',loss:'DERROTA',draw:'EMPATE',again:'JUGAR OTRA VEZ',back:'VOLVER',
    goal:'¡GOL!',ko:'GRADA VACIADA',halftime:'DESCANSO',fulltime:'FINAL',
    offline:'RIVAL DESCONECTADO',offlineTxt:'Tiene un minuto para volver.',
    chants:'CÁNTICOS',retreat:'RETROCEDER',needLogin:'HAY QUE ENTRAR',needLoginTxt:'Crea una cuenta para jugar duelos.',
    login:'IR A LA CUENTA',kickoff:'SAQUE INICIAL',queueFailed:'NO SE PUDO ENTRAR EN COLA',noOpponent:'NADIE ENFRENTE',noOpponentTxt:'Ningún rival ahora mismo. Inténtalo otra vez o vuelve cuando haya alguien conectado.'},
};

const LOCALES = ['fr','en','de','es'];
let locale = LOCALES.find(l => navigator.language.toLowerCase().startsWith(l)) || 'fr';
try { const s = localStorage.getItem('tbf_locale'); if (LOCALES.includes(s)) locale = s; } catch {}
const u = (k) => (UI[locale] ?? UI.fr)[k] ?? k;
const d = (k, p = {}) => {
  const dict = TBF.dict[locale] ?? TBF.dict.fr;
  return Object.entries(p).reduce((a,[x,v]) => a.replaceAll(`{${x}}`, v), dict[k] ?? k);
};

const $ = (id) => document.getElementById(id);
const { project, cardDef, cardName, chantName, cardArt, AMBIANCE, costColor, RULES } = TBF;

/* ------------------------------------------------------------ état */

let socket = null, snap = null, seqGap = [];
let queuedSince = 0;
let selected = null;      // uid du groupe sélectionné
let arming = false;       // le souffle attend une cible
let status = 'idle';

/* ------------------------------------------------------------ rendu */

const artCache = new Map();
function art(cardId){
  if (!artCache.has(cardId)) artCache.set(cardId, cardArt(cardDef(cardId)));
  return artCache.get(cardId);
}

function group(g, size, opts = {}){
  const def = cardDef(g.cardId);
  const left = Math.max(0, def.frv - g.damage);
  const pct = Math.max(0, Math.round((left / def.frv) * 100));
  return `<div class="g ${size} ${opts.cls ?? ''}" data-uid="${g.uid}">
    <div class="hp"><i class="${pct < 34 ? 'low' : ''}" style="width:${pct}%"></i></div>
    ${art(g.cardId)}
    <div class="frv">${left}</div>
    <div class="souffle">${g.souffle.map(a => `<i style="background:${AMBIANCE[a].color}"></i>`).join('')}</div>
    ${g.shield ? `<div class="shield">+${g.shield}</div>` : ''}
    <div class="nm">${cardName(g.cardId)}</div>
  </div>`;
}

function handCard(c){
  const def = cardDef(c.cardId);
  return `<div class="g playable" data-hand="${c.uid}">
    ${art(c.cardId)}<div class="frv">${def.frv}</div>
    <div class="nm">${cardName(c.cardId)}</div></div>`;
}

const emptySlot = () => `<div class="slot"></div>`;

function render(){
  if (!snap) return;
  const me = snap.players[snap.you];
  const foe = snap.players[snap.you ^ 1];
  const myTurn = snap.turn === snap.you && snap.phase === 'playing';

  $('myName').textContent = me.name;
  $('foeName').textContent = foe.name;
  const dots = (n) => Array.from({ length: RULES.goalsToWin }, (_, i) =>
    `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  $('myGoals').innerHTML = dots(me.score);
  $('foeGoals').innerHTML = dots(foe.score);
  $('minute').textContent = `${snap.minute}'`;
  $('phase').textContent = snap.phase === 'over' ? u('fulltime')
    : myTurn ? u('yourTurn') : u('waiting');
  $('turnbar').className = 'turnbar' + (myTurn ? '' : ' foe');

  $('foeBench').innerHTML = foe.bench.map(g => group(g, 'small')).join('')
    + emptySlot().repeat(Math.max(0, RULES.benchMax - foe.bench.length));
  $('foeActive').innerHTML = foe.active
    ? group(foe.active, 'big', { cls: selected && myTurn ? 'target' : '' })
    : `<div class="slot" style="width:118px"></div>`;
  $('myActive').innerHTML = me.active
    ? group(me.active, 'big', { cls: selected === me.active.uid ? 'sel' : '' })
    : `<div class="slot" style="width:118px"></div>`;
  $('myBench').innerHTML = me.bench.map(g =>
    group(g, 'small', { cls: selected === g.uid ? 'sel' : '' })).join('')
    + emptySlot().repeat(Math.max(0, RULES.benchMax - me.bench.length));

  $('hand').innerHTML = snap.hand.map(handCard).join('');

  const chip = $('souffle');
  chip.className = 'souffle-chip' + (snap.souffleAvailable && myTurn ? (arming ? ' armed' : '') : ' spent');
  chip.querySelector('i').style.background = snap.souffleAvailable
    ? AMBIANCE[snap.souffleAvailable].color : 'transparent';
  $('souffleLabel').textContent = snap.souffleAvailable && myTurn ? u('souffle') : u('spent');

  const btn = $('mainAction');
  if (snap.phase === 'ko_promote' && snap.turn !== undefined) {
    btn.textContent = u('promote');
    btn.disabled = false;
  } else {
    btn.textContent = u('endTurn');
    btn.disabled = !myTurn;
  }
  tickClock();
}

let clockTimer = null;
function tickClock(){
  clearInterval(clockTimer);
  const fill = $('turnfill');
  const span = RULES.turnMs;
  const paint = () => {
    if (!snap || !snap.deadline) { fill.style.width = '0%'; return; }
    const left = Math.max(0, snap.deadline - Date.now());
    fill.style.width = `${Math.min(100, (left / span) * 100)}%`;
  };
  paint();
  clockTimer = setInterval(paint, 500);
}

/* -------------------------------------------------------- interactions */

function send(intent){
  if (!snap) return;
  socket.emit('duel:intent', { duelId: snap.duelId, intent });
}

function onGroupTap(uid){
  const me = snap.players[snap.you];
  const foe = snap.players[snap.you ^ 1];
  const mine = me.active?.uid === uid || me.bench.some(b => b.uid === uid);
  const myTurn = snap.turn === snap.you && snap.phase === 'playing';

  if (snap.phase === 'ko_promote') {
    if (me.bench.some(b => b.uid === uid)) send({ t: 'promote', benchUid: uid });
    return;
  }
  if (!myTurn) return;

  if (arming && mine) { send({ t: 'attach_souffle', targetUid: uid }); arming = false; render(); return; }

  if (foe.active?.uid === uid && selected === me.active?.uid) { openChants(); return; }
  if (!mine) return;

  if (me.active?.uid === uid) { selected = selected === uid ? null : uid; openChants(); render(); return; }
  if (me.bench.some(b => b.uid === uid)) { openRetreat(uid); }
}

document.querySelector('.board').addEventListener('click', (e) => {
  const g = e.target.closest('[data-uid]');
  if (g) onGroupTap(g.dataset.uid);
});

$('hand').addEventListener('click', (e) => {
  const c = e.target.closest('[data-hand]');
  if (c) send({ t: 'play_support', uid: c.dataset.hand });
});

$('souffle').onclick = () => { arming = !arming; render(); };

$('mainAction').onclick = () => {
  if (snap?.phase === 'ko_promote') { showSheet(u('promoteTxt'), promoteBody()); return; }
  send({ t: 'end_turn' });
  selected = null; arming = false;
};

/* ------------------------------------------------------------ panneau */

function showSheet(title, html){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = html;
  $('sheet').classList.add('on');
}
const hideSheet = () => $('sheet').classList.remove('on');

function canPay(souffle, cost){
  const pool = [...souffle];
  for (const c of cost) {
    if (c === 'any') continue;
    const i = pool.indexOf(c);
    if (i === -1) return false;
    pool.splice(i, 1);
  }
  return pool.length >= cost.filter(c => c === 'any').length;
}

function openChants(){
  const me = snap.players[snap.you];
  if (!me.active) return;
  const def = cardDef(me.active.cardId);
  showSheet(u('chants'), def.chants.map(c => {
    const ok = canPay(me.active.souffle, c.cost);
    return `<button class="chant ${ok ? 'ok' : ''}" data-chant="${c.id}" ${ok ? '' : 'disabled'}>
      <span class="cost">${c.cost.map(x => `<i style="background:${costColor(x)}"></i>`).join('')}</span>
      <span class="txt"><b>${chantName(c.id)}</b>${c.effect ? `<span>${d('effect.' + c.effect.kind, c.effect)}</span>` : ''}</span>
      <span class="pow">${c.power}</span></button>`;
  }).join(''));
}

function promoteBody(){
  const me = snap.players[snap.you];
  return `<div style="display:flex;gap:8px;justify-content:center">${
    me.bench.map(g => group(g, 'big')).join('')}</div>`;
}

function openRetreat(uid){
  const me = snap.players[snap.you];
  const cost = me.active ? cardDef(me.active.cardId).retreat : 0;
  const ok = me.active && me.active.souffle.length >= cost && !me.active.blockedRetreat;
  showSheet(u('retreat'), `<button class="chant ${ok ? 'ok' : ''}" data-retreat="${uid}" ${ok ? '' : 'disabled'}>
    <span class="cost">${Array.from({ length: cost }, () => '<i style="background:#B9B2A0"></i>').join('')}</span>
    <span class="txt"><b>${cardName(me.bench.find(b => b.uid === uid).cardId)}</b></span></button>`);
}

$('sheet').addEventListener('click', (e) => {
  const c = e.target.closest('[data-chant]');
  if (c) { send({ t: 'chant', chantId: c.dataset.chant }); selected = null; hideSheet(); return; }
  const r = e.target.closest('[data-retreat]');
  if (r) { send({ t: 'retreat', benchUid: r.dataset.retreat }); hideSheet(); return; }
  const g = e.target.closest('[data-uid]');
  if (g && snap.phase === 'ko_promote') { send({ t: 'promote', benchUid: g.dataset.uid }); hideSheet(); }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.sheet') && !e.target.closest('.board') && !e.target.closest('#mainAction')) hideSheet();
});

/* ------------------------------------------------------------ annonces */

function toast(text, cls = ''){
  const el = $('toast');
  el.textContent = text;
  el.className = 'toast on ' + cls;
  setTimeout(() => { el.className = 'toast ' + cls; }, 1600);
}
function say(text){
  const el = $('log');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 3200);
}
function fail(code){
  const el = $('err');
  el.textContent = d(code);
  el.className = 'err on';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'err'; }, 2600);
}

function announce(ev){
  const mine = ev.side === snap.you;
  switch (ev.t) {
    case 'goal':
      window.FX?.but({ pour: mine, score: [ev.score[snap.you], ev.score[snap.you ^ 1]] });
      break;
    case 'ko': say(`${cardName(ev.cardId)} — ${u('ko')}`); break;
    case 'chant': say(d(ev.weak ? 'event.chant_weak' : 'event.chant', {
      name: cardName(ev.cardId), chant: chantName(ev.chantId), damage: ev.damage })); break;
    case 'live_boost': toast(`${ev.team} ${ev.minute}'`, 'goal');
      say(d('event.live_boost', { team: ev.team, minute: ev.minute })); break;
    case 'promote_required': if (mine) showSheet(u('promoteTxt'), promoteBody()); break;
    case 'whistle': toast(u('fulltime')); break;
    case 'turn_start':
      if (ev.minute === 45) toast(u('halftime'));
      if (mine) hideSheet();
      break;
    case 'over': showEnd(ev); break;
  }
}

function showEnd(ev){
  const won = ev.winner === snap.you;
  const draw = ev.winner === 'draw';
  if (!draw) {
    window.FX?.fin(won, {
      score: [snap.players[snap.you].score, snap.players[snap.you ^ 1].score] });
  }
  veil(draw ? u('draw') : won ? u('win') : u('loss'),
    d('reason.' + ev.reason), u('again'), () => { location.reload(); }, false);
}

/* ------------------------------------------------------------- voile */

function veil(title, text, btnLabel, onClick, spinning = true){
  $('veilTitle').textContent = title;
  $('veilText').textContent = text ?? '';
  $('spin').style.display = spinning ? '' : 'none';
  const b = $('veilBtn');
  if (btnLabel) { b.style.display = ''; b.textContent = btnLabel; b.onclick = onClick; }
  else b.style.display = 'none';
  $('veil').classList.add('on');
}
const unveil = () => $('veil').classList.remove('on');

/* ------------------------------------------------------------ réseau */

function connect(){
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect_error', (e) => {
    if (String(e.message).includes('unauthenticated')) {
      veil(u('needLogin'), u('needLoginTxt'), u('login'), () => { location.href = '/compte'; }, false);
    }
  });

  const open = (s) => {
    snap = s; seqGap = [];
    status = s.phase === 'over' ? 'over' : 'playing';
    unveil(); render();
    if (s.minute === 0) toast(u('kickoff'));
  };
  socket.on('duel:start', open);
  socket.on('duel:state', open);

  socket.on('duel:queued', ({ position }) => {
    status = 'queued';
    queuedSince = Date.now();
    veil(u('queue'), `${u('queueTxt')} (${position})`);
  });

  socket.on('duel:event', ({ seq, event }) => {
    if (!snap || seq <= snap.seq) return;
    if (seq > snap.seq + 1) {
      seqGap.push({ seq, event });
      socket.emit('duel:resync', { duelId: snap.duelId, sinceSeq: snap.seq });
      return;
    }
    snap = project(snap, seq, event);
    announce(event);
    seqGap.sort((a, b) => a.seq - b.seq);
    while (seqGap.length && seqGap[0].seq === snap.seq + 1) {
      const q = seqGap.shift();
      snap = project(snap, q.seq, q.event);
      announce(q.event);
    }
    render();
  });

  socket.on('duel:error', (e) => {
    if (e.code === 'auth.error.unauthenticated') {
      veil(u('needLogin'), u('needLoginTxt'), u('login'), () => { location.href = '/compte'; }, false);
      return;
    }
    // Pendant l'attente, le voile masquerait le message : on l'affiche dessus.
    if (status === 'queued') {
      veil(u('queueFailed'), d(e.code), u('find'), startQueue, false);
      status = 'idle';
      return;
    }
    fail(e.code);
  });

  socket.on('duel:opponent', ({ connected }) => {
    if (!connected) veil(u('offline'), u('offlineTxt'));
    else { unveil(); render(); }
  });

  socket.on('connect', () => {
    if (snap && snap.phase !== 'over') {
      socket.emit('duel:resync', { duelId: snap.duelId, sinceSeq: snap.seq });
    }
  });
}

function startQueue(){
  if (!socket?.connected) { veil(u('offline'), u('offlineTxt')); return; }
  status = 'queued';
  queuedSince = Date.now();
  veil(u('queue'), u('queueTxt'));
  socket.emit('duel:queue', {});
}

// Au bout de 45 secondes sans adversaire, on le dit plutôt que de tourner
// indéfiniment : le joueur doit pouvoir renoncer ou réessayer.
setInterval(() => {
  if (status !== 'queued' || !queuedSince) return;
  if (Date.now() - queuedSince > 45_000) {
    status = 'idle';
    queuedSince = 0;
    socket.emit('duel:cancel_queue');
    veil(u('noOpponent'), u('noOpponentTxt'), u('find'), startQueue, false);
  }
}, 2000);

veil(u('ready'), u('readyTxt'), u('find'), startQueue, false);
connect();
</script>
<script src="/fx.js" defer></script>
