 * vient d'arriver à la table. La seconde moitié du code dit **pourquoi** c'est
 * refusé, et cette moitié-là se répète d'une épreuve à l'autre : un tracé trop
 * long et trop de frappes sont le même reproche. On répond donc à la raison,
 * qui est ce que le joueur a besoin d'entendre, et une épreuve neuve est
 * couverte le jour où elle arrive.
 */
function familleDuRefus(code) {
  const c = String(code ?? '');
  if (/\.trop_rapide$/.test(c)) return 'Trop vite : le geste n’a pas pu être mesuré';
  if (/\.trop_reguliere$/.test(c)) return 'Trop régulier pour une main — va à ton rythme';
  if (/\.trop_juste$/.test(c)) return 'Répondu avant d’avoir pu lire la consigne';
  if (/\.hors_delai$/.test(c)) return 'Trop tard : l’épreuve était déjà finie';
  if (/\.(trop_nombreuses|trop_nombreux|trop_longue)$/.test(c)) return 'Trop de gestes d’un coup';
  if (/\.invalide$/.test(c)) return 'Ce geste n’a pas été compris — recommence';
  /* Un désaccord entre la page et le serveur, pas une faute du joueur : la page
     n'a pas été rechargée depuis une mise en ligne. Même conseil que pour les
     trois « inconnu du serveur » de la table. */
  if (/^ferveur\.error\.(epreuve|consigne)\./.test(c)) {
    return 'Cette épreuve est inconnue du serveur — recharge la page';
  }
  return null;
}


/* ------------------------------------------------------------ les gestes
   Le client ne fait qu'enregistrer les instants et les transmettre. */

function openMini(card) {
  return new Promise((resolve) => {
    const m = $('mini');
    m.style.setProperty('--c', COLORS[card.gest]);
    $('miniTitle').textContent = LABEL[card.gest];
    $('miniHint').textContent = HINT[card.gest];
    $('verdict').textContent = '';
    /* L’épreuve prend l’écran : les cartes jouées par les autres passaient
       par-dessus la grille — voir `suspendre` dans action-art.js. Elles
       reviennent à la fermeture, rien n’est perdu. */
    window.TBF_ACTION?.suspendre?.();
    /* Même règle pour la case d'un moment déjà à l'écran : posée sur `body`
       pour quinze secondes, elle passerait par-dessus le pavé. Ce qui arrive
       pendant le geste attend sa fin — voir `apresLaFenetre`. */
    scene?.couper?.();
    // Et pour la carte-souvenir déjà là, qui, elle, revient après.
    rangerLeSouvenir();
    m.classList.add('on');
    let k = 3;
    const tick = () => {
      if (k === 0) return run(card, resolve);
      const c = document.createElement('div');
      c.className = 'countdown'; c.textContent = k--;
      m.appendChild(c); setTimeout(() => c.remove(), 550); buzz(8);
      setTimeout(tick, 560);
    };
    tick();
  });
}

function closeMini(taps) {
  $('mini').classList.remove('on');
  window.TBF_ACTION?.reprendre?.();
  $('miniZone').innerHTML = '';
  return taps;
}

/**
 * Le déroulé d'un geste vit dans `/geste.js`, partagé avec le duel.
 *
 * Il était écrit ici **et** là-bas. Ce qui reste à cette page, c'est son
 * balisage : elle dit où poser la zone de jeu, le fichier partagé dit ce qui
 * s'y passe. Et surtout, aucune durée n'est calculée ici — elles viennent
 * toutes de `S.you.gestes`, que le serveur remplit avec les modificateurs du
 * porteur. Les avoir écrites en dur a déjà coûté cher : un joueur équipé
 * tapait juste sur ce qu'on lui montrait et récoltait 0,36 au lieu de 0,99.
 */
/*
 * ## Et il rend la main, quoi qu'il arrive
 *
 * `jouer` ne rejette jamais de lui-même, et son `switch` a une branche par
 * défaut : un geste inconnu retombe sur le martelage et se termine. Mais son
 * exécuteur peut **lever** — une zone absente, un élément que la page n'a pas
 * encore posé — et il n'y avait aucun rattrapage : la promesse partait en
 * erreur, `openMini` ne se dénouait ni dans un sens ni dans l'autre, et le
 * `await` en dessous attendait pour toujours.
 *
 * Ce qu'un joueur voyait alors : **le panneau de l'épreuve figé sur l'écran**,
 * la corde cachée dessous, et plus aucun chant possible pour le reste du match.
 * `busy` restait vrai, donc même en refermant on ne pouvait plus rien. La seule
 * issue était de recharger — c'est-à-dire de passer outre l'avertissement que
 * `nav.js` affiche justement pour dire que recharger coûte quelque chose.
 *
 * Une exception dans mille lignes de moteur de gestes ne doit pas coûter le
 * match. On rend `null`, la main se referme, et le joueur lit qu'il faut
 * recommencer.
 */
function run(card, resolve) {
  const rate = (e) => {
    console.error('[virage] le geste a levé :', e);
    resolve(closeMini(null));
  };
  try {
    window.TBF_GESTE.jouer(card.gest, S?.you?.gestes, { zone: $('miniZone') })
      .then((taps) => resolve(closeMini(taps)))
      .catch(rate);
  } catch (e) {
    /* Une levée **synchrone**, avant même que la promesse existe. Le `catch`
       ci-dessus ne la verrait pas : elle remonterait dans le `setTimeout` du
       compte à rebours, hors de toute reprise. */
    rate(e);
  }
}

$('hand').addEventListener('pointerdown', async (e) => {
  const el = e.target.closest('[data-card]');
  if (!el || busy || !S) return;
  const card = S.cards.find((c) => c.id === el.dataset.card);
  /* **La carte peut avoir disparu de la main.** Le répertoire tourne toutes les
     dix minutes de match — voir `virage:repertoire` — et le doigt peut tomber
     pendant l'échange. `card.cost` sur un indéfini levait dans un gestionnaire
     d'événement : rien ne s'affichait, et le chant suivant marchait comme si de
     rien n'était, ce qui est le plus sûr moyen de ne jamais comprendre. */
  if (!card) return;
  if (souffleCourant() < card.cost) return fail('ferveur.error.not_enough_breath');
  busy = true; render();
  try {
    const taps = await openMini(card);
    if (taps) socket.emit('virage:chant', { cardId: card.id, taps });
    else fail('ferveur.error.bad_taps');
  } finally {
    /* **Dans un `finally`.** Il était après l'envoi, donc sauté dès que
       quoi que ce soit levait au-dessus — et `busy` resté vrai éteint la main
       pour le reste du match. Le second `render` était absent aussi : les
       cartes restaient grises jusqu'au battement d'horloge suivant. */
    busy = false;
    render();
    /* Ce qui est arrivé pendant le geste se montre maintenant — **après** le
       `render` : sa pose de fond, demandée ensuite, passerait devant la
       célébration d'un but encore en train de se charger, et le personnage
       n'exulterait pas. */
    viderApresLeGeste();
  }
});

/* ----------------------------------------------------- le stade

   Le terrain au milieu, les deux tribunes sur les côtés, et la corde qui
   descend le long de la pelouse. C'est la disposition qui garde le cadrage
   des dessins : faire pivoter le stade d'un quart de tour pour aligner les
   tribunes sur le haut et le bas aurait coûté la moitié de l'image.

   La tribune de gauche est celle de **domicile**, la droite celle de
   l'extérieur — comme le vrai match, et quel que soit le camp qu'on a choisi.
   Le stade appartient à la rencontre, pas au joueur.

   Les tribunes s'éclairent aux couleurs des clubs, et leur intensité suit la
   corde : celle qui pousse brille, celle qui cède s'éteint. C'est la même
   information que le nœud, mais qu'on lit sans lire un chiffre. */

let stade = null;

function monterStade() {
  if (stade || !S?.stade || !window.TBF_STADE) return;
  /* `homeColors` et `awayColors` sont extraites des blasons et peuvent
     manquer — un club dont le blason n'a pas encore été lu. On garde alors
     les deux couleurs du jeu, qui distinguent au moins les camps. */
  const lisible = (c, d) => (c ? (window.FX?.lisible?.(c) ?? c) : d);
  stade = window.TBF_STADE.monter($('stade'), {
    id: S.stade.id,
    couleurs: [
      lisible((S.fixture?.homeColors ?? [])[0], 'var(--projo)'),
      lisible((S.fixture?.awayColors ?? [])[0], 'var(--bleu)'),
    ],
  });
}

/**
 * L'intensité de chaque tribune, d'après la corde.
 *
 * La corde est stockée « côté extérieur positif ». On la ramène donc en deux
 * valeurs de zéro à un : celle qui mène brille, l'autre baisse — sans jamais
 * s'éteindre tout à fait, parce qu'il y a toujours du monde dedans.
 */
function eclairerStade() {
  if (!stade) return;
  const part = Math.max(-1, Math.min(1, (S?.rope ?? 0) / GOAL_AT));
  stade.intensite(0, Math.max(0, -part));   // domicile : corde négative
  stade.intensite(1, Math.max(0, part));    // extérieur : corde positive
}

/* ------------------------------------------------- les cartes d'action

   Le Virage ne joue que les cartes qui agissent sur soi ou sur sa tribune.
   Le tri est fait par le serveur, qui envoie son propre catalogue dans
   `S.actions` — la page n'a pas de liste à tenir, et une carte qui change de
   portée n'attend pas un déploiement du client pour disparaître d'ici. */

/** La carte du catalogue, par identifiant. */
const acteDe = (id) => (S?.actions ?? []).find((a) => a.id === id);

function renderActes() {
  const boite = $('actes');
  const main = S?.you?.main ?? [];
  /* Pas de deck, pas de rangée. Quelqu'un qui n'a jamais construit de deck
     entre au Virage avec sa voix, et une rangée de cases vides ne lui
     apprendrait rien d'autre que ce qui lui manque. */
  /* **Pourquoi il y a des cases vides.**

     Le Virage ne joue que les cartes qui agissent sur soi ou sur sa tribune,
     et il écarte les autres à l'entrée — sans rien dire. Un joueur dont le
     deck est fait pour le duel voyait une carte et quatre cases vides, et il
     l'a signalé comme un défaut de rechargement. Ce n'en était pas un :
     c'était une règle qui ne s'était jamais annoncée.

     Dans son propre bandeau et non dans la rangée : la rangée est une grille
     de cinq cartes de largeur fixe, et y glisser une phrase déplacerait tout
     ce qui se touche au doigt. Le lien vers le deck est là parce qu'une
     explication sans porte de sortie ne fait qu'agacer. */
  /* Le bandeau n'est réécrit que quand le compte change : il porte un lien,
     et un lien remplacé dix fois par seconde ne se touche pas — l'appui tombe
     sur un nœud, le relâchement sur son remplaçant, et le clic se perd. */
  const banniere = $('ecartees');
  const ecartees = S?.you?.ecartees ?? 0;
  if (ecartees && banniere) {
    banniere.hidden = false;
    if (banniere._n !== ecartees) {
      banniere._n = ecartees;
      banniere.innerHTML = `<b>${ecartees}</b> carte(s) de ton deck ne se jouent qu\u2019en duel \u2014 elles visent quelqu\u2019un en face, et ici il n\u2019y a personne à viser. <a href="/deck">Changer mon deck</a>`;
    }
  } else if (banniere) { banniere.hidden = true; }

  if (!main.length) { boite.hidden = true; return; }
  boite.hidden = false;

  /* La rangée passe par `accorder` : voir « des nœuds qui durent ». Une case
     par place de la main — la carte retrouvée par son identifiant, la case
     vide par sa position — posée une fois et retouchée en place. */
  const souffle = souffleCourant();
  const places = Array.from({ length: S.you.mainVisible ?? 5 }, (_, i) => main[i] ?? null);
  accorder(boite, clesDe(places.map((id, i) => id ?? `vide@${i}`)),
    (_cle, i) => {
      const id = places[i];
      if (!id) return fabriquer('<div class="acte vide"></div>');
      return fabriquer(`<div class="acte">
        <svg class="sceau" viewBox="0 0 24 24"><path d=""/></svg>
        ${window.TBF_ACTION.illustration(id)}
        <div class="co"></div>
        <div class="nm"></div>
      </div>`);
    },
    (el, _cle, i) => {
      const id = places[i];
      if (!id) return;
      const a = acteDe(id);
      const fam = window.TBF_ACTION.famDe(a);
      // Décomptée depuis la dernière vérité : voir `rechargeRestante`.
      const reste = rechargeRestante(id);
      const injouable = Boolean(!a || souffle < a.cost || reste || busy);
      el.classList.toggle('hs', injouable);
      if (injouable) { if (el.hasAttribute('data-acte')) el.removeAttribute('data-acte'); }
      else if (el.dataset.acte !== id) el.dataset.acte = id;
      if (el._fc !== fam.c) { el._fc = fam.c; el.style.setProperty('--fc', fam.c); }
      const trace = el.querySelector('.sceau path');
      if (trace.getAttribute('d') !== fam.ico) trace.setAttribute('d', fam.ico);
      ecrire(el.querySelector('.co'), a?.cost ?? '?');
      ecrire(el.querySelector('.nm'), a?.nom ?? id);
      let rebours = el.querySelector('.cd');
      if (reste) {
        if (!rebours) {
          rebours = fabriquer('<div class="cd"></div>');
          el.appendChild(rebours);
        }
        ecrire(rebours, Math.ceil(reste));
      } else if (rebours) rebours.remove();
    });
}

/**
 * La fenêtre collective, quand elle est ouverte.
 *
 * C'est la seule information du Virage qui vienne de la main de quelqu'un
 * d'autre, et elle ne vaut que si on la voit tout de suite : une fenêtre
 * d'Appel dure cinq secondes, un Chœur trois. Elle se pose donc au-dessus des
 * cartes, en vert, et elle bat.
 */
function renderAppel() {
  const mien = S?.you?.side;
  const f = (S?.rally ?? []).find((r) => r.side === mien && r.reste > 0);
  const el = $('appel');
  if (!f) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = f.sync
    ? 'TOUS ENSEMBLE<small>chante maintenant, tout le monde en même temps</small>'
    : 'CHANTE MAINTENANT<small>le capo a appelé : ta poussée compte plus</small>';
  /* La minuterie est nulée en même temps qu'elle est armée : `clearTimeout`
     laisse un identifiant vrai derrière lui, et un test « si une minuterie
     court » serait alors vrai pour toujours. */
  clearTimeout(el._t); el._t = null;
  el._t = setTimeout(() => { el.hidden = true; el._t = null; }, f.reste);
}

$('actes').addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-acte]');
  if (!el || busy || !S) return;
  const a = acteDe(el.dataset.acte);
  if (!a) return;
  if (souffleCourant() < a.cost) return fail('ferveur.error.not_enough_breath');
  /* On envoie et on attend le serveur. L'animation part sur l'événement qu'il
     renvoie, pas sur le clic : une carte refusée — une recharge qu'on n'avait
     pas vue, une condition manquante — ne doit pas avoir traversé l'écran
     avant que le refus arrive. */
  socket.emit('virage:jouer', { cardId: a.id });
});

/**
 * Ce que la salle voit quand une carte part.
 *
 * Les événements arrivent à **toute** la tribune, pas seulement à celui qui a
 * joué : une Collecte qui remplit le souffle de trois cents personnes sans que
 * personne ne sache d'où ça vient n'est pas une carte collective, c'est un
 * bug apparent.
 */
function raconterActe(ev) {
  const mien = S?.you?.side;
  for (const e of ev) {
    const pour = e.side === mien;
    switch (e.t) {
      case 'action': {
        // La tribune de celui qui joue bat : c'est le signal le plus large de
        // l'écran, et il part même pour une carte qu'on n'a pas jouée soi-même.
        stade?.pulse(e.side);
        const a = acteDe(e.cardId);
        /* La carte en grand, avec son dessin — la même mise en scène qu'au
           duel. Elle part vers le nœud, où l'effet va se lire. */
        const n = $('knot').getBoundingClientRect();
        window.TBF_ACTION.jouee(a, { pour,
          vers: { x: n.left + n.width / 2, y: n.top + n.height / 2 } });
        break;
      }
      case 'rally':
      case 'sync':
        if (pour) {
          S.rally = [...(S.rally ?? []), { side: e.side, reste: e.duree,
            sync: e.t === 'sync' }];
          renderAppel();
        }
        FX?.son?.(pour ? 'parfait' : 'tic');
        break;
      case 'effect':
        if (e.type === 'team_breath' && pour) float(`+${e.valeur} à la tribune`, 'var(--vert)');
        break;
      default: break;
    }
  }
}

/* ------------------------------------------- quitter la tribune

   **On partait sans un mot, et sans le dire au serveur.**

   Deux manques, et le second est le plus sale. La page n’émettait jamais
   `virage:leave` : on comptait sur la coupure de la socket pour que le
   serveur finisse par comprendre. Entre les deux, la tribune gardait un
   supporter qui n’était plus là — compté dans la foule, dans le classement
   de la salle, dans ce que les autres voient.

   Et rien ne prévenait le joueur. Un duel qu’on quitte est un forfait, et il
   se dit — voir duel-nvn.html. Une tribune qu’on quitte ne coûte rien de
   pareil, mais elle coûte quelque chose : on cesse de pousser, on perd sa
   place dans la salle, et les cartes-souvenirs se frappent chez **les
   présents** au moment du but. Partir juste avant un but n’est pas neutre.

   La question est donc légère et elle dit vrai : on peut revenir, et voilà ce
   qu’on manque en attendant. Une confirmation qui dramatiserait une sortie
   sans conséquence apprendrait à passer outre — et le jour où elle compte,
   personne ne la lirait.

   On intercepte la flèche et le menu, qui sont les deux sorties. Pas la
   fermeture de l’onglet : aucune page ne peut la retenir honnêtement, et la
   coupure de socket la couvre déjà. */

/** Dans la tribune : le serveur nous a donné un état, donc on y est. */
const dansLaTribune = () => Boolean(S);

async function quitterLaTribune() {
  return window.TBF_DIALOGUE?.confirmer({
    titre: 'QUITTER LA TRIBUNE ?',
    texte: 'Tu peux revenir quand tu veux, le match continue sans toi. '
      + 'En attendant tu ne pousses plus, et les cartes-souvenirs se frappent '
      + 'chez ceux qui sont là au moment du but.',
    oui: 'SORTIR',
    non: 'RESTER',
  }) ?? true;
}

document.addEventListener('click', async (e) => {
  /* **`.tbf-menu` n'existe nulle part**, et n'a jamais existé : le tiroir monté
     par `menu.js` s'appelle `.tbf-tiroir`. Ce sélecteur ne désignait donc que la
     flèche, et le commentaire au-dessus — « on intercepte la flèche et le menu,
     qui sont les deux sorties » — ne décrivait qu'une moitié de lui-même.

     Conséquence : sortir d'une tribune **par le menu** ne demandait rien et
     n'émettait pas `virage:leave`. La salle gardait un supporter parti, compté
     dans la foule et dans son classement, jusqu'à ce que la coupure de socket
     soit constatée — exactement le défaut que ce bloc dit réparer.

     `a[href^="/"]` et non `a` : la déconnexion porte `href="#"` et a déjà sa
     propre confirmation. L'attraper ici la ferait demander deux fois, puis
     naviguer vers `#`, c'est-à-dire nulle part. */
  const sortie = e.target.closest('.tbf-retour, .tbf-tiroir a[href^="/"], [data-quitter-virage]');
  if (!sortie || !dansLaTribune()) return;
  e.preventDefault();
  e.stopPropagation();
  const ou = sortie.getAttribute('href') || '/';
  if (!(await quitterLaTribune())) return;
  /* **On prévient le serveur avant de partir**, et on lui laisse le temps de
     l’entendre : une navigation immédiate couperait la socket, et la tribune
     garderait le fantôme jusqu’à ce que la coupure soit constatée. */
  socket?.emit('virage:leave');
  // La tribune se vide avec lui : la rumeur ne doit pas le suivre dans le
  // couloir pendant les cent quatre-vingts millisecondes du départ.
  window.TBF_SON?.ambiance?.(0);
  setTimeout(() => { location.href = ou; }, 180);
}, true);
/* La page quittée autrement — l'onglet fermé, le retour du navigateur, une
   page gardée en cache — vide aussi la tribune : une page restaurée depuis
   le cache repart du silence, et la seconde suivante la rallume (voir
   `ambianceDuMatch`). */
addEventListener('pagehide', () => { window.TBF_SON?.ambiance?.(0); });
/* -------------------------------------------------------------- réseau */

function connect() {
  /* Voir duel-nvn.html : polling d’abord, websocket ensuite. L’ordre
     inverse fait abandonner le client sur un réseau qui bloque le
     websocket, ce qui est le cas courant en mobile. */
  socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });

  socket.on('connect', () => { if (S) socket.emit('virage:join', { fixtureId: S.fixture.id }); });

  socket.on('virage:state', (s) => {
    S = s; $('veil').classList.remove('on');
    /* L'état porte le souffle et les recharges du moment : les deux horloges
       locales repartent de lui. Et la minute de l'entrée, que garde le fil
       pour ne pas rejouer ce qui était déjà au tableau — voir « virage:fil ».
       Nulle ou vieillie, les minutes reçues ensuite la relèvent : voir
       `minuteApprise`. */
    souffleVuA = cdVuA = entreeA = Date.now();
    entreeMinute = s.minute ?? null;
    renderStatic(); render();
    /* Le personnage entre avec la tribune. Le serveur le donne à l'âge
       atteint : c'est le Fanzzy que le joueur a choisi, pas sa racine — la
       page n'a rien à recalculer, et ne peut donc pas se tromper d'âge. */
    if (S.you?.fanzzy) scene?.definir(S.you.fanzzy);
    // Le fil arrive avec l'état : entrer à la soixantième minute donne ce qui
    // s'est passé avant, pas un écran vide.
    renderFil();
    banner('TU ES DANS LE VIRAGE');
    ambianceDuMatch();
    /* **Le niveau a monté depuis la dernière visite ?** La fête le dit, une
       fois, à l'entrée : avant le coup d'envoi plutôt qu'au premier but — la
       fête (170) passerait devant le moment fort (95). Elle lit `/api/niveau`
       elle-même, une seule fois ; la page ne la lit pas. Le Fanzzy est celui
       que le serveur vient de donner, à la forme de l'avatar, pour la pose
       victoire ; sans lui, la rosette seule. Rien à fêter, rien ne s'ouvre.
       Le drapeau ne se lève qu'une fois la fête chargée (elle part en
       différé) : un état reçu avant elle laisse la question au suivant. */
    if (!feteDemandee && window.TBF_NIVEAU?.depuisVisite) {
      feteDemandee = true;
      window.TBF_NIVEAU.depuisVisite(null, { avatar: S.you?.fanzzy ?? undefined });
    }
  });

  /* Le fil du match. Le serveur n'envoie que le neuf ; la page tient la liste,
     puisqu'elle l'a reçue entière à l'entrée. Renvoyer le fil complet à chaque
     carton coûterait, sur un samedi chargé, soixante entrées fois mille
     supporters à chaque événement. */
  socket.on('virage:fil', (f) => {
    if (!S) return;
    S.fil = [...(S.fil ?? []), ...(f.entrees ?? [])]
      .sort((a, b) => (a.minute ?? 0) - (b.minute ?? 0)
        || (a.extra ?? 0) - (b.extra ?? 0) || a.rang - b.rang);
    if (f.scoreReel) S.scoreReel = f.scoreReel;
    if (f.minute != null) S.minute = f.minute;
    /* Avant la boucle : le relevé qui apporte tout ce qui s'est passé avant
       porte aussi la minute où il le dit, et c'est elle qui l'écarte quand
       l'état n'en avait pas — voir `minuteApprise`. */
    minuteApprise(f.minute);
    renderFil({ neuf: true });
    // Le personnage réagit aux entrées **neuves** seulement. Les rejouer
    // toutes à chaque arrivée ferait célébrer un carton de la douzième minute.
    /* **Neuves pour le fil n'est pas neuves pour le joueur.** Le premier
       relevé d'un match qu'on n'avait jamais relevé envoie tout ce qui s'est
       passé avant : entrer à la cinquantième jouait « ROUGE POUR EUX » pour
       un carton de la vingtième, et « BUT REFUSÉ » pour une vidéo de la
       trentième. Ce qui précède l'entrée va au fil et à la feuille, pas au
       personnage. Deux minutes de grâce : le relevé a du retard, et un carton
       de la soixante-neuvième publié quand on entre à la soixante et onzième
       est neuf pour qui vient d'arriver. Les périodes passent toujours :
       elles disent où en est le match maintenant, pas ce qui s'y est passé.
       Et ce qui reste attend la fin du geste : voir `apresLaFenetre`. */
    for (const e of f.entrees ?? []) {
      if (dAvantLEntree(e)) continue;
      apresLaFenetre(() => reagirAuFil(e));
    }
  });

  socket.on('virage:tick', (t) => {
    if (!S) return;
    S.rope = t.rope; S.goals = t.goals; S.crowd = t.crowd; S.surge = t.surge;
    render();
  });

  /* Deux horloges locales, parce que le serveur ne parle pas assez souvent
     pour elles.

     La corde arrive dix fois par seconde, mais **seulement quand elle bouge** :
     une salle où personne ne chante ne diffuse rien du tout. Le souffle et la
     minute, eux, avancent quand même — et sans ces deux battements, la jauge
     restait bloquée jusqu'au chant suivant et la minute jusqu'au prochain
     relevé. Le joueur en concluait, à raison, que rien ne se passait. */
  setInterval(() => { if (S && !document.hidden) { render(); ambianceDuMatch(); } }, 1000);
  setInterval(() => { if (S && !document.hidden) renderFil(); }, 15000);

  socket.on('virage:result', (r) => {
    // Son propre chant fait battre sa tribune : le geste a un écho à l'écran.
    stade?.pulse(S?.you?.side ?? 0);
    if (!S) return;
    // Le serveur fait foi : on repart de sa valeur, et le regain local
    // recommence à compter à partir de cet instant.
    S.you.breath = r.breath; souffleVuA = Date.now(); S.you.ferveur = r.ferveur;
    $('verdict').textContent = r.quality > 0.9 ? 'PARFAIT' : r.quality > 0.7 ? 'BON'
      : r.quality > 0.4 ? 'MOYEN' : 'RATÉ';
    /* Le chiffre part de la corde, là où le joueur regarde — **et il est gros**.
       Il ne l'était pas : vingt-deux pixels qui montaient et s'effaçaient en une
       seconde, par-dessus une corde qui bouge, une foule qui s'anime et un fil
       de match qui défile. Quelqu'un qui venait de tenir une jauge huit secondes
       ne voyait pas ce que ça lui avait rapporté, donc ne pouvait pas savoir si
       le geste avait valu la peine — la seule chose qu'un mini-jeu doit lui
       apprendre.

       Le mot sous le nombre dit de quoi il s'agit : « POUSSÉE » quand ça part,
       « CONTRE TOI » quand le geste se retourne. Un chiffre rouge sans mot se
       lit comme une erreur d'affichage, pas comme un retour de flamme. */
    window.FX?.points(r.backfire ? -r.push : r.push, $('knot'), {
      /* La couleur vient de la palette de `fx.js` et non d'une variable CSS :
         l'élément est posé sur `document.body`, et un `var(--projo)` le lierait
         à une feuille que cette couche n'a aucune raison de supposer chargée. */
      couleur: r.backfire ? window.FX.couleurs.feu : window.FX.couleurs.or,
      quoi: r.backfire ? 'CONTRE TOI' : 'POUSSÉE',
    });
    // Un geste parfait déclenche le Cri du Fanzzy : c'est la récompense de la
    // précision, et le seul moment où l'écran entier réagit.
    if (r.quality > 0.95 && S.you.fanzzy?.cri) {
      window.FX?.cri(S.you.fanzzy.cri, { couleur:'var(--projo)' });
    }
    // Il pousse le temps du chant, puis revient à son attente. Un geste raté
    // le fait pousser aussi : c'est l'effort qui se voit, pas le résultat.
    scene?.pose('pousse', 2600);
    buzz(r.quality > 0.9 ? [20, 30, 40] : 12);
    // La tribune pousse après son chant, cinq secondes, puis retombe seule
    // au niveau du match.
    window.TBF_SON?.ambiance?.(2, { pendant: 5000 });
    render();
  });

  socket.on('virage:goal', (g) => {
    // La tribune s'embrase. Une fois, et longuement : c'est le moment.
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    // Le score de ce but-ci, lu maintenant : il peut avoir changé quand le
    // geste en cours se ferme.
    const score = [S.goals[S.you.side], S.goals[S.you.side ^ 1]];
    /* L'ovation de sa tribune (neuf secondes au plus, puis la rumeur revient
       seule), quand c'est elle qui fait céder la corde. Pas quand c'est celle
       d'en face : ce qu'on entend est sa propre tribune, et elle ne fête pas
       un but encaissé — le duel fait de même. `FX.but` garde ses deux sons,
       la corne pour soi, « encaisse » pour l'autre camp. */
    if (mien) window.TBF_SON?.ambiance?.(3);
    sentirLeBut(mien);
    /* Ce qui couvre l'écran attend la fin du geste : voir `apresLaFenetre`.
       Un but de corde naît des chants, donc tombe souvent pendant le sien. */
    apresLaFenetre(() => {
      // Les effets viennent de la couche commune : une seule définition du
      // « but » pour tout le jeu, duel compris.
      window.FX?.but({ pour: mien, score });
      /* Le personnage porte l'annonce, quinze secondes. La bande du milieu ne
         sert plus que de repli : deux fois la même phrase à deux endroits de
         l'écran, ce serait du bruit. */
      if (scene) {
        scene.moment(mien ? 'but' : 'encaisse',
          mien ? 'LA CORDE CÈDE !' : 'ILS ONT FAIT CÉDER LA CORDE',
          { couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)' });
      } else {
        banner(mien ? 'BUT DE LA TRIBUNE !' : 'ILS ONT FAIT CÉDER LA CORDE');
      }
    });
  });

  socket.on('virage:real_goal', (g) => {
    // Un but sur le terrain embrase la tribune du club qui vient de marquer.
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    // Le score du terrain suit le but sans attendre le prochain tour du
    // relevé : c'est la seconde où le joueur le regarde.
    if (g.scoreReel) { S.scoreReel = g.scoreReel; renderFil(); }
    // L'ovation, pour un but de son club seulement : voir « virage:goal ».
    if (mien) window.TBF_SON?.ambiance?.(3);
    sentirLeBut(mien);
    /* Le reste couvre l'écran, et attend la fin du geste : voir
       `apresLaFenetre`. La tribune, le score et la rumeur, eux, sont déjà
       partis. */
    apresLaFenetre(() => {
      window.FX?.butReel({ pour: mien, buteur: g.player, minute: g.minute });
      /* « GOAL ! » sur le personnage, avec le buteur et la minute — ils
         arrivent déjà dans l'événement, aucun appel de plus. Quinze secondes :
         le temps de sortir le téléphone de sa poche, un but de deux secondes
         et demie n'a laissé aucune trace. */
      scene?.moment(mien ? 'but' : 'encaisse', mien ? 'GOAL !' : 'ON ENCAISSE', {
        // Le but est écrit aux couleurs de l'équipe qui l'a marqué : le sien
        // dans les couleurs du club, celui d'en face en rouge d'alerte — on ne
        // célèbre pas un but encaissé, fût-ce joliment.
        couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)',
        sous: [g.player, g.minute != null ? `${g.minute}′` : ''].filter(Boolean).join(' · '),
      });
      window.FX?.bandeau('MINUTE DOUBLE', mien ? '#F5C33B' : '#E0402C');
      /* La carte-souvenir vient après le but qu'elle fête. Un geste ouvert
         dans l'intervalle la fait attendre encore : elle tient le milieu de
         la fenêtre quatre secondes. */
      if (mien) setTimeout(() => apresLaFenetre(() => souvenir(g)), 1400);
    });
  });

  /* Le vrai match : score, minute, période. Il descend dès que le relevé du
     direct les voit bouger, sans attendre qu'une entrée de fil se produise. */
  socket.on('virage:match', (v) => {
    if (!S) return;
    if (v.scoreReel) S.scoreReel = v.scoreReel;
    if (v.minute != null) S.minute = v.minute;
    // Il précède le fil du même relevé : voir `minuteApprise`.
    minuteApprise(v.minute);
    S.minuteExtra = v.minuteExtra ?? null;
    if (v.vuA) S.vuA = v.vuA;
    if (v.statut) S.statut = v.statut;
    renderFil();
  });

  socket.on('virage:crowd', (c) => { if (S) { S.crowd = c.crowd; render(); } });

  /* Ce que fait une carte — la sienne comme celle d'un voisin. Diffusé à toute
     la tribune : c'est là qu'est l'intérêt d'un Appel du capo. */
  socket.on('virage:events', (m) => { if (S) raconterActe(m.evenements ?? []); });

  /* Et l'état personnel qui en découle : la main, le souffle, les recharges.
     Séparé des événements parce qu'il n'appartient qu'à une personne — la
     salle n'a pas à connaître la main de chacun. */
  /* Le répertoire a tourné : cinq autres chants, et un autre motif d'écho.
     La *fenêtre* de l'écho ne vient pas de ce message — elle est personnelle
     (Métronome, équipement) et la page tient déjà la sienne ; seul le motif
     appartient à la tribune, qui le chante ensemble. */
  socket.on('virage:repertoire', ({ cards, echo } = {}) => {
    if (!S || !cards) return;
    S.cards = cards;
    if (echo && S.you?.gestes?.echo) {
      S.you.gestes.echo = { ...S.you.gestes.echo, motif: echo.motif,
                            instants: echo.instants };
    }
    renderChants();
    render();
  });

  socket.on('virage:vous', (you) => {
    if (!S || !you) return;
    S.you = { ...S.you, ...you };
    /* Il porte le souffle et les recharges **de cet instant** : les deux
       horloges locales repartent d'ici. Il arrive après une carte jouée et à
       chaque carte tirée ; une main vide qui se remplit refait paraître la
       rangée, et `renderActes` la remet en place sans recréer ses cases. */
    souffleVuA = cdVuA = Date.now();
    render();
  });

  socket.on('virage:error', (e) => fail(e.code));
}

/** Le temps que la carte-souvenir reste à l'écran. */
const SOUVENIR_MS = 4200;

/** La carte-souvenir à l'écran : son but, l'instant où elle s'éteint, et la
    minuterie qui l'éteindra. Nulle quand il n'y en a pas. */
let souvenirAffiche = null;

/** Annonce de la carte-souvenir. Le serveur l'a déjà frappée. */
function souvenir(g, ms = SOUVENIR_MS) {
  const el = $('souvenir');
  /* Une minuterie à la fois : celle de la carte d'avant, encore en cours,
     éteignait la suivante avant son temps — deux buts rapprochés, ou une
     carte rangée pendant un geste qui revient juste avant une autre, voir
     `rangerLeSouvenir`. */
  clearTimeout(souvenirAffiche?.minuterie);
  el.innerHTML = `<div class="t">CARTE-SOUVENIR</div>
    <div class="m">${g.player ?? 'BUT'} ${g.minute}'</div>
    <div class="d">Tu y étais. Elle est dans ton carnet.</div>`;
  el.className = 'souvenir on';
  souvenirAffiche = {
    g, fin: Date.now() + ms,
    minuterie: setTimeout(() => { el.className = 'souvenir'; souvenirAffiche = null; }, ms),
  };
}

/**
 * Un geste s'ouvre sur une carte-souvenir encore à l'écran : elle se range,
 * et revient à la fermeture pour le temps qui lui restait.
 *
 * Celle qui naît pendant le geste attend déjà sa fin (`apresLaFenetre`).
 * Celle qui était là avant restait : quatre secondes au milieu de la colonne,
 * au-dessus de la fenêtre du geste, sur plus d'un tiers du pavé et son
 * centre. Le cas n'a rien de rare — elle paraît une seconde et demie après
 * un but de son club, en pleine minute double, et c'est le moment où l'on
 * relance un chant. Le doigt passe (`pointer-events: none`), mais le pavé
 * est caché.
 *
 * Elle n'est pas coupée comme la case du moment : elle annonce un gain, et
 * le joueur l'a souvent à peine vue. Le geste la met en pause, comme les
 * cartes des autres (`TBF_ACTION.suspendre`) : elle passe en tout ses quatre
 * secondes à l'écran, pas huit — une carte qui s'attarde en grand après avoir
 * été lue se prend pour une seconde, la méprise de la carte jouée qui
 * revenait (action-art.js). Moins d'une seconde de reste : elle a été lue,
 * et un éclair d'elle à la fermeture ne dirait rien de plus.
 */
function rangerLeSouvenir() {
  const s = souvenirAffiche;
  const el = $('souvenir');
  if (!s || !el.classList.contains('on')) return;
  clearTimeout(s.minuterie);
  souvenirAffiche = null;
  el.className = 'souvenir';
  const reste = s.fin - Date.now();
  if (reste >= 1000) apresLaFenetre(() => souvenir(s.g, reste));
}

/* ----------------------------------------------------------- choix du match */

(async () => {
  /* **La socket ne doit jamais empêcher la page de s’afficher.**
  
     `io` vient de /socket.io/socket.io.js, servi par le serveur lui-même. Ce
     fichier peut manquer — un mandataire qui ne relaie pas ce chemin, une
     extension qui le bloque, une coupure au mauvais moment — et `io` est alors
     **indéfini**. L’appel levait, la fonction de démarrage rejetait, et rien
     de ce qui suit ne se jouait : aucun appel au serveur, aucun rendu.
  
     Vu du joueur, les deux seuls écrans qui chargent cette bibliothèque
     tombaient ensemble et en silence — le duel restait sur son « Chargement… »
     et le Virage restait blanc. Rien ne pouvait le lui expliquer, puisque le
     code qui aurait pu parler était après la ligne qui levait.
  
     Or la liste des matchs n’a aucun besoin de socket : elle arrive par des
     appels ordinaires. Seul **jouer** en a besoin. On sépare donc les deux : la
     page se dessine toujours, et l’absence de direct se dit à l’endroit où elle
     change quelque chose.
  
     Le rattrapage est volontairement large — `io` absent lève une
     ReferenceError, le constructeur peut lever autre chose. Ce qu’on veut ici
     n’est pas distinguer les causes, c’est ne pas perdre la page. */
  let sansDirect = false;
  try { connect(); }
  catch (e) { sansDirect = true; console.error('[virage] socket', e.message); }

  /* Entrer directement dans un match, par son adresse.

     La fiche d'un match propose « GRAND VIRAGE » : le bouton doit mener **à
     ce match-là**, pas à une liste où il faut le retrouver. Le camp n'est pas
     donné ici — le serveur le déduit des clubs suivis, et propose de le
     choisir si aucun des deux n'est à nous. */
  const demande = Number(new URLSearchParams(location.search).get('match'));
  const parLien = Number.isInteger(demande) && demande > 0 ? demande : null;

  let matchs = [];
  const lire = async () => {
    try {
      const r = await fetch('/api/virage/live', { credentials:'same-origin' });
      if (r.status === 401) { location.href = '/compte'; return false; }
      const rep = await r.json();
      matchs = rep.matchs ?? [];
      // La part de ferveur d'un neutre vient du serveur : la recopier ici ferait
      // une seconde vérité, qui finirait par annoncer 50 % là où il en donne 40.
      FERVEUR_NEUTRE = rep.ferveurNeutre ?? FERVEUR_NEUTRE;
      return true;
    } catch { return false; }    // serveur injoignable : on garde la liste
  };
  await lire();

  /* Le score du match, avant d'entrer.
     L'écran de choix donnait le nom des deux clubs, la compétition et la
     minute — mais pas le score. On choisissait donc d'entrer dans un virage
     sans savoir si son club menait ou encaissait, ce qui est exactement ce
     qu'on veut savoir avant de pousser. Il est dans la réponse depuis
     toujours, il n'était simplement pas affiché. */
  /* Deux sections, et la distinction porte tout le sens.

     **Chez soi**, le camp ne se choisit pas : il découle du club suivi, et la
     ferveur compte plein. **Ailleurs**, on choisit son camp et elle compte
     moitié. Le virage n'affichait que les matchs de ses clubs : un soir de
     Coupe d'Europe avec huit rencontres en direct, il en montrait une, et le
     joueur en concluait qu'il n'y avait rien à faire. */
  /* La minute d'un match de la liste, par la **même** horloge que partout
     ailleurs. Elle affichait `m.elapsed` tel quel : la minute du moment où le
     serveur avait interrogé l'API, figée jusqu'au rechargement de la page.
     Une rencontre y restait à la 71e pendant vingt minutes. */
  const minuteDe = (m) => window.TBF_HORLOGE.texte(
    { statut: m.status_short, minute: m.elapsed, extra: m.elapsed_extra, vuA: m.luA },
    { HT: 'MT', BT: 'PAUSE', INT: 'INTERROMPU' }) || (m.elapsed ? m.elapsed + "'" : 'BIENTÔT');

  /* ------------------------------------------------------- la recherche

     Depuis que la liste montre **tout** ce qui se joue, elle fait quarante
     lignes un samedi soir. Le même geste que sur la page des matchs et celle
     des compétitions, et la même promesse : une équipe, une compétition, ou un
     pays **dans sa langue** — la traduction se fait chez le lecteur, à partir
     du code ISO que porte le drapeau. Tout cela vit dans `public/pays.js`,
     écrit une fois pour les trois pages. */
  const { pli, cherches: paysCherches } = window.TBF_PAYS;
  const nomPays = (m) => window.TBF_PAYS.nom(m.pays, m.drapeau);

  let terme = '';

  function filtrer(liste) {
    if (!terme) return liste;
    const cherches = paysCherches(terme);
    const estCePays = (nom) => Boolean(nom)
      && cherches.some((p) => pli(nom).includes(p));
    return liste.filter((m) =>
      pli(m.home_name).includes(terme) || pli(m.away_name).includes(terme)
      || pli(m.league_name).includes(terme)
      || pli(m.pays).includes(terme) || pli(nomPays(m)).includes(terme)
      || estCePays(m.pays)
      // Une sélection nationale porte le nom de son pays, en anglais.
      || estCePays(m.home_name) || estCePays(m.away_name));
  }

  const carte = (m) => {
    const joue = m.home_goals != null && m.away_goals != null;
    /* **Une ligne éteinte doit dire pourquoi.** Un match terminé restait gris
       et muet, avec la minute de son dernier relevé : on le lisait comme un
       match en cours sur lequel le doigt ne prenait pas. Le mot remplace la
       minute — c'est la même place, et c'est la même information : où en est
       cette rencontre. */
    const etat = m.open ? `<i>${minuteDe(m)}</i>`
      : m.fini ? '<i class="fini">TERMINÉ</i>' : '';
    return `<div class="match ${m.open ? '' : 'off'} ${m.mien ? '' : 'ailleurs'}"
      data-id="${m.id}" data-mien="${m.mien ? 1 : 0}">
      <img src="${esc(m.home_logo ?? '')}" alt="">
      <div class="n"><b>${esc(m.home_name)} – ${esc(m.away_name)}</b>
        <small>${esc(m.league_name ?? '')} · ${m.crowd[0] + m.crowd[1]} dans les tribunes</small></div>
      <img src="${esc(m.away_logo ?? '')}" alt="">
      <span class="st">
        ${joue ? `<b class="sc">${m.home_goals} – ${m.away_goals}</b>` : ''}
        ${etat}
      </span>
    </div>`;
  };

  const peindre = () => {
    /* Le champ ne paraît qu'à partir du moment où il sert. Sous une poignée de
       matchs, chercher est plus long que lire — et un champ de recherche devant
       trois lignes donne l'impression qu'il manque quelque chose. Il reste
       ensuite tant qu'on a tapé quelque chose, sinon il disparaîtrait sous les
       doigts au moment où le filtre vide la liste. */
    $('rech').hidden = matchs.length < 8 && !terme;

    const vus = filtrer(matchs);
    const miens = vus.filter((m) => m.mien);
    const autres = vus.filter((m) => !m.mien && m.open);
    const part = Math.round((FERVEUR_NEUTRE ?? 0.5) * 100);

    /* **Sans direct, on le dit au-dessus de la liste.** Pousser dans un
       virage demande une connexion permanente ; la liste, non. On montre donc
       ce qui se joue, et on prévient que l'entrée ne marchera pas.

       Les liens de texte de cette liste sont en craie grasse : ils étaient
       en or, et sous quatorze pixels l'or ne tient pas au soleil (arbitrage
       du 2 octobre 2026). */
    const avertir = sansDirect ? `<div class="rubrique alerte">
      PAS DE CONNEXION EN DIRECT
      <small>tu peux voir les matchs, pas entrer dans le virage ·
      <a href="/diagnostic" style="color:var(--craie);font-weight:700">voir pourquoi</a></small>
      </div>` : '';

    /* Les deux titres sont cousus (voir `.rubrique`) ; ce que coûte « ailleurs »
       s'écrit sur la ligne d'en dessous, hors du titre. */
    $('matchs').innerHTML = avertir + ((vus.length ? [
      miens.length ? `<div class="rubrique tbf-cousu">TES CLUBS</div>${miens.map(carte).join('')}` : '',
      autres.length ? `<div class="rubrique tbf-cousu">AILLEURS EN DIRECT</div>
        <div class="rubrique-sous">tu choisis ton camp · ferveur à ${part} %</div>${autres.map(carte).join('')}` : '',
    ].join('') : '')
      || (terme
        ? `<div class="vide">Aucun match ne répond à « ${esc(terme)} ».<br>
            Essaie un club, une compétition, ou un pays.</div>`
        : `<p>Aucun match en direct pour l’instant.<br>
            <a href="/equipes" style="color:var(--craie);font-weight:700">Suis un club</a>
            pour être prévenu quand le tien joue.</p>`));
  };
  peindre();

  /* **Entrer par un lien**, une fois la liste dessinée.
     Le geste est exactement celui d'un clic sur la carte du match : on entre
     directement si l'on suit un des deux clubs, et sinon la carte se déplie
     pour demander le camp. Le raccourci d'avant entrait **sans demander**, et
     plaçait donc tout neutre du côté du domicile sans qu'il l'ait choisi —
     invisible tant que ce chemin ne servait qu'au bouton d'une fiche de match,
     et faux dès qu'on partage un lien. */
  if (parLien) {
    const carteM = $('matchs').querySelector(`[data-id="${parLien}"]`);
    // Absent de la liste — un match qui n'a pas encore commencé : on tente
    // quand même, le serveur dira non s'il faut.
    if (carteM) {
      carteM.click();
      /* **On amène le match sous les yeux.** Si aucun des deux clubs n’est le
         nôtre, le clic ne fait pas entrer : il déplie la carte pour demander
         le camp — et cette carte pouvait se trouver n’importe où dans une
         liste de trente rencontres. Vu du joueur qui vient d’appuyer sur
         « GRAND VIRAGE » depuis une fiche de match, la page s’ouvrait
         simplement sur un menu, et rien ne disait que sa question était en
         bas de l’écran. */
      carteM.scrollIntoView({ block: 'center', behavior: 'smooth' });
      carteM.classList.add('vise');
    } else {
      socket.emit('virage:join', { fixtureId: parLien });
    }
  }


  /* ----------------------------------------------- faire venir du monde

     Un virage se pousse à plusieurs, et le jeu n'avait aucun moyen d'inviter
     qui que ce soit. Le seul canal qui marche est celui que les gens emploient
     déjà : « viens, je suis là », envoyé sur WhatsApp ou par message.

     Le lien porte **le match**, pas la tribune : celui qui arrive choisit son
     camp comme tout le monde, et s'il suit un des deux clubs il n'a même pas à
     choisir. L'envoyer d'office dans la tribune de l'expéditeur serait décider
     à sa place, parfois contre son propre club.

     Le bouton ne paraît que si le navigateur sait faire quelque chose : un
     bouton qui ne fait rien est pire que pas de bouton. */
  $('partager').hidden = !window.TBF_PARTAGE?.possible;
  $('partager').onclick = async (e) => {
    e.stopPropagation();
    const f = S?.fixture;
    const id = f?.id ?? demande;
    if (!id) return;
    // La salle nomme ses clubs `homeName`/`awayName` — voir `fixtureInfo`.
    const affiche = f?.homeName && f?.awayName
      ? `${f.homeName} – ${f.awayName}` : 'un match en direct';
    const quoi = await window.TBF_PARTAGE.envoyer({
      titre: 'Le Grand Virage',
      texte: `Je pousse sur ${affiche}. Viens tenir la corde avec moi.`,
      url: `/virage?match=${encodeURIComponent(id)}`,
    });
    if (quoi === 'copie') mot('Lien copié');
    else if (quoi === null) mot('Impossible de partager ici');
  };

  /* Court délai : filtrer à chaque frappe sur quarante matchs saccade, et le
     champ est souvent tenu d'un pouce. */
  {
    let t = null;
    $('q').oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => { terme = pli($('q').value.trim()); peindre(); }, 200);
    };
  }

  /* L'écran de choix vit aussi longtemps qu'un match — on peut l'ouvrir à la
     vingtième minute et entrer à la soixante-dixième. La liste était lue une
     fois, au chargement : le score et la minute y restaient ceux de l'arrivée,
     et l'on choisissait d'entrer dans un virage sur un 0–0 vieux d'une heure.

     On ne repeint pas pendant qu'un camp est proposé : la carte est dépliée
     sous le doigt du joueur, et la refaire sous lui est pire qu'une minute en
     retard. */
  setInterval(async () => {
    if (S) return;                                       // il est dans la tribune
    if ($('matchs').querySelector('.camps')) return;     // un choix est ouvert
    if (await lire()) peindre();
  }, 30_000);

  /* Entrer.
     Chez soi, on entre directement — le camp est déjà décidé par le club
     qu'on suit. Ailleurs, il faut choisir : la carte se déplie et propose les
     deux clubs, en disant ce que ça coûte. Demander après coup, une fois
     dedans, serait pire : on aurait déjà poussé du mauvais côté. */
  $('matchs').onclick = (e) => {
    const camp = e.target.closest('[data-camp]');
    if (camp) {
      const carteM = camp.closest('[data-id]');
      socket.emit('virage:join', {
        fixtureId: Number(carteM.dataset.id), camp: camp.dataset.camp,
      });
      return;
    }

    const m = e.target.closest('[data-id]');
    if (!m || m.classList.contains('off')) return;
    if (m.dataset.mien === '1') {
      socket.emit('virage:join', { fixtureId: Number(m.dataset.id) });
      return;
    }
    if (m.querySelector('.camps')) { m.querySelector('.camps').remove(); return; }
    const info = matchs.find((x) => String(x.id) === m.dataset.id) ?? {};
    document.querySelectorAll('#matchs .camps').forEach((n) => n.remove());
    /* Deux plaques au ton flare : choisir son camp, c'est entrer jouer. */
    m.insertAdjacentHTML('beforeend', `<div class="camps">
      <span>Tu pousses pour&nbsp;:</span>
      <button class="tbf-plaque" data-ton="flare"
        data-camp="domicile">${esc(info.home_name ?? 'Domicile')}</button>
      <button class="tbf-plaque" data-ton="flare"
        data-camp="exterieur">${esc(info.away_name ?? 'Extérieur')}</button>
    </div>`);
  };
})();
</script>

     fanzzy-art.js et fanzzy-etats.js, plus haut, lui donnent le personnage. -->
