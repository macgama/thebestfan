<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Grand Virage — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* =======================================================================
   Le Grand Virage — la page n'écrit que des places.

   **Le dessin est dans `ui.css`** (« les pièces du lot 6 ») : le HUD de
   match, le ticket terrain, le sticker de phase, la corde et son foulard,
   la foule au pochoir, les cartes, l'éventail, le tableau de tribune, la
   page kraft du bilan, l'affiche. Une pièce redessinée ici divergerait de
   celle du duel au premier réglage ; cette feuille ne dit donc que **où**
   chaque pièce se pose, et quelle taille la pièce lui laisse choisir. La
   carte-souvenir qui se retourne (`.tbf-souvenir`) et le panneau de ce
   qu'on porte posé hors de la colonne (`.tbf-apports-p--flottant`) ont
   leur pièce depuis le second tour : la page n'en écrit plus la matière.
   ======================================================================= */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow-x:clip;overscroll-behavior:none;touch-action:manipulation}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
/* **`hidden` cache, partout.** Les briques posent leur propre `display`
   (`flex`, `grid`, `block`) : une règle d'auteur l'emporte sur celle du
   navigateur, et un élément marqué `hidden` restait à l'écran — le bouton
   d'invitation sur un navigateur qui ne sait pas partager, la bande du fil
   avant l'entrée. */
[hidden]{display:none!important}
#app{position:relative;width:100%;max-width:var(--colonne);height:max(100dvh,var(--ecran-min));display:flex;flex-direction:column;
  background:linear-gradient(180deg,#141A21,#0A0D11 50%,#141A21);overflow:hidden}

/* ------------------------------------------------------------- le HUD

   La rangée `.tbf-hudm` et sa seconde rangée se placent seules, et la barre
   de `nav.js` se cale sur les deux écrans de jeu sans condition (à
   `--hudm-haut`, quatorze pixels sous l'encoche : l'air du sticker d'état
   du menu). Le HUD mesure donc 62 px — 14 d'air, 44 de bâches, 4 pour
   l'ombre — et non les 44 du budget : ces dix-huit pixels sont ceux que le
   sticker demande. Rien à écrire ici : la place est celle de la pièce.

   Une seule chose : **le sticker de phase se tient à droite de sa rangée**,
   même quand le ticket terrain se retire (rien de connu du vrai match,
   voir `renderFil`) — il ne glisse pas à la place du ticket. Tant que le
   ticket est là, il prend toute la place libre et cette marge ne vaut
   rien. */
#phase{margin-left:auto}

/* ------------------------------------------------------------- l'arène

   Ce qui reste de la hauteur, d'un bord à l'autre de la colonne : la seule
   rangée élastique de l'écran. À 360 × 640 (mesuré au banc), HUD 62, ticket
   24 et son air 14, tableau 52 et son air 8, actions 80 avec l'air des
   stickers de coût, main 134 entière à l'écran : 266 à l'arène, plus que
   ses 256. C'est elle qui cède sur un petit écran, jamais la main ni les
   chants. */
.rope{position:relative;flex:1 1 auto;min-height:150px;margin:8px calc(-1 * var(--gouttiere,0px)) 0;
  overflow:hidden;isolation:isolate;background:#070A0E;container:arene-virage / size}
/* **Le bandeau d'annonce** de l'administration (`.tbf-annonce`, que `nav.js`
   pose sous les deux rangées du HUD) : six pixels sous le ticket terrain,
   qu'il touchait par le haut, et l'air de l'arène dessous. Il ne fléchit
   pas : c'est l'arène qui lui cède sa hauteur, **sous son plancher
   ordinaire** s'il le faut, comme au duel (`#jeu[data-annonce]`). À
   320 × 568, elle butait sur ses 150 px et poussait la main hors de
   l'écran : de 7 px sous un bandeau de deux lignes, de 41 sous un de trois
   (mesuré au banc). */
#app>.tbf-annonce{flex:none;margin:6px 0 0}
.tbf-annonce~.rope{min-height:64px}
/* Sous son plancher ordinaire, l'arène rapproche ses lignes de but de ses
   bords, à proportion de sa hauteur : à quarante-quatre pixels de chaque
   bout, une arène de 109 px (trois lignes de bandeau à 320 × 568) ne
   laissait au foulard que vingt et un pixels de course, et il couvrait les
   deux lignes à la fois — on ne voyait plus de quel côté penchait la
   corde ; sous 88 px, les deux lignes se croisaient. Plus basse encore (un
   bandeau plus long, ou une droite du tableau passée à la ligne), elle ne
   garde que la corde, le foulard et les deux comptes : les foules s'y
   empilaient l'une sur l'autre, comme au duel.
   Toutes les pièces de l'arène sont posées en absolu : la mesurer comme un
   conteneur ne change pas sa hauteur. */
@container arene-virage (max-height:149px){ #rope .tbf-corde{--corde-marge:min(28px,24cqh)} }
@container arene-virage (max-height:79px){ #rope .tbf-foule{display:none} }
/* Le stade de la rencontre en fond (QUESTIONS Q5 : il porte une règle du
   jeu, la photo n'en porte aucune). La largeur imposée et la hauteur qui
   déborde : le terrain se coupe en haut et en bas, jamais les tribunes des
   côtés. L'atténuation porte sur le dessin seul — la lumière des tribunes,
   elle, doit se voir. */
.stade{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.5}
/* Les deux foules : la leur en haut, la mienne en bas, sous la corde. */
#crowdFoe{position:absolute;left:0;right:0;top:2px;z-index:2}
#crowdMe{position:absolute;left:0;right:0;bottom:2px;z-index:2}
/* « 312 EN FACE » : le compte reste un texte, posé sur un fond qui le porte
   — à même le stade et les silhouettes, il ne se lirait pas. */
.compte{position:absolute;right:8px;z-index:5;padding:2px 6px 1px;border-radius:3px;
  background:rgba(7,9,12,.8);box-shadow:0 0 0 1px rgba(242,238,228,.18);
  font-family:var(--banner);font-size:12px;font-weight:600;letter-spacing:.08em;line-height:1.25;
  color:var(--craie);pointer-events:none;white-space:nowrap}
.compte b{font-weight:700;font-variant-numeric:tabular-nums}
#compteEux{top:6px}
#compteMoi{bottom:8px}
/* « PERSONNE EN FACE » : le même compte, cerné en pointillé comme une place
   qui attend quelqu'un (`.tbf-ages`, l'âge suivant). */
#compteEux[data-personne]{box-shadow:none;outline:1px dashed rgba(242,238,228,.5);outline-offset:-1px}
/* Le Fanzzy, mains sur la corde, de mon côté : à 45 % de la hauteur de
   l'arène, à gauche de la corde et au-dessus de ma foule. Sous la corde
   (z 3 < 4) : le foulard passe devant lui, et le nombre qui bouge reste
   lisible. `pointer-events:none` : un personnage qui prendrait un appui
   coûterait un chant. */
.fzs{position:absolute;right:calc(50% + 14px);bottom:40px;width:40%;max-width:210px;height:45%;
  z-index:3;pointer-events:none}
/* Ce qu'il porte (`TBF_STUFF.porte`) : au bord gauche de sa boîte, à hauteur
   de hanche, loin de la corde. */
.fzs>.tbf-porte{left:0;bottom:16%;--piece:30px;gap:5px}
/* Les amis présents (`virage:amis`), en sticker au coin haut de l'arène. */
#amisIci{position:absolute;left:10px;top:8px;z-index:5;--rot:-3deg}
/* L'annonce de repli sur la corde, quand le personnage n'est pas monté. */
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--banner);
  font-size:15px;font-weight:700;letter-spacing:.18em;opacity:0;transition:opacity .3s;z-index:6;
  color:var(--craie);text-shadow:0 2px 0 var(--encre);pointer-events:none}
.banner.on{opacity:1}
.float{position:absolute;font-family:var(--banner);font-size:17px;pointer-events:none;z-index:6;
  animation:drift 1.2s ease-out forwards}
@keyframes drift{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-42px)}}
/* La fenêtre collective du capo : un ticket posé sur le bas de l'arène, le
   temps de la fenêtre. Elle vient d'une autre main que la sienne : c'est la
   seule chose de l'écran qui doit se voir de loin. */
.appel{position:absolute;left:50%;bottom:46px;z-index:8;translate:-50% 0;width:max-content;
  max-width:calc(100% - 28px);text-align:center;font-size:15px;letter-spacing:.1em;pointer-events:none}
.appel b{display:block;font-weight:700}
.appel small{display:block;margin-top:3px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:none}

/* ------------------------------------------------------- sous l'arène */
/* Le tableau, la rangée du souffle : les deux jauges, et à droite le combo,
   la pile des souvenirs et le « i » de ce qu'on porte. **La droite est
   rangée par la feuille** (« le tableau de tribune ») : ses objets passent
   à la ligne plutôt que de prendre aux jauges leur rail, et le tableau
   grandit alors de quarante-quatre pixels, que l'arène lui cède. Dans un
   tableau de moins de 360 px — tout téléphone —, le combo et la pile
   s'empilent (la pile en petit) et le « i » se tient à côté d'eux : le
   tableau reste à 52 px quand le combo paraît ou s'en va, et l'arène ne
   bouge plus (elle tombait de 210 à 166 px à 320, de 266 à 222 à 360 dès
   « 10 PARFAITS » ; mesuré au banc). Sans `:has()`, la droite passe encore
   à la ligne.
   **Le « i » se pose au ras du bout de la rangée** : sa zone de 44 px
   déborde de quatre pixels de chaque côté de sa face de 36 (la place que
   la pièce laisse à la page), et prend ainsi huit pixels de moins dans la
   rangée. */
.tableau{flex:none;margin-top:8px;min-height:52px}
.tableau #apportsL{margin:0 -4px}
/* Les actions, puis la main : la place des stickers de coût au-dessus. Les
   cartes d'action gardent 48 px jusqu'à 360 de large, et cèdent en dessous
   (40 à 320) : une rangée plus basse laisse ses pixels à l'arène, qui est
   la première à céder sur un petit écran. */
.rangee{flex:none;display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 0 2px}
.rangee:has(> .actes[hidden]){display:none}
.actes{display:flex;gap:8px;--carte-l:min(48px,calc((100vw - 120px) / 5))}
.actes>.tbf-carte{cursor:pointer}
.actes>.tbf-carte:is([data-etat=vide],[data-etat=injouable]){cursor:default}
/* Cinq chants de soixante-quatre pixels en éventail tiennent en 305 ; à
   320 px de large, la carte rétrécit plutôt que de sortir de l'écran.
   **Une limite acceptée, à 320 px seulement** : la carte n'y a que 57 px,
   et un geste de deux lignes sur un nom de trois (MARTELAGE sur LE
   ROULEMENT, LA BASCULE sur LE RENVERSEMENT) dépasse du haut de la carte,
   sous le coût et ce qui manque (30 % et 14 % du nom du geste couverts,
   mesurés par la feuille ; rien à 360). À 64 px, le coût des cartes du
   bout sortait de l'écran ; quatre chants au lieu de cinq retireraient de
   la main un chant que le serveur a donné et que rien d'autre ne joue. Le
   geste reste dit par la couleur de la carte, par son nom lu, et en entier
   en tête de la fenêtre du geste. */
/* Le bas garde l'air des deux cartes du bout, que l'éventail penche et
   abaisse de huit pixels : leurs coins sortaient de l'écran. */
.hand{flex:none;--carte-l:min(64px,calc((100vw - 48px) / 4.76));
  padding:22px 10px calc(16px + env(safe-area-inset-bottom));margin:0 calc(-1 * var(--gouttiere,0px))}

/* ------------------------------------------------- la fenêtre du geste

   Le pavé, sa bouffée et son tampon vivent dans `ui.css` et `geste.js`.
   Entre la fenêtre et le pavé, aucun conteneur n'a de fond : la bouffée
   d'une frappe passe derrière le pavé, et un fond la couvrirait. */
.mini{position:absolute;inset:0;background:rgba(5,7,10,.94);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:22px}
.mini.on{display:flex}
/* **La zone prend toute la largeur, le pavé se centre dedans.** Elle a
   besoin d'une largeur (les épreuves s'y taillent en pour cent), mais le
   pavé rond n'en prend que 270 px au plus : posé en bloc, il partait au
   bord gauche de la zone pendant que le titre, la consigne et le compte à
   rebours qui le précède restaient sur l'axe de l'écran (28 px de décalage
   à 360, 227 à 768). La ligne d'état des grilles (« REFAIS-LA ») et le
   cadre du tifo et de l'écharpe y partaient aussi.
   Les mêmes trois déclarations que le duel et que `#zone` de la salle de
   répétition : un geste se joue au même endroit sur les trois écrans. */
#miniZone{width:min(100%,var(--colonne));display:flex;flex-direction:column;align-items:center}
.mini .quoi{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0}
.mini .quoi .tbf-sticker{height:26px;font-size:13px}
/* La consigne du geste : la seule chose à lire avant de jouer. */
.mini p{margin:0;font-size:12.5px;text-align:center}
.mini p b{font-weight:700}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--banner);
  font-size:84px;color:var(--c);pointer-events:none;animation:cd .55s ease-out}
@keyframes cd{from{opacity:0;transform:scale(1.5)}60%{opacity:1}to{opacity:0;transform:scale(.85)}}

.err{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:18;
  background:rgba(158,31,18,.96);border-radius:6px;padding:9px 15px;font-size:12.5px;display:none;
  box-shadow:0 0 0 1.5px var(--encre)}
.err.on{display:block}

/* ------------------------------------------------ ce qu'on porte, sa place

   Le panneau des bonus et des malus vit **hors de la colonne** : déplié
   dans la rangée du souffle, il poussait la main hors de l'écran. Il se
   pose en bas de l'écran, sous la barre et le tiroir (44 < 45), au-dessus
   du jeu. Sa matière de panneau qui flotte est la pièce
   `.tbf-apports-p--flottant` ; la page n'écrit que sa place. La
   carte-souvenir (`.tbf-souvenir`) n'a rien à placer : la pièce la pose au
   centre, au calque 96. */
#apportsP{position:fixed;z-index:44;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:min(420px,calc(100vw - 24px))}
#apportsP .ecartees{margin:8px 0 2px;font-size:12px;line-height:1.5}
#apportsP .ecartees a{color:var(--craie);font-weight:700;text-decoration:underline;text-underline-offset:2px;
  white-space:nowrap}

/* La page du bilan prend le focus elle-même (voir `montrerBilan`) : pas
   d'anneau autour de toute la page. */
#bilan:focus{outline:none}
/* **Le rang ouvre la feuille, en grand** : trente-quatre pixels au lieu des
   vingt-deux des autres lignes — c'est le chiffre du match, et huit lignes
   de même poids n'en disaient aucun. Ce qui reste à gagner (« À 1 PLACE DU
   TOP 10 ») se pose en sticker craie sous son libellé, à gauche ; « sur 46 »
   reste sous le chiffre. */
#bilan .tbf-bilan-l.rang>b{font-size:34px}
#bilan .tbf-bilan-l.rang>b sup{font-size:15px}
#bilan .tbf-bilan-l.rang>.tbf-sticker{grid-column:1;grid-row:2;justify-self:start;margin:3px 0 5px 3px}
/* **La case de BD du coup de sifflet** et sa bouffée, à la même place qu'au
   duel (`.bilan-case` de `duel-nvn.html`) : la bouffée derrière la case, à
   sa couleur, dans une boîte qui l'isole. */
.bilan-case{position:relative;display:grid;place-items:center;isolation:isolate}
.bilan-case>.tbf-bouffee{--taille:300px}
.bilan-case>.tbf-vignette{position:relative;z-index:1}
.bilan-case .tbf-vignette small{display:block;margin-top:7px;font-family:var(--banner);font-size:14px;
  font-weight:600;letter-spacing:.12em;color:var(--craie);font-variant-numeric:tabular-nums}
/* **Les deux bâches de sortie restent sous le pouce.** Au coup de sifflet,
   la case et le Fanzzy poussent la feuille de deux cents pixels : à
   360 × 640, UN AUTRE MATCH tombait à 758 px, sous le pli, sur une page
   que le joueur n'a pas demandée et qui doit lui dire quoi faire ensuite.
   Elles se tiennent donc au bas de l'écran tant que la feuille défile
   dessous, sur un fondu du mur qui garde la feuille hors des lettres — et
   jusqu'au bord de l'écran : collées à la marge basse de la page, elles
   laissaient vingt pixels de feuille défiler sous elles —, et reprennent
   leur place sous elle au bout de la page. **Seulement quand la page
   défile** (`data-defile`, posé par `reglerDefile`) : dans un écran où tout
   tient, le fondu ne couvrait que le mur, et s'y voyait en plaque sombre
   autour des deux bâches (768 × 1024). Les marges négatives rendent l'air
   que le fondu prend : poser ou retirer l'attribut ne déplace rien. */
#bilan[data-defile] .tbf-bilan-sortie{position:sticky;z-index:2;bottom:calc(-1 * (env(safe-area-inset-bottom) + 20px));
  margin:-16px 0 calc(-1 * (env(safe-area-inset-bottom) + 20px));
  padding:16px 0 calc(env(safe-area-inset-bottom) + 20px);
  background:linear-gradient(rgba(4,6,10,0),rgba(4,6,10,.97) 14px)}

/* ------------------------------------------------------------- le fil

   La bande est le ticket terrain de la seconde rangée ; la feuille du fil
   vit **hors de la colonne** : `ui.css` donne à `#app` un `z-index`, ce qui
   en fait un contexte d'empilement, et un panneau posé dedans passerait
   sous les calques que `fx.js` pose sur `body` (89 à 93), bouton de
   fermeture compris. Un panneau qu'on ouvre reste lisible et refermable. */
.feuille{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--colonne);z-index:95;display:none;flex-direction:column;
  background:rgba(5,7,10,.96)}
.feuille.on{display:flex}
.feuille .tete{flex:none;display:flex;align-items:center;gap:10px;padding:14px 15px 10px}
.feuille .tete b{font-family:var(--banner);font-size:15px;letter-spacing:.1em;flex:1}
.feuille .tete #feuilleScore{font-size:12px;font-variant-numeric:tabular-nums}
.feuille .tete .x{width:44px;height:44px;border-radius:9px;border:1px solid rgba(242,238,228,.16);
  background:rgba(0,0,0,.3);color:inherit;font-size:17px;cursor:pointer;flex:none}
.feuille .corps{flex:1;min-height:0;overflow-y:auto;padding:0 15px 18px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid rgba(242,238,228,.07)}
.ev .min{font-family:var(--banner);font-size:13px;width:38px;flex:none}
.ev .ic{width:20px;text-align:center;flex:none}
.ev .txt{flex:1;min-width:0}
.ev .txt small{display:block;font-size:11px}
.ev.droite{flex-direction:row-reverse;text-align:right}
.ev.droite .txt{text-align:right}
.ev.tribune .txt{font-weight:700}
.ev.tribune .txt small{font-weight:400}
.ev.periode{justify-content:center;font-family:var(--banner);font-size:11px;letter-spacing:.16em}
.ev.periode .min,.ev.periode .ic{display:none}
.feuille .vide{text-align:center;font-size:12px;padding:40px 20px;line-height:1.7}

/* ------------------------------------------------------ le voile de choix

   Le tunnel en fond, à 25 % sur le noir (lot 7) : la photo de l'ouverture
   de l'accueil, debout ou couchée comme l'écran, le même chemin vers la
   tribune. Le PNG ne sert qu'à un navigateur sans WebP. Une tête qui ne défile pas
   (avec quarante matchs, le titre et la recherche sortaient par le haut),
   et la liste des affiches qui défile. La tête garde la place des deux
   boutons flottants. */
.veil{position:absolute;inset:0;background:#05070A;z-index:30;display:none;flex-direction:column;
  align-items:center;padding:0;text-align:center;overflow:hidden}
.veil.on{display:flex}
.veil-fond{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.25}
.veil-fond img{width:100%;height:100%;object-fit:cover}
.veil>.tete,.veil>.liste{position:relative;z-index:1}
.veil .tete{flex:none;width:100%;max-width:420px;padding:calc(env(safe-area-inset-top) + 68px) 18px 8px}
/* « LE GRAND VIRAGE » peint sur une bande de craie de travers, et son
   écharpe dessous. */
.veil-titre{margin:0;display:flex;flex-direction:column;align-items:center;gap:9px}
.veil-titre .tbf-banderole{--rot:-3deg;font-size:26px;line-height:32px;padding:4px 16px 3px}
.veil-titre .tbf-echarpe{width:min(58%,220px);rotate:-3deg}
.veil p{font-size:12.5px;line-height:1.6;margin:12px auto 0;max-width:330px}
.veil .rech{margin-top:12px}
.veil .rech input{width:100%;background:rgba(0,0,0,.4);border-radius:8px;
  border:1px solid rgba(242,238,228,.16);color:var(--craie);padding:10px 12px;font-size:14px;font-family:inherit}
.veil .rech input:focus{outline:none;border-color:var(--projo)}
.veil .liste{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 24px)}
.veil .liste>*{flex:none;width:100%;max-width:400px}
.veil .vide{font-size:12.5px;padding:18px 10px 0;line-height:1.7}
/* Deux sections : chez soi, puis ailleurs. Ce que coûte « ailleurs » s'écrit
   sous son titre cousu, et non dedans : le fil court jusqu'au bout. */
.rubrique{text-align:left;margin:8px 0 -4px}
.rubrique-sous{text-align:left;font-size:11px;letter-spacing:.04em;margin:-8px 0 0}
.rubrique.alerte{font-family:var(--banner);font-size:11px;letter-spacing:.14em;color:var(--flare-clair)}
.rubrique.alerte small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  margin-top:3px;text-transform:none;color:var(--craie)}
/* L'affiche se touche : elle ouvre la tribune, ou le choix du camp. */
.match{cursor:pointer}
.match:focus-visible{outline:3px solid var(--projo);outline-offset:4px}
/* Une rencontre qui ne s'ouvre pas encore, ou plus : grise, et son
   sticker dit pourquoi (TERMINÉ, À 20:45). Le gris retire la couleur, pas
   la lumière : les noms restent lisibles. */
.match.off{cursor:default;filter:grayscale(1)}
/* Le match qu'on vient chercher par un lien, amené sous les yeux et marqué. */
.match.vise{outline:3px solid var(--projo);outline-offset:4px}
/* Le nom de la compétition sous le score, sur deux lignes au plus. */
.match .tbf-affiche-score>small{white-space:normal;max-width:8.5em;line-height:1.2;text-transform:none}
.match .tbf-affiche-pied>small{min-width:0}
/* Le choix du camp, déplié dans l'affiche : la question, puis les deux
   bâches aux couleurs des clubs, de même poids. */
.camps{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;margin-top:4px;
  border-top:1.5px dashed rgba(242,238,228,.32)}
.camps>span{grid-column:1/-1;text-align:left;font-family:var(--banner);font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase}
.camps>button{min-width:0;overflow-wrap:anywhere}
/* L'attente : le prochain coup d'envoi, répéter, suivre un club. */
.attente{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding-top:6px}
.attente .prochain{flex-direction:column;gap:4px;text-align:center}
.attente .prochain small{font-size:11px;font-weight:600;letter-spacing:.14em}
.attente .prochain b{font-size:20px;font-weight:700;letter-spacing:.04em}
.attente .prochain span{font-size:12px;letter-spacing:.06em}

/* **Le mouvement part, l'information reste.** Ce que la page anime encore
   elle-même : l'éclair d'une nouvelle carte d'effet, le décompte. Les
   pièces de `ui.css` ont leurs doubles dans la feuille. */
@media (prefers-reduced-motion:reduce){ .float,.countdown{animation:none} }
html[data-calme~="animations"] .float,html[data-calme~="animations"] .countdown{animation:none}
</style>

<script>
/* =======================================================================
   Grand Virage — client.
   Il n'évalue rien : il envoie les instants de frappe et affiche ce que le
   serveur renvoie. Il ne nomme aucun verdict, ne compte ni les PARFAITS, ni
   la série, ni la ferveur, ni l'XP : tout cela arrive servi (CONTRATS.md,
   § 15 et § 16), et une donnée absente n'affiche rien.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
/* Le fil porte des noms de joueurs venus de l'API : ils passent par `esc`
   avant d'entrer dans du balisage, ou par `textContent`. */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
/* Les vibrations se taisent sous le calme « vibrations » du tiroir, relu à
   chaque appel. */
const buzz = (p) => {
  const calme = window.FX?.calme?.('vibrations')
    ?? (document.documentElement.dataset.calme ?? '').split(' ').includes('vibrations');
  if (calme) return;
  try { navigator.vibrate?.(p); } catch {}
};
/* Les noms, les aides et les couleurs des gestes viennent de `/geste.js`. */
const COLORS = window.TBF_GESTE.COULEUR;
const LABEL = window.TBF_GESTE.LABEL;
const HINT = window.TBF_GESTE.AIDE;
/* Le nom d'un geste porte ses coupures (le trait d'union conditionnel) pour
   la carte étroite ; dit en entier, il n'en a pas besoin. */
const COUPURE = String.fromCharCode(0xAD);
const sansCoupure = (t) => String(t ?? '').split(COUPURE).join('');
const GOAL_AT = 400;
/* Le temps que met la foule à compter jusqu'à son effectif, à l'entrée — le
   même que la rumeur qui monte (`TBF_SON.rumeur('entree', { ms })`). */
const COMPTE_MS = 1500;
/* La durée de la minute double : sert seulement à remplir l'anneau. Le
   temps qui reste, lui, est servi (`surgeMs`). */
const MINUTE_DOUBLE_MS = 60_000;
/* Les cartes d'action d'un deck : dix, ni neuf ni onze (`validerDeck`,
   `deck/index.js`). Le serveur sert celles qui restent au duel
   (`ecartees`) ; ce qui en reste se joue ici — voir « DUEL SEULEMENT ». */
const TAILLE_DU_DECK = 10;

let socket = null, S = null, busy = false;
// La part de ferveur d'un neutre. Le serveur la donne avec la liste des
// matchs ; cette valeur n'est qu'un repli pour le premier rendu.
let FERVEUR_NEUTRE = 0.5;
// La fête de niveau « depuis ta dernière visite » : une fois par visite.
let feteDemandee = false;

/* **Ce que la page sait de ce match, et que l'état ne porte pas.**
   Remis à neuf à l'entrée dans un autre match (`virage:state` d'un autre
   identifiant) ; une reconnexion au même match le garde. */
const neuf = () => ({
  pousse: false,        // un chant accepté pendant ce match (Q10 : le bilan ne vient qu'alors)
  entree: false,        // le rituel d'entrée a été joué
  compteJusqua: 0,      // la foule compte jusqu'à cet instant (performance.now)
  doubleFin: null,      // fin de la minute double, d'après `surgeMs` (performance.now)
  fin: false,           // `virage:fin` reçu
  parti: false,         // `virage:leave` émis : la page ne rejoint plus
  ferme: false,         // `virage:ferme` reçu : la tribune est vidée
  sortie: false,        // une sortie en cours (bilan ou boîte ouverts)
  carteEnJeu: null,     // la clé du chant dont le geste est ouvert
  carteJouee: null,     // la clé du chant qui se décolle
  souvenirs: [],        // les cartes-souvenirs annoncées par `virage:souvenir`
  souvenirEnVue: null,  // celle qui se retourne au centre, pas encore dans la pile
  amis: new Map(),      // les amis présents (`virage:amis`, `virage:ami`)
  recharges: {},        // la plus longue recharge vue par carte : le plein du scotch
  celebre: 0,           // le personnage célèbre jusqu'à cet instant (performance.now)
});
let P = neuf();

/* **La rumeur de la tribune suit le match** (`son.js`, « la rumeur suit le
   match ») : la page nomme la phase, le moteur choisit le niveau. Rappelée
   chaque seconde, ce qui rattrape un moteur arrivé après le premier état —
   il est chargé par `fx.js`, en différé. Elle se tait pendant que la foule
   compte : la rumeur monte alors par `entree`, et un « jeu » redit à ce
   moment-là la ferait monter au pas ordinaire. Rien ne joue avant le
   premier toucher du joueur, ni sous le calme : la tribune ne démarre
   jamais seule, et l'écran dit tout ce que le son dit. */
const FINS_DE_MATCH = ['FT', 'AET', 'PEN'];
function ambianceDuMatch() {
  if (!S || performance.now() < P.compteJusqua) return;
  window.TBF_SON?.rumeur?.(FINS_DE_MATCH.includes(S.statut) || P.fin ? 'fin'
    : S.statut === 'HT' || S.statut === 'BT' ? 'mi-temps' : 'jeu');
}

/* ----------------------------------------------- des nœuds qui durent

   **Un conteneur réécrit dix fois par seconde ne garde rien de vivant.**
   `render` passe à chaque message de corde et à chaque seconde : chaque
   élément est **créé une fois, retrouvé par sa clé, modifié en place**, et
   retiré seulement quand sa clé disparaît. Le jumeau de ce que fait le duel
   (« des nœuds qui durent », duel-nvn.html). */

/**
 * Accorde les enfants de `boite` à une liste de clés, dans cet ordre.
 * `creer(cle, i)` fabrique le nœud d'une clé neuve ; `maj(el, cle, i)` le
 * met à jour en place. Un nœud n'est déplacé que s'il n'est pas à sa place :
 * déplacer un élément lui fait perdre le focus.
 */
function accorder(boite, cles, creer, maj) {
  const gardes = new Map();
  for (const el of [...boite.children]) {
    if (el._cle != null && cles.includes(el._cle) && !gardes.has(el._cle)) gardes.set(el._cle, el);
    else el.remove();
  }
  cles.forEach((cle, i) => {
    let el = gardes.get(cle);
    if (!el) { el = creer(cle, i); el._cle = cle; }
    maj(el, cle, i);
    if (boite.children[i] !== el) boite.insertBefore(el, boite.children[i] ?? null);
  });
}

/** Un nœud depuis son balisage : les gabarits de la page restent lisibles. */
function fabriquer(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/** Des clés uniques pour une liste qui peut se répéter. */
function clesDe(ids) {
  const vus = new Map();
  return ids.map((id) => {
    const n = vus.get(id) ?? 0;
    vus.set(id, n + 1);
    return `${id}#${n}`;
  });
}

/** N'écrit un texte que s'il a changé : réécrire le même texte recrée le nœud. */
function ecrire(el, texte) {
  const t = String(texte);
  if (el && el.textContent !== t) el.textContent = t;
}

/** Même règle pour les rares endroits qui posent du balisage. */
function poser(el, html) {
  if (el && el._html !== html) { el._html = html; el.innerHTML = html; }
}

/** Une variable CSS, seulement quand elle change ; vide, elle se retire. */
function poserVar(el, nom, valeur) {
  if (!el) return;
  const v = valeur == null || valeur === '' ? '' : String(valeur);
  if (el.style.getPropertyValue(nom) === v) return;
  if (v) el.style.setProperty(nom, v); else el.style.removeProperty(nom);
}

/** Un attribut, seulement quand il change ; `null` le retire. */
function poserAttr(el, nom, valeur) {
  if (!el) return;
  if (valeur == null) { if (el.hasAttribute(nom)) el.removeAttribute(nom); return; }
  if (el.getAttribute(nom) !== String(valeur)) el.setAttribute(nom, String(valeur));
}

/** Rejoue une animation d'une fois (`.tbf-vibre`, `.pousse`) : la classe est
    retirée, puis reposée à l'image suivante, et retirée à sa fin. */
function rejouer(el, classe, ms = 0) {
  if (!el) return;
  clearTimeout(el['_t' + classe]);
  el.classList.remove(classe);
  void el.offsetWidth;
  el.classList.add(classe);
  const fin = () => { el.classList.remove(classe); el.removeEventListener('animationend', fin); };
  if (ms) el['_t' + classe] = setTimeout(fin, ms);
  else el.addEventListener('animationend', fin);
}

/* ------------------------------------------------------------ le HUD */

/**
 * Le nom du club, à la place que la bâche lui laisse.
 *
 * Quatre-vingt-deux pixels à 360 px, soixante-deux à 320 : « FC BÂLE 1893 »
 * n'y tient pas. La page essaie le nom entier, puis sans l'année, puis sans
 * le sigle (« FC », « BSC »…), et garde la première forme qui tient. Ce qui
 * ne tient toujours pas finit en points de suspension — une coupe se voit,
 * et l'audit la compte. Le nom entier reste dans `title`.
 */
const SIGLES = /^(?:FC|AC|AS|SC|CF|FK|SK|SV|BSC|CD|CA|RC|US|SS|AFC|OGC|NK|KV|KRC|IF|BK|IFK|SL|SpVgg|VfB|VfL|TSG|TSV|1\.)\s+|\s+(?:FC|AC|SC|CF|FK|SK|AFC|BK|IF)$/i;
/* **La mesure se fait à la toile**, avec la police calculée, les capitales
   et l'interlettrage : dans la bâche (un élément d'une boîte flexible en
   colonne), `scrollWidth` rendait la largeur de la boîte même quand le nom
   débordait, et la page gardait le nom entier, coupé. */
const toile = document.createElement('canvas').getContext('2d');
function tient(el, texte) {
  const s = getComputedStyle(el);
  toile.font = `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
  const t = s.textTransform === 'uppercase' ? texte.toUpperCase() : texte;
  const espace = parseFloat(s.letterSpacing) || 0;
  return toile.measureText(t).width + espace * t.length <= el.clientWidth + 0.5;
}
function nomDeClub(el, nom) {
  if (!el) return;
  const plein = String(nom ?? '').trim();
  const sansAnnee = plein.replace(/\s*\b(?:18|19|20)\d{2}\b\s*/g, ' ').replace(/\s+/g, ' ').trim();
  const sansSigle = sansAnnee.replace(SIGLES, '').trim() || sansAnnee;
  if (el.title !== plein) el.title = plein;
  const formes = [...new Set([plein, sansAnnee, sansSigle])];
  ecrire(el, formes.find((f) => tient(el, f)) ?? formes.at(-1));
}

/** Les couleurs d'un camp, éclaircies pour le noir de l'écran. */
function couleursDe(cote) {
  const brutes = S?.fixture?.[cote === 0 ? 'homeColors' : 'awayColors'] ?? [];
  return brutes.filter(Boolean).map((c) => window.FX?.lisible?.(c) ?? c);
}

/* Les écharpes de l'écran : `--e1`/`--e2` mon club (le foulard, ma moitié de
   corde, la fumée), `--eux1`/`--eux2` le club d'en face. Sans couleur connue,
   les pièces retombent sur l'or et le bleu des camps. */
function poserCouleurs() {
  if (!S?.you) return;
  const mine = S.you.side;
  const moi = couleursDe(mine), eux = couleursDe(mine ^ 1);
  const app = $('app');
  poserVar(app, '--e1', moi[0]); poserVar(app, '--e2', moi[1]);
  poserVar(app, '--eux1', eux[0]); poserVar(app, '--eux2', eux[1]);
  poserVar($('clubMe'), '--e1', moi[0]); poserVar($('clubMe'), '--e2', moi[1]);
  poserVar($('clubFoe'), '--e1', eux[0]); poserVar($('clubFoe'), '--e2', eux[1]);
}

function ajusterNoms() {
  if (!S?.you) return;
  const f = S.fixture, mine = S.you.side;
  nomDeClub($('clubMe').querySelector('b'), mine === 0 ? f.homeName : f.awayName);
  nomDeClub($('clubFoe').querySelector('b'), mine === 0 ? f.awayName : f.homeName);
}

function renderStatic() {
  ajusterNoms();
  poserCouleurs();
  renderChants();
}
/* La place du nom dépend de la largeur et de la police : on la remesure
   quand l'une ou l'autre change. Les couleurs passent par `FX.lisible`,
   chargé en différé : on les repose quand il est là. */
addEventListener('resize', ajusterNoms);
document.fonts?.ready?.then(ajusterNoms);
addEventListener('load', () => { poserCouleurs(); ajusterNoms(); });

/* ------------------------------------------------- la minute double

   Le sticker de phase la dit : « MINUTE DOUBLE 0:47 », l'anneau de soixante
   secondes qui se vide, le HUD, la corde et la fumée à l'or (`data-double`
   sur la colonne). **Le chrono se calcule sur `surgeMs`** — la durée qui
   reste, servie à l'envoi — et l'horloge de la page (`performance.now`),
   jamais sur `surgeUntil`, un instant de l'horloge du serveur qu'un
   téléphone en avance lirait de travers. À zéro, la page attend le
   `virage:tick { surge: false }` du serveur au lieu de conclure seule. Sans
   `surgeMs` (un serveur d'avant), la minute se dit sans chiffre.

   **L'entrée dans la minute double claque** : le sticker passe à l'or d'un
   coup de tampon (`.tbf-clac`, qui a ses doubles mouvement réduit et calme
   dans la feuille) et le clac sonne à l'impact (`bache`, que le moteur tait
   sous le calme « sons »). L'attribut seul basculait sans rien dire : on ne
   voyait l'or qu'en le cherchant. Pas à l'entrée dans une tribune déjà en
   minute double (les bâches s'y posent déjà), ni pendant un geste — la
   fenêtre couvre le HUD, et un clac de plus s'y confondrait avec celui du
   verdict.

   **Hors de la minute double, le sticker dit la phase du match quand elle
   en a une** : « MI-TEMPS » à la pause (`HT`), « PAUSE » avant les
   prolongations (`BT`), « TERMINÉ » après le coup de sifflet final — la
   rumeur retombe ou se vide alors (`son.js`), et le son ne porte jamais seul
   une information : le ticket, lui, ne montre qu'une minute arrêtée. Le
   reste du temps, « GRAND VIRAGE » (« VIRAGE » sous 390 px), comme le
   brief et la direction l'écrivent : le sticker tient sa place et le ticket
   ne change pas de largeur à chaque but. */
function noterDouble(ms) {
  if (Number.isFinite(ms) && ms > 0) P.doubleFin = performance.now() + Math.min(ms, MINUTE_DOUBLE_MS);
}
const anneauPhase = $('phaseAnneau');
function renderPhase() {
  const on = Boolean(S?.surge);
  const app = $('app');
  const ph = $('phase');
  if (on !== app.hasAttribute('data-double')) {
    app.toggleAttribute('data-double', on);
    if (on && P.entree && !busy) {
      rejouer(ph, 'tbf-clac', 400);
      const doux = matchMedia('(prefers-reduced-motion: reduce)').matches
        || (document.documentElement.dataset.calme ?? '').split(' ').includes('animations');
      setTimeout(() => window.FX?.son?.('bache'), doux ? 0 : 160);
    }
  }
  let long = 'GRAND VIRAGE', court = 'VIRAGE', part = null;
  if (on) {
    long = 'MINUTE DOUBLE'; court = '×2';
    if (P.doubleFin != null) {
      const reste = Math.max(0, P.doubleFin - performance.now());
      const s = Math.ceil(reste / 1000);
      const t = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      long += ` ${t}`; court += ` · ${t}`;
      part = (reste / MINUTE_DOUBLE_MS).toFixed(3);
    }
  } else if (P.fin || FINS_DE_MATCH.includes(S?.statut)) {
    long = court = 'TERMINÉ';
  } else if (S?.statut === 'HT') {
    long = court = 'MI-TEMPS';
  } else if (S?.statut === 'BT') {
    long = court = 'PAUSE';
  }
  /* L'anneau n'est dans le sticker que s'il dit un temps : sans chrono, un
     anneau plein aurait l'air d'en dire un. */
  if (part == null && on) { if (anneauPhase.isConnected) anneauPhase.remove(); }
  else if (!anneauPhase.isConnected) ph.prepend(anneauPhase);
  poserVar(anneauPhase, '--part', part);
  /* Le sticker change de largeur avec la minute double, et d'un chiffre à
     l'autre du chrono : la place du dernier fait du ticket aussi. Une
     mesure par changement de texte, une fois par seconde au plus. */
  const change = ph._texte !== long;
  ph._texte = long;
  ecrire(ph.querySelector('.long'), long);
  ecrire(ph.querySelector('.court'), court);
  if (change) ajusterDernier();
}

/* ------------------------------------------------------------ la corde */

/** Un cran par but de corde, près de la ligne du camp qui l'a marqué. */
function crans(el, n) {
  const voulu = Math.max(0, Math.min(12, Number(n) || 0));
  while (el.children.length < voulu) el.appendChild(document.createElement('i'));
  while (el.children.length > voulu) el.lastChild.remove();
}

/* ----------------------------------------------------------- la foule

   Une rangée stable de dix silhouettes (la feuille n'en montre que huit sous
   400 px) : la page allume la part de la foule du camp sur la plus grande des
   deux, en basculant des classes. Le compte reste un texte à part. */
const etroit = matchMedia('(max-width:399px)');
function allumer(el, n, max) {
  const total = Math.min(el.children.length, etroit.matches ? 8 : 10);
  /* Une silhouette par personne tant qu'ils sont peu : une tribune de trois
     n'allume pas huit supporters. */
  let allumes = max > 0 ? Math.min(n, Math.round(total * n / max)) : 0;
  if (n > 0) allumes = Math.max(1, allumes);
  [...el.children].forEach((i, k) => { if (i.classList.contains('on') !== (k < allumes)) i.classList.toggle('on', k < allumes); });
}
/** La foule d'un camp pousse le temps d'un chant : les bras se lèvent, un saut. */
function pousser(cote) {
  const el = cote === 'moi' ? $('crowdMe') : $('crowdFoe');
  rejouer(el, 'pousse', 1300);
}
/** « 12 AVEC TOI » : le chiffre change, la mention reste. Et quand personne
    ne chante en face, « PERSONNE EN FACE » (5 octobre 2026) : un « 0 » se
    lisait comme un compteur pas encore arrivé, et c'est justement là que la
    corde résiste davantage (contrat § 16.7). */
function compteDeTribune(el, n) {
  if (performance.now() < P.compteJusqua) return;   // la foule compte encore
  const personne = el.id === 'compteEux' && !n;
  ecrire(el.firstElementChild, personne ? 'PERSONNE' : n);
  poserAttr(el, 'data-personne', personne ? '' : null);
}

/* ------------------------------------------------------------ le rendu */

function render() {
  if (!S?.you) return;
  const mine = S.you.side;
  // La corde est stockée « côté extérieur positif » ; on la retourne pour que
  // pousser vers le haut veuille toujours dire pousser chez l'adversaire.
  const vers = mine === 0 ? -S.rope : S.rope;
  const part = Math.max(-1, Math.min(1, vers / GOAL_AT));
  /* **Rien n'est réécrit en entier ici** : une variable, des textes et des
     attributs qui ne bougent que s'ils changent. `render` passe dix fois par
     seconde quand la tribune chante. */
  poserVar($('rope'), '--corde', part.toFixed(3));
  const ecart = Math.abs(Math.round(vers));
  ecrire($('knot').firstElementChild, ecart ? ecart : '');
  ecrire($('score'), `${S.goals[mine]} – ${S.goals[mine ^ 1]}`);
  crans($('cransMoi'), S.goals[mine]);
  crans($('cransEux'), S.goals[mine ^ 1]);
  renderPhase();

  const [nous, eux] = [S.crowd?.[mine] ?? 0, S.crowd?.[mine ^ 1] ?? 0];
  const plus = Math.max(nous, eux, 1);
  allumer($('crowdMe'), nous, plus);
  allumer($('crowdFoe'), eux, plus);
  compteDeTribune($('compteMoi'), nous);
  compteDeTribune($('compteEux'), eux);

  // Le souffle affiché est celui du serveur **plus le regain écoulé depuis**.
  const souffle = Math.round(souffleCourant());
  renderSouffle(souffle);
  renderRang();
  renderCombo();
  renderPile();
  renderApports();
  etatsDesChants(souffle);
  /* L'état de repos du personnage suit la minute double : il pousse tant
     qu'elle dure. **Pas pendant une célébration** (`celebrer`) : la scène
     ne la voit en cours qu'une fois sa pose décodée, et un `poserFond`
     demandé entre-temps passait devant elle — le rendu qui suit un but
     réel, ou la réponse d'un chant, effaçait le « GOAL ! » du personnage
     avant qu'il paraisse (vu par `virage:ui`). La scène revient d'elle-même
     à son fond quand la célébration finit. */
  if (performance.now() >= P.celebre) scene?.poserFond(S.surge ? 'pousse' : 'attente');
  renderActes();
  monterStade();
  eclairerStade();
}

/* ---------------------------------------------------- le souffle

   L'écharpe fine, bleue, et un cran au coût de chaque chant de la main : on
   voit quelle carte le souffle paie. Un cran que le souffle vient de
   franchir claque. */
let souffleAvant = null;
function renderSouffle(souffle) {
  const max = S.you.breathMax ?? 100;
  const largeur = `${Math.max(0, Math.min(100, souffle / max * 100)).toFixed(1)}%`;
  if ($('breathBar').style.width !== largeur) $('breathBar').style.width = largeur;
  ecrire($('breathVal'), souffle);
  const couts = [...new Set((S.cards ?? []).map((c) => c.cost).filter((c) => Number.isFinite(c)))].sort((a, b) => a - b);
  const jauge = $('souffleJauge');
  accorder(jauge, ['barre', ...couts.map((c) => `cout${c}`)],
    () => fabriquer('<span class="tbf-jauge-cout"></span>'),
    (el, cle, i) => {
      if (cle === 'barre') return;
      const c = couts[i - 1];
      poserVar(el, '--cran', `${(c / max * 100).toFixed(1)}%`);
      if (souffleAvant != null && souffleAvant < c && souffle >= c) rejouer(el, 'claque');
    });
  souffleAvant = souffle;
}
/* La barre elle-même est le premier enfant de la jauge : `accorder` la garde
   sous sa clé. */
$('breathBar')._cle = 'barre';

/* ---------------------------------------------------- la ferveur à paliers

   « 12ᵉ → TOP 10 » : avec le palier suivant servi (`prochain`), l'écharpe
   dit le chemin vers lui (ma ferveur sur ma ferveur plus l'écart) et le
   palier est un sticker au bout ; sans lui, le rang seul et l'effectif.
   Les trois nœuds sont créés une fois ; la jauge entre et sort du rang
   (la feuille place la valeur selon qu'elle est là ou non). */
const rang = (() => {
  const el = $('rank');
  const nom = fabriquer('<span class="tbf-tableau-nom">FERVEUR</span>');
  const jauge = fabriquer('<div class="tbf-jauge tbf-jauge--fine"><i></i><span class="tbf-sticker"></span></div>');
  const val = fabriquer('<b class="tbf-tableau-val"><span></span><sup></sup> <small></small></b>');
  el.append(nom, val);
  return { el, jauge, val };
})();
function renderRang() {
  const you = S.you;
  const n = Number(you.rank);
  if (!(n >= 1)) { rang.el.hidden = true; return; }
  rang.el.hidden = false;
  const p = you.prochain;
  const palier = p && Number(p.rang) >= 1 && Number(p.ecart) >= 1;
  if (palier) {
    if (!rang.jauge.isConnected) rang.el.insertBefore(rang.jauge, rang.val);
    const ferveur = Math.max(0, Number(you.ferveur) || 0);
    const part = ferveur / (ferveur + Number(p.ecart));
    const largeur = `${Math.round(part * 100)}%`;
    const i = rang.jauge.firstElementChild;
    if (i.style.width !== largeur) i.style.width = largeur;
    ecrire(rang.jauge.lastElementChild, Number(p.rang) === 1 ? '1ᵉʳ' : `TOP ${p.rang}`);
  } else if (rang.jauge.isConnected) rang.jauge.remove();
  ecrire(rang.val.children[0], n);
  ecrire(rang.val.children[1], n === 1 ? 'er' : 'e');
  ecrire(rang.val.children[2], !palier && Number(you.of) >= 1 ? `SUR ${you.of}` : '');
  rang.val.children[2].hidden = palier || !(Number(you.of) >= 1);
  const lu = palier ? `${n}${n === 1 ? 'er' : 'e'}, prochain palier : ${p.rang === 1 ? 'premier' : `top ${p.rang}`}`
    : `${n}${n === 1 ? 'er' : 'e'}${Number(you.of) >= 1 ? ` sur ${you.of}` : ''}`;
  poserAttr(rang.el, 'aria-label', `Ferveur : ${lu}`);
}

/** Le combo : `serie`, servi, à partir de deux PARFAITS d'affilée — en
    vert, la couleur du PARFAIT (voir le balisage du tableau). */
function renderCombo() {
  const el = $('combo');
  const s = Number(S.you?.serie);
  if (!(s >= 2)) { el.hidden = true; el._n = null; return; }
  el.hidden = false;
  if (el._n !== s) {
    const avant = el._n;
    el._n = s;
    ecrire(el, `${s} PARFAITS`);
    if (avant != null) rejouer(el, 'tbf-vibre');
  }
}

/** La pile des souvenirs du match, en dos de carte, et leur compte. */
function renderPile() {
  const el = $('pile');
  const n = P.souvenirs.length;
  if (!n) { el.hidden = true; return; }
  el.hidden = false;
  const dos = [...el.querySelectorAll(':scope > span')];
  const voulu = Math.min(3, n);
  for (let k = dos.length; k < voulu; k++) el.insertBefore(document.createElement('span'), el.lastElementChild);
  for (let k = voulu; k < dos.length; k++) dos[k].remove();
  ecrire(el.lastElementChild, n);
  poserAttr(el, 'aria-label', `${n} carte${n > 1 ? 's' : ''}-souvenir${n > 1 ? 's' : ''} ce match`);
}

/* ------------------------------------------------------- les chants

   La main en éventail, par `accorder` comme la rangée d'actions : le
   répertoire tourne toutes les dix minutes de match (`virage:repertoire`),
   et une carte qu'on touche ne doit pas être remplacée sous le doigt. */
function renderChants() {
  const cartes = S?.cards ?? [];
  accorder($('hand'), clesDe(cartes.map((c) => c.id)),
    (_cle, i) => fabriquer(`<button type="button" class="card tbf-carte tbf-carte--chant">
      ${window.TBF_CHANT ? window.TBF_CHANT.illustration(cartes[i].id) : ''}
      <span class="g tbf-carte-geste"></span><span class="p tbf-carte-pousse"></span>
      <b class="tbf-carte-nom"></b>
      <span class="c tbf-sticker tbf-sticker--rond tbf-carte-cout"></span>
      <span class="tbf-sticker tbf-carte-manque" data-ton="flare"></span></button>`),
    (el, _cle, i) => {
      const c = cartes[i];
      if (el.dataset.card !== c.id) el.dataset.card = c.id;
      poserVar(el, '--c', COLORS[c.gest]);
      ecrire(el.querySelector('.g'), LABEL[c.gest] ?? '');
      ecrire(el.querySelector('.p'), c.power);
      ecrire(el.querySelector('b'), c.nom ?? c.id);
      ecrire(el.querySelector('.c'), c.cost);
      poserAttr(el, 'aria-label', `${c.nom ?? c.id}, ${sansCoupure(LABEL[c.gest])}, coûte ${c.cost}`);
    });
  etatsDesChants(Math.round(souffleCourant()));
}

/* Trop cher : le scotch en croix sur le dessin et ce qui manque, « −8 »,
   jamais sur le libellé. La carte qu'on joue garde son état à elle. */
function etatsDesChants(souffle) {
  for (const el of $('hand').children) {
    if (el._cle === P.carteEnJeu || el._cle === P.carteJouee) continue;
    const c = (S?.cards ?? []).find((x) => x.id === el.dataset.card);
    if (!c) continue;
    const manque = Math.ceil(c.cost - souffle);
    poserAttr(el, 'data-etat', manque > 0 ? 'injouable' : null);
    ecrire(el.querySelector('.tbf-carte-manque'), manque > 0 ? `−${manque}` : '');
  }
}

/* ------------------------------------------------------- ce que je porte

   Une plaque ronde « i » dans la rangée du souffle, et le panneau, hors de
   la colonne. Le panneau ne se redessine pas à chaque tour d'horloge : il
   est monté à l'ouverture et quand ce qu'on porte change vraiment.

   Il porte aussi **les cartes restées au duel**, et le lien vers le deck :
   la rangée d'actions ne dit que « DUEL SEULEMENT », sur les cases vides
   que le deck ne remplira jamais. */
let apportsVus = null;

/**
 * **Ce qu'il porte, accroché à côté de lui** : les pièces du sac qui compte
 * ici (`apports`, lignes `stuff` — le même sac que le panneau). Dans la boîte
 * du personnage, hors de sa scène : elles ne sautent pas avec lui.
 */
let cleSacVu = '';
function poserSac() {
  const hote = $('fzs');
  if (!hote || !window.TBF_STUFF?.porte) return;
  const sac = (S?.you?.apports ?? []).filter((a) => a?.quoi === 'stuff' && a.id);
  const cle = window.TBF_STUFF.cleSac(sac);
  if (cle === cleSacVu) return;
  cleSacVu = cle;
  hote.querySelector(':scope > .tbf-porte')?.remove();
  if (cle) hote.insertAdjacentHTML('beforeend', window.TBF_STUFF.porte(sac));
}

function contenuApports() {
  const M = window.TBF_MODS;
  const apports = S?.you?.apports ?? [];
  const ecartees = S?.you?.ecartees ?? 0;
  const deck = ecartees
    ? `<p class="ecartees"><b>${ecartees}</b> carte${ecartees > 1 ? 's' : ''} de ton deck ne se joue${ecartees > 1 ? 'nt' : ''}
       qu’en duel — elle${ecartees > 1 ? 's visent' : ' vise'} quelqu’un en face, et ici il n’y a personne à viser.
       <a href="/deck" data-quitter-virage>Changer mon deck</a></p>` : '';
  return (M?.resume(apports).texte ? M.panneauHTML(apports, S?.you?.mods) : '') + deck
    + legendeHTML();
}

/* Sa légende dort jusqu'à ses chants réussis (`shared/legende.js`) : ses
   apports sont listés, mais ne comptent qu'à l'éveil. */
function legendeHTML() {
  const l = S?.you?.legende;
  if (!l) return '';
  return l.eveillee
    ? '<p class="ecartees"><b>Ta légende est éveillée</b> : elle compte jusqu’au coup de sifflet.</p>'
    : `<p class="ecartees"><b>Ta légende dort</b> : ${l.reussis}/${l.seuil} chants réussis
       (BON ou PARFAIT) pour l’éveiller. Jusque-là, ses bonus ne comptent pas.</p>`;
}

function renderApports() {
  poserSac();
  const M = window.TBF_MODS;
  const ligne = $('apportsL'), panneau = $('apportsP');
  const apports = S?.you?.apports ?? [];
  const r = M ? M.resume(apports) : { texte: '' };
  const ecartees = S?.you?.ecartees ?? 0;
  const legende = S?.you?.legende ?? null;
  if (!r.texte && !ecartees && !legende) {
    ligne.hidden = true;
    panneau.hidden = true;
    return;
  }
  ligne.hidden = false;
  const dit = ['Ce que tu portes', r.plus ? `${r.plus} bonus` : '', r.moins ? `${r.moins} malus` : '',
    ecartees ? `${ecartees} carte${ecartees > 1 ? 's' : ''} restée${ecartees > 1 ? 's' : ''} au duel` : '',
    legende && !legende.eveillee ? `légende ${legende.reussis} sur ${legende.seuil}` : '']
    .filter(Boolean).join(', ');
  poserAttr(ligne, 'aria-label', dit);
  const empreinte = JSON.stringify([apports, S?.you?.mods ?? null, ecartees, legende]);
  if (empreinte !== apportsVus) {
    apportsVus = empreinte;
    if (!panneau.hidden) panneau.innerHTML = contenuApports();
  }
}

function ouvrirApports(oui) {
  const panneau = $('apportsP'), ligne = $('apportsL');
  if (oui) panneau.innerHTML = contenuApports();
  panneau.hidden = !oui;
  ligne.setAttribute('aria-expanded', String(oui));
}
$('apportsL').onclick = () => ouvrirApports($('apportsP').hidden);

/* ------------------------------------------------------------- le fil

   Le serveur envoie des entrées **structurées** — un genre, un code, une
   minute — et jamais de phrase toute faite : le français vit ici. Le
   vocabulaire des icônes est celui de la fiche de match. */

const ICONES = { Goal:'⚽', Card:'▮', subst:'⇄', Var:'▣', tribune:'✊' };
const PERIODES = {
  '1H':'COUP D’ENVOI', HT:'MI-TEMPS', '2H':'REPRISE', BT:'FIN DU TEMPS RÉGLEMENTAIRE',
  ET:'PROLONGATIONS', P:'TIRS AU BUT', FT:'COUP DE SIFFLET FINAL',
  AET:'FIN APRÈS PROLONGATIONS', PEN:'FIN AUX TIRS AU BUT',
};

/* Le détail vient de l'API, donc en anglais. */
const DETAILS = {
  'Normal Goal':'But', 'Own Goal':'Contre son camp', Penalty:'Sur penalty',
  'Missed Penalty':'Penalty manqué',
  'Yellow Card':'Carton jaune', 'Red Card':'Carton rouge',
  'Second Yellow card':'Deuxième jaune',
  'Goal cancelled':'But refusé', 'Penalty confirmed':'Penalty accordé',
  Goal:'But', Card:'Carton', subst:'Remplacement', Var:'Arbitrage vidéo',
};
const ditDetail = (d) => DETAILS[d] ?? (/^Substitution/.test(d ?? '') ? 'Remplacement' : d);

/** Le libellé d'une entrée : ce qu'on lit, et le détail sous la ligne. */
function ditLeFil(e) {
  if (e.genre === 'periode') return { titre: PERIODES[e.type] ?? e.type, detail: '' };
  if (e.genre === 'tribune') {
    /* **Toi d'abord**, comme le HUD et comme le score du terrain. */
    const moi = S?.you?.side ?? 0;
    const mien = e.side === moi;
    return { titre: mien ? 'BUT DE TA TRIBUNE' : 'LA CORDE A CÉDÉ',
             detail: `${e.goals?.[moi] ?? 0} – ${e.goals?.[moi ^ 1] ?? 0} à la corde` };
  }
  return { titre: e.joueur ?? ditDetail(e.detail ?? e.type),
           detail: [ditDetail(e.detail ?? e.type), e.passeur].filter(Boolean).join(' · ') };
}

/** L'icône, avec la couleur du carton — rouge et jaune ne se valent pas. */
function iconeDuFil(e) {
  if (e.genre === 'tribune') return `<span style="color:var(--projo)">✊</span>`;
  if (e.type === 'Card') {
    return `<span style="color:${/red/i.test(e.detail ?? '') ? 'var(--flare)' : 'var(--projo)'}">▮</span>`;
  }
  return ICONES[e.type] ?? '•';
}
/** La même, en texte : le ticket terrain est du kraft, et l'encre ne prend
    pas de couleur — un carton se dit par sa forme de couleur. */
function iconeTexte(e) {
  if (e.genre === 'tribune') return '✊';
  if (e.type === 'Card') return /red/i.test(e.detail ?? '') ? '🟥' : '🟨';
  return ICONES[e.type] ?? '•';
}

const minuteDuFil = (e) =>
  e.minute == null ? '' : `${e.minute}${e.extra ? '+' + e.extra : ''}'`;

/** Le score du vrai match, du point de vue du joueur — vide quand on ne le
    connaît pas : une donnée absente retire sa place, jamais un tiret. */
function scoreTerrain() {
  if (!S?.scoreReel) return '';
  const mine = S.you.side;
  return `${S.scoreReel[mine]} – ${S.scoreReel[mine ^ 1]}`;
}

/* L'horloge du match vit dans `/horloge.js`, partagée avec la page des
   matchs et la fiche d'un match. Les deux fonctions restent ici, sous leurs
   noms : c'est par elles que la page — et ses contrôles — demandent l'heure. */

/** L'état de l'horloge : `{ n, extra, arret }`, ou `null` si on ne sait pas. */
function minuteCourante() {
  return window.TBF_HORLOGE.etat(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** « 71′ », « 45+3′ », « 90+′ » — ou rien quand on ne sait pas. */
function minuteTexte() {
  return window.TBF_HORLOGE.texte(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** Le souffle, animé entre deux vérités du serveur. Remis à l'heure par
    chaque message qui porte `breath` : l'état, le résultat d'un chant et
    `virage:vous`. Seul le résultat d'un chant le faisait : à l'entrée et
    après une carte, la jauge comptait le regain depuis le dernier chant, ou
    depuis le chargement de la page, et promettait un souffle qu'on n'avait
    pas. */
let souffleVuA = Date.now();

/* **Les recharges se décomptent ici, comme le souffle.**

   Le serveur les envoie en secondes restantes **au moment de l'envoi**, et la
   page ne les décomptait jamais : une carte reçue en recharge gardait son
   scotch et son chiffre figés, et la page la refusait elle-même (« se
   recharge encore »). Quand toutes les cartes montrées l'étaient, plus
   aucune ne partait, donc plus aucun `virage:vous` n'arrivait — la main
   restait bloquée jusqu'au rechargement de la page, en une demi-minute de
   jeu (Gaël, 4 octobre 2026). On retient l'instant de la vérité, et le
   `render` de chaque seconde retire le scotch de lui-même jusqu'à zéro. */
let cdVuA = Date.now();

/** Ce qui reste de la recharge d'une carte, en secondes ; zéro si elle est prête. */
function rechargeRestante(id) {
  const reste = Number(S?.you?.cooldowns?.[id]) || 0;
  return Math.max(0, reste - (Date.now() - cdVuA) / 1000);
}

function souffleCourant() {
  const you = S?.you;
  if (!you) return 0;
  if (!you.regen) return you.breath;
  const gagne = you.regen * ((Date.now() - souffleVuA) / 1000);
  return Math.min(you.breathMax ?? 100, you.breath + gagne);
}

/** « M. Keller » → « Keller », « J.-P. Dupont » → « Dupont » : l'API
    sportive écrit l'initiale du prénom, le ticket n'a la place que du nom. */
const nomCourt = (t) => String(t ?? '').replace(/^(?:\p{Lu}\.(?:-\p{Lu}\.)?\s+)+(?=\S)/u, '');

/**
 * **La dernière action s'efface la première** quand le ticket manque de
 * place — à 320 px en minute double, le sticker de phase prend la sienne.
 * La page écrit la forme courte si elle tient dans ce que le score, la
 * minute et la flèche lui laissent, et rien sinon : une coupe en points de
 * suspension ne dirait qu'une moitié de nom (l'audit la compte). Le fait
 * reste dans la feuille du fil et dans le nom lu du bouton. La place se
 * calcule sur le ticket, qui remplit sa rangée quoi qu'il porte : vide, la
 * dernière action ne prend pas de place, et sa propre largeur ne dirait
 * rien.
 */
function ajusterDernier() {
  const der = $('filDer'), ticket = der?.parentElement;
  if (!ticket) return;
  const formes = der._formes ?? [];
  const s = getComputedStyle(ticket);
  const ecart = parseFloat(s.columnGap) || 0;
  let place = ticket.clientWidth - (parseFloat(s.paddingLeft) || 0) - (parseFloat(s.paddingRight) || 0);
  for (const n of ticket.children) {
    if (n === der || !n.offsetWidth) continue;
    place -= n.offsetWidth + ecart;
  }
  const d = getComputedStyle(der);
  toile.font = `${d.fontStyle} ${d.fontWeight} ${d.fontSize} ${d.fontFamily}`;
  const espace = parseFloat(d.letterSpacing) || 0;
  const tient = (t) => {
    const u = d.textTransform === 'uppercase' ? t.toUpperCase() : t;
    return toile.measureText(u).width + espace * [...u].length <= place + 0.5;
  };
  ecrire(der, formes.find(tient) ?? '');
}
addEventListener('resize', ajusterDernier);
document.fonts?.ready?.then(ajusterDernier);

function renderFil({ neuf: frais = false } = {}) {
  if (!S) return;
  /* Sans score connu, le bloc du terrain se retire en entier — le chiffre
     et « TERRAIN » : un « TERRAIN » sous un tiret disait qu'il y avait
     quelque chose à lire. La minute et le dernier fait ont leur source. */
  const score = scoreTerrain();
  const minute = minuteTexte();
  const der = S.fil?.[S.fil.length - 1];
  /* **Et sans rien du tout, le ticket entier se retire** : ni score, ni
     minute, ni dernier fait (un état qui ne porte pas le score réel, avant
     le premier relevé). Il ne gardait que sa flèche — une bande de kraft
     vide sous le HUD, qui ouvrait une feuille vide. Une ligne sans donnée
     disparaît ; le sticker de phase garde sa place à droite. Le premier
     message qui apporte l'une des trois le refait paraître, et l'horloge du
     quart de minute le retire quand la minute s'éteint seule. Posé avant
     `ajusterDernier` : un ticket caché n'a pas de largeur à mesurer. */
  $('fil').hidden = !(score || minute || der);
  ecrire($('filScore'), score);
  $('filScore').parentElement.hidden = !score;

  ecrire($('filMinute'), minute);

  /* La dernière action, tenue courte : l'icône et le nom (« 🟥 KELLER »,
     sans l'initiale du prénom). Le détail et la minute de l'action sont
     dans la feuille, qui s'ouvre au toucher. */
  const titre = der ? ditLeFil(der).titre : '';
  $('filDer')._formes = der ? [`${iconeTexte(der)} ${nomCourt(titre)}`] : [];
  ajusterDernier();
  const lu = [score && `terrain ${score}`, minute, titre].filter(Boolean).join(', ');
  poserAttr($('fil'), 'aria-label', `La feuille de match${lu ? ` : ${lu}` : ''}`);

  if (frais) rejouer($('fil').firstElementChild, 'tbf-vibre');
  if ($('feuille').classList.contains('on')) renderFeuille();
}

function renderFeuille() {
  $('feuilleScore').textContent = [scoreTerrain(), minuteTexte()].filter(Boolean).join(' · ');
  const fil = S?.fil ?? [];
  // Le plus récent en tête : on ouvre le fil pour savoir ce qu'on vient de
  // manquer. Réécrite seulement quand le fil a changé.
  poser($('feuilleCorps'), fil.length
    ? fil.slice().reverse().map((e) => {
      const { titre, detail } = ditLeFil(e);
      if (e.genre === 'periode') return `<div class="ev periode">${esc(titre)}</div>`;
      const droite = e.side === (S.you.side ^ 1);
      return `<div class="ev ${droite ? 'droite' : ''} ${e.genre === 'tribune' ? 'tribune' : ''}">
        <span class="min">${minuteDuFil(e)}</span>
        <span class="ic">${iconeDuFil(e)}</span>
        <span class="txt">${esc(titre)}${detail ? `<small>${esc(detail)}</small>` : ''}</span>
      </div>`;
    }).join('')
    : `<div class="vide">Rien n’est encore arrivé sur le terrain.<br>
        Les cartons et les remplacements arrivent pendant que tu es dans le virage.</div>`);
}

const ouvrirFeuille = (oui) => {
  $('feuille').classList.toggle('on', oui);
  if (oui) renderFeuille();
  reglerCase();
};

$('fil').addEventListener('click', () => ouvrirFeuille(true));
$('feuilleX').addEventListener('click', () => ouvrirFeuille(false));
// On peut toujours sortir : c'est la règle de tout plein écran de ce jeu.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  ouvrirFeuille(false);
  if (!$('apportsP').hidden) ouvrirApports(false);
  if (bilanOuvert()) fermerBilan();
});

/* ---------------------------------------------------------- le personnage

   Le Fanzzy équipé pousse avec le joueur. C'est le même personnage que sur
   l'accueil, monté par le même module ; la case du moment fort (« GOAL ! »)
   est posée par la scène sur le document. */

const scene = window.TBF_SCENE?.creer?.($('fzs'), {
  momentDans: $('rope'), fond: 'attente',
}) ?? null;

/** Une célébration du personnage, que la scène tient `ms` (un moment :
    quinze secondes, la durée de `fx.js`). Le dernier moment remplace le
    précédent, comme dans la scène. `render` ne repose pas l'état de fond
    tant qu'elle dure : voir `render`. */
function celebrer(ms = window.FX?.MOMENT ?? 15000) {
  if (scene) P.celebre = performance.now() + ms;
}

/* **La case de BD passe sous le tiroir quand on l'ouvre**, et sous la
   feuille du fil. Elle est posée sur le document au calque 95 ; le tiroir
   est au 49 : ouvert pendant un but, il serait couvert par « GOAL ! » quinze
   secondes. La feuille est au 95 aussi, et la case, posée après elle dans le
   document, passait devant : qui a ouvert le fil regarde le fil, qui lui
   annonce déjà le but. La page la redescend le temps que l'un ou l'autre
   est ouvert, et la rend ensuite. */
function reglerCase() {
  const tiroirOuvert = Boolean(document.querySelector('.tbf-tiroir.on'));
  const souvenir = $('souvenir');
  const zs = tiroirOuvert ? '47' : '';
  if (souvenir.style.zIndex !== zs) souvenir.style.zIndex = zs;
  const case_ = scene?.banniere ?? document.querySelector('body > .tbf-moment');
  if (!case_) return;
  const z = tiroirOuvert ? '47' : $('feuille').classList.contains('on') ? '94' : '';
  if (case_.style.zIndex !== z) case_.style.zIndex = z;
}
function suivreLeTiroir() {
  const tiroir = document.querySelector('.tbf-tiroir');
  if (!tiroir) return false;
  new MutationObserver(reglerCase).observe(tiroir, { attributes: true, attributeFilter: ['class'] });
  reglerCase();
  return true;
}
addEventListener('load', () => {
  // Le tiroir est monté par `menu.js`, en différé, après qui est connecté.
  let essais = 0;
  const guetter = () => { if (!suivreLeTiroir() && ++essais < 40) setTimeout(guetter, 250); };
  guetter();
});

/**
 * La couleur d'un camp, telle qu'on peut l'écrire à l'écran : celle du
 * blason, éclaircie par `FX.lisible` ; l'or du jeu pour un club dont le
 * blason n'a pas encore été lu.
 */
function couleurDuCamp(cote, defaut = 'var(--projo)') {
  const c = cote === S?.you?.side
    ? (S?.fixture?.[S.you.side ? 'awayColors' : 'homeColors'] ?? [])
    : (S?.fixture?.[S.you.side ? 'homeColors' : 'awayColors'] ?? []);
  return c[0] ? (window.FX?.lisible?.(c[0]) ?? c[0]) : defaut;
}

/** La minute du match à l'entrée dans la tribune, posée par « virage:state »
    et relevée par `minuteApprise`. Nulle tant qu'on ne la connaît pas : rien
    n'est alors écarté. */
let entreeMinute = null;
/** L'instant de cette entrée, à l'horloge de la page. */
let entreeA = Date.now();

/**
 * Ce qu'une minute reçue après l'entrée apprend de celle de l'entrée.
 *
 * L'état ne la dit pas toujours. Une salle qui ouvre sur une ligne de
 * calendrier jamais relevée — un match « ailleurs », écrit « NS » avant le
 * coup d'envoi — envoie une minute nulle, et rien n'était écarté : le premier
 * relevé, à la cinquantième, apportait le rouge de la vingtième et la vidéo
 * de la trentième, et le personnage jouait les deux. Une ligne vieillie,
 * restée à la dixième, laissait passer de même tout ce qui avait suivi.
 *
 * Or le match ne court pas plus vite que la montre : à la minute M, reçue Δ
 * minutes après l'entrée, on était entré à la minute M − Δ au moins. Ce
 * plancher ne fait que relever la minute de l'entrée, jamais la baisser ; la
 * mi-temps, un relevé en retard ou la minute d'un but ne donnent qu'un
 * plancher plus bas, donc rien. Δ est arrondi au-dessus : dans le doute, on
 * écarte moins. Et un match vraiment pas commencé donne un plancher nul ou
 * négatif — rien de ce qui suit le coup d'envoi n'est écarté, même quand le
 * premier relevé n'arrive qu'à la cinquième minute.
 */
function minuteApprise(minute) {
  const m = Number(minute);
  if (minute == null || !Number.isFinite(m)) return;
  const plancher = m - Math.ceil((Date.now() - entreeA) / 60_000);
  if (entreeMinute == null || plancher > entreeMinute) entreeMinute = plancher;
}

/** Une entrée du fil d'avant l'entrée du joueur — voir « virage:fil ». */
const dAvantLEntree = (e) => entreeMinute != null && e.genre !== 'periode'
  && (e.minute ?? 0) < entreeMinute - 2;

/**
 * Ce que le personnage fait d'une entrée du fil : l'arbitrage vidéo, un
 * carton rouge et le coup de sifflet final. Le reste passe dans le ticket.
 */
function reagirAuFil(e) {
  if (!scene || !S?.you) return false;
  const mien = e.side === S.you.side;

  if (e.type === 'Var') {
    celebrer();
    scene.moment('decision', mien ? 'BUT REFUSÉ' : 'LEUR BUT EST REFUSÉ', {
      couleur: mien ? 'var(--flare)' : 'var(--vert)',
      sous: ditDetail(e.detail ?? '') || 'Décision de l’arbitrage vidéo',
    });
    return true;
  }

  if (e.type === 'Card' && /red/i.test(e.detail ?? '')) {
    celebrer();
    scene.moment(mien ? 'decision' : 'progression',
      mien ? 'CARTON ROUGE' : 'ROUGE POUR EUX', {
        couleur: mien ? 'var(--flare)' : 'var(--vert)',
        sous: e.joueur ?? '',
      });
    return true;
  }

  if (e.genre === 'periode' && window.TBF_HORLOGE.FINIES.has(e.type)) {
    const nous = S.scoreReel?.[S.you.side] ?? 0;
    const eux = S.scoreReel?.[S.you.side ^ 1] ?? 0;
    const etat = nous > eux ? 'victoire' : nous < eux ? 'defaite' : 'neutre';
    celebrer();
    scene.moment(etat, nous > eux ? 'VICTOIRE' : nous < eux ? 'DÉFAITE' : 'MATCH NUL', {
      couleur: nous > eux ? 'var(--vert)' : nous < eux ? 'var(--flare)' : 'var(--gris)',
      sous: PERIODES[e.type] ?? '',
    });
    return true;
  }
  /* Le reste — un jaune, un changement, la mi-temps — passe dans le ticket,
     pas sur la scène : rien à montrer, donc pas de place prise dans le
     défilé des moments (`apresLaFenetre`). */
  return false;
}

function banner(t, ms = 1800) {
  const b = $('banner'); b.textContent = t; b.classList.add('on');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('on'), ms);
}
function float(txt, color) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.color = color;
  el.style.left = '58%'; el.style.top = '46%';
  $('rope').appendChild(el); setTimeout(() => el.remove(), 1200);
}
/** Un mot bref au joueur, là où les refus s'affichent déjà. */
function mot(texte) {
  const e = $('err');
  e.textContent = texte;
  e.className = 'err on';
  clearTimeout(e._t); e._t = setTimeout(() => { e.className = 'err'; }, 2600);
}

function fail(code) {
  const e = $('err');
  e.textContent = ({
    'ferveur.error.not_enough_breath':'Pas assez de souffle',
    'ferveur.error.rate_limited':'Trop de chants d’affilée',
    'ferveur.error.taps_too_fast':'Frappes trop rapprochées',
    'ferveur.error.inhuman_regularity':'Frappes trop régulières',
    'ferveur.error.not_your_match':'Aucun de tes clubs ne joue ce match',
    'ferveur.error.card_not_in_hand':'Cette carte n’est plus dans ta main',
    'ferveur.error.card_on_cooldown':'Cette carte se recharge encore',
    'ferveur.error.card_not_in_virage':'Cette carte ne se joue qu’en duel',
    'ferveur.error.condition_not_met':'Les conditions de cette carte ne sont pas réunies',
    'ferveur.error.evolution_locked':'L’âge suivant de ton Fanzzy n’est pas débloqué',
    'ferveur.error.not_in_virage':'Tu n’es plus dans la tribune',
    'ferveur.error.chant_hors_repertoire':'Ce chant n’est plus au répertoire',
    /* La porte fermée : si elle arrive, « Refusé par le serveur » ne dit
       rien à personne. */
    'ferveur.error.no_fixture':'Ce match n’est pas ouvert pour l’instant',

    /* Les refus du contrôle des gestes : ils parlent de la **manière de
       taper**, et c'est précisément ce qu'un joueur ne peut pas deviner.
       Les trois « inconnu du serveur » disent de recharger. */
    'ferveur.error.bad_taps':'Ce geste n’a pas été enregistré — recommence',
    'ferveur.error.too_many_taps':'Trop de frappes pour ce geste',
    'ferveur.error.tap_out_of_window':'Des frappes sont tombées hors du temps imparti',
    'ferveur.error.unknown_gesture':'Ce geste est inconnu du serveur — recharge la page',
    'ferveur.error.unknown_effect':'Cette carte est inconnue du serveur — recharge la page',
    'ferveur.error.unknown_card':'Cette carte n’existe plus — recharge la page',

    /* Les deux refus qui ne viennent pas du jeu. */
    'auth.error.unauthenticated':'Ta session a expiré — reconnecte-toi',
    'ferveur.error.server':'Le serveur n’a pas pu traiter ça — réessaie',
  })[code] ?? familleDuRefus(code) ?? 'Refusé par le serveur';
  e.className = 'err on';
  clearTimeout(e._t); e._t = setTimeout(() => { e.className = 'err'; }, 2600);
}

/**
 * Ce qu'on dit d'un refus d'épreuve que la table ne nomme pas un par un.
 *
 * Le contrôle des épreuves lève des codes en `ferveur.error.<quoi>.<pourquoi>` :
 * la seconde moitié dit **pourquoi** c'est refusé, et elle se répète d'une
 * épreuve à l'autre. On répond à la raison, qui est ce que le joueur a besoin
 * d'entendre, et une épreuve neuve est couverte le jour où elle arrive.
 */
function familleDuRefus(code) {
  const c = String(code ?? '');
  if (/\.trop_rapide$/.test(c)) return 'Trop vite : le geste n’a pas pu être mesuré';
  if (/\.trop_reguliere$/.test(c)) return 'Trop régulier pour une main — va à ton rythme';
  if (/\.trop_juste$/.test(c)) return 'Répondu avant d’avoir pu lire la consigne';
  if (/\.hors_delai$/.test(c)) return 'Trop tard : l’épreuve était déjà finie';
  if (/\.(trop_nombreuses|trop_nombreux|trop_longue)$/.test(c)) return 'Trop de gestes d’un coup';
  if (/\.invalide$/.test(c)) return 'Ce geste n’a pas été compris — recommence';
  if (/^ferveur\.error\.(epreuve|consigne)\./.test(c)) {
    return 'Cette épreuve est inconnue du serveur — recharge la page';
  }
  return null;
}


/* ------------------------------------------------------------ les gestes

   Le client enregistre les instants et les transmet ; le serveur note, et
   nomme le verdict. **La fenêtre attend la réponse au plus 600 ms après la
   dernière frappe et y claque le tampon** (`TBF_GESTE.attendre`, qui joue
   lui-même le clac à l'impact : la page n'en joue pas un second) ; sans
   réponse à temps elle se ferme, et le tampon claque sur la carte jouée à
   l'arrivée. Aucun seuil n'est écrit ici : le mot est `verdict`, servi. */

/** La consigne, ses mots en gras comme `geste.js` les marque (**…**). */
function ecrireConsigne(el, texte) {
  el.replaceChildren(...String(texte ?? '').split('**').map((bout, i) => {
    if (!(i % 2)) return document.createTextNode(bout);
    const b = document.createElement('b');
    b.textContent = bout;
    return b;
  }));
}

function openMini(card) {
  return new Promise((resolve) => {
    const m = $('mini');
    m.style.setProperty('--c', COLORS[card.gest]);
    const [nom, geste] = $('miniTitle').children;
    ecrire(nom, card.nom ?? card.id);
    ecrire(geste, `${sansCoupure(LABEL[card.gest])} · ${card.power}`);
    ecrireConsigne($('miniHint'), HINT[card.gest]);
    /* L’épreuve prend l’écran : les cartes jouées par les autres passaient
       par-dessus la grille. Elles reviennent à la fermeture. */
    window.TBF_ACTION?.suspendre?.();
    /* Même règle pour la case d'un moment déjà à l'écran : posée sur `body`
       pour quinze secondes, au calque 95, elle passait par-dessus le pavé
       (`#app` est un contexte d'empilement). Ce qui arrive pendant le geste
       attend sa fin — voir `apresLaFenetre`. */
    scene?.couper?.();
    // Et la carte-souvenir déjà là, qui, elle, revient après : voir `rangerLeSouvenir`.
    rangerLeSouvenir();
    m.classList.add('on');
    let k = 3;
    const tick = () => {
      if (k === 0) return run(card, resolve);
      const c = document.createElement('div');
      c.className = 'countdown'; c.textContent = k--;
      m.appendChild(c); setTimeout(() => c.remove(), 550); buzz(8);
      setTimeout(tick, 560);
    };
    tick();
  });
}

let chantEnCours = null;
function closeMini() {
  /* Le chant de la tribune s'arrête avec la fenêtre, toujours : geste fini,
     abandonné ou page quittée. */
  chantEnCours?.arreter?.();
  chantEnCours = null;
  $('mini').classList.remove('on');
  window.TBF_ACTION?.reprendre?.();
  $('miniZone').innerHTML = '';
  if (souvenirsEnAttente.length) setTimeout(annoncerSouvenir, 400);
}

/**
 * Le déroulé d'un geste vit dans `/geste.js` ; ses durées viennent toutes de
 * `S.you.gestes`, que le serveur remplit avec les modificateurs du porteur.
 *
 * **Le chant de la tribune est calé sur la même pulsation** : demandé juste
 * avant `jouer`, avec le même instant d'origine, que la page donne aussi au
 * geste (`origine`) — la pulsation dessinée, le chant entendu et les
 * frappes comptées partent du même instant, et non de deux lectures de
 * l'horloge. Il n'accompagne que les gestes de rythme ; sans durées
 * servies, rien ne chante.
 *
 * Il rend la main quoi qu'il arrive : une exception dans le moteur des
 * gestes ne doit pas laisser la fenêtre figée pour le reste du match.
 */
function run(card, resolve) {
  const rate = (e) => {
    console.error('[virage] le geste a levé :', e);
    chantEnCours?.arreter?.();
    resolve(null);
  };
  try {
    const origine = performance.now();
    chantEnCours = window.TBF_SON?.chantDuGeste?.(card.gest, S?.you?.gestes, { origine }) ?? null;
    window.TBF_GESTE.jouer(card.gest, S?.you?.gestes, { zone: $('miniZone'), origine })
      .then((taps) => { chantEnCours?.arreter?.(); resolve(taps); })
      .catch(rate);
  } catch (e) {
    rate(e);
  }
}

/* La réponse d'un chant : la promesse que `TBF_GESTE.attendre` tient. Le
   serveur ne répond qu'à la socket qui chante ; le prochain `virage:result`
   est donc le nôtre, et un refus la tient à vide. `chantEnVol` la garde
   aussi pour la demande de bilan, qui passe après elle (voir
   `demanderBilan`). */
let reponseEnAttente = null, chantEnVol = null;
function attendreReponse() {
  chantEnVol = new Promise((tenir) => {
    const f = (r) => { if (reponseEnAttente === f) reponseEnAttente = null; tenir(r); };
    reponseEnAttente = f;
    setTimeout(() => { if (reponseEnAttente === f) f(null); }, 10_000);
  });
  return chantEnVol;
}

const carteDeCle = (cle) => [...$('hand').children].find((n) => n._cle === cle) ?? null;

/* ------------------------------------------- ce qui attend la fin du geste

   **Pendant un geste, rien ne couvre le pavé ni ne le fait bouger.**

   La fenêtre du geste vit dans `#app`, qui est un contexte d'empilement
   (ETAT.md § 6) : tout calque posé sur `body` passe devant elle, quel que
   soit son `z-index`. Or un but — réel, ou de corde, qui naît des chants des
   autres pendant qu'on fait le sien — posait tout de suite la case
   « GOAL ! » (z 95, quinze secondes, un tiers du pavé et son centre) et la
   secousse de `#app`, donc du pavé ; un rouge ou une vidéo au fil, leur
   case. Le chant raté coûtait quand même son souffle, en pleine minute
   double (Gaël, 4 octobre 2026).

   Ce qui couvre ou fait bouger l'écran attend donc la fermeture de la
   fenêtre : la case, la secousse, le chiffre de la poussée, la demande de
   bilan du coup de sifflet. Ce qui doit se savoir tout de suite reste
   immédiat — la tribune qui s'embrase, le score et le fil, la minute
   double, la corne et la rumeur, la vibration. C'est la règle des cartes des
   autres, déjà mises de côté par `TBF_ACTION.suspendre`, et de la
   carte-souvenir (`annoncerSouvenir`). */
const apresLeGeste = [];

/* ## Plusieurs moments pendant un même geste : **le jeu d'abord**

   `scene.moment` remplace le moment affiché, et la file se vidait d'un coup
   à la fermeture : trois moments posés dans la même milliseconde n'en
   laissaient voir qu'un, le dernier. Un but de corde, un rouge et un but
   réel tombés pendant un chant ne montraient que « GOAL ! » ; les deux
   autres passaient sans que personne les voie.

   Ils se montrent donc **l'un après l'autre**, chacun le temps de se lire
   (`ENTRE_DEUX_MOMENTS`), et dans l'ordre que Gaël a fixé le 6 octobre 2026 —
   « on affiche toujours en premier ce qui est lié au jeu » : ce que la
   tribune a fait (la corde qui cède), puis ce que le match a fait (la vidéo,
   un rouge, le coup de sifflet final), et les buts réels **en dernier** —
   c'est le dernier qui reste à l'écran ses quinze secondes, et le but est
   celui qu'on veut y voir. À rang égal, l'ordre d'arrivée.

   Un moment qui arrive pendant le défilé y prend son rang au lieu de couper
   la file : posé tout de suite, il serait remplacé quelques secondes plus
   tard par un moment plus ancien. Hors d'un geste et hors d'un défilé, rien
   ne change : un moment remplace le précédent, et c'est le dernier qui
   compte (`fanzzy-scene.js`). Un geste qui s'ouvre en plein défilé
