<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grand Virage — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:var(--colonne);height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(110% 30% at 50% 0%,rgba(60,130,232,.15),transparent 60%),
             radial-gradient(110% 30% at 50% 100%,rgba(245,195,59,.15),transparent 60%),
             linear-gradient(180deg,#141A21,#0A0D11 50%,#141A21);overflow:hidden}
#app.quake{animation:quake .7s}
@keyframes quake{0%,100%{transform:translate(0,0)}12%{transform:translate(-7px,4px)}
  32%{transform:translate(6px,-5px)}56%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}

/* La réserve à droite est celle du bouton de menu, qui flotte au-dessus de
   l'écran depuis que la barre du bas a disparu. Sans elle, il se pose sur le
   nom du club de droite — et c'est justement le sien. */
/* Le dégagement des deux boutons flottants vient de `nav.js` — une seule
   déclaration pour les deux écrans de jeu. Il était écrit 58px ici et 58px
   dans le duel, et le blason du club de droite passait quand même à six pixels
   du bouton de menu : de loin, il avait l'air posé dessous. */
.hud{display:flex;align-items:center;gap:9px;flex:none;z-index:5;
  padding:10px var(--tbf-haut-d,62px) 4px var(--tbf-haut-g,62px)}
.club{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
/* **C'est le camp d'en face qui se retourne, pas le sien.**

   Le bandeau montrait EN FACE à gauche, le score au milieu, TA TRIBUNE à
   droite — et le score, lui, s'écrivait « toi d'abord », comme partout
   ailleurs dans le jeu (voir `renderFil`, qui l'écrit noir sur blanc). Les
   deux se contredisaient à deux centimètres l'un de l'autre : on gagnait la
   corde quatre fois et on lisait « 4 – 0 » collé au blason de l'adversaire.
   Un score entre deux blasons se lit par sa position, pas par une convention
   qu'on ne voit nulle part.

   Le sien passe donc à gauche, du côté de son chiffre. */
.club.foe{flex-direction:row-reverse;text-align:right}
.club img{width:26px;height:26px;object-fit:contain;flex:none}
.club b{font-family:var(--banner);font-size:13px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* `nowrap` : le dégagement des deux boutons a pris seize pixels à l'en-tête, et
   « TA TRIBUNE » s'est cassé en deux lignes, ce qui décale tout le bandeau.
   `min-width:0` sur le conteneur du texte, sinon un bloc flex refuse de
   descendre sous la largeur de son contenu et l'ellipse ne sert à rien. */
.club>div{min-width:0}
/* **Onze pixels et 88 %.** L'étiquette était à neuf et demi, à moitié éteinte :
   elle dit de quel côté est le joueur, et c'est la seule chose qu'elle dit. */
.club small{font-size:11px;opacity:.88;letter-spacing:.08em;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club small .court{display:none}
.score{font-family:var(--banner);font-size:24px;flex:none;min-width:64px;text-align:center;line-height:1}
/* La phase sous le score : « GRAND VIRAGE », ou « TOUT COMPTE DOUBLE » pendant
   la minute qui compte. Onze pixels et 88 %, en lettrage étroit pour tenir
   entre les deux clubs : c'est la seule mention de l'écran qui dit que la
   minute double est ouverte, et elle était la plus effacée.

   **Sur un téléphone, la minute double s'écrit « TOUT ×2 ».** À onze pixels,
   « TOUT COMPTE DOUBLE » prend cent quinze pixels au milieu du bandeau, et les
   deux clubs tombaient à « FC … » pendant toute la minute — c'est-à-dire au
   moment où l'on veut savoir qui pousse. Même procédé que « TOI » et « EUX » :
   les deux formes sont écrites, la longue reste pour les lecteurs d'écran.
   La forme courte vaut jusqu'à 500 px : voir les reprises juste en dessous. */
.score small{display:block;font-size:11px;letter-spacing:.08em;opacity:.88;font-family:var(--banner);
  font-weight:500;margin-top:3px;white-space:nowrap}
.score small .court{display:none}
/* **Une étiquette coupée ne dit plus rien.** « TA TRIB… » et « EN F… » ne
   distinguent plus les deux camps, ce qui est précisément leur seul travail.
   Sur les écrans étroits, l'interlettrage part le premier : il est là pour
   l'allure, et l'allure passe après la lecture.

   Ça n'a pas suffi : l'audit mesurait encore quinze pixels de trop à 360 px.
   En cherchant d'où venait la place, on tombe sur un compte qui explique
   tout — 62 px de dégagement de chaque côté pour les deux boutons flottants,
   soit **un tiers de l'écran** avant d'avoir écrit un seul mot. Sur les 236
   qui restent, « GRAND VIRAGE » en réservait soixante-cinq au milieu, et les
   deux camps se partageaient le reste : quarante-quatre pixels de texte pour
   en écrire cinquante-neuf.

   On ne touche pas au dégagement — il a déjà été monté de 58 à 62 parce que
   le blason passait sous le bouton de menu. On reprend les pixels là où ils
   ne servent qu'à respirer : l'interlettrage de la phase, les écarts, le
   blason. Aucune de ces quatre reprises ne suffirait seule. */
/* Les reprises ne touchent plus au corps du texte : sous onze pixels, une
   mention cesse d'informer, et c'est ce que le socle interdit désormais. Elles
   prennent l'interlettrage et les écarts, et c'est tout.

   **Écrites après les règles qu'elles reprennent, et jusqu'à 500 px.** Le
   bloc se trouvait au-dessus de `.score` et de `.score small` : à sélecteur
   égal, c'est la règle écrite plus bas qui gagne, et deux des quatre
   reprises — la largeur minimale du score, l'interlettrage de la phase —
   n'avaient jamais pris effet. Et il s'arrêtait à 420 px, alors que
   l'étiquette longue ne tient sans elles qu'à partir de 450 px environ, et
   pendant la minute double vers 490 : un grand iPhone, à 430 px, lisait
   « TA TRIB… » en temps normal comme pendant la minute. */
@media (max-width:500px){
  .hud{gap:6px}
  .club{gap:5px}
  .club img{width:22px;height:22px}
  .club small{letter-spacing:0}
  .score{min-width:0}
  .score small{letter-spacing:.04em}
  .score small .court{display:inline}
  .score small .long{position:absolute;width:1px;height:1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap}
}
/* **Sous 390 px, « TA TRIBUNE » ne rentre pas, alors on écrit « TOI ».**

   Les reprises du dessus ne suffisent pas en dessous : il manque encore
   quelques pixels, et il n'y a plus rien à gratter qui ne se paie pas
   ailleurs — gagner deux pixels par un demi-point de police, c'est se
   remettre dans la même situation à la première police qui change. Le seuil
   était à 380 px, et l'étiquette se coupait encore juste au-dessus : il
   laisse maintenant quelques pixels de marge.

   Alors on arrête de rétrécir le mot et on en change. « TOI » et « EUX »
   disent exactement ce que disaient « TA TRIBUNE » et « EN FACE » — c'est
   déjà ce qu'on lit, en plus court. Le texte long reste dans le document
   pour les lecteurs d'écran, qui n'ont pas de problème de largeur.

   **Deux mots écrits, et non un mot mis à zéro.** Le long était éteint par
   une police de zéro pixel, le court peint en `::before` : l'audit mesurait
   donc un texte de zéro pixel — un texte qu'on ne peut pas lire, par
   construction. Les deux sont maintenant dans le balisage ; le court se
   montre ici, et le long se retire de l'écran sans quitter le document. */
@media (max-width:390px){
  .club small .court{display:inline}
  .club small .long{position:absolute;width:1px;height:1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap}
}
/* Pendant la minute double, le score passe à l'or : vingt-quatre pixels,
   c'est du grand texte. La mention dessous, elle, en héritait — de l'or en
   onze pixels, qui ne tient pas au soleil (arbitrage du 2 octobre 2026) :
   elle reste en craie, et la graisse dit que la minute compte double. */
.score.surge{color:var(--projo);animation:pulse 1s infinite}
.score.surge small{color:var(--craie);font-weight:700}
/* Inviter quelqu'un. Sous le score, minuscule : c'est une chose qu'on fait une
   fois en entrant, pas toutes les trente secondes — et la place au-dessus
   appartient au match.

   **Minuscule à l'œil, pas sous le doigt.** La pastille mesurait 52×19 : on
   la visait trois fois. Mais la grossir, c'était lui donner l'importance
   qu'on vient de lui refuser. Alors le bouton et la pastille sont devenus
   deux choses : le `button` est une zone de touche transparente de 44 px,
   le `span` à l'intérieur garde le trait fin. Les marges négatives rendent
   au bandeau la hauteur que la zone a prise — elle déborde sur ce qu'il y a
   dessus et dessous, où il n'y a rien à toucher.

   **Discrète par le trait, plus par l'effacement.** Le mot était à huit
   pixels et à 55 % : discret au point de ne pas se lire. Il passe à onze
   pixels et 88 %, en lettrage étroit pour garder la pastille courte ; c'est
   le trait fin et l'absence de fond qui la laissent au second plan. */
.inviter{display:flex;align-items:center;justify-content:center;min-height:44px;
  margin:-11px auto -13px;background:none;border:0;padding:0;cursor:pointer}
.inviter span{border:1px solid rgba(242,238,228,.22);border-radius:5px;
  color:var(--craie);font-family:var(--banner);font-size:11px;letter-spacing:.08em;
  line-height:1.2;padding:2px 7px;opacity:.88}
/* Au survol, le trait et le mot passent à la craie pleine ; ils passaient
   à l'or, et en onze pixels l'or ne tient pas (arbitrage du 2 octobre 2026). */
.inviter:hover span{opacity:1;border-color:var(--craie)}
/* La minute double bat par la lumière et non par l'effacement : à mi-course,
   le score tombait à 55 % — le chiffre qu'on regarde le plus, illisible une
   demi-seconde sur deux au moment où il compte double. */
@keyframes pulse{0%,100%{text-shadow:0 0 0 rgba(245,195,59,0)}
  50%{text-shadow:0 0 14px rgba(245,195,59,.9)}}

/* ------------------------------------------------------------- le fil

   Une bande, pas un panneau. L'écran du virage est déjà plein — la corde, le
   souffle, cinq cartes — et le fil ne doit pas prendre la place du jeu : il
   donne le score réel, la minute et la dernière chose arrivée sur le terrain.
   Le reste attend qu'on le demande.

   Le score affiché ici est celui du **vrai match**, pas celui de la tribune
   qui est en haut. Les confondre serait pire que de ne rien montrer : le
   joueur pousse sur une corde dont le score n'a rien à voir avec la rencontre,
   et c'est précisément ce que le fil est là pour démêler — d'où le mot
   « TERRAIN » sous les chiffres. */
/* **`color: inherit`, et c'est tout le sujet.**
 *
 * La bande est un `<button>`, et un bouton n'hérite pas de la couleur de la
 * page : le navigateur lui donne la sienne, c'est-à-dire du **noir**. Sur un
 * fond à `rgba(6,10,16,.78)`, le score du match et la dernière action étaient
 * donc écrits en noir sur presque noir. Mesuré : `rgb(0,0,0)` là où la page
 * est à `rgb(242,238,228)`.
 *
 * Seuls survivaient les deux éléments qui portent une couleur à eux — la
 * minute en rouge et « TERRAIN » en or — ce qui donnait une bande où l'on
 * voyait les étiquettes et pas les informations. J'avais d'abord grossi les
 * chiffres et opacifié le fond en croyant à un défaut de contraste ; ça ne
 * pouvait rien donner, du noir agrandi reste du noir. */
.fil{flex:none;display:flex;align-items:center;gap:11px;margin:0 13px 5px;padding:8px 12px;
  border-radius:10px;background:rgba(6,10,16,.82);border:1px solid rgba(242,238,228,.26);
  cursor:pointer;min-height:50px;text-align:left;color:inherit;font-family:inherit}
.fil .sc{flex:none;padding-right:11px;border-right:1px solid rgba(242,238,228,.16);
  line-height:1}
.fil .sc b{font-family:var(--banner);font-size:20px;letter-spacing:.03em;display:block;
  font-variant-numeric:tabular-nums;color:var(--craie)}
/* Ce libellé porte tout le sens de la bande : sans lui, deux scores se
   suivent à l'écran sans qu'on sache lequel est le match. À 8 px et 45 %
   d'opacité il ne se lisait pas — autant l'enlever. À neuf, il se devinait ;
   il passe à onze, le plancher de tout ce qui informe, et reprend deux pixels
   de marge pour que la bande ne grandisse presque pas. */
/* « TERRAIN » en craie grasse : il était en or, et en onze pixels l'or ne
   tient pas au soleil (arbitrage du 2 octobre 2026). */
.fil .sc small{display:block;font-size:11px;letter-spacing:.1em;opacity:.88;margin-top:2px;
  font-weight:700;color:var(--craie)}
/* **Un score ne dit rien sans ses deux camps.**
 *
 * « 1 – 0 » au-dessus de « TERRAIN » laissait deviner qui menait. Les deux
 * clubs sont pourtant nommés juste au-dessus, dans l'entête — mais dans
 * l'ordre du **match**, alors que la bande range le sien d'abord, comme tous
 * les écrans du jeu. Les deux lignes se contredisaient donc à l'œil.
 *
 * Trois lettres par club, sous les chiffres, dans l'ordre de la bande : le
 * doute disparaît sans qu'on ait à relire l'entête. */
.fil .qui{display:flex;gap:6px;font-family:var(--banner);font-size:11px;
  letter-spacing:.06em;opacity:.88;margin-top:2px}
.fil .qui i{font-style:normal}
/* Le sien d'abord, et en gras : il était en or, et l'or ne s'écrit plus en
   onze pixels (arbitrage du 2 octobre 2026). */
.fil .qui .moi{font-weight:700;color:var(--craie)}
/* La minute du match. Elle défile localement entre deux relevés — sans quoi
   elle restait figée sur celle de l'entrée, parfois une demi-heure durant, et
   le joueur poussait en croyant le match arrêté. Le point rouge dit que ça
   tourne ; il s'éteint à la mi-temps. */
.fil .min{flex:none;font-family:var(--banner);font-size:14px;color:var(--flare);
  letter-spacing:.04em;display:flex;align-items:center;gap:5px;padding-right:9px;
  border-right:1px solid rgba(242,238,228,.14);font-variant-numeric:tabular-nums}
.fil .min::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:ping 1.8s ease-out infinite}
.fil .min:empty{display:none}
.fil .min.arret{color:var(--gris)}
.fil .min.arret::before{animation:none;opacity:.5}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,64,44,.6)}
  70%{box-shadow:0 0 0 7px rgba(224,64,44,0)}100%{box-shadow:0 0 0 0 rgba(224,64,44,0)}}

/* La dernière action occupe tout ce qui reste. Sur un téléphone c'est
   étroit et elle s'abrège ; sur un écran large la bande fait huit cents
   pixels, et laisser le texte collé au score y dessinait un grand vide à
   droite — une bande à moitié pleine se lit comme une bande en panne. */
.fil .der{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;
  overflow:hidden;white-space:nowrap}
.fil .der .m{font-family:var(--banner);font-size:11.5px;opacity:.88;flex:none;
  font-variant-numeric:tabular-nums}
.fil .der .t{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.fil .der .t small{font-size:11px;opacity:.88}
/* **Ce que la bande ouvre, écrit dessus.**
 *
 * Elle donne accès à la feuille de match — tous les buts, tous les cartons,
 * toute la chronologie — et rien ne le disait qu'un chevron de quatorze
 * pixels à 40 % d'opacité. Sur un écran large, la dernière action laissait en
 * plus cinq cents pixels de vide à sa droite : une bande à moitié pleine se
 * lit comme une bande en panne, et personne n'essaie de cliquer dessus.
 *
 * Le vide porte donc l'invitation. Elle disparaît sous cinq cent soixante
 * pixels, où il n'y a plus de vide à remplir et où la place appartient à la
 * dernière action. */
.fil .voir{flex:none;display:none;font-family:var(--banner);font-size:11px;
  letter-spacing:.12em;opacity:.88;margin-left:auto}
@media (min-width:560px){ .fil .voir{display:block} }
.fil:hover .voir{opacity:1}
.fil .plus{flex:none;opacity:.5;font-size:16px;font-family:var(--banner)}
/* Une entrée neuve se signale une seconde et demie, puis se tait. Un fil qui
   clignote en permanence cesse d'être lu au bout de deux minutes. */
.fil.neuf{animation:filneuf 1.5s ease-out}
@keyframes filneuf{0%{border-color:var(--projo);background:rgba(245,195,59,.2)}
  100%{border-color:rgba(242,238,228,.24);background:rgba(6,10,16,.78)}}

/* Au-dessus des effets, et c'est délibéré.
   `fx.js` occupe les calques 89 à 93 avec des bandeaux en plein écran. Le
   « MINUTE DOUBLE » d'un but recouvrait la tête de la feuille, donc le bouton
   de fermeture, pendant deux secondes. Un plein écran dont on ne s'échappe
   qu'en attendant la fin d'une animation est la même faute que le booster
   dont la seule issue était de recharger la page. Et le choix est cohérent :
   qui a ouvert le fil regarde le fil, qui lui annonce déjà le but. */
.feuille{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--colonne);z-index:95;display:none;flex-direction:column;
  background:rgba(5,7,10,.96)}
.feuille.on{display:flex}
.feuille .tete{flex:none;display:flex;align-items:center;gap:10px;padding:14px 15px 10px}
.feuille .tete b{font-family:var(--banner);font-size:15px;letter-spacing:.1em;flex:1}
/* La feuille se lit en craie pleine : la minute, le score et le détail sous
   chaque ligne étaient entre 45 et 60 %, c'est-à-dire illisibles au soleil
   sur l'écran qu'on ouvre justement pour lire. Pleine et non simplement
   au-dessus du plancher : sous le voile blanc du plein jour, une craie à 88 %
   sur ce noir tombe à 4,3:1, sous les 4,5 d'un texte courant. La hiérarchie
   passe par la taille. La croix de fermeture passe à quarante-quatre pixels,
   la cible d'un pouce. */
.feuille .tete #feuilleScore{font-size:12px;font-variant-numeric:tabular-nums}
.feuille .tete .x{width:44px;height:44px;border-radius:9px;border:1px solid rgba(242,238,228,.16);
  background:rgba(0,0,0,.3);color:inherit;font-size:17px;cursor:pointer;flex:none}
.feuille .corps{flex:1;min-height:0;overflow-y:auto;padding:0 15px 18px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-top:1px solid rgba(242,238,228,.07)}
.ev .min{font-family:var(--banner);font-size:13px;width:38px;flex:none}
.ev .ic{width:20px;text-align:center;flex:none}
.ev .txt{flex:1;min-width:0}
.ev .txt small{display:block;font-size:11px}
.ev.droite{flex-direction:row-reverse;text-align:right}
.ev.droite .txt{text-align:right}
/* Le virage a sa propre voix dans le fil : ce qu'a fait la tribune est en
   couleur, le terrain reste en craie. Sans cette distinction, « BUT » se lit
   comme un but du match et le joueur croit que son club vient de marquer.

   **L'icône en or, le titre en craie grasse, la minute et le détail en
   craie.** Toute la ligne était en or, et l'or à treize et onze pixels ne
   tient pas au soleil : 4:1 sous le voile du plein jour, contre les 4,5 d'un
   texte courant. Le titre l'est resté un temps ; depuis l'arbitrage du
   2 octobre 2026, l'or ne s'écrit plus qu'en grand, et c'est la graisse qui
   le détache. L'icône, qui n'est pas un mot, garde l'or (voir
   `iconeDuFil`) : elle suffit à dire que c'est la tribune. */
.ev.tribune .txt{font-weight:700}
.ev.tribune .txt small{font-weight:400}
.ev.periode{justify-content:center;font-family:var(--banner);
  font-size:11px;letter-spacing:.16em}
.ev.periode .min,.ev.periode .ic{display:none}
.feuille .vide{text-align:center;font-size:12px;padding:40px 20px;line-height:1.7}

.rope{flex:1;position:relative;min-height:0}
/* Le stade en fond de corde.

   `object-fit: cover` recadrerait sur la hauteur dès que la zone est plus
   étroite que le dessin — et c'est précisément les deux tribunes, sur les
   côtés, qu'on perdrait. On impose donc la largeur et on laisse la hauteur
   déborder : le terrain se coupe en haut et en bas, jamais sur les bords. */
.stade{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0}
/* L'atténuation porte sur **le dessin seul**, pas sur le calque.
   Posée sur `.stade`, elle éteignait aussi la lumière des tribunes — or c'est
   précisément ce qu'on veut voir : le décor doit s'effacer derrière le jeu,
   la tribune qui pousse doit se voir. */
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.5}
.track{position:absolute;left:50%;top:12px;bottom:12px;width:14px;transform:translateX(-50%);
  border-radius:8px;background:linear-gradient(180deg,rgba(60,130,232,.5),rgba(20,24,30,.6) 46%,
  rgba(20,24,30,.6) 54%,rgba(245,195,59,.5));border:1px solid rgba(242,238,228,.12)}
.knot{position:absolute;left:50%;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#2B333F,#0C1015);
  border:2px solid rgba(242,238,228,.28);box-shadow:0 0 30px rgba(0,0,0,.75);
  transition:top .12s linear;z-index:2;font-family:var(--banner);font-size:16px}
.mid{position:absolute;left:50%;top:50%;width:56px;height:1px;transform:translate(-50%,-50%);
  background:rgba(242,238,228,.2)}
/* Combien poussent de chaque côté. Onze pixels et 88 %, avec une ombre dure :
   la mention est posée à même le dessin du stade, et à 50 % elle s'y fondait. */
.crowd{position:absolute;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.12em;opacity:.88;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 1px 5px rgba(0,0,0,.8)}
.crowd.top{top:6px}.crowd.bot{bottom:6px}
/* Le Fanzzy, dans le bas de la tribune — du côté du joueur, puisque la corde
   se pousse vers le haut, chez l'adversaire. À gauche du nœud et non derrière :
   pendant un geste, le nombre qui bouge est la seule chose qu'on lit, et un
   personnage posé dessous le rendrait illisible.

   `pointer-events:none` : le virage se joue au doigt sur les cartes et sur le
   pavé du geste. Un personnage qui intercepterait un appui coûterait un chant. */
.fzs{position:absolute;left:1%;bottom:0;width:41%;height:56%;z-index:1;pointer-events:none}

/* L'annonce sur la corde, en craie grasse : en or et en quinze pixels, elle
   ne tenait pas au soleil (arbitrage du 2 octobre 2026). */
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--banner);
  font-size:15px;font-weight:700;letter-spacing:.18em;opacity:0;transition:opacity .3s;z-index:4;
  color:var(--craie)}
.banner.on{opacity:1}
.float{position:absolute;font-family:var(--banner);font-size:17px;pointer-events:none;z-index:6;
  animation:drift 1.2s ease-out forwards}
@keyframes drift{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-42px)}}

/* Le souffle : la mention à onze pixels et 88 %, la jauge à dix pixels — le
   plancher d'une barre qu'on lit en jouant.

   **Sur une seule ligne : « SOUFFLE », la jauge, le chiffre.** La jauge était
   posée sous sa mention, et chaque pixel qu'elle gagnait était pris à la
   corde, seule élastique de l'écran : passée de sept à dix pixels, elle
   coûtait trois pixels à la corde, et la mention au-dessus lui ajoutait une
   ligne entière. Couchée entre le mot et le chiffre — comme au duel, qui le fait
   depuis toujours —, la rangée ne mesure plus que sa ligne de texte, et la
   jauge a ses dix pixels sans rien prendre à personne.

   `display:contents` sur `.l` : le mot et le chiffre deviennent des éléments
   de la rangée sans toucher au balisage que le script et les tests lisent.
   L'opacité est donc posée sur eux — une boîte qui n'existe plus ne peut pas
   la porter. */
.me-bar{flex:none;display:flex;align-items:center;gap:9px;padding:0 13px 6px}
.me-bar .l{display:contents;font-size:11px;letter-spacing:.12em;line-height:1.1}
.me-bar .l span{opacity:.88}
.me-bar .l span:last-child{order:2;min-width:22px;text-align:right}
.me-bar .b{order:1;flex:1;height:10px;border-radius:5px;background:rgba(242,238,228,.1);overflow:hidden}
.me-bar .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vert),var(--projo));
  transition:width .3s}
/* Le rang, sur une ligne serrée : le chiffre à quatorze pixels et son « e »
   en exposant ouvraient une ligne de vingt-quatre pixels pour un texte de
   onze. `line-height:0` sur l'exposant, sinon il la rouvre à lui seul. */
.rank{text-align:center;font-size:11px;opacity:.88;line-height:1.2;padding-bottom:4px}
/* Le rang, en craie grasse : en or et en quatorze pixels, il ne tenait pas
   au soleil (arbitrage du 2 octobre 2026). */
.rank b{color:var(--craie);font-weight:700;font-family:var(--banner);font-size:14px}
.rank sup{line-height:0}

/* Même règle que sur les autres écrans de jeu : nav.js n'en réserve que 55 %,
   la page complète les 45 % manquants. En marge et non en marge intérieure,
   parce qu'une marge intérieure écraserait les cartes au lieu de les remonter.

   **Cent quatre pixels au moins, et plus s'il le faut.** La rangée avait une
   hauteur fixe, calculée pour des noms courts et un geste écrit à huit pixels.
   Avec le geste à onze pixels — le plancher de lecture — « Le compte à
   rebours » sur quatre lignes et « CONTRETEMPS » sur deux ne tenaient plus :
   la poussée, qui est le chiffre qui décide du choix, sortait par le bas de
   la carte. La rangée grandit donc avec la carte la plus haute.

   **Et la carte se resserre de l'intérieur.** Chaque pixel que prend la
   rangée, c'est la corde, seule élastique de l'écran, qui le rend. La
   première version montait à 138 px, trente-quatre de plus que l'ancienne
   rangée fixe, tous pris à la corde ; le nom qui ne se retire plus que sur
   sa première ligne (voir `.card b`), des interlignes et des marges
   intérieures plus serrés la ramènent à 115 px à 360 × 640, sans rien
   couper. */
.hand{flex:none;display:flex;gap:6px;padding:4px 11px calc(12px + env(safe-area-inset-bottom));
  min-height:104px;margin-bottom:calc(var(--nav-h,62px) * .45)}
/* Le dessin du chant, en fond. Il dit **le geste** — un supporter qui tape en
   rythme, un autre qui retient son souffle — parce que c'est ce que le joueur
   va devoir faire dans les quatre secondes qui suivent. La rangée était douze
   rectangles de texte : on choisissait « La cadence » plutôt que « Les salves »
   en lisant deux mots de huit pixels, en plein match, c'est-à-dire jamais.

   Le voile sombre n'est pas décoratif : le nom, le coût et la poussée s'écrivent
   par-dessus, et sans lui ils deviennent illisibles sur les images claires. */
.card .fond{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  border-radius:9px 9px 0 0;opacity:.5;z-index:0}
.card::after{content:'';position:absolute;inset:0;border-radius:9px;z-index:1;
  background:linear-gradient(175deg,rgba(5,7,10,.82),rgba(5,7,10,.45) 55%,rgba(5,7,10,.86))}
.card>*{position:relative;z-index:2}
.card{flex:1;min-width:0;border-radius:9px;padding:6px 5px;background:rgba(0,0,0,.34);position:relative;cursor:pointer;overflow:hidden;
  border:1px solid rgba(242,238,228,.14);border-top:3px solid var(--c);display:flex;flex-direction:column;gap:2px}
.card:active{transform:translateY(3px) scale(.98)}
/* Trop cher : la carte s'éteint comme une plaque hors service — elle garde sa
   forme et ses chiffres, elle perd sa couleur. À un tiers d'opacité, elle
   perdait aussi son prix, c'est-à-dire la raison pour laquelle elle est
   éteinte. */
.card.dim{filter:grayscale(.85) brightness(.55)}
/* `padding-right` : le coût est posé en absolu dans le coin, et le nom courait
   dessous. Tant que les cartes portaient leur clé — « mur », « reprise » — le
   texte était trop court pour y arriver ; « À perdre haleine » l'a montré.

   **Le retrait ne vaut que pour la première ligne.** Le coût n'occupe que le
   coin, et le `padding-right` se prenait sur toutes les lignes : sur une
   carte de soixante pixels, un quart de la largeur perdu à chaque ligne —
   « Le compte à rebours » s'écrivait sur quatre, et « Le roulement » sortait
   de la carte, coupé net. Un flottant d'une ligne de haut réserve la place du
   coût sur la première seulement. Un mot trop long pour une ligne entière se
   coupe à la syllabe, comme le geste en dessous. */
.card b{font-family:var(--banner);font-size:11.5px;line-height:1.05;
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.card b::before{content:'';float:right;width:14px;height:1em}
/* Le geste, à onze pixels : c'est lui qui dit quelle épreuve va s'ouvrir, et
   il était à huit, à moitié éteint. Une carte de soixante pixels ne loge pas
   « CONTRETEMPS » sur une ligne à cette taille : le mot se coupe à la syllabe
   là où le téléphone sait le faire, et n'importe où plutôt que de sortir de
   la carte. Le même réglage qu'au duel. */
.card .g{font-family:var(--banner);font-size:11px;line-height:1.05;letter-spacing:.02em;
  opacity:.88;text-transform:uppercase;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
/* La puissance, dans la couleur du geste — l'or du jeu pour les six gestes
   de rythme (`geste.js`). En gras : vingt pixels gras sont du grand texte,
   le seul où l'or s'écrit encore (arbitrage du 2 octobre 2026) ; vingt
   pixels maigres n'en sont pas, et l'or y tombait sous le seuil au soleil. */
.card .p{font-family:var(--banner);font-size:20px;font-weight:700;color:var(--c);margin-top:auto;line-height:1}
/* `line-height:1` : le coût tient dans la hauteur de la première ligne du nom,
   et le flottant qui lui garde la place n'a pas à mordre sur la seconde. */
.card .c{position:absolute;top:6px;right:5px;font-size:11px;line-height:1;opacity:.88;font-family:var(--banner)}
/* Sous 350 px, il ne reste que quarante pixels de texte par carte : on prend
   l'écart entre les cartes et les bords de la rangée plutôt que d'ajouter une
   ligne au nom, qui se paierait sur la corde. */
@media (max-width:350px){
  .hand{gap:4px;padding-left:8px;padding-right:8px}
  .card{padding-left:4px;padding-right:4px}
  .card .c{right:4px}
}

/* Le bandeau qui explique les cases vides de la rangée d'action. Discret :
   il dit une règle, il n'annonce pas un incident. Il disparaît de lui-même
   pour qui n'a que des cartes de Virage — c'est-à-dire pour tout joueur qui
   a lu l'écran du deck une fois. */
.ecartees{margin:0 10px 5px;padding:6px 9px;border-radius:8px;font-size:11px;
  line-height:1.45;background:rgba(224,64,44,.1);color:var(--craie);
  box-shadow:inset 0 0 0 1px rgba(224,64,44,.3)}
.ecartees b{font-family:var(--banner);color:var(--flare)}
/* Le lien, en craie grasse et souligné : il était en or, sans trait, et en
   onze pixels l'or ne tient pas au soleil (arbitrage du 2 octobre 2026). En
   craie, c'est le soulignement qui dit qu'il se touche. */
.ecartees a{color:var(--craie);font-weight:700;text-decoration:underline;text-underline-offset:2px;
  white-space:nowrap}
.ecartees[hidden]{display:none}

/* ------------------------------------------- les cartes d'action

   Une rangée basse au-dessus des chants. Le dessin porte la carte, le nom
   n'est qu'un rappel : à cette taille on reconnaît une torche bien avant
   d'avoir lu « Torche ». */
.actes{flex:none;display:flex;gap:5px;padding:0 11px 5px}
.acte{flex:1;position:relative;aspect-ratio:.74;max-height:74px;border-radius:7px;overflow:hidden;
  border:1px solid var(--fc,#8257DA);cursor:pointer;
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(0,0,0,.4));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:2px;padding:3px 2px 4px}
.acte:active{transform:translateY(3px) scale(.98)}
.acte .sceau{position:absolute;left:50%;top:44%;width:64%;height:auto;
  transform:translate(-50%,-50%);opacity:.24;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.acte .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%;filter:brightness(.6)}
.acte::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,10,.45),transparent 42%,rgba(4,6,10,.92))}
/* Le coût et le nom à onze pixels, le nom en lettrage étroit : à six pixels et
   demi, « le nom n'est qu'un rappel » voulait dire qu'on ne le lisait pas. Deux
   cartes de la même famille se ressemblent, et c'est le nom qui les sépare. */
.acte .co{position:relative;z-index:2;font-family:var(--banner);font-size:11px;
  color:var(--craie);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.acte .nm{position:relative;z-index:2;font-family:var(--banner);font-size:11px;line-height:1.05;
  letter-spacing:.01em;text-align:center;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.9);padding:0 2px}
/* Hors service, elle s'éteint au lieu de pâlir : voir `.card.dim`. Le compte à
   rebours, lui, reste lisible — c'est lui qui dit quand elle reviendra.

   L'extinction est donc posée sur chaque enfant **sauf** le compte à rebours,
   et non sur la carte : un filtre sur la carte vaut pour tout ce qu'elle
   contient, et le chiffre tombait à 60 % de sa lumière avec le dessin. Le
   cadre perd sa couleur à part, et le dessin garde l'assombrissement qu'il
   recevait deux fois (le sien, puis celui de la carte). */
.acte.hs{border-color:rgba(242,238,228,.22);cursor:default}
.acte.hs>:not(.cd){filter:grayscale(.85) brightness(.6)}
.acte.hs>.illu{filter:grayscale(.85) brightness(.36)}
/* Le compte à rebours passe devant le voile, sinon le chiffre s'assombrit. */
.acte .cd{position:absolute;inset:0;z-index:3;background:rgba(4,6,10,.72);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--banner);font-size:12px;color:var(--craie)}
.acte.vide{border-style:dashed;border-color:rgba(242,238,228,.14);cursor:default}
.acte.vide::after{display:none}

/* La fenêtre collective ouverte par quelqu'un d'autre. Elle appartient à toute
   la tribune : c'est la seule chose qu'un joueur voit arriver d'une main qui
   n'est pas la sienne, et elle doit donc se voir de loin. */
.appel{flex:none;margin:0 11px 5px;border-radius:8px;padding:7px 10px 6px;text-align:center;
  font-family:var(--banner);font-size:11.5px;letter-spacing:.12em;
  color:#0B0E13;background:linear-gradient(180deg,#8FE3B8,var(--vert));
  box-shadow:0 3px 0 #0D4F35;animation:appelBat .8s ease-in-out infinite}
.appel small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.02em;opacity:.88}
@keyframes appelBat{50%{transform:scale(1.025)}}

.mini{position:absolute;inset:0;background:rgba(5,7,10,.94);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:22px}
.mini.on{display:flex}
/* **La zone du mini-jeu a besoin d'une largeur.**

   Le duel la déclare — `#miniZone{width:min(100%,var(--colonne))}` — le Virage
   ne la déclarait pas. Ses pavés sont en `width:100%`, et cent pour cent d'une
   boîte qui se dimensionne sur son contenu est une boucle que le navigateur
   ferme au plus petit. Mesuré : la zone faisait 0 × 0 ici, contre 412 × 0 dans
   le duel — les deux pages étaient fautives, chacune à sa manière. */
#miniZone{width:min(100%,var(--colonne))}
.mini h3{font-family:var(--banner);font-size:22px;letter-spacing:.1em;margin:0;color:var(--c)}
/* La consigne du geste : la seule chose à lire avant de jouer, donc à 88 %. */
.mini p{margin:0;font-size:12px;opacity:.88}
/* Le pavé rond, son anneau et ses deux lignes de texte vivent dans ui.css :
   c'est le même composant que le duel et la salle de répétition dessinent, et
   il était écrit ici **sans `touch-action` ni `user-select`**. Voir la note de
   `.pad` dans la feuille commune. */
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--banner);
  font-size:84px;color:var(--c);pointer-events:none;animation:cd .55s ease-out}
@keyframes cd{from{opacity:0;transform:scale(1.5)}60%{opacity:1}to{opacity:0;transform:scale(.85)}}
.verdict{font-family:var(--banner);font-size:16px;letter-spacing:.12em;height:20px}

/* Opaque, et pas à 96 % : derrière le voile il y a l'en-tête du jeu, avec ses
   blasons vides et son « 0 – 0 » d'avant l'entrée. Quatre pour cent suffisaient
   à le laisser transparaître, et l'écran de choix paraissait sale.

   **Une tête fixe et une liste qui défile**, et non plus un bloc centré.
   Le voile centrait tout son contenu et laissait déborder ce qui dépassait :
   avec quarante rencontres en direct — depuis que la liste montre tout ce qui
   se joue et non plus les seuls clubs suivis — le titre et le champ de
   recherche sortaient **par le haut**, hors d'atteinte, puisqu'on ne peut pas
   remonter au-dessus du début d'une zone qui défile. L'écran s'ouvrait au
   milieu d'une liste de matchs turcs, sans rien dire de ce qu'on regardait.

   La tête réserve aussi la place des deux boutons flottants — retour et menu —
   qui vivent au-dessus d'elle. */
.veil{position:absolute;inset:0;background:#05070A;z-index:30;display:none;flex-direction:column;
  align-items:center;padding:0;text-align:center;overflow:hidden}
.veil.on{display:flex}
.veil .tete{flex:none;width:100%;max-width:380px;
  padding:calc(env(safe-area-inset-top) + 62px) 22px 10px}
.veil .liste{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:4px 22px calc(env(safe-area-inset-bottom) + 24px)}
.veil h1{font-family:var(--banner);font-size:24px;letter-spacing:.1em;margin:0}
/* L'écran de choix se lit en craie pleine : c'est la première chose qu'on
   voit en arrivant au Virage, et à 62 % sa phrase d'accueil décrochait au
   soleil (voir la feuille du fil, même raison). */
.veil p{font-size:12.5px;line-height:1.6;margin:10px auto 0;max-width:320px}
/* Le champ de recherche, comme sur la page des matchs et celle des
   compétitions : même geste, même promesse — une équipe, une compétition, ou
   un pays dans sa langue. */
.veil .rech{margin-top:12px}
.veil .rech input{width:100%;background:rgba(0,0,0,.4);border-radius:8px;
  border:1px solid rgba(242,238,228,.16);color:var(--craie);
  padding:10px 12px;font-size:14px;font-family:inherit}
.veil .rech input:focus{outline:none;border-color:var(--projo)}
.veil .vide{font-size:12px;padding:26px 10px;line-height:1.7}
.match{width:100%;max-width:340px;border:1px solid rgba(242,238,228,.16);border-radius:10px;
  background:rgba(0,0,0,.3);padding:12px;cursor:pointer;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}
/* Éteinte, et non effacée : « TERMINÉ » est justement ce que la ligne a à
   dire, et à 40 % d'opacité on ne le lisait pas.

   **Le texte ne s'éteint pas avec elle.** Un `brightness(.62)` sur la ligne
   entière assombrissait la craie comme une opacité de 62 % : le mot qu'on
   venait de sauver retombait sous le seuil de lecture, et les noms des clubs
   avec lui. Ce sont les blasons et le cadre qui s'éteignent ; le gris de la
   ligne suffit à dire qu'elle ne se joue plus, et « TERMINÉ » dit pourquoi. */
.match.off{filter:grayscale(1);pointer-events:none;border-color:rgba(242,238,228,.08);
  background:transparent}
.match.off img{opacity:.4}
/* Le match qu'on vient chercher par un lien. Il est amené sous les yeux et
   marqué : arriver depuis la fiche d'un match sur une liste de trente
   rencontres, sans rien qui désigne la sienne, se lit comme un menu et non
   comme une réponse. */
.match.vise{border-color:var(--projo);box-shadow:0 0 0 1px var(--projo),
  0 0 26px -6px rgba(245,195,59,.5)}
.match img{width:24px;height:24px;object-fit:contain}
.match .n{flex:1;min-width:0;text-align:left}
.match .n b{font-family:var(--banner);font-size:13px;display:block}
.match .n small{font-size:11px}
/* Deux sections dans l'écran de choix : chez soi, puis ailleurs. La seconde
   dit tout de suite ce qu'elle coûte — une règle qu'on découvre au classement
   est une règle qu'on prend pour un bug.

   Le titre est un titre cousu (`.tbf-cousu`, dans ui.css) : la page ne garde
   que sa place. Ce qu'il coûte s'écrit **sous** lui, dans `.rubrique-sous`, et
   non plus dedans : le fil du titre cousu court jusqu'au bout de la ligne, et
   une précision glissée à l'intérieur l'aurait coupé en deux. */
.rubrique{width:100%;max-width:340px;text-align:left;margin:14px 0 2px}
.rubrique-sous{width:100%;max-width:340px;text-align:left;font-size:11px;letter-spacing:.04em;
  margin:-2px 0 2px}
/* L'alerte « pas de direct » n'est pas une rubrique : c'est un avertissement,
   en rouge, avec sa porte de sortie. */
.rubrique.alerte{font-family:var(--banner);font-size:11px;letter-spacing:.14em;color:var(--flare)}
.rubrique.alerte small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  margin-top:3px;text-transform:none;color:var(--craie)}
.match.ailleurs{border-style:dashed}
/* Le choix du camp, déplié sous la carte. Demander après coup, une fois
   dedans, serait pire : on aurait déjà poussé du mauvais côté.

   Les deux clubs sont des plaques au ton flare — jouer — et la page ne garde
   que leur place : la question sur sa ligne, puis deux colonnes de même
   poids. En lettrage de plaque, la question et les deux clubs ne tiennent
   plus sur une seule ligne, et le second club passait seul en dessous. */
.camps{flex-basis:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding-top:10px;margin-top:2px;border-top:1px solid rgba(242,238,228,.12)}
.camps span{font-size:11px;flex:1 0 100%;text-align:left}
.camps button{flex:1;min-width:96px;padding:9px 8px 8px;overflow-wrap:anywhere}

.match .st{font-family:var(--banner);flex:none;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;letter-spacing:.08em}
/* Le score domine la minute : c'est lui qu'on cherche avant d'entrer. */
.match .st .sc{font-size:16px;line-height:1;color:var(--craie)}
/* **La minute en craie, le direct en point rouge.** Écrite en rouge à onze
   pixels, la minute tombait à 2,3:1 au soleil — le rouge du fumigène est une
   couleur de signal, pas d'écriture. Le point devant elle garde le signal :
   c'est le même qu'au fil du match, et il dit « ça se joue maintenant ». */
.match .st i{font-style:normal;font-size:11px;color:var(--craie);
  display:inline-flex;align-items:center;gap:4px}
.match .st i::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--flare)}
/* Le rouge du direct ne convient pas à ce qui est fini : c'est la couleur qui
   dit « ça se joue maintenant », et l'employer pour un coup de sifflet final
   ferait exactement le contresens qu'on vient de corriger. Le mot fini n'a
   donc pas de point. */
.match .st i.fini{color:var(--craie);letter-spacing:.1em;font-size:11px}
.match .st i.fini::before{display:none}
.err{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);z-index:18;
  background:rgba(224,64,44,.92);border-radius:6px;padding:9px 15px;font-size:12.5px;display:none}
.err.on{display:block}
/* La carte-souvenir passe même par-dessus le fil : c'est ce que le joueur est
   venu chercher, elle dure quatre secondes, et elle annonce un gain.
   **Elle laisse passer le doigt** : posée au milieu de la colonne, au-dessus
   de la fenêtre du geste, elle avalait les frappes au centre du pavé — qui ne
   les écoute que sur lui-même. Elle attend aussi la fin du geste pour se
   montrer (voir `apresLaFenetre`) ; ce jeton est la garde de second rang. */
.souvenir{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:96;
  pointer-events:none;
  border:2px solid var(--projo);border-radius:12px;background:#12161C;padding:20px 24px;text-align:center;
  display:none;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.souvenir.on{display:block;animation:pop .5s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.8)}}
/* « CARTE-SOUVENIR » en craie grasse : en or et en onze pixels, il ne
   tenait pas au soleil (arbitrage du 2 octobre 2026). Le cadre d'or, qui
   annonce un gain et ne porte pas de lettres, reste. */
.souvenir .t{font-family:var(--banner);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--craie)}

.souvenir .d{font-size:11.5px}

/* **Le mouvement part, l'information reste.** Sous `prefers-reduced-motion`
   comme sous le mode calme « animations » (voir ui.css), les battements
   décoratifs de l'écran s'arrêtent : le point du direct, le score qui luit,
   l'appel du capo qui bat, la secousse, l'éclair d'une entrée neuve. La
   couleur du score, le point rouge et le bandeau vert, eux, restent.

   En fin de feuille, et c'est nécessaire : ces règles ont le même poids que
   celles qui posent les animations, et seul l'ordre les départage. */
@media (prefers-reduced-motion:reduce){
  .fil .min::before,.fil.neuf,.score.surge,.appel,#app.quake{animation:none}
}

html[data-calme~="animations"] #app.quake{animation:none}

<script>
/* =======================================================================
   Grand Virage — client.
   Il n'évalue rien : il envoie les instants de frappe et affiche ce que le
   serveur renvoie. La corde arrive dix fois par seconde, agrégée pour toute
   la tribune.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
/* Le fil porte des noms de joueurs venus de l'API : ils passent par `esc`
   avant d'entrer dans la page. Même forme que sur les autres écrans. */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
/* Les vibrations se taisent sous le calme « vibrations » du tiroir, relu à
   chaque appel : le joueur peut le changer en pleine tribune. `FX.calme`
   répond quand fx.js est chargé ; sinon l'attribut de la racine, posé aussi
   par menu.js, dit la même chose. */
const buzz = (p) => {
  const calme = window.FX?.calme?.('vibrations')
    ?? (document.documentElement.dataset.calme ?? '').split(' ').includes('vibrations');
  if (calme) return;
  try { navigator.vibrate?.(p); } catch {}
};
/* Les noms, les aides et les couleurs des dix gestes viennent de `/geste.js`,
   avec leur déroulé. Ils étaient écrits ici **et** dans le duel : trois gestes,
   deux tables, et deux occasions de n'en corriger qu'une. */
const COLORS = window.TBF_GESTE.COULEUR;
const LABEL = window.TBF_GESTE.LABEL;
const HINT = window.TBF_GESTE.AIDE;
const GOAL_AT = 400;

let socket = null, S = null, busy = false;

/* ------------------------------------------- ce qui attend la fin du geste

   **Pendant un geste, rien ne couvre le pavé ni ne prend ses appuis.**

   La fenêtre du geste vit dans `#app`, qui est un contexte d'empilement
   (voir ETAT.md § 6) : tout calque posé sur `body` passe devant elle, quel
   que soit son `z-index`. Or un but — réel, ou de corde, qui naît des chants
   des autres pendant qu'on fait le sien — posait tout de suite la case
   « GOAL ! » (z 95, quinze secondes, un tiers du pavé et son centre), le
   flash et les titres de `FX.but`, la secousse de `#app` donc du pavé, et la
   carte-souvenir qui avalait les frappes au milieu. Le chant raté coûtait
   quand même son souffle, en pleine minute double (Gaël, 4 octobre 2026).

   Ce qui couvre ou fait bouger l'écran attend donc la fermeture de la
   fenêtre ; ce qui doit se savoir tout de suite reste immédiat — la tribune
   qui s'embrase, le score et le fil, la rumeur, la vibration. C'est la règle
   des cartes des autres, déjà mises de côté par `TBF_ACTION.suspendre`. */
const apresLeGeste = [];
function apresLaFenetre(f) {
  if (busy) apresLeGeste.push(f); else f();
}

/** Joue ce qui attendait, dans l'ordre d'arrivée. Deux moments de suite :
    `scene.moment` remplace le premier, et c'est le dernier qui reste. */
function viderApresLeGeste() {
  while (apresLeGeste.length) {
    const f = apresLeGeste.shift();
    /* Un effet qui lève n'emporte pas les suivants, et ne remonte pas dans
       le `finally` du geste qui vide la file. */
    try { f(); } catch (e) { console.error('[virage] effet différé :', e); }
  }
}

/** Un but tombé pendant le geste se sent tout de suite, et se montre après.
    Le motif est celui de `FX.but`, qui vibrera encore en se montrant : le
    premier dit qu'il s'est passé quelque chose, le second l'accompagne. */
function sentirLeBut(pour) {
  if (busy) buzz(pour ? [45, 55, 130] : 220);
}

// La part de ferveur d'un neutre. Le serveur la donne avec la liste des
// matchs ; cette valeur n'est qu'un repli pour le premier rendu.
let FERVEUR_NEUTRE = 0.5;
// La fête de niveau « depuis ta dernière visite » : une fois par visite (voir
// « virage:state »).
let feteDemandee = false;

/* **La rumeur de la tribune suit le match** (le moteur commun, `son.js`).
   Une seule commande, qu'on peut répéter sans rien déranger : 1 la rumeur
   pendant le match, 2 quand tout compte double (`S.surge`, que pose
   « virage:tick »), 0 au coup de sifflet final. Elle est rappelée chaque
   seconde, ce qui rattrape un moteur arrivé après le premier état — il est
   chargé par `fx.js`, en différé. Un niveau passager (une poussée, un but)
   court par-dessus sans être effacé. Sans moteur, sous le calme ou avant le
   premier toucher du joueur, rien ne joue : la tribune ne démarre jamais
   seule, et l'écran dit tout ce que le son dit. */
const FINS_DE_MATCH = ['FT', 'AET', 'PEN'];
function ambianceDuMatch() {
  if (!S) return;
  window.TBF_SON?.ambiance?.(FINS_DE_MATCH.includes(S.statut) ? 0 : S.surge ? 2 : 1);
}

/* ------------------------------------------------------------ affichage */

/* ----------------------------------------------- des nœuds qui durent

   **Un conteneur réécrit dix fois par seconde ne garde rien de vivant.**

   `render` passe à chaque message de corde et à chaque seconde, et réécrivait
   en `innerHTML` la rangée des cartes d'action, son bandeau d'explication, la
   foule et le rang. Chaque passage jetait donc les nœuds pour en poser des
   neufs, identiques à l'œil. Trois choses en mouraient sans bruit : les
   animations (fx.js fait respirer les dessins, et un dessin remplacé tous les
   dixièmes de seconde repart de zéro), l'appui et le focus (le lien « Changer
   mon deck » du bandeau était remplacé entre l'appui et le relâchement), et
   le réseau (un dessin absent se retire de lui-même, puis revenait à la vue
   suivante et se redemandait).

   Chaque élément est donc **créé une fois, retrouvé par sa clé, modifié en
   place**, et retiré seulement quand sa clé disparaît. Même rendu à l'écran —
   mêmes classes, mêmes attributs, même ordre — mais des nœuds qui restent.
   C'est le jumeau de ce que fait le duel : voir « des nœuds qui durent » dans
   duel-nvn.html, écrit de la même façon.

   La clé est une propriété du nœud (`_cle`) et non un attribut : elle ne se
   voit pas dans la page, et un nœud retiré par ailleurs emporte la sienne. */

/**
 * Accorde les enfants de `boite` à une liste de clés, dans cet ordre.
 *
 * `creer(cle, i)` fabrique le nœud d'une clé neuve ; `maj(el, cle, i)` le met
 * à jour en place, à chaque passage — il ne doit écrire que ce qui change.
 * Un nœud n'est déplacé que s'il n'est pas à sa place : déplacer un élément
 * lui fait perdre le focus, et c'est justement ce qu'on protège.
 */
function accorder(boite, cles, creer, maj) {
  const gardes = new Map();
  for (const el of [...boite.children]) {
    if (el._cle != null && cles.includes(el._cle) && !gardes.has(el._cle)) gardes.set(el._cle, el);
    else el.remove();
  }
  cles.forEach((cle, i) => {
    let el = gardes.get(cle);
    if (!el) { el = creer(cle, i); el._cle = cle; }
    maj(el, cle, i);
    if (boite.children[i] !== el) boite.insertBefore(el, boite.children[i] ?? null);
  });
}

/** Un nœud depuis son balisage : les gabarits de la page restent lisibles. */
function fabriquer(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/**
 * Des clés uniques pour une liste qui peut se répéter : un deck peut porter
 * deux fois la même carte, et la main les avoir ensemble.
 */
function clesDe(ids) {
  const vus = new Map();
  return ids.map((id) => {
    const n = vus.get(id) ?? 0;
    vus.set(id, n + 1);
    return `${id}#${n}`;
  });
}

/** N'écrit un texte que s'il a changé : réécrire le même texte recrée le nœud. */
function ecrire(el, texte) {
  const t = String(texte);
  if (el && el.textContent !== t) el.textContent = t;
}

/** Même règle pour les rares endroits qui posent du balisage : on retient ce
    qu'on a posé, et on ne le repose que s'il a changé. */
function poser(el, html) {
  if (el && el._html !== html) { el._html = html; el.innerHTML = html; }
}

/** « 12 AVEC TOI » : le chiffre change, la mention reste. */
function compteDeTribune(el, n, texte) {
  if (!el.firstElementChild) el.innerHTML = `<b></b> ${texte}`;
  ecrire(el.firstElementChild, n);
}

function renderStatic() {
  const f = S.fixture, mine = S.you.side;
  const me = mine === 0 ? { n:f.homeName, l:f.homeLogo } : { n:f.awayName, l:f.awayLogo };
  const foe = mine === 0 ? { n:f.awayName, l:f.awayLogo } : { n:f.homeName, l:f.homeLogo };
  $('clubMe').querySelector('b').textContent = me.n;
  $('clubMe').querySelector('img').src = me.l ?? '';
  $('clubFoe').querySelector('b').textContent = foe.n;
  $('clubFoe').querySelector('img').src = foe.l ?? '';

  renderChants();
}

/* La rangée des chants, à part : elle ne se redessine plus seulement à
   l'entrée. Le répertoire tourne toutes les dix minutes de match, et c'est le
   serveur qui l'annonce — voir `virage:repertoire`.

   Le nom affiché est `c.nom` et non `c.id` : la carte portait sa clé, et la
   tribune lisait « onetaitla ». */
function renderChants() {
  $('hand').innerHTML = S.cards.map((c) => `
    <div class="card" data-card="${c.id}" style="--c:${COLORS[c.gest]}">
      ${window.TBF_CHANT ? window.TBF_CHANT.illustration(c.id) : ''}
      <span class="c">${c.cost}</span><b>${c.nom ?? c.id}</b>
      <span class="g">${LABEL[c.gest]}</span><span class="p">${c.power}</span>
    </div>`).join('');
}

function render() {
  const mine = S.you.side;
  const h = $('rope').clientHeight;
  // La corde est stockée « côté extérieur positif » ; on la retourne pour que
  // pousser vers le haut veuille toujours dire pousser chez l'adversaire.
  const vers = mine === 0 ? -S.rope : S.rope;
  const pct = Math.max(-1, Math.min(1, vers / GOAL_AT));
  /* **Rien n'est réécrit en entier ici.** `render` passe à chaque message de
     corde — dix fois par seconde quand la tribune chante — et chaque ligne
     ci-dessous ne touche que le texte ou le style qui a changé. Réécrire un
     `innerHTML` à ce rythme recrée les nœuds, et plus rien ne peut vivre
     dedans : ni une animation, ni un focus. Voir `renderActes`. */
  $('knot').style.top = `${h / 2 - pct * (h / 2 - 38)}px`;
  ecrire($('knot'), Math.abs(Math.round(vers)));
  ecrire($('score'), `${S.goals[mine]} – ${S.goals[mine ^ 1]}`);
  // `score` sur le chiffre lui-même : c'est `.score.surge` qui le fait battre.
  const classeScore = S.surge ? 'score surge' : 'score';
  if ($('score').className !== classeScore) $('score').className = classeScore;
  // Deux formes, comme les étiquettes des clubs : voir `.score small`.
  ecrire($('phase').querySelector('.long'), S.surge ? 'TOUT COMPTE DOUBLE' : 'GRAND VIRAGE');
  ecrire($('phase').querySelector('.court'), S.surge ? 'TOUT ×2' : 'GRAND VIRAGE');
  compteDeTribune($('crowdMe'), S.crowd[mine], 'AVEC TOI');
  compteDeTribune($('crowdFoe'), S.crowd[mine ^ 1], 'EN FACE');
  // Le souffle affiché est celui du serveur **plus le regain écoulé depuis** :
  // la jauge monte donc en continu au lieu de sauter d'un chant à l'autre.
  const souffle = Math.round(souffleCourant());
  $('breathBar').style.width = `${souffle}%`;
  ecrire($('breathVal'), souffle);
  if (S.you.rank) {
    const r = $('rank');
    if (!r.firstChild) r.innerHTML = '<b><span></span><sup>e</sup></b><span></span>';
    ecrire(r.querySelector('b span'), S.you.rank);
    ecrire(r.lastChild, ` sur ${S.you.of} · ${S.you.ferveur} de ferveur`);
  }
  renderApports();
  for (const el of $('hand').children) {
    const c = S.cards.find((x) => x.id === el.dataset.card);
    el.classList.toggle('dim', souffle < c.cost || busy);
  }
  /* L'état de repos du personnage suit la minute double : il pousse tant
     qu'elle dure, il attend le reste du temps. `poserFond` ne coupe jamais une
     célébration en cours — c'est ce qui empêche la minute double d'effacer le
     but qui vient de l'ouvrir. */
  scene?.poserFond(S.surge ? 'pousse' : 'attente');
  renderActes();
  monterStade();
  eclairerStade();
}

/* ------------------------------------------------------- ce que je porte

   Deux pièces : la ligne, toujours à l'écran quand il y a quelque chose à
   dire, et le panneau, replié par défaut.

   **Le panneau ouvert ne se redessine pas à chaque tour d'horloge.** `render`
   passe très souvent — à chaque message de corde, donc plusieurs fois par
   seconde ; réécrire son `innerHTML` à ce rythme remplacerait les nœuds sous le
   doigt qui défile, et le panneau sauterait sans cesse. Il n'est donc monté
   qu'à l'ouverture et
   quand ce qu'on porte change vraiment — ce qui arrive à l'entrée, et à la pose
   ou à l'expiration d'un effet de carte.

   L'empreinte est la comparaison la plus simple qui soit juste ici : les deux
   objets viennent du serveur, ils sont petits, et `JSON.stringify` en donne une
   forme stable puisque l'ordre des clés est celui de la construction. Comparer
   les références ne servirait à rien — le socket en fabrique de neuves à chaque
   message. */
let apportsVus = null;

function renderApports() {
  const M = window.TBF_MODS;
  const ligne = $('apportsL'), panneau = $('apportsP');
  /* Sans `mods.js`, on ne montre rien plutôt que d'afficher des clés brutes.
     C'est un supplément d'information, pas une pièce du jeu : son absence ne
     doit pas se voir, et surtout pas lever au milieu d'un chant. */
  if (!M || !ligne || !panneau) return;

  const apports = S.you?.apports ?? [];
  const { plus, moins, texte } = M.resume(apports);

  if (!texte) {
    ligne.hidden = true;
    panneau.hidden = true;
    return;
  }
  ligne.hidden = false;

  const empreinte = JSON.stringify([apports, S.you?.mods ?? null]);
  if (empreinte !== apportsVus) {
    apportsVus = empreinte;
    ligne.innerHTML = '<span class="tbf-ap-n">Ce que tu portes</span>'
      + (plus ? `<span class="plus">${plus} bonus</span>` : '')
      + (moins ? `<span class="moins">${moins} malus</span>` : '')
      + '<span class="tbf-ap-fl" aria-hidden="true">⌄</span>';
    if (!panneau.hidden) panneau.innerHTML = M.panneauHTML(apports, S.you?.mods);
  }
}

$('apportsL').onclick = () => {
  const panneau = $('apportsP'), ligne = $('apportsL');
  const ouvre = panneau.hidden;
  if (ouvre) {
    panneau.innerHTML = window.TBF_MODS.panneauHTML(S.you?.apports ?? [], S.you?.mods);
  }
  panneau.hidden = !ouvre;
  ligne.setAttribute('aria-expanded', String(ouvre));
};

/* ------------------------------------------------------------- le fil

   Le serveur envoie des entrées **structurées** — un genre, un code, une
   minute — et jamais de phrase toute faite. Le français vit ici, dans la page,
   qui sait déjà dans quelle langue elle est. C'est la même règle que pour les
   codes d'erreur.

   Le vocabulaire des icônes est celui de la fiche de match dans /matchs : un
   même événement doit se lire pareil aux deux endroits. */

const ICONES = { Goal:'⚽', Card:'▮', subst:'⇄', Var:'▣', tribune:'✊' };
const PERIODES = {
  '1H':'COUP D’ENVOI', HT:'MI-TEMPS', '2H':'REPRISE', BT:'FIN DU TEMPS RÉGLEMENTAIRE',
  ET:'PROLONGATIONS', P:'TIRS AU BUT', FT:'COUP DE SIFFLET FINAL',
  AET:'FIN APRÈS PROLONGATIONS', PEN:'FIN AUX TIRS AU BUT',
};

/* Le détail vient de l'API, donc en anglais. Il était affiché tel quel :
   le fil annonçait « Goal » et « Red Card » au milieu d'une page en français.
   Ce qui n'est pas traduit passe quand même — un détail rare vaut mieux en
   anglais qu'effacé, parce qu'il dit encore quelque chose. */
const DETAILS = {
  'Normal Goal':'But', 'Own Goal':'Contre son camp', Penalty:'Sur penalty',
  'Missed Penalty':'Penalty manqué',
  'Yellow Card':'Carton jaune', 'Red Card':'Carton rouge',
  'Second Yellow card':'Deuxième jaune',
  'Goal cancelled':'But refusé', 'Penalty confirmed':'Penalty accordé',
  Goal:'But', Card:'Carton', subst:'Remplacement', Var:'Arbitrage vidéo',
};
/* « Substitution 1 », « Substitution 2 »… : le numéro ne dit rien au
   supporter, seul le geste compte. */
const ditDetail = (d) => DETAILS[d] ?? (/^Substitution/.test(d ?? '') ? 'Remplacement' : d);

/** Le libellé d'une entrée : ce qu'on lit, et le détail sous la ligne. */
function ditLeFil(e) {
  if (e.genre === 'periode') return { titre: PERIODES[e.type] ?? e.type, detail: '' };
  if (e.genre === 'tribune') {
    /* **Toi d'abord**, comme le bandeau et comme le score du terrain. La salle
       range ses buts par côté — domicile, extérieur — et le fil les recopiait
       tels quels : sous le titre « BUT DE TA TRIBUNE », on lisait « 0 – 4 »,
       c'est-à-dire son propre but écrit du côté de l'adversaire. */
    const moi = S?.you?.side ?? 0;
    const mien = e.side === moi;
    return { titre: mien ? 'BUT DE TA TRIBUNE' : 'LA CORDE A CÉDÉ',
             detail: `${e.goals?.[moi] ?? 0} – ${e.goals?.[moi ^ 1] ?? 0} à la corde` };
  }
  return { titre: e.joueur ?? ditDetail(e.detail ?? e.type),
           detail: [ditDetail(e.detail ?? e.type), e.passeur].filter(Boolean).join(' · ') };
}

/** L'icône, avec la couleur du carton — rouge et jaune ne se valent pas. */
function iconeDuFil(e) {
  if (e.genre === 'tribune') return `<span style="color:var(--projo)">✊</span>`;
  if (e.type === 'Card') {
    return `<span style="color:${/red/i.test(e.detail ?? '') ? 'var(--flare)' : 'var(--projo)'}">▮</span>`;
  }
  return ICONES[e.type] ?? '•';
}

const minuteDuFil = (e) =>
  e.minute == null ? '' : `${e.minute}${e.extra ? '+' + e.extra : ''}'`;

/** Le score du vrai match, du point de vue du joueur — comme partout ailleurs.
 *  Vide quand on ne le connaît pas : une donnée absente retire sa place, elle
 *  ne s'écrit pas « — ». Voir `renderFil` et `renderFeuille`. */
function scoreTerrain() {
  if (!S?.scoreReel) return '';
  const mine = S.you.side;
  return `${S.scoreReel[mine]} – ${S.scoreReel[mine ^ 1]}`;
}

/* ------------------------------------------------------ l'horloge du match

   Le serveur ne parle qu'au rythme du relevé — vingt secondes au mieux, et
   seulement quand quelque chose bouge. La minute restait donc figée sur celle
   de l'entrée, parfois pendant une demi-heure : le joueur poussait sur une
   corde en croyant le match arrêté.

   Elle défile donc **localement**, à partir de la dernière minute connue et du
   temps écoulé depuis. C'est exactement ce que fait la page des matchs, et
   c'est la seule façon d'avoir un chrono qui avance sans payer un appel par
   seconde. Chaque `virage:match` la remet à l'heure. */
/* L'horloge du match vit dans `/horloge.js`, partagée avec la page des
   matchs et la fiche d'un match. Elle était écrite trois fois, avec déjà
   trois listes de périodes différentes — celle-ci connaissait les tirs au
   but, celle des matchs non. Une horloge qui ne dit pas la même chose d'un
   écran à l'autre est pire qu'une horloge absente : elle fait douter des deux.

   Les deux fonctions restent ici, sous leurs noms : c'est par elles que la
   page — et ses contrôles — demandent l'heure. */

/** L'état de l'horloge : `{ n, extra, arret }`, ou `null` si on ne sait pas. */
function minuteCourante() {
  return window.TBF_HORLOGE.etat(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** « 71′ », « 45+3′ », « 90+′ » — ou rien quand on ne sait pas. */
function minuteTexte() {
  return window.TBF_HORLOGE.texte(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** Le souffle, animé entre deux vérités du serveur. Remis à l'heure par
    chaque message qui porte `breath` : l'état, le résultat d'un chant et
    `virage:vous`. Seul le résultat d'un chant le faisait : à l'entrée et
    après une carte, la jauge comptait le regain depuis le dernier chant, ou
    depuis le chargement de la page, et promettait un souffle qu'on n'avait
    pas. */
let souffleVuA = Date.now();

/* **Les recharges se décomptent ici, comme le souffle.**

   Le serveur les envoie en secondes restantes **au moment de l'envoi**, et la
   page ne les décomptait jamais : une carte reçue en recharge restait grisée,
   son chiffre figé. Quand toutes les cartes montrées l'étaient, plus aucune
   ne partait, donc plus aucun `virage:vous` n'arrivait — la main restait
   bloquée jusqu'au rechargement de la page, en une demi-minute de jeu (Gaël,
   4 octobre 2026). On retient l'instant de la vérité, et le `render` de
   chaque seconde rend la carte jouable d'elle-même à zéro. */
let cdVuA = Date.now();

/** Ce qui reste de la recharge d'une carte, en secondes ; zéro si elle est prête. */
function rechargeRestante(id) {
  const reste = Number(S?.you?.cooldowns?.[id]) || 0;
  return Math.max(0, reste - (Date.now() - cdVuA) / 1000);
}

function souffleCourant() {
  const you = S?.you;
  if (!you) return 0;
  if (!you.regen) return you.breath;
  const gagne = you.regen * ((Date.now() - souffleVuA) / 1000);
  return Math.min(you.breathMax ?? 100, you.breath + gagne);
}

/* Trois lettres pour un club : assez pour le reconnaître quand son nom est
   juste au-dessus, assez court pour tenir sous deux chiffres. Rien quand le
   nom manque : le sigle se retire au lieu de s'écrire « — ». */
const troisLettres = (nom) => String(nom ?? '')
  .replace(/[^A-Za-zÀ-ÿ]/g, '').slice(0, 3).toUpperCase();

function renderFil({ neuf = false } = {}) {
  if (!S) return;
  $('fil').hidden = false;
  /* Sans score connu, le bloc du terrain se retire en entier — le chiffre,
     « TERRAIN » et les sigles : un « TERRAIN » sous un tiret disait qu'il y
     avait quelque chose à lire, et il n'y avait rien. La minute et le dernier
     fait restent, ils ont leur propre source. */
  const score = scoreTerrain();
  $('filScore').textContent = score;
  $('filScore').parentElement.hidden = !score;

  /* Les deux camps sous le score, **dans l'ordre du score** : le sien à
     gauche, comme partout ailleurs dans le jeu. */
  const qui = $('filQui');
  if (qui) {
    /* Même source que l'entête — voir `renderStatic` : le camp 0 est la
       maison, et `S.fixture` porte les deux noms. Lire une seconde source
       ferait deux vérités, et c'est précisément ce que cette bande répare. */
    const fx = S.fixture;
    const me = { n: S.you.side === 0 ? fx?.homeName : fx?.awayName };
    const foe = { n: S.you.side === 0 ? fx?.awayName : fx?.homeName };
    const sigles = [['moi', troisLettres(me.n)], ['', troisLettres(foe.n)]];
    poser(qui, sigles.map(([classe, s]) =>
      (s ? `<i${classe ? ` class="${classe}"` : ''}>${esc(s)}</i>` : '')).join(''));
  }

  const min = minuteCourante();
  ecrire($('filMinute'), minuteTexte());
  $('filMinute').classList.toggle('arret', Boolean(min?.arret));

  const der = S.fil?.[S.fil.length - 1];
  poser($('filDer'), der
    ? `<span class="m">${minuteDuFil(der)}</span><span class="t">${iconeDuFil(der)}
       ${esc(ditLeFil(der).titre)}</span>`
    : `<span class="t"><small>Rien à signaler pour l’instant</small></span>`);

  if (neuf) {
    const b = $('fil');
    b.classList.remove('neuf'); void b.offsetWidth; b.classList.add('neuf');
  }
  if ($('feuille').classList.contains('on')) renderFeuille();
}

function renderFeuille() {
  // Le score et la minute, chacun seulement s'il est connu.
  $('feuilleScore').textContent = [scoreTerrain(), minuteTexte()].filter(Boolean).join(' · ');
  const fil = S?.fil ?? [];
  // Le plus récent en tête : on ouvre le fil pour savoir ce qu'on vient de
  // manquer, pas pour relire le coup d'envoi. Réécrite seulement quand le fil
  // a changé : la feuille ouverte se relit toutes les quinze secondes, et
  // c'est une liste qu'on fait défiler du doigt.
  poser($('feuilleCorps'), fil.length
    ? fil.slice().reverse().map((e) => {
      const { titre, detail } = ditLeFil(e);
      if (e.genre === 'periode') return `<div class="ev periode">${esc(titre)}</div>`;
      const droite = e.side === (S.you.side ^ 1);
      return `<div class="ev ${droite ? 'droite' : ''} ${e.genre === 'tribune' ? 'tribune' : ''}">
        <span class="min">${minuteDuFil(e)}</span>
        <span class="ic">${iconeDuFil(e)}</span>
        <span class="txt">${esc(titre)}${detail ? `<small>${esc(detail)}</small>` : ''}</span>
      </div>`;
    }).join('')
    : `<div class="vide">Rien n’est encore arrivé sur le terrain.<br>
        Les cartons et les remplacements arrivent pendant que tu es dans le virage.</div>`);
}

const ouvrirFeuille = (oui) => {
  $('feuille').classList.toggle('on', oui);
  if (oui) renderFeuille();
};

$('fil').addEventListener('click', () => ouvrirFeuille(true));
$('feuilleX').addEventListener('click', () => ouvrirFeuille(false));
// On peut toujours sortir : c'est la règle de tout plein écran de ce jeu.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ouvrirFeuille(false); });

/* ---------------------------------------------------------- le personnage

   Le Fanzzy équipé pousse avec le joueur, dans le bas de la tribune. Ce n'est
   pas un décor : il change de pose quand on chante, il exulte au but réel, il
   encaisse, il encaisse aussi la décision de l'arbitrage vidéo.

   C'est le même personnage que sur l'accueil, monté par le même module — un
   supporter qui réagirait autrement d'un écran à l'autre serait un autre
   supporter. Le bandeau du moment fort, lui, est posé dans la corde et non
   dans la boîte du personnage : « GOAL ! » doit tenir toute la largeur, et
   cette boîte n'occupe qu'un coin.                                          */

const scene = window.TBF_SCENE?.creer?.($('fzs'), {
  momentDans: $('rope'), fond: 'attente',
}) ?? null;

/**
 * La couleur d'un camp, telle qu'on peut l'écrire à l'écran.
 *
 * Elle vient du blason du club, extrait une fois côté serveur. Deux gardes,
 * et chacune répare une faute qu'on ne voit qu'en direct : un club dont le
 * blason n'a pas encore été lu n'a pas de couleur du tout — on garde alors
 * l'or du jeu — et un bleu marine de blason, écrit sur le noir de l'écran,
 * ne se lit pas : `FX.lisible` l'éclaircit sans lui changer de teinte.
 */
function couleurDuCamp(cote, defaut = 'var(--projo)') {
  const c = cote === S?.you?.side
    ? (S?.fixture?.[S.you.side ? 'awayColors' : 'homeColors'] ?? [])
    : (S?.fixture?.[S.you.side ? 'homeColors' : 'awayColors'] ?? []);
  return c[0] ? (window.FX?.lisible?.(c[0]) ?? c[0]) : defaut;
}

/** La minute du match à l'entrée dans la tribune, posée par « virage:state »
    et relevée par `minuteApprise`. Nulle tant qu'on ne la connaît pas : rien
    n'est alors écarté. */
let entreeMinute = null;
/** L'instant de cette entrée, à l'horloge de la page. */
let entreeA = Date.now();

/**
 * Ce qu'une minute reçue après l'entrée apprend de celle de l'entrée.
 *
 * L'état ne la dit pas toujours. Une salle qui ouvre sur une ligne de
 * calendrier jamais relevée — un match « ailleurs », écrit « NS » avant le
 * coup d'envoi — envoie une minute nulle, et rien n'était écarté : le premier
 * relevé, à la cinquantième, apportait le rouge de la vingtième et la vidéo
 * de la trentième, et le personnage jouait les deux. Une ligne vieillie,
 * restée à la dixième, laissait passer de même tout ce qui avait suivi.
 *
 * Or le match ne court pas plus vite que la montre : à la minute M, reçue Δ
 * minutes après l'entrée, on était entré à la minute M − Δ au moins. Ce
 * plancher ne fait que relever la minute de l'entrée, jamais la baisser ; la
 * mi-temps, un relevé en retard ou la minute d'un but ne donnent qu'un
 * plancher plus bas, donc rien. Δ est arrondi au-dessus : dans le doute, on
 * écarte moins. Et un match vraiment pas commencé donne un plancher nul ou
 * négatif — rien de ce qui suit le coup d'envoi n'est écarté, même quand le
 * premier relevé n'arrive qu'à la cinquième minute.
 */
function minuteApprise(minute) {
  const m = Number(minute);
  if (minute == null || !Number.isFinite(m)) return;
  const plancher = m - Math.ceil((Date.now() - entreeA) / 60_000);
  if (entreeMinute == null || plancher > entreeMinute) entreeMinute = plancher;
}

/** Une entrée du fil d'avant l'entrée du joueur — voir « virage:fil ». */
const dAvantLEntree = (e) => entreeMinute != null && e.genre !== 'periode'
  && (e.minute ?? 0) < entreeMinute - 2;

/**
 * Ce que le personnage fait d'une entrée du fil.
 *
 * Trois choses seulement l'arrêtent : l'arbitrage vidéo, un carton rouge et
 * le coup de sifflet final. Le reste passe dans la bande du fil — un
 * personnage qui réagit à tout ne réagit plus à rien, et le joueur cesse de
 * le regarder au bout de deux remplacements.
 */
function reagirAuFil(e) {
  if (!scene || !S?.you) return;
  const mien = e.side === S.you.side;

  if (e.type === 'Var') {
    /* Un but refusé après la célébration. Sans état de déception et sans un
       mot sur la cause, le score se corrige tout seul à l'écran et le joueur
       y voit un bug — c'est le retour qu'on a eu. */
    scene.moment('decision', mien ? 'BUT REFUSÉ' : 'LEUR BUT EST REFUSÉ', {
      couleur: mien ? 'var(--flare)' : 'var(--vert)',
      sous: ditDetail(e.detail ?? '') || 'Décision de l’arbitrage vidéo',
    });
    return;
  }

  if (e.type === 'Card' && /red/i.test(e.detail ?? '')) {
    scene.moment(mien ? 'decision' : 'progression',
      mien ? 'CARTON ROUGE' : 'ROUGE POUR EUX', {
        couleur: mien ? 'var(--flare)' : 'var(--vert)',
        sous: e.joueur ?? '',
      });
    return;
  }

  // Les périodes qui closent un match sont celles de l’horloge partagée :
  // une seconde liste ici finirait par oublier les tirs au but.
  if (e.genre === 'periode' && window.TBF_HORLOGE.FINIES.has(e.type)) {
    const nous = S.scoreReel?.[S.you.side] ?? 0;
    const eux = S.scoreReel?.[S.you.side ^ 1] ?? 0;
    const etat = nous > eux ? 'victoire' : nous < eux ? 'defaite' : 'neutre';
    scene.moment(etat, nous > eux ? 'VICTOIRE' : nous < eux ? 'DÉFAITE' : 'MATCH NUL', {
      couleur: nous > eux ? 'var(--vert)' : nous < eux ? 'var(--flare)' : 'var(--gris)',
      sous: PERIODES[e.type] ?? '',
    });
  }
}

function banner(t, ms = 1800) {
  const b = $('banner'); b.textContent = t; b.classList.add('on');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('on'), ms);
}
function float(txt, color) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.color = color;
  el.style.left = '58%'; el.style.top = '46%';
  $('rope').appendChild(el); setTimeout(() => el.remove(), 1200);
}
/**
 * Un mot bref au joueur, là où les refus s'affichent déjà.
 *
 * `fail` ne sait dire que des codes d'erreur connus ; le partage, lui, a des
 * choses à annoncer qui ne sont pas des fautes — « lien copié ». Les deux
 * passent par le même endroit de l'écran, sinon le joueur devrait apprendre
 * deux endroits où regarder.
 */
function mot(texte) {
  const e = $('err');
  e.textContent = texte;
  e.className = 'err on';
  clearTimeout(e._t); e._t = setTimeout(() => { e.className = 'err'; }, 2600);
}

function fail(code) {
  const e = $('err');
  e.textContent = ({
    'ferveur.error.not_enough_breath':'Pas assez de souffle',
    'ferveur.error.rate_limited':'Trop de chants d\u2019affilée',
    'ferveur.error.taps_too_fast':'Frappes trop rapprochées',
    'ferveur.error.inhuman_regularity':'Frappes trop régulières',
    'ferveur.error.not_your_match':'Aucun de tes clubs ne joue ce match',
    'ferveur.error.card_not_in_hand':'Cette carte n\u2019est plus dans ta main',
    'ferveur.error.card_on_cooldown':'Cette carte se recharge encore',
    'ferveur.error.card_not_in_virage':'Cette carte ne se joue qu\u2019en duel',
    'ferveur.error.condition_not_met':'Les conditions de cette carte ne sont pas réunies',
    'ferveur.error.evolution_locked':'L\u2019âge suivant de ton Fanzzy n\u2019est pas débloqué',
    'ferveur.error.not_in_virage':'Tu n\u2019es plus dans la tribune',
    'ferveur.error.chant_hors_repertoire':'Ce chant n\u2019est plus au r\u00e9pertoire',
    /* La porte fermée. Elle n’a plus de raison d’arriver depuis que la salle
       se sème depuis la journée (voir `poserDepuisLaJournee`), mais si elle
       arrive, « Refusé par le serveur » ne dit rien à personne — et c’est
       exactement ce qu’a lu le joueur qui a cru que le bouton ne marchait pas. */
    'ferveur.error.no_fixture':'Ce match n’est pas ouvert pour l’instant',

    /* **Les six refus que la page ne savait pas nommer.**
     *
     * Le serveur en lève seize ; cette table en connaissait dix. Les six
     * autres tombaient sur le repli, et le joueur lisait « Refusé par le
     * serveur » — la phrase dont le commentaire ci-dessus dit qu'elle « ne
     * dit rien à personne ». Elle le disait encore, six fois.
     *
     * Quatre d'entre eux viennent du contrôle anti-triche des gestes : ils
     * parlent de la **manière de taper**, pas de la carte, et c'est
     * précisément ce qu'un joueur ne peut pas deviner. Les deux derniers
     * sont des désaccords entre la page et le serveur — une page pas
     * rechargée après un déploiement — et ils doivent dire de recharger. */
    'ferveur.error.bad_taps':'Ce geste n’a pas été enregistré — recommence',
    'ferveur.error.too_many_taps':'Trop de frappes pour ce geste',
    'ferveur.error.tap_out_of_window':'Des frappes sont tombées hors du temps imparti',
    'ferveur.error.unknown_gesture':'Ce geste est inconnu du serveur — recharge la page',
    'ferveur.error.unknown_effect':'Cette carte est inconnue du serveur — recharge la page',
    'ferveur.error.unknown_card':'Cette carte n’existe plus — recharge la page',

    /* **Les deux refus qui ne viennent pas du jeu.** Le premier arrive quand la
       session a expiré pendant qu'on poussait — le plus déroutant de tous, car
       rien à l'écran n'a changé et tout est soudain refusé. Le second est le
       refus générique du serveur, celui qu'il rend quand quelque chose a cassé
       chez lui : le joueur n'y peut rien, mais il a droit à savoir que ce n'est
       pas son geste qui était mauvais. */
    'auth.error.unauthenticated':'Ta session a expiré — reconnecte-toi',
    'ferveur.error.server':'Le serveur n’a pas pu traiter ça — réessaie',
  })[code] ?? familleDuRefus(code) ?? 'Refusé par le serveur';
  e.className = 'err on';
  clearTimeout(e._t); e._t = setTimeout(() => { e.className = 'err'; }, 2600);
}

/**
 * Ce qu'on dit d'un refus d'épreuve que la table ne nomme pas un par un.
 *
 * ## Dix-sept refus tombaient sur le repli
 *
 * Le contrôle anti-triche des quatorze mini-jeux — `Triche` dans
 * `epreuves.js` — lève des codes en `ferveur.error.<quoi>.<pourquoi>` :
 * `trace.trop_longue`, `reponse.trop_reguliere`, `lancer.trop_rapide`… La table
 * du dessus n'en connaissait aucun, et le joueur lisait « Refusé par le
 * serveur » — la phrase dont le commentaire d'à côté dit qu'elle « ne dit rien
 * à personne ». Elle le disait dix-sept fois de plus.
 *
 * Et ce sont les pires à ne pas nommer : ils parlent de **la manière de faire
 * le geste**, jamais de la carte. Quelqu'un dont le tracé part trop vite n'a
 * aucun moyen de deviner ce qu'on lui reproche, donc aucun moyen de corriger —
 * il conclut que l'épreuve est cassée, et il a raison de le croire.
 *
 * ## Pourquoi des familles et non dix-sept lignes de plus
 *
 * Parce que dix-sept lignes écrites à la main redeviendraient dix-sept lignes
 * incomplètes à la prochaine épreuve ajoutée — c'est très exactement ce qui
