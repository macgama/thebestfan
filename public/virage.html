   l'interrompt — rien ne couvre le pavé — et sa fermeture le reprend. */
const RANG_DES_MOMENTS = { jeu: 0, match: 1, but: 2 };
const ENTRE_DEUX_MOMENTS = 3500;
const momentsEnAttente = [];
let defile = null;

/**
 * Joue `f` tout de suite, ou à la fermeture du geste en cours.
 *
 * `moment` : ce que `f` montre sur la scène — `'jeu'` (la corde),
 * `'match'` (le fil du vrai match), `'but'` (un but réel). Un moment attend
 * aussi la fin d'un défilé en cours, et prend son rang dans la file. Un
 * effet de moment qui rend `false` n'avait rien à montrer : il ne prend pas
 * de place dans le défilé.
 */
function apresLaFenetre(f, { moment = null } = {}) {
  if (!moment) {
    if (busy) apresLeGeste.push(f); else jouerEffet(f);
    return;
  }
  if (!busy && !defile) { jouerEffet(f); return; }
  const i = momentsEnAttente.findIndex((x) => RANG_DES_MOMENTS[x.moment] > RANG_DES_MOMENTS[moment]);
  momentsEnAttente.splice(i < 0 ? momentsEnAttente.length : i, 0, { f, moment });
}

/** Un effet qui lève n'emporte pas les suivants, ni le geste qui vide la file. */
function jouerEffet(f) {
  try { return f(); } catch (e) { console.error('[virage] effet différé :', e); return false; }
}

/** Joue ce qui attendait la fermeture : les effets tout de suite, puis les moments. */
function viderApresLeGeste() {
  for (const f of apresLeGeste.splice(0)) jouerEffet(f);
  if (!defile) defiler();
}

/** Montre le moment suivant, et programme celui d'après. */
function defiler() {
  defile = null;
  if (busy) return;                    // la fermeture du geste reprendra
  while (momentsEnAttente.length) {
    const { f } = momentsEnAttente.shift();
    if (jouerEffet(f) === false) continue;
    if (momentsEnAttente.length) { defile = setTimeout(defiler, ENTRE_DEUX_MOMENTS); return; }
  }
  /* Le dernier moment est à l'écran : la carte-souvenir qui attendait vient
     maintenant, avec lui — c'est celle du but, qui passe en dernier. */
  annoncerSouvenir();
}

/** Un but tombé pendant le geste se sent tout de suite, et se montre après.
    Le motif est celui de `FX.but`, qui vibrera encore en se montrant : le
    premier dit qu'il s'est passé quelque chose, le second l'accompagne. */
function sentirLeBut(pour) {
  if (busy) buzz(pour ? [45, 55, 130] : 220);
}

$('hand').addEventListener('pointerdown', async (e) => {
  const el = e.target.closest('[data-card]');
  /* Une sortie en cours — le bilan demandé, ou posé — : on n'ouvre pas un
     geste que le joueur ne finira pas. Le bilan l'aurait couvert, et son
     chant serait parti après `virage:leave`. */
  if (!el || busy || !S || P.sortie) return;
  if (P.parti) { mot('Le match est fini, la tribune se vide'); return; }
  const card = S.cards.find((c) => c.id === el.dataset.card);
  /* La carte peut avoir disparu de la main : le répertoire tourne. */
  if (!card) return;
  if (souffleCourant() < card.cost) {
    window.FX?.refus?.(el);
    return fail('ferveur.error.not_enough_breath');
  }
  busy = true;
  const cle = el._cle;
  P.carteEnJeu = cle;
  el.dataset.etat = 'touchee';
  render();
  let joue = false;
  try {
    const taps = await openMini(card);
    if (taps) {
      const reponse = attendreReponse();
      socket.emit('virage:chant', { cardId: card.id, taps });
      joue = true;
      await window.TBF_GESTE.attendre?.(reponse, { zone: $('miniZone'), carte: () => carteDeCle(cle) });
    } else fail('ferveur.error.bad_taps');
  } finally {
    /* **Dans un `finally`** : `busy` resté vrai éteindrait la main pour le
       reste du match. La carte jouée se décolle, puis reprend sa place. */
    closeMini();
    busy = false;
    P.carteEnJeu = null;
    const c = carteDeCle(cle);
    if (c && joue) {
      P.carteJouee = cle;
      c.dataset.etat = 'jouee';
      setTimeout(() => { if (P.carteJouee === cle) { P.carteJouee = null; render(); } }, 650);
    }
    render();
    /* Ce qui est arrivé pendant le geste se montre maintenant — **après** le
       `render` de fermeture, comme la copie d'urgence du 4 octobre 2026 :
       la case et la pose que demande un but en attente sont alors les
       dernières, et rien de ce que la fermeture remet en place (la pose de
       fond, la carte jouée) ne passe devant la célébration. */
    viderApresLeGeste();
  }
});

/* ----------------------------------------------------- le stade

   Le terrain au milieu, les deux tribunes sur les côtés. La tribune de
   gauche est celle de **domicile** — le stade appartient à la rencontre, pas
   au joueur —, et ses lumières suivent la corde. */

let stade = null;

function monterStade() {
  if (stade || !S?.stade || !window.TBF_STADE) return;
  const lisible = (c, d) => (c ? (window.FX?.lisible?.(c) ?? c) : d);
  stade = window.TBF_STADE.monter($('stade'), {
    id: S.stade.id,
    couleurs: [
      lisible((S.fixture?.homeColors ?? [])[0], 'var(--projo)'),
      lisible((S.fixture?.awayColors ?? [])[0], 'var(--bleu)'),
    ],
  });
}

/** L'intensité de chaque tribune, d'après la corde. */
function eclairerStade() {
  if (!stade) return;
  const part = Math.max(-1, Math.min(1, (S?.rope ?? 0) / GOAL_AT));
  stade.intensite(0, Math.max(0, -part));   // domicile : corde négative
  stade.intensite(1, Math.max(0, part));    // extérieur : corde positive
}

/* ------------------------------------------------- les cartes d'action

   Le Virage ne joue que les cartes qui agissent sur soi ou sur sa tribune ;
   le serveur envoie son propre catalogue dans `S.actions`. La rangée passe
   par `accorder` : une case par place de la main, la carte retrouvée par son
   identifiant, la case vide par sa position.

   **Les cartes restées au duel** se disent sur les cases vides que le deck
   ne remplira jamais (« DUEL SEULEMENT », voir `renderActes`) ; le lien
   vers le deck est dans le panneau de ce qu'on porte.
   **La recharge** est un scotch qui se retire : sa hauteur est la part du
   délai qui reste, sur le plus long délai vu pour cette carte — le serveur
   sert ce qui reste, pas la durée. */

/** La carte du catalogue, par identifiant. */
const acteDe = (id) => (S?.actions ?? []).find((a) => a.id === id);

function renderActes() {
  const boite = $('actes');
  const main = S?.you?.main ?? [];
  /* Pas de deck, pas de rangée : une rangée de cases vides n'apprendrait à
     qui n'a jamais construit de deck que ce qui lui manque. */
  if (!main.length) { boite.hidden = true; return; }
  boite.hidden = false;

  const souffle = souffleCourant();
  const places = Array.from({ length: S.you.mainVisible ?? 5 }, (_, i) => main[i] ?? null);
  /* **« DUEL SEULEMENT » ne se pose que sur une case qui le restera.**
     Il se posait sur autant de cases vides qu'il y a de cartes restées au
     duel : or une case vide est presque toujours **la carte suivante, pas
     encore tirée** (deux secondes et demie après chaque carte jouée), et le
     sticker en donnait une fausse explication — trois cartes au duel, et
     chaque carte jouée laissait une case « DUEL SEULEMENT » jusqu'au
     tirage. Une case ne reste vide pour de bon que si le deck n'a pas assez
     de cartes jouables ici pour remplir la main : le deck en compte dix
     (`validerDeck`), dont `ecartees` restent au duel. Les dernières cases,
     puisque la main se remplit par le début : la première case vide est
     celle où la carte tirée arrive. */
  const mainVisible = places.length;
  const jouables = TAILLE_DU_DECK - (S?.you?.ecartees ?? 0);
  const pourDeBon = Math.max(0, Math.min(mainVisible, mainVisible - jouables));
  accorder(boite, clesDe(places.map((id, i) => id ?? `vide@${i}`)),
    (_cle, i) => {
      const id = places[i];
      if (!id) return fabriquer('<div class="acte tbf-carte tbf-carte--action" data-etat="vide"></div>');
      return fabriquer(`<div class="acte tbf-carte tbf-carte--action" role="button" tabindex="0">
        <svg class="sceau" viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
        ${window.TBF_ACTION.illustration(id)}
        <b class="tbf-carte-nom"></b>
        <span class="co tbf-sticker tbf-sticker--rond tbf-carte-cout"></span>
        <span class="tbf-carte-recharge"><b></b></span>
        <span class="tbf-sticker tbf-carte-manque" data-ton="flare"></span>
      </div>`);
    },
    (el, _cle, i) => {
      const id = places[i];
      if (!id) {
        /* Les cases que le deck ne remplira jamais : voir plus haut. */
        const dit = i >= mainVisible - pourDeBon;
        const s = el.firstElementChild;
        if (dit && !s) el.appendChild(fabriquer('<span class="tbf-sticker">DUEL SEULEMENT</span>'));
        else if (!dit && s) s.remove();
        return;
      }
      const a = acteDe(id);
      const fam = window.TBF_ACTION.famDe(a);
      if (el.dataset.acte !== id) el.dataset.acte = id;
      poserAttr(el, 'data-rar', a?.rar ?? null);
      poserVar(el, '--fc', fam.c);
      const trace = el.querySelector('.sceau path');
      if (trace.getAttribute('d') !== fam.ico) trace.setAttribute('d', fam.ico);
      ecrire(el.querySelector('.tbf-carte-nom'), a?.nom ?? id);
      ecrire(el.querySelector('.co'), a?.cost ?? '');
      /* La recharge : ce qui reste, sur le plus long délai vu. Décomptée
         depuis la dernière vérité : voir `rechargeRestante`. */
      const reste = rechargeRestante(id);
      const vu = P.recharges[id] ?? 0;
      if (reste > vu) P.recharges[id] = reste;
      if (!reste) delete P.recharges[id];
      const plein = P.recharges[id] ?? reste;
      const r = el.querySelector('.tbf-carte-recharge');
      poserVar(r, '--h', reste ? `${Math.round(reste / plein * 100)}%` : '0%');
      ecrire(r.firstElementChild, reste ? Math.ceil(reste) : '');
      // Trop cher : la croix sur le dessin, et ce qui manque.
      const manque = a ? Math.ceil(a.cost - souffle) : 0;
      poserAttr(el, 'data-etat', manque > 0 ? 'injouable' : null);
      ecrire(el.querySelector('.tbf-carte-manque'), manque > 0 ? `−${manque}` : '');
      poserAttr(el, 'aria-label', `${a?.nom ?? id}, coûte ${a?.cost ?? '?'}${reste ? `, se recharge encore ${Math.ceil(reste)} secondes` : ''}`);
    });
}

/**
 * La fenêtre collective, quand elle est ouverte : un ticket posé sur le bas
 * de l'arène, le temps de la fenêtre. C'est la seule information du Virage
 * qui vienne de la main de quelqu'un d'autre.
 */
function renderAppel() {
  const mien = S?.you?.side;
  const f = (S?.rally ?? []).find((r) => r.side === mien && r.reste > 0);
  const el = $('appel');
  if (!f) { el.hidden = true; return; }
  const [titre, sous] = el.children;
  ecrire(titre, f.sync ? 'TOUS ENSEMBLE' : 'CHANTE MAINTENANT');
  ecrire(sous, f.sync ? 'tout le monde en même temps' : 'le capo a appelé : ta poussée compte plus');
  if (el.hidden) { el.hidden = false; rejouer(el, 'tbf-colle'); }
  /* La minuterie est nulée en même temps qu'elle est armée : `clearTimeout`
     laisse un identifiant vrai derrière lui. */
  clearTimeout(el._t); el._t = null;
  el._t = setTimeout(() => { el.hidden = true; el._t = null; }, f.reste);
}

function jouerActe(el) {
  if (!el || busy || !S || P.parti || P.sortie) return;
  if (el.dataset.etat === 'vide') return;
  const a = acteDe(el.dataset.acte);
  if (!a) return;
  if (souffleCourant() < a.cost) { window.FX?.refus?.(el); return fail('ferveur.error.not_enough_breath'); }
  /* Décomptée, et pas lue telle que le serveur l'a envoyée : sans quoi le
     refus durait jusqu'au message suivant, qui ne venait jamais — voir
     `rechargeRestante`. */
  if (rechargeRestante(a.id) > 0) return fail('ferveur.error.card_on_cooldown');
  /* On envoie et on attend le serveur : l'animation part sur l'événement
     qu'il renvoie, pas sur le clic. */
  socket.emit('virage:jouer', { cardId: a.id });
}
$('actes').addEventListener('pointerdown', (e) => jouerActe(e.target.closest('[data-acte]')));
$('actes').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jouerActe(e.target.closest('[data-acte]')); }
});

/**
 * Ce que la salle voit quand une carte part — la sienne comme celle d'un
 * voisin : une carte collective dont personne ne sait d'où elle vient se lit
 * comme un bug.
 */
function raconterActe(ev) {
  const mien = S?.you?.side;
  for (const e of ev) {
    const pour = e.side === mien;
    switch (e.t) {
      case 'action': {
        stade?.pulse(e.side);
        const a = acteDe(e.cardId);
        const n = $('knot').getBoundingClientRect();
        window.TBF_ACTION.jouee(a, { pour,
          vers: { x: n.left + n.width / 2, y: n.top + n.height / 2 } });
        break;
      }
      case 'rally':
      case 'sync':
        pousser(pour ? 'moi' : 'eux');
        if (pour) {
          S.rally = [...(S.rally ?? []), { side: e.side, reste: e.duree,
            sync: e.t === 'sync' }];
          renderAppel();
        }
        window.FX?.son?.(pour ? 'parfait' : 'tic');
        break;
      case 'effect':
        if (e.type === 'team_breath' && pour) float(`+${e.valeur} à la tribune`, 'var(--vert)');
        break;
      default: break;
    }
  }
}

/* --------------------------------------------- la carte-souvenir

   **Elle ne s'annonce que sur `virage:souvenir`** — servi aux seules
   sockets de ceux qui l'ont reçue (CONTRATS.md, § 16.3). La page
   l'annonçait à chaque but de son club, même quand la compétition n'est pas
   couverte ou qu'on n'avait pas poussé dans la fenêtre : « elle est dans ton
   carnet » était alors faux. Elle se retourne au centre, puis glisse vers
   la pile du coin. Un geste ouvert la fait attendre : elle ne couvre pas un
   pavé qu'on frappe. */
const souvenirsEnAttente = [];
/** Ce qui ramène une carte rangée pendant un geste : le temps qui lui
    restait au centre, et si son tampon a déjà claqué. */
const retoursDeSouvenir = new WeakMap();
/** La carte à l'écran : la carte, l'instant (`performance.now`) où elle part
    vers la pile, son tampon, ses minuteries. Nulle quand il n'y en a pas. */
let souvenirAffiche = null;

/** La carte quitte l'écran, et son glissement avec elle : il finit en
    `fill: 'forwards'`, et laissé en place il poserait la suivante là où
    celle-ci s'est éteinte. */
function cacherSouvenir() {
  const el = $('souvenir');
  for (const a of el.getAnimations?.() ?? []) a.cancel();
  el.hidden = true;
  poserAttr(el, 'data-etat', null);
}

/**
 * Un geste s'ouvre sur une carte-souvenir encore au centre : elle se range,
 * et revient à la fermeture pour le temps qui lui restait.
 *
 * Celle qui arrive pendant le geste attend déjà sa fin (`annoncerSouvenir`
 * lit `busy`). Celle qui était là avant restait : posée sur le document au
 * calque 96, à 40 % de la hauteur, au-dessus de la fenêtre du geste, elle
 * cachait le centre du pavé jusqu'à son départ vers la pile. Le cas n'a rien
 * de rare — elle paraît peu après un but de son club, en pleine minute
 * double, et c'est le moment où l'on relance un chant. Le doigt passait
 * (`pointer-events: none`, dans la pièce), mais le pavé était caché.
 *
 * Elle n'est pas coupée comme la case du moment : elle annonce un gain, et
 * le joueur l'a souvent à peine vue. Elle revient **déjà retournée**, pour ce
 * qui lui restait au centre — rejouée en entier, retournement compris, elle
 * se prendrait pour une seconde carte, la méprise de la carte jouée qui
 * revenait (action-art.js). Moins d'une seconde de reste : elle a été lue,
 * elle va droit à la pile. En plein glissement, elle y est déjà.
 */
function rangerLeSouvenir() {
  const vu = souvenirAffiche;
  if (!vu || $('souvenir').hidden) return;
  souvenirAffiche = null;
  vu.minuteries.forEach(clearTimeout);
  cancelAnimationFrame(vu.image);
  cacherSouvenir();
  if (vu.posee) return;
  const reste = vu.pileA - performance.now();
  if (reste >= 1000) {
    retoursDeSouvenir.set(vu.s, { reste, clac: vu.clac });
    souvenirsEnAttente.unshift(vu.s);
    return;
  }
  P.souvenirs.push(vu.s);
  if (P.souvenirEnVue === vu.s) P.souvenirEnVue = null;
  renderPile();
}

function annoncerSouvenir() {
  /* Ni pendant un geste, ni pendant un défilé de moments : elle vient avec
     le dernier, qui est le but dont elle est le souvenir (`defiler`). */
  if (busy || defile || !souvenirsEnAttente.length) return;
  const el = $('souvenir');
  if (!el.hidden) return;   // une carte à la fois : la suivante attend la fin du glissement
  const s = souvenirsEnAttente.shift();
  // Rangée pendant un geste ? Elle revient retournée, pour son reste.
  const retour = retoursDeSouvenir.get(s);
  retoursDeSouvenir.delete(s);
  P.souvenirEnVue = s;
  /* Le buteur vient de l'API sportive : en texte, jamais en balisage. Sans
     buteur ni minute, leur ligne ne se pose pas (§ 16.3 : l'un et l'autre
     peuvent manquer) — pas de « BUT » inventé à la place d'un nom. */
  const [nom, minute] = [el.querySelector('.tbf-souvenir-face > b'), el.querySelector('.tbf-souvenir-face > i')];
  nom.textContent = s.joueur ?? '';
  nom.hidden = !s.joueur;
  minute.textContent = s.minute != null ? `${s.minute}′` : '';
  minute.hidden = s.minute == null;
  /* La face porte mon écharpe : la carte vit hors de la colonne, où sont
     posées les couleurs du club, et les reçoit donc elle-même. */
  const [e1, e2] = couleursDe(S?.you?.side ?? 0);
  poserVar(el, '--e1', e1); poserVar(el, '--e2', e2);
  el.setAttribute('aria-label', `Carte-souvenir${s.joueur ? ` : ${s.joueur}` : ''}${s.minute != null ? `, ${s.minute}e minute` : ''}. Elle est dans ton carnet.`);
  /* Revenue après un geste, elle est déjà retournée : posé dans la même
     image que son apparition, `data-etat` la montre de face d'emblée. */
  poserAttr(el, 'data-etat', retour ? 'face' : null);
  el.hidden = false;
  reglerCase();
  const doux = matchMedia('(prefers-reduced-motion: reduce)').matches
    || (document.documentElement.dataset.calme ?? '').split(' ').includes('animations');
  const vu = { s, clac: Boolean(retour?.clac), posee: false, pileA: Infinity,
    minuteries: [], image: 0 };
  souvenirAffiche = vu;
  const plusTard = (f, ms) => { vu.minuteries.push(setTimeout(f, ms)); };
  const vers = () => {
    const pile = $('pile');
    if (!pile.hidden && !doux) {
      const a = el.getBoundingClientRect(), b = pile.getBoundingClientRect();
      /* `fill: 'forwards'`, comme la carte jouée (action-art.js) : une
         minuterie en retard sur la fin du glissement laissait la carte
         reprendre sa place au centre, en grand, le temps d'une image. */
      el.animate([{ transform: 'none', opacity: 1 },
        { transform: `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px,${
          b.top + b.height / 2 - (a.top + a.height / 2)}px) scale(.25)`, opacity: .4 }],
      { duration: 520, easing: 'cubic-bezier(.5,0,.7,.4)', fill: 'forwards' });
    }
    plusTard(() => {
      if (souvenirAffiche === vu) souvenirAffiche = null;
      cacherSouvenir();
      annoncerSouvenir();
    }, doux ? 0 : 500);
  };
  /* Face visible : le tampon claque (s'il ne l'a pas déjà fait avant d'être
     rangée), et la carte part vers la pile `ms` plus tard. */
  const deFace = (ms, clacDans) => {
    if (!vu.clac) plusTard(() => { vu.clac = true; window.FX?.son?.('bache'); }, clacDans);
    vu.pileA = performance.now() + ms;
    // La pile la reçoit au moment où elle s'y pose.
    plusTard(() => {
      vu.posee = true;
      P.souvenirs.push(s);
      if (P.souvenirEnVue === s) P.souvenirEnVue = null;
      renderPile(); vers();
    }, ms);
  };
  if (retour) { deFace(retour.reste, 0); return; }
  /* Elle paraît de dos, puis se retourne une image plus tard : posé dans la
     même image que son apparition, `data-etat` la montrerait déjà de face.
     Le tampon claque quand la face arrive (le demi-tour dure une demi-
     seconde). Au calme, elle paraît retournée (la pièce coupe la
     transition), et le clac tombe tout de suite. */
  vu.pileA = performance.now() + (doux ? 2600 : 2400);
  vu.image = requestAnimationFrame(() => {
    vu.image = requestAnimationFrame(() => {
      vu.image = 0;
      poserAttr(el, 'data-etat', 'face');
      deFace(doux ? 2600 : 2400, doux ? 0 : 420);
    });
  });
}

/* ------------------------------------------------ les amis dans la tribune

   « 2 AMIS ICI » : les amis mutuels présents dans la salle, poussés à
   l'entrée (`virage:amis`) puis un par un (`virage:ami`). Rien ne vient
   tant que la présence est éteinte, et rien ne s'affiche alors. Le pseudo
   est un texte. */
function renderAmis() {
  const el = $('amisIci');
  const n = P.amis.size;
  el.hidden = !n;
  if (!n) return;
  ecrire(el, `${n} AMI${n > 1 ? 'S' : ''} ICI`);
  const noms = [...P.amis.values()].map((a) => String(a.pseudo ?? '')).filter(Boolean);
  poserAttr(el, 'title', noms.join(', '));
  poserAttr(el, 'aria-label', `${noms.join(', ') || n} dans cette tribune`);
}

/* ------------------------------------------------------- le bilan de tribune

   **La sortie passe par le bilan, si l'on a poussé pendant ce match**
   (QUESTIONS Q10, la recommandation suivie). À la flèche ou au menu, la page
   demande `virage:bilan` et pose la page kraft — rang, ferveur, chants,
   PARFAITS, meilleure série, meilleur geste, souvenirs, l'XP versée — avec
   RESTER et SORTIR. Sans poussée, on sort sans rien demander : une
   confirmation qui ne dit rien apprend à passer outre.

   **Au coup de sifflet final** (`virage:fin`, ou un état au statut final),
   la page demande son bilan après un délai tiré entre 0 et 8 s — mille
   bilans au même instant seraient mille lectures —, le pose sans qu'on
   touche rien, puis quitte la salle et n'y rentre plus (`coupDeSifflet`).
   Le bilan devient alors **le rituel de sortie du duel** : la case de BD du
   score final (VICTOIRE, DÉFAITE, MATCH NUL) et le Fanzzy en pose au-dessus
   de la feuille. Et **RESTER n'a plus de sens** — la page a quitté la salle,
   la corde ne bouge plus, et RESTER y ramenait pour que la flèche repose le
   même bilan, une boucle sans issue : il devient « UN AUTRE MATCH » (flare),
   qui rend le voile de choix, et SORTIR passe au parpaing.

   **Le rang ouvre la feuille, en grand** : c'est le chiffre du match, et le
   HUD le disait déjà à une place près (« 12ᵉ → TOP 10 »). Avec le palier
   que le HUD a servi, la feuille dit ce qui reste à gagner (« À 1 PLACE DU
   TOP 10 », voir `palierDuBilan`).

   **Sans bilan servi** (un serveur d'avant, le réseau) : au-delà de trois
   secondes, la sortie reste celle d'avant — la boîte « QUITTER LA TRIBUNE ? »
   — et le coup de sifflet ne pose rien. Toute ligne sans donnée disparaît.
   `virage:leave` part toujours avant la navigation. */

const DELAI_BILAN = 3000;
const B = { dernier: null, demandeA: 0, attente: null, tenir: null };

/** Le bilan porte-t-il une ligne de présence ? Sans elle, le serveur ne rend
    que le match et le camp : il n'y a rien à poser. */
const aUnBilan = (b) => Boolean(b && typeof b === 'object'
  && ['ferveur', 'chants', 'rang', 'xp', 'parfaits'].some((k) => b[k] != null));
/** A-t-on poussé pendant ce match ? Un chant accepté ici, ou la ferveur que
    le serveur nous connaît (une reconnexion la garde). L'état ne sert pas
    le compte des chants : avec le plancher de ferveur (Q4), seul un joueur
    qui n'a eu que des RATÉ revient d'une reconnexion à zéro — il sort sans
    bilan, et le filet du départ lui verse quand même son XP s'il y a droit. */
const aPousse = () => P.pousse || Number(S?.you?.ferveur) > 0;

function demanderBilan() {
  /* Une demande par cinq secondes : au-delà, le serveur refuse, et la page
     garde le bilan qu'elle a. */
  if (B.attente) return B.attente;
  if (B.dernier && Date.now() - B.demandeA < 5000) return Promise.resolve(B.dernier);
  if (!socket || P.ferme || P.parti) return Promise.resolve(B.dernier);
  B.demandeA = Date.now();
  const enVol = reponseEnAttente ? chantEnVol : null;
  const attente = (async () => {
    /* **La réponse d'un chant d'abord.** Un refus du bilan et un refus du
       chant portent les mêmes codes (`rate_limited`, `not_in_virage`), et
       rien ne dit à qui le serveur répond : la demande attend que le chant
       en vol ait la sienne — une seconde et demie au plus. */
    if (enVol) await Promise.race([enVol, new Promise((r) => setTimeout(r, 1500))]);
    if (P.ferme || P.parti) return B.dernier;
    return new Promise((tenir) => {
      let t = 0;
      const finir = (b) => { clearTimeout(t); if (B.tenir === finir) B.tenir = null; tenir(b ?? null); };
      t = setTimeout(() => finir(B.dernier), DELAI_BILAN);
      B.tenir = finir;
      socket.emit('virage:bilan');
    });
  })();
  /* « En vol » jusqu'à sa réponse, pas au-delà : sinon elle resterait la
     réponse à toutes les demandes suivantes — et la réponse peut arriver
     pendant l'émission même (une fausse socket, un banc). Ce `then` est
     accroché avant l'`await` de l'appelant : il passe le premier. */
  B.attente = attente;
  attente.then(() => { if (B.attente === attente) B.attente = null; });
  return attente;
}

let bilanEl = null, bilanFocus = null;
const bilanOuvert = () => Boolean(bilanEl?.isConnected);

/** Le nom du meilleur chant : servi (`meilleur.nom`), sinon celui du
    répertoire qu'on tient ; sinon rien. */
const nomDuChant = (m) => m?.nom ?? (S?.cards ?? []).find((c) => c.id === m?.chant)?.nom ?? null;
/* Le mot d'un verdict servi, par `geste.js` : un code qu'il ne connaît pas
   ne s'écrit pas (CONTRATS § 16.1, liste fermée). */
const motDuVerdict = (v) => window.TBF_GESTE?.mot?.(v) ?? null;

/**
 * Ce qui reste à gagner, sous le rang : « À 1 PLACE DU TOP 10 ».
 *
 * Le palier est celui que le HUD sert pendant le match (`you.prochain`,
 * CONTRATS § 16.2 : 100, 50, 10, 3, 1) — la page n'en écrit aucun. La
 * distance se compte sur le rang **du bilan** (tout le match, départs
 * compris, § 15.1), le chiffre écrit juste au-dessus : la ligne ne se
 * contredit pas. Un palier que le rang du bilan tient déjà ne se dit pas,
 * et sans palier servi (la première place, un serveur d'avant), rien.
 */
function palierDuBilan(b) {
  const cible = Number(S?.you?.prochain?.rang);
  const rang = Number(b?.rang);
  if (!(cible >= 1) || !(rang > cible)) return '';
  const n = rang - cible;
  const places = `${n} PLACE${n > 1 ? 'S' : ''}`;
  return cible === 1 ? `À ${places} DE LA TÊTE` : `À ${places} DU TOP ${cible}`;
}

function lignesDuBilan(b) {
  const l = [];
  const n = (v) => Number.isFinite(Number(v)) ? Number(v) : null;
  if (n(b.rang) >= 1 && n(b.sur) >= 1) {
    l.push({ quoi: 'RANG DANS TA TRIBUNE', cle: 'rang', de: n(b.sur), a: n(b.rang),
      sup: n(b.rang) === 1 ? 'er' : 'e', sous: `sur ${n(b.sur)}`, palier: palierDuBilan(b) });
  }
  if (n(b.ferveur) > 0) l.push({ quoi: 'FERVEUR', de: 0, a: n(b.ferveur) });
  if (n(b.chants) > 0) l.push({ quoi: 'CHANTS', de: 0, a: n(b.chants) });
  if (n(b.parfaits) > 0) l.push({ quoi: 'PARFAITS', de: 0, a: n(b.parfaits) });
  if (n(b.serie) >= 2) l.push({ quoi: 'MEILLEURE SÉRIE', de: 0, a: n(b.serie) });
  if (b.meilleur && motDuVerdict(b.meilleur.verdict)) {
    const nom = nomDuChant(b.meilleur);
    l.push({ quoi: 'MEILLEUR GESTE', verdict: b.meilleur.verdict, sous: nom ? `sur ${String(nom).toUpperCase()}` : '' });
  }
  if (Array.isArray(b.souvenirs) && b.souvenirs.length) l.push({ quoi: 'SOUVENIRS', souvenirs: b.souvenirs.length });
  return l;
}

/**
 * Le Fanzzy du bilan, en pose : celui qui tenait la corde (`you.fanzzy`, le
 * même que la scène), dans la pose du résultat — `victoire`, `defaite` ou
 * `neutre`, comme au duel (`poseDuBilan`). Sans dessin de cette pose, le
 * repli de `FZART` (le personnage au repos) ; sans personnage, rien.
 */
function poseDuBilan(etat) {
  const av = S?.you?.fanzzy;
  if (!av?.id || !window.FZART?.dessinAvatar) return null;
  try { return window.FZART.dessinAvatar(av, 'plein', { etat }) ?? null; } catch { return null; }
}

/**
 * Pose la page kraft du bilan. `ou` : la sortie que SORTIR prend.
 * La page est un calque fixé sur le document (z 150), au-dessus de la case
 * de BD et du tiroir, sous la fête de niveau.
 */
function montrerBilan(b, { ou = '/' } = {}) {
  P.sortie = true;
  if (!bilanEl) {
    bilanEl = fabriquer(`<section class="tbf-bilan" id="bilan" data-bilan role="dialog" aria-modal="true"
      aria-labelledby="bilanTitre" tabindex="-1">
      <div class="bilan-case" hidden>
        <div class="tbf-vignette"><b class="tbf-vignette-mot"></b><small></small></div>
      </div>
      <img class="tbf-bilan-fz" alt="" hidden>
      <div class="tbf-ticket tbf-bilan-page">
        <header class="tbf-bilan-tete">
          <h2 class="tbf-bilan-titre" id="bilanTitre">BILAN DE TRIBUNE</h2>
          <small></small>
          <span class="tbf-tampon" data-ton="vert">TU Y ÉTAIS</span>
        </header>
        <ul class="tbf-bilan-lignes"></ul>
      </div>
      <div class="tbf-bilan-sortie">
        <button type="button" class="tbf-plaque" data-non>RESTER</button>
        <button type="button" class="tbf-plaque" data-ton="flare" data-oui>SORTIR</button>
      </div>
    </section>`);
    bilanEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const cibles = [...bilanEl.querySelectorAll('button')];
      const i = cibles.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); cibles.at(-1).focus(); }
      else if (!e.shiftKey && i === cibles.length - 1) { e.preventDefault(); cibles[0].focus(); }
    });
  }

  /* **Après le coup de sifflet, on ne reste pas** : la page a quitté la
     salle (ou va le faire, `coupDeSifflet`), et la tribune derrière ne vit
     plus. La bâche du « non » devient UN AUTRE MATCH, en flare : le voile de
     choix, relu (`/virage`, sans le match de l'adresse, qui y ramènerait).
     SORTIR passe au parpaing. La bâche principale reste à droite, comme
     REJOUER au duel ; `data-oui` et `data-non` ne changent pas de bâche. */
  const fin = Boolean(b.fini || P.fin || P.parti || P.ferme);
  const non = bilanEl.querySelector('[data-non]'), oui = bilanEl.querySelector('[data-oui]');
  ecrire(non, fin ? 'UN AUTRE MATCH' : 'RESTER');
  poserAttr(non, 'data-ton', fin ? 'flare' : null);
  poserAttr(oui, 'data-ton', fin ? null : 'flare');
  const [gauche, droite] = fin ? [oui, non] : [non, oui];
  if (gauche.nextElementSibling !== droite) gauche.parentElement.append(gauche, droite);
  non.onclick = fin ? () => { fermerBilan(); partir('/virage'); } : () => fermerBilan();
  oui.onclick = () => { fermerBilan(); partir(ou); };

  /* **La case de BD du score final et le Fanzzy en pose**, au coup de
     sifflet seulement : le rituel de sortie du duel (sa case VICTOIRE,
     DÉFAITE ou NUL, sa bouffée, son Fanzzy). Le résultat est celui du
     terrain, du point de vue du camp poussé — le score de la corde est au
     HUD, et le tampon de la feuille dit déjà qu'on y était. Sans score
     connu, pas de case ; le Fanzzy se tient alors au repos. */
  const boite = bilanEl.querySelector('.bilan-case');
  const fz = bilanEl.querySelector('.tbf-bilan-fz');
  const mine = S?.you?.side ?? (b.side === 1 ? 1 : 0);
  // Un but inconnu (`null`) n'est pas zéro : `Number(null)` le serait.
  const but = (x) => (x == null || x === '' ? NaN : Number(x));
  const nous = but(S?.scoreReel?.[mine]), eux = but(S?.scoreReel?.[mine ^ 1]);
  const connu = fin && Number.isFinite(nous) && Number.isFinite(eux);
  const issue = !connu ? null : nous > eux ? 'victoire' : nous < eux ? 'defaite' : 'nul';
  boite.hidden = !connu;
  if (connu) {
    const ton = { victoire: 'vert', defaite: 'flare', nul: 'gris' }[issue];
    const vignette = boite.querySelector('.tbf-vignette');
    vignette.dataset.ton = ton;
    ecrire(vignette.firstElementChild, { victoire: 'VICTOIRE', defaite: 'DÉFAITE', nul: 'MATCH NUL' }[issue]);
    ecrire(vignette.lastElementChild, `${nous} – ${eux} · TERRAIN`);
    // La bouffée gonfle une fois, à chaque fois que la page se pose.
    if (!bilanOuvert()) {
      boite.querySelector('.tbf-bouffee')?.remove();
      boite.insertAdjacentHTML('afterbegin', `<span class="tbf-bouffee" aria-hidden="true"
        style="--c1:var(--${ton});--c2:var(--${ton})"></span>`);
    }
  }
  const src = fin ? poseDuBilan(issue === 'nul' || !issue ? 'neutre' : issue) : null;
  fz.hidden = !src;
  if (src) { if (fz.getAttribute('src') !== src) fz.src = src; } else fz.removeAttribute('src');

  const page = bilanEl.querySelector('.tbf-bilan-page');
  const f = S?.fixture;
  const quand = fin ? 'FIN DU MATCH' : minuteTexte();
  bilanEl.querySelector('.tbf-bilan-tete small').textContent =
    [f?.homeName && f?.awayName ? `${f.homeName} – ${f.awayName}` : '', quand].filter(Boolean).join(' · ');

  /* Les lignes, une par chiffre, chacune seulement si elle a sa donnée. Le
     rang ouvre la feuille, en grand (`.rang`), avec ce qui reste à gagner
     en sticker craie sous son libellé. */
  const ul = bilanEl.querySelector('.tbf-bilan-lignes');
  const lignes = lignesDuBilan(b);
  ul.replaceChildren(...lignes.map((l, i) => {
    const li = fabriquer('<li class="tbf-bilan-l tbf-glisse"><span></span></li>');
    if (l.cle) li.classList.add(l.cle);
    li.style.setProperty('--d', `${i * 700}ms`);
    li.firstElementChild.textContent = l.quoi;
    if (l.verdict) {
      const t = fabriquer(`<span class="tbf-tampon tbf-clac" data-verdict="${l.verdict}"></span>`);
      t.textContent = motDuVerdict(l.verdict);
      t.style.setProperty('--d', `${i * 700 + 200}ms`);
      li.append(t);
      setTimeout(() => window.FX?.son?.('bache'), i * 700 + 360);
    } else if (l.souvenirs) {
      const p = fabriquer('<span class="tbf-souvenirs" role="img"><b class="tbf-sticker tbf-sticker--rond"></b></span>');
      for (let k = 0; k < Math.min(3, l.souvenirs); k++) p.insertBefore(document.createElement('span'), p.lastElementChild);
      p.lastElementChild.textContent = l.souvenirs;
      p.setAttribute('aria-label', `${l.souvenirs} carte${l.souvenirs > 1 ? 's' : ''}-souvenir${l.souvenirs > 1 ? 's' : ''}`);
      li.append(p);
    } else {
      const v = fabriquer('<b><span></span></b>');
      if (l.sup) v.append(fabriquer(`<sup>${l.sup}</sup>`));
      li.append(v);
      const chiffre = v.firstElementChild;
      chiffre.textContent = window.FX?.compter ? String(l.de) : String(l.a);
      setTimeout(() => window.FX?.compter?.(chiffre, l.de, l.a, { ms: 600 }), i * 700 + 120);
    }
    if (l.sous) { const s = document.createElement('small'); s.textContent = l.sous; li.append(s); }
    /* Le palier claque une fois le rang compté (600 ms de compte). */
    if (l.palier) {
      const s = fabriquer('<span class="tbf-sticker tbf-clac"></span>');
      s.textContent = l.palier;
      s.style.setProperty('--d', `${i * 700 + 720}ms`);
      li.append(s);
    }
    return li;
  }));

  /* L'XP du match, puis les notes d'une ligne. */
  page.querySelectorAll('.tbf-bilan-xp, .tbf-bilan-note').forEach((n) => n.remove());
  const apres = lignes.length * 700;
  const xp = b.xp;
  if (xp?.verse === true && Number(xp.gain?.xp) > 0) {
    const niv = xp.niveau ?? {};
    const bloc = fabriquer(`<div class="tbf-bilan-xp tbf-glisse"><b></b>
      <div class="tbf-jauge"><i></i></div><span class="tbf-sticker"></span></div>`);
    bloc.style.setProperty('--d', `${apres}ms`);
    bloc.querySelector('b').textContent = `+${xp.gain.xp} XP`;
    const sticker = bloc.querySelector('.tbf-sticker');
    if (Number(niv.niveau) >= 1) sticker.textContent = `NIV. ${niv.niveau}`; else sticker.remove();
    const i = bloc.querySelector('i');
    const depuis = Number(niv.depart?.part);
    const vers = niv.monte ? 1 : Number(niv.part);
    i.style.width = `${Math.round((Number.isFinite(depuis) ? depuis : 0) * 100)}%`;
    page.append(bloc);
    if (!b._vu) {
      /* Le joueur gagne, la barre et le tiroir l'apprennent (R6) — une fois
         par bilan reçu, pas à chaque fois qu'on le rouvre. */
      b._vu = true;
      window.dispatchEvent(new CustomEvent('tbf:bourse', { detail: { wallet: xp.wallet, niveau: xp.niveau } }));
      setTimeout(() => {
        if (Number.isFinite(vers)) i.style.width = `${Math.round(Math.max(0, Math.min(1, vers)) * 100)}%`;
        if (niv.monte === true) {
          setTimeout(() => window.TBF_NIVEAU?.feter?.(niv, { avatar: S?.you?.fanzzy ?? null }), 950);
        }
      }, apres + 300);
    } else if (Number.isFinite(vers)) i.style.width = `${Math.round(Math.max(0, Math.min(1, vers)) * 100)}%`;
  }
  const notes = [];
  if (xp?.verse === false && xp.raison === 'incomplet' && Number(xp.manque) >= 1) {
    notes.push(`Encore ${xp.manque} chant${xp.manque > 1 ? 's' : ''} pour l’XP du match`);
  }
  if (xp?.verse === false && xp.raison === 'quota') notes.push('Tes matchs du jour ont déjà rapporté leur XP');
  if (b.classe === false) notes.push('Ce Virage ne compte pas au classement');
  for (const t of notes) {
    const p = document.createElement('p');
    p.className = 'tbf-bilan-note';
    p.textContent = t;
    page.append(p);
  }

  if (!bilanOuvert()) {
    bilanFocus = document.activeElement;
    document.body.append(bilanEl);
    rejouer(bilanEl.querySelector('.tbf-bilan-tete .tbf-tampon'), 'tbf-clac');
    setTimeout(() => window.FX?.son?.('bache'), 160);
  }
  bilanEl.scrollTop = 0;
  reglerDefile();
  /* Le focus entre dans la page (un lecteur d'écran l'annonce par son
     titre), sans désigner un des deux boutons à la place du joueur. */
  bilanEl.focus({ preventScroll: true });
}

/** La page du bilan défile-t-elle ? Les bâches de sortie ne se tiennent au
    bas de l'écran que si oui (voir la feuille). Toute la feuille est posée
    d'un coup — les lignes glissent, elles ne s'ajoutent pas — et le Fanzzy a
    sa hauteur avant son dessin : une mesure à la pose suffit, puis à chaque
    changement de taille de la fenêtre. */
function reglerDefile() {
  if (!bilanOuvert()) return;
  poserAttr(bilanEl, 'data-defile', bilanEl.scrollHeight > bilanEl.clientHeight + 1 ? '' : null);
}
addEventListener('resize', reglerDefile);

function fermerBilan() {
  if (!bilanOuvert()) return;
  bilanEl.remove();
  P.sortie = false;
  if (bilanFocus?.isConnected) bilanFocus.focus?.({ preventScroll: true });
}

/** La boîte d'avant, pour un serveur qui ne sert pas de bilan. */
async function quitterLaTribune() {
  return window.TBF_DIALOGUE?.confirmer({
    titre: 'QUITTER LA TRIBUNE ?',
    texte: 'Tu peux revenir quand tu veux, le match continue sans toi. '
      + 'En attendant tu ne pousses plus, et les cartes-souvenirs se frappent '
      + 'chez ceux qui sont là au moment du but.',
    oui: 'SORTIR',
    non: 'RESTER',
  }) ?? true;
}

/** Quitter la salle : une fois, et la tribune se vide avec soi. */
function quitterLaSalle() {
  if (!P.parti) {
    socket?.emit('virage:leave');
    P.parti = true;
  }
  window.TBF_SON?.arreterChant?.();
}

/** Partir pour de bon : la salle d'abord, puis la page, 180 ms plus tard. */
function partir(ou) {
  quitterLaSalle();
  // La rumeur ne suit pas le joueur dans le couloir.
  window.TBF_SON?.ambiance?.(0);
  setTimeout(() => { location.href = ou; }, 180);
}

/** Dans la tribune : le serveur nous a donné un état, donc on y est. */
const dansLaTribune = () => Boolean(S);

async function sortir(ou) {
  if (P.sortie) return;
  /* Le coup de sifflet est passé et la page a quitté la salle : le bilan
     qu'elle a gardé, ou la sortie tout de suite. */
  if (P.parti) {
    if (aUnBilan(B.dernier)) { montrerBilan(B.dernier, { ou }); return; }
    window.TBF_SON?.ambiance?.(0);
    location.href = ou;
    return;
  }
  if (!aPousse()) { partir(ou); return; }
  P.sortie = true;
  let pose = false;
  try {
    const b = await demanderBilan();
    if (aUnBilan(b)) { montrerBilan(b, { ou }); pose = true; return; }
    if (await quitterLaTribune()) partir(ou);
  } finally {
    if (!pose) P.sortie = false;
  }
}

/**
 * **Le coup de sifflet final** : `virage:fin`, ou un état qui le dit déjà —
 * une page qui entre ou se reconnecte après lui ne reçoit pas `virage:fin`
 * (CONTRATS § 15.3), et sans ce relais elle restait dans une salle finie,
 * qu'elle rejoignait encore à chaque reconnexion, et que le relevé du direct
 * continuait de payer. Une fois par match : la rumeur se vide, puis, après
 * un délai tiré entre 0 et 8 s — mille bilans au même instant seraient mille
 * lectures —, la page demande son bilan, le pose sans qu'on touche rien,
 * quitte la salle et n'y rentre plus.
 *
 * **Un geste ouvert passe d'abord** : le bilan le couvrirait, et le chant
 * partirait après `virage:leave`, refusé. La demande attend que la fenêtre
 * du geste se ferme (`apresLaFenetre`).
 */
function coupDeSifflet(statut) {
  if (!S || P.fin) return;
  P.fin = true;
  if (statut) S.statut = statut;
  window.TBF_SON?.rumeur?.('fin');
  renderFil();
  setTimeout(() => apresLaFenetre(async () => {
    if (P.parti) return;
    const b = await demanderBilan();
    if (aUnBilan(b) && !bilanOuvert() && !P.sortie) montrerBilan(b, { ou: '/' });
    quitterLaSalle();
  }), Math.random() * 8000);
}

/* On intercepte la flèche et les liens du tiroir, les deux sorties, et le
   lien vers le deck du panneau. Pas la fermeture de l'onglet : la coupure de
   socket la couvre. `a[href^="/"]` et non `a` : la déconnexion porte
   `href="#"` et a sa propre confirmation. */
document.addEventListener('click', (e) => {
  const sortie = e.target.closest('.tbf-retour, .tbf-tiroir a[href^="/"], [data-quitter-virage]');
  if (!sortie || !dansLaTribune()) return;
  e.preventDefault();
  e.stopPropagation();
  sortir(sortie.getAttribute('href') || '/');
}, true);
/* La page quittée autrement — l'onglet fermé, le retour du navigateur —
   vide aussi la tribune ; le chant s'arrête avec elle. */
addEventListener('pagehide', () => {
  window.TBF_SON?.arreterChant?.();
  window.TBF_SON?.ambiance?.(0);
});

/* -------------------------------------------------------------- l'entrée

   Les deux bâches se posent, la foule compte de zéro à son effectif, la
   rumeur monte du silence avec elle, et le Fanzzy entre et salue (la scène
   le fait à `definir`). Une fois par match : une reconnexion ne rejoue pas
   le rituel. Un match déjà fini à l'entrée : la tribune ne monte pas pour se
   vider aussitôt. */
function entrer() {
  P.entree = true;
  const doux = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('clubMe').style.setProperty('--d', '0ms');
  $('clubFoe').style.setProperty('--d', '140ms');
  rejouer($('clubMe'), 'tbf-colle');
  rejouer($('clubFoe'), 'tbf-colle');
  const fini = FINS_DE_MATCH.includes(S.statut);
  if (window.FX?.compter && !doux && !fini) {
    P.compteJusqua = performance.now() + COMPTE_MS + 100;
    const mine = S.you.side;
    window.FX.compter($('compteMoi').firstElementChild, 0, S.crowd?.[mine] ?? 0, { ms: COMPTE_MS });
    /* Personne en face : rien à compter, la mention se pose d'emblée. */
    const eux = S.crowd?.[mine ^ 1] ?? 0;
    if (eux > 0) window.FX.compter($('compteEux').firstElementChild, 0, eux, { ms: COMPTE_MS });
    else {
      ecrire($('compteEux').firstElementChild, 'PERSONNE');
      poserAttr($('compteEux'), 'data-personne', '');
    }
  }
  if (fini) {
    window.TBF_SON?.rumeur?.('fin');
    return;
  }
  window.TBF_SON?.rumeur?.('entree', { ms: COMPTE_MS });
  if (S.surgeMs > 0) window.TBF_SON?.rumeur?.('double', { ms: S.surgeMs });
}

/* -------------------------------------------------------------- réseau */

function connect() {
  /* Polling d’abord, websocket ensuite : l’ordre inverse fait abandonner le
     client sur un réseau qui bloque le websocket, le cas courant en mobile. */
  socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });

  /* À la reconnexion, on revient dans la salle **avec son camp** : sans lui,
     un neutre poussant pour l'extérieur était remis à domicile. Pas après le
     coup de sifflet, ni après que la tribune a été vidée. */
  socket.on('connect', () => {
    if (S && !P.parti && !P.ferme) {
      socket.emit('virage:join', { fixtureId: S.fixture.id,
        camp: S.you?.side === 1 ? 'exterieur' : 'domicile' });
    }
  });

  socket.on('virage:state', (s) => {
    const premier = !S || S.fixture?.id !== s?.fixture?.id;
    if (premier) { P = neuf(); B.dernier = null; B.demandeA = 0; }
    S = s;
    /* L'état porte le souffle et les recharges du moment : les deux horloges
       locales repartent de lui. */
    souffleVuA = cdVuA = Date.now();
    /* Et la minute de l'entrée, que garde le fil pour ne pas rejouer ce qui
       était déjà au tableau — voir « virage:fil ». **Une reconnexion est une
       entrée** : la salle a pu être libérée et rouverte pendant la coupure,
       et son premier relevé rapporterait tout le match. Elle ne fait que
       relever la minute connue — un état sans minute, après une coupure, ne
       lève pas la garde —, et un autre match repart de zéro. Nulle ou
       vieillie, les minutes reçues ensuite la relèvent : voir
       `minuteApprise`. */
    entreeA = Date.now();
    if (premier) entreeMinute = null;
    minuteApprise(s.minute);
    $('veil').classList.remove('on');
    if (s.surgeMs > 0) noterDouble(s.surgeMs); else if (!s.surge) P.doubleFin = null;
    renderStatic(); render();
    /* Le personnage entre avec la tribune, à l'âge que le serveur donne. */
    if (S.you?.fanzzy) scene?.definir(S.you.fanzzy);
    // Le fil arrive avec l'état : entrer à la soixantième minute donne ce
    // qui s'est passé avant, pas un écran vide.
    renderFil();
    if (premier) entrer(); else ambianceDuMatch();
    /* Entré, ou revenu, après le coup de sifflet : l'état le dit, et
       `virage:fin` ne viendra pas (§ 15.3). */
    if (FINS_DE_MATCH.includes(s.statut)) coupDeSifflet();
    /* **Le niveau a monté depuis la dernière visite ?** La fête le dit, une
       fois, à l'entrée. Elle lit `/api/niveau` elle-même. */
    if (!feteDemandee && window.TBF_NIVEAU?.depuisVisite) {
      feteDemandee = true;
      window.TBF_NIVEAU.depuisVisite(null, { avatar: S.you?.fanzzy ?? undefined });
    }
  });

  /* Le fil du match. Le serveur n'envoie que le neuf ; la page tient la liste. */
  socket.on('virage:fil', (f) => {
    if (!S) return;
    S.fil = [...(S.fil ?? []), ...(f.entrees ?? [])]
      .sort((a, b) => (a.minute ?? 0) - (b.minute ?? 0)
        || (a.extra ?? 0) - (b.extra ?? 0) || a.rang - b.rang);
    if (f.scoreReel) S.scoreReel = f.scoreReel;
    if (f.minute != null) S.minute = f.minute;
    /* Avant la boucle : le relevé qui apporte tout ce qui s'est passé avant
       porte aussi la minute où il le dit, et c'est elle qui l'écarte quand
       l'état n'en avait pas — voir `minuteApprise`. */
    minuteApprise(f.minute);
    renderFil({ neuf: true });
    /* Le personnage réagit aux entrées **neuves** seulement — et neuves pour
       le fil n'est pas neuves pour le joueur. Le premier relevé d'un match
       qu'on n'avait jamais relevé envoie tout ce qui s'est passé avant :
       entrer à la cinquantième jouait « ROUGE POUR EUX » pour un carton de la
       vingtième, et « BUT REFUSÉ » pour une vidéo de la trentième. Ce qui
       précède l'entrée va au fil et à la feuille, pas au personnage. Deux
       minutes de grâce : le relevé a du retard, et un carton de la
       soixante-neuvième publié quand on entre à la soixante et onzième est
       neuf pour qui vient d'arriver. Les périodes passent toujours : elles
       disent où en est le match maintenant, pas ce qui s'y est passé. Et ce
       qui reste attend la fin du geste : voir `apresLaFenetre`. */
    for (const e of f.entrees ?? []) {
      if (dAvantLEntree(e)) continue;
      apresLaFenetre(() => reagirAuFil(e), { moment: 'match' });
    }
  });

  socket.on('virage:tick', (t) => {
    if (!S) return;
    /* La foule d'un camp pousse quand ce camp a chanté : le serveur le dit
       (`pousse`, contrat § 16.7). La page le lisait dans le sens de la
       corde ; depuis que sa retombée part, ce sens aurait fait pousser la
       tribune d'en face à chaque recul — vide comprise. Un serveur d'avant
       ne dit rien : on retombe sur le sens de la corde, jamais pour une
       tribune où personne ne chante. */
    const mine = S.you.side;
    let qui = [];
    if (Array.isArray(t.pousse)) {
      if (t.pousse[mine]) qui.push('moi');
      if (t.pousse[mine ^ 1]) qui.push('eux');
    } else {
      const delta = (t.rope - S.rope) * (mine === 0 ? -1 : 1);
      if (Math.abs(delta) >= 1) qui = [delta > 0 ? 'moi' : 'eux'];
      qui = qui.filter((c) => (t.crowd?.[c === 'moi' ? mine : mine ^ 1] ?? 0) > 0);
    }
    for (const cote of qui) {
      const el = cote === 'moi' ? $('crowdMe') : $('crowdFoe');
      if (!el.classList.contains('pousse')) pousser(cote);
    }
    S.rope = t.rope; S.goals = t.goals; S.crowd = t.crowd; S.surge = t.surge;
    if (!t.surge) P.doubleFin = null;
    render();
  });

  /* Deux horloges locales, parce que le serveur ne parle pas assez souvent
     pour elles : le souffle, la minute et le chrono de la minute double
     avancent même quand personne ne chante. */
  setInterval(() => { if (S && !document.hidden) { render(); ambianceDuMatch(); } }, 1000);
  setInterval(() => { if (S && !document.hidden) renderFil(); }, 15000);

  socket.on('virage:result', (r) => {
    // Son propre chant fait battre sa tribune : le geste a un écho à l'écran.
    stade?.pulse(S?.you?.side ?? 0);
    if (!S) return;
    P.pousse = true;
    /* Le serveur fait foi : on repart de sa valeur. Le rang, la série et le
       palier suivant sont servis (§ 16) ; absents, la page garde ce qu'elle
       avait — et sans `prochain` d'un serveur qui sert le rang, c'est la
       première place. */
    S.you.breath = r.breath; souffleVuA = Date.now(); S.you.ferveur = r.ferveur;
    if (r.serie != null) S.you.serie = r.serie;
    if (r.rang != null) { S.you.rank = r.rang; if (r.sur != null) S.you.of = r.sur; }
    if (r.prochain) S.you.prochain = r.prochain;
    else if (r.rang != null) delete S.you.prochain;
    // La fenêtre du geste, ou la carte jouée, y claque le tampon.
    const tenir = reponseEnAttente; reponseEnAttente = null; tenir?.(r);
    /* **Le verdict décide du son, jamais la note** : PARFAIT a le sien, les
       autres celui du chant. */
    window.FX?.son?.(r.verdict === 'parfait' ? 'parfait' : 'chant');
    /* Le chiffre part de la corde, là où le joueur regarde, et il est gros :
       « POUSSÉE », ou « CONTRE TOI » quand le geste se retourne. Le Cri ne
       part que si le serveur le dit (`cri`). Les deux attendent que la
       fenêtre du geste se ferme : posés sur le document, ils couvraient le
       tampon qui claquait au centre du pavé. */
    apresLaFenetre(() => {
      window.FX?.points(r.backfire ? -r.push : r.push, $('knot'), {
        couleur: r.backfire ? window.FX.couleurs.feu : window.FX.couleurs.or,
        quoi: r.backfire ? 'CONTRE TOI' : 'POUSSÉE',
      });
      if (r.cri === true && S?.you?.fanzzy?.cri) {
        window.FX?.cri(S.you.fanzzy.cri, { couleur:'var(--projo)' });
      }
    });
    celebrer(2600);
    scene?.pose('pousse', 2600);
    pousser('moi');
    buzz(r.verdict === 'parfait' ? [20, 30, 40] : 12);
    // La tribune pousse après son chant, cinq secondes : l'écho du geste.
    window.TBF_SON?.ambiance?.(2, { pendant: 5000 });
    render();
  });

  socket.on('virage:goal', (g) => {
    if (!S?.you) return;
    // La tribune s'embrase. Une fois, et longuement : c'est le moment.
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    /* La corne, puis l'ovation de sa tribune quand c'est elle qui fait
       céder la corde : tout de suite, même pendant un geste — le son ne
       couvre pas le pavé. La vibration aussi, si un geste est ouvert. */
    window.FX?.son?.(mien ? 'but' : 'encaisse');
    if (mien) window.TBF_SON?.rumeur?.('but');
    sentirLeBut(mien);
    /* Ce qui couvre l'écran ou le fait trembler attend la fin du geste :
       voir `apresLaFenetre`. Un but de corde naît des chants, donc tombe
       souvent pendant le sien. La scène pose la case de BD : la couche
       commune n'ajoute que la secousse et la vibration, sans second titre. */
    apresLaFenetre(() => {
      window.FX?.but?.({ pour: mien, vignette: true });
      if (scene) {
        celebrer();
        scene.moment(mien ? 'but' : 'encaisse',
          mien ? 'LA CORDE CÈDE !' : 'ILS ONT FAIT CÉDER LA CORDE',
          { couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)' });
      } else {
        banner(mien ? 'BUT DE LA TRIBUNE !' : 'ILS ONT FAIT CÉDER LA CORDE');
      }
    }, { moment: 'jeu' });
  });

  socket.on('virage:real_goal', (g) => {
    if (!S?.you) return;
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    if (g.scoreReel) { S.scoreReel = g.scoreReel; renderFil(); }
    /* La minute double s'ouvre pour tout le monde : le chrono part de
       `surgeMs`, et la rumeur pousse le temps qu'elle dure. Plus de bandeau
       « MINUTE DOUBLE » : le sticker de phase le dit. */
    if (g.surgeMs > 0) { noterDouble(g.surgeMs); S.surge = true; }
    window.TBF_SON?.rumeur?.('double', Number.isFinite(g.surgeMs) ? { ms: g.surgeMs } : {});
    // La corne et l'ovation, tout de suite : voir « virage:goal ».
    window.FX?.son?.(mien ? 'butReel' : 'encaisse');
    if (mien) window.TBF_SON?.rumeur?.('but');
    sentirLeBut(mien);
    /* La secousse et « GOAL ! » sur la case de BD, avec le buteur et la
       minute — quinze secondes, aux couleurs de l'équipe qui a marqué —
       attendent la fin du geste, et se montrent **après** les autres
       moments en attente : c'est le but qui reste à l'écran (voir
       `apresLaFenetre`). La tribune, le score, la minute double et la
       rumeur, eux, sont déjà partis. */
    apresLaFenetre(() => {
      window.FX?.but?.({ pour: mien, vignette: true });
      celebrer();
      scene?.moment(mien ? 'but' : 'encaisse', mien ? 'GOAL !' : 'ON ENCAISSE', {
        couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)',
        sous: [g.player, g.minute != null ? `${g.minute}′` : ''].filter(Boolean).join(' · '),
      });
    }, { moment: 'but' });
    render();
  });

  /* La carte-souvenir, à ceux-là seuls qui l'ont reçue. Une fois par carte. */
  socket.on('virage:souvenir', (s) => {
    if (!S || !s) return;
    if (s.fixtureId != null && s.fixtureId !== S.fixture?.id) return;
    /* Déjà dans la pile, en file, ou à l'écran — la carte qui se retourne
       n'entre dans la pile qu'en s'y posant. */
    const deja = s.id != null && (P.souvenirs.some((x) => x.id === s.id)
      || souvenirsEnAttente.some((x) => x.id === s.id) || P.souvenirEnVue?.id === s.id);
    if (deja) return;
    souvenirsEnAttente.push(s);
    annoncerSouvenir();
  });

  /* Le vrai match : score, minute, période. */
  socket.on('virage:match', (v) => {
    if (!S) return;
    if (v.scoreReel) S.scoreReel = v.scoreReel;
    if (v.minute != null) S.minute = v.minute;
    // Il précède le fil du même relevé : voir `minuteApprise`.
    minuteApprise(v.minute);
    S.minuteExtra = v.minuteExtra ?? null;
    if (v.vuA) S.vuA = v.vuA;
    if (v.statut) S.statut = v.statut;
    renderFil();
  });

  /* **Le coup de sifflet final** : voir `coupDeSifflet`. */
  socket.on('virage:fin', (f) => coupDeSifflet(f?.statut));
  /* La tribune est vidée : la page ne rejoint plus, et garde son bilan. */
  socket.on('virage:ferme', () => { P.ferme = true; P.parti = true; });

  socket.on('virage:bilan', (b) => {
    if (!b || (S && b.fixtureId != null && b.fixtureId !== S.fixture?.id)) return;
    B.dernier = b;
    B.tenir?.(b);
  });

  /* La foule part avec la corde (`virage:tick`) : le serveur de la vague 2
     ne diffuse plus `virage:crowd` à chaque entrée (D4). Ce relais ne sert
     plus qu'à un serveur d'avant. */
  socket.on('virage:crowd', (c) => { if (S) { S.crowd = c.crowd; render(); } });

  /* Ce que fait une carte — la sienne comme celle d'un voisin. */
  socket.on('virage:events', (m) => { if (S) raconterActe(m.evenements ?? []); });

  /* Le répertoire a tourné : cinq autres chants, et un autre motif d'écho. */
  socket.on('virage:repertoire', ({ cards, echo } = {}) => {
    if (!S || !cards) return;
    S.cards = cards;
    if (echo && S.you?.gestes?.echo) {
      S.you.gestes.echo = { ...S.you.gestes.echo, motif: echo.motif,
                            instants: echo.instants };
    }
    renderChants();
    render();
  });

  socket.on('virage:vous', (you) => {
    if (!S || !you) return;
    S.you = { ...S.you, ...you };
    /* Il porte le souffle et les recharges **de cet instant** : les deux
       horloges locales repartent d'ici. Il arrive après une carte jouée, à
       chaque carte tirée (le serveur l'envoie au tirage, à tous les onglets
       du joueur) et après un refus de main ; une main vide qui se remplit
       refait paraître la rangée, et `renderActes` la remet en place sans
       recréer ses cases. */
    souffleVuA = cdVuA = Date.now();
    render();
  });

  /* Les amis présents dans la tribune (§ 18.3). */
  socket.on('virage:amis', ({ amis } = {}) => {
    for (const a of amis ?? []) if (a?.id) P.amis.set(a.id, a);
    renderAmis();
  });
  socket.on('virage:ami', (a) => {
    if (!a?.id) return;
    if (a.present === false) P.amis.delete(a.id);
    else P.amis.set(a.id, a);
    renderAmis();
  });

  socket.on('virage:error', (e) => {
    const code = e?.code;
    /* Une demande de bilan refusée — trop tôt, ou hors de la salle — n'est
       pas une erreur à montrer : la page garde le bilan qu'elle a. Si un
       chant attend aussi sa réponse, le refus va au chant : sa fenêtre ne
       reste pas ouverte pour rien, et la demande de bilan retombe d'elle-même
       au bout de trois secondes. Le cas est rare — la demande attend le
       chant en vol, et aucun geste ne s'ouvre pendant une sortie. */
    if (B.tenir && !reponseEnAttente
      && (code === 'ferveur.error.rate_limited' || code === 'ferveur.error.not_in_virage')) {
      B.tenir(B.dernier);
      return;
    }
    const tenir = reponseEnAttente; reponseEnAttente = null; tenir?.(null);
    fail(code);
  });
}

/* ----------------------------------------------------------- choix du match */

(async () => {
  /* **La socket ne doit jamais empêcher la page de s’afficher.** `io` peut
     manquer — un mandataire, une extension, une coupure — et la liste des
     matchs n’en a pas besoin : seul **jouer** en a besoin. */
  let sansDirect = false;
  try { connect(); }
  catch (e) { sansDirect = true; console.error('[virage] socket', e.message); }

  /* Entrer directement dans un match, par son adresse. */
  const demande = Number(new URLSearchParams(location.search).get('match'));
  const parLien = Number.isInteger(demande) && demande > 0 ? demande : null;

  let matchs = [];
  const lire = async () => {
    try {
      const r = await fetch('/api/virage/live', { credentials:'same-origin' });
      if (r.status === 401) { location.href = '/compte'; return false; }
      const rep = await r.json();
      matchs = rep.matchs ?? [];
      FERVEUR_NEUTRE = rep.ferveurNeutre ?? FERVEUR_NEUTRE;
      return true;
    } catch { return false; }    // serveur injoignable : on garde la liste
  };
  await lire();

  /* La minute d'un match de la liste, par la **même** horloge que partout. */
  const minuteDe = (m) => window.TBF_HORLOGE.texte(
    { statut: m.status_short, minute: m.elapsed, extra: m.elapsed_extra, vuA: m.luA },
    { HT: 'MI-TEMPS', BT: 'PAUSE', INT: 'INTERROMPU' }) || (m.elapsed ? m.elapsed + "'" : '');

  /* ------------------------------------------------------- la recherche

     Une équipe, une compétition, ou un pays **dans sa langue** (pays.js). */
  const { pli, cherches: paysCherches } = window.TBF_PAYS;
  const nomPays = (m) => window.TBF_PAYS.nom(m.pays, m.drapeau);

  let terme = '';

  function filtrer(liste) {
    if (!terme) return liste;
    const cherches = paysCherches(terme);
    const estCePays = (nom) => Boolean(nom)
      && cherches.some((p) => pli(nom).includes(p));
    return liste.filter((m) =>
      pli(m.home_name).includes(terme) || pli(m.away_name).includes(terme)
      || pli(m.league_name).includes(terme)
      || pli(m.pays).includes(terme) || pli(nomPays(m)).includes(terme)
      || estCePays(m.pays)
      || estCePays(m.home_name) || estCePays(m.away_name));
  }

  /* **Ne se jouera pas à l'heure dite** : reporté, annulé, arrêté, suspendu,
     sur tapis vert (ETAT.md § 6, « Un match du fil garde sa date »). Ces
     lignes quittent la liste et ne donnent pas de compte à rebours. */
  const SANS_COUP = ['PST', 'CANC', 'ABD', 'SUSP', 'AWD', 'WO'];
  const EN_JEU = ['1H', '2H', 'ET', 'P', 'LIVE'];
  const deux = (n) => String(n).padStart(2, '0');
  const heure = (iso) => { const d = new Date(iso); return Number.isFinite(d.getTime())
    ? `${deux(d.getHours())}:${deux(d.getMinutes())}` : ''; };
  const lisible = (c) => (c ? (window.FX?.lisible?.(c) ?? c) : '');

  /* La foule d'une affiche, en frise : la part des tribunes de ce match sur
     celles du match le plus suivi de la liste. */
  let fouleMax = 1;
  const frise = (n) => {
    const allumes = n > 0 ? Math.max(1, Math.round(12 * n / fouleMax)) : 0;
    return Array.from({ length: 12 }, (_, k) => `<i${k < allumes ? ' class="on"' : ''}></i>`).join('');
  };

  /** Une affiche par match : le cadre aux écharpes des deux clubs, les
      blasons, le score en banderole, l'état en sticker, la foule. */
  const affiche = (m) => {
    const joue = m.home_goals != null && m.away_goals != null;
    /* Une rencontre sans heure fixée (`TBD`) porte une heure provisoire,
       souvent minuit (ETAT.md § 6) : l'affiche ne l'annonce pas. */
    const aSonHeure = m.status_short !== 'TBD' ? heure(m.kickoff_at) : '';
    const [a1, a2] = (m.homeColors ?? []).map(lisible);
    const [b1, b2] = (m.awayColors ?? []).map(lisible);
    const couleurs = [['--a1', a1], ['--a2', a2], ['--b1', b1], ['--b2', b2]]
      .filter(([, v]) => v).map(([k, v]) => `${k}:${esc(v)}`).join(';');
    /* **Une affiche éteinte dit pourquoi** : TERMINÉ, ou l'heure du coup
       d'envoi. Le direct porte son point et sa minute. */
    const etat = m.open
      ? (EN_JEU.includes(m.status_short)
        ? `<span class="tbf-sticker tbf-sticker--live" data-ton="flare">${esc(minuteDe(m))} LIVE</span>`
        : m.status_short === 'NS' ? '<span class="tbf-sticker">BIENTÔT</span>'
          : `<span class="tbf-sticker">${esc(minuteDe(m) || 'EN DIRECT')}</span>`)
      : m.fini ? '<span class="tbf-sticker">TERMINÉ</span>'
        : aSonHeure ? `<span class="tbf-sticker">À ${aSonHeure}</span>` : '';
    const foule = (m.crowd?.[0] ?? 0) + (m.crowd?.[1] ?? 0);
    const score = joue ? `${m.home_goals} – ${m.away_goals}` : aSonHeure;
    return `<div class="match tbf-cadre tbf-affiche${m.open ? '' : ' off'}${m.mien ? '' : ' ailleurs tbf-affiche--ailleurs'}"
      data-id="${m.id}" data-mien="${m.mien ? 1 : 0}" role="button" tabindex="${m.open ? 0 : -1}"
      ${couleurs ? `style="${couleurs}"` : ''}>
      <span class="tbf-affiche-club"><img src="${esc(m.home_logo ?? '')}" alt=""><b>${esc(m.home_name)}</b></span>
      <span class="tbf-affiche-score">${score ? `<b class="tbf-banderole">${score}</b>` : ''}
        ${m.league_name ? `<small>${esc(m.league_name)}</small>` : ''}</span>
      <span class="tbf-affiche-club"><img src="${esc(m.away_logo ?? '')}" alt=""><b>${esc(m.away_name)}</b></span>
      ${etat}
      <span class="tbf-affiche-pied">
        <span class="tbf-foule tbf-foule--frise" data-tribune="moi" aria-hidden="true">${frise(foule)}</span>
        <small>${foule} DANS LES TRIBUNES</small></span>
    </div>`;
  };

  /* ------------------------------------------- l'attente : le prochain coup

     Rien ne se joue : le prochain coup d'envoi d'un club suivi, avec le
     **même compte à rebours que le hub** (« dans 2 h 14 »), puis répéter en
     attendant et suivre un club. Le coup d'envoi vient de la liste quand
     elle le porte (un match de ses clubs dans les deux heures) ; sinon de la
     mémoire que le hub tient dans l'onglet, ou du fil des clubs suivis — une
     lecture en base, et seulement dans cet état. */
  function rebours(iso) {
    const min = Math.max(0, Math.ceil((Date.parse(iso) - Date.now()) / 60_000));
    if (min >= 1440) return `dans ${Math.floor(min / 1440)} j ${Math.floor((min % 1440) / 60)} h`;
    if (min >= 600) return `dans ${Math.floor(min / 60)} h`;
    if (min >= 60) return `dans ${Math.floor(min / 60)} h ${deux(min % 60)}`;
    return `dans ${min} min`;
  }
  const PROCHAINS = 'tbf.prochains';
  let prochainLu = null, prochainDemande = false;
  async function lireProchain() {
    if (prochainDemande) return;
    prochainDemande = true;
    const user = await (window.TBF_MOI ??= fetch('/api/auth/me', { credentials: 'same-origin' })
      .then((r) => (r.ok ? r.json() : null)).then((j) => j?.user ?? null).catch(() => null));
    const qui = user?.id ?? null;
    const maintenant = Date.now();
    let v = null;
    try {
      const c = JSON.parse(sessionStorage.getItem(PROCHAINS) ?? 'null');
      if (c?.qui === qui && Array.isArray(c.v) && maintenant - c.t < 600_000) v = c.v;
    } catch { /* pas de mémoire : on demande */ }
    if (!v) {
      try {
        const d = await fetch('/api/football/feed', { credentials: 'same-origin' }).then((r) => (r.ok ? r.json() : null));
        if (Array.isArray(d?.feed)) {
          v = d.feed.flatMap((x) => x.next ?? [])
            .filter((x) => Date.parse(x.kickoff_at) > maintenant && !SANS_COUP.includes(x.status_short))
            .sort((a, b) => Date.parse(a.kickoff_at) - Date.parse(b.kickoff_at))
            .map((f) => ({ kickoff_at: f.kickoff_at, statut: f.status_short ?? null,
              home_id: f.home_id, away_id: f.away_id, home_name: f.home_name, away_name: f.away_name }));
          try { sessionStorage.setItem(PROCHAINS, JSON.stringify({ t: maintenant, qui, v })); } catch { /* tant pis */ }
        }
      } catch { /* hors ligne : pas de compte à rebours */ }
    }
    // Le premier à venir, s'il a son heure (NS) : sinon, rien à annoncer.
    const p = (v ?? []).find((x) => Date.parse(x.kickoff_at) > Date.now());
    prochainLu = p?.statut === 'NS' ? p : null;
    if (!S && !$('matchs').querySelector('.camps')) peindre();
  }
  function prochainCoup() {
    const dansLaListe = matchs
      .filter((m) => m.mien && !m.open && !m.fini && m.status_short === 'NS'
        && Date.parse(m.kickoff_at) > Date.now())
      .sort((a, b) => Date.parse(a.kickoff_at) - Date.parse(b.kickoff_at))[0];
    if (dansLaListe) return dansLaListe;
    if (prochainLu && Date.parse(prochainLu.kickoff_at) > Date.now()) return prochainLu;
    lireProchain();
    return null;
  }
  const attente = () => {
    const p = prochainCoup();
    return `<div class="attente">
      ${p ? `<a class="tbf-plaque prochain" href="/matchs"><small>PROCHAIN COUP D’ENVOI</small>
        <b>${esc(rebours(p.kickoff_at))}</b><span>${esc(p.home_name)} – ${esc(p.away_name)}</span></a>` : ''}
      <a class="tbf-plaque" href="/repetition">RÉPÉTER EN ATTENDANT</a>
      <a class="tbf-plaque" data-ton="bleu" href="/equipes">SUIVRE UN CLUB</a>
    </div>`;
  };

  const peindre = () => {
    /* Le champ ne paraît qu'à partir du moment où il sert. */
    $('rech').hidden = matchs.length < 8 && !terme;

    const vus = filtrer(matchs).filter((m) => !SANS_COUP.includes(m.status_short));
    const miens = vus.filter((m) => m.mien);
    const autres = vus.filter((m) => !m.mien && m.open);
    const part = Math.round((FERVEUR_NEUTRE ?? 0.5) * 100);
    fouleMax = Math.max(1, ...vus.map((m) => (m.crowd?.[0] ?? 0) + (m.crowd?.[1] ?? 0)));

    /* **Sans direct, on le dit au-dessus de la liste** : la liste se voit,
       l'entrée ne marchera pas. */
    const avertir = sansDirect ? `<div class="rubrique alerte">
      PAS DE CONNEXION EN DIRECT
      <small>tu peux voir les matchs, pas entrer dans le virage ·
      <a href="/diagnostic" style="color:var(--craie);font-weight:700">voir pourquoi</a></small>
      </div>` : '';

    const rien = !vus.some((m) => m.open);
    $('matchs').innerHTML = avertir + [
      miens.length ? `<div class="rubrique tbf-cousu">TES CLUBS</div>${miens.map(affiche).join('')}` : '',
      autres.length ? `<div class="rubrique tbf-cousu">AILLEURS EN DIRECT</div>
        <div class="rubrique-sous">tu choisis ton camp · ferveur à ${part} %</div>${autres.map(affiche).join('')}` : '',
      terme && !vus.length ? `<div class="vide">Aucun match ne répond à « ${esc(terme)} ».<br>
            Essaie un club, une compétition, ou un pays.</div>` : '',
      !terme && rien ? `<p class="vide">Aucun match en direct pour l’instant.</p>${attente()}` : '',
    ].join('');
  };
  peindre();

  /* **Entrer par un lien**, une fois la liste dessinée : le même geste
     qu'un toucher sur l'affiche — chez soi on entre, ailleurs le camp se
     demande, et l'affiche est amenée sous les yeux et marquée. */
  if (parLien) {
    const carteM = $('matchs').querySelector(`[data-id="${parLien}"]`);
    if (carteM) {
      carteM.click();
      carteM.scrollIntoView({ block: 'center', behavior: 'smooth' });
      carteM.classList.add('vise');
    } else {
      socket?.emit('virage:join', { fixtureId: parLien });
    }
  }

  /* ----------------------------------------------- faire venir du monde

     Le lien porte **le match**, pas la tribune : celui qui arrive choisit son
     camp comme tout le monde. Le bouton ne paraît que si le navigateur sait
     partager. */
  $('partager').hidden = !window.TBF_PARTAGE?.possible;
  $('partager').onclick = async (e) => {
    e.stopPropagation();
    const f = S?.fixture;
    const id = f?.id ?? demande;
    if (!id) return;
    const titre = f?.homeName && f?.awayName
      ? `${f.homeName} – ${f.awayName}` : 'un match en direct';
    const quoi = await window.TBF_PARTAGE.envoyer({
      titre: 'Le Grand Virage',
      texte: `Je pousse sur ${titre}. Viens tenir la corde avec moi.`,
      url: `/virage?match=${encodeURIComponent(id)}`,
    });
    if (quoi === 'copie') mot('Lien copié');
    else if (quoi === null) mot('Impossible de partager ici');
  };

  /* Court délai : filtrer à chaque frappe sur quarante matchs saccade. */
  {
    let t = null;
    $('q').oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => { terme = pli($('q').value.trim()); peindre(); }, 200);
    };
  }

  /* L'écran de choix vit aussi longtemps qu'un match : la liste se relit
     toutes les trente secondes — sauf pendant qu'un camp est proposé, la
     carte dépliée sous le doigt du joueur. */
  setInterval(async () => {
    if (S) return;
    if ($('matchs').querySelector('.camps')) return;
    if (await lire()) peindre();
  }, 30_000);

  /* Entrer. Chez soi, directement — le camp découle du club suivi. Ailleurs,
     l'affiche se déplie et propose les deux clubs en bâches à leurs
     couleurs : demander après coup, on aurait déjà poussé du mauvais côté. */
  $('matchs').onclick = (e) => {
    const camp = e.target.closest('[data-camp]');
    if (camp) {
      const carteM = camp.closest('[data-id]');
      socket?.emit('virage:join', {
        fixtureId: Number(carteM.dataset.id), camp: camp.dataset.camp,
      });
      return;
    }

    const m = e.target.closest('[data-id]');
    if (!m || m.classList.contains('off')) return;
    if (m.dataset.mien === '1') {
      socket?.emit('virage:join', { fixtureId: Number(m.dataset.id) });
      return;
    }
    if (m.querySelector('.camps')) { m.querySelector('.camps').remove(); return; }
    const info = matchs.find((x) => String(x.id) === m.dataset.id) ?? {};
    document.querySelectorAll('#matchs .camps').forEach((n) => n.remove());
    const [h1, h2] = (info.homeColors ?? []).map(lisible);
    const [a1, a2] = (info.awayColors ?? []).map(lisible);
    const teinte = (c1, c2) => [c1 && `--e1:${esc(c1)}`, c2 && `--e2:${esc(c2)}`].filter(Boolean).join(';');
    m.insertAdjacentHTML('beforeend', `<div class="camps">
      <span>Tu pousses pour</span>
      <button type="button" class="tbf-plaque tbf-plaque--club" data-camp="domicile"
        style="${teinte(h1, h2)}">${esc(info.home_name ?? 'Domicile')}</button>
      <button type="button" class="tbf-plaque tbf-plaque--club" data-camp="exterieur"
        style="${teinte(a1, a2)}">${esc(info.away_name ?? 'Extérieur')}</button>
    </div>`);
  };
  $('matchs').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.match[data-id]')) {
      e.preventDefault();
      e.target.click();
    }
  });
})();
</script>
