<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grand Virage — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:#05070A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(110% 30% at 50% 0%,rgba(60,130,232,.15),transparent 60%),
             radial-gradient(110% 30% at 50% 100%,rgba(245,195,59,.15),transparent 60%),
             linear-gradient(180deg,#141A21,#0A0D11 50%,#141A21);overflow:hidden}
#app.quake{animation:quake .7s}
@keyframes quake{0%,100%{transform:translate(0,0)}12%{transform:translate(-7px,4px)}
  32%{transform:translate(6px,-5px)}56%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}

/* La réserve à droite est celle du bouton de menu, qui flotte au-dessus de
   l'écran depuis que la barre du bas a disparu. Sans elle, il se pose sur le
   nom du club de droite — et c'est justement le sien. */
.hud{display:flex;align-items:center;gap:9px;padding:10px 58px 4px 13px;flex:none;z-index:5}
.club{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.club.me{flex-direction:row-reverse;text-align:right}
.club img{width:26px;height:26px;object-fit:contain;flex:none}
.club b{font-family:var(--banner);font-size:13px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.club small{font-size:9.5px;opacity:.5;letter-spacing:.1em}
.score{font-family:var(--banner);font-size:24px;flex:none;min-width:64px;text-align:center;line-height:1}
.score small{display:block;font-size:8.5px;letter-spacing:.16em;opacity:.5;font-family:var(--ui);margin-top:3px}
.score.surge{color:var(--projo);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ------------------------------------------------------------- le fil

   Une bande, pas un panneau. L'écran du virage est déjà plein — la corde, le
   souffle, cinq cartes — et le fil ne doit pas prendre la place du jeu : il
   donne le score réel, la minute et la dernière chose arrivée sur le terrain.
   Le reste attend qu'on le demande.

   Le score affiché ici est celui du **vrai match**, pas celui de la tribune
   qui est en haut. Les confondre serait pire que de ne rien montrer : le
   joueur pousse sur une corde dont le score n'a rien à voir avec la rencontre,
   et c'est précisément ce que le fil est là pour démêler — d'où le mot
   « TERRAIN » sous les chiffres. */
.fil{flex:none;display:flex;align-items:center;gap:9px;margin:0 13px 5px;padding:6px 10px;
  border-radius:9px;background:rgba(0,0,0,.34);border:1px solid rgba(242,238,228,.12);
  cursor:pointer;min-height:40px;text-align:left}
.fil .sc{flex:none;padding-right:9px;border-right:1px solid rgba(242,238,228,.14);line-height:1}
.fil .sc b{font-family:var(--banner);font-size:13px;letter-spacing:.03em;display:block}
/* Ce libellé porte tout le sens de la bande : sans lui, deux scores se
   suivent à l'écran sans qu'on sache lequel est le match. À 8 px et 45 %
   d'opacité il ne se lisait pas — autant l'enlever. */
.fil .sc small{display:block;font-size:8.5px;letter-spacing:.12em;opacity:.55;margin-top:2px}
/* La minute du match. Elle défile localement entre deux relevés — sans quoi
   elle restait figée sur celle de l'entrée, parfois une demi-heure durant, et
   le joueur poussait en croyant le match arrêté. Le point rouge dit que ça
   tourne ; il s'éteint à la mi-temps. */
.fil .min{flex:none;font-family:var(--banner);font-size:12.5px;color:var(--flare);
  letter-spacing:.04em;display:flex;align-items:center;gap:5px;padding-right:9px;
  border-right:1px solid rgba(242,238,228,.14);font-variant-numeric:tabular-nums}
.fil .min::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:ping 1.8s ease-out infinite}
.fil .min:empty{display:none}
.fil .min.arret{color:var(--gris)}
.fil .min.arret::before{animation:none;opacity:.5}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,64,44,.6)}
  70%{box-shadow:0 0 0 7px rgba(224,64,44,0)}100%{box-shadow:0 0 0 0 rgba(224,64,44,0)}}

.fil .der{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;
  overflow:hidden;white-space:nowrap}
.fil .der .m{font-family:var(--banner);font-size:11px;opacity:.55;flex:none}
.fil .der .t{overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.fil .der .t small{opacity:.5}
.fil .plus{flex:none;opacity:.4;font-size:14px;font-family:var(--banner)}
/* Une entrée neuve se signale une seconde et demie, puis se tait. Un fil qui
   clignote en permanence cesse d'être lu au bout de deux minutes. */
.fil.neuf{animation:filneuf 1.5s ease-out}
@keyframes filneuf{0%{border-color:var(--projo);background:rgba(245,195,59,.2)}
  100%{border-color:rgba(242,238,228,.12);background:rgba(0,0,0,.34)}}

/* Au-dessus des effets, et c'est délibéré.
   `fx.js` occupe les calques 89 à 93 avec des bandeaux en plein écran. Le
   « MINUTE DOUBLE » d'un but recouvrait la tête de la feuille, donc le bouton
   de fermeture, pendant deux secondes. Un plein écran dont on ne s'échappe
   qu'en attendant la fin d'une animation est la même faute que le booster
   dont la seule issue était de recharger la page. Et le choix est cohérent :
   qui a ouvert le fil regarde le fil, qui lui annonce déjà le but. */
.feuille{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:440px;z-index:95;display:none;flex-direction:column;
  background:rgba(5,7,10,.96)}
.feuille.on{display:flex}
.feuille .tete{flex:none;display:flex;align-items:center;gap:10px;padding:14px 15px 10px}
.feuille .tete b{font-family:var(--banner);font-size:15px;letter-spacing:.1em;flex:1}
.feuille .tete #feuilleScore{opacity:.6;font-size:12px;font-variant-numeric:tabular-nums}
.feuille .tete .x{width:34px;height:34px;border-radius:9px;border:1px solid rgba(242,238,228,.16);
  background:rgba(0,0,0,.3);color:inherit;font-size:17px;cursor:pointer;flex:none}
.feuille .corps{flex:1;min-height:0;overflow-y:auto;padding:0 15px 18px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-top:1px solid rgba(242,238,228,.07)}
.ev .min{font-family:var(--banner);font-size:13px;width:38px;opacity:.6;flex:none}
.ev .ic{width:20px;text-align:center;flex:none}
.ev .txt{flex:1;min-width:0}
.ev .txt small{display:block;opacity:.45;font-size:10.5px}
.ev.droite{flex-direction:row-reverse;text-align:right}
.ev.droite .txt{text-align:right}
/* Le virage a sa propre voix dans le fil : ce qu'a fait la tribune est en
   couleur, le terrain reste en craie. Sans cette distinction, « BUT » se lit
   comme un but du match et le joueur croit que son club vient de marquer. */
.ev.tribune{color:var(--projo)}
.ev.periode{opacity:.55;justify-content:center;font-family:var(--banner);
  font-size:11px;letter-spacing:.16em}
.ev.periode .min,.ev.periode .ic{display:none}
.feuille .vide{text-align:center;opacity:.45;font-size:12px;padding:40px 20px;line-height:1.7}

.rope{flex:1;position:relative;min-height:0}
/* Le stade en fond de corde.

   `object-fit: cover` recadrerait sur la hauteur dès que la zone est plus
   étroite que le dessin — et c'est précisément les deux tribunes, sur les
   côtés, qu'on perdrait. On impose donc la largeur et on laisse la hauteur
   déborder : le terrain se coupe en haut et en bas, jamais sur les bords. */
.stade{position:absolute;inset:0;overflow:hidden;border-radius:14px;
  pointer-events:none;z-index:0}
/* L'atténuation porte sur **le dessin seul**, pas sur le calque.
   Posée sur `.stade`, elle éteignait aussi la lumière des tribunes — or c'est
   précisément ce qu'on veut voir : le décor doit s'effacer derrière le jeu,
   la tribune qui pousse doit se voir. */
.stade .tbf-stade-fond{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%);object-fit:unset;opacity:.5}
.track{position:absolute;left:50%;top:12px;bottom:12px;width:14px;transform:translateX(-50%);
  border-radius:8px;background:linear-gradient(180deg,rgba(60,130,232,.5),rgba(20,24,30,.6) 46%,
  rgba(20,24,30,.6) 54%,rgba(245,195,59,.5));border:1px solid rgba(242,238,228,.12)}
.knot{position:absolute;left:50%;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#2B333F,#0C1015);
  border:2px solid rgba(242,238,228,.28);box-shadow:0 0 30px rgba(0,0,0,.75);
  transition:top .12s linear;z-index:2;font-family:var(--banner);font-size:16px}
.mid{position:absolute;left:50%;top:50%;width:56px;height:1px;transform:translate(-50%,-50%);
  background:rgba(242,238,228,.2)}
.crowd{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.16em;opacity:.5}
.crowd.top{top:6px}.crowd.bot{bottom:6px}
.crowd b{opacity:.95}
/* Le Fanzzy, dans le bas de la tribune — du côté du joueur, puisque la corde
   se pousse vers le haut, chez l'adversaire. À gauche du nœud et non derrière :
   pendant un geste, le nombre qui bouge est la seule chose qu'on lit, et un
   personnage posé dessous le rendrait illisible.

   `pointer-events:none` : le virage se joue au doigt sur les cartes et sur le
   pavé du geste. Un personnage qui intercepterait un appui coûterait un chant. */
.fzs{position:absolute;left:1%;bottom:0;width:41%;height:56%;z-index:1;pointer-events:none}

.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--banner);
  font-size:15px;letter-spacing:.18em;opacity:0;transition:opacity .3s;z-index:4;color:var(--projo)}
.banner.on{opacity:1}
.float{position:absolute;font-family:var(--banner);font-size:17px;pointer-events:none;z-index:6;
  animation:drift 1.2s ease-out forwards}
@keyframes drift{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-42px)}}

.me-bar{flex:none;padding:0 13px 6px}
.me-bar .l{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.14em;opacity:.45;margin-bottom:4px}
.me-bar .b{height:7px;border-radius:4px;background:rgba(242,238,228,.1);overflow:hidden}
.me-bar .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vert),var(--projo));
  transition:width .3s}
.rank{text-align:center;font-size:11px;opacity:.6;padding-bottom:6px}
.rank b{color:var(--projo);font-family:var(--banner);font-size:14px}

/* Même règle que sur les autres écrans de jeu : nav.js n'en réserve que 55 %,
   la page complète les 45 % manquants. En marge et non en marge intérieure,
   parce que la hauteur des cartes est fixe et qu'une marge intérieure les
   écraserait au lieu de les remonter. */
.hand{flex:none;display:flex;gap:6px;padding:4px 11px calc(12px + env(safe-area-inset-bottom));
  height:104px;margin-bottom:calc(var(--nav-h,62px) * .45)}
.card{flex:1;border-radius:9px;padding:8px 7px;background:rgba(0,0,0,.34);position:relative;cursor:pointer;
  border:1px solid rgba(242,238,228,.14);border-top:3px solid var(--c);display:flex;flex-direction:column;gap:3px}
.card:active{transform:translateY(3px) scale(.98)}
.card.dim{opacity:.32}
.card b{font-family:var(--banner);font-size:11.5px;line-height:1.1}
.card .g{font-size:8px;letter-spacing:.12em;opacity:.5;text-transform:uppercase}
.card .p{font-family:var(--banner);font-size:20px;color:var(--c);margin-top:auto;line-height:1}
.card .c{position:absolute;top:6px;right:7px;font-size:10px;opacity:.55;font-family:var(--banner)}

/* ------------------------------------------- les cartes d'action

   Une rangée basse au-dessus des chants. Le dessin porte la carte, le nom
   n'est qu'un rappel : à cette taille on reconnaît une torche bien avant
   d'avoir lu « Torche ». */
.actes{flex:none;display:flex;gap:5px;padding:0 11px 5px}
.acte{flex:1;position:relative;aspect-ratio:.74;max-height:74px;border-radius:7px;overflow:hidden;
  border:1px solid var(--fc,#8257DA);cursor:pointer;
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(0,0,0,.4));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:2px;padding:3px 2px 4px}
.acte:active{transform:translateY(3px) scale(.98)}
.acte .sceau{position:absolute;left:50%;top:44%;width:64%;height:auto;
  transform:translate(-50%,-50%);opacity:.24;color:var(--fc,#8257DA);
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.acte .illu{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 34%;filter:brightness(.6)}
.acte::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,10,.45),transparent 42%,rgba(4,6,10,.92))}
.acte .co{position:relative;z-index:2;font-family:var(--banner);font-size:10.5px;
  color:var(--craie);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.acte .nm{position:relative;z-index:2;font-size:6.5px;line-height:1.1;text-align:center;
  opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.9);padding:0 2px}
.acte.hs{opacity:.34;cursor:default}
/* Le compte à rebours passe devant le voile, sinon le chiffre s'assombrit. */
.acte .cd{position:absolute;inset:0;z-index:3;background:rgba(4,6,10,.72);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--banner);font-size:12px;color:var(--craie)}
.acte.vide{border-style:dashed;border-color:rgba(242,238,228,.14);cursor:default}
.acte.vide::after{display:none}

/* La fenêtre collective ouverte par quelqu'un d'autre. Elle appartient à toute
   la tribune : c'est la seule chose qu'un joueur voit arriver d'une main qui
   n'est pas la sienne, et elle doit donc se voir de loin. */
.appel{flex:none;margin:0 11px 5px;border-radius:8px;padding:7px 10px 6px;text-align:center;
  font-family:var(--banner);font-size:11.5px;letter-spacing:.12em;
  color:#0B0E13;background:linear-gradient(180deg,#8FE3B8,var(--vert));
  box-shadow:0 3px 0 #0D4F35;animation:appelBat .8s ease-in-out infinite}
.appel small{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.04em;opacity:.72}
@keyframes appelBat{50%{transform:scale(1.025)}}

.mini{position:absolute;inset:0;background:rgba(5,7,10,.94);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:22px}
.mini.on{display:flex}
.mini h3{font-family:var(--banner);font-size:22px;letter-spacing:.1em;margin:0;color:var(--c)}
.mini p{margin:0;font-size:12px;opacity:.6}
.pad{width:206px;height:206px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:2px solid rgba(242,238,228,.2);background:rgba(255,255,255,.03);cursor:pointer}
.pad.hit{background:rgba(245,195,59,.16)}
.pad .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);opacity:0}
.pad .ring.beat{animation:beat .42s ease-out}
@keyframes beat{from{opacity:.9;transform:scale(.72)}to{opacity:0;transform:scale(1.12)}}
.pad .n{font-family:var(--banner);font-size:48px;line-height:1}
.pad .s{font-size:10.5px;opacity:.5;letter-spacing:.13em;margin-top:3px}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--banner);
  font-size:84px;color:var(--c);pointer-events:none;animation:cd .55s ease-out}
@keyframes cd{from{opacity:0;transform:scale(1.5)}60%{opacity:1}to{opacity:0;transform:scale(.85)}}
.verdict{font-family:var(--banner);font-size:16px;letter-spacing:.12em;height:20px}

.veil{position:absolute;inset:0;background:rgba(5,7,10,.96);z-index:30;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow-y:auto}
.veil.on{display:flex}
.veil h1{font-family:var(--banner);font-size:24px;letter-spacing:.1em;margin:0}
.veil p{font-size:12.5px;opacity:.62;line-height:1.6;margin:0;max-width:320px}
.match{width:100%;max-width:340px;border:1px solid rgba(242,238,228,.16);border-radius:10px;
  background:rgba(0,0,0,.3);padding:12px;cursor:pointer;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}
.match.off{opacity:.4;pointer-events:none}
.match img{width:24px;height:24px;object-fit:contain}
.match .n{flex:1;min-width:0;text-align:left}
.match .n b{font-family:var(--banner);font-size:13px;display:block}
.match .n small{font-size:10px;opacity:.5}
/* Deux sections dans l'écran de choix : chez soi, puis ailleurs. La seconde
   dit tout de suite ce qu'elle coûte — une règle qu'on découvre au classement
   est une règle qu'on prend pour un bug. */
.rubrique{width:100%;max-width:340px;text-align:left;font-family:var(--banner);
  font-size:10px;letter-spacing:.2em;opacity:.45;margin:14px 0 2px}
.rubrique small{display:block;font-family:var(--ui);font-size:9.5px;letter-spacing:.06em;
  opacity:.8;margin-top:3px;text-transform:none}
.match.ailleurs{border-style:dashed}
/* Le choix du camp, déplié sous la carte. Demander après coup, une fois
   dedans, serait pire : on aurait déjà poussé du mauvais côté. */
.camps{flex-basis:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding-top:10px;margin-top:2px;border-top:1px solid rgba(242,238,228,.12)}
.camps span{font-size:10.5px;opacity:.55;flex:none}
.camps button{flex:1;min-width:96px;border:0;border-radius:9px;color:inherit;cursor:pointer;
  padding:9px 8px 8px;font-family:var(--banner);font-size:11.5px;letter-spacing:.06em;
  background:rgba(16,22,31,.95);
  box-shadow:0 3px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(242,238,228,.11)}
.camps button:active{transform:translateY(3px);box-shadow:none}

.match .st{font-family:var(--banner);flex:none;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;letter-spacing:.08em}
/* Le score domine la minute : c'est lui qu'on cherche avant d'entrer. */
.match .st .sc{font-size:16px;line-height:1;color:var(--craie)}
.match .st i{font-style:normal;font-size:10.5px;color:var(--flare)}
.err{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);z-index:18;
  background:rgba(224,64,44,.92);border-radius:6px;padding:9px 15px;font-size:12.5px;display:none}
.err.on{display:block}
/* La carte-souvenir passe même par-dessus le fil : c'est ce que le joueur est
   venu chercher, elle dure quatre secondes, et elle annonce un gain. */
.souvenir{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:96;
  border:2px solid var(--projo);border-radius:12px;background:#12161C;padding:20px 24px;text-align:center;
  display:none;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.souvenir.on{display:block;animation:pop .5s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.8)}}
.souvenir .t{font-family:var(--banner);font-size:11px;letter-spacing:.2em;color:var(--projo)}
.souvenir .m{font-family:var(--banner);font-size:22px;margin:8px 0 4px}
.souvenir .d{font-size:11.5px;opacity:.6}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">

<body>
<main id="app">
  <div class="hud">
    <div class="club" id="clubFoe"><img alt=""><div><b>—</b><small>EN FACE</small></div></div>
    <div class="score"><span id="score">0 – 0</span><small id="phase">GRAND VIRAGE</small></div>
    <div class="club me" id="clubMe"><img alt=""><div><b>—</b><small>TA TRIBUNE</small></div></div>
  </div>

  <button class="fil" id="fil" hidden aria-haspopup="dialog">
    <span class="sc"><b id="filScore">0 – 0</b><small>TERRAIN</small></span>
    <span class="min" id="filMinute"></span>
    <span class="der" id="filDer"></span>
    <span class="plus">›</span>
  </button>

  <div class="rope" id="rope">
    <!-- Le stade, sous tout le reste. Terrain au milieu, les deux tribunes sur
         les côtés, et la corde qui descend le long de la pelouse : c'est la
         disposition qui garde le cadrage des dessins intact. -->
    <div class="stade" id="stade"></div>
    <div class="track"></div><div class="mid"></div>
    <div class="crowd top" id="crowdFoe"></div>
    <div class="crowd bot" id="crowdMe"></div>
    <!-- Le Fanzzy équipé. La scène est montée par `fanzzy-scene.js` : la page
         ne fait que lui prêter cette boîte. -->
    <div class="fzs" id="fzs"></div>
    <div class="knot" id="knot">0</div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="me-bar">
    <div class="l"><span>SOUFFLE</span><span id="breathVal">0</span></div>
    <div class="b"><i id="breathBar"></i></div>
  </div>
  <div class="rank" id="rank"></div>
  <!-- Les cartes d'action, au-dessus des chants. Petites, et c'est voulu : au
       Virage le verbe principal reste le chant, la carte est ce qu'on ajoute. -->
  <div class="appel" id="appel" hidden></div>
  <div class="actes" id="actes" hidden></div>
  <div class="hand" id="hand"></div>

  <div class="mini" id="mini">
    <h3 id="miniTitle"></h3>
    <div id="miniZone"></div>
    <p id="miniHint"></p>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="err" id="err"></div>
  <div class="souvenir" id="souvenir"></div>

  <div class="veil on" id="veil">
    <h1 id="veilTitle">LE GRAND VIRAGE</h1>
    <p id="veilText">Tout le monde pousse sur la même corde pendant le vrai match. Un but réel la secoue et ouvre une minute où tout compte double.</p>
    <div id="matchs"></div>
  </div>
</main>

<!-- La feuille du fil vit **hors de la colonne**, et c'est nécessaire :
     `ui.css` donne à `#app` un `z-index: 1` pour le poser au-dessus du décor,
     ce qui en fait un contexte d'empilement. Tout ce qui est dedans y est
     enfermé, quel que soit son propre `z-index` — et les effets de `fx.js`,
     posés sur `body` aux calques 89 à 93, recouvraient donc la tête de la
     feuille, bouton de fermeture compris, pendant les trois secondes d'un
     bandeau « MINUTE DOUBLE ». Un panneau qu'on ouvre doit rester lisible et
     refermable pendant qu'il est ouvert. -->
<div class="feuille" id="feuille" role="dialog" aria-modal="true" aria-label="Le fil du match">
  <div class="tete">
    <b>LE FIL</b>
    <span id="feuilleScore"></span>
    <button class="x" id="feuilleX" aria-label="Fermer">×</button>
  </div>
  <div class="corps" id="feuilleCorps"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<!-- Le personnage : le dessin, ses douze états, et la scène qui les enchaîne.
     Chargés sans `defer` — la scène se monte dès l'entrée dans le virage, et
     un but peut tomber la seconde d'après. -->
<!-- L’horloge du match : la même sur les trois écrans qui l’affichent. -->
<script src="/horloge.js"></script>
<script src="/fanzzy-art.js"></script>
<!-- Les familles de cartes, leurs dessins, et la carte qu'on voit partir. La
     même que le classeur et le duel : le Virage n'a pas sa propre idée d'une
     carte d'action. -->
<script src="/action-art.js"></script>
<!-- Le stade et la lumière de ses tribunes. -->
<script src="/stade-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fanzzy-scene.js"></script>
<script>
/* =======================================================================
   Grand Virage — client.
   Il n'évalue rien : il envoie les instants de frappe et affiche ce que le
   serveur renvoie. La corde arrive dix fois par seconde, agrégée pour toute
   la tribune.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
/* Le fil porte des noms de joueurs venus de l'API : ils passent par `esc`
   avant d'entrer dans la page. Même forme que sur les autres écrans. */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const buzz = (p) => { try { navigator.vibrate?.(p); } catch {} };
const COLORS = { tempo:'#F5C33B', mash:'#3C82E8', hold:'#C2CAD6' };
const LABEL = { tempo:'TEMPO', mash:'MARTELAGE', hold:'ENDURANCE' };
const HINT = {
  tempo:'Tape sur chaque pulsation',
  mash:'Tape le plus vite possible',
  hold:'Garde le doigt appuyé',
};
const GOAL_AT = 400;

let socket = null, S = null, busy = false;
// La part de ferveur d'un neutre. Le serveur la donne avec la liste des
// matchs ; cette valeur n'est qu'un repli pour le premier rendu.
let FERVEUR_NEUTRE = 0.5;

/* ------------------------------------------------------------ affichage */

function renderStatic() {
  const f = S.fixture, mine = S.you.side;
  const me = mine === 0 ? { n:f.homeName, l:f.homeLogo } : { n:f.awayName, l:f.awayLogo };
  const foe = mine === 0 ? { n:f.awayName, l:f.awayLogo } : { n:f.homeName, l:f.homeLogo };
  $('clubMe').querySelector('b').textContent = me.n;
  $('clubMe').querySelector('img').src = me.l ?? '';
  $('clubFoe').querySelector('b').textContent = foe.n;
  $('clubFoe').querySelector('img').src = foe.l ?? '';

  $('hand').innerHTML = S.cards.map((c) => `
    <div class="card" data-card="${c.id}" style="--c:${COLORS[c.gest]}">
      <span class="c">${c.cost}</span><b>${c.id}</b>
      <span class="g">${LABEL[c.gest]}</span><span class="p">${c.power}</span>
    </div>`).join('');
}

function render() {
  const mine = S.you.side;
  const h = $('rope').clientHeight;
  // La corde est stockée « côté extérieur positif » ; on la retourne pour que
  // pousser vers le haut veuille toujours dire pousser chez l'adversaire.
  const vers = mine === 0 ? -S.rope : S.rope;
  const pct = Math.max(-1, Math.min(1, vers / GOAL_AT));
  $('knot').style.top = `${h / 2 - pct * (h / 2 - 38)}px`;
  $('knot').textContent = Math.abs(Math.round(vers));
  $('score').textContent = `${S.goals[mine]} – ${S.goals[mine ^ 1]}`;
  $('score').className = 'score' + (S.surge ? ' surge' : '');
  $('phase').textContent = S.surge ? 'TOUT COMPTE DOUBLE' : 'GRAND VIRAGE';
  $('crowdMe').innerHTML = `<b>${S.crowd[mine]}</b> AVEC TOI`;
  $('crowdFoe').innerHTML = `<b>${S.crowd[mine ^ 1]}</b> EN FACE`;
  // Le souffle affiché est celui du serveur **plus le regain écoulé depuis** :
  // la jauge monte donc en continu au lieu de sauter d'un chant à l'autre.
  const souffle = Math.round(souffleCourant());
  $('breathBar').style.width = `${souffle}%`;
  $('breathVal').textContent = souffle;
  if (S.you.rank) $('rank').innerHTML = `<b>${S.you.rank}<sup>e</sup></b> sur ${S.you.of} · ${S.you.ferveur} de ferveur`;
  for (const el of $('hand').children) {
    const c = S.cards.find((x) => x.id === el.dataset.card);
    el.classList.toggle('dim', souffle < c.cost || busy);
  }
  /* L'état de repos du personnage suit la minute double : il pousse tant
     qu'elle dure, il attend le reste du temps. `poserFond` ne coupe jamais une
     célébration en cours — c'est ce qui empêche la minute double d'effacer le
     but qui vient de l'ouvrir. */
  scene?.poserFond(S.surge ? 'pousse' : 'attente');
  renderActes();
  monterStade();
  eclairerStade();
}

/* ------------------------------------------------------------- le fil

   Le serveur envoie des entrées **structurées** — un genre, un code, une
   minute — et jamais de phrase toute faite. Le français vit ici, dans la page,
   qui sait déjà dans quelle langue elle est. C'est la même règle que pour les
   codes d'erreur.

   Le vocabulaire des icônes est celui de la fiche de match dans /matchs : un
   même événement doit se lire pareil aux deux endroits. */

const ICONES = { Goal:'⚽', Card:'▮', subst:'⇄', Var:'▣', tribune:'✊' };
const PERIODES = {
  '1H':'COUP D’ENVOI', HT:'MI-TEMPS', '2H':'REPRISE', BT:'FIN DU TEMPS RÉGLEMENTAIRE',
  ET:'PROLONGATIONS', P:'TIRS AU BUT', FT:'COUP DE SIFFLET FINAL',
  AET:'FIN APRÈS PROLONGATIONS', PEN:'FIN AUX TIRS AU BUT',
};

/* Le détail vient de l'API, donc en anglais. Il était affiché tel quel :
   le fil annonçait « Goal » et « Red Card » au milieu d'une page en français.
   Ce qui n'est pas traduit passe quand même — un détail rare vaut mieux en
   anglais qu'effacé, parce qu'il dit encore quelque chose. */
const DETAILS = {
  'Normal Goal':'But', 'Own Goal':'Contre son camp', Penalty:'Sur penalty',
  'Missed Penalty':'Penalty manqué',
  'Yellow Card':'Carton jaune', 'Red Card':'Carton rouge',
  'Second Yellow card':'Deuxième jaune',
  'Goal cancelled':'But refusé', 'Penalty confirmed':'Penalty accordé',
  Goal:'But', Card:'Carton', subst:'Remplacement', Var:'Arbitrage vidéo',
};
/* « Substitution 1 », « Substitution 2 »… : le numéro ne dit rien au
   supporter, seul le geste compte. */
const ditDetail = (d) => DETAILS[d] ?? (/^Substitution/.test(d ?? '') ? 'Remplacement' : d);

/** Le libellé d'une entrée : ce qu'on lit, et le détail sous la ligne. */
function ditLeFil(e) {
  if (e.genre === 'periode') return { titre: PERIODES[e.type] ?? e.type, detail: '' };
  if (e.genre === 'tribune') {
    const mien = e.side === S?.you?.side;
    return { titre: mien ? 'BUT DE TA TRIBUNE' : 'LA CORDE A CÉDÉ',
             detail: `${e.goals?.[0] ?? 0} – ${e.goals?.[1] ?? 0} à la corde` };
  }
  return { titre: e.joueur ?? ditDetail(e.detail ?? e.type),
           detail: [ditDetail(e.detail ?? e.type), e.passeur].filter(Boolean).join(' · ') };
}

/** L'icône, avec la couleur du carton — rouge et jaune ne se valent pas. */
function iconeDuFil(e) {
  if (e.genre === 'tribune') return `<span style="color:var(--projo)">✊</span>`;
  if (e.type === 'Card') {
    return `<span style="color:${/red/i.test(e.detail ?? '') ? 'var(--flare)' : 'var(--projo)'}">▮</span>`;
  }
  return ICONES[e.type] ?? '•';
}

const minuteDuFil = (e) =>
  e.minute == null ? '' : `${e.minute}${e.extra ? '+' + e.extra : ''}'`;

/** Le score du vrai match, du point de vue du joueur — comme partout ailleurs. */
function scoreTerrain() {
  if (!S?.scoreReel) return '—';
  const mine = S.you.side;
  return `${S.scoreReel[mine]} – ${S.scoreReel[mine ^ 1]}`;
}

/* ------------------------------------------------------ l'horloge du match

   Le serveur ne parle qu'au rythme du relevé — vingt secondes au mieux, et
   seulement quand quelque chose bouge. La minute restait donc figée sur celle
   de l'entrée, parfois pendant une demi-heure : le joueur poussait sur une
   corde en croyant le match arrêté.

   Elle défile donc **localement**, à partir de la dernière minute connue et du
   temps écoulé depuis. C'est exactement ce que fait la page des matchs, et
   c'est la seule façon d'avoir un chrono qui avance sans payer un appel par
   seconde. Chaque `virage:match` la remet à l'heure. */
/* L'horloge du match vit dans `/horloge.js`, partagée avec la page des
   matchs et la fiche d'un match. Elle était écrite trois fois, avec déjà
   trois listes de périodes différentes — celle-ci connaissait les tirs au
   but, celle des matchs non. Une horloge qui ne dit pas la même chose d'un
   écran à l'autre est pire qu'une horloge absente : elle fait douter des deux.

   Les deux fonctions restent ici, sous leurs noms : c'est par elles que la
   page — et ses contrôles — demandent l'heure. */

/** L'état de l'horloge : `{ n, extra, arret }`, ou `null` si on ne sait pas. */
function minuteCourante() {
  return window.TBF_HORLOGE.etat(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** « 71′ », « 45+3′ », « 90+′ » — ou rien quand on ne sait pas. */
function minuteTexte() {
  return window.TBF_HORLOGE.texte(
    { statut: S?.statut, minute: S?.minute, extra: S?.minuteExtra, vuA: S?.vuA });
}

/** Le souffle, animé entre deux vérités du serveur. */
let souffleVuA = Date.now();

function souffleCourant() {
  const you = S?.you;
  if (!you) return 0;
  if (!you.regen) return you.breath;
  const gagne = you.regen * ((Date.now() - souffleVuA) / 1000);
  return Math.min(you.breathMax ?? 100, you.breath + gagne);
}

function renderFil({ neuf = false } = {}) {
  if (!S) return;
  $('fil').hidden = false;
  $('filScore').textContent = scoreTerrain();

  const min = minuteCourante();
  $('filMinute').textContent = minuteTexte();
  $('filMinute').classList.toggle('arret', Boolean(min?.arret));

  const der = S.fil?.[S.fil.length - 1];
  $('filDer').innerHTML = der
    ? `<span class="m">${minuteDuFil(der)}</span><span class="t">${iconeDuFil(der)}
       ${esc(ditLeFil(der).titre)}</span>`
    : `<span class="t"><small>Rien à signaler pour l’instant</small></span>`;

  if (neuf) {
    const b = $('fil');
    b.classList.remove('neuf'); void b.offsetWidth; b.classList.add('neuf');
  }
  if ($('feuille').classList.contains('on')) renderFeuille();
}

function renderFeuille() {
  const minF = minuteTexte();
  $('feuilleScore').textContent = minF
    ? `${scoreTerrain()} · ${minF}` : scoreTerrain();
  const fil = S?.fil ?? [];
  // Le plus récent en tête : on ouvre le fil pour savoir ce qu'on vient de
  // manquer, pas pour relire le coup d'envoi.
  $('feuilleCorps').innerHTML = fil.length
    ? fil.slice().reverse().map((e) => {
      const { titre, detail } = ditLeFil(e);
      if (e.genre === 'periode') return `<div class="ev periode">${esc(titre)}</div>`;
      const droite = e.side === (S.you.side ^ 1);
      return `<div class="ev ${droite ? 'droite' : ''} ${e.genre === 'tribune' ? 'tribune' : ''}">
        <span class="min">${minuteDuFil(e)}</span>
        <span class="ic">${iconeDuFil(e)}</span>
        <span class="txt">${esc(titre)}${detail ? `<small>${esc(detail)}</small>` : ''}</span>
      </div>`;
    }).join('')
    : `<div class="vide">Rien n’est encore arrivé sur le terrain.<br>
        Les cartons et les remplacements arrivent pendant que tu es dans le virage.</div>`;
}

const ouvrirFeuille = (oui) => {
  $('feuille').classList.toggle('on', oui);
  if (oui) renderFeuille();
};

$('fil').addEventListener('click', () => ouvrirFeuille(true));
$('feuilleX').addEventListener('click', () => ouvrirFeuille(false));
// On peut toujours sortir : c'est la règle de tout plein écran de ce jeu.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ouvrirFeuille(false); });

/* ---------------------------------------------------------- le personnage

   Le Fanzzy équipé pousse avec le joueur, dans le bas de la tribune. Ce n'est
   pas un décor : il change de pose quand on chante, il exulte au but réel, il
   encaisse, il encaisse aussi la décision de l'arbitrage vidéo.

   C'est le même personnage que sur l'accueil, monté par le même module — un
   supporter qui réagirait autrement d'un écran à l'autre serait un autre
   supporter. Le bandeau du moment fort, lui, est posé dans la corde et non
   dans la boîte du personnage : « GOAL ! » doit tenir toute la largeur, et
   cette boîte n'occupe qu'un coin.                                          */

const scene = window.TBF_SCENE?.creer?.($('fzs'), {
  momentDans: $('rope'), fond: 'attente',
}) ?? null;

/**
 * La couleur d'un camp, telle qu'on peut l'écrire à l'écran.
 *
 * Elle vient du blason du club, extrait une fois côté serveur. Deux gardes,
 * et chacune répare une faute qu'on ne voit qu'en direct : un club dont le
 * blason n'a pas encore été lu n'a pas de couleur du tout — on garde alors
 * l'or du jeu — et un bleu marine de blason, écrit sur le noir de l'écran,
 * ne se lit pas : `FX.lisible` l'éclaircit sans lui changer de teinte.
 */
function couleurDuCamp(cote, defaut = 'var(--projo)') {
  const c = cote === S?.you?.side
    ? (S?.fixture?.[S.you.side ? 'awayColors' : 'homeColors'] ?? [])
    : (S?.fixture?.[S.you.side ? 'homeColors' : 'awayColors'] ?? []);
  return c[0] ? (window.FX?.lisible?.(c[0]) ?? c[0]) : defaut;
}

/**
 * Ce que le personnage fait d'une entrée du fil.
 *
 * Trois choses seulement l'arrêtent : l'arbitrage vidéo, un carton rouge et
 * le coup de sifflet final. Le reste passe dans la bande du fil — un
 * personnage qui réagit à tout ne réagit plus à rien, et le joueur cesse de
 * le regarder au bout de deux remplacements.
 */
function reagirAuFil(e) {
  if (!scene || !S?.you) return;
  const mien = e.side === S.you.side;

  if (e.type === 'Var') {
    /* Un but refusé après la célébration. Sans état de déception et sans un
       mot sur la cause, le score se corrige tout seul à l'écran et le joueur
       y voit un bug — c'est le retour qu'on a eu. */
    scene.moment('decision', mien ? 'BUT REFUSÉ' : 'LEUR BUT EST REFUSÉ', {
      couleur: mien ? 'var(--flare)' : 'var(--vert)',
      sous: ditDetail(e.detail ?? '') || 'Décision de l’arbitrage vidéo',
    });
    return;
  }

  if (e.type === 'Card' && /red/i.test(e.detail ?? '')) {
    scene.moment(mien ? 'decision' : 'progression',
      mien ? 'CARTON ROUGE' : 'ROUGE POUR EUX', {
        couleur: mien ? 'var(--flare)' : 'var(--vert)',
        sous: e.joueur ?? '',
      });
    return;
  }

  // Les périodes qui closent un match sont celles de l’horloge partagée :
  // une seconde liste ici finirait par oublier les tirs au but.
  if (e.genre === 'periode' && window.TBF_HORLOGE.FINIES.has(e.type)) {
    const nous = S.scoreReel?.[S.you.side] ?? 0;
    const eux = S.scoreReel?.[S.you.side ^ 1] ?? 0;
    const etat = nous > eux ? 'victoire' : nous < eux ? 'defaite' : 'neutre';
    scene.moment(etat, nous > eux ? 'VICTOIRE' : nous < eux ? 'DÉFAITE' : 'MATCH NUL', {
      couleur: nous > eux ? 'var(--vert)' : nous < eux ? 'var(--flare)' : 'var(--gris)',
      sous: PERIODES[e.type] ?? '',
    });
  }
}

function banner(t, ms = 1800) {
  const b = $('banner'); b.textContent = t; b.classList.add('on');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('on'), ms);
}
function float(txt, color) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.color = color;
  el.style.left = '58%'; el.style.top = '46%';
  $('rope').appendChild(el); setTimeout(() => el.remove(), 1200);
}
function fail(code) {
  const e = $('err');
  e.textContent = ({
    'ferveur.error.not_enough_breath':'Pas assez de souffle',
    'ferveur.error.rate_limited':'Trop de chants d\u2019affilée',
    'ferveur.error.taps_too_fast':'Frappes trop rapprochées',
    'ferveur.error.inhuman_regularity':'Frappes trop régulières',
    'ferveur.error.not_your_match':'Aucun de tes clubs ne joue ce match',
    'ferveur.error.card_not_in_hand':'Cette carte n\u2019est plus dans ta main',
    'ferveur.error.card_on_cooldown':'Cette carte se recharge encore',
    'ferveur.error.card_not_in_virage':'Cette carte ne se joue qu\u2019en duel',
    'ferveur.error.condition_not_met':'Les conditions de cette carte ne sont pas réunies',
    'ferveur.error.evolution_locked':'L\u2019âge suivant de ton Fanzzy n\u2019est pas débloqué',
    'ferveur.error.not_in_virage':'Tu n\u2019es plus dans la tribune',
  })[code] ?? 'Refusé par le serveur';
  e.className = 'err on';
  clearTimeout(e._t); e._t = setTimeout(() => { e.className = 'err'; }, 2600);
}

/* ------------------------------------------------------------ les gestes
   Le client ne fait qu'enregistrer les instants et les transmettre. */

function openMini(card) {
  return new Promise((resolve) => {
    const m = $('mini');
    m.style.setProperty('--c', COLORS[card.gest]);
    $('miniTitle').textContent = LABEL[card.gest];
    $('miniHint').textContent = HINT[card.gest];
    $('verdict').textContent = '';
    m.classList.add('on');
    let k = 3;
    const tick = () => {
      if (k === 0) return run(card, resolve);
      const c = document.createElement('div');
      c.className = 'countdown'; c.textContent = k--;
      m.appendChild(c); setTimeout(() => c.remove(), 550); buzz(8);
      setTimeout(tick, 560);
    };
    tick();
  });
}

function closeMini(taps) {
  $('mini').classList.remove('on');
  $('miniZone').innerHTML = '';
  return taps;
}

function run(card, resolve) {
  const t0 = performance.now();
  const taps = [];

  /* Les durées viennent du serveur, jamais d'ici.
     Elles étaient écrites en dur — pulsation à 560 ms, martelage à 3 s — alors
     que la notation applique les modificateurs du Fanzzy et de l'équipement.
     Un porteur de Jumelles voyait donc un rythme et était jugé sur un autre :
     il tapait juste sur ce qu'on lui montrait et récoltait 0,36 au lieu de
     0,99. Plus sa carte était rare, plus il était puni. */
  const g = S?.you?.gestes;
  if (card.gest === 'tempo') {
    $('miniZone').innerHTML = `<div class="pad" id="pad"><div class="ring" id="ring"></div>
      <div style="text-align:center"><div class="n" id="n">0</div><div class="s">SUR LE RYTHME</div></div></div>`;
    let i = 0;
    const battements = g?.tempo?.beats ?? 8;
    const iv = setInterval(() => {
      const r = $('ring');
      if (r) { r.classList.remove('beat'); void r.offsetWidth; r.classList.add('beat'); }
      buzz(12);
      if (++i >= battements) { clearInterval(iv); setTimeout(() => resolve(closeMini(taps)), 420); }
    }, g?.tempo?.interval ?? 560);
    $('pad').onpointerdown = () => {
      taps.push(Math.round(performance.now() - t0));
      $('n').textContent = taps.length;
      $('pad').classList.add('hit'); setTimeout(() => $('pad')?.classList.remove('hit'), 80);
      buzz(14);
    };
  } else if (card.gest === 'mash') {
    $('miniZone').innerHTML = `<div class="pad" id="pad"><div style="text-align:center">
      <div class="n" id="n">0</div><div class="s">FRAPPES</div></div></div>`;
    $('pad').onpointerdown = () => {
      taps.push(Math.round(performance.now() - t0));
      $('n').textContent = taps.length;
      if (taps.length % 4 === 0) buzz(9);
    };
    setTimeout(() => resolve(closeMini(taps)), g?.mash?.ms ?? 3000);
  } else {
    $('miniZone').innerHTML = `<div class="pad" id="pad"><div style="text-align:center">
      <div class="n" id="n">0%</div><div class="s">NE LÂCHE PAS</div></div></div>`;
    const pad = $('pad');
    let down = null;
    const raf = () => {
      if (down !== null) {
        const held = performance.now() - t0 - down + taps.filter((_, i) => i % 2 === 1)
          .reduce((a, v, i) => a + (v - taps[i * 2]), 0);
        $('n').textContent = `${Math.min(100, Math.round((held / (g?.hold?.need ?? 3200)) * 100))}%`;
      }
      if ($('mini').classList.contains('on')) requestAnimationFrame(raf);
    };
    pad.onpointerdown = () => { if (down === null) { down = performance.now() - t0; taps.push(Math.round(down)); buzz(18); } };
    pad.onpointerup = pad.onpointercancel = () => {
      if (down === null) return;
      taps.push(Math.round(performance.now() - t0)); down = null;
    };
    requestAnimationFrame(raf);
    setTimeout(() => {
      if (down !== null) taps.push(Math.round(performance.now() - t0));
      resolve(closeMini(taps));
    }, (g?.hold?.need ?? 3200) + 400);
  }
}

$('hand').addEventListener('pointerdown', async (e) => {
  const el = e.target.closest('[data-card]');
  if (!el || busy || !S) return;
  const card = S.cards.find((c) => c.id === el.dataset.card);
  if (souffleCourant() < card.cost) return fail('ferveur.error.not_enough_breath');
  busy = true; render();
  const taps = await openMini(card);
  socket.emit('virage:chant', { cardId: card.id, taps });
  busy = false;
});

/* ----------------------------------------------------- le stade

   Le terrain au milieu, les deux tribunes sur les côtés, et la corde qui
   descend le long de la pelouse. C'est la disposition qui garde le cadrage
   des dessins : faire pivoter le stade d'un quart de tour pour aligner les
   tribunes sur le haut et le bas aurait coûté la moitié de l'image.

   La tribune de gauche est celle de **domicile**, la droite celle de
   l'extérieur — comme le vrai match, et quel que soit le camp qu'on a choisi.
   Le stade appartient à la rencontre, pas au joueur.

   Les tribunes s'éclairent aux couleurs des clubs, et leur intensité suit la
   corde : celle qui pousse brille, celle qui cède s'éteint. C'est la même
   information que le nœud, mais qu'on lit sans lire un chiffre. */

let stade = null;

function monterStade() {
  if (stade || !S?.stade || !window.TBF_STADE) return;
  /* `homeColors` et `awayColors` sont extraites des blasons et peuvent
     manquer — un club dont le blason n'a pas encore été lu. On garde alors
     les deux couleurs du jeu, qui distinguent au moins les camps. */
  const lisible = (c, d) => (c ? (window.FX?.lisible?.(c) ?? c) : d);
  stade = window.TBF_STADE.monter($('stade'), {
    id: S.stade.id,
    couleurs: [
      lisible((S.fixture?.homeColors ?? [])[0], 'var(--projo)'),
      lisible((S.fixture?.awayColors ?? [])[0], 'var(--bleu)'),
    ],
  });
}

/**
 * L'intensité de chaque tribune, d'après la corde.
 *
 * La corde est stockée « côté extérieur positif ». On la ramène donc en deux
 * valeurs de zéro à un : celle qui mène brille, l'autre baisse — sans jamais
 * s'éteindre tout à fait, parce qu'il y a toujours du monde dedans.
 */
function eclairerStade() {
  if (!stade) return;
  const part = Math.max(-1, Math.min(1, (S?.rope ?? 0) / GOAL_AT));
  stade.intensite(0, Math.max(0, -part));   // domicile : corde négative
  stade.intensite(1, Math.max(0, part));    // extérieur : corde positive
}

/* ------------------------------------------------- les cartes d'action

   Le Virage ne joue que les cartes qui agissent sur soi ou sur sa tribune.
   Le tri est fait par le serveur, qui envoie son propre catalogue dans
   `S.actions` — la page n'a pas de liste à tenir, et une carte qui change de
   portée n'attend pas un déploiement du client pour disparaître d'ici. */

/** La carte du catalogue, par identifiant. */
const acteDe = (id) => (S?.actions ?? []).find((a) => a.id === id);

function renderActes() {
  const boite = $('actes');
  const main = S?.you?.main ?? [];
  /* Pas de deck, pas de rangée. Quelqu'un qui n'a jamais construit de deck
     entre au Virage avec sa voix, et une rangée de cases vides ne lui
     apprendrait rien d'autre que ce qui lui manque. */
  if (!main.length) { boite.hidden = true; return; }
  boite.hidden = false;

  const souffle = souffleCourant();
  const cd = S?.you?.cooldowns ?? {};
  const cases = [];
  for (let i = 0; i < (S.you.mainVisible ?? 5); i++) {
    const id = main[i];
    if (!id) { cases.push('<div class="acte vide"></div>'); continue; }
    const a = acteDe(id);
    const fam = window.TBF_ACTION.famDe(a);
    const reste = cd[id];
    const injouable = !a || souffle < a.cost || reste || busy;
    cases.push(`<div class="acte ${injouable ? 'hs' : ''}" style="--fc:${fam.c}"
      ${injouable ? '' : `data-acte="${id}"`}>
      <svg class="sceau" viewBox="0 0 24 24"><path d="${fam.ico}"/></svg>
      ${window.TBF_ACTION.illustration(id)}
      <div class="co">${a?.cost ?? '?'}</div>
      <div class="nm">${esc(a?.nom ?? id)}</div>
      ${reste ? `<div class="cd">${Math.ceil(reste)}</div>` : ''}
    </div>`);
  }
  boite.innerHTML = cases.join('');
}

/**
 * La fenêtre collective, quand elle est ouverte.
 *
 * C'est la seule information du Virage qui vienne de la main de quelqu'un
 * d'autre, et elle ne vaut que si on la voit tout de suite : une fenêtre
 * d'Appel dure cinq secondes, un Chœur trois. Elle se pose donc au-dessus des
 * cartes, en vert, et elle bat.
 */
function renderAppel() {
  const mien = S?.you?.side;
  const f = (S?.rally ?? []).find((r) => r.side === mien && r.reste > 0);
  const el = $('appel');
  if (!f) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = f.sync
    ? 'TOUS ENSEMBLE<small>chante maintenant, tout le monde en même temps</small>'
    : 'CHANTE MAINTENANT<small>le capo a appelé : ta poussée compte plus</small>';
  /* La minuterie est nulée en même temps qu'elle est armée : `clearTimeout`
     laisse un identifiant vrai derrière lui, et un test « si une minuterie
     court » serait alors vrai pour toujours. */
  clearTimeout(el._t); el._t = null;
  el._t = setTimeout(() => { el.hidden = true; el._t = null; }, f.reste);
}

$('actes').addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-acte]');
  if (!el || busy || !S) return;
  const a = acteDe(el.dataset.acte);
  if (!a) return;
  if (souffleCourant() < a.cost) return fail('ferveur.error.not_enough_breath');
  /* On envoie et on attend le serveur. L'animation part sur l'événement qu'il
     renvoie, pas sur le clic : une carte refusée — une recharge qu'on n'avait
     pas vue, une condition manquante — ne doit pas avoir traversé l'écran
     avant que le refus arrive. */
  socket.emit('virage:jouer', { cardId: a.id });
});

/**
 * Ce que la salle voit quand une carte part.
 *
 * Les événements arrivent à **toute** la tribune, pas seulement à celui qui a
 * joué : une Collecte qui remplit le souffle de trois cents personnes sans que
 * personne ne sache d'où ça vient n'est pas une carte collective, c'est un
 * bug apparent.
 */
function raconterActe(ev) {
  const mien = S?.you?.side;
  for (const e of ev) {
    const pour = e.side === mien;
    switch (e.t) {
      case 'action': {
        // La tribune de celui qui joue bat : c'est le signal le plus large de
        // l'écran, et il part même pour une carte qu'on n'a pas jouée soi-même.
        stade?.pulse(e.side);
        const a = acteDe(e.cardId);
        /* La carte en grand, avec son dessin — la même mise en scène qu'au
           duel. Elle part vers le nœud, où l'effet va se lire. */
        const n = $('knot').getBoundingClientRect();
        window.TBF_ACTION.jouee(a, { pour,
          vers: { x: n.left + n.width / 2, y: n.top + n.height / 2 } });
        break;
      }
      case 'rally':
      case 'sync':
        if (pour) {
          S.rally = [...(S.rally ?? []), { side: e.side, reste: e.duree,
            sync: e.t === 'sync' }];
          renderAppel();
        }
        FX?.son?.(pour ? 'parfait' : 'tic');
        break;
      case 'effect':
        if (e.type === 'team_breath' && pour) float(`+${e.valeur} à la tribune`, 'var(--vert)');
        break;
      default: break;
    }
  }
}

/* -------------------------------------------------------------- réseau */

function connect() {
  socket = io({ transports:['websocket','polling'] });

  socket.on('connect', () => { if (S) socket.emit('virage:join', { fixtureId: S.fixture.id }); });

  socket.on('virage:state', (s) => {
    S = s; $('veil').classList.remove('on');
    renderStatic(); render();
    /* Le personnage entre avec la tribune. Le serveur le donne à l'âge
       atteint : c'est le Fanzzy que le joueur a choisi, pas sa racine — la
       page n'a rien à recalculer, et ne peut donc pas se tromper d'âge. */
    if (S.you?.fanzzy) scene?.definir(S.you.fanzzy);
    // Le fil arrive avec l'état : entrer à la soixantième minute donne ce qui
    // s'est passé avant, pas un écran vide.
    renderFil();
    banner('TU ES DANS LE VIRAGE');
  });

  /* Le fil du match. Le serveur n'envoie que le neuf ; la page tient la liste,
     puisqu'elle l'a reçue entière à l'entrée. Renvoyer le fil complet à chaque
     carton coûterait, sur un samedi chargé, soixante entrées fois mille
     supporters à chaque événement. */
  socket.on('virage:fil', (f) => {
    if (!S) return;
    S.fil = [...(S.fil ?? []), ...(f.entrees ?? [])]
      .sort((a, b) => (a.minute ?? 0) - (b.minute ?? 0)
        || (a.extra ?? 0) - (b.extra ?? 0) || a.rang - b.rang);
    if (f.scoreReel) S.scoreReel = f.scoreReel;
    if (f.minute != null) S.minute = f.minute;
    renderFil({ neuf: true });
    // Le personnage réagit aux entrées **neuves** seulement. Les rejouer
    // toutes à chaque arrivée ferait célébrer un carton de la douzième minute.
    for (const e of f.entrees ?? []) reagirAuFil(e);
  });

  socket.on('virage:tick', (t) => {
    if (!S) return;
    S.rope = t.rope; S.goals = t.goals; S.crowd = t.crowd; S.surge = t.surge;
    render();
  });

  /* Deux horloges locales, parce que le serveur ne parle pas assez souvent
     pour elles.

     La corde arrive dix fois par seconde, mais **seulement quand elle bouge** :
     une salle où personne ne chante ne diffuse rien du tout. Le souffle et la
     minute, eux, avancent quand même — et sans ces deux battements, la jauge
     restait bloquée jusqu'au chant suivant et la minute jusqu'au prochain
     relevé. Le joueur en concluait, à raison, que rien ne se passait. */
  setInterval(() => { if (S && !document.hidden) render(); }, 1000);
  setInterval(() => { if (S && !document.hidden) renderFil(); }, 15000);

  socket.on('virage:result', (r) => {
    // Son propre chant fait battre sa tribune : le geste a un écho à l'écran.
    stade?.pulse(S?.you?.side ?? 0);
    if (!S) return;
    // Le serveur fait foi : on repart de sa valeur, et le regain local
    // recommence à compter à partir de cet instant.
    S.you.breath = r.breath; souffleVuA = Date.now(); S.you.ferveur = r.ferveur;
    $('verdict').textContent = r.quality > 0.9 ? 'PARFAIT' : r.quality > 0.7 ? 'BON'
      : r.quality > 0.4 ? 'MOYEN' : 'RATÉ';
    // Le chiffre part de la corde, là où le joueur regarde.
    window.FX?.poussee(r.backfire ? -r.push : r.push, $('knot'), { pour: !r.backfire });
    // Un geste parfait déclenche le Cri du Fanzzy : c'est la récompense de la
    // précision, et le seul moment où l'écran entier réagit.
    if (r.quality > 0.95 && S.you.fanzzy?.cri) {
      window.FX?.cri(S.you.fanzzy.cri, { couleur:'var(--projo)' });
    }
    // Il pousse le temps du chant, puis revient à son attente. Un geste raté
    // le fait pousser aussi : c'est l'effort qui se voit, pas le résultat.
    scene?.pose('pousse', 2600);
    buzz(r.quality > 0.9 ? [20, 30, 40] : 12);
    render();
  });

  socket.on('virage:goal', (g) => {
    // La tribune s'embrase. Une fois, et longuement : c'est le moment.
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    // Les effets viennent de la couche commune : une seule définition du
    // « but » pour tout le jeu, duel compris.
    window.FX?.but({ pour: mien, score: [S.goals[S.you.side], S.goals[S.you.side ^ 1]] });
    /* Le personnage porte l'annonce, quinze secondes. La bande du milieu ne
       sert plus que de repli : deux fois la même phrase à deux endroits de
       l'écran, ce serait du bruit. */
    if (scene) {
      scene.moment(mien ? 'but' : 'encaisse',
        mien ? 'LA CORDE CÈDE !' : 'ILS ONT FAIT CÉDER LA CORDE',
        { couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)' });
    } else {
      banner(mien ? 'BUT DE LA TRIBUNE !' : 'ILS ONT FAIT CÉDER LA CORDE');
    }
  });

  socket.on('virage:real_goal', (g) => {
    // Un but sur le terrain embrase la tribune du club qui vient de marquer.
    stade?.embraser(g.side);
    const mien = g.side === S.you.side;
    // Le score du terrain suit le but sans attendre le prochain tour du
    // relevé : c'est la seconde où le joueur le regarde.
    if (g.scoreReel) { S.scoreReel = g.scoreReel; renderFil(); }
    window.FX?.butReel({ pour: mien, buteur: g.player, minute: g.minute });
    /* « GOAL ! » sur le personnage, avec le buteur et la minute — ils arrivent
       déjà dans l'événement, aucun appel de plus. Quinze secondes : le temps
       de sortir le téléphone de sa poche, un but de deux secondes et demie
       n'a laissé aucune trace. */
    scene?.moment(mien ? 'but' : 'encaisse', mien ? 'GOAL !' : 'ON ENCAISSE', {
      // Le but est écrit aux couleurs de l'équipe qui l'a marqué : le sien
      // dans les couleurs du club, celui d'en face en rouge d'alerte — on ne
      // célèbre pas un but encaissé, fût-ce joliment.
      couleur: mien ? couleurDuCamp(g.side) : 'var(--flare)',
      sous: [g.player, g.minute != null ? `${g.minute}′` : ''].filter(Boolean).join(' · '),
    });
    window.FX?.bandeau('MINUTE DOUBLE', mien ? '#F5C33B' : '#E0402C');
    if (mien) setTimeout(() => souvenir(g), 1400);
  });

  /* Le vrai match : score, minute, période. Il descend dès que le relevé du
     direct les voit bouger, sans attendre qu'une entrée de fil se produise. */
  socket.on('virage:match', (v) => {
    if (!S) return;
    if (v.scoreReel) S.scoreReel = v.scoreReel;
    if (v.minute != null) S.minute = v.minute;
    S.minuteExtra = v.minuteExtra ?? null;
    if (v.vuA) S.vuA = v.vuA;
    if (v.statut) S.statut = v.statut;
    renderFil();
  });

  socket.on('virage:crowd', (c) => { if (S) { S.crowd = c.crowd; render(); } });

  /* Ce que fait une carte — la sienne comme celle d'un voisin. Diffusé à toute
     la tribune : c'est là qu'est l'intérêt d'un Appel du capo. */
  socket.on('virage:events', (m) => { if (S) raconterActe(m.evenements ?? []); });

  /* Et l'état personnel qui en découle : la main, le souffle, les recharges.
     Séparé des événements parce qu'il n'appartient qu'à une personne — la
     salle n'a pas à connaître la main de chacun. */
  socket.on('virage:vous', (you) => {
    if (!S || !you) return;
    S.you = { ...S.you, ...you };
    render();
  });

  socket.on('virage:error', (e) => fail(e.code));
}

/** Annonce de la carte-souvenir. Le serveur l'a déjà frappée. */
function souvenir(g) {
  const el = $('souvenir');
  el.innerHTML = `<div class="t">CARTE-SOUVENIR</div>
    <div class="m">${g.player ?? 'BUT'} ${g.minute}'</div>
    <div class="d">Tu y étais. Elle est dans ton carnet.</div>`;
  el.className = 'souvenir on';
  setTimeout(() => { el.className = 'souvenir'; }, 4200);
}

/* ----------------------------------------------------------- choix du match */

(async () => {
  connect();

  /* Entrer directement dans un match, par son adresse.

     La fiche d'un match propose « GRAND VIRAGE » : le bouton doit mener **à
     ce match-là**, pas à une liste où il faut le retrouver. Le camp n'est pas
     donné ici — le serveur le déduit des clubs suivis, et propose de le
     choisir si aucun des deux n'est à nous. */
  const demande = Number(new URLSearchParams(location.search).get('match'));
  if (Number.isInteger(demande) && demande > 0) {
    socket.emit('virage:join', { fixtureId: demande });
  }

  let matchs = [];
  try {
    const r = await fetch('/api/virage/live', { credentials:'same-origin' });
    if (r.status === 401) { location.href = '/compte'; return; }
    const rep = await r.json();
    matchs = rep.matchs ?? [];
    // La part de ferveur d'un neutre vient du serveur : la recopier ici ferait
    // une seconde vérité, qui finirait par annoncer 50 % là où il en donne 40.
    FERVEUR_NEUTRE = rep.ferveurNeutre ?? FERVEUR_NEUTRE;
  } catch { /* serveur injoignable */ }

  /* Le score du match, avant d'entrer.
     L'écran de choix donnait le nom des deux clubs, la compétition et la
     minute — mais pas le score. On choisissait donc d'entrer dans un virage
     sans savoir si son club menait ou encaissait, ce qui est exactement ce
     qu'on veut savoir avant de pousser. Il est dans la réponse depuis
     toujours, il n'était simplement pas affiché. */
  /* Deux sections, et la distinction porte tout le sens.

     **Chez soi**, le camp ne se choisit pas : il découle du club suivi, et la
     ferveur compte plein. **Ailleurs**, on choisit son camp et elle compte
     moitié. Le virage n'affichait que les matchs de ses clubs : un soir de
     Coupe d'Europe avec huit rencontres en direct, il en montrait une, et le
     joueur en concluait qu'il n'y avait rien à faire. */
  const carte = (m) => {
    const joue = m.home_goals != null && m.away_goals != null;
    return `<div class="match ${m.open ? '' : 'off'} ${m.mien ? '' : 'ailleurs'}"
      data-id="${m.id}" data-mien="${m.mien ? 1 : 0}">
      <img src="${esc(m.home_logo ?? '')}" alt="">
      <div class="n"><b>${esc(m.home_name)} – ${esc(m.away_name)}</b>
        <small>${esc(m.league_name ?? '')} · ${m.crowd[0] + m.crowd[1]} dans les tribunes</small></div>
      <img src="${esc(m.away_logo ?? '')}" alt="">
      <span class="st">
        ${joue ? `<b class="sc">${m.home_goals} – ${m.away_goals}</b>` : ''}
        ${m.open ? `<i>${m.elapsed ? m.elapsed + "'" : 'BIENTÔT'}</i>` : ''}
      </span>
    </div>`;
  };

  const miens = matchs.filter((m) => m.mien);
  const autres = matchs.filter((m) => !m.mien && m.open);
  const part = Math.round((FERVEUR_NEUTRE ?? 0.5) * 100);

  $('matchs').innerHTML = (matchs.length ? [
    miens.length ? `<div class="rubrique">TES CLUBS</div>${miens.map(carte).join('')}` : '',
    autres.length ? `<div class="rubrique">AILLEURS EN DIRECT
      <small>tu choisis ton camp · ferveur à ${part} %</small></div>${autres.map(carte).join('')}` : '',
  ].join('') : '')
    || `<p>Aucun match en direct pour l’instant.<br>
        <a href="/equipes" style="color:var(--projo)">Suis un club</a>
        pour être prévenu quand le tien joue.</p>`;

  /* Entrer.
     Chez soi, on entre directement — le camp est déjà décidé par le club
     qu'on suit. Ailleurs, il faut choisir : la carte se déplie et propose les
     deux clubs, en disant ce que ça coûte. Demander après coup, une fois
     dedans, serait pire : on aurait déjà poussé du mauvais côté. */
  $('matchs').onclick = (e) => {
    const camp = e.target.closest('[data-camp]');
    if (camp) {
      const carteM = camp.closest('[data-id]');
      socket.emit('virage:join', {
        fixtureId: Number(carteM.dataset.id), camp: camp.dataset.camp,
      });
      return;
    }

    const m = e.target.closest('[data-id]');
    if (!m || m.classList.contains('off')) return;
    if (m.dataset.mien === '1') {
      socket.emit('virage:join', { fixtureId: Number(m.dataset.id) });
      return;
    }
    if (m.querySelector('.camps')) { m.querySelector('.camps').remove(); return; }
    const info = matchs.find((x) => String(x.id) === m.dataset.id) ?? {};
    document.querySelectorAll('#matchs .camps').forEach((n) => n.remove());
    m.insertAdjacentHTML('beforeend', `<div class="camps">
      <span>Tu pousses pour&nbsp;:</span>
      <button data-camp="domicile">${esc(info.home_name ?? 'Domicile')}</button>
      <button data-camp="exterieur">${esc(info.away_name ?? 'Extérieur')}</button>
    </div>`);
  };
})();
</script>
<script src="/fx.js" defer></script>
<script src="/nav.js" defer></script>
