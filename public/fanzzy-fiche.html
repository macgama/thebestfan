<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanzzy — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/fanzzy-fiche.css">
<style>

/* La coquille, et rien d'autre.

   Toute la fiche — sa mise en page, ses cases, ses actions — vit dans
   `fanzzy-fiche.css` et `fanzzy-fiche.js`, parce qu'elle s'affiche aussi en
   panneau par-dessus le classeur. Cette page n'en est plus que l'adresse :
   celle qu'on partage, celle qu'on met en favori, celle où l'on arrive depuis
   l'extérieur.

   Ce qui reste ici est ce qui ne vaut que pour elle — la colonne qui tient
   dans l'écran, et l'attente pendant le chargement. */

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:calc(var(--nav-h,62px) + env(safe-area-inset-bottom))}
#page{flex:1;min-height:0;display:flex;flex-direction:column}
.spin{width:24px;height:24px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:70px auto}
@keyframes sp{to{transform:rotate(1turn)}}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main id="app"><div class="spin" id="spin"></div><div id="page" style="display:none"></div></main>

<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fiche.js"></script>
<script>
/* L'identifiant vient du chemin — /fanzzy/TR8 — ou du paramètre `?id=`, que
   d'anciens liens emploient encore. */
const id = new URLSearchParams(location.search).get('id')
  ?? location.pathname.split('/').filter(Boolean).pop();

/* Aucune croix ici : on n'est pas par-dessus quelque chose, on est *quelque
   part*. La fiche affiche donc sa flèche de retour vers le classeur. */
window.TBF_FICHE.ouvrir(document.getElementById('page'), id).finally(() => {
  document.getElementById('spin').style.display = 'none';
  // `flex` et non `block` : la fiche tient dans l'écran par une colonne flex,
  // et un `display:block` posé ici la ferait retomber sur la hauteur de son
  // contenu — le personnage se réduirait à une vignette dans un coin.
  document.getElementById('page').style.display = 'flex';
});
</script>
<script src="/fx.js" defer></script>
<script src="/nav.js" defer></script>
</body>
</html>
