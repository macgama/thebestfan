<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="/langue.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>Les matchs du jour — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}

.top{padding:14px 16px 4px}
.top h1{font-family:var(--banner);font-size:20px;letter-spacing:.14em;margin:0}
/* Onze pixels et 0,88 : c'est la seule ligne qui dit ce que la liste montre
   — « 42 MATCHS · 3 EN DIRECT » —, et elle était à neuf pixels et 45 %. */
.top h1 small{display:block;font-size:11px;letter-spacing:.16em;opacity:.88;margin-top:4px;font-family:var(--ui)}

/* **« LES MATCHS » était écrit deux fois**, l'un sous l'autre et dans la même
   police : une fois par la barre du haut, une fois ici. Même règle qu'au
   kiosque, et le même `:has` plutôt qu'une classe posée en JavaScript — elle
   suit la barre qu'elle arrive avant ou après, et un navigateur qui ne
   connaît pas `:has` retombe sur l'ancien affichage, jamais sur une page sans
   titre.

   Le sous-titre reste : il dit quelle compétition la liste montre, ce
   qu'aucune barre ne dira. */
body:has(.tbf-haut) .top h1>span{display:none}
body:has(.tbf-haut) .top h1>small{margin-top:0;font-size:11px}

/* **Les jours et les filtres sont des rails d'onglets.**

   Deux rangées de boutons maison, chacune avec son dépoli, son blanc pour
   l'actif et son 55 % pour les autres — le flou recalculé à chaque image, et
   des étiquettes illisibles au soleil. Ce sont deux choix exclusifs : le rail
   commun (`.tbf-onglets`, au vert du foot, le ton de cet écran sur l'accueil)
   dit exactement ça, s'enfonce comme les autres et tient ses quarante-quatre
   pixels. Il ne reste ici que ce qui est propre à ces deux rangées.

   Les jours sont sept et ne tiennent pas sur un téléphone : le rail défile,
   et chaque jour garde son mot entier (`flex:1 0 auto`) plutôt que de se
   couper en « AUJOURD'… ». La date passe sous le mot, dans la police du
   système — sans opacité à elle, qui se multiplierait avec celle de
   l'onglet éteint. */
.jours{overflow-x:auto;scrollbar-width:none;margin:12px 16px}
.jours::-webkit-scrollbar{display:none}
.jour{flex:1 0 auto;padding:6px 13px;line-height:18px}
.jour small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;line-height:15px}
.filtres{margin:0 16px 10px}

.rech{padding:0 16px 10px}
/* Le champ se pose sur la photo : le panneau opaque commun, sans quoi la
   foule passait sous ce qu'on tape. */
input{width:100%;background:var(--panneau);border:1px solid rgba(242,238,228,.16);border-radius:8px;
  color:inherit;padding:11px 13px;font-size:14.5px;font-family:inherit}
input:focus{outline:none;border-color:var(--projo)}

.liste{flex:1;padding:0 12px 24px}
/* **Chaque compétition est un panneau.** Les en-têtes et les matchs étaient
   posés à même la photo de tribune : un nom d'équipe en blanc sur une foule
   éclairée aux projecteurs ne se lit qu'une fois sur deux. */
.ligue{margin-top:14px;padding:4px 4px 6px;border:1px solid var(--trait);border-radius:12px;
  background:var(--panneau)}
/* L’en-tête est un lien vers la page de la compétition. Il en a l’air : un
   chevron à droite, et il s’enfonce à l’appui — sans quoi personne ne
   devine qu’on peut le toucher. Le nom est à pleine encre : c'est lui qu'on
   cherche en faisant défiler, et le pays qui le suit ne s'efface plus que
   d'un cran — deux opacités imbriquées le posaient à 27 %. */
.ligue .t{display:flex;align-items:center;gap:8px;padding:6px 6px 8px;font-family:var(--banner);
  font-size:11.5px;letter-spacing:.13em}
.ligue .t .pays{opacity:.88;font-size:11px;letter-spacing:.06em;font-family:var(--ui)}
.ligue .t .sep{flex:1;height:1px;background:rgba(242,238,228,.1)}
.ligue .t{text-decoration:none;color:inherit;cursor:pointer}
.ligue .t:active{transform:translateY(1px)}
.ligue .t .fl{opacity:.55;font-size:13px;flex:none}
/* Les compétitions de mes clubs se détachent par la graisse : elles étaient
   en or, et en onze pixels et demi l'or ne tient pas au soleil (arbitrage
   du 2 octobre 2026). Leurs matchs gardent leur cadre d'or, juste dessous. */
.ligue.mien .t{opacity:1;font-weight:700}

.m{display:flex;align-items:center;gap:9px;padding:11px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent}
.m:active{background:rgba(255,255,255,.04)}
.m.mien{border-color:rgba(245,195,59,.28);background:rgba(245,195,59,.05)}
.m .h{width:52px;text-align:center;flex:none}
.m .h .heure{font-family:var(--banner);font-size:13px;opacity:.9}
.m .h .live{font-family:var(--banner);font-size:13px;color:var(--flare)}
.m .h .live::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--flare);margin-left:4px;vertical-align:middle;animation:bl 1.2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
/* En Oswald : « TERMINÉ » à onze pixels ne tient dans les cinquante-deux
   pixels de la colonne que dans la condensée du jeu. */
.m .h .fin{font-family:var(--banner);font-size:11px;opacity:.88;letter-spacing:.06em}
.m .eq{flex:1;min-width:0}
.m .r{display:flex;align-items:center;gap:7px;padding:1.5px 0}
.m .r img{width:18px;height:18px;object-fit:contain;flex:none}
.m .r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.m .r b{font-family:var(--banner);font-size:15px;min-width:16px;text-align:right}
/* Le perdant se dit par la couleur — le gris froid de la palette contre la
   craie chaude du vainqueur —, plus par une opacité de 45 % qui rendait son
   nom et son score illisibles au soleil. */
.m .r.perd span,.m .r.perd b{color:var(--gris)}

.vide{text-align:center;padding:50px 24px;opacity:.9;font-size:13px;line-height:1.8}
/* Hors de toute compétition, le message se pose sur la photo : il prend son
   panneau. Dans la fiche, il est déjà sur le fond opaque de celle-ci. */
.liste>.vide{background:var(--panneau);border:1px solid var(--trait);border-radius:12px;margin-top:14px}
.spin{width:24px;height:24px;border:3px solid rgba(242,238,228,.18);border-top-color:var(--projo);
  border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(1turn)}}
/* Moins de mouvement, demandé au système ou dans le tiroir (le mode calme,
   contrat C4 — un sélecteur d'attribut n'entre pas dans une requête @media,
   d'où le double, règle pour règle). Le point du direct cesse de clignoter
   et reste allumé : c'est lui qui dit « en cours », pas son clignement. Le
   tourniquet dit « ça charge » : il ralentit sans s'arrêter, comme
   `.tbf-spin` de ui.css. */
@media (prefers-reduced-motion:reduce){
  .m .h .live::after{animation:none}
  .spin{animation-duration:3s}
}
html[data-calme~="animations"] .m .h .live::after{animation:none}
html[data-calme~="animations"] .spin{animation-duration:3s}
/* L'heure de la dernière mise à jour : c'est elle qu'on lit pour savoir si
   l'on peut se fier au score. Onze pixels, 0,88, et une pastille de panneau
   plutôt que la foule dessous. */
.maj{display:table;margin:0 auto 14px;text-align:center;font-size:11px;opacity:.88;padding:6px 12px;
  border-radius:999px;background:var(--panneau)}
.maj:empty{display:none}

/* **Le fond de la fiche est plein.** Il était à 96 %, sous un flou d'arrière-
   plan qui brouillait ce qu'il laissait passer. Le flou retiré — il se
   recalculait à chaque image, sur tout l'écran, et coûtait cher sur un
   téléphone modeste —, ces 4 % laissaient voir la liste en net, en fantôme
   sous le fil du match : des noms d'équipes sous d'autres noms d'équipes. La
   fiche est un écran à part entière ; elle se peint comme tel. */
#fiche{position:fixed;inset:0;z-index:80;background:#04060A;
  display:none;justify-content:center;overflow-y:auto}
#fiche.on{display:flex}
.f{width:100%;max-width:480px;padding:16px}
/* La flèche qui referme la fiche : une plaque carrée de quarante-quatre
   pixels, comme la flèche de retour de la barre du haut. Elle faisait
   trente-deux pixels, dans un coin qu'on vise du pouce. */
.f .fermer{width:44px;height:44px;min-height:44px;padding:0;font-size:20px}
.f .aff{text-align:center;padding:18px 0 10px}
.f .aff .lg{font-size:11px;letter-spacing:.14em;opacity:.88;font-family:var(--banner)}
.f .aff .sc{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.f .aff .sc img{width:46px;height:46px;object-fit:contain}
.f .aff .sc .n{font-family:var(--banner);font-size:38px;letter-spacing:.02em}
.f .aff .nom{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;opacity:.9}
.f .etat{text-align:center;font-family:var(--banner);font-size:13px;letter-spacing:.1em;
  margin-top:6px;color:var(--flare)}
.f .etat.calme{color:inherit;opacity:.88}
/* Les deux portes du jeu, depuis un match : la tribune et le duel. Elles
   manquaient — on regardait un match en direct sans qu’aucun chemin ne mène
   à l’écran fait pour le vivre.

   Ce sont des plaques rouges (`.tbf-plaque`, jouer = flare) : elles avaient
   leur propre relief, leur propre enfoncement et leur propre extinction, qui
   ne réagissaient pas comme le reste du jeu. Il ne reste ici que leur mise en
   page — côte à côte, le mot sur sa phrase. */
.f .allers{display:flex;gap:9px;margin:16px 0 4px}
.f .aller{flex:1;flex-direction:column;gap:3px;padding:11px 10px 10px;font-size:13px}
.f .aller small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.02em;
  text-transform:none;font-weight:400}
/* Éteint plutôt qu’absent : un bouton qui disparaît laisse croire qu’on a mal
   vu, un bouton éteint qui dit « pendant le match seulement » se comprend.
   L'extinction est celle de la plaque, portée par « aria-disabled » — voir
   ui.css ; la classe « eteint » reste pour qui la lit. */
/* L’invitation posée sur les deux portes quand personne n’est connecté.
   Le lien vit dans le `corps` de la boîte de dialogue, qui est fait pour
   ça — voir `dialogue.js`. */
.tbf-dial .deja{margin-top:13px;font-size:12px;opacity:.88}
/* Le lien, en craie soulignée et grasse : il était en or, et en douze
   pixels l'or ne tient pas au soleil (arbitrage du 2 octobre 2026). */
.tbf-dial .deja a{color:var(--craie);font-weight:700}

/* Le nom de la compétition mène à sa page, ici aussi. */
.f .aff .lg{text-decoration:none;color:inherit;display:inline-block}

/* Le Fanzzy qui regarde. Dans le coin, au-dessus du contenu mais
   transparent aux doigts : il ne doit jamais empêcher de faire défiler la
   liste des événements qu’il commente.

   **fixed, et non absolute.** Il était posé en absolu dans #fiche, qui est le
   panneau défilant du match. Un élément en absolu dans un conteneur qui défile
   défile avec son contenu : le personnage était donc calé sur le bas du
   *premier* écran, et dès qu'on descendait dans le fil il remontait au milieu
   des événements — posé en travers d'une ligne, sans plus rien d'un coin. Vu
   du joueur, une image égarée par-dessus le match.

   #fiche portait un backdrop-filter, ce qui en faisait le bloc de référence
   des descendants fixes. Il n'en porte plus : « fixed » se règle donc sur
   l'écran, que #fiche couvre de toute façon en entier (« inset:0 ») — le
   coin est le même. Le personnage reste dans son coin, le fil passe dessous.
   Le coin de la colonne, et non de l'écran : sur un ordinateur, la fiche a
   la largeur du téléphone au milieu, et le coin de l'écran est loin d'elle. */
#fwatch{position:fixed;left:max(6px,calc(50% - var(--colonne) / 2 + 6px));bottom:calc(var(--nav-h,62px) + 6px);
  width:96px;height:150px;z-index:3;pointer-events:none}
/* Sur un écran étroit, cent pixels de personnage au-dessus d'une liste pleine
   largeur couvrent une ligne entière. Il rétrécit plutôt que de cacher. */
@media (max-width:430px){#fwatch{width:74px;height:116px}}
#fwatch[hidden]{display:none}

/* **Le pronostic.** Sur la fiche d'un match d'un club suivi : le score qu'on
   attend, donné avant le coup d'envoi. Gratuit, sans mise : un pronostic juste
   rapporte des écharpes, un faux ne coûte rien (`src/server/pronostics/`).
   Un panneau du même grain que le reste de la fiche, et le score se règle au
   doigt, par deux compteurs : un clavier qui s'ouvre sur un téléphone pour
   taper « 2 » couvre la moitié du match qu'on pronostique. */
.f .prono{margin:16px 0 4px;padding:12px 12px 13px;border:1px solid var(--trait);border-radius:12px;
  background:var(--panneau)}
.f .prono[hidden]{display:none}
.f .prono h3{font-family:var(--banner);font-size:12px;letter-spacing:.18em;margin:0 0 10px;
  text-align:center;font-weight:600}
.f .prono .pr-sc{display:flex;align-items:center;justify-content:center;gap:10px}
.f .prono .pr-eq{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.f .prono .pr-nom{font-size:11.5px;opacity:.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.f .prono .pr-cpt{display:flex;align-items:center;gap:6px}
.f .prono .pr-cpt button{width:44px;height:44px;border-radius:10px;border:1px solid rgba(242,238,228,.22);
  background:rgba(242,238,228,.06);color:var(--craie);font-size:22px;font-family:var(--banner);cursor:pointer}
.f .prono .pr-cpt button:active{transform:translateY(1px)}
.f .prono .pr-cpt button:disabled{opacity:.35;cursor:default}
.f .prono .pr-n{font-family:var(--banner);font-size:34px;min-width:30px;text-align:center}
.f .prono .pr-tiret{font-family:var(--banner);font-size:26px;opacity:.7}
.f .prono .pr-valider{margin-top:12px;width:100%}
.f .prono .pr-dit{margin:10px 0 0;font-size:12px;line-height:1.55;text-align:center;opacity:.9}
.f .prono .pr-issue{font-family:var(--banner);font-size:16px;letter-spacing:.08em;text-align:center;margin:8px 0 0}
.f .prono .pr-issue.gagne{color:var(--projo)}
.f .infos{display:flex;gap:8px;margin-top:16px;font-size:11px;opacity:.88;justify-content:center;
  flex-wrap:wrap}
.f .infos span{border:1px solid rgba(242,238,228,.12);border-radius:999px;padding:4px 10px}
.f h4{font-family:var(--banner);font-size:11px;letter-spacing:.2em;opacity:.88;margin:22px 0 8px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid rgba(242,238,228,.07);
  font-size:12.5px}
.ev .min{font-family:var(--banner);font-size:13px;width:34px;opacity:.88;flex:none}
.ev .ic{width:20px;text-align:center;flex:none}
.ev .txt{flex:1;min-width:0}
.ev .txt small{display:block;opacity:.88;font-size:11px}
.ev.droite{flex-direction:row-reverse;text-align:right}
.ev.droite .txt{text-align:right}

/* ------------------------------------------------------- statistiques */
.st{padding:9px 4px}
.st .l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.st .l b{font-family:var(--banner);font-size:13.5px}
.st .l span{opacity:.88;font-size:11px;letter-spacing:.08em;align-self:center}
/* La barre partagée : la part de chaque équipe (possession, tirs…). Ce n'est
   pas une progression, mais c'est elle qu'on lit d'un regard avant les
   chiffres ; à cinq pixels, au soleil, les deux couleurs se confondaient en un
   trait. Dix pixels, comme toute jauge du jeu : la fiche défile, la place ne
   manque pas. */
.st .b{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(242,238,228,.09)}
.st .b i{display:block;height:100%}
.st .b i:first-child{background:var(--projo)}
.st .b i:last-child{background:var(--bleu)}

/* ------------------------------------------------------- compositions */
.compo{display:flex;gap:10px;padding:6px 0}
.compo > div{flex:1;min-width:0}
.compo .eq{font-family:var(--banner);font-size:12px;letter-spacing:.06em;padding-bottom:7px;
  border-bottom:1px solid rgba(242,238,228,.1);margin-bottom:7px;display:flex;
  justify-content:space-between;align-items:baseline;gap:6px}
.compo .eq small{font-size:11px;opacity:.88;font-family:var(--ui);letter-spacing:.04em}
.compo .j{display:flex;gap:7px;padding:4px 0;font-size:12px;align-items:baseline}
.compo .j .n{width:19px;text-align:right;opacity:.88;font-family:var(--banner);font-size:11px;flex:none}
.compo .j .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compo .j .po{font-size:11px;opacity:.88;flex:none}
.compo .banc{margin-top:10px;font-size:11px;letter-spacing:.12em;opacity:.88;
  font-family:var(--banner)}
.compo .coach{margin-top:9px;font-size:11px;opacity:.88;font-style:italic}
/* Le fil, les statistiques, les compositions : un troisième rail d'onglets
   au vert de l'écran, pour la même raison que les jours et les filtres. */
.souspage{margin:14px 0 4px}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

</style>

<body>
<main id="app">
  <!-- Le nom de la page dans un `span` : c'est lui que la règle `:has` efface
       quand la barre du haut le dit déjà. Le sous-titre reste — il nomme la
       compétition qu'on regarde, ce qu'aucune barre ne dira. -->
  <div class="top"><h1><span>LES MATCHS</span><small id="sous">TOUTES COMPÉTITIONS</small></h1></div>
  <!-- Deux rails d'onglets au vert du foot, le ton de cet écran sur l'accueil. -->
  <div class="jours tbf-onglets" data-ton="vert" id="jours"></div>
  <div class="filtres tbf-onglets" data-ton="vert">
    <button data-f="tous" class="tbf-onglet on">TOUS</button>
    <!-- Caché par défaut : il ne paraît que pour qui suit des clubs. Voir
         `moi()` plus bas — un filtre qui ne peut rien filtrer est un
         bouton qui ment. -->
    <button data-f="mien" id="fMien" class="tbf-onglet" hidden>MES CLUBS</button>
    <button data-f="live" class="tbf-onglet direct">EN DIRECT</button>
  </div>
  <div class="rech"><input id="q" placeholder="Chercher une équipe ou une compétition…"></div>
  <div class="liste" id="liste"><div class="spin"></div></div>
  <div class="maj" id="maj"></div>
</main>

<div id="fiche">
  <div class="f" id="fcorps"></div>
  <!-- Le Fanzzy qui regarde le match. Hors du corps, qui se redessine à
       chaque relecture : dedans, il rechargerait son dessin toutes les
       trente secondes. -->
  <div id="fwatch" hidden></div>
</div>
<!-- L’horloge du match, la même que dans le Grand Virage : elle fait courir
     la minute entre deux relevés, sans un appel de plus. -->
<script src="/horloge.js"></script>
<!-- Classique et sans « defer » : le rendu de la liste appelle TBF_PAYS dès la
     première journée reçue, donc il doit être là avant le bloc du bas. -->
<script src="/pays.js"></script>
<!-- Le Fanzzy qui regarde le match, et les dessins qu’il emploie. -->
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fond.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fanzzy-scene.js"></script>
<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));

/* Le nom des pays, la recherche par pays, le pliage des accents : tout cela
   vit dans public/pays.js, que la page des compétitions charge aussi. Deux
   copies d'une table de traduction, c'est une copie qui se corrige et une qui
   ne se corrige pas.

   Ne restent ici que les deux raccourcis dont le rendu se sert, et le drapeau
   comme indice — c'est lui qui porte le code ISO dans cette page-ci. */
const { pli, cherches: paysCherches } = window.TBF_PAYS;
const pays = (nomApi, drapeau) => window.TBF_PAYS.nom(nomApi, drapeau);


let date = new Date().toISOString().slice(0, 10);
let filtre = 'tous', terme = '', data = null, minuterie = null;

const api = (p) => fetch('/api/tt' + p, { credentials:'same-origin' }).then((r) => r.json());

/* Sept jours autour d'aujourd'hui : hier pour les résultats, demain pour
   préparer sa soirée. Au-delà, personne ne regarde.

   **Le ruban raisonne en UTC, d'un bout à l'autre.**

   Une journée de football, ici, est une journée UTC : la route appelle l'API
   avec `timezone: 'UTC'` et met sa réponse en cache sous cette clé (voir
   `src/server/teletext/index.js`). Le bouton demandait bien un jour UTC — son
   `iso` venait de `toISOString()` — mais s'étiquetait en heure locale.

   Les deux ne disent pas la même chose aux abords de minuit. À 00 h 30 à
   Zurich le 28, le bouton affichait « AUJOURD'HUI · 28 sept. » et rapportait
   les matchs du 27 ; à 20 h à Montréal, il annonçait le jour en cours et
   rapportait ceux du lendemain. La liste n'était pas fausse, elle répondait à
   une autre question que celle imprimée dessus — et « HIER » montrait alors
   des matchs à venir.

   `Date.UTC` place le repère à minuit UTC, ce qui rend l'arithmétique des
   jours exacte — `setDate` sur l'heure courante pouvait basculer de jour au
   moment de convertir — et `timeZone: 'UTC'` fait lire les étiquettes sur ce
   même repère. Le libellé et le contenu parlent enfin du même jour. */
function joursDispo() {
  const out = [];
  const maintenant = new Date();
  for (let d = -2; d <= 4; d++) {
    const j = new Date(Date.UTC(maintenant.getUTCFullYear(), maintenant.getUTCMonth(),
      maintenant.getUTCDate() + d));
    out.push({ iso: j.toISOString().slice(0, 10), d,
      label: d === 0 ? "AUJOURD'HUI" : d === -1 ? 'HIER' : d === 1 ? 'DEMAIN'
        : j.toLocaleDateString('fr', { weekday:'short', timeZone:'UTC' }).toUpperCase(),
      sous: j.toLocaleDateString('fr', { day:'numeric', month:'short', timeZone:'UTC' }) });
  }
  return out;
}

$('jours').innerHTML = joursDispo().map((j) =>
  `<button class="jour tbf-onglet ${j.iso === date ? 'on' : ''}" data-j="${j.iso}">
    ${j.label}<small>${j.sous}</small></button>`).join('');
$('jours').onclick = (e) => {
  const b = e.target.closest('[data-j]'); if (!b) return;
  date = b.dataset.j;
  document.querySelectorAll('.jour').forEach((x) => x.classList.toggle('on', x === b));
  charger();
};
document.querySelector('.filtres').onclick = (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filtre = b.dataset.f;
  document.querySelectorAll('.filtres button').forEach((x) => x.classList.toggle('on', x === b));
  rendre();
};
let t = null;
$('q').oninput = () => {
  clearTimeout(t);
  // Court délai : filtrer à chaque frappe sur huit cents matchs saccade.
  t = setTimeout(() => { terme = pli($('q').value.trim()); rendre(); }, 200);
};

/**
 * La minute affichée. Le calcul vit dans `/horloge.js`, partagé avec le
 * Grand Virage et la fiche du match : il était écrit trois fois, avec déjà
 * trois listes de périodes différentes. Ce qui reste ici est le vocabulaire
 * de cette page — « MT », « PROL. » — et lui seul.
 *
 * Deux blocs de documentation d'avant le déménagement traînaient au-dessus de
 * celui-ci. Ils décrivaient le plafond par période — « à la mi-temps le chrono
 * s'arrête », « en première période il ne dépasse pas 45 » — qui n'est plus
 * dans ce fichier depuis que le calcul est partagé. Quelqu'un venant réparer
 * ce plafond l'aurait cherché ici, et il ne l'aurait pas trouvé.
 */
function minute(m) {
  if (!m.live) return null;
  return window.TBF_HORLOGE.texte(
    { statut: m.status, minute: m.elapsed, extra: m.extra, vuA: m.luA },
    { HT: 'MT', BT: 'PROL.' }) || null;
}

function heure(d) {
  return new Date(d).toLocaleTimeString('fr', { hour:'2-digit', minute:'2-digit' });
}

function rendre() {
  if (!data) return;
  let groupes = data.groupes;
  if (filtre === 'mien') groupes = groupes.filter((g) => g.mien)
    .map((g) => ({ ...g, matchs: g.matchs.filter((m) => m.mien) }));
  if (filtre === 'live') groupes = groupes.filter((g) => g.live)
    .map((g) => ({ ...g, matchs: g.matchs.filter((m) => m.live) }));
  if (terme) {
    /* Un terme peut désigner un pays : « espagne » comme « spain ». On le
       traduit une fois pour toute la liste, et non par compétition — c'est
       six cent soixante-seize appels à `Intl`, pas deux mille. */
    const cherches = paysCherches(terme);
    const estCePays = (nom) => Boolean(nom)
      && cherches.some((p) => pli(nom).includes(p));

    groupes = groupes.map((g) => {
      /* La compétition répond pour **tous** ses matchs : chercher « france »
         doit donner la Ligue 1 entière, pas les seuls matchs où un club a
         « france » dans son nom.

         Trois façons de la nommer, parce que trois peuvent être tapées : son
         nom, le pays tel que l'API l'écrit, et le pays tel que le lecteur le
         lit. « Tchéquie » ne ressemble à « Czech-Republic » que par la
         troisième. */
      const laCompetition = pli(g.ligue.name).includes(terme)
        || pli(g.ligue.country).includes(terme)
        || pli(pays(g.ligue.country, g.ligue.drapeau)).includes(terme)
        || estCePays(g.ligue.country);

      /* Une équipe répond par son nom — et une **sélection** répond aussi par
         son pays, puisque l'API la nomme comme lui : « Spain », « Spain U21 ».
         C'est ce qui fait qu'un terme français atteint une équipe nationale. */
      const laquelle = (m) => [m.home.name, m.away.name]
        .some((n) => pli(n).includes(terme) || estCePays(n));

      return { ...g, matchs: laCompetition ? g.matchs : g.matchs.filter(laquelle) };
    }).filter((g) => g.matchs.length);
  }

  /* `?? 0` : sans lui, une journée sans données affiche « undefined MATCHS »
     en grand sous le titre. Ce n'est pas une panne — l'écran fonctionne — c'est
     la trace visible d'une donnée absente, et c'est ce que le joueur retient.
     Et à zéro, on écrit une phrase plutôt qu'un compte : « 0 MATCHS » se lit
     comme un bug, « aucun match » se lit comme une information. */
  const total = data.total ?? 0;
  $('sous').textContent = total === 0 ? 'AUCUN MATCH AUJOURD’HUI'
    : data.enDirect ? `${total} MATCHS · ${data.enDirect} EN DIRECT`
      : `${total} MATCH${total > 1 ? 'S' : ''}`;

  $('liste').innerHTML = groupes.length ? groupes.map((g) => `
    <div class="ligue ${g.mien ? 'mien' : ''}">
      <!-- Le nom de la compétition mène à sa page : classement, buteurs,
           calendrier. On voyait un match de Liga 1 sans pouvoir savoir qui
           mène le championnat, alors que la page existe. -->
      <a class="t" href="/teletext?ligue=${g.ligue.id}">${esc(g.ligue.name)}<span class="pays">${esc(pays(g.ligue.country, g.ligue.drapeau))}</span>
        <span class="sep"></span><span class="fl">›</span></a>
      ${g.matchs.map((m) => {
        const min = minute(m);
        /* Sans minute — l'horloge se tait quand le relevé n'a plus rien dit
           depuis un quart d'heure —, le point rouge qui bat reste seul : il
           dit « en direct », et un tiret à sa place disait « rien ». */
        return `<div class="m ${m.mien ? 'mien' : ''}" data-m="${m.id}">
          <div class="h">${m.live ? `<div class="live">${min ?? ''}</div>`
            : m.fini ? `<div class="fin">TERMINÉ</div>`
            : `<div class="heure">${heure(m.date)}</div>`}</div>
          <div class="eq">
            <div class="r ${m.fini && m.away.vainqueur ? 'perd' : ''}">
              <img src="${esc(m.home.logo)}" alt=""><span>${esc(m.home.name)}</span>
              <b>${m.home.goals ?? ''}</b></div>
            <div class="r ${m.fini && m.home.vainqueur ? 'perd' : ''}">
              <img src="${esc(m.away.logo)}" alt=""><span>${esc(m.away.name)}</span>
              <b>${m.away.goals ?? ''}</b></div>
          </div></div>`;
      }).join('')}
    </div>`).join('')
    : `<div class="vide">${filtre === 'mien'
        ? 'Aucun match de tes clubs ce jour-là.<br><a href="/equipes" style="color:var(--craie);font-weight:700">suivre un club</a>'
        : filtre === 'live' ? 'Aucun match en cours.' : 'Aucun match ce jour-là.'}</div>`;

  $('maj').textContent = data.stale
    ? 'Données un peu anciennes : le service n\u2019a pas répondu.'
    : `Mis à jour à ${new Date().toLocaleTimeString('fr', { hour:'2-digit', minute:'2-digit' })}`;
}

async function charger() {
  $('liste').innerHTML = '<div class="spin"></div>';
  try { data = await api('/jour?date=' + date); rendre(); }
  catch { $('liste').innerHTML = '<div class="vide">Service indisponible.</div>'; }
  planifier();
}

/** Rafraîchissement : souvent s'il y a du direct, sinon presque jamais. */
function planifier() {
  clearTimeout(minuterie);
  const delai = data?.enDirect ? 45_000 : 10 * 60_000;
  minuterie = setTimeout(async () => {
    if (document.hidden) return planifier();
    try { data = await api('/jour?date=' + date); rendre(); } catch {
      /* **Le rattrapage était muet, et la page mentait par omission.**

         `rendre` ne s'exécute pas quand la lecture échoue : les scores
         affichés restent ceux d'avant — c'est voulu, mieux vaut un score d'il
         y a deux minutes qu'un écran vide — mais la ligne du bas continuait
         d'annoncer « Mis à jour à 21:34 » à 21:50. Quelqu'un qui regarde un
         match en direct lit cette heure-là pour savoir s'il peut se fier au
         score, et elle lui disait oui.

         On garde donc les scores et on retire la promesse de fraîcheur. Le
         prochain tour se replanifie juste en dessous : dès que le serveur
         revient, l'heure repart. */
      const maj = $('maj');
      if (maj) maj.textContent = 'Le service ne répond plus — ces scores datent '
        + 'de la dernière mise à jour.';
    }
    planifier();
  }, delai);
}
// Le chrono défile toutes les dix secondes, sans appel réseau : c'est assez
// fréquent pour qu'un changement de minute se voie presque tout de suite.
setInterval(() => { if (data?.enDirect && !document.hidden) rendre(); }, 10_000);
/* **Et la fiche ouverte se relit aussi.**

   On ne rechargeait que la liste. Or si une fiche est ouverte, c'est elle qu'on
   regarde — la liste est derrière, cachée par la fiche. Les deux relectures du
   direct se mettent en pause quand l'onglet passe à l'arrière-plan (voir
   `planifierFiche`), si bien qu'en revenant sur le match on retrouvait le score
   d'avant pour jusqu'à trente secondes, sur le seul écran où l'on compte les
   secondes. `relire` replanifie la suite, donc aucune minuterie ne double. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  charger();
  if (FICHE.id) relire();
});

/* ---------------------------------------------------------- fiche match */

$('liste').addEventListener('click', (e) => {
  const m = e.target.closest('[data-m]');
  if (m) ouvrirFiche(Number(m.dataset.m));
});

/* ---------------------------------------------------------- fiche match

 * Elle se chargeait une fois et ne bougeait plus : ouverte sur un match en
 * cours, elle affichait le score du moment où on l'avait ouverte, pour aussi
 * longtemps qu'on la regardait. C'est précisément l'écran où l'on reste.
 *
 * Elle se relit donc toute seule tant que le match est en cours, et sa minute
 * court entre deux relectures — la même horloge que partout ailleurs.
 *
 * Et le Fanzzy la regarde avec toi. Il vit **hors** du corps de la fiche : le
 * corps se redessine à chaque relecture, et un personnage qui vivrait dedans
 * rechargerait son dessin toutes les trente secondes.
 */

const ICONES = { Goal:'⚽', Card:'▮', subst:'⇄', Var:'▣' };

/** Tout ce que la fiche tient entre deux relectures. */
const FICHE = {
  id: null, d: null, minuterie: null, chrono: null,
  volet: 'fil', scene: null, vus: null, cote: null, finVue: false,
};

/**
 * De quel côté on est.
 *
 * Lu une fois par visite, pas à chaque fiche : la liste des clubs suivis ne
 * change pas pendant qu'on regarde un match. Sans elle, le personnage ne
 * saurait pas s'il doit exulter ou encaisser — il resterait neutre sur le but
 * de ton club, ce qui est le seul cas où l'on attend quelque chose de lui.
 */
let mesClubs = null;
async function clubsSuivis() {
  if (mesClubs) return mesClubs;
  try {
    const r = await fetch('/api/football/follows', { credentials: 'same-origin' });
    const j = await r.json();
    mesClubs = new Set((j.teams ?? []).map((t) => Number(t.id)));
  } catch { mesClubs = new Set(); }
  return mesClubs;
}

/** Le Fanzzy équipé, pour qu'il regarde le match. Une fois par visite. */
let monPerso = null;
async function persoEquipe() {
  if (monPerso !== null) return monPerso;
  try {
    const r = await fetch('/api/fanzzy/state', { credentials: 'same-origin' });
    const j = await r.json();
    const id = j?.wallet?.active ?? null;
    /* **L'âge choisi, et la tenue portée.**

       Cet écran prenait `stades[id]` — l'âge **atteint** — et « base » en dur.
       Un joueur qui préfère se montrer jeune se voyait donc vieux ici et
       jeune à l'accueil, et son déguisement ne paraissait ni sur l'un ni sur
       l'autre. Les deux réponses viennent maintenant du portefeuille, qui les
       calcule une fois pour tout le jeu. */
    /* **L'avatar, pas une recomposition.** Cet écran reconstruisait le
       personnage à partir de `activeStade` et `activeSkin`, et l'expression
       n'y figurait pas. Il prend maintenant l'objet que le serveur résout
       pour tout le jeu — le même que l'accueil. */
    monPerso = id ? (j.wallet?.avatar ?? { id, evo: j.stades?.[id] ?? 1, skin: 'base' }) : false;
  } catch { monPerso = false; }
  return monPerso;
}

async function ouvrirFiche(id) {
  $('fiche').classList.add('on');
  $('fcorps').innerHTML = '<div class="spin"></div>';
  FICHE.id = id;
  FICHE.d = null;
  FICHE.volet = 'fil';
  FICHE.finVue = false;
  // `null` et non un ensemble vide : à la première lecture on **enregistre**
  // les événements déjà arrivés sans y réagir. Ouvrir un 3-2 ne doit pas
  // rejouer cinq buts d'affilée.
  FICHE.vus = null;
  FICHE.prono = null;

  const [clubs, perso] = await Promise.all([clubsSuivis(), persoEquipe()]);
  if (FICHE.id !== id) return;
  chargerProno(id);

  if (perso && !FICHE.scene) {
    FICHE.scene = window.TBF_SCENE?.creer?.($('fwatch'), {
      momentDans: $('fiche'), fond: 'attente',
    }) ?? null;
  }
  if (FICHE.scene && perso) FICHE.scene.definir(perso);
  $('fwatch').hidden = !FICHE.scene;

  await relire({ premier: true });
}

function fermerFiche() {
  /* On efface le match de l’adresse : sans cela, recharger la page
     rouvrirait la fiche qu’on vient de fermer. */
  if (location.search.includes('match=')) history.replaceState({}, '', '/matchs');
  $('fiche').classList.remove('on');
  FICHE.id = null;
  clearTimeout(FICHE.minuterie);
  clearInterval(FICHE.chrono);
  FICHE.minuterie = FICHE.chrono = null;
  FICHE.scene?.couper?.();
}

/** Relit le match, et redessine. */
async function relire({ premier = false } = {}) {
  const id = FICHE.id;
  if (!id) return;
  let d;
  try { d = await api('/match/' + id); }
  catch {
    if (premier) $('fcorps').innerHTML = '<div class="vide">Match indisponible.</div>';
    return planifierFiche();
  }
  if (FICHE.id !== id) return;                  // refermée entre-temps
  if (d.error) {
    /* Au premier coup, on le dit et on s'arrête : un match qui n'existe pas
       n'existera pas davantage dans trente secondes.

       En cours de route, non — on garde à l'écran ce qu'on avait et on
       retentera. Ce chemin ne replanifiait rien, si bien qu'un seul refus du
       relevé en amont figeait la fiche d'un match en cours **pour le reste de
       la visite**, sans que rien ne le montre. Le `catch` juste au-dessus,
       lui, retentait déjà : il n'y avait aucune raison que les deux façons
       d'échouer ne se traitent pas de la même manière. */
    if (premier) {
      $('fcorps').innerHTML = '<div class="vide">Match indisponible.</div>';
      return;
    }
    return planifierFiche();
  }
  FICHE.d = d;
  /* **Dessiner peut lever, et la relance ne doit pas en dépendre.**

     `dessinerFiche` et `reagir` lisent une trentaine de champs du relevé. Il
     suffisait qu'un seul manque — une ligue sans nom, un match sans fil — pour
     que l'exception emporte `planifierFiche` avec elle : plus de relecture,
     plus de chrono, une fiche arrêtée à la minute de l'incident et un joueur
     qui regarde un score qui ne bougera plus. La minuterie se replanifie donc
     dans tous les cas, et l'incident part en console pour être réparable. */
  try {
    dessinerFiche();
    reagir(d);
  } catch (e) {
    console.error('[matchs] la fiche a levé en se dessinant :', e);
  } finally {
    planifierFiche();
  }
}

/* Tant que le match est en cours, on relit toutes les trente secondes : c'est
   le rythme du relevé côté serveur, et redemander plus souvent ne donnerait
   rien de neuf. Match fini ou à venir : rien du tout — il ne bougera pas.

   Le délai est une constante nommée, et pas un nombre au milieu d’un appel :
   un contrôle peut le lire et dire ce qu’il vaut, là où il ne pourrait que
   constater qu'une minuterie existe — sans attendre trente secondes pour
   savoir laquelle. */
const RELECTURE_MS = 30_000;
function planifierFiche() {
  /* On **vide** les deux variables, on ne se contente pas d’annuler.

     `clearTimeout` annule le rappel mais laisse l'identifiant en place : la
     variable reste vraie pour toujours, et tout ce qui demande « une
     relecture est-elle prévue ? » répond oui sur un match terminé. La même
     faute avait déjà fait pousser le supporter de l'accueil après le coup de
     sifflet final. */
  clearTimeout(FICHE.minuterie); FICHE.minuterie = null;
  clearInterval(FICHE.chrono); FICHE.chrono = null;
  if (!FICHE.d?.fixture?.live) return;
  FICHE.minuterie = setTimeout(() => {
    if (document.hidden) return planifierFiche();
    relire();
  }, RELECTURE_MS);
  // La minute, elle, court sans rien demander à personne.
  FICHE.chrono = setInterval(() => {
    if (!document.hidden && FICHE.d) majChrono();
  }, 10_000);
}

function minuteFiche() {
  const f = FICHE.d?.fixture;
  if (!f?.live) return null;
  return window.TBF_HORLOGE.texte(
    { statut: f.status, minute: f.elapsed, extra: f.extra, vuA: f.luA },
    { HT: 'MI-TEMPS', BT: 'PROLONGATIONS' }) || null;
}

function majChrono() {
  const n = document.getElementById('fetat');
  if (n) n.textContent = minuteFiche() ?? 'EN COURS';
}

/**
 * Ce que le personnage fait des événements.
 *
 * Il ne réagit qu'à ce qui est **neuf**, et seulement à ce qui mérite qu'on
 * lève la tête : un but, un carton rouge, l'arbitrage vidéo, le coup de
 * sifflet final. Un personnage qui s'agite à chaque remplacement cesse d'être
 * regardé au bout de deux minutes.
 */
function reagir(d) {
  const scene = FICHE.scene;
  const premier = FICHE.vus === null;
  if (premier) FICHE.vus = new Set();

  const cle = (e) => `${e.type}|${e.detail}|${e.minute}|${e.extra ?? ''}|${e.equipe}|${e.joueur ?? ''}`;
  const neufs = [];
  for (const e of d.evenements ?? []) {
    const k = cle(e);
    if (FICHE.vus.has(k)) continue;
    FICHE.vus.add(k);
    if (!premier) neufs.push(e);
  }
  if (!scene) return;

  const mien = (id) => mesClubs?.has(Number(id)) ?? false;
  /* La couleur du club qui vient de marquer, éclaircie pour se lire sur le
     noir de l’écran — une couleur de blason est faite pour du papier blanc.
     Absente tant que le blason n’a pas été lu : on garde l’or du jeu. */
  const couleurDe = (id) => {
    const c = id === d.equipes.home.id ? d.equipes.home.couleur : d.equipes.away.couleur;
    return c ? (window.FX?.lisible?.(c) ?? c) : 'var(--projo)';
  };

  /* **L'API range sous « Goal » deux choses qui n'en sont pas** : le penalty
     manqué (« Missed Penalty »), et chaque tir de la séance de tirs au but,
     réussi ou non. Le personnage exultait donc sur le penalty que son club
     venait de rater, et une séance enchaînait les « GOAL ! » et les « ON
     ENCAISSE » sur un score qui ne bougeait pas — l'API ne compte pas la
     séance dans le score du match, elle la range à part (`periodes.penalty`,
     lue au coup de sifflet final, plus bas).

     Un tir de la séance ne porte aucune marque que cette page reçoive : le
     relevé du direct le reconnaît au commentaire « Penalty Shootout » de
     l'API (`estUnBut`, poller.js), mais la fiche du télétexte ne fait pas
     suivre ce commentaire. Il se reconnaît donc ici à son moment : arrivé
     pendant la séance ou après elle (P, PEN), à la minute où le jeu s'est
     arrêté — 120, ou 90 sans prolongation. Le seul vrai but que la règle
     puisse taire est un penalty de la toute fin des prolongations que l'API
     livrerait après le début de la séance : il est déjà dans le score, et le
     fil le montre. */
  const seance = ['P', 'PEN'].includes(d.fixture?.status);
  const pasUnBut = (e) => e.detail === 'Missed Penalty'
    || (seance && e.detail === 'Penalty' && (e.minute == null || e.minute >= 90));

  for (const e of neufs) {
    const aMoi = mien(e.equipe);
    const contreMoi = !aMoi && (mien(d.equipes.home.id) || mien(d.equipes.away.id));
    if (e.type === 'Goal') {
      if (pasUnBut(e)) continue;
      const sous = [e.joueur, e.minute != null ? `${e.minute}′` : ''].filter(Boolean).join(' · ');
      if (contreMoi) scene.moment('encaisse', 'ON ENCAISSE', { couleur: 'var(--flare)', sous });
      else scene.moment('but', aMoi ? 'GOAL !' : 'BUT',
        { couleur: aMoi ? couleurDe(e.equipe) : 'var(--craie)', sous });
    } else if (e.type === 'Var') {
      scene.moment('decision', 'ARBITRAGE VIDÉO',
        { couleur: 'var(--flare)', sous: e.detail ?? '' });
    } else if (e.type === 'Card' && /red/i.test(e.detail ?? '')) {
      scene.moment(contreMoi ? 'progression' : 'decision', 'CARTON ROUGE',
        { couleur: 'var(--flare)', sous: e.joueur ?? '' });
    }
  }

  /* Le coup de sifflet final, une seule fois. `finVue` existe parce que la
     fiche peut être relue après la fin — au retour d'un autre onglet, par
     exemple — et personne ne veut revoir la victoire toutes les trente
     secondes. */
  if (d.fixture.fini && !FICHE.finVue) {
    FICHE.finVue = true;
    const nous = mien(d.equipes.home.id) ? d.equipes.home.goals
      : mien(d.equipes.away.id) ? d.equipes.away.goals : null;
    const eux = mien(d.equipes.home.id) ? d.equipes.away.goals
      : mien(d.equipes.away.id) ? d.equipes.home.goals : null;
    if (nous == null) return;
    /* **Aux tirs au but, le score du match est un nul** : la séance se
       compte à part, et c'est elle qui décide. Maintenant que ses tirs ne
       crient plus « GOAL ! », c'est ici seulement qu'elle se dit — lue sur
       le score du match, une qualification aux tirs au but s'annonçait
       MATCH NUL. Sans le compte de la séance, on garde celui du match. */
    const tab = d.fixture.status === 'PEN' ? d.periodes?.penalty : null;
    const auxTirs = nous === eux && tab?.home != null && tab?.away != null;
    const [a, b] = !auxTirs ? [nous, eux]
      : mien(d.equipes.home.id) ? [tab.home, tab.away] : [tab.away, tab.home];
    const gagne = a > b, perdu = a < b;
    scene.moment(gagne ? 'victoire' : perdu ? 'defaite' : 'neutre',
      gagne ? 'VICTOIRE' : perdu ? 'DÉFAITE' : 'MATCH NUL',
      { couleur: gagne ? 'var(--vert)' : perdu ? 'var(--flare)' : 'var(--gris)',
        sous: auxTirs ? `aux tirs au but · ${a} – ${b}` : 'coup de sifflet final' });
  }
}

function dessinerFiche() {
  const d = FICHE.d;
  const f = d.fixture, e = d.equipes;
  const min = minuteFiche();
  const quand = new Date(f.date);
  const defile = $('fcorps').scrollTop;

  /* Le virage ne s'ouvre que sur un match en cours ou sur le point de
     commencer : proposer d'y entrer pour une rencontre d'hier serait un
     cul-de-sac, et le bouton doit dire pourquoi il est éteint. */
  const versCoupDEnvoi = quand.getTime() - Date.now();
  const virageOuvert = f.live || (versCoupDEnvoi > 0 && versCoupDEnvoi < 30 * 60_000);

  /* La compétition et sa journée, sans séparateur orphelin : sans nom de
     compétition, la ligne commençait par « · Journée 5 ». Sans l'un ni
     l'autre, la ligne disparaît — il n'en restait que la flèche « › », un
     lien vers rien de nommé. Et sans identifiant de compétition, le nom se
     lit sans mener nulle part plutôt que vers « ?ligue=undefined ». */
  const competition = [d.ligue.nom, d.ligue.journee].filter(Boolean).map(esc).join(' · ');
  const ligneCompetition = !competition ? ''
    : d.ligue.id != null
      ? `<a class="lg" href="/teletext?ligue=${encodeURIComponent(d.ligue.id)}">${competition} ›</a>`
      : `<span class="lg">${competition}</span>`;

  $('fcorps').innerHTML = `
    <button class="fermer tbf-plaque" id="ferme" aria-label="Fermer la fiche">‹</button>
    <div class="aff">
      ${ligneCompetition}
      <div class="sc">
        <img src="${esc(e.home.logo)}" alt="">
        <span class="n">${f.fini || f.live ? `${e.home.goals ?? 0} – ${e.away.goals ?? 0}`
          : heure(f.date)}</span>
        <img src="${esc(e.away.logo)}" alt="">
      </div>
      <div class="nom"><span>${esc(e.home.name)}</span><span>${esc(e.away.name)}</span></div>
      <div class="etat ${f.live ? '' : 'calme'}" id="fetat">${f.live ? (min ?? 'EN COURS')
        : f.fini ? 'TERMINÉ' : esc(f.statusLong ?? 'À VENIR')}</div>
    </div>
    <div class="infos">
      <!-- La date **et l'heure**. L'heure manquait : sur un match à venir elle
           n'était lisible qu'à la place du score, et elle disparaissait dès le
           coup d'envoi — or c'est elle qu'on cherche pour savoir si on a raté
           le début. -->
      <span>${quand.toLocaleDateString('fr',
        { weekday:'long', day:'numeric', month:'long' })} · ${heure(f.date)}</span>
      ${f.venue ? `<span>${esc(f.venue)}${f.ville ? ' · ' + esc(f.ville) : ''}</span>` : ''}
      ${f.arbitre ? `<span>M. ${esc(f.arbitre)}</span>` : ''}
    </div>
    <div class="allers">
      <!-- **Éteinte, la porte n'a pas d'adresse du tout.**

           Elle portait « href="#" », et « pointer-events:none » retenait le
           doigt — mais pas la touche Entrée : un lien reste dans l'ordre de
           tabulation, et l'Entrée y déclenche un clic que le CSS ne voit pas
           passer. Le navigateur suivait alors « # », ce qui **empile une
           entrée d'historique** sans rien changer à l'écran. La flèche de
           retour demandait ensuite deux pressions pour quitter les matchs, et
           la première ne faisait rien de visible : exactement ce qu'on décrit
           comme « la flèche retour ne marche pas ».

           Sans « href », la balise « a » n'est plus un lien : elle sort de la
           tabulation, et il n'y a plus d'adresse à suivre. « aria-disabled »
           dit aux lectures d'écran ce que l'opacité dit à l'œil.

           Pas d'accent grave dans ce commentaire : il vit dans un gabarit de
           chaîne JavaScript, et le premier accent grave referme la chaîne.
           C'est la faute que verif-pages guette, et je viens de la faire — le
           commentaire d'à côté prévenait déjà, trois lignes plus bas. -->
      <a class="aller tbf-plaque ${virageOuvert ? '' : 'eteint'}" data-ton="flare" data-porte="virage"
         ${virageOuvert ? `href="/virage?match=${f.id}"` : 'aria-disabled="true"'}>GRAND VIRAGE
        <small>${virageOuvert ? 'pousser avec la tribune' : 'pendant le match seulement'}</small></a>
      <!-- **Le match voyage avec le lien.** Le bouton menait à « /duel-nvn »
           tout court : on arrivait sur la liste de tous les matchs jouables,
           et il fallait y retrouver celui qu’on venait de quitter. Le virage
           transmettait déjà le sien ; le duel, non, sans autre raison qu’un
           oubli. La page de duel sait lire « ?match= » depuis toujours.

           Pas d’accent grave ici : ce balisage vit dans un gabarit de chaîne
           JavaScript, et un accent grave le referme. C’est la faute que
           verif-pages guette, et elle vient de se produire. -->
      <a class="aller tbf-plaque" data-ton="flare" data-porte="duel" href="/duel-nvn?match=${f.id}">DUEL<small>tribune contre tribune</small></a>
    </div>
    <section class="prono" id="prono" hidden aria-live="polite"></section>
    <div class="souspage tbf-onglets" data-ton="vert" id="souspage">
      <button data-s="fil" class="tbf-onglet ${FICHE.volet === 'fil' ? 'on' : ''}">LE FIL</button>
      <button data-s="stats" class="tbf-onglet ${FICHE.volet === 'stats' ? 'on' : ''}">STATISTIQUES</button>
      <button data-s="compo" class="tbf-onglet ${FICHE.volet === 'compo' ? 'on' : ''}">COMPOSITIONS</button>
    </div>
    <div id="souscontenu"></div>`;

  dessinerVolet();
  dessinerProno();
  $('fcorps').scrollTop = defile;

  $('souspage').onclick = (ev) => {
    const b = ev.target.closest('[data-s]');
    if (!b) return;
    FICHE.volet = b.dataset.s;
    [...$('souspage').children].forEach((x) => x.classList.toggle('on', x === b));
    dessinerVolet();
  };
  $('ferme').onclick = fermerFiche;
}

/* ------------------------------------------------------- le pronostic

   Lu une fois à l'ouverture de la fiche, puis gardé : la fiche d'un match en
   direct se redessine toutes les trente secondes, et le pronostic ne bouge
   pas pendant un match. Sans compte, ou sur un match qui n'est pas celui d'un
   club suivi, le panneau ne paraît pas — sauf si un pronostic y a déjà été
   donné, qu'on montre jusqu'à son issue. */
async function chargerProno(id) {
  const u = await moi();
  if (!u || FICHE.id !== id) return;
  try {
    const r = await fetch('/api/pronostics/match/' + id, { credentials: 'same-origin' });
    if (!r.ok) return;
    const d = await r.json();
    if (FICHE.id !== id) return;
    FICHE.prono = { ...d, saisie: d.prono ? { home: d.prono.home, away: d.prono.away }
      : { home: 0, away: 0 }, modifie: false };
    dessinerProno();
  } catch { /* le pronostic se tait, la fiche reste */ }
}

function dessinerProno() {
  const el = $('prono');
  const P = FICHE.prono, d = FICHE.d;
  if (!el || !d) return;
  if (!P || (!P.ouvert && !P.prono)) { el.hidden = true; return; }
  el.hidden = false;
  const e = d.equipes;
  const g = P.gains ?? {};
  const regle = P.prono && P.prono.issue;

  if (!P.ouvert) {
    /* Le match a commencé, ou il est fini : on montre ce qu'on avait dit. */
    const issue = !regle ? (d.fixture.fini
      ? '<p class="pr-dit">Les écharpes arrivent dès que le score final est confirmé.</p>'
      : '<p class="pr-dit">Verdict au coup de sifflet final.</p>')
      : P.prono.issue === 'exact'
        ? `<p class="pr-issue gagne">SCORE EXACT · +${P.prono.echarpes} ÉCHARPES</p>`
        : P.prono.issue === 'vainqueur'
          ? `<p class="pr-issue gagne">BON ${P.prono.home === P.prono.away ? 'NUL' : 'VAINQUEUR'} · +${P.prono.echarpes} ÉCHARPES</p>`
          : '<p class="pr-issue">RATÉ · ÇA NE COÛTE RIEN</p>';
    el.innerHTML = `<h3>TON PRONOSTIC</h3>
      <div class="pr-sc">
        <div class="pr-eq"><span class="pr-nom">${esc(e.home.name)}</span><span class="pr-n">${P.prono.home}</span></div>
        <span class="pr-tiret">–</span>
        <div class="pr-eq"><span class="pr-nom">${esc(e.away.name)}</span><span class="pr-n">${P.prono.away}</span></div>
      </div>${issue}`;
    return;
  }

  const s = P.saisie;
  const cpt = (cote) => `<div class="pr-cpt">
      <button type="button" data-pr="${cote}" data-d="-1" aria-label="Un but de moins pour ${esc(e[cote].name)}"
        ${s[cote] <= 0 ? 'disabled' : ''}>−</button>
      <span class="pr-n" data-n="${cote}">${s[cote]}</span>
      <button type="button" data-pr="${cote}" data-d="1" aria-label="Un but de plus pour ${esc(e[cote].name)}"
        ${s[cote] >= 20 ? 'disabled' : ''}>+</button></div>`;
  const deja = P.prono && !P.modifie;
  el.innerHTML = `<h3>TON PRONOSTIC</h3>
    <div class="pr-sc">
      <div class="pr-eq"><span class="pr-nom">${esc(e.home.name)}</span>${cpt('home')}</div>
      <span class="pr-tiret">–</span>
      <div class="pr-eq"><span class="pr-nom">${esc(e.away.name)}</span>${cpt('away')}</div>
    </div>
    <button type="button" class="tbf-plaque pr-valider" data-ton="vert" id="prValider"
      ${deja ? 'disabled' : ''}>${deja ? 'PRONOSTIC ENREGISTRÉ' : P.prono ? 'CHANGER MON PRONOSTIC' : 'VALIDER MON PRONOSTIC'}</button>
    <p class="pr-dit">Gratuit. Bon vainqueur : ${g.vainqueur ?? 0} écharpes. Score exact : ${g.exact ?? 0}.
      Modifiable jusqu’au coup d’envoi.</p>`;

  el.onclick = async (ev) => {
    const b = ev.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pr) {
      const c = b.dataset.pr;
      s[c] = Math.max(0, Math.min(20, s[c] + Number(b.dataset.d)));
      P.modifie = !P.prono || s.home !== P.prono.home || s.away !== P.prono.away;
      return dessinerProno();
    }
    if (b.id === 'prValider') {
      b.disabled = true;
      try {
        const r = await fetch('/api/pronostics/match/' + FICHE.id, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ home: s.home, away: s.away }) });
        const j = await r.json();
        if (r.ok) {
          P.prono = j.prono;
          P.modifie = false;
        } else {
          /* Le coup d'envoi est passé pendant qu'on hésitait : le panneau
             relit ce qui est vrai plutôt que de garder un bouton qui ment. */
          P.ouvert = false;
          if (!P.prono) { FICHE.prono = null; }
        }
      } catch { /* hors ligne : le bouton se rallume au dessin */ }
      dessinerProno();
    }
  };
}

function dessinerVolet() {
  const d = FICHE.d;
  // Le fil peut manquer là où les statistiques et les compositions se
  // contentent d'être vides ; `reagir` le lit déjà avec la même précaution.
  const fil = d.evenements ?? [];
  const VOLETS = {
    fil: () => fil.length ? `
      ${fil.map((ev) => {
        const droite = ev.equipe === d.equipes.away.id;
        const ic = ev.type === 'Card'
          ? `<span style="color:${/Red/i.test(ev.detail) ? 'var(--flare)' : 'var(--projo)'}">▮</span>`
          : (ICONES[ev.type] ?? '•');
        // Sans minute, la case reste vide : une apostrophe seule n'en est pas une.
        const quand = ev.minute == null ? '' : `${ev.minute}${ev.extra ? '+' + ev.extra : ''}'`;
        return `<div class="ev ${droite ? 'droite' : ''}">
          <span class="min">${quand}</span>
          <span class="ic">${ic}</span>
          <span class="txt">${esc(ev.joueur ?? '')}
            <small>${esc(ev.detail ?? ev.type)}${ev.passeur ? ' · ' + esc(ev.passeur) : ''}</small>
          </span></div>`;
      }).join('')}`
      : `<div class="vide" style="padding:30px">
          ${d.fixture.fini ? 'Aucun événement enregistré.'
            : 'Le match n’a pas encore commencé.'}</div>`,

    stats: () => d.statistiques?.length
      ? d.statistiques.map((st) => `
        <div class="st">
          <div class="l"><b>${esc(String(st.home))}</b><span>${esc(st.nom)}</span>
            <b>${esc(String(st.away))}</b></div>
          <div class="b"><i style="width:${st.partHome}%"></i>
            <i style="width:${100 - st.partHome}%"></i></div>
        </div>`).join('')
      : `<div class="vide" style="padding:30px">${d.fixture.live || d.fixture.fini
          ? 'Statistiques indisponibles pour ce match.'
          : 'Elles apparaîtront dès le coup d’envoi.'}</div>`,

    compo: () => {
      const c = d.compositions;
      if (!c?.home && !c?.away) {
        return `<div class="vide" style="padding:30px">
          ${d.fixture.live || d.fixture.fini ? 'Compositions non publiées pour ce match.'
            : 'Les compositions paraissent environ une heure avant le coup d’envoi.'}</div>`;
      }
      const cote = (co, nom) => co ? `
        <div>
          <div class="eq">${esc(nom)}<small>${esc(co.dispositif ?? '')}</small></div>
          ${co.titulaires.map((j) => `<div class="j">
            <span class="n">${j.numero ?? ''}</span>
            <span class="p">${esc(j.nom ?? '')}</span>
            <span class="po">${esc(j.poste ?? '')}</span></div>`).join('')}
          ${co.remplacants.length ? `<div class="banc">REMPLAÇANTS</div>
            ${co.remplacants.map((j) => `<div class="j" style="color:var(--gris)">
              <span class="n">${j.numero ?? ''}</span>
              <span class="p">${esc(j.nom ?? '')}</span></div>`).join('')}` : ''}
          ${co.entraineur ? `<div class="coach">${esc(co.entraineur)}</div>` : ''}
        </div>` : '<div class="vide" style="padding:20px">Non publiée</div>';
      return `<div class="compo">
        ${cote(c.home, d.equipes.home.name)}${cote(c.away, d.equipes.away.name)}</div>`;
    },
  };
  $('souscontenu').innerHTML = VOLETS[FICHE.volet]();
}

/**
 * Qui regarde cette page — ou personne.
 *
 * **Une seule promesse pour tout le document.** `nav.js` pose exactement la
 * même sous ce nom pour décider s'il monte la barre du haut : sans ce partage,
 * la page poserait deux fois la même question au même serveur, et c'est le
 * genre de doublon qui finit un jour par donner deux réponses différentes.
 *
 * Elle rend l'utilisateur ou `null`, hors ligne compris. Ici, **ne pas savoir
 * revient à ne pas être connecté** : la page des matchs se lit sans compte, et
 * une panne d'authentification ne doit pas la fermer.
 */
const moi = () => (window.TBF_MOI ??= fetch('/api/auth/me', { credentials: 'same-origin' })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => j?.user ?? null)
  .catch(() => null));

/* La réponse, retenue pour être lisible **sans attendre**. Un clic ne peut pas
   patienter : le temps qu'une promesse aboutisse, le navigateur a déjà suivi
   le lien et `preventDefault()` arrive trop tard. */
let connu = null;
moi().then((u) => {
  connu = u ?? false;
  /* « Mes clubs » ne paraît que pour qui en suit. Le bouton naît caché dans le
     HTML plutôt que d'être retiré ici : un bouton qu'on voit disparaître fait
     douter de ce qu'on vient de lire, un bouton qui n'a jamais été là ne
     manque à personne. Le prix se paie côté joueur connecté, qui le voit
     arriver après un dixième de seconde — et c'est le seul à qui il serve. */
  if (u) $('fMien').hidden = false;
});

/* ----------------------------------------- les deux portes, sans compte

   Le Grand Virage et le Duel restent **visibles** pour un visiteur sans
   compte, et c'est voulu : ce sont les deux choses que ce jeu sait faire et
   qu'aucun autre écran public ne montre. Les cacher reviendrait à ne rien
   proposer à celui qui vient tout juste de découvrir le jeu.

   Ils ne s'ouvrent pas pour autant. Le geste est retenu, et remplacé par une
   invitation qui dit **ce qu'il y a derrière la porte** — pas un « connectez-
   vous » sec, qui se lit comme un refus et n'apprend rien.                   */

const PORTES = {
  virage: {
    titre: 'ENTRER DANS LE GRAND VIRAGE',
    texte: 'Pendant le vrai match, tu pousses sur la corde avec les autres '
      + 'supporters de ton club, minute par minute. Chaque but vécu depuis le '
      + 'virage te laisse une carte que personne ne pourra t’acheter.',
  },
  duel: {
    titre: 'TRIBUNE CONTRE TRIBUNE',
    texte: 'Tu alignes tes supporters, l’autre tribune aligne les siens, et le '
      + 'chant le plus fort l’emporte. Il faut une place et quelques cartes '
      + 'pour entrer.',
  },
};

/**
 * L'invitation.
 *
 * Pas de `ton` : dans une boîte de dialogue, `flare` veut dire « ceci
 * détruit » et `or` « ceci coûte ». Entrer dans le jeu ne fait ni l'un ni
 * l'autre, et emprunter le rouge de la destruction pour une inscription
 * gratuite abîmerait les deux mots à la fois.
 */
function inviter(quelle) {
  const p = PORTES[quelle] ?? PORTES.virage;
  const boite = window.TBF_DIALOGUE;
  /* Sans la boîte — script non chargé — on emmène directement plutôt que de ne
     rien faire : un bouton qui ne répond pas est pire qu'un détour. */
  if (!boite) { location.href = '/compte'; return; }

  boite.confirmer({
    titre: p.titre,
    texte: p.texte,
    /* Le lien discret sous le texte : on propose de prendre une place, on ne
       demande pas d'en créer une à qui en a déjà une. */
    corps: '<p class="deja">Déjà une place ? <a href="/compte">Se connecter</a></p>',
    oui: 'PRENDRE MA PLACE',
    sousOui: 'gratuit',
    non: 'PLUS TARD',
  }).then((oui) => { if (oui) location.href = '/compte'; });
}

/* Posé une fois sur le cadre, jamais sur les liens : la fiche se redessine à
   chaque relevé du direct, et un écouteur posé sur les boutons repartirait
   avec eux toutes les trente secondes. */
$('fcorps').addEventListener('click', (e) => {
  // `[href]` et pas `.aller` seul : une porte éteinte n'a plus d'adresse, et
  // c'est son adresse qu'on s'apprête à suivre à la main.
  const lien = e.target.closest('.aller[href]');
  if (!lien || connu) return;          // connecté : le lien fait son travail

  /* On retient le geste **avant** de savoir. Si la réponse n'est pas encore
     arrivée — le cas d'un clic très rapide — laisser passer enverrait un
     visiteur sans compte sur un écran qui le refusera. Retenir puis suivre le
     lien soi-même ne coûte qu'un battement, et jamais au mauvais moment. */
  e.preventDefault();
  const cible = lien.getAttribute('href');
  moi().then((u) => { if (u) location.href = cible; else inviter(lien.dataset.porte); });
});

$('fiche').addEventListener('click', (e) => {
  if (e.target.id === 'fiche') fermerFiche();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('fiche').classList.contains('on')) fermerFiche();
});

charger();

/* ------------------------------------------------- une fiche par l'adresse

   /matchs?match=8801 ouvre directement ce match.

   La page des compétitions y envoie depuis ses résultats : un match de la
   quatrième journée n'est la journée de personne, et il n'existe pas d'autre
   écran qui sache le raconter — le fil, les statistiques, les compositions et
   le Fanzzy qui regarde vivent tous ici. Recopier la fiche là-bas aurait fait
   deux fiches à corriger au lieu d'une.

   La liste du jour se charge quand même derrière : fermer la fiche doit mener
   quelque part, et un écran vide n'est pas quelque part.                     */
const matchDemande = Number(new URLSearchParams(location.search).get('match'));
