<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Mon KOP — thebestfan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(120% 50% at 50% -8%,rgba(245,195,59,.13),transparent 60%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;padding:26px 16px 80px}
main{width:100%;max-width:var(--colonne)}
h1{font-family:var(--banner);font-weight:600;font-size:21px;letter-spacing:.16em;margin:0 0 4px;text-align:center}
/* Le titre de rubrique est cousu (`.tbf-cousu`, dans ui.css) : il ne reste
   ici que sa place. */
h2{margin:24px 2px 9px}

/* ------------------------------------------------------------ le KOP */

/* Plus de flou d'arrière-plan : `--panneau` est opaque, et le flou coûtait
   cher sur un téléphone modeste pour rendre le texte moins lisible au soleil. */
.kop{border:1px solid var(--trait);border-radius:var(--r);background:var(--panneau);
  padding:14px;margin-bottom:10px}
.kop.mien{border-color:rgba(245,195,59,.4)}
.kop .tete{display:flex;align-items:baseline;gap:9px}
.kop .tete b{font-family:var(--banner);font-size:16px;letter-spacing:.03em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kop .tete .club{font-size:11px;opacity:.88;white-space:nowrap}
.kop .chiffres{display:flex;gap:16px;margin-top:11px}
.kop .ch{min-width:0}
.kop .ch b{display:block;font-family:var(--banner);font-size:19px;color:var(--projo);line-height:1}
/* En Oswald : à onze pixels, « VERSÉ PAR TOI », « DANS LE POT » et
   « MEMBRES » ne tiennent côte à côte sur un téléphone que dans la condensée
   du jeu. */
.kop .ch span{font-family:var(--banner);font-size:11px;letter-spacing:.08em;opacity:.88;
  display:block;margin-top:3px}

/* Le pot. Une barre, pas un tableau : ce qui compte est de voir si le
   prochain bonus est à portée, pas de lire un chiffre exact. Dix pixels et
   non quatre : un trait de quatre pixels ne se voit pas au soleil, et c'est
   la jauge qui donne envie de pousser un match de plus. */
.pot{height:10px;border-radius:5px;background:rgba(242,238,228,.12);margin-top:12px;overflow:hidden}
.pot i{display:block;height:100%;background:linear-gradient(90deg,var(--projo),#B8860B);width:0;
  transition:width .5s cubic-bezier(.3,.9,.4,1)}
/* Moins de mouvement, demandé au système ou dans le tiroir (le mode calme,
   contrat C4, d'où le double) : la barre se pose sans pousser. Sa longueur,
   qui est l'information, reste. */
@media (prefers-reduced-motion:reduce){ .pot i{transition:none} }
html[data-calme~="animations"] .pot i{transition:none}

.membres{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mb{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--trait);background:rgba(0,0,0,.25)}
.mb.chef{border-color:var(--projo);color:var(--projo)}
.mb small{font-size:11px;opacity:.88;font-variant-numeric:tabular-nums}

/* ----------------------------------------------------------- le vote */

.vote{border:1px solid rgba(245,195,59,.45);border-radius:var(--r);padding:14px;margin:12px 0 0;
  background:rgba(245,195,59,.07)}
.vote .quoi{font-family:var(--banner);font-size:14.5px;letter-spacing:.03em}
.vote .txt{font-size:11.5px;opacity:.88;line-height:1.6;margin-top:5px}
/* Le compte à rebours. Trois minutes, c'est court : il doit être le premier
   chiffre que l'œil trouve, sinon on vote après la clôture. */
.chrono{font-family:var(--banner);font-size:22px;color:var(--projo);font-variant-numeric:tabular-nums;
  line-height:1}
.chrono.urgent{color:var(--flare)}
.vote .haut{display:flex;align-items:flex-start;gap:12px}
.vote .haut .quoi{flex:1;min-width:0}
/* La balance du vote : dix pixels, comme le pot. C'est elle qui dit d'un coup
   d'œil de quel côté penche le KOP avant qu'on vote, et un trait de sept
   pixels se perd au soleil ; la carte du vote a toute la place qu'il faut. */
.balance{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 6px;
  background:rgba(242,238,228,.1)}
.balance .p{background:var(--vert)}
.balance .c{background:var(--flare)}
.decompte{display:flex;justify-content:space-between;font-size:11px;opacity:.88}
/* Les deux bulletins sont des plaques : vert pour, rouge contre, le ton de ce
   qu'elles font. Le bulletin déjà donné porte la coche (icône commune) et
   `aria-pressed` — il restait sinon à deviner, à une bordure près, lequel des
   deux on avait touché. */
.bulletins{display:flex;gap:7px;margin-top:11px}
.bul{flex:1}

/* -------------------------------------------------------- le catalogue */

/* Une ligne qui se touche, pas un bouton : un nom, sa phrase et son prix. Elle
   prend donc le panneau commun (`.pan`, qui lui donne son fond, son trait et
   l'enfoncement au doigt) et ne garde ici que sa mise en page. Une plaque en
   capitales centrées aurait écrasé la phrase qui dit ce que le bonus fait. */
.bonus{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  margin-bottom:6px;width:100%;text-align:left}
/* Hors de prix : grisé et tireté, mais **lisible**. À 42 % d'opacité, on ne
   lisait plus ni ce que le bonus fait ni ce qu'il manque au pot — alors que
   c'est justement ce qu'on vient chercher devant un bonus qu'on ne peut pas
   encore s'offrir. */
.bonus:disabled{cursor:default;filter:grayscale(1);border-style:dashed}
.bonus .n{flex:1;min-width:0}
.bonus .n b{display:block;font-family:var(--banner);font-size:13.5px;letter-spacing:.02em}
.bonus .n span{display:block;font-size:11px;opacity:.88;line-height:1.5;margin-top:3px}
.bonus .prix{font-family:var(--banner);font-size:15px;color:var(--projo);flex:none;text-align:center}
.bonus .prix small{display:block;font-size:11px;letter-spacing:.06em;opacity:.88;color:var(--craie);
  margin-top:2px}

.actif{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--vert);color:var(--vert);margin:0 5px 5px 0}

/* ------------------------------------------------------------ actions */

/* Les gros boutons sont des plaques (`.tbf-plaque`) : violet pour créer un
   KOP — les gens —, béton pour voir, replier ou quitter. Il ne reste ici que
   leur place ; la peinture, l'enfoncement et l'état éteint viennent de ui.css,
   comme partout ailleurs. */
.gros{width:100%;margin-top:10px}
.champ{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--trait);border-radius:9px;
  color:inherit;padding:12px;font-family:var(--ui);font-size:14px;margin-top:8px}
.champ:focus{outline:none;border-color:var(--projo)}

/* Ces trois-là peuvent se trouver hors d'un panneau de KOP, donc à même la
   photo de tribune : ils portent leur propre fond. */
.vide{border:1px dashed var(--trait);border-radius:var(--r);padding:18px;text-align:center;
  font-size:12.5px;line-height:1.7;background:var(--panneau)}
.vide a{color:var(--projo)}
.note{font-size:11px;opacity:.88;line-height:1.65;margin-top:8px}
.note.seule{opacity:1;padding:12px 14px;border:1px solid var(--trait);border-radius:var(--r);
  background:var(--panneau)}
.err{border:1px solid rgba(224,64,44,.4);border-radius:9px;
  background:linear-gradient(rgba(224,64,44,.12),rgba(224,64,44,.12)),var(--panneau);
  padding:10px 12px;font-size:12px;margin-top:10px}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
</head>
<body>
<main id="app">
  <p class="tbf-sous">La caisse du virage</p>
  <div id="corps"><div class="vide">Chargement…</div></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =======================================================================
   Le KOP.

   Une page, quatre gestes : créer, rejoindre, voir le pot, voter.

   Ce qui gouverne son rythme, c'est le vote : **trois minutes**. Tout le
   reste peut attendre un rafraîchissement, pas lui. La page écoute donc le
   socket pour l'ouverture et la clôture, et fait tourner un compte à rebours
   local entre les deux — sans quoi la moitié des membres voterait après la
   fermeture sans jamais comprendre pourquoi leur clic n'a rien fait.
   ======================================================================= */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const MESSAGES = {
  /* **Créer** demande un abonnement, **rejoindre** non. Le message le dit
     dans cet ordre : ce qui est encore possible avant ce qui ne l’est pas,
     sinon on lit un refus là où il y a une porte ouverte. */
  'kop.error.abonnement':     'Rejoindre un KOP est ouvert à tous ; en créer un demande '
                              + 'un abonnement. Cherche celui de ton club juste en dessous.',
  'kop.error.nom':            'Ce nom ne va pas : entre 3 et 40 caractères, sans balise.',
  'kop.error.club':           'Ce club n’existe pas.',
  'kop.error.pas_ton_club':   'Tu ne suis pas ce club. Suis-le d’abord depuis « Mes clubs ».',
  'kop.error.deja_membre':    'Tu es déjà dans un KOP de ce club. On n’en a qu’un par club.',
  'kop.error.inconnu':        'Ce KOP n’existe plus.',
  'kop.error.pas_membre':     'Tu n’es pas membre de ce KOP.',
  'kop.error.bonus_inconnu':  'Ce bonus n’existe pas.',
  'kop.error.vote_en_cours':  'Un vote est déjà ouvert. Un seul à la fois : le pot n’en couvre qu’un.',
  'kop.error.pot_insuffisant':'Le pot ne suffit pas encore pour ce bonus.',
  'kop.error.vote_inconnu':   'Ce vote n’existe plus.',
  'kop.error.vote_clos':      'Le vote est clos. Trois minutes, c’est court.',
  'kop.error.server':         'Le serveur n’a pas pu traiter la demande.',
  /* Hors du préfixe `kop.error.` : le serveur ne l'envoie jamais, c'est `api`
     qui le lève quand la réponse n'est pas du JSON. Sans cette ligne, le joueur
     lisait le code brut — ce que la table entière existe pour éviter. */
  'app.error.illisible':      'Le serveur n’a pas répondu correctement. Réessaie dans un instant.',
};

const S = {
  kops: [],            // mes KOP, un par club suivi au plus
  clubs: [],           // mes clubs, avec les KOP existants pour ceux sans KOP
  etats: {},           // kopId -> état détaillé
  catalogue: [],
  ouvert: null,        // le KOP déplié
  erreur: null,
  creation: null,      // teamId pour lequel on saisit un nom
};

async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch('/api/kop' + path, {
    method, credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  /* **La session expirée n'était pas traitée.** Toutes les autres pages du jeu
     renvoient vers la connexion sur un 401 ; celle-ci était la seule à ne pas
     le faire. Le refus revenait alors comme un objet vide, et l'écran
     annonçait tranquillement qu'on n'a pas de KOP — à quelqu'un qui en a un.
     Perdre son groupe est la chose la plus inquiétante que ce jeu puisse
     afficher, et c'était la traduction d'un simple « reconnecte-toi ». */
  if (r.status === 401) { location.href = '/compte'; throw new Error('auth'); }
  /* Et le corps du refus se lit quel que soit le code, parce que c'est lui qui
     porte `error`. Mais une réponse qui n'est **pas du JSON** — page d'erreur
     de l'hébergeur, proxy qui répond à la place du serveur — rendait elle
     aussi un objet vide, donc la même fausse nouvelle. Voir `cartes.js`, où le
     même défaut laissait la fiche d'un Fanzzy blanche. */
  const json = await r.json().catch(() => null);
  if (!json) {
    console.warn(`[kop] ${path} : ${r.status}, et ce n’est pas du JSON`);
    throw Object.assign(new Error('reponse illisible'), { code: 'app.error.illisible' });
  }
  if (json?.error) throw Object.assign(new Error(json.error), { code: json.error });
  return json;
}

/* --------------------------------------------------------- chargement */

async function charger() {
  try {
    const [mes, clubs] = await Promise.all([
      api('/miens'),
      fetch('/api/me/state', { credentials: 'same-origin' })
        .then((r) => r.json()).catch(() => ({ follows: [] })),
    ]);
    S.kops = mes.kops ?? [];
    S.catalogue = mes.catalogue ?? [];

    // Les clubs suivis qui n'ont pas encore de KPO à moi : c'est là qu'on en
    // crée ou qu'on en rejoint un.
    const avecKop = new Set(S.kops.map((k) => Number(k.team_id)));
    S.clubs = [];
    for (const f of clubs.follows ?? []) {
      const id = Number(f.team_id ?? f.id);
      if (avecKop.has(id)) continue;
      const dispo = await api(`/club/${id}`).catch(() => ({ kops: [] }));
      S.clubs.push({ id, nom: f.name ?? `Club ${id}`, kops: dispo.kops ?? [] });
    }

    // L'état détaillé du KOP déplié : membres, vote, bonus actifs.
    if (S.ouvert) S.etats[S.ouvert] = await api(`/${S.ouvert}`).catch(() => null);
  } catch (e) {
    S.erreur = e.code ?? 'kop.error.server';
  }
  rendre();
}

/* ------------------------------------------------------------ rendu */

const mmss = (ms) => {
  const t = Math.max(0, Math.round(ms / 1000));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
};

function bonusDef(id) { return S.catalogue.find((b) => b.id === id); }

/**
 * Un bulletin : une plaque au ton de ce qu'il fait, vert pour, rouge contre.
 *
 * Celui qu'on a déjà donné porte la coche et `aria-pressed`. Il se distinguait
 * par une bordure colorée sur un bouton sombre ; en plaques, les deux sont
 * colorées, et c'est la coche qui dit lequel est le sien. `on` reste posé pour
 * qui lirait encore la classe.
 */
function bulletin(vote, valeur, sens, ton, mot) {
  const mien = vote.monBulletin === valeur;
  return `<button class="bul ${sens} tbf-plaque ${mien ? 'on' : ''}" data-ton="${ton}"
      aria-pressed="${mien}" data-voter="${vote.id}" data-pour="${valeur}">${
      mien ? '<i class="tbf-ico tbf-ico-coche" aria-hidden="true"></i>' : ''}${mot}</button>`;
}

function voteHTML(e) {
  const def = bonusDef(e.vote.bonusId);
  const total = Math.max(1, e.vote.pour + e.vote.contre);
  const urgent = e.vote.fermeDansMs < 45_000;
  return `<div class="vote">
    <div class="haut">
      <div class="quoi">${esc(def?.nom ?? e.vote.bonusId)}
        <div class="txt">${esc(def?.texte ?? '')}</div></div>
      <div class="chrono ${urgent ? 'urgent' : ''}" data-chrono="${e.vote.ferme}"
        >${mmss(e.vote.fermeDansMs)}</div>
    </div>
    <div class="balance">
      <div class="p" style="width:${(e.vote.pour / total) * 100}%"></div>
      <div class="c" style="width:${(e.vote.contre / total) * 100}%"></div>
    </div>
    <div class="decompte"><span>${e.vote.pour} pour</span><span>${e.vote.contre} contre</span></div>
    <div class="bulletins">${bulletin(e.vote, 1, 'pour', 'vert', 'POUR')}${
      bulletin(e.vote, 0, 'contre', 'flare', 'CONTRE')}</div>
    ${e.jeSuisCreateur
      ? '<div class="note">Tu pèses cinq voix, et tu départages une égalité.</div>'
      : '<div class="note">Le créateur pèse cinq voix et départage une égalité.</div>'}
  </div>`;
}

function kopHTML(k) {
  const e = S.etats[k.id];
  const ouvert = S.ouvert === k.id;
  const out = [`<div class="kop mien">
    <div class="tete"><b>${esc(k.nom)}</b>
      <span class="club">${esc(k.team_nom ?? '')}</span></div>
    <div class="chiffres">
      <div class="ch"><b data-pot="${esc(k.id)}">${k.pot}</b><span>DANS LE POT</span></div>
      <div class="ch"><b>${k.membres}</b><span>MEMBRES</span></div>
      <div class="ch"><b>${k.verse}</b><span>VERSÉ PAR TOI</span></div>
    </div>`];

  // La barre vise le bonus le moins cher : c'est le prochain palier réel, et
  // c'est lui qui donne envie de pousser un match de plus.
  const prochain = [...S.catalogue].sort((a, b) => a.prix - b.prix)
    .find((b) => b.prix > k.pot);
  if (prochain) {
    out.push(`<div class="pot"><i style="width:${Math.min(100, (k.pot / prochain.prix) * 100)}%"></i></div>
      <div class="note">${prochain.prix - k.pot} écharpes avant « ${esc(prochain.nom)} ».</div>`);
  } else {
    out.push('<div class="pot"><i style="width:100%"></i></div>'
      + '<div class="note">Le pot couvre tout ce qui est au catalogue.</div>');
  }

  if (!ouvert) {
    out.push(`<button class="gros tbf-plaque" data-ouvrir="${k.id}">VOIR LE KOP</button></div>`);
    return out.join('');
  }

  if (!e) { out.push('<div class="note">Chargement…</div></div>'); return out.join(''); }

  out.push(`<div class="membres">${e.membres.map((m) => `<span class="mb ${m.createur ? 'chef' : ''}">
    ${esc(m.pseudo)}<small>${m.verse}</small></span>`).join('')}</div>`);

  if (e.bonus.length) {
    out.push('<h2 class="tbf-cousu">BONUS ACTIFS</h2><div>' + e.bonus.map((b) => {
      const def = bonusDef(b.bonusId);
      const reste = b.portee === 'saison' ? 'toute la saison'
        : `${b.restant} match${b.restant > 1 ? 's' : ''}`;
      return `<span class="actif">${esc(def?.nom ?? b.bonusId)} · ${reste}</span>`;
    }).join('') + '</div>');
  }

  if (e.vote) {
    out.push('<h2 class="tbf-cousu">VOTE EN COURS</h2>' + voteHTML(e));
  } else {
    out.push('<h2 class="tbf-cousu">PROPOSER UNE DÉPENSE</h2>');
    for (const b of S.catalogue) {
      const trop = b.prix > e.pot;
      const duree = b.portee === 'match' ? 'un match'
        : b.portee === 'saison' ? 'la saison' : `${b.charges ?? 3} matchs`;
      out.push(`<button class="bonus pan" data-proposer="${b.id}" data-kop="${k.id}"
        ${trop ? 'disabled' : ''}>
        <span class="n"><b>${esc(b.nom)}</b><span>${esc(b.texte)} · ${duree}</span></span>
        <span class="prix">${b.prix}<small>ÉCHARPES</small></span></button>`);
    }
    out.push('<div class="note">Trois minutes de vote. Le créateur pèse cinq voix '
      + 'et départage une égalité.</div>');
  }

  out.push(`<button class="gros tbf-plaque" data-quitter="${k.id}">QUITTER CE KOP</button>
    <div class="note">Ce que tu as versé reste au pot. On ne reprend pas sa part.</div>`);
  out.push('</div>');
  return out.join('');
}

function clubHTML(c) {
  const out = [`<div class="kop">
    <div class="tete"><b>${esc(c.nom)}</b><span class="club">sans KOP</span></div>`];

  if (c.kops.length) {
    out.push('<div class="note">Des KOP existent déjà pour ce club :</div>');
    for (const k of c.kops) {
      out.push(`<button class="bonus pan" data-rejoindre="${k.id}">
        <span class="n"><b>${esc(k.nom)}</b><span>${k.membres} membre${k.membres > 1 ? 's' : ''}
          · ${k.verse_total} écharpes versées depuis l’ouverture</span></span>
        <span class="prix">${k.pot}<small>AU POT</small></span></button>`);
    }
  }

  /* Créer un KOP, c'est rassembler des gens : la plaque est violette. Quand
     d'autres KOP existent déjà pour ce club, elle redevient béton — les
     rejoindre est le geste qu'on propose d'abord, et en créer un de plus ne
     doit pas crier plus fort que lui. */
  if (S.creation === c.id) {
    out.push(`<input class="champ" id="nom-${c.id}" maxlength="40" placeholder="Le nom du KOP"
      autocomplete="off">
      <button class="gros tbf-plaque" data-ton="violet" data-creer="${c.id}">CRÉER</button>`);
  } else {
    out.push(`<button class="gros tbf-plaque" ${c.kops.length ? '' : 'data-ton="violet"'}
      data-nouveau="${c.id}">CRÉER UN KOP</button>`);
  }
  out.push('</div>');
  return out.join('');
}

function rendre() {
  const out = [];
  if (S.erreur) out.push(`<div class="err">${esc(MESSAGES[S.erreur] ?? S.erreur)}</div>`);

  if (S.kops.length) {
    out.push('<h2 class="tbf-cousu">MES KOP</h2>');
    for (const k of S.kops) out.push(kopHTML(k));
  }

  if (S.clubs.length) {
    out.push('<h2 class="tbf-cousu">MES CLUBS SANS KOP</h2>');
    for (const c of S.clubs) out.push(clubHTML(c));
  }

  if (!S.kops.length && !S.clubs.length) {
    out.push(`<div class="vide">Tu ne suis aucun club pour l’instant.<br>
      Un KOP est adossé à un club : commence par en <a href="/equipes">suivre un</a>.</div>`);
  }

  // Hors de tout KOP, donc sur la photo : elle porte son propre panneau.
  if (S.kops.length) {
    out.push(`<div class="note seule">Pousser pour ton club pendant un duel remplit le pot de ton
      KOP, en plus de tes propres écharpes. Ce que le KOP achète profite à tous ses membres
      présents dans le VIRAGE.</div>`);
  }

  $('corps').innerHTML = out.join('');
  compterPots();
}

/* Le pot compte quand il bouge. Un vote dépouillé le vide d'un coup, un
   membre qui pousse pendant un duel le remplit : relu à l'annonce d'un vote
   ou toutes les trente secondes, il sautait d'un chiffre à l'autre sous les
   yeux, ce qui se lit comme une erreur d'affichage. `rendre` vient d'écrire
   la valeur finale — c'est ce qui reste si fx.js manque ; `compter` la
   reprend aussitôt depuis celle qu'on voyait. Au premier rendu, rien ne
   compte : il n'y a pas encore de « avant ». */
const potsVus = new Map();
function compterPots() {
  for (const k of S.kops) {
    const avant = potsVus.get(k.id);
    potsVus.set(k.id, k.pot);
    if (avant === undefined || avant === k.pot) continue;
    const el = $('corps').querySelector(`[data-pot="${CSS.escape(String(k.id))}"]`);
    if (el && window.FX?.compter) FX.compter(el, avant, k.pot);
  }
}

/* ---------------------------------------------------------- les gestes */

$('corps').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  S.erreur = null;

  try {
    if (d.ouvrir) {
      // Replier en cliquant à nouveau : la page tient sur un écran.
      S.ouvert = S.ouvert === d.ouvrir ? null : d.ouvrir;
      return charger();
    }
    if (d.nouveau) { S.creation = Number(d.nouveau); rendre();
      return $(`nom-${d.nouveau}`)?.focus(); }
    if (d.creer) {
      const nom = $(`nom-${d.creer}`)?.value ?? '';
      const k = await api('/', { method: 'POST', body: { teamId: Number(d.creer), nom } });
      S.creation = null; S.ouvert = k.id;
      return charger();
    }
    if (d.rejoindre) {
      const k = await api(`/${d.rejoindre}/rejoindre`, { method: 'POST' });
      S.ouvert = k.id;
      return charger();
    }
    if (d.quitter) {
      /* Un geste irréversible mérite une question. Ce qui est versé est versé,
         et on ne le découvre pas après coup.
         C'était `confirm()` — la boîte grise du navigateur, en police système,
         précédée de « thebestfan.online indique ». Elle sort de l'univers du
         jeu à l'instant précis où on demande au joueur de s'engager. */
      if (!(await window.TBF_DIALOGUE?.confirmer({
        titre: 'QUITTER CE KOP ?',
        texte: 'Ce que tu as versé au pot y reste. Tu perds ta part des bonus '
          + 'votés, et il faudra être réinvité pour revenir.',
        oui: 'QUITTER', ton: 'flare',
      }))) return undefined;
      await api(`/${d.quitter}/quitter`, { method: 'POST' });
      S.ouvert = null;
      return charger();
    }
    if (d.proposer) {
      await api(`/${d.kop}/proposer`, { method: 'POST', body: { bonusId: d.proposer } });
      return charger();
    }
    if (d.voter) {
      await api(`/vote/${d.voter}`, { method: 'POST', body: { pour: d.pour === '1' } });
      return charger();
    }
  } catch (e) {
    S.erreur = e.code ?? 'kop.error.server';
    rendre();
  }
  return undefined;
});

/* ------------------------------------------------ le compte à rebours

   Il tourne côté page plutôt que de redemander l'état chaque seconde : trois
   minutes de vote, c'est cent quatre-vingts requêtes par membre pour afficher
   un chiffre qui se calcule tout seul.

   À zéro, on relit **une fois** : c'est le serveur qui dépouille, et il ne le
   fait qu'au premier regard qui suit l'échéance. */
let recharge = null;
setInterval(() => {
  for (const el of document.querySelectorAll('[data-chrono]')) {
    const reste = new Date(el.dataset.chrono).getTime() - Date.now();
    el.textContent = mmss(reste);
    el.classList.toggle('urgent', reste < 45_000);
    if (reste <= 0 && !recharge) {
      recharge = setTimeout(() => { recharge = null; charger(); }, 700);
    }
  }
}, 1000);

/* ------------------------------------------------------- le temps réel

   Trois minutes, c'est court. Si l'on attendait que les membres rafraîchissent
   leur page, la moitié d'entre eux voterait après la clôture — ou pas du tout,
   faute d'avoir su qu'un vote était ouvert. */
try {
  // Voir duel-nvn.html : l’ordre inverse abandonne au lieu de replier.
  const socket = io({ transports: ['polling', 'websocket'], tryAllTransports: true });
  socket.on('connect', () => socket.emit('kop:suivre'));
  socket.on('kop:vote', () => charger());
  socket.on('kop:votes', () => charger());
} catch { /* pas de temps réel : la page reste utilisable, elle relit au clic */ }

charger();
// Filet : même sans socket, le pot et les votes finissent par arriver.
setInterval(charger, 30_000);
</script>
