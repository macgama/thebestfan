<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>L’abonnement — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* L'écran de l'abonnement.

   ## Ce qu'il doit faire, dans cet ordre

   1. **Dire ce qui reste libre.** C'est la première chose, avant le prix et
      avant la liste de ce qui s'ouvre. Un joueur qui arrive ici se demande ce
      qu'on lui retire s'il ne paie pas ; tant qu'il n'a pas la réponse, il ne
      lit pas le reste. La réponse est « rien de ce qui se joue », et elle est
      assez rare dans ce genre de jeu pour valoir la place d'honneur.
   2. **Dire ce qui s'ouvre**, en chiffres et non en adjectifs. « Plus de
      boosters » ne veut rien dire ; « 24 en réserve au lieu de 10 » se compare.
   3. **Proposer.** Le bouton vient en dernier, quand les deux questions sont
      réglées.

   ## Pourquoi la liste des chiffres vient du serveur

   `/api/abonnement` rend `ouvre` et `libre`. La page n'en porte aucune copie :
   les valeurs vivent dans les réglages, elles s'ajustent depuis /admin sans
   livraison, et une page qui les recopierait mentirait au premier réglage
   changé. C'est la même règle que partout ailleurs ici. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
     padding:18px 16px 90px}
main{width:100%;max-width:var(--colonne)}

.chapeau{text-align:center;margin:8px 0 22px}
.chapeau h1{font-family:var(--banner);font-size:clamp(22px,6.2vw,30px);letter-spacing:.1em;
  margin:0 0 6px}
.chapeau p{margin:0;font-size:12.5px;opacity:.55;line-height:1.55}

/* L'état, quand on est déjà abonné. Une plaque et pas un bandeau : c'est une
   réponse à une question qu'on est venu poser, pas une alerte. */
.etat{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;
  background:rgba(94,223,166,.1);border:1px solid rgba(94,223,166,.3);margin-bottom:20px}
.etat b{font-family:var(--banner);font-size:15px;letter-spacing:.06em}
.etat span{font-size:11.5px;opacity:.6;display:block;margin-top:2px}

/* **Ce qui reste libre** — le bloc le plus haut et le plus lisible de l'écran.
   Il porte la promesse du jeu, et il doit tenir sans qu'on fasse défiler. */
.libre{padding:15px 16px;border-radius:14px;margin-bottom:22px;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(0,0,0,.3));
  border:1px solid rgba(242,238,228,.14)}
.libre h2{font-family:var(--banner);font-size:13px;letter-spacing:.14em;margin:0 0 10px;
  text-transform:uppercase;opacity:.75}
.libre ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.libre li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4}
.libre li::before{content:"✓";color:var(--vert,#5FDFA6);font-weight:700;flex:none}
.libre p{margin:11px 0 0;font-size:11.5px;opacity:.5;line-height:1.5}

.ouvre h2{font-family:var(--banner);font-size:13px;letter-spacing:.14em;margin:0 0 10px;
  text-transform:uppercase;opacity:.75}
.ouvre ul{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

/* **Le tableau comparatif.**

   Deux colonnes, et la seconde tient la couleur : c'est elle qu'on vient
   lire. La première n'est pas grisée pour autant — un « sans » illisible
   supprimerait la comparaison, qui est tout l'intérêt du tableau.

   Les intitulés sont des `<th scope="row">` : un lecteur d'écran annonce
   alors « Boosters en réserve, avec : 24 » au lieu de lire vingt-quatre tout
   seul au milieu de nulle part. */
.compare{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:13px}
.compare thead th{font-family:var(--banner);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.5;padding:0 10px 8px;text-align:center;font-weight:400}
.compare thead th.avec{color:var(--projo);opacity:.95}
.compare tbody tr{border-top:1px solid rgba(242,238,228,.1)}
.compare tbody th{text-align:left;font-weight:400;padding:11px 10px 11px 0;
  vertical-align:top;min-width:0}
.compare tbody th b{display:block;font-family:var(--banner);font-size:12.5px;
  letter-spacing:.03em;line-height:1.25}
.compare tbody th small{display:block;font-size:10.5px;opacity:.45;margin-top:3px;
  line-height:1.4}
.compare tbody td{padding:11px 10px;text-align:center;vertical-align:middle;
  white-space:nowrap;opacity:.65}
/* La colonne payante : fond, couleur, et un poids de plus. Elle doit se
   détacher sans que l'autre devienne illisible. */
.compare tbody td.avec{opacity:1;color:var(--projo);font-family:var(--banner);
  font-size:14px;background:rgba(245,195,59,.07);
  box-shadow:inset 1px 0 0 rgba(245,195,59,.22),inset -1px 0 0 rgba(245,195,59,.22)}
.compare tbody tr:last-child td.avec{box-shadow:inset 1px 0 0 rgba(245,195,59,.22),
  inset -1px 0 0 rgba(245,195,59,.22),inset 0 -1px 0 rgba(245,195,59,.22)}
.compare thead th.avec{background:rgba(245,195,59,.07)}

/* Sur un téléphone étroit, la précision sous l'intitulé prend toute la
   place et repousse les deux colonnes hors du cadre. Elle s'efface : les
   chiffres, eux, ne se remplacent par rien. */
@media (max-width:380px){
  .compare tbody th small{display:none}
  .compare{font-size:12px}
}

/* Le mot sous les deux boutons : ce qu'on gagne tout de suite, et ce qui se
   passe si l'on arrête. Les deux questions qu'on se pose la main sur la
   carte bancaire. */
/* L'annonce du booster, juste au-dessus des deux boutons. En or, parce que
   c'est la seule ligne de cette page qui parle de quelque chose qu'on reçoit
   plutôt que de quelque chose qui s'élargit. */
.cadeau{margin:0 0 8px;font-size:12.5px;line-height:1.5;text-align:center;
  opacity:.9}
.cadeau b{font-family:var(--banner);color:var(--projo);letter-spacing:.06em}
.fin-mot{margin:12px 2px 0;font-size:11px;line-height:1.55;opacity:.55;text-align:center}
.prendre{display:flex;flex-direction:column;gap:9px}
.prendre em{font-style:normal;opacity:.6;font-size:11px}
.ouvre li{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;
  background:rgba(255,255,255,.045);border:1px solid rgba(242,238,228,.11);
  font-size:13px;line-height:1.4}
.ouvre li b{font-family:var(--banner);color:var(--projo);font-size:15px;flex:none;
  min-width:44px;text-align:right}
.ouvre li span{opacity:.72}
.ouvre li small{display:block;opacity:.5;font-size:11px;margin-top:2px}

.prendre{margin-top:4px}
.vide{opacity:.5;font-size:13px;text-align:center;padding:26px 0}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
</head>
<body>
<main>
  <div class="chapeau">
    <h1>L’ABONNEMENT</h1>
    <p>Ce qu’il change, et ce qu’il ne change pas.</p>
  </div>
  <div id="corps"><div class="vide">Un instant…</div></div>
</main>

<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));

/**
 * La date d'échéance, telle qu'on la dit.
 *
 * Nulle veut dire **sans terme** — c'est ce que pose un administrateur pour un
 * bêta-testeur, rien ne l'expire, et le taire laisserait croire à un oubli.
 */
const jour = (d) => new Date(d).toLocaleDateString('fr', {
  day: 'numeric', month: 'long', year: 'numeric' });

/* Les quatre portes, dans l'ordre où elles comptent pour quelqu'un qui joue.
   Le libellé est ici, les **chiffres** viennent du serveur : c'est lui qui
   connaît les réglages, et ils s'ajustent depuis /admin sans qu'on relivre
   cette page. */
/**
 * Les six lignes du tableau, chacune avec ses deux colonnes.
 *
 * **Les deux côtés viennent du serveur.** `o` est ce que l'abonnement ouvre,
 * `sans` ce qu'on a sans lui ; aucun des deux n'est écrit ici. La page avait
 * déjà recopié un barème une fois et annonçait « au lieu de 10 » quand le
 * réglage en disait douze — un nombre recopié ment au premier ajustement fait
 * depuis l'administration, et personne ne relit une page pour vérifier un
 * chiffre qu'il croit connaître.
 *
 * `n` est le nom de la ligne, `sous` la précision qui ne tient pas dans une
 * colonne, et les deux valeurs se lisent côte à côte.
 */
/**
 * Ce que l'abonnement ouvre, ligne par ligne.
 *
 * **Un nombre absent doit rester absent.** Le tableau se replie déjà sur un
 * tiret — `esc(p.sans ?? '—')` — mais ce repli ne servait à rien : `String()`
 * et les gabarits transforment `undefined` en la **chaîne** « undefined »,
 * qui est vraie, donc le `??` ne se déclenchait jamais.
 *
 * Le tour d'interface l'a vu le jour où cette page est entrée dans sa liste :
 * « undefined undefined » en toutes lettres sur la seule page du jeu qui
 * prend de l'argent réel. Le garde existait, il était court-circuité deux
 * lignes plus haut — la faute la plus discrète qui soit, parce qu'on relit le
 * garde et qu'on le trouve correct.
 *
 * `nb` ne rend donc rien quand il n'y a rien, et le tiret reprend sa place.
 */
function portes(o, sans) {
  /* `?? undefined` et non `?? '—'` : le tiret est une décision d'affichage,
     et il se prend dans le tableau, en un seul endroit. */
  const nb = (v, suffixe = '', prefixe = '') =>
    (v === undefined || v === null ? undefined : `${prefixe}${v}${suffixe}`);
  return [
    { n: 'Boosters en réserve', sous: 'de quoi partir en week-end sans rien perdre',
      sans: nb(sans.packMax), avec: nb(o.packMax) },
    { n: 'Entre deux boosters', sous: 'le temps que met la réserve à se remplir',
      sans: nb(sans.packRegenMin, ' min'), avec: nb(o.packRegenMin, ' min') },
    { n: 'Clubs suivis', sous: 'par-dessus ce que le niveau ouvre déjà',
      sans: 'ce que le niveau ouvre', avec: nb(o.clubsEnPlus, '', '+') },
    { n: 'Mémoire du parcours', sous: 'tes parties et tes cartes-souvenirs',
      sans: nb(o.parcoursLibre, ' dernières'), avec: 'tout' },
    { n: 'Tenues', sous: 'celles que tu portes te restent dans tous les cas',
      sans: 'celles que tu gagnes', avec: 'toutes les publiées' },
    { n: 'Créer un KOP', sous: 'en rejoindre un reste ouvert à tout le monde',
      sans: 'non', avec: 'oui' },
  ];
}

(async () => {
  let d;
  try {
    d = await fetch('/api/abonnement', { credentials: 'same-origin' }).then((r) => r.json());
  } catch {
    $('corps').innerHTML = '<div class="vide">Serveur injoignable.</div>';
    return;
  }
  if (d.error) {
    $('corps').innerHTML = d.error === 'auth.error.unauthenticated'
      ? '<div class="vide">Connecte-toi pour voir ton abonnement.<br><a href="/compte">Se connecter</a></div>'
      : '<div class="vide">L’abonnement n’est pas disponible pour le moment.</div>';
    return;
  }

  /* **Les deux côtés viennent du serveur.** Cette page en avait recopié un —
     « au lieu de 10 boosters » — et le réglage en disait douze. Un barème
     recopié dans une page ment au premier ajustement fait depuis /admin, et
     personne ne relit une page pour vérifier un nombre qu'il croit connaître.
     La route rend donc `ouvre` **et** `sans`. */
  const o = d.ouvre ?? {};
  const sans = d.sans ?? {};

  const libre = (d.libre ?? []).map((x) => `<li>${esc(x)}</li>`).join('');

  const etat = d.abonne
    ? `<div class="etat"><div>
         <b>TU ES ABONNÉ</b>
         <span>${esc(d.formule ?? '')}${d.fin
           ? ` · jusqu’au ${jour(d.fin)}`
           : ' · sans terme'}</span>
       </div></div>`
    : '';

  /* **Ce qui reste libre, avant ce qui s'ouvre.** Un joueur qui arrive ici se
     demande d'abord ce qu'on lui retire s'il ne paie pas. Tant qu'il n'a pas la
     réponse, il ne lit pas le reste — et la réponse est « rien de ce qui se
     joue ». */
  $('corps').innerHTML = `
    ${etat}
    <div class="libre">
      <h2>Libre pour tout le monde, abonné ou non</h2>
      <ul>${libre}</ul>
      <p>Le classement ne mesure pas ce qu’on a payé. Un joueur qui ne s’abonne
         jamais peut être premier, et c’est la règle du jeu — pas une promesse
         commerciale.</p>
    </div>

    <div class="ouvre">
      <h2>Ce que l’abonnement ouvre</h2>
      <!-- **Un tableau, et non une liste.**

           La liste disait « 24 boosters en réserve — au lieu de 5 ». C'est
           exact, et il faut lire la phrase jusqu'au bout pour trouver le
           second nombre, celui auquel on se compare. Un tableau met les deux
           côte à côte : on voit l'écart avant d'avoir lu.

           Les deux colonnes viennent du serveur — « ouvre » et « sans » — et
           non d'un barème recopié ici. La page l'avait déjà fait une fois et
           annonçait « au lieu de 10 » quand le réglage en disait douze. -->
      <table class="compare">
        <thead><tr><th></th><th>Sans</th><th class="avec">Avec</th></tr></thead>
        <tbody>${portes(o, sans).map((p) => `<tr>
          <th scope="row"><b>${esc(p.n)}</b><small>${esc(p.sous)}</small></th>
          <td>${esc(p.sans ?? '—')}</td>
          <!-- « p.quoi » n’existe sur aucune ligne : ce repli-là ne repliait
               sur rien. Le tiret, comme la colonne d’en face. -->
          <td class="avec">${esc(p.avec ?? '—')}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    ${d.abonne ? '' : `<div class="prendre">
      <!-- Les deux formules, côte à côte. Une seule mènerait au mensuel sans
           jamais dire que l'annuel existe — or c'est lui qui est avantageux,
           et le taire n'aide personne. -->
      <!-- **Ce qui arrive tout de suite.**

           Tout ce que l'abonnement ouvre est du confort : des réserves plus
           grandes, une mémoire plus longue, une file plus courte. Rien de
           tout cela ne se voit dans la seconde qui suit le paiement, et un
           paiement qui ne donne rien tout de suite se vit comme un paiement
           qui n'a pas marché.

           Le booster, lui, se voit. Il est annoncé **avant** le bouton et
           non découvert après : une bonne surprise qu'on n'a pas promise ne
           décide personne à payer, et c'est pourtant là qu'elle doit peser. -->
      <p class="cadeau"><b>Un booster offert</b> à l’ouverture de ton
        abonnement, dans les deux formules.</p>
      <button class="tbf-plaque tbf-bloc tbf-grande" data-ton="or" id="prendre"
        style="width:100%">M’abonner au mois — 3,99 €</button>
      <button class="tbf-plaque tbf-bloc" id="prendreAn"
        style="width:100%">À l’année — 39,90 € <em>deux mois offerts</em></button>
      <p class="fin-mot">Résiliable quand tu veux : l’échéance déjà payée court
        jusqu’au bout, et tu gardes les tenues que tu portes.
</p>
    </div>`}`;

  /* **Le bouton menait à une boîte de dialogue disant « bientôt ».**
   *
   * Elle avait raison le jour où elle a été écrite. Depuis, la boutique sait
   * ouvrir un abonnement Stripe — `mode: 'subscription'`, deux formules au
   * catalogue — et c'est par elle que les joueurs s'abonnaient : cet écran-ci,
   * celui qui explique l'abonnement, était le seul à ne pas pouvoir le vendre.
   *
   * Il appelle donc la même route que la boutique, avec le même corps : rien
   * que l'identifiant de l'article. Le prix est décidé par le serveur, ici
   * comme là-bas.
   */
  async function commander(article, bouton) {
    bouton.disabled = true;
    try {
      const r = await fetch('/api/boutique/commander', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ article }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { location.href = '/compte'; return; }
      if (!r.ok || !j.url) {
        /* Le cas de la vitrine : la boutique se monte sans clé Stripe et
           refuse alors la commande. On le dit avec ses mots plutôt que de
           laisser un bouton qui ne fait rien. */
        bouton.disabled = false;
        window.TBF_DIALOGUE?.ouvrir?.({
          titre: 'Pas encore',
          texte: 'Le paiement n’est pas disponible pour le moment.\n\n'
            + 'Pendant la bêta, l’abonnement peut s’offrir depuis '
            + 'l’administration : demande-le.',
          oui: 'Compris',
        }) ?? alert('Le paiement n’est pas disponible pour le moment.');
        return;
      }
      location.href = j.url;
    } catch {
      bouton.disabled = false;
    }
  }

  $('prendre')?.addEventListener('click', (e) => commander('abo-mensuel', e.currentTarget));
  $('prendreAn')?.addEventListener('click', (e) => commander('abo-annuel', e.currentTarget));
})();
</script>
</body>
</html>
