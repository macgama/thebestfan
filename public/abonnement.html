<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="/langue.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Les barres du téléphone : dans un onglet Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas ; depuis l'icône, la page passe sous les boutons et s'en garde par var(--bas) (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)&&matchMedia('(display-mode: browser)').matches){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<script>/* Le bas caché sous les boutons du téléphone. Depuis l'icône, sur le S24+ de Gaël, Chrome dessine la page jusqu'au bas de l'écran, sous les trois boutons, sans toujours en dire la hauteur (var(--bas) à zéro) : le bas de l'accueil restait dessous (captures du 26 octobre 2026), celui de la fiche d'un Fanzzy aussi (28 octobre). Toutes les pages le gardent par var(--bas) (ui.css). Quand la fenêtre descend jusqu'au bas de l'écran (moins de 60 px d'écart : la seule barre d'état), on garde 52 px, la hauteur des boutons ; --bas prend le plus grand des deux. Un onglet, une fenêtre que Chrome tient au-dessus des boutons, ou le plein écran de l'icône (manifeste « fullscreen », 30 octobre 2026 : les boutons y sont cachés), ne garde rien. */try{if(/Android/i.test(navigator.userAgent)&&!matchMedia('(display-mode: browser)').matches&&!matchMedia('(display-mode: fullscreen)').matches&&screen.height-innerHeight<60)document.documentElement.style.setProperty('--bas-cache','52px')}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Le PASS de saison — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La police des banderoles, que la page ne chargeait pas : ses titres et le
     PASS retombaient sur la police étroite du téléphone. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* L'écran du PASS de saison (choix de Gaël du 2 novembre 2026).

   ## Ce qu'il doit faire, dans cet ordre

   0. **Montrer ce qu'on vend, et donner envie** : le PASS de la saison, sa
      tenue portée par des Fanzzy qui défilent, son badge et son cadre — sans
      prix ni bouton, juste sous le chapeau.
   1. **La voie PASS** : six niveaux, ce que chacun donne, et où l'on en est.
   2. **Dire ce qui reste libre**, avant le prix : rien de ce qui se joue ne
      se trouve derrière ce bouton. Tout compte au classement pour tous.
   3. **Dire ce qui s'ajoute**, en chiffres : pour la saison, et pour la vie.
   4. **Proposer** : 7,99 € ou 40 000 écharpes, payé une fois.

   Tous les nombres viennent de `/api/abonnement` : les réglages vivent dans
   /admin, et une page qui les recopierait mentirait au premier changement. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
/* **Aucune marge sur le `body`.** Il posait dix-huit pixels en haut et seize
   sur les côtés, du temps où la colonne commençait par le chapeau. Elle
   commence maintenant par la barre du haut, que `nav.js` monte en tête de
   `main` : les dix-huit pixels du haut tombaient sous la barre (elle remonte
   d'elle-même, mais laisse sa place), et sur un grand écran la barre se
   rangeait à la gouttière de la colonne commune — quatorze pixels — que
   cette colonne-ci n'avait pas : le tableau débordait la barre de quatorze
   pixels de chaque côté. La gouttière est donc posée sur `main`, comme sur
   `#app`, et la barre tombe à sa place sans qu'on la recale. */
body{background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
     padding:0}
/* **Le décor passait devant le texte.**

   `nav.js` pose deux calques — la photo de tribune et son voile — en frères
   de la colonne, en `position:fixed`. Un fond fixé crée son propre contexte
   d'empilement et gagne contre un élément statique, même déclaré avant lui :
   `ui.css` le dit noir sur blanc au-dessus de sa règle `#app`, et c'est pour
   ça que cette règle existe.

   Sauf que la règle vise `#app`, et cette page — **la seule des vingt et une
   qui portent le décor** — a un `main` sans identifiant. La photo lui passait
   donc devant : le titre, la liste de ce qui reste libre, les intitulés du
   tableau et toute la colonne « avec » se lisaient à travers une tribune.

   On ne renomme pas en `#app` : la règle de `ui.css` apporte aussi une
   hauteur minimale d'un écran, qui s'ajouterait au dégagement du bas que le
   `body` pose déjà (la page défilerait toujours de quarante pixels), et une
   colonne en boîte flexible dont celle-ci n'a pas l'usage. On en prend ce
   qu'il faut : l'empilement, et la gouttière, la même que celle de `#app`
   (voir le `body`, juste au-dessus) — `nav.js` lit `--gouttiere` sur la
   colonne pour y ranger la barre. */
main{width:100%;max-width:var(--colonne);position:relative;z-index:1;
  --gouttiere:14px;padding-inline:var(--gouttiere)}

/* **Rien ne se pose à même la photo de tribune.** Le chapeau, le tableau et le
   mot de la fin étaient écrits directement sur le décor, et les blocs qui
   avaient un fond le tenaient d'un voile à 4 ou 7 % : au soleil, la tribune
   passait à travers le texte. Chaque bloc a maintenant son panneau
   (`--panneau`, opaque), et les voiles de couleur se posent **dessus**.

   Et tout ce qui renseigne se lit : onze pixels au moins, 88 % au moins. La
   hiérarchie tient par la taille, la police et la couleur — une précision à
   45 % sur un panneau sombre, c'est une précision qu'on ne lit pas. */
.chapeau{text-align:center;margin:8px 0 22px;padding:14px 16px 15px;border-radius:14px;
  background:var(--panneau);border:1px solid rgba(242,238,228,.1)}
.chapeau h1{font-family:var(--banner);font-size:clamp(22px,6.2vw,30px);letter-spacing:.1em;
  margin:0 0 6px}
.chapeau p{margin:0;font-size:12.5px;opacity:.88;line-height:1.55}

/* La règle `[hidden]` du navigateur pèse moins qu'une classe qui pose un
   `display`. */
main [hidden]{display:none}


/* ------------------------------------------------ le PASS de la saison

   La bâche or, la tenue de la saison qui défile, le badge. L'or dit « on
   achète » (une face, jamais un petit texte). */
.pass{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px 14px;
  margin:6px 0 26px;padding:20px 16px 16px;rotate:-.6deg;overflow:visible}
.pass-gauche{display:flex;flex-direction:column;gap:9px;min-width:0}
.pass-titre{font-family:var(--banner);font-weight:700;font-size:26px;line-height:1;
  letter-spacing:.08em;text-transform:uppercase}
.pass-saison{font-family:var(--banner);font-weight:600;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase}
.pass-texte{margin:0;font-size:12.5px;line-height:1.45;font-weight:600}
.pass-cadeau{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pass-cadeau>span:last-child{display:flex;flex-direction:column;gap:3px}
.pass-cadeau b{font-family:var(--banner);font-weight:700;font-size:21px;line-height:1;
  letter-spacing:.04em;text-transform:uppercase}
.pass-cadeau small,.pass-etat small{font-family:var(--banner);font-weight:600;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.pass-etat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pass-bientot{position:absolute;top:14px;right:14px;--rot:5deg}

/* La vitrine : des Fanzzy en tenue de la saison, qui passent l'un après
   l'autre. Le défilé est joué au script (une image à la fois, un fondu), et
   s'arrête avec le mode calme. */
.vitrine{position:relative;width:132px;height:172px;flex:none}
.vitrine img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  object-position:bottom;opacity:0;transition:opacity .6s ease,transform .6s ease;
  transform:translateY(6px) scale(.97);filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.vitrine img.on{opacity:1;transform:none}
.vitrine .tbf-pass-badge{position:absolute;left:-22px;bottom:-8px;z-index:2;transform:scale(.8);transform-origin:bottom left}

/* L'Ultimate en tenue, en bandeau sous la bâche : c'est ce que la voie
   montre de plus spectaculaire. Masqué si l'image n'existe pas. */
.ult{margin:-10px 0 24px;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9;
  background:var(--panneau);border:1px solid rgba(242,238,228,.12)}
.ult img{width:100%;height:100%;object-fit:cover;display:block}
.ult span{position:absolute;left:10px;bottom:9px;font-family:var(--banner);font-weight:700;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;
  background:rgba(7,9,12,.72)}

/* ------------------------------------------------------- la voie PASS */
.voie{padding:15px 14px 14px;border-radius:14px;margin-bottom:22px;background:var(--panneau);
  border:1px solid rgba(242,238,228,.12)}
.voie h2{margin:0 0 6px}
.voie>p{margin:0 0 12px;font-size:12px;line-height:1.5;opacity:.9}
.voie ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.voie li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
  padding:9px 10px;border-radius:10px;background:rgba(242,238,228,.04);
  border:1px solid rgba(242,238,228,.08)}
.voie li[data-on]{background:color-mix(in srgb,var(--pass,#c9772e) 18%,transparent);
  border-color:color-mix(in srgb,var(--pass,#c9772e) 55%,transparent)}
.voie li .n{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;
  font-family:var(--banner);font-weight:700;font-size:15px;background:rgba(242,238,228,.1)}
.voie li[data-on] .n{background:var(--pass,#c9772e);color:var(--encre)}
.voie li b{font-family:var(--banner);font-weight:600;font-size:14px;letter-spacing:.03em}
.voie li small{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
.voie li em{font-style:normal;font-family:var(--banner);font-weight:600;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;opacity:.9;white-space:nowrap}
.jauge{height:8px;border-radius:5px;background:rgba(242,238,228,.1);overflow:hidden;margin:2px 0 12px}
.jauge i{display:block;height:100%;background:var(--pass,#c9772e)}

/* Les deux façons de payer, côte à côte. */
.pass-conditions{margin:8px 0 0;font-size:12px;line-height:1.5;text-align:center}
.pass-conditions a{color:var(--craie);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pass-formules{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:16px 12px;margin:0 0 6px}
.pass-formule.tbf-plaque{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:5px;
  min-height:98px;padding:14px 14px 13px;text-align:left}
.pass-formule small{font-size:11px;font-weight:600;letter-spacing:.08em;line-height:1.2}
.pass-formule b{font-size:20px;font-weight:700;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums}
.pass-formule>.tbf-sticker{position:absolute;top:-19px;right:-6px;--rot:5deg}
.pass-beta{margin:10px 0 0;padding:10px 13px;border-radius:8px;background:var(--panneau);
  font-family:var(--banner);font-weight:600;font-size:13px;line-height:1.35;letter-spacing:.04em}
.prendre h2{margin:24px 0 30px}

/* **Ce qui reste libre** — le bloc le plus lisible de l'écran, le premier
   après le PASS, et avant tout prix. Il porte la promesse du jeu, que le
   chapeau annonce déjà au premier écran. */
.libre{padding:15px 16px;border-radius:14px;margin-bottom:22px;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(0,0,0,.3)),var(--panneau);
  border:1px solid rgba(242,238,228,.14)}
/* Les deux titres de rubrique sont cousus (`.tbf-cousu`, dans ui.css) : craie
   pleine et fil pointillé. Ils étaient à 75 %, la seule chose de l'écran
   qu'on avait éteinte exprès. Il ne reste ici que leur place. */
.libre h2{margin:0 0 10px}
.libre ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.libre li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4}
/* **La coche est l'icône commune** (`.tbf-ico-coche`, ui.css), et non plus le
   caractère « ✓ » : un caractère se dessine avec la police du téléphone — en
   couleur chez l'un, au trait chez l'autre, jamais à la taille du texte — et
   jurait avec les icônes au trait du jeu. Celle-ci prend la couleur qu'on lui
   donne. Décorative : chaque ligne se lit sans elle. */
.libre li .tbf-ico{flex:none;margin-top:.2em;color:var(--vert)}
.libre p{margin:11px 0 0;font-size:11.5px;opacity:.88;line-height:1.5}

.ouvre h2{margin:0 0 10px}
/* Le tableau sur son panneau. Il est dans une boîte et non peint lui-même :
   un tableau à bordures fusionnées ignore ses coins arrondis. */
.tableau{margin:0 0 18px;border-radius:12px;overflow:hidden;background:var(--panneau);
  border:1px solid rgba(242,238,228,.1)}

/* **Le tableau comparatif.**

   Deux colonnes, et la seconde tient la couleur : c'est elle qu'on vient
   lire. La première n'est pas grisée pour autant — un « sans » illisible
   supprimerait la comparaison, qui est tout l'intérêt du tableau.

   Les intitulés sont des `<th scope="row">` : un lecteur d'écran annonce
   alors « Boosters en réserve, avec : 24 » au lieu de lire vingt-quatre tout
   seul au milieu de nulle part. */
.compare{width:100%;border-collapse:collapse;margin:0;font-size:13px}
.compare thead th{font-family:var(--banner);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.88;padding:10px 10px 8px;text-align:center;font-weight:400}
/* **La colonne payante ne s'écrit plus en or.** L'or ne s'écrit qu'en grand
   texte (arbitrage de Gaël, 2 octobre 2026) : ses intitulés et ses valeurs, à
   onze et quatorze pixels, passent en craie et prennent la graisse. Elle se
   détache toujours par son voile et son liseré d'or — la colonne est la face,
   pas les lettres. */
.compare thead th.avec{color:var(--craie);opacity:1;font-weight:700}
.compare tbody tr{border-top:1px solid rgba(242,238,228,.1)}
.compare tbody th{text-align:left;font-weight:400;padding:11px 10px 11px 12px;
  vertical-align:top;min-width:0}
.compare tbody th b{display:block;font-family:var(--banner);font-size:12.5px;
  letter-spacing:.03em;line-height:1.25}
.compare tbody th small{display:block;font-size:11px;opacity:.88;margin-top:3px;
  line-height:1.4}
/* La colonne « sans » reste en craie, un cran sous la colonne payante : elle
   ne doit pas devenir illisible, sinon il n'y a plus rien à comparer. */
.compare tbody td{padding:11px 10px;text-align:center;vertical-align:middle;
  white-space:nowrap;opacity:.88}
/* La colonne payante : son voile et son liseré d'or, la craie pleine et la
   graisse. Elle doit se détacher sans que l'autre devienne illisible. */
.compare tbody td.avec{opacity:1;color:var(--craie);font-family:var(--banner);
  font-size:14px;font-weight:700;background:rgba(245,195,59,.07);
  box-shadow:inset 1px 0 0 rgba(245,195,59,.22),inset -1px 0 0 rgba(245,195,59,.22)}
.compare tbody tr:last-child td.avec{box-shadow:inset 1px 0 0 rgba(245,195,59,.22),
  inset -1px 0 0 rgba(245,195,59,.22),inset 0 -1px 0 rgba(245,195,59,.22)}
.compare thead th.avec{background:rgba(245,195,59,.07)}

/* Sur un téléphone étroit, la précision sous l'intitulé prend toute la
   place et repousse les deux colonnes hors du cadre. Elle s'efface : les
   chiffres, eux, ne se remplacent par rien.

   **Le seuil était à 380 px et il aurait dû être plus haut.** À 400 px la
   précision restait, et c'est elle qui poussait les deux colonnes l'une
   contre l'autre — un écran de 390 px, qui est la largeur de la moitié des
   téléphones vendus, lisait un tableau serré au lieu d'un tableau court. */
@media (max-width:430px){
  .compare tbody th small{display:none}
  .compare{font-size:12px}
  .compare tbody td{padding:11px 6px}
  .compare tbody th{padding-left:10px}
  .compare thead th{padding:10px 6px 8px}
}
/* **Sous 380 px, les valeurs reviennent à la ligne.** Tenues sur une ligne,
   « ce que le niveau ouvre » et « toutes les publiées » réclamaient 318 px à
   320 de large, dans une boîte de 286 : le cadre arrondi coupait la colonne
   payante d'une trentaine de pixels. Et la graisse qu'elle a prise à la place
   de l'or l'élargit encore — à 360 px, l'intitulé « Virages comptés au
   classement » passait sur quatre lignes. Revenir à la ligne rend la place
   aux intitulés : mesuré, le tableau passe de 519 à 460 px de haut à 360, et
   ne déborde plus à 320. Au-dessus, tout tient sur une ligne et rien ne
   bouge. */
@media (max-width:379px){
  .compare tbody td{white-space:normal}
}

/* Ce qui se passe si l'on arrête : c'est une condition de l'offre, pas une
   note de bas de page, et elle se lit comme le reste. Elle suit les
   formules : ce sont les deux questions qu'on se pose la main sur la carte
   bancaire — ce qu'on gagne tout de suite (le PASS le dit), et ce qui se
   passe si l'on arrête. */
.bienvenue{margin:0 0 12px;padding-left:18px;text-align:left;font-size:13px;line-height:1.5}
.bienvenue small{opacity:.65}
.fin-mot{margin:14px 0 0;padding:10px 13px;border-radius:10px;background:var(--panneau);
  font-size:11.5px;line-height:1.55;text-align:center}
/* Gérer l'abonnement : en bas de page, lisible, sans rien cacher. La loi veut
   une résiliation aussi simple que l'abonnement — un bouton, une confirmation. */
.gerer{margin:18px 0 0;padding:12px 13px;border-radius:10px;background:var(--panneau);
  font-size:12.5px;line-height:1.55;text-align:center}
.gerer p{margin:0 0 10px}
.gerer .tbf-plaque{width:100%;margin-top:8px}
.gerer fieldset{border:0;margin:0;padding:0;text-align:left}
.gerer legend{font-weight:700;margin:0 0 6px}
.gerer label{display:flex;gap:8px;align-items:center;padding:5px 0}
.gerer textarea{width:100%;box-sizing:border-box;margin-top:6px;min-height:64px;font:inherit;
  padding:8px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}

.anciens{margin:26px 0 0}
.anciens>p{margin:0 0 12px;font-size:12px;line-height:1.5;opacity:.9}
.mes-pass{margin:0 0 22px;padding:13px 14px;border-radius:14px;background:var(--panneau)}
.mes-pass h2{margin:0 0 8px}
.mes-pass ul,.ancien ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.mes-pass li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px}
.mes-pass li b{font-family:var(--banner);font-weight:700;letter-spacing:.05em}
.mes-pass li small{flex-basis:100%;opacity:.8;font-size:11.5px;line-height:1.4}
.ancien{margin:0 0 16px;padding:14px;border-radius:14px;background:var(--panneau);
  border-left:4px solid var(--pass,#c9772e)}
.ancien .pass-titre{display:block;margin:0 0 4px}
.ancien li{font-size:12.5px;line-height:1.4;padding-left:16px;position:relative}
.ancien li::before{content:'';position:absolute;left:3px;top:.55em;width:6px;height:6px;border-radius:2px;
  background:var(--pass,#c9772e)}
.ancien li.sans{opacity:.75}
.ancien li.sans::before{background:rgba(242,238,228,.35)}
.ancien .pass-formules{margin-top:12px}
.vide{font-size:13px;text-align:center;padding:26px 16px;border-radius:14px;
  background:var(--panneau)}
/* Le lien en craie, souligné et en gras : il était en or à treize pixels
   (arbitrage du 2 octobre 2026). Et il se touche : dix-sept pixels de haut
   pour le seul geste de l'écran déconnecté, c'était la moitié d'un doigt. */
.vide a{display:inline-block;min-height:44px;padding:13px 8px 0;box-sizing:border-box;
  color:var(--craie);font-weight:700}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
body{padding-bottom:calc(var(--bas) + 40px)}

</style>
</head>
<body>
<main>
  <div class="chapeau">
    <h1>LE PASS DE SAISON</h1>
    <p>Tout le jeu reste ouvert sans payer, et tout compte au classement.<br>
       Le PASS ajoute du rythme, de la mémoire et du style.</p>
  </div>
  <div id="corps"><div class="vide">Un instant…</div></div>
</main>

<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
<script src="/pass.js"></script>
<script src="/ultime.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));
const jour = (d) => new Date(d).toLocaleDateString('fr', {
  day: 'numeric', month: 'long', year: 'numeric' });
const pluriel = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;
const milliers = (n) => Number(n).toLocaleString('fr-FR');

/* Des Fanzzy en tenue de la saison, pour la vitrine. Une sélection et non
   toute la série : la vitrine montre la tenue, pas la collection. Une image
   absente se retire d'elle-même (`onerror`). */
const VITRINE = window.TBF_PASS?.VITRINE ?? [['RP1', 3], ['AN5', 2], ['RP20', 3], ['AN1', 1]];

/**
 * Le tableau : ce que le PASS ajoute, et ce qu'on a sans lui. Deux blocs : la
 * saison achetée, puis la vie. Les nombres viennent du serveur ; une ligne à
 * qui il manque une valeur disparaît.
 */
function portes(o, sans) {
  const nb = (v, suffixe = '', prefixe = '') =>
    (v === undefined || v === null ? undefined : `${prefixe}${v}${suffixe}`);
  return [
    { n: 'Le temps entre deux boosters', sous: 'pour la saison achetée',
      sans: nb(sans.packRegenMin, ' min'), avec: nb(o.packRegenMin, ' min') },
    { n: 'La réserve de boosters', sous: 'pour la saison achetée',
      sans: nb(sans.packMax), avec: nb(o.packMax) },
    { n: 'Tes parties et tes souvenirs', sous: 'pour la saison achetée',
      sans: nb(sans.parcoursLibre, ' derniers'), avec: 'tous' },
    { n: 'Clubs suivis', sous: 'à vie, un de plus à chaque PASS',
      sans: 'ce que le niveau ouvre', avec: nb(o.clubsParPass, ' par PASS', '+') },
    { n: 'Fonder un KOP', sous: 'à vie ; en rejoindre un reste ouvert à tous',
      sans: 'non', avec: nb(o.kopsParPass, ' par PASS', '+') },
    { n: 'La tenue de la saison', sous: 'à vie, gagnée le long de la voie',
      sans: 'à l’étal la saison suivante', avec: 'dès l’achat' },
    { n: 'Le badge et le cadre', sous: 'à vie, sur ta carte de supporter',
      sans: 'non', avec: 'oui' },
  ].filter((p) => p.sans != null && p.avec != null);
}

function toast(texte, ok = false) {
  let p = document.querySelector('body > .tbf-pile');
  if (!p) {
    p = document.createElement('div');
    p.className = 'tbf-pile';
    document.body.appendChild(p);
  }
  const t = document.createElement('div');
  t.className = `tbf-toast${ok ? '' : ' tbf-toast--erreur'}`;
  t.setAttribute('role', ok ? 'status' : 'alert');
  t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"/>'
    + '<circle cx="12" cy="12" r="9"/></svg>' + esc(texte);
  p.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}

/** La saison de la vitrine : celle qu'on achèterait, sinon la dernière possédée. */
function passVitrine(d) {
  const couvre = d.offre?.couvre ?? [];
  const voies = d.voies ?? [];
  return couvre[0] ?? voies[voies.length - 1] ?? (d.passes ?? [])[0] ?? null;
}

/** La bâche du PASS, en tête : ce qu'on vend, ou ce qu'on a. Ni prix ni bouton. */
function passHTML(d, { ouvert } = {}) {
  const p = passVitrine(d);
  if (!p) return '';
  const saison = Number(p.numero ?? p.saison);
  const mienne = (d.voies ?? []).find((v) => v.saison === saison) ?? null;
  const badge = window.TBF_PASS?.badge({ saison, couleur: p.couleur, niveau: mienne?.niveau ?? 0,
    or: mienne?.or }, 'grand') ?? '';
  const packs = Number(d.offre?.article?.packs) || 0;
  /* « ÉDITION ORIGINALE » : réservé à ceux qui l'ont pris pendant la saison
     (Gaël, 3 novembre 2026). */
  const original = mienne?.original
    ? '<span class="tbf-tampon" data-ton="or">ÉDITION ORIGINALE</span>' : '';
  const etat = d.actif
    ? `<span class="pass-etat"><span class="tbf-tampon tbf-tampon--plein" data-ton="vert">PASS ACTIF</span>
        ${original}<small>${esc(d.fin ? `jusqu’au ${jour(d.fin)}` : 'cette saison')}</small></span>`
    : (packs ? `<span class="pass-cadeau">
        <span class="tbf-fentes" aria-hidden="true">${'<span class="tbf-fente"></span>'.repeat(Math.min(packs, 7))}</span>
        <span><b>${esc(pluriel(packs, 'BOOSTER', 'BOOSTERS'))}</b><small>DÈS L’ACHAT</small></span></span>` : '');
  const tenue = p.tenue ? `<div class="vitrine" id="vitrine" style="--pass:${esc(p.couleur)}">
      ${badge}
      ${VITRINE.map(([id, age], i) => `<img alt="" loading="${i < 2 ? 'eager' : 'lazy'}"
        src="/img/fanzzy/${id}/e${age}/${esc(p.tenue)}/pousse.webp"
        onerror="this.remove()"${i === 0 ? ' class="on"' : ''}>`).join('')}
    </div>` : `<div class="vitrine">${badge}</div>`;
  return `<div class="tbf-cadre pass" data-ton="or" data-echarpe>
      <span class="tbf-scotch" aria-hidden="true"></span><span class="tbf-scotch tbf-scotch--droite" aria-hidden="true"></span>
      <div class="pass-gauche">
        <b class="pass-titre">PASS ${esc(saison)}</b>
        <span class="pass-saison">${esc(String(p.nom ?? '').replace(/^PASS \d+ · /, ''))}</span>
        ${p.texte ? `<p class="pass-texte">${esc(p.texte)}</p>` : ''}
        ${etat}
      </div>
      ${tenue}
      ${ouvert === false && !d.actif ? '<span class="tbf-sticker pass-bientot">BIENTÔT</span>' : ''}
    </div>`;
}

/** La voie PASS : six niveaux, ceux qu'on a et ceux qui viennent. */
function voieHTML(d) {
  const p = passVitrine(d);
  if (!p) return '';
  const saison = Number(p.numero ?? p.saison);
  const mienne = (d.voies ?? []).find((v) => v.saison === saison) ?? null;
  const niveau = mienne?.niveau ?? 0;
  const seuils = mienne?.seuils ?? [];
  const tampons = mienne?.tampons ?? 0;
  const detail = {
    tenue: (n) => `${p.tenue ? 'Sur tous tes Fanzzy, avec son Ultimate en tenue' : 'La tenue de la saison'}`,
    cadre: () => 'Autour de ta carte de supporter',
    cadre_anime: () => 'Un reflet en fait le tour',
    badge_or: () => 'Le badge du PASS passe en or',
  };
  const jauge = mienne && seuils.length
    ? `<div class="jauge" role="img" aria-label="${esc(`${tampons} tampons sur ${seuils[seuils.length - 1]}`)}"><i style="width:${
      Math.min(100, Math.round(100 * tampons / seuils[seuils.length - 1]))}%"></i></div>` : '';
  return `<div class="voie" style="--pass:${esc(p.couleur)}">
      <h2 class="tbf-cousu">La voie PASS</h2>
      <p>Elle avance avec les tampons du carnet, ceux de tout le monde : la voie
         gratuite reste la même, la voie PASS ajoute une seconde ligne. Elle ne donne
         que du visuel, et tout ce qu’elle donne reste à toi.${mienne
           ? ` Tu as <b>${esc(pluriel(tampons, 'tampon', 'tampons'))}</b> cette saison.` : ''}</p>
      ${jauge}
      ${mienne?.close ? `<p><b>La saison est finie.</b> Les âges de la tenue qui te manquent
         tombent maintenant dans tes boosters ; le cadre et le badge ne s’ouvrent plus.</p>` : ''}
      <ol>${(d.voie ?? []).map((v) => {
        const on = niveau >= v.niveau;
        const seuil = v.paliers ? seuils[v.paliers - 1] : null;
        const quand = v.paliers === 0 ? 'à l’achat'
          : seuil ? `${seuil} tampons` : `palier ${v.paliers} du carnet`;
        return `<li${on ? ' data-on' : ''}><span class="n">${esc(v.niveau)}</span>
          <span><b>${esc(v.nom)}</b><small>${esc((detail[v.gain] ?? (() => ''))(v))}</small></span>
          <em>${on ? 'OBTENU' : esc(quand)}</em></li>`;
      }).join('')}</ol>
    </div>`;
}

/** Mes PASS, saison par saison, avec leur tampon. Rien sans PASS. */
function mesPassHTML(d) {
  const v = d.voies ?? [];
  if (!v.length) return '';
  return `<div class="mes-pass"><h2 class="tbf-cousu">Mes PASS</h2><ul>${v.map((x) => `<li>
      <b>PASS ${esc(x.saison)}</b>${x.original
        ? '<span class="tbf-tampon" data-ton="or">ÉDITION ORIGINALE</span>'
        : '<span class="tbf-tampon">APRÈS LA SAISON</span>'}
      <small>${esc(x.tardif
        ? 'La tenue au premier âge sur tous tes Fanzzy ; ses autres âges tombent dans tes boosters.'
        : x.close ? `Niveau ${x.niveau} sur 6 de sa voie. Les âges qui te manquent tombent dans tes boosters.`
          : `Niveau ${x.niveau} sur 6 de sa voie.`)}</small></li>`).join('')}</ul></div>`;
}

/**
 * Les anciens PASS en boutique (Gaël, 3 novembre 2026) : en vente le 1er du
 * deuxième mois après la fin de leur saison, au même prix. On dit d'abord ce
 * qu'ils donnent et ce qu'ils ne donnent pas : pas de tampon « ÉDITION
 * ORIGINALE », pas de gain spécial.
 */
function anciensHTML(d, { ouvert } = {}) {
  const a = d.anciensPass ?? [];
  if (!a.length) return '';
  const o = d.offre ?? {};
  const packs = Number(o.article?.packs) || 0;
  const prixE = Number(o.echarpes) || 0;
  const assez = Number(d.echarpes) >= prixE;
  const vitrine = ouvert === false;
  return `<div class="anciens" id="anciens">
    <h2 class="tbf-cousu">Les anciens PASS</h2>
    <p>Une saison finie revient ici au même prix. Tu reçois son contenu, pas ses gains
       spéciaux : ceux-là restent à ceux qui l’ont joué pendant la saison.</p>
    ${a.map((p) => `<div class="ancien" style="--pass:${esc(p.couleur)}">
      <b class="pass-titre">PASS ${esc(p.numero)}</b>
      ${p.tenue ? `<span class="pass-saison">${esc(String(p.nom ?? '').replace(/^PASS \d+ · /, ''))}</span>` : ''}
      <ul>
        ${p.tenue ? '<li>La tenue de la saison au premier âge sur tous tes Fanzzy, ses autres âges dans tes boosters</li>' : ''}
        <li>L’équipement, le stade et les mini-jeux de ce PASS</li>
        ${packs ? `<li>${esc(`+${pluriel(packs, 'booster', 'boosters')} dès l’achat`)}</li>` : ''}
        <li class="sans">Sans le tampon « ÉDITION ORIGINALE », ni cadre, ni badge, ni club ou KOP en plus</li>
      </ul>
      <div class="pass-formules">
        ${o.article ? `<button type="button" class="tbf-plaque pass-formule" data-ton="or"
          data-article="${esc(o.article.id)}" data-saison="${esc(p.numero)}"${vitrine ? ' disabled' : ''}
          aria-label="${esc(`Prendre le PASS ${p.numero} — ${o.article.prixTexte}, payé une fois`)}">
          <small>PASS ${esc(p.numero)}</small><b>${esc(o.article.prixTexte)}</b>
          <small>payé une fois</small></button>` : ''}
        ${prixE ? `<button type="button" class="tbf-plaque pass-formule" data-echarpes
          data-saison="${esc(p.numero)}"${assez ? '' : ' disabled'}
          aria-label="${esc(`Prendre le PASS ${p.numero} pour ${milliers(prixE)} écharpes`)}">
          <small>PASS ${esc(p.numero)}</small><b>${esc(milliers(prixE))} écharpes</b>
          <small>${esc(assez ? `tu en as ${milliers(d.echarpes)}` : `il t’en manque ${milliers(prixE - d.echarpes)}`)}</small></button>` : ''}
      </div></div>`).join('')}
  </div>`;
}

/** Les deux façons de payer. */
function formulesHTML(d, { ouvert } = {}) {
  const o = d.offre ?? {};
  if (!o.aAcheter?.length) return '';
  const vitrine = ouvert === false;
  const deux = o.couvre?.length > 1;
  const quoi = deux ? `PASS ${o.couvre.map((p) => p.numero).join(' + ')}` : `PASS ${o.couvre?.[0]?.numero ?? ''}`;
  const packs = Number(o.article?.packs) || 0;
  const euros = o.article ? `<button type="button" class="tbf-plaque pass-formule" data-ton="or"
      data-article="${esc(o.article.id)}"${vitrine ? ' disabled' : ''}
      aria-label="${esc(`Prendre le ${quoi} — ${o.article.prixTexte}, payé une fois`)}">
      <small>${esc(quoi)}</small><b>${esc(o.article.prixTexte)}</b>
      <small>payé une fois</small>
      ${packs ? `<small>${esc(`+${pluriel(packs, 'booster', 'boosters')} dès l’achat`)}</small>` : ''}
      ${deux ? '<span class="tbf-sticker">2 saisons</span>' : ''}</button>` : '';
  const assez = Number(d.echarpes) >= Number(o.echarpes);
  const echarpes = o.echarpes ? `<button type="button" class="tbf-plaque pass-formule"
      data-echarpes${assez ? '' : ' disabled'}
      aria-label="${esc(`Prendre le ${quoi} pour ${milliers(o.echarpes)} écharpes`)}">
      <small>${esc(quoi)}</small><b>${esc(milliers(o.echarpes))} écharpes</b>
      <small>${esc(assez ? `tu en as ${milliers(d.echarpes)}` : `il t’en manque ${milliers(o.echarpes - d.echarpes)}`)}</small>
      ${packs ? `<small>${esc(`+${pluriel(packs, 'booster', 'boosters')} dès l’achat`)}</small>` : ''}</button>` : '';
  return `<h2 class="tbf-cousu">Prendre le PASS</h2>
    <div class="pass-formules">${euros}${echarpes}</div>
    ${deux ? `<p class="pass-conditions">C’est le dernier mois de la saison : le PASS
      vaut pour celle-ci <b>et</b> pour la suivante.</p>` : ''}
    ${vitrine ? '' : `<p class="pass-conditions">Payé une fois, il ne se renouvelle jamais tout seul :
      rien à résilier. En le prenant, tu acceptes les <a href="/conditions">conditions de vente</a>.</p>`}
    ${vitrine ? '<p class="pass-beta">Pendant la bêta, le PASS s’offre depuis l’administration, ou se prend en écharpes.</p>' : ''}`;
}

/** Le défilé de la vitrine : une image à la fois, joué au script. */
function defiler() {
  const v = document.getElementById('vitrine');
  if (!v) return;
  v.querySelectorAll('img').forEach((im) => window.TBF_PASS?.cadrer?.(im));
  const calme = matchMedia('(prefers-reduced-motion: reduce)').matches
    || /animations/.test(document.documentElement.dataset.calme ?? '');
  if (calme) return;
  let i = 0;
  setInterval(() => {
    const imgs = [...v.querySelectorAll('img')];
    if (imgs.length < 2) return;
    imgs.forEach((im) => im.classList.remove('on'));
    i = (i + 1) % imgs.length;
    imgs[i].classList.add('on');
  }, 2200);
}

/** L'Ultimate en tenue, en bandeau, si l'image existe. */
function ultime(d) {
  const p = passVitrine(d);
  const u = window.TBF_ULTIME?.image?.('RP4', 2, p?.tenue);
  const el = $('ult');
  if (!el || !u || !p?.tenue) return;
  el.innerHTML = `<img alt="L’Ultimate en tenue de la saison" src="${esc(u)}"><span>Ton Ultimate en tenue</span>`;
  el.hidden = false;
}

(async () => {
  const catalogue = fetch('/api/boutique/catalogue')
    .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  /* Une seule question au PASS par page, partagée avec le tiroir
     (`window.TBF_ABO`) : le corps d'une réponse réussie, ou `null`. */
  let statut;
  const lire = () => fetch('/api/abonnement', { credentials: 'same-origin' })
    .then((r) => { statut = r.status; return r.ok ? r.json() : null; })
    .catch(() => { statut = 0; return null; });
  const d = await (window.TBF_ABO ??= lire());
  if (!d || d.error) {
    $('corps').innerHTML = statut === 0 ? '<div class="vide">Serveur injoignable.</div>'
      : statut === 401
        ? '<div class="vide">Connecte-toi pour voir le PASS.<br><a href="/compte">Se connecter</a></div>'
        : '<div class="vide">Le PASS n’est pas disponible pour le moment.</div>';
    return;
  }
  const ouvert = (await catalogue)?.ouvert;
  const o = d.ouvre ?? {};
  const sans = d.sans ?? {};
  const libre = (d.libre ?? []).map((x) => `<li><i class="tbf-ico tbf-ico-coche"
    aria-hidden="true"></i><span>${esc(x)}</span></li>`).join('');

  /* Le retour de Stripe : le PASS n'est posé qu'à l'arrivée du webhook, qui
     peut suivre le retour de quelques secondes. On redemande l'état, et le
     serveur rattrape lui-même un webhook perdu (`/api/boutique/rattraper`). */
  const retour = new URLSearchParams(location.search);
  if (retour.has('paye') || retour.has('annule') || retour.has('bienvenue')) {
    history.replaceState(null, '', location.pathname);
  }
  if (retour.has('annule')) toast('Paiement annulé. Rien n’a été débité.');
  const rattraper = () => fetch('/api/boutique/rattraper', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: '{}',
  }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  /* Le retour d'un ancien PASS payé (`?ancien=<n>`) : on attend que cette
     saison-là apparaisse dans les PASS du joueur. */
  const ancienPaye = Number(retour.get('ancien')) || null;
  const aLAncien = (e) => (e?.voies ?? []).some((v) => v.saison === ancienPaye);
  if (retour.has('paye') && ancienPaye && !aLAncien(d)) {
    (async () => {
      for (let i = 0; i < 12; i++) {
        if (i === 2) await rattraper();
        await new Promise((r) => setTimeout(r, 1500));
        if (aLAncien(await lire())) { location.replace(`/abonnement?bienvenue=1&ancien=${ancienPaye}`); return; }
      }
      toast('Paiement reçu. Ton PASS arrive dans un instant : recharge la page.');
    })();
  }
  const aPayer = (d.offre?.aAcheter ?? []).length > 0;
  if (aPayer && !retour.has('paye')) {
    rattraper().then((r) => { if (r?.livre) location.replace('/abonnement?bienvenue=1'); });
  }
  if (retour.has('paye') && aPayer && !ancienPaye) {
    (async () => {
      for (let i = 0; i < 12; i++) {
        if (i === 2 && (await rattraper())?.livre) {
          location.replace('/abonnement?bienvenue=1'); return;
        }
        await new Promise((r) => setTimeout(r, 1500));
        const e = await lire();
        if (e && !(e.offre?.aAcheter ?? []).length) { location.replace('/abonnement?bienvenue=1'); return; }
      }
      toast('Paiement reçu. Ton PASS arrive dans un instant : recharge la page.');
    })();
  }
  if ((retour.has('paye') || retour.has('bienvenue')) && ancienPaye && aLAncien(d)) {
    const p = (d.voies ?? []).find((v) => v.saison === ancienPaye);
    (window.TBF_DIALOGUE ? Promise.resolve()
      : new Promise((r) => window.addEventListener('load', r, { once: true }))).then(() => window.TBF_DIALOGUE?.confirmer({
      titre: `LE PASS ${ancienPaye} EST À TOI`,
      texte: p?.tenue ? 'Sa tenue au premier âge est sur tous tes Fanzzy ; ses autres âges tomberont dans tes boosters.'
        : 'Son contenu est à toi.',
      oui: 'JOUER', non: 'FERMER', ton: 'or',
    })).then((ok) => { if (ok) location.href = '/'; });
  } else if ((retour.has('paye') || retour.has('bienvenue')) && d.actif) {
    const packs = Number(d.offre?.article?.packs) || 0;
    const p = passVitrine(d);
    const lignes = [
      packs ? `<li><b>+${esc(pluriel(packs, 'booster', 'boosters'))}</b> dans ta réserve, tout de suite</li>` : '',
      p?.tenue ? '<li><b>La tenue de la saison</b> sur tous tes Fanzzy, au premier âge</li>' : '',
      '<li><b>Ton badge</b> sur ta carte de supporter</li>',
      ...portes(o, sans).slice(0, 3).map((x) =>
        `<li><b>${esc(x.n)}</b> : ${esc(x.avec)} <small>(au lieu de ${esc(x.sans)})</small></li>`),
    ].join('');
    const attendre = () => (window.TBF_DIALOGUE ? Promise.resolve()
      : new Promise((r) => window.addEventListener('load', r, { once: true })));
    attendre().then(async () => {
      if (await window.TBF_DIALOGUE?.confirmer({
        titre: 'BIENVENUE DANS LE PASS',
        texte: `Ton PASS est actif${d.fin ? ` jusqu’au ${jour(d.fin)}` : ''}. Il est payé une fois et ne se renouvelle pas tout seul.`,
        corps: lignes ? `<ul class="bienvenue">${lignes}</ul>` : '',
        oui: 'JOUER', non: 'FERMER', ton: 'or',
      })) location.href = '/';
    });
  }

  $('corps').innerHTML = `
    <div id="pass">${passHTML(d, { ouvert })}</div>
    <div class="ult" id="ult" hidden></div>
    ${voieHTML(d)}
    <div class="libre">
      <h2 class="tbf-cousu">Ce que tu gardes sans payer</h2>
      <ul>${libre}</ul>
      <p>Le classement ne mesure pas ce qu’on a payé : tout compte pour tous, sans
         limite. Tu peux ne jamais prendre le PASS et finir premier — aucune carte,
         aucun âge, aucun format ne se trouve derrière ce bouton.</p>
    </div>

    <div class="ouvre">
      <h2 class="tbf-cousu">Ce que le PASS ajoute</h2>
      <div class="tableau"><table class="compare">
        <thead><tr><th></th><th>Sans</th><th class="avec">Avec</th></tr></thead>
        <tbody>${portes(o, sans).map((p) => `<tr>
          <th scope="row"><b>${esc(p.n)}</b><small>${esc(p.sous)}</small></th>
          <td>${esc(p.sans)}</td>
          <td class="avec">${esc(p.avec)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="prendre" id="prendre">
      ${formulesHTML(d, { ouvert })}
      ${aPayer ? '' : `<p class="fin-mot">${d.saison ? 'Tu as le PASS de cette saison.' : 'Aucune saison n’est en cours.'}
        Le prochain se prend dès le dernier mois de la saison : il vaut alors pour elle et pour la suivante.</p>`}
    </div>
    ${anciensHTML(d, { ouvert })}
    ${mesPassHTML(d)}
    ${d.ancien?.abonne ? '<div class="gerer" id="gerer" hidden></div>' : ''}`;

  defiler();
  window.addEventListener('load', () => ultime(d), { once: true });
  if (document.readyState === 'complete') ultime(d);

  /* **L'ancien abonnement**, tant qu'il court : on peut encore le résilier
     depuis cet écran (la loi le veut), et la question de départ suit. */
  const gerer = $('gerer');
  const fin = d.ancien?.fin ? `le ${jour(d.ancien.fin)}` : 'à la fin de la période payée';
  async function etatGerer(r) {
    if (!gerer) return;
    if (!r?.gerable) {
      if (d.ancien?.source === 'admin') {
        gerer.innerHTML = '<p>Ton ancien abonnement t’est offert : rien n’est prélevé, rien à résilier.</p>';
        gerer.hidden = false;
      }
      return;
    }
    gerer.hidden = false;
    gerer.innerHTML = r.resilie
      ? `<p>Ton ancien abonnement s’arrête ${esc(fin)}, et plus rien ne sera prélevé.
           Tu gardes tout jusque-là, puis le PASS de saison prend le relais.</p>`
      : `<p>Ton ancien abonnement mensuel ou annuel court encore. Tu gardes tout jusqu’à
           la fin de la période payée.</p>
         <button type="button" class="tbf-plaque tbf-bloc" data-gerer="demander">Résilier mon ancien abonnement</button>`;
  }
  if (gerer) {
    fetch('/api/boutique/abonnement', { credentials: 'same-origin' })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null).then(etatGerer);
  }
  gerer?.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-gerer]');
    if (!b || b.disabled) return;
    const geste = b.dataset.gerer;
    if (geste === 'demander') {
      gerer.innerHTML = `<p>Ton ancien abonnement s’arrêtera ${esc(fin)}. Plus rien ne sera
          prélevé, et tu gardes tout jusque-là.</p>
        <button type="button" class="tbf-plaque tbf-bloc" data-gerer="resilier">Confirmer la résiliation</button>
        <button type="button" class="tbf-plaque tbf-bloc" data-gerer="annuler">Ne rien changer</button>`;
      return;
    }
    if (geste === 'annuler') { etatGerer({ gerable: true, resilie: false }); return; }
    if (geste === 'passer') { etatGerer({ gerable: true, resilie: true }); return; }
    if (geste === 'raison') {
      const raison = gerer.querySelector('input[name="raison"]:checked')?.value;
      if (!raison) { toast('Choisis une réponse, ou passe.'); return; }
      b.disabled = true;
      await fetch('/api/abonnement/depart', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raison, texte: gerer.querySelector('textarea')?.value ?? '' }),
      }).catch(() => null);
      etatGerer({ gerable: true, resilie: true });
      toast('Merci, c’est noté.', true);
      return;
    }
    b.disabled = true;
    try {
      const r = await fetch(`/api/boutique/${geste}`, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: '{}',
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.gerable) throw new Error();
      toast(`Résiliation enregistrée : ton ancien abonnement s’arrête ${fin}.`, true);
      if (j.resilie && geste === 'resilier' && (d.raisonsDepart ?? []).length) {
        gerer.innerHTML = `<fieldset><legend>C’est fait. Une question, si tu veux bien :
            pourquoi tu pars ?</legend>
          ${d.raisonsDepart.map((x) => `<label><input type="radio" name="raison"
            value="${esc(x.cle)}">${esc(x.libelle)}</label>`).join('')}
          <textarea maxlength="500" aria-label="Un mot de plus (facultatif)"
            placeholder="Un mot de plus (facultatif)"></textarea></fieldset>
          <button type="button" class="tbf-plaque tbf-bloc" data-gerer="raison">Envoyer</button>
          <button type="button" class="tbf-plaque tbf-bloc" data-gerer="passer">Passer</button>`;
        return;
      }
      etatGerer(j);
    } catch {
      b.disabled = false;
      toast('Stripe ne répond pas. Réessaie dans un instant.');
    }
  });

  /* Payer en euros : la même route que la boutique, avec l'identifiant de
     l'article et rien d'autre. Le prix est décidé par le serveur. */
  async function commander(article, bouton) {
    bouton.disabled = true;
    const saison = bouton.dataset.saison ? Number(bouton.dataset.saison) : null;
    try {
      const r = await fetch('/api/boutique/commander', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(saison ? { article, saison } : { article }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { location.href = '/compte'; return; }
      if (!r.ok || !j.url) {
        if (j.error === 'boutique.error.non_configuree') {
          $('pass').innerHTML = passHTML(d, { ouvert: false });
          $('prendre').innerHTML = formulesHTML(d, { ouvert: false });
          return;
        }
        bouton.disabled = false;
        toast(j.error === 'pass.error.deja' ? 'Tu as déjà ce PASS.'
          : j.error === 'pass.error.pas_en_vente' ? 'Ce PASS n’est pas en vente.'
            : 'Le paiement n’est pas disponible pour le moment.');
        return;
      }
      location.href = j.url;
    } catch {
      bouton.disabled = false;
      toast('Le paiement n’a pas pu partir. Réessaie dans un instant.');
    }
  }

  /* Payer en écharpes : une confirmation, puis le PASS tout de suite. */
  async function enEcharpes(bouton) {
    const prix = d.offre?.echarpes;
    const saison = bouton.dataset.saison ? Number(bouton.dataset.saison) : null;
    const ok = await window.TBF_DIALOGUE?.confirmer({
      titre: saison ? `PRENDRE LE PASS ${saison} EN ÉCHARPES` : 'PRENDRE LE PASS EN ÉCHARPES',
      texte: `${milliers(prix)} écharpes pour le PASS${saison ? ` ${saison}` : ''}. Elles se gagnent en jouant : aucun euro n’est en jeu.`,
      oui: 'PRENDRE LE PASS', non: 'ANNULER', ton: 'or',
    });
    if (ok === false) return;
    bouton.disabled = true;
    try {
      const r = await fetch('/api/abonnement/pass/echarpes', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(saison ? { saison } : {}),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        bouton.disabled = false;
        toast({ 'pass.error.pas_assez': 'Il te manque des écharpes.',
          'pass.error.deja': 'Tu as déjà ce PASS.',
          'pass.error.pas_de_saison': 'Aucune saison n’est en cours.',
          'pass.error.pas_en_vente': 'Ce PASS n’est pas en vente.',
          'pass.error.echarpes_fermees': 'Le PASS ne se prend plus en écharpes.' }[j.error]
          ?? 'Le PASS n’a pas pu se prendre. Réessaie dans un instant.');
        return;
      }
      location.replace(saison ? `/abonnement?bienvenue=1&ancien=${saison}` : '/abonnement?bienvenue=1');
    } catch {
      bouton.disabled = false;
      toast('Le PASS n’a pas pu se prendre. Réessaie dans un instant.');
    }
  }

  $('corps').addEventListener('click', (e) => {
    const b = e.target.closest('[data-article]');
    if (b && !b.disabled) { commander(b.dataset.article, b); return; }
    const c = e.target.closest('[data-echarpes]');
    if (c && !c.disabled) enEcharpes(c);
  });
})();
</script>
</body>
</html>
