<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>L’abonnement — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La police des banderoles, que la page ne chargeait pas : ses titres et le
     PASS retombaient sur la police étroite du téléphone. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* L'écran de l'abonnement.

   ## Ce qu'il doit faire, dans cet ordre

   0. **Montrer ce qu'on vend** — le PASS DE TRIBUNE, sa bâche or et ce qu'il
      donne le jour du paiement —, **sans prix ni bouton**, juste sous le
      chapeau. Le premier écran ne montrait qu'une liste à coches, un
      paragraphe et un tableau : un écran de conditions générales, pas un
      écran de jeu, et l'objet de la page attendait à 970 px sur 1 503 à
      360 px de large (critique du lot 3). Ce n'est pas encore une offre :
      rien ne s'y paie, rien ne s'y touche.
   1. **Dire ce qui reste libre.** Avant le prix et avant la liste de ce qui
      s'ouvre. Un joueur qui arrive ici se demande ce qu'on lui retire s'il ne
      paie pas ; tant qu'il n'a pas la réponse, il ne lit pas le reste. La
      réponse est « rien de ce qui se joue », et elle est assez rare dans ce
      genre de jeu pour valoir la place d'honneur : le chapeau la dit dès le
      haut de l'écran, le bloc qui suit le PASS la détaille.
   2. **Dire ce qui s'ouvre**, en chiffres et non en adjectifs. « Plus de
      boosters » ne veut rien dire ; « 24 en réserve au lieu de 10 » se compare.
   3. **Proposer.** Les formules, leur prix et leur bouton viennent en
      dernier, quand les deux questions sont réglées : le gratuit passe
      toujours avant le prix.

   ## Pourquoi la liste des chiffres vient du serveur

   `/api/abonnement` rend `ouvre` et `libre`. La page n'en porte aucune copie :
   les valeurs vivent dans les réglages, elles s'ajustent depuis /admin sans
   livraison, et une page qui les recopierait mentirait au premier réglage
   changé. C'est la même règle que partout ailleurs ici. */

*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
/* **Aucune marge sur le `body`.** Il posait dix-huit pixels en haut et seize
   sur les côtés, du temps où la colonne commençait par le chapeau. Elle
   commence maintenant par la barre du haut, que `nav.js` monte en tête de
   `main` : les dix-huit pixels du haut tombaient sous la barre (elle remonte
   d'elle-même, mais laisse sa place), et sur un grand écran la barre se
   rangeait à la gouttière de la colonne commune — quatorze pixels — que
   cette colonne-ci n'avait pas : le tableau débordait la barre de quatorze
   pixels de chaque côté. La gouttière est donc posée sur `main`, comme sur
   `#app`, et la barre tombe à sa place sans qu'on la recale. */
body{background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;
     padding:0}
/* **Le décor passait devant le texte.**

   `nav.js` pose deux calques — la photo de tribune et son voile — en frères
   de la colonne, en `position:fixed`. Un fond fixé crée son propre contexte
   d'empilement et gagne contre un élément statique, même déclaré avant lui :
   `ui.css` le dit noir sur blanc au-dessus de sa règle `#app`, et c'est pour
   ça que cette règle existe.

   Sauf que la règle vise `#app`, et cette page — **la seule des vingt et une
   qui portent le décor** — a un `main` sans identifiant. La photo lui passait
   donc devant : le titre, la liste de ce qui reste libre, les intitulés du
   tableau et toute la colonne « avec » se lisaient à travers une tribune.

   On ne renomme pas en `#app` : la règle de `ui.css` apporte aussi une
   hauteur minimale d'un écran, qui s'ajouterait au dégagement du bas que le
   `body` pose déjà (la page défilerait toujours de quarante pixels), et une
   colonne en boîte flexible dont celle-ci n'a pas l'usage. On en prend ce
   qu'il faut : l'empilement, et la gouttière, la même que celle de `#app`
   (voir le `body`, juste au-dessus) — `nav.js` lit `--gouttiere` sur la
   colonne pour y ranger la barre. */
main{width:100%;max-width:var(--colonne);position:relative;z-index:1;
  --gouttiere:14px;padding-inline:var(--gouttiere)}

/* **Rien ne se pose à même la photo de tribune.** Le chapeau, le tableau et le
   mot de la fin étaient écrits directement sur le décor, et les blocs qui
   avaient un fond le tenaient d'un voile à 4 ou 7 % : au soleil, la tribune
   passait à travers le texte. Chaque bloc a maintenant son panneau
   (`--panneau`, opaque), et les voiles de couleur se posent **dessus**.

   Et tout ce qui renseigne se lit : onze pixels au moins, 88 % au moins. La
   hiérarchie tient par la taille, la police et la couleur — une précision à
   45 % sur un panneau sombre, c'est une précision qu'on ne lit pas. */
.chapeau{text-align:center;margin:8px 0 22px;padding:14px 16px 15px;border-radius:14px;
  background:var(--panneau);border:1px solid rgba(242,238,228,.1)}
.chapeau h1{font-family:var(--banner);font-size:clamp(22px,6.2vw,30px);letter-spacing:.1em;
  margin:0 0 6px}
.chapeau p{margin:0;font-size:12.5px;opacity:.88;line-height:1.55}

/* La règle `[hidden]` du navigateur pèse moins qu'une classe qui pose un
   `display`. */
main [hidden]{display:none}

/* ------------------------------------------------ le PASS DE TRIBUNE

   L'offre, en une bâche or à écharpe — l'or dit « on achète » (la règle de
   l'or : une face, jamais un petit texte) — tenue au mur par deux scotchs :
   son nom en grand, et le cadeau du jour du paiement avec ses sachets. Elle
   est **en tête de page**, sous le chapeau, sans prix ni bouton : c'est
   l'objet qu'on vient voir. Les formules, elles, sont en bas, en bâches côte
   à côte après ce qui reste libre et le tableau : la mensuelle en parpaing,
   celle que le catalogue met en avant en or, son ruban en sticker.

   **Il ne promet rien que le serveur ne fasse.** Le nombre de boosters est
   celui que les formules portent (`formules[].packs`), le prix celui du
   catalogue, la période celle du champ `mois` ; une donnée absente retire sa
   ligne. « JUSQU'À » quand les formules n'en donnent pas toutes autant. En
   vitrine (le paiement n'est pas branché, `ouvert` du catalogue), les
   bâches sont hors service et le sticker BIENTÔT le dit d'avance, au lieu
   d'une boîte d'excuse après le geste.

   Abonné, la même bâche porte le tampon ABONNÉ et l'échéance, en tête de
   page : c'est la réponse à la question qu'on est venu poser.

   La boutique monte la même composition dans son rayon : une composition et
   non une brique (un seul écran la pose), écrite des deux côtés. */
.pass{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  margin:6px 0 28px;padding:22px 16px 16px;rotate:-.6deg}
.pass-titre{font-family:var(--banner);font-weight:700;font-size:26px;line-height:1;
  letter-spacing:.08em;text-transform:uppercase}
.pass-cadeau{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pass-cadeau>span:last-child{display:flex;flex-direction:column;gap:3px}
.pass-cadeau b{font-family:var(--banner);font-weight:700;font-size:21px;line-height:1;
  letter-spacing:.04em;text-transform:uppercase}
.pass-cadeau small,.pass-etat small{font-family:var(--banner);font-weight:600;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.pass-etat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pass-bientot{position:absolute;top:16px;right:14px;--rot:5deg}
.pass-formules{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:16px 12px;margin:0 0 6px}
.pass-formule.tbf-plaque{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:5px;
  min-height:98px;padding:14px 14px 13px;text-align:left}
.pass-formule small{font-size:11px;font-weight:600;letter-spacing:.08em;line-height:1.2}
.pass-formule b{font-size:20px;font-weight:700;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums}
/* Le ruban de la formule mise en avant, collé à cheval sur son bord haut :
   il ne mord pas sur le nom de la formule. */
.pass-formule>.tbf-sticker{position:absolute;top:-19px;right:-6px;--rot:5deg}
.pass-beta{margin:10px 0 0;padding:10px 13px;border-radius:8px;background:var(--panneau);
  font-family:var(--banner);font-weight:600;font-size:13px;line-height:1.35;letter-spacing:.04em}
/* En bas de page, les formules n'ont plus la bâche du PASS au-dessus d'elles
   pour les annoncer : elles ont leur titre cousu, comme les deux rubriques
   qui les précèdent. Sous lui, la place du ruban de la formule mise en avant,
   qui monte de dix-neuf pixels au-dessus de sa bâche. */
.prendre h2{margin:24px 0 30px}

/* **Ce qui reste libre** — le bloc le plus lisible de l'écran, le premier
   après le PASS, et avant tout prix. Il porte la promesse du jeu, que le
   chapeau annonce déjà au premier écran. */
.libre{padding:15px 16px;border-radius:14px;margin-bottom:22px;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(0,0,0,.3)),var(--panneau);
  border:1px solid rgba(242,238,228,.14)}
/* Les deux titres de rubrique sont cousus (`.tbf-cousu`, dans ui.css) : craie
   pleine et fil pointillé. Ils étaient à 75 %, la seule chose de l'écran
   qu'on avait éteinte exprès. Il ne reste ici que leur place. */
.libre h2{margin:0 0 10px}
.libre ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.libre li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4}
/* **La coche est l'icône commune** (`.tbf-ico-coche`, ui.css), et non plus le
   caractère « ✓ » : un caractère se dessine avec la police du téléphone — en
   couleur chez l'un, au trait chez l'autre, jamais à la taille du texte — et
   jurait avec les icônes au trait du jeu. Celle-ci prend la couleur qu'on lui
   donne. Décorative : chaque ligne se lit sans elle. */
.libre li .tbf-ico{flex:none;margin-top:.2em;color:var(--vert)}
.libre p{margin:11px 0 0;font-size:11.5px;opacity:.88;line-height:1.5}

.ouvre h2{margin:0 0 10px}
/* Le tableau sur son panneau. Il est dans une boîte et non peint lui-même :
   un tableau à bordures fusionnées ignore ses coins arrondis. */
.tableau{margin:0 0 18px;border-radius:12px;overflow:hidden;background:var(--panneau);
  border:1px solid rgba(242,238,228,.1)}

/* **Le tableau comparatif.**

   Deux colonnes, et la seconde tient la couleur : c'est elle qu'on vient
   lire. La première n'est pas grisée pour autant — un « sans » illisible
   supprimerait la comparaison, qui est tout l'intérêt du tableau.

   Les intitulés sont des `<th scope="row">` : un lecteur d'écran annonce
   alors « Boosters en réserve, avec : 24 » au lieu de lire vingt-quatre tout
   seul au milieu de nulle part. */
.compare{width:100%;border-collapse:collapse;margin:0;font-size:13px}
.compare thead th{font-family:var(--banner);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.88;padding:10px 10px 8px;text-align:center;font-weight:400}
/* **La colonne payante ne s'écrit plus en or.** L'or ne s'écrit qu'en grand
   texte (arbitrage de Gaël, 2 octobre 2026) : ses intitulés et ses valeurs, à
   onze et quatorze pixels, passent en craie et prennent la graisse. Elle se
   détache toujours par son voile et son liseré d'or — la colonne est la face,
   pas les lettres. */
.compare thead th.avec{color:var(--craie);opacity:1;font-weight:700}
.compare tbody tr{border-top:1px solid rgba(242,238,228,.1)}
.compare tbody th{text-align:left;font-weight:400;padding:11px 10px 11px 12px;
  vertical-align:top;min-width:0}
.compare tbody th b{display:block;font-family:var(--banner);font-size:12.5px;
  letter-spacing:.03em;line-height:1.25}
.compare tbody th small{display:block;font-size:11px;opacity:.88;margin-top:3px;
  line-height:1.4}
/* La colonne « sans » reste en craie, un cran sous la colonne payante : elle
   ne doit pas devenir illisible, sinon il n'y a plus rien à comparer. */
.compare tbody td{padding:11px 10px;text-align:center;vertical-align:middle;
  white-space:nowrap;opacity:.88}
/* La colonne payante : son voile et son liseré d'or, la craie pleine et la
   graisse. Elle doit se détacher sans que l'autre devienne illisible. */
.compare tbody td.avec{opacity:1;color:var(--craie);font-family:var(--banner);
  font-size:14px;font-weight:700;background:rgba(245,195,59,.07);
  box-shadow:inset 1px 0 0 rgba(245,195,59,.22),inset -1px 0 0 rgba(245,195,59,.22)}
.compare tbody tr:last-child td.avec{box-shadow:inset 1px 0 0 rgba(245,195,59,.22),
  inset -1px 0 0 rgba(245,195,59,.22),inset 0 -1px 0 rgba(245,195,59,.22)}
.compare thead th.avec{background:rgba(245,195,59,.07)}

/* Sur un téléphone étroit, la précision sous l'intitulé prend toute la
   place et repousse les deux colonnes hors du cadre. Elle s'efface : les
   chiffres, eux, ne se remplacent par rien.

   **Le seuil était à 380 px et il aurait dû être plus haut.** À 400 px la
   précision restait, et c'est elle qui poussait les deux colonnes l'une
   contre l'autre — un écran de 390 px, qui est la largeur de la moitié des
   téléphones vendus, lisait un tableau serré au lieu d'un tableau court. */
@media (max-width:430px){
  .compare tbody th small{display:none}
  .compare{font-size:12px}
  .compare tbody td{padding:11px 6px}
  .compare tbody th{padding-left:10px}
  .compare thead th{padding:10px 6px 8px}
}
/* **Sous 380 px, les valeurs reviennent à la ligne.** Tenues sur une ligne,
   « ce que le niveau ouvre » et « toutes les publiées » réclamaient 318 px à
   320 de large, dans une boîte de 286 : le cadre arrondi coupait la colonne
   payante d'une trentaine de pixels. Et la graisse qu'elle a prise à la place
   de l'or l'élargit encore — à 360 px, l'intitulé « Virages comptés au
   classement » passait sur quatre lignes. Revenir à la ligne rend la place
   aux intitulés : mesuré, le tableau passe de 519 à 460 px de haut à 360, et
   ne déborde plus à 320. Au-dessus, tout tient sur une ligne et rien ne
   bouge. */
@media (max-width:379px){
  .compare tbody td{white-space:normal}
}

/* Ce qui se passe si l'on arrête : c'est une condition de l'offre, pas une
   note de bas de page, et elle se lit comme le reste. Elle suit les
   formules : ce sont les deux questions qu'on se pose la main sur la carte
   bancaire — ce qu'on gagne tout de suite (le PASS le dit), et ce qui se
   passe si l'on arrête. */
.fin-mot{margin:14px 0 0;padding:10px 13px;border-radius:10px;background:var(--panneau);
  font-size:11.5px;line-height:1.55;text-align:center}

.vide{font-size:13px;text-align:center;padding:26px 16px;border-radius:14px;
  background:var(--panneau)}
/* Le lien en craie, souligné et en gras : il était en or à treize pixels
   (arbitrage du 2 octobre 2026). Et il se touche : dix-sept pixels de haut
   pour le seul geste de l'écran déconnecté, c'était la moitié d'un doigt. */
.vide a{display:inline-block;min-height:44px;padding:13px 8px 0;box-sizing:border-box;
  color:var(--craie);font-weight:700}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

/* **Sur grand écran** (`tbf-large`, « Les pages larges » dans ui.css) : la
   règle commune des pages larges : la page prend la largeur, comme toutes
   les autres. */
</style>
</head>
<body class="tbf-large">
<main>
  <div class="chapeau">
    <h1>L’ABONNEMENT</h1>
    <!-- Le sous-titre disait « ce qu'il change, et ce qu'il ne change pas ».
         Exact, et parfaitement plat : il décrit un plan de page. Celui-ci
         répond à la question qu'on se pose en arrivant, et la réponse est la
         chose la plus rare que ce jeu ait à dire. -->
    <p>Tout le jeu reste ouvert sans payer.<br>Ce qui s’achète ici, c’est du
       rythme.</p>
  </div>
  <div id="corps"><div class="vide">Un instant…</div></div>
</main>

<script src="/fx.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
  (c) => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));

/**
 * La date d'échéance, telle qu'on la dit.
 *
 * Nulle veut dire **sans terme** — c'est ce que pose un administrateur pour un
 * bêta-testeur, rien ne l'expire, et le taire laisserait croire à un oubli.
 */
const jour = (d) => new Date(d).toLocaleDateString('fr', {
  day: 'numeric', month: 'long', year: 'numeric' });

/* Les quatre portes, dans l'ordre où elles comptent pour quelqu'un qui joue.
   Le libellé est ici, les **chiffres** viennent du serveur : c'est lui qui
   connaît les réglages, et ils s'ajustent depuis /admin sans qu'on relivre
   cette page. */
/**
 * Les six lignes du tableau, chacune avec ses deux colonnes.
 *
 * **Les deux côtés viennent du serveur.** `o` est ce que l'abonnement ouvre,
 * `sans` ce qu'on a sans lui ; aucun des deux n'est écrit ici. La page avait
 * déjà recopié un barème une fois et annonçait « au lieu de 10 » quand le
 * réglage en disait douze — un nombre recopié ment au premier ajustement fait
 * depuis l'administration, et personne ne relit une page pour vérifier un
 * chiffre qu'il croit connaître.
 *
 * `n` est le nom de la ligne, `sous` la précision qui ne tient pas dans une
 * colonne, et les deux valeurs se lisent côte à côte.
 */
/**
 * Ce que l'abonnement ouvre, ligne par ligne.
 *
 * **Un nombre absent doit rester absent.** Le tableau se replie déjà sur un
 * tiret — `esc(p.sans ?? '—')` — mais ce repli ne servait à rien : `String()`
 * et les gabarits transforment `undefined` en la **chaîne** « undefined »,
 * qui est vraie, donc le `??` ne se déclenchait jamais.
 *
 * Le tour d'interface l'a vu le jour où cette page est entrée dans sa liste :
 * « undefined undefined » en toutes lettres sur la seule page du jeu qui
 * prend de l'argent réel. Le garde existait, il était court-circuité deux
 * lignes plus haut — la faute la plus discrète qui soit, parce qu'on relit le
 * garde et qu'on le trouve correct.
 *
 * `nb` ne rend donc rien quand il n'y a rien.
 *
 * **Et une ligne à qui il manque une valeur disparaît** — c'est la règle de
 * tout le jeu : une ligne sans donnée se retire, elle ne s'écrit jamais avec
 * un tiret. Le tiret reprenait la place d'« undefined », et disait « rien »
 * là où la vérité est « le serveur ne l'a pas dit ». Sur un tableau qu'on lit
 * pour comparer, une case vide d'un côté ne compare rien : la ligne entière
 * part, au dernier moment, ici.
 */
function portes(o, sans) {
  /* `?? undefined` et non `?? '—'` : ce qui manque doit rester reconnaissable
     comme manquant, pour que la ligne puisse partir au lieu de s'écrire. */
  const nb = (v, suffixe = '', prefixe = '') =>
    (v === undefined || v === null ? undefined : `${prefixe}${v}${suffixe}`);
  return [
    /* L'ordre compte, et ce n'est pas celui du barème : c'est celui de ce
       qu'on ressent en jouant. Le rythme des boosters d'abord — c'est la
       seule ligne qu'on remarque le jour même —, l'identité et la mémoire
       ensuite, qui se découvrent au bout de quelques semaines. */
    { n: 'Le temps entre deux boosters', sous: 'ce qu’on attend avant le suivant',
      sans: nb(sans.packRegenMin, ' min'), avec: nb(o.packRegenMin, ' min') },
    { n: 'La réserve', sous: 'de quoi s’absenter un week-end sans rien perdre',
      sans: nb(sans.packMax), avec: nb(o.packMax) },
    { n: 'Clubs suivis', sous: 'par-dessus ce que le niveau ouvre déjà',
      sans: 'ce que le niveau ouvre', avec: nb(o.clubsEnPlus, '', '+') },
    { n: 'Tes parties gardées', sous: 'le parcours et les cartes-souvenirs',
      sans: nb(o.parcoursLibre, ' dernières'), avec: 'toutes' },
    { n: 'Les tenues', sous: 'celles que tu portes te restent dans tous les cas',
      sans: 'celles que tu gagnes', avec: 'toutes les publiées' },
    { n: 'Créer un KOP', sous: 'en rejoindre un reste ouvert à tout le monde',
      sans: 'non', avec: 'oui' },

    /* **Les trois plafonds de la compétition.**

       Ce sont les seules lignes du tableau qui **retirent** quelque chose à
       celui qui ne paie pas, au lieu d'élargir. Elles sont donc en dernier,
       et leur précision dit à chaque fois ce qui reste ouvert : un plafond
       qu'on annonce sans dire par quoi on le contourne se lit comme une
       porte, et ce n'en est pas une.

       Elles ne paraissent que si le serveur les envoie. À zéro, le plafond
       est désarmé depuis l'administration, la route rend `null`, et la ligne
       disparaît d'elle-même — plutôt que d'annoncer un plafond que plus
       personne n'applique. */
    ...(sans.duelsClassesJour ? [{
      n: 'Duels classés par jour',
      sous: 'les matchs des autres jours restent ouverts, en entraînement',
      sans: nb(sans.duelsClassesJour), avec: 'sans limite' }] : []),
    ...(sans.viragesClassesJour ? [{
      n: 'Virages comptés au classement',
      sous: 'les suivants se jouent en entier — seul le compteur s’arrête',
      sans: nb(sans.viragesClassesJour, ' par jour'), avec: 'tous' }] : []),
    ...(sans.tailleClassee >= 1 ? [{
      n: 'Formats classés',
      sous: 'le 2v2 et au-dessus se jouent à tout le monde, en entraînement',
      sans: nb(sans.tailleClassee, `v${sans.tailleClassee}`),
      avec: 'tous les formats' }] : []),
  ].filter((p) => p.sans != null && p.avec != null);
}

/* --------------------------------------------- la pile, et ce qu'on y dit

   Un refus du paiement se dit dans la pile commune (`.tbf-pile`, sur
   `body`), en toast d'erreur (`.tbf-toast--erreur`) : il passait par une
   boîte `TBF_DIALOGUE.ouvrir` qui n'a jamais existé — `dialogue.js` ne sait
   que `confirmer` —, donc par l'`alert()` du navigateur, grise et en police
   système, sur la seule page du jeu qui prend de l'argent. */
function toast(texte) {
  let p = document.querySelector('body > .tbf-pile');
  if (!p) {
    p = document.createElement('div');
    p.className = 'tbf-pile';
    document.body.appendChild(p);
  }
  const t = document.createElement('div');
  t.className = 'tbf-toast tbf-toast--erreur';
  t.setAttribute('role', 'alert');
  t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"/>'
    + '<circle cx="12" cy="12" r="9"/></svg>' + esc(texte);
  p.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}

const pluriel = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;

/**
 * Le PASS DE TRIBUNE : la bâche or, en tête de page. Voir la feuille, « le
 * PASS DE TRIBUNE ». **Ni prix ni bouton** : abonné, l'état de l'abonnement ;
 * sinon, ce que le paiement donne et, en vitrine, BIENTÔT. Les formules qu'on
 * paie sont en bas de page (`formulesHTML`), après ce qui reste libre.
 *
 * `ouvert` vient du catalogue de la boutique : `false` veut dire « vitrine »
 * (le paiement n'est pas branché), `undefined` qu'on ne sait pas — et alors
 * les bâches restent actives, le serveur dira non s'il le faut.
 */
function passHTML(d, { ouvert } = {}) {
  const formules = d.formules ?? [];
  const vitrine = ouvert === false;
  if (d.abonne) {
    /* La formule et l'échéance, **ce qu'on en sait**. Une formule absente
       laissait la ligne commencer par « · jusqu'au… » : le séparateur d'une
       valeur qui n'est pas là. On ne garde que les morceaux présents. */
    const ligne = [d.formule, d.fin ? `jusqu’au ${jour(d.fin)}` : 'sans terme'].filter(Boolean).join(' · ');
    return `<div class="tbf-cadre pass" data-ton="or" data-echarpe>
      <span class="tbf-scotch" aria-hidden="true"></span><span class="tbf-scotch tbf-scotch--droite" aria-hidden="true"></span>
      <b class="pass-titre">PASS DE TRIBUNE</b>
      <span class="pass-etat"><span class="tbf-tampon tbf-tampon--plein" data-ton="vert">ABONNÉ</span>
        <small>${esc(ligne)}</small></span>
    </div>`;
  }
  if (!formules.length) return '';
  /* Le cadeau du jour du paiement : le plus grand nombre de boosters qu'une
     formule donne, « jusqu'à » s'ils ne sont pas tous égaux. Sans booster
     dans aucune formule, pas de ligne. */
  const nombres = formules.map((f) => Number(f.packs) || 0);
  const max = Math.max(0, ...nombres);
  const cadeau = max > 0 ? `<span class="pass-cadeau">
      ${max <= 7 ? `<span class="tbf-fentes" aria-hidden="true">${'<span class="tbf-fente"></span>'.repeat(max)}</span>` : ''}
      <span><b>${esc(`${nombres.every((n) => n === max) ? '' : 'JUSQU’À '}${pluriel(max, 'BOOSTER', 'BOOSTERS')}`)}</b>
      <small>DÈS LE PAIEMENT</small></span></span>` : '';
  return `<div class="tbf-cadre pass" data-ton="or" data-echarpe>
      <span class="tbf-scotch" aria-hidden="true"></span><span class="tbf-scotch tbf-scotch--droite" aria-hidden="true"></span>
      <b class="pass-titre">PASS DE TRIBUNE</b>
      ${cadeau}
      ${vitrine ? '<span class="tbf-sticker pass-bientot">BIENTÔT</span>' : ''}
    </div>`;
}

/**
 * Les formules du PASS, en bâches côte à côte, pour qui n'est pas abonné :
 * le bas de la page, l'offre qu'on paie. En vitrine, elles sont hors service
 * et la phrase de la bêta les suit.
 */
function formulesHTML(d, { ouvert } = {}) {
  const formules = d.formules ?? [];
  const vitrine = ouvert === false;
  if (d.abonne || !formules.length) return '';
  const bache = (f) => {
    const mois = Number(f.mois) || null;
    const periode = mois === 1 ? ' / MOIS' : mois === 12 ? ' / AN' : mois ? ` / ${mois} MOIS` : '';
    const packs = Number(f.packs) || 0;
    return `<button type="button" class="tbf-plaque pass-formule" data-article="${esc(f.id)}"${
      f.marque && !vitrine ? ' data-ton="or"' : ''}${vitrine ? ' disabled' : ''}
      aria-label="${esc(`M’abonner — ${f.nom}, ${f.prixTexte}${periode.toLowerCase()}`)}">
      <small>${esc(f.nom)}</small><b>${esc(f.prixTexte)}${periode}</b>
      ${f.parMois && mois > 1 ? `<small>${esc(`soit ${f.parMois} par mois`)}</small>` : ''}
      ${packs ? `<small>${esc(`+${pluriel(packs, 'booster', 'boosters')} au paiement`)}</small>` : ''}
      ${f.marque ? `<span class="tbf-sticker">${esc(f.marque)}</span>` : ''}</button>`;
  };
  return `<h2 class="tbf-cousu">Les formules</h2>
    <div class="pass-formules">${formules.map(bache).join('')}</div>
    ${vitrine ? '<p class="pass-beta">Pendant la bêta, l’abonnement s’offre depuis l’administration : demande-le.</p>' : ''}`;
}

(async () => {
  /* L'état de l'abonnement, et le catalogue de la boutique pour une seule
     chose : savoir si le paiement est branché (`ouvert`). Le catalogue est
     public et sans base ; une panne de sa part ne coûte que le sticker
     BIENTÔT. */
  const catalogue = fetch('/api/boutique/catalogue')
    .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  /* **Une seule question à l'abonnement par page.** Le tiroir la pose aussi
     (sa marque ABONNÉ) : la réponse se partage par la promesse posée sur la
     fenêtre, `window.TBF_ABO` — comme `TBF_MOI` pour le compte, comme la
     boutique et le KOP —, le premier qui passe la pose, l'autre la reprend.
     Cette page passe la première : son script n'est pas différé, ceux de la
     barre le sont.

     Sa forme est celle de tous ses lecteurs : le corps d'une réponse
     réussie, ou `null`, sans jamais lever. Un refus n'a donc pas de corps à
     lire ici ; c'est le statut, retenu au passage, qui en dit la cause —
     401, pas connecté ; aucun statut, serveur injoignable (ou une réponse
     illisible, comme avant). Si un autre script avait posé la promesse
     avant la page, le statut resterait inconnu, et le refus se dirait sans
     sa cause plutôt que d'en inventer une. L'objet rendu est commun : on le
     lit, on n'y écrit pas. */
  let statut;
  const d = await (window.TBF_ABO ??= fetch('/api/abonnement', { credentials: 'same-origin' })
    .then((r) => { statut = r.status; return r.ok ? r.json() : null; })
    .catch(() => { statut = 0; return null; }));
  if (!d || d.error) {
    $('corps').innerHTML = statut === 0 ? '<div class="vide">Serveur injoignable.</div>'
      : statut === 401
        ? '<div class="vide">Connecte-toi pour voir ton abonnement.<br><a href="/compte">Se connecter</a></div>'
        : '<div class="vide">L’abonnement n’est pas disponible pour le moment.</div>';
    return;
  }
  const ouvert = (await catalogue)?.ouvert;

  /* **Les deux côtés viennent du serveur.** Cette page en avait recopié un —
     « au lieu de 10 boosters » — et le réglage en disait douze. Un barème
     recopié dans une page ment au premier ajustement fait depuis /admin, et
     personne ne relit une page pour vérifier un nombre qu'il croit connaître.
     La route rend donc `ouvre` **et** `sans`. */
  const o = d.ouvre ?? {};
  const sans = d.sans ?? {};

  const libre = (d.libre ?? []).map((x) => `<li><i class="tbf-ico tbf-ico-coche"
    aria-hidden="true"></i><span>${esc(x)}</span></li>`).join('');

  /* **Le PASS en tête**, sous le chapeau. Abonné, il porte le tampon et
     l'échéance — la réponse à la question qu'on vient poser. Sinon, ce que
     le paiement donne, sans prix ni bouton : l'objet de la page se voit au
     premier écran, et ce qui se paie attend en bas. */
  const pass = passHTML(d, { ouvert });

  /* **Ce qui reste libre, avant ce qui s'ouvre.** Un joueur qui arrive ici se
     demande d'abord ce qu'on lui retire s'il ne paie pas. Tant qu'il n'a pas la
     réponse, il ne lit pas le reste — et la réponse est « rien de ce qui se
     joue ». */
  $('corps').innerHTML = `
    ${pass ? `<div id="pass">${pass}</div>` : ''}
    <div class="libre">
      <h2 class="tbf-cousu">Ce que tu gardes sans payer</h2>
      <ul>${libre}</ul>
      <!-- Cette phrase est le cœur de la page, et elle passe avant le prix.
           Quelqu'un qui arrive ici se demande d'abord ce qu'on lui retire
           s'il refuse ; tant qu'il n'a pas la réponse, il ne lit pas le
           reste. Elle est écrite à la deuxième personne et au présent : une
           règle du jeu, pas un argument. -->
      <p>Le classement ne mesure pas ce qu’on a payé. Tu peux ne jamais
         t’abonner et finir premier : aucune carte, aucun format, aucun
         classement ne se trouve derrière ce bouton.</p>
    </div>

    <div class="ouvre">
      <h2 class="tbf-cousu">Ce que l’abonnement élargit</h2>
      <!-- « Ouvre » laissait entendre qu'il y a des portes fermées. Il n'y en
           a pas — c'est toute la promesse du bloc au-dessus. Ce que
           l'abonnement fait, c'est élargir ce qui est déjà là. -->
      <!-- **Un tableau, et non une liste.**

           La liste disait « 24 boosters en réserve — au lieu de 5 ». C'est
           exact, et il faut lire la phrase jusqu'au bout pour trouver le
           second nombre, celui auquel on se compare. Un tableau met les deux
           côte à côte : on voit l'écart avant d'avoir lu.

           Les deux colonnes viennent du serveur — « ouvre » et « sans » — et
           non d'un barème recopié ici. La page l'avait déjà fait une fois et
           annonçait « au lieu de 10 » quand le réglage en disait douze. -->
      <div class="tableau"><table class="compare">
        <thead><tr><th></th><th>Sans</th><th class="avec">Avec</th></tr></thead>
        <!-- Chaque ligne qui arrive ici a ses deux valeurs : « portes » retire
             celles à qui il en manque une. Il n'y a donc plus de repli à
             écrire dans les cellules — ni tiret, ni « undefined ». -->
        <tbody>${portes(o, sans).map((p) => `<tr>
          <th scope="row"><b>${esc(p.n)}</b><small>${esc(p.sous)}</small></th>
          <td>${esc(p.sans)}</td>
          <td class="avec">${esc(p.avec)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>

    ${d.abonne ? '' : `<div class="prendre" id="prendre">
      <!-- Les formules du PASS, en dernier : ce qui reste libre et ce qui
           s'élargit sont réglés, on peut proposer. Les formules sont côte à
           côte — une seule mènerait au mensuel sans jamais dire que l'annuel
           existe. Chaque bâche porte sa durée, son prix ramené au mois et ses
           boosters du jour du paiement : sur deux boutons voisins, c'est ce
           qu'on lit qui dit lequel on choisit. Tout vient du serveur, le nom,
           le prix, le ruban, la durée et le nombre de boosters. -->
      ${formulesHTML(d, { ouvert })}
      <!-- Un serveur d'avant cette route ne rend pas « formules ». Plutôt que
           de recopier ici les prix qu'on vient d'en sortir, on envoie là où
           ils vivent : la boutique vend les mêmes articles. -->
      ${(d.formules ?? []).length ? '' : `<a class="tbf-plaque tbf-bloc tbf-grande"
        data-ton="or" href="/boutique#abonnement" style="width:100%">Voir les formules
        à la boutique</a>`}
      <p class="fin-mot">Résiliable quand tu veux, depuis ton compte :
        l’échéance déjà payée court jusqu’au bout, tu gardes les tenues que tu
        portes, et tes parties ne sont jamais effacées — c’est la lecture qui
        raccourcit, et elle rouvre entièrement si tu reviens.</p>
    </div>`}`;

  /* **Le bouton menait à une boîte de dialogue disant « bientôt ».**
   *
   * Elle avait raison le jour où elle a été écrite. Depuis, la boutique sait
   * ouvrir un abonnement Stripe — `mode: 'subscription'`, deux formules au
   * catalogue — et c'est par elle que les joueurs s'abonnaient : cet écran-ci,
   * celui qui explique l'abonnement, était le seul à ne pas pouvoir le vendre.
   *
   * Il appelle donc la même route que la boutique, avec le même corps : rien
   * que l'identifiant de l'article. Le prix est décidé par le serveur, ici
   * comme là-bas.
   */
  async function commander(article, bouton) {
    bouton.disabled = true;
    try {
      const r = await fetch('/api/boutique/commander', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ article }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { location.href = '/compte'; return; }
      if (!r.ok || !j.url) {
        /* Le cas de la vitrine : la boutique se monte sans clé Stripe et
           refuse alors la commande. Si le catalogue ne l'avait pas dit, le
           refus le dit : le PASS passe en vitrine — sticker BIENTÔT sur la
           bâche du haut, formules hors service et phrase de la bêta en
           bas —, plutôt que de laisser un bouton qui ne fait rien. Toute
           autre panne se dit dans la pile. */
        if (j.error === 'boutique.error.non_configuree' && !d.abonne) {
          const haut = document.getElementById('pass');
          if (haut) haut.innerHTML = passHTML(d, { ouvert: false });
          const p = document.getElementById('prendre');
          const garde = p?.querySelector('.fin-mot')?.outerHTML ?? '';
          if (p) p.innerHTML = formulesHTML(d, { ouvert: false }) + garde;
          return;
        }
        bouton.disabled = false;
        toast('Le paiement n’est pas disponible pour le moment.');
        return;
      }
      location.href = j.url;
    } catch {
      bouton.disabled = false;
      toast('Le paiement n’a pas pu partir. Réessaie dans un instant.');
    }
  }

  /* **Délégué, et sur l'attribut plutôt que sur deux identifiants.** Les deux
     boutons étaient câblés un par un, avec le nom de l'article écrit ici : une
     troisième formule au catalogue aurait donc paru à l'écran avec un bouton
     qui ne fait rien — la pire des pannes sur un écran de paiement, puisque
     tout a l'air normal. */
  $('corps').addEventListener('click', (e) => {
    const b = e.target.closest('[data-article]');
    if (b && !b.disabled) commander(b.dataset.article, b);
  });
})();
</script>
</body>
</html>
