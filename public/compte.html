<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>thebestfan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Le bloc de suppression. Séparé du reste par un trait et par du vide : ce
   n'est pas une option de plus, c'est la sortie. Le lien est en petit et sans
   couleur d'alerte — une alerte attire l'œil, et on ne cherche pas à attirer
   l'œil ici. La couleur arrive au moment où l'on confirme, quand elle sert. */
.fin{margin-top:40px;padding-top:18px;border-top:1px solid rgba(242,238,228,.12)}
/* **Discret par la graisse, plus par la pâleur.** Le lien était à 0,45 : au
   soleil, un droit qu'on ne peut pas lire ne s'exerce pas mieux qu'un droit
   qu'aucune page n'appelle. Il perd la graisse des autres liens et garde la
   craie — c'est ce qui le range en retrait, sans rien retirer à la lecture.
   (Les autres liens étaient en or ; ils sont en craie grasse depuis
   l'arbitrage du 2 octobre 2026 : l'or ne s'écrit plus qu'en grand.) */
.fin .link{color:var(--craie);opacity:.9;font-size:12px;font-weight:400}
.fin .link:hover{opacity:1}
.prevenu{font-size:12.5px;line-height:1.6;opacity:.9;margin:10px 0 14px}

*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(245,195,59,.15),transparent 62%),var(--beton);
     color:var(--craie);font-family:var(--ui);display:flex;justify-content:center;padding:34px 18px 60px}
/* **Sous la barre, l'air d'une page, pas celui d'un bord d'écran.** La
   barre du haut (nav.js, joueur connecté) remonte au bord de l'écran et
   laisse sous elle l'écart que la page avait au-dessus : trente-quatre
   pixels de vide entre elle et le nom du jeu, fait pour un écran sans
   barre. Quand elle est là, l'écart revient à seize ; sans elle — la
   connexion —, le nom garde ses trente-quatre pixels de bord. */
body:has(.tbf-haut){padding-top:16px}
main{width:100%;max-width:var(--colonne)}
.wordmark{font-family:var(--banner);font-weight:600;font-size:26px;letter-spacing:.2em;text-align:center}
/* Onze pixels et 0,9 : le plancher du socle. Le sous-titre était à neuf et
   demi et à moitié effacé — la première ligne qu'on lit en arrivant. */
.wordmark small{display:block;font-size:11px;letter-spacing:.34em;opacity:.9;margin-top:6px;font-family:var(--ui)}
.langs{display:flex;gap:10px;justify-content:center;margin:22px 0 26px}
/* **Les langues sont des plaques**, comme tout ce qui se touche : elles
   s'enfoncent sous le doigt, et celle qui est choisie prend la craie — le ton
   de cet écran. Les autres restent en béton, **à pleine lecture** : elles
   s'éteignaient à 0,55 pour dire « pas choisie », et c'est justement celle
   qu'on cherche quand on s'est trompé de langue qu'on ne lisait plus.

   Il ne reste ici que leur taille : quarante-quatre pixels, la pulpe du doigt,
   et une largeur de pastille plutôt que de bouton de formulaire. */
.langs .tbf-plaque{--epaisseur:3px;min-height:44px;min-width:48px;padding:0 12px;
  font-size:12px;letter-spacing:.08em}

/* Le mot de celui qui t’a invité.

   Il est **au-dessus des onglets**, avant tout formulaire : c’est la raison
   pour laquelle on est là, et elle doit se lire avant qu’on décide entre
   « connexion » et « inscription ». Placé dessous, il aurait expliqué après
   coup ce qu’on venait de faire. */
.invite{display:flex;align-items:center;gap:11px;margin:0 0 16px;padding:11px 13px;
  border:1px solid rgba(245,195,59,.34);background:rgba(245,195,59,.07);border-radius:11px;
  text-align:left;line-height:1.5}
.invite img{width:38px;height:38px;object-fit:contain;flex:none}
.invite span{font-size:12.5px}
/* Le nom de qui t'invite, en craie grasse : en or et en douze pixels et
   demi, il ne tenait pas au soleil (arbitrage du 2 octobre 2026). Le cadre
   et le voile d'or, qui ne portent pas de lettres, restent. */
.invite b{color:var(--craie);font-weight:700}
/* La barre d'onglets est celle de `ui.css`. Ses boutons n'ont pas de classe :
   ils sont les seuls enfants du rail, et lui seul les désigne. */
.tabs{margin-bottom:22px}
/* Les boutons de cette barre portent `.tbf-onglet`, comme partout : la règle
   est dans `ui.css`. Elle a été recopiée ici un temps, sous prétexte que ces
   boutons n'ont pas de classe — et cette copie a gardé un défaut que la
   commune, elle, a perdu. */
label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin:16px 0 7px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(242,238,228,.16);border-radius:6px;
  color:var(--craie);padding:13px 14px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--projo)}
/* **L'œil du mot de passe.** Dans le champ, à droite, et le champ se pousse
   pour lui laisser la place : sans la marge, un mot de passe long passait
   sous le bouton. Quarante-quatre pixels de côté pour le doigt, comme le
   reste des boutons de la page. */
.mdp{position:relative}
.mdp input{padding-right:52px}
/* Edge pose son propre œil dans les champs `password` : deux yeux côte à côte,
   dont un qui disparaît dès qu'on a cliqué sur l'autre. On garde le nôtre,
   le seul qui existe aussi sur Chrome, Firefox et Safari. */
.mdp input::-ms-reveal,.mdp input::-ms-clear{display:none}
.oeil{position:absolute;top:0;right:0;width:48px;height:100%;min-height:44px;display:grid;place-items:center;
  background:none;border:0;color:var(--craie);opacity:.55;cursor:pointer;padding:0}
.oeil:hover,.oeil:focus-visible{opacity:1}
.oeil:focus-visible{outline:2px solid var(--projo);outline-offset:-4px;border-radius:6px}
.oeil svg{width:22px;height:22px}
.oeil .barre{display:none}
.oeil[aria-pressed="true"] .barre{display:inline}
/* Les consignes sous les champs : ce sont elles qui disent pourquoi un mot de
   passe est refusé avant qu'il le soit. À 0,42, on les découvrait après. */
.hint{font-size:11.5px;opacity:.9;margin-top:6px;line-height:1.5}
/* Se connecter, s'inscrire, envoyer. Une plaque — elle ne garde que sa
   largeur pleine et sa marge de formulaire. Son état « occupé » est celui de
   toutes les plaques (`ui.css`) : elle reste en place, grise, et ne répond
   plus. Il en avait un à lui, à demi transparent, qui la faisait passer pour
   absente. */
button.go{width:100%;margin-top:24px;padding:14px;font-size:16px;letter-spacing:.1em}
/* **Le bouton qui supprime un compte doit s'atteindre, pas se deviner.** Il
   mesurait 126×16. On ne le grossit pas à l'œil — il n'a rien à réclamer —
   mais sa zone monte à quarante-quatre pixels, et la marge du dessus se
   réduit d'autant pour que rien ne bouge.

   Les liens de texte sont en craie soulignée, et la graisse les détache de
   la phrase : ils étaient en or, qui en douze pixels et demi ne tient pas
   au soleil (arbitrage du 2 octobre 2026). */
.link{background:none;border:0;color:var(--craie);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;
  margin-top:4px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;
  display:inline-flex;align-items:center;min-height:44px}
.msg{margin-top:18px;padding:12px 14px;border-radius:6px;font-size:13px;line-height:1.55;display:none}
.msg.on{display:block}
.msg.err{background:rgba(224,64,44,.14);border:1px solid rgba(224,64,44,.4)}
.msg.ok{background:rgba(30,158,106,.14);border:1px solid rgba(30,158,106,.4)}
.card{border:1px solid rgba(242,238,228,.13);border-radius:10px;padding:22px;background:rgba(0,0,0,.25)}
.card h2{font-family:var(--banner);font-size:19px;letter-spacing:.06em;margin:0 0 6px}
.card p{font-size:13.5px;line-height:1.6;opacity:.9;margin:0 0 16px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:11px 0;
  border-top:1px solid rgba(242,238,228,.09)}
.row:first-of-type{border-top:0}
/* L'étiquette se distingue de la valeur par le poids, plus par la pâleur : à
   0,6, « Adresse vérifiée » s'effaçait au soleil et laissait un « oui » seul. */
.row span{opacity:.9}.row b{font-weight:600}
/* Une ligne sans valeur disparaît entière — `hidden`, que `ui.css` fait
   respecter : pas de tiret, pas d'étiquette suivie de rien. Voir `ligne`. */
.hide{display:none}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Un joueur : « je ne vois pas le bas de la page à cause du menu du bas sur
   mobile ». Le dernier élément de ces pages était collé au bas du document,
   et la barre du navigateur — celle qui apparaît et disparaît au défilement —
   passe par-dessus. Un bouton qui se trouve là ne se touche pas.

   `dvh` ne suffit pas : il dit la hauteur **visible**, ce qui range la mise
   en page correctement, mais ne réserve rien contre une barre qui revient
   pendant qu'on lit. Ce qu'il faut est un dégagement, et il coûte quarante
   pixels de rien du tout au bas du défilement.

   `env(safe-area-inset-bottom)` en plus : sur un téléphone à barre gestuelle,
   le système mange déjà une trentaine de pixels que la page ne voit pas.

   Les écrans de jeu ne passent pas par ici : ils ne défilent pas, leur budget
   vertical est compté au pixel, et leur ajouter de la marge couperait ce
   qu'ils tiennent tout juste — voir la fiche du Fanzzy. */
/* Les notifications : une carte sous celle du compte, ses deux interrupteurs
   l'un sous l'autre, sur toute la largeur — la phrase du duel est longue. */
.card.notif{margin-top:18px}
.card.notif p{margin-bottom:8px}
#notifCases{display:flex;flex-direction:column;gap:2px}
#notifCases .tbf-interrupteur{width:100%}
#notifCases .tbf-interrupteur[disabled]{opacity:.55;cursor:wait}
#notifNote:empty{display:none}

/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

/* **Sur grand écran** (`tbf-large`, « Les pages larges » dans ui.css) : la
   règle commune des pages larges : la page prend la largeur, comme toutes
   les autres. */
</style>

<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body class="tbf-large">
<main>
  <div class="wordmark">THEBESTFAN<small id="tagline">le jeu de cartes des tribunes</small></div>
  <div class="langs" id="langs"></div>

  <!-- connecté -->
  <section id="account" class="hide">
    <div class="card">
      <h2 id="helloTitle"></h2>
      <p id="helloText"></p>
      <div class="row"><span data-t="account.pseudo"></span><b id="acPseudo"></b></div>
      <div class="row"><span data-t="account.email"></span><b id="acEmail"></b></div>
      <div class="row"><span data-t="account.status"></span><b id="acStatus"></b></div>
    </div>
    <!-- **Les notifications.** Cachées tant que le serveur ne dit pas qu'il
         peut en envoyer (`notifications.actif`, `sql/notifications.sql`).
         Les cases valent pour **cet appareil** : c'est lui qui reçoit, et l'on
         peut vouloir être prévenu sur son téléphone sans l'être au bureau.
         Voir `TBF_NOTIF` dans `pwa.js`. -->
    <div class="card notif hide" id="notifCarte">
      <h2 data-t="notif.titre"></h2>
      <p data-t="notif.texte"></p>
      <div id="notifCases">
        <button type="button" class="tbf-interrupteur" role="switch" aria-checked="false"
          data-sujet="kop"><i aria-hidden="true"></i><span data-t="notif.kop"></span></button>
        <button type="button" class="tbf-interrupteur" role="switch" aria-checked="false"
          data-sujet="duel"><i aria-hidden="true"></i><span data-t="notif.duel"></span></button>
      </div>
      <div class="hint" id="notifNote"></div>
    </div>
    <button class="go tbf-plaque" data-ton="flare" id="btnLogout" data-t="account.logout"></button>
    <button class="link" id="btnResend" data-t="account.resend"></button>
    <div class="msg" id="acMsg"></div>

    <!-- **Supprimer son compte.**

         La route existait depuis le premier jour — `DELETE /api/auth/me`, avec
         confirmation par mot de passe — et **aucune page ne l'appelait**. Un
         droit qu'on ne peut pas exercer n'est pas un droit : le RGPD demande
         que l'effacement soit à la portée de la personne, pas seulement à celle
         de l'administrateur.

         En bas de page, en discret, derrière deux gestes. Ce n'est pas une
         action qu'on propose, c'est une action qu'on ne doit pas empêcher. -->
    <div class="fin">
      <button class="link" id="btnSupprimer" data-t="account.delete"></button>
      <form id="formSupprimer" class="hide">
        <p class="prevenu" data-t="delete.warn"></p>
        <label data-t="field.password"></label>
        <input type="password" id="delPassword" autocomplete="current-password" required>
        <button class="go tbf-plaque" data-ton="flare" type="submit" data-t="delete.confirm"></button>
        <button class="link" type="button" id="btnAnnulerSupp" data-t="action.back"></button>
      </form>
    </div>
  </section>

  <!-- déconnecté -->
  <section id="gate">
    <div id="invite" class="invite hide"></div>
    <!-- `data-ton="craie"` : le ton de cet écran sur le hub (le compte se range
         avec le profil et l'aide), que l'onglet actif prend au lieu de l'or
         par défaut. -->
    <div class="tabs tbf-onglets" data-ton="craie">
      <button id="tabLogin" class="tbf-onglet on" data-t="tab.login"></button>
      <button id="tabRegister" class="tbf-onglet" data-t="tab.register"></button>
    </div>

    <form id="formLogin">
      <label data-t="field.email"></label>
      <input type="email" id="liEmail" autocomplete="email" required>
      <label data-t="field.password"></label>
      <input type="password" id="liPassword" autocomplete="current-password" required>
      <button class="go tbf-plaque" data-ton="flare" type="submit" data-t="action.login"></button>
      <button class="link" type="button" id="btnForgot" data-t="action.forgot"></button>
    </form>

    <form id="formRegister" class="hide">
      <label data-t="field.pseudo"></label>
      <input type="text" id="rgPseudo" autocomplete="nickname" minlength="3" maxlength="20" required>
      <div class="hint" data-t="hint.pseudo"></div>
      <label data-t="field.email"></label>
      <input type="email" id="rgEmail" autocomplete="email" required>
      <label data-t="field.password"></label>
      <input type="password" id="rgPassword" autocomplete="new-password" minlength="10" required>
      <div class="hint" data-t="hint.password"></div>
      <button class="go tbf-plaque" data-ton="flare" type="submit" data-t="action.register"></button>
    </form>

    <form id="formForgot" class="hide">
      <div class="hint" style="margin-bottom:4px" data-t="hint.forgot"></div>
      <label data-t="field.email"></label>
      <input type="email" id="fgEmail" autocomplete="email" required>
      <button class="go tbf-plaque" data-ton="flare" type="submit" data-t="action.send"></button>
      <button class="link" type="button" id="btnBackLogin" data-t="action.back"></button>
    </form>

    <form id="formReset" class="hide">
      <div class="hint" style="margin-bottom:4px" data-t="hint.reset"></div>
      <label data-t="field.newPassword"></label>
      <input type="password" id="rsPassword" autocomplete="new-password" minlength="10" required>
      <button class="go tbf-plaque" data-ton="flare" type="submit" data-t="action.save"></button>
    </form>

    <!-- Le « OU » se lit à 0,9 ; ce sont ses deux filets qui s'effacent. Il
         était à 0,35 avec eux, et un mot qu'on ne lit pas ne sépare rien. Le
         bouton Google, lui, n'est pas une plaque et ne le devient pas : il
         garde le blanc et les couleurs de la marque, qu'on ne repeint pas aux
         nôtres. -->
    <div id="googleBox" style="display:none;margin-top:20px">
      <div style="display:flex;align-items:center;gap:10px;opacity:.9;font-size:11px;
        letter-spacing:.14em;margin-bottom:14px">
        <span style="flex:1;height:1px;background:rgba(242,238,228,.3)"></span>OU
        <span style="flex:1;height:1px;background:rgba(242,238,228,.3)"></span>
      </div>
      <a href="/api/auth/google/start" style="display:flex;align-items:center;justify-content:center;
        gap:10px;background:#fff;color:#1F1F1F;border-radius:6px;padding:13px;text-decoration:none;
        font-size:14px;font-weight:500">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v8h12c-.2 2-1.6 5-4.5 7l7 5.4C42.6 36.7 45 31 45 24z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.8-3.9-12.5-9.2l-7.3 5.6C7.9 41 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.5 28.2c-.5-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2l-7.3-5.6C2.8 17 2 20.4 2 24s.8 7 2.2 9.8l7.3-5.6z"/><path fill="#EA4335" d="M24 10.2c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 3.6 30 1.5 24 1.5 15.4 1.5 7.9 6.5 4.2 14.2l7.3 5.6C13.2 14.1 18.2 10.2 24 10.2z"/></svg>
        Continuer avec Google
      </a>
    </div>

    <div class="msg" id="gateMsg"></div>
  </section>
</main>

<script>

const $ = (id) => document.getElementById(id);
const LOCALES = ['fr','en','de','es'];
let locale = LOCALES.find(l => (localStorage?.getItem?.('tbf_locale') ?? '') === l)
  || LOCALES.find(l => navigator.language.toLowerCase().startsWith(l)) || 'fr';

function t(key, params = {}) {
  const s = (I18N[locale] ?? I18N.fr)[key] ?? key;
  return Object.entries(params).reduce((a,[k,v]) => a.replaceAll(`{${k}}`, v), s);
}

/**
 * **Voir ce qu'on tape.** Sur un téléphone, un mot de passe de dix caractères
 * au moins se tape à l'aveugle, et une faute ne se découvre qu'au refus du
 * serveur — ou pire, à l'inscription, jamais : le compte est créé avec un
 * mot de passe que personne ne connaît. L'œil le montre, le temps qu'on
 * le relise.
 *
 * Posé sur **tous** les champs de mot de passe de la page — connexion,
 * inscription, nouveau mot de passe, suppression du compte — plutôt que
 * sur celui de la capture : un œil sur l'un et pas sur l'autre ferait
 * chercher le bouton.
 *
 * Le mot de passe **se recache à l'envoi**. Les gestionnaires de mots de
 * passe ne proposent d'enregistrer que ce qu'ils voient partir d'un champ
 * `password` ; un champ resté en clair leur ferait manquer l'inscription.
 */
const OEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
  + '<path class="barre" d="M4 4l16 16"/></svg>';

function cacher(champ, bouton) {
  champ.type = 'password';
  bouton.setAttribute('aria-pressed', 'false');
}

document.querySelectorAll('input[type="password"]').forEach((champ) => {
  const boite = document.createElement('div');
  boite.className = 'mdp';
  champ.replaceWith(boite);
  boite.appendChild(champ);
  const bouton = document.createElement('button');
  bouton.type = 'button';
  bouton.className = 'oeil';
  bouton.setAttribute('aria-pressed', 'false');
  bouton.setAttribute('aria-controls', champ.id);
  bouton.innerHTML = OEIL;
  boite.appendChild(bouton);
  bouton.onclick = () => {
    const voir = champ.type === 'password';
    champ.type = voir ? 'text' : 'password';
    bouton.setAttribute('aria-pressed', String(voir));
    etiqueterYeux();
    /* Le curseur reste où il était : on vient relire, pas recommencer. */
    champ.focus({ preventScroll: true });
  };
  champ.form?.addEventListener('submit', () => cacher(champ, bouton), true);
});

function etiqueterYeux() {
  document.querySelectorAll('.oeil').forEach((b) => {
    const l = t(b.getAttribute('aria-pressed') === 'true' ? 'pw.hide' : 'pw.show');
    b.setAttribute('aria-label', l);
    b.title = l;
  });
}

function applyLocale() {
  document.documentElement.lang = locale;
  try { localStorage.setItem('tbf_locale', locale); } catch {}
  $('tagline').textContent = t('tagline');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  etiqueterYeux();
  /* Des plaques : la langue choisie prend la craie, le ton de cet écran, et
     le dit aussi aux lecteurs d'écran (`aria-pressed`) ; la classe `on` reste
     pour qui la cherche. */
  $('langs').innerHTML = LOCALES.map((l) => {
    const choisie = l === locale;
    return `<button type="button" data-l="${l}" class="tbf-plaque${choisie ? ' on' : ''}"`
      + `${choisie ? ' data-ton="craie"' : ''} aria-pressed="${choisie}">${l.toUpperCase()}</button>`;
  }).join('');
}
$('langs').onclick = e => {
  const b = e.target.closest('[data-l]');
  if (b) { locale = b.dataset.l; applyLocale(); render(); }
};

function say(box, key, kind = 'err', params = {}) {
  const el = $(box);
  el.textContent = t(key, params);
  el.className = `msg on ${kind}`;
}
const clear = (box) => { $(box).className = 'msg'; };

async function api(path, body, method = 'POST') {
  try {
    const res = await fetch('/api/auth' + path, {
      method,
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    return { status: res.status, json: await res.json().catch(() => ({})) };
  } catch {
    return { status: 0, json: { error: 'auth.error.network' } };
  }
}

/* ------------------------------------------------------------- écrans */

let user = null;
const show = (id, on) => $(id).classList.toggle('hide', !on);

/**
 * Écrit une ligne de la fiche, ou la retire entière.
 *
 * **Une ligne sans donnée disparaît, jamais un tiret** — ni une étiquette
 * suivie de rien. Une valeur que le serveur n'a pas rendue laissait
 * « Adresse », puis le vide : une ligne qui dit « il y a quelque chose ici et
 * on ne te le montre pas ».
 */
function ligne(id, valeur) {
  const v = valeur == null ? '' : String(valeur).trim();
  $(id).textContent = v;
  $(id).closest('.row').hidden = !v;
}

function render() {
  show('account', Boolean(user));
  show('gate', !user);
  if (user) {
    $('helloTitle').textContent = t('account.hello', { pseudo: user.pseudo });
    $('helloText').textContent = t('account.text');
    ligne('acPseudo', user.pseudo);
    ligne('acEmail', user.email);
    ligne('acStatus', user.verified ? t('yes') : t('no'));
    show('btnResend', !user.verified);
    notifications();
  }
}

/* ------------------------------------------------------ les notifications

   `TBF_NOTIF` vient de `pwa.js`, chargé en `defer` après ce script : on
   l'attend. Si le serveur n'en envoie pas, la carte reste cachée ; si cet
   appareil ne peut pas en recevoir, elle le dit, sans interrupteurs. */
const pret = () => new Promise((ok) => {
  if (window.TBF_NOTIF) ok();
  else document.addEventListener('DOMContentLoaded', ok, { once: true });
});

async function notifications() {
  await pret();
  const n = window.TBF_NOTIF;
  if (!n || !user) return;
  const e = await n.etat().catch(() => ({ possible: false, raison: 'eteintes' }));
  if (!e.possible && e.raison === 'eteintes') { show('notifCarte', false); return; }
  show('notifCarte', true);
  $('notifCases').hidden = !e.possible;
  $('notifNote').textContent = e.possible ? '' : t(`notif.${e.raison}`);
  if (e.possible) poserCases(e.sujets);
}

const cases = () => [...document.querySelectorAll('#notifCases [data-sujet]')];
function poserCases(sujets) {
  for (const b of cases()) b.setAttribute('aria-checked', String(Boolean(sujets?.[b.dataset.sujet])));
}

for (const b of cases()) {
  b.onclick = async () => {
    const voulu = Object.fromEntries(cases().map((c) => [c.dataset.sujet,
      c === b ? c.getAttribute('aria-checked') !== 'true' : c.getAttribute('aria-checked') === 'true']));
    cases().forEach((c) => { c.disabled = true; });
    $('notifNote').textContent = '';
    try {
      poserCases(await window.TBF_NOTIF.poser(voulu));
    } catch (err) {
      /* Le refus dans la fenêtre du navigateur est définitif pour ce site :
         la carte le dit, et les interrupteurs n'ont plus d'objet. */
      if (err.message === 'refusees') { notifications(); return; }
      if (err.message !== 'sans_reponse') $('notifNote').textContent = t('notif.erreur');
    } finally {
      cases().forEach((c) => { c.disabled = false; });
    }
  };
}

function tab(which) {
  $('tabLogin').classList.toggle('on', which === 'login');
  $('tabRegister').classList.toggle('on', which === 'register');
  show('formLogin', which === 'login');
  show('formRegister', which === 'register');
  show('formForgot', which === 'forgot');
  show('formReset', which === 'reset');
  show('tabLogin', which !== 'reset');
  clear('gateMsg');
}
$('tabLogin').onclick = () => tab('login');
$('tabRegister').onclick = () => tab('register');
$('btnForgot').onclick = () => tab('forgot');
$('btnBackLogin').onclick = () => tab('login');

/* ------------------------------------------------------------ actions */

function busy(form, on) {
  const b = form.querySelector('button.go');
  if (b) b.disabled = on;
}

$('formLogin').onsubmit = async (e) => {
  e.preventDefault(); clear('gateMsg'); busy(e.target, true);
  const r = await api('/login', { email: $('liEmail').value, password: $('liPassword').value });
  busy(e.target, false);
  /* Connecté : on l'emmène **chez lui**, pas sur sa fiche de compte.
   *
   * Le formulaire se contentait de redessiner la page, et le joueur se
   * retrouvait devant son adresse e-mail et son statut de vérification — un
   * écran d'administration — alors qu'il venait d'entrer dans un jeu. La
   * connexion Google, elle, faisait déjà le bon geste : voir `auth/google.js`,
   * qui envoie sur `/bienvenue` ou sur `/`. On dit ici la même chose.
   *
   * La cérémonie d'accueil passe avant, et une seule fois : quelqu'un qui n'a
   * pas encore choisi son club n'a rien à faire sur l'accueil. */
  if (r.status === 200) {
    user = r.json.user; locale = user.locale || locale; applyLocale();
    let fait = true;
    let aOuvrir = 0;
    try {
      const st = await fetch('/api/me/state', { credentials: 'same-origin' })
        .then((x) => x.json());
      fait = Boolean(st.onboarded);
      aOuvrir = Number(st.packs ?? 0);
    } catch { /* état injoignable : l'accueil se débrouille sans */ }

    /* Où l'on atterrit, dans l'ordre :
     *
     *   1. la cérémonie d'accueil, si elle n'a pas été faite — quelqu'un qui
     *      n'a pas encore choisi son club n'a rien à faire ailleurs ;
     *   2. les boosters, s'il en reste à ouvrir — c'est la seule chose du jeu
     *      qui attend, et qui attend **depuis la dernière fois** ;
     *   3. l'accueil.
     *
     * Le deuxième cas est le seul qui ne soit pas évident, et c'est pour ça
     * que la page des boosters le dit en toutes lettres : sans le `aouvrir`
     * qui suit, arriver là ressemble à une erreur de navigation.
     */
    if (!fait) { location.href = '/bienvenue'; return; }
    location.href = aOuvrir > 0 ? '/boosters?aouvrir=1' : '/';
    return;
  }
  else say('gateMsg', r.json.error ?? 'auth.error.server');
};

$('formRegister').onsubmit = async (e) => {
  e.preventDefault(); clear('gateMsg'); busy(e.target, true);
  const r = await api('/register', {
    email: $('rgEmail').value, pseudo: $('rgPseudo').value,
    password: $('rgPassword').value, locale,
  });
  busy(e.target, false);
  if (r.status === 201) {
    // Nouvel inscrit : on l'emmène choisir son club et ouvrir son paquet.
    location.href = '/bienvenue';
    return;
  }
  else say('gateMsg', r.json.error ?? 'auth.error.server');
};

$('formForgot').onsubmit = async (e) => {
  e.preventDefault(); busy(e.target, true);
  await api('/forgot', { email: $('fgEmail').value });
  busy(e.target, false);
  say('gateMsg', 'sent.reset', 'ok');
};

$('formReset').onsubmit = async (e) => {
  e.preventDefault(); clear('gateMsg'); busy(e.target, true);
  const token = new URLSearchParams(location.search).get('reinitialiser');
  const r = await api('/reset', { token, password: $('rsPassword').value });
  busy(e.target, false);
  if (r.status === 200) { history.replaceState({}, '', '/compte'); tab('login'); say('gateMsg', 'ok.reset', 'ok'); }
  else say('gateMsg', r.json.error ?? 'auth.error.server');
};

$('btnLogout').onclick = async () => {
  // Même règle que partout : la déconnexion se demande.
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: 'SE DÉCONNECTER ?',
    texte: 'Ta collection et tes duels restent. Il faudra te reconnecter pour y revenir.',
    oui: 'SE DÉCONNECTER', ton: 'flare',
  }))) return;
  // Cet appareil n'est plus prévenu pour ce joueur : voir `pwa.js`.
  await window.TBF_NOTIF?.oublier();
  await api('/logout'); user = null; tab('login'); render();
};
$('btnResend').onclick = async () => { await api('/resend-verification'); say('acMsg', 'sent.verify', 'ok'); };

/* ----------------------------------------------------- supprimer son compte

   **Deux gestes, et un mot de passe.** Le lien ouvre le formulaire, le
   formulaire demande le mot de passe, et le serveur le vérifie avant d'écrire —
   c'est lui qui décide, pas cette page. Un compte qui se supprime d'un seul clic
   se supprime par accident, et celui-là ne revient pas.

   La route existait depuis le premier jour et aucune page ne l'appelait. Un
   droit qu'on ne peut pas exercer n'est pas un droit. */
$('btnSupprimer').onclick = () => {
  $('formSupprimer').classList.remove('hide');
  $('btnSupprimer').classList.add('hide');
  $('delPassword').focus();
};
$('btnAnnulerSupp').onclick = () => {
  $('formSupprimer').classList.add('hide');
  $('btnSupprimer').classList.remove('hide');
  $('delPassword').value = '';
};
$('formSupprimer').onsubmit = async (e) => {
  e.preventDefault();
  /* Une dernière fois, en toutes lettres. Le formulaire dit déjà ce qui se
     passe ; la boîte est là pour le geste, pas pour l'information. */
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: t('delete.confirm'),
    texte: t('delete.warn'),
    oui: t('delete.confirm'), ton: 'flare',
  }))) return;

  const r = await api('/me', { password: $('delPassword').value }, 'DELETE');
  if (r.status !== 200) {
    /* Le mot de passe est le seul refus possible ici, et il se dit avec les mots
       que la page emploie déjà pour lui. */
    say('acMsg', r.json.error ?? 'auth.error.bad_credentials', 'err');
    return;
  }
  user = null;
  tab('login');
  render();
  say('gateMsg', 'delete.done', 'ok');
};

/* -------------------------------------------------------- démarrage */

(async () => {
  applyLocale();

  // Le bouton Google ne s'affiche que si le serveur est configuré pour.
  try {
    const g = await fetch('/api/auth/google/available').then((r) => r.json());
    if (g.available) $('googleBox').style.display = 'block';
  } catch { /* module absent */ }

  // Message de retour d'un échec de connexion Google.
  const erreur = new URLSearchParams(location.search).get('erreur');
  if (erreur) {
    say('gateMsg', erreur === 'email'
      ? 'auth.error.email_invalid' : 'auth.error.server');
    history.replaceState({}, '', '/compte');
  }
  const params = new URLSearchParams(location.search);

  /* ------------------------------------------------- l’invitation d’un ami

     On arrive ici par le lien de quelqu’un qui joue déjà. Trois gestes, dans
     cet ordre, et chacun compte :

       1. **le code est mis de côté** avant tout le reste. La page va changer
          d’adresse — la vérification d’e-mail fait un `replaceState`, Google
          fait un aller-retour complet — et un code qui ne vit que dans la
          barre d’adresse ne survit à aucun des deux.

       2. **on montre qui invite**, en demandant son pseudo au serveur. Sans
          ça, le lien envoie sur un formulaire d’inscription ordinaire et rien
          ne dit qu’on est attendu. C’est tout ce qui distingue une invitation
          d’une publicité.

       3. **l’onglet bascule sur INSCRIPTION.** Celui qui suit ce lien n’a pas
          de compte : lui présenter « connexion » d’abord, c’est lui demander
          un mot de passe qu’il n’a pas.

     Le code est **conservé en `localStorage`**, pas réclamé ici : c’est
     `/bienvenue` qui le réclame, parce que c’est là que tombent les deux
     chemins d’inscription — le formulaire et Google. Le faire ici ne couvrirait
     que le premier, et une invitation qui marche une fois sur deux selon le
     bouton employé est pire qu’une invitation qui ne marche pas. */
  const CLE_AMI = 'tbf.parrainage';
  const codeAmi = params.get('ami');
  if (codeAmi) {
    try { localStorage.setItem(CLE_AMI, codeAmi); } catch { /* navigation privée */ }
    history.replaceState({}, '', '/compte');
  }
  let venuParUnAmi = false;
  {
    let garde = null;
    try { garde = localStorage.getItem(CLE_AMI); } catch { /* idem */ }
    if (garde) {
      venuParUnAmi = true;
      fetch('/api/amis/invitation/' + encodeURIComponent(garde))
        .then((r) => (r.ok ? r.json() : null))
        /* Le manifeste des dessins d'abord : c'est lui qui sait si le parrain
           a une tenue et une expression dessinées. Il ne lève jamais. */
        .then(async (d) => { await window.TBF_ETATS?.charger?.(); return d; })
        .then((d) => {
          if (!d?.parrain?.pseudo) return;
          /* Le pseudo vient du serveur et part dans un `innerHTML` — le bandeau
             porte du gras, il ne peut donc pas être du texte. Il est validé à
             l'inscription, mais une validation en amont n'est pas un échappement :
             la règle peut changer, et c'est ici que ça coûterait. */
          const sur = String(d.parrain.pseudo).replace(/[&<>"]/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          /* Le parrain tel qu'il s'est choisi — âge, tenue, expression — comme
             partout ailleurs. La carte de l'âge ne sert plus que de repli. */
          const buste = (d.parrain.avatar && window.FZART?.dessinAvatar?.(d.parrain.avatar, 'buste'))
            || window.FZART?.adresse?.(d.parrain.fanzzy, 'buste');
          $('invite').innerHTML = (buste ? `<img src="${buste}" alt="">` : '')
            + `<span>${t('invite.par', { pseudo: sur })}</span>`;
          show('invite', true);
        })
        /* Le lien ne mène plus à personne — compte supprimé, code tronqué par
           une messagerie. On n’en dit rien : l’inscription reste possible, et
           annoncer « ton invitation est invalide » à quelqu’un qui arrive pour
           la première fois serait l’accueillir par un reproche. */
        .catch(() => {});
    }
  }

  const verifyToken = params.get('verifier');
  if (verifyToken) {
    const r = await api('/verify', { token: verifyToken });
    history.replaceState({}, '', '/compte');
    setTimeout(() => say(user ? 'acMsg' : 'gateMsg',
      r.status === 200 ? 'ok.verified' : 'auth.error.token_invalid',
      r.status === 200 ? 'ok' : 'err'), 50);
  }

  const me = await api('/me', undefined, 'GET');
  if (me.status === 200) { user = me.json.user; locale = user.locale || locale; applyLocale(); }

  if (params.get('reinitialiser')) tab('reset');
  /* Celui qui suit un lien d'invitation n'a pas de compte : lui ouvrir
     « connexion » d'abord, c'est lui demander un mot de passe qu'il n'a pas.
     À moins qu'il soit déjà connecté, auquel cas il ne voit pas ces onglets. */
  else if (venuParUnAmi && !user) tab('register');
  else tab('login');
  render();
})();
</script>
<!-- Le buste du parrain, et rien d’autre : `fanzzy-art.js` sait rendre une
     adresse d’image sans le catalogue. S’il manque, le bandeau se montre
     quand même, avec le pseudo seul — c’est lui qui porte le message.
     `fanzzy-etats.js` y ajoute la tenue et l’expression du parrain. -->
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/fx.js" defer></script>
<!-- **La barre du haut manquait ici, et elle seule y manquait.**

     Cette page n'a jamais chargé `nav.js`. C'était défendable tant qu'elle
     n'était que la connexion — un parcours dont on ne sort pas au milieu. Mais
     `/compte` est aussi « Mon compte » dans le tiroir : un joueur connecté y
     arrive par le menu et s'y retrouvait **sans barre, sans titre, sans flèche
     et sans menu**. Plus aucun moyen de revenir, hors du bouton du navigateur.

     Et c'est là qu'aboutissent les redirections : le profil et l'administration
     y renvoient dès que la session a expiré. On y était donc jeté, et enfermé.

     `menu.js` **avant** `nav.js` : la barre lit `window.TBF_MENU` dès sa
     première ligne pour ses titres et ses pictogrammes. Les deux sont en
     `defer`, donc exécutés dans l'ordre du document — l'ordre n'est pas une
     préférence de mise en page.

     Le décor, lui, reste à la porte : voir `SANS_DECOR` dans `nav.js`. On
     répare une navigation, on ne redessine pas l'écran de connexion. -->
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
</html>
