  const f = formuleDe(a.id);
  const mois = Number(f?.mois) || null;
  const periode = mois === 1 ? ' / MOIS' : mois === 12 ? ' / AN' : mois ? ` / ${mois} MOIS` : '';
  const packs = Number(f?.packs) || 0;
  const lignes = [
    `<small>${esc(a.nom)}</small>`,
    `<b>${esc(a.prixTexte)}${periode}</b>`,
    f?.parMois && mois > 1 ? `<small>${esc(`soit ${f.parMois} par mois`)}</small>` : '',
    packs ? `<small>${esc(`+${pluriel(packs, 'booster', 'boosters')} au paiement`)}</small>` : '',
  ].join('');
  return `<button type="button" class="tbf-plaque pass-formule" data-art="${esc(a.id)}"${
    a.marque && ouvert ? ' data-ton="or"' : ''}${ouvert ? '' : ' disabled'}
    aria-label="${esc(`M’abonner — ${a.nom}, ${a.prixTexte}${periode.toLowerCase()}`)}">${lignes}${
    a.marque ? `<span class="tbf-sticker">${esc(a.marque)}</span>` : ''}</button>`;
}

function rendrePass() {
  const c = S.catalogue;
  const el = $('rayons');
  if (!c) { el.innerHTML = ''; return; }
  const ouvert = Boolean(c.ouvert);
  const blocs = (c.rayons ?? []).map((r) => {
    const dedans = (c.articles ?? []).filter((a) => a.rayon === r.id);
    if (!dedans.length) return '';
    if (r.id !== 'abonnement') {
      return `<h2 class="tbf-cousu">${esc(r.nom)}</h2>
        <div class="pass-formules">${dedans.map((a) => bacheFormule(a, ouvert)).join('')}</div>`;
    }
    /* Le cadeau : le plus grand nombre de boosters qu'une formule donne au
       paiement. « Jusqu'à » quand elles n'en donnent pas toutes autant. */
    const nombres = dedans.map((a) => Number(formuleDe(a.id)?.packs) || 0);
    const max = Math.max(0, ...nombres);
    const cadeau = max > 0 ? `<span class="pass-cadeau">
        ${max <= 7 ? `<span class="tbf-fentes" aria-hidden="true">${'<span class="tbf-fente"></span>'.repeat(max)}</span>` : ''}
        <span><b>${esc(`${nombres.every((n) => n === max) ? '' : 'JUSQU’À '}${pluriel(max, 'BOOSTER', 'BOOSTERS')}`)}</b>
        <small>DÈS LE PAIEMENT</small></span></span>` : '';
    const abonne = S.abo && !S.abo.error && S.abo.abonne;
    const etat = abonne ? `<span class="pass-etat"><span class="tbf-tampon tbf-tampon--plein" data-ton="vert">ABONNÉ</span>${
      S.abo.formule || S.abo.fin !== undefined ? `<small>${esc([S.abo.formule,
        S.abo.fin ? `jusqu’au ${new Date(S.abo.fin).toLocaleDateString('fr', { day: 'numeric', month: 'long', year: 'numeric' })}`
          : 'sans terme'].filter(Boolean).join(' · '))}</small>` : ''}</span>` : '';
    return `<div class="tbf-cadre pass" data-ton="or" data-echarpe>
        <span class="tbf-scotch" aria-hidden="true"></span><span class="tbf-scotch tbf-scotch--droite" aria-hidden="true"></span>
        <b class="pass-titre">PASS DE TRIBUNE</b>
        ${abonne ? etat : cadeau}
        ${!ouvert && !abonne ? '<span class="tbf-sticker pass-bientot">BIENTÔT</span>' : ''}
      </div>
      ${abonne ? '' : `<div class="pass-formules">${dedans.map((a) => bacheFormule(a, ouvert)).join('')}</div>
        ${ouvert ? '' : '<p class="pass-beta">Pendant la bêta, l’abonnement s’offre depuis l’administration : demande-le.</p>'}`}`;
  }).join('');
  el.innerHTML = blocs;

  $('mot').innerHTML = (ouvert
    ? 'Les paiements passent par <b>Stripe</b>. Nous ne voyons jamais ton numéro de carte.'
    : 'La boutique est en <b>vitrine</b> : les paiements ne sont pas encore branchés.')
    + '<br>L’argent réel n’achète que l’<b>abonnement</b>. Tout le reste — les '
    + 'boosters, les tenues, l’équipement — se paie en écharpes, et les écharpes '
    + 'se gagnent en jouant.';
}

$('rayons').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-art]');
  if (!b || !S.catalogue?.ouvert || b.disabled) return;
  const a = (S.catalogue.articles ?? []).find((x) => x.id === b.dataset.art);
  if (!a) return;

  /* De l'argent réel. La confirmation ne remplace pas l'écran de paiement — on
     part chez Stripe juste après — mais elle évite d'y partir par accident, et
     surtout elle laisse une dernière occasion de lire le prix sur la même page
     que le reste de la boutique. */
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: 'PASSER COMMANDE ?',
    texte: `${a.nom} — ${a.prixTexte}. Tu seras conduit chez Stripe pour payer. Rien n’est débité avant.`,
    oui: 'CONTINUER', sousOui: a.prixTexte, ton: 'or',
  }))) return;

  b.disabled = true;
  try {
    const r = await fetch('/api/boutique/commander', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      /* On n'envoie **que** l'identifiant. Pas de prix, pas de quantité : le
         serveur les décide, et c'est ce qui empêche d'acheter douze boosters
         à un centime en modifiant cette ligne. */
      body: JSON.stringify({ article: a.id }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/compte'; return; }
    if (!r.ok || !j.url) { toast('Commande impossible pour le moment.', { erreur: true }); b.disabled = false; return; }
    location.href = j.url;
  } catch {
    toast('Commande impossible pour le moment.', { erreur: true });
    b.disabled = false;
  }
});

/* ============================================================ les rayons

   Un onglet par rayon qui a quelque chose à montrer — jamais un onglet vide.
   Un visiteur sans compte n'a ni réserve ni étal : il voit la vitrine en
   euros, sans rail. Le rayon ouvert se retient sur cet appareil, et
   l'adresse le porte (`/boutique#abonnement`, où l'écran de l'abonnement
   renvoie). */
function rayons() {
  const abo = (S.catalogue?.articles ?? []).length > 0;
  return [
    (S.etal?.stuff ?? []).length ? { id: 'equipement', nom: 'ÉQUIPEMENT' } : null,
    (S.etal?.tenues ?? []).length ? { id: 'tenues', nom: 'TENUES' } : null,
    abo ? { id: 'abonnement', nom: 'ABONNEMENT' } : null,
  ].filter(Boolean);
}

function rendreRail() {
  const l = rayons();
  const rail = $('onglets');
  rail.hidden = l.length < 2;
  rail.innerHTML = l.map((r) => `<button type="button" class="tbf-onglet${r.id === S.rayon ? ' on' : ''}"
    role="tab" id="o-${r.id}" aria-controls="p-${r.id}" aria-selected="${r.id === S.rayon}"
    tabindex="${r.id === S.rayon ? 0 : -1}" data-rayon="${r.id}">${r.nom}</button>`).join('');
}

function montrerRayon(id, { colle = false } = {}) {
  const l = rayons();
  if (!l.some((r) => r.id === id)) id = l[0]?.id ?? null;
  S.rayon = id;
  for (const r of ['equipement', 'tenues', 'abonnement']) $(`p-${r}`).hidden = r !== id;
  rendreRail();
  if (id === 'equipement') rendreEtal({ colle });
  if (id === 'tenues') rendreCabine();
  if (id) memoire.ecrire('tbf-boutique-rayon', id);
  if (id && l.length > 1) history.replaceState(null, '', `#${id}`);
}

$('onglets').addEventListener('click', (e) => {
  const t = e.target.closest('[data-rayon]');
  if (t && t.dataset.rayon !== S.rayon) montrerRayon(t.dataset.rayon, { colle: true });
});
/* Un lien vers `/boutique#abonnement` suivi depuis la boutique même ne
   recharge pas la page : l'ancre change seule, et le rayon la suit. */
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && id !== S.rayon && rayons().some((r) => r.id === id)) montrerRayon(id, { colle: true });
});
/* Les flèches du clavier passent d'un onglet à l'autre, comme dans tout rail
   d'onglets accessible. */
$('onglets').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const l = rayons();
  const i = l.findIndex((r) => r.id === S.rayon);
  const suivant = l[(i + (e.key === 'ArrowRight' ? 1 : -1) + l.length) % l.length];
  if (!suivant) return;
  e.preventDefault();
  montrerRayon(suivant.id);
  $(`o-${suivant.id}`)?.focus();
});

/* ============================================================ le montage */

async function monterEtal() {
  const d = await lire('/api/boutique/etal');
  /* Pas connecté, ou l'étal injoignable : la vitrine en euros reste lisible,
     et on ne met pas d'erreur devant quelqu'un qui regarde. Une relecture
     qui échoue après un achat garde l'étal d'avant : il se redessine, ses
     boutons se rouvrent, et le solde dira ce qui s'est passé. */
  if (d) {
    S.etal = d;
    S.echarpes = Number(d.echarpes) || 0;
  }
  /* Le manifeste des dessins, **avant** de rendre la cabine : sans lui,
     aucune tenue ne se trouverait portée. */
  await window.TBF_ETATS?.charger?.().catch(() => {});
  /* Pendant la cérémonie d'un achat, le solde attend son tampon : c'est elle
     qui le pose (voir `ceremonie`). */
  if (S.etat?.wallet && !enCeremonie()) poserSolde(document.querySelector('#reserve [data-echarpes]'), S.echarpes);
  rendreUne();
  if (S.rayon === 'equipement') rendreEtal();
  if (S.rayon === 'tenues') rendreCabine();
  rendreRail();
}

async function monter() {
  const [catalogue, etat, abo, dex] = await Promise.all([
    lire('/api/boutique/catalogue'),
    lire('/api/fanzzy/state'),
    /* **Une seule question à l'abonnement par page.** Le tiroir la pose
       aussi (sa marque ABONNÉ) : la réponse se partage par la promesse
       posée sur la fenêtre, `window.TBF_ABO` — comme `TBF_MOI` pour le
       compte, et comme le KOP —, le premier qui passe la pose, l'autre la
       reprend. Cette page passe la première (le tiroir attend le compte
       avant de se monter). Sa forme est celle de tous ses lecteurs, celle
       de `lire` : le corps d'une réponse réussie, ou `null`, sans jamais
       lever. L'objet est commun : on le lit, on n'y écrit pas. */
    (window.TBF_ABO ??= lire('/api/abonnement')),
    lire('/api/fanzzy/dex'),
  ]);
  S.dex = dex?.dex ?? null;
  S.catalogue = catalogue;
  S.etat = etat?.wallet ? etat : null;
  S.abo = abo && !abo.error ? abo : null;
  if (S.etat) {
    S.echarpes = Number(S.etat.wallet.scarves) || 0;
    lireRecharge(S.etat.wallet);
    annoncer(S.etat.wallet);
  }
  rendreReserve();
  rendrePass();
  await monterEtal();

  if (!catalogue && !S.etal) dire('err', 'La boutique est injoignable pour le moment.');

  const demande = location.hash.slice(1);
  const voulu = retourStripe ? 'abonnement'
    : (['equipement', 'tenues', 'abonnement'].includes(demande) ? demande : memoire.lire('tbf-boutique-rayon'));
  montrerRayon(voulu, { colle: true });
}

monter();
</script>
<!-- Les effets communs : le solde qui compte, le jeton qui vole, et la
     cérémonie d'achat (`FX.reveler`). La page reste juste sans eux — le
     chiffre saute, rien ne vole, l'objet est simplement là. -->
<script src="/fx.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
