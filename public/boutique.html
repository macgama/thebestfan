<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>La boutique — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* La boutique.

   Elle ressemble au kiosque — mêmes vignettes, même socle dur — et c'est
   voulu : on y achète les mêmes choses, avec une autre monnaie. Un écran qui
   aurait sa propre identité ferait croire à un autre jeu.

   Ce qui change, et qui doit se voir : **le prix est en euros**. Il est écrit
   plus gros que tout le reste de la carte, parce que c'est la seule
   information qui engage. */

.rayon{margin:0 0 6px;padding:0 2px}
/* Les titres de rayon sont cousus (`.tbf-cousu`, dans ui.css), comme toutes
   les rubriques du jeu. La casse se décide là et non dans la donnée :
   « ÉQUIPEMENT » est écrit dans la page, « Billets » vient du nom du rayon, et
   sans les capitales de la brique le lecteur verrait deux niveaux de titre là
   où il n'y en a qu'un. Il ne reste ici que leur place. */
.rayon h2{margin:18px 0 6px}
/* La phrase du rayon, sur un panneau : elle était posée à même la photo de
   tribune, à 50 %, et ne se lisait qu'à l'ombre. */
.rayon > p{margin:0 0 10px;padding:8px 11px;border-radius:9px;background:var(--panneau);
  font-size:11.5px;line-height:1.5;box-shadow:inset 0 0 0 1px rgba(242,238,228,.07)}
/* Un rayon sans phrase n'a pas de panneau vide sous son titre. */
.rayon > p:empty{display:none}

.etal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}

/* Une carte d'article, et non une plaque : elle porte un nom, une phrase et un
   prix, et la matière des boutons — capitales, texte centré — les écraserait.
   Son voile de lumière est posé sur le panneau, pas sur la photo. */
.art{position:relative;display:flex;flex-direction:column;gap:4px;
  padding:12px 12px 11px;border-radius:12px;cursor:pointer;text-align:left;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(0,0,0,.34)),var(--panneau);
  border:1px solid rgba(242,238,228,.13);border-top:3px solid var(--projo);
  color:inherit;font:inherit}
.art:active{transform:translateY(2px)}
.art b{font-family:var(--banner);font-size:14.5px;line-height:1.15}
.art small{font-size:11px;opacity:.88;line-height:1.45;min-height:31px}
.art .prix{font-family:var(--banner);font-size:21px;color:var(--projo);margin-top:6px}
/* La pastille « le plus pris » : une seule carte la porte, sinon elle ne dit
   plus rien. */
.art .marque{position:absolute;top:-8px;right:9px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--projo);color:#1A0C04;
  padding:3px 8px;border-radius:20px;font-weight:700}
/* **Fermé ne veut pas dire illisible.** En vitrine, l'article était éteint à
   45 % : on voyait qu'on ne pouvait pas l'acheter, et on ne pouvait plus lire
   ce qu'il était ni combien il coûtait — c'est pourtant ce qu'une vitrine
   montre. Il perd sa couleur et son curseur ; son texte reste entier, et le
   mot du bas dit pourquoi. */
.art[disabled]{filter:saturate(.35);cursor:default}
.art[disabled]:active{transform:none}

/* Le bandeau du haut : ce qu'on possède déjà, pour ne pas acheter ce qu'on a.
   Il reprend les dessins de l'accueil — l'écharpe rayée, le sachet — parce que
   c'est la même monnaie. Il disait reprendre « exactement les jetons de la
   barre commune » : c'était vrai quand la barre les portait, et plus depuis
   que l'accueil les a redessinés. On lisait un carré rayé ici et une bande
   là-bas ; un même objet dessiné de deux façons, c'est deux objets à
   apprendre. */
/* Le jeton du billet est parti avec lui. Sa règle reste ici, en commentaire,
   parce qu'elle vaut pour les deux qui restent : deux monnaies dans une même
   ligne doivent se reconnaître sans qu'on lise le nombre. */

/* ----------------------------------------------------------------- l'étal

   **On vendait une liste de courses.** Une ligne par objet : un nom, une
   phrase grise, un prix à droite. C'est exact, c'est lisible, et ça ne donne
   envie de rien — or c'est le seul écran du jeu dont le métier est de donner
   envie. À côté, le kiosque montre des cartes qui se retournent et la fiche
   montre le personnage en pied ; l'étal, lui, ressemblait à une facture.

   Il montre maintenant **l'objet**. Le dessin est déjà là, détouré, dans la
   même bibliothèque que le deck emploie : il ne manquait qu'à l'appeler. Une
   tenue, elle, se montre **portée par un Fanzzy du joueur** — c'est le seul
   argument de vente qui existe pour une tenue, et la voir sur un inconnu ne
   dit rien.

   La rareté tient le cadre, comme partout : mêmes jetons de couleur, même
   lueur que sur le butin d'un booster. Un objet légendaire doit se
   reconnaître de loin, sinon la rareté n'est qu'un mot écrit en petit. */
.objets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.obj{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:7px;width:100%;text-align:center;padding:13px 10px 11px;border-radius:14px;
  color:inherit;cursor:pointer;overflow:hidden;
  background:
    radial-gradient(84% 58% at 50% 0%,color-mix(in srgb,var(--rc,#C2CAD6) 26%,transparent),transparent 72%),
    linear-gradient(180deg,#151B24,#090D13);
  border:1px solid color-mix(in srgb,var(--rc,#C2CAD6) 40%,transparent);
  box-shadow:0 3px 0 var(--rc2,#4E5865),0 8px 18px rgba(0,0,0,.45);
  transition:transform .12s ease,box-shadow .12s ease}
.obj:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--rc2,#4E5865),0 4px 10px rgba(0,0,0,.45)}
/* La lueur ne va qu'au-dessus de « rare » : posée sur tout, elle ne
   distinguerait plus rien — c'est la règle du butin d'un booster, reprise. */
.obj.r-epique{box-shadow:0 3px 0 var(--rc2),0 8px 20px rgba(130,87,218,.34)}
.obj.r-legendaire{box-shadow:0 3px 0 var(--rc2),0 8px 24px rgba(245,195,59,.42)}

/* Le dessin, dans une boîte à hauteur fixe pour que les cartes s'alignent :
   un étal aux vignettes inégales se lit comme une panne. */
.obj .vue{position:relative;width:100%;height:96px;display:grid;place-items:center}
/* **Le dessin est pose en absolu**, comme celui de `.tbf-piece`.

   En flux, la ligne de grille se dimensionnait sur l image et l image sur la
   ligne : mesure faite, elle sortait a 163 px dans une boite de 96 et
   recouvrait le nom. Un enfant absolu se resout sur la boite du parent, qui
   est fixe, donc la boucle n existe plus. */
.obj .vue img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}
/* Le repli : un cadre de rareté vide plutôt qu'un trou. Tous les objets ne
   sont pas dessinés, et un étal qui sauterait les non-dessinés cacherait une
   partie de ce qui est en vente. */
.obj .vue .vide{width:54px;height:54px;border-radius:13px;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc,#C2CAD6) 55%,transparent);
  background:radial-gradient(70% 70% at 50% 34%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 72%)}

.obj b{display:block;font-family:var(--banner);font-size:13.5px;line-height:1.2;
  letter-spacing:.02em}
/* Onze pixels au moins, et 88 % : ce que fait l'objet et sa rareté sont
   précisément ce qu'on vient lire avant d'acheter. Ils étaient en dix et
   demi à 55 %, et en huit et demi — cinquante-deux fois chacun sur l'étal. */
.obj .quoi{display:block;font-size:11px;opacity:.88;line-height:1.4;min-height:31px}
.obj .rar{font-size:11px;letter-spacing:.12em;font-family:var(--banner);
  color:var(--rc,#C2CAD6)}

/* Le prix, en bas et en jeton : c'est ce qu'on compare d'une carte à l'autre,
   donc il est toujours à la même hauteur. */
.obj .cout{margin-top:auto;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--banner);font-size:17px;color:var(--projo);
  font-variant-numeric:tabular-nums}
.obj .cout i{width:15px;height:11px;border-radius:2px;flex:none;
  background:linear-gradient(135deg,#FFF0BF,#C9962A);
  box-shadow:0 0 0 1px rgba(42,30,4,.6)}

/* **Trop cher ne se dit pas en gris.**

   La carte était éteinte à 42 % d'opacité : on voyait qu'on ne pouvait pas,
   jamais **combien il manquait**, donc jamais quoi aller faire. C'est la
   faute que la fiche d'un personnage a déjà corrigée pour l'évolution — « le
   prix et la bourse voyagent ensemble » — et l'étal la refaisait à côté.

   La carte reste allumée, et le prix devient l'écart. Un joueur à qui il
   manque trois écharpes sait qu'un duel suffit ; un joueur devant une carte
   grise range son téléphone. */
.obj[disabled]{cursor:default;filter:saturate(.72)}
.obj[disabled] .vue img,.obj[disabled] .vue .vide{opacity:.5}
.obj .manque{margin-top:auto;font-family:var(--banner);font-size:11px;
  letter-spacing:.06em;color:var(--flare);line-height:1.3}
.obj .manque b{display:block;font-size:15px;color:var(--flare)}

/* Déjà possédé : un bandeau en travers du coin, pas une étiquette discrète.
   On doit le voir **avant** de lire le nom. */
.obj.mien .vue::after{content:"DÉJÀ À TOI";position:absolute;top:12px;left:-30px;
  transform:rotate(-38deg);background:var(--vert,#1E9E6A);color:#032116;
  font-family:var(--banner);font-size:11px;letter-spacing:.08em;
  padding:3px 30px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.obj.mien{filter:saturate(.6)}


/* Deux étiquettes (`.tbf-etiquette`, ui.css) : la matière d'une valeur, pas
   d'un bouton. Elles étaient posées sur un voile à 30 %, c'est-à-dire sur la
   photo de tribune. Le dessin prend la couleur de ce qu'il compte, et c'est
   lui seul qui dit qu'un nombre est un compte d'écharpes ou de boosters : le
   nombre, lui, est à l'encre.

   **Une étiquette est un sticker craie**, et sur la craie un ton s'écrit
   dans sa version encre — la règle de la feuille commune, celle du tampon
   plein : l'or en `--or-encre`, le flare en `--rouge-fonce`. L'or vif de
   l'accueil, qui pose ses jetons sur le panneau sombre, n'y tenait plus
   qu'à 1,4:1 et se lisait en jaune pâle ; l'encre d'or tient 4,6:1. Le flare
   vif passait de justesse (3,7:1), mais à côté d'un or éteint il criait plus
   fort que lui : deux soldes de même rang prennent la même encre. */
.avoir{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
.avoir .tbf-etiquette{gap:7px;padding:6px 11px;font-size:15px}
.avoir svg{width:20px;height:20px;flex:none;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.avoir .monnaie-ech svg{stroke:var(--or-encre)}
.avoir .monnaie-pack svg{stroke:var(--rouge-fonce)}

/* Le renvoi vers l'abonnement. Une bande, pas un bouton : ce n'est pas un
   achat qu'on fait ici, c'est un écran qu'on va lire. */
/* Les voiles de couleur de ces quatre bandes sont posés **sur** le panneau :
   seuls, à 5, 16 ou 28 %, ils laissaient la photo de tribune derrière le
   texte. Et leur texte se lit — à 65 ou 72 %, il ne se lisait qu'à l'ombre. */
.vers-abo{display:flex;align-items:center;gap:10px;margin:18px 0 0;padding:13px 14px;
  border-radius:12px;text-decoration:none;color:inherit;
  background:linear-gradient(140deg,rgba(245,195,59,.16),rgba(245,195,59,.05)),var(--panneau);
  border:1px solid rgba(245,195,59,.38)}
.vers-abo b{font-family:var(--banner);font-size:13.5px;letter-spacing:.08em;
  color:var(--projo);flex:none}
.vers-abo span{flex:1;min-width:0;font-size:11.5px;opacity:.88;line-height:1.4}
.vers-abo i{font-style:normal;font-family:var(--banner);font-size:17px;
  opacity:.85;flex:none}

.mot{margin:14px 0 0;padding:11px 13px;border-radius:10px;font-size:11.5px;
  line-height:1.55;background:var(--panneau);border:1px solid rgba(242,238,228,.1)}
.mot b{color:var(--projo)}

.err{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;
  background:linear-gradient(rgba(224,64,44,.16),rgba(224,64,44,.16)),var(--panneau);
  border:1px solid rgba(224,64,44,.4);display:none}
.err.on{display:block}
.ok{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;
  background:linear-gradient(rgba(30,158,106,.16),rgba(30,158,106,.16)),var(--panneau);
  border:1px solid rgba(30,158,106,.4);display:none}
.ok.on{display:block}

/* **Le bas de la page, et la barre du navigateur mobile.**

   Voir aide.html pour l'explication : le dernier element d'une page qui defile
   est colle au bas du document, et la barre du navigateur passe par-dessus.
   Cette page-ci n'a aucune declaration de hauteur — elle defile de bout en
   bout — donc le probleme la concerne autant que les autres. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
</head>
<body>
<main id="app">

  <div class="avoir" id="avoir" hidden>
    <!-- Deux monnaies, plus trois : le billet est parti avec l'argent réel, et
         son jeton avec lui. Un jeton qui affiche toujours zéro se lit comme une
         monnaie qu'on ne sait pas gagner. -->
    <span class="tbf-etiquette monnaie-ech"><svg viewBox="0 0 24 24" role="img" aria-label="Écharpes"><rect
      x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M8 8.5 6 15.5M13 8.5l-2 7M18 8.5l-2 7"/></svg><b
      id="avEch">0</b></span>
    <span class="tbf-etiquette monnaie-pack"><svg viewBox="0 0 24 24" role="img" aria-label="Boosters"><path
      d="M4 8h16v12H4zM4 8l2-4h12l2 4M12 4v16"/></svg><b id="avPack">0</b></span>
  </div>

  <div class="ok" id="ok"></div>
  <div class="err" id="err"></div>

  <div id="etal"></div>
  <div id="rayons"></div>

  <!-- L'abonnement a son écran ; la boutique n'y menait pas. Un joueur qui
       lit « l'argent réel n'achète que l'abonnement » juste en dessous doit
       pouvoir y aller d'un geste. -->
  <a class="vers-abo" href="/abonnement">
    <b>L’ABONNEMENT</b>
    <span>Ce qu’il ouvre, et ce qu’il ne change pas</span>
    <i>›</i>
  </a>

  <p class="mot" id="mot"></p>
</main>

<!-- Les dessins. La boutique n'en chargeait aucun : elle vendait des noms.
     Le premier pour l'équipement détouré ; les deux suivants pour montrer une
     tenue **portée**, ce qui demande de savoir résoudre un Fanzzy dans un
     skin donné. -->
<script src="/stuff-art.js"></script>
<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-etats.js"></script>
<script src="/menu.js"></script>
<script src="/nav.js"></script>
<script>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const dire = (id, texte) => { const e = $(id); e.textContent = texte; e.className = e.className.replace(' on', '') + ' on'; };

/**
 * Pose un solde affiché — et le fait **compter** s'il change sous les yeux.
 *
 * Le bandeau sautait d'un nombre à l'autre après un achat : on lisait la
 * confirmation, et il fallait se souvenir du chiffre d'avant pour voir ce que
 * l'objet avait coûté. Une dépense fait maintenant descendre le chiffre
 * (`FX.compter`, dans fx.js) : c'est ce qui dit, sans une phrase de plus, que
 * l'achat a pris.
 *
 * `data-v` retient la valeur affichée, d'où l'on compte. La première pose ne
 * compte pas : un solde qui défilerait depuis zéro à l'arrivée sur la page
 * raconterait une dépense qui n'a pas eu lieu. Et une valeur identique ne
 * réécrit rien — elle couperait un compte en cours, qui repartirait en
 * arrière pour une image.
 */
function poserSolde(el, valeur) {
  const apres = Number(valeur) || 0;
  const avant = el.dataset.v === undefined ? null : Number(el.dataset.v);
  if (avant === apres) return;
  el.dataset.v = String(apres);
  if (avant === null || !window.FX?.compter) { el.textContent = String(apres); return; }
  window.FX.compter(el, avant, apres);
}

/* Le retour de Stripe. Il dit seulement que le joueur est revenu — **pas** que
   la commande est livrée. La livraison se fait dans le webhook, sur le
   serveur, et elle peut arriver une seconde après ou une minute après. On dit
   donc « c'est payé, ça arrive », et jamais « voilà vos boosters » : promettre
   une chose qu'on n'a pas encore faite est le plus sûr moyen d'être accusé de
   ne pas l'avoir faite. */
{
  const p = new URLSearchParams(location.search);
  if (p.get('paye')) dire('ok', 'Paiement reçu. Ta commande arrive — recharge dans un instant si elle tarde.');
  if (p.get('annule')) dire('err', 'Paiement annulé. Rien n’a été débité.');
  if (p.has('paye') || p.has('annule')) history.replaceState(null, '', '/boutique');
}

let ouvert = false;

async function monter() {
  const rep = await fetch('/api/boutique/catalogue').then((r) => r.json()).catch(() => null);
  if (!rep) { dire('err', 'La boutique est injoignable pour le moment.'); return; }
  ouvert = rep.ouvert;

  $('rayons').innerHTML = (rep.rayons ?? []).map((r) => {
    const dedans = rep.articles.filter((a) => a.rayon === r.id);
    if (!dedans.length) return '';
    return `<section class="rayon"><h2 class="tbf-cousu">${esc(r.nom)}</h2><p>${esc(r.texte)}</p>
      <div class="etal">${dedans.map((a) => `
        <button class="art" data-art="${esc(a.id)}" ${ouvert ? '' : 'disabled'}>
          ${a.marque ? `<span class="marque">${esc(a.marque)}</span>` : ''}
          <b>${esc(a.nom)}</b>
          <small>${esc(a.texte)}</small>
          <span class="prix">${esc(a.prixTexte)}</span>
        </button>`).join('')}</div></section>`;
  }).join('');

  $('mot').innerHTML = (ouvert
    ? 'Les paiements passent par <b>Stripe</b>. Nous ne voyons jamais ton numéro de carte.'
    : 'La boutique est en <b>vitrine</b> : les paiements ne sont pas encore branchés.')
    + '<br>L’argent réel n’achète que l’<b>abonnement</b>. Tout le reste — les '
    + 'boosters, les tenues, l’équipement — se paie en écharpes, et les écharpes '
    + 'se gagnent en jouant.';

  /* Ce qu'on possède déjà. Facultatif : un visiteur non connecté voit les prix
     sans voir un solde qui n'existe pas. */
  try {
    const w = await fetch('/api/fanzzy/state', { credentials: 'same-origin' })
      .then((r) => (r.ok ? r.json() : null));
    if (w?.wallet) {
      poserSolde($('avEch'), w.wallet.scarves ?? 0);
      poserSolde($('avPack'), w.wallet.packs ?? 0);
      $('avoir').hidden = false;

      /* Le mannequin des tenues : son avatar, à l'âge qu'il a atteint.

         `active` est le personnage qu'il a choisi de montrer aux autres —
         donc celui auquel il tient, donc le seul sur lequel une tenue vaut la
         peine d'être imaginée. `stades` ne porte que les âges supérieurs à
         un : l'absence y vaut « premier âge », et c'est pour ça que le repli
         est 1 et non zéro. */
      const moi = w.wallet.active;
      if (moi) mannequin = { id: moi, evo: Number(w.stades?.[moi] ?? 1) };
    }
  } catch { /* pas connecté : on montre la vitrine */ }

  await monterEtal();
}

/* --------------------------------------------------------------- l'étal

   Ce que les écharpes achètent, en dehors des boosters. Rien n'y est tiré au
   sort : le joueur lit le
   nom, la phrase et le prix avant de toucher. C'est toute la différence avec
   ce que cette boutique vendait avant, où « une tenue » à 2,49 € était un
   tirage. */

let echarpes = 0;

/* Le Fanzzy qui sert de mannequin aux tenues, et jusqu'où il a grandi.

   Une tenue ne se vend pas par son nom : « Hiver » ne dit rien, « Hiver sur
   ton Capo » se regarde. On prend donc celui que le joueur a mis en avatar —
   c'est celui auquel il tient — et son âge atteint, parce qu'une tenue
   appartient à un âge et que montrer le gamin à qui joue le Capo serait
   montrer autre chose que ce qui s'achète.

   Nul si le joueur n'a pas encore d'avatar : les tenues gardent alors leur
   cadre de rareté vide, ce qui reste honnête. */
let mannequin = null;

/* Les raretes, ecrites comme elles se disent. `toUpperCase()` seul rendait
   « EPIQUE » et « LEGENDAIRE » : la donnee est sans accent parce qu elle sert
   d identifiant, ce qui ne doit pas se voir sur une carte qu on vend. */
const RAR_MOT = { commune: 'COMMUNE', rare: 'RARE',
  epique: 'ÉPIQUE', legendaire: 'LÉGENDAIRE' };

/**
 * Le dessin d'un objet de l'étal.
 *
 * Deux sortes, deux bibliothèques, et un repli commun. Le repli n'est pas une
 * image manquante mais un cadre de rareté vide : un trou dans une grille se
 * lit comme une panne, un cadre vide se lit comme « pas encore dessiné ».
 */
function vueObjet(o) {
  if (o.type === 'stuff' && window.TBF_STUFF) {
    /* `objet` et non `illu` : fx.js, chargé ici pour faire compter le solde,
       fait respirer toute image `.illu` et la fait sursauter au toucher.
       L'étal est une vitrine immobile, et le doigt qui touche une pièce
       ouvre la confirmation d'achat — pas un personnage qui réagit. */
    return window.TBF_STUFF.illustration(o.id, 'objet');
  }
  if (o.type === 'tenue' && mannequin && window.TBF_ETATS) {
    /* Le repos, et pas une expression : on vend la tenue, pas l'humeur. Et
       `resoudre` descend seul jusqu'à ce qui existe — une tenue non dessinée
       sur ce personnage-là retombe sur sa tenue de base, ce qui montrerait le
       mauvais vêtement. On n'accepte donc que la réponse exacte — **à l'âge
       du mannequin aussi** : une tenue dessinée au premier âge seulement ne
       doit pas se vendre sous les traits d'un âge qu'elle n'habille pas. */
    const r = window.TBF_ETATS.resoudre(mannequin.id,
      { evo: mannequin.evo, skin: o.id, etat: 'neutre' });
    if (r?.skin === o.id && r.evo === mannequin.evo) {
      return '<img src="' + r.src + '" alt="" loading="lazy" onerror="this.remove()">';
    }
  }
  return '<span class="vide"></span>';
}

const ligneObjet = (o, assez) => `<button class="obj r-${esc(o.rar ?? 'commune')}${
  o.possede ? ' mien' : ''}" data-type="${esc(o.type)}"
  data-id="${esc(o.id)}" data-prix="${o.prix}" ${assez ? '' : 'disabled'}>
  <span class="vue">${vueObjet(o)}</span>
  <b>${esc(o.nom)}</b>
  <span class="rar">${esc(RAR_MOT[o.rar] ?? (o.rar ?? '').toUpperCase())}</span>
  <span class="quoi">${esc(o.texte ?? '')}</span>
  ${assez
    ? `<span class="cout"><i></i>${o.prix}</span>`
    /* **L'écart, et non le refus.** Voir le commentaire de \`.manque\` : dire
       « il te manque 3 » envoie jouer un duel ; griser la carte range le
       téléphone. */
    : `<span class="manque"><b>${o.prix - echarpes}</b>écharpe${
        o.prix - echarpes > 1 ? 's' : ''} de plus</span>`}
</button>`;

async function monterEtal() {
  const d = await fetch('/api/boutique/etal', { credentials: 'same-origin' })
    .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // Pas connecté, ou l'étal est injoignable : la vitrine en euros reste
  // lisible, et on ne met pas d'erreur devant quelqu'un qui regarde.
  if (!d) { $('etal').innerHTML = ''; return; }

  echarpes = d.echarpes ?? 0;
  poserSolde($('avEch'), echarpes);

  /* Le manifeste des dessins, **avant** de rendre. Sans lui, `resoudre` ne
     sait rien et toutes les tenues sortiraient avec leur cadre vide — puis
     rien ne les corrigerait, l'étal ne se redessinant qu'après un achat. */
  await window.TBF_ETATS?.charger?.().catch(() => {});

  const bloc = (titre, phrase, objets) => objets.length
    ? `<section class="rayon"><h2 class="tbf-cousu">${esc(titre)}</h2><p>${esc(phrase)}</p>
        <div class="objets">${objets.map((o) => ligneObjet(o, echarpes >= o.prix)).join('')}</div>
      </section>`
    : '';

  $('etal').innerHTML =
    bloc('ÉQUIPEMENT', 'Ce qu’on emporte dans la tribune. Choisis la pièce : rien n’est tiré au sort.',
      d.stuff ?? [])
    + bloc('TENUES', 'Habille un Fanzzy que tu as déjà. Tu choisis lequel, et à quel âge.',
      d.tenues ?? []);
}

$('etal').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-type]');
  if (!b || b.disabled) return;

  /* Une tenue se pose sur quelqu'un : sans le couple Fanzzy + âge, il n'y a
     rien à acheter. L'écran de la collection sait déjà présenter ce choix — on
     y envoie plutôt que d'en fabriquer une seconde version ici, qui finirait
     par proposer autre chose. */
  if (b.dataset.type === 'tenue') {
    location.href = '/fanzzy?ecran=dex&tenue=' + encodeURIComponent(b.dataset.id);
    return;
  }

  /* Une dépense se demande. Ici elle est définitive — une écharpe dépensée ne
     revient pas — et les lignes de l'étal se touchent en faisant défiler. Le
     prix est répété dans la boîte : c'est ce qu'on regarde, et c'est ce qu'on
     aurait dû relire avant de toucher. */
  const prix = Number(b.dataset.prix) || 0;
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: `ACHETER ${(b.querySelector('b')?.textContent ?? '').toUpperCase()} ?`,
    texte: `${prix} écharpe${prix > 1 ? 's' : ''} seront débitées. Une écharpe `
      + 'dépensée ne revient pas — mais elle se regagne en jouant.',
    oui: 'ACHETER', sousOui: `${prix} écharpe${prix > 1 ? 's' : ''}`, ton: 'or',
  }))) return;

  b.disabled = true;
  try {
    const r = await fetch('/api/boutique/depenser', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: b.dataset.type, id: b.dataset.id }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { dire('err', MESSAGES[j.error] ?? 'Achat impossible.'); b.disabled = false; return; }
    dire('ok', 'C’est à toi. Tu le retrouves dans ton deck.');
    echarpes = j.echarpes ?? echarpes;
    // La dépense se voit : le solde descend jusqu'à ce qui reste.
    poserSolde($('avEch'), echarpes);
    await monterEtal();
  } catch {
    /* **« Rien n'a été débité » était une promesse qu'on ne pouvait pas tenir.**
     *
     * `fetch` part en erreur sur une coupure réseau — et une coupure peut
     * survenir **après** que le serveur a reçu et traité l'achat, en lisant sa
     * réponse. Le débit a très bien pu passer. Affirmer le contraire est la
     * seule chose qu'on n'a pas le droit de faire quand il s'agit du solde de
     * quelqu'un : un joueur rassuré rachète, et se retrouve débité deux fois.
     *
     * On dit donc ce qui est vrai, et on relit le solde pour qu'il puisse en
     * juger lui-même. Le bouton reste fermé jusqu'à ce que l'étal soit revenu :
     * rouvrir tout de suite, c'est inviter au second achat qu'on redoute. */
    dire('err', 'Le serveur n’a pas répondu — on ne sait pas si l’achat est passé. '
      + 'Vérifie ton solde avant de réessayer.');
    await monterEtal().catch(() => { b.disabled = false; });
  }
});

/* Les refus, en français. Un code d'erreur sous les yeux d'un joueur est un
   aveu qu'on n'a pas prévu son cas. */
const MESSAGES = {
  'boutique.error.echarpes_insuffisantes': 'Il te manque des écharpes. Pousse dans un virage, ou gagne un duel.',
  'boutique.error.objet_inconnu': 'Cet objet n’est plus en vente.',
  'boutique.error.tenue_inconnue': 'Cette tenue n’est plus en vente.',
  'boutique.error.fanzzy_non_possede': 'Tu ne possèdes pas ce Fanzzy à cet âge.',
  'boutique.error.tenue_deja_posee': 'Ce Fanzzy porte déjà cette tenue.',
  'auth.error.unauthenticated': 'Connecte-toi pour acheter.',
};

$('rayons').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-art]');
  if (!b || !ouvert || b.disabled) return;

  /* De l'argent réel. La confirmation ne remplace pas l'écran de paiement — on
     part chez Stripe juste après — mais elle évite d'y partir par accident, et
     surtout elle laisse une dernière occasion de lire le prix sur la même page
     que le reste de la boutique. */
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: `PASSER COMMANDE ?`,
    texte: `${b.querySelector('b')?.textContent ?? 'Cet article'} — `
      + `${b.querySelector('.prix')?.textContent ?? ''}. Tu seras conduit chez Stripe `
      + 'pour payer. Rien n’est débité avant.',
    oui: 'CONTINUER', sousOui: b.querySelector('.prix')?.textContent ?? '', ton: 'or',
  }))) return;

  b.disabled = true;
  try {
    const r = await fetch('/api/boutique/commander', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      /* On n'envoie **que** l'identifiant. Pas de prix, pas de quantité : le
         serveur les décide, et c'est ce qui empêche d'acheter douze boosters
         à un centime en modifiant cette ligne. */
      body: JSON.stringify({ article: b.dataset.art }),
    });
    const j = await r.json();
    if (r.status === 401) { location.href = '/compte'; return; }
    if (!r.ok || !j.url) { dire('err', 'Commande impossible pour le moment.'); b.disabled = false; return; }
    location.href = j.url;
  } catch {
    dire('err', 'Commande impossible pour le moment.');
    b.disabled = false;
  }
});

monter();
</script>
<!-- Les effets communs, pour une seule chose ici : faire compter le solde
     quand un achat le fait descendre (voir « poserSolde »). La page reste
     juste sans eux — le chiffre saute au lieu de compter. -->
<script src="/fx.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
</html>
