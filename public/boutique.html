<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La boutique — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<style>
/* La boutique.

   Elle ressemble au kiosque — mêmes vignettes, même socle dur — et c'est
   voulu : on y achète les mêmes choses, avec une autre monnaie. Un écran qui
   aurait sa propre identité ferait croire à un autre jeu.

   Ce qui change, et qui doit se voir : **le prix est en euros**. Il est écrit
   plus gros que tout le reste de la carte, parce que c'est la seule
   information qui engage. */

.rayon{margin:0 0 6px;padding:0 2px}
/* La casse se décide ici et non dans la donnée : « ÉQUIPEMENT » est écrit
   dans la page, « Billets » vient du nom du rayon, et sans cette ligne le
   lecteur voit deux niveaux de titre là où il n'y en a qu'un. */
.rayon h2{font-family:var(--banner);font-size:15px;letter-spacing:.14em;
  margin:18px 0 2px;text-transform:uppercase}
.rayon p{margin:0 0 10px;font-size:11.5px;opacity:.5;line-height:1.5}

.etal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}

.art{position:relative;display:flex;flex-direction:column;gap:4px;
  padding:12px 12px 11px;border-radius:12px;cursor:pointer;text-align:left;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(0,0,0,.34));
  border:1px solid rgba(242,238,228,.13);border-top:3px solid var(--projo);
  color:inherit;font:inherit}
.art:active{transform:translateY(2px)}
.art b{font-family:var(--banner);font-size:14.5px;line-height:1.15}
.art small{font-size:11px;opacity:.56;line-height:1.45;min-height:31px}
.art .prix{font-family:var(--banner);font-size:21px;color:var(--projo);margin-top:6px}
/* La pastille « le plus pris » : une seule carte la porte, sinon elle ne dit
   plus rien. */
.art .marque{position:absolute;top:-8px;right:9px;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;background:var(--projo);color:#1A0C04;
  padding:3px 7px;border-radius:20px;font-weight:700}
.art[disabled]{opacity:.45;cursor:default}

/* Le bandeau du haut : ce qu'on possède déjà, pour ne pas acheter ce qu'on a.
   Il reprend exactement les jetons de la barre commune — mêmes formes, mêmes
   couleurs — parce que c'est la même monnaie. */
/* Le billet : un rectangle d'or, distinct de l'écharpe rayée et de la
   pastille de booster. Trois monnaies dans une même ligne doivent se
   reconnaître sans qu'on lise le nombre. */
.avoir .b{background:linear-gradient(135deg,var(--projo),#C9962A);border-radius:2px;
  width:18px;height:12px}

/* ----------------------------------------------------------------- l'étal
   Une ligne par objet, et non une grille : un objet d'étal porte un nom, une
   phrase, un prix et un état — c'est trop pour une vignette carrée, et la
   phrase est précisément ce qui évite d'acheter à l'aveugle. */
.objets{display:flex;flex-direction:column;gap:7px}
.obj{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border-radius:11px;color:inherit;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid rgba(242,238,228,.13)}
.obj:active{transform:translateY(2px)}
.obj .txt{flex:1;min-width:0}
.obj .txt b{display:block;font-family:var(--banner);font-size:14px;letter-spacing:.02em}
.obj .txt small{display:block;margin-top:3px;font-size:11px;opacity:.55;line-height:1.45}
/* Le prix est une étiquette dorée : une valeur, pas une action. La ligne
   entière est le bouton — un prix qui aurait l'air de s'enfoncer ferait croire
   à deux cibles là où il n'y en a qu'une. */
.obj .cout{flex:none;font-size:16px}
.obj .cout i{width:14px;height:10px;border-radius:2px;
  background:linear-gradient(135deg,#FFF0BF,#C9962A);
  box-shadow:0 0 0 1px rgba(42,30,4,.6)}
/* Trop cher : on le montre quand même, et on le grise. Le retirer ferait un
   étal qui rétrécit quand on est pauvre, ce qui est la dernière chose à
   montrer à quelqu'un qui n'a pas encore compris à quoi sert la monnaie. */
.obj[disabled]{opacity:.42;cursor:default}
.obj .deja{flex:none;font-size:9px;letter-spacing:.12em;font-family:var(--banner);
  border:1px solid currentColor;border-radius:20px;padding:2px 7px;opacity:.6}
.rar{font-size:9px;letter-spacing:.1em;font-family:var(--banner);opacity:.75}
.rar.commune{color:#C2CAD6}.rar.rare{color:#5FA8FF}
.rar.epique{color:#B98CFF}.rar.legendaire{color:var(--projo)}

.avoir{display:flex;gap:8px;align-items:center;margin:2px 0 4px;font-size:13px}
.avoir span{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;
  background:rgba(0,0,0,.3);border:1px solid rgba(242,238,228,.12);
  font-weight:700;font-variant-numeric:tabular-nums}
.avoir i{width:14px;height:14px;flex:none;font-style:normal;border-radius:3px}
.avoir .e{background:repeating-linear-gradient(45deg,var(--projo) 0 4px,var(--craie) 4px 8px)}
.avoir .p{border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#FFB9AC,var(--flare) 55%,#8E1D12)}

.mot{margin:14px 0 0;padding:11px 13px;border-radius:10px;font-size:11.5px;
  line-height:1.55;background:rgba(0,0,0,.28);border:1px solid rgba(242,238,228,.1);
  opacity:.72}
.mot b{color:var(--projo)}

.err{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;
  background:rgba(224,64,44,.16);border:1px solid rgba(224,64,44,.4);display:none}
.err.on{display:block}
.ok{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;
  background:rgba(30,158,106,.16);border:1px solid rgba(30,158,106,.4);display:none}
.ok.on{display:block}
</style>
</head>
<body>
<main id="app">
  <h1 class="tbf-titre">LA BOUTIQUE</h1>

  <div class="avoir" id="avoir" hidden>
    <span><i class="b"></i><b id="avBil">0</b></span>
    <span><i class="e"></i><b id="avEch">0</b></span>
    <span><i class="p"></i><b id="avPack">0</b></span>
  </div>

  <div class="ok" id="ok"></div>
  <div class="err" id="err"></div>

  <div id="etal"></div>
  <div id="rayons"></div>

  <p class="mot" id="mot"></p>
</main>

<script src="/menu.js"></script>
<script src="/nav.js"></script>
<script>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const dire = (id, texte) => { const e = $(id); e.textContent = texte; e.className = e.className.replace(' on', '') + ' on'; };

/* Le retour de Stripe. Il dit seulement que le joueur est revenu — **pas** que
   la commande est livrée. La livraison se fait dans le webhook, sur le
   serveur, et elle peut arriver une seconde après ou une minute après. On dit
   donc « c'est payé, ça arrive », et jamais « voilà vos boosters » : promettre
   une chose qu'on n'a pas encore faite est le plus sûr moyen d'être accusé de
   ne pas l'avoir faite. */
{
  const p = new URLSearchParams(location.search);
  if (p.get('paye')) dire('ok', 'Paiement reçu. Ta commande arrive — recharge dans un instant si elle tarde.');
  if (p.get('annule')) dire('err', 'Paiement annulé. Rien n’a été débité.');
  if (p.has('paye') || p.has('annule')) history.replaceState(null, '', '/boutique');
}

let ouvert = false;

async function monter() {
  const rep = await fetch('/api/boutique/catalogue').then((r) => r.json()).catch(() => null);
  if (!rep) { dire('err', 'La boutique est injoignable pour le moment.'); return; }
  ouvert = rep.ouvert;

  $('rayons').innerHTML = (rep.rayons ?? []).map((r) => {
    const dedans = rep.articles.filter((a) => a.rayon === r.id);
    if (!dedans.length) return '';
    return `<section class="rayon"><h2>${esc(r.nom)}</h2><p>${esc(r.texte)}</p>
      <div class="etal">${dedans.map((a) => `
        <button class="art" data-art="${esc(a.id)}" ${ouvert ? '' : 'disabled'}>
          ${a.marque ? `<span class="marque">${esc(a.marque)}</span>` : ''}
          <b>${esc(a.nom)}</b>
          <small>${esc(a.texte)}</small>
          <span class="prix">${esc(a.prixTexte)}</span>
        </button>`).join('')}</div></section>`;
  }).join('');

  $('mot').innerHTML = (ouvert
    ? 'Les paiements passent par <b>Stripe</b>. Nous ne voyons jamais ton numéro de carte.'
    : 'La boutique est en <b>vitrine</b> : les paiements ne sont pas encore branchés.')
    + '<br>L’argent réel n’achète que des <b>billets</b>. Les boosters, eux, se '
    + 'gagnent : à la recharge, ou contre des écharpes gagnées en poussant.';

  /* Ce qu'on possède déjà. Facultatif : un visiteur non connecté voit les prix
     sans voir un solde qui n'existe pas. */
  try {
    const w = await fetch('/api/fanzzy/state', { credentials: 'same-origin' })
      .then((r) => (r.ok ? r.json() : null));
    if (w?.wallet) {
      $('avBil').textContent = w.wallet.billets ?? 0;
      $('avEch').textContent = w.wallet.scarves ?? 0;
      $('avPack').textContent = w.wallet.packs ?? 0;
      $('avoir').hidden = false;
    }
  } catch { /* pas connecté : on montre la vitrine */ }

  await monterEtal();
}

/* --------------------------------------------------------------- l'étal

   Ce que les billets achètent. Rien n'y est tiré au sort : le joueur lit le
   nom, la phrase et le prix avant de toucher. C'est toute la différence avec
   ce que cette boutique vendait avant, où « une tenue » à 2,49 € était un
   tirage. */

let billets = 0;

const ligneObjet = (o, assez) => `<button class="obj" data-type="${esc(o.type)}"
  data-id="${esc(o.id)}" data-prix="${o.prix}" ${assez ? '' : 'disabled'}>
  <div class="txt"><b>${esc(o.nom)}</b>
    <small><span class="rar ${esc(o.rar)}">${esc((o.rar ?? '').toUpperCase())}</span>
      ${o.texte ? ' · ' + esc(o.texte) : ''}</small></div>
  ${o.possede ? '<span class="deja">DÉJÀ</span>' : ''}
  <span class="cout tbf-etiquette" data-ton="or"><i></i>${o.prix}</span>
</button>`;

async function monterEtal() {
  const d = await fetch('/api/boutique/etal', { credentials: 'same-origin' })
    .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // Pas connecté, ou l'étal est injoignable : la vitrine en euros reste
  // lisible, et on ne met pas d'erreur devant quelqu'un qui regarde.
  if (!d) { $('etal').innerHTML = ''; return; }

  billets = d.billets ?? 0;
  $('avBil').textContent = billets;

  const bloc = (titre, phrase, objets) => objets.length
    ? `<section class="rayon"><h2>${esc(titre)}</h2><p>${esc(phrase)}</p>
        <div class="objets">${objets.map((o) => ligneObjet(o, billets >= o.prix)).join('')}</div>
      </section>`
    : '';

  $('etal').innerHTML =
    bloc('ÉQUIPEMENT', 'Ce qu’on emporte dans la tribune. Choisis la pièce : rien n’est tiré au sort.',
      d.stuff ?? [])
    + bloc('TENUES', 'Habille un Fanzzy que tu as déjà. Tu choisis lequel, et à quel âge.',
      d.tenues ?? []);
}

$('etal').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-type]');
  if (!b || b.disabled) return;

  /* Une tenue se pose sur quelqu'un : sans le couple Fanzzy + âge, il n'y a
     rien à acheter. L'écran de la collection sait déjà présenter ce choix — on
     y envoie plutôt que d'en fabriquer une seconde version ici, qui finirait
     par proposer autre chose. */
  if (b.dataset.type === 'tenue') {
    location.href = '/fanzzy?ecran=dex&tenue=' + encodeURIComponent(b.dataset.id);
    return;
  }

  /* Une dépense se demande. Ici elle est définitive — les billets ne se
     remboursent pas — et les lignes de l'étal se touchent en faisant défiler.
     Le prix est répété dans la boîte : c'est ce qu'on regarde, et c'est ce
     qu'on aurait dû relire avant de toucher. */
  const prix = Number(b.dataset.prix) || 0;
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: `ACHETER ${(b.querySelector('b')?.textContent ?? '').toUpperCase()} ?`,
    texte: `${prix} billet${prix > 1 ? 's' : ''} seront débités. Les billets ne se `
      + 'remboursent pas.',
    oui: 'ACHETER', sousOui: `${prix} billet${prix > 1 ? 's' : ''}`, ton: 'or',
  }))) return;

  b.disabled = true;
  try {
    const r = await fetch('/api/boutique/depenser', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: b.dataset.type, id: b.dataset.id }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { dire('err', MESSAGES[j.error] ?? 'Achat impossible.'); b.disabled = false; return; }
    dire('ok', 'C’est à toi. Tu le retrouves dans ton deck.');
    billets = j.billets ?? billets;
    $('avBil').textContent = billets;
    await monterEtal();
  } catch {
    dire('err', 'Le serveur n’a pas répondu. Rien n’a été débité.');
    b.disabled = false;
  }
});

/* Les refus, en français. Un code d'erreur sous les yeux d'un joueur est un
   aveu qu'on n'a pas prévu son cas. */
const MESSAGES = {
  'boutique.error.billets_insuffisants': 'Il te manque des billets.',
  'boutique.error.objet_inconnu': 'Cet objet n’est plus en vente.',
  'boutique.error.tenue_inconnue': 'Cette tenue n’est plus en vente.',
  'boutique.error.fanzzy_non_possede': 'Tu ne possèdes pas ce Fanzzy à cet âge.',
  'boutique.error.tenue_deja_posee': 'Ce Fanzzy porte déjà cette tenue.',
  'auth.error.unauthenticated': 'Connecte-toi pour acheter.',
};

$('rayons').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-art]');
  if (!b || !ouvert || b.disabled) return;

  /* De l'argent réel. La confirmation ne remplace pas l'écran de paiement — on
     part chez Stripe juste après — mais elle évite d'y partir par accident, et
     surtout elle laisse une dernière occasion de lire le prix sur la même page
     que le reste de la boutique. */
  if (!(await window.TBF_DIALOGUE?.confirmer({
    titre: `PASSER COMMANDE ?`,
    texte: `${b.querySelector('b')?.textContent ?? 'Cet article'} — `
      + `${b.querySelector('.prix')?.textContent ?? ''}. Tu seras conduit chez Stripe `
      + 'pour payer. Rien n’est débité avant.',
    oui: 'CONTINUER', sousOui: b.querySelector('.prix')?.textContent ?? '', ton: 'or',
  }))) return;

  b.disabled = true;
  try {
    const r = await fetch('/api/boutique/commander', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      /* On n'envoie **que** l'identifiant. Pas de prix, pas de quantité : le
         serveur les décide, et c'est ce qui empêche d'acheter douze boosters
         à un centime en modifiant cette ligne. */
      body: JSON.stringify({ article: b.dataset.art }),
    });
    const j = await r.json();
    if (r.status === 401) { location.href = '/compte'; return; }
    if (!r.ok || !j.url) { dire('err', 'Commande impossible pour le moment.'); b.disabled = false; return; }
    location.href = j.url;
  } catch {
    dire('err', 'Commande impossible pour le moment.');
    b.disabled = false;
  }
});

monter();
</script>
</body>
</html>
