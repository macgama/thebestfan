<style>
/* Le kiosque, et la cérémonie d'ouverture.

   Ils vivaient dans la page des Fanzzy, entre le classeur et le personnage
   équipé. Ce n'était pas la même chose : on va au classeur pour **regarder ce
   qu'on a**, on vient ici pour **en avoir plus**. Deux intentions, deux
   écrans.

   **Lot 3 de la refonte FAIT MAIN (octobre 2026).** Le kiosque devient un
   étal sous les projecteurs : la réserve en fentes de sachets sous la barre,
   la banderole de la saison, le sachet choisi sur son socle dans la fumée de
   sa couleur, la minuterie devenue un objet, les séries fermées en rail sous
   scotch. L'ouverture compte ses cartes en dos qui se vident et révèle chaque
   carte par l'échelle commune de cérémonie (`FX.reveler`, dans fx.js) ; le
   butin se colle sur une page d'album. **Toutes les pièces sont des briques
   de `ui.css`** (lots 3 et 5, « les pièces des lots 3 et 5 ») : cette feuille
   ne leur écrit que leur place et leur taille, jamais leur dessin. La
   déchirure, elle, n'a pas bougé d'un caractère. */

/* ------------------------------------------------------------ la réserve

   La planche `.tbf-reserve` : les boosters du joueur à gauche, ses écharpes
   à droite. Collée sous la barre, d'un bord à l'autre de l'écran
   (`.tbf-pleine-largeur`), hors de tout ce que la page réécrit, et relue à
   chaque `tbf:bourse`.

   **Sans avatar.** La direction l'y pose ; la barre du haut porte déjà le
   même sticker, avec le même anneau d'XP, cinquante pixels plus haut (le HUD
   replié de `nav.js`, sur tous les écrans). Le même visage deux fois l'un
   sous l'autre ne dit rien de plus, et prend la place du solde à 360 px.

   **Les boosters sont la brique commune** (lot 4, « la réserve de boosters,
   une seule brique », dans ui.css) : un compteur de monnaie craie qui porte
   ses sachets — le même objet qu'à la boutique et dans la bande du HUD. Le
   kiosque les dessinait à sa façon, à même la planche : des fentes, un
   anneau et un PROCHAIN posés côte à côte, et un compte en sticker
   rectangulaire collé au bas du sachet. Trois dessins du même stock se
   lisaient comme trois choses. La page n'écrit plus ici que la marge de la
   planche : la brique a son dessin, et le premier sticker de la planche se
   range seul à gauche.

   Ce qu'il dit n'a pas changé : une place par sachet quand le plafond de ce
   joueur est servi et tient en cinq (`reserveHTML`, dans cartes.js), sinon
   le sachet seul et son compte ; l'anneau de la recharge en cours et
   PROCHAIN avec son temps, tant qu'un booster est en route ; le compte en
   chiffres, toujours. Au kiosque, il ne mène nulle part (on y est) : un
   `div` sans « + ». */
#reserve{margin-bottom:8px}

/* Les séries ouvertes, en pastilles. Seules celles qu'on peut ouvrir y
   figurent : les autres se disent plus bas, dans leur rail.

   Ce sont des plaques (`.tbf-plaque`) : béton au repos, **l'or du kiosque
   sur celle qui est choisie** — comme l'onglet actif d'un rail ; c'est ici
   qu'on achète, l'or y reste (arbitrage du 2 octobre 2026).

   **Un rail qui défile, et non des rangées qui s'empilent.** En production
   une seule série est ouverte, et la rangée ne se montre pas ; la base de
   test les ouvre toutes les treize, et treize pastilles repliées sur quatre
   lignes poussaient le sachet et le bouton OUVRIR sous le bas de l'écran. La
   rangée défile donc de côté, la série choisie ramenée au milieu, et elle
   reprend la gouttière pour aller d'un bord à l'autre. Le rembourrage du bas
   garde l'ombre dure des bâches : un défilement rogne aussi ce qui dépasse
   en hauteur. */
.series{display:flex;gap:8px;overflow-x:auto;position:relative;
  margin:2px calc(-1 * var(--gouttiere)) 0;padding:4px var(--gouttiere) 12px;
  scroll-snap-type:x proximity;scrollbar-width:none}
.series::-webkit-scrollbar{display:none}
/* Centrées tant qu'elles tiennent, alignées au bord dès qu'elles défilent :
   des marges automatiques, et non `justify-content:center`, qui rognerait
   la première pastille d'un rail plus large que l'écran. */
.series>:first-child{margin-left:auto}
.series>:last-child{margin-right:auto}
/* Quarante-quatre pixels : la pulpe d'un doigt, et le minimum des deux
   plateformes. */
.series button{flex:none;scroll-snap-align:center;font-size:11.5px;letter-spacing:.1em;
  padding:5px 14px;min-height:44px}

/* La banderole de la saison : une bâche craie de travers, tenue par deux
   scotchs, l'écharpe en tête, et le compte de ce qu'on a collecté dans la
   saison en sticker au coin. Ce n'est pas une brique (voir BRIQUES.md,
   « les projecteurs, le socle ») : la composition d'un cadre craie, de deux
   scotchs et d'un sticker, dont la page écrit la place.

   Elle remplace l'annonce de la saison, qui disait la même chose en bas de
   page, une seule fois : la banderole est toujours là, et le texte de
   l'annonce s'y pose tant que le joueur ne l'a pas fermé. Les jours qui
   restent ne s'écrivent que si le serveur les compte (`joursRestants`).

   Son sticker pend sous elle, sur le haut de la scène : il y mord sur les
   cônes de lumière, au-dessus du sachet, et ne réserve pas de rangée à lui —
   chaque pixel pris ici descend le bouton OUVRIR, qui doit tenir dans un
   écran de 640. Son fond de craie est le sien : la lumière dessous ne touche
   pas la lettre. */
.kq-saison{display:block;margin:10px 8px 14px;padding:19px 14px 14px;rotate:-1.5deg;
  --e2:var(--craie);
  font-family:var(--banner);font-weight:700;font-size:17px;line-height:1.15;
  letter-spacing:.1em;text-transform:uppercase}
.kq-saison.avec-x>b{padding-right:30px}
.kq-saison>b{display:block;font-weight:700}
.kq-saison>small{display:block;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.1em}
.kq-saison>p{margin:8px 0 2px;font-family:var(--ui);font-weight:500;font-size:13px;line-height:1.45;
  letter-spacing:0;text-transform:none}
.kq-saison>.saison-x{position:absolute;z-index:2;top:8px;right:2px;width:44px;height:44px;
  display:grid;place-items:center;padding:0;border:0;background:none;color:inherit;
  font-size:15px;line-height:1;cursor:pointer}
.kq-saison>.saison-x:focus-visible{outline:3px solid var(--projo);outline-offset:-3px}
.kq-saison>.tbf-sticker{position:absolute;z-index:3;right:-6px;bottom:-20px;--rot:4deg}

/* ------------------------------------------------------------ la scène

   Le sachet choisi sur son socle de béton, sous deux cônes de projecteur,
   dans la fumée de la couleur de sa série ; son nom en sticker collé dessous.
   Trois sachets au plus : celui du milieu, et un de chaque côté, éteints.

   La scène reprend la gouttière : les sachets de côté vont jusqu'au bord de
   l'écran. Les calques, du fond vers l'avant : les projecteurs et la fumée
   (1), le socle (2), le carrousel (3), le sticker du nom (4).

   **Le sachet ne flotte plus** : il est posé. Le flottement faisait aussi la
   troisième animation sans fin de l'écran, avec le reflet et la fumée — et
   la minuterie prête en demande une quand elle pulse. */
.kscene{position:relative;height:252px;margin:0 calc(-1 * var(--gouttiere));overflow-x:clip}
.kscene>.tbf-socle{position:absolute;z-index:2;left:50%;top:194px;translate:-50% 0;width:168px}
.kscene>.tbf-fumee{bottom:18px}

/* `overflow-x: clip` et non `hidden` : `clip` rogne sans fabriquer un
   conteneur défilable, donc aucune barre parasite ne s'ajoute. Sans lui, les
   cartes latérales du carrousel sortent du cadre et **emportent le document
   avec elles** : mille treize pixels de large sur un écran de trois cent
   soixante, et toute la page se met à glisser horizontalement. Rien ne casse,
   la page devient simplement pénible — et on ne le voit jamais depuis un
   écran large. */
.carousel{position:absolute;inset:0;z-index:3;perspective:1100px;touch-action:pan-y;overflow-x:clip}
.slide{position:absolute;left:50%;top:6px;width:124px;aspect-ratio:.62;margin:0;cursor:grab;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,.9,.28,1),opacity .45s,filter .45s;
  border-radius:9px;overflow:hidden;border:1px solid rgba(0,0,0,.6);
  box-shadow:0 18px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide svg{width:100%;height:100%;display:block}
.slide .foil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.42) 46%,
    rgba(180,225,255,.28) 52%,transparent 66%);
  background-size:260% 260%;background-position:120% 0;mix-blend-mode:screen}
.slide.center .foil{animation:foil 4.5s ease-in-out infinite}
@keyframes foil{0%{background-position:130% 0}55%{background-position:-40% 0}100%{background-position:-40% 0}}
.slide.side{filter:brightness(.42) saturate(.65)}
.slide.hidden{opacity:0;pointer-events:none}
/* Le nom de la série, en sticker collé sous le sachet, à cheval sur le pied
   du socle. Son fond de craie est le sien : la fumée qui passe dessous ne
   touche pas la lettre. */
#setLine{position:absolute;z-index:4;left:50%;bottom:2px;translate:-50% 0;max-width:calc(100% - 24px)}
#setLine b{font-weight:700}

/* Un écran plus large : le sachet grandit avec la scène, le socle avec lui. */
@media (min-width:600px){
  .kscene{height:300px}
  .slide{width:150px}
  .kscene>.tbf-socle{top:236px;width:196px}
}

/* **La scène se resserre quand le bouton OUVRIR n'a plus la place.**

   Trois rangées peuvent s'ajouter entre la barre et lui : le rail des
   séries (la base de test les ouvre toutes les treize), le texte de la
   saison tant qu'il n'a pas été lu, et la minuterie quand la réserve est
   vide. Une seule, et tout tient dans 640 pixels de haut ; deux, et la
   bâche passait sous le bas de l'écran — en production même, le jour où
   une saison commence et que la réserve est vide. La page compte ces
   rangées (`data-rangees`, voir `rangerLaScene`), et sur un écran court la
   scène se resserre : deux rangées, le sachet passe de 124 à 96 pixels de
   large (la scène perd 48 pixels) ; trois, à 84, et le texte de la saison
   attend un écran où il tient — il reste à lire, et sa croix ne ferme rien
   qu'on n'ait vu. Le socle et les flèches suivent le sachet. Mesuré au
   banc à 360 × 640, avec les treize séries de la base de test. */
@media (max-height:719px){
  #s-kiosque[data-rangees="2"] .kscene{height:204px}
  #s-kiosque[data-rangees="2"] .slide{width:96px}
  #s-kiosque[data-rangees="2"] .kscene>.tbf-socle{top:149px;width:136px}
  #s-kiosque[data-rangees="2"] .kscene>.tbf-plaque--rond{top:61px}
  #s-kiosque[data-rangees="3"] .kscene{height:182px}
  #s-kiosque[data-rangees="3"] .slide{width:84px}
  #s-kiosque[data-rangees="3"] .kscene>.tbf-socle{top:129px;width:120px}
  #s-kiosque[data-rangees="3"] .kscene>.tbf-plaque--rond{top:51px}
  #s-kiosque[data-rangees="3"] :is(#saisonTxt,#saisonVu){display:none}
}
/* Un écran plus court encore (320 × 568) : une rangée suffit à pousser la
   bâche dehors. La scène prend le resserrement le plus fort dès la
   première, et le texte de la saison attend dès la deuxième. */
@media (max-height:599px){
  #s-kiosque:is([data-rangees="1"],[data-rangees="2"],[data-rangees="3"]) .kscene{height:182px}
  #s-kiosque:is([data-rangees="1"],[data-rangees="2"],[data-rangees="3"]) .slide{width:84px}
  #s-kiosque:is([data-rangees="1"],[data-rangees="2"],[data-rangees="3"]) .kscene>.tbf-socle{top:129px;width:120px}
  #s-kiosque:is([data-rangees="1"],[data-rangees="2"],[data-rangees="3"]) .kscene>.tbf-plaque--rond{top:51px}
  #s-kiosque:is([data-rangees="2"],[data-rangees="3"]) :is(#saisonTxt,#saisonVu){display:none}
}

/* Une série verrouillée se regarde sans se toucher : le paquet s'éteint, mais
   il reste visible. C'est ce qui donne envie d'y arriver. */
.carousel.verrou .slide.center{filter:grayscale(.85) brightness(.5)}
.carousel.verrou .slide.center .foil{display:none}

/* **Les flèches sont dans la scène**, sur les sachets de côté — les plaques
   rondes du lot 2 (`.tbf-plaque--rond`). Elles avaient leur rangée sous le
   carrousel, avec un point par paquet et une consigne en dessous : deux
   rangées de plus entre le sachet et le bouton OUVRIR, qui passait sous le
   bas d'un écran de 640 dès que la saison avait quelque chose à dire. Trois
   paquets se comptent sans points, et le sachet du milieu, sur son socle, se
   touche comme le bouton qui l'ouvre. */
.kscene>.tbf-plaque--rond{position:absolute;z-index:5;top:80px}
#prevSet{left:8px}
#nextSet{right:8px}
/* Plus large, elles suivent les sachets de côté au lieu de partir aux bords. */
@media (min-width:600px){
  .kscene>.tbf-plaque--rond{top:104px}
  #prevSet{left:calc(50% - 292px)}
  #nextSet{right:calc(50% - 292px)}
}

/* La minuterie et l'achat immédiat : deux bâches côte à côte (la brique
   `.tbf-minuterie`), au lieu d'une ligne de texte sous le bouton. La page
   n'écrit que leur rangée. **Seulement quand la réserve est vide** : tant
   qu'il reste un booster gratuit, le serveur le consomme et ne prélève rien
   — proposer d'acheter ferait croire à un choix qui n'existe pas, et le
   prochain booster se lit déjà dans la réserve, juste sous la barre. */
/* **À parts égales, mais jamais sous ce que chacune porte.** Les deux
   bâches partent de zéro et se partagent la rangée (`flex: 1 1 0`) ; aucune
   ne descend sous sa largeur la plus étroite, parce que `min-width` reste
   `auto`. Pour l'achat, c'est toute sa largeur : « +1 BOOSTER » ne se coupe
   pas (la brique le tient sur une ligne) et le sticker de prix non plus —
   la moitié ne lui suffit pas sur un téléphone, il prend ce qu'il lui faut
   et la minuterie le reste. La minuterie, elle, sait replier « PRÊT DANS »
   sur deux lignes : c'est elle qui cède, jusqu'à son plus long mot ou son
   compte. Quand même cela ne tient pas — à 320 px, un compte de dix heures
   et plus, ou un prix à trois chiffres à côté de « 1 h 02 » ou de « PRÊT »
   —, l'achat passe sous la minuterie, sur toute la rangée (`flex-wrap`), au
   lieu de se faire mordre. Avec la cadence et le prix par défaut (dix
   minutes, 45), la rangée ne se coupe jamais.

   Avant, un `min-width: 0` laissait l'achat descendre sous son contenu : à
   parts égales, il repliait « TOUT DE SUITE » et son prix mordait « +1
   BOOSTER » ; à la largeur de leur contenu, les deux rétrécissaient au
   prorata, et à 320 px le mot dépassait encore de onze pixels, le prix posé
   sur son R. Seule, la minuterie prend toute la rangée. */
.minut{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 0}
.minut>*{flex:1 1 0}

/* Ouvrir un booster : l'action principale de l'écran, la bâche grande
   (`.tbf-grande`), en flare — le rouge d'un acte de jeu. Quatorze pixels au
   moins au-dessus d'elle : ses deux scotchs montent de sept, et une bâche
   posée juste au-dessus garde sept pixels d'ombre.

   **Il dit ce qu'il reste** : sous « OUVRIR LE BOOSTER », le nombre en
   réserve, comme le sous-libellé de la bâche principale de l'accueil — la
   craie pleine et non à 88 %, pour la même raison qu'elle (sur la face rouge
   foncée, 88 % tombe sous 4,5:1 à douze pixels). */
.cta{flex-direction:column;gap:2px;min-height:60px;margin:18px 0 10px;padding:13px 18px 9px;
  font-size:20px;line-height:1;letter-spacing:.06em}
.cta small{display:block;font-family:var(--banner);font-weight:500;font-size:12px;line-height:14px;
  letter-spacing:.04em;text-transform:none;text-shadow:0 1px 0 var(--encre)}

/* Les séries fermées, en rail : leurs sachets en gris sous un scotch en
   croix. **Un seul rail, une seule croix.** Il y en avait un par raison,
   chacun sous sa grande croix : un sachet seul, entièrement caché, sous
   « SAISON 2 » — on ne savait pas quelle série ouvrirait —, puis onze
   sachets de vingt-huit pixels tassés en une pellicule illisible sous
   « FERMÉE ». Deux X géants pour dire « pas encore ».

   Les sachets ont maintenant la taille d'un sachet (40 × 62), espacés, et
   le rail défile de côté. **La série annoncée vient en premier**, avec son
   nom et sa saison en étiquette (« LES HÉROS DU CANAPÉ · SAISON 2 ») : il
   est connu dès qu'elle est annoncée (`sets[].prochaine`). Les autres n'ont
   pas de sticker : « 12 SÉRIES ATTENDENT UNE SAISON » le dit pour elles, et
   on n'annonce jamais une date qu'on n'a pas. Leur nom reste à l'écoute
   (`aria-label` de chaque sachet). Sur un panneau (`.pan`) : rien ne
   s'écrit à même la photo de la tribune. */
.fermees{margin:16px 0 8px;padding:12px 0 6px}
.fermees-lab{margin:0 12px;font-family:var(--banner);font-weight:600;font-size:11px;line-height:1.3;
  letter-spacing:.1em;text-transform:uppercase;text-align:center}
/* L'étiquette de la série annoncée, au-dessus du rail, collée sur le coin
   de son sachet (le premier). Un nom long (« LA GASTRONOMIE DE COMPTOIR ·
   SAISON 2 ») passe sur deux lignes plutôt que de sortir du panneau à
   320 px. */
.fermees-annonce{display:flex;margin:12px 12px -6px;position:relative;z-index:6}
.fermees-annonce>.tbf-sticker{--rot:-2deg;max-width:100%;height:auto;min-height:24px;padding:4px 7px;
  white-space:normal;line-height:1.15}
/* Le rail défile ; la croix, elle, est posée sur sa fenêtre et ne défile
   pas avec lui — une seule, au milieu, sur la largeur de trois sachets. Le
   rembourrage garde l'air des ombres, qu'un défilement rogne. */
.fermees-rail{position:relative;margin-top:8px}
.fermees-rang{display:flex;gap:12px;overflow-x:auto;padding:10px 12px 12px;
  scroll-snap-type:x proximity;scroll-padding-inline:12px;scrollbar-width:none}
.fermees-rang::-webkit-scrollbar{display:none}
.fermees-rang>:first-child{margin-left:auto}
.fermees-rang>:last-child{margin-right:auto}
.fermees-rang:focus-visible{outline:3px solid var(--projo);outline-offset:-3px}
.fermees-s{position:relative;flex:none;width:40px;height:62px;border-radius:4px;overflow:hidden;
  scroll-snap-align:start;background:var(--encre) center/cover no-repeat;filter:grayscale(1) brightness(.6);
  box-shadow:0 0 0 1.5px rgba(242,238,228,.4),2px 2px 5px rgba(7,9,12,.55)}
/* La série annoncée garde un peu de sa lumière : c'est la prochaine. */
.fermees-s[data-annoncee]{filter:grayscale(.6) brightness(.8)}
.fermees-rail>.tbf-scotch--croix{left:50%;right:auto;width:min(156px,60%);translate:-50% 0;
  top:4px;bottom:6px;pointer-events:none;z-index:4}

/* --------------------------------------------------- geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Une seule intention, un seul mouvement, et l'endroit
   où saisir se voit — la ligne dentelée est dessinée sur le paquet avant même
   qu'on y touche.

   `--p` porte l'avancée de la déchirure, de 0 à 1. Tout en découle : la bande
   qui s'en va, l'ouverture qui se creuse, la lueur qui monte. Déclarée en
   `@property` pour qu'elle s'anime — c'est ce qui fait le retour élastique
   quand on lâche trop tôt. Là où `@property` manque, la bande revient d'un
   coup au lieu de glisser : moins joli, tout aussi juste. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

.tearzone{position:absolute;inset:0;z-index:24;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(5,7,10,.94)}
.tearzone.on{display:flex}

/* « Plus tard » est la sortie du plein écran : elle se lit et se touche. Elle
   était à 45 %, sur trente-trois pixels de haut. Un lien de texte et non une
   plaque — c'est une issue, pas une action. */
.tearquit{position:absolute;top:14px;right:14px;background:none;border:0;color:inherit;
  font-size:12px;letter-spacing:.14em;opacity:.88;cursor:pointer;padding:8px 12px;
  min-height:44px;text-decoration:underline;text-underline-offset:3px}
.tearquit:hover,.tearquit:focus-visible{opacity:1}

/* `--bande` : où passe la déchirure, en hauteur de vignette. Elle ne vaut pas
   zéro parce que le dessin d’un booster laisse une marge sombre au-dessus du
   sachet : réglée trop haut, la bande s’arrachait dans le vide, au-dessus du
   paquet représenté. */
.tearpack{--p:0;--bande:20%;width:210px;aspect-ratio:.62;position:relative;border-radius:12px;
  overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.7);touch-action:none;cursor:grab;
  border:0;padding:0;background:none;display:block;transition:--p .32s cubic-bezier(.3,1.4,.5,1)}
.tearpack.tire{transition:none;cursor:grabbing}
.tearpack:focus-visible{outline:2px solid var(--projo);outline-offset:4px}
.tearpack .art{position:absolute;inset:0}
.tearpack img,.tearpack svg{width:100%;height:100%;object-fit:cover;display:block}

/* L'intérieur du sachet : ce qu'on découvre à mesure que la bande s'en va. */
.tearpack .maw{position:absolute;left:0;right:0;top:0;height:var(--bande);
  background:radial-gradient(120% 160% at 50% 0,rgba(255,238,190,calc(.55 * var(--p))),
    rgba(5,7,10,.96) 62%);
  -webkit-mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%;
          mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%}

/* La bande elle-même. Une copie du paquet, rognée à sa hauteur : elle montre
   donc exactement le haut du dessin, quel qu'il soit — photo ou SVG de repli. */
.tearpack .lip{position:absolute;left:0;right:0;top:0;height:var(--bande);overflow:hidden;
  clip-path:inset(0 0 0 calc(var(--p) * 100%));
  transform:rotate(calc(var(--p) * 5deg)) translateY(calc(var(--p) * -6px));
  transform-origin:100% 100%}
.tearpack .lip > *{position:absolute;top:0;left:0;width:100%;height:666.7%}

/* La ligne dentelée : l'affordance. Elle dit où saisir avant qu'on ait lu la
   consigne, et elle s'efface à mesure que la déchirure la mange. */
.tearpack .seam{position:absolute;left:0;right:0;top:var(--bande);height:2px;
  background:repeating-linear-gradient(90deg,rgba(245,195,59,.9) 0 5px,transparent 5px 10px);
  opacity:calc(1 - var(--p));filter:drop-shadow(0 0 3px rgba(245,195,59,.5))}

/* La languette qu'on saisit, à droite de la ligne : c'est là que part le geste. */
.tearpack .grip{position:absolute;right:6px;top:calc(var(--bande) - 15px);width:26px;height:26px;
  border-radius:50%;background:rgba(245,195,59,.92);box-shadow:0 2px 10px rgba(0,0,0,.6);
  opacity:calc(1 - var(--p));animation:tirette 1.9s ease-in-out infinite;pointer-events:none}
.tearpack .grip::after{content:"";position:absolute;inset:7px;border-left:2px solid #05070A;
  border-bottom:2px solid #05070A;transform:rotate(45deg) translate(1px,-1px)}
@keyframes tirette{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}

.tearlbl{margin-top:20px;font-family:var(--banner);font-size:14px;letter-spacing:.2em;
  text-align:center;line-height:1.6;max-width:280px}
/* Le geste à faire, en gras et en craie. Il était en or, à 14 px : du petit
   texte, et l'or ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026).
   La languette dorée, juste au-dessus, garde l'or — c'est une face. */
.tearlbl b{font-weight:700}
.tearlbl small{display:block;font-family:var(--ui);font-size:11.5px;letter-spacing:.06em;
  opacity:.88;margin-top:8px}

/* **La déchirure passe devant la barre**, et c'est tout ce qui la touche
   ici : son geste, son dessin et ses règles, juste au-dessus, sont ceux
   d'avant. Elle est à 24 dans la colonne (`#app`), et le HUD de la barre,
   arrivé au lot 2, à 30 : son sticker se posait sur « Plus tard », la sortie
   du plein écran. Trente-deux, au-dessus de l'écran d'ouverture (31), qui ne
   paraît qu'une fois elle refermée. */
#tearzone{z-index:32}
.flash{position:absolute;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.stage{display:flex;flex-direction:column;position:relative}

/* Le mot d accueil, quand on arrive ici parce qu on a des boosters qui
   attendent. Il est en haut et il est bref : sa seule tâche est de dire
   pourquoi on est là plutôt que sur l accueil. Et il est mince : il vient
   s ajouter au-dessus du paquet précisément quand le bouton OUVRIR est ce
   qu on est venu toucher, et ce bouton doit rester dans l écran.

   Le cadre garde son or, le mot passe à la craie : quatorze pixels, c'est du
   petit texte, et l'or ne s'écrit plus qu'en grand (arbitrage du 2 octobre
   2026). L'accent tient à la graisse — et au cadre, qui le portait déjà. */
.annonce{margin:0 2px 6px;padding:8px 14px;border-radius:10px;
  background:linear-gradient(150deg,rgba(245,195,59,.2),rgba(245,195,59,.07)),var(--panneau);
  border:1px solid rgba(245,195,59,.42);color:var(--craie);font-weight:600;
  font-family:var(--banner);font-size:14px;letter-spacing:.05em;text-align:center}
/* ---------------------------------------------------------- ouverture

   Elle vivait dans la page des Fanzzy, où son balisage n’est plus. Ici, il
   n’y avait **aucune règle** : or la première est `display:none`. Le panneau
   de révélation était donc affiché en permanence et sans mise en page, sous
   le kiosque — le « 1 / 5 — Fermer » qui traînait en bas de l’écran.

   Troisième fois que cette faute se produit : du balisage qu’on déplace, une
   feuille qu’on oublie. Rien ne lève, et le symptôme ne dit pas sa cause. */
/* **Trente et un, au-dessus de la barre.** Il était à 22 ; depuis le lot 2,
   le HUD de la barre (`.tbf-hud`, l'avatar et sa bande) est posé à 30 dans
   la même colonne (`#app`, un contexte d'empilement), et son sticker se
   collait par-dessus FERMER, en plein écran d'ouverture. Rien sur le corps
   du document n'est touché : la cérémonie (96), la pile (93), la fête (170)
   et le tiroir (49) restent au-dessus de toute la colonne. */
#opener{position:fixed;inset:0;z-index:31;display:none;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 20%,#1D242D,#05070A 70%);
  height:100vh;height:100dvh;
  padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
#opener.on{display:flex}
/* **Le fond est à l'écran, le paquet est dans sa colonne.**

   `inset: 0` est juste pour le fond — on ne doit pas voir le kiosque derrière
   ses propres cartes. Mais les enfants en héritaient : sur un écran de bureau
   de mille neuf cents pixels, le butin s'étalait sur toute la largeur et ses
   trois cartes du haut faisaient cinq cent cinquante pixels chacune. Des
   cartes à jouer de la taille d'une affiche, avec « 5 / 5 » collé à un bord
   et « Fermer » à l'autre, dix-huit cents pixels plus loin.

   C'est la règle de `.grand` dans le duel, et pour la faute exacte qu'elle y
   avait déjà corrigée — elle manquait ici.

   **Cinq cent soixante et non `--colonne`.** La colonne du jeu fait neuf
   cents pixels ; une carte sur trois y ferait encore deux cent cinquante,
   deux fois et demie sa taille sur un téléphone, où cette mise en page a été
   dessinée. Une seule largeur pour tout l'écran — la tête, le titre, le
   butin, le pied — parce qu'une cérémonie dont les quatre bandes ne sont pas
   alignées se lit comme quatre morceaux posés l'un sous l'autre.

   Les projecteurs, eux, couvrent tout l'écran : ce sont la lumière de la
   salle, pas une bande de la colonne. Ils ne vont qu'à la révélation — au
   butin, le titre et la page d'album passeraient dessous, et ils ne se
   posent jamais sous un texte. */
#opener > *{width:100%;max-width:min(var(--colonne), 560px);margin-inline:auto}
#opener > .tbf-projecteurs{max-width:none;margin:0}
/* La tête de la cérémonie. À la révélation : les cinq fentes de dos de carte,
   qui se vident une à une — elles remplacent le « 1 / 5 » —, et FERMER. Au
   butin : le compteur d'écharpes vers lequel volent les doublons (voir
   `crediterDoublons`), l'anneau d'XP si le serveur a compté l'XP, et FERMER.
   Le bas de la tête laisse dix pixels aux barres de rareté qui pendent sous
   les fentes. */
.ohead{position:relative;z-index:3;display:flex;align-items:center;gap:12px;
  min-height:68px;padding:10px 16px 14px}
.ohead>#oClose{margin-left:auto;min-height:44px;padding:10px 15px;font-size:13px}
.obourse{gap:7px;padding:6px 11px;font-size:15px}
.obourse img{width:20px;height:20px;flex:none;object-fit:contain}
#oNiv{cursor:default}
.ostage{flex:1;display:grid;place-items:center;position:relative;z-index:2;padding:30px 34px 0}
.reveal{width:min(70%,250px);position:absolute;transition:transform .42s cubic-bezier(.2,.8,.25,1),opacity .3s;cursor:pointer}
.reveal .flip{position:relative;width:100%;aspect-ratio:63/88;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.reveal.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4%}
/* Le dos porte le dessin de la série, posé bord à bord. Le dégradé et le
   triangle restent **dessous** : une série neuve dont le dos n'est pas encore
   dessiné s'ouvre quand même, avec l'ancien fond. */
.face.back{background:linear-gradient(160deg,#20262F,#0D1116) center/cover no-repeat;
  border:2px solid #39414E;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 18px 36px rgba(0,0,0,.6)}
.face.back.dessine>svg{display:none}
.face.front{transform:rotateY(180deg)}
/* **La rareté se colle sur la carte** à l'instant où elle se retourne : sa
   propre forme, au coin haut-droit (`cardHTML`, lot 4), avec son mot — voir
   `collerRarete`. La page en collait une seconde, identique, une trentaine
   de pixels au-dessus : « COMMUNE » sur « COMMUNE », pour chaque carte, et un
   texte de plus à lire au soleil. Le geste reste, l'objet est celui de la
   carte. Sans mouvement, la forme est simplement là quand la carte paraît :
   la rareté se lit toujours par la forme, la couleur et le mot.

   **« NOUVEAU » en tampon, sur la carte** : l'ouverture tamponne, le butin
   colle. Le tampon plein — fond craie, lettres rouge foncé —, parce qu'il se
   pose sur un dessin dont on ne connaît pas la couleur : la forme en contour
   n'y serait lisible qu'une fois sur deux. Seize pixels, sur le côté gauche
   de l'illustration, loin du nom et de l'âge de la carte. */
.reveal>.kq-nouveau{position:absolute;z-index:4;left:-10px;top:40%;font-size:16px}
.ofoot{position:relative;z-index:3;flex:none;padding:14px 16px 18px;display:flex;flex-direction:column;
  gap:10px;align-items:center}
/* La consigne de la révélation : Oswald 12 en craie pleine, espacée — elle se
   lit comme une indication de la salle, pas comme un bouton. */
.hint{font-family:var(--banner);font-weight:600;font-size:12px;line-height:1.3;letter-spacing:.18em;
  text-transform:uppercase;text-align:center}
/* « TOUT RÉVÉLER » : une bâche craie — une commande de la cérémonie, pas un
   achat ni un acte de jeu. Il ne reste ici que sa taille. */
#oAction{min-height:44px;padding:10px 18px;font-size:13px}

/* ------------------------------------------------------------- le butin

   Les cartes collées de travers sur une page d'album kraft (la brique
   `.tbf-ticket.tbf-album`), chacune sous son scotch, et la ligne vivante de
   la série dessous. La page d'album ne règle que ses marges ; la scène vidée
   se replie, et le butin prend la place — s'il ne tient pas (un écran court,
   une série en plus), il défile seul, la tête et les bâches du bas restent.

   **Ce qui est neuf** porte le sticker NOUVEAU sous la bande du nom, à
   cheval sur le coin bas-gauche, comme au classeur ; **ce qui a rapporté
   des écharpes** (un doublon, une poignée d'écharpes), son prix en sticker
   sur le flanc droit. Le coin haut-droit est celui de la forme de rareté,
   le coin haut-gauche celui du pin et de l'âge : la carte les porte
   elle-même (lot 4), la case n'y colle rien (voir plus bas). */
.summary{display:none;flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;z-index:2;
  padding:6px 14px 10px}
.summary.on{display:flex;flex-direction:column}
.tbf-album-pied>.tbf-tampon{grid-column:1/-1;justify-self:end;margin-top:2px}

/* **Le butin se lit d'un bloc** : le titre, la page d'album et les trois
   bâches de la fin, ensemble, au milieu de la hauteur. Seule la page
   d'album se centrait : sur une tablette, le titre restait collé en haut,
   les bâches en bas, et la page flottait entre sept cents pixels de noir —
   trois îlots, et la récompense avait l'air d'une vignette perdue. Des
   marges automatiques sur le premier et le dernier du bloc, et non un
   centrage : s'il déborde, elles tombent à zéro, et c'est la page d'album
   qui défile, le titre et les bâches restent. */
#opener.kq-butin>.butintitre{margin-top:auto}
#opener.kq-butin>.summary{flex:0 1 auto}
#opener.kq-butin>.ofoot{margin-bottom:auto}

/* **La forme de rareté est sur la carte** (lot 4 : `cardHTML` la pose au
   coin haut-droit, avec son mot, grille comprise). La case en collait une
   seconde, sans mot, au-dessus de ce coin : deux signes pour une rareté au
   même endroit. Elle est partie, et sa règle avec elle.

   **Ce que la case colle laisse le libellé net** (la règle du scotch,
   amendement 19), **et NOUVEAU laisse le visage** : on gagne une carte pour
   voir qui est dessus. Le haut de la carte est pris : au coin haut-gauche,
   son pin et son âge (« ÉVO 2 », en badge sous le pin sur une vignette) ;
   au coin haut-droit, sa forme et son mot (« LÉGENDAIRE » d'un bord à
   l'autre de la forme). Sur une carte de quatre-vingt-onze pixels (360 px
   d'écran), NOUVEAU y cachait l'âge ou la rareté de la carte qui compte le
   plus ; le prix d'une légendaire en doublon (« +45 ») en mangeait autant.
   Au-dessus de la carte, le scotch et NOUVEAU ne tiennent pas ensemble sur
   quatre-vingt-onze pixels.

   **NOUVEAU est où la brique le pend** (ui.css, « la page d'album ») : sous
   la bande du nom, à cheval sur le coin bas-gauche, comme au classeur et
   sur /collection. La page ne règle que sa taille, celle de la maquette
   pour une carte de grille (22 px, Oswald 12). Elle le collait sur le flanc
   gauche, à 40 % de la hauteur, là où l'ouverture le tamponne une seconde
   plus tôt, et sa règle pesait plus que celle de la brique : NOUVEAU
   tombait sur le visage de chaque carte neuve (vingt-deux à vingt-sept
   pixels de haut couverts, de 320 à 768 px, relevé au banc), quand le
   classeur pose le même sous sa carte. Pendu, son bord craie reste à deux
   pixels et demi au moins du pin de la carte du dessous et à sept et demi
   de la ligne vivante, de 320 à 768 px : l'air du ticket, dans la brique,
   est compté pour lui.

   **Le prix reste sur le flanc droit, à 40 %** (comme le « ×3 » d'un
   doublon de la maquette), rentré de deux pixels : seul son bord craie
   passe le bord de la carte. C'est la place que la brique donne au second
   sticker d'une case ; mais une case du butin ne porte jamais les deux (une
   carte neuve n'a rien rapporté : `estNeuve`, `rapporte`), et le prix, seul
   dans la sienne, y est le premier — sans cette règle, la brique le
   pendrait au coin bas-gauche, à la place de NOUVEAU. Au coin bas-droit,
   il rencontrerait le NOUVEAU de la case voisine dans les quatorze pixels
   de la gouttière. Sur une vignette de téléphone, il peut mordre le bord
   du visage : c'est un doublon, une carte qu'on a déjà vue. */
.summary .tbf-album-case>.tbf-sticker[data-ton=flare]{height:22px;padding:0 6px;font-size:12px}
.summary .tbf-album-case>.tbf-sticker.tbf-sticker--prix{left:auto;right:2px;top:40%;bottom:auto;
  --rot:5deg}

/* **Sur une tablette, des cartes de tablette.** À 768 px, la page d'album
   rangeait les cinq cartes sur une bande de quatre-vingt-quinze pixels de
   large — la taille d'un téléphone — au milieu de l'écran. Des colonnes de
   cent vingt au moins (trois par rangée), la case jusqu'à cent cinquante. */
@media (min-width:600px){
  .summary .tbf-album{--carte:120px}
  .summary .tbf-album-case{max-width:150px}
}

/* **Une carte qu'on ne lit pas ne bouge pas.** La carte de la révélation
   (`cardHTML` sans `mini`) respire et fait tourner sa matière — la dérive
   de l'épique, le liseré d'or de la légendaire —, sans fin : cinq cartes
   empilées face cachée en faisaient jusqu'à dix à la fois sur l'écran
   de l'ouverture, pour trois au plus. On les fige là où elles ne se
   regardent pas, de dos et écartées, par l'arrêt de la carte elle-même
   (`.fz-fige`, cartes.css) posé sur la `.reveal` ; la carte qu'on vient de
   retourner, elle, vit. La page d'album du butin porte le même arrêt — ses
   cartes sont des vignettes (`mini`), statiques, et `.tbf-album` les fige
   déjà. **Le figement de la page (`.kq-fige`) est parti** : ses règles
   pesaient moins que celles de la matière du lot 4, et l'épique dérivait
   encore face cachée. */

/* Le titre du butin. Il dit ce qu'on a eu avant qu'on ait compté.

   **C'est l'information qu'on vient chercher**, et elle était le plus petit
   texte de l'écran : treize pixels. « 2 NOUVELLES » en grand — Oswald 700
   à vingt et un pixels —, « SUR 5 » en petit à côté, sur la même ligne de
   base. En craie : l'or ne s'écrit plus en petit (arbitrage du 2 octobre
   2026), et le grand n'a pas à porter la couleur d'un achat.

   Le corps et les espacements sont comptés : à 360 px, la plus longue des
   quatre phrases (« TOUTES NOUVELLES · DANS LE CLASSEUR ») tient sur une
   ligne — à vingt-deux pixels, elle passait sur deux —, et à 360 × 640 la
   page d'album tient tout juste entre la tête et les bâches : chaque pixel
   pris ici cachait le bas de la jauge de la série. */
.butintitre{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;
  align-items:baseline;gap:2px 8px;padding:0 12px 6px;text-align:center;
  font-family:var(--banner);font-weight:600;font-size:13px;line-height:1.1;letter-spacing:.1em}
.butintitre b{font-weight:700;font-size:21px;letter-spacing:.04em}
.butintitre small{font-size:13px}
#opener.kq-butin>.ofoot{padding-top:10px}

/* La fin du butin en trois bâches : ENCORE UN, en flare, si la réserve ou le
   solde le permettent ; LE CLASSEUR et MON DECK, en bleu — ce qu'on possède.
   Elle remplace « Terminer » : on ne termine pas une ouverture, on va
   quelque part. FERMER, en tête, ramène au kiosque. */
.kq-fin{display:flex;flex-direction:column;gap:12px;width:100%}
.kq-fin-deux{display:flex;gap:12px}
.kq-fin-deux>*{flex:1 1 0;min-width:0;min-height:46px;padding:11px 8px;font-size:13.5px}
#oEncore{min-height:52px}

/* **Le mouvement part, l'information reste** — sous `prefers-reduced-motion`
   comme sous le mode calme du tiroir (« animations », que fx.js et menu.js
   recopient sur la racine). Le reflet du sachet et la languette de la
   déchirure s'arrêtent, le flash de la déchirure ne part plus ; la bande qui
   revient quand on lâche n'est pas coupée : elle montre ce qu'on a perdu.
   Les sachets changent de place sans glisser, la carte se retourne d'un coup
   et s'écarte sans voler : la rareté se lit sur le sticker collé au-dessus,
   la cérémonie ne joue plus (fx.js). Les briques (fentes, collés, tampons,
   jauge, fumée) ont leurs doubles dans `ui.css`. */
@media (prefers-reduced-motion:reduce){
  .slide.center .foil,.tearpack .grip{animation:none}
  .flash.go{animation:none}
  .slide,.reveal,.reveal .flip{transition:none}
}
html[data-calme~="animations"] .slide.center .foil,
html[data-calme~="animations"] .tearpack .grip,
html[data-calme~="animations"] .flash.go{animation:none}
html[data-calme~="animations"] .slide,
html[data-calme~="animations"] .reveal,
html[data-calme~="animations"] .reveal .flip{transition:none}

/* **Le kiosque se tait derrière la cérémonie.** L'écran d'ouverture le
   couvre entièrement ; son reflet et sa fumée tournaient dessous pour
   personne, et comptaient dans le budget de trois animations sans fin de
   l'écran qu'on regarde. La minuterie prête aussi : elle est la troisième
   boucle du kiosque (avec le reflet et la fumée), et une réponse lente du
   serveur peut la laisser battre sous les cartes. */
#app:has(#opener.on) .slide.center .foil,
#app:has(#opener.on) .kscene>.tbf-fumee::before,
#app:has(#opener.on) .tbf-minuterie[data-etat=pret]{animation-play-state:paused}


/* **Le bas de la page, et la barre du navigateur mobile.**

   Voir aide.html pour l'explication : le dernier element d'une page qui defile
   est colle au bas du document, et la barre du navigateur passe par-dessus.
   Cette page-ci n'a aucune declaration de hauteur — elle defile de bout en
   bout — donc le probleme la concerne autant que les autres. */
/* tbf-degagement */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
</style>
</head>
<body>
<main id="app">
  <!-- La réserve : sous la barre (que nav.js pose en tête de la colonne),
       hors de tout conteneur réécrit. Cachée jusqu'à ce que l'état soit
       arrivé, pour ne jamais afficher un zéro qui n'est pas le vrai solde. -->
  <div class="tbf-reserve tbf-pleine-largeur" id="reserve" hidden>
    <!-- Les boosters : la brique commune (ui.css). Ses sachets, l'anneau et
         PROCHAIN sont posés par `dessinerBoosters` autour du compte, qui
         reste le même élément : c'est lui que `FX.compter` fait défiler. -->
    <div class="tbf-monnaie tbf-boosters" id="kBoosters" role="img" aria-label="Boosters en réserve"><b
      id="kBoost">0</b></div>
    <!-- Le « + » mène où l'on gagne des écharpes : le Virage, comme à la
         boutique. Il menait à la boutique, qui les fait dépenser. -->
    <a class="tbf-monnaie" id="monnaie" href="/virage" aria-label="Écharpes — où en gagner"><img
      src="/img/gains/echarpes.webp" alt=""><b id="kEch">0</b><i class="tbf-monnaie-plus" aria-hidden="true">+</i></a>
  </div>
  <div class="annonce" id="annonce" hidden></div>
  <section class="screen" id="s-kiosque">
    <div class="stage">
      <!-- La saison, en banderole : absente sans saison lancée. -->

<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en

<script src="/fanzzy-fiche.js"></script>
<script>
/* Les aides communes viennent de /cartes.js — l'état, le catalogue, le dessin
   d'une carte. On les réalias ici pour que le code du kiosque soit exactement
   celui qu'il était quand il vivait dans la page des Fanzzy. */
const { $, AC, ACTES, ART, BY_ID, DEX, EVO_COST, ILLUSTRES, IMG_EXT, LIEUX, MAXP, PERSOS, RAR, S, SCARVES, SETS, SETS_TOUTES, STUFFS, TENUES, TYPES, api, art, artFond, artProcedural, audio, buzz, cardHTML, carteDuPaquet, chargerCatalogue, clamp, esc, illustration, load, modsText, objetHTML, packArt, rarMark, reserveHTML, save, seeded, src, uid } = window.TBF_CARTES;

/** Le jeton des écharpes : le même dessin dans la réserve, sur les prix, les
    tickets et ce qui vole vers le compteur. Une monnaie dessinée de deux
    façons se lit comme deux monnaies. */
const JETON = window.TBF_STUFF?.gain?.('echarpes') ?? '/img/gains/echarpes.webp';

const pluriel = (n, un, plusieurs) => `${n} ${Number(n) > 1 ? plusieurs : un}`;

/* ------------------------------------------------- les toasts et les tickets

   **Une erreur n'est jamais un ticket.** Le kiosque avait son propre bandeau
   (`.toast`) pour tout dire, un refus comme un gain. Il passe aux pièces
   communes (lot 2, lots 3 et 5) : un refus est un toast de parpaing qui
   secoue (`.tbf-toast--erreur`), un gain ou une dépense un ticket kraft qui
   monte (`.tbf-ticket--gain`) — un gain ne ressemble jamais à une erreur. Les
   deux vont dans la pile commune, sur `body` : `#app` est un contexte
   d'empilement, et l'écran d'ouverture la couvrirait. */
function pile() {
  let p = document.querySelector('body > .tbf-pile');
  if (!p) {
    p = document.createElement('div');
    p.className = 'tbf-pile';
    document.body.append(p);
  }
  return p;
}

/**
 * **Le kiosque appelait un `toast` qui n'existait pas.**
 *
 * La page avait la case — un `div.toast` au bas du document — et deux appels
 * pour la remplir : le refus d'ouverture, qui traduit le code du serveur en
 * français, et la carte inconnue du catalogue. Il manquait la fonction, et
 * la règle de style qui va avec. Les deux appels levaient donc un
 * `ReferenceError` — dans `openPack`, hors de toute reprise.
 *
 * Le coût n'est pas le message perdu, c'est ce qui le remplace : un refus
 * propre du serveur (« plus de booster », « pas assez d'écharpes ») devenait
 * une exception qui arrêtait la page en plein geste, sans rien à l'écran.
 *
 * Les deux appels sont des refus : c'est le toast d'erreur de la pile.
 */
function toast(txt) {
  const t = document.createElement('div');
  t.className = 'tbf-toast tbf-toast--erreur';
  t.setAttribute('role', 'alert');
  t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>'
    + '<path d="M12 7.5v5.5M12 16.5v.5"/></svg>';
  t.append(document.createTextNode(txt));
  pile().append(t);
  setTimeout(() => t.remove(), 3600);
}

/**
 * Un ticket de gain (ou de dépense), trois secondes dans la pile.
 *
 * Il se lit, il ne se touche pas : il laisse passer le doigt vers les bâches
 * qu'il couvre le temps qu'il est là — la fin du butin est juste dessous.
 */
function ticket({ montant, nom, origine = '', jeton = true }) {
  const t = document.createElement('div');
  t.className = 'tbf-ticket tbf-ticket--gain tbf-glisse';
  t.setAttribute('role', 'status');
  t.style.pointerEvents = 'none';
  t.innerHTML = `${jeton ? `<img src="${esc(JETON)}" alt="">` : ''}<b>${esc(montant)}</b>`
    + `<span>${esc(nom)}${origine ? `<small>${esc(origine)}</small>` : ''}</span>`;
  t.addEventListener('animationend', (e) => {
    if (e.animationName === 'tbf-glisse') t.classList.remove('tbf-glisse');
  });
  pile().append(t);
  setTimeout(() => t.remove(), 3000);
}

/** Retire une classe de mouvement à la fin de son animation, et d'elle
    seule : laissée, elle empêcherait la suivante de partir (ETAT.md, § 6). */
function aLaFin(el, classe, animation) {
  const fin = (e) => {
    if (e.target !== el || e.animationName !== animation) return;
    el.classList.remove(classe);
    el.removeEventListener('animationend', fin);
  };
  el.addEventListener('animationend', fin);
}

/**
 * Pose un solde affiché — et le fait **compter** s'il change sous les yeux.
 *
 * Un chiffre qui saute ne dit rien de ce qui s'est passé ; un chiffre qui
 * descend dit « tu viens de payer », un chiffre qui monte dit « tu viens de
 * gagner » (`FX.compter`, dans fx.js, appelé gardé : sans lui, le chiffre
 * saute, et il est juste quand même).
 *
 * `data-v` retient la valeur affichée — ou celle vers laquelle un compte est
 * en route —, d'où l'on compte. La même valeur ne réécrit rien : elle
 * couperait un compte en cours, qui sauterait à la fin. La première pose ne
 * compte pas, et `compter: false` non plus : un solde qui défilerait depuis
 * zéro à l'arrivée raconterait une dépense qui n'a pas eu lieu. Cette pose
 * sèche **arrête** un compte en cours sur le chiffre (fx.js le fait pour tout
 * nouveau compte sur le même élément) : sans ça, il continuerait d'écrire
 * par-dessus la valeur qu'on vient de poser.
 *
 * @returns {Promise<void>} résolue quand le chiffre final est affiché
 */
function poserSolde(el, valeur, { compter = true } = {}) {
  const apres = Number(valeur) || 0;
  const avant = el.dataset.v === undefined ? null : Number(el.dataset.v);
  el.dataset.v = String(apres);
  if (compter && avant === apres) return Promise.resolve();
  if (compter && avant !== null && window.FX?.compter) {
    return window.FX.compter(el, avant, apres);
  }
  if (window.FX?.compter) return window.FX.compter(el, apres, apres);
  el.textContent = String(apres);
  return Promise.resolve();
}

/* ------------------------------------------------- le temps de la recharge

   **La durée vient du serveur, le décompte de la page** (règle R3 du
   contrat). Le kiosque retirait une seconde à `S.nextIn` à chaque tour de
   minuterie : une minuterie de navigateur glisse, et elle s'endort dans un
   onglet caché — revenu dix minutes plus tard, le compte affichait encore ce
   qu'il affichait en partant. On retient maintenant la valeur servie et
   l'instant de sa lecture (`performance.now()`, que l'heure du téléphone ne
   déplace pas), et le reste se calcule à chaque affichage. À zéro, la page
   relit le serveur au lieu de conclure seule ; au retour d'un onglet caché
   plus d'une minute, aussi. */
let lu = { ms: null, t: 0 };
let plusLongueAttente = 0;
function noterRecharge(ms) {
  const v = ms == null || !Number.isFinite(Number(ms)) ? null : Math.max(0, Number(ms));
  lu = { ms: v, t: performance.now() };
  if (v != null) plusLongueAttente = Math.max(plusLongueAttente, v);
}
/** Ce qui reste avant le prochain booster gratuit, ou `null` : la réserve est pleine. */
const restantMs = () => (lu.ms == null ? null : Math.max(0, lu.ms - (performance.now() - lu.t)));

/* **La durée d'une recharge**, pour l'anneau : la part écoulée est
   `1 − reste ⁄ durée`. Le serveur la sert dans le portefeuille
   (`wallet.cadenceMs`, de `/state` et de `/open`) : c'est celle de ce
   joueur — un abonné recharge plus vite —, et un réglage changé depuis
   l'administration y vaut tout de suite. Un serveur d'avant ne la sert pas ;
   l'anneau prend alors la cadence par défaut du réglage `pack.regen_min`,
   dix minutes, et jamais moins que la plus longue attente annoncée depuis
   l'arrivée — il est approché, mais il finit toujours plein à zéro. Le temps
   exact est écrit à côté. */
const DIX_MINUTES = 10 * 60 * 1000;
const cadence = () => (Number(S.cadenceMs) > 0 ? Number(S.cadenceMs)
  : Math.max(DIX_MINUTES, plusLongueAttente));
/** La part de la recharge écoulée, de 0 à 1 : ce que l'anneau montre. Pleine
    quand rien n'est en route (`reste` nul : la réserve est pleine). */
const partEcoulee = (reste) => (reste == null ? 1 : clamp(1 - reste / cadence(), 0, 1));

/** « 9:55 », ou « 1 h 04 » au-delà d'une heure. */
function quand(ms) {
  /* **Au-delà d'une heure, on écrit des heures.** « 64:28 » ne se lit pas
     comme « une heure et quatre minutes » : les deux points disent
     minutes-secondes, et un nombre de minutes qui dépasse soixante se lit
     comme une horloge cassée. La cadence se règle jusqu'à mille quatre
     cent quarante minutes depuis l'administration — un jour entier —, donc
     le cas n'a rien d'exceptionnel.

     Les secondes sont arrondies au-dessus : « 0:01 » jusqu'au bout, et
     jamais un « 0:00 » qui attend une seconde de plus. */
  const s = Math.ceil(ms / 1000);
  const mm = Math.floor(s / 60);
  return mm >= 60 ? `${Math.floor(mm / 60)} h ${String(mm % 60).padStart(2, '0')}`
    : `${mm}:${String(s % 60).padStart(2, '0')}`;
}
/** La même durée, en mots, pour qui écoute l'écran. */
function enMots(ms) {
  const mm = Math.ceil(ms / 60000);
  if (mm <= 1) return 'moins d’une minute';
  if (mm < 60) return `${mm} minutes`;
  return `${Math.floor(mm / 60)} h ${String(mm % 60).padStart(2, '0')}`;
}

/** La relecture de l'état, une seule à la fois et pas deux fois en dix
    secondes : un serveur qui répond « zéro » à nouveau ne doit pas se faire
    relire à chaque seconde. Elle annonce `tbf:bourse`, qui redessine. */
let relecture = null;
let derniereRelecture = -Infinity;
/* `force` : un geste du joueur (PRÊT touché) relit même dans les dix
   secondes — c'est lui qui attend, pas une minuterie. */
function relire({ force = false } = {}) {
  if (relecture) return relecture;
  if (!force && performance.now() - derniereRelecture < 10_000) return Promise.resolve();
  derniereRelecture = performance.now();
  relecture = load().catch(() => {}).finally(() => { relecture = null; });
  return relecture;
}

/* ------------------------------------------------------------ la réserve */

let signatureBoosters = '';

/** Le sticker frémit quand sa valeur change sous les yeux (`.tbf-vibre`,
    ui.css) ; la classe part à la fin de son animation, pour que la
    suivante reparte. Sans mouvement, elle ne se pose pas : la brique y
    coupe l'animation, et une classe dont l'animation ne finit jamais
    resterait posée. */
function vibrer(el) {
  if (sansMouvement()) return;
  el.classList.remove('tbf-vibre');
  void el.offsetWidth;
  el.classList.add('tbf-vibre');
  aLaFin(el, 'tbf-vibre', 'tbf-vibre');
}

/**
 * Le sticker des boosters : ses sachets, l'anneau de la recharge en cours et
 * PROCHAIN, posés autour du compte (la brique « la réserve de boosters, une
 * seule brique », ui.css).
 *
 * **Dessiné par la règle commune** (`reserveHTML`, dans cartes.js) : une
 * place par sachet seulement si l'on sait combien ce joueur en a et qu'elles
 * tiennent en cinq, sinon le sachet seul. Le plafond est celui que le serveur
 * sert pour ce joueur (`S.packMax`), jamais un nombre écrit ici. Dans la
 * forme du compte, l'anneau sort de la fente et se pose à côté du chiffre.
 *
 * **Le compte reste le même élément** (`#kBoost`, le premier `<b>` du
 * sticker) : on reconstruit ce qui l'entoure, jamais lui. C'est ce qui le
 * laisse compter (`FX.compter`, par `poserSolde`) quand le booster ouvert le
 * fait descendre.
 *
 * Ce qui l'entoure ne se reconstruit que si ce qu'il montre change — le
 * nombre, la recharge, PROCHAIN, la série, le plafond — : chaque seconde,
 * seuls l'anneau et le compte à rebours bougent (`tickReserve`). **PROCHAIN
 * ne s'écrit que s'il a un temps à dire** : réserve pleine, ni anneau ni
 * compte à rebours ; à zéro, le booster est arrivé (la page relit l'état
 * pour le prendre) et la minuterie dit PRÊT juste en dessous — jamais
 * « PROCHAIN 0:00 ».
 *
 * **Rien ne bouge pendant la cérémonie** : l'écran d'ouverture couvre le
 * kiosque, et un compte qui se jouerait dessous serait fini avant qu'on le
 * voie. Tout se pose au retour — `renderKiosque` est rappelé à chaque
 * fermeture —, et c'est là que le booster ouvert fait descendre le compte et
 * vider sa place, sous les yeux.
 */
function dessinerBoosters() {
  if ($('opener').classList.contains('on')) return;
  const k = $('kBoosters');
  const compte = $('kBoost');
  const n = Math.max(0, Math.floor(Number(S.packs) || 0));
  const reste = restantMs();
  const recharge = reste != null;
  const avecProchain = Boolean(reste);
  const set = SETS[S.set];
  const sachet = set && ART[set.id] ? `url("/${src(ART[set.id])}")` : '';
  const max = Number(S.packMax) > 0 ? Number(S.packMax) : null;
  const sig = [n, recharge, avecProchain, sachet, max].join('|');
  if (sig !== signatureBoosters) {
    signatureBoosters = sig;
    if (sachet) k.style.setProperty('--sachet', sachet);
    else k.style.removeProperty('--sachet');
    /* **Le contenu est celui de la règle commune**, au balisage de la
       brique (`brique` : ce qui précède le compte, ce qui le suit), et pas
       le compte lui-même — c'est lui qu'on garde. PROCHAIN au mot, comme à
       la boutique (on a la place) ; posé seulement s'il a un temps à dire.
       Le premier anneau et le premier temps sont écrits tout de suite :
       pas une seconde d'anneau vide ni de PROCHAIN sans chiffre. */
    const { brique } = reserveHTML({ packs: n, max, recharge,
      part: recharge ? partEcoulee(reste) : null,
      prochain: avecProchain ? 'mot' : false, temps: avecProchain ? quand(reste) : '' });
    k.replaceChildren(compte);
    compte.insertAdjacentHTML('beforebegin', brique.avant);
    compte.insertAdjacentHTML('afterend', brique.apres);
    k.dataset.mots = '';
  }
  /* Le chiffre : il compte s'il change sous les yeux, et le sticker
     frémit ; la première pose ne compte pas. */
  const avantN = compte.dataset.v;
  poserSolde(compte, n);
  if (avantN !== undefined && Number(avantN) !== n) vibrer(k);
}

/**
 * La réserve, sous la barre : les boosters, puis les écharpes.
 *
 * **Le solde ne bouge pas pendant la cérémonie**, pour la même raison que
 * les boosters (voir `dessinerBoosters`) : il descend au retour, sous les
 * yeux, et son sticker frémit.
 */
function rendreReserve() {
  /* `avatar` n'est posé que par `load()` : avant, l'état porte des valeurs de
     départ — zéro écharpe, la réserve pleine — qui ne sont pas celles du
     joueur (voir nav.js, « l'état que cartes.js tient pour la page »). */
  if (!('avatar' in S)) return;
  $('reserve').hidden = false;
  const n = Math.max(0, Math.floor(Number(S.packs) || 0));
  dessinerBoosters();
  if (!$('opener').classList.contains('on')) {
    const e = $('kEch');
    const avant = e.dataset.v;
    poserSolde(e, S.scarves ?? 0);
    if (avant !== undefined && Number(avant) !== Number(S.scarves ?? 0)) vibrer($('monnaie'));
  }
  const ech = Number(S.scarves ?? 0);
  $('monnaie').setAttribute('aria-label', `${pluriel(ech, 'écharpe', 'écharpes')} — où en gagner`);
  /* Le solde dit qu'il manque, là où il manque : la réserve est vide et il
     ne paie pas le booster. Le chiffre passe au rouge foncé (la brique). */
  $('monnaie').classList.toggle('tbf-monnaie--manque', n <= 0 && ech < Number(S.packPrice ?? 45));
  tickReserve();
}

/** Chaque seconde : l'anneau, le compte à rebours, et ce qu'on en dit. */
function tickReserve() {
  if ($('reserve').hidden) return;
  /* PROCHAIN paraît et s'en va avec son temps : la forme se repose quand il
     change (la signature le compte), et pas autrement. */
  dessinerBoosters();
  const k = $('kBoosters');
  const reste = restantMs();
  const temps = k.querySelector('.tbf-reserve-prochain b');
  if (reste && temps) temps.textContent = quand(reste);
  const part = partEcoulee(reste);
  for (const a of k.querySelectorAll('.tbf-recharge')) a.style.setProperty('--part', part.toFixed(3));
  /* L'étiquette du sticker ne change qu'à la minute : elle est lue par qui
     l'écoute, et une phrase qui change chaque seconde ne se lit jamais. Le
     plafond ne s'y dit que s'il est servi. C'est elle qui dit le temps en
     mots : le sticker est une image (`role="img"`), et son compte à rebours
     ne s'écoute pas chiffre par chiffre. */
  const n = Math.max(0, Math.floor(Number(S.packs) || 0));
  const max = Number(S.packMax) > 0 ? Number(S.packMax) : null;
  const mots = `${n ? pluriel(n, 'booster', 'boosters') : 'Aucun booster'}${max ? ` sur ${max}` : ''} en réserve`
    + (reste == null ? ' — la réserve est pleine'
      : reste === 0 ? ' — le prochain est arrivé' : ` — le prochain dans ${enMots(reste)}`);
  if (k.dataset.mots !== mots) { k.dataset.mots = mots; k.setAttribute('aria-label', mots); }
}

/* ------------------------------------------------------------ kiosque */

/**
 * Combien de paquets on présente au choix.
 *
 * Trois : celui du milieu, sur son socle, et un de chaque côté. Ils étaient
 * dix, « comme sur un présentoir » — on n'en voyait jamais que trois à la
 * fois, et sept points sous le carrousel comptaient des paquets qu'on ne
 * regardait pas. **Le paquet choisi ne change rien au tirage** : les cartes
 * sont tirées par le serveur à l'ouverture, et le numéro du paquet ne lui est
 * même pas envoyé. Le geste est là pour le geste — ouvrir un booster est une
 * cérémonie, et une cérémonie sans choix n'en est pas une.
 *
 * Le jour où ce choix influencerait le contenu, les joueurs s'en apercevraient
 * en quelques heures, un « paquet qui donne les légendaires » circulerait, et
 * il faudrait honorer une superstition qu'on aurait fabriquée soi-même.
 */
const PAQUETS_AU_CHOIX = 3;
/** On arrive sur celui du milieu : un voisin de chaque côté. */
const MILIEU = Math.floor(PAQUETS_AU_CHOIX / 2);

/** Les séries que ce joueur peut ouvrir, dans l'ordre du catalogue. */
const seriesOuvertes = () => SETS.filter(serieDebloquee);

/**
 * Carrousel en perspective.
 *
 * Les paquets existent en permanence dans le DOM et ne font que se replacer :
 * on peut donc les faire glisser au doigt, avec la position qui suit le geste
 * en temps réel plutôt que de sauter d'une série à l'autre.
 *
 * Il présentait les neuf séries, dont huit verrouillées pour qui commence : on
 * glissait longuement au milieu de ce qu'on ne peut pas ouvrir. La série se
 * choisit maintenant sur les pastilles du dessus, et le carrousel ne sert plus
 * qu'à prendre **son** paquet.
 */
function buildCarousel() {
  const c = $('carousel');
  c.querySelectorAll('.slide').forEach((n) => n.remove());
  const set = SETS[S.set];
  if (!set) return;

  for (let i = 0; i < PAQUETS_AU_CHOIX; i++) {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.i = String(i);
    /* Une série sans visuel dessiné passe directement par `packArt`. On
       pourrait s'en remettre à `onerror`, et c'était le cas : ça coûtait une
       requête qui échoue et une erreur en console par paquet affiché, pour
       cinq séries sur douze depuis l'arrivée du lot neuf. */
    el.innerHTML = ART[set.id]
      ? `<img alt="" loading="lazy" decoding="async" src="${src(ART[set.id])}">
      <div class="foil"></div>`
      : `${packArt(set)}<div class="foil"></div>`;
    const img = el.querySelector('img');
    // Repli sur l'illustration dessinée si le visuel ne charge pas.
    if (img) img.onerror = () => { img.remove(); el.insertAdjacentHTML('afterbegin', packArt(set)); };
    c.appendChild(el);
  }
  placeCarousel(0);
}

/** L'écart entre deux paquets : un peu plus que la largeur d'un sachet, qui
    grandit avec l'écran (voir la feuille). */
const ecartDesPaquets = () =>
  ($('carousel').querySelector('.slide')?.offsetWidth || 124) * 1.2;

function placeCarousel(drag = 0) {
  const w = ecartDesPaquets();
  for (let i = 0; i < PAQUETS_AU_CHOIX; i++) {
    const el = $('carousel').querySelector(`.slide[data-i="${i}"]`);
    if (!el) continue;
    const off = i - (S.paquet ?? MILIEU) - drag;
    const abs = Math.abs(off);
    el.style.transform =
      `translateX(-50%) translateX(${off * w}px) translateZ(${-abs * 190}px) ` +
      `rotateY(${off * -26}deg) scale(${1 - abs * 0.06})`;
    el.style.zIndex = String(10 - Math.round(abs * 10));
    el.classList.toggle('center', abs < 0.5);
    el.classList.toggle('side', abs >= 0.5);
    el.classList.toggle('hidden', abs > 1.8);
  }
}

/**
 * Cette série est-elle ouverte ?
 *
 * Elle dépendait du joueur — `S.series`, tirée de son niveau. Elle ne dépend
 * plus que du jeu : une saison l'a ouverte, ou pas, et c'est pareil pour tout le
 * monde. `ouverte` vient de `/api/fanzzy/dex`, où le serveur la calcule.
 *
 * `s.ouverte === undefined` — une réponse d'avant le déploiement, servie depuis
 * un cache — vaut ouverte : on montre plutôt que de fermer par accident.
 */
const serieDebloquee = (s) => s?.ouverte !== false;

/**
 * Peut-on ouvrir un paquet, là, maintenant ?
 *
 * ## Pourquoi cette fonction existe
 *
 * **La règle était écrite deux fois, et la seconde avait été oubliée.**
 *
 * Le bouton se fermait autrefois dès que la réserve tombait à zéro — donc
 * exactement quand payer aurait servi. Ç'a été corrigé : `disabled` tient
 * maintenant compte des écharpes. Mais `startTear` gardait sa propre garde,
 * `if (S.packs <= 0) return;`, et personne n'y a touché.
 *
 * Résultat : le bouton disait « OUVRIR · 45 ÉCHARPES », il était vif, on
 * appuyait — et **rien ne se passait**. Ni refus, ni message, ni animation. Le
 * pire des états : l'écran promettait, acceptait le geste, et l'avalait.
 *
 * La règle vit donc ici, une fois, et les endroits qui ouvrent l'appellent —
 * le bouton, l'achat immédiat, la minuterie prête, ENCORE UN. C'est la faute
 * que ce dépôt a déjà payée cinq fois sous le même nom — une règle écrite
 * à deux endroits finit par ne plus dire la même chose — et c'est la seule
 * façon connue de ne pas la repayer.
 */
const peutOuvrir = () => serieDebloquee(SETS[S.set] ?? {})
  && (S.packs > 0 || Number(S.scarves ?? 0) >= Number(S.packPrice ?? 45));

/**
 * **Un seul geste d'achat à l'écran.**
 *
 * Réserve vide et solde suffisant, l'écran proposait deux fois le même achat
 * de 45 : la bâche or « TOUT DE SUITE · +1 BOOSTER » et, juste dessous, la
 * bâche flare « OUVRIR · 45 ÉCHARPES ». Les deux appelaient `startTear`. Le
 * joueur cherchait une différence qui n'existait pas, et l'achat s'écrivait
 * en flare quand l'or dit « acheter ». Réserve vide et solde court, la
 * flare devenait une bâche éteinte, « IL TE FAUT 45 ÉCHARPES », qui ne
 * menait nulle part.
 *
 * Ce que dit la bâche principale (`#openBtn`, et `#gagner` à sa place) :
 *
 * - `ouvrir`  : un booster en réserve — OUVRIR LE BOOSTER, gratuit ;
 * - `pret`    : la minuterie est à zéro, le booster est arrivé — OUVRIR LE
 *   BOOSTER, qui relit d'abord l'état pour le prendre (jamais un achat) ;
 * - `attendre` : réserve vide, la minuterie compte et la bâche or vend le
 *   booster — la flare s'éteint, l'or est le **seul** achat ;
 * - `acheter` : réserve vide sans minuterie (une réserve sans recharge) et
 *   solde suffisant — la flare porte le prix, puisque l'or n'est pas là ;
 * - `gagner`  : réserve vide et solde court — la flare cède la place à la
 *   bâche verte GAGNER DES ÉCHARPES, qui mène au Virage ;
 * - `fermee`  : une série qu'aucune saison n'a ouverte.
 *
 * Le sachet du carrousel, touché, fait ce que fait la bâche : il ne vend
 * rien en douce quand elle est éteinte.
 */
function geste() {
  if (!serieDebloquee(SETS[S.set] ?? {})) return 'fermee';
  if (Number(S.packs) > 0) return 'ouvrir';
  const reste = restantMs();
  if (reste === 0) return 'pret';
  const paie = Number(S.scarves ?? 0) >= Number(S.packPrice ?? 45);
  if (!paie) return 'gagner';
  return reste == null ? 'acheter' : 'attendre';
}

/** La bâche principale, selon le geste. Réécrite seulement quand ce qu'elle
    dit change : chaque seconde, `tickRegen` la repasse. */
function rendreGeste() {
  /* Avant `load()`, l'état porte des valeurs de départ (la réserve pleine) :
     la bâche garde son libellé d'origine plutôt que d'annoncer « 12 en
     réserve » qui ne sont pas ceux du joueur. */
  if (!('avatar' in S)) return;
  const g = geste();
  const b = $('openBtn');
  const px = Number(S.packPrice ?? 45);
  const n = Math.max(0, Math.floor(Number(S.packs) || 0));
  const manque = Math.max(0, px - Number(S.scarves ?? 0));
  const libelle = {
    fermee: 'PAS ENCORE OUVERTE',
    ouvrir: `OUVRIR LE BOOSTER<small>${n} en réserve</small>`,
    pret: 'OUVRIR LE BOOSTER<small>le prochain est arrivé</small>',
    attendre: 'OUVRIR LE BOOSTER<small>aucun en réserve</small>',
    acheter: `OUVRIR · ${px} ÉCHARPES`,
    gagner: 'OUVRIR LE BOOSTER',
  }[g];
  if (b.dataset.libelle !== libelle) { b.dataset.libelle = libelle; b.innerHTML = libelle; }
  b.disabled = g === 'fermee' || g === 'attendre' || g === 'gagner';
  b.hidden = g === 'gagner';
  $('gagner').hidden = g !== 'gagner';
  const m = `il t’en manque ${manque}`;
  if ($('gagnerManque').textContent !== m) {
    $('gagnerManque').textContent = m;
    $('gagner').setAttribute('aria-label', `Gagner des écharpes : ${m} pour un booster`);
  }
}

/** Ce que fait la bâche principale, et le sachet touché. */
function ouvrirDepuisLaBache() {
  if (!('avatar' in S) || !SETS[S.set]) return;
  const g = geste();
  if (g === 'pret') ouvrirLArrive();
  else if (g === 'ouvrir' || g === 'acheter') startTear();
}

/**
 * Le booster que la minuterie vient d'annoncer : on relit l'état, qui le
 * contient, et on ne l'ouvre que s'il y est.
 *
 * La relecture est forcée — celle de la minuterie à zéro a pu partir il y a
 * moins de dix secondes. Et l'on n'ouvre **que** si la réserve le contient :
 * sans ce garde, un serveur encore à quelques secondes de la recharge
 * renvoyait une réserve vide, et `startTear` passait à l'achat — le joueur
 * touchait PRÊT, un booster gratuit, et payait 45 écharpes. Sinon, la
 * minuterie repart du temps servi, sous ses yeux.
 */
function ouvrirLArrive() {
  relire({ force: true }).then(() => { if (Number(S.packs) > 0) startTear(); });
}

/**
 * Chaque seconde : le bouton, la réserve, la minuterie — et la relecture à
 * zéro.
 *
 * **L'achat aux écharpes était inatteignable.**
 *
 * Le bouton se fermait dès `packs <= 0`, et le client n'envoie `buy` que
 * dans ce cas précis : la seule situation où l'on paie était donc la seule
 * où le bouton ne répondait pas. Le serveur, lui, savait acheter depuis le
 * premier jour. Il n'a jamais reçu la demande. L'achat a maintenant sa
 * bâche, l'or de la minuterie (voir `geste`).
 */
function tickRegen() {
  rendreGeste();
  tickReserve();
  rendreMinuterie();
  rangerLaScene();
  if (restantMs() === 0) relire();
}

/** Combien de rangées s'ajoutent au-dessus du bouton OUVRIR — le rail des
    séries, le texte de la saison, la minuterie —, pour que la feuille
    resserre la scène quand il n'aurait plus la place (voir `.kscene`). Les
    sachets se replacent : leur écart suit leur largeur. */
function rangerLaScene() {
  const n = [!$('series').hidden, !$('saisonTxt').hidden, !$('minut').hidden].filter(Boolean).length;
  const ecran = $('s-kiosque');
  if (ecran.dataset.rangees === String(n)) return;
  ecran.dataset.rangees = String(n);
  placeCarousel(0);
}

/**
 * La minuterie et l'achat immédiat, quand la réserve est vide.
 *
 * Deux objets : la bâche de parpaing « PRÊT DANS 9:55 », qui se lit et ne se
 * touche pas (un `div`), et à côté la bâche or « TOUT DE SUITE · +1 BOOSTER »
 * avec son prix — l'or dit « acheter », et c'est **le seul achat de
 * l'écran** : la flare, dessous, s'éteint (voir `geste`). Le temps écoulé,
 * la minuterie devient une bâche or qui pulse, « PRÊT », et un bouton : elle
 * ouvre le booster qui vient d'arriver (`ouvrirLArrive`).
 *
 * L'achat ne se propose que s'il se paie — sans les écharpes, la bâche verte
 * GAGNER DES ÉCHARPES prend la place de la flare, et la minuterie reste
 * seule — et **jamais à PRÊT** : le booster gratuit est là, vendre le même
 * à côté pour 45 ferait croire qu'il faut payer.
 *
 * Elle ne se reconstruit que si son état change : chaque seconde, seuls le
 * compte et l'anneau bougent — un bouton recréé sous le doigt perdrait le
 * toucher, et le focus du clavier avec lui.
 */
function rendreMinuterie() {
  const row = $('minut');
  const ouvrable = serieDebloquee(SETS[S.set] ?? {});
  const reste = restantMs();
  const montrer = 'avatar' in S && ouvrable && Number(S.packs) <= 0 && reste != null;
  row.hidden = !montrer;
  if (!montrer) { row.dataset.mode = ''; return; }
  const prix = Number(S.packPrice ?? 45);
  const paie = Number(S.scarves ?? 0) >= prix;
  const pret = reste === 0;
  const mode = `${pret ? 'pret' : 'attente'}|${paie}|${prix}`;
  if (row.dataset.mode !== mode) {
    row.dataset.mode = mode;
    row.innerHTML = (pret
      ? `<button type="button" class="tbf-plaque tbf-minuterie" data-etat="pret" id="minuteriePrete"
          aria-label="Un booster est prêt : l’ouvrir"><span class="tbf-recharge" style="--taille:28px;--part:1"
          aria-hidden="true"></span><span class="tbf-lib2"><b>PRÊT</b></span></button>`
      : `<div class="tbf-plaque tbf-minuterie" id="minuterie" role="timer"><span class="tbf-recharge"
          style="--taille:28px" aria-hidden="true"></span><span class="tbf-lib2"><small>PRÊT DANS</small><b
          id="minuterieT"></b></span></div>`)
      + (paie && !pret
        ? `<button type="button" class="tbf-plaque tbf-minuterie" data-ton="or" id="achat"
            aria-label="Acheter un booster tout de suite : ${prix} écharpes"><span class="tbf-lib2"><small>TOUT DE
            SUITE</small><b>+1 BOOSTER</b></span><span class="tbf-sticker tbf-sticker--prix"><img
            src="${esc(JETON)}" alt="">${prix}</span></button>`
        : '');
  }
  if (!pret) {
    $('minuterieT').textContent = quand(reste);
    const m = $('minuterie');
    const mots = `Prochain booster gratuit dans ${enMots(reste)}`;
    if (m.getAttribute('aria-label') !== mots) m.setAttribute('aria-label', mots);
    m.querySelector('.tbf-recharge').style.setProperty('--part', partEcoulee(reste).toFixed(3));
  }
}
$('minut').onclick = (e) => {
  if (e.target.closest('#achat')) { startTear(); return; }
  if (e.target.closest('#minuteriePrete')) ouvrirLArrive();
};

/** Les séries de la saison en cours : la liste du serveur, ou celles du
    catalogue qui disent être arrivées par elle. Sans saison, aucune. */
function idsDeSaison() {
  const s = S.saison;
  if (!s || !s.nom) return [];
  return Array.isArray(s.series) && s.series.length ? s.series
    : SETS_TOUTES.filter((x) => x.saison && (x.saison.id === s.id || x.saison.numero === s.numero))
      .map((x) => x.id);
}

/**
 * La banderole de la saison.
 *
 * ## Pourquoi elle existe
 *
 * Une saison ouvre pour tout le monde le même jour : c'est ce qui se dit, et
 * c'est ici qu'on le dit, sur l'écran où l'on vient chercher des cartes. Elle
 * porte le numéro et le nom de la saison, les jours qui restent quand le
 * serveur les compte, et ce qu'on en a collecté — les personnages des séries
 * de la saison qu'on possède, sur ceux qu'on peut y gagner (calcul de la
 * page, sur le catalogue qu'elle a déjà).
 *
 * ## Et pourquoi son texte se ferme
 *
 * Une annonce qu'on ne peut pas faire taire est une annonce qu'on apprend à ne
 * plus lire — et la suivante ne le sera pas non plus. Le serveur retient donc la
 * dernière saison vue par ce joueur : la croix ferme le texte pour de bon, et il
 * ne revient qu'au lancement de la suivante. La banderole, elle, reste : elle
 * dit où l'on est, pas ce qui vient d'arriver.
 */
function rendreSaison() {
  const n = $('saison');
  const s = S.saison;
  if (!s || !s.nom) { n.hidden = true; return; }
  n.hidden = false;
  $('saisonNom').textContent = `Saison ${s.numero} — ${s.nom}`;
  /* Les jours, seulement s'ils sont servis, et jamais une fois la date
     passée : aucune page ne compte une fin de saison sur l'horloge du
     téléphone (R3). */
  const j = Number(s.joursRestants);
  const jours = s.finie || !Number.isInteger(j) || j < 1 ? ''
    : j === 1 ? 'Dernier jour' : `Encore ${j} jours`;
  $('saisonJours').textContent = jours;
  $('saisonJours').hidden = !jours;
  const nouvelle = S.saisonVue !== s.id && Boolean(s.texte);
  $('saisonTxt').textContent = nouvelle ? s.texte : '';
  $('saisonTxt').hidden = !nouvelle;
  $('saisonVu').hidden = !nouvelle;
  n.classList.toggle('avec-x', nouvelle);
  /* L'écharpe prend la couleur de la première série de la saison. */
  const ids = idsDeSaison();
  const premiere = SETS_TOUTES.find((x) => x.id === ids[0]);
  if (premiere?.c1) n.style.setProperty('--e1', premiere.c1);
  else n.style.removeProperty('--e1');
  const lignees = PERSOS.filter((f) => ids.includes(f.set));
  const c = $('saisonCompte');
  c.hidden = !lignees.length;
  if (lignees.length) {
    c.textContent = `${lignees.filter((f) => S.col?.[f.id]).length} / ${lignees.length} collectés`;
  }
}

$('saisonVu').onclick = async () => {
  /* On cache **avant** d'appeler. Le geste est sans conséquence — au pire
     le texte reviendra au prochain chargement — et le faire attendre le
     serveur donnerait une croix qui ne répond pas tout de suite. La croix
     part avec le texte : le focus revient à la banderole. */
  S.saisonVue = S.saison?.id ?? null;
  rendreSaison();
  $('saison').setAttribute('tabindex', '-1');
  $('saison').focus({ preventScroll: true });
  try { await api('/saison-vue', {}); } catch { /* il reviendra, sans plus */ }
};

/** Le petit sachet gris d'une série fermée, dans son rail. Sans dessin, un
    sachet de ses deux couleurs, et non le paquet composé de `packArt` : son
    nom y serait écrit à deux pixels — un texte que personne ne lit, et que
    l'audit compterait sous onze. Le nom est à l'écoute (`aria-label`). */
const saisonDe = (x) => (Number.isInteger(x.prochaine) && x.prochaine > 0 ? x.prochaine : 0);
const sachetFerme = (x) => {
  const k = saisonDe(x);
  const nom = esc(k ? `${x.nom} — saison ${k}` : x.nom);
  const fond = ART[x.id] ? `url('/${esc(src(ART[x.id]))}')`
    : `linear-gradient(160deg,${esc(x.c2 ?? '#1A1F27')} 0 32%,${esc(x.c1 ?? '#C2CAD6')} 58%,${esc(x.c2 ?? '#1A1F27')})`;
  return `<span class="fermees-s" role="img" aria-label="${nom}"${k ? ' data-annoncee' : ''}
      style="background-image:${fond}"></span>`;
};

/**
 * Ce qui vient : les séries fermées, en un rail de sachets gris sous une
 * croix de scotch.
 *
 * Elle disait « au niveau 12 ». Elle ne le dit plus, et pas seulement parce
 * que le niveau n'ouvre plus rien : **on ne connaît pas toujours la date**.
 * Une saison se lance quand l'administration la lance ; le serveur ne dit
 * quelle saison ouvrira une série que si elle a été annoncée
 * (`sets[].prochaine`, contrat § 7.2), et annoncer une échéance qu'on ne
 * tiendra peut-être pas est pire que de n'en annoncer aucune. Les séries
 * annoncées viennent en tête du rail, leur nom et leur saison en étiquette
 * (« SAISON 2 » n'est écrit que si la saison est servie) ; les autres n'en
 * ont pas.
 */
function rendreFermees() {
  const fermees = SETS_TOUTES.filter((x) => !serieDebloquee(x));
  const av = $('avenir');
  if (!fermees.length) { av.hidden = true; av.innerHTML = ''; return; }
  av.hidden = false;
  // Les séries annoncées d'abord, de la saison la plus proche à la plus
  // lointaine ; l'ordre du catalogue sinon (le tri est stable).
  const rang = [...fermees].sort((a, b) => (saisonDe(a) || Infinity) - (saisonDe(b) || Infinity));
  const annoncees = rang.filter((x) => saisonDe(x));
  const k = annoncees.length ? saisonDe(annoncees[0]) : 0;
  const memeSaison = annoncees.filter((x) => saisonDe(x) === k);
  /* Une série annoncée : son nom. Plusieurs pour la même saison : leur
     nombre — une étiquette de trois noms ne tiendrait pas sur un sachet. */
  const etiquette = !k ? ''
    : memeSaison.length === 1 ? `${memeSaison[0].nom} · SAISON ${k}`
      : `${memeSaison.length} SÉRIES · SAISON ${k}`;
  const n = fermees.length;
  av.innerHTML = `<p class="fermees-lab">${n} série${n > 1 ? 's attendent' : ' attend'} une saison</p>`
    + (etiquette ? `<div class="fermees-annonce"><span class="tbf-sticker">${esc(etiquette)}</span></div>` : '')
    + `<div class="fermees-rail"><div class="fermees-rang" tabindex="0" role="group"
        aria-label="Les séries à venir">${rang.map(sachetFerme).join('')}</div>
        <span class="tbf-scotch tbf-scotch--croix" aria-hidden="true"></span></div>`;
}

/** Les pastilles des séries ouvertes, la choisie ramenée au milieu du rail. */
function rendreSeries(ouvertes, s) {
  const rangee = $('series');
  rangee.hidden = ouvertes.length < 2;
  if (rangee.hidden) { rangee.innerHTML = ''; return; }
  /* Des plaques, et l'or du kiosque sur la série choisie. `on` reste posé à
     côté du ton : c'est l'état, le ton n'en est que la couleur. */
  rangee.innerHTML = ouvertes.map((o) => {
    const choisie = o.id === s.id;
    return `<button data-serie="${esc(o.id)}" class="tbf-plaque${choisie ? ' on' : ''}"
      ${choisie ? 'data-ton="or" ' : ''}aria-pressed="${choisie}">${esc(o.nom)}</button>`;
  }).join('');
  const b = rangee.querySelector('.on');
  if (b && rangee.scrollWidth > rangee.clientWidth) {
    rangee.scrollLeft = Math.max(0, b.offsetLeft - (rangee.clientWidth - b.offsetWidth) / 2);
  }
}

function renderKiosque() {
  /* La série affichée est toujours ouverte : le kiosque ne présente plus que
     ce qu'on peut ouvrir. Si le catalogue n'est pas encore arrivé,
     `serieDebloquee` rend vrai, et l'on montre tout plutôt qu'un écran vide. */
  const ouvertes = seriesOuvertes();
  if (ouvertes.length && !serieDebloquee(SETS[S.set] ?? {})) {
    S.set = SETS.indexOf(ouvertes[0]);
    S.paquet = MILIEU;
    buildCarousel();
  }

  const s = SETS[S.set];
  if (!s) return;
  const ouvrable = serieDebloquee(s);

  rendreSeries(ouvertes, s);
  rendreFermees();
  rendreSaison();

  /* Le nom de la série, en sticker sous son sachet, et ce qu'elle contient :
     ses personnages, ceux que la collection compte. Une série fermée se
     montre **verrouillée** : le kiosque les proposait toutes sans
     distinction, le joueur en choisissait une, appuyait, et découvrait le
     refus après coup — sous la forme d'un code. Un jeu ne cache pas ce qui
     vient, il le montre verrouillé. */
  /* **Le compte ne s'écrit qu'une fois.** Quand la saison se réduit à la
     série affichée — en production, LA REPRISE seule —, la banderole dit
     déjà « 4 / 35 COLLECTÉS » : le sticker du sachet redisait « 35 FANZZY »
     deux cents pixels plus bas. Il ne garde alors que le nom. Avec plusieurs
