<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Les boosters — TheBestFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="stylesheet" href="/cartes.css">
<style>
/* Le kiosque, et la cérémonie d'ouverture.

   Ils vivaient dans la page des Fanzzy, entre le classeur et le personnage
   équipé. Ce n'était pas la même chose : on va au classeur pour **regarder ce
   qu'on a**, on vient ici pour **en avoir plus**. Deux intentions, deux
   écrans. */
/* -------------------------------------------------------------- kiosque */

/* `overflow-x: clip` et non `hidden` : `clip` rogne sans fabriquer un
   conteneur défilable, donc aucune barre parasite ne s'ajoute. Sans lui, les
   cartes latérales du carrousel sortent du cadre et **emportent le document
   avec elles** : mille treize pixels de large sur un écran de trois cent
   soixante, et toute la page se met à glisser horizontalement. Rien ne casse,
   la page devient simplement pénible — et on ne le voit jamais depuis un
   écran large. */
.carousel{position:relative;width:100%;height:320px;perspective:1100px;touch-action:pan-y;
  overflow-x:clip}

/* Les séries ouvertes, en pastilles. Seules celles qu'on peut ouvrir y
   figurent : les autres se disent en une ligne, plus bas. */
.series{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px 8px}
/* Quarante-quatre pixels : la pulpe d'un doigt, et le minimum des deux
   plateformes. L'audit d'interface les a tous comptés d'un coup — ce n'est
   jamais une faute de conception, c'est une hauteur qu'on ne mesure pas en
   regardant. */
.series button{background:rgba(255,255,255,.05);border:1px solid rgba(242,238,228,.16);
  border-radius:22px;color:inherit;font-family:var(--banner);font-size:10.5px;
  letter-spacing:.1em;padding:5px 14px;min-height:44px;cursor:pointer;opacity:.62;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .1s ease,opacity .16s ease}
.series button.on{background:var(--craie);color:#0B0E13;border-color:var(--craie);opacity:1}
.series button:active{transform:translateY(2px)}

/* Ce qui vient. Discret par construction : c'est une promesse, pas une offre. */
.avenir{text-align:center;font-size:11px;opacity:.42;padding:6px 16px 0;line-height:1.5}
.avenir b{color:var(--projo);font-family:var(--banner);letter-spacing:.08em;opacity:.9}

/* L'annonce de la saison. Elle a la bande d'écharpe de la boîte de
   confirmation : c'est le même geste — le jeu qui s'adresse au joueur — et deux
   façons de le faire seraient deux choses à apprendre. */
.saison{position:relative;margin:10px 14px 0;padding:13px 15px 14px;border-radius:12px;
  border:1px solid rgba(245,195,59,.3);background:rgba(245,195,59,.07);text-align:left}
.saison::before{content:"";position:absolute;left:15px;right:15px;top:6px;height:3px;
  border-radius:2px;
  background:repeating-linear-gradient(115deg,var(--projo) 0 8px,transparent 8px 16px)}
.saison-n{margin:6px 0 0;font-family:var(--banner);font-size:10px;letter-spacing:.2em;
  color:var(--projo)}
.saison h3{margin:4px 0 0;font-family:var(--banner);font-size:17px;letter-spacing:.04em;
  line-height:1.15;text-wrap:balance}
.saison-t{margin:6px 0 0;font-size:12px;line-height:1.6;opacity:.72}
.saison-t:empty{display:none}
.saison-x{position:absolute;top:2px;right:2px;background:none;border:0;color:inherit;
  opacity:.4;font-size:14px;line-height:1;cursor:pointer;
  width:44px;height:44px;display:grid;place-items:center}
.saison-x:hover,.saison-x:focus-visible{opacity:.9}
.slide{position:absolute;left:50%;top:50%;width:186px;aspect-ratio:.62;margin:0;cursor:grab;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,.9,.28,1),opacity .45s,filter .45s;
  border-radius:11px;overflow:hidden;border:1px solid rgba(0,0,0,.6);
  box-shadow:0 26px 46px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.2)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide svg{width:100%;height:100%;display:block}
.slide .foil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.42) 46%,
    rgba(180,225,255,.28) 52%,transparent 66%);
  background-size:260% 260%;background-position:120% 0;mix-blend-mode:screen}
.slide.center .foil{animation:foil 4.5s ease-in-out infinite}
@keyframes foil{0%{background-position:130% 0}55%{background-position:-40% 0}100%{background-position:-40% 0}}
.slide.center{animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-9px}}
.slide.side{filter:brightness(.42) saturate(.65)}
.slide.hidden{opacity:0;pointer-events:none}
.shadow{position:absolute;left:50%;bottom:6px;width:150px;height:16px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%);filter:blur(5px)}

.tearhint{font-size:10.5px;letter-spacing:.2em;opacity:.45;margin-top:6px;text-align:center}

/* Une série verrouillée se regarde sans se toucher : le paquet s'éteint, mais
   il reste visible. C'est ce qui donne envie d'y arriver. */
.carousel.verrou .slide.center{filter:grayscale(.85) brightness(.5)}
.carousel.verrou .slide.center .foil{display:none}
/* Le cadenas est dans la ligne, pas sur le paquet : `.carousel` porte une
   `perspective`, donc ses enfants se rangent par leur profondeur en 3D et non
   par `z-index`. Un cadenas posé là passait derrière les paquets — avec la
   bonne taille, le bon calque et la bonne image, mais invisible. */
.setline .verrou{display:inline-flex;align-items:center;gap:5px}
.setline .verrou svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;flex:none}

/* --------------------------------------------------- geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Une seule intention, un seul mouvement, et l'endroit
   où saisir se voit — la ligne dentelée est dessinée sur le paquet avant même
   qu'on y touche.

   `--p` porte l'avancée de la déchirure, de 0 à 1. Tout en découle : la bande
   qui s'en va, l'ouverture qui se creuse, la lueur qui monte. Déclarée en
   `@property` pour qu'elle s'anime — c'est ce qui fait le retour élastique
   quand on lâche trop tôt. Là où `@property` manque, la bande revient d'un
   coup au lieu de glisser : moins joli, tout aussi juste. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

.tearzone{position:absolute;inset:0;z-index:24;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(5,7,10,.94)}
.tearzone.on{display:flex}

.tearquit{position:absolute;top:14px;right:14px;background:none;border:0;color:inherit;
  font-size:11.5px;letter-spacing:.14em;opacity:.45;cursor:pointer;padding:8px 10px}
.tearquit:hover,.tearquit:focus-visible{opacity:.85}

/* `--bande` : où passe la déchirure, en hauteur de vignette. Elle ne vaut pas
   zéro parce que le dessin d’un booster laisse une marge sombre au-dessus du
   sachet : réglée trop haut, la bande s’arrachait dans le vide, au-dessus du
   paquet représenté. */
.tearpack{--p:0;--bande:20%;width:210px;aspect-ratio:.62;position:relative;border-radius:12px;
  overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.7);touch-action:none;cursor:grab;
  border:0;padding:0;background:none;display:block;transition:--p .32s cubic-bezier(.3,1.4,.5,1)}
.tearpack.tire{transition:none;cursor:grabbing}
.tearpack:focus-visible{outline:2px solid var(--projo);outline-offset:4px}
.tearpack .art{position:absolute;inset:0}
.tearpack img,.tearpack svg{width:100%;height:100%;object-fit:cover;display:block}

/* L'intérieur du sachet : ce qu'on découvre à mesure que la bande s'en va. */
.tearpack .maw{position:absolute;left:0;right:0;top:0;height:var(--bande);
  background:radial-gradient(120% 160% at 50% 0,rgba(255,238,190,calc(.55 * var(--p))),
    rgba(5,7,10,.96) 62%);
  -webkit-mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%;
          mask:conic-gradient(from -45deg at 50% calc(100% - 7px),#0000 90deg,#000 0) 50%/14px 100%}

/* La bande elle-même. Une copie du paquet, rognée à sa hauteur : elle montre
   donc exactement le haut du dessin, quel qu'il soit — photo ou SVG de repli. */
.tearpack .lip{position:absolute;left:0;right:0;top:0;height:var(--bande);overflow:hidden;
  clip-path:inset(0 0 0 calc(var(--p) * 100%));
  transform:rotate(calc(var(--p) * 5deg)) translateY(calc(var(--p) * -6px));
  transform-origin:100% 100%}
.tearpack .lip > *{position:absolute;top:0;left:0;width:100%;height:666.7%}

/* La ligne dentelée : l'affordance. Elle dit où saisir avant qu'on ait lu la
   consigne, et elle s'efface à mesure que la déchirure la mange. */
.tearpack .seam{position:absolute;left:0;right:0;top:var(--bande);height:2px;
  background:repeating-linear-gradient(90deg,rgba(245,195,59,.9) 0 5px,transparent 5px 10px);
  opacity:calc(1 - var(--p));filter:drop-shadow(0 0 3px rgba(245,195,59,.5))}

/* La languette qu'on saisit, à droite de la ligne : c'est là que part le geste. */
.tearpack .grip{position:absolute;right:6px;top:calc(var(--bande) - 15px);width:26px;height:26px;
  border-radius:50%;background:rgba(245,195,59,.92);box-shadow:0 2px 10px rgba(0,0,0,.6);
  opacity:calc(1 - var(--p));animation:tirette 1.9s ease-in-out infinite;pointer-events:none}
.tearpack .grip::after{content:"";position:absolute;inset:7px;border-left:2px solid #05070A;
  border-bottom:2px solid #05070A;transform:rotate(45deg) translate(1px,-1px)}
@keyframes tirette{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}

.tearlbl{margin-top:20px;font-family:var(--banner);font-size:14px;letter-spacing:.2em;opacity:.7;
  text-align:center;line-height:1.6;max-width:280px}
.tearlbl b{color:var(--projo)}
.tearlbl small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.08em;
  opacity:.55;margin-top:8px}

#burst{position:absolute;inset:0;z-index:23;pointer-events:none;object-fit:cover;width:100%;height:100%;
  mix-blend-mode:screen;opacity:0;transition:opacity .4s}
#burst.on{opacity:1}
.flash{position:absolute;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
#app.quake{animation:quake .6s}
@keyframes quake{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-6px,3px)}35%{transform:translate(5px,-4px)}
  55%{transform:translate(-4px,-2px)}75%{transform:translate(3px,3px)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.setname{font-family:var(--banner);font-size:12px;letter-spacing:.28em;opacity:.7}
.setline{font-size:10.5px;opacity:.42;margin:4px 0 18px}
.packwrap{position:relative}
.packglow{position:absolute;width:230px;height:230px;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,195,59,.26),transparent 65%);
  filter:blur(14px);animation:breathe 5s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.pack{width:178px;aspect-ratio:.62;border-radius:9px;overflow:hidden;position:relative;cursor:pointer;
  border:1px solid rgba(0,0,0,.6);box-shadow:0 24px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22);
  transform:rotate(-2deg);transition:transform .2s;display:block;background:none;padding:0}
.pack:active{transform:rotate(-2deg) scale(.97)}
.packnav{display:flex;align-items:center;gap:16px;margin-top:18px}
.packnav button{width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(242,238,228,.18);background:rgba(0,0,0,.3);color:inherit;cursor:pointer;
  display:grid;place-items:center;font-size:17px;line-height:1}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(242,238,228,.22);display:block}
.dots i.on{background:var(--projo)}
/* Ouvrir un booster : l'action principale de l'écran, donc une plaque de
   pleine taille. Sa largeur limitée lui reste propre — au milieu d'un kiosque,
   un bouton d'un bord à l'autre écraserait le carrousel. */
.cta{margin:16px auto 6px;width:min(300px,82%);font-size:16px;letter-spacing:.1em}
.regen{text-align:center;font-size:10.5px;opacity:.45;min-height:15px;padding-bottom:4px}


/* Le mot d accueil, quand on arrive ici parce qu on a des boosters qui
   attendent. Il est en haut et il est bref : sa seule tâche est de dire
   pourquoi on est là plutôt que sur l accueil. */
.annonce{margin:0 16px 10px;padding:11px 14px;border-radius:10px;
  background:linear-gradient(150deg,rgba(245,195,59,.2),rgba(245,195,59,.07));
  border:1px solid rgba(245,195,59,.42);color:var(--projo);
  font-family:var(--banner);font-size:14px;letter-spacing:.05em;text-align:center}
.titre{font-family:var(--banner);font-size:20px;letter-spacing:.14em;
  margin:0 0 10px;padding:0 16px}
/* --------------------------------------------- la révélation, en plein écran

   Elle vivait dans la page des Fanzzy, où son balisage n’est plus. Ici, il
   n’y avait **aucune règle** : or la première est `display:none`. Le panneau
   de révélation était donc affiché en permanence et sans mise en page, sous
   le kiosque — le « 1 / 5 — Fermer » qui traînait en bas de l’écran.

   Troisième fois que cette faute se produit : du balisage qu’on déplace, une
   feuille qu’on oublie. Rien ne lève, et le symptôme ne dit pas sa cause. */
/* ---------------------------------------------------------- ouverture */
#opener{position:absolute;inset:0;z-index:22;display:none;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 20%,#1D242D,#05070A 70%)}
#opener.on{display:flex}
.ohead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-size:11.5px;opacity:.6}
.ohead button{background:none;border:0;color:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.ostage{flex:1;display:grid;place-items:center;position:relative;padding:0 34px}
.reveal{width:min(70%,250px);position:absolute;transition:transform .42s cubic-bezier(.2,.8,.25,1),opacity .3s;cursor:pointer}
.reveal .flip{position:relative;width:100%;aspect-ratio:63/88;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.reveal.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4%}
/* Le dos porte le dessin de la série, posé bord à bord. Le dégradé et le
   triangle restent **dessous** : une série neuve dont le dos n'est pas encore
   dessiné s'ouvre quand même, avec l'ancien fond. */
.face.back{background:linear-gradient(160deg,#20262F,#0D1116) center/cover no-repeat;
  border:2px solid #39414E;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 18px 36px rgba(0,0,0,.6)}
.face.back.dessine>svg{display:none}
.face.front{transform:rotateY(180deg)}
.burst{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:30}
.newtag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:var(--banner);
  font-size:11px;letter-spacing:.2em;color:var(--projo)}
.ofoot{padding:14px 18px 26px;display:flex;flex-direction:column;gap:9px;align-items:center}
.hint{font-size:11.5px;opacity:.5}
.ghost{border:1px solid rgba(242,238,228,.28);border-radius:6px;padding:9px 18px;font-size:12.5px;
  background:none;color:inherit;cursor:pointer;font-family:inherit}
/* ------------------------------------------------------------- le butin

   Cinq vignettes collées au bas d'un écran aux trois quarts vide : c'était le
   dernier moment de la cérémonie, traité comme un pied de page. La scène
   vidée gardait six cents pixels de noir au-dessus.

   Les cartes prennent maintenant la place — trois en haut, deux en bas,
   centrées — et la scène s'efface quand le butin paraît. */
.summary{display:none;width:100%;flex:1 1 auto;min-height:0;
  align-content:center;justify-content:center;
  /* **Six** colonnes pour trois cartes par rangée : c'est ce qui permet de
     centrer la seconde rangée, incomplète, sans marge négative. Ma première
     version décalait les deux dernières à la main — et les éjectait du cadre,
     laissant une pastille « NOUVEAU » flotter seule sous la grille. */
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:14px 10px;padding:4px 12px}
.summary.on{display:grid}
.summary > *{grid-column:span 2}
.summary > :nth-child(4){grid-column:2 / span 2}
.summary > :nth-child(5){grid-column:4 / span 2}

/* L'arrivée en cascade. Elle ne dure que l'arrivée : une fois posées, les
   cartes ne bougent plus. Ce qui clignote en permanence cesse d'être remarqué
   en dix secondes — la leçon du personnage qui respirait derrière un onglet
   caché — et coûte de la batterie pour ça. */
.summary > *{
  animation:butin .42s cubic-bezier(.2,1.3,.4,1) backwards;
  animation-delay:calc(var(--n, 0) * 90ms);
}
@keyframes butin{
  from{opacity:0;transform:translateY(22px) scale(.88)}
  to{opacity:1;transform:none}
}

/* La lueur, **et seulement sur ce qui la mérite**. Une légendaire qui brille
   au milieu de quatre communes se voit ; cinq cartes qui brillent ensemble ne
   disent plus rien. */
.summary > .rare .fz{box-shadow:0 0 16px rgba(95,168,255,.28)}
.summary > .epique .fz{box-shadow:0 0 20px rgba(185,140,255,.34)}
.summary > .legendaire .fz{box-shadow:0 0 26px rgba(245,195,59,.45)}

/* Ce qu'on n'avait pas encore. C'est l'information que le joueur cherche en
   premier, et elle n'était nulle part : cinq cartes rangées, sans savoir
   lesquelles étaient neuves. */
.summary > .neuf{position:relative}
.summary > .neuf::after{
  /* À gauche, et non au centre : l'âge de la carte — « ÉVO 1 »,
     « LÉGENDAIRE » — occupe le coin droit depuis qu'il a été ajouté, et deux
     étiquettes qui se recouvrent n'en font lire aucune. */
  content:"NOUVEAU";position:absolute;top:-7px;left:6px;
  font-family:var(--banner);font-size:8.5px;letter-spacing:.16em;
  background:var(--projo);color:#0B0E13;border-radius:20px;padding:2px 7px;
  z-index:6;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* Le titre du butin. Il dit ce qu'on a eu avant qu'on ait compté. */
.butintitre{text-align:center;font-family:var(--banner);letter-spacing:.18em;
  font-size:13px;opacity:.75;padding:6px 0 2px}
.butintitre b{color:var(--projo)}

@media (prefers-reduced-motion:reduce){ .summary > *{animation:none} }

</style>
</head>
<body>
<main id="app">
  <h1 class="tbf-titre">LES BOOSTERS</h1>
  <div class="annonce" id="annonce" hidden></div>
  <section class="screen" id="s-kiosque">
    <div class="stage">
      <!-- Les séries ouvertes. Cachée tant qu'il n'y en a qu'une : un
           sélecteur à un seul choix n'est pas un choix, c'est un bandeau. -->
      <div class="series" id="series" hidden></div>
      <div class="setname" id="setName"></div>
      <div class="setline" id="setLine"></div>
      <div class="carousel" id="carousel"><div class="packglow"></div><div class="shadow"></div></div>
      <div class="packnav">
        <button id="prevSet">‹</button><div class="dots" id="setDots"></div><button id="nextSet">›</button>
      </div>
      <div class="tearhint" id="tearhint">GLISSE POUR CHANGER · TOUCHE POUR OUVRIR</div>
      <!-- Ce qui vient, en une ligne. Le kiosque montrait les huit séries
           verrouillées dans le carrousel : on glissait au milieu de ce qu'on ne
           peut pas ouvrir pour retrouver ce qu'on peut. Un jeu montre ce qui
           l'attend, il ne le met pas sur le chemin. -->
      <div class="avenir" id="avenir" hidden></div>
      <!-- L'annonce de la saison. Elle ne s'affiche qu'une fois par joueur :
           une annonce qu'on ne peut pas faire taire est une annonce qu'on
           apprend à ne plus lire, et la suivante ne le sera pas non plus. -->
      <div class="saison" id="saison" hidden>
        <button class="saison-x" id="saisonVu" aria-label="J’ai vu">✕</button>
        <p class="saison-n" id="saisonNum"></p>
        <h3 id="saisonNom"></h3>
        <p class="saison-t" id="saisonTxt"></p>
      </div>
    </div>
    <button class="cta tbf-plaque tbf-bloc" data-ton="flare" id="openBtn">OUVRIR LE BOOSTER</button>
    <div class="regen" id="regenTxt"></div>
  </section>

  <div class="tearzone" id="tearzone">
    <button class="tearquit" id="tearquit">Plus tard</button>
    <button class="tearpack" id="tearpack" type="button"
            aria-label="Déchire la bande du haut pour ouvrir le booster">
      <div class="art" id="tearart"></div>
      <div class="maw"></div>
      <div class="lip" id="tearlip"></div>
      <div class="seam"></div>
      <div class="grip"></div>
    </button>
    <div class="tearlbl" id="tearlbl">TIRE LA BANDE <b>EN TRAVERS DU HAUT</b></div>
  </div>

  <div id="opener">
    <video id="burst" muted playsinline preload="none"></video>
    <div class="flash" id="flash"></div>
    <div class="ohead"><span id="oProg">1 / 5</span><button id="oClose">Fermer</button></div>
    <div class="ostage" id="ostage"></div>
    <div class="butintitre" id="butinTitre" hidden></div>
    <div class="summary" id="summary"></div>
    <div class="ofoot"><div class="hint" id="oHint"></div><button class="ghost" id="oAction" style="display:none"></button></div>
  </div>

  <!-- La fiche d'un Fanzzy, montée par fanzzy-fiche.js par-dessus la grille. -->
  <div id="detail"></div>
  <div class="toast" id="toast"></div>
</main>

<script src="/fanzzy-art.js"></script>
<script src="/fanzzy-fond.js"></script>
<!-- Ce que le classeur et les boosters partagent : l état, le catalogue, le
     dessin d une carte. **Après** fanzzy-art.js, dont il lit FZART dès sa
     première ligne — l ordre n est pas un détail de mise en page. -->
<script src="/cartes.js"></script>
<!-- Les dessins de l’équipement : sans eux, une pièce tirée d’un booster
     s’affichait en silhouette procédurale, comme un Fanzzy sans visage.
     Il sert aussi aux écharpes, dont le dessin est rangé avec les gains. -->
<script src="/stuff-art.js"></script>
<!-- Et ceux des cartes d’action, qui n’étaient chargés nulle part ici : une
     carte d’action tirée d’un booster tombait donc sur la même silhouette
     grise que les écharpes, et deux cartes très différentes se ressemblaient
     trait pour trait au moment précis où on les découvre. -->
<script src="/action-art.js"></script>
<!-- Les douze états du Fanzzy équipé : c'est ce qui fait saluer le personnage
     sur l'écran « Mon Fanzzy », exactement comme sur l'accueil. Le module ne
     lève jamais et ne demande rien tant qu'on ne l'appelle pas. -->
<script src="/fanzzy-etats.js"></script>
<!-- La scène : les calques de gestes et le croisement des poses, partagés
     avec le virage. -->
<script src="/fanzzy-scene.js"></script>
<link rel="stylesheet" href="/fanzzy-fiche.css">
<!-- La fiche : le même rendu qu'à l'adresse /fanzzy/<id>, monté ici en
     panneau par-dessus la grille. -->
<script src="/fanzzy-fiche.js"></script>
<script>
/* Les aides communes viennent de /cartes.js — l'état, le catalogue, le dessin
   d'une carte. On les réalias ici pour que le code du kiosque soit exactement
   celui qu'il était quand il vivait dans la page des Fanzzy. */
const { $, AC, ACTES, ART, BY_ID, DEX, EVO_COST, ILLUSTRES, IMG_EXT, MAXP, PERSOS, RAR, S, SCARVES, SETS, SETS_TOUTES, STUFFS, TENUES, TYPES, api, art, artFond, artProcedural, audio, buzz, cardHTML, carteDuPaquet, chargerCatalogue, clamp, esc, illustration, load, modsText, objetHTML, packArt, rarMark, save, seeded, src, uid } = window.TBF_CARTES;

/* ------------------------------------------------------------ kiosque */

/**
 * Carrousel en perspective.
 *
 * Les paquets existent en permanence dans le DOM et ne font que se replacer :
 * on peut donc les faire glisser au doigt, avec la position qui suit le geste
 * en temps réel plutôt que de sauter d'une série à l'autre.
 */
/**
 * Combien de paquets on présente au choix.
 *
 * Dix, comme sur un présentoir. **Le paquet choisi ne change rien au tirage** :
 * les cartes sont tirées par le serveur à l'ouverture, et le numéro du paquet
 * ne lui est même pas envoyé. Le geste est là pour le geste — ouvrir un
 * booster est une cérémonie, et une cérémonie sans choix n'en est pas une.
 *
 * Le jour où ce choix influencerait le contenu, les joueurs s'en apercevraient
 * en quelques heures, un « paquet qui donne les légendaires » circulerait, et
 * il faudrait honorer une superstition qu'on aurait fabriquée soi-même.
 */
const PAQUETS_AU_CHOIX = 10;

/** Les séries que ce joueur peut ouvrir, dans l'ordre du catalogue. */
const seriesOuvertes = () => SETS.filter(serieDebloquee);

/**
 * L'éventail : dix paquets de la série choisie.
 *
 * Il présentait les neuf séries, dont huit verrouillées pour qui commence : on
 * glissait longuement au milieu de ce qu'on ne peut pas ouvrir. La série se
 * choisit maintenant sur les pastilles du dessus, et le carrousel ne sert plus
 * qu'à prendre **son** paquet.
 */
function buildCarousel() {
  const c = $('carousel');
  c.querySelectorAll('.slide').forEach((n) => n.remove());
  const set = SETS[S.set];
  if (!set) return;

  for (let i = 0; i < PAQUETS_AU_CHOIX; i++) {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.i = String(i);
    /* Une série sans visuel dessiné passe directement par `packArt`. On
       pourrait s'en remettre à `onerror`, et c'était le cas : ça coûtait une
       requête qui échoue et une erreur en console par paquet affiché, pour
       cinq séries sur douze depuis l'arrivée du lot neuf. */
    el.innerHTML = ART[set.id]
      ? `<img alt="" loading="lazy" decoding="async" src="${src(ART[set.id])}">
      <div class="foil"></div>`
      : `${packArt(set)}<div class="foil"></div>`;
    const img = el.querySelector('img');
    // Repli sur l'illustration dessinée si le visuel ne charge pas.
    if (img) img.onerror = () => { img.remove(); el.insertAdjacentHTML('afterbegin', packArt(set)); };
    c.appendChild(el);
  }
  placeCarousel(0);
}

function placeCarousel(drag = 0) {
  const w = 210;
  for (let i = 0; i < PAQUETS_AU_CHOIX; i++) {
    const el = $('carousel').querySelector(`.slide[data-i="${i}"]`);
    if (!el) continue;
    const off = i - (S.paquet ?? 0) - drag;
    const abs = Math.abs(off);
    el.style.transform =
      `translate(-50%,-50%) translateX(${off * w}px) translateZ(${-abs * 190}px) ` +
      `rotateY(${off * -26}deg) scale(${1 - abs * 0.06})`;
    el.style.zIndex = String(10 - Math.round(abs * 10));
    el.classList.toggle('center', abs < 0.5);
    el.classList.toggle('side', abs >= 0.5);
    el.classList.toggle('hidden', abs > 1.8);
  }
}

/**
 * Cette série est-elle ouverte ?
 *
 * Elle dépendait du joueur — `S.series`, tirée de son niveau. Elle ne dépend
 * plus que du jeu : une saison l'a ouverte, ou pas, et c'est pareil pour tout le
 * monde. `ouverte` vient de `/api/fanzzy/dex`, où le serveur la calcule.
 *
 * `s.ouverte === undefined` — une réponse d'avant le déploiement, servie depuis
 * un cache — vaut ouverte : on montre plutôt que de fermer par accident.
 */
const serieDebloquee = (s) => s?.ouverte !== false;

function tickRegen() {
  if (S.nextIn != null) S.nextIn = Math.max(0, S.nextIn - 1000);
  // La bourse vit dans la barre du haut (nav.js) depuis que toutes les pages
  // partagent le même bandeau. Le kiosque est l'écran qui la fait le plus
  // bouger : sans cette poussée, un joueur qui vient de dépenser quarante-cinq
  // écharpes les verrait encore affichées.
  /* La barre ne porte plus la bourse : le kiosque affiche son solde lui-même,
     dans la page où il sert à décider. */
  // Deux raisons de fermer le bouton, et elles ne se disent pas pareil : plus
  // de booster, ou série pas encore débloquée. Le libellé est posé par
  // `renderKiosque`, qui seul connaît la série affichée.
  /**
   * **L'achat aux écharpes était inatteignable.**
   *
   * Le bouton se fermait dès `packs <= 0`, et le client n'envoie `buy` que
   * dans ce cas précis : la seule situation où l'on paie était donc la seule
   * où le bouton ne répondait pas. L'écran proposait « ou 45 écharpes » pendant
   * qu'il restait des boosters gratuits — où le serveur consomme la réserve et
   * ne prélève rien — et se verrouillait à l'instant où payer aurait servi.
   *
   * Le serveur, lui, savait acheter depuis le premier jour. Il n'a jamais reçu
   * la demande.
   */
  const prix = Number(S.packPrice ?? 45);
  const payant = S.packs <= 0;
  const peutPayer = payant && Number(S.scarves ?? 0) >= prix;
  $('openBtn').disabled = !serieDebloquee(SETS[S.set] ?? {})
    || (payant && !peutPayer);
  const el = $('regenTxt');
  if (S.packs >= MAXP || S.nextIn == null) el.textContent = 'Réserve pleine';
  else if (S.nextIn <= 0) { el.textContent = 'Booster prêt'; load().catch(() => {}); }
  else {
    /* L'offre d'acheter n'a de sens que **quand la réserve est vide** : tant
       qu'il reste un booster gratuit, le serveur le consomme et ne prélève
       rien. L'annoncer plus tôt faisait croire à un choix qui n'existait pas. */
    el.textContent = `Booster suivant dans ${Math.floor(S.nextIn / 60000)}:` +
      `${String(Math.floor(S.nextIn % 60000 / 1000)).padStart(2, '0')}` +
      (S.packs <= 0 && Number(S.scarves ?? 0) >= prix
        ? ` · ou ${prix} écharpes tout de suite` : '');
  }
}

/**
 * L'annonce de la saison en cours.
 *
 * ## Pourquoi elle existe
 *
 * Les séries s'ouvraient au niveau du joueur : chacun découvrait le jeu seul, à
 * son rythme, et le jour où une série arrivait n'existait pour personne d'autre.
 * Il n'y avait donc rien à annoncer — seulement quelqu'un qui rattrape.
 *
 * Une saison ouvre pour tout le monde le même jour. C'est ce qui se dit, et
 * c'est ici qu'on le dit : sur l'écran où l'on vient chercher des cartes.
 *
 * ## Et pourquoi elle se ferme
 *
 * Une annonce qu'on ne peut pas faire taire est une annonce qu'on apprend à ne
 * plus lire — et la suivante ne le sera pas non plus. Le serveur retient donc la
 * dernière saison vue par ce joueur : la croix la ferme pour de bon, et elle ne
 * revient qu'au lancement de la suivante.
 */
function rendreSaison() {
  const n = $('saison');
  const s = S.saison;
  // Rien à annoncer, ou ce joueur l'a déjà vue.
  if (!s || S.saisonVue === s.id) { n.hidden = true; return; }
  n.hidden = false;
  $('saisonNum').textContent = `SAISON ${s.numero}`;
  $('saisonNom').textContent = s.nom;
  $('saisonTxt').textContent = s.texte ?? '';
}

$('saisonVu').onclick = async () => {
  /* On cache **avant** d'appeler. Le geste est sans conséquence — au pire
     l'annonce reviendra au prochain chargement — et le faire attendre le
     serveur donnerait une croix qui ne répond pas tout de suite. */
  $('saison').hidden = true;
  S.saisonVue = S.saison?.id ?? null;
  try { await api('/saison-vue', {}); } catch { /* elle reviendra, sans plus */ }
};

function renderKiosque() {
  /* La série affichée est toujours ouverte : le kiosque ne présente plus que
     ce qu'on peut ouvrir. Si le catalogue n'est pas encore arrivé,
     `serieDebloquee` rend vrai, et l'on montre tout plutôt qu'un écran vide. */
  const ouvertes = seriesOuvertes();
  if (ouvertes.length && !serieDebloquee(SETS[S.set] ?? {})) {
    S.set = SETS.indexOf(ouvertes[0]);
    S.paquet = 0;
    buildCarousel();
  }

  const s = SETS[S.set];
  if (!s) return;
  const ouvrable = serieDebloquee(s);

  /* Les pastilles de série. Cachées tant qu'il n'y en a qu'une : un sélecteur
     à un seul choix n'est pas un choix, c'est un bandeau. */
  const rangee = $('series');
  rangee.hidden = ouvertes.length < 2;
  rangee.innerHTML = ouvertes.map((o) => `<button data-serie="${esc(o.id)}"
    class="${o.id === s.id ? 'on' : ''}">${esc(o.nom)}</button>`).join('');

  /* Ce qui vient. Une ligne, discrète : c'est une promesse, pas une offre.

     Elle disait « au niveau 12 ». Elle ne le dit plus, et pas seulement parce
     que le niveau n'ouvre plus rien : **on ne connaît pas la date**. Une saison
     se lance quand l'administration la lance, et annoncer une échéance qu'on ne
     tiendra peut-être pas est pire que de n'en annoncer aucune. */
  const fermees = SETS_TOUTES.filter((x) => !serieDebloquee(x));
  const av = $('avenir');
  if (fermees.length) {
    av.hidden = false;
    av.innerHTML = `${fermees.length} série${fermees.length > 1 ? 's' : ''} `
      + `en attente d'une saison : <b>${esc(fermees.map((x) => x.nom).join(' · '))}</b>`;
  } else av.hidden = true;

  rendreSaison();

  $('setName').textContent = s.nom;
  /* Une série fermée se montre **verrouillée**, avec ce qu'elle attend. Le
     kiosque les proposait toutes sans distinction : le joueur en choisissait
     une, appuyait, et découvrait le refus après coup — sous la forme d'un code,
     « Ouverture impossible (fanzzy.error.set_locked) ». Un jeu ne cache pas ce
     qui vient, il le montre verrouillé.

     Une série ouverte dit **par quelle saison** elle est arrivée. C'est une
     petite chose et c'est tout le propos du changement : elle date l'entrée
     d'une série dans le jeu, et cette date est la même pour tout le monde. */
  $('setLine').innerHTML = ouvrable
    ? esc(`${DEX.filter((f) => f.set === s.id).length} Fanzzy · ${s.ligne}`
      + (s.saison ? ` · saison ${s.saison.numero}` : ''))
    : `<span class="verrou"><svg viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2.5"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Ouverte par une prochaine saison</span>`;
  $('carousel').classList.toggle('verrou', !ouvrable);
  /* Le prix est **sur le bouton**, pas à côté : c'est au moment d'appuyer qu'on
     décide de dépenser, et une ligne d'aide sous le pouce ne se lit pas. */
  const px = Number(S.packPrice ?? 45);
  $('openBtn').textContent = !ouvrable ? 'PAS ENCORE OUVERTE'
    : S.packs > 0 ? 'OUVRIR LE BOOSTER'
    : Number(S.scarves ?? 0) >= px ? `OUVRIR · ${px} ÉCHARPES`
    : `IL TE FAUT ${px} ÉCHARPES`;
  $('tearhint').textContent = 'CHOISIS TON PAQUET · TOUCHE POUR OUVRIR';
  /* Un point par paquet, pas par série : c'est le paquet qu'on choisit ici. */
  $('setDots').innerHTML = Array.from({ length: PAQUETS_AU_CHOIX },
    (_, i) => `<i class="${i === (S.paquet ?? 0) ? 'on' : ''}"></i>`).join('');
  placeCarousel(0);
  tickRegen();
}

/** Passer d'un paquet à l'autre. Le contenu ne change pas — voir la note de
    `PAQUETS_AU_CHOIX` — mais le geste, lui, est la moitié du plaisir. */
function goPaquet(delta) {
  S.paquet = ((S.paquet ?? 0) + delta + PAQUETS_AU_CHOIX) % PAQUETS_AU_CHOIX;
  audio.flip();
  renderKiosque();
}
$('prevSet').onclick = () => goPaquet(-1);
$('nextSet').onclick = () => goPaquet(1);

/** Changer de série depuis les pastilles. Le choix du paquet repart à zéro :
    ce sont d'autres paquets, il serait étrange de garder le neuvième. */
$('series').onclick = (e) => {
  const b = e.target.closest('[data-serie]');
  if (!b) return;
  const i = SETS.findIndex((x) => x.id === b.dataset.serie);
  if (i < 0 || i === S.set) return;
  S.set = i;
  S.paquet = 0;
  audio.flip();
  buildCarousel();
  renderKiosque();
};

/* Glissement au doigt : la position suit le geste, puis s'aimante. */
(() => {
  const c = $('carousel');
  let x0 = null, dragging = false;
  c.addEventListener('pointerdown', (e) => { x0 = e.clientX; dragging = false; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / 190;
    if (Math.abs(d) > 0.04) dragging = true;
    placeCarousel(-d);
  });
  const end = (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / 190;
    x0 = null;
    if (d < -0.28) goPaquet(1);
    else if (d > 0.28) goPaquet(-1);
    else { placeCarousel(0); if (!dragging) startTear(); }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', () => { x0 = null; placeCarousel(0); });
})();

$('openBtn').onclick = () => startTear();

/* ------------------------------------------------- le geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Un seul mouvement.

   **Ce qui précédait ne s'ouvrait pas.** Il fallait maintenir le doigt
   immobile pour « chauffer », puis tirer vers le bas sans avoir lâché — et la
   chauffe se comptait en *images*, pas en secondes : `charge += 0.02` à chaque
   `requestAnimationFrame`. Sur cette page, entre le carrousel, les lueurs qui
   respirent et le paquet qui tremble, le navigateur rend une douzaine
   d'images par seconde : la chauffe demandait quatre secondes de parfaite
   immobilité au lieu des huit dixièmes prévus, et le moindre relâchement
   remettait tout à zéro. Sur une machine rapide c'était instantané, sur une
   machine lente c'était impossible — et rien ne le disait.

   D'où les trois règles d'ici :

   - **Rien ne se compte en images.** L'avancée ne dépend que de la distance
     parcourue par le doigt. Une page à cinq images par seconde déchire
     exactement comme une page à cent vingt.
   - **Rien ne se perd sans se voir.** Lâcher trop tôt ne remet pas un compteur
     invisible à zéro : la bande revient élastiquement à sa place, et on voit
     ce qu'on a perdu.
   - **On peut toujours sortir.** « Plus tard » et Échap referment, Entrée
     ouvre sans le geste. Un plein écran dont on ne peut s'échapper qu'en
     réussissant un geste est un piège, et c'en était un : la seule issue était
     de recharger la page.                                                    */

const SEUIL_DECHIRURE = 0.72;   // au-delà, le sachet est ouvert, on ne revient pas
let tear = null;

function startTear() {
  if (S.packs <= 0) return;
  const set = SETS[S.set];
  const el = $('tearpack');

  /* Le repli est dessiné deux fois plutôt que cloné : `packArt` numérote ses
     dégradés, et deux copies du même nœud porteraient les mêmes identifiants —
     la seconde volerait les couleurs de la première. */
  const dessiner = () => {
    $('tearart').innerHTML = packArt(set);
    $('tearlip').innerHTML = packArt(set);
  };

  /* Même règle qu'au carrousel : une série sans visuel dessiné va droit au
     repli, sans passer par une requête qui échoue. Cinq séries sur douze sont
     dans ce cas depuis l'arrivée du lot neuf, et attendre l'`onerror` coûtait
     une erreur en console à chaque ouverture. */
  if (!ART[set.id]) {
    dessiner();
  } else {
    // Le dessin du paquet, et sa copie pour la bande. `cloneNode` plutôt qu'un
    // second chargement : le repli SVG n'a pas d'URL à recharger, et une image
    // déjà décodée ne clignote pas.
    const art = document.createElement('img');
    art.src = src(ART[set.id]);
    art.alt = '';
    art.onerror = dessiner;
    art.onload = () => $('tearlip').replaceChildren(art.cloneNode(true));
    $('tearart').replaceChildren(art);
    $('tearlip').replaceChildren();
  }

  el.style.setProperty('--p', '0');
  el.classList.remove('tire');
  $('tearlbl').innerHTML = 'TIRE LA BANDE <b>EN TRAVERS DU HAUT</b>';
  $('tearzone').classList.add('on');
  el.focus({ preventScroll: true });
  tear = { p: 0, base: 0, x0: 0, pointeur: null, tic: -1, ratees: 0, fini: false };
  audio.ready();
}

function fermerTear() {
  $('tearzone').classList.remove('on');
  $('tearpack').classList.remove('tire');
  tear = null;
}

/** Pose l'avancée, et fait le bruit et la vibration qui vont avec. */
function poser(v) {
  tear.p = v;
  $('tearpack').style.setProperty('--p', String(v));
  // Un cran de bruit tous les neuf pour cent : le son suit la main plutôt que
  // l'horloge, donc déchirer lentement fait un long crissement.
  const tic = Math.floor(v / 0.09);
  if (tic > tear.tic) {
    tear.tic = tic;
    audio.rip(0.22 + v * 0.5);
    buzz(7);
  }
  if (v > 0.12 && !tear.encourage) {
    tear.encourage = true;
    $('tearlbl').innerHTML = 'ENCORE — <b>NE LÂCHE PAS</b>';
  }
}

(() => {
  const el = $('tearpack');

  el.addEventListener('pointerdown', (e) => {
    if (!tear || tear.fini) return;
    tear.pointeur = e.pointerId;
    tear.x0 = e.clientX;
    tear.base = tear.p;
    el.classList.add('tire');
    el.setPointerCapture(e.pointerId);
    audio.ready();
  });

  el.addEventListener('pointermove', (e) => {
    if (!tear || tear.fini || tear.pointeur !== e.pointerId) return;
    // `abs` : on déchire de droite à gauche comme de gauche à droite. La
    // languette est à droite, mais un gaucher tire dans l'autre sens et rien
    // ne justifie de le lui refuser.
    const large = el.getBoundingClientRect().width || 210;
    const v = clamp(tear.base + Math.abs(e.clientX - tear.x0) / (large * 0.8), 0, 1);
    poser(v);
    if (v >= SEUIL_DECHIRURE) doOpen();
  });

  const lacher = () => {
    if (!tear || tear.fini || tear.pointeur === null) return;
    tear.pointeur = null;
    tear.tic = -1;
    tear.encourage = false;
    el.classList.remove('tire');     // rend la transition : la bande revient
    poser(0);
    tear.ratees++;
    // Au deuxième essai manqué, on cesse de laisser deviner. Quelqu'un qui n'y
    // arrive pas deux fois n'y arrivera pas à la troisième par insistance : ou
    // le geste ne passe pas sur son appareil, ou il ne peut pas le faire.
    $('tearlbl').innerHTML = 'LA BANDE EST REVENUE. <b>REPRENDS PAR LA LANGUETTE</b>'
      + (tear.ratees >= 2
        ? '<small>Ou appuie sur Entrée pour ouvrir sans le geste.</small>' : '');
  };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);

  /* Le paquet est un vrai `<button>` : Entrée et Espace l'ouvrent. C'est
     l'accès au clavier, et c'est du même coup la sortie de secours de qui ne
     peut pas faire le geste — une seule mécanique, deux services.

     `detail === 0` distingue le clic du clavier de celui de la souris : un
     glissement se termine aussi par un `click`, et sans ce filtre le sachet
     s'ouvrirait deux fois. */
  el.addEventListener('click', (e) => {
    if (!tear || tear.fini || e.detail !== 0) return;
    poser(1);
    doOpen();
  });
})();

$('tearquit').onclick = () => fermerTear();
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && tear && !tear.fini) { e.preventDefault(); fermerTear(); }
});

function doOpen() {
  if (!tear || tear.fini) return;
  tear.fini = true;
  const el = $('tearpack');
  el.classList.remove('tire');
  el.style.setProperty('--p', '1');
  audio.rip(1.4);
  buzz([40, 30, 90]);
  $('flash').classList.add('go');
  setTimeout(() => $('flash').classList.remove('go'), 520);
  setTimeout(() => {
    fermerTear();
    openPack();
  }, 320);
}

let pull = [], idx = 0, fresh = new Set();

async function openPack() {
  const setId = SETS[S.set].id;
  let res;
  try {
    // `buy` autorise le serveur à prélever des écharpes s'il ne reste aucun
    // booster gratuit. Il refuse proprement si le solde ne suffit pas.
    res = await api('/open', { set: setId, buy: S.packs <= 0 });
  } catch (e) {
    // Un message vague fait perdre des heures. Quand le serveur sait pourquoi,
    // on le dit.
    toast(({
      'fanzzy.error.no_packs': 'Plus de booster',
      'fanzzy.error.not_enough_scarves': 'Pas assez d\u2019écharpes',
      'fanzzy.error.unknown_set': 'Série inconnue',
      // Le filet de sécurité : le kiosque n'est plus censé proposer une série
      // hors de portée, mais un onglet resté ouvert depuis avant une fermeture
      // peut encore la demander. Le refus doit alors nommer sa cause — c'est ce
      // code brut, affiché tel quel, qui a fait remonter la panne.
      /* `set_locked` n'est plus émis : il disait « au-dessus de ton niveau », et
         le niveau n'ouvre plus de séries. La traduction reste le temps qu'un
         onglet ouvert depuis avant le déploiement finisse sa session — sans
         elle, ce joueur-là verrait un code brut. */
      'fanzzy.error.set_locked': 'Cette série attend une saison',
      'fanzzy.error.set_closed': 'Cette série attend une saison pour s’ouvrir',
      'fanzzy.error.schema': 'Base de données incomplète — voir la console',
    })[e.code] ?? `Ouverture impossible (${e.code ?? 'sans code'})`);
    if (e.code === 'fanzzy.error.schema') console.error('[fanzzy]', e.detail ?? e.message);
    return;
  }

  /* Les quatre sortes de cartes, converties par `carteDuPaquet` — qui vit
     dans `cartes.js` depuis que l'accueil rend les mêmes. Deux tables pour la
     même conversion auraient divergé, et c'est exactement ce qui est arrivé au
     catalogue recopié. */
  pull = res.cards.map(carteDuPaquet);

  // Une carte que le serveur tire mais que cette page ne connaît pas arrivait
  // ici comme `undefined`, et cassait l'ouverture sans rien dire — c'est ce
  // qui s'est produit quand la lignée du Gamin de Devant manquait au
  // catalogue recopié plus haut. On la retire et on nomme la cause : mieux
  // vaut un booster amputé et un message clair qu'un écran figé.
  //
  // `=== 'fanzzy'` et non `!== 'skin'` : les trois autres types ont désormais
  // leur catalogue et se replient sur leur identifiant. Les compter comme
  // inconnues faisait jeter des cartes parfaitement valides.
  const inconnues = res.cards
    .filter((c, i) => c.type === 'fanzzy' && !pull[i])
    .map((c) => c.id);
  if (inconnues.length) {
    pull = pull.filter(Boolean);
    console.error('[fanzzy] catalogue de la page en retard sur le serveur :', inconnues);
    toast(`Carte inconnue de cette version : ${inconnues.join(', ')}. Recharge la page.`);
  }
  idx = 0; fresh.clear();
  for (const c of res.cards) {
    if (c.new) fresh.add(c.id);
    // La collection ne compte que des supporters. Une pièce d'équipement rangée
    // ici gonflait la progression du classeur d'une case qui n'existe pas.
    if (c.type === 'fanzzy') S.col[c.id] = (S.col[c.id] ?? 0) + 1;
    // Une poignée d'écharpes n'est « neuve » pour personne : la marquer
    // ferait clignoter un NOUVEAU sur de la monnaie.
    if (c.type === 'echarpes') fresh.delete('echarpes');
  }
  S.scarves = res.wallet.scarves;
  S.packs = res.wallet.packs;
  S.nextIn = res.wallet.nextPackInMs;
  S.lastGain = res.scarvesGained;
  tickRegen();

  const st = $('ostage'); st.innerHTML = '';
  /* **Le dos, c'est celui du sachet — pas celui de la carte.** La nuance
     compte : montrer la série de la carte qu'on tient renseignerait sur elle
     avant de la retourner, et un booster n'a plus rien à révéler si son dos
     l'a déjà dit. Le sachet, lui, on l'a choisi soi-même une seconde plus
     tôt. */
  const dosDuSachet = window.FZART?.dos?.((SETS[S.set] ?? {}).id);
  pull.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'reveal'; el.style.zIndex = 20 - i;
    el.style.transform = `translateY(${i * 7}px) scale(${1 - i * .03})`;
    el.innerHTML = `<div class="flip">
      <div class="face back${dosDuSachet ? ' dessine' : ''}"${dosDuSachet
        ? ` style="background-image:url('${dosDuSachet}')"` : ''}><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#39414E" stroke-width="1.4"><path d="M3 20l9-16 9 16z"/><path d="M7 20l5-9 5 9"/></svg></div>
      <div class="face front">${cardHTML(f)}</div></div>`;
    st.appendChild(el);
  });
  $('summary').classList.remove('on');
  $('butinTitre').hidden = true;
  // La scène était repliée par le récapitulatif du paquet précédent.
  $('ostage').style.display = '';
  $('oAction').style.display = 'none';
  $('oHint').textContent = 'Touche la carte pour la retourner';
  $('oProg').textContent = `1 / ${pull.length}`;
  $('opener').classList.add('on');
}

$('ostage').onclick = () => {
  const cards = [...$('ostage').children];
  const cur = cards[idx];
  if (!cur) return;
  if (!cur.classList.contains('flipped')) {
    cur.classList.add('flipped');
    const f = pull[idx];
    if (fresh.has(f.id)) {
      const tag = document.createElement('div');
      tag.className = 'newtag'; tag.textContent = 'NOUVEAU';
      cur.appendChild(tag);
    }
    audio.flip();
    buzz(12);
    if (['epique','legendaire'].includes(f.rar)) {
      window.FX?.rare(f.rar, cur);
      burst(TYPES[f.type].c, f.rar === 'legendaire' ? 34 : 22);
      audio.chime(f.rar);
      // La vidéo n'est chargée qu'ici, à la première carte rare de la session :
      // une gerbe d'étincelles ne doit pas peser sur le premier affichage.
      if (f.rar === 'legendaire') playBurstVideo(true);
      if (f.rar === 'legendaire') { audio.roar(); document.getElementById('app').classList.add('quake'); 
        setTimeout(() => document.getElementById('app').classList.remove('quake'), 700); }
    }
    $('oHint').textContent = idx < 4 ? 'Touche encore pour la suivante' : 'Touche pour le récapitulatif';
    $('oAction').style.display = idx < 4 ? 'block' : 'none';
    $('oAction').textContent = 'Tout révéler';
  } else {
    cur.style.transform = 'translateX(-130%) rotate(-14deg)';
    cur.style.opacity = '0';
    if (++idx >= 5) return finishPack();
    $('oProg').textContent = `${idx + 1} / ${pull.length}`;
    cards.forEach((el, i) => { if (i >= idx) el.style.transform = `translateY(${(i - idx) * 7}px) scale(${1 - (i - idx) * .03})`; });
    $('oHint').textContent = 'Touche la carte pour la retourner';
  }
};
$('oAction').onclick = () => finishPack();
$('oClose').onclick = () => { $('opener').classList.remove('on'); renderKiosque(); };

function finishPack() {
  $('ostage').innerHTML = '';
  /* La scène vidée gardait six cents pixels de noir au-dessus du butin. On la
     replie : la grille prend la place, et c'est elle qu'on est venu voir. */
  $('ostage').style.display = 'none';
  $('oProg').textContent = `${pull.length} / ${pull.length}`;
  const gained = S.lastGain ?? 0;
  $('oHint').textContent = gained
    ? `Rangées dans le classeur · +${gained} écharpes en doublons`
    : 'Rangées dans le classeur';
  $('burst').classList.remove('on');

  /* Ce qu'on n'avait pas encore. C'est ce que le joueur cherche en premier, et
     ce n'était écrit nulle part : cinq cartes rangées, sans savoir lesquelles
     étaient neuves. `fresh` est rempli à la révélation, carte par carte. */
  const neuves = pull.filter((f) => fresh.has(f.id)).length;
  const t = $('butinTitre');
  t.hidden = false;
  /* Quatre cas, quatre phrases. Coller un « TOUT » invariable devant un accord
     au féminin pluriel donnait « TOUT NOUVELLES DANS LE CLASSEUR » — et une
     phrase bancale sur l'écran le plus regardé du jeu se remarque tout de
     suite. */
  t.innerHTML =
    neuves === 0 ? 'AUCUNE NOUVELLE — QUE DES DOUBLONS'
      : neuves === pull.length ? 'TOUTES NOUVELLES DANS LE CLASSEUR'
        : neuves === 1 ? `<b>1</b> NOUVELLE SUR ${pull.length}`
          : `<b>${neuves}</b> NOUVELLES SUR ${pull.length}`;

  const sum = $('summary');
  /* `--n` porte le rang : c'est lui qui échelonne l'arrivée. Le faire en CSS
     plutôt qu'avec cinq minuteries évite qu'une carte reste invisible si la
     page se fige une demi-seconde au mauvais moment. */
  sum.innerHTML = pull.map((f, i) =>
    `<div data-i="${i}" style="--n:${i}" class="${esc(f.rar ?? '')}${
      fresh.has(f.id) ? ' neuf' : ''}">${cardHTML(f, { mini:true })}</div>`).join('');
  sum.classList.add('on');
  sum.onclick = (e) => {
    const d = e.target.closest('[data-i]');
    // On ferme l'écran d'ouverture d'abord : la fiche se pose par-dessus la
    // grille, pas par-dessus un booster à moitié déchiré.
    if (!d) return;
    $('opener').classList.remove('on');
    /* `renderKiosque` et non `renderDex` : le classeur n'est pas sur cette
       page. L'ancien appel levait **avant** `ouvrirFiche`, et toucher une carte
       du butin se contentait donc de fermer l'écran. */
    renderKiosque();
    ouvrirFiche(pull[+d.dataset.i].id);
  };
  const a = $('oAction');
  a.style.display = 'block'; a.textContent = 'Terminer';
  a.onclick = () => {
    $('opener').classList.remove('on');
    a.onclick = () => finishPack();
    renderKiosque();
  };
  /* `renderKiosque` redessine le compte de boosters, l'état du bouton et le
     compte à rebours — tout ce qui vient de changer. L'ancien `renderDex`
     levait ici, donc `tickRegen` n'était jamais atteint et le kiosque restait
     sur ses valeurs d'avant l'ouverture. */
  renderKiosque();
}

/** Superpose la gerbe d'étincelles en mode « screen » : seul ce qui brille apparaît. */
function playBurstVideo(long) {
  const v = $('burst');
  if (!ART.burst) return;
  if (!v.src) { v.src = ART.burst; v.load(); }
  v.currentTime = 0;
  v.classList.add('on');
  v.play?.().catch(() => {});
  clearTimeout(v._t);
  v._t = setTimeout(() => { v.classList.remove('on'); v.pause?.(); }, long ? 3200 : 2000);
}

function burst(color, n) {
  const st = $('ostage'), r = st.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'burst';
    p.style.background = i % 3 ? color : '#FFF3D0';
    p.style.left = r.width / 2 + 'px'; p.style.top = r.height / 2 + 'px';
    st.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 130;
    p.animate([{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
               { transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`, opacity:0 }],
      { duration:700 + Math.random() * 500, easing:'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => p.remove();
  }
}


/* ---------------------------------------------------------------- init */

/* Le kiosque se redessine quand la bourse change — c est  qui le dit,
   sans savoir qui écoute. */
addEventListener("tbf:bourse", () => { renderKiosque(); tickRegen(); });
setInterval(tickRegen, 1000);

(async () => {
  await chargerCatalogue();
  await load();
  renderKiosque();
  buildCarousel();
  tickRegen();

  /* Le mot d'accueil. Quelqu'un qui arrive ici parce qu'il a des boosters à
     ouvrir doit lire pourquoi il y est : sans cette phrase, la redirection
     depuis la connexion a l'air d'une erreur de navigation. */
  const n = S.packs ?? 0;
  if (n > 0 && new URLSearchParams(location.search).has('aouvrir')) {
    const a = document.getElementById('annonce');
    a.textContent = n === 1
      ? 'Tu as 1 booster à ouvrir.'
      : `Tu as ${n} boosters à ouvrir.`;
    a.hidden = false;
  }
})();
</script>
