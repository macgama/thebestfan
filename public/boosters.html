     séries, les deux nombres ne disent pas la même chose (la saison, la
     série) et restent. */
  const lignees = PERSOS.filter((f) => f.set === s.id).length;
  const ids = idsDeSaison();
  const dejaCompte = !$('saisonCompte').hidden && ids.length === 1 && ids[0] === s.id;
  $('setName').textContent = s.nom;
  $('setCompte').textContent = !ouvrable ? ' · pas encore ouverte'
    : lignees && !dejaCompte ? ` · ${lignees} Fanzzy` : '';
  $('carousel').classList.toggle('verrou', !ouvrable);
  /* La fumée de la série : sa couleur, éclaircie pour qu'elle se voie sur le
     béton (la fumée éclaire ce qui est derrière elle, une couleur sombre n'y
     ferait rien). */
  const f = $('kfumee');
  f.style.setProperty('--e1', s.c1 ?? '');
  f.style.setProperty('--e2', window.FX?.lisible?.(s.c1) ?? s.c1 ?? '');

  /* La bâche principale (et sa remplaçante verte) : `rendreGeste`, appelé
     par `tickRegen` juste après — le prix n'y est écrit que si elle est le
     seul achat de l'écran. */
  placeCarousel(0);
  rendreReserve();
  tickRegen();
}

/** Passer d'un paquet à l'autre. Le contenu ne change pas — voir la note de
    `PAQUETS_AU_CHOIX` — mais le geste, lui, est la moitié du plaisir. */
function goPaquet(delta) {
  S.paquet = ((S.paquet ?? MILIEU) + delta + PAQUETS_AU_CHOIX) % PAQUETS_AU_CHOIX;
  audio.flip();
  renderKiosque();
}
$('prevSet').onclick = () => goPaquet(-1);
$('nextSet').onclick = () => goPaquet(1);

/** Changer de série depuis les pastilles. Le choix du paquet revient au
    milieu : ce sont d'autres paquets. */
$('series').onclick = (e) => {
  const b = e.target.closest('[data-serie]');
  if (!b) return;
  const i = SETS.findIndex((x) => x.id === b.dataset.serie);
  if (i < 0 || i === S.set) return;
  S.set = i;
  S.paquet = MILIEU;
  audio.flip();
  buildCarousel();
  renderKiosque();
};

/* Glissement au doigt : la position suit le geste, puis s'aimante. */
(() => {
  const c = $('carousel');
  let x0 = null, dragging = false;
  c.addEventListener('pointerdown', (e) => { x0 = e.clientX; dragging = false; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / ecartDesPaquets();
    if (Math.abs(d) > 0.04) dragging = true;
    placeCarousel(-d);
  });
  const end = (e) => {
    if (x0 === null) return;
    const d = (e.clientX - x0) / ecartDesPaquets();
    x0 = null;
    if (d < -0.28) goPaquet(1);
    else if (d > 0.28) goPaquet(-1);
    else { placeCarousel(0); if (!dragging) ouvrirDepuisLaBache(); }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', () => { x0 = null; placeCarousel(0); });
})();

$('openBtn').onclick = () => ouvrirDepuisLaBache();

/* ------------------------------------------------- le geste d'ouverture

   On déchire la bande du haut, comme un vrai sachet : on saisit la languette
   et on tire en travers. Un seul mouvement.

   **Ce qui précédait ne s'ouvrait pas.** Il fallait maintenir le doigt
   immobile pour « chauffer », puis tirer vers le bas sans avoir lâché — et la
   chauffe se comptait en *images*, pas en secondes : `charge += 0.02` à chaque
   `requestAnimationFrame`. Sur cette page, entre le carrousel, les lueurs qui
   respirent et le paquet qui tremble, le navigateur rend une douzaine
   d'images par seconde : la chauffe demandait quatre secondes de parfaite
   immobilité au lieu des huit dixièmes prévus, et le moindre relâchement
   remettait tout à zéro. Sur une machine rapide c'était instantané, sur une
   machine lente c'était impossible — et rien ne le disait.

   D'où les trois règles d'ici :

   - **Rien ne se compte en images.** L'avancée ne dépend que de la distance
     parcourue par le doigt. Une page à cinq images par seconde déchire
     exactement comme une page à cent vingt.
   - **Rien ne se perd sans se voir.** Lâcher trop tôt ne remet pas un compteur
     invisible à zéro : la bande revient élastiquement à sa place, et on voit
     ce qu'on a perdu.
   - **On peut toujours sortir.** « Plus tard » et Échap referment, Entrée
     ouvre sans le geste. Un plein écran dont on ne peut s'échapper qu'en
     réussissant un geste est un piège, et c'en était un : la seule issue était
     de recharger la page.                                                    */

const SEUIL_DECHIRURE = 0.72;   // au-delà, le sachet est ouvert, on ne revient pas
let tear = null;

function startTear() {
  /* La même règle que celle du bouton, et par le même chemin. Elle disait
     `S.packs <= 0` : le geste mourait ici, en silence, dans le seul cas où le
     joueur venait de décider de payer. */
  if (!peutOuvrir()) return;
  const set = SETS[S.set];
  const el = $('tearpack');

  /* Le repli est dessiné deux fois plutôt que cloné : `packArt` numérote ses
     dégradés, et deux copies du même nœud porteraient les mêmes identifiants —
     la seconde volerait les couleurs de la première. */
  const dessiner = () => {
    $('tearart').innerHTML = packArt(set);
    $('tearlip').innerHTML = packArt(set);
  };

  /* Même règle qu'au carrousel : une série sans visuel dessiné va droit au
     repli, sans passer par une requête qui échoue. Cinq séries sur douze sont
     dans ce cas depuis l'arrivée du lot neuf, et attendre l'`onerror` coûtait
     une erreur en console à chaque ouverture. */
  if (!ART[set.id]) {
    dessiner();
  } else {
    // Le dessin du paquet, et sa copie pour la bande. `cloneNode` plutôt qu'un
    // second chargement : le repli SVG n'a pas d'URL à recharger, et une image
    // déjà décodée ne clignote pas.
    const art = document.createElement('img');
    art.src = src(ART[set.id]);
    art.alt = '';
    art.onerror = dessiner;
    art.onload = () => $('tearlip').replaceChildren(art.cloneNode(true));
    $('tearart').replaceChildren(art);
    $('tearlip').replaceChildren();
  }

  el.style.setProperty('--p', '0');
  el.classList.remove('tire');
  $('tearlbl').innerHTML = 'TIRE LA BANDE <b>EN TRAVERS DU HAUT</b>';
  $('tearzone').classList.add('on');
  el.focus({ preventScroll: true });
  tear = { p: 0, base: 0, x0: 0, pointeur: null, tic: -1, ratees: 0, fini: false };
  audio.ready();
}

function fermerTear() {
  $('tearzone').classList.remove('on');
  $('tearpack').classList.remove('tire');
  tear = null;
}

/** Pose l'avancée, et fait le bruit et la vibration qui vont avec. */
function poser(v) {
  tear.p = v;
  $('tearpack').style.setProperty('--p', String(v));
  // Un cran de bruit tous les neuf pour cent : le son suit la main plutôt que
  // l'horloge, donc déchirer lentement fait un long crissement.
  const tic = Math.floor(v / 0.09);
  if (tic > tear.tic) {
    tear.tic = tic;
    audio.rip(0.22 + v * 0.5);
    buzz(7);
  }
  if (v > 0.12 && !tear.encourage) {
    tear.encourage = true;
    $('tearlbl').innerHTML = 'ENCORE — <b>NE LÂCHE PAS</b>';
  }
}

(() => {
  const el = $('tearpack');

  el.addEventListener('pointerdown', (e) => {
    if (!tear || tear.fini) return;
    tear.pointeur = e.pointerId;
    tear.x0 = e.clientX;
    tear.base = tear.p;
    el.classList.add('tire');
    el.setPointerCapture(e.pointerId);
    audio.ready();
  });

  el.addEventListener('pointermove', (e) => {
    if (!tear || tear.fini || tear.pointeur !== e.pointerId) return;
    // `abs` : on déchire de droite à gauche comme de gauche à droite. La
    // languette est à droite, mais un gaucher tire dans l'autre sens et rien
    // ne justifie de le lui refuser.
    const large = el.getBoundingClientRect().width || 210;
    const v = clamp(tear.base + Math.abs(e.clientX - tear.x0) / (large * 0.8), 0, 1);
    poser(v);
    if (v >= SEUIL_DECHIRURE) doOpen();
  });

  const lacher = () => {
    if (!tear || tear.fini || tear.pointeur === null) return;
    tear.pointeur = null;
    tear.tic = -1;
    tear.encourage = false;
    el.classList.remove('tire');     // rend la transition : la bande revient
    poser(0);
    tear.ratees++;
    // Au deuxième essai manqué, on cesse de laisser deviner. Quelqu'un qui n'y
    // arrive pas deux fois n'y arrivera pas à la troisième par insistance : ou
    // le geste ne passe pas sur son appareil, ou il ne peut pas le faire.
    $('tearlbl').innerHTML = 'LA BANDE EST REVENUE. <b>REPRENDS PAR LA LANGUETTE</b>'
      + (tear.ratees >= 2
        ? '<small>Ou appuie sur Entrée pour ouvrir sans le geste.</small>' : '');
  };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);

  /* Le paquet est un vrai `<button>` : Entrée et Espace l'ouvrent. C'est
     l'accès au clavier, et c'est du même coup la sortie de secours de qui ne
     peut pas faire le geste — une seule mécanique, deux services.

     `detail === 0` distingue le clic du clavier de celui de la souris : un
     glissement se termine aussi par un `click`, et sans ce filtre le sachet
     s'ouvrirait deux fois. */
  el.addEventListener('click', (e) => {
    if (!tear || tear.fini || e.detail !== 0) return;
    poser(1);
    doOpen();
  });
})();

$('tearquit').onclick = () => fermerTear();
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && tear && !tear.fini) { e.preventDefault(); fermerTear(); }
});

function doOpen() {
  if (!tear || tear.fini) return;
  tear.fini = true;
  const el = $('tearpack');
  el.classList.remove('tire');
  el.style.setProperty('--p', '1');
  audio.rip(1.4);
  buzz([40, 30, 90]);
  $('flash').classList.add('go');
  setTimeout(() => $('flash').classList.remove('go'), 520);
  setTimeout(() => {
    fermerTear();
    openPack();
  }, 320);
}

let pull = [], idx = 0;

/* Pour chaque carte, dans l'ordre de `pull` : est-elle neuve ?

   **Par rang, et non par identifiant.** La nouveauté était retenue dans un
   ensemble d'identifiants : un booster qui contenait deux exemplaires d'une
   même carte neuve les marquait NOUVEAU tous les deux, alors que le serveur
   rend le second comme un doublon (`new: false`, payé en écharpes). La même
   carte portait NOUVEAU et « +1 », le titre comptait quatre nouvelles pour
   trois, et la révélation tamponnait deux fois. Le serveur dit carte par
   carte ce qui est neuf : on le lit carte par carte. Une poignée d'écharpes
   n'est neuve pour personne. */
let neuf = [];
const estNeuve = (c) => c?.new === true && c.type !== 'echarpes' && c.type !== 'scarves';

/* Pour chaque carte du paquet, dans l'ordre de `pull` : a-t-elle rapporté des
   écharpes ? C'est **d'où** partent celles qui volent vers le compteur à la
   fin ; **combien**, seul le total du serveur le dit (`scarvesGained`).

   La règle est celle du serveur, à l'ouverture : un Fanzzy ou une pièce qu'on
   avait déjà se change en écharpes, une poignée d'écharpes est une carte à
   part, et le reste ne rapporte rien. */
let rapportent = [];
/* Et combien chacune, pour le sticker de prix de sa case d'album. La page le
   recompte avec le barème du catalogue (`SCARVES`) ; elle ne l'écrit que si
   son compte retombe exactement sur le total du serveur — un doublon dont on
   se tromperait d'une écharpe raconterait un gain qui n'a pas eu lieu. */
let montants = [];
let montantsSurs = false;
/* Vrai entre l'ouverture d'un paquet et le versement de ses doublons au
   compteur — voir `crediterDoublons`, qui le consomme. */
let doublonsAVerser = false;
const rapporte = (c) => c?.type === 'echarpes' || c?.type === 'scarves'
  || ((c?.type === 'fanzzy' || c?.type === 'stuff' || c?.type === 'lieu') && c.new === false);
function montantDe(c) {
  if (c?.type === 'echarpes' || c?.type === 'scarves') return Number(c.montant ?? c.amount) || 0;
  if (c?.new !== false) return 0;
  if (c.type === 'fanzzy') return Number(SCARVES[BY_ID.get(c.id)?.rar]) || 0;
  // Le serveur rend une écharpe pour une pièce dont la rareté lui échappe.
  if (c.type === 'stuff') return Number(SCARVES[STUFFS.get(c.id)?.rar]) || 1;
  if (c.type === 'lieu') return Number(SCARVES[LIEUX?.get(c.id)?.rar]) || 1;
  return 0;
}

/** Les quatre raretés, et leur mot sur le sticker en forme. */
const MOT = { commune: 'COMMUNE', rare: 'RARE', epique: 'ÉPIQUE', legendaire: 'LÉGENDAIRE' };
const rareteDe = (f) => (MOT[f?.rar] ? f.rar : 'commune');

/**
 * La ligne vivante de la série touchée par ce booster : « LA REPRISE 4 → 6 /
 * 11 ».
 *
 * Celle du serveur d'abord (`series`, contrat § 2.3) : il compte les lignées
 * obtenables, comme la jauge de la collection. `[]` : le booster n'avait pas
 * de personnage, pas de ligne. Absente (un serveur d'avant, ou un calcul qui
 * a échoué), la page la compte elle-même sur son catalogue et la collection
 * d'avant l'ouverture. Une série nommée est celle du sachet, sinon la
 * première touchée.
 */
function ligneDeSerie(res, setId, colAvant) {
  if (Array.isArray(res.series)) {
    if (!res.series.length) return null;
    const s = res.series.find((x) => x.id === setId) ?? res.series[0];
    const total = Number(s.total), avant = Number(s.avant), apres = Number(s.apres);
    if (!(total > 0) || !Number.isFinite(avant) || !Number.isFinite(apres)) return null;
    return { id: s.id, avant, apres, total, complete: s.complete === true };
  }
  const touchees = new Set(res.cards.filter((c) => c.type === 'fanzzy')
    .map((c) => BY_ID.get(c.id)?.set).filter(Boolean));
  if (!touchees.size) return null;
  const id = touchees.has(setId) ? setId : [...touchees][0];
  const lignees = PERSOS.filter((f) => f.set === id);
  if (!lignees.length) return null;
  const compte = (col) => lignees.filter((f) => col?.[f.id]).length;
  const avant = compte(colAvant), apres = compte(S.col), total = lignees.length;
  return { id, avant, apres, total, complete: avant < total && apres === total };
}

/* La cérémonie en cours : une à la fois (voir `$('ostage').onclick`). Le
   numéro du paquet invalide ce qui arriverait d'un paquet précédent. */
let enCeremonie = false;
let paquet = 0;

async function openPack() {
  const setId = SETS[S.set].id;
  /* Le solde et la collection d'avant : la dépense se lit sur l'écart, et la
     ligne de série se compte depuis là. */
  const echAvant = Number(S.scarves ?? 0);
  const colAvant = { ...S.col };
  /* Ce qu'on demande au serveur, retenu : seul un paquet **demandé à
     l'achat** peut avoir été payé (voir le ticket, plus bas). */
  const achete = !(Number(S.packs) > 0);
  let res;
  try {
    // `buy` autorise le serveur à prélever des écharpes s'il ne reste aucun
    // booster gratuit. Il refuse proprement si le solde ne suffit pas.
    res = await api('/open', { set: setId, buy: achete });
  } catch (e) {
    // Un message vague fait perdre des heures. Quand le serveur sait pourquoi,
    // on le dit.
    toast(({
      'fanzzy.error.no_packs': 'Plus de booster',
      'fanzzy.error.not_enough_scarves': 'Pas assez d’écharpes',
      'fanzzy.error.unknown_set': 'Série inconnue',
      // Le filet de sécurité : le kiosque n'est plus censé proposer une série
      // hors de portée, mais un onglet resté ouvert depuis avant une fermeture
      // peut encore la demander. Le refus doit alors nommer sa cause — c'est ce
      // code brut, affiché tel quel, qui a fait remonter la panne.
      /* `set_locked` n'est plus émis : il disait « au-dessus de ton niveau », et
         le niveau n'ouvre plus de séries. La traduction reste le temps qu'un
         onglet ouvert depuis avant le déploiement finisse sa session — sans
         elle, ce joueur-là verrait un code brut. */
      'fanzzy.error.set_locked': 'Cette série attend une saison',
      'fanzzy.error.set_closed': 'Cette série attend une saison pour s’ouvrir',
      'fanzzy.error.schema': 'Base de données incomplète — voir la console',
    })[e.code] ?? `Ouverture impossible (${e.code ?? 'sans code'})`);
    if (e.code === 'fanzzy.error.schema') console.error('[fanzzy]', e.detail ?? e.message);
    return;
  }

  /* Les quatre sortes de cartes, converties par `carteDuPaquet` — qui vit
     dans `cartes.js` depuis que l'accueil rend les mêmes. Deux tables pour la
     même conversion auraient divergé, et c'est exactement ce qui est arrivé au
     catalogue recopié. */
  pull = res.cards.map(carteDuPaquet);
  rapportent = res.cards.map(rapporte);
  montants = res.cards.map(montantDe);
  neuf = res.cards.map(estNeuve);
  doublonsAVerser = true;

  // Une carte que le serveur tire mais que cette page ne connaît pas arrivait
  // ici comme `undefined`, et cassait l'ouverture sans rien dire — c'est ce
  // qui s'est produit quand la lignée du Gamin de Devant manquait au
  // catalogue recopié plus haut. On la retire et on nomme la cause : mieux
  // vaut un booster amputé et un message clair qu'un écran figé.
  //
  // `=== 'fanzzy'` et non `!== 'skin'` : les trois autres types ont désormais
  // leur catalogue et se replient sur leur identifiant. Les compter comme
  // inconnues faisait jeter des cartes parfaitement valides.
  const inconnues = res.cards
    .filter((c, i) => c.type === 'fanzzy' && !pull[i])
    .map((c) => c.id);
  if (inconnues.length) {
    // Les listes vont ensemble : on retire les mêmes rangs de toutes.
    rapportent = rapportent.filter((_, i) => Boolean(pull[i]));
    montants = montants.filter((_, i) => Boolean(pull[i]));
    neuf = neuf.filter((_, i) => Boolean(pull[i]));
    pull = pull.filter(Boolean);
    console.error('[fanzzy] catalogue de la page en retard sur le serveur :', inconnues);
    toast(`Carte inconnue de cette version : ${inconnues.join(', ')}. Recharge la page.`);
  }

  /* **Ce qu'on vient de gagner, on le possède.**

     `fanzzy-etats.js` ne rend une expression que si le joueur l'a gagnée —
     c'est la règle décidée quand les états sont devenus des cartes à tirer,
     et elle est juste : on ne montre pas une joie qu'on n'a pas.

     Mais la table qu'elle consulte vient de `load()`, appelé **une seule
     fois, au démarrage**. Au moment du butin elle date donc d'avant
     l'ouverture du paquet, et l'état qu'on vient tout juste de gagner n'y
     est pas encore. Le jeu filtrait exactement la carte qu'il était en train
     d'annoncer : l'étiquette disait « ON POUSSE », le dessin montrait le
     personnage au repos.

     On inscrit donc le gain **avant** de dessiner quoi que ce soit. Ce n'est
     pas une supposition optimiste : le serveur vient de l'écrire en base,
     `res.cards` est sa réponse, et un `load()` le confirmerait à l'identique
     — pour un aller-retour de plus au moment précis où la page doit rendre.

     Le même geste sert au classeur et au kiosque rendus juste après, qui
     lisent la même table. */
  for (const f of pull) {
    if (!f?.etat || !f.pour) continue;
    const parAge = (S.etats[f.pour] ??= {});
    const liste = (parAge[f.stage ?? 1] ??= []);
    if (!liste.includes(f.id)) liste.push(f.id);
  }
  window.TBF_ETATS?.possedes?.(S.etats);
  idx = 0;
  for (const c of res.cards) {
    // La collection ne compte que des supporters. Une pièce d'équipement rangée
    // ici gonflait la progression du classeur d'une case qui n'existe pas.
    if (c.type === 'fanzzy') S.col[c.id] = (S.col[c.id] ?? 0) + 1;
  }
  S.scarves = res.wallet.scarves;
  S.packs = res.wallet.packs;
  S.nextIn = res.wallet.nextPackInMs;
  if (Number(res.wallet.cadenceMs) > 0) S.cadenceMs = Number(res.wallet.cadenceMs);
  if (Number(res.wallet.packMax) > 0) S.packMax = Number(res.wallet.packMax);
  noterRecharge(S.nextIn);
  /* Le portefeuille rendu porte l'avatar : au tout premier paquet, le serveur
     équipe d'office le premier Fanzzy tiré, et la fête de niveau comme
     l'anneau du butin le montrent. Une clé absente n'est pas une réponse. */
  if ('avatar' in res.wallet) S.avatar = res.wallet.avatar ?? null;
  S.lastGain = Number(res.scarvesGained) || 0;
  montantsSurs = montants.reduce((a, b) => a + b, 0) === S.lastGain;
  /* **La montée de niveau, gardée pour la fin du paquet.**

     Le serveur la renvoie depuis toujours avec les cartes — ouvrir un
     booster rapporte de l'XP — et cette page la laissait tomber. On la
     range ici plutôt que de la fêter tout de suite : le joueur vient de
     déchirer un sachet, il regarde ses cartes, et lui couvrir l’écran
     avant qu’il les ait retournées serait lui voler les deux moments.
     Voir `finishPack`, qui la sort quand le paquet est fini. */
  S.montee = res.niveau ?? null;
  /* L'XP du booster, pour l'anneau du butin (contrat § 1) : il n'avance que
     si le serveur l'a comptée. Les écharpes d'un palier franchi sont déjà
     dans le solde rendu ; le compteur du butin ne les montre qu'après la
     fête qui les annonce. */
  S.niveauButin = res.niveau ?? null;
  S.ecarpesPalier = res.niveau?.monte ? Number(res.niveau.ecarpes) || 0 : 0;
  S.serie = ligneDeSerie(res, setId, colAvant);

  /* Le solde d'après la dépense, avant les doublons et les paliers : le
     compteur du butin part de là.

     **Ce que le booster a coûté ne se déduit plus de l'écart seul.** Le
     solde d'avant (`S.scarves`) n'est relu qu'au chargement, à la recharge
     ou au retour d'un onglet caché : un achat fait ailleurs entre-temps
     creusait l'écart, et le ticket annonçait « −120 · le booster acheté »
     pour un booster gratuit. Le prix servi par le serveur (`paye`) fait
     foi ; sans lui, seul un paquet **demandé à l'achat** peut avoir été
     payé, et il l'a été au prix du booster ou pas du tout — jamais d'un
     montant entre les deux. Un écart plus court que le prix (des écharpes
     gagnées ailleurs entre-temps) ne se devine pas : pas de ticket plutôt
     qu'un ticket faux. */
  const base = Number(S.scarves ?? 0) - S.lastGain - S.ecarpesPalier;
  const prix = Number(S.packPrice ?? 45);
  const paye = res.paye != null && Number.isFinite(Number(res.paye)) ? Math.max(0, Number(res.paye))
    : achete && echAvant - base >= prix ? prix : 0;

  paquet += 1;
  enCeremonie = false;
  const st = $('ostage'); st.innerHTML = '';
  /* **Le dos, c'est celui du sachet — pas celui de la carte.** La nuance
     compte : montrer la série de la carte qu'on tient renseignerait sur elle
     avant de la retourner, et un booster n'a plus rien à révéler si son dos
     l'a déjà dit. Le sachet, lui, on l'a choisi soi-même une seconde plus
     tôt. */
  const dosDuSachet = window.FZART?.dos?.((SETS[S.set] ?? {}).id);
  pull.forEach((f, i) => {
    const el = document.createElement('div');
    /* Face cachée, elle ne se lit pas : figée (`.fz-fige`, cartes.css)
       jusqu'à ce qu'on la retourne. */
    el.className = 'reveal fz-fige'; el.style.zIndex = 20 - i;
    el.style.transform = `translateY(${i * 7}px) scale(${1 - i * .03})`;
    el.innerHTML = `<div class="flip">
      <div class="face back${dosDuSachet ? ' dessine' : ''}"${dosDuSachet
        ? ` style="background-image:url('${dosDuSachet}')"` : ''}><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#39414E" stroke-width="1.4"><path d="M3 20l9-16 9 16z"/><path d="M7 20l5-9 5 9"/></svg></div>
      <div class="face front">${cardHTML(f)}</div></div>`;
    st.appendChild(el);
  });
  /* Les cinq fentes : un dos de carte par carte à révéler — le même dos que
     celui des cartes —, la première qui sort. */
  const fentes = $('oFentes');
  if (dosDuSachet) fentes.style.setProperty('--dos', `url("${dosDuSachet}")`);
  else fentes.style.removeProperty('--dos');
  fentes.innerHTML = pull.map((_, i) =>
    `<span class="tbf-fente${i === 0 ? ' tbf-fente--sort' : ''}"></span>`).join('');
  fentes.setAttribute('aria-label', `Carte 1 sur ${pull.length}`);
  $('summary').classList.remove('on');
  $('summary').innerHTML = '';
  phase('revele');
  // La scène était repliée par le récapitulatif du paquet précédent.
  $('ostage').style.display = '';
  $('oAction').hidden = true;
  $('oHint').textContent = 'Touche la carte pour la retourner';
  /* Le compteur du butin part du solde d'après la dépense : les doublons le
     feront monter (voir `crediterDoublons`). */
  poserSolde($('oEch'), base, { compter: false });
  $('opener').classList.add('on');
  /* Ce que le booster a coûté, s'il s'est payé : un ticket « −45 », comme à
     l'étal de la boutique. Le kiosque, couvert, ne le compte qu'au retour. */
  if (paye > 0) ticket({ montant: `−${paye}`, nom: 'ÉCHARPES', origine: 'le booster acheté' });
  /* La barre et le tiroir ont leur bourse : la réponse du serveur leur est
     relayée (R6), **après** que l'écran d'ouverture couvre le kiosque — qui
     écoute la même annonce et ne doit pas compter dessous. */
  dispatchEvent(new CustomEvent('tbf:bourse', { detail: {
    wallet: res.wallet, ...(res.niveau ? { niveau: res.niveau } : {}) } }));
}

/** La tête et le pied de la cérémonie, selon le moment : la révélation ou le
    butin. */
function phase(p) {
  const butin = p === 'butin';
  $('opener').classList.toggle('kq-butin', butin);
  $('oFentes').hidden = butin;
  $('oProj').hidden = butin;
  $('oBourse').hidden = !butin;
  $('oNiv').hidden = true;
  $('oFin').hidden = !butin;
  $('butinTitre').hidden = !butin;
  $('oHint').hidden = butin;
}

/** Quand la forme se colle, après le début du retournement : la carte a
    alors fait plus des neuf dixièmes de son demi-tour (`.reveal .flip`,
    550 ms, qui démarre vite), elle est presque à plat. Plus tôt, la colle se
    jouerait sur une face encore de profil ; 300 + 220 ms finissent avant le
    retournement, et la cérémonie, qui attend la fin des deux
    (`FX.reveler`), ne part pas plus tard. */
const COLLE_APRES_MS = 300;

/**
 * **La rareté se colle sur la carte qui se retourne** : le geste de la
 * révélation (`.tbf-colle`, ui.css) se joue sur la forme que la carte porte
 * déjà, à son coin haut-droit, avec son mot (`.fz-forme`, cartes.js).
 *
 * La page collait jusqu'ici sa propre forme, au-dessus de la carte : avant le
 * lot 4, la carte ne disait pas sa rareté en mot (la légendaire seule), et
 * ce sticker la disait. Depuis, la carte la dit elle-même, et les deux
 * stickers identiques se lisaient à trente pixels l'un de l'autre — deux
 * signes pour une rareté. Il n'y en a plus qu'un, et c'est lui qu'on voit se
 * coller.
 *
 * Sans mouvement (préférence ou mode calme), rien n'est posé : la forme est
 * déjà sur la carte quand elle paraît, et une classe dont l'animation ne
 * joue pas ne finirait jamais.
 */
function collerRarete(carte) {
  const forme = carte.querySelector('.face.front .fz-forme');
  if (!forme || sansMouvement()) return;
  forme.style.setProperty('--d', `${COLLE_APRES_MS}ms`);
  forme.classList.add('tbf-colle');
  aLaFin(forme, 'tbf-colle', 'tbf-colle');
}

/** « NOUVEAU », tamponné sur la carte. */
function tamponner(carte) {
  const t = document.createElement('span');
  t.className = 'tbf-tampon tbf-tampon--plein tbf-clac kq-nouveau';
  t.dataset.ton = 'flare';
  t.textContent = 'NOUVEAU';
  aLaFin(t, 'tbf-clac', 'tbf-clac');
  carte.append(t);
}

/** La fente de la carte révélée se vide et prend la barre de sa rareté ; la
    suivante sort. */
function marquerFente(i, rar) {
  const fs = [...$('oFentes').children];
  if (fs[i]) {
    fs[i].classList.remove('tbf-fente--sort');
    fs[i].classList.add('tbf-fente--vide');
    fs[i].style.setProperty('--rc', `var(--r-${rar})`);
  }
  fs[i + 1]?.classList.add('tbf-fente--sort');
  $('oFentes').setAttribute('aria-label', `Carte ${i + 1} sur ${pull.length} : ${MOT[rar].toLowerCase()}`);
}

$('ostage').onclick = () => {
  const cards = [...$('ostage').children];
  const cur = cards[idx];
  if (!cur) return;
  if (!cur.classList.contains('flipped')) {
    cur.classList.add('flipped');
    cur.classList.remove('fz-fige');
    const f = pull[idx];
    const rar = rareteDe(f);
    /* Le son du retournement reste à la page ; tout le reste — le reflet de
       la rare, la nappe et le carillon de l'épique, le flash, les rayons, la
       secousse et le rugissement de la légendaire, les vibrations — est
       l'échelle commune de cérémonie (`FX.reveler`), la même qu'à l'étal de
       la boutique. Les étincelles, la gerbe filmée, l'accord et le
       tremblement que cette page écrivait à la main sont partis avec elle :
       une rare n'avait pas le même poids d'un écran à l'autre. */
    audio.flip();
    collerRarete(cur);
    if (neuf[idx]) tamponner(cur);
    marquerFente(idx, rar);
    /* **Une cérémonie à la fois** : la suivante ne part qu'une fois finie
       celle-ci (fx.js le demande — cinq légendaires lancées ensemble feraient
       cinq flashs). Le toucher qui écarterait la carte attend donc sa fin ;
       « TOUT RÉVÉLER » l'interrompt, la carte quittant l'écran. */
    const moi = paquet;
    enCeremonie = true;
    Promise.resolve(window.FX?.reveler?.(rar, cur)).catch(() => {})
      .then(() => { if (moi === paquet) enCeremonie = false; });
    const derniere = idx >= pull.length - 1;
    $('oHint').textContent = derniere ? 'Touche pour le récapitulatif' : 'Touche encore pour la suivante';
    $('oAction').hidden = derniere;
  } else {
    if (enCeremonie) return;
    // Partie de côté, elle ne se lit plus : elle se fige (voir .fz-fige).
    cur.classList.add('fz-fige');
    cur.style.transform = 'translateX(-130%) rotate(-14deg)';
    cur.style.opacity = '0';
    if (++idx >= pull.length) return finishPack();
    cards.forEach((el, i) => { if (i >= idx) el.style.transform = `translateY(${(i - idx) * 7}px) scale(${1 - (i - idx) * .03})`; });
    $('oHint').textContent = 'Touche la carte pour la retourner';
  }
};
$('oAction').onclick = () => finishPack();

/** Revenir au kiosque : il redessine ce qui vient de changer, et le solde y
    descend sous les yeux. */
function fermerOpener() {
  $('opener').classList.remove('on');
  renderKiosque();
}
$('oClose').onclick = () => fermerOpener();
/* ENCORE UN : le kiosque, et tout de suite la déchirure du suivant — la même
   règle que le bouton (`peutOuvrir`, dans `startTear`). Un booster arrivé
   pendant qu'on regardait le butin se prend comme à PRÊT : relu, jamais
   acheté. */
$('oEncore').onclick = () => {
  const g = geste();
  fermerOpener();
  if (g === 'pret') ouvrirLArrive(); else startTear();
};

function finishPack() {
  enCeremonie = false;
  $('ostage').innerHTML = '';
  /* La scène vidée gardait six cents pixels de noir au-dessus du butin. On la
     replie : la page d'album prend la place, et c'est elle qu'on est venu voir. */
  $('ostage').style.display = 'none';
  phase('butin');
  $('oAction').hidden = true;
  $('oHint').textContent = '';

  /* Ce qu'on n'avait pas encore. C'est ce que le joueur cherche en premier, et
     ce n'était écrit nulle part : cinq cartes rangées, sans savoir lesquelles
     étaient neuves. `neuf` est rempli à l'ouverture, carte par carte. */
  const neuves = neuf.filter(Boolean).length;
  const t = $('butinTitre');
  /* Quatre cas, quatre phrases. Coller un « TOUT » invariable devant un accord
     au féminin pluriel donnait « TOUT NOUVELLES DANS LE CLASSEUR » — et une
     phrase bancale sur l'écran le plus regardé du jeu se remarque tout de
     suite. Ce qu'on vient chercher en grand, le reste en petit (voir la
     feuille, `.butintitre`). */
  const [grand, petit] =
    neuves === 0 ? ['AUCUNE NOUVELLE', 'QUE DES DOUBLONS']
      : neuves === pull.length ? ['TOUTES NOUVELLES', 'DANS LE CLASSEUR']
        : [`${neuves} NOUVELLE${neuves > 1 ? 'S' : ''}`, `SUR ${pull.length}`];
  t.innerHTML = `<b>${grand}</b> <small>${petit}</small>`;

  /* **La page d'album.** Chaque carte collée de travers sous son scotch, une
     à une (`.tbf-colle`, soixante millisecondes d'écart) ; NOUVEAU en sticker
     sur ce qui est neuf, le prix en écharpes sur ce qui en a rapporté.

     **La rareté, c'est la carte qui la dit** (lot 4) : la forme et son mot au
     coin haut-droit, là où l'œil arrive — la même forme qu'à la révélation,
     une seconde plus tôt. La case en collait une seconde, sans mot, au même
     coin ; deux signes pour une rareté, elle est partie. La classe de rareté
     reste sur la case : rien ne la peint, la suite du kiosque la lit. */
  const cases = pull.map((f, i) => {
    const rar = rareteDe(f);
    const m = montantsSurs && rapportent[i] ? montants[i] : 0;
    return `<div class="tbf-album-case tbf-colle ${rar}" data-i="${i}" style="--d:${i * 60}ms">`
      + cardHTML(f, { mini: true })
      + (neuf[i] ? '<span class="tbf-sticker" data-ton="flare">NOUVEAU</span>' : '')
      + (m > 0 ? `<span class="tbf-sticker tbf-sticker--prix"><img src="${esc(JETON)}" alt="">+${m}</span>` : '')
      + '</div>';
  }).join('');
  const sum = $('summary');
  /* Une grille ne bouge pas : `.fz-fige` (cartes.css) arrête ses cartes, comme
     la pile de la révélation. La page d'album le fait déjà d'elle-même
     (cartes.css fige toute carte d'une `.tbf-album`) ; le dire ici garde le
     butin figé si sa brique change de nom. */
  sum.innerHTML = `<div class="tbf-ticket tbf-album fz-fige"><div class="tbf-album-cartes">${cases}</div>${piedDeSerie()}</div>`;
  for (const c of sum.querySelectorAll('.tbf-album-case')) aLaFin(c, 'tbf-colle', 'tbf-colle');
  sum.classList.add('on');
  sum.scrollTop = 0;
  avancerSerie();
  sum.onclick = (e) => {
    const d = e.target.closest('[data-i]');
    // On ferme l'écran d'ouverture d'abord : la fiche se pose par-dessus la
    // grille, pas par-dessus un booster à moitié déchiré.
    if (!d) return;
    $('opener').classList.remove('on');
    /* `renderKiosque` et non `renderDex` : le classeur n'est pas sur cette
       page. */
    renderKiosque();
    ouvrirFicheDuButin(pull[+d.dataset.i].id);
  };

  /* La fin : ENCORE UN si la réserve ou le solde le permettent, et ce qu'il
     coûte s'il se paie — c'est alors le seul achat de l'écran. */
  const px = Number(S.packPrice ?? 45);
  const g = geste();
  $('oEncore').hidden = !['ouvrir', 'pret', 'attendre', 'acheter'].includes(g);
  $('oEncore').textContent = g === 'ouvrir' || g === 'pret' ? 'ENCORE UN' : `ENCORE UN · ${px} ÉCHARPES`;

  /* Les écharpes des doublons partent des cartes vers le compteur, l'anneau
     d'XP avance à côté ; puis le ticket du gain. */
  const moi = paquet;
  const credit = crediterDoublons();
  const xp = avancerNiveau();
  credit.then(() => {
    if (moi !== paquet || !$('opener').classList.contains('on')) return;
    ticketDuButin();
  });

  /* **La fête, une fois le butin posé.**

     Une seconde après, pas tout de suite : les cartes arrivent une à une, et
     la fête posée dessus couperait leur arrivée. Et pas avant que les
     écharpes et l'XP soient arrivées : elle couvre l’écran, et couperait le
     compte au milieu. On la consomme, aussi : rouvrir l’écran du paquet
     précédent ne doit pas rejouer une montée déjà célébrée. Une fois
     refermée, le compteur prend les écharpes du palier qu'elle a annoncées. */
  if (S.montee?.monte) {
    const montee = S.montee;
    S.montee = null;
    Promise.all([credit, xp, new Promise((r) => setTimeout(r, 1000))])
      .then(() => window.TBF_NIVEAU?.feter?.(montee))
      .then(() => poserSolde($('oEch'), S.scarves ?? 0));
  }

  /* `renderKiosque` redessine le compte de boosters, l'état du bouton et le
     compte à rebours — tout ce qui vient de changer. */
  renderKiosque();
}

/** Le pied de la page d'album : la ligne vivante de la série, ou rien. */
function piedDeSerie() {
  const l = S.serie;
  if (!l) return '';
  const nom = SETS_TOUTES.find((x) => x.id === l.id)?.nom ?? l.id;
  const pc = (v) => Math.round(clamp(v / l.total, 0, 1) * 1000) / 10;
  return `<div class="tbf-album-pied"><b>${esc(nom)}</b>`
    + `<span>${l.avant !== l.apres ? `${l.avant} → ${l.apres}` : l.apres} / ${l.total}</span>`
    + `<div class="tbf-jauge" aria-hidden="true" data-apres="${pc(l.apres)}"><i style="width:${pc(l.avant)}%"></i></div>`
    + (l.complete ? '<span class="tbf-tampon" data-ton="vert">COMPLET</span>' : '')
    + '</div>';
}

/** La jauge de la série va de l'ancien compte au nouveau, une fois les
    cartes collées. Au calme, elle saute (la brique coupe sa transition). */
function avancerSerie() {
  const j = $('summary').querySelector('.tbf-album-pied .tbf-jauge');
  if (!j) return;
  const moi = paquet;
  setTimeout(() => {
    if (moi !== paquet || !j.isConnected) return;
    const i = j.querySelector('i');
    void i.offsetWidth;
    i.style.width = `${j.dataset.apres}%`;
  }, 450);
}

/** Le ticket du butin : les écharpes gagnées en doublons, et l'XP s'il y en a.
    Rien ne s'écrit à zéro (R5). */
function ticketDuButin() {
  const ech = Number(S.lastGain ?? 0);
  const xp = Number(S.xpButin ?? 0);
  if (ech > 0) {
    ticket({ montant: `+${ech}`, nom: 'ÉCHARPES',
      origine: xp > 0 ? `en doublons · +${xp} XP` : 'en doublons' });
  } else if (xp > 0) {
    ticket({ montant: `+${xp}`, nom: 'XP', origine: 'le booster ouvert', jeton: false });
  }
}

/* Le temps que la cascade du butin se pose : cinq cartes échelonnées de
   60 ms, chacune collée en 220 ms — voir `.tbf-colle`. Avec de la marge :
   les écharpes partent de cartes posées, pas de cartes encore en l'air. */
const POSE_DU_BUTIN_MS = 800;

/**
 * Les écharpes des doublons, **de la carte au compteur**.
 *
 * Le butin disait « +12 écharpes en doublons » en bas de l'écran, et c'était
 * tout : un nombre à lire, sans rien qui dise d'où il venait ni où il allait.
 * Or c'est le seul gain du paquet qui ne se voit pas sur une carte — un
 * doublon a l'air d'une carte comme les autres.
 *
 * Une fois les cartes posées, une poignée d'écharpes s'envole de chaque carte
 * qui en a rapporté (`FX.voler`) — de son sticker de prix quand elle en a un —
 * jusqu'au compteur de la tête, puis le compteur monte (`FX.compter`)
 * jusqu'au solde. Le vol dit d'où ça vient, le compte dit combien. Sans fx.js,
 * ou sans mouvement, le compteur prend simplement sa valeur — il est juste
 * dans tous les cas.
 *
 * Une fois par paquet : `finishPack` peut être rappelé, et un vol rejoué
 * ferait croire à un second gain.
 *
 * @returns {Promise<void>} résolue quand le compteur affiche le solde, hors
 *   écharpes d'un palier de niveau (la fête les annonce, puis il les compte)
 */
function crediterDoublons() {
  const cible = $('oEch');
  const fin = Number(S.scarves ?? 0) - Number(S.ecarpesPalier ?? 0);
  if (!doublonsAVerser || !Number(S.lastGain ?? 0)) {
    doublonsAVerser = false;
    return poserSolde(cible, fin);
  }
  doublonsAVerser = false;
  const sources = [...$('summary').querySelectorAll('[data-i]')]
    .filter((n) => rapportent[Number(n.dataset.i)])
    .map((n) => n.querySelector('.tbf-sticker--prix') ?? n);
  // La poignée d'écharpes est le dessin de la carte « écharpes » elle-même :
  // c'est ce qu'on vient de gagner, et c'est ce qui vole.
  const image = window.TBF_STUFF?.gain?.('echarpes');
  const attendre = (ms) => new Promise((r) => setTimeout(r, ms));
  return attendre(POSE_DU_BUTIN_MS)
    .then(() => Promise.all(sources.map((n, k) => attendre(k * 110).then(() =>
      (window.FX?.voler ? window.FX.voler(n, cible, image ? { image } : {}) : null)))))
    .then(() => poserSolde(cible, fin));
}

/* Sans mouvement décoratif : la préférence du système, ou le calme
   « animations » du tiroir. */
const sansMouvement = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches
  || (document.documentElement.dataset.calme ?? '').split(' ').includes('animations');

/**
 * **L'anneau d'XP du butin**, à côté du compteur : le Fanzzy du joueur dans
 * son anneau, qui avance de la jauge d'avant le booster à celle d'après.
 *
 * Seulement si le serveur a compté l'XP **et** dit d'où partait la jauge
 * (`niveau.depart`, contrat § 1) : sans elle, rien ne bouge, et rien ne
 * s'affiche — un anneau posé sans savoir où il en était mentirait. S'il y a
 * montée, il fait le tour jusqu'au bout, son niveau change, et il repart de
 * zéro ; la fête de niveau prend la main ensuite. Sans mouvement, il est posé
 * à sa valeur.
 *
 * @returns {Promise<void>} résolue quand l'anneau est arrivé
 */
function avancerNiveau() {
  const niv = S.niveauButin;
  S.niveauButin = null;
  /* L'XP gagnée, pour le ticket : elle se dit dès que le serveur la compte ;
     l'anneau, lui, demande aussi d'où il part. */
  S.xpButin = Number(niv?.gain) > 0 ? Number(niv.gain) : 0;
  const el = $('oNiv');
  el.hidden = true;
  if (!niv || !(Number(niv.niveau) > 0) || !niv.depart || !S.xpButin) {
    return Promise.resolve();
  }
  const p = (x) => clamp(Number(x) || 0, 0, 1);
  const de = niv.depart.max ? 1 : p(niv.depart.part);
  const a = niv.max ? 1 : p(niv.part);
  const nivAvant = Number(niv.depart.niveau ?? niv.avant ?? niv.niveau);
  const monte = Number(niv.niveau) > nivAvant;

  /* Le visage : celui de l'avatar équipé (le portefeuille de la réponse),
     ou la silhouette d'un sticker qu'on n'a pas encore collé. */
  const anneau = el.querySelector('.tbf-anneau');
  const pastille = el.querySelector('.tbf-avatar-niv');
  const av = S.avatar;
  const adresse = av ? window.FZART?.dessinAvatar?.(av, 'buste') : null;
  el.classList.toggle('tbf-avatar--vide', !av);
  const craie = () => { const s = document.createElement('span'); s.className = 'tbf-avatar-buste'; return s; };
  if (adresse) {
    const img = document.createElement('img');
    img.className = 'tbf-avatar-buste';
    img.alt = '';
    img.onerror = () => { img.onerror = null; img.replaceWith(craie()); };
    img.src = adresse;
    anneau.replaceChildren(img);
  } else anneau.replaceChildren(craie());
  el.setAttribute('aria-label', `Niveau ${niv.niveau} — +${niv.gain} XP`);
  el.hidden = false;

  const poser = (x) => anneau.style.setProperty('--p', `${(x * 100).toFixed(1)}%`);
  poser(de);
  pastille.textContent = String(nivAvant);
  const finir = () => { poser(a); pastille.textContent = String(niv.niveau); };
  if (sansMouvement() || document.hidden) { finir(); return Promise.resolve(); }

  /* Un pas, de x0 à x1, en 650 ms ; une minuterie de secours le finit si les
     images ne viennent plus (un onglet caché les gèle, pas les minuteries). */
  const pas = (x0, x1) => new Promise((resoudre) => {
    let fini = false;
    const t0 = performance.now();
    const arriver = () => { if (fini) return; fini = true; poser(x1); resoudre(); };
    const image = (t) => {
      if (fini) return;
      const k = Math.min(1, (t - t0) / 650);
      poser(x0 + (x1 - x0) * (1 - (1 - k) ** 3));
      if (k < 1) requestAnimationFrame(image); else arriver();
    };
    requestAnimationFrame(image);
    setTimeout(arriver, 900);
  });
  const attendre = (ms) => new Promise((r) => setTimeout(r, ms));
  return attendre(POSE_DU_BUTIN_MS)
    .then(() => (monte
      ? pas(de, 1).then(() => { pastille.textContent = String(niv.niveau); return pas(0, a); })
      : pas(de, a)))
    .then(finir);
}

/**
 * La fiche d'une carte qu'on vient d'ouvrir.
 *
 * Elle s'appelait `ouvrirFiche` — le nom qu'a la fonction du **classeur**,
 * qui n'est pas cette page-ci et que celle-ci ne charge pas. L'appel levait
 * donc un `ReferenceError` à chaque fois, sans que rien ne le dise :
 * l'écran du paquet venait de se fermer, et on croyait avoir raté la carte.
 *
 * Sans entrée d'historique, à la différence du classeur : on sort d'un plein
 * écran, et deux adresses empilées feraient reculer deux fois.
 */
function ouvrirFicheDuButin(id) {
  const n = $('detail');
  if (!n || !window.TBF_FICHE) return;
  n.classList.add('on');
  n.innerHTML = '';
  return window.TBF_FICHE.ouvrir(n, id, {
    fermer: () => { n.classList.remove('on'); n.innerHTML = ''; },
    // Le kiosque a pu changer pendant qu'on regardait — un âge acheté se
    // paie en écharpes, et c'est le même solde qui achète les boosters.
    change: renderKiosque,
  });
}


/* ---------------------------------------------------------------- init */

/* Le kiosque se redessine quand la bourse change — c est `load()` qui le
   dit, sans savoir qui écoute. Une annonce sans détail est celle de `load()` :
   le temps de recharge vient d'être lu, et c'est de là que la page décompte. */
addEventListener('tbf:bourse', (e) => {
  if (!e.detail) noterRecharge(S.nextIn);
  renderKiosque();
});
setInterval(tickRegen, 1000);
/* Revenu d'un onglet caché plus d'une minute : la réserve a pu se remplir
   côté serveur (R3). Le décompte, lui, reprend juste — il ne dépend que de
   l'instant de la lecture. */
let cacheDepuis = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cacheDepuis = performance.now(); return; }
  if (cacheDepuis && performance.now() - cacheDepuis > 60_000) relire();
  tickRegen();
});

(async () => {
  /* **Le manifeste des dessins, avant tout le reste.**

     `TBF_ETATS.resoudre` lit ce manifeste et rend `null` tant qu'il n'est pas
     arrivé. Cette page ne le chargeait jamais — elle était la seule : la
     boutique, le deck, la fiche, le classeur et l'accueil l'appellent tous.

     La conséquence se voyait à l'endroit le plus visible du jeu. Une carte
     d'état sortait d'un paquet avec son étiquette « ON POUSSE », et montrait
     le personnage **au repos** : `resoudre` rendait `null`, et `dessinDeCarte`
     repliait sur le buste. Un joueur a décrit exactement ça — « l'état on
     pousse avec l'image neutre ».

     Il ne lève jamais : sans manifeste, la page s'affiche comme avant. */
  await Promise.resolve(window.TBF_ETATS?.charger?.()).catch(() => null);
  try {
    await chargerCatalogue();
    await load();
  } catch (e) {
    /* **Le démarrage n'avait aucun rattrapage.** Une erreur ici — catalogue
       incomplet, serveur muet, session expirée — tuait la fonction anonyme en
       silence : le kiosque restait sur son balisage d'origine, sans paquet,
       sans message et sans rien qui dise pourquoi.

       `auth` sort sans rien afficher : `api` est déjà en train de rediriger
       vers la page de connexion, et un message qui s'affiche pendant qu'on
       change de page ne fait que clignoter. */
    if (e.message === 'auth') return;
    console.error('[kiosque] démarrage', e);
    const a = document.getElementById('annonce');
    if (a) {
      a.textContent = e.code === 'app.error.illisible'
        ? 'Le serveur n’a pas répondu correctement. Réessaie dans un instant.'
        : 'Le kiosque n’a pas pu se charger. Recharge la page.';
      a.hidden = false;
    }
    return;
  }
  S.paquet ??= MILIEU;
  renderKiosque();
  buildCarousel();
  tickRegen();

  /* Le mot d'accueil. Quelqu'un qui arrive ici parce qu'il a des boosters à
     ouvrir doit lire pourquoi il y est : sans cette phrase, la redirection
     depuis la connexion a l'air d'une erreur de navigation. */
  const n = S.packs ?? 0;
  if (n > 0 && new URLSearchParams(location.search).has('aouvrir')) {
    const a = document.getElementById('annonce');
    a.textContent = n === 1
      ? 'Tu as 1 booster à ouvrir.'
      : `Tu as ${n} boosters à ouvrir.`;
    a.hidden = false;
  }
})();
</script>
