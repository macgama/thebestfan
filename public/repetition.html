<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La répétition — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}

/* ====================================================== le choix des gestes */
.dit{margin:10px 14px 0;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;
  border:1px solid rgba(245,195,59,.3);
  background:linear-gradient(140deg,rgba(245,195,59,.1),rgba(8,11,16,.7))}
/* Le mot qui compte, en craie grasse : en or et en douze pixels et demi, il
   ne tenait pas au soleil (arbitrage du 2 octobre 2026). Le voile et le
   cadre d'or du bandeau, qui ne portent pas de lettres, restent. */
.dit b{color:var(--craie);font-weight:700}

.fam{margin:16px 14px 0}
/* Le nom de la famille est un titre cousu (`.tbf-cousu`, dans ui.css) : la
   page ne garde que sa place. Il était à 45 % — neuf intertitres qu'on
   devinait au lieu de les lire. */
.fam h2{margin:0 0 8px;padding-left:2px}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* Une tuile par geste. La barre de gauche porte la couleur de la famille —
   c'est le seul endroit de l'écran où la couleur veut dire quelque chose, et
   elle dit la même chose qu'en partie.

   La surface est le panneau commun (`.pan`) : même fond, même filet, et
   surtout **même réponse au doigt** que tout ce qui se touche ailleurs. La
   tuile avait sa propre peinture et ne s'enfonçait pas ; on la touchait sans
   rien sentir. La page ne garde que la mise en page. */
.g{position:relative;text-align:left;padding:11px 12px 11px 15px;overflow:hidden}
.g::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.g b{display:block;font-family:var(--banner);font-size:13px;letter-spacing:.07em}
/* **La consigne à onze pixels, et en craie pleine.** C'est elle qu'on lit
   pour choisir, et à dix pixels et demi, à 60 %, elle décrochait au soleil —
   vingt-quatre fois sur la même page. Pleine et non à 88 % : sous le voile
   blanc du plein jour, une craie à 88 % posée sur la tuile tombe à 4,2:1,
   sous les 4,5 d'un texte courant ; pleine, elle tient. La hiérarchie avec le
   nom du geste passe par la taille et le lettrage. */
.g span{display:block;font-size:11px;line-height:1.45;margin-top:3px}
/* Le meilleur score, en craie grasse. Il prenait la couleur du geste, et
   celle des six gestes de rythme est l'or du jeu (#F5C33B, `geste.js`) : de
   l'or en onze pixels, qu'une recherche de couleurs écrites en dur ne voit
   pas, et qui ne tient pas au soleil — l'or ne s'écrit plus qu'en grand
   (arbitrage du 2 octobre 2026). La couleur du geste reste sur la barre de
   la tuile, juste à gauche ; « déjà essayé » se lit à la graisse, et
   « JAMAIS ESSAYÉ », dessous, garde la craie maigre. */
.g .best{display:block;margin-top:6px;font-family:var(--banner);font-size:11px;
  letter-spacing:.12em;color:var(--craie);font-weight:700}
/* **Le plus pâle était celui que tout le monde lit en premier.** « JAMAIS
   ESSAYÉ » portait un `opacity:.35` écrit à la main dans le gabarit : la
   couleur du jeu, fondue au tiers, tombait à 2,2:1 — moitié moins que le
   minimum. Or c'est l'étiquette que porte *chaque* jeu tant qu'on n'y a pas
   touché : un nouveau venu n'a que celle-là sous les yeux, sur toute la page.

   Le gris disait « rien ici » alors qu'il fallait dire « rien encore ».

   La craie plutôt qu'une version pâle de la couleur du jeu : **l'absence de
   couleur est le bon signal.** La couleur, ici, appartient au score ; tant
   qu'il n'y en a pas, elle n'a rien à dire. Et deux nuances d'un même bleu se
   distinguent moins bien, de loin, qu'un bleu et un blanc.

   Et la craie pleine, pas à 55 % : le signal est l'absence de couleur, pas
   l'effacement. Un « rien encore » qu'on ne lit pas redevient un « rien ici ». */
.g .best.jamais{color:var(--craie);font-weight:400}
.g:focus-visible{outline:2px solid var(--projo);outline-offset:2px}

/* ============================================================ la salle */
.salle{position:fixed;inset:0;z-index:120;background:#05070B;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px
  calc(env(safe-area-inset-bottom) + 14px)}
.salle.on{display:flex}
.salle .tete{display:flex;align-items:center;gap:12px;margin-bottom:8px}
/* Le nom du geste, en craie : il prenait la couleur du geste, de l'or pour
   les gestes de rythme, et dix-sept pixels ne sont pas du grand texte — l'or
   ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). La couleur
   passe sur une barre à sa gauche, celle de la tuile qu'on vient de
   toucher ; la note, en quarante-six pixels, la garde. */
.salle .tete b{flex:1;min-width:0;font-family:var(--banner);font-size:17px;letter-spacing:.1em;
  color:var(--craie);padding-left:10px;box-shadow:inset 4px 0 0 var(--c)}
/* La salle se lit en craie pleine : la consigne, le mot du résultat et la
   ligne qui l'explique sont ce qu'on vient chercher entre deux essais, et ils
   étaient entre 45 et 78 %. Pleine plutôt que simplement au-dessus du
   plancher, pour la même raison que la consigne des tuiles : le plein jour. */
.salle .consigne{font-size:12.5px;line-height:1.55;margin:0 0 12px;min-height:38px}
/* Les mots en gras de la consigne se détachent par la graisse, plus par
   l'or : l'or ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). */
.salle .consigne em{font-style:normal;font-weight:700;color:var(--craie)}
/* La zone que `geste.js` remplit. Il y pose ses propres formes — on ne lui
   donne qu'une surface et on ne touche à rien de ce qu'il y met. */
#zone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}

.note{text-align:center;padding:6px 0 2px;min-height:96px}
.note .n{font-family:var(--banner);font-size:46px;line-height:1;color:var(--c)}
.note .n small{font-size:15px}
.note .q{font-size:12px;letter-spacing:.18em;margin-top:5px}
.note .r{font-size:11.5px;line-height:1.5;margin-top:7px}
/* « TON MEILLEUR » est un sticker craie (`.tbf-sticker`, ui.css) : il était
   écrit en or, en onze pixels, et l'or ne s'écrit plus qu'en grand
   (arbitrage du 2 octobre 2026). Le sticker garde l'accent d'un record ; la
   ligne lui laisse l'air de son bord et de son ombre. */
.note .record{margin-top:9px;padding-bottom:4px}
.apres{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.attend{text-align:center;font-size:12px;letter-spacing:.18em;padding:10px 0}

/* La tuile ne porte plus de transition à elle : celle de `.pan`, et son arrêt
   sous `prefers-reduced-motion` comme sous le mode calme, viennent de ui.css. */
</style>
</head>
<body>
<main id="app">
  <p class="tbf-sous">Essayer sans rien risquer</p>

  <p class="dit">Les vingt gestes du jeu, à l'essai. <b>Rien ne compte ici</b> —
    ni ferveur, ni écharpes, ni classement. Et rien ne t'aide non plus : aucun
    Fanzzy, aucun équipement. C'est ta main, et rien d'autre.</p>

  <div id="vue"><div class="tbf-spin"></div></div>
  <div style="height:22px"></div>
</main>

<!-- La salle, hors de la colonne : un geste se joue plein cadre, comme en
     partie. C'est la même surface et le même lecteur — s'entraîner sur un pavé
     plus petit que celui du duel n'entraînerait à rien. -->
<div class="salle" id="salle" role="dialog" aria-modal="true" aria-label="Un geste à l’essai">
  <div class="tete">
    <button class="tbf-plaque" id="sortir">← RETOUR</button>
    <b id="titre">—</b>
  </div>
  <p class="consigne" id="consigne"></p>
  <div id="zone"></div>
  <div class="note" id="resultat"><div class="attend">PRÊT ?</div></div>
  <div class="apres" id="apres" style="display:none">
    <!-- Recommencer, c'est rejouer : le ton flare des arènes. L'autre porte
         ramène au choix, et reste en béton. -->
    <button class="tbf-plaque tbf-bloc" data-ton="flare" id="encore">RECOMMENCER</button>
    <button class="tbf-plaque tbf-bloc" id="autre">UN AUTRE GESTE</button>
  </div>
</div>

<script src="/fx.js" defer></script>
<script src="/geste.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script>
/* La salle de répétition.
 *
 * ## Ce qu'elle ne fait pas
 *
 * **Elle ne note rien elle-même.** Le geste est joué par `geste.js` — le même
 * lecteur qu'en duel et au Virage — et sa note vient du serveur, par le même
 * moteur. Une salle qui aurait son propre barème aurait fini par enseigner un
 * geste qui n'existe pas ailleurs, et c'est la pire chose qu'un entraînement
 * puisse faire.
 *
 * **Elle ne calcule aucune durée**, non plus. La configuration vient de
 * `/api/repetition`, comme `you.gestes` vient de l'état en partie. C'est la
 * règle écrite en tête de `geste.js`, et elle a déjà été payée une fois.
 *
 * ## Le meilleur score
 *
 * Dans le navigateur, et nulle part ailleurs. Il ne vaut rien, ne se compare à
 * personne et ne s'écrit sur aucun classement : c'est un repère qu'on se donne
 * à soi-même entre deux essais. Perdu en changeant d'appareil, et ce n'est pas
 * grave — c'est de l'agrément, pas de l'état, la règle que ce dépôt s'impose
 * pour tout ce qui vit côté navigateur. Chaque lecture et chaque écriture est
 * donc sous garde : en navigation privée, la salle marche sans mémoire.
 */
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
    (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  const MEMOIRE = 'tbf.repetition';
  let config = null;      // { gestes, motif, liste }
  let courant = null;     // le geste à l'essai
  let occupe = false;

  /* Les familles, dans l'ordre où on les rencontre. Le regroupement est celui
     des couleurs de `geste.js` : il n'y a pas deux classements des gestes, il y
     en a un, et il est déjà dessiné en partie. */
  const FAMILLES = [
    ['LE RYTHME', ['tempo', 'contretemps', 'echo', 'crescendo']],
    ['LA VITESSE', ['mash', 'salves']],
    ['LA TENUE', ['hold', 'relance', 'tenue', 'retenue']],
    ['LA MÉMOIRE', ['memoire', 'mosaique', 'capo']],
    ['LE TRACÉ', ['tifo', 'echarpe']],
    ['LE COUP D’ŒIL', ['tri', 'compte']],
    ['LA DÉCISION', ['bascule', 'visee', 'jauge']],
    /* Les quatre de l'automne rejoignent les familles qu'elles prolongent
       plutôt qu'une rangée « nouveautés » : dans un mois, elles ne le
       seront plus, et la rangée dirait l'âge des gestes au lieu de ce
       qu'ils demandent. */
    ['LE RYTHME QU’ON VOIT', ['ola', 'deuxvoix']],
    ['LE MIROIR ET LE VENT', ['miroir', 'rouleaux']],
  ];

  const lire = () => {
    try { return JSON.parse(localStorage.getItem(MEMOIRE) || '{}') || {}; }
    catch { return {}; }
  };
  const ecrire = (o) => {
    try { localStorage.setItem(MEMOIRE, JSON.stringify(o)); } catch { /* privé */ }
  };

  /* La consigne porte des `**gras**` — c'est ainsi qu'elle est écrite dans
     `geste.js`, pour les deux écrans de jeu qui la lisent déjà. On échappe
     d'abord, on met en valeur ensuite : l'inverse laisserait passer du HTML
     venu d'une chaîne. */
  const consigne = (g) => esc(window.TBF_GESTE?.aide?.(g) ?? '')
    .replace(/\*\*(.+?)\*\*/g, '<em>$1</em>');

  function vue() {
    const G = window.TBF_GESTE;
    if (!config || !G) return '<div class="tbf-spin"></div>';
    const best = lire();
    const connus = new Set(config.liste);

    return FAMILLES.map(([nom, gestes]) => {
      const siens = gestes.filter((g) => connus.has(g));
      if (!siens.length) return '';
      return `<section class="fam">
        <h2 class="tbf-cousu">${esc(nom)}</h2>
        <div class="liste">${siens.map((g) => `<button class="g pan" data-g="${esc(g)}"
            style="--c:${esc(G.couleur(g))}">
            <b>${esc(G.label(g))}</b>
            <span>${consigne(g)}</span>
            ${best[g] != null
              ? `<span class="best">TON MEILLEUR · ${Number(best[g]).toFixed(2)}</span>`
              : '<span class="best jamais">JAMAIS ESSAYÉ</span>'}
          </button>`).join('')}</div>
      </section>`;
    }).join('');
  }

  function rendre() { $('vue').innerHTML = vue(); }

  /**
   * Un essai, du début à la fin.
   *
   * La configuration est **redemandée à chaque essai**, et non gardée : le
   * motif change avec elle. Sans ça, l'écho, les visages et la mosaïque
   * rejoueraient éternellement la même suite, et la salle n'apprendrait qu'à
   * réciter celle-là.
   */
  async function essayer(g) {
    if (occupe) return;
    occupe = true;
    courant = g;
    const G = window.TBF_GESTE;

    $('salle').style.setProperty('--c', G.couleur(g));
    $('titre').textContent = G.label(g);
    $('consigne').innerHTML = consigne(g);
    $('resultat').innerHTML = '<div class="attend">PRÊT ?</div>';
    $('apres').style.display = 'none';
    $('zone').innerHTML = '';
    $('salle').classList.add('on');
    $('sortir').focus();

    let d = null;
    try {
      d = await fetch('/api/repetition').then((r) => r.json());
    } catch { /* hors ligne */ }
    if (!d?.gestes) {
      $('resultat').innerHTML = '<div class="r">Le serveur n’a pas répondu.<br>'
        + 'Reviens quand la connexion sera revenue.</div>';
      occupe = false;
      return;
    }
    config = { ...config, gestes: d.gestes, motif: d.motif };

    /* **La tribune frappe avec le geste** (le moteur commun, `son.js`) : les
       quatre gestes de rythme ont leur chant, du tambour et des claps calés
       sur la pulsation que `geste.js` dessine. Sur les durées du serveur,
       jamais les nôtres — la règle de cette salle (voir plus haut).

       `debut` vaut un temps : `geste.js` bat sa première pulsation au bout
       d'un intervalle, pas à l'ouverture. Le contretemps compte un temps de
       plus que ses frappes, comme le geste. Pour l'écho, les frappes ne
       jouent que pendant la démonstration : le joueur refait le motif en
       silence, c'est le geste. Le calme ou le son coupé ne changent rien à
       l'écran : la pulsation reste dessinée, le son ne porte jamais seul
       l'information. Sans moteur, `chant` est nul et rien ne joue ; une
       poignée qui n'a rien joué s'arrête sans rien faire.

       `window.TBF_SON` écrit en toutes lettres à chaque appel, sans alias :
       `son:smoke` lit les pages et vérifie que chaque chant appelé existe
       dans la banque — un alias le lui cacherait. */
    const cfg = d.gestes?.[g] ?? {};
    const chant = g === 'tempo'
      ? window.TBF_SON?.chant?.('tempo', { tempo: cfg.interval, temps: cfg.beats, debut: cfg.interval })
      : g === 'contretemps'
        ? window.TBF_SON?.chant?.('contretemps',
          { tempo: cfg.interval, temps: cfg.beats + 1, debut: cfg.interval })
        : (g === 'echo' || g === 'crescendo')
          ? window.TBF_SON?.chant?.('frappes', { instants: cfg.instants })
          : null;

    let rendu;
    try {
      rendu = await G.jouer(g, d.gestes, { zone: $('zone') });
    } catch {
      chant?.arreter();
      occupe = false;
      return;
    }
    // Le geste est fini (ou abandonné) : la tribune se tait avec lui.
    chant?.arreter();
    /* Sorti en cours de geste : la promesse se résout quand même, et noter un
       geste que personne n'a fini afficherait un zéro à quelqu'un qui n'a rien
       raté. */
    if (!$('salle').classList.contains('on') || courant !== g) { occupe = false; return; }

    let note = 0;
    let refuse = null;
    try {
      const r = await fetch('/api/repetition', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ geste: g, motif: d.motif, rendu }),
      }).then((x) => x.json());
      note = Number(r?.note) || 0;
      refuse = r?.refuse ?? null;
    } catch { /* on montre zéro, et on le dit */ }

    montrer(g, note, refuse);
    occupe = false;
  }

  /**
   * Ce que le joueur lit après coup.
   *
   * La note d'abord, le mot ensuite. Un nombre seul n'apprend rien — « 0,62 »
   * ne dit pas s'il faut taper plus tôt ou plus fort — mais c'est lui qui
   * bouge d'un essai à l'autre, et c'est pour le voir bouger qu'on recommence.
   */
  function montrer(g, note, refuse) {
    const best = lire();
    const avant = best[g];
    const record = note > 0 && (avant == null || note > avant + 0.001);
    if (record) { best[g] = note; ecrire(best); }

    const mot = refuse ? 'REFUSÉ'
      : note >= 0.95 ? 'PARFAIT'
      : note >= 0.8 ? 'TRÈS BIEN'
      : note >= 0.6 ? 'ÇA VIENT'
      : note >= 0.3 ? 'À REPRENDRE'
      : 'RATÉ';

    /* Le refus n'est pas une note basse, c'est un geste que le moteur n'a pas
       accepté — trop vite pour une main, trop régulier pour un humain. On le
       dit, parce qu'un joueur qui obtient zéro sans savoir pourquoi croit que
       l'écran est cassé. */
    $('resultat').innerHTML = `<div class="n">${note.toFixed(2)}<small>/1</small></div>
      <div class="q">${mot}</div>
      ${refuse ? '<div class="r">Le moteur n’a pas accepté ce geste : trop rapide, '
        + 'ou trop régulier pour une main. En partie, il ne compterait pas non plus.</div>' : ''}
      ${record ? '<div class="record"><span class="tbf-sticker">★ TON MEILLEUR</span></div>'
        : avant != null ? `<div class="r">Ton meilleur : ${Number(avant).toFixed(2)}</div>` : ''}`;
    $('apres').style.display = 'grid';
    $('encore').focus();

    if (record && note >= 0.6) {
      window.FX?.son?.('parfait');
      const r = $('resultat').getBoundingClientRect();
      window.FX?.particules?.({ x: r.left + r.width / 2, y: r.top + 30, n: 20,
        couleurs: [window.TBF_GESTE.couleur(g), '#F5C33B'], distance: 100 });
    }
  }

  function sortir() {
    // Sortir en plein geste coupe aussi le chant qui battait avec lui.
    window.TBF_SON?.arreterChant?.();
    $('salle').classList.remove('on');
    $('zone').innerHTML = '';
    courant = null;
    occupe = false;
    rendre();
  }

  $('vue').addEventListener('click', (e) => {
    const b = e.target.closest('[data-g]');
    if (b) essayer(b.dataset.g);
  });
  $('sortir').onclick = sortir;
  $('autre').onclick = sortir;
  $('encore').onclick = () => { const g = courant; sortir(); essayer(g); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('salle').classList.contains('on')) sortir();
  });

  (async () => {
    /* **On attend `geste.js`.** Ce bloc-ci est en ligne, donc il s'exécute
       pendant l'analyse du document — avant les scripts `defer`, qui ne partent
       qu'une fois la page lue. En pratique l'appel réseau ci-dessous laisse
       largement le temps aux seconds d'arriver, et c'est précisément le genre
       de « en pratique » qui casse le jour où la réponse vient d'un cache.
       Le lecteur de gestes est la seule chose sans laquelle cette page n'a
       aucun sens : on l'attend pour de bon. */
    if (!window.TBF_GESTE) {
      await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    }

    try {
      config = await fetch('/api/repetition').then((r) => r.json());
    } catch { config = null; }
    if (!config?.liste?.length) {
      $('vue').innerHTML = '<div class="dit">Les gestes n’ont pas pu être chargés.<br>'
        + 'Reviens quand la connexion sera revenue.</div>';
      return;
    }
    rendre();
  })();
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
