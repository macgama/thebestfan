<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Les barres du téléphone : sur Android, Chrome tient lui-même la page hors de la barre d'état et des boutons du bas (ui.css, « Les barres du téléphone »). */if(/Android/i.test(navigator.userAgent)){var tbfVp=document.querySelector('meta[name=viewport]');tbfVp.content=tbfVp.content.replace(/,\s*viewport-fit=cover/,'')}</script>
<title>La répétition — thebestfan</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<script src="/dialogue.js" defer></script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#04060A;color:var(--craie);font-family:var(--ui);display:flex;justify-content:center}
#app{width:100%;max-width:var(--colonne);min-height:100dvh;display:flex;flex-direction:column}

/* ====================================================== le choix des gestes */
.dit{margin:10px 14px 0;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;
  border:1px solid rgba(245,195,59,.3);
  background:linear-gradient(140deg,rgba(245,195,59,.1),rgba(8,11,16,.7))}
/* Le mot qui compte, en craie grasse : en or et en douze pixels et demi, il
   ne tenait pas au soleil (arbitrage du 2 octobre 2026). Le voile et le
   cadre d'or du bandeau, qui ne portent pas de lettres, restent. */
.dit b{color:var(--craie);font-weight:700}

.fam{margin:16px 14px 0}
/* Le nom de la famille est un titre cousu (`.tbf-cousu`, dans ui.css) : la
   page ne garde que sa place. Il était à 45 % — neuf intertitres qu'on
   devinait au lieu de les lire. */
.fam h2{margin:0 0 8px;padding-left:2px}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* Une tuile par geste. La barre de gauche porte la couleur de la famille —
   c'est le seul endroit de l'écran où la couleur veut dire quelque chose, et
   elle dit la même chose qu'en partie.

   La surface est le panneau commun (`.pan`) : même fond, même filet, et
   surtout **même réponse au doigt** que tout ce qui se touche ailleurs. La
   tuile avait sa propre peinture et ne s'enfonçait pas ; on la touchait sans
   rien sentir. La page ne garde que la mise en page. */
.g{position:relative;text-align:left;padding:11px 12px 11px 15px;overflow:hidden}
.g::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.g b{display:block;font-family:var(--banner);font-size:13px;letter-spacing:.07em}
/* **La consigne à onze pixels, et en craie pleine.** C'est elle qu'on lit
   pour choisir, et à dix pixels et demi, à 60 %, elle décrochait au soleil —
   vingt-quatre fois sur la même page. Pleine et non à 88 % : sous le voile
   blanc du plein jour, une craie à 88 % posée sur la tuile tombe à 4,2:1,
   sous les 4,5 d'un texte courant ; pleine, elle tient. La hiérarchie avec le
   nom du geste passe par la taille et le lettrage. */
.g span{display:block;font-size:11px;line-height:1.45;margin-top:3px}
/* Le meilleur score, en craie grasse. Il prenait la couleur du geste, et
   celle des six gestes de rythme est l'or du jeu (#F5C33B, `geste.js`) : de
   l'or en onze pixels, qu'une recherche de couleurs écrites en dur ne voit
   pas, et qui ne tient pas au soleil — l'or ne s'écrit plus qu'en grand
   (arbitrage du 2 octobre 2026). La couleur du geste reste sur la barre de
   la tuile, juste à gauche ; « déjà essayé » se lit à la graisse, et
   « JAMAIS ESSAYÉ », dessous, garde la craie maigre. */
.g .best{display:block;margin-top:6px;font-family:var(--banner);font-size:11px;
  letter-spacing:.12em;color:var(--craie);font-weight:700}
/* **Le plus pâle était celui que tout le monde lit en premier.** « JAMAIS
   ESSAYÉ » portait un `opacity:.35` écrit à la main dans le gabarit : la
   couleur du jeu, fondue au tiers, tombait à 2,2:1 — moitié moins que le
   minimum. Or c'est l'étiquette que porte *chaque* jeu tant qu'on n'y a pas
   touché : un nouveau venu n'a que celle-là sous les yeux, sur toute la page.

   Le gris disait « rien ici » alors qu'il fallait dire « rien encore ».

   La craie plutôt qu'une version pâle de la couleur du jeu : **l'absence de
   couleur est le bon signal.** La couleur, ici, appartient au score ; tant
   qu'il n'y en a pas, elle n'a rien à dire. Et deux nuances d'un même bleu se
   distinguent moins bien, de loin, qu'un bleu et un blanc.

   Et la craie pleine, pas à 55 % : le signal est l'absence de couleur, pas
   l'effacement. Un « rien encore » qu'on ne lit pas redevient un « rien ici ». */
.g .best.jamais{color:var(--craie);font-weight:400}
.g:focus-visible{outline:2px solid var(--projo);outline-offset:2px}

/* ============================================================ la salle */
.salle{position:fixed;inset:0;z-index:120;background:#05070B;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px
  calc(env(safe-area-inset-bottom) + 14px)}
.salle.on{display:flex}
.salle .tete{display:flex;align-items:center;gap:12px;margin-bottom:8px}
/* Le nom du geste, en craie : il prenait la couleur du geste, de l'or pour
   les gestes de rythme, et dix-sept pixels ne sont pas du grand texte — l'or
   ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). La couleur
   passe sur une barre à sa gauche, celle de la tuile qu'on vient de
   toucher ; la note, en quarante-six pixels, la garde. */
.salle .tete b{flex:1;min-width:0;font-family:var(--banner);font-size:17px;letter-spacing:.1em;
  color:var(--craie);padding-left:10px;box-shadow:inset 4px 0 0 var(--c)}
/* La salle se lit en craie pleine : la consigne, le mot du résultat et la
   ligne qui l'explique sont ce qu'on vient chercher entre deux essais, et ils
   étaient entre 45 et 78 %. Pleine plutôt que simplement au-dessus du
   plancher, pour la même raison que la consigne des tuiles : le plein jour. */
.salle .consigne{font-size:12.5px;line-height:1.55;margin:0 0 12px;min-height:38px}
/* Les mots en gras de la consigne se détachent par la graisse, plus par
   l'or : l'or ne s'écrit plus qu'en grand (arbitrage du 2 octobre 2026). */
.salle .consigne em{font-style:normal;font-weight:700;color:var(--craie)}
/* **Sur un petit écran, la consigne cède sa place au verdict.** À 320 × 568,
   les trois portes et la note prennent au pavé une trentaine de pixels de trop
   une fois le geste jugé : il débordait sur son propre chiffre. La consigne a
   servi — on vient de jouer — et RECOMMENCER la remet. Au-dessus de six cents
   pixels de haut, tout tient et elle reste. */
@media (max-height:600px){
  .salle.jugee .consigne{display:none}
}
/* La zone que `geste.js` remplit. Il y pose ses propres formes — on ne lui
   donne qu'une surface et on ne touche à rien de ce qu'il y met.

   **En colonne**, comme la fenêtre des deux arènes. En ligne, une épreuve
   rangeait côte à côte ce que `geste.js` pose l'un sous l'autre : la grille du
   tri, sa consigne et « J'AI TOUT RAMASSÉ » se partageaient la largeur, et la
   grille tombait à la moitié de l'écran. On ne s'entraîne pas sur une grille
   plus petite que celle du match.

   **Et, le geste jugé, elle réduit l'épreuve au lieu de la couper.** Pendant
   le geste, la note ne tient qu'une ligne et les trois portes sont cachées :
   la zone a toute la place, et l'épreuve s'y joue à sa taille. Elle ne coupe
   rien alors — la bouffée d'une frappe déborde du pavé de moitié, et coupée
   au bord de la zone elle dessinait un rectangle de fumée. Une fois le
   verdict tombé, la note et les portes reprennent leur hauteur (cent
   cinquante pixels à 360 × 640), et une grande épreuve n'y tient plus : la
   grille du tri (286 px et sa ligne « RAMASSE LE ■ »), la mosaïque, la ola,
   les deux voix. La zone les **coupait** : la rangée du haut tronquée, la
   ligne qui nomme la couleur à ramasser coupée en deux — c'est elle qui
   donne leur sens aux cartons cerclés de rouge (audit du lot 6,
   `repetition@tri`).

   Le geste fini ne se touche plus : on le regarde. La salle mesure donc
   l'épreuve et la réduit, d'un bloc et autour du centre de la zone, juste
   assez pour qu'elle y tienne entière (`ajuster`, plus bas : `--ajuste`).
   Le tampon, posé au centre, reste au centre. Pendant le geste, rien ne
   change : on ne s'entraîne pas sur une épreuve plus petite.

   **Pas plus petit que `PLANCHER`** (0,6) : le tampon, trente pixels, y en
   garde dix-huit ; plus bas, il passerait sous les seize pixels d'un tampon
   en contour, et le mot se lirait mal. Sur un écran trop bas pour
   l'y faire tenir — un téléphone couché —, l'épreuve garde alors son centre
   et la zone coupe le reste, comme avant. La coupe est un `clip-path` et non
   `overflow:hidden` : celui-ci couperait avant la réduction, au cadre de la
   zone non réduite — la rangée du haut disparaîtrait quand même, en plus
   petit. L'encart de `calc(50% - 50% / k)` ramène la coupe, une fois
   réduite, au cadre exact de la zone. */
#zone{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative}
.salle.jugee #zone{transform:scale(var(--ajuste,1));
  clip-path:inset(calc(50% - 50% / var(--ajuste,1)))}

/* La hauteur d'une note et d'une ligne dessous (« Ton meilleur : … ») : la
   place est gardée dès « PRÊT ? », pour que le pavé ne saute pas quand le
   résultat arrive. Le refus, qui explique en deux lignes, la dépasse — il est
   rare, et il se lit. */
.note{text-align:center;padding:6px 0 2px;min-height:84px}
/* La note et le tampon du record sur une même ligne : le record dit quelque
   chose de **cette** note, et une ligne de plus prendrait au pavé la hauteur
   qu'il lui faut à 360 × 640. */
.note .ligne{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.note .n{font-family:var(--banner);font-size:46px;line-height:1;color:var(--c)}
/* Le « /1 » à la craie : il héritait la couleur du geste, et quinze pixels
   ne sont pas du grand texte — de l'or au tempo, relevé « petit or » par
   l'audit à 320 et 360, et l'ambre du tri tombait à 3,0:1 au soleil. Le
   chiffre, à quarante-six pixels, garde la couleur du geste (arbitrage du
   2 octobre 2026). */
.note .n small{font-size:15px;color:var(--craie)}
.note .q{display:inline-block;padding:4px 0}
.note .r{font-size:11.5px;line-height:1.5;margin-top:7px}
/* « TON MEILLEUR » est un tampon (direction, rituel de sortie) : un record ne
   se discute pas, il se tamponne. Il était un sticker « ★ TON MEILLEUR », et
   avant cela de l'or en onze pixels — l'or ne s'écrit plus qu'en grand
   (arbitrage du 2 octobre 2026). Craie, et non vert : le vert est déjà le
   PARFAIT qui vient de claquer sur le pavé, et deux tampons verts côte à côte
   se liraient comme un seul mot répété. Vingt pixels sur le noir de la salle :
   la forme en contour, celle des grands tampons. */
.note .record{display:inline-block;padding:4px 0}
.apres{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* « LE JOUER EN DUEL » prend toute la largeur, sous les deux autres : c'est
   la sortie vers l'arène, celle que la salle prépare. */
.apres #enDuel{grid-column:1 / -1}
.attend{text-align:center;font-size:12px;letter-spacing:.18em;padding:10px 0}

/* La tuile ne porte plus de transition à elle : celle de `.pan`, et son arrêt
   sous `prefers-reduced-motion` comme sous le mode calme, viennent de ui.css. */
</style>
</head>
<body>
<main id="app">
  <p class="tbf-sous">Essayer sans rien risquer</p>

  <p class="dit">Les vingt gestes du jeu, à l'essai. <b>Rien ne compte ici</b> —
    ni ferveur, ni écharpes, ni classement. Et rien ne t'aide non plus : aucun
    Fanzzy, aucun équipement. C'est ta main, et rien d'autre.</p>

  <div id="vue"><div class="tbf-spin"></div></div>
  <div style="height:22px"></div>
</main>

<!-- La salle, hors de la colonne : un geste se joue plein cadre, comme en
     partie. C'est la même surface et le même lecteur — s'entraîner sur un pavé
     plus petit que celui du duel n'entraînerait à rien. -->
<div class="salle" id="salle" role="dialog" aria-modal="true" aria-label="Un geste à l’essai">
  <div class="tete">
    <button class="tbf-plaque" id="sortir">← RETOUR</button>
    <b id="titre">—</b>
  </div>
  <p class="consigne" id="consigne"></p>
  <div id="zone"></div>
  <div class="note" id="resultat"><div class="attend">PRÊT ?</div></div>
  <div class="apres" id="apres" style="display:none">
    <!-- Les deux portes de la salle restent en béton : recommencer, ou choisir
         un autre geste. Le ton flare des arènes passe à la sortie vers l'arène
         elle-même — c'est là qu'on joue pour de bon, et c'est là que la
         salle mène (direction : « la répétition termine par son tampon et
         LE JOUER EN DUEL »). -->
    <button class="tbf-plaque tbf-bloc" id="encore">RECOMMENCER</button>
    <button class="tbf-plaque tbf-bloc" id="autre">UN AUTRE GESTE</button>
    <a class="tbf-plaque tbf-bloc" data-ton="flare" id="enDuel" href="/duel-nvn">LE JOUER EN DUEL</a>
  </div>
</div>

<script src="/fx.js" defer></script>
<script src="/geste.js" defer></script>
<script src="/menu.js" defer></script>
<script src="/nav.js" defer></script>
<script>
/* La salle de répétition.
 *
 * ## Ce qu'elle ne fait pas
 *
 * **Elle ne note rien elle-même.** Le geste est joué par `geste.js` — le même
 * lecteur qu'en duel et au Virage — et sa note vient du serveur, par le même
 * moteur. Une salle qui aurait son propre barème aurait fini par enseigner un
 * geste qui n'existe pas ailleurs, et c'est la pire chose qu'un entraînement
 * puisse faire.
 *
 * **Elle ne calcule aucune durée**, non plus. La configuration vient de
 * `/api/repetition`, comme `you.gestes` vient de l'état en partie. C'est la
 * règle écrite en tête de `geste.js`, et elle a déjà été payée une fois.
 *
 * **Elle ne nomme rien elle-même, non plus.** Le mot du geste — PARFAIT, BON,
 * MOYEN, RATÉ — est celui de l'arène, servi par le serveur à côté de la note
 * (`verdict`, `CONTRATS.md` § 17) : la décision de Gaël du 3 octobre 2026 (Q3)
 * veut une échelle, quatre mots, partout, pour qu'on s'entraîne ici au PARFAIT
 * qu'on verra en tribune. La salle avait la sienne — PARFAIT à 0,95, TRÈS
 * BIEN, ÇA VIENT, À REPRENDRE —, si bien qu'un 0,92 était PARFAIT au Virage et
 * TRÈS BIEN ici. Elle n'écrit plus aucun seuil : sans mot servi (un serveur
 * d'avant), elle montre la note et rien d'autre. Elle garde **sa note chiffrée
 * et son record** : c'est ce qui la rend utile, un nombre qui bouge d'un essai
 * à l'autre.
 *
 * ## Le meilleur score
 *
 * Dans le navigateur, et nulle part ailleurs. Il ne vaut rien, ne se compare à
 * personne et ne s'écrit sur aucun classement : c'est un repère qu'on se donne
 * à soi-même entre deux essais. Perdu en changeant d'appareil, et ce n'est pas
 * grave — c'est de l'agrément, pas de l'état, la règle que ce dépôt s'impose
 * pour tout ce qui vit côté navigateur. Chaque lecture et chaque écriture est
 * donc sous garde : en navigation privée, la salle marche sans mémoire.
 */
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[<>&"]/g,
    (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  const MEMOIRE = 'tbf.repetition';
  let config = null;      // { gestes, motif, liste }
  let courant = null;     // le geste à l'essai
  let occupe = false;

  /* Les familles, dans l'ordre où on les rencontre. Le regroupement est celui
     des couleurs de `geste.js` : il n'y a pas deux classements des gestes, il y
     en a un, et il est déjà dessiné en partie. */
  const FAMILLES = [
    ['LE RYTHME', ['tempo', 'contretemps', 'echo', 'crescendo']],
    ['LA VITESSE', ['mash', 'salves']],
    ['LA TENUE', ['hold', 'relance', 'tenue', 'retenue']],
    ['LA MÉMOIRE', ['memoire', 'mosaique', 'capo']],
    ['LE TRACÉ', ['tifo', 'echarpe']],
    ['LE COUP D’ŒIL', ['tri', 'compte']],
    ['LA DÉCISION', ['bascule', 'visee', 'jauge']],
    /* Les quatre de l'automne rejoignent les familles qu'elles prolongent
       plutôt qu'une rangée « nouveautés » : dans un mois, elles ne le
       seront plus, et la rangée dirait l'âge des gestes au lieu de ce
       qu'ils demandent. */
    ['LE RYTHME QU’ON VOIT', ['ola', 'deuxvoix']],
    ['LE MIROIR ET LE VENT', ['miroir', 'rouleaux']],
  ];

  const lire = () => {
    try { return JSON.parse(localStorage.getItem(MEMOIRE) || '{}') || {}; }
    catch { return {}; }
  };
  const ecrire = (o) => {
    try { localStorage.setItem(MEMOIRE, JSON.stringify(o)); } catch { /* privé */ }
  };

  /* La consigne porte des `**gras**` — c'est ainsi qu'elle est écrite dans
     `geste.js`, pour les deux écrans de jeu qui la lisent déjà. On échappe
     d'abord, on met en valeur ensuite : l'inverse laisserait passer du HTML
     venu d'une chaîne. */
  const consigne = (g) => esc(window.TBF_GESTE?.aide?.(g) ?? '')
    .replace(/\*\*(.+?)\*\*/g, '<em>$1</em>');

  function vue() {
    const G = window.TBF_GESTE;
    if (!config || !G) return '<div class="tbf-spin"></div>';
    const best = lire();
    const connus = new Set(config.liste);

    return FAMILLES.map(([nom, gestes]) => {
      const siens = gestes.filter((g) => connus.has(g));
      if (!siens.length) return '';
      return `<section class="fam">
        <h2 class="tbf-cousu">${esc(nom)}</h2>
        <div class="liste">${siens.map((g) => `<button class="g pan" data-g="${esc(g)}"
            style="--c:${esc(G.couleur(g))}">
            <b>${esc(G.label(g))}</b>
            <span>${consigne(g)}</span>
            ${best[g] != null
              ? `<span class="best">TON MEILLEUR · ${Number(best[g]).toFixed(2)}</span>`
              : '<span class="best jamais">JAMAIS ESSAYÉ</span>'}
          </button>`).join('')}</div>
      </section>`;
    }).join('');
  }

  function rendre() { $('vue').innerHTML = vue(); }

  /**
   * Un essai, du début à la fin.
   *
   * La configuration est **redemandée à chaque essai**, et non gardée : le
   * motif change avec elle. Sans ça, l'écho, les visages et la mosaïque
   * rejoueraient éternellement la même suite, et la salle n'apprendrait qu'à
   * réciter celle-là.
   */
  async function essayer(g) {
    if (occupe) return;
    occupe = true;
    courant = g;
    const G = window.TBF_GESTE;

    $('salle').style.setProperty('--c', G.couleur(g));
    $('titre').textContent = G.label(g);
    $('consigne').innerHTML = consigne(g);
    $('resultat').innerHTML = '<div class="attend">PRÊT ?</div>';
    $('apres').style.display = 'none';
    $('salle').classList.remove('jugee');
    $('zone').innerHTML = '';
    ajuster();
    $('salle').classList.add('on');
    $('sortir').focus();

    let d = null;
    try {
      d = await fetch('/api/repetition').then((r) => r.json());
    } catch { /* hors ligne */ }
    if (!d?.gestes) {
      $('resultat').innerHTML = '<div class="r">Le serveur n’a pas répondu.<br>'
        + 'Reviens quand la connexion sera revenue.</div>';
      occupe = false;
      return;
    }
    config = { ...config, gestes: d.gestes, motif: d.motif };

    /* **La tribune frappe avec le geste** (le moteur commun, `son.js`) : les
       quatre gestes de rythme ont leur chant, du tambour et des claps calés
       sur la pulsation que `geste.js` dessine. Sur les durées du serveur,
       jamais les nôtres — la règle de cette salle (voir plus haut).

       **Le passage du geste au chant est écrit une fois, dans le moteur**
       (`chantDuGeste`), comme au Virage et au duel : la salle l'écrivait à
       sa façon — un temps d'avance, un temps de plus au contretemps, la
       démonstration de l'écho —, et c'est là qu'une copie diverge. Les
       autres gestes ne chantent pas (la poignée rendue ne joue rien).

       **Le même instant zéro** pour le chant et pour le geste (`origine`) :
       la pulsation dessinée, la frappe entendue et les instants comptés
       partent de la même lecture de l'horloge.

       Le calme ou le son coupé ne changent rien à l'écran : la pulsation
       reste dessinée, le son ne porte jamais seul l'information. Sans
       moteur, `chant` est nul et rien ne joue.

       `window.TBF_SON` écrit en toutes lettres, sans alias : `son:smoke` lit
       les pages et relève les appels au moteur — un alias les lui
       cacherait. */
    const origine = performance.now();
    const chant = window.TBF_SON?.chantDuGeste?.(g, d.gestes, { origine }) ?? null;

    let rendu;
    try {
      rendu = await G.jouer(g, d.gestes, { zone: $('zone'), origine });
    } catch {
      chant?.arreter();
      occupe = false;
      return;
    }
    // Le geste est fini (ou abandonné) : la tribune se tait avec lui.
    chant?.arreter();
    /* Sorti en cours de geste : la promesse se résout quand même, et noter un
       geste que personne n'a fini afficherait un zéro à quelqu'un qui n'a rien
       raté. */
    if (!$('salle').classList.contains('on') || courant !== g) { occupe = false; return; }

    const reponse = fetch('/api/repetition', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ geste: g, motif: d.motif, rendu }),
    }).then((x) => x.json()).catch(() => null);

    /* **Le tampon, comme en partie.** Le même lecteur que les deux arènes :
       le mot servi claque au centre du pavé s'il arrive à temps. La salle ne
       ferme pas sa fenêtre — on reste devant son essai —, donc le tampon
       tardif claque **au même endroit** (`carte` est ici le pavé lui-même)
       et y reste (`duree: 0`). Un geste refusé n'a pas de verdict : le
       contrat n'en sert pas, et on ne lui en prête pas. On n'attend pas la
       lecture du tampon pour écrire la note : elles arrivent ensemble.

       **Ce pavé-ci, et pas le suivant** : un joueur sorti pendant
       l'aller-retour a pu lancer un autre geste, et le tampon tardif de
       l'essai d'avant n'a rien à faire sur son nouveau pavé. */
    const paveJoue = $('pad');
    G.attendre(reponse.then((r) => (r && !r.refuse ? r : null)),
      { zone: $('zone'), carte: () => (paveJoue?.isConnected ? paveJoue : null), duree: 0 });

    const r = await reponse;
    // Sorti pendant l'aller-retour : rien à écrire, et surtout pas un record.
    if (!$('salle').classList.contains('on') || courant !== g) { occupe = false; return; }
    /* Pas de réponse lisible : on le dit, au lieu d'afficher un zéro qu'on
       prendrait pour sa note. Les trois portes restent ouvertes. */
    if (!r || typeof r !== 'object') {
      $('resultat').innerHTML = '<div class="r">Le serveur n’a pas noté cet essai.<br>'
        + 'Recommence quand la connexion sera revenue.</div>';
      $('apres').style.display = 'grid';
      $('salle').classList.add('jugee');
      ajuster();
      $('encore').focus();
      occupe = false;
      return;
    }
    const note = Number(r.note) || 0;
    const refuse = r.refuse ?? null;
    // Le mot servi, s'il est l'un des quatre ; sinon aucun (jamais un seuil d'ici).
    const verdict = !refuse && window.TBF_GESTE.mot(r.verdict) ? r.verdict : null;
    montrer(g, note, refuse, verdict);
    occupe = false;
  }

  /**
   * Ce que le joueur lit après coup.
   *
   * Le mot est sur le pavé, en tampon, là où il le verra en partie ; ici, la
   * note et le record. Un nombre seul n'apprend rien — « 0,62 » ne dit pas
   * s'il faut taper plus tôt ou plus fort — mais c'est lui qui bouge d'un
   * essai à l'autre, et c'est pour le voir bouger qu'on recommence.
   *
   * `verdict` est le mot servi, déjà vérifié, ou `null` : il ne sert ici qu'à
   * la fête d'un record PARFAIT. Elle partait à « 0,6 » — un seuil de plus
   * écrit dans la page, que l'échelle unique retire avec les autres.
   */
  function montrer(g, note, refuse, verdict) {
    const best = lire();
    const avant = best[g];
    const record = note > 0 && (avant == null || note > avant + 0.001);
    if (record) { best[g] = note; ecrire(best); }

    /* Le refus n'est pas une note basse, c'est un geste que le moteur n'a pas
       accepté — trop vite pour une main, trop régulier pour un humain. Il n'a
       pas de verdict (le serveur n'en sert pas), mais il a son tampon gris, et
       on dit pourquoi : un joueur qui obtient zéro sans savoir pourquoi croit
       que l'écran est cassé.

       Le record claque un temps après le verdict du pavé (`--d`) : deux
       tampons qui tombent ensemble se lisent comme un seul bruit. Il ne fait
       pas de son à lui — le clac du verdict suffit.

       Les deux tampons se posent **à côté** de la note et non dessous : à
       360 × 640, une ligne de plus sous la note prenait au pavé sa hauteur,
       et il débordait sur le chiffre qu'on venait chercher. */
    $('resultat').innerHTML = `<div class="ligne">
        <div class="n">${note.toFixed(2)}<small>/1</small></div>
        ${record ? '<span class="record"><span class="tbf-tampon tbf-clac" data-ton="craie"'
          + ' style="--d:320ms;--rot:6deg">TON MEILLEUR</span></span>' : ''}
        ${refuse ? '<span class="q"><span class="tbf-tampon tbf-clac" data-ton="gris"'
          + ' style="--rot:6deg">REFUSÉ</span></span>' : ''}</div>
      ${refuse ? '<div class="r">Le moteur n’a pas accepté ce geste : trop rapide, '
        + 'ou trop régulier pour une main. En partie, il ne compterait pas non plus.</div>' : ''}
      ${!record && avant != null ? `<div class="r">Ton meilleur : ${Number(avant).toFixed(2)}</div>` : ''}`;
    $('apres').style.display = 'grid';
    $('salle').classList.add('jugee');
    // Dans la même tâche que les portes qui paraissent : aucune image ne
    // montre l'épreuve coupée avant d'être réduite.
    ajuster();
    $('encore').focus();

    /* La fête d'un record **PARFAIT**, au mot servi : on s'entraîne pour le
       PARFAIT qu'on verra en tribune, et c'est lui qu'on fête. */
    if (record && verdict === 'parfait') {
      window.FX?.son?.('parfait');
      const r = $('resultat').getBoundingClientRect();
      window.FX?.particules?.({ x: r.left + r.width / 2, y: r.top + 30, n: 20,
        couleurs: [window.TBF_GESTE.couleur(g), '#F5C33B'], distance: 100 });
    }
  }

  /**
   * L'épreuve jugée tient dans sa zone, entière (voir la feuille, `#zone`).
   *
   * L'étendue de l'épreuve est celle de ce que `geste.js` a posé dans la
   * zone — le pavé ou la grille, la ligne qui le suit —, du haut de la
   * première boîte au bas de la dernière, lue **en mise en page**
   * (`offsetTop`, `offsetHeight`) : la réduction déjà posée ne la change pas,
   * et la mesure ne court pas après son propre résultat. Les boîtes et non
   * leurs marges : la grille est centrée par des marges automatiques, qui
   * débordaient la zone d'un quart de pixel et faisaient réduire une
   * épreuve qui tenait. Les calques posés en absolu (un tampon sans pavé) ne
   * comptent pas : ils suivent leur hôte. Une épreuve qui remplit sa zone
   * exactement (la bascule, la visée, le compte) n'est pas touchée : on ne
   * réduit qu'au-delà d'un pixel, ce que les mesures arrondies peuvent
   * ajouter à une épreuve qui tient.
   *
   * Hors de l'état jugé, aucune réduction : `--ajuste` est retiré, et la
   * feuille ne la lit de toute façon que sur `.salle.jugee`.
   */
  const PLANCHER = 0.6;
  function ajuster() {
    const zone = $('zone');
    if (!zone) return;
    let k = 1;
    if ($('salle').classList.contains('jugee')) {
      let haut = Infinity; let bas = -Infinity; let gauche = Infinity; let droite = -Infinity;
      for (const e of zone.children) {
        const s = getComputedStyle(e);
        if (s.display === 'none' || s.position === 'absolute' || s.position === 'fixed') continue;
        haut = Math.min(haut, e.offsetTop);
        bas = Math.max(bas, e.offsetTop + e.offsetHeight);
        gauche = Math.min(gauche, e.offsetLeft);
        droite = Math.max(droite, e.offsetLeft + e.offsetWidth);
      }
      const h = bas - haut;
      const l = droite - gauche;
      if (h > 0 && l > 0 && (h > zone.clientHeight + 1 || l > zone.clientWidth + 1)) {
        k = Math.max(PLANCHER, Math.min(1, zone.clientHeight / h, zone.clientWidth / l));
      }
    }
    if (k < 1) zone.style.setProperty('--ajuste', k.toFixed(4));
    else zone.style.removeProperty('--ajuste');
  }

  function sortir() {
    // Sortir en plein geste coupe aussi le chant qui battait avec lui.
    window.TBF_SON?.arreterChant?.();
    $('salle').classList.remove('on');
    $('zone').innerHTML = '';
    ajuster();
    courant = null;
    occupe = false;
    rendre();
  }

  $('vue').addEventListener('click', (e) => {
    const b = e.target.closest('[data-g]');
    if (b) essayer(b.dataset.g);
  });
  $('sortir').onclick = sortir;
  $('autre').onclick = sortir;
  $('encore').onclick = () => { const g = courant; sortir(); essayer(g); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('salle').classList.contains('on')) sortir();
  });
  /* Le téléphone qu'on tourne, la fenêtre qu'on redimensionne, un refus qui
     prend deux lignes de plus sous la note : la zone change de taille sans
     que l'épreuve change, et la réduction se refait. La réduction elle-même
     ne change pas la taille de la zone (une transformation ne touche pas la
     mise en page) : l'observateur ne se relance pas sur son propre effet. */
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => ajuster()).observe($('zone'));

  (async () => {
    /* **On attend `geste.js`.** Ce bloc-ci est en ligne, donc il s'exécute
       pendant l'analyse du document — avant les scripts `defer`, qui ne partent
       qu'une fois la page lue. En pratique l'appel réseau ci-dessous laisse
       largement le temps aux seconds d'arriver, et c'est précisément le genre
       de « en pratique » qui casse le jour où la réponse vient d'un cache.
       Le lecteur de gestes est la seule chose sans laquelle cette page n'a
       aucun sens : on l'attend pour de bon. */
    if (!window.TBF_GESTE) {
      await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    }

    try {
      config = await fetch('/api/repetition').then((r) => r.json());
    } catch { config = null; }
    if (!config?.liste?.length) {
      $('vue').innerHTML = '<div class="dit">Les gestes n’ont pas pu être chargés.<br>'
        + 'Reviens quand la connexion sera revenue.</div>';
      return;
    }
    rendre();
  })();
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
